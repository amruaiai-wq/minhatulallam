มัสยิด ให้ดูรองเท้า ถ้าเห็นสิ่งสกปรกก็ให้เช็ดออก แล้วละหมาดในรองเท้านั้น\" และท่านนบี ﷺ กล่าวถึงชายผ้าของสตรีว่า \"สิ่งที่ตามมาทีหลังจะชำระมัน\" (อบูดาวูด อัลอัลบานีย์ว่าศ่อฮีห์)", "หะดีษในบทนี้ไม่ได้บ่งว่าต้องใช้น้ำเท่านั้น ศาสนาระบุน้ำเพราะสะดวกและหาง่ายที่สุดสำหรับผู้คน การสั่งให้ใช้น้ำกับนะญิสบางอย่างไม่ได้หมายความว่าต้องใช้น้ำกับทุกกรณี", "เมื่อการขจัดนะญิสเป็นเรื่องที่เข้าใจเหตุผลได้ ไม่ใช่การปฏิบัติตามโดยไม่มีเหตุผล (ตะอับบุด) สิ่งใดที่ขจัดได้ก็ถือว่าใช้ได้ บางครั้งสิ่งอื่นยังขจัดได้ดีกว่าน้ำ โดยเฉพาะในปัจจุบันที่มีน้ำยาฆ่าเชื้อและสารทำความสะอาดที่ไม่เหลือสี รส หรือกลิ่นของนะญิสเลย"]}], "tags_th": ["เลือดประจำเดือน", "เลือด", "นะญิส", "เสื้อผ้า", "การล้าง"]}, {"id": "v1-h031", "volume": 1, "bab": "najasah", "topic_ar": "العفو عن أثر لون دم الحيض", "topic_th": "อนุโลมรอยสีของเลือดประจำเดือน", "pages": [133, 135], "hadith": [{"no": 31, "matn_ar": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَتْ خَوْلَةُ: يَا رَسُولَ اللهِ، فَإِنْ لَمْ يَذْهَبِ الدَّمُ؟ قَالَ: «يَكْفِيكِ الْمَاءُ، وَلَا يَضُرُّكِ أَثَرُهُ». أَخْرَجَهُ التِّرْمِذِيُّ، وَسَنَدُهُ ضَعِيفٌ.", "translation_th": "จากอบูฮุร็อยเราะฮ์ (ร.ฎ.) กล่าวว่า เคาละฮ์ถามว่า โอ้ท่านรสูลุลลอฮ์ ถ้าเลือดยังไม่หมดไปล่ะ ท่านตอบว่า \"น้ำก็เพียงพอสำหรับเธอแล้ว และรอยของมันไม่เป็นอันตรายแก่เธอ\" บันทึกโดยอัตติรมิซีย์ และสายรายงานอ่อน", "grade_th": "ฎออีฟ (อ่อน) เพราะอิบนุละฮีอะฮ์ แต่สายของอับดุลลอฮ์ บินวะฮ์บ อาจทำให้แข็งแรงขึ้น"}], "key_rulings_th": ["รอยสีของเลือดประจำเดือนที่ยังเหลืออยู่หลังจากล้างอย่างเต็มที่แล้วได้รับการอนุโลม เพราะสิ่งสกปรกคือตัวนะญิสซึ่งหมดไปแล้ว สีอย่างเดียวไม่ใช่สิ่งสกปรก", "ต้องพยายามขจัดสีให้เต็มที่ก่อน เพราะเลือดเป็นสิ่งน่ารังเกียจ และคนที่เห็นอาจคิดว่าเจ้าของเสื้อละเลยการล้าง", "ควรใช้สารช่วยขจัด เช่น ใบพุทรา (ซิดร์) ล้างเลือดประจำเดือน ตามหะดีษอุมมุก็อยส์", "การอนุโลมนะญิสในศาสนามีหลักเกณฑ์ เช่น เพราะเกิดบ่อย หลีกเลี่ยงยาก ขจัดยาก หรือมีปริมาณน้อย"], "vocab": [{"ar": "خَوْلَة", "th": "เคาละฮ์ บินติยะสาร ตามรายงานของอบูดาวูดและคนอื่น"}, {"ar": "لَا يَضُرُّكِ أَثَرُهُ", "th": "สีของเลือดที่เหลืออยู่หลังล้างไม่เป็นอันตรายแก่เธอ"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อบูดาวูดบันทึกด้วยความหมายเดียวกันในหมวดฏอฮาเราะฮ์ บทสตรีซักเสื้อที่สวมขณะมีประจำเดือน (365) ผ่านกุตัยบะฮ์ บินสะอีด จากอิบนุละฮีอะฮ์ จากยะซีด บินอบีหะบีบ จากอีซา บินฏ็อลหะฮ์ จากอบูฮุร็อยเราะฮ์ หะดีษนี้อยู่ในสุนันฉบับที่อิบนุลอะอ์รอบีย์รายงานจากอบูดาวูด ไม่มีในฉบับของอัลลุอ์ลุอีย์ อัลมุนซิรีย์จึงไม่ได้ระบุไว้ในหนังสือย่อของเขา", "อะห์มัดบันทึกด้วยสายเดียวกัน และอัลบัยฮะกีย์บันทึกผ่านสายอับดุลลอฮ์ บินวะฮ์บ และอุษมาน บินศอลิห์ ทั้งสองจากอิบนุละฮีอะฮ์", "อิบนุหะญัรว่าอ่อน ดูเหมือนเพราะอิบนุละฮีอะฮ์ ซึ่งนักวิชาการหลายท่านวิจารณ์ เช่น อบูหาติม ยะห์ยา บินสะอีด อิบนุมะฮ์ดีย์ และวะกีอ์ อิบนุมะอีนว่า \"อ่อน ใช้เป็นหลักฐานไม่ได้\" อันนะสาอีย์ว่า \"ไม่น่าเชื่อถือ\" ความจำของเขาแย่ลงหลังจากหนังสือของเขาถูกไฟไหม้ แต่ถ้าผู้รายงานจากเขาเป็นหนึ่งในอับดุลลอฮ์ทั้งสาม (อิบนุวะฮ์บ อิบนุลมุบาร็อก และอัลมุกรีอ์) ก็ดีกว่าผู้อื่น ตามทัศนะของนักหะดีษกลุ่มหนึ่ง", "หะดีษนี้มาจากกุตัยบะฮ์ ซึ่งไม่ได้เขียนหะดีษของอิบนุละฮีอะฮ์ นอกจากจากหนังสือของอับดุลลอฮ์ บินวะฮ์บ แล้วค่อยฟังจากอิบนุละฮีอะฮ์ และอิบนุวะฮ์บฟังจากอิบนุละฮีอะฮ์ก่อนหนังสือถูกไฟไหม้ อีกทั้งมีสายของอิบนุวะฮ์บเองในรายงานของอัลบัยฮะกีย์ จึงอาจทำให้หะดีษแข็งแรงขึ้นตามทัศนะของผู้ที่รับรายงานของนักเรียนรุ่นแรกจากเขา แต่สำหรับผู้ที่ถือว่าเขาอ่อนโดยสิ้นเชิง รายงานของอับดุลลอฮ์ทั้งสามแม้จะดีกว่า ก็ยังไม่แข็งแรงพอจะใช้เป็นหลักฐาน อิบนุหิบบานสรุปว่า ต้องเลี่ยงรายงานของนักเรียนรุ่นแรก เพราะเขาตัดลีส (ปิดบังผู้รายงานที่อ่อนแอ) และต้องเลี่ยงรายงานของนักเรียนรุ่นหลัง เพราะปนสิ่งที่ไม่ใช่หะดีษของเขา", "ผู้แต่งเห็นว่า การพาดพิงหะดีษนี้ไปถึงอัตติรมิซีย์เป็นความพลาดของอิบนุหะญัร อัลมิซซีย์จึงระบุแค่อบูดาวูด ไม่ได้ระบุอัตติรมิซีย์ อิบนุลมุลักกินก็เช่นกัน และอิบนุหะญัรเองในฟัตหุลบารีย์และอัตตัลคีศก็ระบุแค่อบูดาวูด"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"เคาละฮ์\" คือเคาละฮ์ บินติยะสาร ตามรายงานของอบูดาวูดและคนอื่น อัฏเฏาะบะรอนีย์บันทึกหะดีษนี้และระบุว่าเป็นเคาละฮ์ บินติหะกีม อัลอันศอรียะฮ์ แต่สายนั้นอ่อน เพราะมาจากอัลวาซิอ์ บินนาฟิอ์ ผู้มีหะดีษมุงกัรและถูกทิ้ง", "\"รอยของมันไม่เป็นอันตรายแก่เธอ\" คือสีของเลือดที่เหลืออยู่หลังล้าง"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "อนุโลมรอยสีหลังจากล้างเต็มที่", "points_th": ["หะดีษเป็นหลักฐานว่า รอยสีของเลือดประจำเดือนที่เหลือหลังจากล้างอย่างเต็มที่แล้วได้รับการอนุโลม เพราะคำว่า \"รอยของมันไม่เป็นอันตรายแก่เธอ\" และอายะฮ์ \"ดังนั้นจงยำเกรงอัลลอฮ์ตามความสามารถของพวกเจ้า\" (อัตตะฆอบุน: 16) เพราะการล้างบางครั้งไม่ทำให้สีหมดไป และสีอย่างเดียวไม่ใช่สิ่งสกปรก สิ่งสกปรกคือตัวนะญิส ซึ่งหมดไปแล้ว สีที่เหลือจึงไม่มีผล", "แต่ต้องพยายามขจัดสีให้เต็มที่ นี่คือจุดประสงค์ที่อิบนุหะญัรนำหะดีษอบูฮุร็อยเราะฮ์มาต่อจากหะดีษอัสมาอ์ เพราะเลือดเป็นสิ่งน่ารังเกียจ และคนที่เห็นเลือดบนเสื้ออาจคิดว่าเจ้าของละเลยการล้าง"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "ใช้สารช่วยขจัดเลือดประจำเดือน", "points_th": ["ตามรูปคำของหะดีษ น้ำก็เพียงพอในการขจัดเลือดประจำเดือน ไม่ต้องใช้สารชะล้างอื่น เช่น หินหรือไม้ เพราะคำว่า \"น้ำก็เพียงพอสำหรับเธอ\"", "แต่ในหะดีษอุมมุก็อยส์ บินติมิห์ศ็อน ซึ่งถามท่านรสูลุลลอฮ์ ﷺ ถึงเลือดประจำเดือนที่เปื้อนเสื้อ ท่านตอบว่า \"จงขูดมัน... และล้างด้วยน้ำและใบพุทรา (ซิดร์)\" (อบูดาวูด อันนะสาอีย์ อิบนุมาญะฮ์ อิบนุลก็อฏฏอนว่าสายรายงานศ่อฮีห์อย่างยิ่ง) ใบพุทราเป็นสารช่วยขจัดชนิดหนึ่ง", "หะดีษอุมมุก็อยส์จึงจำกัดความหมายกว้างของหะดีษนี้ โดยกำหนดให้ใช้สารช่วยขจัดกับเลือดประจำเดือนโดยเฉพาะ และคำว่า \"รอยของมันไม่เป็นอันตรายแก่เธอ\" หมายถึงรอยที่เหลือหลังจากใช้สารช่วยขจัดแล้ว"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "หลักเกณฑ์การอนุโลมนะญิส", "points_th": ["การอนุโลมในเรื่องนะญิสแสดงว่าศาสนามุ่งผ่อนปรนแก่ผู้รับภาระและขจัดความยุ่งยาก ด้วยเหตุต่าง ๆ เช่น (1) เพราะเกิดบ่อย เช่น เลือดและหนองจากสิวและฝี หรือรอยที่เหลือจากการชำระด้วยหิน (อิสติจมาร) ที่ครบเงื่อนไข (2) เพราะหลีกเลี่ยงยาก เช่น ผู้มีฮะดัษต่อเนื่อง อย่างผู้มีปัสสาวะเล็ด หญิงที่มีเลือดเสีย (อิสติหาเฎาะฮ์) และผู้เป็นริดสีดวงหรือแผลชอนทวาร (3) เพราะขจัดยาก เช่น สีและกลิ่นของนะญิสที่เหลือหลังชำระ เมื่อขจัดยาก (4) เพราะปริมาณน้อย เช่น นะญิสเล็กน้อยที่แมลงวันพามาติดเสื้อหรือตัว หรือปัสสาวะเท่าปลายเข็มบนเสื้อ บางกรณีอาจมีเหตุผลหลายข้อซ้อนกัน", "หลักเกณฑ์เหล่านี้กำหนดว่านะญิสใดได้รับการอนุโลม หน้าที่ของผู้ศึกษาคือพิจารณาว่ากรณีที่อยู่ตรงหน้าเข้าข่ายหลักเกณฑ์ข้อใดหรือไม่"]}], "tags_th": ["เลือดประจำเดือน", "การอนุโลม", "นะญิส", "ใบพุทรา", "อิบนุละฮีอะฮ์"]}, {"id": "v1-h032", "volume": 1, "bab": "wudu", "topic_ar": "حكم السواك عند الوضوء", "topic_th": "หุก่มการแปรงฟันด้วยสิวากเมื่ออาบน้ำละหมาด", "pages": [138, 143], "hadith": [{"no": 32, "matn_ar": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ، عَنْ رَسُولِ اللهِ ﷺ قَالَ: «لَوْلَا أَنْ أَشُقَّ عَلَى أُمَّتِي لَأَمَرْتُهُمْ بِالسِّوَاكِ مَعَ كُلِّ وُضُوءٍ». أَخْرَجَهُ مَالِكٌ، وَأَحْمَدُ، وَالنَّسَائِيُّ، وَصَحَّحَهُ ابْنُ خُزَيْمَةَ، وَذَكَرَهُ الْبُخَارِيُّ تَعْلِيقًا.", "translation_th": "จากอบูฮุร็อยเราะฮ์ (ร.ฎ.) จากท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"หากไม่เป็นการลำบากแก่ประชาชาติของฉัน ฉันจะสั่งให้พวกเขาแปรงฟันด้วยสิวากทุกครั้งที่อาบน้ำละหมาด\" บันทึกโดยมาลิก อะห์มัด และอันนะสาอีย์ อิบนุคุซัยมะฮ์ระบุว่าศ่อฮีห์ และอัลบุคอรีย์ยกไว้แบบไม่มีสายรายงาน (ตะอ์ลีก)", "grade_th": "ศ่อฮีห์ (สายรายงานตามเงื่อนไขของอัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["การแปรงฟันด้วยสิวากเป็นสุนัต ไม่ใช่วาญิบ ตามทัศนะของนักวิชาการส่วนใหญ่ บางท่านอ้างว่าเป็นอิจญ์มาอ์", "ส่งเสริมให้แปรงฟันทุกครั้งที่อาบน้ำละหมาด และทุกครั้งที่ละหมาด ทั้งฟัรฎูและสุนัต แม้ผู้ถือศีลอดหลังตะวันคล้อย", "ผู้แต่งเห็นว่าตามแนวทางของท่านนบี ﷺ ที่ชัดกว่าคือ แปรงฟันก่อนเริ่มอาบน้ำละหมาด เพราะไม่มีรายงานว่าท่านแปรงฟันระหว่างบ้วนปาก", "คำสั่งที่ไม่มีเงื่อนไขในศาสนาโดยหลักแล้วหมายถึงวาญิบ"], "vocab": [{"ar": "لَوْلَا", "th": "หากไม่มี... (คำที่บอกว่าสิ่งหนึ่งไม่เกิดเพราะมีอีกสิ่งหนึ่ง) ในที่นี้ ท่านนบี ﷺ ไม่ได้บังคับเพราะจะเป็นการลำบาก"}, {"ar": "أُمَّتِي", "th": "ประชาชาติของฉัน หมายถึงผู้ที่ศรัทธาและปฏิบัติตาม (อุมมะตุลอิญาบะฮ์) ไม่ใช่ทุกคนที่อยู่หลังการเป็นนบี (อุมมะตุดดะอ์วะฮ์)"}, {"ar": "لَأَمَرْتُهُمْ", "th": "ฉันจะบังคับพวกเขา คำสั่งในที่นี้คือการบังคับ เพราะความลำบากเกิดจากการบังคับเท่านั้น"}, {"ar": "السِّوَاك", "th": "อ่านสระอิ ไม้ที่ใช้แปรงฟัน เช่น จากต้นอะรอก หรือหมายถึงการแปรงฟัน คือขัดปากด้วยไม้เพื่อทำความสะอาดฟัน ลิ้น และเหงือก มาจาก السَّوْك คือการขัดถู"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["มาลิกบันทึกในอัลมุวัฏเฏาะอ์ แบบเมากูฟ (เป็นคำของอบูฮุร็อยเราะฮ์) ผ่านอิบนุชิฮาบ จากหุมัยด์ บินอับดิรเราะห์มาน ว่า \"หากไม่เป็นการลำบากแก่ประชาชาติของเขา เขาจะสั่งให้พวกเขาแปรงฟันทุกครั้งที่อาบน้ำละหมาด\" อิบนุอับดิลบัรร์ว่า หะดีษนี้ถือเป็นมัรฟูอ์ (มาถึงท่านนบี ﷺ) เพราะมีสายต่อเนื่องจากทางอื่น และถ้อยคำ \"เขาจะสั่ง\" ก็บ่งเช่นนั้น", "อะห์มัด อันนะสาอีย์ในอัสสุนันอัลกุบรอ และอิบนุคุซัยมะฮ์บันทึกแบบมัรฟูอ์ ผ่านสายมาลิก จากอิบนุชิฮาบ จากหุมัยด์ จากอบูฮุร็อยเราะฮ์ ดังในบุลูฆ สายรายงานศ่อฮีห์ตามเงื่อนไขของอัลบุคอรีย์และมุสลิม และอัลบุคอรีย์ยกไว้แบบไม่มีสายด้วยถ้อยคำที่ยืนยัน ในหมวดการถือศีลอด สำนวน \"ทุกครั้งที่อาบน้ำละหมาด\" (อินดะ)", "มาลิก อัลบุคอรีย์ (887) และอันนะสาอีย์บันทึกผ่านอบุซซินาด จากอัลอะอ์รอจญ์ จากอบูฮุร็อยเราะฮ์แบบมัรฟูอ์ สำนวน \"ทุกครั้งที่ละหมาด\" และมุสลิม (252) ผ่านอิบนุอุยัยนะฮ์ จากอบุซซินาด ใกล้เคียงกัน หะดีษนี้มีหลายสายในเศาะฮีห์ มุสนัด และสุนัน", "อัตติรมิซีย์ระบุว่าหะดีษเรื่องสิวากรายงานโดยเศาะหาบะฮ์ราวสิบเจ็ดคน เช่น อบูบักร์ อะลี อิบนุอับบาส อิบนุอุมัร อาอิชะฮ์ และหุซัยฟะฮ์ นักวิชาการระบุว่าหะดีษเรื่องการแปรงฟันและการส่งเสริมให้ทำถึงขั้นมุตะวาติร อัลกัตตานีย์นับเศาะหาบะฮ์ที่รายงานได้สามสิบเอ็ดคน"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"หากไม่\" (เลาลา) บ่งว่าสิ่งหนึ่งไม่เกิดเพราะมีอีกสิ่งหนึ่ง ในหะดีษนี้ ท่านนบี ﷺ ไม่ได้บังคับประชาชาติให้แปรงฟันทุกครั้งที่อาบน้ำละหมาด เพราะจะเป็นการลำบากแก่พวกเขา", "\"ประชาชาติของฉัน\" หมายถึงผู้ที่ศรัทธาและปฏิบัติตาม เพราะพวกเขาคือผู้ที่ทำตามคำสั่งและละเว้นข้อห้าม ไม่ใช่ทุกคนที่มีชีวิตอยู่หลังการเป็นนบีของท่าน", "\"ฉันจะสั่งพวกเขา\" หมายถึงบังคับ เพราะความลำบากเกิดขึ้นเฉพาะกับคำสั่งที่บังคับ ส่วนคำสั่งที่ไม่บังคับ (สุนัต) ไม่มีความลำบาก เพราะละได้ ในรายงานของอันนะสาอีย์ว่า \"ฉันจะกำหนดให้การแปรงฟันเป็นฟัรฎูแก่พวกเขาทุกครั้งที่อาบน้ำละหมาด\"", "\"สิวาก\" อ่านสระอิ คือชื่อไม้ที่ใช้แปรงฟัน จากต้นอะรอกหรืออื่น ๆ หรือหมายถึงการกระทำ คือขัดปากด้วยไม้เพื่อทำความสะอาดฟัน ลิ้น และเหงือก ในหะดีษนี้หมายถึงการกระทำ การแปรงฟันมีประโยชน์มากมาย ซึ่งอิบนุลมุลักกินรวบรวมไว้", "\"ทุกครั้งที่อาบน้ำละหมาด\" ในอีกรายงานว่า \"เมื่ออาบน้ำละหมาดทุกครั้ง\" ความหมายเดียวกัน คือในเวลาที่อาบน้ำละหมาด อาจหมายถึงก่อนเริ่มอาบ แล้วจึงอาบต่อทันที หรือระหว่างอาบ คือตอนบ้วนปาก"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "สิวากเป็นสุนัต ไม่ใช่วาญิบ", "points_th": ["หะดีษเป็นหลักฐานว่าคำสั่งให้แปรงฟันเป็นสุนัต ไม่ใช่วาญิบ เพราะคำว่า \"หากไม่\" บ่งว่าความเป็นวาญิบถูกกันไว้เพราะมีความลำบาก ถ้าเป็นวาญิบ ท่านคงสั่งไม่ว่าจะลำบากหรือไม่", "นี่คือทัศนะของนักวิชาการส่วนใหญ่ บางท่านอ้างว่าเป็นอิจญ์มาอ์ มีรายงานว่าดาวูด อัซซอฮิรีย์และอิสหาก บินรอฮะวัยฮ์เห็นว่าเป็นวาญิบเพราะมีคำสั่ง แต่อันนะวะวีย์กล่าวว่า รายงานจากอิสหากไม่เป็นที่รู้จักและไม่ถูกต้อง การพาดพิงถึงดาวูดก็เช่นกัน และอิบนุหัซม์ อัซซอฮิรีย์ก็ระบุว่าการแปรงฟันเป็นสุนัต"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "แปรงฟันก่อนหรือระหว่างอาบน้ำละหมาด", "points_th": ["หะดีษเป็นหลักฐานว่าส่งเสริมให้แปรงฟันเมื่ออาบน้ำละหมาด นี่คือจุดประสงค์ที่อิบนุหะญัรเปิดบทวุฎูอ์ด้วยหะดีษนี้ และเลือกสำนวน \"ทุกครั้งที่อาบน้ำละหมาด\" ทั้งที่สำนวน \"ทุกครั้งที่ละหมาด\" อยู่ในเศาะฮีหัยน์ อัตติรมิซีย์ก็ทำเช่นนี้ และนักนิติศาสตร์หลายท่านนับการแปรงฟันเป็นหนึ่งในสุนัตของการอาบน้ำละหมาด", "หะดีษไม่ได้ระบุว่าแปรงฟันตอนไหนของการอาบน้ำละหมาด นักวิชาการจึงมีสองทัศนะ (1) ก่อนเริ่มอาบ แปรงฟันแล้วอาบน้ำละหมาด เป็นทัศนะของนักวิชาการบางส่วนจากหะนะฟีย์ มาลิกีย์ และชาฟิอีย์ โดยยึดสำนวน \"เมื่ออาบน้ำละหมาดทุกครั้ง\" (2) ระหว่างอาบ ตอนบ้วนปาก เป็นทัศนะของนักวิชาการส่วนใหญ่ โดยยึดสำนวน \"พร้อมกับ (มะอะ) การอาบน้ำละหมาดทุกครั้ง\" เพราะคำว่า \"พร้อมกับ\" บ่งถึงการอยู่ด้วยกัน", "ผู้แต่งเห็นว่าทั้งสองทัศนะมีเหตุผล แต่จากการศึกษาแนวทางของท่านนบี ﷺ ทัศนะที่ชัดกว่าคือ แปรงฟันก่อนอาบน้ำละหมาด เพราะไม่มีรายงานว่าท่านแปรงฟันระหว่างบ้วนปาก และในหะดีษอิบนุอับบาส (มุสลิม) ที่ค้างคืนบ้านมัยมูนะฮ์และเล่าถึงการละหมาดกลางคืนของท่านนบี ﷺ มีว่า \"ท่านตื่นขึ้น แปรงฟัน แล้วอาบน้ำละหมาด\""]}, {"wajh": 5, "type": "fawaid", "heading_ar": null, "heading_th": "วิทยปัญญาของการแปรงฟันก่อนบ้วนปาก", "points_th": ["ผู้แต่งอ้างถึงดร.อับดุลลอฮ์ อัสสะอีด ว่า วิทยปัญญาของคำสั่งให้แปรงฟันทุกครั้งที่อาบน้ำละหมาด คือ ไม้สิวากไม่ได้ขจัดเศษอาหาร คราบเมือกน้ำลาย หรือหินปูนออกไปทั้งหมด แต่ทำให้มันหลุดจากที่ติด โดยเฉพาะตามซอกฟันและร่องบนผิวฟัน การบ้วนปากจึงเป็นวิธีขับสิ่งที่หลุดออกมาแล้วออกไป", "เขายังยกคำของทันตแพทย์ชาวตะวันตกว่า ผู้ป่วยต้องรู้ว่าการแปรงฟันทำให้เศษอาหารหลุด แต่ไม่ได้ขจัดออกไป การบ้วนปากจึงจำเป็นและสำคัญ"]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "แปรงฟันทุกครั้งที่ละหมาด", "points_th": ["สำนวนในเศาะฮีหัยน์ \"ทุกครั้งที่ละหมาด\" เป็นหลักฐานว่าการแปรงฟันเมื่อจะละหมาดเป็นสุนัตที่หนักแน่น ทั้งละหมาดฟัรฎูและสุนัต แม้กระทั่งการละหมาดของผู้ถือศีลอดหลังตะวันคล้อย เช่น ซุฮ์รีและอัศรี", "เพราะละหมาดคือการเชื่อมสัมพันธ์ระหว่างบ่าวกับพระผู้อภิบาล บ่าวจึงควรอยู่ในสภาพที่ดีที่สุด เพื่อแสดงเกียรติของอิบาดะฮ์ ด้วยเหตุนี้ความสะอาดจึงเป็นเงื่อนไขของการละหมาด และส่วนหนึ่งของความสะอาดที่สมบูรณ์คือ ทำความสะอาดปากจากสิ่งสกปรกที่อาจมีกลิ่นไม่ดี", "ท่านนบี ﷺ กล่าวถึงประโยชน์ใหญ่สองประการของการแปรงฟัน: \"สิวากทำให้ปากสะอาด และเป็นที่พอพระทัยของพระผู้อภิบาล\" (อันนะสาอีย์ อะห์มัด และอัลบุคอรีย์ยกไว้แบบไม่มีสาย จากหะดีษอาอิชะฮ์ สายรายงานหะซัน)"]}, {"wajh": 7, "type": "fiqh", "heading_ar": null, "heading_th": "สุนัตทั้งเมื่ออาบน้ำละหมาดและเมื่อละหมาด", "points_th": ["จากที่กล่าวมา การแปรงฟันเป็นสุนัตทั้งเมื่ออาบน้ำละหมาดและเมื่อจะละหมาด ซุนนะฮ์ระบุชัดทั้งสองกรณี อัลอัยนีย์ประสานสองสำนวนว่า การแปรงฟันขณะอาบน้ำละหมาดก็เพื่อการละหมาด เพราะวุฎูอ์มีไว้เพื่อละหมาด", "ดูเหมือนว่าหะนะฟีย์ไม่ได้ถือว่าแปรงฟันเมื่อจะละหมาด และตีความหะดีษว่า \"ทุกครั้งที่อาบน้ำละหมาดเพื่อละหมาด\" พวกเขาให้เหตุผลว่า การแปรงฟันเป็นการขจัดสิ่งสกปรก ซึ่งไม่ควรทำในมัสยิด และอาจทำให้เหงือกเป็นแผลเลือดออก ซึ่งตามทัศนะของพวกเขาทำให้วุฎูอ์เสีย", "ผู้แต่งเห็นว่าที่ถูกต้องคือปฏิบัติตามซุนนะฮ์ การแปรงฟันเป็นสุนัตทั้งเมื่ออาบน้ำละหมาดและเมื่อลุกไปละหมาด ชัมสุลหักก์ อะซีมอาบาดีย์ได้แย้งหะนะฟีย์บางท่านว่า หะดีษไม่ต้องตีความเพิ่มเติม และซุนนะฮ์ระบุชัดเรื่องการแปรงฟันเมื่อจะละหมาด และอิบนุลฮุมาม (หะนะฟีย์) เองก็นับการลุกไปละหมาดและการอาบน้ำละหมาดเป็นเวลาที่ส่งเสริมให้แปรงฟัน"]}, {"wajh": 8, "type": "fawaid", "heading_ar": null, "heading_th": "คำสั่งที่ไม่มีเงื่อนไขหมายถึงวาญิบ", "points_th": ["หะดีษนี้เป็นหลักฐานหนึ่งของนักอุศูลว่า คำสั่งที่ไม่มีเงื่อนไขหมายถึงวาญิบ เพราะคำว่า \"หากไม่\" บ่งว่าคำสั่งให้แปรงฟันไม่ได้เกิดขึ้นเพราะจะลำบากแก่ประชาชาติ ทั้งที่การแปรงฟันเป็นสุนัตอยู่แล้ว แสดงว่าคำสั่ง (ที่ถูกกันไว้) ไม่ได้หมายถึงสุนัต แต่หมายถึงสิ่งที่มีความลำบาก คือวาญิบ"]}], "tags_th": ["สิวาก", "แปรงฟัน", "วุฎูอ์", "สุนัต", "ละหมาด"]}, {"id": "v1-h033", "volume": 1, "bab": "wudu", "topic_ar": "كيفية وضوء النبي ﷺ", "topic_th": "วิธีอาบน้ำละหมาดของท่านนบี ﷺ", "pages": [144, 151], "hadith": [{"no": 33, "matn_ar": "عَنْ حُمْرَانَ: أَنَّ عُثْمَانَ رَضِيَ اللهُ عَنْهُ دَعَا بِوَضُوءٍ، فَغَسَلَ كَفَّيْهِ ثَلَاثَ مَرَّاتٍ، ثُمَّ مَضْمَضَ، وَاسْتَنْشَقَ، وَاسْتَنْثَرَ، ثُمَّ غَسَلَ وَجْهَهُ ثَلَاثَ مَرَّاتٍ، ثُمَّ غَسَلَ يَدَهُ الْيُمْنَى إِلَى الْمِرْفَقِ ثَلَاثَ مَرَّاتٍ، ثُمَّ الْيُسْرَى مِثْلَ ذَلِكَ، ثُمَّ مَسَحَ بِرَأْسِهِ، ثُمَّ غَسَلَ رِجْلَهُ الْيُمْنَى إِلَى الْكَعْبَيْنِ ثَلَاثَ مَرَّاتٍ، ثُمَّ الْيُسْرَى مِثْلَ ذَلِكَ، ثُمَّ قَالَ: رَأَيْتُ رَسُولَ اللهِ ﷺ تَوَضَّأَ نَحْوَ وُضُوئِي هَذَا. مُتَّفَقٌ عَلَيْهِ.", "translation_th": "จากหุมรอนว่า อุษมาน (ร.ฎ.) ขอน้ำสำหรับอาบน้ำละหมาด แล้วล้างฝ่ามือทั้งสองสามครั้ง แล้วบ้วนปาก สูดน้ำเข้าจมูก และสั่งน้ำออกจากจมูก แล้วล้างหน้าสามครั้ง แล้วล้างมือขวาถึงข้อศอกสามครั้ง แล้วมือซ้ายเช่นเดียวกัน แล้วเช็ดศีรษะ แล้วล้างเท้าขวาถึงตาตุ่มทั้งสองสามครั้ง แล้วเท้าซ้ายเช่นเดียวกัน แล้วกล่าวว่า ฉันเห็นท่านรสูลุลลอฮ์ ﷺ อาบน้ำละหมาดเหมือนกับการอาบน้ำละหมาดของฉันนี้ บันทึกโดยอัลบุคอรีย์และมุสลิม", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["วิธีอาบน้ำละหมาดที่สมบูรณ์: ล้างฝ่ามือสามครั้ง บ้วนปาก สูดน้ำเข้าและสั่งออกจากจมูก ล้างหน้าสามครั้ง ล้างมือขวาพร้อมข้อศอกสามครั้งแล้วมือซ้าย เช็ดศีรษะ ล้างเท้าขวาถึงตาตุ่มสามครั้งแล้วเท้าซ้าย", "ล้างฝ่ามือก่อนอาบน้ำละหมาดเป็นสุนัต (เมื่อไม่ได้ตื่นจากนอน) และข้อศอกกับตาตุ่มรวมอยู่ในส่วนที่ต้องล้าง", "ล้างอวัยวะสามครั้งเป็นสุนัต ครั้งเดียวก็ใช้ได้ และล้างบางส่วนมากกว่าบางส่วนก็ได้ แต่ห้ามเกินสามครั้ง", "ผู้ที่อาบน้ำละหมาดแบบนี้แล้วละหมาดสองร็อกอะฮ์ โดยไม่ปล่อยใจคิดเรื่องอื่น จะได้รับการอภัยบาปที่ผ่านมา (บาปเล็กตามทัศนะของนักวิชาการส่วนใหญ่)", "ขอให้ผู้อื่นช่วยเตรียมหรือเทน้ำสำหรับอาบน้ำละหมาดได้"], "vocab": [{"ar": "وَضُوء", "th": "อ่านสระอะที่วาว คือน้ำที่ใช้อาบน้ำละหมาด ส่วน وُضُوء (สระอุ) คือการอาบน้ำละหมาด"}, {"ar": "كَفَّيْه", "th": "ฝ่ามือทั้งสอง คือฝ่ามือพร้อมนิ้ว ถึงข้อมือ"}, {"ar": "مَضْمَضَ", "th": "บ้วนปาก คือหมุนน้ำในปาก"}, {"ar": "اسْتَنْشَقَ / اسْتَنْثَرَ", "th": "สูดน้ำเข้าไปในจมูกด้วยลมหายใจ / สั่งน้ำออกจากจมูก"}, {"ar": "الْوَجْه", "th": "ใบหน้า ความยาวจากแนวไรผมปกติถึงส่วนที่ห้อยลงของเคราและคาง ความกว้างจากหูถึงหู"}, {"ar": "الْمِرْفَق", "th": "ข้อศอก ข้อต่อระหว่างต้นแขนกับแขนท่อนล่าง"}, {"ar": "الْكَعْبَان", "th": "ตาตุ่มทั้งสอง กระดูกที่นูนออกมาทั้งสองข้างตรงข้อเท้า"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة راوييه", "heading_th": "ชีวประวัติผู้รายงานทั้งสอง", "points_th": ["หุมรอน บินอะบาน บินคอลิด ตาบิอีน (ผู้ทันเศาะหาบะฮ์) ที่เชื่อถือได้ ถูกจับเป็นเชลยที่อัยนุตตัมร์ อุษมานปลดปล่อยเขา ต่อมาย้ายไปบัศเราะฮ์ และเสียชีวิตที่นั่นปี ฮ.ศ. 75", "อุษมาน บินอัฟฟาน บินอบิลอาศ บินอุมัยยะฮ์ อัลกุร็อชีย์ อัลอุมะวีย์ อะมีรุลมุอ์มินีน เคาะลีฟะฮ์คนที่สามของมุสลิม เข้ารับอิสลามแต่เนิ่น ๆ ผ่านอบูบักร์ และอพยพทั้งสองครั้ง", "เขาแต่งงานกับรุก็อยยะฮ์ บุตรีของท่านนบี ﷺ เมื่อนางเสียชีวิต ท่านนบี ﷺ ให้แต่งงานกับอุมมุกุลษูม น้องสาวของนาง เขาจึงได้ฉายาว่า \"ซุนนูร็อยน์\" (เจ้าของสองแสงสว่าง) ท่านนบี ﷺ แจ้งข่าวดีว่าเขาจะได้เข้าสวรรค์ และยืนยันว่าเขาจะตายชะฮีด", "ในบัยอะตุรริฎวาน ท่านนบี ﷺ ให้สัตยาบันแทนเขา เพราะท่านส่งเขาไปมักกะฮ์ แล้วมีข่าวลือว่าเขาถูกสังหาร ท่านจึงเอามือข้างหนึ่งตีลงบนอีกข้างหนึ่ง และกล่าวว่า \"นี่สำหรับอุษมาน\"", "เขาเป็นเคาะลีฟะฮ์ต่อจากอุมัร ด้วยการให้สัตยาบันของคณะชูรอ ในวันแรกของเดือนมุหัรร็อม ปี ฮ.ศ. 24 และถูกสังหารเป็นชะฮีดในวันศุกร์ ที่ 18 ซุลหิจญะฮ์ หลังอัศริ ฝังในคืนวันเสาร์ ปี ฮ.ศ. 35 หลุมศพของเขาอยู่ที่อัลบะกีอ์"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกในหมวดวุฎูอ์ บทการอาบน้ำละหมาดสามครั้ง (159) และมุสลิมในหมวดฏอฮาเราะฮ์ (226) ผ่านสายอิบรอฮีม บินสะอ์ด์ จากอิบนุชิฮาบ จากอะฏออ์ บินยะซีด อัลลัยษีย์ จากหุมรอน", "สำนวนในบุลูฆเป็นของมุสลิม ตอนท้ายมีว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"ผู้ใดอาบน้ำละหมาดเหมือนการอาบน้ำละหมาดของฉันนี้ แล้วลุกขึ้นละหมาดสองร็อกอะฮ์ โดยไม่พูดกับตัวเองในขณะนั้น เขาจะได้รับการอภัยบาปที่ผ่านมา\" อิบนุชิฮาบกล่าวว่า \"นักวิชาการของเราเคยกล่าวว่า นี่คือการอาบน้ำละหมาดที่สมบูรณ์ที่สุดที่คนจะอาบเพื่อละหมาด\"", "หะดีษนี้มีหลายสายและหลายสำนวน มีผู้รายงานจากอิบนุชิฮาบอีกหลายคน ในเศาะฮีหัยน์ สุนัน และมุสนัด"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ขอวะฎูอ์\" อ่านสระอะที่วาว คือน้ำสำหรับอาบน้ำละหมาด \"ฝ่ามือ\" คือฝ่ามือพร้อมนิ้ว ถึงข้อมือ ได้ชื่อ \"กัฟฟ์\" เพราะมันกันสิ่งที่เป็นอันตรายจากร่างกาย", "\"บ้วนปาก\" คือหมุนน้ำในปาก \"สูดน้ำเข้าจมูก\" คือดึงน้ำด้วยลมหายใจเข้าไปในจมูก \"สั่งออก\" คือเอาน้ำออกจากจมูก ในสายของหะดีษนี้ในเศาะฮีหัยน์ไม่ได้ระบุจำนวนครั้งของการบ้วนปากและสูดน้ำ แต่มีในรายงานของอบูดาวูดสองสายจากหะดีษอุษมาน และในหะดีษอบูฮุร็อยเราะฮ์และอะลี", "\"ใบหน้า\" มาจากคำว่าเผชิญหน้า ความยาวจากแนวไรผมปกติถึงส่วนที่ห้อยลงของเคราและคาง ความกว้างจากหูถึงหู", "\"ถึงข้อศอก\" คำว่า \"ถึง\" (อิลา) บ่งถึงขอบเขต และโดยทั่วไปขอบเขตไม่รวมอยู่ด้วย เช่น \"แล้วจงถือศีลอดให้ครบจนถึงกลางคืน\" (อัลบะเกาะเราะฮ์: 187) เว้นแต่มีหลักฐานว่ารวม ซึ่งในอายะฮ์ \"(ล้างมือ) ถึงข้อศอก\" ซุนนะฮ์แสดงว่าข้อศอกรวมอยู่ด้วย คือหะดีษอบูฮุร็อยเราะฮ์ (มุสลิม) ที่ล้างมือจนถึงต้นแขน และล้างเท้าจนถึงหน้าแข้ง แล้วกล่าวว่า \"อย่างนี้แหละที่ฉันเห็นท่านรสูลุลลอฮ์ ﷺ อาบน้ำละหมาด\"", "\"เช็ดศีรษะ\" คือลูบมือที่เปียกน้ำบนศีรษะ ขอบเขตศีรษะคือแนวไรผมจากด้านข้างของใบหน้าถึงต้นคอ \"ถึงตาตุ่มทั้งสอง\" ตาตุ่มคือกระดูกนูนสองข้างที่ข้อเท้า และ \"ถึง\" ในที่นี้หมายถึง \"พร้อมกับ\" ตามหะดีษอบูฮุร็อยเราะฮ์", "\"เหมือนกับการอาบน้ำละหมาดของฉันนี้\" ในรายงานของอบูดาวูดใช้คำว่า \"มิษล์\" (เหมือน) แต่ในเศาะฮีหัยน์ใช้ \"นะห์วะ\" (คล้าย) เพราะการเหมือนท่านนบี ﷺ อย่างแท้จริงไม่มีใครทำได้ แต่เมื่อมีรายงานว่า \"มิษล์\" คำว่า \"นะห์วะ\" อาจเป็นถ้อยคำของผู้รายงาน เพราะใช้ในความหมาย \"เหมือน\" ได้ หรือให้ยึดตามที่อยู่ในเศาะฮีหัยน์"]}, {"wajh": 4, "type": "fawaid", "heading_ar": null, "heading_th": "ความใส่ใจของอุษมานในการสอน", "points_th": ["หะดีษแสดงความประเสริฐของอุษมาน (ร.ฎ.) และความใส่ใจในการสอน การเผยแผ่ซุนนะฮ์ และความหวังดีต่อประชาชาติ ผู้รู้และนักศึกษาจึงควรเผยแผ่ซุนนะฮ์แก่ผู้คน ไม่พอใจเพียงเพราะมันชัดเจนหรือผู้คนรู้คร่าว ๆ อยู่แล้ว อุษมานอธิบายการอาบน้ำละหมาดของท่านนบี ﷺ ด้วยการทำให้ดู ทั้งที่เป็นเรื่องที่รู้กันดี โดยเฉพาะในยุคแรก"]}, {"wajh": 5, "type": "fawaid", "heading_ar": null, "heading_th": "หะดีษหลักเรื่องวิธีอาบน้ำละหมาด", "points_th": ["หะดีษนี้เป็นหนึ่งในหะดีษที่อธิบายการอาบน้ำละหมาดของท่านนบี ﷺ อย่างสมบูรณ์ อิบนุลมุลักกินกล่าวว่า \"เป็นหลักสำคัญในเรื่องวิธีอาบน้ำละหมาด\" อิบนุหะญัรจึงทำให้หะดีษนี้เป็นหลัก และหะดีษหลังจากนั้นเป็นส่วนเติมเต็ม", "ผู้แต่งจะกล่าวถึงประโยชน์ของหะดีษนี้ ยกเว้นประเด็นที่มีหะดีษเฉพาะมาภายหลัง ซึ่งจะอธิบายในที่ของมัน"]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "ขอให้ผู้อื่นช่วยเรื่องน้ำอาบน้ำละหมาด", "points_th": ["อนุญาตให้ขอให้ผู้อื่นช่วยนำน้ำสำหรับอาบน้ำละหมาดมาให้ เพราะหุมรอนกล่าวว่า \"อุษมานขอน้ำมา\" อิบนุลมุลักกินรายงานว่ามีอิจญ์มาอ์ว่าทำได้โดยไม่มักรูฮ์", "รวมถึงการเทน้ำให้ผู้ที่อาบน้ำละหมาดด้วย ตามหะดีษอัลมุฆีเราะฮ์ บินชุอ์บะฮ์ (มุสลิม): \"คืนหนึ่งฉันอยู่กับท่านรสูลุลลอฮ์ ﷺ ท่านลงไปทำธุระ แล้วกลับมา ฉันเทน้ำให้ท่านจากภาชนะที่ฉันถือมา ท่านอาบน้ำละหมาดและเช็ดรองเท้าหุ้มข้อ\""]}, {"wajh": 7, "type": "fawaid", "heading_ar": null, "heading_th": "สอนด้วยการทำให้ดู", "points_th": ["อุษมานเลือกอธิบายวิธีอาบน้ำละหมาดของท่านนบี ﷺ ด้วยการกระทำ ไม่ใช่คำพูด เพราะการทำให้ดูเข้าใจได้เร็วกว่า เห็นภาพชัดกว่า และจำได้แม่นกว่า ส่วนคำพูดขึ้นอยู่กับถ้อยคำ ซึ่งอาจตีความได้หลายทาง", "ผู้สอนจึงควรเลือกวิธีที่ใกล้ที่สุดในการส่งความรู้ถึงผู้เรียน โดยเฉพาะสื่อประกอบที่ช่วยให้เข้าใจและจดจำได้ดี"]}, {"wajh": 8, "type": "fiqh", "heading_ar": null, "heading_th": "วิธีอาบน้ำละหมาดของท่านนบี ﷺ", "points_th": ["หะดีษแสดงวิธีอาบน้ำละหมาดตามแบบนี้ คือ ล้างฝ่ามือสามครั้ง บ้วนปาก สูดน้ำเข้าและสั่งออกจากจมูก ล้างหน้าสามครั้ง ล้างมือขวาพร้อมข้อศอกสามครั้ง แล้วมือซ้ายเช่นกัน เช็ดศีรษะ ล้างเท้าขวาถึงตาตุ่มสามครั้ง แล้วเท้าซ้ายเช่นกัน นี่คือวิธีอาบน้ำละหมาดของท่านนบี ﷺ"]}, {"wajh": 9, "type": "fiqh", "heading_ar": null, "heading_th": "ล้างฝ่ามือก่อนอาบน้ำละหมาด", "points_th": ["การล้างฝ่ามือสามครั้งเป็นสุนัต เพราะมีรายงานเพียงการกระทำ ดังในหะดีษนี้ หะดีษอับดุลลอฮ์ บินซัยด์ (อัลบุคอรีย์ มุสลิม) หะดีษอะลี (ผู้บันทึกสุนัน) และหะดีษอบูฮุร็อยเราะฮ์ (อัฏเฏาะบะรอนีย์ในอัลเอาสัฏ อัลฮัยษะมีย์ว่าผู้รายงานเป็นผู้รายงานของเศาะฮีห์)", "ไม่ใช่วาญิบ เพราะอัลลอฮ์ทรงกล่าวถึงวุฎูอ์ในอายะฮ์อัลมาอิดะฮ์ โดยเริ่มที่การล้างหน้า ไม่ได้กล่าวถึงการล้างฝ่ามือ อิบนุกุดามะฮ์กล่าวว่า \"การล้างฝ่ามือไม่ใช่วาญิบ ถ้าไม่ได้ตื่นจากนอน โดยไม่มีข้อขัดแย้งที่เรารู้\" วิทยปัญญาคือ มือเป็นเครื่องมือในการล้าง ใช้ตักน้ำและถูอวัยวะ จึงเหมาะที่จะทำความสะอาดก่อน", "นี่คือกรณีที่ไม่ได้ตื่นจากนอน ส่วนการล้างมือหลังตื่นนอนจะกล่าวในหะดีษที่ 37 ตามรูปคำของหะดีษ การล้างฝ่ามือทั้งสองทำพร้อมกันด้วยน้ำครั้งเดียว ในรายงานของมุสลิมว่า \"เขาเทน้ำลงบนฝ่ามือทั้งสองสามครั้งแล้วล้าง\""]}, {"wajh": 10, "type": "fiqh", "heading_ar": null, "heading_th": "ล้างสามครั้ง และล้างไม่เท่ากันได้", "points_th": ["หะดีษแสดงว่าส่งเสริมให้ทำสามครั้งในการบ้วนปาก สูดน้ำเข้าจมูก ล้างหน้า ล้างมือ และล้างเท้า อัลบุคอรีย์ตั้งชื่อบทของหะดีษนี้ว่า \"บทการอาบน้ำละหมาดสามครั้ง ๆ\"", "อนุญาตให้ล้างอวัยวะบางส่วนมากกว่าบางส่วนได้ เช่น บางส่วนครั้งเดียว บางส่วนสองครั้ง บางส่วนสามครั้ง ตามหะดีษอับดุลลอฮ์ บินซัยด์ (อัลบุคอรีย์ มุสลิม) ว่า ท่านนบี ﷺ ล้างหน้าสามครั้ง ล้างมือสองครั้ง และเช็ดศีรษะครั้งเดียว", "อันนะวะวีย์กล่าวว่า การอาบน้ำละหมาดแบบนี้ใช้ได้โดยไม่มีข้อสงสัย แต่ที่ส่งเสริมคือ ล้างทุกอวัยวะสามครั้ง ท่านนบี ﷺ ทำต่างไปบางครั้งเพื่อแสดงว่าทำได้ เช่นเดียวกับที่บางครั้งท่านอาบน้ำละหมาดครั้งเดียว ๆ ในกรณีนั้นการทำเช่นนี้ดีกว่าสำหรับท่าน เพราะท่านมีหน้าที่ต้องอธิบาย และการอธิบายด้วยการกระทำเข้าถึงใจได้ดีกว่าคำพูด"]}, {"wajh": 11, "type": "fiqh", "heading_ar": null, "heading_th": "ห้ามล้างเกินสามครั้ง", "points_th": ["ไม่อนุญาตให้ล้างเกินสามครั้งในการอาบน้ำละหมาด อันนะวะวีย์รายงานว่ามีอิจญ์มาอ์ว่าการเกินสามครั้งเป็นมักรูฮ์ หลักฐานคือหะดีษอัมร์ บินชุอัยบ์ จากบิดา จากปู่ ว่า ชาวชนบทคนหนึ่งมาถามท่านนบี ﷺ เรื่องการอาบน้ำละหมาด ท่านทำให้ดูสามครั้ง ๆ แล้วกล่าวว่า \"นี่คือการอาบน้ำละหมาด ผู้ใดทำเกินกว่านี้ เขาได้ทำผิด ละเมิด และอธรรม\" (อันนะสาอีย์ อิบนุมาญะฮ์ อะห์มัด สายรายงานหะซัน)", "อัตติรมิซีย์กล่าวหลังหะดีษอะลีว่า นักวิชาการปฏิบัติตามนี้ คือการอาบน้ำละหมาดครั้งเดียวใช้ได้ สองครั้งดีกว่า และสามครั้งดีที่สุด ไม่มีอะไรหลังจากนั้น อิบนุลมุบาร็อกกล่าวว่า \"ผู้ที่ล้างเกินสามครั้ง ฉันไม่แน่ใจว่าเขาจะไม่บาป\" อะห์มัดและอิสหากกล่าวว่า \"ไม่มีใครล้างเกินสามครั้ง นอกจากคนที่มีปัญหา (ระแวง)\" และอิบรอฮีม อันนะเคาะอีย์กล่าวว่า \"การเข้มงวดเกินในการอาบน้ำละหมาดมาจากชัยฏอน ถ้ามันดีกว่า เศาะหาบะฮ์ของท่านมุหัมมัด ﷺ คงทำไปแล้ว\""]}, {"wajh": 12, "type": "fiqh", "heading_ar": null, "heading_th": "ละหมาดสองร็อกอะฮ์หลังอาบน้ำละหมาด", "points_th": ["หะดีษแสดงความประเสริฐของการละหมาดสองร็อกอะฮ์ และผลบุญที่สัญญาไว้ผูกกับสองอย่าง (1) อาบน้ำละหมาดตามวิธีนี้ รวมถึงการทำสามครั้ง (2) ละหมาดสองร็อกอะฮ์หลังอาบน้ำละหมาด ตามที่อธิบายว่า \"โดยไม่พูดกับตัวเองในขณะนั้น\" คือไม่คิดเรื่องที่อยู่นอกละหมาด", "\"ไม่พูดกับตัวเอง\" หมายถึงสิ่งที่ปล่อยใจคิดไป ทั้งที่ยังผลักไสและหยุดได้ ส่วนความคิดที่แวบเข้ามาเองและผลักไสไม่ได้นั้นได้รับการอภัย เพราะอยู่นอกความสามารถของมนุษย์", "ตามรูปคำ หะดีษครอบคลุมทั้งการคิดเรื่องศาสนาและเรื่องดุนยา นักวิชาการบางท่านจำกัดเฉพาะเรื่องดุนยา เพราะอัลบุคอรีย์ยกไว้แบบไม่มีสายว่า อุมัรกล่าวว่า \"ฉันจัดทัพขณะที่ฉันละหมาด\" (อิบนุหะญัรระบุว่าอิบนุอบีชัยบะฮ์บันทึกด้วยสายศ่อฮีห์) ผู้แต่งเห็นว่าเรื่องศาสนาดูจะเบากว่าเรื่องดุนยา", "ผลบุญคือการอภัยบาปที่ผ่านมา ตามทัศนะของนักวิชาการส่วนใหญ่หมายถึงบาปเล็ก (อิบนุตัยมียะฮ์มีทัศนะอื่นในเรื่องนี้)"]}], "tags_th": ["วุฎูอ์", "วิธีอาบน้ำละหมาด", "อุษมาน", "ล้างสามครั้ง", "ละหมาดสองร็อกอะฮ์"]}, {"id": "v1-h034", "volume": 1, "bab": "wudu", "topic_ar": "مسح الرأس مرة واحدة", "topic_th": "เช็ดศีรษะครั้งเดียว", "pages": [152, 155], "hadith": [{"no": 34, "matn_ar": "عَنْ عَلِيٍّ رَضِيَ اللهُ عَنْهُ - فِي صِفَةِ وُضُوءِ النَّبِيِّ ﷺ - قَالَ: وَمَسَحَ بِرَأْسِهِ وَاحِدَةً. أَخْرَجَهُ أَبُو دَاوُدَ.", "translation_th": "จากอะลี (ร.ฎ.) เกี่ยวกับวิธีอาบน้ำละหมาดของท่านนบี ﷺ กล่าวว่า และท่านเช็ดศีรษะครั้งเดียว บันทึกโดยอบูดาวูด", "grade_th": "ศ่อฮีห์"}], "key_rulings_th": ["ศีรษะเช็ดครั้งเดียว ไม่ทำซ้ำเหมือนการล้าง ตามทัศนะของนักวิชาการส่วนใหญ่ (หะนะฟีย์ มาลิกีย์ และทัศนะที่ถูกต้องในหันบะลีย์)", "ผู้แต่งเห็นว่าทัศนะที่ถูกต้องคือเช็ดครั้งเดียว การเช็ดเกินกว่านี้ไม่มีในศาสนา", "อัชชาฟิอีย์ชอบให้เช็ดสามครั้ง แต่หลักฐานที่อ้างไม่ชัดหรืออ่อน", "ศาสนาให้เช็ดศีรษะแทนการล้าง เพื่อผ่อนปรนและเป็นความเมตตาต่อบ่าว"], "vocab": [{"ar": "مَسَحَ بِرَأْسِهِ وَاحِدَةً", "th": "เช็ด (ลูบ) ศีรษะครั้งเดียว"}, {"ar": "الصُّدْغ", "th": "ขมับ ส่วนระหว่างหางตาถึงโคนหู และผมที่ห้อยลงตรงนั้น"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อะลี บินอบีฏอลิบ บินอับดิลมุฏฏอลิบ อัลกุร็อชีย์ อัลฮาชิมีย์ อะมีรุลมุอ์มินีน เคาะลีฟะฮ์คนที่สี่ของมุสลิม และลูกพี่ลูกน้องของท่านนบี ﷺ เกิดก่อนการเป็นนบีสิบปีตามทัศนะที่ถูกต้อง เติบโตในอุปการะของท่านนบี ﷺ และศรัทธาตั้งแต่ท่านได้รับการแต่งตั้ง", "ท่านนบี ﷺ ให้แต่งงานกับฟาฏิมะฮ์บุตรีของท่าน และให้ดูแลครอบครัวแทนท่านในสงครามตะบูก ท่านกล่าวว่า \"ท่านไม่พอใจหรือที่ท่านมีฐานะต่อฉัน เหมือนฮารูนต่อมูซา เพียงแต่ไม่มีนบีหลังจากฉัน\" (อัลบุคอรีย์) ท่านนบี ﷺ ยืนยันว่าเขาจะได้เข้าสวรรค์", "เขาเป็นที่รู้จักในความกล้าหาญ การขี่ม้า ความรู้ และความเฉลียวฉลาด อุมัรกล่าวว่า \"ผู้ตัดสินคดีที่ดีที่สุดในหมู่เราคืออะลี\" เขาเป็นเคาะลีฟะฮ์หลังอุษมานในปลายเดือนซุลหิจญะฮ์ ปี ฮ.ศ. 35 และถูกสังหารเป็นชะฮีดเมื่อเดือนเราะมะฎอนผ่านไปสิบกว่าคืน ปี ฮ.ศ. 40 ฝังที่วังผู้ปกครองในกูฟะฮ์ บางท่านว่าฝังในที่ที่ไม่มีใครรู้ เพราะกลัวพวกเคาะวาริจ"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["หะดีษนี้เป็นส่วนหนึ่งของหะดีษยาว อบูดาวูดบันทึก (111) ในบทวิธีอาบน้ำละหมาดของท่านนบี ﷺ และอันนะสาอีย์บันทึกแบบย่อ ผ่านสายอบูอะวานะฮ์ จากคอลิด บินอัลก็อมะฮ์ จากอับดุคอยร์ ว่า อะลีมาหาเราขณะที่ละหมาดเสร็จแล้ว แล้วขอน้ำมา เราคิดว่า เขาจะทำอะไรกับน้ำในเมื่อละหมาดแล้ว เขาคงต้องการสอนเรา... จนถึงตอนที่ว่า แล้วเขาจุ่มมือลงในภาชนะ แล้วเช็ดศีรษะครั้งเดียว", "อบูดาวูดบันทึกผ่านสายซาอิดะฮ์ บินกุดามะฮ์ จากคอลิดด้วย และยังมีสายอื่น หะดีษนี้ศ่อฮีห์ อัตติรมิซีย์กล่าวว่า หะดีษอะลีดีที่สุดและถูกต้องที่สุดในบทนี้ อัลบัซซารกล่าวว่า หลายคนรายงานจากคอลิด แต่ไม่มีใครเล่าได้ดีและสมบูรณ์กว่าซาอิดะฮ์", "หะดีษนี้ฉบับเต็มอธิบายวิธีอาบน้ำละหมาดของท่านนบี ﷺ อย่างครบถ้วน ให้ข้อมูลเดียวกับหะดีษหุมรอนจากอุษมาน อิบนุหะญัรยกเพียงส่วนนี้ เพราะระบุชัดสิ่งที่หะดีษอุษมานไม่ได้ระบุ หะดีษอุษมานกล่าวถึงการเช็ดศีรษะ ตามรูปคำคือครั้งเดียว แต่หะดีษนี้ระบุชัดว่าเช็ดศีรษะครั้งเดียว พร้อมระบุว่าอวัยวะอื่นล้างสามครั้ง อิบนุหะญัรจะยกหะดีษนี้อีกในหะดีษที่ 53 เพื่อเป็นหลักฐานในอีกประเด็นหนึ่งของวุฎูอ์"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "เช็ดศีรษะครั้งเดียว", "points_th": ["หะดีษเป็นหลักฐานว่าศีรษะเช็ดครั้งเดียว ไม่เช็ดซ้ำเหมือนการล้างซ้ำ ด้วยเหตุนี้ศาสนาจึงไม่ให้ล้างศีรษะ เพราะถ้าให้ล้างจะลำบากมาก ศีรษะมักมีผม และการราดน้ำมากในฤดูหนาวทำให้เดือดร้อน อีกทั้งศีรษะอยู่สูงสุดของร่างกาย ถ้าล้าง น้ำจะไหลลงเปื้อนเสื้อผ้า ศาสนาจึงให้เช็ดทั้งศีรษะแทนการล้าง เพื่อผ่อนปรนและเป็นความเมตตาต่อบ่าว", "ทัศนะที่หนึ่ง: เช็ดครั้งเดียว เป็นมัซฮับของนักวิชาการส่วนใหญ่ ทั้งหะนะฟีย์ มาลิกีย์ และทัศนะที่ถูกต้องในหันบะลีย์ หลักฐานคือหะดีษนี้ หะดีษอับดุลลอฮ์ บินซัยด์ (อัลบุคอรีย์ มุสลิม): \"แล้วเขาจุ่มมือลงไป แล้วเช็ดศีรษะ ลูบไปข้างหน้าและข้างหลังครั้งเดียว\" (อัลบุคอรีย์ตั้งชื่อบทว่า \"การเช็ดศีรษะครั้งเดียว\") และหะดีษอุษมานที่ระบุการทำสามครั้งในอวัยวะอื่น แต่ไม่ระบุในการเช็ดศีรษะ", "และหะดีษอัรรุบัยยิอ์ บินติมุเอาวิซ บินอัฟรออ์: \"ฉันเห็นท่านรสูลุลลอฮ์ ﷺ อาบน้ำละหมาด ท่านเช็ดศีรษะ ทั้งด้านหน้าและด้านหลัง ขมับทั้งสอง และหูทั้งสองครั้งเดียว\" (อบูดาวูด อัตติรมิซีย์ว่าหะซันศ่อฮีห์) อิบนุลก็อยยิมกล่าวว่า \"ที่ถูกต้องคือท่านไม่ได้เช็ดศีรษะซ้ำ แต่เมื่อท่านล้างอวัยวะซ้ำ ท่านเช็ดศีรษะครั้งเดียว มีรายงานชัดเจนเช่นนี้ และไม่มีรายงานที่ถูกต้องจากท่านที่ขัดกับนี้เลย\"", "ทัศนะที่สอง: ศาสนาให้เช็ดศีรษะสามครั้ง เป็นมัซฮับของอัชชาฟิอีย์ ซึ่งกล่าวว่า \"ฉันชอบให้เช็ดศีรษะสามครั้ง และครั้งเดียวก็ใช้ได้\" เป็นอีกรายงานหนึ่งจากอิมามอะห์มัด และทัศนะของสลัฟบางท่าน เช่น อิบรอฮีม อัตตัยมีย์ และอะฏออ์", "หลักฐานของทัศนะที่สอง (1) หะดีษอุษมานในรายงานหนึ่งว่า \"ให้ฉันแสดงการอาบน้ำละหมาดของท่านรสูลุลลอฮ์ ﷺ ให้พวกท่านดูไหม แล้วเขาก็อาบน้ำละหมาดสามครั้ง ๆ\" (มุสลิม) ตามรูปคำครอบคลุมการเช็ดศีรษะด้วย (2) หะดีษอุษมานที่อบูดาวูดบันทึกผ่านอามิร บินชะกีก ว่าอุษมานเช็ดศีรษะสามครั้ง แล้วกล่าวว่า ฉันเห็นท่านรสูลุลลอฮ์ ﷺ ทำเช่นนี้", "ผู้แต่งเห็นว่าทัศนะที่ถูกต้องคือทัศนะแรก ศีรษะเช็ดครั้งเดียวตามวิธีที่จะกล่าวต่อไป และการเช็ดเกินกว่านี้ไม่มีในศาสนา เพราะหลักฐานแข็งแรง และเพราะการเช็ดตั้งอยู่บนการผ่อนปรน จึงเทียบกับการล้างซึ่งมุ่งให้ทั่วถึงไม่ได้ และถ้านับจำนวนครั้งในการเช็ด ก็จะกลายเป็นการล้าง เพราะน้ำจะไหลจริง", "รายงานของมุสลิมกล่าวไว้กว้าง ๆ และรายงานที่ศ่อฮีห์แสดงว่าการเช็ดไม่ได้ทำซ้ำ จึงตีความว่าหมายถึงส่วนใหญ่ หรือการทำสามครั้งเฉพาะอวัยวะที่ล้าง ส่วนหะดีษของอบูดาวูดอ่อนจากสายนี้ เพราะมาจากอามิร บินชะกีก ซึ่งอิบนุหะญัรว่า \"หะดีษของเขาอ่อน\" และยังขัดกับรายงานที่ถูกต้องกว่า จึงเป็นชาซ อบูดาวูดจึงกล่าวว่า \"หะดีษอุษมานที่ศ่อฮีห์ทั้งหมดบ่งว่าเช็ดศีรษะครั้งเดียว เพราะผู้รายงานระบุการอาบน้ำละหมาดสามครั้ง และกล่าวว่า และเช็ดศีรษะ โดยไม่ระบุจำนวนครั้งเหมือนอวัยวะอื่น\""]}], "tags_th": ["เช็ดศีรษะ", "วุฎูอ์", "อะลี", "ครั้งเดียว"]}, {"id": "v1-h035", "volume": 1, "bab": "wudu", "topic_ar": "كيفية مسح الرأس", "topic_th": "วิธีเช็ดศีรษะ", "pages": [156, 161], "hadith": [{"no": 35, "matn_ar": "عَنْ عَبْدِ اللهِ بْنِ زَيْدِ بْنِ عَاصِمٍ رَضِيَ اللهُ عَنْهُ - فِي صِفَةِ الْوُضُوءِ - قَالَ: وَمَسَحَ ﷺ بِرَأْسِهِ، فَأَقْبَلَ بِيَدَيْهِ وَأَدْبَرَ. مُتَّفَقٌ عَلَيْهِ. وَفِي لَفْظٍ: بَدَأَ بِمُقَدَّمِ رَأْسِهِ، حَتَّى ذَهَبَ بِهِمَا إِلَى قَفَاهُ، ثُمَّ رَدَّهُمَا إِلَى الْمَكَانِ الَّذِي بَدَأَ مِنْهُ.", "translation_th": "จากอับดุลลอฮ์ บินซัยด์ บินอาศิม (ร.ฎ.) เกี่ยวกับวิธีอาบน้ำละหมาด กล่าวว่า และท่านนบี ﷺ เช็ดศีรษะ โดยลูบมือทั้งสองไปข้างหน้าและข้างหลัง บันทึกโดยอัลบุคอรีย์และมุสลิม และในอีกสำนวนว่า ท่านเริ่มที่ด้านหน้าศีรษะ ลูบมือทั้งสองไปจนถึงท้ายทอย แล้วลูบกลับมายังที่ที่เริ่ม", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["ต้องเช็ดทั่วทั้งศีรษะ ตามทัศนะของมาลิก ทัศนะที่รู้จักของอะห์มัด อิบนุตัยมียะฮ์ และอิบนุกะษีร ส่วนชาฟิอีย์และหะนะฟีย์ว่าเช็ดบางส่วนก็ใช้ได้", "วิธีที่เป็นซุนนะฮ์: เริ่มที่ด้านหน้าศีรษะ ลูบไปถึงท้ายทอย แล้วลูบกลับมาที่เดิม นับเป็นการเช็ดครั้งเดียว ไม่ใช่สองครั้ง", "วิธีนี้ไม่ใช่วาญิบ เช็ดแบบใดก็ใช้ได้ แต่รักษาตามซุนนะฮ์ดีกว่า และผู้แต่งเห็นว่าส่งเสริมแม้ผู้ที่ผมสั้นหรือไม่มีผม", "สตรีเช็ดศีรษะเหมือนผู้ชาย ผู้แต่งเห็นว่าวิธีในหะดีษอาอิชะฮ์ (เช็ดจากหน้าไปหลังครั้งเดียว) ใกล้ซุนนะฮ์และสะดวก และไม่ต้องเช็ดผมเปียที่ห้อยลงมา"], "vocab": [{"ar": "أَقْبَلَ بِيَدَيْهِ", "th": "ลูบมือเริ่มจากด้านหน้าของศีรษะ"}, {"ar": "أَدْبَرَ", "th": "ลูบมือกลับจากด้านหลังของศีรษะ"}, {"ar": "قَفَاهُ", "th": "ท้ายทอย ส่วนหลังของศีรษะและคอ"}, {"ar": "الضَّفَائِر", "th": "ผมเปีย"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อับดุลลอฮ์ บินซัยด์ บินอาศิม อัลอันศอรีย์ อัลมาซินีย์ ร่วมสงครามอุหุดและหลังจากนั้น มีความเห็นต่างว่าร่วมสงครามบัดร์หรือไม่ เขารายงานหะดีษเรื่องการอาบน้ำละหมาด อิบนุลมุลักกินระบุว่าเขารายงานสี่สิบแปดหะดีษ อัลบุคอรีย์และมุสลิมบันทึกตรงกันแปดหะดีษ", "เมื่อมุสลิมยกทัพไปอัลยะมามะฮ์ เขาร่วมกับวะห์ชีย์ บินหัรบ์ สังหารมุสัยละมะฮ์ (ผู้อ้างตนเป็นนบี) และเขาถูกสังหารในวันอัลหัรเราะฮ์ ปี ฮ.ศ. 63"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["หะดีษนี้เป็นส่วนหนึ่งของหะดีษยาว อัลบุคอรีย์บันทึกในหมวดวุฎูอ์ (186) และมุสลิม (235) ผ่านสายอัมร์ บินยะห์ยา อัลมาซินีย์ จากบิดา ว่า ฉันเห็นอัมร์ บินอบีหะซันถามอับดุลลอฮ์ บินซัยด์ถึงการอาบน้ำละหมาดของท่านนบี ﷺ เขาขอภาชนะน้ำมาแล้วอาบน้ำละหมาดให้ดู... จนถึง \"แล้วเขาจุ่มมือลงไป แล้วเช็ดศีรษะ ลูบไปข้างหน้าและข้างหลังครั้งเดียว\"", "สำนวนที่สอง อัลบุคอรีย์บันทึกในหมวดวุฎูอ์ บทการเช็ดศีรษะ (185) และมุสลิม (235) จากหะดีษอับดุลลอฮ์ บินซัยด์เช่นกัน อิบนุหะญัรอาจยกสำนวนนี้เพื่ออธิบายคำว่า \"ไปข้างหน้าและข้างหลัง\" ในสำนวนแรก เพราะสำนวนนี้ชัดกว่า", "หะดีษอับดุลลอฮ์ บินซัยด์อธิบายการอาบน้ำละหมาดของท่านนบี ﷺ อย่างครบถ้วน ให้ข้อมูลเหมือนหะดีษอุษมาน แต่เพิ่มรายละเอียดวิธีเช็ดศีรษะ ซึ่งไม่มีในหะดีษอุษมาน อิบนุหะญัรจึงยกเฉพาะส่วนนี้"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ลูบมือไปข้างหน้า\" (อักบะละ) คือเริ่มทางด้านหน้าของศีรษะ \"และข้างหลัง\" (อัดบะเราะ) คือลูบกลับจากด้านหลังของศีรษะ", "\"ลูบมือทั้งสองไปจนถึงท้ายทอย\" คือพามือไปถึงท้ายทอย ซึ่งเป็นส่วนหลังของศีรษะและคอ"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "ต้องเช็ดทั่วทั้งศีรษะ", "points_th": ["หะดีษเป็นหลักฐานว่าต้องเช็ดทั่วทั้งศีรษะ เป็นทัศนะของมาลิก ทัศนะที่รู้จักของอะห์มัด อิบนุตัยมียะฮ์และอิบนุกะษีรเลือก เพราะคำว่า \"เช็ดศีรษะด้วยมือทั้งสอง ลูบไปข้างหน้าและข้างหลัง\" การกระทำของท่านนบี ﷺ จึงเป็นการอธิบายอายะฮ์ที่กล่าวไว้กว้าง ๆ ว่า \"และจงเช็ดศีรษะของพวกเจ้า\" (อัลมาอิดะฮ์: 6)", "ชาฟิอีย์และหะนะฟีย์ว่าเช็ดบางส่วนของศีรษะก็ใช้ได้ ชาฟิอีย์ถึงกับว่าแค่ส่วนที่เรียกว่าเช็ดได้ แม้น้อยนิดก็พอ โดยอ้างหะดีษอัลมุฆีเราะฮ์ (มุสลิม) ว่าท่านนบี ﷺ อาบน้ำละหมาดแล้วเช็ดที่หน้าผากและบนผ้าโพกศีรษะ พวกเขาว่าหะดีษนี้แสดงว่าไม่ต้องเช็ดทั่วทั้งศีรษะ (จะกล่าวในอีกสิบหะดีษ)", "ผู้แต่งเห็นว่าหะดีษนั้นไม่ใช่หลักฐาน เว้นแต่ท่านนบี ﷺ เช็ดเพียงหน้าผาก แต่ท่านไม่ได้เช็ดแค่นั้น ท่านเช็ดส่วนที่เหลือของศีรษะต่อจนครบ คือส่วนที่ผ้าโพกศีรษะคลุมอยู่ จึงยิ่งบ่งว่าต้องเช็ดทั่วศีรษะ"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "วิธีเช็ดศีรษะ", "points_th": ["หะดีษแสดงวิธีเช็ดศีรษะ คือเริ่มที่ด้านหน้าศีรษะ ลูบมือทั้งสองไปถึงท้ายทอยซึ่งเป็นส่วนบนของคอ แล้วลูบกลับมาถึงที่เริ่ม คือแนวไรผมที่ขอบใบหน้า ดังสำนวน \"เริ่มที่ด้านหน้าศีรษะ ลูบไปจนถึงท้ายทอย แล้วลูบกลับมายังที่ที่เริ่ม\"", "ทัศนะที่สองในการตีความคำว่า \"ไปข้างหน้าและข้างหลัง\" คือเริ่มที่ด้านหลังศีรษะ ลูบมาทางหน้า แล้วลูบกลับไปข้างหลัง ตามรูปคำ \"ลูบไปข้างหน้าและข้างหลัง\" และหะดีษอัรรุบัยยิอ์ บินติมุเอาวิซ ว่าท่านนบี ﷺ เช็ดศีรษะสองครั้ง เริ่มที่ด้านหลังศีรษะ แล้วด้านหน้า (อัตติรมิซีย์ว่าหะซัน และว่าหะดีษอับดุลลอฮ์ บินซัยด์ศ่อฮีห์กว่าและสายรายงานดีกว่า)", "ทัศนะแรกตอบคำว่า \"ลูบไปข้างหน้าและข้างหลัง\" สามแนว (1) คำว่า \"และ\" ไม่ได้บ่งลำดับ ความหมายคือ \"ข้างหลังและข้างหน้า\" สนับสนุนด้วยรายงานของอัลบุคอรีย์ผ่านสุลัยมาน บินบิลาล: \"เขาเช็ดศีรษะ ลูบไปข้างหลังและข้างหน้า\" (2) ข้างหน้าและข้างหลังเป็นเรื่องสัมพัทธ์ ขึ้นอยู่กับว่ามุ่งไปหรือหันออกจากที่ใด ด้านหลังศีรษะก็อาจเรียกได้ทั้งสองแบบ (3) ตีความ \"อักบะละ\" ว่าเริ่มด้วยด้านหน้า (กุบุล) คือหน้าศีรษะ และ \"อัดบะเราะ\" ว่าเริ่มด้วยด้านหลัง (ดุบุร) เป็นการเรียกการกระทำตามจุดเริ่มต้น ซึ่งเป็นหนึ่งในสองทัศนะของนักอุศูล เพราะทั้งสองสายมาจากที่เดียวกัน ความหมายจึงเหมือนกัน", "ในสุนันอบูดาวูดมีหะดีษอัลมิกดาม บินมะอ์ดีกะริบ: \"ฉันเห็นท่านรสูลุลลอฮ์ ﷺ อาบน้ำละหมาด เมื่อถึงการเช็ดศีรษะ ท่านวางฝ่ามือทั้งสองที่หน้าศีรษะ แล้วลูบไปจนถึงท้ายทอย แล้วลูบกลับมาที่ที่เริ่ม\" (ในสายมีอัลวะลีด บินมุสลิม ผู้ตัดลีส แต่ระบุชัดว่าได้ยินในรายงานของอิบนุมาญะฮ์ และมีสายสนับสนุน)", "ถ้าจะเลือกระหว่างสองแบบ ไม่ต้องสงสัยว่าหะดีษที่เริ่มจากด้านหน้ามีมากกว่า ถูกต้องกว่า และสายรายงานดีกว่า ดังที่อัตติรมิซีย์กล่าว ส่วนหะดีษอัรรุบัยยิอ์มีอับดุลลอฮ์ บินมุหัมมัด บินอะกีล ซึ่งถูกวิจารณ์เรื่องความจำ จึงอ่อนเมื่อรายงานคนเดียวโดยไม่มีสายสนับสนุน หรือไม่ก็ตีความหะดีษที่เริ่มด้านหลังว่าเป็นกรณีที่ต่างกัน และเพื่อแสดงว่าทำได้ ซึ่งเป็นการปฏิบัติตามหลักฐานทั้งหมด"]}, {"wajh": 6, "type": "fawaid", "heading_ar": null, "heading_th": "วิทยปัญญาของการลูบไปและกลับ", "points_th": ["วิทยปัญญาของการเช็ดศีรษะแบบนี้คือ ให้ทั่วทั้งสองด้านของผม เพราะผมด้านหน้าหันไปทางหน้า และผมด้านหลังหันไปทางท้ายทอย เมื่อเริ่มจากด้านหน้า น้ำจะสวนทางผมและถึงโคนผม เมื่อถึงกลางศีรษะ น้ำจะตามทางผมและโดนผิวด้านบนของผม เมื่อลูบกลับก็จะกลับกัน", "ไม่ได้ถือเป็นการเช็ดซ้ำ จุดประสงค์คือให้การเช็ดถึงทั้งผิวและโคนของผม จึงเป็นการเช็ดครั้งเดียว ไม่ใช่สองครั้ง เพราะการเช็ดหนึ่งครั้งจะทั่วผมทั้งหมดได้ก็ต่อเมื่อลูบไปและกลับ ขากลับจะเช็ดส่วนที่ขาไปไม่ได้เช็ด", "วิธีนี้ไม่ใช่วาญิบ ถ้าเช็ดแบบใดก็ถือว่าใช้ได้ แต่การรักษาตามซุนนะฮ์ดีกว่า"]}, {"wajh": 7, "type": "fiqh", "heading_ar": null, "heading_th": "ผู้ไม่มีผม และสตรีเช็ดศีรษะอย่างไร", "points_th": ["อันนะวะวีย์ระบุว่า การลูบไปและกลับส่งเสริมสำหรับผู้ที่มีผมยาว ส่วนผู้ที่ไม่มีผม หรือโกนผมแล้วผมขึ้นมานิดหน่อย ไม่ส่งเสริมให้ลูบกลับ เพราะไม่มีประโยชน์ ผู้แต่งเห็นว่าข้อนี้มีข้อพิจารณา ในแง่การใช้ได้นั้นชัดเจน แต่ในแง่การปฏิบัติตามซุนนะฮ์ ไม่ต้องสงสัยว่าการลูบไปและกลับเป็นสุนัต ซึ่งความหมายกว้างของหะดีษบ่งเช่นนั้น", "หลักเดิมคือ สตรีเหมือนผู้ชายในวิธีเช็ดศีรษะ เพราะหลักเดิมของหุก่มศาสนาคือ สิ่งที่ยืนยันสำหรับผู้ชายก็ใช้กับผู้หญิงด้วย และกลับกัน เว้นแต่มีหลักฐานเฉพาะ อัลบุคอรีย์ยกไว้แบบไม่มีสายว่า สะอีด บินอัลมุสัยยิบกล่าวว่า \"ผู้หญิงเหมือนผู้ชาย เช็ดศีรษะของนาง\"", "อันนะสาอีย์บันทึกในบทการเช็ดศีรษะของสตรี หะดีษอาอิชะฮ์ว่า \"นางวางมือที่ด้านหน้าศีรษะ แล้วเช็ดศีรษะครั้งเดียวไปถึงด้านหลัง\" (อัลอัลบานีย์ว่าสายรายงานศ่อฮีห์) ซึ่งแสดงวิธีเช็ดศีรษะของสตรีว่าเหมือนผู้ชายและทำครั้งเดียว และในมะสาอิลของอิมามอะห์มัด เขาถูกถามว่าสตรีเช็ดศีรษะอย่างไร เขาวางมือบนกลางศีรษะ ลากไปข้างหน้า แล้ววางที่เริ่ม แล้วลากไปข้างหลัง", "ผู้แต่งเห็นว่าวิธีในหะดีษอาอิชะฮ์ใกล้ซุนนะฮ์มากกว่าและสะดวก ส่วนผมเปีย ดูเหมือนไม่ต้องเช็ด เพราะการเช็ดเกี่ยวกับศีรษะ และศีรษะคือส่วนที่อยู่สูง ส่วนที่ห้อยลงมาจากที่ที่เป็นฟัรฎูไม่เรียกว่าศีรษะ และหะดีษระบุว่าเริ่มเช็ดที่หน้าผากและจบที่ท้ายทอย"]}], "tags_th": ["เช็ดศีรษะ", "วุฎูอ์", "สตรี", "ซุนนะฮ์"]}, {"id": "v1-h036", "volume": 1, "bab": "wudu", "topic_ar": "صفة مسح الأذنين", "topic_th": "วิธีเช็ดหู", "pages": [162, 165], "hadith": [{"no": 36, "matn_ar": "عَنْ عَبْدِ اللهِ بْنِ عَمْرٍو رَضِيَ اللهُ عَنْهُمَا - فِي صِفَةِ الْوُضُوءِ - قَالَ: ثُمَّ مَسَحَ ﷺ بِرَأْسِهِ، وَأَدْخَلَ إِصْبَعَيْهِ السَّبَّاحَتَيْنِ فِي أُذُنَيْهِ، وَمَسَحَ بِإِبْهَامَيْهِ ظَاهِرَ أُذُنَيْهِ. أَخْرَجَهُ أَبُو دَاوُدَ، وَالنَّسَائِيُّ، وَصَحَّحَهُ ابْنُ خُزَيْمَةَ.", "translation_th": "จากอับดุลลอฮ์ บินอัมร์ (ร.ฎ.) เกี่ยวกับวิธีอาบน้ำละหมาด กล่าวว่า แล้วท่านนบี ﷺ เช็ดศีรษะ และสอดนิ้วชี้ทั้งสองเข้าในหูทั้งสอง และใช้นิ้วโป้งทั้งสองเช็ดด้านนอกของหูทั้งสอง บันทึกโดยอบูดาวูดและอันนะสาอีย์ และอิบนุคุซัยมะฮ์ระบุว่าศ่อฮีห์", "grade_th": "หะซัน และขึ้นถึงระดับศ่อฮีห์ด้วยหลักฐานสนับสนุน"}], "key_rulings_th": ["หูเช็ด ไม่ต้องล้าง เพราะเป็นส่วนหนึ่งของศีรษะ ตามทัศนะของนักวิชาการส่วนใหญ่ทั้งยุคแรกและยุคหลัง", "วิธีเช็ดหู: สอดนิ้วชี้เข้าในรูหูเพื่อเช็ดด้านใน และใช้นิ้วโป้งเช็ดด้านนอก", "เช็ดด้วยนิ้วอื่นก็ใช้ได้ เพราะจุดประสงค์คือให้ทั่ว แต่ทำตามซุนนะฮ์ดีกว่า และไม่ต้องเช็ดส่วนที่ซ่อนอยู่ในรอยพับของใบหู", "การเพิ่มคำว่า \"หรือลด\" ในรายงานของอบูดาวูดไม่ถูกต้อง เพราะการล้างน้อยกว่าสามครั้งทำได้"], "vocab": [{"ar": "إِصْبَعَيْهِ", "th": "นิ้วทั้งสอง ในที่นี้หมายถึงปลายนิ้ว (เรียกทั้งหมดแต่หมายถึงบางส่วน)"}, {"ar": "السَّبَّاحَتَيْن", "th": "นิ้วชี้ทั้งสอง นิ้วระหว่างนิ้วโป้งกับนิ้วกลาง ได้ชื่อนี้เพราะใช้ชี้เมื่อรำลึกและสรรเสริญอัลลอฮ์"}, {"ar": "إِبْهَامَيْهِ", "th": "นิ้วโป้งทั้งสอง นิ้วใหญ่ที่สุดในห้านิ้วของมือและเท้า"}, {"ar": "صِمَاخ الْأُذُن", "th": "รูหู"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อับดุลลอฮ์ บินอัมร์ บินอัลอาศ บินวาอิล อัลกุร็อชีย์ อัสสะฮ์มีย์ เขาและบิดาอพยพก่อนการพิชิตมักกะฮ์ เขาเข้ารับอิสลามก่อนบิดา และอายุห่างจากบิดาเพียงสิบสองปี", "เขาเป็นผู้ทำอิบาดะฮ์มาก ในเศาะฮีหัยน์มีเรื่องที่ท่านนบี ﷺ ห้ามเขาละหมาดกลางคืนทั้งคืนและถือศีลอดทุกวัน แต่สั่งให้ถือศีลอดวันเว้นวัน และอ่านอัลกุรอานจบทุกสามวัน บางรายงานว่า เมื่อเขาแก่ตัวเขากล่าวว่า \"ฉันน่าจะรับข้อผ่อนปรนของท่านรสูลุลลอฮ์ ﷺ\"", "เขาจำหะดีษของท่านนบี ﷺ ได้มาก แต่มีผู้รายงานจากเขาไม่มากเท่าอบูฮุร็อยเราะฮ์ ทั้งที่อบูฮุร็อยเราะฮ์กล่าวว่า \"ไม่มีเศาะหาบะฮ์คนใดมีหะดีษมากกว่าฉัน นอกจากอับดุลลอฮ์ บินอัมร์ เพราะเขาเขียน แต่ฉันไม่เขียน\" (อัลบุคอรีย์) อาจเพราะเขาทำอิบาดะฮ์มากกว่าสอน หรืออยู่ที่อียิปต์หรือฏออิฟเป็นส่วนใหญ่หลังการพิชิตดินแดน ซึ่งผู้แสวงความรู้ไม่ได้เดินทางไปมากเท่ามะดีนะฮ์", "นักประวัติศาสตร์ต่างกันว่าเขาเสียชีวิตที่ไหนและเมื่อไร อิบนุหะญัรระบุหลายทัศนะ และรายงานจากอิมามอะห์มัดว่า เขาเสียชีวิตในคืนวันอัลหัรเราะฮ์ ปลายเดือนซุลหิจญะฮ์ ปี ฮ.ศ. 63"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["หะดีษนี้เป็นส่วนหนึ่งของหะดีษยาวเรื่องการอาบน้ำละหมาดของท่านนบี ﷺ อิบนุหะญัรยกเพียงส่วนนี้ เพราะแสดงการเช็ดหูและวิธีเช็ด ซึ่งหะดีษอุษมานไม่ได้กล่าวถึง", "อบูดาวูด (135) อันนะสาอีย์ อิบนุมาญะฮ์ อะห์มัด และอิบนุคุซัยมะฮ์บันทึกผ่านสายมูซา บินอบีอาอิชะฮ์ จากอัมร์ บินชุอัยบ์ จากบิดา จากปู่ ว่า ชายคนหนึ่งมาถามท่านนบี ﷺ ว่า โอ้ท่านรสูลุลลอฮ์ การชำระทำอย่างไร ท่านขอน้ำในภาชนะ ล้างฝ่ามือสามครั้ง ล้างหน้าสามครั้ง ล้างแขนสามครั้ง เช็ดศีรษะ สอดนิ้วชี้เข้าในหู ใช้นิ้วโป้งเช็ดด้านนอกหู และนิ้วชี้เช็ดด้านในหู แล้วล้างเท้าสามครั้ง แล้วกล่าวว่า \"อย่างนี้คือการอาบน้ำละหมาด ผู้ใดทำเกินหรือลดจากนี้ เขาได้ทำผิดและอธรรม\" (สำนวนของอบูดาวูด ส่วนของอันนะสาอีย์และอิบนุคุซัยมะฮ์สั้นกว่าและไม่มีส่วนที่เป็นหลักฐานในบทนี้)", "หะดีษนี้อยู่ในกลุ่มหะดีษของอัมร์ บินชุอัยบ์ จากบิดา จากปู่ บิดาของชุอัยบ์คือมุหัมมัด บินอับดุลลอฮ์ ซึ่งไม่มีรายงานจากบิดาของเขา ปู่ในที่นี้คืออับดุลลอฮ์ บินอัมร์ บินอัลอาศ อัซซะฮะบีย์ระบุว่าชุอัยบ์ได้ยินจากอับดุลลอฮ์ บินอัมร์จริง ซึ่งเป็นผู้เลี้ยงดูเขา นักวิชาการต่างกันเรื่องสายนี้ ทัศนะที่มีน้ำหนักที่สุดคือระดับหะซัน เว้นแต่ส่วนที่เป็นมุงกัร ซึ่งอาจมาจากผู้อื่น", "หะดีษนี้มีหลักฐานสนับสนุนจนขึ้นถึงระดับศ่อฮีห์ เช่น หะดีษอัลมิกดาม บินมะอ์ดีกะริบ: \"ฉันเห็นท่านรสูลุลลอฮ์ ﷺ อาบน้ำละหมาด ท่านเช็ดศีรษะ และเช็ดหูทั้งด้านนอกและด้านใน\" (อบูดาวูด อิบนุมาญะฮ์ อัลบัยฮะกีย์ สายรายงานหะซัน) หะดีษอัรรุบัยยิอ์ (อบูดาวูด) และหะดีษอิบนุอับบาส (อิบนุคุซัยมะฮ์): \"ท่านตักน้ำหนึ่งกอบ แล้วเช็ดศีรษะและด้านในและด้านนอกของหู และสอดนิ้วเข้าไปในหู\"", "ผู้แต่งเห็นว่าคำว่า \"หรือลด\" ในรายงานของอบูดาวูดไม่ถูกต้อง เพราะสิ่งที่ถูกตำหนิตามรูปคำคือการลดจากสามครั้ง ทั้งที่การลดจากสามครั้งในการล้างอวัยวะทำได้ และท่านนบี ﷺ เองก็ทำ แล้วจะเรียกว่า \"ทำผิดและอธรรม\" ได้อย่างไร อิบนุลมะวาก กล่าวว่า \"ถ้าคำนี้ไม่ใช่ความสงสัยของผู้รายงาน ก็เป็นความผิดพลาดที่ชัดเจน เพราะการอาบน้ำละหมาดครั้งเดียวและสองครั้งทำได้โดยไม่มีข้อขัดแย้ง และมีรายงานที่ศ่อฮีห์\""]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"สอดนิ้วทั้งสอง\" หมายถึงปลายนิ้ว เป็นการเรียกทั้งหมดแต่หมายถึงบางส่วน เหมือนอายะฮ์ \"พวกเขาเอานิ้วอุดหูของพวกเขา\" (อัลบะเกาะเราะฮ์: 19)", "\"นิ้วชี้ทั้งสอง\" (อัสสับบาหะตัยน์) คือนิ้วระหว่างนิ้วโป้งกับนิ้วกลาง ได้ชื่อนี้เพราะใช้ชี้เมื่อรำลึกและสรรเสริญอัลลอฮ์ \"นิ้วโป้งทั้งสอง\" คือนิ้วใหญ่ที่สุดในห้านิ้วของมือและเท้า"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "หูเช็ด ไม่ต้องล้าง", "points_th": ["หะดีษเป็นหลักฐานว่าศาสนาให้เช็ดหูในการอาบน้ำละหมาด และไม่ต้องล้าง เพราะหูเป็นส่วนหนึ่งของศีรษะ เป็นทัศนะของนักวิชาการส่วนใหญ่ทั้งยุคแรกและยุคหลัง ตามอายะฮ์ \"และจงเช็ดศีรษะของพวกเจ้า\" และหูเป็นส่วนหนึ่งของศีรษะ", "และตามรายงานแบบเมากูฟจากอิบนุอุมัรว่า \"หูทั้งสองเป็นส่วนหนึ่งของศีรษะ\" (อิบนุอบีชัยบะฮ์ อัดดารุกุฏนีย์) รายงานแบบมัรฟูอ์จากอิบนุอุมัรและเศาะหาบะฮ์หลายคนล้วนมีข้อบกพร่อง ตามที่อัดดารุกุฏนีย์ อัลบัยฮะกีย์ และอิบนุหัซม์ระบุ แต่บางท่านเห็นว่าสายต่าง ๆ รวมกันแล้วแข็งแรงขึ้น อิบนุหะญัรกล่าวว่า ผู้ที่พิจารณาสายทั้งหมดอย่างเป็นธรรมจะรู้ว่าหะดีษนี้มีที่มา และไม่ใช่หะดีษที่ควรทิ้ง"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "วิธีเช็ดหู และวิทยปัญญา", "points_th": ["หะดีษแสดงวิธีเช็ดหู คือ สอดนิ้วชี้ทั้งสองเข้าในรูหูเพื่อเช็ดด้านใน และใช้นิ้วโป้งเช็ดด้านนอก คือใบหูด้านนอก", "ถ้าเช็ดด้วยนิ้วอื่นที่ไม่ใช่นิ้วชี้ก็ใช้ได้ เพราะจุดประสงค์คือเช็ดให้ทั่ว แต่การทำตามซุนนะฮ์ดีกว่า เพื่อจะได้ผลบุญจากการตามแบบอย่างท่านนบี ﷺ อิบนุกุดามะฮ์กล่าวว่า \"ไม่จำเป็นต้องเช็ดส่วนที่ซ่อนอยู่ในรอยพับของใบหู เพราะแม้แต่ศีรษะซึ่งเป็นหลัก ก็ไม่จำเป็นต้องเช็ดส่วนที่ผมปิดไว้ หูยิ่งสมควรกว่า\"", "วิทยปัญญาที่ให้เช็ดหูทั้งด้านในและด้านนอก คือเพื่อชำระหู ให้บาปที่หูได้รับจากการฟังสิ่งที่ไม่อนุญาตหลุดออกไป เหมือนบาปที่หลุดออกจากอวัยวะอื่นของการอาบน้ำละหมาด", "หะดีษอุษมาน (มุสลิม): \"ผู้ใดอาบน้ำละหมาดอย่างดี บาปของเขาจะหลุดออกจากร่างกาย จนกระทั่งหลุดออกจากใต้เล็บ\" และหะดีษอบูอุมามะฮ์: \"เมื่อมุสลิมอาบน้ำละหมาด บาปของเขาจะหลุดออกจากหู ตา มือ และเท้า เมื่อเขานั่งลง เขาก็นั่งในสภาพที่ได้รับการอภัยแล้ว\" (อะห์มัด สายรายงานอ่อนเพราะชะฮ์ร์ บินเหาชับ แต่มีสายและหลักฐานสนับสนุนจนถึงระดับหะซัน)"]}], "tags_th": ["เช็ดหู", "วุฎูอ์", "เช็ดศีรษะ", "อัมร์ บินชุอัยบ์"]}, {"id": "v1-h037", "volume": 1, "bab": "wudu", "topic_ar": "مشروعية الاستنثار عند القيام من النوم", "topic_th": "การสั่งน้ำออกจากจมูกเมื่อตื่นนอน", "pages": [166, 168], "hadith": [{"no": 37, "matn_ar": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «إِذَا اسْتَيْقَظَ أَحَدُكُمْ مِنْ مَنَامِهِ فَلْيَسْتَنْثِرْ ثَلَاثًا، فَإِنَّ الشَّيْطَانَ يَبِيتُ عَلَى خَيْشُومِهِ». مُتَّفَقٌ عَلَيْهِ.", "translation_th": "จากอบูฮุร็อยเราะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"เมื่อผู้ใดในพวกท่านตื่นจากการนอน ก็ให้สั่งน้ำออกจากจมูกสามครั้ง เพราะชัยฏอนค้างคืนอยู่บนส่วนบนของจมูกของเขา\" บันทึกโดยอัลบุคอรีย์และมุสลิม", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["ผู้แต่งเห็นว่าการสั่งน้ำออกจากจมูกสามครั้งเมื่อตื่นจากการนอนกลางคืนเป็นวาญิบ เพราะเป็นคำสั่ง และหลักเดิมของคำสั่งคือวาญิบ (เป็นอีกรายงานจากอิมามอะห์มัด และทัศนะของอิบนุหัซม์) ส่วนนักวิชาการส่วนใหญ่ว่าเป็นสุนัต", "หะดีษเฉพาะการนอนกลางคืน เพราะคำว่า \"ค้างคืน\" ใช้กับกลางคืนเท่านั้น", "ถ้าตื่นแล้วไม่ได้อาบน้ำละหมาด ก็ยังทำได้ ถ้าทำไม่สะดวก การสั่งน้ำออกจากจมูกขณะอาบน้ำละหมาดก็ถือว่าเพียงพอ", "ผู้ศรัทธาต้องเชื่อและปฏิบัติตามสิ่งที่มาจากอัลลอฮ์และรสูล แม้ไม่รู้วิทยปัญญาหรือรายละเอียด"], "vocab": [{"ar": "مِنْ مَنَامِهِ", "th": "จากการนอนของเขา คำนี้ครอบคลุมทั้งกลางวันและกลางคืน แต่คำว่า \"ค้างคืน\" จำกัดไว้เฉพาะกลางคืน"}, {"ar": "فَلْيَسْتَنْثِرْ", "th": "ให้สั่งน้ำที่สูดเข้าไปออกจากจมูก"}, {"ar": "الْخَيْشُوم", "th": "ส่วนบนสุดด้านในของจมูก บางท่านว่าคือจมูก"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกในหมวดการเริ่มสร้าง บทลักษณะของอิบลีสและไพร่พล (3295) และมุสลิมในหมวดฏอฮาเราะฮ์ (238) ผ่านสายอีซา บินฏ็อลหะฮ์ จากอบูฮุร็อยเราะฮ์ สำนวนของอัลบุคอรีย์คือ \"เมื่อผู้ใดในพวกท่านตื่นจากการนอนแล้วอาบน้ำละหมาด ก็ให้สั่งน้ำออกจากจมูกสามครั้ง...\"", "การสั่งน้ำออกจากจมูกได้กล่าวไปแล้วในหะดีษอุษมาน อิบนุหะญัรอาจยกหะดีษนี้ไว้ที่นี่ เพราะมีคำสั่งของท่านนบี ﷺ ให้สั่งน้ำออกจากจมูก เนื่องจากเกี่ยวกับอวัยวะคือจมูก"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"จากการนอนของเขา\" เป็นคำนามเอกพจน์ที่เชื่อมกับคำอื่น จึงครอบคลุมการนอนทั้งกลางคืนและกลางวัน แต่คำว่า \"ค้างคืน\" จำกัดความหมายนี้ไว้ เพราะการค้างคืนเกิดขึ้นเฉพาะกลางคืน อัลกอมูสระบุว่า \"ผู้ใดอยู่ถึงกลางคืน ก็ถือว่าค้างคืนแล้ว\" ไม่ว่าจะนอนหรือไม่", "\"ก็ให้สั่งน้ำออกจากจมูก\" คือเอาน้ำที่สูดเข้าไปออกจากจมูก คำนี้มีประโยชน์มากกว่าคำว่า \"ให้สูดน้ำเข้าจมูก\" เพราะการสั่งออกต้องมีการสูดเข้าก่อนเสมอ แต่ไม่กลับกัน คนอาจสูดเข้าแต่ไม่สั่งออก และการสั่งออกเป็นส่วนที่ทำให้การสูดเข้าบรรลุประโยชน์ หะดีษอบูฮุร็อยเราะฮ์อีกบทหนึ่งว่า \"เมื่อผู้ใดในพวกท่านอาบน้ำละหมาด ให้เอาน้ำเข้าจมูกแล้วสั่งออก\"", "\"สามครั้ง\" คือสั่งออกสามครั้ง \"เพราะชัยฏอนค้างคืนอยู่บนส่วนบนของจมูก\" เป็นประโยคบอกเหตุผลของคำสั่ง ชัยฏอนในที่นี้หมายถึงชัยฏอนทั้งประเภท และ \"ค็อยชูม\" คือส่วนบนสุดด้านในของจมูก บางท่านว่าคือจมูก"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "สั่งน้ำออกจากจมูกเมื่อตื่นนอนเป็นวาญิบหรือไม่", "points_th": ["หะดีษเป็นหลักฐานว่าการสั่งน้ำออกจากจมูกสามครั้งเมื่อตื่นจากการนอนกลางคืนเป็นวาญิบ เพราะมาในรูปคำสั่ง และคำสั่งบ่งว่าเป็นวาญิบ", "รายงานของอัลบุคอรีย์จำกัดการสั่งน้ำออกนี้ไว้กับการอาบน้ำละหมาด ส่วนรายงานของมุสลิมไม่จำกัด จึงตีความได้สองทาง คือนำความหมายที่ไม่จำกัดไปตามความหมายที่จำกัด คำสั่งจึงเป็นตอนอาบน้ำละหมาด หรือปฏิบัติตามทั้งสองหะดีษ คือให้สั่งน้ำออกจากจมูกเมื่อตื่นนอน แม้จะไม่ใช่ตอนอาบน้ำละหมาด เช่น เพราะป่วยหรือไม่มีน้ำ แต่มีน้ำพอจะใช้สั่งน้ำออกจากจมูก ถ้าไม่สะดวก การสั่งน้ำออกขณะอาบน้ำละหมาดก็เพียงพอ เพราะได้ทำสิ่งที่ศาสนาสั่งแล้ว", "การสั่งน้ำออกจากจมูกสืบเนื่องจากการสูดน้ำเข้าจมูก ทัศนะว่าการสูดน้ำเข้าจมูกเป็นวาญิบเป็นอีกรายงานหนึ่งจากอิมามอะห์มัด และอิบนุหัซม์ก็เห็นเช่นนั้น ส่วนนักวิชาการส่วนใหญ่ว่าเป็นสุนัต", "ผู้แต่งเห็นว่าทัศนะแรก (วาญิบ) ชัดกว่า เพราะหลักเดิมของคำสั่งคือวาญิบ ไม่ใช่สุนัต จนกว่าจะมีหลักฐานเปลี่ยนความหมาย (จะกล่าวต่อไป อินชาอัลลอฮ์)"]}, {"wajh": 4, "type": "fawaid", "heading_ar": null, "heading_th": "ชัยฏอนค้างคืนบนจมูก และการยอมรับตัวบท", "points_th": ["หะดีษให้เหตุผลของคำสั่งว่า ชัยฏอนค้างคืนอยู่บนส่วนบนของจมูกมนุษย์ แต่ไม่ได้อธิบายว่าค้างทำไม และจมูกก็เป็นที่แคบ ไม่พอสำหรับร่างใหญ่ จึงรู้ได้ว่า ชัยฏอนมีการกระทำ สภาพ และรูปแบบต่าง ๆ ที่ไม่มีใครรู้นอกจากอัลลอฮ์ผู้ทรงสร้างพวกมันและทำให้พวกมันมีความสามารถ", "หน้าที่ของผู้ศรัทธาคือเชื่อ ปฏิบัติตาม และเชื่อฟังในทุกสิ่งที่มาจากพระผู้อภิบาลและที่ยืนยันจากท่านนบี ﷺ แม้ไม่รู้วิทยปัญญาและรายละเอียด เพราะเขาเป็นบ่าวผู้ถูกสั่ง และรู้แน่นอนว่าเขาจะถูกสั่งแต่สิ่งที่ดีและเป็นความสุขแก่เขา ถ้าวิทยปัญญาปรากฏแก่เขา ก็เป็นความรู้ที่เพิ่มเติม เป็นทางนำเพิ่มทางนำ และแสงสว่างเพิ่มแสงสว่าง ถ้าไม่ปรากฏ ก็พอใจกับความรู้ที่มี และปฏิบัติตามที่ตัวบทบ่งชี้"]}], "tags_th": ["สั่งน้ำออกจากจมูก", "ตื่นนอน", "ชัยฏอน", "วุฎูอ์", "วาญิบ"]}, {"id": "v1-h038", "volume": 1, "bab": "wudu", "topic_ar": "وجوب غسل كفي القائم من النوم قبل إدخالهما في الإناء", "topic_th": "ผู้ตื่นนอนต้องล้างฝ่ามือก่อนจุ่มลงภาชนะ", "pages": [169, 173], "hadith": [{"no": 38, "matn_ar": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «إِذَا اسْتَيْقَظَ أَحَدُكُمْ مِنْ نَوْمِهِ فَلَا يَغْمِسْ يَدَهُ فِي الْإِنَاءِ حَتَّى يَغْسِلَهَا ثَلَاثًا؛ فَإِنَّهُ لَا يَدْرِي أَيْنَ بَاتَتْ يَدُهُ». مُتَّفَقٌ عَلَيْهِ. وَهَذَا لَفْظُ مُسْلِمٍ.", "translation_th": "จากอบูฮุร็อยเราะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"เมื่อผู้ใดในพวกท่านตื่นจากการนอน ก็อย่าจุ่มมือลงในภาชนะ จนกว่าจะล้างมันสามครั้ง เพราะเขาไม่รู้ว่ามือของเขาค้างคืนอยู่ที่ใด\" บันทึกโดยอัลบุคอรีย์และมุสลิม และนี่คือสำนวนของมุสลิม", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["ผู้แต่งเห็นว่าการล้างมือสามครั้งก่อนจุ่มลงภาชนะหลังตื่นนอนเป็นวาญิบ (ทัศนะที่รู้จักในมัซฮับอะห์มัด) ส่วนนักวิชาการส่วนใหญ่ว่าเป็นสุนัต", "ผู้แต่งเห็นว่าใช้กับการนอนทั้งกลางคืนและกลางวัน (ทัศนะของอิสหาก บินรอฮะวัยฮ์ และอิบนุบาซ) แม้การนอนกลางคืนจะหนักแน่นกว่า", "ถ้าจุ่มมือก่อนล้าง น้ำยังคงสะอาดและใช้ชำระได้ตามทัศนะที่ถูกต้อง แต่ผู้จุ่มมีบาปถ้าถือว่าข้อห้ามเป็นหะรอม", "ถ้าแน่ใจว่ามือมีนะญิส ต้องล้างก่อนจุ่มโดยอิจญ์มาอ์", "ผู้แต่งเห็นว่าทัศนะที่ชัดกว่าคือล้างมือเสมอ แม้จะใช้น้ำจากบ่อ สระ หรือก๊อกน้ำ"], "vocab": [{"ar": "فَلَا يَغْمِسْ", "th": "อย่าจุ่ม (คำห้าม) ในรายงานของอัลบุคอรีย์ว่า \"ก็ให้ล้างมือ\" มือในที่นี้หมายถึงฝ่ามือ"}, {"ar": "الْإِنَاء", "th": "ภาชนะน้ำสำหรับอาบน้ำละหมาด รวมถึงภาชนะน้ำอาบน้ำด้วย ส่วนภาชนะอื่นส่งเสริมให้ล้างก่อน"}, {"ar": "لَا يَدْرِي أَيْنَ بَاتَتْ يَدُهُ", "th": "ไม่รู้ว่ามือของเขาอยู่ที่ใดขณะนอน จึงไม่แน่ใจว่ามือปลอดจากการสัมผัสสิ่งที่มีผลต่อน้ำ"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกในหมวดวุฎูอ์ (162) ผ่านสายมาลิก จากอบุซซินาด จากอัลอะอ์รอจญ์ จากอบูฮุร็อยเราะฮ์ และมุสลิมบันทึกจากหลายสาย ในหมวดฏอฮาเราะฮ์ (278) ผ่านอัลมุฆีเราะฮ์ บินอับดิรเราะห์มาน จากอบุซซินาด สำนวนในบุลูฆเป็นของมุสลิม ตามที่อิบนุหะญัรระบุ", "สำนวนของอัลบุคอรีย์คือ \"เมื่อผู้ใดในพวกท่านอาบน้ำละหมาด ให้เอาน้ำเข้าจมูกแล้วสั่งออก ผู้ใดชำระด้วยหินก็ให้ใช้จำนวนคี่ และเมื่อผู้ใดในพวกท่านตื่นจากการนอน ให้ล้างมือก่อนจะจุ่มลงในน้ำอาบน้ำละหมาด...\" จึงรวมความสะอาดและความรอบคอบสามแบบ อิบนุหะญัรเลือกสำนวนของมุสลิม เพราะแบบแรกกล่าวไปแล้ว แบบที่สองเกี่ยวกับการถ่ายทุกข์ และรายงานของมุสลิมระบุจำนวนครั้ง ซึ่งรายงานของอัลบุคอรีย์ไม่มี", "บริบทของอัลบุคอรีย์ทำให้ดูเหมือนเป็นหะดีษเดียว (ผ่านอับดุลลอฮ์ บินยูสุฟ จากมาลิก) แต่ในอัลมุวัฏเฏาะอ์ฉบับอัลลัยษีย์แยกเป็นสองหะดีษ มุสลิมก็เช่นกัน อัลบุคอรีย์จึงดูเหมือนเห็นว่ารวมสองหะดีษที่มีสายเดียวกันไว้ด้วยกันได้ และแยกหะดีษเดียวที่มีสองหุก่มได้"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"อย่าจุ่มมือ\" เป็นคำห้าม ในรายงานของอัลบุคอรีย์ว่า \"ก็ให้ล้างมือ\" มือในที่นี้คือฝ่ามือ ไม่ใช่ส่วนที่เกินกว่านั้น เพราะโดยปกติสิ่งที่สอดลงในภาชนะคือฝ่ามือ คำว่า \"อย่าจุ่ม\" ชัดกว่ารายงานของอัตติรมิซีย์ \"อย่าสอดมือลงในภาชนะ\" เพราะการสอดมือทั่วไปไม่เป็นมักรูฮ์ เช่น สอดมือลงในภาชนะใหญ่แล้วตักด้วยภาชนะเล็กโดยมือไม่โดนน้ำ", "\"ในภาชนะ\" หมายถึงภาชนะน้ำอาบน้ำละหมาด ดังรายงานของอัลบุคอรีย์ \"ก่อนจะจุ่มลงในน้ำอาบน้ำละหมาด\" ภาชนะน้ำอาบน้ำก็นับรวมด้วย เพราะเป็นวุฎูอ์และมากกว่า ส่วนภาชนะอื่นส่งเสริมให้ล้างก่อน โดยไม่มักรูฮ์ถ้าไม่ล้าง เพราะไม่มีข้อห้าม", "\"จนกว่าจะล้างมันสามครั้ง\" คือเทน้ำลงบนมือ ดังรายงานของอัลบัซซาร \"จนกว่าจะเทน้ำลงบนมัน\" ครั้งแรกขจัดสิ่งสกปรก ครั้งที่สองทำความสะอาด ครั้งที่สามเพื่อความสะอาดยิ่งขึ้น คำว่า \"จนกว่า\" บอกขอบเขตของข้อห้าม แสดงว่าตักน้ำได้หลังล้างมือแล้ว", "\"เพราะเขาไม่รู้ว่ามือของเขาค้างคืนอยู่ที่ใด\" คือไม่รู้ว่ามืออยู่ที่ใดขณะนอน เป็นเหตุผลของคำสั่งให้ล้างสามครั้ง หมายความว่ามือหลังตื่นนอนไม่แน่ใจว่าปลอดจากการสัมผัสสิ่งที่มีผลต่อน้ำ"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "ล้างมือหลังตื่นนอนเป็นวาญิบหรือสุนัต", "points_th": ["หะดีษเป็นหลักฐานห้ามจุ่มมือลงภาชนะหลังตื่นนอนจนกว่าจะล้างสามครั้ง ตามคำว่า \"อย่าจุ่มมือ\" และในรายงานของอัลบุคอรีย์ \"ก็ให้ล้างมือ\" คำสั่งหมายถึงวาญิบ และข้อห้ามหมายถึงหะรอม เว้นแต่มีหลักฐานเปลี่ยนความหมาย นี่เป็นทัศนะที่รู้จักในมัซฮับอิมามอะห์มัด", "นักวิชาการส่วนใหญ่ว่าการล้างไม่ใช่วาญิบ แต่เป็นสุนัต และข้อห้ามหมายถึงมักรูฮ์ เป็นอีกรายงานจากอะห์มัด เพราะอัลลอฮ์ตรัสว่า \"เมื่อพวกเจ้าลุกขึ้นไปละหมาด ก็จงล้างหน้าของพวกเจ้า\" (อัลมาอิดะฮ์: 6) สั่งให้อาบน้ำละหมาดโดยไม่ได้ให้ล้างฝ่ามือก่อน และผู้ตื่นนอนก็อยู่ในความหมายกว้างของอายะฮ์", "พวกเขาว่าหะดีษหมายถึงสุนัต เพราะเหตุผลที่ให้ไว้ คือ \"เพราะเขาไม่รู้ว่ามือของเขาค้างคืนอยู่ที่ใด\" ความสงสัยที่เกิดกับความสะอาดที่แน่นอนไม่มีผล เหมือนผู้ที่แน่ใจว่ามีความสะอาดแล้วสงสัยว่ามีฮะดัษ จึงแสดงว่าหมายถึงสุนัต", "ผู้แต่งเห็นว่าทัศนะแรก (วาญิบ) ชัดกว่า เพราะเหตุผลแข็งแรง ความหมายตามรูปคำของคำสั่งคือวาญิบ และไม่มีหลักฐานเปลี่ยนความหมาย ส่วนอายะฮ์พูดถึงการอาบน้ำละหมาดทั่วไป และคำสั่งให้ล้างมือมาในกรณีเฉพาะด้วยหลักฐานแยกต่างหาก จึงต้องปฏิบัติตาม", "ข้อขัดแย้งนี้อยู่ในกรณีที่ไม่แน่ใจว่ามือมีนะญิส ถ้าแน่ใจว่ามี เช่น เห็นรอยหรือได้กลิ่น ก็มีอิจญ์มาอ์ว่าต้องล้างก่อนจุ่มลงภาชนะ"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "เฉพาะการนอนกลางคืน หรือทุกการนอน", "points_th": ["ทัศนะที่หนึ่ง: ตามรูปคำ หุก่มนี้เฉพาะการตื่นจากการนอนกลางคืน เป็นทัศนะของอิมามอะห์มัด เพราะคำว่า \"มือของเขาค้างคืน\" และการค้างคืนเกิดเฉพาะกลางคืน เป็นการจำกัดความหมายกว้างด้วยเหตุผลที่ตัวบทระบุ และหะดีษอบูฮุร็อยเราะฮ์แบบมัรฟูอ์ก็มีคำว่า \"เมื่อผู้ใดในพวกท่านตื่นจากกลางคืน\" (อบูดาวูด อัตติรมิซีย์ว่าหะซันศ่อฮีห์)", "ทัศนะที่สอง: ไม่ต่างกันระหว่างการนอนกลางคืนและกลางวัน เพราะท่านนบี ﷺ กล่าวถึงการนอนโดยไม่จำกัด และเหตุผลก็ครอบคลุม แม้การนอนกลางคืนจะหนักแน่นกว่า คำว่า \"เพราะเขาไม่รู้ว่ามือของเขาค้างคืนอยู่ที่ใด\" กล่าวตามกรณีส่วนใหญ่ และสิ่งที่กล่าวตามกรณีส่วนใหญ่ไม่มีความหมายแฝงตามหลักอุศูล เป็นทัศนะของอิสหาก บินรอฮะวัยฮ์ และอิบนุบาซเลือก", "ผู้แต่งเห็นว่าทัศนะที่สองชัดกว่า อินชาอัลลอฮ์ เพราะเหตุผลแข็งแรง อัลค็อฏฏอบีย์กล่าวว่า หะดีษนี้มีความรู้ว่า การยึดสิ่งที่มั่นใจกว่าและการระมัดระวังในเรื่องอิบาดะฮ์ดีกว่า"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "วิทยปัญญาของการล้างมือ", "points_th": ["นักวิชาการต่างกันในวิทยปัญญาของคำสั่งให้ล้างมือเป็นสองทัศนะ ทัศนะที่หนึ่ง: วิทยปัญญาเข้าใจได้และเป็นรูปธรรม คือมือของผู้นอนเคลื่อนไปบนร่างกายโดยไม่รู้ตัว อาจไปสัมผัสที่ที่ยังไม่ได้ชำระด้วยน้ำ แล้วเปื้อนนะญิส อิบนุหะญัรยกคำของอัชชาฟิอีย์ว่า ชาวหิญาซชำระด้วยหิน และแผ่นดินของพวกเขาร้อน เมื่อนอนก็มีเหงื่อ มือจึงอาจไปโดนที่นั้น หรือโดนสิว เลือดสัตว์ หรือสิ่งสกปรกอื่น", "ทัศนะที่สอง: เป็นการปฏิบัติตามคำสั่ง (ตะอับบุด) ที่ไม่เข้าใจเหตุผล เพราะหุก่มไม่ได้ตั้งอยู่บนความสงสัย มือโดยหลักเดิมสะอาดแน่นอน ส่วนนะญิสระหว่างนอนเป็นเพียงความสงสัย จึงไม่ได้สั่งให้ล้างเพราะนะญิส คำสั่งจึงเป็นการตะอับบุด", "ผู้แต่งเห็นว่าเหตุผลนี้มีข้อพิจารณา เพราะศาสนาอาจถือสิ่งที่น่าจะเกิดเป็นเหมือนเหตุ เช่น ตัดสินว่าวุฎูอ์เสียเพราะการนอน มือแม้สะอาด แต่การเคลื่อนไปมาระหว่างนอนเกิดขึ้นจริง จึงไม่แปลกที่มันจะไปโดนที่ที่เป็นนะญิส", "ความต่างของสองทัศนะ: ผู้ที่แน่ใจว่ามือของเขาอยู่ที่ใด เช่น พันผ้าหรือใส่ถุงมือไว้แล้วตื่นขึ้นมาในสภาพเดิม ตามทัศนะว่ามีเหตุผลที่เป็นรูปธรรม หุก่มนี้ไม่ใช้กับเขา ส่วนตามทัศนะว่าเป็นตะอับบุด เขาต้องล้างเสมอ ไม่ว่าจะแน่ใจว่ามือสะอาดหรือสงสัย", "อิบนุตัยมียะฮ์เห็นว่าหะดีษนี้คล้ายกับเหตุผลของการสั่งน้ำออกจากจมูกว่าชัยฏอนค้างคืนอยู่บนจมูก จึงอาจหมายถึงสิ่งที่กลัวว่าชัยฏอนจะเล่นกับมือของคนและสัมผัสมัน ซึ่งอาจมีผลต่อคน เหตุผลนี้จึงเป็นเหตุผลที่มีผลและตัวบทยืนยันว่าควรพิจารณา"]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "ถ้าจุ่มมือก่อนล้าง น้ำเป็นอย่างไร", "points_th": ["ทัศนะที่ถูกต้องจากสองทัศนะคือ ถ้ามีผู้ฝ่าฝืนจุ่มมือลงในน้ำก่อนล้าง น้ำไม่เป็นนะญิส แต่ยังคงใช้ชำระได้ เป็นทัศนะของนักวิชาการส่วนใหญ่ และอีกรายงานจากอะห์มัด", "บางท่านว่าน้ำจะสะอาดแต่ใช้ชำระไม่ได้ ซึ่งเป็นมัซฮับหันบะลีย์ ถ้าน้ำน้อยกว่าสองกุลละฮ์ และมีรายงานจากอะห์มัดว่าน้ำเป็นนะญิส สองทัศนะนี้อ่อน", "ที่ถูกต้องคือทัศนะแรก น้ำยังใช้ชำระได้ เพราะท่านนบี ﷺ ห้ามจุ่มมือ ไม่ได้กล่าวถึงน้ำ เมื่อน้ำนี้ใช้ชำระได้ ซึ่งเป็นสิ่งแน่นอน ความแน่นอนจะหมดไปได้ด้วยความแน่นอนเท่านั้น ไม่ใช่ด้วยความสงสัย หลักเดิมจึงคือความสะอาด แต่ถ้าถือว่าข้อห้ามในหะดีษเป็นหะรอม ผู้จุ่มมือมีบาปเพราะฝ่าฝืน ถ้าถือว่าเป็นมักรูฮ์ ก็ไม่มีบาป ส่วนน้ำคงอยู่ตามหลักเดิม"]}, {"wajh": 7, "type": "fiqh", "heading_ar": null, "heading_th": "บ่อ สระ และก๊อกน้ำ", "points_th": ["นักวิชาการบางท่านเข้าใจจากคำว่า \"อย่าจุ่มมือลงในภาชนะ\" ว่าบ่อและสระไม่อยู่ในข้อห้ามนี้ เพราะการจุ่มมือไม่ทำให้มันเสีย (ตามทัศนะว่าน้ำเสีย) เนื่องจากไม่มีข้อห้ามในเรื่องนี้ ก๊อกน้ำในปัจจุบันก็เช่นกัน เพราะผู้อาบน้ำละหมาดไม่ต้องตักน้ำ หุก่มจึงไม่ครอบคลุม", "ผู้แต่งเห็นว่าข้อนี้มีข้อพิจารณา เพราะมือแม้ไม่ได้จุ่มลงน้ำ แต่เป็นตัวพาน้ำ และเมื่อต้องทำความสะอาดมือก่อนจุ่มลงภาชนะ ก็ต้องทำความสะอาดก่อนจะใช้มันพาน้ำไปบ้วนปากและสูดเข้าจมูก ทัศนะที่ให้ล้างมือเสมอจึงชัดกว่า อินชาอัลลอฮ์"]}], "tags_th": ["ล้างมือ", "ตื่นนอน", "ภาชนะ", "วุฎูอ์", "ตะอับบุด"]}, {"id": "v1-h039", "volume": 1, "bab": "wudu", "topic_ar": "بيان شيء من صفات الوضوء", "topic_th": "อธิบายลักษณะบางประการของการอาบน้ำละหมาด", "pages": [174, 181], "hadith": [{"no": 39, "matn_ar": "عَنْ لَقِيطِ بْنِ صَبِرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «أَسْبِغِ الْوُضُوءَ، وَخَلِّلْ بَيْنَ الْأَصَابِعِ، وَبَالِغْ فِي الِاسْتِنْشَاقِ، إِلَّا أَنْ تَكُونَ صَائِمًا». أَخْرَجَهُ الْأَرْبَعَةُ، وَصَحَّحَهُ ابْنُ خُزَيْمَةَ. وَلِأَبِي دَاوُدَ فِي رِوَايَةٍ: «إِذَا تَوَضَّأْتَ فَمَضْمِضْ».", "translation_th": "จากละกีฏ บินศ็อบิเราะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"จงอาบน้ำละหมาดให้ทั่วถึง จงสางระหว่างนิ้ว และจงสูดน้ำเข้าจมูกให้ลึก เว้นแต่ท่านถือศีลอด\" บันทึกโดยนักบันทึกทั้งสี่ และอิบนุคุซัยมะฮ์ระบุว่าศ่อฮีห์ และในอีกรายงานของอบูดาวูด: \"เมื่อท่านอาบน้ำละหมาด ก็จงบ้วนปาก\"", "grade_th": "ศ่อฮีห์ (อิบนุหะญัร อิบนุคุซัยมะฮ์) อัตติรมิซีย์ว่าหะซันศ่อฮีห์"}], "key_rulings_th": ["การอาบน้ำละหมาดให้ทั่วถึงมีสองระดับ ระดับวาญิบคือล้างให้ทั่วอวัยวะ ระดับสุนัตคือล้างครั้งที่สองและสาม", "ผู้แต่งเห็นว่า ถ้าน้ำเข้าไม่ถึงระหว่างนิ้วนอกจากต้องสาง การสางนิ้วเป็นวาญิบ ถ้าน้ำมากจนเข้าถึงเองก็เป็นสุนัต", "ส่งเสริมให้สูดน้ำเข้าจมูกให้ลึก ยกเว้นผู้ถือศีลอด เพราะน้ำอาจเข้าคอทำให้เสียศีลอด และการบ้วนปากก็เช่นกัน", "ผู้แต่งเห็นว่าการบ้วนปากและสูดน้ำเข้าจมูกเป็นวาญิบในการอาบน้ำละหมาด (มัซฮับอิมามอะห์มัด)", "หะดีษเป็นหลักฐานของหลักสัดดุซซะรีอะฮ์ (ปิดช่องทางสู่สิ่งต้องห้าม) และหลัก \"การป้องกันความเสียหายมาก่อนการแสวงหาประโยชน์\""], "vocab": [{"ar": "أَسْبِغِ الْوُضُوءَ", "th": "อาบน้ำละหมาดให้ทั่วถึงและสมบูรณ์ ให้แต่ละอวัยวะได้รับสิทธิ์ครบ มาจาก دِرْعٌ سَابِغَةٌ คือเสื้อเกราะยาวคลุมทั้งตัว"}, {"ar": "خَلِّلْ بَيْنَ الْأَصَابِعِ", "th": "สางระหว่างนิ้ว คือให้น้ำเข้าไประหว่างนิ้วมือและนิ้วเท้า"}, {"ar": "بَالِغْ فِي الِاسْتِنْشَاقِ", "th": "พยายามให้น้ำเข้าไปถึงส่วนลึกสุดของจมูก"}, {"ar": "إِلَّا أَنْ تَكُونَ صَائِمًا", "th": "เว้นแต่ท่านถือศีลอด ก็อย่าสูดลึก เพราะเกรงน้ำจะลงคอทำให้เสียศีลอด"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["ละกีฏ บินศ็อบิเราะฮ์ บินอับดิลลาฮ์ บินอัลมุนตะฟิก อบูเราะซีน เศาะหาบะฮ์ที่มีชื่อเสียง นับอยู่ในชาวฏออิฟ ผู้ที่รายงานจากเขาคือ อาศิมลูกชายของเขา อิบนุอุมัร อัมร์ บินเอาส์ และคนอื่น ๆ"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อบูดาวูดบันทึกแบบยาวในหมวดฏอฮาเราะฮ์ บทการสั่งน้ำออกจากจมูก (142) อัตติรมิซีย์ (38) อันนะสาอีย์ อิบนุมาญะฮ์ (448) และอิบนุคุซัยมะฮ์บันทึกแบบย่อ ทั้งหมดผ่านยะห์ยา บินสุลัยม์ จากอิสมาอีล บินกะษีร จากอาศิม บินละกีฏ จากบิดา ว่า เขาเป็นตัวแทนของบนีอัลมุนตะฟิกที่มาหาท่านรสูลุลลอฮ์ ﷺ แล้วถามว่า โอ้ท่านรสูลุลลอฮ์ บอกฉันเรื่องการอาบน้ำละหมาด ท่านตอบว่า \"จงอาบน้ำละหมาดให้ทั่วถึง...\"", "อัตติรมิซีย์ว่าหะซันศ่อฮีห์ อิบนุหะญัรว่าศ่อฮีห์ อิบนุลก็อฏฏอนก็ว่าศ่อฮีห์ และอัลบะเฆาะวีย์จัดไว้ในกลุ่มหะดีษหะซันตามศัพท์ของเขา ยะห์ยา บินสุลัยม์ อิบนุมะอีนว่าเชื่อถือได้ อันนะสาอีย์ว่าไม่เป็นไร อิบนุหะญัรว่า \"สัจจริงแต่ความจำไม่ดี\" ส่วนอิสมาอีลและอาศิมเชื่อถือได้", "ถ้าถามว่าชายคนนั้นถามเรื่องการอาบน้ำละหมาด แต่ท่านนบี ﷺ ตอบเรื่องสุนัตบางอย่าง คำตอบคือ ผู้ถามรู้หลักของการอาบน้ำละหมาดอยู่แล้ว และดูเหมือนเขาไม่ได้ถามเรื่องส่วนที่เห็นชัด แต่ถามเรื่องที่ซ่อนอยู่ เช่น ในจมูกและระหว่างนิ้ว เพราะคำว่า \"จงทำให้ทั่วถึง\" ใช้กับผู้ที่รู้วิธีอาบน้ำละหมาดแล้ว", "รายงานที่สอง (การบ้วนปาก) อบูดาวูดบันทึก (143, 144) ผ่านอิบนุญุร็อยจญ์ จากอิสมาอีล บินกะษีร อัลบัยฮะกีย์ก็บันทึก สายรายงานศ่อฮีห์ตามที่อิบนุหะญัรกล่าว แต่คำว่าบ้วนปากไม่ได้มีในรายงานของผู้รายงานคนอื่นทั้งหมด และอบูดาวูดยกไว้แยกจากหะดีษ นักนิติศาสตร์บางท่านจึงไม่ได้สังเกต และปฏิเสธว่ามีคำสั่งให้บ้วนปากในหะดีษ เช่น อิบนุหัซม์ที่ว่าการบ้วนปากไม่ใช่วาญิบ เพราะไม่มีคำสั่งที่ถูกต้องจากท่านนบี ﷺ อิบนุอับดิลบัรร์และอิบนุรุชด์ก็กล่าวเช่นกัน", "ผู้แต่งเห็นว่าอิบนุหะญัรนำรายงานนี้มา แม้การบ้วนปากจะกล่าวแล้วในหะดีษอุษมาน เพราะรายงานนี้มีคำสั่งให้บ้วนปาก ส่วนที่ผ่านมาเป็นเพียงการกระทำ"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"จงอาบน้ำละหมาดให้ทั่วถึง\" (อัสบิฆ) คือทำให้สมบูรณ์ ให้ทุกอวัยวะได้รับสิทธิ์ครบ มาจาก \"เสื้อเกราะซาบิเฆาะฮ์\" คือเสื้อเกราะยาวคลุมร่าง ดังอายะฮ์ \"และพระองค์ทรงประทานความโปรดปรานแก่พวกเจ้าอย่างครบถ้วน\" (ลุกมาน: 20)", "\"จงสางระหว่างนิ้ว\" การสางคือแยกนิ้วมือและนิ้วเท้าขณะอาบน้ำละหมาด ให้น้ำเข้าไประหว่างนิ้ว นิ้วในที่นี้คือทั้งนิ้วมือและนิ้วเท้า ตามหะดีษอิบนุอับบาส: \"เมื่อท่านอาบน้ำละหมาด จงสางระหว่างนิ้วมือและนิ้วเท้า\" (อัตติรมิซีย์ อิบนุมาญะฮ์ อัลบุคอรีย์ว่าหะซัน)", "หะดีษอัลมุสเตาริด บินชัดดาด อธิบายวิธีสาง: \"ฉันเห็นท่านนบี ﷺ เมื่ออาบน้ำละหมาด ท่านใช้นิ้วก้อยถูระหว่างนิ้วเท้า\" (ในสายมีอิบนุละฮีอะฮ์ และมีผู้วิจารณ์) ดูเหมือนหมายถึงนิ้วก้อยมือซ้าย เพราะการสางเป็นการชำระสิ่งสกปรก ซึ่งศาสนาให้ใช้มือซ้าย ส่วนนิ้วมือ วิธีที่สมบูรณ์คือวางฝ่ามือขวาบนหลังมือซ้าย แล้วสอดนิ้วเข้าหากัน", "\"จงสูดน้ำเข้าจมูกให้ลึก\" คือพยายามให้น้ำถึงส่วนลึกสุดของจมูก \"เว้นแต่ท่านถือศีลอด\" ก็อย่าสูดลึก เพราะเกรงน้ำจะลงคอแล้วทำให้เสียศีลอด"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "ทำให้ทั่วถึง: วาญิบและสุนัต", "points_th": ["หะดีษสั่งให้อาบน้ำละหมาดให้ทั่วถึง ซึ่งมีสองแบบ (1) ทั่วถึงระดับวาญิบ คือสิ่งที่วุฎูอ์จะสมบูรณ์ไม่ได้ถ้าขาด หมายถึงล้างให้ทั่วอวัยวะ (2) ทั่วถึงระดับสุนัต คือสิ่งที่วุฎูอ์สมบูรณ์ได้โดยไม่ต้องมี หมายถึงส่วนที่เกินวาญิบ คือการล้างครั้งที่สองและสาม", "หลักฐานที่เปลี่ยนคำสั่งจากวาญิบเป็นสุนัตคืออายะฮ์ \"จงล้างหน้าของพวกเจ้า\" (อัลมาอิดะฮ์: 6) ซึ่งสั่งให้ล้างโดยไม่กำหนดจำนวน จึงใช้ได้ทั้งผู้ที่ล้างครั้งที่สองและสาม และผู้ที่ล้างครั้งเดียว คำสั่งในหะดีษจึงครอบคลุมทั้งวาญิบและสุนัต ซึ่งตั้งอยู่บนทัศนะว่าคำที่มีสองความหมายใช้ทั้งสองความหมายได้พร้อมกัน", "ผู้ที่ไม่ยอมรับการใช้คำหนึ่งในสองความหมายพร้อมกันเห็นว่า หะดีษหมายถึงความหมายที่สอง คือส่วนที่เกินจากการล้างที่เป็นวาญิบ ตามหะดีษอบูฮุร็อยเราะฮ์ (มุสลิม): \"ให้ฉันบอกสิ่งที่อัลลอฮ์จะลบล้างความผิดและยกระดับให้ไหม... คือการอาบน้ำละหมาดให้ทั่วถึงในยามที่ลำบาก การเดินไปมัสยิดมาก ๆ และการรอละหมาดหลังละหมาด นั่นแหละคือการเฝ้าระวัง (ริบาฏ)\" ท่านนบี ﷺ ยกย่องผู้ที่อาบน้ำละหมาดให้ทั่วถึง ซึ่งย่อมหมายถึงส่วนที่เกินระดับที่ใช้ได้"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "การสางนิ้ว", "points_th": ["ตามรูปคำ หะดีษบ่งว่าการสางนิ้วเป็นวาญิบ เป็นทัศนะของมาลิกีย์ แต่พวกเขาต่างกันว่าวาญิบทั้งนิ้วมือและนิ้วเท้า หรือวาญิบที่นิ้วมือและสุนัตที่นิ้วเท้า เพราะนิ้วเท้าชิดกันเหมือนอวัยวะเดียว ส่วนนิ้วมือแยกกัน จึงถือแต่ละนิ้วเป็นอวัยวะแยก", "นักวิชาการส่วนใหญ่ว่าการสางนิ้วเป็นสุนัต ไม่ใช่วาญิบ ถ้าน้ำเข้าถึงระหว่างนิ้ว แต่ถ้าน้ำเข้าไม่ถึงนอกจากต้องสาง ก็เป็นวาญิบโดยมติเอกฉันท์ หลักฐานคืออายะฮ์ \"จงล้างหน้าของพวกเจ้า...\" อัลลอฮ์สั่งให้ล้าง ซึ่งเพียงแค่น้ำถึงผิวโดยไม่ต้องสางก็ถือว่าล้างแล้ว การสางจึงเป็นสิ่งที่เพิ่มขึ้น ต้องมีหลักฐานชัดเจนจึงเป็นวาญิบ คำสั่งในหะดีษละกีฏจึงเป็นสุนัต และผู้ที่อธิบายการอาบน้ำละหมาดของท่านนบี ﷺ ทุกคนไม่ได้กล่าวถึงการสาง", "อิบนุลก็อยยิมกล่าวว่า การสางนิ้วก็ไม่ได้ทำเป็นประจำเช่นกัน ส่วนหะดีษอัลมุสเตาริด ถ้าถูกต้องก็หมายความว่าท่านทำบางครั้ง ผู้ที่ใส่ใจบันทึกการอาบน้ำละหมาดของท่าน เช่น อุษมาน อะลี อับดุลลอฮ์ บินซัยด์ และอัรรุบัยยิอ์ จึงไม่ได้รายงานไว้ อีกทั้งในสายมีอับดุลลอฮ์ บินละฮีอะฮ์", "ผู้แต่งเห็นว่า ทัศนะที่ชัดคือ ถ้าน้ำจะถึงระหว่างนิ้วได้ก็ต่อเมื่อสาง เช่น น้ำน้อย การสางเป็นวาญิบ เพราะอัลลอฮ์สั่งให้ล้าง และจะล้างครบไม่ได้นอกจากด้วยการสาง สิ่งที่วาญิบจะสมบูรณ์ไม่ได้ถ้าขาด ก็เป็นวาญิบด้วย แต่ถ้าน้ำมากจนเข้าถึงระหว่างนิ้วโดยไม่ต้องสาง ก็เป็นสุนัต ไม่ใช่วาญิบ"]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "สูดน้ำลึก ยกเว้นผู้ถือศีลอด", "points_th": ["หะดีษเป็นหลักฐานว่าส่งเสริมให้สูดน้ำเข้าจมูกให้ลึก ยกเว้นผู้ถือศีลอด ซึ่งไม่ส่งเสริม เพื่อไม่ให้น้ำผ่านจมูกลงคอแล้วทำให้เสียศีลอด การบ้วนปากก็นับรวมกับการสูดน้ำเข้าจมูกด้วย ผู้ถือศีลอดจึงต้องระวังทั้งสองอย่าง ที่ระบุเฉพาะการสูดน้ำเข้าจมูก เพราะคนควบคุมการบ้วนปากได้ดีกว่า จึงไม่มีอะไรลงท้อง", "สิ่งที่บ่งว่าคำสั่งนี้ไม่ใช่วาญิบคือ ถ้าการสูดลึกเป็นวาญิบ ก็คงไม่ถูกห้ามเพราะการถือศีลอด"]}, {"wajh": 7, "type": "fiqh", "heading_ar": null, "heading_th": "บ้วนปากและสูดน้ำเข้าจมูกเป็นวาญิบหรือไม่", "points_th": ["ทัศนะที่หนึ่ง: วาญิบในการอาบน้ำละหมาด เพราะคำว่า \"จงสูดน้ำเข้าจมูกให้ลึก\" และคำสั่งให้สูดน้ำที่กล่าวไปแล้ว และคำว่า \"เมื่อท่านอาบน้ำละหมาด ก็จงบ้วนปาก\" ซึ่งเป็นคำสั่ง และคำสั่งบ่งว่าเป็นวาญิบ เป็นมัซฮับอิมามอะห์มัด และทัศนะของอิบนุลมุบาร็อก อิบนุอบีลัยลา และอิสหาก บินรอฮะวัยฮ์", "ทัศนะที่สอง: เป็นสุนัตในการอาบน้ำละหมาด ผู้ที่ละไว้ วุฎูอ์ของเขาใช้ได้ เป็นทัศนะของอบูหะนีฟะฮ์ มาลิก อัชชาฟิอีย์ และอีกรายงานจากอะห์มัด อิบนุลมุนซิรเลือก และอะฏออ์กลับมาเห็นเช่นนี้ หลักฐานคืออายะฮ์อัลมาอิดะฮ์ \"จงล้างหน้าของพวกเจ้า\" อัลลอฮ์สั่งให้ล้างหน้า ซึ่งคือส่วนที่เผชิญหน้า ไม่รวมด้านในคือปากและจมูก และท่านนบี ﷺ กล่าวว่า \"สิบอย่างเป็นฟิฏเราะฮ์\" และระบุการบ้วนปากและสูดน้ำเข้าจมูกในนั้น (มุสลิม) ฟิฏเราะฮ์คือซุนนะฮ์ พวกเขาว่าหะดีษที่สั่งให้ทำหมายถึงสุนัต เพราะถ้าเป็นวาญิบจะขัดกับอายะฮ์ ซึ่งมีไว้เพื่อวางหลักของหุก่มนี้", "ทัศนะที่สาม: การสูดน้ำเข้าจมูกเป็นวาญิบ การบ้วนปากเป็นสุนัต เป็นทัศนะของนักวิชาการซอฮิรียะฮ์กลุ่มหนึ่ง เช่น อิบนุหัซม์ ทัศนะของอบูเษาร์ และอีกรายงานจากอะห์มัด เพราะการสูดน้ำเข้าจมูกมีทั้งการกระทำและคำสั่งของท่านนบี ﷺ ส่วนการบ้วนปากมีแต่การกระทำ ไม่มีคำสั่ง", "ผู้แต่งเห็นว่าทัศนะที่มีน้ำหนักคือทัศนะแรก เพราะหลักฐานแข็งแรง คือหะดีษในบทนี้ และทุกคนที่อธิบายการอาบน้ำละหมาดของท่านนบี ﷺ อย่างละเอียด ล้วนระบุว่าท่านบ้วนปาก สูดน้ำเข้าจมูก และสั่งน้ำออก การทำเป็นประจำบ่งว่าเป็นวาญิบ เพราะการกระทำของท่านคือการอธิบายวุฎูอ์ที่อัลลอฮ์สั่งไว้ในคัมภีร์ ท่านคือผู้อธิบายความหมายของอัลลอฮ์ และท่านแสดงว่าคำว่า \"จงล้างหน้า\" รวมการบ้วนปากและสูดน้ำเข้าจมูกพร้อมกับการล้างหน้าส่วนอื่น จึงไม่ขัดกัน", "อิบนุลก็อยยิมกล่าวว่า \"ท่านนบี ﷺ ไม่เคยอาบน้ำละหมาดโดยไม่บ้วนปากและสูดน้ำเข้าจมูก และไม่มีรายงานว่าท่านละเว้นแม้แต่ครั้งเดียว\" ส่วนการที่ทั้งสองเป็นฟิฏเราะฮ์ไม่ได้ปฏิเสธความเป็นวาญิบ เพราะฟิฏเราะฮ์รวมทั้งวาญิบและสุนัต และในฟิฏเราะฮ์ก็มีการขลิบ ซึ่งเป็นวาญิบ", "ส่วนทัศนะที่สามที่ว่าไม่มีคำสั่งให้บ้วนปาก อาจเพราะพวกเขาไม่ได้สังเกตรายงานของอบูดาวูด หรือไม่ถือว่ารายงานนั้นศ่อฮีห์ และการแยกการบ้วนปากกับการสูดน้ำเข้าจมูกใช้ไม่ได้ เพราะท่านนบี ﷺ ทำทั้งสองอย่างคู่กันเสมอ"]}, {"wajh": 8, "type": "fawaid", "heading_ar": null, "heading_th": "หลักการปิดช่องทาง (สัดดุซซะรอเอียะอ์)", "points_th": ["นักวิชาการใช้หะดีษนี้เป็นหลักฐานของหลักการปิดช่องทาง (ซะรีอะฮ์ คือการกระทำที่ภายนอกอนุญาต แต่เป็นสื่อไปสู่สิ่งหะรอม) เพราะท่านนบี ﷺ ห้ามสูดน้ำลึกเมื่อถือศีลอด ทั้งที่การสูดน้ำเข้าจมูกเป็นสิ่งที่ศาสนาให้ทำในการอาบน้ำละหมาด แต่การสูดลึกอาจทำให้เสียศีลอด จึงได้ว่า ผู้ถือศีลอดควรเลี่ยงทุกสิ่งที่อาจทำให้ศีลอดเสีย แม้เป็นเพียงความเป็นไปได้", "หลักการปิดช่องทางเป็นมัซฮับของมาลิกีย์และหันบะลีย์ ส่วนอบูหะนีฟะฮ์และอัชชาฟิอีย์ไม่ถือเป็นหลักที่ใช้ตัดสินหุก่ม (รายละเอียดอยู่ในตำราอุศูล) แต่ผู้แต่งเห็นว่าหลักการปิดช่องทางคือสิ่งที่ตัวบทอัลกุรอานและซุนนะฮ์บ่งชี้ เช่น อายะฮ์ \"และพวกเจ้าอย่าด่าว่าบรรดาสิ่งที่พวกเขาเคารพบูชานอกจากอัลลอฮ์ เพราะพวกเขาจะด่าว่าอัลลอฮ์ด้วยความเป็นศัตรูโดยไม่รู้\" (อัลอันอาม: 108) อัลลอฮ์ทรงห้ามด่าว่าพระเจ้าของพวกมุชริก ทั้งที่เป็นการปกป้องอัลลอฮ์ เพราะเป็นช่องทางให้พวกเขาด่าว่าอัลลอฮ์", "และจากซุนนะฮ์ ท่านนบี ﷺ ห้ามแต่งงานกับหญิงพร้อมกับป้าหรือน้าของนาง เพราะเป็นช่องทางสู่การตัดสัมพันธ์เครือญาติที่หะรอม"]}, {"wajh": 9, "type": "fawaid", "heading_ar": null, "heading_th": "ป้องกันความเสียหายก่อนแสวงหาประโยชน์", "points_th": ["หะดีษเป็นหลักฐานของหลักนิติศาสตร์ \"การป้องกันความเสียหายมาก่อนการแสวงหาประโยชน์\" คือเมื่อต้องเลือกระหว่างป้องกันความเสียหายกับได้ประโยชน์ การป้องกันความเสียหายมาก่อน การสูดน้ำลึกมีประโยชน์ คือได้ทำตามคำสั่งของศาสนา ซึ่งเป็นประโยชน์ทางศาสนาที่ได้ผลบุญ และจมูกสะอาด แต่ประโยชน์นี้ตกไปเมื่อเทียบกับความเสียหาย คือศีลอดเสีย"]}], "tags_th": ["วุฎูอ์", "สางนิ้ว", "สูดน้ำเข้าจมูก", "บ้วนปาก", "สัดดุซซะรีอะฮ์"]}, {"id": "v1-h040", "volume": 1, "bab": "wudu", "topic_ar": "حكم تخليل اللحية في الوضوء", "topic_th": "หุก่มการสางเคราเมื่ออาบน้ำละหมาด", "pages": [182, 184], "hadith": [{"no": 40, "matn_ar": "عَنْ عُثْمَانَ رَضِيَ اللهُ عَنْهُ أَنَّ النَّبِيَّ ﷺ كَانَ يُخَلِّلُ لِحْيَتَهُ فِي الْوُضُوءِ. أَخْرَجَهُ التِّرْمِذِيُّ، وَصَحَّحَهُ ابْنُ خُزَيْمَةَ.", "translation_th": "จากอุษมาน (ร.ฎ.) ว่า ท่านนบี ﷺ เคยสางเคราของท่านเมื่ออาบน้ำละหมาด บันทึกโดยอัตติรมิซีย์ และอิบนุคุซัยมะฮ์ระบุว่าศ่อฮีห์", "grade_th": "อัตติรมิซีย์ว่าหะซันศ่อฮีห์ (อาจเพราะหลักฐานสนับสนุน) สายรายงานมีผู้ถูกวิจารณ์"}], "key_rulings_th": ["การสางเคราที่หนาจนปิดผิวหนังเป็นสุนัตในการอาบน้ำละหมาด ท่านนบี ﷺ ทำบางครั้ง ไม่ได้ทำเป็นประจำ", "เคราบางที่ไม่ปิดผิวหนัง ต้องล้างทั้งเคราและผิวหนังข้างใต้ เพราะถือเป็นส่วนของใบหน้า", "วิธีสาง: ตักน้ำหนึ่งกอบแล้วสางด้วยนิ้วเหมือนหวี หรือตักน้ำหนึ่งกอบใส่ใต้เคราแล้วสาง", "สิ่งที่ไม่ใช่วาญิบ ควรทำบ้างละบ้าง เพื่อให้คนอื่นรู้ว่าไม่ใช่วาญิบ"], "vocab": [{"ar": "يُخَلِّلُ", "th": "สาง คือสอดนิ้วเข้าไปในเคราขณะล้าง ให้น้ำถึงโคนขน"}, {"ar": "اللِّحْيَة", "th": "อ่านสระอิ เครา คือขนที่ขึ้นบนกระดูกขากรรไกรทั้งสองข้างและบนคาง"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัตติรมิซีย์บันทึกในหมวดฏอฮาเราะฮ์ บทการสางเครา (31) และอิบนุคุซัยมะฮ์ ผ่านสายอามิร บินชะกีก จากอบูวาอิล ชะกีก บินสะละมะฮ์ จากอุษมาน สำนวนนี้เป็นของอัตติรมิซีย์ ซึ่งกล่าวว่า \"หะซันศ่อฮีห์\"", "ผู้แต่งเห็นว่าอัตติรมิซีย์อาจว่าศ่อฮีห์เพราะหลักฐานสนับสนุน เพราะอามิร บินชะกีกถูกวิจารณ์ อิบนุมะอีนว่าอ่อน อบูหาติมว่า \"ไม่แข็งแรง\" อันนะสาอีย์ว่า \"ไม่เป็นไร\" อิบนุหิบบานใส่ไว้ในรายชื่อผู้เชื่อถือได้ และชุอ์บะฮ์ (ผู้รายงานจากผู้เชื่อถือได้เท่านั้น) รายงานจากเขา หะดีษของคนลักษณะนี้อาจเป็นหะซัน แต่ที่เป็นปัญหาคือ เขารายงานขัดกับผู้รายงานหะดีษอุษมานทุกคน ซึ่งไม่ได้กล่าวถึงการสางเครา", "อัตติรมิซีย์ยกคำของอัลบุคอรีย์ว่า \"สิ่งที่ถูกต้องที่สุดเรื่องการสางเคราสำหรับฉันคือหะดีษอุษมาน\" เมื่อถามว่ามีผู้วิจารณ์หะดีษนี้ เขาตอบว่า \"หะซัน\" และเป็นที่รู้กันว่าอัลบุคอรีย์ไม่ได้หมายถึงหะซันตามศัพท์วิชาการ", "อิบนุหะญัรยกว่าอิบนุหิบบาน อิบนุคุซัยมะฮ์ และอัลหากิมว่าศ่อฮีห์ อิบนุลมุลักกินว่าหะซัน และยกหลักฐานสนับสนุนสิบสองบท แล้วกล่าวว่า \"มีหลักฐานสนับสนุนสิบสองบทแก่หะดีษอุษมาน จะไม่ศ่อฮีห์ได้อย่างไร ทั้งที่อิมามหลายท่านว่าศ่อฮีห์\"", "ส่วนที่อิบนุอบีหาติมยกคำของบิดาว่า \"ไม่มีหะดีษที่ถูกต้องจากท่านนบี ﷺ เรื่องการสางเครา\" และอิมามอะห์มัดตอบอบูดาวูดว่า \"มีหลายหะดีษ แต่ไม่มีหะดีษใดถูกต้อง\" อิบนุลมุลักกินตีความว่าหมายถึงหะดีษอื่นที่ไม่ใช่หะดีษอุษมาน ผู้แต่งเห็นว่าคำตอบนี้ไม่มีน้ำหนัก และคำของอิมามรุ่นใหญ่มาก่อนคำของผู้มาทีหลัง", "อิบนุบาซกล่าวว่า \"ความจริงคือหะดีษเรื่องการสางเคราเสริมกันและกัน และบ่งว่าการสางเป็นซุนนะฮ์ แม้ท่านนบี ﷺ จะไม่ได้ทำเป็นประจำ\""]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"สาง\" การสางเคราคือสอดนิ้วเข้าไปในเคราขณะล้าง ให้น้ำถึงโคนขน โดยตักน้ำหนึ่งกอบแล้วสางด้วยนิ้วเหมือนหวี หรือตักน้ำหนึ่งกอบใส่ใต้เคราแล้วสาง", "\"เครา\" (ลิห์ยะฮ์) อ่านสระอิ คือขนที่ขึ้นบนกระดูกขากรรไกรทั้งสองข้าง และบนคาง ซึ่งเป็นที่บรรจบของขากรรไกรทั้งสองข้างด้านล่างของใบหน้า"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "สางเคราหนา และล้างเคราบาง", "points_th": ["ผู้ที่เห็นว่าการสางเคราเป็นสิ่งที่ศาสนาให้ทำในการอาบน้ำละหมาดอ้างหะดีษนี้ คือกรณีเคราหนาที่ปิดผิวหนัง", "อิบนุลก็อยยิมกล่าวว่า \"ท่านนบี ﷺ สางเคราบางครั้ง ไม่ได้ทำเป็นประจำ\" ถ้าคนทำบ้างละบ้าง ก็ใกล้ซุนนะฮ์และการตามแบบอย่างท่านนบี ﷺ มากกว่า สำหรับผู้ที่เห็นว่าหะดีษในบทนี้ใช้เป็นหลักฐานได้ และเพื่อให้คนอื่นรู้ว่าไม่ใช่วาญิบ เพราะเมื่อคนเคยชินกับสิ่งใด ก็อาจยึดถือจนทำให้มันเป็นวาญิบ สิ่งที่ท่านนบี ﷺ ทำเป็นประจำ เราก็ทำเป็นประจำ สิ่งที่ท่านทำบ้างละบ้าง เราก็ทำบ้างละบ้าง", "ในสมัยท่านนบี ﷺ เศาะหาบะฮ์ต้องเรียนรู้จากการกระทำและการละเว้นของท่าน คนรุ่นหลังก็ต้องเรียนรู้จากการกระทำของผู้รู้และนักศึกษาเช่นกัน เพื่อแยกได้ว่าอะไรวาญิบ อะไรไม่วาญิบ", "ส่วนเคราบางที่ไม่ปิดผิวหนัง ต้องล้างทั้งเคราและผิวหนังข้างใต้ เพราะถือเป็นส่วนภายนอก จึงอยู่ในคำว่า \"จงล้างหน้าของพวกเจ้า\" ใบหน้าคือส่วนที่เผชิญหน้า และผิวใต้เคราเมื่อมองเห็นได้ก็อยู่ในส่วนที่เผชิญหน้า จึงนับเป็นใบหน้า"]}], "tags_th": ["เครา", "สางเครา", "วุฎูอ์", "ซุนนะฮ์"]}, {"id": "v1-h041", "volume": 1, "bab": "wudu", "topic_ar": "مشروعية دلك أعضاء الوضوء", "topic_th": "การถูอวัยวะขณะอาบน้ำละหมาด", "pages": [185, 187], "hadith": [{"no": 41, "matn_ar": "عَنْ عَبْدِ اللهِ بْنِ زَيْدٍ رَضِيَ اللهُ عَنْهُ أَنَّ النَّبِيَّ ﷺ أُتِيَ بِثُلُثَيْ مُدٍّ، فَجَعَلَ يَدْلُكُ ذِرَاعَيْهِ. أَخْرَجَهُ أَحْمَدُ، وَصَحَّحَهُ ابْنُ خُزَيْمَةَ.", "translation_th": "จากอับดุลลอฮ์ บินซัยด์ (ร.ฎ.) ว่า มีผู้นำน้ำสองในสามมุดด์มาให้ท่านนบี ﷺ ท่านจึงถูแขนทั้งสองของท่าน บันทึกโดยอะห์มัด และอิบนุคุซัยมะฮ์ระบุว่าศ่อฮีห์", "grade_th": "สายรายงานศ่อฮีห์ (มีข้อขัดแย้งว่าเป็นหะดีษของอับดุลลอฮ์ บินซัยด์ หรือของอุมมุอุมาเราะฮ์)"}], "key_rulings_th": ["ส่งเสริมให้ใช้น้ำน้อยในการอาบน้ำละหมาดและอาบน้ำ ซึ่งเป็นแนวทางของท่านนบี ﷺ สองในสามมุดด์คือปริมาณน้อยที่สุดที่ท่านใช้", "ปริมาณนี้ไม่ใช่ขอบเขตตายตัว ที่สำคัญคือล้างครบตามวาญิบและไม่ฟุ่มเฟือย ซึ่งต่างกันตามคนและร่างกาย", "การฟุ่มเฟือยน้ำเป็นสิ่งต้องห้ามโดยอิจญ์มาอ์ แม้อยู่ริมทะเล ผู้แต่งเตือนเรื่องการเปิดก๊อกน้ำทิ้ง", "การถูอวัยวะเป็นสุนัต (นักวิชาการส่วนใหญ่) ต่างจากมาลิกีย์ที่ว่าวาญิบ แต่ถ้าน้ำน้อยจนล้างไม่ทั่วถ้าไม่ถู ก็เป็นวาญิบ"], "vocab": [{"ar": "مُدّ", "th": "มุดด์ หน่วยตวงตามศาสนา เท่ากับน้ำเต็มสองฝ่ามือของคนขนาดปกติที่ประกบกัน เป็นหนึ่งในสี่ของศออ์ ตามมติของนักนิติศาสตร์"}, {"ar": "يَدْلُكُ", "th": "ถู คือลูบมือที่ล้างไปบนอวัยวะพร้อมกับน้ำ"}, {"ar": "ذِرَاعَيْهِ", "th": "แขนท่อนล่างทั้งสอง"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อะห์มัดและอิบนุคุซัยมะฮ์ (118) บันทึกผ่านสายชุอ์บะฮ์ จากหะบีบ บินซัยด์ จากอับบาด บินตะมีม จากลุงของเขา อับดุลลอฮ์ บินซัยด์ สำนวนนี้เป็นของอิบนุคุซัยมะฮ์ เพียงแต่ใช้คำว่า \"แขน\" (เอกพจน์) ผู้รายงานจากชุอ์บะฮ์หลายคน เช่น อบูดาวูด อัฏเฏาะยาลิซีย์ และยะห์ยา บินสะอีด อัลก็อฏฏอน รายงานเช่นนี้ แต่มุหัมมัด บินญะอ์ฟัรรายงานต่างออกไป", "สายรายงานศ่อฮีห์ หะบีบ บินซัยด์ นักบันทึกทั้งสี่บันทึกหะดีษของเขา และเชื่อถือได้ ส่วนชุอ์บะฮ์และอับบาดเป็นผู้รายงานของเศาะฮีหัยน์ แต่มีความต่างในสายของชุอ์บะฮ์ คือ ฆุนดัร (มุหัมมัด บินญะอ์ฟัร) รายงานจากชุอ์บะฮ์ จากหะบีบ จากอับบาด จากย่า (ยาย) ของเขา อุมมุอุมาเราะฮ์ บินติกะอ์บ (อบูดาวูด อัลบัยฮะกีย์ อันนะสาอีย์) จึงเป็นหะดีษของอุมมุอุมาเราะฮ์ ไม่ใช่ของอับดุลลอฮ์ บินซัยด์", "ในอัลอิลัลของอิบนุอบีหาติม อบูซุรอะฮ์กล่าวว่า \"ที่ถูกต้องสำหรับฉันคือหะดีษของฆุนดัร\" อิบนุหะญัรยกคำของอิบนุลมุบาร็อกว่า \"เมื่อผู้คนต่างกันในหะดีษของชุอ์บะฮ์ หนังสือของฆุนดัรคือผู้ตัดสิน\" อิบนุมะฮ์ดีย์กล่าวว่า \"เราได้ประโยชน์จากหนังสือของฆุนดัรเรื่องชุอ์บะฮ์\" และวะกีอ์เรียกหนังสือนั้นว่า \"หนังสือที่ถูกต้อง\""]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"สองในสามมุดด์\" มุดด์คือหน่วยตวงตามศาสนา เท่ากับน้ำเต็มสองฝ่ามือของคนขนาดปกติที่ประกบกัน เป็นหนึ่งในสี่ของศออ์ตามมติของนักนิติศาสตร์ คือหนึ่งริฏล์และหนึ่งในสาม ตามที่ศออ์หนักห้าริฏล์และหนึ่งในสาม ซึ่งเป็นทัศนะของชาฟิอีย์ หันบะลีย์ และมาลิกีย์", "\"ท่านจึงถู\" คำว่า \"ญะอะละ\" บ่งการเริ่มทำ \"ถู\" (ดัลก์) คือลูบมือที่ล้างไปบนอวัยวะพร้อมกับน้ำ ส่วนการล้าง (ฆุสล์) คือให้น้ำไหลผ่านอวัยวะ การถูจึงเป็นการล้างที่เพิ่มขึ้น เพราะการล้างไม่จำเป็นต้องลูบมือบนอวัยวะ ส่วนการเช็ด (มัสห์) คือลูบมือบนสิ่งที่เช็ด"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "ใช้น้ำน้อย และห้ามฟุ่มเฟือย", "points_th": ["หะดีษเป็นหลักฐานว่าส่งเสริมให้ใช้น้ำน้อยในการอาบน้ำละหมาด และการอาบน้ำก็เช่นกัน นี่คือแนวทางของท่านนบี ﷺ และเป็นปริมาณน้อยที่สุดที่ท่านใช้อาบน้ำละหมาด อนัส (ร.ฎ.) กล่าวว่า \"ท่านนบี ﷺ อาบน้ำละหมาดด้วยหนึ่งมุดด์ และอาบน้ำด้วยหนึ่งศออ์ถึงห้ามุดด์\" (จะกล่าวต่อไป)", "ไม่มีข้อขัดแย้งว่าปริมาณนี้ไม่ใช่ขอบเขตที่เกินไม่ได้ ที่สำคัญคือล้างครบตามวาญิบและไม่ฟุ่มเฟือย ซึ่งต่างกันตามคน ร่างกาย และความชำนาญ ปริมาณในหะดีษอนัสและหะดีษอับดุลลอฮ์ บินซัยด์จึงต่างกัน", "หลายท่านรายงานอิจญ์มาอ์ว่าความสะอาดไม่มีปริมาณกำหนด อันนะวะวีย์กล่าวว่า \"มุสลิมเห็นพ้องว่าน้ำที่ใช้ได้ในการอาบน้ำละหมาดและอาบน้ำไม่มีปริมาณกำหนด น้อยหรือมากก็ใช้ได้ ถ้าครบเงื่อนไขของการล้าง คือน้ำไหลผ่านอวัยวะ\" และว่า \"นักวิชาการเห็นพ้องว่าห้ามฟุ่มเฟือยน้ำ แม้อยู่ริมทะเล\"", "หลักฐานว่าการฟุ่มเฟือยน้ำหะรอม คือหะดีษอับดุลลอฮ์ บินมุฆ็อฟฟัล ที่ได้ยินท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"จะมีกลุ่มชนในประชาชาตินี้ที่ละเมิดขอบเขตในการชำระและการขอดุอาอ์\" (อบูดาวูด อะห์มัด อัล
