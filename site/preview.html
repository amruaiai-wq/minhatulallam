 {"id": "v1-h045", "volume": 1, "bab": "wudu", "topic_ar": "الأمر بالبدء بالميامن في الوضوء", "topic_th": "คำสั่งให้เริ่มด้วยข้างขวาในการอาบน้ำละหมาด", "pages": [204, 206], "hadith": [{"no": 45, "matn_ar": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «إِذَا تَوَضَّأْتُمْ فَابْدَؤُوا بِمَيَامِنِكُمْ». أَخْرَجَهُ الْأَرْبَعَةُ، وَصَحَّحَهُ ابْنُ خُزَيْمَةَ.", "translation_th": "จากอบูฮุร็อยเราะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"เมื่อพวกท่านอาบน้ำละหมาด จงเริ่มด้วยข้างขวาของพวกท่าน\" บันทึกโดยนักบันทึกทั้งสี่ และอิบนุคุซัยมะฮ์ระบุว่าศ่อฮีห์", "grade_th": "สายรายงานศ่อฮีห์ (อันนะวะวีย์ว่าหะซัน สายรายงานดี)"}], "key_rulings_th": ["ศาสนาให้เริ่มด้วยมือและเท้าข้างขวาก่อนข้างซ้ายในการอาบน้ำละหมาด", "นักวิชาการส่วนใหญ่ว่าเป็นสุนัต ไม่ใช่วาญิบ อันนะวะวีย์และอิบนุกุดามะฮ์รายงานอิจญ์มาอ์ ส่วนอิบนุบาซเลือกว่าวาญิบ", "เหตุที่คำสั่งเปลี่ยนจากวาญิบเป็นสุนัต: อายะฮ์สั่งล้างมือและเท้าโดยไม่ระบุว่าเริ่มข้างไหน มือทั้งสองนับเป็นอวัยวะเดียว และหะดีษอาอิชะฮ์ใช้คำว่า \"ชอบ\" ไม่ใช่คำบังคับ", "ผู้แต่งชี้ว่า การพาดพิงสำนวนนี้ถึงนักบันทึกทั้งสี่และอิบนุคุซัยมะฮ์ไม่แม่นยำ สำนวนนี้เป็นของอิบนุมาญะฮ์เท่านั้น"], "vocab": [{"ar": "إِذَا تَوَضَّأْتُمْ", "th": "เมื่อพวกท่านเริ่มอาบน้ำละหมาด"}, {"ar": "مَيَامِنِكُمْ", "th": "พหูพจน์ของ مَيْمَنَة คือข้างขวา ตรงข้ามกับ مَيْسَرَة ข้างซ้าย"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["ผู้แต่งชี้ว่าอิบนุหะญัรยกหะดีษด้วยสำนวนที่ต่างจากหนังสือที่พาดพิงถึง สำนวนนี้เป็นของอิบนุมาญะฮ์ (402) เท่านั้น ส่วนคนอื่นต่างไป อบูดาวูด (4141) ในหมวดเครื่องแต่งกาย: \"เมื่อพวกท่านสวมเสื้อผ้าและอาบน้ำละหมาด จงเริ่มด้วยข้างขวาของพวกท่าน\" อิบนุคุซัยมะฮ์ก็สำนวนเดียวกัน", "อัตติรมิซีย์บันทึกในหมวดเครื่องแต่งกาย (1766) สำนวนว่า \"ท่านรสูลุลลอฮ์ ﷺ เมื่อสวมเสื้อ ท่านเริ่มด้วยข้างขวา\" อันนะสาอีย์ในอัสสุนันอัลกุบรอก็เช่นกัน ทั้งหมดผ่านอัลอะอ์มัช จากอบูศอลิห์ จากอบูฮุร็อยเราะฮ์", "จึงเห็นว่าในรายงานของอบูดาวูด อิบนุมาญะฮ์ และอิบนุคุซัยมะฮ์ หะดีษมาในรูปคำสั่ง จึงเป็นซุนนะฮ์จากคำพูด ส่วนในรายงานของอัตติรมิซีย์และอันนะสาอีย์มาในรูปเล่าการกระทำของท่านรสูลุลลอฮ์ ﷺ จึงเป็นซุนนะฮ์จากการกระทำ การพาดพิงสำนวนนี้ถึงนักบันทึกทั้งสี่และอิบนุคุซัยมะฮ์จึงไม่แม่นยำ อัลมิซซีย์จึงไม่ได้พาดพิงหะดีษนี้ถึงอัตติรมิซีย์และอันนะสาอีย์ และอิบนุลมุลักกินกล่าวว่า \"อัตติรมิซีย์ไม่ได้รายงานหะดีษนี้เลย นั่นเป็นอีกหะดีษหนึ่ง\"", "สายรายงานศ่อฮีห์ อิบนุคุซัยมะฮ์ว่าศ่อฮีห์ตามที่อิบนุหะญัรระบุ อัซซัยละอีย์ยกคำของอิบนุดะกีกิลอีดว่า \"สมควรที่จะศ่อฮีห์\" อิบนุลมุลักกินว่าศ่อฮีห์ และอันนะวะวีย์ว่า \"หะดีษหะซัน สายรายงานดี\""]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"เมื่อพวกท่านอาบน้ำละหมาด\" คือเมื่อเริ่มอาบ จึงรวมทั้งตอนเริ่ม เช่น การล้างฝ่ามือให้เริ่มข้างขวาก่อนข้างซ้าย และระหว่างอาบ เช่น การล้างมือและเท้า แต่ตามที่อันนะวะวีย์กล่าวไปแล้ว ฝ่ามือทั้งสองล้างพร้อมกันทีเดียว", "\"ข้างขวาของพวกท่าน\" (มะยามิน) พหูพจน์ของมัยมะนะฮ์ คือข้างขวา ตรงข้ามกับข้างซ้าย ดังอายะฮ์ \"ชาวขวา ชาวขวาคือใคร และชาวซ้าย ชาวซ้ายคือใคร\" (อัลวากิอะฮ์: 8–9)"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "เริ่มด้วยขวาเป็นวาญิบหรือสุนัต", "points_th": ["เหตุที่อิบนุหะญัรยกหะดีษนี้ต่อจากหะดีษอาอิชะฮ์ คือหะดีษนี้แสดงการเริ่มด้วยขวาในวุฎูอ์ด้วยรูปคำสั่ง จึงเป็นซุนนะฮ์จากคำพูด ส่วนหะดีษก่อนเป็นซุนนะฮ์จากการกระทำ แต่ท่านยกหะดีษอาอิชะฮ์ก่อน เพราะเป็นหลักของการเริ่มด้วยขวาโดยทั่วไป และแข็งแรงกว่าหะดีษอบูฮุร็อยเราะฮ์", "ตามรูปคำ หะดีษบ่งว่าการเริ่มด้วยขวาก่อนซ้ายในการล้างมือและเท้าเป็นวาญิบ เพราะหลักเดิมของคำสั่งคือวาญิบ และท่านรสูลุลลอฮ์ ﷺ ทำเป็นประจำ ดังหะดีษอุษมาน อับดุลลอฮ์ บินซัยด์ อะลี และคนอื่น ๆ และการกระทำของท่านอธิบายอายะฮ์ \"จงล้างหน้าของพวกเจ้าและมือของพวกเจ้า\"", "อิบนุบาซเลือกว่าวาญิบ อัรรอซีย์พาดพิงทัศนะนี้ถึงอะห์มัด แต่อัซซัรกะชีย์กล่าวว่า \"เป็นเรื่องที่ไม่ถูกต้อง\" อัรรอฟิอีย์ก็ยกจากชาฟิอีย์ว่าเป็นทัศนะของอะห์มัดด้วย แต่ผู้แต่งไม่พบในตำราหันบะลีย์ที่เขาได้อ่าน โดยเฉพาะอัลมุฆนีย์และอัลอินศ็อฟ อิบนุกุดามะฮ์กลับกล่าวว่า \"การเรียงข้างขวาก่อนซ้ายไม่ใช่วาญิบ เราไม่รู้ว่ามีข้อขัดแย้ง\"", "นักวิชาการส่วนใหญ่จึงเห็นว่าการเริ่มด้วยขวาเป็นสุนัต อิบนุคุซัยมะฮ์ตั้งชื่อบทของหะดีษนี้ว่า \"บทคำสั่งให้เริ่มด้วยขวาในวุฎูอ์ เป็นคำสั่งแบบส่งเสริม ไม่ใช่บังคับ\" คำสั่งในหะดีษจึงเปลี่ยนจากวาญิบเป็นสุนัต", "หลักฐานที่เปลี่ยนความหมาย (1) อายะฮ์ \"จงล้างหน้าของพวกเจ้าและมือของพวกเจ้าจนถึงข้อศอก\" อัลลอฮ์สั่งให้ล้างมือและเท้า โดยไม่ได้ระบุให้เริ่มข้างขวา แสดงว่าสิ่งที่วาญิบคือล้างมือและเท้า ไม่ว่าแบบใด และนักนิติศาสตร์นับมือทั้งสองเป็นอวัยวะเดียว เท้าทั้งสองเป็นอวัยวะเดียว และการเรียงลำดับภายในอวัยวะเดียวไม่ใช่วาญิบ (2) หะดีษอาอิชะฮ์ว่าท่านนบี ﷺ ชอบการเริ่มด้วยขวา แสดงว่าการเริ่มขวาในการชำระเป็นเรื่องความชอบและความยินดี ไม่ใช่การบังคับ ถ้าเป็นการบังคับ อาอิชะฮ์คงอธิบาย เพราะนางเป็นผู้เข้าใจแนวทางของท่านนบี ﷺ และการกล่าวถึงการสวมรองเท้าและการหวีผมคู่กับการชำระ ก็แสดงว่าเรื่องนี้มีความยืดหยุ่น", "และได้กล่าวไปแล้วว่ามีอิจญ์มาอ์ว่าการเริ่มด้วยขวาเป็นสุนัต ตามที่อันนะวะวีย์และอิบนุกุดามะฮ์รายงาน"]}], "tags_th": ["เริ่มด้วยขวา", "วุฎูอ์", "สุนัต", "อิจญ์มาอ์"]}, {"id": "v1-h046", "volume": 1, "bab": "wudu", "topic_ar": "الاكتفاء بمسح الناصية مع العمامة", "topic_th": "เช็ดหน้าผากพร้อมกับผ้าโพกศีรษะ", "pages": [207, 208], "hadith": [{"no": 46, "matn_ar": "وَعَنِ الْمُغِيرَةِ بْنِ شُعْبَةَ رَضِيَ اللهُ عَنْهُ، أَنَّ النَّبِيَّ ﷺ تَوَضَّأَ، فَمَسَحَ بِنَاصِيَتِهِ، وَعَلَى الْعِمَامَةِ وَالْخُفَّيْنِ. أَخْرَجَهُ مُسْلِمٌ.", "translation_th": "จากอัลมุฆีเราะฮ์ บินชุอ์บะฮ์ (ร.ฎ.) ว่า ท่านนบี ﷺ อาบน้ำละหมาด แล้วเช็ดที่ส่วนหน้าของศีรษะ และบนผ้าโพกศีรษะ และบนรองเท้าหุ้มข้อทั้งสอง บันทึกโดยมุสลิม", "grade_th": "ศ่อฮีห์ (มุสลิม)"}], "key_rulings_th": ["ผู้ที่สวมผ้าโพกศีรษะ ให้เช็ดส่วนหน้าของศีรษะที่โผล่ออกมา แล้วเช็ดบนผ้าโพกต่อให้ครบ", "ผู้แต่งเห็นว่าหะดีษนี้ไม่ใช่หลักฐานว่าเช็ดบางส่วนของศีรษะก็พอ เพราะท่านนบี ﷺ ไม่ได้เช็ดแค่ส่วนหน้า แต่เช็ดบนผ้าโพกต่อจนครบ", "ถ้าศีรษะไม่มีอะไรคลุม ก็ต้องเช็ดทั้งศีรษะ (หะดีษอับดุลลอฮ์ บินซัยด์)", "ผู้แต่งเห็นว่าอิบนุหะญัรอาจยกหะดีษนี้ไว้ตรงนี้เพื่อแสดงการเรียงลำดับภายในอวัยวะเดียว คือเริ่มที่ส่วนหน้าของศีรษะ แล้วผ้าโพกซึ่งอยู่ตรงกลางและด้านหลัง"], "vocab": [{"ar": "النَّاصِيَة", "th": "ผมด้านหน้าของศีรษะ บางท่านว่าส่วนหน้าของศีรษะ ไม่ว่ามีผมหรือไม่"}, {"ar": "الْعِمَامَة", "th": "ผ้าโพกศีรษะ"}, {"ar": "الْخُفَّيْن", "th": "รองเท้าหุ้มข้อทั้งสองข้าง (คุฟฟ์) ทำจากหนัง"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อัลมุฆีเราะฮ์ บินชุอ์บะฮ์ บินอบีอามิร บินมัสอูด อัษษะเกาะฟีย์ เข้ารับอิสลามในปีสงครามคันดักและมาเป็นผู้อพยพ สงครามแรกที่ร่วมคืออัลหุดัยบิยะฮ์ เขาเป็นหนึ่งในผู้รับใช้ท่านนบี ﷺ เรื่องน้ำอาบน้ำละหมาด", "ผู้รายงานจากเขา เช่น ลูกชาย อุรวะฮ์และหัมซะฮ์ ทาสที่ปลดปล่อย วัรร็อด และอบูบุรดะฮ์ บินอบีมูซา เขาเป็นหนึ่งในชาวอาหรับที่เฉลียวฉลาดที่สุด ปกครองบัศเราะฮ์ แล้วกูฟะฮ์สองครั้ง ครั้งแรกในสมัยอุมัร ครั้งที่สองในสมัยมุอาวิยะฮ์ และเสียชีวิตที่กูฟะฮ์ปี ฮ.ศ. 50"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["มุสลิมบันทึกในหมวดฏอฮาเราะฮ์ (274) ผ่านบักร์ บินอับดิลลาฮ์ อัลมุซะนีย์ จากหัมซะฮ์ บินอัลมุฆีเราะฮ์ จากบิดา สำนวนว่า \"และบนผ้าโพกศีรษะ และบนรองเท้าหุ้มข้อ\" โดยเพิ่มคำว่า \"บน\" ครั้งที่สอง ต่างจากในบุลูฆ", "อิบนุลเญาซีย์พลาดที่พาดพิงหะดีษนี้ถึงอัลบุคอรีย์และมุสลิม อิบนุอับดิลฮาดีได้แก้ไว้ว่าเป็นหะดีษที่มุสลิมบันทึกคนเดียว อับดุลหักก์ อัลอิชบีลีย์ก็ระบุชัดในอัลญัมอุบัยนัศเศาะฮีหัยน์ และอิบนุลมุลักกินระบุว่าอันนะวะวีย์ก็พลาดแบบเดียวกัน"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"นาศิยะฮ์\" คือผมที่อยู่ด้านหน้าของศีรษะ บางท่านว่าคือส่วนหน้าของศีรษะ ไม่ว่ามีผมหรือไม่"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "เหตุที่ยกหะดีษนี้ และการเช็ดบางส่วนของศีรษะ", "points_th": ["ดูเหมือนอิบนุหะญัรยกหะดีษนี้เพื่อแสดงว่าเช็ดบางส่วนของศีรษะก็พอ เพราะในฟัตหุลบารีย์ท่านใช้หะดีษนี้เป็นหลักฐานว่าการเช็ดทั่วศีรษะไม่ใช่ฟัรฎู มิฉะนั้นเรื่องการเช็ดผ้าโพกและรองเท้าหุ้มข้อจะอยู่ในบทเฉพาะหลังบทวุฎูอ์ แต่ผู้แต่งเห็นว่าหะดีษนี้ไม่ใช่หลักฐานของเรื่องนั้น", "เมื่อพิจารณาแล้ว ผู้แต่งเห็นว่าอิบนุหะญัรอาจมีจุดประสงค์อื่น เพราะถ้าต้องการเรื่องการเช็ดศีรษะ ท่านคงยกไว้กับหะดีษเรื่องการเช็ดศีรษะก่อนหน้า แต่ท่านยกไว้หลังหะดีษ \"เมื่อพวกท่านอาบน้ำละหมาด จงเริ่มด้วยข้างขวา\" และก่อนหะดีษ \"จงเริ่มด้วยสิ่งที่อัลลอฮ์ทรงเริ่ม\" หะดีษแรกเป็นเรื่องการเรียงลำดับระหว่างอวัยวะที่เป็นคู่ เช่น มือและเท้า แล้วหะดีษอัลมุฆีเราะฮ์เป็นการเรียงลำดับภายในอวัยวะเดียวคือศีรษะ เริ่มที่ส่วนหน้าของศีรษะ แล้วผ้าโพกซึ่งอยู่กลางและหลังศีรษะ แล้วหะดีษญาบิรเป็นการเรียงลำดับระหว่างอวัยวะต่างชนิด", "ผู้แต่งเห็นว่าหะดีษนี้ไม่ใช่หลักฐานของเรื่องนั้น (ตามที่กล่าวในเรื่องการเช็ดศีรษะ) เพราะท่านนบี ﷺ เช็ดที่ส่วนหน้าของศีรษะแล้วเช็ดบนผ้าโพกต่อจนครบ ท่านไม่ได้เช็ดแค่ส่วนหน้า จนจะใช้เป็นหลักฐานว่าเช็ดบางส่วนได้ แต่เมื่อสวมผ้าโพกอยู่ ก็เช็ดบนผ้าโพกและส่วนที่โผล่ของศีรษะ ถ้าศีรษะไม่มีอะไรคลุม ก็เช็ดทั้งหมด ดังที่ยืนยันในหะดีษอับดุลลอฮ์ บินซัยด์และหะดีษอื่น", "อิบนุลก็อยยิมกล่าวว่า \"ไม่มีรายงานที่ถูกต้องจากท่านแม้แต่หะดีษเดียวว่าท่านเช็ดเพียงบางส่วนของศีรษะ แต่เมื่อท่านเช็ดที่ส่วนหน้าของศีรษะ ท่านก็เช็ดบนผ้าโพกต่อจนครบ\""]}], "tags_th": ["ผ้าโพกศีรษะ", "เช็ดศีรษะ", "รองเท้าหุ้มข้อ", "วุฎูอ์"]}, {"id": "v1-h047", "volume": 1, "bab": "wudu", "topic_ar": "وجوب الترتيب في الوضوء", "topic_th": "การเรียงลำดับในการอาบน้ำละหมาดเป็นวาญิบ", "pages": [209, 214], "hadith": [{"no": 47, "matn_ar": "عَنْ جَابِرِ بْنِ عَبْدِ اللهِ رَضِيَ اللهُ عَنْهُمَا - فِي صِفَةِ حَجِّ النَّبِيِّ ﷺ - قَالَ ﷺ: «ابْدَؤُوا بِمَا بَدَأَ اللهُ بِهِ». أَخْرَجَهُ النَّسَائِيُّ، هَكَذَا بِلَفْظِ الْأَمْرِ، وَهُوَ عِنْدَ مُسْلِمٍ بِلَفْظِ الْخَبَرِ.", "translation_th": "จากญาบิร บินอับดิลลาฮ์ (ร.ฎ.) เกี่ยวกับการทำหัจญ์ของท่านนบี ﷺ ท่านกล่าวว่า \"จงเริ่มด้วยสิ่งที่อัลลอฮ์ทรงเริ่ม\" บันทึกโดยอันนะสาอีย์ ในรูปคำสั่งเช่นนี้ และในรายงานของมุสลิมเป็นรูปบอกเล่า (\"ฉันเริ่มด้วยสิ่งที่อัลลอฮ์ทรงเริ่ม\")", "grade_th": "ศ่อฮีห์ในรูปบอกเล่า (มุสลิม) ส่วนรูปคำสั่ง ผู้แต่งเห็นว่าเป็นชาซ"}], "key_rulings_th": ["ผู้แต่งเห็นว่าการเรียงลำดับอวัยวะวุฎูอ์เป็นวาญิบ (หน้า มือ ศีรษะ เท้า) ผู้ที่สลับอวัยวะ วุฎูอ์ใช้ไม่ได้ เป็นทัศนะของอะห์มัดและอัชชาฟิอีย์", "มาลิกและหะนะฟีย์ว่าไม่วาญิบ เพราะคำว่า \"และ\" ในอายะฮ์ไม่บ่งลำดับ แต่การกระทำของท่านนบี ﷺ อธิบายว่าในอายะฮ์นี้หมายถึงลำดับ", "การเรียงระหว่างสิ่งที่เป็นสุนัต หรือระหว่างสุนัตกับฟัรฎู ไม่ใช่วาญิบตามทัศนะของนักวิชาการส่วนใหญ่", "ผู้แต่งเห็นว่าสำนวนคำสั่ง \"จงเริ่ม...\" เป็นชาซ สำนวนที่ถูกต้องคือบอกเล่า \"ฉันเริ่ม...\" ซึ่งยังบ่งว่าวาญิบ เพราะการกระทำของท่านในพิธีหัจญ์เป็นการอธิบายสิ่งวาญิบ", "ถ้อยคำที่กว้างใช้ตามความกว้าง ไม่จำกัดเฉพาะเหตุที่เป็นที่มา หะดีษนี้เกิดในเรื่องสะแอระหว่างเศาะฟาและมัรวะฮ์ แต่ใช้กับอายะฮ์วุฎูอ์ด้วย"], "vocab": [{"ar": "ابْدَؤُوا", "th": "จงเริ่ม (คำสั่ง) ในรายงานของมุสลิมว่า أَبْدَأُ (ฉันเริ่ม) และอีกรายงานว่า نَبْدَأُ (เราเริ่ม)"}, {"ar": "التَّرْتِيب", "th": "การเรียงลำดับอวัยวะวุฎูอ์ตามที่อัลลอฮ์ทรงกล่าว"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["ญาบิร บินอับดิลลาฮ์ บินหะรอม อัลอันศอรีย์ อัสสะละมีย์ เศาะหาบะฮ์ และบิดาก็เป็นเศาะหาบะฮ์ เป็นหนึ่งในเศาะหาบะฮ์ที่มีชื่อเสียงและรายงานหะดีษมาก เขารายงานวิธีทำหัจญ์ของท่านนบี ﷺ และใส่ใจเรื่องนี้ หะดีษของเขาเรื่องหัจญ์เป็นตำราพิธีหัจญ์ในตัวเอง (อิบนุหะญัรจะยกไว้ในหมวดหัจญ์)", "ในเศาะฮีห์มีว่าเขาร่วมบัยอะตุลอะเกาะบะฮ์ และร่วมสงครามทั้งหมดกับท่านนบี ﷺ ยกเว้นบัดร์และอุหุด เพราะบิดาให้อยู่ดูแลพี่สาวน้องสาว มุสลิมบันทึกว่าเขากล่าวว่า \"ฉันร่วมสงครามกับท่านรสูลุลลอฮ์ ﷺ สิบเก้าครั้ง... ฉันไม่ได้ร่วมบัดร์และอุหุด บิดาห้ามไว้ เมื่ออับดุลลอฮ์ (บิดา) ถูกสังหารในวันอุหุด ฉันก็ไม่เคยขาดสงครามใดกับท่านรสูลุลลอฮ์ ﷺ อีกเลย\"", "เขามีวงสอนหะดีษและความรู้ในมัสยิดของท่านรสูลุลลอฮ์ ﷺ ตาบอดในบั้นปลายชีวิต และเสียชีวิตที่มะดีนะฮ์ปี ฮ.ศ. 74"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["มุสลิมบันทึกแบบยาวในเรื่องวิธีทำหัจญ์ของท่านนบี ﷺ (1218) ผ่านหาติม บินอิสมาอีล อัลมะดะนีย์ จากญะอ์ฟัร บินมุหัมมัด จากบิดา จากญาบิร มีว่า \"เมื่อท่านใกล้ถึงเศาะฟา ท่านอ่าน 'แท้จริงเศาะฟาและมัรวะฮ์เป็นส่วนหนึ่งของเครื่องหมายของอัลลอฮ์' (อัลบะเกาะเราะฮ์: 158) ฉันเริ่มด้วยสิ่งที่อัลลอฮ์ทรงเริ่ม แล้วท่านก็เริ่มที่เศาะฟา\" ซึ่งเป็นรูปบอกเล่า", "อันนะสาอีย์ในอัสสุนันอัศศุฆรอ (2962) บันทึกในรูปคำสั่ง อะห์มัดก็เช่นกัน อิบนุลมุลักกินว่าศ่อฮีห์ และว่า \"อันนะสาอีย์รายงานด้วยสายรายงานตามเงื่อนไขของมุสลิม\" อันนะสาอีย์บันทึกในอัสสุนันอัลกุบรอด้วย และอัลมิซซีย์พาดพิงถึงเขา อันนะสาอีย์ยังบันทึก (2970) ด้วยคำว่า \"เราเริ่มด้วยสิ่งที่อัลลอฮ์ทรงเริ่ม\" เช่นเดียวกับอบูดาวูด (1905) อัตติรมิซีย์ (862) และอิบนุมาญะฮ์ (3074)", "อิบนุหะญัรยกรายงานของอันนะสาอีย์ก่อน เพราะมาในรูปคำสั่ง ซึ่งบ่งความบังคับ ส่วนรูปบอกเล่าบ่งว่าท่านนบี ﷺ ทำตามแนวทางของอัลกุรอาน ซึ่งกว้างกว่า อาจบ่งวาญิบหรือสุนัต", "อัลอัลบานีย์ปฏิเสธว่าหะดีษนี้มีในอัสสุนันอัศศุฆรอ และสงสัยว่ามีในรูปคำสั่งในอัลกุบรอ ทั้งที่มีในทั้งสองเล่ม", "นักวิชาการตัดสินว่าคำ \"จงเริ่ม\" เป็นชาซ เพราะสุฟยาน อัษเษารีย์ และสุลัยมาน บินบิลาล รายงานคนเดียว ขัดกับผู้รายงานที่เชื่อถือได้คนอื่นที่รายงานจากญะอ์ฟัรในรูปบอกเล่า ซึ่งมีเจ็ดคน อัลอัลบานีย์ไล่ชื่อไว้ในอัลอิรวาอ์ เช่น อิมามมาลิก สุฟยาน บินอุยัยนะฮ์ ยะห์ยา บินสะอีด อัลก็อฏฏอน และหาติม บินอิสมาอีล อัดดารุกุฏนีย์มีรายงานผ่านอัลฮัยษัม บินมุอาวิยะฮ์ จากหาติม ในรูปคำสั่ง แต่ผู้รายงานคนอื่นจากหาติมรายงานในรูปบอกเล่า", "ผู้แต่งชี้ว่าการที่สุฟยาน อัษเษารีย์รายงานคนเดียวต้องพิจารณา เพราะเขาเป็นอิมามที่เป็นหลักฐาน ไม่มีใครขัดแย้งเขาโดยที่คำของเขาจะไม่ถูกเลือก ตามที่อิบนุมะอีนและคนอื่นกล่าว ความผิดพลาดอาจมาจากผู้ที่รายงานจากเขา คืออิบนุอุยัยนะฮ์และเกาะบีเศาะฮ์ (อัดดารุกุฏนีย์) และอัลฟิรยาบีย์กับเกาะบีเศาะฮ์ (อัลบัยฮะกีย์)", "อิบนุดะกีกิลอีดกล่าวว่า \"หะดีษนี้อยู่ในเศาะฮีห์ แต่ในรูปบอกเล่า 'เราเริ่ม' และ 'ฉันเริ่ม' ไม่ใช่รูปคำสั่ง รายงานส่วนใหญ่เป็นเช่นนี้ และเป็นหะดีษเดียวกัน\" อิบนุหะญัรเพิ่มว่า \"มาลิก สุฟยาน และยะห์ยา บินสะอีด อัลก็อฏฏอน รายงานว่า 'เราเริ่ม' ด้วยอักษรนูนซึ่งเป็นพหูพจน์\" และกล่าวว่า \"พวกเขาจำได้แม่นกว่าคนอื่น\" ผู้แต่งเห็นว่านี่ถูกต้อง อินชาอัลลอฮ์ เพราะไม่อาจกล่าวว่าทั้งสองสำนวนศ่อฮีห์ เนื่องจากเป็นหะดีษเดียว และท่านนบี ﷺ กล่าวเพียงครั้งเดียวเมื่อขึ้นเศาะฟา จึงต้องเลือก"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "หะดีษหัจญ์ใช้กับวุฎูอ์ได้อย่างไร", "points_th": ["หะดีษนี้อยู่ในเรื่องหัจญ์ของท่านนบี ﷺ แต่อิบนุหะญัรยกไว้ในบทวุฎูอ์ เพื่อเป็นหลักฐานว่าการเรียงลำดับในการล้างอวัยวะเป็นวาญิบ เริ่มด้วยหน้า แล้วมือ ตามที่อัลลอฮ์ทรงกล่าวในอัลกุรอาน สิ่งที่อัลลอฮ์ทรงเริ่ม เราก็เริ่มด้วยทั้งในการบอกเล่าและการกระทำตามคำสั่ง เพราะพระดำรัสของพระองค์เปี่ยมวิทยปัญญา พระองค์จะไม่ทรงเริ่มกล่าวสิ่งใด นอกจากสิ่งที่สมควรเริ่มทำก่อน และท่านนบี ﷺ เรียงลำดับเช่นนี้ เราจึงต้องตามแบบอย่างท่าน", "เรื่องนี้ตั้งอยู่บนหลักอุศูลว่า ให้ถือความหมายกว้างของถ้อยคำ ไม่ใช่เหตุเฉพาะที่เป็นที่มา ถ้อยคำนี้แม้มาในเรื่องสะแอระหว่างเศาะฟาและมัรวะฮ์ แต่เป็นถ้อยคำกว้าง จึงใช้ตามความกว้าง ว่าทุกสิ่งที่อัลลอฮ์ทรงเริ่ม เราก็เริ่ม อายะฮ์วุฎูอ์จึงรวมอยู่ในความกว้างนั้น", "ตามรายงานรูปคำสั่ง ความหมายวาญิบชัดเจน ตามรายงานรูปบอกเล่า ก็เพราะการกระทำของท่านนบี ﷺ ตามรูปคือการอธิบายพิธีหัจญ์ และท่านกล่าวว่า \"พวกท่านจงเอาพิธีหัจญ์ของพวกท่านไปจากฉัน\" (มุสลิม) ซึ่งที่ชัดคือการอธิบายสิ่งวาญิบ ไม่ใช่สิ่งที่ประเสริฐกว่า"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "การเรียงลำดับในวุฎูอ์เป็นวาญิบหรือไม่", "points_th": ["การเรียงลำดับในวุฎูอ์มีสามแบบ (1) ระหว่างฟัรฎูกับฟัรฎู คืออวัยวะทั้งสี่ในอัลกุรอาน เช่น ล้างมือหลังล้างหน้า นี่คือประเด็นที่ขัดแย้งกัน (2) ระหว่างสุนัตกับสุนัต เช่น บ้วนปากก่อนสูดน้ำเข้าจมูก ตามทัศนะว่าทั้งสองเป็นสุนัต (3) ระหว่างสุนัตกับฟัรฎู เช่น บ้วนปากกับล้างหน้า", "นักวิชาการส่วนใหญ่ว่าการเรียงระหว่างสุนัตด้วยกัน และระหว่างสุนัตกับฟัรฎู เป็นสุนัต ไม่ใช่วาญิบ เพราะเมื่อตัวการกระทำที่เป็นสุนัตไม่ใช่วาญิบ วิธีทำก็ยิ่งไม่วาญิบ แต่ตามทัศนะว่าการบ้วนปากและสูดน้ำเข้าจมูกเป็นวาญิบ ข้อขัดแย้งในแบบที่หนึ่งก็รวมถึงทั้งสองด้วย อิบนุรุชด์ระบุว่าที่มาของข้อขัดแย้งในการเรียงลำดับมีสองอย่าง คือ คำว่า \"และ\" บางครั้งบ่งลำดับ บางครั้งไม่ และความต่างกันว่าการกระทำของท่านนบี ﷺ บ่งวาญิบหรือสุนัต", "ทัศนะที่หนึ่ง: การเรียงลำดับในวุฎูอ์เป็นวาญิบ เริ่มล้างหน้า แล้วมือ แล้วเช็ดศีรษะ แล้วล้างเท้า ผู้ที่เอาอวัยวะหนึ่งไปก่อนอีกอวัยวะ วุฎูอ์ใช้ไม่ได้ เป็นทัศนะของอะห์มัดและอัชชาฟิอีย์ และอบูอุบัยด์เลือก หลักฐาน (1) อายะฮ์อัลมาอิดะฮ์ เมื่ออัลลอฮ์กล่าวถึงอวัยวะทั้งสี่ ทรงแทรกอวัยวะที่เช็ด คือศีรษะ ไว้ระหว่างอวัยวะที่ล้าง คือมือและเท้า และชาวอาหรับจะไม่แยกสิ่งที่เหมือนกันออกจากกันนอกจากมีประโยชน์ ถ้าการเรียงลำดับไม่วาญิบ ก็คงรวมสิ่งที่เหมือนกันไว้ด้วยกัน (2) ทุกคนที่อธิบายวุฎูอ์ของท่านนบี ﷺ เล่าเรียงลำดับด้วยคำว่า \"แล้ว\" (ษุมม์) เช่น หะดีษอุษมานและอับดุลลอฮ์ บินซัยด์ ไม่มีใครกล่าวว่าท่านเอาอวัยวะใดไปก่อนอย่างขัดกับอายะฮ์ และการกระทำของท่านอธิบายคัมภีร์ของอัลลอฮ์", "ทัศนะที่สอง: การเรียงลำดับไม่วาญิบ ผู้ที่เอาอวัยวะหนึ่งไปก่อน วุฎูอ์ของเขาสมบูรณ์ เป็นทัศนะของมาลิก และนักวิชาการฝ่ายเราะอ์ยุ (หะนะฟีย์) และอีกรายงานจากอะห์มัดที่อบุลค็อฏฏอบระบุ สลัฟกลุ่มหนึ่งเห็นเช่นนี้ และอิบนุลมุนซิรเลือก หลักฐาน (1) หะดีษอัรรุบัยยิอ์ บินติมุเอาวิซ เรื่องวุฎูอ์ของท่านนบี ﷺ: \"ท่านล้างฝ่ามือสามครั้ง ล้างหน้าสามครั้ง บ้วนปากและสูดน้ำเข้าจมูกครั้งเดียว...\" และอีกสำนวน: \"...แล้วท่านอาบน้ำละหมาด ล้างหน้าสามครั้ง แล้วบ้วนปากสามครั้ง และสูดน้ำเข้าจมูกสามครั้ง...\" (อบูดาวูด อัดดารุกุฏนีย์ อัลอัลบานีย์ว่าหะซัน) (2) อัลลอฮ์สั่งให้ล้างอวัยวะ และเชื่อมกันด้วยคำว่า \"และ\" ซึ่งไม่บ่งลำดับ ไม่ว่าล้างแบบใดก็ถือว่าปฏิบัติตามแล้ว", "ผู้แต่งเห็นว่าทัศนะที่มีน้ำหนักคือทัศนะแรก คือการเรียงลำดับอวัยวะวุฎูอ์เป็นวาญิบ เพราะหลักฐานแข็งแรง อบูดาวูดกล่าวว่า \"ฉันได้ยินอะห์มัดถูกถามว่า ถ้าเขาเอาวุฎูอ์ส่วนหนึ่งไปก่อนอีกส่วน เขาตอบว่า ไม่ได้ จนกว่าจะทำตามที่มีในคัมภีร์และซุนนะฮ์\"", "หลักฐานของทัศนะที่สอง คือหะดีษอัรรุบัยยิอ์ ตอบได้สองทาง (1) เป็นหะดีษที่มีข้อบกพร่อง เพราะมาจากอับดุลลอฮ์ บินมุหัมมัด บินอะกีล (กล่าวไปแล้ว) (2) สมมุติว่าศ่อฮีห์ การบ้วนปากและสูดน้ำเข้าจมูกที่เอาไว้หลังคือการเอาสุนัตไว้หลังฟัรฎู ซึ่งนักวิชาการส่วนใหญ่ว่าทำได้ ตามทัศนะว่าทั้งสองเป็นสุนัต หรือว่าการบ้วนปากและสูดน้ำเข้าจมูกเป็นส่วนของใบหน้า", "ส่วนที่ว่าอัลลอฮ์สั่งให้ล้างอวัยวะและเชื่อมด้วย \"และ\" นั้นถูกต้อง แต่ท่านนบี ﷺ อธิบายด้วยการกระทำว่า \"และ\" ในอายะฮ์นี้หมายถึงลำดับ ไม่ใช่แค่การรวม การกระทำของท่านอธิบายคัมภีร์ของอัลลอฮ์ จึงบ่งว่าวาญิบ เพราะการกระทำของท่านนบี ﷺ ที่อธิบายสิ่งวาญิบก็เป็นวาญิบ และความกว้างของคำว่า \"จงเริ่มด้วยสิ่งที่อัลลอฮ์ทรงเริ่ม\" ก็สนับสนุน", "ส่วนการบ้วนปากและสูดน้ำเข้าจมูกก่อนล้างหน้า มีสองทัศนะ ทัศนะแรก: ส่งเสริมให้ทำก่อนล้างหน้า เป็นทัศนะที่ถูกต้องในมัซฮับหันบะลีย์ เพราะความเป็นวาญิบของทั้งสองยืนยันด้วยซุนนะฮ์ ส่วนการเรียงลำดับวาญิบด้วยหลักฐานจากอัลกุรอานที่ซุนนะฮ์สนับสนุน ซึ่งไม่มีในทั้งสอง ทัศนะที่สอง: วาญิบให้ทำก่อนล้างหน้า เป็นอีกทัศนะในมัซฮับหันบะลีย์ และอันนะวะวีย์ระบุว่าการเรียงลำดับระหว่างทั้งสองกับอวัยวะวุฎูอ์อื่นเป็นเงื่อนไข เพราะทุกคนที่อธิบายวุฎูอ์ของท่านนบี ﷺ ในหะดีษศ่อฮีห์ระบุว่าท่านเริ่มด้วยบ้วนปากและสูดน้ำเข้าจมูก และผู้รายงานเรียงลำดับอวัยวะด้วยคำว่า \"แล้ว\" ในบริบทของการอธิบาย ซึ่งบ่งลำดับ"]}], "tags_th": ["เรียงลำดับ", "วุฎูอ์", "วาญิบ", "หัจญ์", "ชาซ"]}, {"id": "v1-h048", "volume": 1, "bab": "wudu", "topic_ar": "إدخال المرفقين في الوضوء", "topic_th": "การล้างข้อศอกรวมด้วยเมื่ออาบน้ำละหมาด", "pages": [215, 216], "hadith": [{"no": 48, "matn_ar": "وَعَنْهُ قَالَ: كَانَ النَّبِيُّ ﷺ إِذَا تَوَضَّأَ أَدَارَ الْمَاءَ عَلَى مِرْفَقَيْهِ. أَخْرَجَهُ الدَّارَقُطْنِيُّ بِإِسْنَادٍ ضَعِيفٍ.", "translation_th": "จากญาบิร (ร.ฎ.) กล่าวว่า ท่านนบี ﷺ เมื่ออาบน้ำละหมาด ท่านให้น้ำไหลรอบข้อศอกทั้งสองของท่าน บันทึกโดยอัดดารุกุฏนีย์ ด้วยสายรายงานที่อ่อน", "grade_th": "ฎออีฟ (อ่อนมาก) แต่ความหมายถูกต้อง"}], "key_rulings_th": ["ต้องล้างข้อศอกรวมด้วยเมื่อล้างมือ และล้างตาตุ่มรวมด้วยเมื่อล้างเท้า", "หะดีษนี้อ่อนมาก แต่ความหมายถูกต้อง และมีหะดีษอบูฮุร็อยเราะฮ์ในมุสลิมที่ชัดเจนแทนได้", "คำว่า \"ถึง\" (อิลา) ในอายะฮ์ \"มือของพวกเจ้าถึงข้อศอก\" หมายถึง \"พร้อมกับ\" เพราะซุนนะฮ์อธิบายอัลกุรอาน"], "vocab": [{"ar": "أَدَارَ الْمَاءَ عَلَى مِرْفَقَيْهِ", "th": "ให้น้ำไหลรอบข้อศอกทั้งสอง คือล้างข้อศอกรวมด้วย"}, {"ar": "الْمَتْرُوك", "th": "ผู้รายงานที่ถูกทิ้ง (ศัพท์หะดีษ) คือผู้ถูกกล่าวหาว่าโกหก หรือผิดพลาดมาก ดีกว่าผู้กุหะดีษเล็กน้อย"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัดดารุกุฏนีย์บันทึกในสุนันของเขา ผ่านอัลกอสิม บินมุหัมมัด บินอับดิลลาฮ์ บินอะกีล จากปู่ จากญาบิร", "สายรายงานอ่อนมาก อิบนุหะญัรยกหะดีษนี้เพื่อให้รู้สถานะว่าอ่อน แต่ไม่ได้บอกว่าอ่อนแค่ไหน อ่อนเพราะอัลกอสิม บินมุหัมมัด บินอับดิลลาฮ์ บินอะกีล อัซซะฮะบีย์ยกคำของอิบนุมะอีนว่า \"ไม่มีค่าอะไร\" อบูหาติมว่า \"ถูกทิ้ง\" อิมามอะห์มัดว่า \"ไม่มีค่าอะไร\" อบูซุรอะฮ์ว่า \"หะดีษของเขามุงกัร และหะดีษของเขาอ่อน\" ส่วนอับดุลลอฮ์ บินอะกีลได้กล่าวไปแล้ว", "\"ถูกทิ้ง\" (มัตรูก) คือผู้ที่ถูกกล่าวหาว่าโกหก หรือผิดพลาดมาก สถานะของเขาดีกว่าผู้กุหะดีษเล็กน้อย ถ้ากล่าวว่า \"นักวิชาการเห็นพ้องกันว่าทิ้งเขา\" ก็หนักกว่าการกล่าวว่า \"คนหนึ่งทิ้งเขา\""]}, {"wajh": 2, "type": "fiqh", "heading_ar": null, "heading_th": "ต้องล้างข้อศอกรวมด้วย", "points_th": ["หะดีษเป็นหลักฐานว่าการล้างข้อศอกในการอาบน้ำละหมาดเป็นวาญิบ เพราะท่านนบี ﷺ ให้น้ำไหลรอบข้อศอก หุก่มที่หะดีษบ่งชี้นี้ถูกต้อง ตัวบทจึงถูกต้องในความหมาย แต่สายรายงานอ่อน", "หะดีษอบูฮุร็อยเราะฮ์ที่กล่าวไปแล้วใช้แทนได้: เขาอาบน้ำละหมาด ล้างหน้าให้ทั่ว แล้วล้างมือขวาจนขึ้นไปถึงต้นแขน แล้วมือซ้ายจนขึ้นไปถึงต้นแขน... และตอนท้ายกล่าวว่า \"อย่างนี้แหละที่ฉันเห็นท่านรสูลุลลอฮ์ ﷺ อาบน้ำละหมาด\" นี่เป็นตัวบทที่ถูกต้องว่าข้อศอกรวมอยู่ในการล้างมือ และตาตุ่มรวมอยู่ในการล้างเท้า", "หะดีษนี้จึงเป็นหลักฐานว่าขอบเขตรวมอยู่ด้วย และคำว่า \"ถึง\" ในอายะฮ์ \"มือของพวกเจ้าถึงข้อศอก\" หมายถึง \"พร้อมกับ\" เพราะซุนนะฮ์อธิบายอัลกุรอาน (กล่าวไปแล้วในหะดีษอุษมาน หะดีษที่สองของบทวุฎูอ์)"]}], "tags_th": ["ข้อศอก", "วุฎูอ์", "ล้างมือ", "หะดีษอ่อน"]}, {"id": "v1-h049-051", "volume": 1, "bab": "wudu", "topic_ar": "حكم التسمية في الوضوء", "topic_th": "หุก่มการกล่าวบิสมิลลาฮ์เมื่ออาบน้ำละหมาด", "pages": [217, 224], "hadith": [{"no": 49, "matn_ar": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «لَا وُضُوءَ لِمَنْ لَمْ يَذْكُرِ اسْمَ اللهِ عَلَيْهِ». أَخْرَجَهُ أَحْمَدُ، وَأَبُو دَاوُدَ، وَابْنُ مَاجَهْ، بِإِسْنَادٍ ضَعِيفٍ.", "translation_th": "จากอบูฮุร็อยเราะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"ไม่มีวุฎูอ์สำหรับผู้ที่ไม่กล่าวพระนามของอัลลอฮ์ในการอาบน้ำละหมาด\" บันทึกโดยอะห์มัด อบูดาวูด และอิบนุมาญะฮ์ ด้วยสายรายงานที่อ่อน", "grade_th": "ฎออีฟ (อ่อน)"}, {"no": 50, "matn_ar": "وَلِلتِّرْمِذِيِّ: عَنْ سَعِيدِ بْنِ زَيْدٍ.", "translation_th": "และในรายงานของอัตติรมิซีย์ จากสะอีด บินซัยด์ (ร.ฎ.) (ด้วยความหมายเดียวกัน)", "grade_th": "ฎออีฟ (อ่อน)"}, {"no": 51, "matn_ar": "وَأَبِي سَعِيدٍ نَحْوُهُ. قَالَ أَحْمَدُ: لَا يَثْبُتُ فِيهِ شَيْءٌ.", "translation_th": "และจากอบูสะอีด (ร.ฎ.) ด้วยความหมายใกล้เคียงกัน อะห์มัดกล่าวว่า ไม่มีหะดีษใดในเรื่องนี้ที่ถูกต้อง", "grade_th": "สายรายงานพอใช้ได้ (ศอลิห์) แต่ละสายอ่อน และเมื่อรวมกันอาจถึงระดับหะซัน ลิฆ็อยริฮี"}], "key_rulings_th": ["หะดีษทุกสายในเรื่องนี้อ่อน แต่เมื่อรวมกันแล้ว นักวิชาการหลายท่านเห็นว่ามีที่มาและถึงระดับหะซัน", "ผู้แต่งเห็นว่าทัศนะที่มีน้ำหนักคือ การกล่าวบิสมิลลาฮ์เป็นสุนัตที่หนักแน่น (ทัศนะของนักวิชาการส่วนใหญ่) ไม่ควรละไว้โดยตั้งใจ แต่ถ้าละไว้ วุฎูอ์ยังใช้ได้", "อีกทัศนะว่าเป็นวาญิบ (ซอฮิรียะฮ์ อีกรายงานจากอะห์มัด และอิสหาก)", "คำว่า \"ไม่มีวุฎูอ์\" หมายถึงไม่สมบูรณ์ ไม่ใช่ใช้ไม่ได้ เพื่อให้สอดคล้องกับหะดีษศ่อฮีห์อื่น", "กล่าวว่า \"บิสมิลลาฮ์\" หลังการตั้งเจตนา ก่อนเริ่มการชำระ การเพิ่ม \"อัรเราะห์มานิรเราะฮีม\" ไม่มีหลักฐาน การกล่าวตามที่มีรายงานดีกว่า"], "vocab": [{"ar": "لَا وُضُوءَ", "th": "ไม่มีวุฎูอ์ ในที่นี้หมายถึงวุฎูอ์ที่สมบูรณ์ ไม่ใช่วุฎูอ์ที่ใช้ได้"}, {"ar": "اسْمَ اللهِ", "th": "การกล่าวว่า บิสมิลลาฮ์ (ด้วยพระนามของอัลลอฮ์) คำอื่นใช้แทนไม่ได้"}, {"ar": "فِيهِ لِين", "th": "มีความอ่อน (ศัพท์หะดีษ) คือความจำของผู้รายงานถูกวิจารณ์ แต่ยังไม่หลุดจากขอบเขตที่นำหะดีษมาพิจารณาได้ และไม่กระทบความน่าเชื่อถือด้านศาสนา"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["สะอีด บินซัยด์ บินอัมร์ บินนุฟัยล์ บินอับดิลอุซซา อัลกุร็อชีย์ อัลอะดะวีย์ หนึ่งในสิบคนที่ได้รับแจ้งข่าวดีว่าจะเข้าสวรรค์ เข้ารับอิสลามแต่เนิ่น ๆ ภรรยาของเขาคือฟาฏิมะฮ์ บินติลค็อฏฏอบ น้องสาวของอุมัร และที่บ้านของเขาเป็นที่อุมัรเข้ารับอิสลาม", "เขาร่วมทุกสงคราม ยกเว้นบัดร์ เพราะอยู่ที่ชาม เขาร่วมสงครามยัรมูกและการพิชิตดิมัชก์ เป็นเศาะหาบะฮ์ที่ประเสริฐ อัซซะฮะบีย์ระบุว่าเขามีสี่สิบแปดหะดีษ อัลบุคอรีย์และมุสลิมบันทึกตรงกันสองหะดีษ อัลบุคอรีย์บันทึกคนเดียวอีกหนึ่งหะดีษ เรื่องของเขากับอัรวา บินติอุวัยส์ ที่ดุอาอ์ของเขาถูกตอบรับเป็นที่รู้จักและอยู่ในเศาะฮีหัยน์ (จะกล่าวในบทการแย่งชิงในหมวดการซื้อขาย) เขาเสียชีวิตปี ฮ.ศ. 50"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجها", "heading_th": "ที่มาของหะดีษทั้งสาม", "points_th": ["หะดีษอบูฮุร็อยเราะฮ์: อะห์มัด อบูดาวูด (101) ในหมวดฏอฮาเราะฮ์ บทการกล่าวบิสมิลลาฮ์ในวุฎูอ์ และอิบนุมาญะฮ์ (399) ผ่านยะอ์กูบ บินสะละมะฮ์ อัลลัยษีย์ จากบิดา จากอบูฮุร็อยเราะฮ์ สำนวนว่า \"ไม่มีละหมาดสำหรับผู้ที่ไม่มีวุฎูอ์ และไม่มีวุฎูอ์สำหรับผู้ที่ไม่กล่าวพระนามของอัลลอฮ์\" สายรายงานอ่อนด้วยสองเหตุ (1) ยะอ์กูบและบิดาไม่เป็นที่รู้จัก อิบนุหะญัรว่ายะอ์กูบเป็นผู้มีหะดีษน้อย มีเพียงมุหัมมัด บินมูซา อัลฟิฏรีย์ที่รายงานจากเขา และบิดาไม่เป็นที่รู้จัก มีเพียงลูกชายที่รายงานจากเขา (2) ความต่อเนื่องของสายน่าสงสัย อัลบุคอรีย์กล่าวว่า \"ไม่เป็นที่รู้ว่าสะละมะฮ์ได้ยินจากอบูฮุร็อยเราะฮ์ และยะอ์กูบได้ยินจากบิดา\"", "อัลหากิมพลาดที่ว่า \"สายรายงานศ่อฮีห์ มุสลิมใช้ยะอ์กูบ บินอบีสะละมะฮ์ อัลมาญิชูนเป็นหลักฐาน\" เพราะเข้าใจผิดว่าเป็นคนละคน อัซซะฮะบีย์แก้ว่า \"ที่ถูกคือ อัลลัยษีย์... และสายรายงานมีความอ่อน\" หะดีษนี้ยังมีสายอื่นที่อ่อนทั้งหมด และมีหลักฐานสนับสนุนที่อิบนุหะญัรยกสองบท คือหะดีษสะอีด บินซัยด์และหะดีษอบูสะอีด", "หะดีษสะอีด บินซัยด์: อัตติรมิซีย์บันทึก (25) ผ่านอบูษิฟาล อัลมุรรีย์ จากเราะบาห์ บินอับดิรเราะห์มาน จากย่า (ยาย) ของเขา จากบิดาของนาง คือสะอีด บินซัยด์ แบบมัรฟูอ์ \"ไม่มีวุฎูอ์สำหรับผู้ที่ไม่กล่าวพระนามของอัลลอฮ์\" สายรายงานอ่อน อบูษิฟาลมีผู้รายงานจากเขาหลายคน แต่อัลบุคอรีย์กล่าวว่า \"หะดีษของเขาต้องพิจารณา\" ซึ่งเป็นสำนวนที่เขาใช้กับผู้ที่เขาถือว่าอ่อน อัซซะฮะบีย์ว่า \"ไม่แข็งแรง และสายรายงานไม่ผ่าน\" อิบนุหะญัรว่า \"เป็นที่รับได้\" ส่วนเราะบาห์ อบูหาติมและอบูซุรอะฮ์ว่าไม่เป็นที่รู้จัก ย่า (ยาย) ของเราะบาห์ชื่ออัสมาอ์ บินติสะอีด บินซัยด์ มีการกล่าวถึงในฐานะเศาะหาบะฮ์ แต่อัซซะฮะบีย์นับนางเป็นหญิงที่ไม่เป็นที่รู้จัก อัตติรมิซีย์ยกคำของอัลบุคอรีย์ว่า \"สิ่งที่ดีที่สุดในบทนี้คือหะดีษของเราะบาห์ บินอับดิรเราะห์มาน\"", "หะดีษอบูสะอีด อัลคุดรีย์: อิบนุมาญะฮ์ (397) อะห์มัด และอัตติรมิซีย์ในอัลอิลัลอัลกะบีร ผ่านกะษีร บินซัยด์ จากรุบัยห์ บินอับดิรเราะห์มาน บินอบีสะอีด จากบิดา จากปู่ \"ไม่มีวุฎูอ์สำหรับผู้ที่ไม่กล่าวพระนามของอัลลอฮ์\" สายรายงานพอใช้ได้ กะษีร บินซัยด์ บางคนว่าเชื่อถือได้ บางคนว่าอ่อน ผู้แต่งสรุปว่าเขาใกล้ความแข็งแรงมากกว่าความอ่อน ตามหลักว่า ถ้าผู้วิจารณ์และผู้รับรองเท่ากัน หะดีษเป็นหะซันเมื่อมีหลักฐานสนับสนุน ถ้าฝ่ายวิจารณ์มากกว่าก็อ่อน และถ้าฝ่ายรับรองมากกว่า โดยฝ่ายวิจารณ์ไม่ได้อธิบายเหตุผล ก็ใกล้ความแข็งแรง", "รุบัยห์ อิบนุหิบบานว่าเชื่อถือได้ อิบนุอะดีย์ว่า \"ฉันหวังว่าเขาไม่เป็นไร\" อบูหาติมว่า \"เป็นผู้อาวุโส\" (คือเขียนหะดีษของเขาไว้ได้และพิจารณา) อิมามอะห์มัดว่า \"รุบัยห์เป็นคนที่ไม่เป็นที่รู้จัก\" อิบนุลมุลักกินว่าข้อนี้ไม่ใช่การวิจารณ์ เพราะคนอื่นรู้จักเขา และผู้ที่รู้เป็นหลักฐานเหนือผู้ที่ไม่รู้ อัลบุคอรีย์ว่า \"หะดีษของเขามุงกัร\" อิบนุหะญัรว่า \"เป็นที่รับได้\" คือเมื่อมีสายสนับสนุน", "อิบนุอะดีย์ยกว่าอะห์มัดถูกถามเรื่องการกล่าวบิสมิลลาฮ์ในวุฎูอ์ เขาตอบว่า \"ฉันไม่รู้หะดีษใดในเรื่องนี้ที่ถูกต้อง ที่แข็งแรงที่สุดคือหะดีษของกะษีร บินซัยด์ จากรุบัยห์ และรุบัยห์ไม่เป็นที่รู้จัก\" อิบนุหะญัรแย้งว่า การไม่รู้ไม่ได้หมายความว่าไม่มี และการไม่ถูกต้องไม่ได้หมายความว่าอ่อน เพราะอาจหมายถึงไม่ถึงระดับศ่อฮีห์ จึงไม่ปฏิเสธระดับหะซัน และการปฏิเสธทีละหะดีษไม่ได้หมายถึงปฏิเสธเมื่อรวมกัน อัลอะษร็อมถามอะห์มัด เขาตอบว่า \"สิ่งที่ดีที่สุดคือหะดีษของรุบัยห์ จากอบูสะอีด\" ซึ่งไม่ขัดกัน เพราะอันนะวะวีย์กล่าวว่า คำว่า \"ถูกต้องที่สุดในบทนี้\" ไม่ได้หมายความว่าหะดีษศ่อฮีห์ แต่หมายถึงมีน้ำหนักที่สุดหรืออ่อนน้อยที่สุด อิสหาก บินรอฮะวัยฮ์ก็ว่าหะดีษนี้ถูกต้องที่สุดในบท", "ในเรื่องนี้ยังมีหะดีษอื่น ซึ่งสายรายงานล้วนมีข้อวิจารณ์ แต่บางหะดีษเสริมกัน อัลมุนซิรีย์กล่าวว่า \"ไม่ต้องสงสัยว่าหะดีษเรื่องการกล่าวบิสมิลลาฮ์ แม้ไม่มีหะดีษใดพ้นจากข้อวิจารณ์ ก็เสริมกันด้วยสายที่มาก และมีความแข็งแรง\" อิบนุหะญัรว่า \"ที่ชัดคือหะดีษทั้งหมดรวมกันมีความแข็งแรง บ่งว่ามีที่มา\" อิบนุกะษีรว่า \"รายงานจากหลายสายที่เสริมกัน จึงเป็นหะดีษหะซันหรือศ่อฮีห์\" และอิบนุลก็อยยิมว่า \"หะดีษเรื่องการกล่าวบิสมิลลาฮ์ในวุฎูอ์เป็นหะดีษหะซัน\""]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظها", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ไม่มีละหมาดสำหรับผู้ที่ไม่มีวุฎูอ์\" คำว่า \"ไม่\" ปฏิเสธทั้งประเภท ความหมายคือ ไม่มีละหมาดที่ใช้ได้สำหรับผู้ไม่มีวุฎูอ์ เพราะวุฎูอ์เป็นเงื่อนไขของละหมาดที่ใช้ได้โดยอิจญ์มาอ์ของมุสลิม", "\"และไม่มีวุฎูอ์\" ความหมายคือ ไม่มีวุฎูอ์ที่ใช้ได้ หรือที่สมบูรณ์ คำนี้เป็นการปฏิเสธความสมบูรณ์หรือความใช้ได้ เพราะการปฏิเสธตัวการกระทำเป็นไปไม่ได้ ผู้ที่อาบน้ำละหมาดโดยไม่กล่าวพระนามอัลลอฮ์ก็ถือว่าอาบแล้วจริง เพราะการกระทำของวุฎูอ์เกิดขึ้นแล้ว", "หะนะฟีย์ถือว่าตัวบทลักษณะนี้คลุมเครือ (มุจมัล) ความหมายไม่ชัด เพราะอาจหมายถึงทั้งปฏิเสธความใช้ได้หรือปฏิเสธความสมบูรณ์ นักวิชาการส่วนใหญ่ว่า เมื่อการปฏิเสธมุ่งไปที่ความหมายทางศาสนา (เพราะถ้อยคำมาในภาษาศาสนา) ก็ไม่ถือว่าคลุมเครือ แต่ตีความตามจุดประสงค์ เพราะหลักเดิมคือใช้หลักฐานศาสนา และศาสนาไม่ได้พูดด้วยถ้อยคำเหล่านี้นอกจากต้องการให้มีหุก่มตามมา", "หลักเดิมของการปฏิเสธในตัวบทศาสนาคือปฏิเสธความใช้ได้ เพราะมาก่อนการปฏิเสธความสมบูรณ์ เว้นแต่มีหลักฐานว่าหมายถึงความสมบูรณ์ ก็ปฏิบัติตามนั้น ซึ่งในที่นี้เป็นเช่นนั้น เพราะถ้าตีความว่าปฏิเสธความใช้ได้ จะขัดกับหะดีษศ่อฮีห์ (ดังจะกล่าว) แต่ถ้าตีความว่าปฏิเสธความสมบูรณ์ ก็สอดคล้องกับหะดีษศ่อฮีห์ จึงตีความเช่นนั้น เพื่อให้ตัวบทสอดคล้องกันและไม่ขัดกัน", "\"พระนามของอัลลอฮ์\" คือการกล่าวบิสมิลลาฮ์ในวุฎูอ์ โดยกล่าวว่า \"บิสมิลลาฮ์\" คำอื่นใช้แทนไม่ได้ ตำแหน่งของมันคือหลังการตั้งเจตนา ก่อนการกระทำทั้งหมดของการชำระ ที่ต้องการคือกล่าวเพียง \"บิสมิลลาฮ์\" ส่วนการเพิ่ม \"อัรเราะห์มานิรเราะฮีม\" นักนิติศาสตร์กลุ่มหนึ่งเห็นเช่นนั้น ที่ชัดคือเป็นการเห็นว่าดีเอง (อิสติห์สาน) และไม่มีหลักฐาน การกล่าวตามที่มีรายงานจากท่านรสูลุลลอฮ์ ﷺ จึงดีกว่าและประเสริฐกว่า"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "บิสมิลลาฮ์ในวุฎูอ์: วาญิบหรือสุนัต", "points_th": ["ตามรูปคำ หะดีษบ่งว่าการกล่าวบิสมิลลาฮ์ในวุฎูอ์เป็นวาญิบ ตามหลักว่าการปฏิเสธหมายถึงปฏิเสธความใช้ได้ เพราะใกล้กับการปฏิเสธตัวการกระทำมากกว่า ความหมายคือ ไม่มีวุฎูอ์ที่ใช้ได้สำหรับผู้ไม่กล่าวพระนามของอัลลอฮ์ เป็นทัศนะของซอฮิรียะฮ์ อีกรายงานจากอิมามอะห์มัดที่ศิษย์บางท่านเลือก และทัศนะของอิสหาก แต่พวกเขาต่างกันว่าความเป็นวาญิบตกไปเมื่อลืมหรือไม่", "ทัศนะที่สอง: การกล่าวบิสมิลลาฮ์เป็นสุนัต เป็นทัศนะของนักวิชาการส่วนใหญ่ รวมถึงอิมามทั้งสาม และอีกรายงานจากอะห์มัด อัลคิร็อกีย์และอบูมุหัมมัด อิบนุกุดามะฮ์เลือก นักวิชาการหันบะลีย์กลุ่มหนึ่งระบุว่าเป็นมัซฮับที่คำของอะห์มัดมาลงตัว อิบนุลมุนซิร อบูอุบัยด์ อิบนุหัซม์ และอิบนุกะษีรว่ามีน้ำหนัก มุหัมมัด บินอิบรอฮีม และอิบนุบาซเลือก", "หลักฐานของทัศนะที่สอง (1) อายะฮ์ \"โอ้บรรดาผู้ศรัทธา เมื่อพวกเจ้าลุกขึ้นไปละหมาด จงล้างหน้า...\" อัลลอฮ์สั่งให้ล้าง ไม่ได้สั่งให้กล่าวบิสมิลลาฮ์ ถ้าเป็นวาญิบ ก็คงสั่ง เหมือนที่สั่งในการล่าสัตว์ \"และจงกล่าวพระนามของอัลลอฮ์บนมัน\" (อัลมาอิดะฮ์: 4) และในการเชือด \"ดังนั้นจงกล่าวพระนามของอัลลอฮ์บนมัน ขณะที่พวกมันยืนเรียงแถว\" (อัลหัจญ์: 36) อบูซุรอะฮ์ อัดดิมัชกีย์ถามอะห์มัดว่า คำว่า \"ไม่มีวุฎูอ์สำหรับผู้ที่ไม่กล่าวพระนามของอัลลอฮ์\" หมายความว่าอย่างไร เขาตอบว่า \"มีหลายหะดีษ แต่ไม่แข็งแรง อัลลอฮ์ตรัสว่า 'เมื่อพวกเจ้าลุกขึ้นไปละหมาด' พระองค์ไม่ได้บังคับให้กล่าวบิสมิลลาฮ์ และนี่คือสิ่งที่ประทานลงมา และซุนนะฮ์ไม่ได้ยืนยัน\"", "(2) หะดีษริฟาอะฮ์ บินรอฟิอ์ เรื่องผู้ที่ละหมาดไม่ดี: \"จงอาบน้ำละหมาดตามที่อัลลอฮ์ทรงสั่งท่าน\" (อบูดาวูด หะดีษอยู่ในเศาะฮีหัยน์แต่ไม่มีประโยคนี้) ท่านนบี ﷺ ส่งเขาไปยังวิธีอาบน้ำละหมาดตามอายะฮ์ ซึ่งไม่มีการกล่าวบิสมิลลาฮ์ (3) เศาะหาบะฮ์อธิบายวุฎูอ์ของท่านนบี ﷺ อย่างสมบูรณ์ (กล่าวไปแล้ว) ไม่มีใครกล่าวว่าท่านกล่าวบิสมิลลาฮ์ตอนเริ่ม ถ้าเป็นวาญิบ ท่านคงไม่ละไว้", "ผู้แต่งเห็นว่าทัศนะนี้มีน้ำหนัก อินชาอัลลอฮ์ คือการกล่าวบิสมิลลาฮ์เป็นสุนัต ควรทำในการอาบน้ำละหมาดและเป็นสุนัตที่หนักแน่น ไม่ควรละไว้โดยตั้งใจ ถ้าละไว้ วุฎูอ์ใช้ได้ อิมามแห่งซุนนะฮ์ อะห์มัด บินหันบัล ก็ฟัตวาเช่นนี้ อบูดาวูดถามอะห์มัดเรื่องการกล่าวบิสมิลลาฮ์ในวุฎูอ์ เขาตอบว่า \"ฉันหวังว่าจะไม่มีอะไรต่อเขา แต่ฉันไม่ชอบให้เขาละไว้ ไม่ว่าจะพลาดหรือตั้งใจ และหะดีษในเรื่องนี้ไม่มีสายรายงาน (ที่ถูกต้อง)\"", "ส่วนหลักฐานของฝ่ายวาญิบไม่แข็งแรงพอ ด้านสายรายงาน อย่างมากที่สุดก็ถึงระดับหะซันลิฆ็อยริฮี เพราะเสริมกันและรวมกัน และยังขัดกับหะดีษที่ถูกต้องกว่าที่อัลบุคอรีย์และมุสลิมบันทึกตรงกันเรื่องวิธีอาบน้ำละหมาดของท่านนบี ﷺ ประกอบกับความหมายของอายะฮ์ หลักคือ เมื่อหะซันขัดกับศ่อฮีห์ ให้ยึดศ่อฮีห์ นี่เป็นประโยชน์หนึ่งของการแบ่งหะดีษเป็นศ่อฮีห์และหะซัน ด้านตัวบท คำว่า \"ไม่มีวุฎูอ์\" ตีความว่าปฏิเสธความสมบูรณ์ ไม่ใช่ความใช้ได้ ดังที่กล่าวมา"]}], "tags_th": ["บิสมิลลาฮ์", "วุฎูอ์", "สุนัต", "หะซันลิฆ็อยริฮี", "หะดีษอ่อน"]}, {"id": "v1-h052-054", "volume": 1, "bab": "wudu", "topic_ar": "كيفية المضمضة والاستنشاق", "topic_th": "วิธีบ้วนปากและสูดน้ำเข้าจมูก", "pages": [225, 230], "hadith": [{"no": 52, "matn_ar": "عَنْ طَلْحَةَ بْنِ مُصَرِّفٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ قَالَ: رَأَيْتُ رَسُولَ اللهِ ﷺ يَفْصِلُ بَيْنَ الْمَضْمَضَةِ وَالِاسْتِنْشَاقِ. أَخْرَجَهُ أَبُو دَاوُدَ بِإِسْنَادٍ ضَعِيفٍ.", "translation_th": "จากฏ็อลหะฮ์ บินมุศ็อรริฟ จากบิดา จากปู่ของเขา กล่าวว่า ฉันเห็นท่านรสูลุลลอฮ์ ﷺ แยกระหว่างการบ้วนปากกับการสูดน้ำเข้าจมูก บันทึกโดยอบูดาวูด ด้วยสายรายงานที่อ่อน", "grade_th": "ฎออีฟ (อ่อน)"}, {"no": 53, "matn_ar": "عَنْ عَلِيٍّ رَضِيَ اللهُ عَنْهُ - فِي صِفَةِ الْوُضُوءِ -: ثُمَّ تَمَضْمَضَ ﷺ وَاسْتَنْثَرَ ثَلَاثًا، يُمَضْمِضُ وَيَنْثُرُ مِنَ الْكَفِّ الَّذِي يَأْخُذُ مِنْهُ الْمَاءَ. أَخْرَجَهُ أَبُو دَاوُدَ وَالنَّسَائِيُّ.", "translation_th": "จากอะลี (ร.ฎ.) เกี่ยวกับวิธีอาบน้ำละหมาด กล่าวว่า แล้วท่านนบี ﷺ บ้วนปากและสั่งน้ำออกจากจมูกสามครั้ง ท่านบ้วนปากและสั่งน้ำออกจากฝ่ามือที่ท่านตักน้ำนั้น บันทึกโดยอบูดาวูดและอันนะสาอีย์", "grade_th": "ศ่อฮีห์"}, {"no": 54, "matn_ar": "عَنْ عَبْدِ اللهِ بْنِ زَيْدٍ رَضِيَ اللهُ عَنْهُ - فِي صِفَةِ الْوُضُوءِ -: ثُمَّ أَدْخَلَ ﷺ يَدَهُ، فَمَضْمَضَ وَاسْتَنْشَقَ مِنْ كَفٍّ وَاحِدَةٍ، يَفْعَلُ ذَلِكَ ثَلَاثًا. مُتَّفَقٌ عَلَيْهِ.", "translation_th": "จากอับดุลลอฮ์ บินซัยด์ (ร.ฎ.) เกี่ยวกับวิธีอาบน้ำละหมาด กล่าวว่า แล้วท่านนบี ﷺ สอดมือลงไป แล้วบ้วนปากและสูดน้ำเข้าจมูกจากฝ่ามือเดียว ท่านทำเช่นนั้นสามครั้ง บันทึกโดยอัลบุคอรีย์และมุสลิม", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["วิธีที่มีน้ำหนัก (ผู้แต่งและอันนะวะวีย์): บ้วนปากและสูดน้ำเข้าจมูกด้วยน้ำกอบเดียว ทำเช่นนี้สามครั้ง รวมสามกอบ ตามหะดีษอับดุลลอฮ์ บินซัยด์ในเศาะฮีหัยน์", "การแยกบ้วนปากและสูดน้ำเข้าจมูก (หกกอบ) มาจากหะดีษฏ็อลหะฮ์ซึ่งอ่อน ใช้เป็นหลักฐานไม่ได้", "อีกวิธีคือบ้วนปากและสูดน้ำเข้าจมูกสามครั้งด้วยน้ำกอบเดียว แต่ในทางปฏิบัติอาจทำได้ยาก", "อัศศ็อนอานีย์เห็นว่าเลือกได้ และทุกแบบเป็นซุนนะฮ์ แม้รายงานแบบรวมจะมากกว่าและถูกต้องกว่า"], "vocab": [{"ar": "يَفْصِلُ", "th": "แยก คือตักน้ำบ้วนปากต่างหาก แล้วตักน้ำสูดเข้าจมูกต่างหาก"}, {"ar": "مِنْ كَفٍّ وَاحِدَةٍ", "th": "จากน้ำกอบเดียว ใช้ทั้งบ้วนปากและสูดน้ำเข้าจมูก"}, {"ar": "أَيْش", "th": "คำย่อของ أَيُّ شَيْءٍ (อะไร) ใช้ในความหมายตำหนิว่า \"ไม่มีค่าอะไร\""}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["ฏ็อลหะฮ์ บินมุศ็อรริฟ บินกะอ์บ อัลยามีย์ อัลฮัมดานีย์ ชาวกูฟะฮ์ กุนยะฮ์ อบูมุหัมมัด หรืออบูอับดิลลาฮ์ ตาบิอีนผู้มีชื่อเสียงและแม่นยำ ได้รับฉายาว่า \"ผู้นำของนักอ่านอัลกุรอาน\" เชื่อถือได้ และเป็นผู้รายงานของอัลบุคอรีย์และมุสลิม อิบนุหะญัรว่า \"เชื่อถือได้ นักอ่าน ผู้ประเสริฐ\"", "บิดาของเขาคือมุศ็อรริฟ บินอัมร์ บินกะอ์บ ตามที่อิบนุลก็อฏฏอนระบุ บ้างว่าบินกะอ์บ บินอัมร์ ชาวกูฟะฮ์ เขารายงานจากบิดาเรื่องการเช็ดศีรษะของท่านนบี ﷺ ในอบูดาวูด และฏ็อลหะฮ์ลูกชายรายงานจากเขา ส่วนปู่ของฏ็อลหะฮ์ คืออัมร์ บินกะอ์บ หรือกะอ์บ บินอัมร์ มีความเห็นต่างว่าเป็นเศาะหาบะฮ์หรือไม่ นักหะดีษส่วนใหญ่ว่าเป็น อิบนุอับดิลบัรร์ว่า \"เขาเป็นเศาะหาบะฮ์ บางคนปฏิเสธ แต่ไม่มีเหตุผลที่จะปฏิเสธ\"", "นักวิชาการส่วนใหญ่ว่าบิดาของฏ็อลหะฮ์ คือมุศ็อรริฟ ไม่เป็นที่รู้จัก ตามที่อิบนุลก็อฏฏอนกล่าว อบูดาวูดเล่าว่า ได้ยินอะห์มัดกล่าวว่า อิบนุอุยัยนะฮ์ปฏิเสธหะดีษนี้ และกล่าวว่า \"ฏ็อลหะฮ์ จากบิดา จากปู่ นี่อะไรกัน\" (คือสายรายงานนี้ไม่มีค่า) เพราะฏ็อลหะฮ์รายงานจากบิดาและปู่ ซึ่งไม่เป็นที่รู้จัก อุษมาน อัดดาริมีย์ยกจากอะลี บินอัลมะดีนีย์เช่นกัน และอะห์มัดถูกถามว่าปู่ของฏ็อลหะฮ์เป็นเศาะหาบะฮ์หรือไม่ เขาตอบว่า \"ฉันไม่รู้ และได้ยินว่าสุฟยาน บินอุยัยนะฮ์ปฏิเสธว่าเขาเป็นเศาะหาบะฮ์\""]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجها", "heading_th": "ที่มาของหะดีษทั้งสาม", "points_th": ["หะดีษฏ็อลหะฮ์: อบูดาวูดบันทึก (139) ผ่านมุอ์ตะมิร บินสุลัยมาน ว่า ฉันได้ยินลัยษ์เล่าจากฏ็อลหะฮ์ จากบิดา จากปู่ ว่า \"ฉันเข้าไปหาท่านนบี ﷺ ขณะที่ท่านกำลังอาบน้ำละหมาด และน้ำไหลจากหน้าและเคราของท่านลงบนอก ฉันเห็นท่านแยกระหว่างการบ้วนปากกับการสูดน้ำเข้าจมูก\" อบูดาวูดไม่ได้วิจารณ์ สายรายงานอ่อนด้วยสองเหตุ", "เหตุแรก: มาจากลัยษ์ บินอบีสุลัยม์ ซึ่งนักวิชาการส่วนใหญ่ว่าอ่อน อันนะวะวีย์ถึงกับรายงานว่านักวิชาการเห็นพ้องว่าเขาอ่อน อิบนุลมุลักกินว่า \"มีข้อพิจารณา\" ยะห์ยา บินมะอีนและอันนะสาอีย์ว่าอ่อน อะห์มัดว่า \"หะดีษของเขาสับสน แต่คนก็รายงานจากเขา\" อิบนุหิบบานว่า \"เขาเป็นผู้ทำอิบาดะฮ์ แต่ความจำสับสนในบั้นปลาย จนไม่รู้ว่ากำลังเล่าอะไร สลับสายรายงาน ยกรายงานมุรสัลเป็นมัรฟูอ์ และนำสิ่งที่ไม่ใช่หะดีษมาพาดพิงผู้เชื่อถือได้\" อิบนุหะญัรว่า \"สัจจริง ความจำสับสนมาก และแยกหะดีษไม่ออก จึงถูกทิ้ง\" สรุปคือรายงานของเขาถูกปฏิเสธเพราะความจำสับสน และแยกไม่ได้ว่ารายงานใดก่อนหรือหลังสับสน", "เหตุที่สอง: ข้อขัดแย้งเรื่องบิดาและปู่ของฏ็อลหะฮ์ อิบนุอบีหาติมกล่าวว่า \"ฉันถามบิดาเรื่องหะดีษนี้ เขาไม่ยืนยัน และกล่าวว่า มีคนบอกว่าฏ็อลหะฮ์คนนี้เป็นชาวอันศอร บ้างว่าคือฏ็อลหะฮ์ บินมุศ็อรริฟ ถ้าเป็นฏ็อลหะฮ์ บินมุศ็อรริฟจริง ก็คงไม่มีข้อขัดแย้ง\" อบูซุรอะฮ์ว่า \"ฉันไม่รู้ว่ามีใครระบุชื่อบิดาของฏ็อลหะฮ์ เพียงแต่บางคนว่าอิบนุมุศ็อรริฟ\" สรุปคือสายรายงานนี้มีข้อขัดแย้ง นักวิชาการส่วนใหญ่ว่าไม่ถูกต้อง และอิบนุบาซเลือกเช่นนั้น", "หะดีษอะลี: อบูดาวูด (111) บันทึกแบบยาว และอันนะสาอีย์ (ที่มากล่าวไปแล้วในหะดีษที่ 34) อิบนุหะญัรยกไว้สองแห่ง ตามประเด็นที่ต้องการใช้เป็นหลักฐาน", "หะดีษอับดุลลอฮ์ บินซัยด์: อัลบุคอรีย์ (186) และมุสลิม (235) (ที่มากล่าวไปแล้ว คือหะดีษที่ 35) สำนวนนี้ทั้งสองบันทึกผ่านคอลิด บินอับดิลลาฮ์ อัฏเฏาะห์ฮาน จากอัมร์ บินยะห์ยา บินอุมาเราะฮ์ จากบิดา จากอับดุลลอฮ์ บินซัยด์ อัลบุคอรีย์ตั้งชื่อบทว่า \"บทผู้ที่บ้วนปากและสูดน้ำเข้าจมูกจากน้ำกอบเดียว\" (191)"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "สามวิธีของการบ้วนปากและสูดน้ำเข้าจมูก", "points_th": ["วิธีที่หนึ่ง: แยกการบ้วนปากกับการสูดน้ำเข้าจมูก แต่ละอย่างใช้น้ำต่างหาก บ้วนปากสามครั้งด้วยน้ำสามกอบ สูดน้ำเข้าจมูกสามครั้งด้วยน้ำสามกอบ รวมหกกอบ เพื่อให้วุฎูอ์ทั่วถึงกว่า หลักฐานคือหะดีษฏ็อลหะฮ์ ซึ่งอ่อนและใช้เป็นหลักฐานไม่ได้ (แต่มีรายงานที่สนับสนุน ดังจะกล่าว) นักนิติศาสตร์หะนะฟีย์และชาฟิอีย์ส่วนใหญ่เห็นเช่นนี้ และเป็นอีกรายงานจากมาลิกและอะห์มัด อิบนุลมุลักกินกล่าวว่า การแยกยังรวมถึงการตักน้ำหนึ่งกอบบ้วนปากสามครั้ง และอีกกอบสูดน้ำเข้าจมูกสามครั้ง", "วิธีที่สอง: บ้วนปากและสูดน้ำเข้าจมูกสามครั้งจากน้ำกอบเดียว เพื่อประหยัดน้ำ และเพราะปากกับจมูกเป็นส่วนของอวัยวะเดียวคือใบหน้า หลักฐานคือหะดีษอะลี \"ท่านบ้วนปากและสั่งน้ำออกสามครั้ง ท่านบ้วนปากและสั่งน้ำออกจากฝ่ามือที่ท่านตักน้ำนั้น\" แต่ไม่ชัดเจน เพราะอาจหมายความว่าท่านตักน้ำหนึ่งกอบ บ้วนปากและสั่งน้ำออก แล้วตักอีกกอบ... ทำเช่นนี้สามครั้ง ซึ่งน่าจะใกล้ที่สุด เพื่อให้สอดคล้องกับหะดีษอับดุลลอฮ์ บินซัยด์ อีกทั้งวิธีนี้อาจทำได้ยาก เพราะยากที่น้ำจะเหลือในฝ่ามือพอให้บ้วนปากสามครั้งและสูดน้ำเข้าจมูกสามครั้ง", "วิธีที่สาม: บ้วนปากและสูดน้ำเข้าจมูกจากน้ำกอบเดียว ด้วยน้ำสามกอบ หลักฐานคือหะดีษอับดุลลอฮ์ บินซัยด์ในเศาะฮีหัยน์ \"ท่านบ้วนปาก สูดน้ำเข้าจมูก และสั่งน้ำออก ด้วยน้ำสามกอบ\" และอีกรายงาน \"ท่านบ้วนปากและสูดน้ำเข้าจมูกจากน้ำกอบเดียว ทำเช่นนั้นสามครั้ง\" เป็นทัศนะใหม่ของอัชชาฟิอีย์ อีกรายงานจากมาลิกที่อัลกอฎี อิยาฎระบุ และอีกรายงานจากอะห์มัดที่เขาระบุชัด อัลอะษร็อมกล่าวว่า ได้ยินอบูอับดิลลาฮ์ (อะห์มัด) ถูกถามว่า แบบไหนท่านชอบกว่า บ้วนปากและสูดน้ำเข้าจมูกด้วยกอบเดียว หรือแยกกัน เขาตอบว่า \"ด้วยกอบเดียว\"", "ผู้แต่งเห็นว่าวิธีที่มีน้ำหนักคือวิธีสุดท้าย เพราะมีในหะดีษอับดุลลอฮ์ บินซัยด์ในเศาะฮีหัยน์ และหะดีษอะลีก็ตีความไปทางนี้ได้ อันนะวะวีย์ก็ว่ามีน้ำหนัก ส่วนรายงานการแยกอ่อน เพราะหะดีษฏ็อลหะฮ์อ่อน", "แต่อิบนุลมุลักกินและผู้แต่งอาวนุลมะอ์บูดระบุว่า อบูอะลี บินอัสสะกัน (นักหะดีษผู้เชี่ยวชาญ) รายงานในสุนันของเขา ผ่านอบูวาอิล ชะกีก บินสะละมะฮ์ ว่า \"ฉันเห็นอะลี บินอบีฏอลิบและอุษมาน บินอัฟฟานอาบน้ำละหมาดสามครั้ง ๆ และแยกการบ้วนปากกับการสูดน้ำเข้าจมูก แล้วทั้งสองกล่าวว่า อย่างนี้แหละที่เราเห็นท่านรสูลุลลอฮ์ ﷺ อาบน้ำละหมาด\" แล้วกล่าวว่า \"มีรายงานจากทั้งสองหลายสาย\" ซึ่งชัดเจนว่าแยก ชะกีกเชื่อถือได้ นักบันทึกทั้งหกบันทึกหะดีษของเขา เขาทันยุคท่านนบี ﷺ แต่ไม่ได้เห็นท่าน และรายงานจากเคาะลีฟะฮ์ทั้งสี่และเศาะหาบะฮ์หลายคน", "และมีรายงานผ่านอุษมาน บินอับดิรเราะห์มาน อัตตัยมีย์ ว่า อิบนุอบีมุลัยกะฮ์ถูกถามเรื่องวุฎูอ์ เขาตอบว่า \"ฉันเห็นอุษมาน บินอัฟฟานถูกถามเรื่องวุฎูอ์ เขาขอน้ำมา... เทลงบนมือขวา แล้วสอดมือลงไปในน้ำ แล้วบ้วนปากสามครั้ง และสั่งน้ำออกสามครั้ง...\" (อบูดาวูด) ตามรูปคำ เขาตักน้ำบ้วนปากต่างหาก และน้ำสูดเข้าจมูกต่างหาก เพราะการสั่งน้ำออกต้องมีการสูดน้ำเข้าก่อน", "อัศศ็อนอานีย์กล่าวว่า \"เมื่อมีทั้งสองรายงาน คือรวมและไม่รวม ที่ใกล้ที่สุดคือให้เลือก และทั้งหมดเป็นซุนนะฮ์ แม้รายงานแบบรวมจะมากกว่าและถูกต้องกว่า\""]}], "tags_th": ["บ้วนปาก", "สูดน้ำเข้าจมูก", "วุฎูอ์", "หะดีษอ่อน"]}, {"id": "v1-h055", "volume": 1, "bab": "wudu", "topic_ar": "حكم الموالاة في الوضوء", "topic_th": "หุก่มความต่อเนื่องในการอาบน้ำละหมาด", "pages": [231, 236], "hadith": [{"no": 55, "matn_ar": "عَنْ أَنَسٍ رَضِيَ اللهُ عَنْهُ قَالَ: رَأَى النَّبِيُّ ﷺ رَجُلًا، وَفِي قَدَمِهِ مِثْلُ الظُّفُرِ لَمْ يُصِبْهُ الْمَاءُ، فَقَالَ: «ارْجِعْ فَأَحْسِنْ وُضُوءَكَ». أَخْرَجَهُ أَبُو دَاوُدَ، وَالنَّسَائِيُّ.", "translation_th": "จากอนัส (ร.ฎ.) กล่าวว่า ท่านนบี ﷺ เห็นชายคนหนึ่ง ที่เท้าของเขามีที่ขนาดเท่าเล็บที่น้ำไม่ถึง ท่านจึงกล่าวว่า \"จงกลับไปอาบน้ำละหมาดให้ดี\" บันทึกโดยอบูดาวูดและอันนะสาอีย์", "grade_th": "เฆาะรีบ (ญะรีร บินหาซิม รายงานคนเดียวจากเกาะตาดะฮ์) แต่มีหลักฐานสนับสนุนจากมุสลิม"}], "key_rulings_th": ["ต้องล้างให้ทั่วทุกส่วนของอวัยวะวุฎูอ์ ผู้ที่เว้นส่วนใดไว้แม้น้อย วุฎูอ์ใช้ไม่ได้", "ต้องขจัดสิ่งที่กันน้ำไม่ให้ถึงผิวหนัง เช่น แป้ง ปูน ยาง รวมถึงยาทาเล็บที่สตรีใช้", "ผู้แต่งเห็นว่าทัศนะที่มีน้ำหนักคือ ความต่อเนื่อง (มุวาลาต) เป็นฟัรฎูเมื่อจำได้และทำได้ แต่ตกไปเมื่อลืมหรือมีเหตุ เช่น น้ำไม่พอ (ทัศนะของมาลิก และอิบนุตัยมียะฮ์เลือก)", "ความต่อเนื่องคือล้างอวัยวะถัดไปก่อนอวัยวะก่อนหน้าจะแห้ง ในสภาพอากาศปกติ การทำสุนัตหรือขจัดสิ่งที่ติดอยู่ระหว่างนั้นไม่ทำให้ขาดความต่อเนื่อง", "ถ้ารู้ทันทีว่ามีส่วนที่น้ำไม่ถึง ให้ล้างส่วนนั้นแล้วล้างอวัยวะที่ตามมาให้เรียงลำดับ", "ส่งเสริมให้ทักท้วงพี่น้องที่บกพร่องหรือพลาดในสิ่งวาญิบ เพื่อให้อิบาดะฮ์ของเขาถูกต้อง"], "vocab": [{"ar": "الظُّفُر", "th": "เล็บ อ่านสระอุทั้งสองตัว หรือสระอุแล้วสุกูน หรือสระอิ พหูพจน์คือ أَظْفَار"}, {"ar": "ارْجِعْ فَأَحْسِنْ وُضُوءَكَ", "th": "จงกลับไปทำวุฎูอ์ให้สมบูรณ์ อาจหมายถึงล้างส่วนที่เหลือ หรือเริ่มวุฎูอ์ใหม่"}, {"ar": "الْمُوَالَاة", "th": "ความต่อเนื่อง คือล้างอวัยวะต่อกันโดยไม่ทิ้งช่วงจนอวัยวะก่อนหน้าแห้ง"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อบูดาวูดบันทึกในหมวดฏอฮาเราะฮ์ บทการแยกวุฎูอ์ (173) ผ่านอิบนุวะฮ์บ จากญะรีร บินหาซิม ว่าได้ยินเกาะตาดะฮ์ บินดิอามะฮ์ เล่าว่าอนัส บินมาลิกเล่าว่า ชายคนหนึ่งมาหาท่านนบี ﷺ หลังอาบน้ำละหมาด โดยเหลือที่ขนาดเท่าเล็บบนเท้า ท่านนบี ﷺ กล่าวว่า \"จงกลับไปอาบน้ำละหมาดให้ดี\" อบูดาวูดกล่าวว่า \"หะดีษนี้ไม่เป็นที่รู้จักจากญะรีร บินหาซิม และมีเพียงอิบนุวะฮ์บที่รายงาน\" ซึ่งเป็นการชี้ข้อบกพร่อง อัดดารุกุฏนีย์ก็กล่าวว่า ญะรีร บินหาซิมรายงานคนเดียวจากเกาะตาดะฮ์ เขาเชื่อถือได้ และมีเพียงอิบนุวะฮ์บที่รายงานจากเขา", "หะดีษจึงเป็นเฆาะรีบ เพราะมีแค่ญะรีรที่รายงานจากเกาะตาดะฮ์ และแค่อิบนุวะฮ์บที่รายงานจากญะรีร การรายงานคนเดียวของญะรีรถือเป็นข้อบกพร่อง เพราะแม้เชื่อถือได้ แต่เขารายงานหะดีษมุงกัรจากเกาะตาดะฮ์ อิบนุอะดีย์กล่าวว่า \"ญะรีรมีหะดีษมากจากอาจารย์ หะดีษของเขาตรง น่าพอใจ ยกเว้นรายงานจากเกาะตาดะฮ์ เพราะเขารายงานสิ่งที่คนอื่นไม่ได้รายงาน\"", "ผู้แต่งไม่พบหะดีษนี้ในสุนันอันนะสาอีย์ และอัลมิซซีย์พาดพิงถึงอบูดาวูดเท่านั้น จึงดูเหมือนอิบนุหะญัรพลาดที่พาดพิงถึงอันนะสาอีย์ อิบนุมาญะฮ์ (655) และอะห์มัดก็บันทึกด้วย", "หลักฐานสนับสนุน: ญาบิรเล่าว่า อุมัร บินอัลค็อฏฏอบเล่าว่า ชายคนหนึ่งอาบน้ำละหมาดแล้วเหลือที่ขนาดเท่าเล็บบนเท้า ท่านนบี ﷺ เห็นจึงกล่าวว่า \"จงกลับไปอาบน้ำละหมาดให้ดี\" เขาจึงกลับไปแล้วละหมาด (มุสลิม 243 อบูดาวูด 173) และผ่านบะกียะฮ์ บินอัลวะลีด จากบะหีร บินสะอ์ด์ จากคอลิด บินมะอ์ดาน จากเศาะหาบะฮ์บางท่านว่า ท่านนบี ﷺ เห็นชายคนหนึ่งละหมาด ที่หลังเท้ามีจุดขนาดเท่าเหรียญดิรฮัมที่น้ำไม่ถึง ท่านจึงสั่งให้เขาอาบน้ำละหมาดและละหมาดใหม่ (อบูดาวูด อะห์มัด) อัลอะษร็อมถามอะห์มัดว่า สายรายงานนี้ดีไหม เขาตอบว่า \"ใช่\"", "อัตติรมิซีย์ชี้ข้อบกพร่องว่าบะกียะฮ์เป็นมุดัลลิส และรายงานด้วยคำว่า \"จาก\" (อันอะนะฮ์) จากบะหีร อิบนุลก็อยยิมตอบว่าบะกียะฮ์ระบุชัดว่าได้ยินในรายงานของอะห์มัด ผู้แต่งเห็นว่าข้อนี้มีข้อพิจารณา เพราะบะกียะฮ์ระบุชัดว่าได้ยินจากอาจารย์ แต่ใช้คำว่า \"จาก\" ในระดับอาจารย์ของอาจารย์ ซึ่งไม่ยอมรับจากผู้ที่ตัดลีสแบบตัสวิยะฮ์ (ตัดผู้รายงานอ่อนในช่วงกลางสายออก) อย่างบะกียะฮ์"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"เท่าเล็บ\" (ซุฟุร) อ่านสระอุทั้งสองตัว ดังในอัลกุรอาน \"และสำหรับบรรดาผู้ที่เป็นยิว เราได้ห้ามสัตว์ที่มีเล็บทุกชนิด\" (อัลอันอาม: 146) อ่านสุกูนที่อักษรฟาอ์ หรือสระอิทั้งสองตัวก็ได้ พหูพจน์คือ อัซฟาร", "\"จงกลับไปอาบน้ำละหมาดให้ดี\" คือทำให้ครบถ้วนสมบูรณ์ที่สุด จึงเป็นคำสั่งให้ล้างส่วนที่ขาด หรืออาจหมายถึงเริ่มวุฎูอ์ใหม่ตั้งแต่ต้น อัลค็อฏฏอบีย์กล่าวว่า \"นี่คือความหมายตามรูปคำ\" สนับสนุนด้วยหะดีษอิบนุมะอ์ดานที่ว่า \"ท่านสั่งให้เขาอาบน้ำละหมาดและละหมาดใหม่\""]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "ต้องล้างให้ทั่วทุกส่วน", "points_th": ["นักวิชาการใช้หะดีษนี้เป็นหลักฐานว่าต้องล้างให้ทั่วทุกส่วนของอวัยวะวุฎูอ์ ผู้ที่เว้นส่วนใดไว้ แม้น้อย วุฎูอ์ใช้ไม่ได้ เพราะท่านนบี ﷺ สั่งผู้ที่มีที่ขนาดเท่าเล็บที่น้ำไม่ถึงให้อาบน้ำละหมาดให้ดีและครบถ้วน หะดีษระบุชัดเรื่องเท้า และอวัยวะอื่นก็เทียบได้", "หะดีษอบูฮุร็อยเราะฮ์ว่า ท่านนบี ﷺ เห็นชายคนหนึ่งไม่ล้างส้นเท้า ท่านกล่าวว่า \"ความวิบัติแก่ส้นเท้าทั้งหลายจากไฟนรก\" และในอีกสำนวน \"จงอาบน้ำละหมาดให้ทั่ว เพราะอบุลกอสิม ﷺ กล่าวว่า ความวิบัติแก่ส้นเท้าทั้งหลายจากไฟนรก\" (อัลบุคอรีย์ มุสลิม)"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "ขจัดสิ่งที่กันน้ำ", "points_th": ["หะดีษเป็นหลักฐานว่าต้องขจัดสิ่งที่กันน้ำไม่ให้ถึงผิวหนัง เช่น แป้ง ปูน หรือยางเหนียวอย่างกาว เพราะน้ำเข้าไม่ถึงข้างใต้ ส่วนนั้นจึงยังไม่ได้ล้าง และการชำระก็ไม่สมบูรณ์", "รวมถึงสิ่งที่สตรีทาเล็บ ที่เรียกว่ายาทาเล็บ (มานิเคียวร์) หรืออย่างอื่น เพราะมันกันน้ำไม่ให้ถึงผิว"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "ความต่อเนื่องในวุฎูอ์", "points_th": ["มุวาลาตคือการติดตามกัน หมายถึงล้างอวัยวะต่อเนื่องกัน โดยล้างอวัยวะถัดไปก่อนอวัยวะก่อนหน้าจะแห้ง ในสภาพอากาศปกติ ไม่นับการแห้งเร็วเพราะความร้อนจัด ลมแรง หรือร่างกายที่มีไข้และน้ำน้อย และไม่นับการแห้งช้าเพราะความหนาวจัด", "ความต่อเนื่องไม่ขาด ถ้าระหว่างนั้นทำสิ่งที่เป็นสุนัตในอวัยวะอื่น เช่น สางนิ้ว ขจัดสิ่งที่ติดมือ เช่น น้ำมันที่แข็ง หรือน้ำหมด ผู้อาบน้ำละหมาดย้ายจากก๊อกหนึ่งไปอีกก๊อก หรือน้ำออกมาเป็นช่วง ๆ ทั้งหมดนี้ไม่เป็นไร เพราะเกี่ยวข้องกับการชำระ", "หุก่มของความต่อเนื่องมีสามทัศนะ ทัศนะที่หนึ่ง: วาญิบในวุฎูอ์โดยไม่มีเงื่อนไข เป็นทัศนะของอิมามอะห์มัดซึ่งเป็นมัซฮับ ของอัลเอาซาอีย์ และทัศนะเก่าของอัชชาฟิอีย์ ตามทัศนะนี้ ความต่อเนื่องไม่ตกไปเพราะลืม ตามทัศนะที่ถูกต้องในมัซฮับ ทัศนะที่สอง: เป็นสุนัต ไม่ใช่วาญิบ เป็นทัศนะของอบูหะนีฟะฮ์ อีกรายงานจากอะห์มัด ตามรูปคำของอัลคิร็อกีย์ (เพราะไม่ได้นับไว้ในฟัรฎูของวุฎูอ์) ทัศนะใหม่ของอัชชาฟิอีย์ และซอฮิรียะฮ์ ทัศนะที่สาม: เป็นฟัรฎูเมื่อจำได้และทำได้ แต่ตกไปเมื่อลืม และเมื่อจำได้แต่มีเหตุ เช่น น้ำไม่พอ หรือน้ำออกมาเป็นช่วง ๆ เป็นทัศนะของมาลิก และอิบนุตัยมียะฮ์เลือก", "ทัศนะแรกอ้าง (1) อายะฮ์วุฎูอ์ \"เมื่อพวกเจ้าลุกขึ้นไปละหมาด จงล้างหน้าของพวกเจ้า\" อายะฮ์มาในรูปเงื่อนไข และผลของเงื่อนไขเมื่อมีหลายอย่างก็ต่อเนื่องกัน ไม่ล่าช้า เพราะสิ่งที่ถูกกำหนดตามหลังเงื่อนไข (2) หะดีษในบทนี้ หะดีษอุมัรในมุสลิม \"จงอาบน้ำละหมาดให้ดี\" และหะดีษคอลิด บินมะอ์ดาน \"ท่านสั่งให้เขาอาบน้ำละหมาดและละหมาดใหม่\" ถ้าตีความสำนวนแรกตามสำนวนที่สอง ก็ชัดเจน ถ้าไม่ หะดีษที่สองก็บ่งชัด เพราะท่านสั่งให้อาบใหม่ ถ้าความต่อเนื่องไม่วาญิบ ท่านคงสั่งแค่ให้ล้างจุดนั้น ส่วนหะดีษแรก อาจหมายถึงล้างส่วนที่ขาด หรืออาบใหม่ทั้งหมด ตามที่อัลค็อฏฏอบีย์กล่าวว่าเป็นความหมายตามรูปคำ เพื่อให้สำนวนสอดคล้องกัน (3) ผู้ที่อธิบายวุฎูอ์ของท่านนบี ﷺ ระบุว่าท่านอาบต่อเนื่อง ไม่เคยแยกอวัยวะ (4) วุฎูอ์เป็นอิบาดะฮ์เดียว ถ้าแยกส่วนก็ไม่เป็นเช่นนั้น", "ผู้ที่ว่าความต่อเนื่องเป็นสุนัตอ้าง (1) อายะฮ์วุฎูอ์ อัลลอฮ์สั่งให้ล้างอวัยวะ จะล้างแบบใดก็ได้ แยกอวัยวะหรือต่อเนื่องกัน (2) วุฎูอ์เป็นหนึ่งในสองการชำระ จึงไม่ต้องต่อเนื่อง เหมือนการอาบน้ำ (ฆุสล์) พวกเขาว่า การทำให้ดีหมายถึงเติมส่วนที่ขาด ส่วนคำสั่งให้อาบใหม่ในหะดีษอิบนุมะอ์ดาน อาจหมายถึงต้องการเน้นย้ำในการตำหนิ และเตือนว่าผู้ที่ละส่วนหนึ่งเหมือนละทั้งหมด หรือเรียกการล้างส่วนที่ขาดว่าอาบใหม่ ตามที่ผู้อาบน้ำละหมาดคิด", "ผู้ที่ว่าถ้าตั้งใจแยก วุฎูอ์เสีย มิฉะนั้นไม่เสีย อ้างหลักฐานของทัศนะแรก และหลักฐานทั่วไปว่าผู้ลืมได้รับการอภัย เช่น \"แท้จริงอัลลอฮ์ทรงอภัยแก่ประชาชาติของฉัน ในความผิดพลาด การลืม และสิ่งที่ถูกบังคับ\" (อิบนุหิบบาน อัดดารุกุฏนีย์ อัลหากิม อัลบัยฮะกีย์ ศ่อฮีห์ด้วยสายและหลักฐานสนับสนุน อันนะวะวีย์ว่าหะซัน)", "ผู้แต่งเห็นว่าทัศนะนี้มีน้ำหนัก อินชาอัลลอฮ์ เพราะหลักฐานแข็งแรง คือหะดีษทั้งสามที่กล่าวมา คือหะดีษอนัส หะดีษอุมัร และหะดีษคอลิด บินมะอ์ดาน ซึ่งรวมกันอาจเสริมกัน และหะดีษอื่นที่มีความหมายเดียวกัน อิบนุตัยมียะฮ์กล่าวว่า \"ทัศนะที่สามนี้ชัดที่สุด และใกล้หลักของศาสนาและหลักของมัซฮับอะห์มัดและคนอื่นมากที่สุด เพราะหลักฐานของความเป็นวาญิบครอบคลุมเฉพาะผู้ที่ละเลย ไม่ครอบคลุมผู้ที่ไม่สามารถทำต่อเนื่องได้\"", "ทั้งหมดนี้กรณีที่เว้นช่วงนาน แต่ถ้ารู้ทันทีว่าที่เท้ามีส่วนที่น้ำไม่ถึง หรือที่มือ ก็ล้างส่วนที่ขาด แล้วล้างอวัยวะที่ตามมาเพื่อให้เรียงลำดับ ส่วนคำตอบของทัศนะที่สองต่อหะดีษในบทนี้ หะดีษแม้ไม่พ้นจากความอ่อน แต่การตีความคำสั่งให้อาบใหม่ว่าเป็นการเน้นย้ำมีข้อพิจารณา เพราะสถานการณ์นั้นเป็นการสอนและอธิบายแก่ประชาชาติ และนั่นเป็นการเบี่ยงหะดีษออกจากความหมายตามรูปคำโดยไม่มีหลักฐาน และสิ่งที่คลุมเครือในตัวบทต้องย้อนไปหาสิ่งที่อธิบายชัด"]}, {"wajh": 6, "type": "fawaid", "heading_ar": null, "heading_th": "ทักท้วงพี่น้องที่พลาด", "points_th": ["หะดีษแสดงว่าศาสนาให้มุสลิมที่เห็นพี่น้องบกพร่องหรือพลาดในสิ่งวาญิบ ทักท้วงเขา เพื่อให้อิบาดะฮ์ของเขาถูกต้อง ซึ่งอยู่ในความหมายกว้างของอายะฮ์ \"และจงช่วยเหลือกันในความดีและความยำเกรง และอย่าช่วยเหลือกันในบาปและการละเมิด\" (อัลมาอิดะฮ์: 2)"]}], "tags_th": ["ความต่อเนื่อง", "มุวาลาต", "วุฎูอ์", "ล้างให้ทั่ว", "ยาทาเล็บ"]}, {"id": "v1-h056", "volume": 1, "bab": "wudu", "topic_ar": "قدر الماء الذي يكفي في الوضوء والغسل", "topic_th": "ปริมาณน้ำที่เพียงพอสำหรับอาบน้ำละหมาดและอาบน้ำ", "pages": [237, 237], "hadith": [{"no": 56, "matn_ar": "وَعَنْهُ قَالَ: كَانَ رَسُولُ اللهِ ﷺ يَتَوَضَّأُ بِالْمُدِّ، وَيَغْتَسِلُ بِالصَّاعِ إِلَى خَمْسَةِ أَمْدَادٍ. مُتَّفَقٌ عَلَيْهِ.", "translation_th": "จากอนัส (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ อาบน้ำละหมาดด้วยน้ำหนึ่งมุดด์ และอาบน้ำด้วยหนึ่งศออ์ถึงห้ามุดด์ บันทึกโดยอัลบุคอรีย์และมุสลิม", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["น้ำหนึ่งมุดด์เพียงพอสำหรับอาบน้ำละหมาด และหนึ่งศออ์หรือห้ามุดด์เพียงพอสำหรับอาบน้ำ", "ศาสนาให้ประหยัดน้ำในการอาบน้ำละหมาดและอาบน้ำ และไม่ฟุ่มเฟือย แม้น้ำจะหาง่าย", "ปริมาณในหะดีษเป็นค่าประมาณ ไม่ใช่ขอบเขตตายตัว เพราะคนต่างกัน"], "vocab": [{"ar": "الْمُدّ", "th": "มุดด์ เท่ากับน้ำเต็มสองฝ่ามือของคนขนาดปกติ หนึ่งในสี่ของศออ์"}, {"ar": "الصَّاع", "th": "ศออ์ หน่วยตวง เท่ากับสี่มุดด์"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกในหมวดวุฎูอ์ บทการอาบน้ำละหมาดด้วยหนึ่งมุดด์ (201) และมุสลิม (325) ผ่านมิสอัร ว่าอิบนุญับร์เล่าว่า ได้ยินอนัสกล่าว... สำนวนเป็นของมุสลิม", "หะดีษอับดุลลอฮ์ บินซัยด์ได้กล่าวไปแล้ว (หะดีษที่ 41) ว่า \"มีผู้นำน้ำสองในสามมุดด์มาให้ท่านนบี ﷺ ท่านจึงถูแขนทั้งสอง\" (อะห์มัด อิบนุคุซัยมะฮ์ว่าศ่อฮีห์)"]}, {"wajh": 2, "type": "fiqh", "heading_ar": null, "heading_th": "ประหยัดน้ำ", "points_th": ["หะดีษเป็นหลักฐานว่าน้ำหนึ่งมุดด์เพียงพอในการอาบน้ำละหมาด และหนึ่งศออ์หรือห้ามุดด์เพียงพอในการอาบน้ำ ซึ่งบ่งว่าศาสนาให้ประหยัดน้ำในการอาบน้ำละหมาดและอาบน้ำ และไม่ฟุ่มเฟือย แม้น้ำจะหาง่าย", "ปริมาณที่ระบุในหะดีษเป็นค่าประมาณ ไม่ใช่การกำหนดตายตัว เพราะคนต่างกัน (กล่าวไปแล้วในหะดีษอับดุลลอฮ์ บินซัยด์)"]}], "tags_th": ["ปริมาณน้ำ", "มุดด์", "ศออ์", "ประหยัดน้ำ", "อาบน้ำ"]}, {"id": "v1-h057", "volume": 1, "bab": "wudu", "topic_ar": "ما يقول بعد الوضوء", "topic_th": "สิ่งที่กล่าวหลังอาบน้ำละหมาด", "pages": [238, 244], "hadith": [{"no": 57, "matn_ar": "وَعَنْ عُمَرَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «مَا مِنْكُمْ مِنْ أَحَدٍ يَتَوَضَّأُ، فَيُسْبِغُ الْوُضُوءَ، ثُمَّ يَقُولُ: أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ، إِلَّا فُتِحَتْ لَهُ أَبْوَابُ الْجَنَّةِ». أَخْرَجَهُ مُسْلِمٌ. وَالتِّرْمِذِيُّ، وَزَادَ: «اللَّهُمَّ اجْعَلْنِي مِنَ التَّوَّابِينَ، وَاجْعَلْنِي مِنَ الْمُتَطَهِّرِينَ».", "translation_th": "จากอุมัร (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"ไม่มีผู้ใดในพวกท่านที่อาบน้ำละหมาดอย่างทั่วถึง แล้วกล่าวว่า 'ฉันขอปฏิญาณว่าไม่มีพระเจ้าอื่นใดนอกจากอัลลอฮ์ องค์เดียว ไม่มีภาคีใดสำหรับพระองค์ และฉันขอปฏิญาณว่ามุหัมมัดเป็นบ่าวและรสูลของพระองค์' เว้นแต่ประตูสวรรค์จะถูกเปิดให้แก่เขา\" บันทึกโดยมุสลิม และอัตติรมิซีย์เพิ่มว่า \"โอ้อัลลอฮ์ โปรดให้ฉันอยู่ในหมู่ผู้กลับเนื้อกลับตัวเสมอ และโปรดให้ฉันอยู่ในหมู่ผู้ชำระตนให้สะอาด\"", "grade_th": "ศ่อฮีห์ (มุสลิม) ส่วนเพิ่มของอัตติรมิซีย์มีข้อขัดแย้ง อัลอัลบานีย์และอิบนุบาซว่าศ่อฮีห์ อะห์มัด ชากิรว่าสับสน (มุฎฏ่อริบ)"}], "key_rulings_th": ["ส่งเสริมให้กล่าวชะฮาดะฮ์ทั้งสองเมื่ออาบน้ำละหมาดเสร็จ ผลบุญคือประตูสวรรค์ทั้งแปดจะเปิดให้เข้าทางใดก็ได้", "ผลบุญนี้ผูกกับสองเงื่อนไข คืออาบน้ำละหมาดอย่างทั่วถึง แล้วกล่าวซิกิรนี้", "ผู้ที่ทำความสะอาดภายนอกด้วยน้ำ ก็ทำความสะอาดภายในด้วยถ้อยคำเตาฮีดและความบริสุทธิ์ใจ", "ส่วนเพิ่ม \"โอ้อัลลอฮ์ โปรดให้ฉันอยู่ในหมู่ผู้กลับเนื้อกลับตัว...\" มีข้อขัดแย้งเรื่องความถูกต้อง"], "vocab": [{"ar": "فَيُسْبِغُ الْوُضُوءَ", "th": "อาบน้ำละหมาดอย่างทั่วถึง ที่ชัดคือหมายถึงล้างเกินระดับวาญิบ คือครั้งที่สองและสาม"}, {"ar": "أَشْهَدُ", "th": "ฉันยอมรับด้วยใจและกล่าวด้วยปาก เหมือนผู้ที่เห็นด้วยตา"}, {"ar": "عَبْدُهُ وَرَسُولُهُ", "th": "บ่าวผู้นอบน้อมต่อพระองค์ด้วยการเชื่อฟัง และรสูลผู้ถูกส่งมาพร้อมศาสนาแก่มวลโลก"}, {"ar": "التَّوَّابِين", "th": "ผู้กลับเนื้อกลับตัวและขออภัยโทษมาก ๆ"}, {"ar": "الْمُتَطَهِّرِين", "th": "ผู้ชำระตนให้พ้นจากบาป ฮะดัษ และนะญิส"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อบูหัฟศ์ อุมัร บินอัลค็อฏฏอบ บินนุฟัยล์ บินอับดิลอุซซา อัลกุร็อชีย์ อัลอะดะวีย์ อะมีรุลมุอ์มินีน เคาะลีฟะฮ์คนที่สองของประชาชาตินี้ เป็นหนึ่งในผู้มีเกียรติของกุร็อยช์ เข้ารับอิสลามในปีที่ห้าหรือหกหลังการเป็นนบี การเข้ารับอิสลามของเขาเป็นเกียรติแก่มุสลิม เพราะความแข็งแรงและความเข้มแข็งต่อผู้ปฏิเสธศรัทธา อับดุลลอฮ์ บินมัสอูดกล่าวว่า \"เรามีเกียรติตลอดมาตั้งแต่อุมัรเข้ารับอิสลาม\" (อัลบุคอรีย์)", "เขาอพยพไปมะดีนะฮ์ก่อนท่านนบี ﷺ ร่วมทุกสงคราม และเป็นเคาะลีฟะฮ์หลังอบูบักร์ อัศศิดดีก ตามการแต่งตั้งของอบูบักร์ เขาปกครองอย่างดีที่สุด อิสลามงดงามด้วยความยุติธรรมของเขา อัลลอฮ์ทรงให้พิชิตดินแดนมากมาย เช่น บัยตุลมักดิสและแผ่นดินชามทั้งหมด อิสลามจึงแผ่กว้าง", "ในปลายเดือนซุลหิจญะฮ์ เหลืออีกสี่คืน อบูลุอ์ลุอะฮ์ ชาวมะญูสี แทงเขาด้วยมีดสองคมขณะละหมาดศุบห์ตอนตักบีร เขาเสียชีวิตอีกสามคืนต่อมา ปี ฮ.ศ. 23 ฝังร่วมกับท่านนบี ﷺ และอบูบักร์ในห้องของอาอิชะฮ์ หลังอบูบักร์ ศีรษะของเขาอยู่ตรงอกของอบูบักร์ เขาเป็นเคาะลีฟะฮ์สิบปีหกเดือนกับอีกไม่กี่วัน"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["มุสลิมบันทึกในหมวดฏอฮาเราะฮ์ (234) ผ่านมุอาวิยะฮ์ บินศอลิห์ จากเราะบีอะฮ์ บินยะซีด จากอบูอิดรีส อัลเคาลานีย์ จากอุกบะฮ์ บินอามิร และมุอาวิยะฮ์ บินศอลิห์ยังรายงานจากอบูอุษมาน จากญุบัยร์ บินนุฟัยร์ จากอุกบะฮ์ บินอามิรด้วย", "อุกบะฮ์เล่าว่า เราต้องเลี้ยงอูฐ เมื่อถึงเวรของฉัน ฉันพาอูฐกลับตอนเย็น และทันได้ยินท่านรสูลุลลอฮ์ ﷺ ยืนพูดกับผู้คนว่า \"ไม่มีมุสลิมคนใดที่อาบน้ำละหมาดอย่างดี แล้วลุกขึ้นละหมาดสองร็อกอะฮ์ โดยมุ่งหาทั้งสองด้วยใจและใบหน้า เว้นแต่สวรรค์จะเป็นสิทธิ์ของเขา\" ฉันกล่าวว่า ดีจริงหนอ คนข้างหน้าฉันกล่าวว่า ที่ท่านพูดก่อนหน้านั้นดีกว่า ฉันมองไปก็เห็นเป็นอุมัร เขากล่าวว่า ฉันเห็นท่านเพิ่งมา... แล้วเล่าหะดีษ ตอนท้ายว่า \"เว้นแต่ประตูสวรรค์ทั้งแปดจะถูกเปิดให้แก่เขา เข้าทางใดก็ได้ตามต้องการ\"", "มุอาวิยะฮ์ บินศอลิห์คือ อิบนุหุดัยร์ ส่วนอบูอุษมาน อัซซะฮะบีย์ว่า \"ไม่รู้ว่าเป็นใคร มุสลิมบันทึกเป็นสายสนับสนุน\" อิบนุมันญูยะฮ์ว่าน่าจะเป็นสะอีด บินฮานิอ์ อัลเคาลานีย์ อัลมิศรีย์ อิบนุหิบบานว่าน่าจะเป็นหะรีซ บินอุษมาน อัรเราะหะบีย์ ทั้งสองเชื่อถือได้ จึงไม่กระทบสายรายงาน มุสลิมยังบันทึกผ่านอบูบักร์ บินอบีชัยบะฮ์ จากซัยด์ บินอัลหุบาบ ด้วยทั้งสองสาย", "มีส่วนเพิ่ม \"แล้วเงยหน้ามองฟ้า\" ในรายงานของอะห์มัด อบูดาวูด (170) และอิบนุสสุนนีย์ ผ่านอบูอะกีล ซุฮ์เราะฮ์ บินมะอ์บัด จากลูกพี่ลูกน้องของเขา จากอุกบะฮ์ บินอามิร ส่วนเพิ่มนี้มุงกัร เพราะลูกพี่ลูกน้องของอบูอะกีลรายงานคนเดียว และไม่เป็นที่รู้จัก", "อัตติรมิซีย์บันทึก (55) พร้อมส่วนเพิ่ม \"โอ้อัลลอฮ์ โปรดให้ฉันอยู่ในหมู่ผู้กลับเนื้อกลับตัว...\" จากญะอ์ฟัร บินมุหัมมัด บินอิมรอน อัษษะอ์ละบีย์ จากซัยด์ บินอัลหุบาบ จากมุอาวิยะฮ์ บินศอลิห์ จากเราะบีอะฮ์ บินยะซีด จากอบูอิดรีสและอบูอุษมาน จากอุมัร โดยไม่ระบุอุกบะฮ์ บินอามิรในสาย อัตติรมิซีย์กล่าวว่า \"หะดีษนี้สายรายงานสับสน และไม่มีหะดีษที่ถูกต้องจากท่านนบี ﷺ ในบทนี้มากนัก\" หมายถึงในสายแรกตัดอุกบะฮ์ระหว่างอบูอิดรีสกับอุมัร และในสายที่สองตัดญุบัยร์และอุกบะฮ์ระหว่างอบูอุษมานกับอุมัร", "ผู้แต่งเห็นว่าคำของอัตติรมิซีย์มีข้อพิจารณา เพราะหะดีษศ่อฮีห์และสายรายงานตรง มุสลิมบันทึกในเศาะฮีห์ อิบนุหะญัรว่า \"รายงานของมุสลิมพ้นจากข้อวิจารณ์นี้\" ความจริงคือหะดีษไม่สับสน ผู้รายงานทุกคนจากมุอาวิยะฮ์ บินศอลิห์ตรงกันเรื่องสาย และเศาะหาบะฮ์คืออุกบะฮ์ บินอามิร ความสับสนอยู่ในสายที่อัตติรมิซีย์ยก จากเขาหรือผู้เล่าให้เขาฟัง ในรายงานของซัยด์ บินอัลหุบาบเท่านั้น และซัยด์เองก็รายงานจากมุอาวิยะฮ์ทั้งสองสายในมุสลิม ซึ่งมีน้ำหนักกว่าเพราะมาจากผู้เชื่อถือได้และแม่นยำ อบูอะลี อัลฆ็อสสานีย์ว่าอาจารย์ของอัตติรมิซีย์จำสายรายงานไม่แม่น และอิบนุหะญัรยืนยันว่ามุหัมมัด บินญะอ์ฟัร อาจารย์ของอัตติรมิซีย์ จำสายรายงานไม่แม่น", "ส่วนเพิ่มนี้ไม่มีในรายงานอื่นทั้งหมด นอกจากรายงานของอัตติรมิซีย์ ซึ่งสับสน จึงไม่ใช่หลักฐานยืนยันส่วนเพิ่มนี้ ตามที่อะห์มัด ชากิรกล่าว แต่อัลอัลบานีย์ว่าศ่อฮีห์ เพราะความสับสนนั้นมีรายงานที่มีน้ำหนักกว่า และยกหลักฐานสนับสนุนจากหะดีษเษาบานในอัฏเฏาะบะรอนีย์และอิบนุสสุนนีย์ (ผ่านอบูสะอ์ด์ อัลบักกอล ซึ่งอัลฮัยษะมีย์ว่าส่วนใหญ่ว่าอ่อน และสำนวนของอัฏเฏาะบะรอนีย์ไม่มีประโยคนี้) อิบนุบาซก็ว่าศ่อฮีห์ และว่า \"รายงานนี้ของอัตติรมิซีย์สายรายงานดี\" ส่วนเพิ่มนี้ยังมีอีกสายในอัฏเฏาะบะรอนีย์ ผ่านอัลอะอ์มัช จากสาลิม บินอบิลญะอ์ด์ จากเษาบาน ซึ่งอ่อน เพราะสาลิมไม่ได้ฟังจากเษาบาน และผู้รายงานจากอัลอะอ์มัชไม่เป็นที่รู้จัก"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ไม่มีผู้ใดในพวกท่าน\" คำว่า \"ผู้ใด\" เป็นคำกว้าง เพราะเป็นคำนามไม่ชี้เฉพาะในบริบทปฏิเสธ และเพิ่มคำว่า \"มิน\" เพื่อให้ครอบคลุมทั้งหมด ความหมายคือ ไม่ว่าใครในพวกท่าน จึงรวมทั้งชายและหญิง", "\"อาบน้ำละหมาดอย่างทั่วถึง\" การทำให้ทั่วถึงหมายถึงล้างให้ทั่วที่ฟัรฎู หรือล้างเกินระดับวาญิบ คือครั้งที่สองและสาม ที่ชัดคือความหมายหลัง อักษรฟาอ์ในที่นี้บ่งลำดับในการกล่าว ไม่ใช่ลำดับเวลา เพราะการทำให้ทั่วถึงไม่ได้มาหลังวุฎูอ์ แต่ไปพร้อมกับแต่ละอวัยวะ", "\"แล้วกล่าว\" คือหลังจบวุฎูอ์ทันที ไม่เว้นช่วง คำว่า \"แล้ว\" บ่งการทิ้งช่วงเวลา ซึ่งต่างกันตามแต่ละที่", "\"ฉันขอปฏิญาณว่าไม่มีพระเจ้าอื่นใดนอกจากอัลลอฮ์\" คือ ฉันยอมรับด้วยใจและกล่าวด้วยปาก เหมือนผู้ที่เห็นสิ่งที่ตนยอมรับ การปฏิญาณคือความเชื่อมั่นที่ลิ้นกล่าวออกมา ความหมายคือ ไม่มีสิ่งใดที่ถูกเคารพบูชาโดยสัจจริง นอกจากอัลลอฮ์ อัลลอฮ์คือพระเจ้าที่แท้จริง เพราะความสมบูรณ์ของพระองค์และคุณลักษณะของพระองค์ ส่วนสิ่งที่ถูกเคารพบูชานอกจากพระองค์ไม่ใช่พระเจ้า แม้จะถูกเรียกเช่นนั้น \"สิ่งเหล่านั้นไม่ใช่อะไรอื่นนอกจากชื่อที่พวกเจ้าและบรรพบุรุษตั้งขึ้น อัลลอฮ์ไม่ได้ประทานหลักฐานใดลงมา\" (อันนัจม์: 23)", "\"องค์เดียว\" ยืนยันการยืนยัน \"ไม่มีภาคีใดสำหรับพระองค์\" ยืนยันการปฏิเสธ ภาคีคือผู้ร่วมและผู้ช่วยในสิ่งหนึ่ง", "\"และฉันขอปฏิญาณว่ามุหัมมัดเป็นบ่าวและรสูลของพระองค์\" คือบ่าวผู้นอบน้อมต่อพระองค์ด้วยการเชื่อฟังและการเผยแผ่สาร และเรียกร้องสู่อัลลอฮ์ด้วยวิทยปัญญาและคำตักเตือนที่ดี และเป็นรสูลที่ถูกส่งมาจากพระองค์พร้อมศาสนาแก่มวลโลก", "\"เว้นแต่ประตูสวรรค์จะถูกเปิดให้แก่เขา\" คือประตูทั้งแปด ตามสำนวนของมุสลิม หะดีษสะฮ์ล์ บินสะอ์ด์: \"ในสวรรค์มีแปดประตู ประตูหนึ่งชื่ออัรร็อยยาน ไม่มีใครเข้าทางนั้นนอกจากผู้ถือศีลอด\" (อัลบุคอรีย์ มุสลิม) การเปิดประตูสวรรค์มีสองความหมาย (1) อำนวยความสะดวกให้ทำความดีที่นำไปสู่ประตูเหล่านั้น (2) จะถูกเปิดให้เขาในวันกิยามะฮ์ ใช้รูปอดีตแทนอนาคตเพราะแน่นอนว่าจะเกิด เช่น \"คำบัญชาของอัลลอฮ์มาแล้ว ดังนั้นอย่าเร่งรีบ\" (อันนะห์ล์: 1)", "\"โอ้อัลลอฮ์\" (อัลลอฮุมมะ) อักษรมีมที่มีชัดดะฮ์แทนคำเรียก \"ยา\" ที่ถูกตัดออก \"ผู้กลับเนื้อกลับตัว\" (อัตเตาวาบีน) รูปคำที่เน้นความมาก คือ โปรดให้ฉันอยู่ในหมู่ผู้ที่กลับเนื้อกลับตัวและขออภัยโทษมาก ๆ จากบาปที่ทำ \"ผู้ชำระตน\" คือผู้ที่พ้นจากบาป ฮะดัษ และนะญิส รวมทั้งสองไว้ด้วยกันตามอายะฮ์ \"แท้จริงอัลลอฮ์ทรงรักบรรดาผู้กลับเนื้อกลับตัว และทรงรักบรรดาผู้ชำระตน\" (อัลบะเกาะเราะฮ์: 222) เมื่อการกลับเนื้อกลับตัวเป็นการชำระภายในจากความสกปรกของบาป และวุฎูอ์เป็นการชำระภายนอกจากฮะดัษและนะญิส ซึ่งเป็นอุปสรรคต่อการใกล้ชิดอัลลอฮ์ จึงเหมาะที่จะรวมกัน"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "ซิกิรหลังวุฎูอ์และความประเสริฐ", "points_th": ["ส่งเสริมให้กล่าวซิกิรอันยิ่งใหญ่ที่รวมชะฮาดะฮ์ทั้งสองไว้เมื่อจบวุฎูอ์ เพราะเป็นเหตุของความสุขนิรันดร์ คือการเข้าสวรรค์จากประตูใดก็ได้ นี่คือความประเสริฐที่ยิ่งใหญ่ มีรายงานว่าละหมาดมีประตูหนึ่ง การบริจาคมีประตูหนึ่ง ญิฮาดมีประตูหนึ่ง และการถือศีลอดมีประตูหนึ่ง (ดังที่กล่าวมา) แต่ถ้อยคำอันยิ่งใหญ่นี้หลังวุฎูอ์ทำให้ทุกประตูเปิดให้เข้าได้ตามต้องการ", "ความประเสริฐนี้ผูกกับซิกิรนี้ ไม่ใช่กับวุฎูอ์ที่ไม่มีซิกิร เพื่อไม่ให้ขัดกับรายงานว่าละหมาดมีประตูหนึ่ง และวุฎูอ์ซึ่งเป็นสื่อไปสู่ละหมาดก็ได้รับความประเสริฐนี้", "ซิกิรนี้มีความเหมาะสมอย่างยิ่ง เพราะเมื่อผู้อาบน้ำละหมาดทำความสะอาดภายนอกด้วยน้ำและอาบอย่างทั่วถึงแล้ว เขาก็ทำให้ภายในสมบูรณ์ด้วยความเชื่อในเตาฮีด และถ้อยคำแห่งความบริสุทธิ์ใจ ซึ่งเป็นถ้อยคำที่ประเสริฐที่สุด", "อัศศ็อนอานีย์กล่าวว่า \"ไม่ต้องสงสัยว่าการที่ผู้แต่ง (อิบนุหะญัร) ปิดบทวุฎูอ์ด้วยดุอาอ์นี้ ซึ่งกล่าวเมื่อจบวุฎูอ์ในทางปฏิบัติ จึงเป็นการกล่าวเมื่อจบหลักฐานในทางการเรียบเรียง เป็นการเรียบเรียงที่งดงาม\"", "มีรายงานจากอบูสะอีด อัลคุดรีย์ว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"ผู้ใดอาบน้ำละหมาดอย่างทั่วถึง แล้วกล่าวเมื่อเสร็จว่า 'มหาบริสุทธิ์ยิ่งแด่พระองค์ โอ้อัลลอฮ์ และด้วยการสรรเสริญพระองค์ ฉันขอปฏิญาณว่าไม่มีพระเจ้าอื่นใดนอกจากพระองค์ ฉันขออภัยโทษและกลับเนื้อกลับตัวต่อพระองค์' จะถูกประทับตรา แล้ววางไว้ใต้บัลลังก์ (อัลอัรช์) และจะไม่ถูกทำลายจนถึงวันกิยามะฮ์\" (อัฏเฏาะบะรอนีย์ อัลหากิม แบบมัรฟูอ์ และอันนะสาอีย์ในอะมะลุลยะวมิวัลลัยละฮ์ ทั้งแบบมัรฟูอ์และเมากูฟ อันนะสาอีย์และอิบนุหะญัรว่ารายงานแบบเมากูฟถูกต้องกว่า ผู้แต่งระบุในเชิงอรรถว่าสายรายงานศ่อฮีห์ ความต่างอยู่ที่ว่าเป็นคำของท่านนบี ﷺ หรือของอบูสะอีด)"]}], "tags_th": ["ซิกิรหลังวุฎูอ์", "ชะฮาดะฮ์", "ประตูสวรรค์", "ดุอาอ์", "เตาบะฮ์"]}, {"id": "v1-h058", "volume": 1, "bab": "khuffayn", "topic_ar": "بيان حكم المسح على الخفين", "topic_th": "หุก่มการเช็ดรองเท้าหุ้มข้อ", "pages": [248, 252], "hadith": [{"no": 58, "matn_ar": "عَنِ الْمُغِيرَةِ بْنِ شُعْبَةَ رَضِيَ اللهُ عَنْهُ قَالَ: كُنْتُ مَعَ النَّبِيِّ ﷺ، فَتَوَضَّأَ، فَأَهْوَيْتُ لِأَنْزِعَ خُفَّيْهِ، فَقَالَ: «دَعْهُمَا، فَإِنِّي أَدْخَلْتُهُمَا طَاهِرَتَيْنِ»، فَمَسَحَ عَلَيْهِمَا. مُتَّفَقٌ عَلَيْهِ.", "translation_th": "จากอัลมุฆีเราะฮ์ บินชุอ์บะฮ์ (ร.ฎ.) กล่าวว่า ฉันอยู่กับท่านนบี ﷺ ท่านอาบน้ำละหมาด ฉันจึงก้มลงจะถอดรองเท้าหุ้มข้อของท่าน ท่านกล่าวว่า \"ปล่อยไว้ เพราะฉันสวมมันขณะที่ (เท้าทั้งสอง) สะอาด\" แล้วท่านก็เช็ดบนรองเท้าทั้งสอง บันทึกโดยอัลบุคอรีย์และมุสลิม", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["อนุญาตให้เช็ดรองเท้าหุ้มข้อแทนการล้างเท้า ทั้งในการเดินทางและขณะอยู่บ้าน ไม่ว่าจะจำเป็นหรือไม่", "สำหรับผู้สวมอยู่แล้ว การเช็ดดีกว่าถอดออกแล้วล้างเท้า ส่วนผู้ไม่ได้สวม การล้างดีกว่า ไม่ต้องสวมเพื่อจะเช็ด", "เช็ดได้บนรองเท้าหุ้มข้อทุกแบบ แม้มีรูหรือรอยขาด ตามทัศนะที่ถูกต้อง เพราะซุนนะฮ์กล่าวไว้โดยไม่มีเงื่อนไข", "เงื่อนไขคือต้องสวมขณะมีความสะอาดด้วยน้ำ ผู้แต่งเห็นว่ารอบคอบกว่าที่จะสวมหลังวุฎูอ์ครบแล้ว", "ถุงเท้า (เญาริบ) และผ้าพันเท้าเทียบกับรองเท้าหุ้มข้อได้"], "vocab": [{"ar": "الْخُفّ", "th": "รองเท้าหุ้มข้อ ทำจากหนังบาง คลุมเท้า พหูพจน์คือ خِفَاف"}, {"ar": "الْجَوَارِب", "th": "ถุงเท้า ทำจากวัสดุอื่นที่ไม่ใช่หนัง เช่น ผ้า"}, {"ar": "فَأَهْوَيْتُ", "th": "ฉันก้มลงยื่นมือ"}, {"ar": "لِأَنْزِعَ", "th": "เพื่อถอด"}, {"ar": "دَعْهُمَا", "th": "ปล่อยมันไว้ (รองเท้าทั้งสอง)"}, {"ar": "أَدْخَلْتُهُمَا طَاهِرَتَيْنِ", "th": "ฉันสวมรองเท้าทั้งสองขณะที่เท้าทั้งสองสะอาด"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกในหมวดวุฎูอ์ บทเมื่อสวมโดยเท้าทั้งสองสะอาด (206) และมุสลิม (274) ผ่านซะกะริยา บินอบีซาอิดะฮ์ จากอามิร อัชชะอ์บีย์ จากอุรวะฮ์ บินอัลมุฆีเราะฮ์ จากบิดา", "อิบนุหะญัรระบุว่าซะกะริยาเป็นมุดัลลิส และรายงานจากอามิรด้วยคำว่า \"จาก\" เท่านั้น แต่ท่านไม่ได้สังเกตว่าอบูอะวานะฮ์บันทึกในมุสนัดของเขาสามสายจากซะกะริยา ว่า \"อามิรเล่าให้เราฟัง\" ซึ่งระบุชัดว่าได้ยิน ความกังวลเรื่องการตัดลีสจึงหมดไป อีกทั้งนักวิชาการส่วนใหญ่ถือว่ารายงานของมุดัลลิสในเศาะฮีหัยน์ด้วยคำว่า \"จาก\" มีหุก่มต่อเนื่องและถูกต้อง", "อิบนุหะญัรระบุว่าหะดีษนี้มีหลายสายจากอัลมุฆีเราะฮ์ และยกคำของอัลบัซซารว่ารายงานจากอัลมุฆีเราะฮ์ราวหกสิบสาย จึงเป็นหะดีษที่มีชื่อเสียงที่สุดเรื่องการเช็ดรองเท้าหุ้มข้อ"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ฉันอยู่กับท่านนบี ﷺ ท่านอาบน้ำละหมาด\" ในฉบับบุลูฆเป็นเช่นนี้ ในอัลบุคอรีย์ว่า \"ในการเดินทาง\" แทน \"ท่านอาบน้ำละหมาด\" ความหมายของ \"อาบน้ำละหมาด\" คือเริ่มอาบ ไม่ใช่อาบเสร็จ ตามบริบท การเดินทางในที่นี้คือการเดินทางในสงครามตะบูก เดือนเราะญับ ปี ฮ.ศ. 9 ก่อนละหมาดศุบห์ ตามที่มีในหมวดสงคราม", "\"ฉันก้มลง\" คือก้มยื่นมือ \"เพื่อถอด\" การที่อัลมุฆีเราะฮ์ทำเช่นนี้ อาจเพราะไม่รู้เรื่องข้อผ่อนผันให้เช็ด หรือรู้แต่คิดว่าท่านนบี ﷺ จะทำสิ่งที่ประเสริฐกว่า ตามทัศนะว่าการล้างประเสริฐกว่า", "\"ปล่อยไว้\" สรรพนามหมายถึงรองเท้าหุ้มข้อ หรือเท้า แต่ความหมายแรกชัดกว่า \"เพราะฉันสวมมันขณะที่สะอาด\" สรรพนามใน \"สวมมัน\" หมายถึงเท้า ตามรายงานของอบูดาวูด \"ปล่อยรองเท้าไว้ เพราะฉันใส่เท้าเข้าไปในรองเท้าขณะที่เท้าสะอาด\" ประโยคนี้บอกเหตุผลของคำว่า \"ปล่อยไว้\" ในรายงานของยะห์ยา บินสะอีด อัลก็อฏฏอน จากซะกะริยา ในอะห์มัด ใช้สำนวน \"ฉันใส่มันเข้าไปขณะที่มันสะอาด\" (ความต่างของสองสำนวนจะกล่าวต่อไป)"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "อนุญาตให้เช็ดรองเท้าหุ้มข้อ", "points_th": ["หะดีษเป็นหลักฐานว่าในวุฎูอ์อนุญาตให้เช็ดรองเท้าหุ้มข้อแทนการล้างเท้า ในการเดินทางตามหะดีษนี้ และขณะอยู่บ้านตามหะดีษอะลีที่จะกล่าวต่อไป หะดีษหุซัยฟะฮ์ก็เช่นกัน", "ไม่ต่างกันว่าการเช็ดเป็นเพราะจำเป็นหรือไม่ จึงอนุญาตให้สตรีที่อยู่แต่ในบ้าน และผู้ป่วยที่ไม่ได้เดิน อันนะวะวีย์รายงานว่ามีอิจญ์มาอ์ในเรื่องนี้", "สิ่งที่ปิดเท้า เช่น ถุงเท้าและผ้าพันเท้า เทียบกับรองเท้าหุ้มข้อได้ (จะกล่าวต่อไป)"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "เช็ดหรือถอดแล้วล้าง อะไรดีกว่า", "points_th": ["หะดีษเป็นหลักฐานว่าการเช็ดรองเท้าหุ้มข้อสำหรับผู้ที่สวมอยู่ ดีกว่าถอดออกแล้วล้างเท้า เพราะคำว่า \"ปล่อยไว้\" และเพราะการเช็ดเป็นซุนนะฮ์ที่ยืนยันจากท่านรสูลุลลอฮ์ ﷺ ซึ่งกลุ่มผู้อุตริบางกลุ่มคัดค้าน การฟื้นฟูสิ่งที่ฝ่ายตรงข้ามคัดค้านจึงดีกว่าปล่อยให้ซุนนะฮ์ตาย", "ผู้ที่ถอดรองเท้าทุกครั้งที่อาบน้ำละหมาด ถือว่าขัดกับซุนนะฮ์ และเกรงว่าจะเป็นการเลียนแบบพวกรอฟิเฎาะฮ์ ส่วนผู้ที่ไม่ได้สวม การล้างดีกว่า และไม่ต้องสวมเพื่อจะเช็ด เพราะในกรณีนี้การล้างประเสริฐกว่า"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "เช็ดได้บนรองเท้าทุกแบบ", "points_th": ["หะดีษแสดงว่าการเช็ดใช้กับรองเท้าหุ้มข้อทั่วไป สิ่งที่เรียกว่ารองเท้าหุ้มข้อก็เช็ดได้ แม้จะมีรู รอยขาด หรือรอยแตก ตามทัศนะที่ถูกต้องจากสองทัศนะของนักวิชาการ เพราะซุนนะฮ์กล่าวถึงการเช็ดโดยไม่มีเงื่อนไข และรองเท้าหุ้มข้อโดยปกติมักมีรอยปริหรือขาด โดยเฉพาะเมื่อใช้นาน และเศาะหาบะฮ์หลายคนยากจน ไม่สามารถเปลี่ยนใหม่ได้", "สิ่งที่ศาสนากล่าวไว้โดยไม่มีเงื่อนไข ไม่มีใครจำกัดได้นอกจากด้วยหลักฐานทางศาสนา และไม่มีรายงานจากเศาะหาบะฮ์คนใดที่จำกัดรองเท้าหุ้มข้อด้วยเงื่อนไขใด แต่พวกเขากล่าวถึงการเช็ดโดยไม่มีเงื่อนไข ทั้งที่รู้สภาพของมัน จึงรู้ได้ว่าพวกเขาเข้าใจจากนบีของพวกเขาว่าเช็ดรองเท้าหุ้มข้อได้โดยไม่มีเงื่อนไข (อิบนุตัยมียะฮ์)", "จึงไม่ถูกต้องที่จะกำหนดเงื่อนไขที่ไม่มีที่มาในศาสนา และทำให้จุดประสงค์ของข้อผ่อนผันเสียไป"]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "ต้องชำระครบก่อนสวมหรือไม่", "points_th": ["นักวิชาการบางท่านใช้คำว่า \"เพราะฉันสวมมันขณะที่สะอาด\" เป็นหลักฐานว่าการชำระให้ครบเป็นเงื่อนไขของการเช็ด คือสวมได้หลังชำระเท้าทั้งสองแล้วเท่านั้น เพราะ \"ขณะที่มันสะอาด\" บอกสภาพของเท้าแต่ละข้าง ความหมายคือ ฉันสวมแต่ละข้างขณะที่มันสะอาด ซึ่งจะเป็นได้เมื่อชำระครบ ดังนั้นถ้าล้างเท้าขวาแล้วสวม แล้วล้างเท้าซ้ายแล้วสวม การเช็ดใช้ไม่ได้ เพราะไม่ได้สวมขณะที่ทั้งสองสะอาด แต่สวมข้างแรกก่อนชำระข้างที่สอง เป็นทัศนะของมาลิก อัชชาฟิอีย์ และอีกรายงานจากอะห์มัด ตามทัศนะนี้ ถ้าทำเช่นนั้นต้องถอดข้างขวาแล้วสวมใหม่ ให้การสวมอยู่หลังชำระครบ", "ทัศนะที่สอง: ผู้ที่ล้างเท้าข้างหนึ่งแล้วสวม แล้วล้างอีกข้างแล้วสวม การชำระของเขาครบ และเช็ดได้ เป็นทัศนะของหะนะฟีย์ ชาฟิอีย์บางท่าน และอีกรายงานจากอิมามอะห์มัด เพราะเมื่อล้างหน้า มือ เช็ดศีรษะ และล้างเท้าข้างหนึ่ง เท้าที่ล้างก็สะอาดแล้ว เมื่อสวมก็สวมขณะที่สะอาด แล้วล้างอีกข้างแล้วสวมทันที ก็สวมขณะที่สะอาด จึงสวมรองเท้าทั้งสองขณะที่เท้าสะอาด อิบนุตัยมียะฮ์เลือกและกล่าวว่า \"นี่คือสิ่งที่ถูกต้องอย่างไม่ต้องสงสัย\" อิบนุลก็อยยิมก็เลือกและว่า \"เป็นทัศนะที่ถูกต้องกว่าในสองทัศนะ\"", "คำว่า \"เพราะฉันสวมมันขณะที่สะอาด\" ไม่ได้ระบุชัดตามที่ทัศนะแรกกล่าว แต่อาจหมายความเช่นนั้น หรือหมายถึงสวมแต่ละข้างขณะที่สะอาด แต่หะดีษอบูบักเราะฮ์ (ร.ฎ.) สนับสนุนทัศนะแรก ว่าท่านนบี ﷺ ผ่อนผันให้ผู้เดินทางสามวันสามคืน และผู้อยู่บ้านหนึ่งวันหนึ่งคืน \"เมื่อเขาชำระแล้วสวมรองเท้า ก็ให้เช็ดบนมัน\" (จะกล่าวต่อไป) คำว่า \"เมื่อเขาชำระแล้วสวม\" บ่งว่าไม่สวมก่อนล้างเท้าซ้าย เพราะผู้ที่ทำเช่นนั้นยังไม่เรียกว่าชำระแล้ว", "ผู้แต่งเห็นว่าทัศนะแรกรอบคอบกว่าในเรื่องนี้ คือสวมรองเท้าหลังชำระครบ แต่ผู้ที่ยึดทัศนะที่สอง เราก็ไม่ตัดสินแน่นอนว่าการชำระและการละหมาดของเขาเสีย เพราะยังมีความเป็นไปได้"]}, {"wajh": 7, "type": "fiqh", "heading_ar": null, "heading_th": "สวมด้วยความสะอาดจากน้ำ", "points_th": ["หะดีษเป็นหลักฐานของเงื่อนไขหนึ่งของการเช็ดรองเท้าหุ้มข้อ คือต้องสวมขณะมีความสะอาด และตามรูปคำคือความสะอาดด้วยน้ำ เพราะเป็นความหมายเมื่อกล่าวไว้โดยไม่มีเงื่อนไข นี่คือทัศนะของนักวิชาการส่วนใหญ่", "ถ้าสวมหลังการชำระด้วยการตะยัมมุม ก็เช็ดไม่ได้เมื่อมีน้ำ เพราะการตะยัมมุมไม่เกี่ยวกับเท้า คำว่า \"ขณะที่มันสะอาด\" จึงไม่เกิดขึ้น"]}, {"wajh": 8, "type": "fawaid", "heading_ar": null, "heading_th": "บอกเหตุผลของหุก่ม", "points_th": ["หะดีษแสดงจริยธรรมอันดีงามและการสอนของท่านนบี ﷺ เมื่อห้ามอัลมุฆีเราะฮ์ไม่ให้ถอด ท่านอธิบายเหตุผลว่า ท่านสวมขณะที่เท้าสะอาด การบอกเหตุผลมีประโยชน์สามประการ (ดังที่กล่าวในหะดีษแมว)", "(1) ทำให้ใจสงบและยอมรับ เพราะเมื่อรู้เหตุผลของหุก่มก็สบายใจ แม้ผู้ศรัทธาจะสบายใจอยู่แล้ว แต่การบอกเหตุผลเพิ่มก็เป็นสิ่งดี (2) ความสูงส่งของศาสนา ไม่มีหุก่มใดที่ไม่มีเหตุผลและวิทยปัญญา (3) หุก่มครอบคลุมตามเหตุผล สิ่งใดที่มีเหตุผลนั้น หุก่มที่ผูกกับเหตุผลนั้นก็ใช้กับสิ่งนั้น"]}], "tags_th": ["เช็ดรองเท้าหุ้มข้อ", "คุฟฟ์", "ถุงเท้า", "ข้อผ่อนผัน", "วุฎูอ์"]}, {"id": "v1-h059-060", "volume": 1, "bab": "khuffayn", "topic_ar": "محل المسح على الخفين", "topic_th": "ตำแหน่งที่เช็ดบนรองเท้าหุ้มข้อ", "pages": [253, 256], "hadith": [{"no": 59, "matn_ar": "وَلِلْأَرْبَعَةِ عَنْهُ إِلَّا النَّسَائِيَّ: أَنَّ النَّبِيَّ ﷺ مَسَحَ أَعْلَى الْخُفِّ وَأَسْفَلَهُ. وَفِي إِسْنَادِهِ ضَعْفٌ.", "translation_th": "และในรายงานของนักบันทึกทั้งสี่ ยกเว้นอันนะสาอีย์ จากอัลมุฆีเราะฮ์ (ร.ฎ.) ว่า ท่านนบี ﷺ เช็ดด้านบนและด้านล่างของรองเท้าหุ้มข้อ และสายรายงานมีความอ่อน", "grade_th": "ฎออีฟ (อ่อน) อัลบุคอรีย์ อะห์มัด อบูดาวูด อัตติรมิซีย์ อบูหาติม อบูซุรอะฮ์ และอัดดารุกุฏนีย์ว่าอ่อน"}, {"no": 60, "matn_ar": "عَنْ عَلِيٍّ رَضِيَ اللهُ عَنْهُ قَالَ: لَوْ كَانَ الدِّينُ بِالرَّأْيِ لَكَانَ أَسْفَلُ الْخُفِّ أَوْلَى بِالْمَسْحِ مِنْ أَعْلَاهُ، وَقَدْ رَأَيْتُ رَسُولَ اللهِ ﷺ يَمْسَحُ عَلَى ظَاهِرِ خُفَّيْهِ. أَخْرَجَهُ أَبُو دَاوُدَ بِإِسْنَادٍ حَسَنٍ.", "translation_th": "จากอะลี (ร.ฎ.) กล่าวว่า หากศาสนาเป็นไปตามความเห็น ด้านล่างของรองเท้าหุ้มข้อคงสมควรถูกเช็ดมากกว่าด้านบน แต่ฉันเห็นท่านรสูลุลลอฮ์ ﷺ เช็ดบนด้านบนของรองเท้าหุ้มข้อทั้งสองของท่าน บันทึกโดยอบูดาวูด ด้วยสายรายงานที่หะซัน", "grade_th": "ศ่อฮีห์ (อิบนุหะญัรว่าหะซันที่นี่ และศ่อฮีห์ในอัตตัลคีศ อะห์มัด ชากิรและอัลอัลบานีย์ว่าศ่อฮีห์)"}], "key_rulings_th": ["การเช็ดรองเท้าหุ้มข้ออยู่ที่ด้านบนเท่านั้น ไม่ใช่ด้านล่าง", "หะดีษที่ว่าเช็ดทั้งด้านบนและด้านล่างอ่อน และขัดกับหะดีษที่ถูกต้องกว่า", "การเช็ดรองเท้าหุ้มข้อเป็นเรื่องที่ต้องยึดตามตัวบท ไม่ใช่ใช้ความเห็น เพราะเป็นการเคารพภักดี ไม่ใช่การทำความสะอาด", "วิธีเช็ด: ลูบมือขวาที่เปียกน้ำ กางนิ้ว บนเท้าขวา และมือซ้ายบนเท้าซ้าย ครั้งเดียว ไม่ทำซ้ำ"], "vocab": [{"ar": "الرَّأْي", "th": "ความเห็นที่คนเห็นว่าดีโดยไม่ได้พิจารณาศาสนา"}, {"ar": "ظَاهِرِ خُفَّيْهِ", "th": "ด้านบนของรองเท้าหุ้มข้อทั้งสอง"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجهما", "heading_th": "ที่มาของทั้งสองหะดีษ", "points_th": ["หะดีษอัลมุฆีเราะฮ์: อบูดาวูด (165) ในหมวดฏอฮาเราะฮ์ บทวิธีเช็ด อัตติรมิซีย์ (97) และอิบนุมาญะฮ์ (550) ผ่านอัลวะลีด บินมุสลิม จากเษาร์ บินยะซีด จากเราะญาอ์ บินหัยวะฮ์ จากเลขานุการของอัลมุฆีเราะฮ์ จากอัลมุฆีเราะฮ์ สายรายงานอ่อนตามที่อิบนุหะญัรกล่าว ท่านยกมาเพื่อให้รู้สถานะ มีข้อบกพร่องร้ายแรงสองข้อ", "ข้อแรก: สายขาดระหว่างเษาร์กับเราะญาอ์ อบูดาวูดกล่าวว่า \"ฉันได้ยินว่าเษาร์ไม่ได้ฟังหะดีษนี้จากเราะญาอ์\" อัดดารุกุฏนีย์กล่าวว่า อิบนุลมุบาร็อกรายงานจากเษาร์ว่า \"มีคนเล่าให้ฉันฟังจากเราะญาอ์ บินหัยวะฮ์ จากเลขานุการของอัลมุฆีเราะฮ์ จากท่านนบี ﷺ\" แบบมุรสัล ไม่มีอัลมุฆีเราะฮ์", "ข้อที่สอง: เป็นมุรสัล เพราะเลขานุการของอัลมุฆีเราะฮ์รายงานจากท่านนบี ﷺ โดยไม่ทันยุคท่าน ตามรายงานของอิบนุลมุบาร็อก ซึ่งอัลบุคอรีย์ อบูหาติม และอบูซุรอะฮ์ว่ามีน้ำหนักกว่า อัตติรมิซีย์ถามอัลบุคอรีย์ เขาตอบว่า \"ไม่ถูกต้อง\" อิบนุอบีหาติมถามอบูซุรอะฮ์และบิดา ทั้งสองตอบว่า \"สายนี้ใกล้ความจริงกว่า\" คือสายของอิบนุลมุบาร็อกที่ไม่มีอัลมุฆีเราะฮ์", "ข้อที่สาม: เลขานุการของอัลมุฆีเราะฮ์ไม่เป็นที่รู้จัก ตามที่อิบนุหัซม์กล่าว แต่ข้อนี้ไม่ร้ายแรง เพราะในรายงานของอิบนุมาญะฮ์ระบุชื่อว่า วัรร็อด ซึ่งเป็นที่รู้จักและเชื่อถือได้ นักบันทึกทั้งหกใช้เป็นหลักฐาน สรุปคือสายรายงานอ่อน อิมามหะดีษหลายท่านว่าอ่อน คืออัลบุคอรีย์ อะห์มัด อบูดาวูด อัตติรมิซีย์ อบูหาติม อบูซุรอะฮ์ อัดดารุกุฏนีย์ และคนอื่น ๆ ส่วนตัวบทขัดกับหะดีษศ่อฮีห์ที่ระบุแต่การเช็ดด้านบน ไม่ใช่ด้านล่าง และที่สนับสนุนว่าการเช็ดด้านล่างไม่เป็นที่รู้จักคือหะดีษที่สอง", "หะดีษอะลี: อบูดาวูดบันทึก (162) ผ่านอัลอะอ์มัช จากอบูอิสหาก อัสสะบีอีย์ จากอับดุคอยร์ จากอะลี เขาบันทึกคนเดียวในหกเล่ม อิบนุหะญัรว่าสายรายงานหะซันที่นี่ แต่ในอัตตัลคีศว่า \"สายรายงานศ่อฮีห์\" อะห์มัด ชากิรว่าศ่อฮีห์ อัลอัลบานีย์ว่า \"นี่คือสิ่งที่ถูกต้อง\" อับดุคอยร์คืออิบนุยะซีด อัลฮัมดานีย์ อิบนุมะอีนและอัลอิจลีย์ว่าเชื่อถือได้", "สำนวนของรายงานนี้มีความต่างกัน อัดดารุกุฏนีย์ในอัลอิลัลว่าที่ถูกต้องคือสำนวนของผู้ที่กล่าวว่า \"ฉันเคยเห็นว่าด้านล่างของรองเท้าหุ้มข้อสมควรถูกเช็ดมากกว่าด้านบน\""]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"หากศาสนาเป็นไปตามความเห็น\" ศาสนาหมายถึงหุก่มของอิสลาม ความเห็นคือสิ่งที่คนเห็นว่าดีโดยไม่พิจารณาศาสนา ความหมายคือ หากที่มาของหุก่มศาสนาเป็นเพียงสติปัญญา ด้านล่างของรองเท้าคงสมควรถูกเช็ดมากกว่าด้านบน เพราะด้านล่างสัมผัสสิ่งสกปรกและนะญิส แต่ที่วาญิบคือให้ตัวบทที่ถูกต้องมาก่อนความเห็น และอาจหมายถึงความเห็นตามเปลือกนอก มิฉะนั้นสติปัญญาก็บ่งว่าที่สมควรคือเช็ดด้านบนเท่านั้น เพราะการเช็ดนี้ไม่ได้มีไว้เพื่อทำความสะอาด แต่เพื่อเคารพภักดี และไม่เช็ดด้านล่าง เพราะการเช็ดด้านล่างทำให้มือเปื้อน", "สติปัญญาที่สมบูรณ์ตามศาสนา เพราะไม่สามารถเข้าใจวิทยปัญญาของพระเจ้าได้ทั้งหมด จึงต้องยอมรับและเคารพภักดีอย่างบริสุทธิ์ตามความเป็นบ่าว นี่คือสติปัญญาที่ปลอดจากโรคความคลุมเครือและโรคตัณหา และผู้ที่หลงผิด ทั้งผู้ปฏิเสธศรัทธา นักปรัชญา ผู้อุตริ และผู้ตามอารมณ์ หลงผิดเพราะตามสติปัญญาและละทิ้งการยึดตามตัวบท", "\"แต่ฉันเห็นท่านรสูลุลลอฮ์ ﷺ...\" เหมือนบอกเหตุผลของสิ่งที่ละไว้ในประโยค คือ แต่ด้านล่างของรองเท้าไม่สมควรถูกเช็ด เพราะฉันเห็นท่านรสูลุลลอฮ์ ﷺ เช็ดเฉพาะด้านบน"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "เช็ดด้านบนเท่านั้น", "points_th": ["หะดีษอะลีเป็นหลักฐานของตำแหน่งที่เช็ด คือด้านบนของรองเท้าหุ้มข้อ ไม่ใช่ด้านล่าง ส่วนหะดีษอัลมุฆีเราะฮ์อ่อนและขัดกับหะดีษที่ถูกต้องกว่า อิบนุลก็อยยิมกล่าวว่า \"ท่านนบี ﷺ เช็ดด้านบนของรองเท้าหุ้มข้อ และไม่มีรายงานที่ถูกต้องว่าท่านเช็ดด้านล่าง นอกจากในหะดีษที่สายขาด และหะดีษที่ถูกต้องขัดกับมัน\""]}, {"wajh": 4, "type": "fawaid", "heading_ar": null, "heading_th": "เรื่องที่ต้องยึดตามตัวบท", "points_th": ["การเช็ดรองเท้าหุ้มข้อไม่ได้ปฏิบัติตามความเห็น แต่เป็นเรื่องที่ต้องยึดตามตัวบท (เตาฟีกียะฮ์) ไม่มีความเหมาะสมที่เห็นชัด นอกจากการผ่อนปรนและความง่าย จึงขึ้นอยู่กับสิ่งที่ศาสนากำหนด และศาสนากำหนดให้เช็ดด้านบน ไม่ใช่ด้านล่าง"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "วิธีและปริมาณการเช็ด", "points_th": ["ไม่มีหะดีษที่พึ่งได้ในเรื่องวิธีและปริมาณการเช็ดรองเท้าหุ้มข้อ ที่ชัดคือ เมื่อผู้รับภาระทำสิ่งที่ทางภาษาเรียกว่าการเช็ดบนรองเท้าหุ้มข้อ ก็ใช้ได้", "วิธีคือ ลูบมือขวาที่เปียกน้ำ กางนิ้ว บนเท้าขวา และมือซ้ายบนเท้าซ้ายเช่นกัน เช็ดครั้งเดียว และไม่มีในศาสนาที่จะเช็ดซ้ำ"]}], "tags_th": ["เช็ดรองเท้าหุ้มข้อ", "ด้านบน", "ความเห็น", "ตัวบท", "หะดีษอ่อน"]}, {"id": "v1-h061-062", "volume": 1, "bab": "khuffayn", "topic_ar": "توقيت المسح وأنه مختص بالحدث الأصغر", "topic_th": "กำหนดเวลาการเช็ด และใช้เฉพาะฮะดัษเล็ก", "pages": [257, 261], "hadith": [{"no": 61, "matn_ar": "عَنْ صَفْوَانَ بْنِ عَسَّالٍ رَضِيَ اللهُ عَنْهُ قَالَ: كَانَ رَسُولُ اللهِ ﷺ يَأْمُرُنَا إِذَا كُنَّا سَفْرًا أَنْ لَا نَنْزِعَ خِفَافَنَا ثَلَاثَةَ أَيَّامٍ وَلَيَالِيَهُنَّ، إِلَّا مِنْ جَنَابَةٍ، وَلَكِنْ مِنْ غَائِطٍ وَبَوْلٍ، وَنَوْمٍ. أَخْرَجَهُ النَّسَائِيُّ، وَالتِّرْمِذِيُّ وَاللَّفْظُ لَهُ، وَابْنُ خُزَيْمَةَ وَصَحَّحَاهُ.", "translation_th": "จากเศาะฟวาน บินอัสสาล (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ เคยสั่งเรา เมื่อเราเป็นผู้เดินทาง ว่าไม่ต้องถอดรองเท้าหุ้มข้อของเราสามวันสามคืน เว้นแต่เพราะญะนาบะฮ์ แต่ (ไม่ต้องถอด) เพราะอุจจาระ ปัสสาวะ และการนอน บันทึกโดยอันนะสาอีย์ และอัตติรมิซีย์ (สำนวนเป็นของเขา) และอิบนุคุซัยมะฮ์ ทั้งสองระบุว่าศ่อฮีห์", "grade_th": "หะซัน และถึงระดับศ่อฮีห์ด้วยสายสนับสนุน (อัตติรมิซีย์ว่าหะซันศ่อฮีห์)"}, {"no": 62, "matn_ar": "وَعَنْ عَلِيِّ بْنِ أَبِي طَالِبٍ رَضِيَ اللهُ عَنْهُ قَالَ: جَعَلَ النَّبِيُّ ﷺ ثَلَاثَةَ أَيَّامٍ وَلَيَالِيَهُنَّ لِلْمُسَافِرِ، وَيَوْمًا وَلَيْلَةً لِلْمُقِيمِ. يَعْنِي: فِي الْمَسْحِ عَلَى الْخُفَّيْنِ. أَخْرَجَهُ مُسْلِمٌ.", "translation_th": "จากอะลี บินอบีฏอลิบ (ร.ฎ.) กล่าวว่า ท่านนบี ﷺ กำหนดสามวันสามคืนสำหรับผู้เดินทาง และหนึ่งวันหนึ่งคืนสำหรับผู้อยู่บ้าน หมายถึงในการเช็ดรองเท้าหุ้มข้อ บันทึกโดยมุสลิม", "grade_th": "ศ่อฮีห์ (มุสลิม)"}], "key_rulings_th": ["การเช็ดรองเท้าหุ้มข้อมีกำหนดเวลา ผู้เดินทางสามวันสามคืน ผู้อยู่บ้านหนึ่งวันหนึ่งคืน ตามทัศนะของนักวิชาการส่วนใหญ่", "การเช็ดใช้เฉพาะฮะดัษเล็ก เช่น การนอน ปัสสาวะ อุจจาระ ส่วนญะนาบะฮ์ต้องถอดรองเท้าแล้วล้างเท้า แม้ยังอยู่ในกำหนดเวลา", "เงื่อนไขการเช็ดสี่ข้อ: สวมขณะมีความสะอาด เช็ดในกำหนดเวลา ใช้เฉพาะฮะดัษเล็ก และรองเท้าต้องสะอาด", "ผู้แต่งเห็นว่าทัศนะที่มีน้ำหนักคือ กำหนดเวลาเริ่มนับจากการเช็ดครั้งแรก ไม่ใช่จากการสวมหรือจากฮะดัษหลังสวม ผู้อยู่บ้านจึงเช็ดได้ 24 ชั่วโมง ผู้เดินทาง 72 ชั่วโมง โดยนับตามเวลา ไม่ใช่จำนวนละหมาด"], "vocab": [{"ar": "سَفْرًا", "th": "อ่านสระอะแล้วสุกูน เป็นคำนามรวม หมายถึงผู้เดินทาง"}, {"ar": "يَأْمُرُنَا", "th": "อนุญาตให้เรา คำสั่งในที่นี้หมายถึงการอนุญาต เพราะมีอิจญ์มาอ์ว่าการเช็ดเป็นสิ่งอนุญาต ไม่ใช่วาญิบ"}, {"ar": "جَنَابَة", "th": "สภาพหลังการหลั่งอสุจิ (หรือร่วมประเวณี) รากศัพท์แปลว่าความห่าง"}, {"ar": "جَعَلَ", "th": "กำหนดเป็นบทบัญญัติและกำหนดเวลา"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["เศาะฟวาน บินอัสสาล อัลมุรอดีย์ เศาะหาบะฮ์ที่มีชื่อเสียง อาศัยอยู่ที่กูฟะฮ์ รายงานหะดีษหลายบทจากท่านนบี ﷺ รวมถึงหะดีษยาวเรื่องการเช็ดรองเท้าหุ้มข้อ ความประเสริฐของการแสวงหาความรู้ ความรัก และเวลาสุดท้ายที่การเตาบะฮ์ยังถูกรับ", "เขาร่วมสงครามกับท่านนบี ﷺ สิบสองครั้ง มีผู้รายงานจากเขาหลายคน รวมถึงเศาะหาบะฮ์ผู้ยิ่งใหญ่ อับดุลลอฮ์ บินมัสอูด"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجهما", "heading_th": "ที่มาของทั้งสองหะดีษ", "points_th": ["หะดีษเศาะฟวาน: อัตติรมิซีย์ (96) ในบทการเช็ดรองเท้าหุ้มข้อสำหรับผู้เดินทางและผู้อยู่บ้าน อันนะสาอีย์ และอิบนุคุซัยมะฮ์ (196) ผ่านอาศิม บินอบินนะญูด จากซิรร์ บินหุบัยช์ จากเศาะฟวาน อัตติรมิซีย์ว่า \"หะซันศ่อฮีห์\" และยกคำของอัลบุคอรีย์ว่า \"สิ่งที่ดีที่สุดในบทนี้คือหะดีษเศาะฟวาน บินอัสสาล\"", "หะดีษนี้หมุนรอบอาศิม บินอบินนะญูด ซึ่งความจำมีความอ่อน หะดีษของเขาไม่ต่ำกว่าระดับหะซัน แต่ไม่ถึงระดับศ่อฮีห์ อิบนุหะญัรว่า \"สัจจริง มีความเข้าใจผิดบ้าง เป็นหลักฐานในเรื่องการอ่านอัลกุรอาน หะดีษของเขาในเศาะฮีหัยน์มาพร้อมผู้อื่น\" แต่เขาไม่ได้รายงานคนเดียว ฏ็อลหะฮ์ บินมุศ็อรริฟ หะบีบ บินอบีษาบิต และคนอื่นรายงานสนับสนุน สายสนับสนุนเหล่านี้มีข้อวิจารณ์ แต่รวมกันทำให้หะดีษแข็งแรง และหะดีษเดิมเป็นหะดีษยาว บางสายสนับสนุนไม่มีเรื่องการเช็ด", "ที่ชัดคือการที่อัตติรมิซีย์ว่าศ่อฮีห์ เพราะพิจารณาจากสายต่าง ๆ เขากล่าวว่า \"หะดีษนี้รายงานจากเศาะฟวานจากสายอื่นที่ไม่ใช่อาศิมด้วย\" ผู้ที่ว่าศ่อฮีห์ นอกจากที่กล่าวมา ยังมีอิบนุคุซัยมะฮ์ อิบนุหิบบาน อัลค็อฏฏอบีย์ อันนะวะวีย์ และอิบนุหะญัร อิบนุดะกีกิลอีดก
