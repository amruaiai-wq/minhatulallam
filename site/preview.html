่าถูกต้อง และอิบนุบาซก็เช่นกัน อันนะวะวีย์ว่าเป็นทัศนะของอัลเอาซาอีย์ อิบนุลมุบาร็อก อบูเษาร์ และอิสหาก บินรอฮะวัยฮ์", "สัตว์ที่การเชือดไม่ทำให้อนุมัติ เช่น แมว หนังจะไม่สะอาดด้วยการฟอก แม้จะสะอาดขณะมีชีวิต เพราะมันสะอาดขณะมีชีวิตเนื่องจากหลีกเลี่ยงได้ยาก เหตุผลนี้หมดไปเมื่อมันตาย มันจึงกลับสู่หลักเดิมคือนะญิส", "ผู้แต่งเห็นว่า ทัศนะที่ว่าหะดีษมีความหมายกว้างครอบคลุมหนังทุกชนิดเป็นทัศนะที่แข็งแรง แต่ทัศนะที่ชัดที่สุดและใกล้ความถูกต้องที่สุดคือ เฉพาะสัตว์ที่กินเนื้อได้ และความยำเกรงคือ ละเว้นหนังสัตว์อื่น ตามหะดีษ \"ผู้ใดระวังสิ่งคลุมเครือ เขาได้รักษาศาสนาและเกียรติของเขาไว้\" (อัลบุคอรีย์ มุสลิม) และ \"จงละสิ่งที่ทำให้ท่านสงสัย ไปสู่สิ่งที่ไม่ทำให้ท่านสงสัย\" (อัตติรมิซีย์ อันนะสาอีย์ สายรายงานศ่อฮีห์)", "การที่ศาสนาให้การฟอกทำให้หนังซากสัตว์สะอาดเป็นความเมตตาของอัลลอฮ์ ให้ผู้ที่จำเป็น เช่น คนยากจน ได้ใช้ประโยชน์ ศาสนาจึงยกเว้นหนังออกจากข้อห้ามซากสัตว์ที่มีในอัลกุรอาน", "ผู้แต่งจึงเห็นว่า รอบคอบกว่าที่จะไม่สวมเสื้อขนสัตว์ที่ทำจากหนังสัตว์ล่าเหยื่อ (สิบาอ์) ซึ่งมีขายมากในปัจจุบัน แม้ตามทัศนะที่ถือความหมายกว้างจะถือว่าสะอาดก็ตาม สนับสนุนด้วยหะดีษอัลมิกดาม บินมะอ์ดีกะริบ ว่าท่านรสูลุลลอฮ์ ﷺ ห้ามสวมหนังสัตว์ล่าเหยื่อและห้ามขี่บนมัน (อบูดาวูด อันนะสาอีย์ ศ่อฮีห์)"]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "หะดีษอับดุลลอฮ์ บินอุกัยม์", "points_th": ["หะดีษในบทนี้ศ่อฮีห์กว่าหะดีษอับดุลลอฮ์ บินอุกัยม์ ที่ว่า \"หนังสือของท่านรสูลุลลอฮ์ ﷺ มาถึงเราว่า อย่าใช้ประโยชน์จากซากสัตว์ ทั้งหนัง (อิฮาบ) และเอ็น\" (อบูดาวูด 4128 อัตติรมิซีย์ 1729 อันนะสาอีย์ อิบนุมาญะฮ์ อะห์มัด) ซึ่งเป็นหลักฐานของผู้ที่เห็นว่าการฟอกไม่ทำให้หนังซากสัตว์สะอาด และเป็นทัศนะในมัซฮับหันบะลีย์", "นักวิชาการวิจารณ์หะดีษนี้ว่าสับสน (มุฎฏ่อริบ) ในสายรายงาน เพราะอิบนุอบีลัยลาบางครั้งรายงานจากอิบนุอุกัยม์โดยตรง บางครั้งจากผู้อาวุโสเผ่าญุฮัยนะฮ์ และสับสนในตัวบท บางรายงานว่ามาถึงก่อนท่านนบี ﷺ เสียชีวิตสามวัน บ้างว่าหนึ่งเดือน สองเดือน หรือสี่สิบวัน และยังมีข้อขัดแย้งว่าอิบนุอุกัยม์เป็นเศาะหาบะฮ์หรือไม่ อัลบุคอรีย์ว่า เขาทันยุคท่านนบี ﷺ แต่ไม่ปรากฏว่าได้ยินจากท่านโดยตรง", "หะดีษลักษณะนี้จึงยืนขัดกับหะดีษศ่อฮีห์ไม่ได้ หะดีษศ่อฮีห์ชัดกว่า ถูกต้องกว่า เป็นประโยชน์แก่ประชาชาติมากกว่า และใกล้กับหลักศาสนามากกว่า", "ถ้าหะดีษนี้ศ่อฮีห์ ก็ประสานได้ว่า \"อิฮาบ\" คือหนังที่ยังไม่ฟอก จึงเป็นการห้ามใช้หนังซากสัตว์ก่อนฟอก อิบนุหะญัรสนับสนุนการประสานนี้ อัลหาซิมีย์กล่าวว่า หลังฟอกแล้วเรียกว่า \"ญิลด์\" (หนัง) ไม่เรียกว่าอิฮาบ เป็นที่รู้กันในหมู่นักภาษา การประสานเช่นนี้ทำให้ไม่มีความขัดแย้งระหว่างหะดีษ"]}, {"wajh": 7, "type": "fiqh", "heading_ar": null, "heading_th": "ใช้หนังที่ฟอกแล้วใส่ของแห้งและของเหลว", "points_th": ["หะดีษมัยมูนะฮ์และหะดีษก่อนหน้าเป็นหลักฐานว่า ใช้หนังที่ฟอกแล้วใส่ของแห้ง เช่น ข้าวสาลีและข้าวบาร์เลย์ และของเหลว เช่น น้ำ นม เนย น้ำผึ้ง ได้ เพราะคำว่า \"น้ำและใบเกาะร็อซจะชำระมัน\" เมื่อสะอาดแล้ว หุก่มก็เหมือนสิ่งสะอาดอื่น", "ในหะดีษสะละมะฮ์มีถุงหนังแขวนอยู่ แสดงว่าใช้ใส่น้ำ และท่านนบี ﷺ ไม่ได้คัดค้าน แต่ยอมรับ", "อิบนุอับบาสรายงานจากเสาดะฮ์ ภรรยาท่านนบี ﷺ ว่า \"แพะของเราตัวหนึ่งตาย เราจึงฟอกหนังของมัน แล้วเราก็ใช้ทำน้ำนะบีซ (น้ำแช่อินทผลัม) ในนั้นเรื่อยมาจนมันกลายเป็นถุงหนังเก่า\" (อัลบุคอรีย์)"]}], "tags_th": ["หนังซากสัตว์", "การฟอกหนัง", "ซากสัตว์", "ภาชนะ", "สัตว์ล่าเหยื่อ"]}, {"id": "v1-h021", "volume": 1, "bab": "aniyah", "topic_ar": "حكم آنية أهل الكتاب", "topic_th": "หุก่มภาชนะของชาวคัมภีร์", "pages": [95, 97], "hadith": [{"no": 21, "matn_ar": "عَنْ أَبِي ثَعْلَبَةَ الْخُشَنِيِّ رَضِيَ اللهُ عَنْهُ قَالَ: قُلْتُ: يَا رَسُولَ اللهِ، إِنَّا بِأَرْضِ قَوْمٍ أَهْلِ كِتَابٍ، أَفَنَأْكُلُ فِي آنِيَتِهِمْ؟ قَالَ: «لَا تَأْكُلُوا فِيهَا، إِلَّا أَنْ لَا تَجِدُوا غَيْرَهَا، فَاغْسِلُوهَا، وَكُلُوا فِيهَا». مُتَّفَقٌ عَلَيْهِ.", "translation_th": "จากอบูษะอ์ละบะฮ์ อัลคุชะนีย์ (ร.ฎ.) กล่าวว่า ฉันถามว่า โอ้ท่านรสูลุลลอฮ์ เราอยู่ในดินแดนของชนชาวคัมภีร์ เราจะกินในภาชนะของพวกเขาได้ไหม ท่านตอบว่า \"อย่ากินในภาชนะเหล่านั้น เว้นแต่พวกท่านไม่พบภาชนะอื่น ก็จงล้างมัน แล้วกินในมันได้\" บันทึกโดยอัลบุคอรีย์และมุสลิม", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["ใช้ภาชนะของชาวคัมภีร์ (ยิวและคริสต์) ได้ด้วยสองเงื่อนไขในหะดีษ คือ ไม่มีภาชนะอื่น และล้างก่อนใช้", "เงื่อนไขแรกเป็นเรื่องความยำเกรงและความรอบคอบ เพราะพวกเขาไม่ระวังนะญิส อาจใส่สุรา หรือปรุงซากสัตว์และเนื้อสุกรในภาชนะ", "คำสั่งให้ล้างเป็นสุนัต ไม่ใช่วาญิบ เพราะอาหารของชาวคัมภีร์อนุมัติแก่เรา (อัลมาอิดะฮ์: 5) ซึ่งย่อมอยู่ในภาชนะของพวกเขา เว้นแต่มีเหตุที่ต้องล้าง เช่น มีสุรา หรือซากสัตว์ที่ตายด้วยการรัดคอหรือการตี", "เศาะหาบะฮ์ใส่ใจถามเรื่องที่สำคัญหรือสงสัย ซึ่งเป็นหน้าที่ของมุสลิมทุกคนที่จะถามเรื่องศาสนาที่ตนไม่รู้"], "vocab": [{"ar": "أَهْلُ الْكِتَابِ", "th": "ชาวคัมภีร์ คือยิวและคริสต์ ในหะดีษนี้น่าจะหมายถึงคริสต์ เพราะชนเผ่าอาหรับหลายเผ่าในแผ่นดินชาม เช่น ฆัสสาน ตะนูค บะฮ์ร และบางสาขาของกุฎออะฮ์ รวมถึงบนีคุชัยน์ เผ่าของอบูษะอ์ละบะฮ์ ได้เข้ารีตคริสต์"}, {"ar": "إِنَّا بِأَرْضِ قَوْمٍ", "th": "\"เรา\" คือตัวเขาและเผ่าคุชัยน์ \"ดินแดน\" คือแผ่นดินชาม"}, {"ar": "آنِيَتِهِمْ", "th": "ภาชนะของพวกเขา (พหูพจน์ของ إِنَاء)"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อบูษะอ์ละบะฮ์ อัลคุชะนีย์ เศาะหาบะฮ์ที่รู้จักด้วยกุนยะฮ์ \"อัลคุชะนีย์\" สืบเชื้อสายไปถึงคุชัยน์ บินอันนะมิร จากเผ่ากุฎออะฮ์ ชื่อของเขาและบิดามีความเห็นต่างกันมาก อิบนุหะญัรว่าส่วนใหญ่ระบุว่าชื่อ ญุรษูม", "เขาให้สัตยาบันกับท่านนบี ﷺ ในบัยอะตุรริฎวาน ได้รับส่วนแบ่งในสงครามค็อยบัร และท่านนบี ﷺ ส่งเขาไปเผยแผ่แก่เผ่าของเขาจนพวกเขาเข้ารับอิสลาม", "เขาเป็นชาวชนบทที่ยังชีพด้วยการล่าสัตว์ จึงมีคำถามหลายข้อต่อท่านนบี ﷺ เช่น เรื่องภาชนะของชาวคัมภีร์และเรื่องการล่าสัตว์ เขาไปอยู่ที่ชาม และเสียชีวิตที่นั่นปี ฮ.ศ. 75 ขณะกำลังสุญูด"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกในหมวดการล่าสัตว์ สามแห่ง (5478, 5488, 5496) ผ่านสายอบูอิดรีส อัลเคาลานีย์ จากอบูษะอ์ละบะฮ์ และมุสลิมบันทึกในหะดีษเรื่องการล่าสัตว์ (1930)", "หะดีษนี้มีหลายสายและหลายสำนวนในมุสนัด เศาะฮีหัยน์ และหนังสือสุนัน อิบนุหะญัรเลือกเฉพาะส่วนที่ถามเรื่องภาชนะ ไม่รวมส่วนที่ถามเรื่องการล่าสัตว์ด้วยธนูและสุนัขที่ฝึกแล้ว", "ผู้แต่งระบุว่า ไม่พบสำนวนตามที่อยู่ในบุลูฆในเศาะฮีหัยน์ตรงตัว สำนวนที่ใกล้ที่สุดคือของอัลบุคอรีย์ในหมวดการล่าสัตว์ บทการล่าด้วยธนู (5478)"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"เราอยู่ในดินแดนของชนชาวคัมภีร์\" หมายถึงตัวเขาและเผ่าคุชัยน์ในแผ่นดินชาม ชาวคัมภีร์คือยิวและคริสต์ และในที่นี้น่าจะหมายถึงคริสต์ เพราะชนเผ่าอาหรับหลายเผ่าที่อยู่ชามได้เข้ารีตคริสต์", "\"จงล้างมัน\" ตามรูปคำเป็นคำสั่งที่เป็นวาญิบ สั่งให้ล้างก่อนใช้เพราะคาดว่าภาชนะเป็นนะญิส เนื่องจากพวกเขาไม่หลีกเลี่ยงนะญิส เช่น สุราและเนื้อสุกร (จะอธิบายต่อในข้อที่หก)", "\"แล้วกินในมันได้\" เป็นคำสั่งที่หมายถึงการอนุญาต เพราะมาหลังคำถาม \"เราจะกินในภาชนะของพวกเขาได้ไหม\" และหลังข้อห้าม \"อย่ากินในภาชนะเหล่านั้น\""]}, {"wajh": 4, "type": "fawaid", "heading_ar": null, "heading_th": "ความใส่ใจของเศาะหาบะฮ์ในการถาม", "points_th": ["หะดีษแสดงถึงความใส่ใจของเศาะหาบะฮ์ในการถามเรื่องที่สำคัญหรือสงสัย ซึ่งเป็นหน้าที่ของมุสลิมทุกคน คือถามเรื่องศาสนาที่ตนไม่รู้ เพื่อจะได้เคารพภักดีต่ออัลลอฮ์อย่างรู้แจ้ง อัลลอฮ์ตรัสว่า \"ดังนั้นจงถามผู้รู้ หากพวกเจ้าไม่รู้\" (อัลอัมบิยาอ์: 7)"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "หลีกเลี่ยงการกินในภาชนะของชาวคัมภีร์", "points_th": ["หะดีษเป็นหลักฐานให้หลีกเลี่ยงการกินในภาชนะของชาวคัมภีร์ ทั้งยิวและคริสต์ เพราะพวกเขาไม่ระวังนะญิส อาจใส่สุรา หรือปรุงซากสัตว์และเนื้อสุกรในภาชนะ", "กรณีนี้เป็นการขัดกันระหว่างหลักเดิม (สิ่งต่าง ๆ โดยหลักเดิมสะอาด) กับการคาดการณ์ที่มีน้ำหนัก (ว่าพวกเขาไม่ระวังนะญิส) ในที่นี้การคาดการณ์มีน้ำหนักกว่า เพราะมีเหตุผลแข็งแรง", "สนับสนุนด้วยสำนวนของอบูดาวูด (3839): \"เราอยู่ใกล้ชาวคัมภีร์ พวกเขาปรุงสุกรในหม้อ และดื่มสุราในภาชนะของพวกเขา...\""]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "เงื่อนไขการใช้ภาชนะของชาวคัมภีร์", "points_th": ["หะดีษเป็นหลักฐานว่าใช้ภาชนะของชาวคัมภีร์ได้ด้วยสองเงื่อนไข คือ ไม่มีภาชนะอื่น และล้างก่อน", "เงื่อนไขแรก เป็นเรื่องความยำเกรงและความรอบคอบ จึงไม่ใช้ภาชนะของพวกเขา แม้ล้างแล้ว เว้นแต่ไม่มีภาชนะอื่น", "เงื่อนไขที่สอง เพื่อให้แน่ใจว่าภาชนะสะอาด คำสั่งให้ล้างนี้ไม่ใช่วาญิบ แต่เป็นสุนัต เพราะอาหารของชาวคัมภีร์อนุมัติแก่เรา ดังอายะฮ์ \"และอาหารของบรรดาผู้ที่ได้รับคัมภีร์เป็นที่อนุมัติแก่พวกเจ้า\" (อัลมาอิดะฮ์: 5) และอาหารของพวกเขาย่อมอยู่ในภาชนะของพวกเขา แสดงว่าไม่จำเป็นต้องล้าง อายะฮ์นี้จึงเปลี่ยนคำสั่งในหะดีษจากวาญิบเป็นสุนัต เพื่อประสานหลักฐานเข้าด้วยกัน", "เว้นแต่มีเหตุที่ทำให้ต้องล้าง เช่น พบว่ามีสุราในภาชนะ หรือมีซากสัตว์ที่พวกเขาฆ่าด้วยการรัดคอหรือการตี ก็ต้องล้าง ดังที่สำนวนของอบูดาวูดที่กล่าวมาบ่งชี้"]}], "tags_th": ["ภาชนะ", "ชาวคัมภีร์", "นะญิส", "การล้าง", "หลักเดิมคือสะอาด"]}, {"id": "v1-h022", "volume": 1, "bab": "aniyah", "topic_ar": "جواز استعمال آنية المشركين", "topic_th": "อนุญาตให้ใช้ภาชนะของพวกมุชริก", "pages": [98, 101], "hadith": [{"no": 22, "matn_ar": "عَنْ عِمْرَانَ بْنِ حُصَيْنٍ رَضِيَ اللهُ عَنْهُمَا أَنَّ النَّبِيَّ ﷺ وَأَصْحَابَهُ تَوَضَّأُوا مِنْ مَزَادَةِ امْرَأَةٍ مُشْرِكَةٍ. مُتَّفَقٌ عَلَيْهِ، فِي حَدِيثٍ طَوِيلٍ.", "translation_th": "จากอิมรอน บินหุศ็อยน์ (ร.ฎ.) ว่า ท่านนบี ﷺ และเหล่าเศาะหาบะฮ์ของท่าน อาบน้ำละหมาดจากถุงน้ำหนังของหญิงมุชริกคนหนึ่ง บันทึกโดยอัลบุคอรีย์และมุสลิม เป็นส่วนหนึ่งของหะดีษยาว", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม) แต่คำว่า \"อาบน้ำละหมาด\" ไม่ได้ระบุชัดในเศาะฮีหัยน์"}], "key_rulings_th": ["ใช้ภาชนะของพวกมุชริกได้ ตราบที่ไม่แน่ใจว่ามีนะญิส เพราะเศาะหาบะฮ์ดื่มและตักน้ำจากถุงน้ำของหญิงมุชริก", "หะดีษบ่งชี้ว่าหนังซากสัตว์สะอาดเมื่อฟอก เพราะถุงน้ำทำจากหนังสัตว์ที่มุชริกเชือด ซึ่งถือเป็นซากสัตว์", "ผู้ที่จำเป็นอย่างยิ่งเอาน้ำของผู้อื่นได้ แม้ด้วยกำลัง หากไม่ทำให้เจ้าของเดือดร้อน", "หะดีษมีปาฏิหาริย์ของท่านนบี ﷺ คือน้ำในถุงเพิ่มพูนจนทุกคนได้ดื่ม และถุงน้ำกลับคืนไปเต็มเหมือนเดิม"], "vocab": [{"ar": "مَزَادَة", "th": "อ่านสระอะที่มีม ถุงน้ำหนังขนาดใหญ่ ที่เพิ่มหนังอีกชิ้นเข้าไปให้จุมากขึ้น เรียกอีกอย่างว่า سَطِيحَة"}, {"ar": "الْعَزَالِي", "th": "ปากเทน้ำด้านล่างของถุงน้ำหนัง ถุงหนึ่งมีสองปาก (พหูพจน์ของ عَزْلَاء)"}, {"ar": "الصِّرْم", "th": "อ่านสระอิ กลุ่มกระโจมหรือบ้านเรือนที่อยู่รวมกัน"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อิมรอน บินหุศ็อยน์ บินอุบัยด์ อัลคุซาอีย์ เข้ารับอิสลามในปีค็อยบัร และเป็นผู้ถือธงของเผ่าคุซาอะฮ์ในปีพิชิตมักกะฮ์", "อิบนุอับดิลบัรร์กล่าวว่า เขาเป็นเศาะหาบะฮ์ผู้ประเสริฐและมีความรู้ทางนิติศาสตร์ อุมัร บินอัลค็อฏฏอบ ส่งเขาไปบัศเราะฮ์เพื่อสอนศาสนาแก่ชาวเมือง และเขาเสียชีวิตที่นั่นปี ฮ.ศ. 52"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["ดูเหมือนอิบนุหะญัรหมายถึงหะดีษที่อัลบุคอรีย์บันทึกในหมวดตะยัมมุม บท \"ดินที่สะอาดคือน้ำละหมาดของมุสลิม\" (344) และมุสลิมบันทึกในบทการชดละหมาดที่ขาดไป (682) ผ่านอบูเราะญาอ์ อัลอุฏอริดีย์ จากอิมรอน", "ผู้แต่งชี้ว่า ในหะดีษนี้ไม่มีคำว่าท่านนบี ﷺ อาบน้ำละหมาดจากถุงน้ำของหญิงมุชริก", "สรุปเหตุการณ์: ในการเดินทางครั้งหนึ่ง พวกเขาหลับในช่วงท้ายคืนจนแดดร้อนปลุก อุมัรตื่นขึ้นและกล่าวตักบีรเสียงดังจนท่านนบี ﷺ ตื่น ท่านกล่าวว่า \"ไม่เป็นไร จงออกเดินทาง\" แล้วลงพัก อาบน้ำละหมาด และนำละหมาด ท่านเห็นชายคนหนึ่งไม่ละหมาดด้วยเพราะมีญะนาบะฮ์และไม่มีน้ำ ท่านจึงบอกว่า \"จงใช้ดิน เพราะมันเพียงพอสำหรับท่าน\"", "ต่อมาผู้คนกระหายน้ำ ท่านส่งอะลีกับอีกคนไปหาน้ำ ทั้งสองพบหญิงคนหนึ่งบนอูฐพร้อมถุงน้ำสองถุง จึงพานางมาหาท่านนบี ﷺ ท่านให้เทน้ำจากปากถุงลงภาชนะ แล้วปิดปากบน เปิดปากล่าง ประกาศให้ผู้คนดื่มและตักน้ำ และให้น้ำแก่ชายที่มีญะนาบะฮ์ไปอาบ ถุงน้ำกลับดูเต็มกว่าตอนเริ่มเสียอีก ท่านให้รวบรวมอาหารให้นาง และกล่าวว่า \"เธอรู้ไหมว่าเราไม่ได้ลดน้ำของเธอเลย แต่อัลลอฮ์คือผู้ทรงให้เราดื่ม\"", "นางกลับไปเล่าให้ครอบครัวฟังว่า พบชายที่เป็นนักเวทที่เก่งที่สุด หรือไม่ก็เป็นรสูลของอัลลอฮ์จริง ๆ ต่อมามุสลิมบุกโจมตีพวกมุชริกรอบ ๆ แต่ไม่แตะกลุ่มบ้านของนาง นางจึงชวนเผ่าของนางเข้ารับอิสลาม แล้วพวกเขาก็เข้ารับอิสลาม", "สำนวนนี้ไม่ได้ระบุชัดว่าท่านนบี ﷺ อาบน้ำละหมาดจากถุงน้ำ แต่ในสำนวนของอัลบัยฮะกีย์มีว่า \"ท่านบ้วนปากในน้ำ แล้วเทกลับเข้าปากถุงทั้งสอง...\" อัลอัลบานีย์ว่าสายรายงานศ่อฮีห์ ซึ่งแสดงว่าท่านใช้ถุงน้ำของหญิงมุชริก จึงบ่งชี้ว่าภาชนะของผู้ปฏิเสธศรัทธาสะอาด", "ส่วนเรื่องอาบน้ำละหมาด ผู้แต่งเห็นว่าอิบนุหะญัรอาจหมายความว่า พวกเขาเติมน้ำใส่ถุงและภาชนะของตน ซึ่งรวมถึงการใช้น้ำนั้นอาบน้ำละหมาดด้วย หะดีษด้วยสำนวนแบบในบุลูฆพบบ่อยในตำราฟิกฮ์ อัลมัจญ์ระบุไว้ในอัลมุนตะกอ และอัชเชากานีย์ไม่ได้วิจารณ์ ส่วนอิบนุดะกีกิลอีดยกเฉพาะส่วนที่ว่า \"ท่านนบี ﷺ ขอภาชนะแล้วเทน้ำจากปากถุงลงไป\""]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ท่านนบี ﷺ และเหล่าเศาะหาบะฮ์\" ระบุเศาะหาบะฮ์ด้วย เพื่อไม่ให้เข้าใจว่าเป็นเรื่องเฉพาะท่านนบี ﷺ", "\"อาบน้ำละหมาด\" ตามที่กล่าวแล้ว บริบทของหะดีษไม่ได้ระบุชัด แต่เข้าใจได้จากการที่พวกเขาขาดน้ำ แล้วได้น้ำจากหญิงมุชริกด้วยความโปรดปรานของอัลลอฮ์ และการใช้น้ำนั้นย่อมรวมถึงการอาบน้ำละหมาด", "\"มะซาดะฮ์\" คือถุงน้ำหนังขนาดใหญ่ ที่เพิ่มหนังอีกชิ้นเข้าไป เรียกอีกอย่างว่า สะฏีหะฮ์"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "ใช้ภาชนะของพวกมุชริกได้", "points_th": ["หะดีษเป็นหลักฐานว่าใช้ภาชนะของพวกมุชริกได้ ตราบที่ไม่แน่ใจว่ามีนะญิส เพราะเศาะหาบะฮ์ตักน้ำนี้และดื่ม ซึ่งแสดงว่าพวกเขาจะใช้อาบน้ำละหมาดด้วย"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "หนังซากสัตว์สะอาดเมื่อฟอก", "points_th": ["หะดีษเป็นหลักฐานว่าหนังซากสัตว์สะอาดด้วยการฟอก เพราะถุงน้ำทั้งสองทำจากหนังสัตว์ที่พวกมุชริกเชือด และสัตว์ที่พวกมุชริกเชือดถือเป็นซากสัตว์"]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "เอาน้ำของผู้อื่นเมื่อจำเป็น", "points_th": ["ผู้ที่จำเป็นเอาน้ำที่ผู้อื่นครอบครองได้ โดยเฉพาะเมื่อไม่ทำให้เจ้าของเดือดร้อน จึงเอาน้ำพอดับกระหายได้แม้ด้วยกำลัง เพราะเป็นการปกป้องชีวิตตนเองจากความกระหาย และไม่ทำให้เจ้าของเดือดร้อน", "นี่เป็นกรณีที่ถือว่าหญิงคนนั้นมีพันธสัญญากับมุสลิม แต่บางท่านกล่าวว่า พวกเขาเอาน้ำของนางได้ เพราะนางเป็นผู้ปฏิเสธศรัทธาที่อยู่ฝ่ายศัตรู (กาฟิรหัรบีย์)"]}, {"wajh": 7, "type": "fawaid", "heading_ar": null, "heading_th": "ปาฏิหาริย์ของท่านนบี ﷺ", "points_th": ["หะดีษมีปาฏิหาริย์ที่ชัดเจนอันเป็นสัญญาณแห่งความเป็นนบี อัลลอฮ์ทรงประทานความจำเริญในน้ำนี้ จนผู้คนดื่มและตักน้ำ และถุงน้ำทั้งสองกลับเป็นเหมือนเดิม", "ในรายงานของเศาะฮีหัยน์: \"พวกเราสี่สิบคนที่กระหายน้ำได้ดื่มจนอิ่ม และเติมถุงหนังและภาชนะน้ำทุกใบที่มีอยู่ เพียงแต่เราไม่ได้ให้อูฐดื่ม และถุงน้ำนั้นเกือบจะล้นออกมาเพราะความเต็ม\"", "อิบนุหะญัรอธิบายคำว่า \"เราไม่ได้ลดน้ำของเธอเลย\" ว่า ตามรูปคำ น้ำทั้งหมดที่พวกเขาเอาไป เป็นน้ำที่อัลลอฮ์ทรงเพิ่มและสร้างขึ้นใหม่ ไม่ได้ปะปนกับน้ำของนางเลยในความเป็นจริง แม้ภายนอกจะดูเหมือนปะปนกัน และนี่เป็นปาฏิหาริย์ที่น่าอัศจรรย์ยิ่งกว่า"]}], "tags_th": ["ภาชนะ", "มุชริก", "หนังซากสัตว์", "ปาฏิหาริย์", "อาบน้ำละหมาด"]}, {"id": "v1-h023", "volume": 1, "bab": "aniyah", "topic_ar": "جواز إصلاح الإناء بسلسلة من الفضة", "topic_th": "อนุญาตให้ซ่อมภาชนะด้วยลวดเงิน", "pages": [102, 103], "hadith": [{"no": 23, "matn_ar": "عَنْ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللهُ عَنْهُ: أَنَّ قَدَحَ النَّبِيِّ ﷺ انْكَسَرَ، فَاتَّخَذَ مَكَانَ الشَّعْبِ سِلْسِلَةً مِنْ فِضَّةٍ. أَخْرَجَهُ الْبُخَارِيُّ.", "translation_th": "จากอนัส บินมาลิก (ร.ฎ.) ว่า ถ้วยดื่มน้ำของท่านนบี ﷺ แตก ท่านจึงใช้ลวดเงินเย็บตรงรอยร้าว บันทึกโดยอัลบุคอรีย์", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์)"}], "key_rulings_th": ["อนุญาตให้ซ่อมภาชนะที่แตกด้วยลวดเงินเมื่อจำเป็น ที่หะรอมคือภาชนะที่ทำจากเงิน ส่วนการยึดด้วยเงินเล็กน้อยไม่เป็นไร", "ข้ออนุโลมนี้เฉพาะเงิน ทองคำใช้ไม่ได้ เพราะมีค่ามากกว่าและข้อห้ามรุนแรงกว่า", "ควรซ่อมภาชนะและข้าวของที่ซ่อมได้ แทนการทิ้งแล้วซื้อใหม่ เพราะเป็นความพอดีและการบริหารทรัพย์สินที่ดี"], "vocab": [{"ar": "قَدَح", "th": "ถ้วยดื่มน้ำ พหูพจน์คือ أَقْدَاح"}, {"ar": "انْكَسَرَ", "th": "แตก ในอีกรายงานของอัลบุคอรีย์ว่า انْصَدَعَ คือร้าว"}, {"ar": "الشَّعْب", "th": "รอยร้าว รอยแตก"}, {"ar": "سِلْسِلَة", "th": "อ่านสระอิ คือลวดเงิน หรือชิ้นเงินที่เชื่อมสองข้างของรอยแตก"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกในหมวดการแบ่งคุมุส บทสิ่งที่กล่าวถึงเกี่ยวกับเสื้อเกราะ ไม้เท้า ดาบ และถ้วยของท่านนบี ﷺ (3109) ด้วยสำนวนนี้ ตอนท้ายอาศิมกล่าวว่า \"ฉันเห็นถ้วยนั้นและได้ดื่มจากมัน\"", "อัลบุคอรีย์ยังบันทึกในหมวดเครื่องดื่ม (5638) ผ่านสายอาศิม อัลอะห์วัล จากอิบนุสีรีน จากอนัส", "ผู้แต่งไม่ได้ใส่ชีวประวัติผู้รายงานในหัวข้อนี้ ข้อแรกจึงเป็นที่มาของหะดีษ"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ท่านจึงใช้...\" ตามรูปคำ ผู้ใช้ลวดเงินคือท่านนบี ﷺ สนับสนุนด้วยคำของอิบนุสีรีน (อัลบุคอรีย์): ในถ้วยมีห่วงเหล็ก อนัสต้องการเปลี่ยนเป็นห่วงทองหรือเงิน อบูฏ็อลหะฮ์กล่าวว่า \"อย่าเปลี่ยนสิ่งที่ท่านรสูลุลลอฮ์ ﷺ ทำไว้\" อนัสจึงไม่เปลี่ยน", "เรื่องนี้ยืนยันว่า ผู้ใช้ลวดเงินคือท่านรสูลุลลอฮ์ ﷺ ถ้วยไม่ได้เปลี่ยนจากที่เป็นอยู่ในสมัยท่าน และห่วงเหล็กที่อนัสต้องการเปลี่ยนเป็นทองหรือเงินเป็นคนละชิ้นกับลวดเงิน"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "ซ่อมภาชนะด้วยเงิน", "points_th": ["หะดีษเป็นหลักฐานว่า อนุญาตให้ซ่อมภาชนะที่แตกด้วยลวดเงินเมื่อจำเป็น ที่หะรอมคือการที่ภาชนะทำจากเงิน ส่วนการยึดด้วยเงินเล็กน้อยไม่เป็นไร เพราะเห็นประโยชน์ชัดเจน และภาชนะส่วนใหญ่มีขนาดเล็ก ไม่ต้องใช้เงินมาก", "ส่วนหะดีษอิบนุอุมัร \"หรือภาชนะที่มีส่วนหนึ่งเป็นทองหรือเงิน\" ที่กล่าวไปแล้ว (ในหะดีษที่ 16) หากศ่อฮีห์ ก็ไม่ขัดกับหะดีษนี้ เพราะคำว่า \"ส่วนหนึ่ง\" มีความหมายกว้าง และหะดีษนี้จำกัดความหมายนั้น ตามที่อัชเชากานีย์กล่าว"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "ข้ออนุโลมเฉพาะเงิน ไม่รวมทองคำ", "points_th": ["ข้ออนุโลมนี้เฉพาะเงิน เพราะตัวบทระบุเงิน ส่วนทองคำใช้ในกรณีเช่นนี้ไม่ได้ เพราะมีค่ามากกว่าและข้อห้ามรุนแรงกว่า", "และถ้าทองคำใช้ได้ ท่านนบี ﷺ คงใช้กับภาชนะ เพราะทองคำไม่เป็นสนิมยิ่งกว่าเงิน"]}, {"wajh": 5, "type": "fawaid", "heading_ar": null, "heading_th": "ซ่อมแทนทิ้ง", "points_th": ["หะดีษแสดงว่า เมื่อซ่อมภาชนะหรือข้าวของในบ้านได้ ก็ควรซ่อม ไม่ทิ้งแล้วซื้อใหม่ เพราะการซ่อมเป็นความพอดีและการบริหารทรัพย์สินที่ดี", "ผู้แต่งว่า นี่เป็นบทเรียนสำหรับผู้ที่ชอบเปลี่ยนของใหม่และตามกระแส ทั้งยานพาหนะ เฟอร์นิเจอร์ และเสื้อผ้า ส่วนของเก่าขายในราคาถูก ถ้าไม่ถูกทิ้งไปเสียก่อน ซึ่งเป็นการบริหารที่ไม่ดีและไม่รักษาทรัพย์สิน"]}], "tags_th": ["ภาชนะ", "เงิน", "ทองคำ", "การซ่อมแซม", "ความพอดี"]}, {"id": "v1-h024", "volume": 1, "bab": "najasah", "topic_ar": "نجاسة الخمر", "topic_th": "สุราเป็นนะญิส", "pages": [105, 108], "hadith": [{"no": 24, "matn_ar": "عَنْ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللهُ عَنْهُ قَالَ: سُئِلَ رَسُولُ اللهِ ﷺ عَنِ الْخَمْرِ تُتَّخَذُ خَلًّا؟ قَالَ: «لَا». أَخْرَجَهُ مُسْلِمٌ.", "translation_th": "จากอนัส บินมาลิก (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ ถูกถามเรื่องสุราว่า นำมาทำเป็นน้ำส้มสายชูได้ไหม ท่านตอบว่า \"ไม่ได้\" บันทึกโดยมุสลิม", "grade_th": "ศ่อฮีห์ (มุสลิม)"}], "key_rulings_th": ["ผู้แต่งเห็นว่าสุราเป็นนะญิส ตามทัศนะของนักวิชาการส่วนใหญ่ (สี่มัซฮับและซอฮิรียะฮ์) อิบนุตัยมียะฮ์ อัชชันกีฏีย์ และอิบนุบาซเลือก", "บางท่านเห็นว่าสุราสะอาด เช่น เราะบีอะฮ์ อัลลัยษ์ อัลมุซะนีย์ อัศศ็อนอานีย์ อัชเชากานีย์ และอะห์มัด ชากิร", "ห้ามทำสุราให้เป็นน้ำส้มสายชู และสุราที่ถูกทำเป็นน้ำส้มสายชูไม่สะอาด ยังคงเป็นนะญิส", "ถ้าสุรากลายเป็นน้ำส้มสายชูเองโดยไม่มีใครทำ นักวิชาการส่วนใหญ่เห็นว่าใช้ได้ เพราะความมึนเมาหมดไปแล้ว"], "vocab": [{"ar": "الْخَمْر", "th": "สุรา คือสิ่งที่ทำให้มึนเมา จากน้ำคั้นหรือน้ำแช่ของสิ่งใดก็ได้ ทั้งองุ่น อินทผลัม หรืออื่น ๆ"}, {"ar": "الْخَلّ", "th": "น้ำส้มสายชู คือน้ำคั้นองุ่นหรือสิ่งอื่นที่เปรี้ยวแล้ว"}, {"ar": "تُتَّخَذُ خَلًّا", "th": "ทำให้สุรากลายเป็นน้ำส้มสายชู เช่น ใส่หัวหอม ขนมปัง ยีสต์ หรือหินลงไป ย้ายจากที่ร่มไปที่แดด หรือผสมกับน้ำส้มสายชู"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อิบนุหะญัรนำหะดีษนี้มาในบทนี้เพื่อแสดงว่าสุราเป็นนะญิส ตามทัศนะของนักวิชาการส่วนใหญ่ ก่อนหน้าท่าน อิบนุดะกีกิลอีด (อัลอิลมาม) และอิบนุอับดิลฮาดี (อัลมุหัรร็อร) ก็ทำเช่นนี้ ส่วนนักหะดีษทั่วไปนำหะดีษนี้ไว้ในหมวดเครื่องดื่ม", "มุสลิมบันทึกในหมวดเครื่องดื่ม (1983) ผ่านสายสุฟยาน อัษเษารีย์ จากอัสสุดดีย์ จากยะห์ยา บินอับบาด จากอนัส อัตติรมิซีย์บันทึกในหมวดการซื้อขาย (1294) และว่าหะซันศ่อฮีห์", "อบูดาวูดบันทึกในหมวดเครื่องดื่ม (3675) ด้วยสายเดียวกัน สำนวนว่า อบูฏ็อลหะฮ์ถามท่านนบี ﷺ เรื่องเด็กกำพร้าที่ได้รับมรดกเป็นสุรา ท่านตอบว่า \"จงเททิ้ง\" เขาถามว่า ทำเป็นน้ำส้มสายชูไม่ได้หรือ ท่านตอบว่า \"ไม่ได้\""]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ถูกถามเรื่องสุรา\" สุราคือสิ่งที่ทำให้สติมึนเมา จากน้ำคั้นหรือน้ำแช่ของสิ่งใดก็ได้ ผู้ถามอาจเป็นอบูฏ็อลหะฮ์ ดังรายงานของอบูดาวูด หรืออาจเป็นคนอื่น", "\"นำมาทำเป็นน้ำส้มสายชู\" ดูเหมือนคำถามนี้เกิดหลังการห้ามสุรา ความหมายคือ ทำให้สุรากลายเป็นน้ำส้มสายชูหลังจากที่มันแรงและเป็นฟองแล้ว ด้วยการใส่สิ่งต่าง ๆ ลงไป เช่น หัวหอม ขนมปัง ยีสต์ หิน ย้ายจากที่ร่มไปที่แดดหรือกลับกัน หรือผสมกับน้ำส้มสายชู"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "สุราเป็นนะญิสหรือไม่", "points_th": ["ทัศนะที่หนึ่ง: สุราเป็นนะญิสเมื่อแรงและทำให้มึนเมา ถ้าเปื้อนร่างกาย เสื้อผ้า หรือภาชนะ ต้องล้าง เป็นทัศนะของนักนิติศาสตร์ส่วนใหญ่จากหะนะฟีย์ มาลิกีย์ ชาฟิอีย์ หันบะลีย์ และซอฮิรียะฮ์ อิบนุตัยมียะฮ์ อัชชันกีฏีย์ และอิบนุบาซเลือกทัศนะนี้", "ทัศนะที่สอง: สุราสะอาด อัลกุรฏุบีย์ระบุว่าเป็นทัศนะของเราะบีอะฮ์ บินอับดิรเราะห์มาน (อาจารย์ของอิมามมาลิก) อัลลัยษ์ บินสะอ์ด์ และอัลมุซะนีย์ และนักนิติศาสตร์กลุ่มหนึ่ง อัศศ็อนอานีย์ อัชเชากานีย์ และอะห์มัด ชากิร เลือกทัศนะนี้", "หลักฐานของทัศนะแรก (1) อายะฮ์ \"แท้จริงสุรา การพนัน แท่นหินบูชา และการเสี่ยงทาย เป็นสิ่งโสมม (ริจส์) จากการกระทำของชัยฏอน ดังนั้นจงหลีกห่างจากมัน\" (อัลมาอิดะฮ์: 90) อัลลอฮ์เรียกสุราว่า ริจส์ ซึ่งหมายถึงสิ่งสกปรกที่เป็นนะญิส ดังที่ทรงเรียกซากสัตว์ เลือดที่ไหล และเนื้อสุกรว่า ริจส์ และคำว่า \"จงหลีกห่าง\" หมายถึงหลีกห่างทุกทาง ไม่ว่าจะดื่ม ขาย ทำเป็นน้ำส้มสายชู หรือใช้รักษาโรค", "(2) หะดีษอบูษะอ์ละบะฮ์ (หะดีษที่ 21) ท่านนบี ﷺ สั่งให้ล้างภาชนะของชาวคัมภีร์ที่ใช้ปรุงสุกรและดื่มสุรา คำสั่งให้ล้างแสดงว่าเป็นนะญิส ถ้าสะอาด ท่านคงไม่สั่งให้ล้าง", "หลักฐานของทัศนะที่สอง (1) หะดีษอนัส (อัลบุคอรีย์): เมื่อสุราถูกห้าม ผู้คนก็ออกมาเทสุราในตลาด ถ้าสุราเป็นนะญิส ท่านนบี ﷺ คงห้ามพวกเขา เหมือนที่ห้ามถ่ายทุกข์บนทาง (2) หลักเดิมของสิ่งต่าง ๆ คือสะอาด จนกว่าจะมีหลักฐานว่าเป็นนะญิส และหลักฐานของอีกฝ่ายไม่ชัดเจน", "ผู้แต่งเห็นว่า ทัศนะที่ชัดคือสุราเป็นนะญิส เพราะหลักฐานแข็งแรง โดยเฉพาะหะดีษอบูษะอ์ละบะฮ์ ซึ่งถามถึงภาชนะที่ปรุงสุกรและดื่มสุราพร้อมกัน แล้วได้คำตอบเดียวกันสำหรับทั้งสองว่า \"ถ้าพวกท่านไม่พบภาชนะอื่น ก็จงล้างมัน แล้วปรุงและดื่มในนั้น\" อีกทั้งการถือว่าเป็นนะญิสช่วยให้ทำลายสุราและไม่เก็บไว้ ต่างจากการถือว่าสะอาด ที่อาจทำให้ผู้คนหละหลวมในการเก็บมันไว้", "ผู้แต่งตอบหลักฐานการเทสุราบนถนนว่า สมัยนั้นไม่มีท่อระบายน้ำใต้ดิน และการนำออกไปนอกเมืองลำบาก สุราที่เทไม่ได้มากจนท่วมทุกทาง ยังมีทางให้คนเดินเลี่ยง และถนนไม่ใช่ที่ละหมาด ถ้าจะเหยียบโดนก็มีหลักในซุนนะฮ์ว่าดินที่สะอาดหลังจากนั้นจะชำระเท้าหรือรองเท้าได้ ที่จริงหลักฐานนี้กลับชี้ว่าสุราเป็นนะญิส เพราะของสะอาดย่อมไม่เททิ้งบนถนน แต่จะนำไปใช้ประโยชน์"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "ห้ามทำสุราเป็นน้ำส้มสายชู", "points_th": ["หะดีษเป็นหลักฐานว่า ห้ามทำสุราให้เป็นน้ำส้มสายชู และสุราไม่สะอาดเพราะการกระทำของคน แต่ยังเป็นนะญิส", "เพราะท่านนบี ﷺ ตอบคำถามด้วยการปฏิเสธ ซึ่งแสดงว่าหะรอม และเพราะสุราต้องเททิ้ง การไม่เททิ้งแต่กลับทำเป็นน้ำส้มสายชูจึงเป็นการฝ่าฝืน ซึ่งไม่ทำให้สุราสะอาด การห้ามนี้ยังเป็นการปิดช่องทางสู่ความชั่ว (สัดดุซซะรีอะฮ์)", "ท่านนบี ﷺ ห้ามทำสุราของเด็กกำพร้าเป็นน้ำส้มสายชูอย่างชัดเจน (รายงานของอบูดาวูด) ถ้าทำได้ เด็กกำพร้าย่อมสมควรได้รับการอนุโลมมากที่สุด เพราะทรัพย์สินของเด็กกำพร้าสมควรได้รับการรักษาและดูแลมากกว่าทรัพย์สินอื่น", "แต่ถ้าสุรากลายเป็นน้ำส้มสายชูเองโดยไม่มีใครทำ นักวิชาการส่วนใหญ่เห็นว่าไม่เป็นไร เพราะความมึนเมาซึ่งเป็นเหตุของข้อห้ามหมดไปแล้ว และน้ำส้มสายชูเป็นสิ่งอนุมัติ ท่านนบี ﷺ ขอกับข้าวจากครอบครัวของท่าน พวกเขาตอบว่ามีแต่น้ำส้มสายชู ท่านจึงกินกับมันและกล่าวว่า \"กับข้าวที่ดีคือน้ำส้มสายชู\" (มุสลิม)"]}], "tags_th": ["สุรา", "นะญิส", "น้ำส้มสายชู", "เด็กกำพร้า", "สัดดุซซะรีอะฮ์"]}, {"id": "v1-h025", "volume": 1, "bab": "najasah", "topic_ar": "نجاسة الحمر الأهلية", "topic_th": "ลาบ้านเป็นนะญิส", "pages": [109, 112], "hadith": [{"no": 25, "matn_ar": "وَعَنْهُ قَالَ: لَمَّا كَانَ يَوْمُ خَيْبَرَ، أَمَرَ رَسُولُ اللهِ ﷺ أَبَا طَلْحَةَ، فَنَادَى: «إِنَّ اللهَ وَرَسُولَهُ يَنْهَيَانِكُمْ عَنْ لُحُومِ الْحُمُرِ الْأَهْلِيَّةِ، فَإِنَّهَا رِجْسٌ». مُتَّفَقٌ عَلَيْهِ.", "translation_th": "จากอนัส (ร.ฎ.) กล่าวว่า ในวันค็อยบัร ท่านรสูลุลลอฮ์ ﷺ สั่งอบูฏ็อลหะฮ์ เขาจึงประกาศว่า \"แท้จริงอัลลอฮ์และรสูลของพระองค์ห้ามพวกท่านกินเนื้อลาบ้าน เพราะมันเป็นสิ่งโสมม (ริจส์)\" บันทึกโดยอัลบุคอรีย์และมุสลิม", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["เนื้อลาบ้านหะรอม และเนื้อ เลือด ปัสสาวะ และมูลของมันเป็นนะญิส เรื่องนี้ไม่มีข้อขัดแย้ง", "นักวิชาการต่างกันเรื่องตัว เหงื่อ น้ำลาย และน้ำที่เหลือจากการดื่มของลา มัซฮับอิมามอะห์มัดว่าเป็นนะญิส นักวิชาการส่วนใหญ่ว่าสะอาด", "ผู้แต่งเห็นว่าทัศนะที่มีน้ำหนักคือสะอาด เพราะท่านนบี ﷺ และเศาะหาบะฮ์ขี่ลา และหลีกเลี่ยงได้ยากเหมือนแมว ซึ่งเหมาะกับความง่ายของศาสนา", "ใช้คนประกาศหุก่มสำคัญได้ ถ้าเป็นผู้ที่เชื่อถือได้ และใช้ล่ามได้ ถ้าซื่อสัตย์และรู้ทั้งสองภาษา", "อนุญาตให้รวมพระนามของอัลลอฮ์กับผู้อื่นในสรรพนามเดียว เช่น \"ทั้งสองห้ามพวกท่าน\""], "vocab": [{"ar": "يَوْمُ خَيْبَرَ", "th": "สงครามค็อยบัร ปลายเดือนมุหัรร็อม ฮ.ศ. 7 ค็อยบัรอยู่ห่างจากมะดีนะฮ์ราว 160 กิโลเมตร ในภาษาของชาวยิวแปลว่าป้อม เป็นชื่อของป้อมและไร่นาของชาวยิว"}, {"ar": "الْحُمُرُ الْأَهْلِيَّة", "th": "ลาบ้าน (الحُمُر พหูพจน์ของ حِمَار) คำว่า \"บ้าน\" เพื่อแยกจากลาป่า ซึ่งเป็นที่อนุมัติ"}, {"ar": "رِجْس", "th": "สิ่งสกปรกโสมมทุกอย่าง"}, {"ar": "يَنْهَيَانِكُمْ", "th": "ทั้งสอง (อัลลอฮ์และรสูล) ห้ามพวกท่าน"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกหลายแห่ง หนึ่งในนั้นคือหมวดการล่าสัตว์และการเชือด บทเนื้อลาบ้าน (5528) และมุสลิม (1940) ผ่านสายมุหัมมัด บินสีรีน จากอนัส มุสลิมเพิ่มคำว่า \"จากการกระทำของชัยฏอน\"", "สำนวนในบุลูฆใกล้กับของอัลบุคอรีย์ แต่อัลบุคอรีย์ไม่ได้ระบุชื่อผู้ประกาศ ชื่ออบูฏ็อลหะฮ์มีในรายงานของมุสลิม"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"วันค็อยบัร\" คือสงครามค็อยบัร ปลายเดือนมุหัรร็อม ฮ.ศ. 7 อิบนุลก็อยยิมระบุว่าเป็นทัศนะของนักวิชาการส่วนใหญ่", "\"อบูฏ็อลหะฮ์\" คือ ซัยด์ บินสะฮ์ล์ อัลนัจญารีย์ อัลอันศอรีย์ รู้จักด้วยกุนยะฮ์ เป็นเศาะหาบะฮ์ผู้ประเสริฐ สามีของอุมมุสุลัยม์ มารดาของอนัส อิมามอะห์มัดบันทึกว่าท่านนบี ﷺ กล่าวว่า \"เสียงของอบูฏ็อลหะฮ์น่าเกรงขามต่อพวกมุชริกยิ่งกว่าทหารหนึ่งกองร้อย\" สายรายงานศ่อฮีห์ตามเงื่อนไขของมุสลิม ส่วนสายของอะลี บินญุดอานอ่อน เขาเสียชีวิตปี ฮ.ศ. 34", "\"เพราะมันเป็นริจส์\" เป็นประโยคบอกเหตุผล สรรพนาม \"มัน\" อาจหมายถึงตัวลา จึงทำให้เหงื่อ น้ำลาย น้ำตา และน้ำมูกของมันเป็นนะญิส หรืออาจหมายถึงเนื้อที่อยู่ในหม้อ จึงมีเพียงเนื้อที่เป็นนะญิส ส่วนสิ่งที่กล่าวมาสะอาด"]}, {"wajh": 3, "type": "fawaid", "heading_ar": null, "heading_th": "การประกาศหุก่ม และการใช้ล่าม", "points_th": ["หะดีษแสดงว่าศาสนาให้ประกาศเพื่อแจ้งหุก่มสำคัญและเรื่องอื่น ๆ และให้ผู้อื่นประกาศแทนได้ ถ้าผู้ประกาศเชื่อถือได้ ส่วนผู้ที่เชื่อถือไม่ได้ ไม่อนุญาต", "จากหะดีษนี้ยังได้ว่า ใช้ล่ามแปลคำพูดจากภาษาหนึ่งไปอีกภาษาได้ โดยมีเงื่อนไขว่าล่ามต้องซื่อสัตย์และรู้ทั้งสองภาษา เพื่อไม่ให้แปลผิดหรือบิดเบือนความหมาย"]}, {"wajh": 4, "type": "fawaid", "heading_ar": null, "heading_th": "รวมพระนามอัลลอฮ์กับผู้อื่นในสรรพนามเดียว", "points_th": ["หะดีษแสดงว่าอนุญาตให้รวมพระนามของอัลลอฮ์กับผู้อื่นในสรรพนามเดียว เช่นเดียวกับหะดีษ \"...ให้อัลลอฮ์และรสูลของพระองค์เป็นที่รักแก่เขายิ่งกว่าสิ่งอื่นใดนอกจากทั้งสอง\" (อัลบุคอรีย์ มุสลิม)", "ส่วนหะดีษอะดีย์ บินหาติม (มุสลิม) ว่า ชายคนหนึ่งกล่าวคุฏบะฮ์ว่า \"ผู้ใดเชื่อฟังอัลลอฮ์และรสูลของพระองค์ เขาได้รับทางนำ และผู้ใดฝ่าฝืนทั้งสอง เขาหลงผิด\" ท่านนบี ﷺ กล่าวว่า \"ท่านเป็นผู้กล่าวคุฏบะฮ์ที่แย่ จงกล่าวว่า ผู้ใดฝ่าฝืนอัลลอฮ์และรสูลของพระองค์ เขาหลงผิด\" นักวิชาการตอบไว้หลายแนว", "แนวที่หนึ่ง (เป็นที่รู้จักที่สุด อันนะวะวีย์ระบุ): ที่ตำหนิเพราะคุฏบะฮ์ต้องอธิบายให้ละเอียดชัดเจนและเลี่ยงการพูดเป็นนัย ส่วนในหะดีษของบทนี้ไม่ใช่คุฏบะฮ์ แต่เป็นการสอนหุก่ม ยิ่งสั้นก็ยิ่งจำง่าย", "แนวที่สอง: ใช้สรรพนามคู่ในที่นี้ เพื่อบ่งว่าสิ่งที่อัลลอฮ์ห้าม รสูลก็ห้ามด้วย และกลับกัน ทั้งสองแยกจากกันไม่ได้ ส่วนในคุฏบะฮ์สั่งให้แยก เพื่อบ่งว่าการฝ่าฝืนแต่ละฝ่ายก็ทำให้หลงผิดได้ในตัวเอง ระบุในตำราอธิบายกิตาบุตเตาฮีด และพาดพิงถึงอัลบัยฎอวีย์", "แนวที่สาม: เป็นสิทธิพิเศษของท่านนบี ﷺ ที่รวมตัวท่านกับพระผู้อภิบาลในสรรพนามเดียวได้ ผู้อื่นทำไม่ได้ เพราะอาจทำให้เข้าใจว่าเท่าเทียมกัน ส่วนท่านนบี ﷺ ไม่มีทางถูกเข้าใจเช่นนั้น อัสสุยูฏีย์ระบุและพาดพิงถึงอัลอิซซ์ บินอับดิสสลาม และอัลกุรฏุบีย์ก็ชี้ไว้"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "เนื้อลาบ้านหะรอม และลาเป็นนะญิสหรือไม่", "points_th": ["หะดีษเป็นหลักฐานว่าเนื้อลาบ้านหะรอม และเนื้อ เลือด ปัสสาวะ และมูลของมันเป็นนะญิสทั้งหมด เพราะคำว่า \"ทั้งสองห้ามพวกท่าน\" และ \"เพราะมันเป็นริจส์\" หลักเดิมของข้อห้ามคือหะรอม และหลักเดิมของริจส์ (สิ่งสกปรก) คือต้องหลีกห่าง เรื่องนี้ไม่มีข้อขัดแย้ง", "ข้อขัดแย้งอยู่ที่ตัว เหงื่อ น้ำที่เหลือจากการดื่ม และน้ำลายของลา ทัศนะที่หนึ่ง: เป็นนะญิส ถ้าลาดื่มน้ำแล้วเหลือ น้ำนั้นเป็นนะญิส เหงื่อและน้ำมูกก็เช่นกัน เป็นมัซฮับอิมามอะห์มัด หลักฐานคือหะดีษนี้ ถ้าลาบ้านเป็นนะญิส น้ำที่เหลือจากการดื่มและสิ่งที่กล่าวมาก็เป็นนะญิสด้วย", "ทัศนะที่สอง: สะอาด เป็นมัซฮับของนักวิชาการส่วนใหญ่ และเป็นอีกรายงานหนึ่งจากอิมามอะห์มัด อิบนุกุดามะฮ์และผู้แต่งอัลอินศ็อฟเลือก หลักฐาน (1) ท่านนบี ﷺ และเศาะหาบะฮ์ขี่ลา ซึ่งย่อมเปื้อนเหงื่อ ถ้าเป็นนะญิส ท่านนบี ﷺ คงอธิบาย เพราะผู้คนจำเป็นต้องรู้ (2) ผู้เลี้ยงลาหลีกเลี่ยงได้ยาก จึงคล้ายกับแมวที่ตัวบทระบุว่า \"มันเป็นสัตว์ที่วนเวียนอยู่กับพวกท่าน\" เมื่อแมวได้รับการอนุโลมเพราะวนเวียนอยู่ใกล้ ลาก็ยิ่งสมควรได้รับการอนุโลม โดยเฉพาะผู้ที่ขี่ลาเป็นประจำ", "ผู้แต่งเห็นว่าทัศนะที่สองนี้มีน้ำหนักกว่า อินชาอัลลอฮ์ เพราะเหตุผลแข็งแรง เหมาะกับความง่ายของศาสนามากที่สุด และห่างไกลจากความยุ่งยาก", "ทัศนะที่สองตอบว่า หลักฐานของฝ่ายที่ว่าน้ำลายและเหงื่อเป็นนะญิสไม่ได้ชัดเจน เพราะ \"ริจส์\" อาจหมายถึงหะรอม ดังในอายะฮ์เรื่องสุราและการพนัน (อัลมาอิดะฮ์: 90) และอาจหมายถึงเนื้อที่อยู่ในหม้อ ซึ่งเป็นนะญิสเพราะการเชือดสัตว์ที่กินไม่ได้ไม่ทำให้มันสะอาด อิบนุลก็อยยิมจึงกล่าวว่า หลักฐานว่าเป็นนะญิสสู้หลักฐานว่าสะอาดไม่ได้"]}], "tags_th": ["ลาบ้าน", "นะญิส", "ค็อยบัร", "เหงื่อและน้ำลาย", "ล่าม"]}, {"id": "v1-h026", "volume": 1, "bab": "najasah", "topic_ar": "طهارة لعاب الإبل", "topic_th": "น้ำลายอูฐสะอาด", "pages": [113, 115], "hadith": [{"no": 26, "matn_ar": "عَنْ عَمْرِو بْنِ خَارِجَةَ رَضِيَ اللهُ عَنْهُ قَالَ: خَطَبَنَا رَسُولُ اللهِ ﷺ بِمِنًى، وَهُوَ عَلَى رَاحِلَتِهِ، وَلُعَابُهَا يَسِيلُ عَلَى كَتِفِي. أَخْرَجَهُ أَحْمَدُ، وَالتِّرْمِذِيُّ وَصَحَّحَهُ.", "translation_th": "จากอัมร์ บินคอริญะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวคุฏบะฮ์แก่พวกเราที่มินา ขณะที่ท่านอยู่บนพาหนะ (อูฐ) ของท่าน และน้ำลายของมันไหลลงบนบ่าของฉัน บันทึกโดยอะห์มัดและอัตติรมิซีย์ และอัตติรมิซีย์ระบุว่าศ่อฮีห์", "grade_th": "อัตติรมิซีย์ว่าหะซันศ่อฮีห์ สายรายงานมีจุดอ่อน แต่มีหลักฐานสนับสนุนมาก"}], "key_rulings_th": ["น้ำลายอูฐสะอาด เพราะท่านนบี ﷺ เห็นน้ำลายไหลบนบ่าของเศาะหาบะฮ์แต่ไม่ได้สั่งให้ล้าง", "สัตว์ที่กินเนื้อได้ทุกชนิด เช่น วัว แพะ แกะ น้ำลาย ปัสสาวะ มูล และสิ่งที่ขับถ่ายออกมาสะอาดทั้งหมด", "ข้อห้ามละหมาดในคอกอูฐไม่ได้เป็นเพราะนะญิส แต่เพราะอูฐถูกสร้างมาจากชัยฏอน", "ผู้กล่าวคุฏบะฮ์ควรอยู่ในที่สูง และอนุญาตให้กล่าวคุฏบะฮ์บนหลังพาหนะเมื่อมีประโยชน์และไม่นานเกินไป"], "vocab": [{"ar": "مِنًى", "th": "มินา อ่านสระอิที่มีม เป็นสถานที่หนึ่งในพิธีหัจญ์ ได้ชื่อนี้เพราะเลือดของสัตว์พลีถูกหลั่ง (تُمْنَى) ที่นั่น"}, {"ar": "رَاحِلَة", "th": "อูฐที่ใช้ขี่ ทั้งตัวผู้และตัวเมีย บางท่านว่าหมายถึงอูฐตัวเมียที่เหมาะจะผูกอานขี่"}, {"ar": "لُعَاب", "th": "อ่านสระอุ น้ำลายที่ไหลจากปาก"}, {"ar": "كَتِف", "th": "กระดูกแผ่นกว้างหลังหัวไหล่ (บ่า) ในอีกรายงานของอะห์มัดและอัตติรมิซีย์ว่า \"ไหลระหว่างบ่าทั้งสองของฉัน\""}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อัมร์ บินคอริญะฮ์ บินอัลมุนตะฟิก อัลอะสะดีย์ นับอยู่ในชาวชาม ผู้ที่รายงานจากเขาคือ อับดุรเราะห์มาน บินฆันม์ และชะฮ์ร์ บินเหาชับ"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อะห์มัดและอัตติรมิซีย์ (2121) บันทึกผ่านสายเกาะตาดะฮ์ จากชะฮ์ร์ บินเหาชับ จากอับดุรเราะห์มาน บินฆันม์ จากอัมร์ บินคอริญะฮ์ อัตติรมิซีย์ว่าหะซันศ่อฮีห์", "ผู้แต่งว่าสายรายงานนี้มีจุดอ่อนเพราะชะฮ์ร์ บินเหาชับ ซึ่งอิบนุหะญัรว่า \"เชื่อถือได้ แต่รายงานแบบมุรสัลและผิดพลาดบ่อย\" อันนะสาอีย์บันทึกผ่านสายอิสมาอีล บินอบีคอลิด จากเกาะตาดะฮ์ จากอัมร์ บินคอริญะฮ์", "หะดีษนี้มีหลายสายและหลักฐานสนับสนุน การที่อัตติรมิซีย์ว่าศ่อฮีห์อาจเป็นเพราะหลักฐานสนับสนุนที่มีมาก เช่น หะดีษอนัส: \"ฉันอยู่ใต้อูฐของท่านรสูลุลลอฮ์ ﷺ น้ำลายของมันไหลลงบนตัวฉัน ฉันได้ยินท่านกล่าวว่า...\" (อิบนุมาญะฮ์ อัดดารุกุฏนีย์ อัลบัยฮะกีย์ อัลบูศีรีย์ว่าสายรายงานศ่อฮีห์)"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ที่มินา\" อ่านสระอิที่มีม เป็นสถานที่หนึ่งในพิธีหัจญ์ ได้ชื่อนี้เพราะเลือดของสัตว์พลีถูกหลั่งที่นั่นด้วยการเชือด", "\"ขณะที่ท่านอยู่บนพาหนะของท่าน\" เป็นประโยคบอกสภาพ พาหนะ (ราหิละฮ์) คืออูฐที่ใช้ขี่ ทั้งตัวผู้และตัวเมีย", "\"น้ำลายของมัน\" คือน้ำที่ไหลจากปาก \"บนบ่าของฉัน\" อาจเป็นบ่าเดียวหรือทั้งสองบ่า ในอีกรายงานของอะห์มัดและอัตติรมิซีย์ว่า \"ไหลระหว่างบ่าทั้งสองของฉัน\""]}, {"wajh": 4, "type": "fawaid", "heading_ar": null, "heading_th": "ผู้กล่าวคุฏบะฮ์ควรอยู่ในที่สูง", "points_th": ["ผู้กล่าวคุฏบะฮ์ควรอยู่ในที่สูง เช่น มิมบัรหรือเก้าอี้ เพราะเสียงจะได้ยินชัดกว่า สื่อสารได้ดีกว่า ผู้ฟังให้ความสำคัญมากกว่า และถามได้ง่ายกว่า"]}, {"wajh": 5, "type": "fawaid", "heading_ar": null, "heading_th": "ความใส่ใจในการเผยแผ่หุก่ม", "points_th": ["หะดีษแสดงถึงความใส่ใจของท่านนบี ﷺ ในการเผยแผ่หุก่มแก่ประชาชาติด้วยการกล่าวคุฏบะฮ์ และผู้นำของผู้ประกอบพิธีหัจญ์ควรกล่าวคุฏบะฮ์แก่พวกเขาที่มินา เพื่อสอนหุก่มพิธีที่เหลือ เช่น การขว้างเสาหิน การเชือดสัตว์พลี การโกนผม และการเฏาะวาฟ"]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "กล่าวคุฏบะฮ์บนหลังพาหนะ", "points_th": ["อนุญาตให้กล่าวคุฏบะฮ์และให้คำตักเตือนบนหลังพาหนะ เพราะมีประโยชน์ และไม่ได้ทำซ้ำหรือนานเกินไป ท่านนบี ﷺ ก็หยุดยืนที่อะเราะฟะฮ์บนพาหนะในช่วงบ่าย (อัลบุคอรีย์ มุสลิม)", "ส่วนหะดีษที่ห้ามนั้น หมายถึงกรณีที่ทำให้สัตว์ลำบาก คือขี่โดยไม่มีเหตุจำเป็น เพียงเพื่อนั่งบนหลังมันเหมือนที่นั่ง เช่นหะดีษอบูฮุร็อยเราะฮ์ (อบูดาวูด ศ่อฮีห์): \"พวกท่านอย่าใช้หลังสัตว์พาหนะเป็นมิมบัร เพราะอัลลอฮ์ทรงให้มันรับใช้พวกท่านเพื่อพาพวกท่านไปยังเมืองที่พวกท่านจะไปไม่ถึงนอกจากด้วยความยากลำบาก และทรงให้แผ่นดินแก่พวกท่าน จงทำธุระของพวกท่านบนแผ่นดิน\""]}, {"wajh": 7, "type": "fiqh", "heading_ar": null, "heading_th": "น้ำลายอูฐและของเสียจากสัตว์ที่กินเนื้อได้สะอาด", "points_th": ["หะดีษเป็นหลักฐานว่าน้ำลายอูฐสะอาด ไม่ใช่นะญิส เพราะท่านนบี ﷺ ย่อมเห็นน้ำลายไหลบนบ่าของอัมร์ บินคอริญะฮ์ แต่ไม่ได้สั่งให้ล้าง และการที่ท่านนิ่งเงียบยอมรับถือเป็นซุนนะฮ์ ถ้าสมมุติว่าท่านไม่รู้ อัลลอฮ์ทรงรู้ ถ้าเป็นนะญิส พระองค์คงไม่ปล่อยให้ท่านยอมรับ", "สัตว์เลี้ยงอื่นที่กินเนื้อได้ เช่น วัวและแพะแกะ ก็เหมือนอูฐ น้ำลาย ปัสสาวะ มูล และสิ่งที่ขับถ่ายออกมาสะอาดทั้งหมด", "หลักฐานคือหะดีษญาบิร บินสะมุเราะฮ์ (มุสลิม): \"ฉันละหมาดในคอกแพะได้ไหม\" ท่านตอบว่า \"ได้\" \"ฉันละหมาดในที่พักของอูฐได้ไหม\" ท่านตอบว่า \"ไม่ได้\" ท่านอนุญาตให้ละหมาดในคอกแพะ ทั้งที่คอกแพะย่อมมีปัสสาวะและมูล อันนะวะวีย์ระบุว่าเรื่องนี้นักวิชาการเห็นตรงกัน", "ส่วนการห้ามละหมาดในที่พักของอูฐไม่ได้เป็นเพราะนะญิส เพราะท่านนบี ﷺ อนุญาตให้ชาวอุร็อยนะฮ์ไปอยู่กับอูฐซะกาตและดื่มนมและปัสสาวะของมัน (อัลบุคอรีย์ มุสลิม) แต่เพราะตามหะดีษอัลบะรออ์ บินอาซิบ ท่านกล่าวว่า \"อย่าละหมาดในที่พักของอูฐ เพราะมันมาจากชัยฏอน...\" (อบูดาวูด อัตติรมิซีย์ อิบนุมาญะฮ์ อะห์มัด สายรายงานศ่อฮีห์)"]}, {"wajh": 8, "type": "fawaid", "heading_ar": null, "heading_th": "ความแม่นยำของเศาะหาบะฮ์", "points_th": ["หะดีษแสดงถึงความตื่นตัวของเศาะหาบะฮ์และความแม่นยำในการจดจำหะดีษ โดยเล่าแม้กระทั่งสภาพแวดล้อมขณะที่ได้ยินจากท่านนบี ﷺ"]}], "tags_th": ["อูฐ", "น้ำลาย", "สะอาด", "คุฏบะฮ์", "สัตว์ที่กินเนื้อได้"]}, {"id": "v1-h027-028", "volume": 1, "bab": "najasah", "topic_ar": "بيان كيفية إزالة المني من الثوب", "topic_th": "วิธีขจัดอสุจิออกจากเสื้อผ้า", "pages": [116, 121], "hadith": [{"no": 27, "matn_ar": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا، قَالَتْ: كَانَ رَسُولُ اللهِ ﷺ يَغْسِلُ الْمَنِيَّ، ثُمَّ يَخْرُجُ إِلَى الصَّلَاةِ فِي ذَلِكَ الثَّوْبِ، وَأَنَا أَنْظُرُ إِلَى أَثَرِ الْغَسْلِ فِيهِ. مُتَّفَقٌ عَلَيْهِ.", "translation_th": "จากอาอิชะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ เคยล้างอสุจิ แล้วออกไปละหมาดในเสื้อตัวนั้น โดยที่ฉันยังเห็นรอยล้างอยู่บนเสื้อ บันทึกโดยอัลบุคอรีย์และมุสลิม", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}, {"no": 28, "matn_ar": "وَلِمُسْلِمٍ: لَقَدْ كُنْتُ أَفْرُكُهُ مِنْ ثَوْبِ رَسُولِ اللهِ ﷺ فَرْكًا، فَيُصَلِّي فِيهِ. وَفِي لَفْظٍ لَهُ: لَقَدْ كُنْتُ أَحُكُّهُ يَابِسًا بِظُفُرِي مِنْ ثَوْبِهِ.", "translation_th": "และในรายงานของมุสลิม: แน่นอนฉันเคยขยี้มันออกจากเสื้อของท่านรสูลุลลอฮ์ ﷺ แล้วท่านก็ละหมาดในเสื้อนั้น และในอีกสำนวนของมุสลิม: แน่นอนฉันเคยขูดมันออกจากเสื้อของท่านด้วยเล็บของฉันขณะที่มันแห้ง", "grade_th": "ศ่อฮีห์ (มุสลิม)"}], "key_rulings_th": ["ผู้แต่งเห็นว่าอสุจิของมนุษย์สะอาด เป็นทัศนะที่รู้จักกันในมัซฮับหันบะลีย์และชาฟิอีย์ ส่วนหะนะฟีย์และมาลิกีย์เห็นว่าเป็นนะญิส", "แนวทางของท่านนบี ﷺ คือล้างอสุจิที่เปียก และขยี้หรือขูดอสุจิที่แห้ง", "การล้างอสุจิเป็นสุนัตเพื่อความสะอาด ไม่ใช่วาญิบ จึงไม่ขัดกับหะดีษเรื่องการขยี้", "ภรรยาควรรับใช้สามีตามธรรมเนียม เช่น ซักเสื้อผ้า ทำความสะอาดบ้าน และทำอาหาร ซึ่งเป็นการอยู่ร่วมกันที่ดี"], "vocab": [{"ar": "الْمَنِيّ", "th": "อสุจิของผู้ชาย น้ำสีขาวข้น พุ่งออกเป็นจังหวะพร้อมความใคร่ ตามด้วยความอ่อนล้า"}, {"ar": "الْمَذْي", "th": "น้ำใสเหนียว ออกเมื่อมีความใคร่หรืออวัยวะแข็งตัว เช่น ขณะเล้าโลมหรือนึกถึงการร่วมประเวณี"}, {"ar": "الْوَدْي", "th": "น้ำขาวขุ่นข้น ไม่มีกลิ่น ออกตามหลังปัสสาวะ เป็นนะญิสโดยอิจญ์มาอ์"}, {"ar": "أَفْرُكُهُ", "th": "ขยี้ด้วยมือจนหลุดร่วงออก"}, {"ar": "أَحُكُّهُ يَابِسًا", "th": "ขูดออกให้รอยหมดไปขณะที่มันแห้ง"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อุมมุลมุอ์มินีน อาอิชะฮ์ บินติอบีบักร์ อัศศิดดีก ท่านนบี ﷺ แต่งงานกับนางที่มักกะฮ์หลังเคาะดีญะฮ์เสียชีวิต ขณะนางอายุหกปี และอยู่ร่วมกันเมื่อนางอายุเก้าปี นางอยู่กับท่านเก้าปี (อัลบุคอรีย์ มุสลิม)", "นางเป็นภรรยาที่ท่านรักที่สุด ท่านกล่าวว่า \"ความประเสริฐของอาอิชะฮ์เหนือสตรีทั้งหลาย เหมือนความประเสริฐของษะรีดเหนืออาหารอื่น\" และกล่าวแก่อุมมุสะละมะฮ์ว่า \"ขอสาบานต่ออัลลอฮ์ วะห์ยูไม่เคยลงมาแก่ฉันขณะอยู่ในผ้าห่มของภรรยาคนใดในพวกเธอ นอกจากนาง\" (อัลบุคอรีย์)", "อัลลอฮ์ทรงรับวิญญาณท่านนบี ﷺ ในวันที่เป็นเวรของนาง ในบ้านของนาง ขณะที่ท่านพิงอกของนาง นางไม่มีบุตรกับท่านนบี ﷺ ตามทัศนะที่ถูกต้อง นางขอให้ท่านตั้งกุนยะฮ์ให้ ท่านกล่าวว่า \"จงใช้ชื่อลูกของพี่สาวเธอ\" นางจึงมีกุนยะฮ์ว่า อุมมุอับดิลลาฮ์", "นางมีความรู้ สติปัญญา และความเข้าใจอย่างสูง เผยแพร่ความรู้มากมายแก่ประชาชาติ เสียชีวิตที่มะดีนะฮ์ เดือนเราะมะฎอน ปี ฮ.ศ. 58"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجهما", "heading_th": "ที่มาของทั้งสองหะดีษ", "points_th": ["หะดีษแรก: อัลบุคอรีย์บันทึกในหมวดวุฎูอ์ บทล้างและขยี้อสุจิ (229) และมุสลิมในหมวดฏอฮาเราะฮ์ (289) ผ่านสายสุลัยมาน บินยะสาร สำนวนในบุลูฆเป็นของมุสลิม ในสายนี้สุลัยมานระบุชัดว่าได้ยินจากอาอิชะฮ์ (ในสายของอัลบุคอรีย์ก็เช่นกัน) จึงเป็นการตอบผู้ที่ว่าสุลัยมานไม่ได้ยินจากอาอิชะฮ์", "หะดีษที่สอง: มุสลิมบันทึก (288) ผ่านสายอัลก็อมะฮ์และอัลอัสวัด ว่า ชายคนหนึ่งพักที่บ้านอาอิชะฮ์ ตอนเช้าเขาซักเสื้อ อาอิชะฮ์กล่าวว่า \"ที่จริงท่านแค่ล้างตรงที่เห็นก็พอ ถ้าไม่เห็นก็พรมน้ำรอบ ๆ และฉันเคยขยี้มัน...\"", "สำนวนที่สอง มุสลิมบันทึก (290) ผ่านอับดุลลอฮ์ บินชิฮาบ อัลเคาลานีย์ ว่า เขาพักที่บ้านอาอิชะฮ์แล้วฝันเปียก จึงจุ่มเสื้อทั้งสองชิ้นลงน้ำ สาวใช้ไปบอกอาอิชะฮ์ นางถามว่า เธอเห็นอะไรบนเสื้อไหม เขาตอบว่า ไม่ นางกล่าวว่า \"ถ้าเธอเห็นอะไรก็ล้างมันเสีย ฉันเคยขูดมันออกจากเสื้อของท่านรสูลุลลอฮ์ ﷺ ด้วยเล็บขณะที่มันแห้ง\"", "อัลบุคอรีย์ไม่ได้บันทึกหะดีษเรื่องการขยี้ แต่ชี้ไว้ในชื่อบทตามแนวทางของท่าน นี่อาจเป็นเหตุที่อิบนุหะญัรระบุรายงานของมุสลิม"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظهما", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"เคยล้าง\" กริยาปัจจุบันหลังคำว่า \"กานะ\" บ่งว่าทำซ้ำเป็นประจำ เว้นแต่มีหลักฐานบ่งเป็นอย่างอื่น", "สิ่งที่ออกจากอวัยวะเพศชายมีสี่อย่าง (1) อสุจิ (มะนีย์) น้ำสีขาวข้น พุ่งออกเป็นจังหวะพร้อมความใคร่ ตามด้วยความอ่อนล้า เพราะความใคร่สงบลงเมื่อมันออก (2) มัซีย์ น้ำใสเหนียว ออกเมื่อมีความใคร่ เช่น ขณะเล้าโลมหรือนึกถึงการร่วมประเวณี (จะอธิบายในหะดีษเรื่องสิ่งที่ทำให้เสียวุฎูอ์) (3) วะดีย์ น้ำขาวขุ่นข้น ไม่มีกลิ่น ออกตามหลังปัสสาวะ ในฤดูหนาวมากกว่าฤดูร้อน เป็นนะญิสโดยอิจญ์มาอ์ (4) ปัสสาวะ ผู้แต่งอธิบายว่าเป็นของเหลวที่ไตกรองแยกจากเลือด เพื่อขับน้ำและเกลือแร่ส่วนเกินออกจากร่างกาย", "\"ขยี้มัน... ขยี้\" ใช้คำซ้ำ (มัศดัร) เพื่อยืนยัน และตัดความเป็นไปได้ว่าหมายถึงขยี้พร้อมล้าง จึงชัดว่าขยี้อย่างเดียว ไม่ได้ล้าง", "\"แล้วท่านก็ละหมาดในนั้น\" อักษรฟาอ์บ่งว่าต่อเนื่องกัน ไม่มีการล้างระหว่างการขยี้กับการละหมาด ในรายงานของอิบนุคุซัยมะฮ์ยังว่า นางขูดอสุจิออกจากเสื้อของท่านรสูลุลลอฮ์ ﷺ ขณะที่ท่านกำลังละหมาด", "\"ขูดมันขณะที่แห้ง\" คือขูดให้รอยหมดไปขณะที่มันแห้งไม่มีความชื้น"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "อสุจิสะอาดหรือเป็นนะญิส", "points_th": ["หะดีษเป็นหลักฐานว่าอสุจิของมนุษย์สะอาด แนวทางของท่านนบี ﷺ คือล้างที่เปียก และขยี้ที่แห้ง การขยี้ออกจากเสื้อแล้วละหมาดโดยไม่ล้าง แสดงว่ามันสะอาด นี่เป็นทัศนะที่รู้จักกันในมัซฮับหันบะลีย์และชาฟิอีย์", "หะนะฟีย์และมาลิกีย์ว่าอสุจิของมนุษย์เป็นนะญิส มาลิกีย์ว่าต้องชำระด้วยน้ำทั้งเปียกและแห้ง หะนะฟีย์ว่าที่เปียกต้องใช้น้ำ ที่แห้งขยี้ได้ หลักฐานคือหะดีษอาอิชะฮ์ที่กล่าวไป และอีกรายงานว่า \"ฉันเคยล้างญะนาบะฮ์ออกจากเสื้อของท่านรสูลุลลอฮ์ ﷺ แล้วท่านออกไปละหมาด ทั้งที่รอยน้ำยังอยู่บนเสื้อ\" พวกเขาว่าการล้างมีเพื่อนะญิสเท่านั้น และกริยาหลัง \"กานะ\" บ่งว่าทำประจำ จึงบ่งว่าต้องล้าง", "ผู้แต่งเห็นว่าคำตอบของพวกเขาต่อหะดีษเรื่องการขยี้ไม่มีน้ำหนัก เช่น อ้างว่าการขยี้ไม่ได้หมายความว่าสะอาด หรือว่าเสื้อที่อาอิชะฮ์ขยี้เป็นเสื้อนอน ไม่ใช่เสื้อละหมาด ซึ่งขัดกับความหมายตรงของตัวบทและเป็นการตีความอย่างฝืน", "พวกเขายังอ้างว่าอสุจิออกจากทางขับถ่าย และทุกสิ่งที่ออกจากทางขับถ่ายเป็นนะญิส หะนะฟีย์ยอมรับว่าตามการเทียบ (กิยาส) ที่แห้งก็ต้องล้าง แต่ละการเทียบไว้เพราะหะดีษเรื่องการขยี้", "ผู้แต่งเห็นว่าทัศนะที่มีน้ำหนักคืออสุจิสะอาด เพราะหลักฐานแข็งแรง ถ้าเป็นนะญิส การเทียบย่อมบังคับให้ต้องล้างเหมือนนะญิสอื่น เช่น เลือด ไม่ใช่แค่ขยี้ เพราะการขยี้ไม่ทำให้นะญิสหมดไปจากเสื้อ", "หะดีษเรื่องล้างกับขยี้ไม่ขัดกัน เพราะประสานได้ว่าการล้างเป็นสุนัตเพื่อความสะอาด ไม่ใช่วาญิบ การล้างไม่ได้แสดงว่าสิ่งนั้นเป็นนะญิส เพราะของสะอาดอย่างดิน โคลน หรือน้ำมันที่เปื้อนตัวหรือเสื้อก็ล้างได้ อีกทั้งไม่มีคำสั่งให้ล้างอสุจิ และการกระทำเพียงอย่างเดียวบ่งได้แค่ว่าอนุญาต", "สนับสนุนด้วยหะดีษอาอิชะฮ์ (อิบนุคุซัยมะฮ์ สายรายงานหะซัน): \"ท่านรสูลุลลอฮ์ ﷺ เคยปาดอสุจิออกจากเสื้อด้วยรากหญ้าอิซคิร แล้วละหมาดในนั้น และขูดมันออกจากเสื้อขณะที่แห้ง แล้วละหมาดในนั้น\" อิบนุลก็อยยิมว่าข้อนี้ชัดเจนว่าอสุจิสะอาด ตีความเป็นอื่นไม่ได้ และยังแสดงว่า ศาสนาให้ขจัดรอยอสุจิ ไม่ปล่อยไว้บนเสื้อ แม้ตามทัศนะที่ว่าสะอาด", "หะดีษอิบนุอับบาส: ท่านนบี ﷺ ถูกถามเรื่องอสุจิที่เปื้อนเสื้อ ท่านตอบว่า \"มันเหมือนน้ำมูกและน้ำลาย เพียงเช็ดด้วยเศษผ้าหรือหญ้าอิซคิรก็พอ\" อัดดารุกุฏนีย์และอัลบัยฮะกีย์ว่ารายงานแบบเมากูฟ (คำของอิบนุอับบาส) ถูกต้องกว่า แต่อิบนุลเญาซีย์และอัลมัจญ์ อิบนุตัยมียะฮ์ รับรายงานที่มาถึงท่านนบี ﷺ ส่วนอิบนุตัยมียะฮ์ (ผู้เป็นหลาน) แย้งไว้", "ส่วนที่อ้างว่าทุกสิ่งที่ออกจากทางขับถ่ายเป็นนะญิส ผู้แต่งว่าเป็นการเอาประเด็นที่ยังขัดแย้งมาเป็นหลักฐาน จึงรับไม่ได้ และการเทียบด้วยการออกจากทางเดียวกันก็ใช้ไม่ได้ เพราะปากเป็นทางออกของเสมหะและน้ำลายที่สะอาด และของอาเจียนที่เป็นนะญิส (ตามทัศนะของนักวิชาการส่วนใหญ่) ทวารเป็นทางออกของลมที่สะอาดและอุจจาระที่เป็นนะญิส การที่อสุจิออกทางเดียวกับปัสสาวะจึงไม่ทำให้เป็นนะญิส เพราะการสัมผัสนะญิสภายในร่างกายไม่มีผล มีผลเฉพาะภายนอก"]}, {"wajh": 5, "type": "fawaid", "heading_ar": null, "heading_th": "ความประเสริฐของอาอิชะฮ์ และการรับใช้สามี", "points_th": ["หะดีษแสดงความประเสริฐของอาอิชะฮ์ (ร.ฎ.) และการที่นางรับใช้ท่านนบี ﷺ จึงได้ข้อส่งเสริมให้ภรรยารับใช้สามี เช่น ซักเสื้อผ้า ทำความสะอาดบ้าน ทำอาหาร และสิ่งอื่นตามธรรมเนียม ซึ่งเป็นการอยู่ร่วมกันที่ดีและความเป็นคู่ชีวิตที่งดงาม"]}], "tags_th": ["อสุจิ", "นะญิส", "การขยี้", "อาอิชะฮ์", "เสื้อผ้า"]}, {"id": "v1-h029", "volume": 1, "bab": "najasah", "topic_ar": "كيفية تطهير الثوب من بول الغلام والجارية", "topic_th": "วิธีชำระเสื้อผ้าจากปัสสาวะของทารกชายและทารกหญิง", "pages": [122, 125], "hadith": [{"no": 29, "matn_ar": "عَنْ أَبِي السَّمْحِ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ النَّبِيُّ ﷺ: «يُغْسَلُ مِنْ بَوْلِ الْجَارِيَةِ، وَيُرَشُّ مِنْ بَوْلِ الْغُلَامِ». أَخْرَجَهُ أَبُو دَاوُدَ، وَالنَّسَائِيُّ، وَصَحَّحَهُ الْحَاكِمُ.", "translation_th": "จากอบุสสัมห์ (ร.ฎ.) กล่าวว่า ท่านนบี ﷺ กล่าวว่า \"ปัสสาวะของทารกหญิงให้ล้าง ส่วนปัสสาวะของทารกชายให้พรมน้ำ\" บันทึกโดยอบูดาวูดและอันนะสาอีย์ และอัลหากิมระบุว่าศ่อฮีห์", "grade_th": "หะซัน (อัลบุคอรีย์ว่าหะซัน) และมีหลักฐานสนับสนุนที่ศ่อฮีห์"}], "key_rulings_th": ["ปัสสาวะของทารกชายและทารกหญิงต่างกันที่วิธีชำระ ปัสสาวะทารกชายเพียงพรมน้ำให้ทั่วก็พอ ไม่ต้องล้างหรือบิด ส่วนปัสสาวะทารกหญิงต้องล้างเหมือนนะญิสอื่น", "การพรมน้ำใช้ได้เฉพาะทารกชายที่ยังไม่กินอาหารเป็นหลัก เมื่อกินอาหารแล้ว ปัสสาวะของเขาก็เหมือนของผู้ใหญ่", "การพรมน้ำไม่ได้แสดงว่าปัสสาวะทารกชายสะอาด มันเป็นนะญิส แต่ได้รับการผ่อนปรนในการขจัด", "อุจจาระของทารก ทั้งชายและหญิงต้องล้างเหมือนนะญิสอื่น"], "vocab": [{"ar": "الْجَارِيَة", "th": "เด็กหญิง ได้ชื่อนี้เพราะความคล่องแคล่ว ในที่นี้หมายถึงทารกหญิงที่ยังอยู่ในวัยดื่มนม"}, {"ar": "يُرَشُّ", "th": "พรมหรือราดน้ำให้ทั่วที่ปัสสาวะ ในหะดีษอื่นใช้คำว่า يُنْضَحُ"}, {"ar": "الْغُلَام", "th": "เด็กชาย ตั้งแต่เกิดจนบรรลุศาสนภาวะ ในที่นี้หมายถึงทารกชายที่ยังอยู่ในวัยดื่มนม"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อบุสสัมห์ ทาสที่ได้รับการปลดปล่อยของท่านรสูลุลลอฮ์ ﷺ และเรียกกันว่าผู้รับใช้ท่านรสูลุลลอฮ์ ﷺ ว่ากันว่าชื่อจริงคือ อิยาด เขารายงานหะดีษจากท่านนบี ﷺ เพียงหะดีษเดียว ผู้รายงานจากเขาคือ มุหิลล์ บินเคาะลีฟะฮ์ อัฏฏออีย์", "อิบนุอับดิลบัรร์กล่าวว่า มีคนเล่าว่าเขาหลงทาง และไม่มีใครรู้ว่าเขาเสียชีวิตที่ไหน"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อบูดาวูดบันทึกในหมวดฏอฮาเราะฮ์ บทปัสสาวะของเด็กที่เปื้อนเสื้อ (376) ผ่านมุหิลล์ บินเคาะลีฟะฮ์ ว่า อบุสสัมห์เล่าว่า ฉันรับใช้ท่านนบี ﷺ เมื่อท่านจะอาบน้ำ ท่านบอกว่า \"หันหลังให้ฉัน\" ฉันหันหลังและกั้นท่านไว้ ต่อมามีคนพาหะซันหรือหุสัยน์ (ร.ฎ.) มา แล้วเขาปัสสาวะบนอกของท่าน ฉันจะไปล้าง ท่านกล่าวว่า \"ปัสสาวะของทารกหญิงให้ล้าง ส่วนปัสสาวะของทารกชายให้พรมน้ำ\"", "อันนะสาอีย์บันทึกแยกเป็นสองแห่ง ครึ่งแรกในบทการกำบังขณะอาบน้ำ (224) ครึ่งหลังในบทปัสสาวะของทารกหญิง (304) นักวิชาการบางคนจึงเข้าใจว่าอบุสสัมห์มีสองหะดีษ ที่จริงเป็นหะดีษเดียวด้วยสายเดียว อันนะสาอีย์แยกไว้ ดังที่อิบนุหะญัรระบุ", "อัลหากิมบันทึกครึ่งหลังและว่าศ่อฮีห์ อัซซะฮะบีย์เห็นด้วย และอัลบัยฮะกีย์รายงานว่าอัลบุคอรีย์กล่าวว่า \"หะดีษอบุสสัมห์นี้หะซัน\"", "หลักฐานสนับสนุน: หะดีษอะลี (อบูดาวูด อัตติรมิซีย์ อิบนุมาญะฮ์ อัตติรมิซีย์ว่าหะซันศ่อฮีห์) ว่าท่านนบี ﷺ กล่าวถึงทารกที่ยังดื่มนมว่า \"ปัสสาวะทารกชายให้พรมน้ำ ปัสสาวะทารกหญิงให้ล้าง\" เกาะตาดะฮ์กล่าวว่า กรณีนี้เมื่อทั้งสองยังไม่กินอาหาร เมื่อกินอาหารแล้วให้ล้างทั้งสอง", "และหะดีษอุมมุลฟัฎล์ ลุบาบะฮ์ บินติลหาริษ (อบูดาวูด อิบนุมาญะฮ์ อะห์มัด อัลหากิมว่าศ่อฮีห์): อัลหุสัยน์ บินอะลี อยู่บนตักท่านนบี ﷺ แล้วปัสสาวะใส่ นางขอเสื้อท่านไปซัก ท่านกล่าวว่า \"ปัสสาวะของผู้หญิงเท่านั้นที่ต้องล้าง ส่วนปัสสาวะของผู้ชายให้พรมน้ำ\" อัลบัยฮะกีย์กล่าวว่า หะดีษที่แยกปัสสาวะทารกชายและหญิง เมื่อนำมารวมกันก็มีน้ำหนักแข็งแรง", "ส่วนเฉพาะทารกชาย มีหะดีษอุมมุก็อยส์ บินติมิห์ศ็อน (อัลบุคอรีย์ มุสลิม) ว่า นางพาลูกชายที่ยังไม่กินอาหารมาหาท่านนบี ﷺ ท่านอุ้มไว้บนตัก แล้วเด็กปัสสาวะบนเสื้อท่าน ท่านขอน้ำมาพรม โดยไม่ได้ล้าง ผู้แต่งชี้ว่า อัลบุคอรีย์และมุสลิมไม่ได้บันทึกหะดีษที่แยกระหว่างปัสสาวะทารกชายกับทารกหญิง แต่อัลบุคอรีย์ว่าหะดีษอบุสสัมห์หะซัน"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ญาริยะฮ์\" คือเด็กหญิง ในที่นี้หมายถึงทารกหญิงที่ยังอยู่ในวัยดื่มนม \"ฆุลาม\" คือเด็กชายตั้งแต่เกิดจนบรรลุศาสนภาวะ ในที่นี้หมายถึงทารกชายที่ยังดื่มนม ตามรายงานของอัตติรมิซีย์ในหะดีษอะลี: \"ปัสสาวะของทารกชายที่ยังดื่มนม...\"", "\"ให้พรมน้ำ\" คือเทน้ำให้ทั่วที่ปัสสาวะ ความต่างระหว่างการล้างกับการพรมคือ การล้างต้องให้น้ำท่วมแล้วไหลออก ส่วนการพรมไม่ต้องให้น้ำไหลออก เพียงให้น้ำมากพอทั่วที่ แม้ไม่ถึงขั้นไหลหรือหยดออก"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "แยกวิธีชำระปัสสาวะทารกชายและหญิง", "points_th": ["หะดีษเป็นหลักฐานว่าปัสสาวะทารกชายและหญิงต่างกัน ทั้งสองต้องใช้น้ำ แต่ต่างกันที่วิธีใช้ ปัสสาวะทารกชายเพียงพรมน้ำให้ทั่วก็พอ ไม่ต้องล้างหรือบิด ดังหะดีษอุมมุก็อยส์ในมุสลิมว่า \"ท่านขอน้ำมาพรม และไม่ได้ล้าง\" ส่วนปัสสาวะทารกหญิงต้องล้างเหมือนนะญิสอื่น"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "เงื่อนไข: ยังไม่กินอาหาร", "points_th": ["หุก่มการพรมน้ำมีเงื่อนไขว่าทารกยังไม่กินอาหาร ตามที่เกาะตาดะฮ์ผู้รายงานระบุ ในหะดีษอุมมุก็อยส์ว่า \"ยังไม่กินอาหาร\" และในรายงานของมุสลิมว่า \"ยังไม่ถึงวัยกินอาหาร\"", "\"ยังไม่กินอาหาร\" หมายความว่าอาหารยังไม่ใช่อาหารหลัก เพราะยังเล็ก อาหารหลักของเขาคือนม ไม่ว่าจะเป็นนมแม่ นมสัตว์ หรือนมผงอย่างในปัจจุบัน ไม่ได้หมายความว่าไม่มีอะไรเข้าท้องเลย เพราะทารกได้รับยา น้ำตาล และการป้อนอินทผลัม (ตะห์นีก) ตั้งแต่เกิด เมื่อกินอาหารเป็นหลักแล้ว ปัสสาวะของเขาก็เหมือนของผู้ใหญ่ แม้บางครั้งยังดื่มนมอยู่"]}, {"wajh": 6, "type": "fawaid", "heading_ar": null, "heading_th": "วิทยปัญญาของการแยก", "points_th": ["อิบนุลก็อยยิมกล่าวว่า การแยกระหว่างปัสสาวะทารกชายและหญิงเป็นความงามและวิทยปัญญาของศาสนา ด้วยสามเหตุผล (1) ผู้คนทั้งชายและหญิงอุ้มทารกชายบ่อยกว่า ปัสสาวะของเขาจึงเปื้อนบ่อย การล้างจึงลำบาก (2) ปัสสาวะทารกชายไม่ตกที่เดียว แต่กระจายไปหลายที่ การล้างทุกจุดจึงลำบาก ต่างจากทารกหญิง (3) ปัสสาวะทารกหญิงสกปรกและเหม็นกว่า เพราะเพศชายมีความร้อนและเพศหญิงมีความชื้น ความร้อนลดกลิ่นเหม็นของปัสสาวะและละลายความชื้นได้", "อิบนุมาญะฮ์เล่าจากอบุลยะมาน อัลมิศรีย์ว่า เขาถามอัชชาฟิอีย์ถึงหะดีษนี้ ทั้งที่น้ำทั้งสองก็เหมือนกัน อัชชาฟิอีย์ตอบว่า เพราะปัสสาวะทารกชายมาจากน้ำและดิน ส่วนปัสสาวะทารกหญิงมาจากเนื้อและเลือด เพราะเมื่ออัลลอฮ์ทรงสร้างอาดัม หะวาอ์ถูกสร้างจากซี่โครงสั้นของเขา อิบนุลมุลักกินว่าเป็นคำตอบที่ดีและหายาก แต่น่าแปลกที่นักวิชาการชาฟิอีย์ไม่ได้บันทึกไว้ในตำราของพวกเขา"]}, {"wajh": 7, "type": "fiqh", "heading_ar": null, "heading_th": "ปัสสาวะทารกชายเป็นนะญิส", "points_th": ["การอนุญาตให้พรมน้ำไม่ได้แสดงว่าปัสสาวะทารกชายสะอาด มันเป็นนะญิส แต่ได้รับการผ่อนปรนในการขจัด อันนะวะวีย์กล่าวว่า นักวิชาการชาฟิอีย์บางท่านรายงานว่ามีอิจญ์มาอ์ว่าเป็นนะญิส และไม่มีผู้ใดเห็นต่างนอกจากดาวูด อัซซอฮิรีย์"]}, {"wajh": 8, "type": "fiqh", "heading_ar": null, "heading_th": "อุจจาระของทารก", "points_th": ["โดยนัยของหะดีษ อุจจาระของทารกชายและหญิงเหมือนกัน ต้องล้างเหมือนนะญิสอื่น เพราะทั้งสองเท่ากันในทุกกรณี แต่ซุนนะฮ์แยกไว้เฉพาะเรื่องปัสสาวะ ส่วนอื่นคืออุจจาระจึงคงอยู่ตามหลักเดิม"]}], "tags_th": ["ปัสสาวะ", "ทารก", "การพรมน้ำ", "นะญิส", "เสื้อผ้า"]}, {"id": "v1-h030", "volume": 1, "bab": "najasah", "topic_ar": "كيفية تطهير الثوب من دم الحيض", "topic_th": "วิธีชำระเสื้อผ้าจากเลือดประจำเดือน", "pages": [126, 132], "hadith": [{"no": 30, "matn_ar": "عَنْ أَسْمَاءَ بِنْتِ أَبِي بَكْرٍ رَضِيَ اللهُ عَنْهُمَا أَنَّ النَّبِيَّ ﷺ قَالَ - فِي دَمِ الْحَيْضِ يُصِيبُ الثَّوْبَ -: «تَحُتُّهُ، ثُمَّ تَقْرُصُهُ بِالْمَاءِ، ثُمَّ تَنْضَحُهُ، ثُمَّ تُصَلِّي فِيهِ». مُتَّفَقٌ عَلَيْهِ.", "translation_th": "จากอัสมาอ์ บินติอบีบักร์ (ร.ฎ.) ว่า ท่านนบี ﷺ กล่าวเกี่ยวกับเลือดประจำเดือนที่เปื้อนเสื้อผ้าว่า \"ให้นางขูดมันออก แล้วขยี้มันด้วยน้ำ แล้วล้างมัน แล้วละหมาดในเสื้อนั้นได้\" บันทึกโดยอัลบุคอรีย์และมุสลิม", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["เลือดประจำเดือนเป็นนะญิสโดยอิจญ์มาอ์ ต้องล้างทั้งน้อยและมาก แต่ตามทัศนะที่มีน้ำหนัก เลือดเพียงเล็กน้อยได้รับการอนุโลม", "วิธีชำระนะญิสที่แห้ง: ขูดออกก่อน แล้วขยี้ด้วยน้ำ แล้วล้าง", "เลือดอื่นนอกจากเลือดประจำเดือน นักวิชาการส่วนใหญ่ว่าเป็นนะญิส อัชเชากานีย์ อัลอัลบานีย์ และอิบนุอุษัยมีนว่าสะอาด ผู้แต่งเห็นว่าควรชำระด้วยความรอบคอบ ยกเว้นเลือดจากบาดแผลที่ไหลไม่หยุด", "ผู้แต่งเห็นว่าที่ถูกต้องคือ ขจัดนะญิสด้วยสิ่งใดก็ได้ที่ขจัดได้ ไม่จำเป็นต้องเป็นน้ำ เช่น น้ำส้มสายชู หรือน้ำยาฆ่าเชื้อสมัยใหม่", "สตรีละหมาดในเสื้อผ้าที่สวมขณะมีประจำเดือนได้ เมื่อชำระแล้ว"], "vocab": [{"ar": "الْحَيْض", "th": "เลือดตามธรรมชาติที่ออกจากสตรีในช่วงเวลาที่รู้กัน เมื่อบรรลุวัยและพร้อมตั้งครรภ์"}, {"ar": "تَحُتُّهُ", "th": "ขูดหรือแซะออกด้วยปลายหินหรือไม้ เพื่อขจัดตัวเลือดออกก่อน"}, {"ar": "تَقْرُصُهُ بِالْمَاءِ", "th": "ขยี้เลือดด้วยปลายนิ้วกับน้ำ ให้มันละลายและออกจากเนื้อผ้า"}, {"ar": "تَنْضَحُهُ", "th": "ล้างมันด้วยน้ำ"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อัสมาอ์ บินติอบีบักร์ อัศศิดดีก เข้ารับอิสลามแต่เนิ่น ๆ ที่มักกะฮ์ หลังจากมีผู้เข้ารับอิสลามแล้วสิบเจ็ดคน แต่งงานกับอัซซุบัยร์ บินอัลเอาวาม และอพยพไปมะดีนะฮ์ขณะตั้งครรภ์อับดุลลอฮ์ บินอัซซุบัยร์ แล้วคลอดที่กุบาอ์ในปีที่อพยพ ตามทัศนะที่ถูกต้องที่สุด", "นางได้ฉายาว่า \"ซาตุนนิฏอกัยน์\" (เจ้าของผ้าคาดเอวสองผืน) อิบนุสะอ์ด์รายงาน (อิบนุหะญัรว่าสายรายงานศ่อฮีห์) ว่า นางเตรียมเสบียงให้ท่านนบี ﷺ ที่บ้านอบูบักร์เมื่อท่านจะอพยพ แต่ไม่มีอะไรผูกถุงเสบียงและถุงน้ำ นางจึงฉีกผ้าคาดเอวเป็นสองชิ้น ผูกถุงน้ำชิ้นหนึ่ง และถุงเสบียงอีกชิ้นหนึ่ง", "ผู้รายงานจากนางคือ อับดุลลอฮ์และอุรวะฮ์ลูกชายของนาง ฟาฏิมะฮ์ บินติลมุนซิร และคนอื่น ๆ นางมีชีวิตจนอับดุลลอฮ์ลูกชายได้เป็นเคาะลีฟะฮ์และถูกสังหารปี ฮ.ศ. 73 แล้วนางเสียชีวิตไม่นานหลังจากนั้น ฮิชาม บินอุรวะฮ์เล่าว่า นางอายุถึงร้อยปี ฟันไม่หลุดสักซี่ และสติปัญญายังดี"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกในหมวดวุฎูอ์ บทล้างเลือด (227) และในหมวดประจำเดือน บทล้างเลือดประจำเดือน (307) ชื่อบทแรกกว้างกว่าบทที่สอง ดังที่อิบนุหะญัรระบุ มุสลิมบันทึกในหมวดฏอฮาเราะฮ์ (291) ทั้งสองผ่านสายฟาฏิมะฮ์ บินติลมุนซิร จากย่า (ยาย) ของนาง คืออัสมาอ์ สำนวนเป็นของมุสลิม"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"เลือดประจำเดือน\" คือเลือดตามธรรมชาติที่สตรีมีเป็นประจำในช่วงเวลาที่รู้กัน เมื่อบรรลุวัยและพร้อมตั้งครรภ์ (จะอธิบายในบทว่าด้วยประจำเดือน)", "\"ให้นางขูดมัน\" คือขูดหรือแซะด้วยปลายหินหรือไม้ ในรายงานของอิบนุคุซัยมะฮ์ว่า \"จงขูดมัน แล้วขยี้ด้วยน้ำ\" จุดประสงค์คือขจัดตัวเลือดออก เพื่อให้ล้างด้วยน้ำได้ง่าย", "\"แล้วขยี้มันด้วยน้ำ\" คือใช้ปลายนิ้วขยี้เลือดกับน้ำ ให้มันละลาย และสิ่งที่ซึมเข้าเนื้อผ้าออกมา", "\"แล้วนัฎห์มัน\" คือล้างมันด้วยน้ำ หะดีษอาอิชะฮ์ (อัลบุคอรีย์) ระบุชัด: \"พวกเราคนหนึ่งมีประจำเดือน เมื่อหมดก็ขยี้เลือดออกจากเสื้อแล้วล้าง และพรมน้ำที่ส่วนที่เหลือ แล้วละหมาดในนั้น\" หะดีษอาอิชะฮ์จึงอธิบายหะดีษอัสมาอ์ว่า นัฎห์ในที่นี้หมายถึงการล้าง ส่วนการพรมที่ส่วนอื่นของเสื้อเป็นเพียงการพรมเพื่อความสบายใจ เพราะไม่ได้พรมตรงที่มีเลือด และการพรมตรงที่ไม่มีเลือดเป็นการป้องกันความระแวง (วัสวะสะฮ์)"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "เลือดประจำเดือนและเลือดอื่น", "points_th": ["หะดีษเป็นหลักฐานว่าเลือดประจำเดือนเป็นนะญิส ต้องล้างทั้งน้อยและมาก และเป็นนะญิสโดยอิจญ์มาอ์ เพราะท่านนบี ﷺ สั่งให้ล้างจากเสื้อก่อนละหมาด อิบนุบัฏฏ็อลว่า หะดีษอัสมาอ์เป็นหลักในการล้างนะญิสจากเสื้อผ้า และอัชชาฟิอีย์ว่า หะดีษนี้แสดงว่าเลือดประจำเดือนเป็นนะญิส และเลือดอื่นทุกชนิดก็เช่นกัน ตามทัศนะที่มีน้ำหนักจากสองทัศนะของนักวิชาการ เลือดเพียงเล็กน้อยได้รับการอนุโลม", "เลือดที่ออกจากทางอื่นนอกจากทวารทั้งสอง เช่น เลือดกำเดา เลือดจากฟัน หรือบาดแผล มีสองทัศนะ ทัศนะที่หนึ่ง: เป็นนะญิส ต้องล้าง แต่เล็กน้อยได้รับการอนุโลม เป็นทัศนะของนักวิชาการส่วนใหญ่ หลายท่านรายงานว่ามีอิจญ์มาอ์ เช่น อิบนุหัซม์ อิบนุอับดิลบัรร์ อิบนุรุชด์ อันนะวะวีย์ และอัลอัยนีย์ และอิบนุตัยมียะฮ์ยกคำของอิมามอะห์มัดว่า \"มุสลิมไม่ได้ขัดแย้งกันในเรื่องเลือด\" คือว่าเป็นนะญิส", "พวกเขายังอ้างอายะฮ์ \"จงกล่าวเถิด ฉันไม่พบในสิ่งที่ถูกวะห์ยูแก่ฉันว่าเป็นที่ต้องห้ามแก่ผู้กิน นอกจากซากสัตว์ หรือเลือดที่ไหล หรือเนื้อสุกร เพราะมันเป็นริจส์\" (อัลอันอาม: 145) ริจส์ในที่นี้หมายถึงความสกปรกตามศาสนา คือนะญิส เพราะความสกปรกทางภาษาอย่างเดียวไม่ได้หมายถึงนะญิส และถ้อยคำของศาสนาต้องตีความตามความหมายทางศาสนา", "ทัศนะที่สอง: เลือดสะอาด ยกเว้นเลือดประจำเดือน เป็นทัศนะของอัชเชากานีย์ ตามด้วยศิดดีก หะซัน คาน อัลอัลบานีย์ และอิบนุอุษัยมีน หลักฐาน (1) หลักเดิมของสิ่งต่าง ๆ คือสะอาดจนกว่าจะมีหลักฐานว่าเป็นนะญิส และไม่มีหลักฐานให้ล้างเลือดอื่นนอกจากเลือดประจำเดือน ทั้งที่จำเป็นต้องอธิบาย เพราะผู้คนบาดเจ็บหรือเลือดกำเดาออกบ่อย โดยเฉพาะเศาะหาบะฮ์ที่ออกญิฮาดและบาดเจ็บมาก", "(2) เรื่องเศาะหาบะฮ์ที่ถูกมุชริกยิงธนูสามดอกขณะยืนละหมาดกลางคืน แต่เขายังละหมาดต่อทั้งที่เลือดไหล ในสงครามซาตุรริกออ์ (อบูดาวูด อะห์มัด อัลบุคอรีย์ยกไว้แบบไม่มีสาย ในเชิงอรรถระบุว่าสายรายงานอ่อน) (3) มีรายงานจากเศาะหาบะฮ์หลายรายงานที่แสดงว่าเลือดสะอาด เช่น อิบนุมัสอูดละหมาดทั้งที่มีมูลและเลือดจากอูฐที่เขาเชือดติดอยู่บนท้อง (สายรายงานศ่อฮีห์) อิบนุอุมัรบีบสิวบนหน้าจนเลือดออก แล้วขยี้ด้วยนิ้วและละหมาดโดยไม่อาบน้ำละหมาด และอับดุลลอฮ์ บินอบีเอาฟาบ้วนน้ำลายปนเลือดแล้วละหมาด", "ผู้แต่งเห็นว่าทัศนะที่ว่าเลือดสะอาดมีน้ำหนักในการพิจารณา และอายะฮ์ที่ฝ่ายแรกอ้างถูกแย้งได้สองทาง: (1) อายะฮ์ไม่ได้มาเพื่ออธิบายความสะอาดและนะญิส แต่อธิบายสิ่งที่ห้ามกิน และสิ่งที่หะรอมไม่จำเป็นต้องเป็นนะญิส เช่น ยาพิษสะอาดแต่หะรอม (2) ริจส์ในที่นี้อาจหมายถึงสิ่งชั่วร้ายที่ห้ามกิน ไม่ใช่นะญิส เพราะริจส์บางครั้งหมายถึงความสกปรกทางนามธรรม เช่น \"จงผินหน้าออกจากพวกเขา แท้จริงพวกเขาเป็นริจส์\" (อัตเตาบะฮ์: 95)", "จึงเหลือหลักฐานอิจญ์มาอ์ หากไม่ขัดกับรายงานจากเศาะหาบะฮ์ ซึ่งมีผู้รายงานอิจญ์มาอ์ไว้มาก ข้ออ้างว่านักวิชาการลอกการรายงานอิจญ์มาอ์ต่อกันมา ถูกตอบด้วยการที่อิจญ์มาอ์นี้พาดพิงถึงอิมามอะห์มัด ซึ่งเข้มงวดในการอ้างอิจญ์มาอ์ ส่วนรายงานจากเศาะหาบะฮ์อาจหมายถึงเลือดเพียงเล็กน้อยที่ได้รับการอนุโลม", "ผู้แต่งจึงสรุปว่า ทัศนะที่มีน้ำหนักคือให้ชำระเลือด เพราะเป็นความรอบคอบ ปลดภาระให้พ้น และระวังสิ่งคลุมเครือ \"ผู้ใดระวังสิ่งคลุมเครือ เขาได้รักษาศาสนาและเกียรติของเขาไว้\" ยกเว้นเลือดจากบาดแผลที่ไหลไม่หยุด เพราะหลีกเลี่ยงได้ยาก"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "ขั้นตอนชำระนะญิสที่แห้ง", "points_th": ["หะดีษเป็นหลักฐานว่าต้องทำความสะอาดเสื้อจากเลือดประจำเดือน โดยขูดเลือดแห้งด้วยเล็บ ไม้ หิน หรือสิ่งอื่น ให้ตัวเลือดหลุดออก แล้วขยี้ด้วยน้ำ แล้วล้างเพื่อให้นะญิสที่เหลือหมดไป การทำตามลำดับนี้เป็นวิธีที่ดีที่สุดในการขจัดนะญิสที่แห้ง"]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "ละหมาดในเสื้อผ้าที่สวมขณะมีประจำเดือน", "points_th": ["หะดีษแสดงว่าสตรีละหมาดในเสื้อผ้าที่สวมขณะมีประจำเดือนได้ เมื่อชำระแล้ว เพราะคำว่า \"แล้วละหมาดในนั้น\" ซึ่งบ่งว่าจะไม่ละหมาดในเสื้อผ้าที่เป็นนะญิส แต่ละหมาดในเสื้อผ้าที่สะอาด เป็นหลักฐานที่แข็งแรงที่สุดข้อหนึ่งว่า ต้องชำระเสื้อผ้าก่อนละหมาด"]}, {"wajh": 7, "type": "fiqh", "heading_ar": null, "heading_th": "ขจัดนะญิสด้วยสิ่งอื่นนอกจากน้ำ", "points_th": ["ผู้ที่เห็นว่าการขจัดนะญิสต้องใช้น้ำ และของเหลวอื่นใช้แทนไม่ได้ อ้างหะดีษนี้ เป็นทัศนะของชาฟิอีย์ มาลิกีย์ และทัศนะที่มีน้ำหนักในมัซฮับหันบะลีย์", "ผู้แต่งเห็นว่าที่ถูกต้องคือ ขจัดนะญิสด้วยสิ่งใดก็ได้ที่ขจัดได้ ทั้งน้ำและสิ่งอื่น เช่น น้ำส้มสายชู น้ำกุหลาบ เป็นทัศนะของหะนะฟีย์ อิบนุตัยมียะฮ์เลือกและปกป้องทัศนะนี้ เพราะเป้าหมายคือขจัดนะญิส และสิ่งอื่นก็ทำได้เช่นเดียวกับน้ำ", "ศาสนาเองก็ให้ใช้สิ่งอื่นนอกจากน้ำชำระนะญิส เช่นหะดีษอบูสะอีด: َثَرُهُ", "th": "สีของเลือดที่เหลืออยู่หลังล้างไม่เป็นอันตรายแก่เธอ"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อบูดาวูดบันทึกด้วยความหมายเดียวกันในหมวดฏอฮาเราะฮ์ บทสตรีซักเสื้อที่สวมขณะมีประจำเดือน (365) ผ่านกุตัยบะฮ์ บินสะอีด จากอิบนุละฮีอะฮ์ จากยะซีด บินอบีหะบีบ จากอีซา บินฏ็อลหะฮ์ จากอบูฮุร็อยเราะฮ์ หะดีษนี้อยู่ในสุนันฉบับที่อิบนุลอะอ์รอบีย์รายงานจากอบูดาวูด ไม่มีในฉบับของอัลลุอ์ลุอีย์ อัลมุนซิรีย์จึงไม่ได้ระบุไว้ในหนังสือย่อของเขา", "อะห์มัดบันทึกด้วยสายเดียวกัน และอัลบัยฮะกีย์บันทึกผ่านสายอับดุลลอฮ์ บินวะฮ์บ และอุษมาน บินศอลิห์ ทั้งสองจากอิบนุละฮีอะฮ์", "อิบนุหะญัรว่าอ่อน ดูเหมือนเพราะอิบนุละฮีอะฮ์ ซึ่งนักวิชาการหลายท่านวิจารณ์ เช่น อบูหาติม ยะห์ยา บินสะอีด อิบนุมะฮ์ดีย์ และวะกีอ์ อิบนุมะอีนว่า \"อ่อน ใช้เป็นหลักฐานไม่ได้\" อันนะสาอีย์ว่า \"ไม่น่าเชื่อถือ\" ความจำของเขาแย่ลงหลังจากหนังสือของเขาถูกไฟไหม้ แต่ถ้าผู้รายงานจากเขาเป็นหนึ่งในอับดุลลอฮ์ทั้งสาม (อิบนุวะฮ์บ อิบนุลมุบาร็อก และอัลมุกรีอ์) ก็ดีกว่าผู้อื่น ตามทัศนะของนักหะดีษกลุ่มหนึ่ง", "หะดีษนี้มาจากกุตัยบะฮ์ ซึ่งไม่ได้เขียนหะดีษของอิบนุละฮีอะฮ์ นอกจากจากหนังสือของอับดุลลอฮ์ บินวะฮ์บ แล้วค่อยฟังจากอิบนุละฮีอะฮ์ และอิบนุวะฮ์บฟังจากอิบนุละฮีอะฮ์ก่อนหนังสือถูกไฟไหม้ อีกทั้งมีสายของอิบนุวะฮ์บเองในรายงานของอัลบัยฮะกีย์ จึงอาจทำให้หะดีษแข็งแรงขึ้นตามทัศนะของผู้ที่รับรายงานของนักเรียนรุ่นแรกจากเขา แต่สำหรับผู้ที่ถือว่าเขาอ่อนโดยสิ้นเชิง รายงานของอับดุลลอฮ์ทั้งสามแม้จะดีกว่า ก็ยังไม่แข็งแรงพอจะใช้เป็นหลักฐาน อิบนุหิบบานสรุปว่า ต้องเลี่ยงรายงานของนักเรียนรุ่นแรก เพราะเขาตัดลีส (ปิดบังผู้รายงานที่อ่อนแอ) และต้องเลี่ยงรายงานของนักเรียนรุ่นหลัง เพราะปนสิ่งที่ไม่ใช่หะดีษของเขา", "ผู้แต่งเห็นว่า การพาดพิงหะดีษนี้ไปถึงอัตติรมิซีย์เป็นความพลาดของอิบนุหะญัร อัลมิซซีย์จึงระบุแค่อบูดาวูด ไม่ได้ระบุอัตติรมิซีย์ อิบนุลมุลักกินก็เช่นกัน และอิบนุหะญัรเองในฟัตหุลบารีย์และอัตตัลคีศก็ระบุแค่อบูดาวูด"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"เคาละฮ์\" คือเคาละฮ์ บินติยะสาร ตามรายงานของอบูดาวูดและคนอื่น อัฏเฏาะบะรอนีย์บันทึกหะดีษนี้และระบุว่าเป็นเคาละฮ์ บินติหะกีม อัลอันศอรียะฮ์ แต่สายนั้นอ่อน เพราะมาจากอัลวาซิอ์ บินนาฟิอ์ ผู้มีหะดีษมุงกัรและถูกทิ้ง", "\"รอยของมันไม่เป็นอันตรายแก่เธอ\" คือสีของเลือดที่เหลืออยู่หลังล้าง"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "อนุโลมรอยสีหลังจากล้างเต็มที่", "points_th": ["หะดีษเป็นหลักฐานว่า รอยสีของเลือดประจำเดือนที่เหลือหลังจากล้างอย่างเต็มที่แล้วได้รับการอนุโลม เพราะคำว่า \"รอยของมันไม่เป็นอันตรายแก่เธอ\" และอายะฮ์ \"ดังนั้นจงยำเกรงอัลลอฮ์ตามความสามารถของพวกเจ้า\" (อัตตะฆอบุน: 16) เพราะการล้างบางครั้งไม่ทำให้สีหมดไป และสีอย่างเดียวไม่ใช่สิ่งสกปรก สิ่งสกปรกคือตัวนะญิส ซึ่งหมดไปแล้ว สีที่เหลือจึงไม่มีผล", "แต่ต้องพยายามขจัดสีให้เต็มที่ นี่คือจุดประสงค์ที่อิบนุหะญัรนำหะดีษอบูฮุร็อยเราะฮ์มาต่อจากหะดีษอัสมาอ์ เพราะเลือดเป็นสิ่งน่ารังเกียจ และคนที่เห็นเลือดบนเสื้ออาจคิดว่าเจ้าของละเลยการล้าง"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "ใช้สารช่วยขจัดเลือดประจำเดือน", "points_th": ["ตามรูปคำของหะดีษ น้ำก็เพียงพอในการขจัดเลือดประจำเดือน ไม่ต้องใช้สารชะล้างอื่น เช่น หินหรือไม้ เพราะคำว่า \"น้ำก็เพียงพอสำหรับเธอ\"", "แต่ในหะดีษอุมมุก็อยส์ บินติมิห์ศ็อน ซึ่งถามท่านรสูลุลลอฮ์ ﷺ ถึงเลือดประจำเดือนที่เปื้อนเสื้อ ท่านตอบว่า \"จงขูดมัน... และล้างด้วยน้ำและใบพุทรา (ซิดร์)\" (อบูดาวูด อันนะสาอีย์ อิบนุมาญะฮ์ อิบนุลก็อฏฏอนว่าสายรายงานศ่อฮีห์อย่างยิ่ง) ใบพุทราเป็นสารช่วยขจัดชนิดหนึ่ง", "หะดีษอุมมุก็อยส์จึงจำกัดความหมายกว้างของหะดีษนี้ โดยกำหนดให้ใช้สารช่วยขจัดกับเลือดประจำเดือนโดยเฉพาะ และคำว่า \"รอยของมันไม่เป็นอันตรายแก่เธอ\" หมายถึงรอยที่เหลือหลังจากใช้สารช่วยขจัดแล้ว"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "หลักเกณฑ์การอนุโลมนะญิส", "points_th": ["การอนุโลมในเรื่องนะญิสแสดงว่าศาสนามุ่งผ่อนปรนแก่ผู้รับภาระและขจัดความยุ่งยาก ด้วยเหตุต่าง ๆ เช่น (1) เพราะเกิดบ่อย เช่น เลือดและหนองจากสิวและฝี หรือรอยที่เหลือจากการชำระด้วยหิน (อิสติจมาร) ที่ครบเงื่อนไข (2) เพราะหลีกเลี่ยงยาก เช่น ผู้มีฮะดัษต่อเนื่อง อย่างผู้มีปัสสาวะเล็ด หญิงที่มีเลือดเสีย (อิสติหาเฎาะฮ์) และผู้เป็นริดสีดวงหรือแผลชอนทวาร (3) เพราะขจัดยาก เช่น สีและกลิ่นของนะญิสที่เหลือหลังชำระ เมื่อขจัดยาก (4) เพราะปริมาณน้อย เช่น นะญิสเล็กน้อยที่แมลงวันพามาติดเสื้อหรือตัว หรือปัสสาวะเท่าปลายเข็มบนเสื้อ บางกรณีอาจมีเหตุผลหลายข้อซ้อนกัน", "หลักเกณฑ์เหล่านี้กำหนดว่านะญิสใดได้รับการอนุโลม หน้าที่ของผู้ศึกษาคือพิจารณาว่ากรณีที่อยู่ตรงหน้าเข้าข่ายหลักเกณฑ์ข้อใดหรือไม่"]}], "tags_th": ["เลือดประจำเดือน", "การอนุโลม", "นะญิส", "ใบพุทรา", "อิบนุละฮีอะฮ์"]}, {"id": "v1-h032", "volume": 1, "bab": "wudu", "topic_ar": "حكم السواك عند الوضوء", "topic_th": "หุก่มการแปรงฟันด้วยสิวากเมื่ออาบน้ำละหมาด", "pages": [138, 143], "hadith": [{"no": 32, "matn_ar": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ، عَنْ رَسُولِ اللهِ ﷺ قَالَ: «لَوْلَا أَنْ أَشُقَّ عَلَى أُمَّتِي لَأَمَرْتُهُمْ بِالسِّوَاكِ مَعَ كُلِّ وُضُوءٍ». أَخْرَجَهُ مَالِكٌ، وَأَحْمَدُ، وَالنَّسَائِيُّ، وَصَحَّحَهُ ابْنُ خُزَيْمَةَ، وَذَكَرَهُ الْبُخَارِيُّ تَعْلِيقًا.", "translation_th": "จากอบูฮุร็อยเราะฮ์ (ร.ฎ.) จากท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"หากไม่เป็นการลำบากแก่ประชาชาติของฉัน ฉันจะสั่งให้พวกเขาแปรงฟันด้วยสิวากทุกครั้งที่อาบน้ำละหมาด\" บันทึกโดยมาลิก อะห์มัด และอันนะสาอีย์ อิบนุคุซัยมะฮ์ระบุว่าศ่อฮีห์ และอัลบุคอรีย์ยกไว้แบบไม่มีสายรายงาน (ตะอ์ลีก)", "grade_th": "ศ่อฮีห์ (สายรายงานตามเงื่อนไขของอัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["การแปรงฟันด้วยสิวากเป็นสุนัต ไม่ใช่วาญิบ ตามทัศนะของนักวิชาการส่วนใหญ่ บางท่านอ้างว่าเป็นอิจญ์มาอ์", "ส่งเสริมให้แปรงฟันทุกครั้งที่อาบน้ำละหมาด และทุกครั้งที่ละหมาด ทั้งฟัรฎูและสุนัต แม้ผู้ถือศีลอดหลังตะวันคล้อย", "ผู้แต่งเห็นว่าตามแนวทางของท่านนบี ﷺ ที่ชัดกว่าคือ แปรงฟันก่อนเริ่มอาบน้ำละหมาด เพราะไม่มีรายงานว่าท่านแปรงฟันระหว่างบ้วนปาก", "คำสั่งที่ไม่มีเงื่อนไขในศาสนาโดยหลักแล้วหมายถึงวาญิบ"], "vocab": [{"ar": "لَوْلَا", "th": "หากไม่มี... (คำที่บอกว่าสิ่งหนึ่งไม่เกิดเพราะมีอีกสิ่งหนึ่ง) ในที่นี้ ท่านนบี ﷺ ไม่ได้บังคับเพราะจะเป็นการลำบาก"}, {"ar": "أُمَّتِي", "th": "ประชาชาติของฉัน หมายถึงผู้ที่ศรัทธาและปฏิบัติตาม (อุมมะตุลอิญาบะฮ์) ไม่ใช่ทุกคนที่อยู่หลังการเป็นนบี (อุมมะตุดดะอ์วะฮ์)"}, {"ar": "لَأَمَرْتُهُمْ", "th": "ฉันจะบังคับพวกเขา คำสั่งในที่นี้คือการบังคับ เพราะความลำบากเกิดจากการบังคับเท่านั้น"}, {"ar": "السِّوَاك", "th": "อ่านสระอิ ไม้ที่ใช้แปรงฟัน เช่น จากต้นอะรอก หรือหมายถึงการแปรงฟัน คือขัดปากด้วยไม้เพื่อทำความสะอาดฟัน ลิ้น และเหงือก มาจาก السَّوْك คือการขัดถู"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["มาลิกบันทึกในอัลมุวัฏเฏาะอ์ แบบเมากูฟ (เป็นคำของอบูฮุร็อยเราะฮ์) ผ่านอิบนุชิฮาบ จากหุมัยด์ บินอับดิรเราะห์มาน ว่า \"หากไม่เป็นการลำบากแก่ประชาชาติของเขา เขาจะสั่งให้พวกเขาแปรงฟันทุกครั้งที่อาบน้ำละหมาด\" อิบนุอับดิลบัรร์ว่า หะดีษนี้ถือเป็นมัรฟูอ์ (มาถึงท่านนบี ﷺ) เพราะมีสายต่อเนื่องจากทางอื่น และถ้อยคำ \"เขาจะสั่ง\" ก็บ่งเช่นนั้น", "อะห์มัด อันนะสาอีย์ในอัสสุนันอัลกุบรอ และอิบนุคุซัยมะฮ์บันทึกแบบมัรฟูอ์ ผ่านสายมาลิก จากอิบนุชิฮาบ จากหุมัยด์ จากอบูฮุร็อยเราะฮ์ ดังในบุลูฆ สายรายงานศ่อฮีห์ตามเงื่อนไขของอัลบุคอรีย์และมุสลิม และอัลบุคอรีย์ยกไว้แบบไม่มีสายด้วยถ้อยคำที่ยืนยัน ในหมวดการถือศีลอด สำนวน \"ทุกครั้งที่อาบน้ำละหมาด\" (อินดะ)", "มาลิก อัลบุคอรีย์ (887) และอันนะสาอีย์บันทึกผ่านอบุซซินาด จากอัลอะอ์รอจญ์ จากอบูฮุร็อยเราะฮ์แบบมัรฟูอ์ สำนวน \"ทุกครั้งที่ละหมาด\" และมุสลิม (252) ผ่านอิบนุอุยัยนะฮ์ จากอบุซซินาด ใกล้เคียงกัน หะดีษนี้มีหลายสายในเศาะฮีห์ มุสนัด และสุนัน", "อัตติรมิซีย์ระบุว่าหะดีษเรื่องสิวากรายงานโดยเศาะหาบะฮ์ราวสิบเจ็ดคน เช่น อบูบักร์ อะลี อิบนุอับบาส อิบนุอุมัร อาอิชะฮ์ และหุซัยฟะฮ์ นักวิชาการระบุว่าหะดีษเรื่องการแปรงฟันและการส่งเสริมให้ทำถึงขั้นมุตะวาติร อัลกัตตานีย์นับเศาะหาบะฮ์ที่รายงานได้สามสิบเอ็ดคน"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"หากไม่\" (เลาลา) บ่งว่าสิ่งหนึ่งไม่เกิดเพราะมีอีกสิ่งหนึ่ง ในหะดีษนี้ ท่านนบี ﷺ ไม่ได้บังคับประชาชาติให้แปรงฟันทุกครั้งที่อาบน้ำละหมาด เพราะจะเป็นการลำบากแก่พวกเขา", "\"ประชาชาติของฉัน\" หมายถึงผู้ที่ศรัทธาและปฏิบัติตาม เพราะพวกเขาคือผู้ที่ทำตามคำสั่งและละเว้นข้อห้าม ไม่ใช่ทุกคนที่มีชีวิตอยู่หลังการเป็นนบีของท่าน", "\"ฉันจะสั่งพวกเขา\" หมายถึงบังคับ เพราะความลำบากเกิดขึ้นเฉพาะกับคำสั่งที่บังคับ ส่วนคำสั่งที่ไม่บังคับ (สุนัต) ไม่มีความลำบาก เพราะละได้ ในรายงานของอันนะสาอีย์ว่า \"ฉันจะกำหนดให้การแปรงฟันเป็นฟัรฎูแก่พวกเขาทุกครั้งที่อาบน้ำละหมาด\"", "\"สิวาก\" อ่านสระอิ คือชื่อไม้ที่ใช้แปรงฟัน จากต้นอะรอกหรืออื่น ๆ หรือหมายถึงการกระทำ คือขัดปากด้วยไม้เพื่อทำความสะอาดฟัน ลิ้น และเหงือก ในหะดีษนี้หมายถึงการกระทำ การแปรงฟันมีประโยชน์มากมาย ซึ่งอิบนุลมุลักกินรวบรวมไว้", "\"ทุกครั้งที่อาบน้ำละหมาด\" ในอีกรายงานว่า \"เมื่ออาบน้ำละหมาดทุกครั้ง\" ความหมายเดียวกัน คือในเวลาที่อาบน้ำละหมาด อาจหมายถึงก่อนเริ่มอาบ แล้วจึงอาบต่อทันที หรือระหว่างอาบ คือตอนบ้วนปาก"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "สิวากเป็นสุนัต ไม่ใช่วาญิบ", "points_th": ["หะดีษเป็นหลักฐานว่าคำสั่งให้แปรงฟันเป็นสุนัต ไม่ใช่วาญิบ เพราะคำว่า \"หากไม่\" บ่งว่าความเป็นวาญิบถูกกันไว้เพราะมีความลำบาก ถ้าเป็นวาญิบ ท่านคงสั่งไม่ว่าจะลำบากหรือไม่", "นี่คือทัศนะของนักวิชาการส่วนใหญ่ บางท่านอ้างว่าเป็นอิจญ์มาอ์ มีรายงานว่าดาวูด อัซซอฮิรีย์และอิสหาก บินรอฮะวัยฮ์เห็นว่าเป็นวาญิบเพราะมีคำสั่ง แต่อันนะวะวีย์กล่าวว่า รายงานจากอิสหากไม่เป็นที่รู้จักและไม่ถูกต้อง การพาดพิงถึงดาวูดก็เช่นกัน และอิบนุหัซม์ อัซซอฮิรีย์ก็ระบุว่าการแปรงฟันเป็นสุนัต"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "แปรงฟันก่อนหรือระหว่างอาบน้ำละหมาด", "points_th": ["หะดีษเป็นหลักฐานว่าส่งเสริมให้แปรงฟันเมื่ออาบน้ำละหมาด นี่คือจุดประสงค์ที่อิบนุหะญัรเปิดบทวุฎูอ์ด้วยหะดีษนี้ และเลือกสำนวน \"ทุกครั้งที่อาบน้ำละหมาด\" ทั้งที่สำนวน \"ทุกครั้งที่ละหมาด\" อยู่ในเศาะฮีหัยน์ อัตติรมิซีย์ก็ทำเช่นนี้ และนักนิติศาสตร์หลายท่านนับการแปรงฟันเป็นหนึ่งในสุนัตของการอาบน้ำละหมาด", "หะดีษไม่ได้ระบุว่าแปรงฟันตอนไหนของการอาบน้ำละหมาด นักวิชาการจึงมีสองทัศนะ (1) ก่อนเริ่มอาบ แปรงฟันแล้วอาบน้ำละหมาด เป็นทัศนะของนักวิชาการบางส่วนจากหะนะฟีย์ มาลิกีย์ และชาฟิอีย์ โดยยึดสำนวน \"เมื่ออาบน้ำละหมาดทุกครั้ง\" (2) ระหว่างอาบ ตอนบ้วนปาก เป็นทัศนะของนักวิชาการส่วนใหญ่ โดยยึดสำนวน \"พร้อมกับ (มะอะ) การอาบน้ำละหมาดทุกครั้ง\" เพราะคำว่า \"พร้อมกับ\" บ่งถึงการอยู่ด้วยกัน", "ผู้แต่งเห็นว่าทั้งสองทัศนะมีเหตุผล แต่จากการศึกษาแนวทางของท่านนบี ﷺ ทัศนะที่ชัดกว่าคือ แปรงฟันก่อนอาบน้ำละหมาด เพราะไม่มีรายงานว่าท่านแปรงฟันระหว่างบ้วนปาก และในหะดีษอิบนุอับบาส (มุสลิม) ที่ค้างคืนบ้านมัยมูนะฮ์และเล่าถึงการละหมาดกลางคืนของท่านนบี ﷺ มีว่า \"ท่านตื่นขึ้น แปรงฟัน แล้วอาบน้ำละหมาด\""]}, {"wajh": 5, "type": "fawaid", "heading_ar": null, "heading_th": "วิทยปัญญาของการแปรงฟันก่อนบ้วนปาก", "points_th": ["ผู้แต่งอ้างถึงดร.อับดุลลอฮ์ อัสสะอีด ว่า วิทยปัญญาของคำสั่งให้แปรงฟันทุกครั้งที่อาบน้ำละหมาด คือ ไม้สิวากไม่ได้ขจัดเศษอาหาร คราบเมือกน้ำลาย หรือหินปูนออกไปทั้งหมด แต่ทำให้มันหลุดจากที่ติด โดยเฉพาะตามซอกฟันและร่องบนผิวฟัน การบ้วนปากจึงเป็นวิธีขับสิ่งที่หลุดออกมาแล้วออกไป", "เขายังยกคำของทันตแพทย์ชาวตะวันตกว่า ผู้ป่วยต้องรู้ว่าการแปรงฟันทำให้เศษอาหารหลุด แต่ไม่ได้ขจัดออกไป การบ้วนปากจึงจำเป็นและสำคัญ"]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "แปรงฟันทุกครั้งที่ละหมาด", "points_th": ["สำนวนในเศาะฮีหัยน์ \"ทุกครั้งที่ละหมาด\" เป็นหลักฐานว่าการแปรงฟันเมื่อจะละหมาดเป็นสุนัตที่หนักแน่น ทั้งละหมาดฟัรฎูและสุนัต แม้กระทั่งการละหมาดของผู้ถือศีลอดหลังตะวันคล้อย เช่น ซุฮ์รีและอัศรี", "เพราะละหมาดคือการเชื่อมสัมพันธ์ระหว่างบ่าวกับพระผู้อภิบาล บ่าวจึงควรอยู่ในสภาพที่ดีที่สุด เพื่อแสดงเกียรติของอิบาดะฮ์ ด้วยเหตุนี้ความสะอาดจึงเป็นเงื่อนไขของการละหมาด และส่วนหนึ่งของความสะอาดที่สมบูรณ์คือ ทำความสะอาดปากจากสิ่งสกปรกที่อาจมีกลิ่นไม่ดี", "ท่านนบี ﷺ กล่าวถึงประโยชน์ใหญ่สองประการของการแปรงฟัน: \"สิวากทำให้ปากสะอาด และเป็นที่พอพระทัยของพระผู้อภิบาล\" (อันนะสาอีย์ อะห์มัด และอัลบุคอรีย์ยกไว้แบบไม่มีสาย จากหะดีษอาอิชะฮ์ สายรายงานหะซัน)"]}, {"wajh": 7, "type": "fiqh", "heading_ar": null, "heading_th": "สุนัตทั้งเมื่ออาบน้ำละหมาดและเมื่อละหมาด", "points_th": ["จากที่กล่าวมา การแปรงฟันเป็นสุนัตทั้งเมื่ออาบน้ำละหมาดและเมื่อจะละหมาด ซุนนะฮ์ระบุชัดทั้งสองกรณี อัลอัยนีย์ประสานสองสำนวนว่า การแปรงฟันขณะอาบน้ำละหมาดก็เพื่อการละหมาด เพราะวุฎูอ์มีไว้เพื่อละหมาด", "ดูเหมือนว่าหะนะฟีย์ไม่ได้ถือว่าแปรงฟันเมื่อจะละหมาด และตีความหะดีษว่า \"ทุกครั้งที่อาบน้ำละหมาดเพื่อละหมาด\" พวกเขาให้เหตุผลว่า การแปรงฟันเป็นการขจัดสิ่งสกปรก ซึ่งไม่ควรทำในมัสยิด และอาจทำให้เหงือกเป็นแผลเลือดออก ซึ่งตามทัศนะของพวกเขาทำให้วุฎูอ์เสีย", "ผู้แต่งเห็นว่าที่ถูกต้องคือปฏิบัติตามซุนนะฮ์ การแปรงฟันเป็นสุนัตทั้งเมื่ออาบน้ำละหมาดและเมื่อลุกไปละหมาด ชัมสุลหักก์ อะซีมอาบาดีย์ได้แย้งหะนะฟีย์บางท่านว่า หะดีษไม่ต้องตีความเพิ่มเติม และซุนนะฮ์ระบุชัดเรื่องการแปรงฟันเมื่อจะละหมาด และอิบนุลฮุมาม (หะนะฟีย์) เองก็นับการลุกไปละหมาดและการอาบน้ำละหมาดเป็นเวลาที่ส่งเสริมให้แปรงฟัน"]}, {"wajh": 8, "type": "fawaid", "heading_ar": null, "heading_th": "คำสั่งที่ไม่มีเงื่อนไขหมายถึงวาญิบ", "points_th": ["หะดีษนี้เป็นหลักฐานหนึ่งของนักอุศูลว่า คำสั่งที่ไม่มีเงื่อนไขหมายถึงวาญิบ เพราะคำว่า \"หากไม่\" บ่งว่าคำสั่งให้แปรงฟันไม่ได้เกิดขึ้นเพราะจะลำบากแก่ประชาชาติ ทั้งที่การแปรงฟันเป็นสุนัตอยู่แล้ว แสดงว่าคำสั่ง (ที่ถูกกันไว้) ไม่ได้หมายถึงสุนัต แต่หมายถึงสิ่งที่มีความลำบาก คือวาญิบ"]}], "tags_th": ["สิวาก", "แปรงฟัน", "วุฎูอ์", "สุนัต", "ละหมาด"]}, {"id": "v1-h033", "volume": 1, "bab": "wudu", "topic_ar": "كيفية وضوء النبي ﷺ", "topic_th": "วิธีอาบน้ำละหมาดของท่านนบี ﷺ", "pages": [144, 151], "hadith": [{"no": 33, "matn_ar": "عَنْ حُمْرَانَ: أَنَّ عُثْمَانَ رَضِيَ اللهُ عَنْهُ دَعَا بِوَضُوءٍ، فَغَسَلَ كَفَّيْهِ ثَلَاثَ مَرَّاتٍ، ثُمَّ مَضْمَضَ، وَاسْتَنْشَقَ، وَاسْتَنْثَرَ، ثُمَّ غَسَلَ وَجْهَهُ ثَلَاثَ مَرَّاتٍ، ثُمَّ غَسَلَ يَدَهُ الْيُمْنَى إِلَى الْمِرْفَقِ ثَلَاثَ مَرَّاتٍ، ثُمَّ الْيُسْرَى مِثْلَ ذَلِكَ، ثُمَّ مَسَحَ بِرَأْسِهِ، ثُمَّ غَسَلَ رِجْلَهُ الْيُمْنَى إِلَى الْكَعْبَيْنِ ثَلَاثَ مَرَّاتٍ، ثُمَّ الْيُسْرَى مِثْلَ ذَلِكَ، ثُمَّ قَالَ: رَأَيْتُ رَسُولَ اللهِ ﷺ تَوَضَّأَ نَحْوَ وُضُوئِي هَذَا. مُتَّفَقٌ عَلَيْهِ.", "translation_th": "จากหุมรอนว่า อุษมาน (ร.ฎ.) ขอน้ำสำหรับอาบน้ำละหมาด แล้วล้างฝ่ามือทั้งสองสามครั้ง แล้วบ้วนปาก สูดน้ำเข้าจมูก และสั่งน้ำออกจากจมูก แล้วล้างหน้าสามครั้ง แล้วล้างมือขวาถึงข้อศอกสามครั้ง แล้วมือซ้ายเช่นเดียวกัน แล้วเช็ดศีรษะ แล้วล้างเท้าขวาถึงตาตุ่มทั้งสองสามครั้ง แล้วเท้าซ้ายเช่นเดียวกัน แล้วกล่าวว่า ฉันเห็นท่านรสูลุลลอฮ์ ﷺ อาบน้ำละหมาดเหมือนกับการอาบน้ำละหมาดของฉันนี้ บันทึกโดยอัลบุคอรีย์และมุสลิม", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["วิธีอาบน้ำละหมาดที่สมบูรณ์: ล้างฝ่ามือสามครั้ง บ้วนปาก สูดน้ำเข้าและสั่งออกจากจมูก ล้างหน้าสามครั้ง ล้างมือขวาพร้อมข้อศอกสามครั้งแล้วมือซ้าย เช็ดศีรษะ ล้างเท้าขวาถึงตาตุ่มสามครั้งแล้วเท้าซ้าย", "ล้างฝ่ามือก่อนอาบน้ำละหมาดเป็นสุนัต (เมื่อไม่ได้ตื่นจากนอน) และข้อศอกกับตาตุ่มรวมอยู่ในส่วนที่ต้องล้าง", "ล้างอวัยวะสามครั้งเป็นสุนัต ครั้งเดียวก็ใช้ได้ และล้างบางส่วนมากกว่าบางส่วนก็ได้ แต่ห้ามเกินสามครั้ง", "ผู้ที่อาบน้ำละหมาดแบบนี้แล้วละหมาดสองร็อกอะฮ์ โดยไม่ปล่อยใจคิดเรื่องอื่น จะได้รับการอภัยบาปที่ผ่านมา (บาปเล็กตามทัศนะของนักวิชาการส่วนใหญ่)", "ขอให้ผู้อื่นช่วยเตรียมหรือเทน้ำสำหรับอาบน้ำละหมาดได้"], "vocab": [{"ar": "وَضُوء", "th": "อ่านสระอะที่วาว คือน้ำที่ใช้อาบน้ำละหมาด ส่วน وُضُوء (สระอุ) คือการอาบน้ำละหมาด"}, {"ar": "كَفَّيْه", "th": "ฝ่ามือทั้งสอง คือฝ่ามือพร้อมนิ้ว ถึงข้อมือ"}, {"ar": "مَضْمَضَ", "th": "บ้วนปาก คือหมุนน้ำในปาก"}, {"ar": "اسْتَنْشَقَ / اسْتَنْثَرَ", "th": "สูดน้ำเข้าไปในจมูกด้วยลมหายใจ / สั่งน้ำออกจากจมูก"}, {"ar": "الْوَجْه", "th": "ใบหน้า ความยาวจากแนวไรผมปกติถึงส่วนที่ห้อยลงของเคราและคาง ความกว้างจากหูถึงหู"}, {"ar": "الْمِرْفَق", "th": "ข้อศอก ข้อต่อระหว่างต้นแขนกับแขนท่อนล่าง"}, {"ar": "الْكَعْبَان", "th": "ตาตุ่มทั้งสอง กระดูกที่นูนออกมาทั้งสองข้างตรงข้อเท้า"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة راوييه", "heading_th": "ชีวประวัติผู้รายงานทั้งสอง", "points_th": ["หุมรอน บินอะบาน บินคอลิด ตาบิอีน (ผู้ทันเศาะหาบะฮ์) ที่เชื่อถือได้ ถูกจับเป็นเชลยที่อัยนุตตัมร์ อุษมานปลดปล่อยเขา ต่อมาย้ายไปบัศเราะฮ์ และเสียชีวิตที่นั่นปี ฮ.ศ. 75", "อุษมาน บินอัฟฟาน บินอบิลอาศ บินอุมัยยะฮ์ อัลกุร็อชีย์ อัลอุมะวีย์ อะมีรุลมุอ์มินีน เคาะลีฟะฮ์คนที่สามของมุสลิม เข้ารับอิสลามแต่เนิ่น ๆ ผ่านอบูบักร์ และอพยพทั้งสองครั้ง", "เขาแต่งงานกับรุก็อยยะฮ์ บุตรีของท่านนบี ﷺ เมื่อนางเสียชีวิต ท่านนบี ﷺ ให้แต่งงานกับอุมมุกุลษูม น้องสาวของนาง เขาจึงได้ฉายาว่า \"ซุนนูร็อยน์\" (เจ้าของสองแสงสว่าง) ท่านนบี ﷺ แจ้งข่าวดีว่าเขาจะได้เข้าสวรรค์ และยืนยันว่าเขาจะตายชะฮีด", "ในบัยอะตุรริฎวาน ท่านนบี ﷺ ให้สัตยาบันแทนเขา เพราะท่านส่งเขาไปมักกะฮ์ แล้วมีข่าวลือว่าเขาถูกสังหาร ท่านจึงเอามือข้างหนึ่งตีลงบนอีกข้างหนึ่ง และกล่าวว่า \"นี่สำหรับอุษมาน\"", "เขาเป็นเคาะลีฟะฮ์ต่อจากอุมัร ด้วยการให้สัตยาบันของคณะชูรอ ในวันแรกของเดือนมุหัรร็อม ปี ฮ.ศ. 24 และถูกสังหารเป็นชะฮีดในวันศุกร์ ที่ 18 ซุลหิจญะฮ์ หลังอัศริ ฝังในคืนวันเสาร์ ปี ฮ.ศ. 35 หลุมศพของเขาอยู่ที่อัลบะกีอ์"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกในหมวดวุฎูอ์ บทการอาบน้ำละหมาดสามครั้ง (159) และมุสลิมในหมวดฏอฮาเราะฮ์ (226) ผ่านสายอิบรอฮีม บินสะอ์ด์ จากอิบนุชิฮาบ จากอะฏออ์ บินยะซีด อัลลัยษีย์ จากหุมรอน", "สำนวนในบุลูฆเป็นของมุสลิม ตอนท้ายมีว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"ผู้ใดอาบน้ำละหมาดเหมือนการอาบน้ำละหมาดของฉันนี้ แล้วลุกขึ้นละหมาดสองร็อกอะฮ์ โดยไม่พูดกับตัวเองในขณะนั้น เขาจะได้รับการอภัยบาปที่ผ่านมา\" อิบนุชิฮาบกล่าวว่า \"นักวิชาการของเราเคยกล่าวว่า นี่คือการอาบน้ำละหมาดที่สมบูรณ์ที่สุดที่คนจะอาบเพื่อละหมาด\"", "หะดีษนี้มีหลายสายและหลายสำนวน มีผู้รายงานจากอิบนุชิฮาบอีกหลายคน ในเศาะฮีหัยน์ สุนัน และมุสนัด"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ขอวะฎูอ์\" อ่านสระอะที่วาว คือน้ำสำหรับอาบน้ำละหมาด \"ฝ่ามือ\" คือฝ่ามือพร้อมนิ้ว ถึงข้อมือ ได้ชื่อ \"กัฟฟ์\" เพราะมันกันสิ่งที่เป็นอันตรายจากร่างกาย", "\"บ้วนปาก\" คือหมุนน้ำในปาก \"สูดน้ำเข้าจมูก\" คือดึงน้ำด้วยลมหายใจเข้าไปในจมูก \"สั่งออก\" คือเอาน้ำออกจากจมูก ในสายของหะดีษนี้ในเศาะฮีหัยน์ไม่ได้ระบุจำนวนครั้งของการบ้วนปากและสูดน้ำ แต่มีในรายงานของอบูดาวูดสองสายจากหะดีษอุษมาน และในหะดีษอบูฮุร็อยเราะฮ์และอะลี", "\"ใบหน้า\" มาจากคำว่าเผชิญหน้า ความยาวจากแนวไรผมปกติถึงส่วนที่ห้อยลงของเคราและคาง ความกว้างจากหูถึงหู", "\"ถึงข้อศอก\" คำว่า \"ถึง\" (อิลา) บ่งถึงขอบเขต และโดยทั่วไปขอบเขตไม่รวมอยู่ด้วย เช่น \"แล้วจงถือศีลอดให้ครบจนถึงกลางคืน\" (อัลบะเกาะเราะฮ์: 187) เว้นแต่มีหลักฐานว่ารวม ซึ่งในอายะฮ์ \"(ล้างมือ) ถึงข้อศอก\" ซุนนะฮ์แสดงว่าข้อศอกรวมอยู่ด้วย คือหะดีษอบูฮุร็อยเราะฮ์ (มุสลิม) ที่ล้างมือจนถึงต้นแขน และล้างเท้าจนถึงหน้าแข้ง แล้วกล่าวว่า \"อย่างนี้แหละที่ฉันเห็นท่านรสูลุลลอฮ์ ﷺ อาบน้ำละหมาด\"", "\"เช็ดศีรษะ\" คือลูบมือที่เปียกน้ำบนศีรษะ ขอบเขตศีรษะคือแนวไรผมจากด้านข้างของใบหน้าถึงต้นคอ \"ถึงตาตุ่มทั้งสอง\" ตาตุ่มคือกระดูกนูนสองข้างที่ข้อเท้า และ \"ถึง\" ในที่นี้หมายถึง \"พร้อมกับ\" ตามหะดีษอบูฮุร็อยเราะฮ์", "\"เหมือนกับการอาบน้ำละหมาดของฉันนี้\" ในรายงานของอบูดาวูดใช้คำว่า \"มิษล์\" (เหมือน) แต่ในเศาะฮีหัยน์ใช้ \"นะห์วะ\" (คล้าย) เพราะการเหมือนท่านนบี ﷺ อย่างแท้จริงไม่มีใครทำได้ แต่เมื่อมีรายงานว่า \"มิษล์\" คำว่า \"นะห์วะ\" อาจเป็นถ้อยคำของผู้รายงาน เพราะใช้ในความหมาย \"เหมือน\" ได้ หรือให้ยึดตามที่อยู่ในเศาะฮีหัยน์"]}, {"wajh": 4, "type": "fawaid", "heading_ar": null, "heading_th": "ความใส่ใจของอุษมานในการสอน", "points_th": ["หะดีษแสดงความประเสริฐของอุษมาน (ร.ฎ.) และความใส่ใจในการสอน การเผยแผ่ซุนนะฮ์ และความหวังดีต่อประชาชาติ ผู้รู้และนักศึกษาจึงควรเผยแผ่ซุนนะฮ์แก่ผู้คน ไม่พอใจเพียงเพราะมันชัดเจนหรือผู้คนรู้คร่าว ๆ อยู่แล้ว อุษมานอธิบายการอาบน้ำละหมาดของท่านนบี ﷺ ด้วยการทำให้ดู ทั้งที่เป็นเรื่องที่รู้กันดี โดยเฉพาะในยุคแรก"]}, {"wajh": 5, "type": "fawaid", "heading_ar": null, "heading_th": "หะดีษหลักเรื่องวิธีอาบน้ำละหมาด", "points_th": ["หะดีษนี้เป็นหนึ่งในหะดีษที่อธิบายการอาบน้ำละหมาดของท่านนบี ﷺ อย่างสมบูรณ์ อิบนุลมุลักกินกล่าวว่า \"เป็นหลักสำคัญในเรื่องวิธีอาบน้ำละหมาด\" อิบนุหะญัรจึงทำให้หะดีษนี้เป็นหลัก และหะดีษหลังจากนั้นเป็นส่วนเติมเต็ม", "ผู้แต่งจะกล่าวถึงประโยชน์ของหะดีษนี้ ยกเว้นประเด็นที่มีหะดีษเฉพาะมาภายหลัง ซึ่งจะอธิบายในที่ของมัน"]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "ขอให้ผู้อื่นช่วยเรื่องน้ำอาบน้ำละหมาด", "points_th": ["อนุญาตให้ขอให้ผู้อื่นช่วยนำน้ำสำหรับอาบน้ำละหมาดมาให้ เพราะหุมรอนกล่าวว่า \"อุษมานขอน้ำมา\" อิบนุลมุลักกินรายงานว่ามีอิจญ์มาอ์ว่าทำได้โดยไม่มักรูฮ์", "รวมถึงการเทน้ำให้ผู้ที่อาบน้ำละหมาดด้วย ตามหะดีษอัลมุฆีเราะฮ์ บินชุอ์บะฮ์ (มุสลิม): \"คืนหนึ่งฉันอยู่กับท่านรสูลุลลอฮ์ ﷺ ท่านลงไปทำธุระ แล้วกลับมา ฉันเทน้ำให้ท่านจากภาชนะที่ฉันถือมา ท่านอาบน้ำละหมาดและเช็ดรองเท้าหุ้มข้อ\""]}, {"wajh": 7, "type": "fawaid", "heading_ar": null, "heading_th": "สอนด้วยการทำให้ดู", "points_th": ["อุษมานเลือกอธิบายวิธีอาบน้ำละหมาดของท่านนบี ﷺ ด้วยการกระทำ ไม่ใช่คำพูด เพราะการทำให้ดูเข้าใจได้เร็วกว่า เห็นภาพชัดกว่า และจำได้แม่นกว่า ส่วนคำพูดขึ้นอยู่กับถ้อยคำ ซึ่งอาจตีความได้หลายทาง", "ผู้สอนจึงควรเลือกวิธีที่ใกล้ที่สุดในการส่งความรู้ถึงผู้เรียน โดยเฉพาะสื่อประกอบที่ช่วยให้เข้าใจและจดจำได้ดี"]}, {"wajh": 8, "type": "fiqh", "heading_ar": null, "heading_th": "วิธีอาบน้ำละหมาดของท่านนบี ﷺ", "points_th": ["หะดีษแสดงวิธีอาบน้ำละหมาดตามแบบนี้ คือ ล้างฝ่ามือสามครั้ง บ้วนปาก สูดน้ำเข้าและสั่งออกจากจมูก ล้างหน้าสามครั้ง ล้างมือขวาพร้อมข้อศอกสามครั้ง แล้วมือซ้ายเช่นกัน เช็ดศีรษะ ล้างเท้าขวาถึงตาตุ่มสามครั้ง แล้วเท้าซ้ายเช่นกัน นี่คือวิธีอาบน้ำละหมาดของท่านนบี ﷺ"]}, {"wajh": 9, "type": "fiqh", "heading_ar": null, "heading_th": "ล้างฝ่ามือก่อนอาบน้ำละหมาด", "points_th": ["การล้างฝ่ามือสามครั้งเป็นสุนัต เพราะมีรายงานเพียงการกระทำ ดังในหะดีษนี้ หะดีษอับดุลลอฮ์ บินซัยด์ (อัลบุคอรีย์ มุสลิม) หะดีษอะลี (ผู้บันทึกสุนัน) และหะดีษอบูฮุร็อยเราะฮ์ (อัฏเฏาะบะรอนีย์ในอัลเอาสัฏ อัลฮัยษะมีย์ว่าผู้รายงานเป็นผู้รายงานของเศาะฮีห์)", "ไม่ใช่วาญิบ เพราะอัลลอฮ์ทรงกล่าวถึงวุฎูอ์ในอายะฮ์อัลมาอิดะฮ์ โดยเริ่มที่การล้างหน้า ไม่ได้กล่าวถึงการล้างฝ่ามือ อิบนุกุดามะฮ์กล่าวว่า \"การล้างฝ่ามือไม่ใช่วาญิบ ถ้าไม่ได้ตื่นจากนอน โดยไม่มีข้อขัดแย้งที่เรารู้\" วิทยปัญญาคือ มือเป็นเครื่องมือในการล้าง ใช้ตักน้ำและถูอวัยวะ จึงเหมาะที่จะทำความสะอาดก่อน", "นี่คือกรณีที่ไม่ได้ตื่นจากนอน ส่วนการล้างมือหลังตื่นนอนจะกล่าวในหะดีษที่ 37 ตามรูปคำของหะดีษ การล้างฝ่ามือทั้งสองทำพร้อมกันด้วยน้ำครั้งเดียว ในรายงานของมุสลิมว่า \"เขาเทน้ำลงบนฝ่ามือทั้งสองสามครั้งแล้วล้าง\""]}, {"wajh": 10, "type": "fiqh", "heading_ar": null, "heading_th": "ล้างสามครั้ง และล้างไม่เท่ากันได้", "points_th": ["หะดีษแสดงว่าส่งเสริมให้ทำสามครั้งในการบ้วนปาก สูดน้ำเข้าจมูก ล้างหน้า ล้างมือ และล้างเท้า อัลบุคอรีย์ตั้งชื่อบทของหะดีษนี้ว่า \"บทการอาบน้ำละหมาดสามครั้ง ๆ\"", "อนุญาตให้ล้างอวัยวะบางส่วนมากกว่าบางส่วนได้ เช่น บางส่วนครั้งเดียว บางส่วนสองครั้ง
