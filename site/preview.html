 (มือ) แล้วเริ่มอ่านอัลกุรอาน พวกเขาทักท้วง อะลีกล่าวว่า ท่านรสูลุลลอฮ์ ﷺ ออกจากห้องสุขาแล้วสอนเราอ่านอัลกุรอาน และกินเนื้อกับเรา และไม่มีสิ่งใดกั้นท่านจากอัลกุรอาน นอกจากญะนาบะฮ์\" นี่เป็นสำนวนของอบูดาวูด", "หะดีษนี้ขึ้นอยู่กับอับดุลลอฮ์ บินสะลิมะฮ์ (กัสเราะฮ์ที่ลาม) อัลมุรอดีย์ อัลกูฟีย์ ซึ่งถูกวิจารณ์ อิบนุหิบบาน อัลอิจลีย์ และยะอ์กูบ บินชัยบะฮ์ว่าเชื่อถือได้ แต่ส่วนใหญ่ว่าอ่อน อัลเคาะฏฏอบีย์ยกว่าอิมามอะห์มัดถือว่าหะดีษอะลีนี้อ่อน และว่าอับดุลลอฮ์ บินสะลิมะฮ์อ่อน อัชชาฟิอีย์กล่าวว่า \"ฉันชอบให้ผู้มีญะนาบะฮ์และหญิงมีประจำเดือนละการอ่านอัลกุรอานเพื่อความระมัดระวัง เพราะมีรายงานในเรื่องนี้ แม้นักหะดีษจะไม่ยืนยันหะดีษนี้\" และอิบนุลมุนซิรว่าอ่อน", "ชุอ์บะฮ์ยกจากอัมรฺ บินมุรเราะฮ์ว่า \"อับดุลลอฮ์ บินสะลิมะฮ์เล่าให้เราฟัง ขณะที่เขาแก่แล้ว เรารู้จักและไม่รู้จัก (หะดีษของเขา)\" แสดงว่าอิบนุสะลิมะฮ์แม้จะเชื่อถือได้ แต่ความจำเปลี่ยนในบั้นปลาย และอัมรฺ บินมุรเราะฮ์รายงานจากเขาในช่วงนี้ ซึ่งทำให้หะดีษอ่อน", "เชคอับดุลอะซีซ บินบาซเอียงไปสนับสนุนคำของอิบนุหะญัร และว่า \"เป็นหะดีษหะซันที่ใช้เป็นหลักฐานได้ อับดุลลอฮ์ บินสะลิมะฮ์ศอดูก แม้ความจำจะเปลี่ยนในบั้นปลาย แต่การเล่าหะดีษของเขาบ่งว่าเขาจำได้ดี เพราะเล่าพร้อมเรื่องของอะลีกับชายสองคน\" อัตติรมิซีย์ว่า \"หะดีษอะลีนี้หะซันศ่อฮีห์\" อิบนุสสะกัน อับดุลหักก์ และอัลบะเฆาะวีย์ก็ว่าศ่อฮีห์ ชุอ์บะฮ์ว่า \"หะดีษนี้เป็นหนึ่งในสามของทุนของฉัน\" และอิบนุหะญัรว่า \"ที่ถูกคือเป็นหะดีษระดับหะซันที่ใช้เป็นหลักฐานได้\"", "มีผู้รายงานสนับสนุนความหมาย ผ่านอาอิซ บินหะบีบ จากอามิร บินอัสสิมฏ์ จากอบุลฆอรีฟว่า มีคนนำน้ำวุฎูอ์มาให้อะลี (ร.ฎ.) เขาบ้วนปาก... แล้วกล่าวว่า \"อย่างนี้ฉันเห็นท่านรสูลุลลอฮ์ ﷺ อาบน้ำละหมาด\" แล้วอ่านอัลกุรอานบางส่วน แล้วกล่าวว่า \"นี่สำหรับผู้ที่ไม่มีญะนาบะฮ์ ส่วนผู้มีญะนาบะฮ์ ไม่ได้แม้แต่อายะฮ์เดียว\" (อะห์มัด อบูยะอ์ลา สายหะซัน อินชาอัลลอฮ์ เชคอิบนุบาซว่าสายดี) และในบทนี้มีหะดีษอิบนุอุมัร (ร.ฎ.) ว่าท่านนบี ﷺ กล่าวว่า \"ผู้มีญะนาบะฮ์และหญิงมีประจำเดือนอย่าอ่านอัลกุรอานแม้แต่น้อย\" (อัตติรมิซีย์ 131 อิบนุมาญะฮ์ 595 สายอ่อน เพราะอิสมาอีล บินอัยยาชรายงานจากชาวหิญาซ ซึ่งรายงานของเขาจากพวกเขาอ่อน และเขารายงานคนเดียว และถูกระบุว่ามีข้อบกพร่องว่าเป็นเมากูฟจากอิบนุอุมัร)"]}, {"wajh": 2, "type": "fiqh", "heading_ar": null, "heading_th": "ผู้มีญะนาบะฮ์อ่านอัลกุรอานได้หรือไม่", "points_th": ["ผู้ที่ว่าผู้มีญะนาบะฮ์อ่านอัลกุรอานไม่ได้จนกว่าจะอาบน้ำ ใช้หะดีษนี้เป็นหลักฐาน นี่เป็นทัศนะของนักวิชาการส่วนใหญ่ พวกเขากล่าวว่า หะดีษในบทนี้แม้บางบทจะถูกวิจารณ์ แต่เสริมกัน มาลิกีย์ยกเว้นการอ่านเล็กน้อยเพื่อคุ้มครองตัว เช่น อายะตุลกุรซีย์ ซูเราะฮ์อัลอิคลาศ และสองซูเราะฮ์ขอความคุ้มครอง ชาฟิอีย์ว่าอนุญาตถ้าตั้งใจเป็นซิกิร ไม่ใช่ตั้งใจอ่านอัลกุรอาน และอะห์มัดว่า \"ผ่อนปรนให้ผู้มีญะนาบะฮ์อ่านหนึ่งอายะฮ์หรือทำนองนั้น\"", "ทัศนะที่สอง: ผู้มีญะนาบะฮ์อ่านอัลกุรอานได้ เป็นทัศนะของอิบนุหัซม์ มีรายงานจากอิบนุอับบาส (ร.ฎ.) อัลบุคอรีย์ระบุว่าเขาเห็นว่าการอ่านของผู้มีญะนาบะฮ์ไม่เป็นไร และเป็นทัศนะของสะอีด บินอัลมุซัยยิบ และอิบนุลมุนซิรเลือก พวกเขาใช้สองหลักฐาน (1) หะดีษอาอิชะฮ์ (ร.ฎ.) ว่าท่านนบี ﷺ รำลึกถึงอัลลอฮ์ในทุกเวลา (มุสลิม 373 กล่าวแล้ว) และอัลกุรอานเป็นซิกิร ดังอายะฮ์ \"แท้จริงเราได้ประทานซิกิร (อัลกุรอาน) ลงมา และแท้จริงเราเป็นผู้รักษามันไว้\" (อัลหิจญ์รฺ: 9) และ \"และเราได้ประทานซิกิรลงมาแก่เจ้า\" อิบนุหะญัรว่า \"ซิกิรกว้างกว่า จะเป็นอัลกุรอานหรืออื่นก็ได้ แยกระหว่างซิกิรกับการอ่านอัลกุรอานเพียงตามธรรมเนียม\" นักวิชาการบางคนแย้งการใช้หลักฐานนี้ แต่ถูกตอบว่าคำว่าซิกิรมาตามภาษาศาสนา และความหมายตามศาสนามาก่อนความหมายตามธรรมเนียม ดังในอุศูล (2) หลักเดิมคือไม่หะรอม จนกว่าจะมีหลักฐานที่ถูกต้องที่เปลี่ยนจากการพ้นภาระเดิม และพวกเขาตอบหะดีษของบทว่ามีข้อบกพร่องดังกล่าว และหากสมมุติว่าใช้เป็นหลักฐานได้ ก็ไม่มีคำห้าม เป็นเพียงการเล่าการกระทำ", "ผู้แต่งเห็นว่าทัศนะว่าอนุญาตมีน้ำหนัก เพราะรู้แล้วถึงคำของนักวิชาการเกี่ยวกับหะดีษที่ห้าม และเป็นที่รู้กันว่านักวิชาการเข้มงวดกับหะดีษที่ใช้เป็นหลักฐานเรื่องหะลาลและหะรอม หะดีษของบทจึงไม่แข็งแรงพอที่จะห้าม หุก่มจึงคงอยู่ตามหลักเดิม และสิ่งที่รายงานจากอิบนุอับบาส (ร.ฎ.) ก็สนับสนุน แต่ความระมัดระวังที่อิมามชาฟิอีย์เสนอมีน้ำหนักมาก โดยเฉพาะผู้มีญะนาบะฮ์ส่วนใหญ่สามารถขจัดฮะดัษได้", "ส่วนหญิงมีประจำเดือนอ่านอัลกุรอานได้ เพราะหลักเดิมคืออนุญาต จนกว่าจะมีหลักฐานที่เปลี่ยน และไม่มีตัวบทยืนยันหุก่มเรื่องการอ่านของนาง การเทียบนางกับผู้มีญะนาบะฮ์ไม่ถูกต้อง เพราะมีความต่าง อิบนุตัยมียะฮ์และศิษย์ของเขาอิบนุลก็อยยิมสนับสนุนทัศนะนี้ นักวิชาการบางคนจำกัดการอนุญาตเฉพาะเมื่อจำเป็น เช่น การอ่านประจำ หรือเป็นครู ผู้แต่งเห็นว่าที่ชัดเจนกว่าคืออนุญาตโดยทั่วไป"]}], "tags_th": ["ญะนาบะฮ์", "การอ่านอัลกุรอาน", "ประจำเดือน", "อะลี", "ความระมัดระวัง"]}, {"id": "v2-h117", "volume": 2, "bab": "ghusl", "topic_ar": "مشروعية الوضوء لمن عاود الجماع", "topic_th": "บัญญัติให้อาบน้ำละหมาดสำหรับผู้ที่จะร่วมประเวณีอีกครั้ง", "pages": [41, 43], "hadith": [{"no": 117, "matn_ar": "وَعَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «إِذَا أَتَى أَحَدُكُمْ أَهْلَهُ، ثُمَّ أَرَادَ أَنْ يَعُودَ فَلْيَتَوَضَّأْ بَيْنَهُمَا وُضُوءًا». رَوَاهُ مُسْلِمٌ. زَادَ الْحَاكِمُ: «فَإِنَّهُ أَنْشَطُ لِلْعَوْدِ».", "translation_th": "และจากอบูสะอีด อัลคุดรีย์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"เมื่อคนหนึ่งในหมู่พวกท่านร่วมประเวณีกับภรรยา แล้วต้องการจะร่วมอีก ก็จงอาบน้ำละหมาดระหว่างทั้งสองครั้ง\" รายงานโดยมุสลิม อัลหากิมเพิ่มว่า \"เพราะมันทำให้กระปรี้กระเปร่ากว่าสำหรับการร่วมอีกครั้ง\"", "grade_th": "ศ่อฮีห์ (มุสลิม) ส่วนเพิ่มของอัลหากิมมีข้อบกพร่อง เพราะมุสลิม บินอิบรอฮีมรายงานคนเดียวจากชุอ์บะฮ์"}], "key_rulings_th": ["บัญญัติให้อาบน้ำละหมาดสำหรับผู้ที่ร่วมประเวณีแล้วต้องการร่วมอีก ความหมายตามตัวบทของคำสั่งคือวาญิบ (ซอฮิรีย์บางคน อิบนุหะบีบ อัลมาลิกีย์) แต่นักวิชาการส่วนใหญ่ถือว่าส่งเสริม", "ผู้แต่งเห็นว่าที่ชัดเจนกว่าคือ หมายถึงล้างอวัยวะเพศ แล้วอาบน้ำละหมาดด้วยการล้างสี่อวัยวะ เพราะสมบูรณ์กว่าในความสะอาด", "ผู้แต่งเห็นว่าไม่ควรร่วมอีกครั้งนอกจากหลังอาบน้ำละหมาด เพราะทำให้กระปรี้กระเปร่ากว่าและสะอาดกว่า ส่วนการอาบน้ำ (ฆุสล์) ไม่จำเป็น", "ท่านนบี ﷺ เคยร่วมกับภรรยาหลายคนโดยอาบน้ำครั้งเดียว และเคยอาบน้ำที่ภรรยาแต่ละคน ทั้งสองอย่างอนุญาต แต่แบบแรกยืนยันได้มั่นคงกว่า"], "vocab": [{"ar": "أَتَى أَحَدُكُمْ أَهْلَهُ", "th": "ร่วมประเวณีกับภรรยา"}, {"ar": "أَرَادَ أَنْ يَعُودَ", "th": "ต้องการร่วมประเวณีอีกครั้ง"}, {"ar": "أَنْشَطُ لِلْعَوْدِ", "th": "ทำให้กระปรี้กระเปร่ากว่าสำหรับการร่วมอีกครั้ง"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["มุสลิมบันทึก (308) ในหมวดประจำเดือน บทอนุญาตให้ผู้มีญะนาบะฮ์นอน และส่งเสริมให้อาบน้ำละหมาดและล้างอวัยวะเพศ เมื่อต้องการกิน ดื่ม นอน หรือร่วมประเวณี ผ่านอาศิม อัลอะห์วัล ว่า \"ฉันได้ยินอบุลมุตะวักกิล จากอบูสะอีด อัลคุดรีย์...\"", "อัลหากิมบันทึก (1/254) พร้อมส่วนเพิ่ม \"เพราะมันทำให้กระปรี้กระเปร่ากว่าสำหรับการร่วมอีกครั้ง\" และว่า \"หะดีษนี้ศ่อฮีห์ตามเงื่อนไขของอัลบุคอรีย์และมุสลิม แต่ทั้งสองไม่ได้บันทึกด้วยสำนวนนี้ ทั้งสองบันทึกถึงคำว่า ก็จงอาบน้ำละหมาด เท่านั้น ไม่ได้กล่าวถึง เพราะมันทำให้กระปรี้กระเปร่ากว่า คำนี้ชุอ์บะฮ์รายงานคนเดียวจากอาศิม และการรายงานคนเดียวของคนเช่นนี้เป็นที่ยอมรับในทัศนะของทั้งสอง\"", "ผู้แต่งเห็นว่ายังต้องพิจารณา อิบนุหิบบานระบุว่าผู้ที่รายงานส่วนเพิ่มนี้คนเดียวคือมุสลิม บินอิบรอฮีม จากชุอ์บะฮ์ ไม่ใช่ชุอ์บะฮ์ และคนอื่นรายงานจากชุอ์บะฮ์โดยไม่มีส่วนเพิ่มนี้ จึงเห็นชัดว่ามุสลิม (ผู้บันทึกเศาะฮีห์) เลี่ยงไม่บันทึกส่วนเพิ่มนี้เพราะข้อบกพร่องนี้"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"เมื่อคนหนึ่งในหมู่พวกท่านมาหาภรรยา\" คือร่วมประเวณีกับภรรยา \"แล้วต้องการจะกลับมา\" คือร่วมประเวณีอีกครั้ง", "\"ก็จงอาบน้ำละหมาดระหว่างทั้งสองครั้ง (วุฎูอัน)\" คำว่า \"วุฎูอัน\" เป็นมัศดัรที่เน้นย้ำกริยา ประโยชน์คือยืนยันว่าหมายถึงวุฎูอ์ตามศาสนา คือล้างสี่อวัยวะ นี่เป็นทัศนะของชาวซอฮิรีย์บางคน ส่วนนักฟิกฮ์และนักวิชาการส่วนใหญ่ว่าหมายถึงล้างอวัยวะเพศเท่านั้น เพื่อความสะอาดอย่างยิ่ง และเลี่ยงการนำนะญิสเข้าไป", "ผู้แต่งเห็นว่าที่ชัดเจนกว่า วัลลอฮุอะอ์ลัม คือหมายถึงล้างอวัยวะเพศ แล้วอาบน้ำละหมาดด้วยการล้างสี่อวัยวะ เพราะสมบูรณ์กว่าในความสะอาด ที่สนับสนุนคือหะดีษอิบนุอุมัรว่า อุมัร บินอัลค็อฏฏอบเล่าแก่ท่านรสูลุลลอฮ์ ﷺ ว่าเขามีญะนาบะฮ์ในเวลากลางคืน ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"จงอาบน้ำละหมาด และล้างอวัยวะเพศ แล้วนอน\" (อัลบุคอรีย์ 290 มุสลิม 306)", "\"เพราะมันทำให้กระปรี้กระเปร่ากว่าสำหรับการร่วมอีกครั้ง\" เป็นประโยคบอกเหตุผล แสดงวิทยปัญญาของคำสั่งให้อาบน้ำละหมาด คือวุฎูอ์ให้กำลังแก่ร่างกาย ชดเชยความอ่อนแรงที่เกิดจากการร่วมครั้งแรก"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "การอาบน้ำละหมาดก่อนร่วมประเวณีอีกครั้ง", "points_th": ["หะดีษเป็นหลักฐานว่าบัญญัติให้อาบน้ำละหมาดสำหรับผู้ที่ร่วมประเวณีกับภรรยาแล้วต้องการร่วมอีก ความหมายตามตัวบทของคำสั่งคือวาญิบ อัลกุรฏุบีย์ยกจากชาวซอฮิรีย์บางคน และอิบนุหะญัรยกจากอิบนุหะบีบ อัลมาลิกีย์ นักวิชาการส่วนใหญ่ถือว่าส่งเสริม ที่บ่งเช่นนั้นคือหะดีษอาอิชะฮ์ว่า \"ท่านนบี ﷺ ร่วมประเวณี แล้วร่วมอีก โดยไม่อาบน้ำละหมาด\" (อัฏเฏาะหาวีย์ อิบนุหะญัรยกไว้ใน \"อัลฟัตห์\" โดยไม่ได้วิจารณ์)", "ผู้แต่งเห็นว่าไม่ควรร่วมอีกครั้ง นอกจากหลังอาบน้ำละหมาด และท่านให้เหตุผลว่าทำให้กระปรี้กระเปร่ากว่าสำหรับการร่วมอีก พร้อมกับความสะอาดที่ได้ ส่วนการอาบน้ำ (ฆุสล์) ไม่จำเป็น ดังจะกล่าว", "ความกว้างของหะดีษบ่งว่าไม่ว่าคนที่จะร่วมอีกจะเป็นภรรยาคนเดิม หรือภรรยาอีกคน สำหรับผู้ที่มีภรรยามากกว่าหนึ่งคน", "ส่วนการอาบน้ำ ยืนยันได้ว่าท่านนบี ﷺ ร่วมกับภรรยาของท่านโดยไม่อาบน้ำระหว่างครั้ง และมีรายงานว่าท่านอาบน้ำหลังร่วมกับแต่ละคน ทั้งสองอย่างอนุญาต แต่แบบแรกยืนยันได้มั่นคงกว่า แบบแรกมาในหะดีษอะนัส บินมาลิก (ร.ฎ.) ว่า \"ท่านนบี ﷺ เวียนไปหาภรรยาของท่านในชั่วโมงเดียวทั้งกลางคืนและกลางวัน ซึ่งมีสิบเอ็ดคน\" (เกาะตาดะฮ์) ถามอะนัสว่า \"ท่านทำได้หรือ\" อะนัสตอบว่า \"เราเคยพูดกันว่าท่านได้รับพลังของสามสิบคน\" และสะอีดรายงานจากเกาะตาดะฮ์ว่าอะนัสเล่าว่าเก้าคน (อัลบุคอรีย์ 268 มุสลิม 309) แบบที่สองมาในหะดีษอบูรอฟิอ์ (ร.ฎ.) ผู้รับใช้ของท่านรสูลุลลอฮ์ ﷺ ว่า ท่านนบี ﷺ วันหนึ่งเวียนไปหาภรรยาของท่าน และอาบน้ำที่คนนี้และที่คนนั้น เขาถามว่า \"โอ้ท่านรสูลุลลอฮ์ ทำไมท่านไม่อาบน้ำครั้งเดียว\" ท่านตอบว่า \"แบบนี้บริสุทธิ์กว่า ดีกว่า และสะอาดกว่า\" (อบูดาวูด 219 อันนะสาอีย์ใน \"อัลกุบรอ\" อิบนุมาญะฮ์ 590 อิบนุหะญัรยกเป็นหลักฐานใน \"อัลฟัตห์\" และอัลอัลบานีย์ว่าหะซัน)"]}], "tags_th": ["ญะนาบะฮ์", "วุฎูอ์", "การร่วมประเวณี", "ความสะอาด"]}, {"id": "v2-h118", "volume": 2, "bab": "ghusl", "topic_ar": "حكم نوم الجنب قبل أن يتوضأ", "topic_th": "ข้อตัดสินการนอนของผู้มีญะนาบะฮ์ก่อนอาบน้ำละหมาด", "pages": [44, 46], "hadith": [{"no": 118, "matn_ar": "وَلِلْأَرْبَعَةِ عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: كَانَ رَسُولُ اللهِ ﷺ يَنَامُ وَهُوَ جُنُبٌ، مِنْ غَيْرِ أَنْ يَمَسَّ مَاءً. وَهُوَ مَعْلُولٌ.", "translation_th": "และของนักบันทึกทั้งสี่ จากอาอิชะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ นอนขณะมีญะนาบะฮ์ โดยไม่ได้แตะน้ำ และหะดีษนี้มีข้อบกพร่อง (มะอ์ลูล)", "grade_th": "มะอ์ลูล (มีข้อบกพร่อง) นักวิชาการ รวมทั้งมุสลิม อะห์มัด และยะซีด บินฮารูน ระบุว่าประโยค \"โดยไม่ได้แตะน้ำ\" เป็นความผิดพลาดของอบูอิสหาก อัสสะบีอีย์"}], "key_rulings_th": ["หะดีษบ่งว่าผู้มีญะนาบะฮ์นอนได้โดยไม่อาบน้ำละหมาด แต่ผู้แต่งเห็นว่าหะดีษมีข้อบกพร่อง ที่ถูกคือให้อาบน้ำละหมาดก่อน", "หากสมมุติว่าหะดีษถูกต้อง ก็ตีความว่าหมายถึงน้ำสำหรับอาบน้ำ (ฆุสล์) เพื่อรวมหลักฐาน วุฎูอ์จึงยืนยันด้วยซุนนะฮ์ทั้งคำพูดและการกระทำ", "ผู้แต่งเห็นว่าที่ชัดเจนกว่าคือการอาบน้ำละหมาดก่อนนอนเป็นซุนนะฮ์ที่เน้นย้ำ (ซุนนะฮ์มุอักกะดะฮ์) และทัศนะว่าวาญิบก็มีน้ำหนักอยู่บ้าง", "ส่วนการอาบน้ำ (ฆุสล์) เลื่อนไปทำหลังตื่นได้ อาอิชะฮ์เล่าว่าบางครั้งท่านอาบน้ำแล้วนอน บางครั้งอาบน้ำละหมาดแล้วนอน"], "vocab": [{"ar": "يَنَامُ وَهُوَ جُنُبٌ", "th": "นอนขณะมีญะนาบะฮ์"}, {"ar": "مِنْ غَيْرِ أَنْ يَمَسَّ مَاءً", "th": "โดยไม่ได้แตะน้ำเลย"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อบูดาวูดบันทึกในหมวดความสะอาด บทผู้มีญะนาบะฮ์เลื่อนการอาบน้ำ (228) อัตติรมิซีย์ (118, 119) อันนะสาอีย์ใน \"อัลกุบรอ\" และอิบนุมาญะฮ์ (583) ผ่านอบูอิสหาก จากอัลอัสวัด จากอาอิชะฮ์", "มุสลิมบันทึกในเศาะฮีห์ (305) ผ่านชุอ์บะฮ์ จากอัลหะกัม จากอิบรอฮีม จากอัลอัสวัด จากอาอิชะฮ์ว่า \"ท่านรสูลุลลอฮ์ ﷺ เมื่อมีญะนาบะฮ์ แล้วต้องการกินหรือนอน ท่านจะอาบน้ำละหมาดเหมือนอาบเพื่อละหมาด\" และรายงานผ่านอับดุรเราะห์มาน บินอัลอัสวัด จากบิดา จากอาอิชะฮ์ทำนองเดียวกัน ในสำนวนนี้ไม่มีคำว่า \"ก่อนจะแตะน้ำ\" นักจำจึงวิจารณ์ประโยคนี้ รวมทั้งอิมามมุสลิม และกล่าวว่าอบูอิสหาก อัสสะบีอีย์ผิดพลาด", "อบูดาวูดกล่าวว่า \"ฉันได้ยินยะซีด บินฮารูนกล่าวว่า หะดีษนี้ผิดพลาด\" อัตติรมิซีย์ว่า \"พวกเขาเห็นว่านี่เป็นความผิดพลาดของอบูอิสหาก\" และอิบนุอับดิลฮาดีย์ยกจากอิมามอะห์มัดว่า \"หะดีษนี้ไม่ถูกต้อง\" เหตุผลคือ ที่ยืนยันจากท่าน ﷺ คือท่านไม่นอนจนกว่าจะล้างอวัยวะเพศ แล้วอาบน้ำละหมาดเหมือนเพื่อละหมาด ตามรายงานของมุสลิม", "บางคนกล่าวว่า อาจตีความว่าน้ำในคำของนาง \"โดยไม่ได้แตะน้ำ\" คือน้ำสำหรับอาบน้ำ (ฆุสล์) ส่วนวุฎูอ์นั้นยืนยันได้ หรือตีความว่าวุฎูอ์เป็นการส่งเสริม และการที่ท่าน ﷺ ละไว้เพื่อแสดงว่าอนุญาต ทางแรกอัลบัยฮะกีย์ระบุ และระบุว่าเป็นของอบุลอับบาส บินสุร็อยจ์ แล้วกล่าวว่า \"เราถือตามนั้น\" ทางที่สองอิบนุกุตัยบะฮ์กล่าว", "ที่สนับสนุนคือหะดีษอิบนุอุมัร (ร.ฎ.) ว่าอุมัร (ร.ฎ.) ถามท่านรสูลุลลอฮ์ ﷺ ว่า \"คนหนึ่งในหมู่เรานอนขณะมีญะนาบะฮ์ได้หรือ\" ท่านตอบว่า \"ได้ เมื่อเขาอาบน้ำละหมาด\" และอีกรายงานว่า \"ได้ ให้เขาอาบน้ำละหมาด แล้วนอน จนกว่าจะอาบน้ำเมื่อต้องการ\" (อัลบุคอรีย์ 287 มุสลิม 306)"]}, {"wajh": 2, "type": "fiqh", "heading_ar": null, "heading_th": "ผู้มีญะนาบะฮ์นอนโดยไม่อาบน้ำละหมาด", "points_th": ["หะดีษเป็นหลักฐานว่าผู้มีญะนาบะฮ์นอนได้โดยไม่อาบน้ำละหมาด แต่เห็นชัดแล้วว่าหะดีษมีข้อบกพร่อง ผู้แต่งเห็นว่าที่ถูกคือให้อาบน้ำละหมาด และหากสมมุติว่าถูกต้อง ก็ตีความว่าหมายถึงการอาบน้ำ (ฆุสล์) เพื่อรวมหลักฐาน วุฎูอ์จึงยืนยันด้วยซุนนะฮ์ทั้งคำพูด ดังหะดีษอุมัร (ร.ฎ.) และการกระทำ ดังหะดีษอาอิชะฮ์ (ร.ฎ.) ว่าท่านรสูลุลลอฮ์ ﷺ เมื่อต้องการนอนขณะมีญะนาบะฮ์ ท่านอาบน้ำละหมาดเหมือนเพื่อละหมาดก่อนนอน และจากนางว่า \"ท่านรสูลุลลอฮ์ ﷺ เมื่อมีญะนาบะฮ์ แล้วต้องการกินหรือนอน ท่านอาบน้ำละหมาดเหมือนเพื่อละหมาด\" (มุสลิม 305)"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "การอาบน้ำละหมาดก่อนนอนวาญิบหรือไม่", "points_th": ["ชาวซอฮิรีย์และอิบนุหะบีบจากมาลิกีย์ถือตามหะดีษอิบนุอุมัร (ร.ฎ.) ที่กล่าวแล้ว และว่าวาญิบที่ผู้มีญะนาบะฮ์ต้องอาบน้ำละหมาดก่อนนอน ซึ่งเป็นความหมายตามตัวบทของคำของอิมามมาลิกใน \"อัลมุดัววะนะฮ์\" เพราะหะดีษมาในรูปคำสั่งและรูปเงื่อนไข", "ชาฟิอีย์ว่าการละวุฎูอ์เป็นมักรูฮ์ ซึ่งเป็นที่รู้จักในหมู่ฮัมบะลีย์รุ่นหลัง และอิบนุตัยมียะฮ์เลือก หะนะฟีย์ว่าวุฎูอ์ประเสริฐกว่า และมาลิกีย์กับอิบนุหัซม์ว่าส่งเสริม", "ผู้แต่งเห็นว่าทัศนะว่าส่งเสริมให้อาบน้ำละหมาดเป็นทัศนะที่ชัดเจนกว่า แต่เป็นซุนนะฮ์ที่เน้นย้ำ เพราะยืนยันด้วยซุนนะฮ์ทั้งคำพูดและการกระทำดังกล่าวแล้ว และทัศนะว่าวาญิบก็มีน้ำหนัก", "ส่วนการอาบน้ำ (ฆุสล์) เลื่อนไปหลังตื่นได้ ตามหะดีษอับดุลลอฮ์ บินอบีเกาะยส์ว่า \"ฉันถามอาอิชะฮ์ (ร.ฎ.) เรื่องวิตรของท่านรสูลุลลอฮ์ ﷺ... ฉันถามว่า ท่านทำอย่างไรในเรื่องญะนาบะฮ์ ท่านอาบน้ำก่อนนอน หรือนอนก่อนอาบน้ำ นางตอบว่า ท่านทำทั้งสองอย่าง บางครั้งอาบน้ำแล้วนอน บางครั้งอาบน้ำละหมาดแล้วนอน ฉันกล่าวว่า มวลการสรรเสริญเป็นของอัลลอฮ์ผู้ทรงทำให้เรื่องนี้มีความกว้างขวาง\" (มุสลิม 307)"]}], "tags_th": ["ญะนาบะฮ์", "การนอน", "วุฎูอ์", "มะอ์ลูล", "ซุนนะฮ์มุอักกะดะฮ์"]}, {"id": "v2-h119-120", "volume": 2, "bab": "ghusl", "topic_ar": "صفة الغسل من الجنابة", "topic_th": "วิธีอาบน้ำชำระญะนาบะฮ์", "pages": [47, 53], "hadith": [{"no": 119, "matn_ar": "وَعَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: كَانَ رَسُولُ اللهِ ﷺ إِذَا اغْتَسَلَ مِنَ الْجَنَابَةِ يَبْدَأُ فَيَغْسِلُ يَدَيْهِ، ثُمَّ يُفْرِغُ بِيَمِينِهِ عَلَى شِمَالِهِ، فَيَغْسِلُ فَرْجَهُ، ثُمَّ يَتَوَضَّأُ، ثُمَّ يَأْخُذُ الْمَاءَ، فَيُدْخِلُ أَصَابِعَهُ فِي أُصُولِ الشَّعَرِ، ثُمَّ حَفَنَ عَلَى رَأْسِهِ ثَلَاثَ حَفَنَاتٍ، ثُمَّ أَفَاضَ عَلَى سَائِرِ جَسَدِهِ، ثُمَّ غَسَلَ رِجْلَيْهِ. مُتَّفَقٌ عَلَيْهِ، وَاللَّفْظُ لِمُسْلِمٍ.", "translation_th": "และจากอาอิชะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ เมื่ออาบน้ำชำระญะนาบะฮ์ ท่านเริ่มด้วยการล้างมือทั้งสอง แล้วเทน้ำด้วยมือขวาลงบนมือซ้าย แล้วล้างอวัยวะเพศ แล้วอาบน้ำละหมาด แล้วตักน้ำ สอดนิ้วเข้าไปที่โคนผม แล้วกอบน้ำราดศีรษะสามกอบ แล้วราดน้ำทั่วร่างกายที่เหลือ แล้วล้างเท้าทั้งสอง บันทึกโดยอัลบุคอรีย์และมุสลิม สำนวนเป็นของมุสลิม", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม) ส่วนคำว่า \"แล้วล้างเท้าทั้งสอง\" อบูมุอาวิยะฮ์รายงานคนเดียวจากฮิชาม"}, {"no": 120, "matn_ar": "وَلَهُمَا فِي حَدِيثِ مَيْمُونَةَ رَضِيَ اللهُ عَنْهَا: «ثُمَّ أَفْرَغَ عَلَى فَرْجِهِ، فَغَسَلَهُ بِشِمَالِهِ، ثُمَّ ضَرَبَ بِهَا الْأَرْضَ»، وَفِي رِوَايَةٍ: «فَمَسَحَهَا بِالتُّرَابِ»، وَفِي آخِرِهِ: «ثُمَّ أَتَيْتُهُ بِالْمِنْدِيلِ» فَرَدَّهُ، وَفِيهِ: «وَجَعَلَ يَنْفُضُ الْمَاءَ بِيَدِهِ».", "translation_th": "และของทั้งสอง (อัลบุคอรีย์และมุสลิม) ในหะดีษมัยมูนะฮ์ (ร.ฎ.) ว่า \"แล้วท่านเทน้ำลงบนอวัยวะเพศ แล้วล้างด้วยมือซ้าย แล้วตบมือนั้นลงกับพื้นดิน\" และในอีกรายงานว่า \"แล้วถูมือด้วยดิน\" และในตอนท้ายว่า \"แล้วฉันนำผ้าเช็ดตัวมาให้\" ท่านก็ไม่รับ และในนั้นว่า \"และท่านสะบัดน้ำด้วยมือ\"", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["วิธีอาบน้ำญะนาบะฮ์ที่สมบูรณ์ตามแบบท่านนบี ﷺ: ล้างมือ (สามครั้ง) ล้างอวัยวะเพศ ถูมือซ้ายกับดิน อาบน้ำละหมาดเต็มรูปแบบ สางผมด้วยน้ำ ราดศีรษะสามครั้ง ราดทั่วร่างกาย แล้วล้างเท้า", "ท่านนบี ﷺ อาบน้ำหลายแบบที่ต่างกันเล็กน้อย เพื่อเป็นความกว้างขวางแก่ประชาชาติ ซุนนะฮ์ที่สมบูรณ์คือทำทุกแบบสลับกัน", "ถ้าให้น้ำทั่วร่างกายพร้อมบ้วนปากและสูดน้ำเข้าจมูก ก็ใช้ได้แม้ไม่อาบน้ำละหมาดก่อน แต่ละซุนนะฮ์", "ผู้แต่งเห็นว่าที่ถูกต้องคือล้างร่างกายครั้งเดียว ไม่มีบัญญัติให้ล้างสามครั้ง (อิบนุตัยมียะฮ์) ต่างจากที่รู้จักในมัซฮับฮัมบะลีย์", "การเช็ดตัวด้วยผ้าหลังอาบน้ำหรืออาบน้ำละหมาดอนุญาต (นักวิชาการส่วนใหญ่) การที่ท่านไม่รับผ้าเป็นเหตุการณ์เฉพาะที่มีความเป็นไปได้หลายทาง"], "vocab": [{"ar": "إِذَا اغْتَسَلَ", "th": "เมื่อต้องการจะอาบน้ำ"}, {"ar": "حَفَنَ", "th": "กอบน้ำด้วยสองมือ (หัฟนะฮ์ = เต็มสองฝ่ามือ)"}, {"ar": "أَفَاضَ عَلَى سَائِرِ جَسَدِهِ", "th": "ราดน้ำทั่วร่างกายที่เหลือ"}, {"ar": "الْمِنْدِيلُ", "th": "ผ้าทอจากฝ้ายหรือไหม ใช้เช็ดตัว"}, {"ar": "يَنْفُضُ الْمَاءَ", "th": "สะบัดและปาดน้ำออกจากร่างกาย"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجهما", "heading_th": "ที่มาของหะดีษ", "points_th": ["หะดีษอาอิชะฮ์: อัลบุคอรีย์บันทึกหลายแห่งในหมวดการอาบน้ำ แห่งแรกคือบทวุฎูอ์ก่อนอาบน้ำ (248) และมุสลิม (316) ผ่านฮิชาม บินอุรวะฮ์ จากบิดา จากอาอิชะฮ์ สำนวนเป็นของมุสลิม แต่ในสำนวนของมุสลิมว่า \"แล้วสอดนิ้วเข้าไปที่โคนผม จนเมื่อเห็นว่าทั่วแล้ว ก็กอบน้ำราดศีรษะ...\"", "แต่การล้างเท้าทั้งสองนั้น อบูมุอาวิยะฮ์รายงานคนเดียวจากฮิชาม ต่างจากผู้รายงานคนอื่น มุสลิมชี้ไว้ในเศาะฮีห์ และอบุลฟัฎล์ อัชชะฮีดระบุว่าเป็นข้อบกพร่อง มีหลักฐานสนับสนุนผ่านหัมมาด บินสะละมะฮ์ จากอะฏออ์ บินอัสสาอิบ จากอบูสะละมะฮ์ จากอาอิชะฮ์ (อะห์มัด อบูดาวูด อัฏเฏาะยาลิสีย์ อัลบัยฮะกีย์) และนักวิชาการส่วนใหญ่ว่าหัมมาดได้ยินจากอะฏออ์ก่อนความจำของเขาสับสน", "หะดีษมัยมูนะฮ์: อัลบุคอรีย์บันทึกหลายแห่งในหมวดการอาบน้ำ แห่งแรกคือบทเดียวกับหะดีษอาอิชะฮ์ (249) และมุสลิม (317) ผ่านอัลอะอ์มัช จากสาลิม บินอบีอัลญะอ์ด จากกุร็อยบ์ จากอิบนุอับบาสว่า \"ป้าของฉัน มัยมูนะฮ์ เล่าให้ฉันฟัง...\" อิบนุหะญัรยกมาเพราะมีส่วนเพิ่มที่ไม่มีในหะดีษอาอิชะฮ์ แต่ผู้แต่งเห็นว่า \"แล้วท่านเทน้ำลงบนอวัยวะเพศ แล้วล้างด้วยมือซ้าย\" ก็มีในหะดีษแรกคือหะดีษอาอิชะฮ์แล้ว", "\"และในอีกรายงานว่า แล้วถูมือด้วยดิน\" เป็นของอัลบุคอรีย์ และของมุสลิมว่า \"แล้วตบมือซ้ายลงพื้นดิน แล้วถูอย่างแรง\" ดูเหมือนอิบนุหะญัรยกมาเพื่ออธิบายรายงาน \"แล้วตบมือนั้นลงกับพื้นดิน\" \"และในตอนท้าย\" คือตอนท้ายของหะดีษมัยมูนะฮ์ อิบนุหะญัรไม่ได้ยกสำนวนทั้งหมด เพราะเพียงพอกับหะดีษอาอิชะฮ์ และยกเฉพาะบางส่วนที่ไม่มีในหะดีษแรก ตอนท้ายในมุสลิมว่า \"แล้วฉันนำผ้าเช็ดตัวมาให้ ท่านก็ไม่รับ\" ในอัลบุคอรีย์ว่า \"แล้วนำผ้าเช็ดตัวมาให้ ท่านไม่ได้ใช้เช็ด\" และอีกสำนวนว่า \"นางยื่นผ้าให้ ท่านไม่รับ แล้วท่านเดินไปพลางสะบัดมือ\" \"และในนั้นว่า และท่านสะบัดน้ำด้วยมือ\" เป็นสำนวนของอัลบุคอรีย์ ของมุสลิมว่า \"และท่านทำกับน้ำอย่างนี้ คือสะบัด\""]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظهما", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"เมื่ออาบน้ำ\" คือเมื่อต้องการอาบน้ำ เป็นการใช้คำกริยาแทนความต้องการ ซึ่งเป็นการใช้คำโดยอนุโลมแบบมุรสัล โดยกล่าวผล (การอาบน้ำ) แต่หมายถึงเหตุ (ความต้องการ) \"จากญะนาบะฮ์\" คำว่า \"มิน\" บอกเหตุ ญะนาบะฮ์เดิมคือการหลั่งอสุจิ แล้วนับรวมการร่วมประเวณีด้วยในทางศาสนา ไม่ใช่ทางภาษา", "\"ล้างมือทั้งสอง\" คือฝ่ามือ เพราะเป็นความหมายเมื่อกล่าวโดยไม่ระบุ และหมายถึงก่อนจุ่มมือลงในภาชนะ \"แล้วอาบน้ำละหมาด\" สำนวนของมุสลิมคือ \"แล้วอาบน้ำละหมาดเหมือนเพื่อละหมาด\" และอัลบุคอรีย์ในอีกรายงานว่า \"แล้วอาบน้ำละหมาดเหมือนอาบเพื่อละหมาด\"", "\"สอดนิ้วเข้าไปที่โคนผม\" คือสอดนิ้วแยก ๆ เข้าไปที่โคนผม ซึ่งคือส่วนล่างที่ติดหนังศีรษะ เพื่อให้ผมนุ่มและเปียก น้ำจะได้ผ่านง่าย \"จนเมื่อเห็นว่าทั่วแล้ว\" คือให้ความเปียกถึงทั่วศีรษะ \"แล้วกอบน้ำราดศีรษะ\" คือตักน้ำด้วยสองมือ หัฟนะฮ์คือเต็มสองฝ่ามือ พหูพจน์ หะฟะนาต", "\"แล้วราดน้ำทั่วร่างกายที่เหลือ\" อัลอัซฮะรีย์ว่า \"นักภาษาเห็นพ้องว่า ซาอิรุชชัยอ์ คือส่วนที่เหลือของสิ่งนั้น ไม่ว่าน้อยหรือมาก\" \"แล้วเทน้ำลงบนอวัยวะเพศ\" คือราดน้ำ \"แล้วตบมือนั้นลงกับพื้นดิน\" อธิบายด้วยอีกรายงาน \"แล้วถูมือด้วยดิน\" คือถูมือกับพื้นเพื่อขจัดสิ่งที่ติดหลังล้างอวัยวะเพศ", "\"แล้วฉันนำผ้าเช็ดตัวมาให้\" ผ้าเช็ดตัวคือผ้าทอจากฝ้าย ไหม หรือทำนองนั้น \"ท่านไม่รับ\" (ฎ็อมมะฮ์ที่ยาอ์ กัสเราะฮ์ที่รออ์) คือไม่รับไว้ \"และท่านสะบัดน้ำด้วยมือ\" คือปาดน้ำออกจากร่างกาย อาจหมายถึงมือเดียวหรือสองมือ"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "วิธีอาบน้ำญะนาบะฮ์", "points_th": ["หะดีษเป็นหลักฐานว่าบัญญัติให้อาบน้ำญะนาบะฮ์ตามวิธีนี้ เพื่อเอาแบบอย่างท่านนบี ﷺ คือเริ่มด้วยการล้างมือสามครั้ง ดังในบางรายงาน เพราะมือเป็นเครื่องมือตักน้ำจากภาชนะ แล้วล้างอวัยวะเพศเพื่อทำความสะอาด เพราะเป็นที่ที่เปื้อนจากญะนาบะฮ์ แล้วถูมือซ้ายกับพื้นเพื่อขจัดสิ่งที่ติดจากการล้างอวัยวะเพศ แล้วอาบน้ำละหมาดเต็มรูปแบบ แล้วสางผมด้วยน้ำถ้าผมหนา เมื่อคิดว่าผมเปียกทั่วแล้วก็ราดน้ำบนศีรษะสามครั้ง แล้วล้างร่างกายที่เหลือ แล้วล้างเท้าทั้งสอง เพราะคราบและสิ่งสกปรกที่ไหลลงจากร่างกายจะไปที่เท้า จึงควรทำความสะอาดเท้าหลังจากนั้น ในบางรายงานของหะดีษมัยมูนะฮ์ว่า \"แล้วท่านย้ายออกจากที่นั้นแล้วล้างเท้า\" ซึ่งเป็นการทำความสะอาดเท้าอย่างดีที่สุด", "วิธีอาบน้ำของท่านนบี ﷺ มาในหะดีษอาอิชะฮ์และมัยมูนะฮ์ (ร.ฎ.) ซึ่งต่างกันเล็กน้อยในวิธี เรื่องนี้มีมากในอิบาดะฮ์ ท่านนบี ﷺ ทำหลายแบบ เพื่อเป็นความกว้างขวางแก่ประชาชาติ ทำแบบใดที่มีรายงานก็ได้ซุนนะฮ์ และซุนนะฮ์ที่สมบูรณ์คือทำทุกแบบ บางครั้งแบบหนึ่ง บางครั้งอีกแบบ", "นักวิชาการระบุว่า ถ้าให้น้ำทั่วร่างกายพร้อมบ้วนปากและสูดน้ำเข้าจมูก ก็ใช้ได้ แม้ไม่อาบน้ำละหมาดก่อน แต่ละซุนนะฮ์ ดังอายะฮ์ \"และหากพวกเจ้ามีญะนาบะฮ์ ก็จงทำความสะอาด\" (อัลมาอิดะฮ์: 6) ผู้ที่ให้น้ำทั่วร่างกายครั้งเดียวก็ถือว่าทำความสะอาดแล้ว และเพราะอัลลอฮ์ไม่ได้ทรงแจกแจงรายละเอียดในการอาบน้ำ เหมือนที่ทรงแจกแจงในวุฎูอ์ แสดงว่าการอาบน้ำไม่จำเป็นต้องมีวิธีเฉพาะ ที่สนับสนุนคือคำของท่านนบี ﷺ แก่ชายที่มีญะนาบะฮ์และไม่ได้ละหมาดว่า \"จงเอาน้ำนี้ไปราดตัว\" (อัลบุคอรีย์ 344 ต้นเรื่องอยู่ในมุสลิม 682)"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "การล้างเท้าในวุฎูอ์หรือตอนท้าย", "points_th": ["ความหมายตามตัวบทของหะดีษอาอิชะฮ์ในคำว่า \"แล้วอาบน้ำละหมาด\" และในรายงานของอัลบุคอรีย์ \"แล้วอาบน้ำละหมาดเหมือนเพื่อละหมาด\" และในอัลบุคอรีย์และมุสลิม \"แล้วอาบน้ำละหมาดของท่านเพื่อละหมาด\" และในหะดีษมัยมูนะฮ์ในบางรายงานก็เช่นกัน ความหมายตามตัวบทคือท่านล้างเท้าด้วย แต่ในหะดีษมัยมูนะฮ์ในอีกรายงานของอัลบุคอรีย์ว่า \"ท่านรสูลุลลอฮ์ ﷺ อาบน้ำละหมาดเหมือนเพื่อละหมาด ยกเว้นเท้า\" ความหมายคือท่านไม่ได้ล้างเท้าพร้อมวุฎูอ์ แต่เลื่อนไปท้ายการอาบน้ำ ตามคำในอีกรายงาน \"แล้วท่านย้ายออกไปแล้วล้างเท้า\"", "ในรายงานของอัลบุคอรีย์จากหะดีษอาอิชะฮ์ว่า \"แล้วอาบน้ำละหมาดเพื่อละหมาด\" และตอนท้ายว่า \"แล้วราดน้ำทั่วร่างกาย แล้วล้างเท้า\" ซึ่งได้กล่าวแล้วว่าอบูมุอาวิยะฮ์รายงานคนเดียวเรื่องการล้างเท้าหลังวุฎูอ์และตอนท้ายของการอาบน้ำ จึงอาจเป็นว่ารายงานนี้มีข้อบกพร่อง หรือตีความตามหะดีษมัยมูนะฮ์ คือคำว่า \"แล้วอาบน้ำละหมาดเพื่อละหมาด\" หมายถึงยกเว้นเท้า หรือตีความว่าทำได้ทั้งสองแบบ คือล้างเท้าพร้อมวุฎูอ์ หรือเลื่อนไปล้างทีหลัง"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "การบ้วนปากและสูดน้ำเข้าจมูกในการอาบน้ำ", "points_th": ["ในบริบทนี้ไม่ได้กล่าวถึงการบ้วนปากและการสูดน้ำเข้าจมูก แต่มีในหะดีษมัยมูนะฮ์ในอัลบุคอรีย์ว่า \"แล้วบ้วนปาก สูดน้ำเข้าจมูก แล้วล้างหน้า และราดน้ำบนศีรษะ\" ที่ชัดเจนคือทั้งสองอยู่ในความกว้างของคำว่า \"แล้วอาบน้ำละหมาดของท่านเพื่อละหมาด\"", "อิบนุบัฏฏอลยกว่ามีอิจญ์มาอ์ว่าวุฎูอ์ในการอาบน้ำญะนาบะฮ์ไม่วาญิบ และการบ้วนปากและสูดน้ำเข้าจมูกเป็นส่วนประกอบของวุฎูอ์ เมื่อวุฎูอ์ไม่วาญิบ ส่วนประกอบก็ไม่วาญิบด้วย แต่อิบนุหะญัรแย้งว่านักวิชาการกลุ่มหนึ่งเห็นว่าวาญิบ รวมทั้งอบูเษาร์และดาวูด อัซซอฮิรีย์ และตามที่อิบนุหะญัรระบุ หะนะฟีย์ก็ว่าการบ้วนปากและสูดน้ำเข้าจมูกวาญิบ เพราะการกระทำของท่าน ﷺ ซึ่งเป็นการอธิบายการอาบน้ำที่ถูกสั่งในอายะฮ์ \"และหากพวกเจ้ามีญะนาบะฮ์ ก็จงทำความสะอาด\" เชคอับดุลอะซีซ บินบาซเลือกทัศนะนี้"]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "ล้างร่างกายครั้งเดียว", "points_th": ["หะดีษเป็นหลักฐานว่าล้างร่างกายครั้งเดียวก็พอ ไม่ต้องซ้ำ ตามคำว่า \"แล้วราดน้ำทั่วร่างกายที่เหลือ\" ซึ่งไม่ได้จำกัดจำนวน จึงตีความตามจำนวนน้อยที่สุดที่เรียกได้ว่าราด คือครั้งเดียว เพราะหลักเดิมคือไม่เพิ่ม อัลบุคอรีย์ตั้งบทของหะดีษมัยมูนะฮ์ว่า \"บทการอาบน้ำครั้งเดียว\" ซึ่งมีคำว่า \"แล้วราดน้ำบนร่างกาย\"", "ที่รู้จักในมัซฮับฮัมบะลีย์คือล้างร่างกายสามครั้ง โดยเทียบกับอวัยวะวุฎูอ์ ซึ่งบัญญัติให้ล้างสามครั้ง", "ผู้แต่งเห็นว่าที่ถูกต้องคือทัศนะแรก คือไม่มีบัญญัติให้ล้างร่างกายสามครั้ง แต่ล้างครั้งเดียว อิบนุตัยมียะฮ์กล่าวว่า \"ผู้ที่รายงานการอาบน้ำของท่านนบี ﷺ เช่น อาอิชะฮ์และมัยมูนะฮ์ ไม่ได้รายงานว่าท่านล้างทั้งร่างกายสามครั้ง แต่กล่าวว่าหลังวุฎูอ์และสางโคนผม ท่านกอบน้ำราดศีรษะสามครั้ง และราดน้ำทั่วร่างกายหลังจากนั้น\" และผู้ที่ส่งเสริมให้ล้างสามครั้งก็เพียงเทียบกับวุฎูอ์ แต่ซุนนะฮ์แยกทั้งสองไว้ อัซซัรกะชีย์ว่า \"นี่เป็นความหมายตามตัวบทของหะดีษ\""]}, {"wajh": 7, "type": "fiqh", "heading_ar": null, "heading_th": "การเช็ดตัวด้วยผ้าหลังอาบน้ำ", "points_th": ["ผู้ที่ว่าส่งเสริมให้ไม่เช็ดตัวด้วยผ้าหลังอาบน้ำหรืออาบน้ำละหมาด ใช้หะดีษนี้เป็นหลักฐาน ตามคำว่า \"แล้วฉันนำผ้าเช็ดตัวมาให้ ท่านก็ไม่รับ\" และในอีกรายงานว่า \"นางยื่นผ้าให้ ท่านไม่รับ แล้วท่านเดินไปพลางสะบัดน้ำ\" และเพราะน้ำบนร่างกายหรืออวัยวะวุฎูอ์เป็นร่องรอยของอิบาดะฮ์ จึงควรคงไว้ ที่บ่งเช่นนั้นอีกคือหะดีษอบูฮุร็อยเราะฮ์ (ร.ฎ.) ว่า \"มีการอิกอมะฮ์ละหมาด และแถวถูกจัดตรงแล้ว ท่านรสูลุลลอฮ์ ﷺ ออกมาหาเรา เมื่อท่านยืนที่ที่ละหมาด ท่านนึกได้ว่ามีญะนาบะฮ์ จึงกล่าวแก่เราว่า อยู่ที่เดิม แล้วท่านกลับไปอาบน้ำ แล้วออกมาโดยศีรษะยังมีน้ำหยด แล้วตักบีร และเราละหมาดพร้อมท่าน\" (อัลบุคอรีย์ 640) คำว่า \"แล้วออกมาโดยศีรษะยังมีน้ำหยด\" บ่งว่าท่านไม่ได้เช็ดอะไร นี่เป็นทัศนะของชาฟิอีย์ตามทัศนะที่ถูกต้องในห้าแบบของพวกเขา", "นักวิชาการส่วนใหญ่ว่าการเช็ดตัวเป็นสิ่งอนุญาต ทำหรือไม่ทำเท่ากัน เพราะท่าน ﷺ สะบัดน้ำด้วยมือ และไม่มีใครตำหนิ ส่วนการที่ท่านไม่รับผ้าในหะดีษมัยมูนะฮ์ อิบนุหะญัรกล่าวว่าเป็นเหตุการณ์เฉพาะที่มีความเป็นไปได้หลายทาง อาจเป็นเพราะผ้า เช่น ไม่สะอาด หรือกลัวว่าน้ำจะทำให้ผ้าเปียกและไม่เหมาะ หรือเพราะท่านรีบ หรืออื่น ๆ ผู้แต่งเห็นว่าความเป็นไปได้แรก (ผ้าไม่สะอาด) ยังต้องพิจารณา", "นักวิชาการบางคนว่าหะดีษนี้เป็นหลักฐานว่าท่านเคยเช็ดตัว มิฉะนั้นนางก็จะไม่นำผ้ามาให้ อิบนุดะกีกิลอีดว่า \"การสะบัดน้ำด้วยมือบ่งว่าการเช็ดตัวไม่เป็นมักรูฮ์ เพราะทั้งสองเป็นการขจัดน้ำ\" ในอบูดาวูด หะดีษมัยมูนะฮ์ผ่านอัลอะอ์มัช จากสาลิม จากกุร็อยบ์ ตอนท้ายมีคำของอัลอะอ์มัชว่า \"ฉันเล่าเรื่องนี้ให้อิบรอฮีม (อันนะเคาะอีย์) ฟัง เขากล่าวว่า พวกเขาไม่เห็นว่าการใช้ผ้าเป็นปัญหา แต่ไม่ชอบที่จะทำเป็นนิสัย\" ความหมายคือสะลัฟไม่เห็นว่าการใช้ผ้าเป็นปัญหา แต่ไม่ชอบเพราะกลัวว่าจะเป็นนิสัยหลังวุฎูอ์"]}], "tags_th": ["ฆุสล์", "ญะนาบะฮ์", "วิธีอาบน้ำ", "การเช็ดตัว", "อาอิชะฮ์", "มัยมูนะฮ์"]}, {"id": "v2-h121", "volume": 2, "bab": "ghusl", "topic_ar": "حكم نقض المرأة شعرها في الغسل", "topic_th": "ข้อตัดสินการแก้มวยผมของผู้หญิงเมื่ออาบน้ำ", "pages": [54, 57], "hadith": [{"no": 121, "matn_ar": "وَعَنْ أُمِّ سَلَمَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: قُلْتُ: يَا رَسُولَ اللهِ، إِنِّي امْرَأَةٌ أَشُدُّ شَعْرَ رَأْسِي، أَفَأَنْقُضُهُ لِغُسْلِ الْجَنَابَةِ؟ وَفِي رِوَايَةٍ: وَالْحَيْضَةِ؟ فَقَالَ: «لَا، إِنَّمَا يَكْفِيكِ أَنْ تَحْثِي عَلَى رَأْسِكِ ثَلَاثَ حَثَيَاتٍ». رَوَاهُ مُسْلِمٌ.", "translation_th": "และจากอุมมุสะละมะฮ์ (ร.ฎ.) กล่าวว่า ฉันถามว่า \"โอ้ท่านรสูลุลลอฮ์ ฉันเป็นผู้หญิงที่ถักผมแน่น ฉันต้องแก้มันเพื่ออาบน้ำญะนาบะฮ์หรือไม่\" และในอีกรายงานว่า \"และ (อาบน้ำ) ประจำเดือน\" ท่านตอบว่า \"ไม่ เพียงพอแล้วที่เธอจะกอบน้ำราดศีรษะสามกอบ\" รายงานโดยมุสลิม", "grade_th": "ศ่อฮีห์ (มุสลิม) ส่วนคำว่า \"และประจำเดือน\" อิบนุลก็อยยิมและอัลอัลบานีย์ว่าไม่มะห์ฟูซ"}], "key_rulings_th": ["ผู้หญิงไม่ต้องแก้มวยผมเพื่ออาบน้ำญะนาบะฮ์ เพราะลำบาก แต่กอบน้ำราดศีรษะสามครั้งก็พอ โดยให้น้ำถึงโคนผม เป็นทัศนะของนักวิชาการส่วนใหญ่", "ส่วนการอาบน้ำประจำเดือนมีสองทัศนะ: ไม่ต้องแก้ (นักวิชาการส่วนใหญ่) และต้องแก้ (ที่รู้จักในมัซฮับอะห์มัด ซอฮิรีย์ อิบนุลก็อยยิมเลือก)", "ผู้แต่งเห็นว่าทัศนะแรกมีน้ำหนักกว่า คือไม่ต้องแก้มวยผมเมื่ออาบน้ำประจำเดือน เพราะหลักฐานแข็งแรงกว่า และอาอิชะฮ์ทักท้วงอับดุลลอฮ์ บินอัมรฺ", "ยกเว้นถ้าผมจับตัวแน่นจนน้ำไม่ถึงโคนผมด้วยการราด ก็ต้องแก้"], "vocab": [{"ar": "أَشُدُّ شَعْرَ رَأْسِي", "th": "ถักผมให้แน่น (สำนวนของมุสลิม: ฎ็อฟร์ รอซีย์ = ถักเปีย)"}, {"ar": "أَفَأَنْقُضُهُ", "th": "ฉันต้องแก้มันออกหรือไม่"}, {"ar": "تَحْثِي … حَثَيَاتٍ", "th": "กอบน้ำด้วยสองฝ่ามือ (หัษยะฮ์ = เต็มสองฝ่ามือ)"}, {"ar": "تُفِيضِينَ", "th": "ราดน้ำลงบนร่างกายจนไหล"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["มุสลิมบันทึก (330) ในหมวดประจำเดือน บทข้อตัดสินเปียผมของผู้หญิงที่อาบน้ำ ผ่านสุฟยาน บินอุยัยนะฮ์ จากอัยยูบ บินมูซา จากสะอีด บินอบีสะอีด อัลมักบุรีย์ จากอับดุลลอฮ์ บินรอฟิอ์ ผู้รับใช้ของอุมมุสะละมะฮ์ จากอุมมุสะละมะฮ์ว่า \"ฉันถามว่า โอ้ท่านรสูลุลลอฮ์ ฉันเป็นผู้หญิงที่ถักเปียผมแน่น ฉันต้องแก้มันเพื่ออาบน้ำญะนาบะฮ์หรือไม่ ท่านตอบว่า ไม่ เพียงพอแล้วที่เธอจะกอบน้ำราดศีรษะสามกอบ แล้วราดน้ำบนตัว เธอก็สะอาดแล้ว\"", "อีกรายงานในมุสลิมผ่านอับดุรร็อซซาก จากสุฟยาน อัษเษารีย์ จากอัยยูบ สำนวนว่า \"ฉันต้องแก้มันเพื่อ (อาบน้ำ) ประจำเดือนและญะนาบะฮ์หรือไม่ ท่านตอบว่า ไม่...\" อิบนุลก็อยยิมตัดสินว่ารายงานนี้ คือรายงานของอับดุรร็อซซากจากสุฟยาน อัษเษารีย์ ไม่มะห์ฟูซ และอัลอัลบานีย์ก็เห็นตาม เพราะอับดุรร็อซซากรายงานคนเดียวจากอัษเษารีย์ ยะซีด บินฮารูนรายงานจากอัษเษารีย์ และสุฟยาน บินอุยัยนะฮ์ และเราะห์วุ บินอัลกอสิม รายงานจากอัยยูบ บินมูซา โดยไม่มีคำว่า \"ประจำเดือน\" อิบนุลก็อยยิมกล่าวว่า \"ที่ถูกต้องในหะดีษอุมมุสะละมะฮ์คือกล่าวถึงเฉพาะญะนาบะฮ์ ไม่กล่าวถึงประจำเดือน คำว่าประจำเดือนไม่มะห์ฟูซ... รายงานของกลุ่มคนสมควรถูกต้องกว่า ถ้าไม่มีความขัดแย้งในรายงานของอัษเษารีย์ รายงานของอิบนุอุยัยนะฮ์และเราะห์วุก็มีน้ำหนักกว่า แล้วจะเป็นอย่างไรเมื่อยะซีด บินฮารูนรายงานจากเขาเหมือนรายงานของกลุ่ม\"", "มุสลิม (331) ยังบันทึกผ่านอิสมาอีล บินอุลัยยะฮ์ จากอัยยูบ จากอบุซซุบัยร์ จากอุบัยด์ บินอุมัยร์ว่า อาอิชะฮ์ (ร.ฎ.) ทราบว่าอับดุลลอฮ์ บินอัมรฺสั่งผู้หญิงให้แก้มวยผมเมื่ออาบน้ำ นางกล่าวว่า \"น่าแปลกใจอิบนุอัมรฺคนนี้ สั่งผู้หญิงให้แก้มวยผมเมื่ออาบน้ำ ทำไมไม่สั่งให้พวกนางโกนหัวไปเลย ฉันเคยอาบน้ำกับท่านรสูลุลลอฮ์ ﷺ จากภาชนะเดียวกัน และฉันไม่ได้ทำอะไรมากกว่าเทน้ำราดศีรษะสามครั้ง\""]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ฉันถักผมแน่น\" สำนวนของมุสลิมคือ \"ฎ็อฟร์ รอซีย์\" ดูเหมือนอิบนุหะญัรรายงานตามความหมาย ที่รู้จักกันคือ \"ฎ็อฟร์\" (ฟัตหะฮ์ที่ฎอด สุกูนที่ฟาอ์) ความหมายในที่นี้คือ ฉันถักผมแน่น ฎ็อฟร์ผมคือการถักผมโดยสานกัน หรือทำเป็นเปียสามเส้น เป็นการเรียกด้วยมัศดัร ทั้งยังอ่าน \"ฎุฟุร\" ได้ เป็นพหูพจน์ของ \"ฎ็อฟีเราะฮ์\" คือผมแต่ละปอยที่บิดหรือถักแยกกัน", "\"ฉันต้องแก้มัน\" สนับสนุนความหมายแรก และในอันนะสาอีย์และคนอื่นว่า \"ฉันต้องแก้พวกมัน\" สนับสนุนความหมายที่สองว่าเป็นพหูพจน์ของ ฎ็อฟีเราะฮ์", "\"ที่เธอจะกอบ... สามกอบ\" (ด้วยษาอ์) คือตักด้วยมือ หมายถึงกอบน้ำ ซึ่งคือเต็มสองฝ่ามือ ดังที่กล่าวแล้ว \"แล้วราด\" (ฎ็อมมะฮ์ที่ตาอ์) จากคำว่า อะฟาฎ็อลมาอ์ คือราดน้ำบนร่างกายจนไหล"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "การแก้มวยผมเมื่ออาบน้ำญะนาบะฮ์และประจำเดือน", "points_th": ["หะดีษเป็นหลักฐานว่าผู้หญิงไม่ต้องแก้มวยผมเพื่ออาบน้ำญะนาบะฮ์หรือประจำเดือน เพราะลำบาก โดยเฉพาะการอาบน้ำญะนาบะฮ์ แต่กอบน้ำราดศีรษะสามกอบก็พอ นี่เป็นทัศนะของนักวิชาการส่วนใหญ่ และเป็นรายงานหนึ่งจากอิมามอะห์มัด ซึ่งอัลมุวัฟฟัก อัลมัจญ์ และอับดุรเราะห์มาน บินกุดามะฮ์ผู้อธิบาย เลือก คือไม่ต้องแก้ทั้งในการอาบน้ำญะนาบะฮ์และประจำเดือน", "ใน \"อัชชัรห์อัลกะบีร\" ว่า \"ผู้หญิงไม่ต้องแก้มวยผมเพื่ออาบน้ำญะนาบะฮ์ เป็นรายงานเดียว เมื่อน้ำถึงโคนผม เราไม่รู้ว่ามีความขัดแย้ง นอกจากรายงานจากอิบนุอัมรฺ... และเป็นทัศนะของอันนะเคาะอีย์ และเราไม่รู้ว่ามีใครเห็นด้วยกับทั้งสอง\"", "ส่วนการแก้มวยผมเมื่ออาบน้ำประจำเดือนมีสองทัศนะ (1) ไม่ต้องแก้ เป็นมัซฮับของนักวิชาการส่วนใหญ่ รวมทั้งหะนะฟีย์ มาลิกีย์ ชาฟิอีย์ และฮัมบะลีย์ในทัศนะหนึ่ง โดยใช้หะดีษอุมมุสะละมะฮ์ (2) ต้องแก้ เป็นที่รู้จักในมัซฮับอิมามอะห์มัด เป็นทัศนะของซอฮิรีย์และมาลิกีย์บางคน และอิบนุลก็อยยิมเลือก พวกเขาใช้หะดีษอาอิชะฮ์ว่าท่านนบี ﷺ กล่าวแก่นางว่า \"จงแก้มวยผมและหวีผม\" (อัลบุคอรีย์ 316 มุสลิม 1211) และในอิบนุมาญะฮ์ว่า \"จงแก้มวยผมและอาบน้ำ\" อัลอัลบานีย์สงสัยคำว่า \"และอาบน้ำ\" เพราะในเศาะฮีห์ทั้งสองไม่มี หะดีษนี้แม้จะเป็นการอาบน้ำเพื่อครองเอียะห์รอม การที่สั่งให้แก้มวยผมในการอาบน้ำนี้ ซึ่งไม่ได้ขจัดฮะดัษของประจำเดือน ก็บ่งว่าการแก้มวยผมเมื่อขจัดฮะดัษยิ่งต้องทำ", "ผู้แต่งเห็นว่าทัศนะแรกมีน้ำหนักกว่า คือไม่ต้องแก้มวยผมเมื่ออาบน้ำประจำเดือน เพราะหลักฐานแข็งแรง ที่สนับสนุนคือการที่อาอิชะฮ์ (ร.ฎ.) ทักท้วงอับดุลลอฮ์ บินอัมรฺ ดังกล่าวแล้ว ซึ่งบ่งว่าไม่วาญิบ ยกเว้นกรณีที่ผมจับตัวแน่นจนน้ำไม่ถึงโคนผมด้วยการราด ก็วาญิบต้องแก้", "ส่วนหลักฐานของทัศนะที่สอง หะดีษอาอิชะฮ์ในรายงานของเศาะฮีห์ทั้งสองไม่มีคำสั่งให้อาบน้ำ และหากยอมรับว่ามีคำสั่งให้อาบน้ำ ก็ไม่ใช่หลักฐาน เพราะไม่ใช่การอาบน้ำชำระประจำเดือน แต่นางถูกสั่งให้อาบน้ำขณะมีประจำเดือนเพื่อครองเอียะห์รอมหัจญ์ ตามคำของนาง \"วันอะเราะฟะฮ์มาถึงขณะที่ฉันมีประจำเดือน ฉันจึงบอกท่านนบี ﷺ ท่านกล่าวว่า จงละอุมเราะฮ์ของเธอ แก้มวยผมและหวีผม\" และหากคำสั่งยืนยันได้ ก็ตีความว่าเป็นการส่งเสริม เพื่อรวมกับหะดีษของนาง (อาอิชะฮ์) ในบทนี้", "วิทยปัญญาของการแยกระหว่างญะนาบะฮ์กับประจำเดือน ตามผู้ที่มีทัศนะเช่นนั้น คือหลักเดิมคือวาญิบต้องแก้มวยผม เพื่อให้แน่ใจว่าน้ำถึงสิ่งที่ต้องล้าง แต่ได้รับการผ่อนผันในการอาบน้ำญะนาบะฮ์ เพราะเกิดบ่อยจึงลำบาก ต่างจากประจำเดือนที่โดยทั่วไปเกิดเดือนละครั้ง จึงไม่ลำบากที่จะแก้ หุก่มจึงคงไว้ตามหลักเดิม คือวาญิบ"]}], "tags_th": ["ฆุสล์", "สตรี", "ผม", "ประจำเดือน", "ญะนาบะฮ์"]}, {"id": "v2-h122", "volume": 2, "bab": "ghusl", "topic_ar": "تحريم المسجد على الحائض والجنب", "topic_th": "การห้ามหญิงมีประจำเดือนและผู้มีญะนาบะฮ์อยู่ในมัสยิด", "pages": [58, 63], "hadith": [{"no": 122, "matn_ar": "وَعَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: قَالَ رَسُولُ اللهِ ﷺ: «إِنِّي لَا أُحِلُّ الْمَسْجِدَ لِحَائِضٍ وَلَا جُنُبٍ». رَوَاهُ أَبُو دَاوُدَ، وَصَحَّحَهُ ابْنُ خُزَيْمَةَ.", "translation_th": "และจากอาอิชะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"แท้จริงฉันไม่อนุญาตมัสยิดแก่หญิงมีประจำเดือนและผู้มีญะนาบะฮ์\" รายงานโดยอบูดาวูด และอิบนุคุซัยมะฮ์ตัดสินว่าศ่อฮีห์", "grade_th": "ฎออีฟ (อ่อน) ตามที่ผู้แต่งสรุป เพราะญัสเราะฮ์ บินติดะญาญะฮ์ อิบนุคุซัยมะฮ์และอัชเชากานีย์ว่าศ่อฮีห์ อิบนุลก็อฏฏอนและอัซซัยละอีย์ว่าหะซัน เชคอิบนุบาซว่าสายไม่มีปัญหา"}], "key_rulings_th": ["นักวิชาการส่วนใหญ่ (หะนะฟีย์ มาลิกีย์ ชาฟิอีย์ และฮัมบะลีย์สำหรับหญิงมีประจำเดือน) ว่าหะรอมที่ผู้มีญะนาบะฮ์ หญิงมีประจำเดือน และหญิงหลังคลอด จะอยู่ในมัสยิด โดยอ้างอายะฮ์ \"...และอย่าเข้าใกล้ (ที่ละหมาด) ขณะมีญะนาบะฮ์ นอกจากผู้ที่ผ่านทาง\" (อันนิสาอ์: 43)", "อีกทัศนะว่าอนุญาตทั้งหมด (อิบนุหัซม์ ดาวูด อิบนุลมุนซิร อัลมุซะนีย์) และทัศนะที่สามว่าผู้มีญะนาบะฮ์อยู่ได้ถ้าอาบน้ำละหมาดแล้ว (อะห์มัด อิบนุตัยมียะฮ์)", "ผู้แต่งเห็นว่าหะดีษนี้อ่อน และสำหรับหญิงมีประจำเดือน ไม่มีหลักฐานห้ามนอกจากหะดีษนี้ และการเทียบกับผู้มีญะนาบะฮ์ยังต้องพิจารณา นางจึงอยู่ในมัสยิดได้ โดยระวังไม่ให้มัสยิดเปื้อน (บางคนจำกัดเฉพาะเมื่อจำเป็น เช่น มาลิกีย์และอิบนุตัยมียะฮ์)", "การเดินผ่านมัสยิด หรือหยิบของจากมัสยิด เช่น ผ้าปูละหมาดหรือหนังสือ อนุญาตสำหรับหญิงมีประจำเดือน ตามหะดีษ \"ประจำเดือนของเธอไม่ได้อยู่ในมือของเธอ\""], "vocab": [{"ar": "لَا أُحِلُّ الْمَسْجِدَ", "th": "ไม่อนุญาตให้อยู่ในมัสยิด"}, {"ar": "عَابِرِي سَبِيلٍ", "th": "ผู้ที่ผ่านทาง (ตามทัศนะหนึ่งคือเดินผ่านมัสยิดเพื่อออกไป อีกทัศนะคือผู้เดินทาง)"}, {"ar": "الْخُمْرَةُ", "th": "ผ้าปูละหมาด เรียกเช่นนี้เพราะปิดหน้า"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อบูดาวูดบันทึก (232) ในหมวดความสะอาด บทผู้มีญะนาบะฮ์เข้ามัสยิด และอิบนุคุซัยมะฮ์ (1327) ผ่านอับดุลวาหิด บินซิยาด จากอัลอัฟลัต บินเคาะลีฟะฮ์ ว่า ญัสเราะฮ์ บินติดะญาญะฮ์เล่าว่า นางได้ยินอาอิชะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ มา ขณะที่ประตูบ้านของเศาะหาบะฮ์บางคนเปิดเข้ามัสยิด ท่านกล่าวว่า \"จงหันประตูบ้านเหล่านี้ออกจากมัสยิด\" แล้วท่านเข้าไป และคนเหล่านั้นยังไม่ได้ทำอะไร หวังว่าจะมีการผ่อนปรนลงมา ท่านออกมาหาพวกเขาอีก และกล่าวว่า \"จงหันประตูบ้านเหล่านี้ออกจากมัสยิด เพราะฉันไม่อนุญาตมัสยิดแก่หญิงมีประจำเดือนและผู้มีญะนาบะฮ์\"", "นักวิชาการขัดแย้งเรื่องความถูกต้องและการใช้เป็นหลักฐาน อิบนุคุซัยมะฮ์ว่าศ่อฮีห์ อิบนุลก็อฏฏอนและอัซซัยละอีย์ว่าหะซัน อัชเชากานีย์ว่าศ่อฮีห์ อิบนุหะญัรยกการตัดสินว่าศ่อฮีห์ของอิบนุคุซัยมะฮ์ จึงดูเหมือนเอียงไปทางศ่อฮีห์ และเชคอับดุลอะซีซ บินบาซว่า \"สายไม่มีปัญหา\" แต่อีกกลุ่มว่าอ่อน รวมทั้งอัลบัยฮะกีย์ (\"ไม่แข็งแรง\") อับดุลหักก์ (\"ไม่ยืนยัน\") และอิบนุหัซม์ถึงกับว่า \"เป็นโมฆะ\"", "เพราะหะดีษขึ้นอยู่กับญัสเราะฮ์ บินติดะญาญะฮ์ ผู้ที่นักวิชาการที่น่าเชื่อถือไม่ได้ว่าเชื่อถือได้ อิบนุหิบบานและอัลอิจลีย์ว่าเชื่อถือได้ อัลบุคอรีย์ว่า \"ญัสเราะฮ์มีเรื่องแปลก ๆ\" ซึ่งบ่งว่าอ่อน อัดดารุกุฏนีย์ว่า \"ใช้หะดีษของนางประกอบได้ เว้นแต่ผู้ที่ถูกทิ้งรายงานจากนาง\" อีกทั้งนางสับสนในการรายงาน บางครั้งว่าจากอาอิชะฮ์ บางครั้งว่าจากอุมมุสะละมะฮ์ (อิบนุมาญะฮ์ 645) ซึ่งทำให้หะดีษอ่อน เพราะบ่งว่าผู้รายงานไม่แม่นยำ และหะดีษของนางยังขัดกับหะดีษของผู้เชื่อถือได้เรื่องการปิดประตูไปมัสยิด อุรวะฮ์และอับบาด บินอับดิลลาฮ์รายงานจากอาอิชะฮ์ จากท่านนบี ﷺ ว่า \"จงปิดประตูเหล่านี้ นอกจากประตูของอบูบักร\" อัลบุคอรีย์ว่า \"นี่ถูกต้องกว่า\"", "ผู้แต่งสรุปว่านี่คือข้อบกพร่องที่ทำให้หะดีษนี้อ่อน ส่วนการที่บางคนว่าอ่อนเพราะอัฟลัต บินเคาะลีฟะฮ์ว่าไม่เป็นที่รู้จัก ดังที่อิบนุหัซม์และคนอื่นกล่าว ไม่ถูกต้อง เพราะสุฟยาน อัษเษารีย์และอับดุลวาหิด บินซิยาดรายงานจากเขา อะห์มัดว่า \"ฉันไม่เห็นว่าเขามีปัญหา\" อบูหาติม อัรรอซีย์ว่า \"ชัยค์\" และอัลบุคอรีย์ระบุว่าเขาได้ยินจากญัสเราะฮ์ ส่วนคำของอิบนุลก็อฏฏอนว่า คำของอัลบุคอรีย์ที่ว่าญัสเราะฮ์มีเรื่องแปลก ๆ ไม่เพียงพอที่จะตัดหะดีษที่นางรายงาน ผู้แต่งเห็นว่ายังต้องพิจารณา เพราะความสับสนในการรายงาน การรายงานหะดีษนี้คนเดียวจากอาอิชะฮ์โดยไม่มีศิษย์อาวุโสของอาอิชะฮ์รายงาน และการที่หะดีษของนางขัดกับสิ่งที่อัลบุคอรีย์กล่าว ล้วนเป็นสิ่งบ่งชี้ที่ทำให้หะดีษอ่อน"]}, {"wajh": 2, "type": "fiqh", "heading_ar": null, "heading_th": "การอยู่ในมัสยิดของผู้มีญะนาบะฮ์และหญิงมีประจำเดือน", "points_th": ["ผู้ที่ว่าหะรอมที่ผู้มีญะนาบะฮ์และหญิงมีประจำเดือนจะอยู่ในมัสยิด ใช้หะดีษนี้เป็นหลักฐาน หญิงหลังคลอดก็เช่นเดียวกับหญิงมีประจำเดือน นี่เป็นมัซฮับของนักวิชาการส่วนใหญ่ ได้แก่ หะนะฟีย์ มาลิกีย์ ชาฟิอีย์ และฮัมบะลีย์สำหรับหญิงมีประจำเดือน หลักฐานอื่นคืออายะฮ์ \"โอ้บรรดาผู้ศรัทธา อย่าเข้าใกล้การละหมาดขณะที่พวกเจ้ามึนเมา จนกว่าพวกเจ้าจะรู้ว่าพวกเจ้าพูดอะไร และอย่า (เข้าใกล้) ขณะมีญะนาบะฮ์ นอกจากผู้ที่ผ่านทาง จนกว่าพวกเจ้าจะอาบน้ำ\" (อันนิสาอ์: 43) พวกเขากล่าวว่า การละหมาดในที่นี้หมายถึงที่ละหมาด คือมัสยิด ความหมายคือ อย่าเข้าใกล้ที่ละหมาดขณะมึนเมา และอย่าเข้าใกล้ขณะมีญะนาบะฮ์จนกว่าจะอาบน้ำ นอกจากผู้ที่ผ่านทางเพื่อออกไป", "เหมือนกับว่าอัลลอฮ์ทรงห้ามการละหมาดในสภาพบกพร่องที่ขัดกับจุดประสงค์ และห้ามเข้าไปในที่ละหมาดในสภาพบกพร่อง คือญะนาบะฮ์ ซึ่งห่างไกลจากละหมาดและที่ละหมาด มีรายงานจากอิบนุมัสอูดและอิบนุอับบาส (ร.ฎ.) ด้วยสายที่ถูกวิจารณ์ และยืนยันได้ว่าตาบิอีนกลุ่มหนึ่งตีความเช่นนี้ เช่น สะอีด บินอัลมุซัยยิบ อัลหะสัน อัลบัศรีย์ อิบรอฮีม อันนะเคาะอีย์ และอัชชาฟิอีย์ อิบนุญะรีรและอิบนุกะษีรเห็นว่ามีน้ำหนักกว่า (อิบนุกะษีรว่า \"เป็นความหมายที่ชัดเจนของอายะฮ์\") อัลกุรฏุบีย์และอัชเชากานีย์เอียงไปทางนี้ พวกเขากล่าวว่า อายะฮ์ไม่ได้หมายถึงละหมาด และคำว่า \"นอกจากผู้ที่ผ่านทาง\" ก็ไม่ได้หมายถึงผู้เดินทาง เพราะตะยัมมุมไม่ได้เฉพาะผู้เดินทาง และเพราะหุก่มของผู้เดินทางมีกล่าวในตอนท้ายอายะฮ์ \"และหากพวกเจ้าป่วย หรืออยู่ในการเดินทาง\" แต่การตีความนี้ถูกต้องจากอิบนุอับบาส (ร.ฎ.) และตาบิอีนกลุ่มหนึ่ง และอิบนุตัยมียะฮ์เห็นว่าการห้ามในอายะฮ์ครอบคลุมทั้งการเข้าใกล้ละหมาดและที่ละหมาด", "นักวิชาการส่วนใหญ่กล่าวว่า หญิงมีประจำเดือนเทียบกับผู้มีญะนาบะฮ์ เมื่อผู้มีญะนาบะฮ์ถูกห้ามเข้าใกล้ที่ละหมาด นางก็ยิ่งควรถูกห้าม เพราะฮะดัษของนางหนักกว่า ห้ามการถือศีลอดและละหมาดก็ตก ส่วนผู้มีญะนาบะฮ์ยังถูกสั่งให้ถือศีลอด และถูกสั่งให้ละหมาดเมื่อสะอาด", "ทัศนะที่สอง: ผู้มีญะนาบะฮ์ หญิงมีประจำเดือน และหญิงหลังคลอด เข้าและอยู่ในมัสยิดได้ เป็นทัศนะของอิบนุหัซม์ ซึ่งระบุว่าเป็นทัศนะของดาวูด และเป็นทัศนะของอิบนุลมุนซิรและอัลมุซะนีย์ หลักฐาน (1) หลักเดิมของสิ่งทั้งหลายคือการอนุญาต ไม่ใช่การห้าม และผู้ที่ห้ามมัสยิดแก่ผู้ที่กล่าวถึงไม่มีหลักฐานที่ถูกต้อง (2) มีรายงานจากอาอิชะฮ์ (ร.ฎ.) ว่าทาสหญิงผิวดำคนหนึ่งของเผ่าอาหรับ ถูกปลดปล่อย มาหาท่านรสูลุลลอฮ์ ﷺ และรับอิสลาม นางมีกระโจมหรือเพิงเล็ก ๆ ในมัสยิด (อัลบุคอรีย์ 439 อิบนุคุซัยมะฮ์ จะกล่าวในหะดีษที่ 261) อิบนุหัซม์ว่า \"นี่คือผู้หญิงที่อาศัยในมัสยิดของท่านนบี ﷺ และเป็นที่รู้กันว่าผู้หญิงมีประจำเดือน ท่าน ﷺ ไม่ได้ห้ามนาง และสิ่งใดที่ท่านไม่ได้ห้าม ก็อนุญาต\" (3) ชาวศุฟฟะฮ์นอนในมัสยิด อัลบุคอรีย์ตั้งบทว่า \"บทการนอนของผู้ชายในมัสยิด\" โดยเฉพาะผู้ที่อยู่ประจำ ย่อมไม่พ้นจากการฝันเปียก", "ทัศนะที่สาม: ผู้มีญะนาบะฮ์เท่านั้นที่อยู่ในมัสยิดได้ ถ้าอาบน้ำละหมาดแล้ว เป็นทัศนะของอิมามอะห์มัด และอิบนุตัยมียะฮ์เลือก ตามที่สะอีด บินมันศูรบันทึกจากอะฏออ์ บินยะสารว่า \"ฉันเห็นชายหลายคนในเศาะหาบะฮ์ของท่านนบี ﷺ นั่งในมัสยิด ขณะที่มีญะนาบะฮ์ เมื่อพวกเขาอาบน้ำละหมาดเหมือนเพื่อละหมาด\" (สายหะซัน) และหันบัล บินอิสหากรายงานจากซัยด์ บินอัสลัมว่า \"เศาะหาบะฮ์ของท่านรสูลุลลอฮ์ ﷺ สนทนากันในมัสยิดขณะที่ไม่มีวุฎูอ์ และบางคนมีญะนาบะฮ์ ก็อาบน้ำละหมาด แล้วเข้ามัสยิดและสนทนา\" และเพราะวุฎูอ์ทำให้ฮะดัษเบาลง จึงหมดสิ่งที่ห้ามบางส่วน ดังกล่าวแล้วเรื่องผู้มีญะนาบะฮ์ที่ต้องการนอน แต่ผู้แต่งตั้งข้อสังเกตว่าเรื่องราวจากเศาะหาบะฮ์นี้เป็นการเล่าการกระทำ และการกระทำล้วน ๆ ของท่านรสูล ﷺ ยังไม่บ่งถึงความวาญิบ แล้วการกระทำของคนอื่นจะบ่งได้อย่างไร ดังที่รู้กันในอุศูล", "สาเหตุของความขัดแย้งมีสองเรื่อง (1) ความขัดแย้งในการตีความอายะฮ์ข้างต้น ว่าห้ามละหมาด และผู้ผ่านทางคือผู้เดินทาง หรือหมายถึงที่ละหมาด และผู้ผ่านทางคือผู้เดินผ่านมัสยิดเพื่อออกไป (2) ความขัดแย้งว่าหะดีษศ่อฮีห์หรืออ่อน นักวิชาการส่วนใหญ่ว่าผู้มีญะนาบะฮ์ไม่อยู่ในมัสยิด โดยอ้างอายะฮ์ว่าหมายถึงที่ละหมาดคือมัสยิด ตามที่อิบนุญะรีรและอิบนุกะษีรเห็นว่ามีน้ำหนักกว่า และถือหะดีษนี้ตามทัศนะผู้ที่ว่าศ่อฮีห์ ส่วนตามการตีความแรก คือการละหมาดคงความหมายตามจริง ความหมายคือ อย่าละหมาดขณะมึนเมา และอย่าละหมาดขณะมีญะนาบะฮ์ นอกจากในสภาพเดินทาง จนกว่าจะอาบน้ำ ตามนี้ในอายะฮ์ก็ไม่มีหลักฐานห้ามผู้มีญะนาบะฮ์เข้าและอยู่ในมัสยิด เหลือเพียงหะดีษของบท ซึ่งรู้แล้วว่ามีอะไร", "ส่วนหญิงมีประจำเดือน ไม่มีหลักฐานห้ามนางจากมัสยิดนอกจากหะดีษของบท ส่วนการเทียบนางกับผู้มีญะนาบะฮ์ยังต้องพิจารณา เพราะมีความต่าง คือผู้มีญะนาบะฮ์สามารถทำความสะอาดได้ แต่นางทำไม่ได้ ผู้แต่งจึงเห็นว่านางอยู่ในมัสยิดได้ และต้องระวังไม่ให้มัสยิดเปื้อนสิ่งสกปรก เพราะหลักฐานเรื่องการรักษาความสะอาดของมัสยิดที่จะกล่าวต่อไป นักวิชาการบางคนจำกัดการอยู่ของนางเฉพาะเมื่อจำเป็น ซึ่งเป็นทัศนะของมาลิกีย์และอิบนุตัยมียะฮ์ เช่น ถ้านางกลัวว่าจะมีคนฆ่าถ้าไม่เข้ามัสยิด หรืออากาศหนาวจัด หรือฝนตก หรือทำนองนั้น", "ส่วนการเดินผ่านมัสยิด หรือหยิบบางสิ่งจากมัสยิด เช่น ผ้าปูละหมาดหรือหนังสือ ก็อนุญาต ตามหะดีษอาอิชะฮ์ (ร.ฎ.) ว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวแก่ฉันว่า \"จงหยิบผ้าปูละหมาดจากมัสยิดมาให้ฉัน\" ฉันกล่าวว่า \"ฉันมีประจำเดือน\" ท่านตอบว่า \"ประจำเดือนของเธอไม่ได้อยู่ในมือของเธอ\" (มุสลิม 298) \"อัลคุมเราะฮ์\" คือผ้าปูละหมาด เรียกเช่นนี้เพราะปิดหน้า"]}], "tags_th": ["มัสยิด", "ญะนาบะฮ์", "ประจำเดือน", "หะดีษอ่อน", "อายะฮ์อันนิสาอ์ 43"]}, {"id": "v2-h123", "volume": 2, "bab": "ghusl", "topic_ar": "حكم غسل الرجل مع امرأته من إناء واحد", "topic_th": "ข้อตัดสินการอาบน้ำของสามีกับภรรยาจากภาชนะเดียวกัน", "pages": [64, 66], "hadith": [{"no": 123, "matn_ar": "وَعَنْهَا قَالَتْ: كُنْتُ أَغْتَسِلُ أَنَا وَرَسُولُ اللهِ ﷺ مِنْ إِنَاءٍ وَاحِدٍ، تَخْتَلِفُ أَيْدِينَا فِيهِ مِنَ الْجَنَابَةِ. مُتَّفَقٌ عَلَيْهِ، زَادَ ابْنُ حِبَّانَ: وَتَلْتَقِي.", "translation_th": "และจากนาง (อาอิชะฮ์ (ร.ฎ.)) กล่าวว่า ฉันกับท่านรสูลุลลอฮ์ ﷺ เคยอาบน้ำชำระญะนาบะฮ์จากภาชนะเดียวกัน มือของเราผลัดกันตักน้ำในภาชนะนั้น บันทึกโดยอัลบุคอรีย์และมุสลิม อิบนุหิบบานเพิ่มว่า \"และ (มือของเรา) พบกัน\"", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม) ส่วนเพิ่มของอิบนุหิบบานสายศ่อฮีห์ แต่อิบนุหะญัรชี้ว่าอาจเป็นคำที่ผู้รายงานแทรก"}], "key_rulings_th": ["อนุญาตให้สามีภรรยาอาบน้ำจากภาชนะเดียวกัน และไม่มีผลต่อความสะอาดของน้ำ", "อนุญาตให้สามีภรรยาเห็นเอาเราะฮ์ของกันและกัน ตามอายะฮ์ \"...นอกจากต่อภรรยาของพวกเขา หรือทาสหญิงของพวกเขา\" (อัลมะอาริจ: 29–30)", "การที่ผู้มีญะนาบะฮ์จุ่มมือลงในภาชนะน้ำที่ใช้อาบ ไม่ทำให้น้ำเสียความเป็นฏอฮูร ถ้ามือไม่มีสิ่งสกปรก เพราะอวัยวะของผู้มีญะนาบะฮ์ไม่ใช่นะญิส"], "vocab": [{"ar": "تَخْتَلِفُ أَيْدِينَا فِيهِ", "th": "มือของเราผลัดกันตักน้ำในภาชนะ คนหนึ่งตักหลังอีกคน"}, {"ar": "تَلْتَقِي", "th": "มือของเราพบกันขณะตักน้ำจากภาชนะ"}, {"ar": "الْفَرَقُ", "th": "ภาชนะขนาดสามศออ์ (ตามสุฟยาน)"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกในหมวดการอาบน้ำ บทการอาบน้ำของสามีกับภรรยา และบท \"ผู้มีญะนาบะฮ์จุ่มมือลงในภาชนะก่อนล้างได้หรือไม่\" (261) และมุสลิม (321) (45) ผ่านอับดุลลอฮ์ บินมัสละมะฮ์ จากอัฟละห์ บินหุมัยด์ จากอัลกอสิม บินมุหัมมัด จากอาอิชะฮ์ สำนวนเป็นของมุสลิม เพราะในอัลบุคอรีย์ไม่มีคำว่า \"จากญะนาบะฮ์\"", "อิบนุหิบบานบันทึก (3/395) ผ่านอิบนุวะฮ์บ จากอัฟละห์ด้วยสายนี้ สำนวนว่า \"ฉันได้ยินอาอิชะฮ์กล่าวว่า ฉันเคยอาบน้ำกับท่านรสูลุลลอฮ์ ﷺ จากภาชนะเดียวกัน มือของเราผลัดกันและพบกันในภาชนะ\" สายศ่อฮีห์ อิบนุหะญัรกล่าวว่า \"ของอัลอิสมาอีลีย์ผ่านอิสหาก บินสุลัยมาน จากอัฟละห์ว่า มือของเราผลัดกัน คือจนพบกัน และของอัลบัยฮะกีย์ว่า มือของเราผลัดกัน คือพบกัน ซึ่งบ่งว่าคำว่า และพบกัน เป็นคำที่ผู้รายงานแทรก... ผู้รายงานอาจกล่าวตามความหมาย\""]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ฉันกับท่านรสูลุลลอฮ์ ﷺ เคยอาบน้ำ\" คำว่า \"รสูลุลลอฮ์\" อ่านเป็นนัศบ์ในฐานะ \"มัฟอูล มะอะฮ์\" ได้ หรืออ่านเป็นร็อฟอ์โดยเชื่อมกับสรรพนามที่ซ่อนใน \"อัฆตะสิลุ\" ซึ่งดีกว่า เพราะการเชื่อมกับสรรพนามที่ซ่อนโดยมีสรรพนามแยกคั่นเป็นสำนวนที่แข็งแรง และในนั้นเป็นการให้ผู้พูดนำหน้าผู้ที่ไม่อยู่ เป็นการบอกว่าผู้หญิงเป็นที่ของอารมณ์และเป็นผู้ที่ทำให้ต้องอาบน้ำ นางจึงเหมือนเป็นหลักในเรื่องนี้", "\"มือของเราผลัดกันในภาชนะ\" อัลอิคติลาฟตรงข้ามกับความพร้อมกัน ความหมายคือแต่ละคนจุ่มมือตักน้ำจากภาชนะหลังอีกคน แต่ละคนจึงอาบด้วยน้ำที่เหลือจากอีกคน ในบางรายงานของอัลบุคอรีย์และมุสลิมว่า \"จากภาชนะเดียว คือถ้วยที่เรียกว่า อัลฟะร็อก\" สุฟยานว่า \"อัลฟะร็อกคือสามศออ์\" \"จากญะนาบะฮ์\" เกี่ยวกับกริยา \"อาบน้ำ\" และ \"มิน\" บอกเหตุ \"และพบกัน\" คือมือทั้งสองรวมกันขณะตักน้ำจากภาชนะ"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "สามีภรรยาอาบน้ำร่วมภาชนะ", "points_th": ["หะดีษเป็นหลักฐานว่าอนุญาตให้ชายอาบน้ำกับภรรยาจากภาชนะเดียวกัน และไม่มีผลต่อความสะอาดของน้ำ และอนุญาตให้แต่ละคนเห็นเอาเราะฮ์ของอีกคน ที่บ่งเช่นนั้นอีกคืออายะฮ์ \"และบรรดาผู้ที่รักษาอวัยวะเพศของพวกเขา นอกจากต่อภรรยาของพวกเขา หรือทาสหญิงที่มือขวาของพวกเขาครอบครอง แท้จริงพวกเขาไม่ถูกตำหนิ\" (อัลมะอาริจ: 29–30)"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "ผู้มีญะนาบะฮ์จุ่มมือลงในภาชนะ", "points_th": ["หะดีษบ่งว่าการที่ผู้มีญะนาบะฮ์จุ่มมือลงในภาชนะที่มีน้ำสำหรับอาบ ไม่ทำให้น้ำหมดความเป็นฏอฮูร เพราะถ้ามือสะอาด ไม่มีสิ่งสกปรก ก็จุ่มลงในภาชนะได้ เพราะไม่มีอวัยวะใดของผู้มีญะนาบะฮ์เป็นนะญิสเพราะเขามีญะนาบะฮ์ ถ้าญะนาบะฮ์เกี่ยวโยงกับน้ำในทางหุก่ม ก็จะไม่อนุญาตให้ผู้มีญะนาบะฮ์จุ่มมือลงในภาชนะจนกว่าความสะอาดจะสมบูรณ์และฮะดัษของญะนาบะฮ์จะหมดไป เมื่ออนุญาตให้จุ่มมือระหว่างการอาบน้ำ ก็รู้ได้ว่าญะนาบะฮ์ไม่มีผลเมื่อสัมผัสน้ำด้วยมือ จึงไม่มีอะไรห้ามการจุ่มตอนแรก เหมือนการจุ่มตอนกลาง", "อามิร อัชชะอ์บีย์กล่าวว่า \"เศาะหาบะฮ์ของท่านรสูลุลลอฮ์ ﷺ จุ่มมือลงในภาชนะขณะมีญะนาบะฮ์ และผู้หญิงขณะมีประจำเดือน โดยไม่เห็นว่าเป็นปัญหา คือก่อนจะล้างมือ\" (อิบนุอบีชัยบะฮ์ และอัลบุคอรีย์ยกแบบตะอ์ลีก)"]}], "tags_th": ["ฆุสล์", "สามีภรรยา", "ภาชนะ", "ญะนาบะฮ์", "เอาเราะฮ์"]}, {"id": "v2-h124-125", "volume": 2, "bab": "ghusl", "topic_ar": "وجوب العناية بغسل الجنابة", "topic_th": "วาญิบต้องใส่ใจการอาบน้ำชำระญะนาบะฮ์", "pages": [67, 69], "hadith": [{"no": 124, "matn_ar": "وَعَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «إِنَّ تَحْتَ كُلِّ شَعَرَةٍ جَنَابَةً، فَاغْسِلُوا الشَّعَرَ، وَأَنْقُوا الْبَشَرَ». رَوَاهُ أَبُو دَاوُدَ، وَالتِّرْمِذِيُّ وَضَعَّفَاهُ.", "translation_th": "และจากอบูฮุร็อยเราะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"แท้จริงใต้เส้นผมทุกเส้นมีญะนาบะฮ์ ดังนั้นจงล้างผม และทำความสะอาดผิวหนังให้หมดจด\" รายงานโดยอบูดาวูดและอัตติรมิซีย์ และทั้งสองว่าอ่อน", "grade_th": "ฎออีฟ (อ่อน) เพราะอัลหาริษ บินวะญีฮ์อ่อนและรายงานคนเดียว อบูหาติมว่ามุนกัร"}, {"no": 125, "matn_ar": "وَلِأَحْمَدَ عَنْ عَائِشَةَ نَحْوُهُ، وَفِيهِ رَاوٍ مَجْهُولٌ.", "translation_th": "และของอะห์มัด จากอาอิชะฮ์ ทำนองเดียวกัน และในสายมีผู้รายงานที่ไม่เป็นที่รู้จัก", "grade_th": "ฎออีฟ (อ่อน) มีชายที่ไม่ระบุชื่อ และชะรีกกับคุศ็อยฟ์ความจำไม่ดี"}], "key_rulings_th": ["วาญิบต้องอาบน้ำเพราะญะนาบะฮ์ ให้น้ำทั่วร่างกาย และขจัดทุกสิ่งที่กั้นน้ำไม่ให้ถึงผิวหนัง ความสะอาดไม่สมบูรณ์ถ้าเหลือส่วนใดของร่างกายแม้เล็กน้อย", "แม้หะดีษจะอ่อน แต่ความหมายถูกต้อง อัลกุรอานบ่งตามนั้น \"และหากพวกเจ้ามีญะนาบะฮ์ ก็จงทำความสะอาด\" (อัลมาอิดะฮ์: 6)", "ผู้ที่มีเฝือก ล้างส่วนนอกก็พอถ้าทำได้ ถ้าไม่ได้ก็เช็ด ถ้าเป็นแผลที่ไม่มีอะไรปิดและน้ำเป็นอันตราย ให้ตะยัมมุม", "เมื่อญะนาบะฮ์ครอบคลุมทั้งร่างกาย ความสะอาดก็ต้องครอบคลุมทั้งร่างกาย เพราะความสุขขณะร่วมประเวณีทั่วทั้งร่างกาย"], "vocab": [{"ar": "إِنَّ تَحْتَ كُلِّ شَعَرَةٍ جَنَابَةً", "th": "คำเลี่ยงหมายถึงญะนาบะฮ์ครอบคลุมผิวกายทั้งหมด ซึ่งปกติเป็นที่ที่มีขน"}, {"ar": "أَنْقُوا", "th": "ทำให้สะอาดหมดจด"}, {"ar": "الْبَشَرُ", "th": "ผิวหนังภายนอก เอกพจน์คือ บะชะเราะฮ์"}, {"ar": "أَجْمَرْتُ شَعْرِي", "th": "รวบและถักผมไว้"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجهما", "heading_th": "ที่มาของหะดีษ", "points_th": ["หะดีษแรก: อบูดาวูดบันทึกในหมวดความสะอาด บทการอาบน้ำญะนาบะฮ์ (248) อัตติรมิซีย์ (106) และอิบนุมาญะฮ์ (597) ผ่านนัศร์ บินอะลี จากอัลหาริษ บินวะญีฮ์ จากมาลิก บินดีนาร จากมุหัมมัด บินสีรีน จากอบูฮุร็อยเราะฮ์ แบบมัรฟูอ์ อบูดาวูดว่า \"อัลหาริษ บินวะญีฮ์ หะดีษของเขามุนกัร และเขาอ่อน\" อัตติรมิซีย์ว่า \"หะดีษของอัลหาริษ บินวะญีฮ์เป็นเฆาะรีบ เราไม่รู้จักนอกจากจากหะดีษของเขา และเขาไม่ใช่ชัยค์ที่ดี... และเขารายงานหะดีษนี้คนเดียวจากมาลิก บินดีนาร\"", "นักวิชาการถือว่าหะดีษนี้อ่อน เพราะผู้รายงานคืออัลหาริษ บินวะญีฮ์ อัรรอสิบีย์อ่อน ในหนังสือหกเล่มเขามีเพียงหะดีษนี้ อิบนุมะอีนว่า \"ไม่มีน้ำหนักอะไร\" อัลบุคอรีย์ว่า \"ในหะดีษของเขามีที่มุนกัร\" อันนะสาอีย์ว่า \"อ่อน\" อัลอุก็อยลีย์ยกจากนัศร์ บินอะลี อัลญะฮ์เฎาะมีย์ว่าเขาถืออัลหาริษว่าอ่อน และว่า \"เขามีหะดีษจากมาลิก บินดีนารที่มุนกัรและไม่มีใครรายงานสนับสนุน\" แล้วยกหะดีษนี้ อิบนุอบีหาติมว่า \"บิดาฉันว่า หะดีษนี้มุนกัร และอัลหาริษอ่อน\" อัลบัยฮะกีย์ว่า \"นักหะดีษ เช่น อัลบุคอรีย์ อบูดาวูด และคนอื่น ปฏิเสธหะดีษนี้ มีรายงานจากอัลหะสันจากท่านนบี ﷺ แบบมุรสัล และจากอัลหะสันจากอบูฮุร็อยเราะฮ์แบบเมากูฟ\"", "หะดีษที่สอง คือหะดีษอาอิชะฮ์: อะห์มัดบันทึก (41/306, 43/248) ผ่านชะรีก จากคุศ็อยฟ์ ว่า \"ชายคนหนึ่งเล่าให้ฉันฟังเมื่อสามสิบปีก่อน จากอาอิชะฮ์ว่า ฉันรวบผมแน่น ท่านรสูลุลลอฮ์ ﷺ กล่าวแก่ฉันว่า โอ้อาอิชะฮ์ เธอไม่รู้หรือว่าบนผมทุกเส้นมีญะนาบะฮ์\" สายนี้อ่อน อัลฮัยษะมีย์ว่า \"อะห์มัดรายงาน ผู้รายงานเป็นผู้รายงานของเศาะฮีห์ ยกเว้นมีชายที่ไม่ระบุชื่อ\" คุศ็อยฟ์ คือ อิบนุอับดิรเราะห์มาน อัลญะซะรีย์ ศอดูกแต่ความจำไม่ดี สับสนในบั้นปลาย ชะรีก คือ อิบนุอับดิลลาฮ์ อันนะเคาะอีย์ ผู้พิพากษา ศอดูกแต่ผิดพลาดมาก ความจำเปลี่ยนตั้งแต่เป็นผู้พิพากษาที่กูฟะฮ์"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"แท้จริงใต้เส้นผมทุกเส้นมีญะนาบะฮ์\" เป็นคำเลี่ยงหมายถึงญะนาบะฮ์ครอบคลุมผิวกายทั้งหมด ซึ่งปกติเป็นที่ที่มีขน \"จงล้างผม\" ฟาอ์บ่งลำดับ ความหมายคือหุก่ม (วาญิบต้องล้าง) ลำดับมาจากลักษณะ (ญะนาบะฮ์ครอบคลุมร่างกาย) เพื่อบ่งว่าผมอาจกั้นน้ำไม่ให้ถึงผิวหนัง จึงต้องล้างผมให้ทั่ว ไม่ต่างกันระหว่างชายกับหญิง", "\"และจงทำให้สะอาดหมดจด\" (ฮัมซะฮ์ก็อฏอ์) จากคำว่า นะกิยะ ยันกอ คือสะอาด \"อัลบะชัร\" (ฟัตหะฮ์ที่บาอ์และชีน) คือผิวหนังภายนอก เอกพจน์คือ บะชะเราะฮ์"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "การให้น้ำทั่วร่างกาย", "points_th": ["หะดีษเป็นหลักฐานว่าวาญิบต้องอาบน้ำเพราะญะนาบะฮ์ ให้น้ำทั่วร่างกาย และขจัดทุกสิ่งที่กั้นน้ำไม่ให้ถึงผิวหนัง และความสะอาดไม่สมบูรณ์ถ้าเหลือส่วนใดของร่างกายแม้เล็กน้อย หะดีษนี้แม้สายจะอ่อนดังกล่าวแล้ว แต่ความหมายถูกต้อง อัลกุรอานบ่งตามนั้น เพราะอัลลอฮ์ตรัสว่า \"และหากพวกเจ้ามีญะนาบะฮ์ ก็จงทำความสะอาด\" (อัลมาอิดะฮ์: 6) อัลลอฮ์จึงทรงกำหนดให้ทำความสะอาดทั้งร่างกาย", "ยกเว้นถ้ามีเฝือก ล้างส่วนนอกก็พอถ้าทำได้ ถ้าไม่ได้ก็เช็ด ถ้าเป็นแผลที่ไม่มีอะไรปิด และน้ำเป็นอันตราย ก็ให้ตะยัมมุม ตามอายะฮ์ \"ดังนั้นจงยำเกรงอัลลอฮ์ตามความสามารถของพวกเจ้า\" (อัตตะฆอบุน: 16) จะกล่าวในบทตะยัมมุม"]}, {"wajh": 4, "type": "fawaid", "heading_ar": null, "heading_th": "การผูกหุก่มกับเหตุผล", "points_th": ["ในหะดีษมีการผูกหุก่มกับเหตุผล เมื่อญะนาบะฮ์ครอบคลุมทั้งร่างกาย การทำความสะอาดก็ต้องครอบคลุมทั้งร่างกาย เพราะความสุขขณะร่วมประเวณีทั่วทั้งร่างกาย และร่างกายทั้งหมดตอบสนอง การทำความสะอาดจึงต้องครอบคลุมทั้งร่างกาย เหมือนการเฆี่ยนผู้ทำซินาที่ครอบคลุมร่างกาย เพราะความสุขเกิดขึ้นทั่วทั้งร่างกาย"]}], "tags_th": ["ฆุสล์", "ญะนาบะฮ์", "ผม", "หะดีษอ่อน", "เฝือก"]}, {"id": "v2-h126", "volume": 2, "bab": "tayammum", "topic_ar": "بعض خصائص النبي ﷺ وأمته ومنها التيمم", "topic_th": "คุณลักษณะเฉพาะบางประการของท่านนบี ﷺ และประชาชาติของท่าน ซึ่งรวมถึงตะยัมมุม", "pages": [72, 76], "hadith": [{"no": 126, "matn_ar": "عَنْ جَابِرِ بْنِ عَبْدِ اللهِ رَضِيَ اللهُ عَنْهُمَا أَنَّ النَّبِيَّ ﷺ قَالَ: «أُعْطِيتُ خَمْسًا لَمْ يُعْطَهُنَّ أَحَدٌ قَبْلِي: نُصِرْتُ بِالرُّعْبِ مَسِيرَةَ شَهْرٍ، وَجُعِلَتْ لِيَ الْأَرْضُ مَسْجِدًا وَطَهُورًا، فَأَيُّمَا رَجُلٍ أَدْرَكَتْهُ الصَّلَاةُ فَلْيُصَلِّ...» وَذَكَرَ الْحَدِيثَ.", "translation_th": "จากญาบิร บินอับดิลลาฮ์ (ร.ฎ.) ว่า ท่านนบี ﷺ กล่าวว่า \"ฉันได้รับห้าสิ่งที่ไม่มีใครก่อนหน้าฉันได้รับ ฉันได้รับชัยชนะด้วยความหวาดกลัว (ในใจศัตรู) ระยะทางหนึ่งเดือน แผ่นดินถูกทำให้เป็นที่ละหมาดและเป็นสิ่งที่ใช้ทำความสะอาดสำหรับฉัน ดังนั้นชายคนใดที่เวลาละหมาดมาถึงเขา ก็จงละหมาด...\" และเขากล่าวหะดีษต่อไป", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["อัลลอฮ์ทรงให้ท่านนบี ﷺ และประชาชาติของท่านมีคุณลักษณะเฉพาะที่ไม่มีแก่นบีอื่นหรือประชาชาติอื่น ตะยัมมุมเป็นหนึ่งในนั้น การระบุจำนวนห้าไม่ได้หมายความว่ามีเพียงเท่านั้น", "ตะยัมมุมทำได้บนแผ่นดินที่สะอาดทุกชนิด ทั้งดิน ทราย หิน แห้งหรือชื้น เพราะแผ่นดินถูกเรียกว่า \"ฏอฮูร\" เหมือนน้ำ และตะยัมมุมบนกำแพงที่มีฝุ่นได้", "ละหมาดได้ในทุกที่บนแผ่นดิน ยกเว้นที่ศาสนายกเว้น เช่น ที่เป็นนะญิส สุสาน ห้องอาบน้ำ และคอกอูฐ", "วาญิบต้องละหมาดในเวลาไม่ว่าจะมีน้ำหรือไม่ แต่ถ้าคาดว่าจะพบน้ำตอนท้ายเวลา ที่ประเสริฐกว่าคือเลื่อนละหมาด เพื่อรักษาเงื่อนไขคือการทำความสะอาดด้วยน้ำ ถ้ารู้หรือคาดว่าจะไม่พบน้ำ การละหมาดต้นเวลาประเสริฐกว่า", "ส่งเสริมให้พูดถึงความโปรดปรานของอัลลอฮ์ ไม่ใช่เพื่ออวด แต่เพื่อแสดงและขอบคุณ"], "vocab": [{"ar": "نُصِرْتُ بِالرُّعْبِ", "th": "ได้รับชัยชนะด้วยความหวาดกลัวที่เกิดในใจศัตรู"}, {"ar": "مَسِيرَةَ شَهْرٍ", "th": "ระยะทางเดินหนึ่งเดือน ศัตรูหวาดกลัวท่านแม้อยู่ห่างเท่านั้น"}, {"ar": "طَهُورًا", "th": "สิ่งที่ใช้ทำความสะอาด คือสะอาดและทำให้สิ่งอื่นสะอาด"}, {"ar": "الشَّفَاعَةُ", "th": "การช่วยเหลือ (ชะฟาอะฮ์) ในที่นี้คือชะฟาอะฮ์ใหญ่ในวันกิยามะฮ์"}, {"ar": "الْمُقْحِمَاتُ", "th": "บาปที่ผลักผู้ทำเข้าสู่ไฟนรก"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกในหมวดตะยัมมุม (335) และมุสลิม (521) ผ่านฮุชัยม์ บินบะชีร จากสัยยาร อบุลหะกัม จากยะซีด (อิบนุศุฮัยบ์ อัลฟะกีร ตาบิอีนที่รู้จัก เรียกว่าอัลฟะกีรเพราะปวดกระดูกสันหลัง ไม่ใช่เพราะยากจน) จากญาบิร บินอับดิลลาฮ์ว่า ท่านนบี ﷺ กล่าวว่า \"ฉันได้รับห้าสิ่งที่ไม่มีใครก่อนหน้าฉันได้รับ ฉันได้รับชัยชนะด้วยความหวาดกลัวระยะทางหนึ่งเดือน แผ่นดินถูกทำให้เป็นที่ละหมาดและสิ่งที่ใช้ทำความสะอาดสำหรับฉัน ดังนั้นชายคนใดในประชาชาติของฉันที่เวลาละหมาดมาถึง ก็จงละหมาด ทรัพย์สงครามถูกทำให้หะลาลแก่ฉัน ซึ่งไม่เคยหะลาลแก่ผู้ใดก่อนหน้าฉัน ฉันได้รับชะฟาอะฮ์ และนบีแต่ก่อนถูกส่งไปยังกลุ่มชนของตนเท่านั้น แต่ฉันถูกส่งไปยังมนุษย์ทั้งหมด\" นี่เป็นสำนวนของอัลบุคอรีย์"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ฉันได้รับห้าสิ่ง\" คืออัลลอฮ์ทรงประทานห้าคุณลักษณะแก่ฉัน ผู้กระทำถูกละไว้เพราะรู้กันอยู่ และไม่ได้หมายความว่ามีเพียงห้า ดังจะกล่าว \"ที่ไม่มีใครก่อนหน้าฉันได้รับ\" ในอีกรายงานของอัลบุคอรีย์และมุสลิมว่า \"ไม่มีนบีคนใด\"", "\"ฉันได้รับชัยชนะด้วยความหวาดกลัว\" บาอ์บอกเหตุ ความหวาดกลัวคือความกลัวและความตื่นตระหนกเพราะคาดว่าจะมีสิ่งที่น่ากลัวเกิดขึ้น ในที่นี้หมายถึงความกลัวที่เกิดในใจศัตรู \"ระยะทางหนึ่งเดือน\" คือศัตรูหวาดกลัวท่าน แม้ระหว่างท่านกับศัตรูจะห่างหนึ่งเดือน", "\"แผ่นดินถูกทำให้เป็นที่ละหมาดสำหรับฉัน\" คืออัลลอฮ์ทรงทำให้แผ่นดินทั้งหมดเป็นที่สุญูด คือที่ละหมาด ต่างจากประชาชาติก่อนหน้าที่ละหมาดได้เฉพาะในสถานที่เฉพาะ เช่น โบสถ์ ในหะดีษอัมรฺ บินชุอัยบ์ว่า \"คนก่อนหน้าฉันละหมาดในโบสถ์ของพวกเขาเท่านั้น\" (อะห์มัด อิบนุกะษีรว่าสายดีและแข็งแรง) นี่เป็นความหมายกว้างที่มีการยกเว้น ดังจะกล่าว", "\"และเป็นฏะฮูร\" (ฟัตหะฮ์ที่ฏออ์) คือสิ่งที่ใช้ทำความสะอาด หมายถึงทำให้สิ่งอื่นสะอาด ไม่ใช่เพียงสะอาดในตัว มีในหะดีษอะนัสแบบมัรฟูอ์ว่า \"แผ่นดินที่ดีทุกแห่งถูกทำให้เป็นที่ละหมาดและเป็นฏะฮูรสำหรับฉัน\" (อิบนุลญารูด อิบนุหะญัรว่าสายศ่อฮีห์)", "\"ชายคนใด\" \"อัยยุ\" เป็นคำนามเงื่อนไขที่เพิ่ม \"มา\" เพื่อเน้น และกล่าวถึงผู้ชายเพราะเกียรติ ผู้หญิงก็เช่นเดียวกัน \"ที่เวลาละหมาดมาถึง ก็จงละหมาด\" คือเวลาละหมาดเข้าแล้วขณะเขาอยู่ ก็จงทำความสะอาดด้วยแผ่นดินและละหมาด ไม่ต้องรอพบน้ำ", "\"ทรัพย์สงครามถูกทำให้หะลาลแก่ฉัน\" คืออัลลอฮ์ทรงทำให้เป็นที่อนุญาตแก่ฉัน หมายถึงสิ่งที่ได้จากทรัพย์ของผู้ปฏิเสธศรัทธาในการญิฮาด ประชาชาติก่อนหน้านั้นรวบรวมไว้ในที่หนึ่ง แล้วไฟจากฟ้าลงมาเผา \"ฉันได้รับชะฟาอะฮ์\" หมายถึงชะฟาอะฮ์ใหญ่ คือการขอของท่าน ﷺ ต่ออัลลอฮ์ ให้ผู้คนที่ยืนรอได้รับการตัดสิน"]}, {"wajh": 3, "type": "fawaid", "heading_ar": null, "heading_th": "การพูดถึงความโปรดปรานของอัลลอฮ์", "points_th": ["หะดีษเป็นหลักฐานว่าบัญญัติให้พูดถึงความโปรดปรานของอัลลอฮ์ ไม่ใช่เพื่ออวด แต่เพื่อแสดงความโปรดปรานของอัลลอฮ์ และเพื่อให้เกิดการขอบคุณ ดังอายะฮ์ \"ส่วนความโปรดปรานของพระผู้อภิบาลของเจ้า จงประกาศเถิด\" (อัฎฎุฮา: 11) และในหะดีษอิบนุอับบาส (ร.ฎ.) ว่า \"ฉันได้รับห้าสิ่งที่ไม่มีใครก่อนหน้าฉันได้รับ และฉันไม่ได้พูดเพื่ออวด...\" (อะห์มัด หะดีษหะซันด้วยหลายสายและหลักฐานสนับสนุน) และในหะดีษอันนุอ์มาน บินบะชีร (ร.ฎ.) ว่าท่านนบี ﷺ กล่าวว่า \"การพูดถึงความโปรดปรานของอัลลอฮ์คือการขอบคุณ และการละทิ้งมันคือการเนรคุณ\" (อะห์มัด อัลอัลบานีย์ว่าหะซัน) สะลัฟบางคนกล่าวว่า \"ผู้ใดปกปิดความโปรดปราน ก็เนรคุณมัน ผู้ใดแสดงและเผยแพร่ ก็ขอบคุณมัน\""]}, {"wajh": 4, "type": "fawaid", "heading_ar": null, "heading_th": "คุณลักษณะเฉพาะของท่านนบีและประชาชาติ", "points_th": ["หะดีษเป็นหลักฐานถึงความประเสริฐของท่านนบี ﷺ และประชาชาติ เพราะอัลลอฮ์ทรงโปรดประทานคุณลักษณะเฉพาะและความประเสริฐแก่ท่านและประชาชาติ ซึ่งไม่มีแก่นบีคนใดหรือประชาชาติของพวกเขา ความหมายแฝงคือท่านไม่มีคุณลักษณะเฉพาะอื่นนอกจากห้าข้อนี้ แต่การระบุจำนวนไม่ได้หมายความว่ามีเพียงเท่านั้น เพราะมีคุณลักษณะเฉพาะอื่นที่ไม่กล่าวในหะดีษนี้", "ในหะดีษหุซัยฟะฮ์ \"เราได้รับความประเสริฐเหนือมนุษย์ด้วยสามสิ่ง\" (จะกล่าวต่อไป) ในหะดีษอบูฮุร็อยเราะฮ์ (ร.ฎ.) ว่าท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"ฉันได้รับความประเสริฐเหนือนบีทั้งหลายด้วยหกสิ่ง ฉันได้รับถ้อยคำที่ครอบคลุม ฉันได้รับชัยชนะด้วยความหวาดกลัว ทรัพย์สงครามหะลาลแก่ฉัน แผ่นดินถูกทำให้เป็นฏะฮูรและที่ละหมาดสำหรับฉัน ฉันถูกส่งไปยังสิ่งถูกสร้างทั้งหมด และบรรดานบีปิดท้ายด้วยฉัน\" (มุสลิม 524) และหะดีษอะลี (ร.ฎ.) \"ฉันได้รับสิ่งที่นบีคนใดไม่ได้รับ\" (จะกล่าวต่อไป) และหะดีษอิบนุมัสอูด (ร.ฎ.) ว่าท่านรสูลุลลอฮ์ ﷺ ได้รับสามสิ่ง \"ท่านได้รับละหมาดห้าเวลา ได้รับอายะฮ์ท้ายซูเราะฮ์อัลบะเกาะเราะฮ์ และได้รับการอภัยบาปที่ผลักเข้าไฟนรก สำหรับผู้ในประชาชาติของท่านที่ไม่ตั้งภาคีกับอัลลอฮ์\" (มุสลิม 173)", "ผู้ที่ถือความหมายแฝงของจำนวนกล่าวว่า ท่านอาจได้รับการบอกในตอนแรกเฉพาะสิ่งที่เป็นคุณลักษณะเฉพาะของท่าน แล้วได้รับการบอกสิ่งที่เหลือ อิบนุหะญัรระบุไว้สิบเจ็ดข้อ ที่สกัดจากหะดีษต่าง ๆ และว่า \"อาจพบมากกว่านั้นสำหรับผู้ที่ค้นอย่างละเอียด\" นักวิชาการใส่ใจเรื่องคุณลักษณะเฉพาะ และแต่งหนังสือเฉพาะ เช่น \"ฆอยะตุสสุอูล ฟี เคาะศออิศิรรสูล ﷺ\" ของอิบนุลมุลักกิน และ \"อัลเคาะศออิศ อัลกุบรอ\" ของอัสสุยูฏีย์ ซึ่งพูดถึงในคำอธิบายสุนันอันนะสาอีย์ด้วย"]}, {"wajh": 5, "type": "fawaid", "heading_ar": null, "heading_th": "ความหวาดกลัวในใจศัตรู", "points_th": ["หะดีษบ่งว่าการทำให้ศัตรูหวาดกลัว แม้อยู่ห่างหนึ่งเดือน เป็นวิธีหนึ่งของชัยชนะ ชัยชนะนี้ยืนยันแก่ท่านนบี ﷺ และเป็นการช่วยเหลือจากอัลลอฮ์แก่ท่าน และคุณลักษณะนี้หวังได้สำหรับผู้ที่ยึดซุนนะฮ์ของท่าน ปฏิบัติตาม มั่นคงในนั้น และดำเนินตามแนวทางของท่าน ทั้งภายนอกและภายใน ในหมู่ผู้ปกครอง"]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "ตะยัมมุมบนแผ่นดินทุกชนิด", "points_th": ["หะดีษเป็นหลักฐานว่าตะยัมมุมได้บนแผ่นดินที่สะอาดทุกชนิด ตามคำว่า \"แผ่นดินถูกทำให้เป็นที่ละหมาดและเป็นฏะฮูรสำหรับฉัน\" แผ่นดินถูกเรียกว่าฏะฮูรเหมือนวุฎูอ์ จึงบ่งว่าดินเป็นฏะฮูรเหมือนน้ำ และ \"อัล\" ในคำว่าแผ่นดินบ่งความครอบคลุม จึงรวมแผ่นดินทุกชนิด ไม่ว่าดิน ทราย หรือหิน แห้งหรือชื้น มนุษย์ตะยัมมุมบนแผ่นดินที่ตนอยู่ ไม่ว่าชนิดใด", "ยืนยันในหะดีษอบุลญุฮัยม์ว่าท่านรสูล ﷺ ตะยัมมุมบนกำแพง (กล่าวแล้วท้ายหะดีษที่ 78) เพราะกำแพงติดกับแผ่นดิน และเป็นชนิดเดียวกัน ถ้ากำแพงถูกหุ้มด้วยไม้หรือทาสี และมีฝุ่นก็ตะยัมมุมได้ ถ้าไม่พบดินอื่นก็ไม่เป็นไร และเหมือนกับผู้ที่ตะยัมมุมบนแผ่นดิน เพราะดินหรือฝุ่นมาจากวัสดุของแผ่นดิน แต่ถ้าไม่มีฝุ่น ก็ไม่ใช่ศ็อยด์ จึงตะยัมมุมไม่ได้ พรมก็เช่นเดียวกัน"]}, {"wajh": 7, "type": "fiqh", "heading_ar": null, "heading_th": "ละหมาดได้ทุกที่บนแผ่นดิน", "points_th": ["หะดีษเป็นหลักฐานว่าละหมาดได้ในทุกที่บนแผ่นดิน เพราะความครอบคลุมในคำว่า \"แผ่นดิน\" ดังกล่าวแล้ว แต่เป็นความหมายกว้างที่มีการยกเว้น สิ่งที่ศาสนายกเว้นจึงออกจากความกว้างนี้ เช่น ที่ที่เป็นนะญิส สุสาน ห้องอาบน้ำ และคอกอูฐ จะกล่าวในหมวดละหมาด"]}, {"wajh": 8, "type": "fiqh", "heading_ar": null, "heading_th": "ละหมาดในเวลาเสมอ", "points_th": ["หะดีษเป็นหลักฐานว่าวาญิบต้องละหมาดในเวลาไม่ว่าในสภาพใด จะมีน้ำหรือไม่มีก็ตาม ตามคำว่า \"ชายคนใดที่เวลาละหมาดมาถึง ก็จงละหมาด\" แต่ถ้าคาดว่าจะพบน้ำตอนท้ายเวลา ที่ประเสริฐกว่าคือเลื่อนละหมาด เพื่อรักษาเงื่อนไขหนึ่งของละหมาด คือการทำความสะอาดด้วยน้ำ ส่วนการละหมาดต้นเวลาเป็นเพียงการรักษาความประเสริฐของเวลา ถ้ารู้ว่าจะไม่พบน้ำ หรือคาดว่าไม่พบ การละหมาดต้นเวลาประเสริฐกว่า"]}, {"wajh": 9, "type": "fawaid", "heading_ar": null, "heading_th": "ทรัพย์สงคราม", "points_th": ["หะดีษเป็นหลักฐานว่าทรัพย์สงครามหะลาลแก่ประชาชาตินี้"]}, {"wajh": 10, "type": "fawaid", "heading_ar": null, "heading_th": "ชะฟาอะฮ์ใหญ่", "points_th": ["หะดีษเป็นหลักฐานว่าท่านนบี ﷺ มีชะฟาอะฮ์ใหญ่เป็นการเฉพาะ ซึ่งรสูลผู้ยิ่งใหญ่ทั้งหลาย (อะลัยฮิมุสสลาม) ต่างปฏิเสธที่จะทำ"]}, {"wajh": 11, "type": "fawaid", "heading_ar": null, "heading_th": "สาส์นของท่านนบีครอบคลุมมนุษย์ทั้งหมด", "points_th": ["หะดีษเป็นหลักฐานว่าสาส์นของท่านนบี ﷺ ครอบคลุมมนุษย์ทั้งหมดจนถึงวันกิยามะฮ์ ทุกคนต้องปฏิบัติตามบทบัญญัติของท่านหลังจากท่านถูกส่งมา"]}], "tags_th": ["ตะยัมมุม", "คุณลักษณะเฉพาะ", "ชะฟาอะฮ์", "ทรัพย์สงคราม", "การขอบคุณ"]}, {"id": "v2-h127-128", "volume": 2, "bab": "tayammum", "topic_ar": "اشتراط التراب في التيمم", "topic_th": "เงื่อนไขว่าตะยัมมุมต้องใช้ดินหรือไม่", "pages": [77, 80], "hadith": [{"no": 127, "matn_ar": "وَفِي حَدِيثِ حُذَيْفَةَ عِنْدَ مُسْلِمٍ: «وَجُعِلَتْ تُرْبَتُهَا لَنَا طَهُورًا، إِذَا لَمْ نَجِدِ الْمَاءَ».", "translation_th": "และในหะดีษหุซัยฟะฮ์ที่มุสลิมบันทึกว่า \"และดินของมัน (แผ่นดิน) ถูกทำให้เป็นสิ่งที่ใช้ทำความสะอาดสำหรับเรา เมื่อเราไม่พบน้ำ\"", "grade_th": "ศ่อฮีห์ (มุสลิม)"}, {"no": 128, "matn_ar": "وَعَنْ عَلِيٍّ رَضِيَ اللهُ عَنْهُ عِنْدَ أَحْمَدَ: «وَجُعِلَ التُّرَابُ لِي طَهُورًا».", "translation_th": "และจากอะลี (ร.ฎ.) ที่อะห์มัดบันทึกว่า \"และดินถูกทำให้เป็นสิ่งที่ใช้ทำความสะอาดสำหรับฉัน\"", "grade_th": "หะซัน (ผู้แต่งเห็นว่าหะดีษของอับดุลลอฮ์ บินมุหัมมัด บินอะกีลไม่ต่ำกว่าระดับหะซัน และมีหลักฐานสนับสนุน)"}], "key_rulings_th": ["ตะยัมมุมใช้ได้เมื่อไม่พบน้ำ ตามอัลกุรอานและอิจญ์มาอ์ และเมื่อป่วยก็เช่นกัน", "นักวิชาการขัดแย้งว่าต้องใช้ดินที่มีฝุ่นหรือไม่ ชาฟิอีย์และอะห์มัดว่าต้องใช้ดิน", "ผู้แต่งเห็นว่าไม่ต้องเป็นดิน ตะยัมมุมได้บนทุกสิ่งที่อยู่บนผิวแผ่นดิน ทั้งดิน ทราย หรือหิน (อิบนุตัยมียะฮ์ อัชเชากานีย์) เพราะความกว้างของหะดีษ \"แผ่นดินถูกทำให้เป็นฏะฮูร\" และท่านนบี ﷺ กับเศาะหาบะฮ์ในสงครามตะบูกไม่ได้พกดินไปด้วย", "การกล่าวถึงดินในหะดีษไม่ได้จำกัดความหมายกว้าง เพราะดินเป็นส่วนหนึ่งของแผ่นดิน และการกล่าวถึงส่วนหนึ่งด้วยหุก่มเดียวกันไม่ได้จำกัดความหมาย"], "vocab": [{"ar": "تُرْبَتُهَا", "th": "ดินของแผ่นดิน"}, {"ar": "الصَّعِيدُ", "th": "ผิวหน้าแผ่นดิน (อัซซัจญาจ: นักภาษาไม่ขัดแย้งว่าเศาะอีดคือผิวหน้าแผ่นดิน)"}, {"ar": "مَفَاتِيحُ الْأَرْضِ", "th": "กุญแจของแผ่นดิน"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجهما", "heading_th": "ที่มาของหะดีษ", "points_th": ["หะดีษแรก: มุสลิมบันทึก (522) ในหมวดมัสยิดและสถานที่ละหมาด ผ่านอบูมาลิก อัลอัชญะอีย์ จากริบอีย์ บินหิรอช จากหุซัยฟะฮ์ (ร.ฎ.) ว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"เราได้รับความประเสริฐเหนือมนุษย์ด้วยสามสิ่ง แถวของเราถูกทำให้เหมือนแถวของมะลาอิกะฮ์ แผ่นดินทั้งหมดถูกทำให้เป็นที่ละหมาดสำหรับเรา และดินของมันถูกทำให้เป็นสิ่งที่ใช้ทำความสะอาดสำหรับเรา เมื่อเราไม่พบน้ำ\" และกล่าวถึงอีกหนึ่งข้อ มุสลิมบันทึกอีกสายผ่านสะอ์ด บินฏอริก จากริบอีย์ จากหุซัยฟะฮ์ทำนองเดียวกัน", "คำว่า \"และกล่าวถึงอีกหนึ่งข้อ\" คือข้อที่สาม เพราะที่กล่าวถึงมีสองข้อ การที่แผ่นดินเป็นที่ละหมาดและสิ่งที่ใช้ทำความสะอาดเป็นข้อเดียว ดังในหะดีษญาบิร ส่วนข้อที่สามถูกละไว้ในที่นี้ และมีในรายงานของอันนะสาอีย์ผ่านอบูมาลิก อัลอัชญะอีย์ ผู้รายงานในมุสลิม ว่า \"และฉันได้รับอายะฮ์ท้ายซูเราะฮ์อัลบะเกาะเราะฮ์เหล่านี้ จากคลังใต้บัลลังก์ ซึ่งไม่มีใครได้รับก่อนฉัน และไม่มีใครได้รับหลังฉัน\" (อันนะสาอีย์ใน \"อัลกุบรอ\" อะห์มัด อิบนุคุซัยมะฮ์ สายศ่อฮีห์ตามเงื่อนไขของมุสลิม)", "หะดีษอะลี (ร.ฎ.): อะห์มัดบันทึก (2/156–160) ผ่านอับดุลลอฮ์ บินมุหัมมัด บินอะกีล จากมุหัมมัด บินอะลี บินอัลหะนะฟียะฮ์ ว่าเขาได้ยินบิดาคืออะลี บินอบีฏอลิบ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"ฉันได้รับสิ่งที่นบีคนใดไม่ได้รับ\" เราถามว่า \"โอ้ท่านรสูลุลลอฮ์ คืออะไร\" ท่านตอบว่า \"ฉันได้รับชัยชนะด้วยความหวาดกลัว ได้รับกุญแจของแผ่นดิน ถูกเรียกว่าอะห์มัด ดินถูกทำให้เป็นสิ่งที่ใช้ทำความสะอาดสำหรับฉัน และประชาชาติของฉันถูกทำให้เป็นประชาชาติที่ดีที่สุด\"", "สายนี้มีความอ่อน เพราะอับดุลลอฮ์ บินมุหัมมัด บินอะกีลถูกวิจารณ์ อิบนุอุยัยนะฮ์ว่า \"สี่คนจากกุร็อยช์ที่หะดีษของพวกเขาถูกทิ้ง\" และกล่าวถึงเขาด้วย อัดดารุกุฏนีย์ว่า \"อิบนุอะกีลไม่แข็งแรง\" และอิบนุหะญัรใน \"อัตตักรีบ\" ว่า \"ศอดูก หะดีษของเขามีความอ่อน และมีผู้ว่าความจำเปลี่ยนในบั้นปลาย\" ผู้แต่งเห็นว่าที่ถูก อินชาอัลลอฮ์ คือหะดีษของเขาไม่ต่ำกว่าระดับหะซัน เพราะการวิจารณ์เขามาจากด้านความจำ และในตัวเขาเป็นคนซื่อสัตย์ จึงระวังเฉพาะหะดีษที่เขารายงานคนเดียว และหะดีษนี้มีหลักฐานสนับสนุน อัตติรมิซีย์ว่า \"ฉันถามมุหัมมัด (อัลบุคอรีย์) เรื่องอับดุลลอฮ์ บินมุหัมมัด บินอะกีล เขาตอบว่า ฉันเห็นอะห์มัด บินหันบัล อิสหาก บินอิบรอฮีม และอัลหุมัยดีย์ใช้หะดีษของเขาเป็นหลักฐาน และเขาใกล้เคียงหะดีษ (ที่ยอมรับ)\"", "มีความขัดแย้งในสายรายงาน อิบนุอบีหาติมว่า \"ฉันถามบิดาเรื่องหะดีษที่มีความขัดแย้งในการรายงานจากอับดุลลอฮ์ บินมุหัมมัด บินอะกีล สะอีด บินสะละมะฮ์ บินอบีอัลหุสาม รายงานจากอับดุลลอฮ์ บินมุหัมมัด บินอะกีล จากมุหัมมัด บินอะกีล บินอบีฏอลิบ จากอะลี บินอบีฏอลิบ จากท่านนบี ﷺ ...และซุฮัยร์ บินมุหัมมัดรายงานจากอับดุลลอฮ์ บินมุหัมมัด บินอะกีล จากมุหัมมัด บินอะลี ว่าเขาได้ยินอะลี\" อบูซุรอะฮ์ว่า \"หะดีษของสะอีด บินสะละมะฮ์ผิดในความเห็นฉัน และอันนี้ถูกต้อง\""]}, {"wajh": 2, "type": "fiqh", "heading_ar": null, "heading_th": "ต้องเป็นดินหรือไม่", "points_th": ["อิบนุหะญัรยกหะดีษหุซัยฟะฮ์และอะลี (ร.ฎ.) เพราะมีสองเงื่อนไขจำกัดหะดีษก่อนหน้า", "เงื่อนไขแรกคือคำว่า \"เมื่อเราไม่พบน้ำ\" ซึ่งอัลกุรอานบ่งไว้ \"แล้วพวกเจ้าไม่พบน้ำ ก็จงตะยัมมุมด้วยเศาะอีดที่ดี (สะอาด)\" (อันนิสาอ์: 43) นี่เป็นอิจญ์มาอ์ของมุสลิม และการป่วยก็เช่นกัน", "เงื่อนไขที่สองคือคำว่า \"ดินของมันถูกทำให้\" และ \"ดินถูกทำให้เป็นฏะฮูรสำหรับฉัน\" ซึ่งจำกัดคำในหะดีษญาบิรก่อนหน้า \"แผ่นดินถูกทำให้เป็นที่ละหมาดและเป็นฏะฮูรสำหรับฉัน\" เพราะ \"อัล\" ในคำว่าแผ่นดินบ่งความครอบคลุม ดังกล่าวแล้ว จึงรวมแผ่นดินทุกชนิด เช่น ทราย ดิน และหิน แต่ในที่นี้จำกัดด้วยดิน คือสิ่งที่มีฝุ่น", "ผู้ที่ว่าตะยัมมุมต้องใช้ดินที่มีฝุ่นติดมือ ใช้เงื่อนไขนี้เป็นหลักฐาน ซึ่งจำกัดความหมายกว้างของหะดีษญาบิร (ร.ฎ.) เพราะท่าน ﷺ ระบุความเป็นฏะฮูรเฉพาะดินในบริบทของการกล่าวถึงความโปรดปราน ถ้ามีสิ่งอื่นแทนได้ ก็จะกล่าวถึงด้วย และเศาะอีดในอายะฮ์ \"ก็จงตะยัมมุมด้วยเศาะอีดที่ดี\" หมายถึงดิน มีรายงานจากอิบนุอับบาสว่า \"เศาะอีดที่ดีที่สุดคือดินของไร่นา\" (สายอ่อน) นี่เป็นทัศนะของอิมามชาฟิอีย์ อะห์มัด และสานุศิษย์ของทั้งสอง หลักฐานของพวกเขาคืออายะฮ์ \"แล้วจงลูบหน้าและมือของพวกเจ้าจากมัน\" (อัลมาอิดะฮ์: 6) \"มิน\" บ่งความเป็นบางส่วน และจะเอาบางส่วนจากเศาะอีดไม่ได้ นอกจากเป็นดินที่มีฝุ่น", "ทัศนะที่สอง: ไม่ต้องเป็นดิน ตะยัมมุมได้บนทุกสิ่งที่อยู่บนผิวแผ่นดิน ไม่ว่าดิน ทราย หรือหิน นี่คือความหมายของอายะฮ์ \"เศาะอีดที่ดี\" (อันนิสาอ์: 43) คือผิวแผ่นดินที่สะอาด อัซซัจญาจว่า \"ฉันไม่รู้ว่านักภาษามีความขัดแย้งว่าเศาะอีดคือผิวหน้าแผ่นดิน\" อิบนุตัยมียะฮ์และอัชเชากานีย์เลือกทัศนะนี้", "พวกเขากล่าวว่า \"มิน\" ในอายะฮ์ไม่จำเป็นต้องบ่งความเป็นบางส่วน แต่อาจบ่งการอธิบายหรือจุดเริ่มต้น คือการลูบมาจากเศาะอีดนี้ หรือเริ่มลูบจากมัน หมายถึงเอามือแตะแล้วยกขึ้น สิ่งบ่งชี้คือความกว้างของหะดีษ ซึ่งระบุชัดว่าผู้ที่เวลาละหมาดมาถึง ไม่ว่าในแผ่นดินใด แผ่นดินนั้นเป็นฏะฮูรสำหรับเขา และอายะฮ์ในซูเราะฮ์อันนิสาอ์ไม่มี \"มิน\" ดังอายะฮ์ \"ก็จงตะยัมมุมด้วยเศาะอีดที่ดี แล้วลูบหน้าและมือของพวกเจ้า\" (อันนิสาอ์: 43) และอายะฮ์ในอันนิสาอ์ลงมาก่อนอายะฮ์ในอัลมาอิดะฮ์หลายปี อีกทั้งเมื่อท่านรสูล ﷺ และเศาะหาบะฮ์เดินทางในสงครามตะบูก และข้ามทะเลทรายเหล่านั้น ไม่มีรายงานว่าพวกเขาพกดินไปด้วย และท่านก็ไม่ได้สั่ง แต่พวกเขาตะยัมมุมด้วยแผ่นดินที่มี", "ผู้แต่งเห็นว่าทัศนะที่ว่าหะดีษถูกจำกัดนั้นถูกปฏิเสธด้วยสองเหตุผล (1) ดินเป็นส่วนหนึ่งของแผ่นดิน และการกล่าวถึงบางส่วนของความหมายกว้างด้วยหุก่มเดียวกันไม่จำกัดความหมายตามนักวิชาการส่วนใหญ่ ถ้ากล่าวว่า \"จงให้เกียรตินักเรียน และให้เกียรติซัยด์\" ไม่ได้จำกัดซัยด์ด้วยการให้เกียรติ เพราะกล่าวด้วยหุก่มเดียวกัน แต่ถ้ากล่าวว่า \"จงให้เกียรตินักเรียน\" แล้วกล่าวว่า \"อย่าให้เกียรติมุหัมมัด\" นั่นเป็นการจำกัด เพราะกล่าวด้วยหุก่มที่ต่างจากความหมายกว้าง (2) การใช้คำว่า \"ดิน\" เป็นหลักฐาน เป็นความหมายแฝงของชื่อเรียก (มัฟฮูม อัลละก็อบ) ซึ่งนักอุศูลส่วนใหญ่ถือว่าอ่อน"]}], "tags_th": ["ตะยัมมุม", "ดิน", "เศาะอีด", "การจำกัดความหมาย", "หุซัยฟะฮ์"]}, {"id": "v2-h129", "volume": 2, "bab": "tayammum", "topic_ar": "بيان كيفية التيمم وأنه لا فرق بين الحدث الأكبر والأصغر", "topic_th": "วิธีตะยัมมุม และไม่ต่างกันระหว่างฮะดัษใหญ่กับฮะดัษเล็ก", "pages": [81, 84], "hadith": [{"no": 129, "matn_ar": "وَعَنْ عَمَّارِ بْنِ يَاسِرٍ رَضِيَ اللهُ عَنْهُمَا قَالَ: بَعَثَنِي النَّبِيُّ ﷺ فِي حَاجَةٍ، فَأَجْنَبْتُ، فَلَمْ أَجِدِ الْمَاءَ، فَتَمَرَّغْتُ فِي الصَّعِيدِ كَمَا تَمَرَّغُ الدَّابَّةُ، ثُمَّ أَتَيْتُ النَّبِيَّ ﷺ، فَذَكَرْتُ ذَلِكَ لَهُ، فَقَالَ: «إِنَّمَا كَانَ يَكْفِيكَ أَنْ تَقُولَ بِيَدَيْكَ هَكَذَا»، ثُمَّ ضَرَبَ بِيَدَيْهِ الْأَرْضَ ضَرْبَةً وَاحِدَةً، ثُمَّ مَسَحَ الشِّمَالَ عَلَى الْيَمِينِ، وَظَاهِرَ كَفَّيْهِ وَوَجْهَهُ. مُتَّفَقٌ عَلَيْهِ، وَاللَّفْظُ لِمُسْلِمٍ. وَفِي رِوَايَةٍ لِلْبُخَارِيِّ: وَضَرَبَ بِكَفَّيْهِ الْأَرْضَ، وَنَفَخَ فِيهِمَا، ثُمَّ مَسَحَ بِهِمَا وَجْهَهُ وَكَفَّيْهِ.", "translation_th": "และจากอัมมาร บินยาสิร (ร.ฎ.) กล่าวว่า ท่านนบี ﷺ ส่งฉันไปทำธุระ ฉันมีญะนาบะฮ์ และไม่พบน้ำ จึงกลิ้งตัวบนพื้นดินเหมือนสัตว์กลิ้ง แล้วฉันมาหาท่านนบี ﷺ และเล่าให้ท่านฟัง ท่านกล่าวว่า \"เพียงพอแล้วที่ท่านจะทำด้วยมือทั้งสองอย่างนี้\" แล้วท่านตบมือทั้งสองลงบนพื้นครั้งเดียว แล้วลูบมือซ้ายบนมือขวา และหลังฝ่ามือทั้งสอง และใบหน้า บันทึกโดยอัลบุคอรีย์และมุสลิม สำนวนเป็นของมุสลิม และในอีกรายงานของอัลบุคอรีย์ว่า ท่านตบฝ่ามือทั้งสองลงบนพื้น เป่ามือ แล้วลูบใบหน้าและฝ่ามือทั้งสองด้วยมือนั้น", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["อนุญาตให้ตะยัมมุมเพราะญะนาบะฮ์เมื่อไม่พบน้ำ ตะยัมมุมไม่ได้เฉพาะฮะดัษเล็ก แต่ใช้กับฮะดัษใหญ่ด้วย และอายะฮ์อันนิสาอ์: 43 ก็บ่งเช่นนั้น", "วิธีตะยัมมุมเพราะญะนาบะฮ์เหมือนเพราะฮะดัษเล็ก คือตบฝ่ามือลงพื้นครั้งเดียว ลูบมือซ้ายบนฝ่ามือขวา หลังฝ่ามือทั้งสอง และใบหน้า", "ผู้แต่งเห็นว่าการลูบหน้าก่อนมือสอดคล้องกับอัลกุรอานและลำดับในวุฎูอ์ และรายงานส่วนใหญ่ในหะดีษอัมมารก็กล่าวหน้าก่อน", "อนุญาตให้เป่ามือเพื่อลดฝุ่นที่ติดมือมาก ก่อนลูบหน้าและมือ"], "vocab": [{"ar": "فَتَمَرَّغْتُ فِي الصَّعِيدِ", "th": "กลิ้งตัวบนพื้นดิน เพื่อให้ดินถูกทั่วร่างกาย โดยเทียบกับการอาบน้ำ"}, {"ar": "يَكْفِيكَ", "th": "เพียงพอแก่ท่าน ไม่ต้องกลิ้งตัวหรืออาบน้ำ"}, {"ar": "أَنْ تَقُولَ بِيَدَيْكَ", "th": "ทำด้วยมือทั้งสอง (ใช้คำว่าพูดหมายถึงทำ)"}, {"ar": "نَفَخَ فِيهِمَا", "th": "เป่ามือเพื่อให้ฝุ่นที่ติดมือเบาลง"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["คืออัมมาร บินยาสิร บินอามิร อัลอันสีย์ อบุลยักซอน เมาลาของบะนีมัคซูม รับอิสลามแต่แรก ทั้งเขา บิดา และมารดา และพวกมุชริกทรมานพวกเขา ท่านนบี ﷺ เดินผ่านพวกเขาขณะถูกทรมานที่มักกะฮ์ และกล่าวว่า \"จงอดทน โอ้ครอบครัวยาสิร เพราะที่นัดของพวกท่านคือสวรรค์\" (อัลอัลบานีย์ว่าศ่อฮีห์ในตัครีจอัสสีเราะฮ์ และว่ามีหลายสายสนับสนุน)", "เขาเข้าร่วมสงครามทั้งหมดกับท่านนบี ﷺ จากอะลี (ร.ฎ.) ว่า อัมมารมาขออนุญาตพบท่านนบี ﷺ ท่านกล่าวว่า \"จงอนุญาตเขา ยินดีต้อนรับผู้ดีที่ได้รับการทำให้ดี\" (อัตติรมิซีย์ 3798 อิบนุมาญะฮ์ อัตติรมิซีย์ว่าหะซันศ่อฮีห์ ผู้แต่งว่าดูเหมือนจะเป็นระดับหะซัน) มีหะดีษมุตะวาติรจากท่านนบี ﷺ ว่าอัมมารจะถูกฆ่าโดยกลุ่มที่ละเมิด และนักวิชาการเห็นพ้องว่าเขาถูกฆ่าขณะอยู่กับอะลี (ร.ฎ.) ที่ศิฟฟีน ปี ฮ.ศ. 37"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกในหมวดตะยัมมุม บทตะยัมมุมตบครั้งเดียว (347) และมุสลิม (368) ผ่านอัลอะอ์มัช จากชะกีก บินสะละมะฮ์ ว่า \"ฉันนั่งกับอับดุลลอฮ์ (อิบนุมัสอูด) และอบูมูซา อบูมูซากล่าวว่า โอ้อบูอับดิรเราะห์มาน ท่านเห็นอย่างไร ถ้าชายคนหนึ่งมีญะนาบะฮ์ และไม่พบน้ำหนึ่งเดือน เขาจะละหมาดอย่างไร อับดุลลอฮ์ตอบว่า เขาไม่ตะยัมมุม แม้จะไม่พบน้ำหนึ่งเดือน อบูมูซาถามว่า แล้วอายะฮ์ในซูเราะฮ์อัลมาอิดะฮ์ แล้วพวกเจ้าไม่พบน้ำ ก็จงตะยัมมุมด้วยเศาะอีดที่ดี (อัลมาอิดะฮ์: 6) จะเป็นอย่างไร อับดุลลอฮ์ตอบว่า ถ้าผ่อนปรนแก่พวกเขาในอายะฮ์นี้ เมื่อน้ำเย็น พวกเขาก็คงตะยัมมุมด้วยเศาะอีด อบูมูซากล่าวกับอับดุลลอฮ์ว่า ท่านไม่ได้ยินคำของอัมมารหรือ ท่านรสูลุลลอฮ์ ﷺ ส่งฉันไป...\" สำนวนเป็นของมุสลิม", "ส่วนรายงานของอัลบุคอรีย์ บันทึกในบท \"ผู้ตะยัมมุมเป่ามือได้หรือไม่\" ผ่านสะอีด บินอับดิรเราะห์มาน บินอับซา จากบิดาว่า ชายคนหนึ่งมาหาอุมัร บินอัลค็อฏฏอบ และกล่าวว่า \"ฉันมีญะนาบะฮ์และไม่พบน้ำ\" อัมมาร บินยาสิรกล่าวกับอุมัรว่า \"ท่านจำไม่ได้หรือ ฉันกับท่านอยู่ในการเดินทาง ท่านไม่ได้ละหมาด ส่วนฉันกลิ้งตัวแล้วละหมาด แล้วฉันเล่าให้ท่านนบี ﷺ ฟัง ท่านนบี ﷺ กล่าวว่า เพียงพอแก่ท่านอย่างนี้ แล้วท่านนบี ﷺ ตบฝ่ามือทั้งสองลงพื้น เป่า แล้วลูบใบหน้าและฝ่ามือทั้งสอง\" นี่เป็นสำนวนของอัลบุคอรีย์ และในมุสลิมทำนองเดียวกัน สำนวนว่า \"เพียงพอแก่ท่านที่จะตบมือทั้งสองลงพื้น แล้วเป่า แล้วลูบใบหน้าและฝ่ามือทั้งสอง\""]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ส่งฉันไปทำธุระ\" คือส่งไปทำภารกิจหนึ่ง และอยู่กับกองทหารกองหนึ่ง \"แล้วฉันกลิ้งตัวบนเศาะอีด\" คือพลิกตัวบนพื้นเหมือนสัตว์พลิกตัว เพื่อให้ดินถูกทั่วร่างกาย โดยเทียบตะยัมมุมเพราะญะนาบะฮ์กับการอาบน้ำ เศาะอีดคือผิวหน้าแผ่นดินหรือดิน ตามความขัดแย้งที่กล่าวแล้ว", "\"เพียงพอแก่ท่าน\" คือแทนการกลิ้งตัวบนเศาะอีด หรือแทนการอาบน้ำด้วยน้ำ \"ที่ท่านจะพูดด้วยมือทั้งสอง\" คือทำด้วยฝ่ามือทั้งสอง ใช้คำว่าพูดหมายถึงการกระทำ \"อย่างนี้\" ฮาอ์เป็นคำเรียกให้สนใจ และกาฟบ่งการเปรียบเทียบ คือเหมือนที่ฉันทำด้วยมือของฉัน", "\"และหลังฝ่ามือทั้งสอง\" (ซอฮิเราะ อ่านนัศบ์) เชื่อมกับกรรมของ \"ลูบ\" ความหมายคือ และลูบหลังฝ่ามือทั้งสอง คือลูบหลังแต่ละฝ่ามือด้วยฝ่ามืออีกข้าง ดังที่อธิบายในรายงานของอบูดาวูด \"และใบหน้า\" (อ่านนัศบ์) คือและลูบใบหน้า"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "ตะยัมมุมเพราะญะนาบะฮ์", "points_th": ["หะดีษเป็นหลักฐานว่าอนุญาตให้ตะยัมมุมเพราะญะนาบะฮ์เมื่อไม่พบน้ำ และตะยัมมุมไม่ได้เฉพาะฮะดัษเล็ก แต่ใช้กับฮะดัษใหญ่ด้วย อัลกุรอานก็บ่งเช่นนั้น ในอายะฮ์หลังกล่าวถึงการทำความสะอาดด้วยน้ำ \"และหากพวกเจ้าป่วย หรืออยู่ในการเดินทาง หรือคนหนึ่งในพวกเจ้ามาจากที่ถ่ายทุกข์ หรือพวกเจ้าสัมผัสสตรี แล้วพวกเจ้าไม่พบน้ำ ก็จงตะยัมมุมด้วยเศาะอีดที่ดี\" (อันนิสาอ์: 43) อัลลอฮ์ทรงกล่าวถึงสองสาเหตุของการทำความสะอาดด้วยตะยัมมุม คือฮะดัษเล็ก \"หรือคนหนึ่งในพวกเจ้ามาจากที่ถ่ายทุกข์\" และฮะดัษใหญ่ \"หรือพวกเจ้าสัมผัสสตรี\" คือการร่วมประเวณี ดังกล่าวแล้วในบทการอาบน้ำ"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "วิธีตะยัมมุม", "points_th": ["วิธีตะยัมมุมเพราะญะนาบะฮ์เหมือนวิธีตะยัมมุมเพราะฮะดัษเล็ก คือตบฝ่ามือทั้งสองลงพื้นครั้งเดียว ลูบมือซ้ายบนฝ่ามือขวา หลังฝ่ามือทั้งสอง และใบหน้า ในรายงานของอบูดาวูดว่า \"แล้วลูบมือซ้ายบนมือขวา และมือขวาบนมือซ้ายที่ฝ่ามือ แล้วลูบหน้า\" และสำนวนของอัลอิสมาอีลีย์ว่า \"เพียงพอแก่ท่านที่จะตบมือทั้งสองลงพื้น แล้วเคาะ แล้วลูบมือขวาบนมือซ้าย และมือซ้ายบนมือขวา แล้วลูบหน้า\" ซึ่งชัดเจนกว่าในความหมาย", "ในรายงานแรกที่เห็นพ้อง ลูบมือก่อนหน้า และในรายงานที่สองของอัลบุคอรีย์ ลูบหน้าก่อนฝ่ามือ ซึ่งสอดคล้องกับอัลกุรอาน \"แล้วจงลูบหน้าและมือของพวกเจ้าจากมัน\" (อัลมาอิดะฮ์: 6) ผู้แต่งเห็นว่าการลูบหน้าก่อนมือในหะดีษ เป็นความหมายตามตัวบทของอัลกุรอาน และสอดคล้องกับลำดับในวุฎูอ์ ที่ล้างหน้าก่อนมือ และรายงานส่วนใหญ่ในหะดีษอัมมารก็กล่าวหน้าก่อน ส่วนรายงานที่กล่าวมือก่อน เพราะวาวไม่จำเป็นต้องบ่งลำดับในทุกที่ เพราะใช้เพื่อรวมโดยทั่วไป"]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "การเป่ามือ", "points_th": ["หะดีษเป็นหลักฐานว่าอนุญาตให้ลดฝุ่นที่ติดมือมากจากการตบพื้น ด้วยการเป่า แล้วลูบหน้าและฝ่ามือ อัลบุคอรีย์ตั้งบทของหะดีษอับดุรเราะห์มาน บินอับซาที่มีรายงานนี้ว่า \"บทผู้ตะยัมมุมเป่ามือได้หรือไม่\" อิบนุหะญัรกล่าวว่า \"เขาตั้งบทด้วยคำถาม เพื่อชี้ว่ามีความเป็นไปได้หลายทาง ตามปกติของเขา เพราะการเป่าอาจเป็นเพราะมีบางสิ่งติดมือที่กลัวว่าจะโดนใบหน้าอันมีเกียรติ หรือดินติดมือมาก จึงต้องการลดลง เพื่อไม่ให้เหลือรอยบนใบหน้า หรืออาจเป็นการแสดงบทบัญญัติ\""]}], "tags_th": ["ตะยัมมุม", "ญะนาบะฮ์", "วิธีตะยัมมุม", "อัมมาร บินยาสิร"]}, {"id": "v2-h130", "volume": 2, "bab": "tayammum", "topic_ar": "بيان صفة أخرى للتيمم", "topic_th": "อีกวิธีหนึ่งของการตะยัมมุม", "pages": [85, 87], "hadith": [{"no": 130, "matn_ar": "وَعَنِ ابْنِ عُمَرَ رَضِيَ اللهُ عَنْهُمَا قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «التَّيَمُّمُ ضَرْبَتَانِ: ضَرْبَةٌ لِلْوَجْهِ، وَضَرْبَةٌ لِلْيَدَيْنِ إِلَى الْمِرْفَقَيْنِ». رَوَاهُ الدَّارَقُطْنِيُّ، وَصَحَّحَ الْأَئِمَّةُ وَقْفَهُ.", "translation_th": "และจากอิบนุอุมัร (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"ตะยัมมุมคือการตบสองครั้ง ครั้งหนึ่งสำหรับใบหน้า และอีกครั้งสำหรับมือทั้งสองถึงข้อศอก\" รายงานโดยอัดดารุกุฏนีย์ และนักวิชาการตัดสินว่าที่ถูกต้องคือเป็นเมากูฟ", "grade_th": "ฎออีฟ (อ่อนมาก) แบบมัรฟูอ์ ที่ถูกต้องคือเมากูฟจากอิบนุอุมัร (ร.ฎ.)"}], "key_rulings_th": ["หะดีษบ่งว่าตะยัมมุมมีสองครั้ง (ชาฟิอีย์ และหะนะฟีย์) แต่ผู้แต่งเห็นว่าทัศนะที่มีน้ำหนักกว่าคือตบครั้งเดียวก็พอ ตามหะดีษอัมมาร", "ผู้แต่งเห็นว่าที่ถูกคือตะยัมมุมเฉพาะฝ่ามือ ไม่ถึงข้อศอก เพราะหะดีษของบทเป็นเมากูฟและไม่ใช่หลักฐาน และคำว่า \"มือ\" ในอายะฮ์ตะยัมมุมเมื่อไม่ระบุหมายถึงฝ่ามือ เหมือนในอายะฮ์ตัดมือขโมย", "จะนำการจำกัดถึงข้อศอกในอายะฮ์วุฎูอ์มาใช้กับตะยัมมุมไม่ได้ เพราะหุก่มต่างกัน วุฎูอ์คือการล้าง ตะยัมมุมคือการลูบ", "หะดีษเรื่องวิธีตะยัมมุมที่ถูกต้องมีเพียงหะดีษอบุลญุฮัยม์และอัมมาร (อิบนุหะญัร)"], "vocab": [{"ar": "ضَرْبَتَانِ", "th": "การตบ (ฝ่ามือลงบนพื้น) สองครั้ง"}, {"ar": "الْمِرْفَقَيْنِ", "th": "ข้อศอกทั้งสอง"}, {"ar": "وَقْفَهُ", "th": "การที่หะดีษเป็นคำของเศาะหาบะฮ์ (เมากูฟ) ไม่ใช่ของท่านนบี ﷺ"}, {"ar": "الْآبَاطُ", "th": "รักแร้"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัดดารุกุฏนีย์บันทึก (1/180) อัลหากิม (1/287) และอิบนุอะดีย์ (5/188) ผ่านอะลี บินซอบยาน จากอุบัยดุลลอฮ์ บินอุมัร จากนาฟิอ์ จากอิบนุอุมัร แบบมัรฟูอ์ สายนี้อ่อน เพราะอะลี บินซอบยาน บินฮิลาล อัลอับสีย์ อ่อนมาก อิบนุมะอีนกล่าวหา อัลบุคอรีย์ว่า \"มุนกัรอัลหะดีษ\" อันนะสาอีย์ว่า \"มัตรูกอัลหะดีษ\" และในอีกที่ว่า \"ไม่น่าเชื่อถือ และไม่ควรเขียนหะดีษของเขา\" อบูซุรอะฮ์ว่า \"หะดีษของเขาอ่อนมาก\" อบูหาติมว่า \"มัตรูก\" อิบนุอะดีย์ว่า \"ความอ่อนในหะดีษของเขาชัดเจน\"", "สุลัยมาน บินอัรก็อมและสุลัยมาน บินอบีดาวูดรายงานสนับสนุนแบบมัรฟูอ์ แต่ทั้งสองอ่อน ไม่ใช้เป็นหลักฐาน ตามที่อัลบัยฮะกีย์และคนอื่นกล่าว", "ที่ถูกต้องคือเป็นเมากูฟจากอิบนุอุมัร (ร.ฎ.) อัดดารุกุฏนีย์ว่า \"ยะห์ยา อัลก็อฏฏอน ฮุชัยม์ และคนอื่นรายงานแบบเมากูฟ ซึ่งถูกต้อง\" แล้วยกสายผ่านฮุชัยม์และยะห์ยาแบบเมากูฟ และอัลบัยฮะกีย์ยกผ่านยะห์ยา บินสะอีดแบบเมากูฟ อิบนุอบีหาติมว่า \"ฉันถามอบูซุรอะฮ์เรื่องหะดีษที่มุหัมมัด บินษาบิตรายงาน จากนาฟิอ์ จากอิบนุอุมัร จากท่านนบี ﷺ เรื่องตะยัมมุมสองครั้ง เขาตอบว่า นี่ผิด มันเป็นเมากูฟ\"", "ผู้แต่งเห็นว่าเมากูฟนี้ไม่ใช่หลักฐาน เพราะหลักฐานอยู่ที่สิ่งที่เศาะหาบะฮ์รายงาน ไม่ใช่ความเห็นของเขาเมื่อขัดกับตัวบท และได้กล่าวแล้วในหะดีษอัมมารว่าตะยัมมุมตบครั้งเดียว อิบนุหะญัรกล่าวว่า \"หะดีษเรื่องวิธีตะยัมมุม ไม่มีที่ถูกต้องนอกจากหะดีษอบุลญุฮัยม์และอัมมาร ที่เหลืออ่อน หรือมีความขัดแย้งว่ามัรฟูอ์หรือเมากูฟ และที่มีน้ำหนักคือไม่ใช่มัรฟูอ์\""]}, {"wajh": 2, "type": "fiqh", "heading_ar": null, "heading_th": "ตบสองครั้งหรือครั้งเดียว", "points_th": ["หะดีษบ่งว่าตะยัมมุมมีการตบสองครั้ง ครั้งหนึ่งลูบหน้า อีกครั้งลูบฝ่ามือ ผู้ที่ว่าตะยัมมุมสองครั้งถือตามนี้ คือทัศนะของอัชชาฟิอีย์และนักวิชาการฝ่ายเราะอ์ย์ อิบนุกุดามะฮ์ว่า \"ที่เป็นซุนนะฮ์ในทัศนะของอะห์มัดคือตะยัมมุมครั้งเดียว ถ้าตะยัมมุมสองครั้งก็ใช้ได้\" อัลกอฎีย์ว่า \"ใช้ได้ด้วยครั้งเดียว และที่สมบูรณ์คือสองครั้ง\"", "ผู้แต่งเห็นว่าที่มีน้ำหนักกว่าคือตบครั้งเดียวก็พอ ตามที่กล่าวแล้ว (หะดีษอัมมาร)"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "ลูบถึงข้อศอกหรือเฉพาะฝ่ามือ", "points_th": ["หะดีษบ่งว่าตะยัมมุมที่มือยาวถึงข้อศอก แต่ในหะดีษอัมมารในเศาะฮีห์ทั้งสองกล่าวถึงฝ่ามือ ในอบูดาวูดจากหะดีษสะละมะฮ์ บินกุฮัยล์ว่า \"ฝ่ามือ ใบหน้า และแขน\" และอีกรายงานผ่านสะละมะฮ์ว่า \"ถึงครึ่งแขน\" และในอบูดาวูดและอันนะสาอีย์ในหะดีษอัมมาร ว่าเศาะหาบะฮ์ (ร.ฎ.) ตะยัมมุมพร้อมท่านนบี ﷺ แล้วลูบมือทั้งหมดถึงไหล่และรักแร้", "ผู้แต่งเห็นว่าที่ถูกคือตะยัมมุมเฉพาะฝ่ามือ เป็นความสะดวกจากอัลลอฮ์ ส่วนหะดีษขอ
