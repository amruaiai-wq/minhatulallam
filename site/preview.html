 ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"เมื่อคนหนึ่งในหมู่พวกท่านไปถ่ายทุกข์ ก็จงชำระด้วยก้อนหินสามก้อน เพราะมันเพียงพอสำหรับเขา\" (อบูดาวูด 40 อันนะสาอีย์ 44 อะห์มัด อัดดารุกุฏนีย์ ซึ่งว่าสายศ่อฮีห์) \"ฟัลยัสตะฏิบ\" คือจงชำระ", "นี่เป็นทัศนะของชาฟิอีย์และฮัมบะลีย์ อิบนุหัซม์เลือก และอิบนุอับดิลบัรร์ยกจากชาวมะดีนะฮ์ส่วนใหญ่ในหมู่สานุศิษย์ของมาลิก", "หะนะฟีย์และมาลิกีย์ว่าสองก้อนก็พอ ไม่จำเป็นต้องมีก้อนที่สาม เพราะท่านนบี ﷺ ใช้เพียงสองก้อนเมื่อโยนมูลสัตว์ทิ้ง และไม่ได้ขอให้อับดุลลอฮ์นำก้อนที่สามมาแทน", "ผู้แต่งเห็นว่าทัศนะแรกมีน้ำหนักกว่า เพราะการขจัดนะญิสแม้จะมีเหตุผลที่เข้าใจได้ คือความสะอาด แต่การที่ศาสนากำหนดการขจัดด้วยก้อนหินไว้สามก้อน เป็นสิ่งที่ต้องยึดถือ การละทิ้งเป็นการขัดต่อผู้บัญญัติที่ทรงปรีชา และเรื่องนี้ยืนยันจากท่านนบี ﷺ ทั้งคำพูดและการกระทำ และคำพูดชัดเจนในเรื่องนี้ เช่น หะดีษสัลมาน (ร.ฎ.) และหะดีษอื่นที่กล่าวแล้ว", "ส่วนเหตุผลของฝ่ายที่สอง ตอบได้สามทาง (1) ท่านรสูล ﷺ ขอก้อนที่สาม ดังที่มาในรายงานของอะห์มัดและอัดดารุกุฏนีย์ที่อิบนุหะญัรยกมา ดูเหมือนจุดประสงค์ของเขาคือตอบโต้อัฏเฏาะหาวีย์ และยืนยันก้อนที่สาม อิบนุหะญัรระบุว่า หากสมมุติว่าอบูอิสหากไม่ได้ยินจากอัลเกาะมะฮ์ ก็เป็นมุรสัล และมุรสัลเป็นหลักฐานสำหรับผู้ที่เห็นต่าง หมายถึงอัฏเฏาะหาวีย์และผู้ที่อยู่ในมัซฮับอบูหะนีฟะฮ์ และสำหรับเรา (ชาฟิอีย์) ก็เช่นกัน เมื่อมีสิ่งสนับสนุน (2) ไม่จำเป็นที่ท่านต้องสั่งอิบนุมัสอูดใหม่ แต่ใช้คำสั่งแรกที่ให้นำมาสามก้อน และเมื่อท่านโยนมูลสัตว์ทิ้ง อิบนุมัสอูดก็รู้ว่าเขายังปฏิบัติตามคำสั่งไม่ครบ จนกว่าจะนำก้อนที่สามมา (3) อาจเป็นไปได้ว่าท่าน ﷺ หยิบก้อนที่สามเองโดยไม่ได้ขอ หรือชำระด้วยก้อนหินหนึ่งก้อนกับสองมุมของอีกก้อน เมื่อมีความเป็นไปได้ การใช้เป็นหลักฐานของอัฏเฏาะหาวีย์และผู้ที่ปกป้องเขา คืออัลอัยนีย์ ก็ไม่สมบูรณ์"]}], "tags_th": ["อิสติจญ์มาร", "ก้อนหินสามก้อน", "มูลสัตว์", "อิบนุมัสอูด", "ตัดลีส"]}, {"id": "v1-h101", "volume": 1, "bab": "qada-hajah", "topic_ar": "بيان ما لا يُستنجى به", "topic_th": "สิ่งที่ห้ามใช้ชำระ", "pages": [405, 407], "hadith": [{"no": 101, "matn_ar": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ أَنَّ رَسُولَ اللهِ ﷺ نَهَى أَنْ يُسْتَنْجَى بِعَظْمٍ، أَوْ رَوْثٍ، وَقَالَ: «إِنَّهُمَا لَا يُطَهِّرَانِ». رَوَاهُ الدَّارَقُطْنِيُّ وَصَحَّحَهُ.", "translation_th": "จากอบูฮุร็อยเราะฮ์ (ร.ฎ.) ว่า ท่านรสูลุลลอฮ์ ﷺ ห้ามชำระด้วยกระดูกหรือมูลสัตว์ และกล่าวว่า \"แท้จริงทั้งสองไม่ทำให้สะอาด\" รายงานโดยอัดดารุกุฏนีย์ และเขาตัดสินว่าศ่อฮีห์", "grade_th": "อัดดารุกุฏนีย์ว่าสายรายงานศ่อฮีห์ ผู้แต่งเห็นว่าไม่มีปัญหา เพราะสอดคล้องกับหะดีษอื่น แต่อัดดารุกุฏนีย์ใน \"อัลอิลัล\" ระบุว่าส่วนเพิ่ม \"ทั้งสองไม่ทำให้สะอาด\" เป็นความผิดพลาด"}], "key_rulings_th": ["ห้ามชำระด้วยกระดูกและมูลสัตว์ เพราะไม่ทำให้สะอาด มูลสัตว์เป็นสิ่งสกปรก ส่วนกระดูกลื่น ไม่ซับนะญิส", "ผู้แต่งเห็นว่าทัศนะที่ถูกต้องคือ การชำระด้วยก้อนหินทำให้สะอาด ไม่ได้เพียงแค่ขจัดออก จึงไม่จำเป็นต้องใช้น้ำตาม แต่ถ้าใช้น้ำด้วยก็สมบูรณ์กว่า", "เงื่อนไขคือต้องสะอาดหมดจด ถ้าสะอาดด้วยสามก้อนหรือมากกว่าก็ใช้ได้ และถ้าสิ่งขับถ่ายเลยออกมาเล็กน้อยจากที่ปกติ ซึ่งเลี่ยงไม่ได้ การชำระด้วยก้อนหินก็ใช้ได้", "ถ้ากระจายไปเกินปกติมาก เช่น ถึงแก้มก้นหรือส่วนปลายองคชาต มัซฮับทั้งสี่ว่าต้องล้างด้วยน้ำ อิบนุตัยมียะฮ์ว่าใช้ก้อนหินได้"], "vocab": [{"ar": "يُسْتَنْجَى", "th": "ชำระสิ่งขับถ่าย"}, {"ar": "رَوْثٌ", "th": "มูลสัตว์"}, {"ar": "لَا يُطَهِّرَانِ", "th": "ไม่ทำให้สะอาด"}, {"ar": "الْبِلَّةُ", "th": "ความเปียกชื้น"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อิบนุอะดีย์บันทึก (3/332) และอัดดารุกุฏนีย์ (1/56) ผ่านสะละมะฮ์ บินเราะญาอ์ จากอัลหะสัน บินฟุร็อต อัลก็อซซาซ จากบิดา จากอบูหาซิม อัลอัชญะอีย์ จากอบูฮุร็อยเราะฮ์ แบบมัรฟูอ์ อัดดารุกุฏนีย์ว่า \"สายรายงานศ่อฮีห์\" อิบนุดะกีกิลอีดยกไว้ใน \"อัลอิลมาม\" และอิบนุหะญัรยกการตัดสินว่าศ่อฮีห์ของอัดดารุกุฏนีย์", "สะละมะฮ์ บินเราะญาอ์ อัตตะมีมีย์ อัลกูฟีย์มีความขัดแย้ง อิบนุมะอีนว่า \"ไม่มีน้ำหนักอะไร\" อันนะสาอีย์ว่า \"อ่อน\" อบูซุรอะฮ์ว่า \"ศอดูก\" อบูหาติมว่า \"หะดีษของเขาไม่มีปัญหา\" อิบนุอะดีย์ว่า \"หะดีษของเขามีที่รายงานคนเดียวและแปลก เขารายงานหะดีษที่ไม่มีใครรายงานสนับสนุน\" และอิบนุหะญัรระบุใน \"อัลมุก็อดดิมะฮ์\" ว่าเขามีหะดีษเดียวในอัลบุคอรีย์ในหมวดคุณความดี", "ผู้แต่งเห็นว่าที่ชัดเจนคือเขาไม่มีปัญหา เพราะหะดีษนี้สอดคล้องกับหะดีษอื่น เช่น หะดีษสัลมานที่กล่าวแล้ว และหะดีษอื่นที่ห้ามชำระด้วยกระดูกและมูลสัตว์ ส่วนอัลหะสัน บินฟุร็อต อิบนุหะญัรว่า \"ศอดูก มีความเข้าใจผิดบ้าง\" อัดดารุกุฏนีย์ระบุใน \"อัลอิลัล\" ว่าเขาผิดพลาดในหะดีษนี้ด้วยการเพิ่ม \"ทั้งสองไม่ทำให้สะอาด\" และอัดดารุกุฏนีย์รายงานหะดีษนี้ผ่านนัศร์ บินหัมมาด จากชุอ์บะฮ์ จากฟุร็อต จากอบูหาซิม โดยไม่มีส่วนเพิ่มนี้ แต่นัศร์ บินหัมมาดอ่อน"]}, {"wajh": 2, "type": "fiqh", "heading_ar": null, "heading_th": "เหตุผลที่ห้ามกระดูกและมูลสัตว์", "points_th": ["หะดีษเป็นหลักฐานว่าห้ามชำระด้วยกระดูกและมูลสัตว์ และให้เหตุผลว่าทั้งสองไม่ทำให้สะอาด แม้อัดดารุกุฏนีย์จะตัดสินว่าส่วนเพิ่มนี้ผิดพลาด ได้กล่าวแล้วในหะดีษอิบนุมัสอูด (ร.ฎ.) ว่าเหตุผลคือทั้งสองเป็นอาหารของญิน และเหตุผลเรื่องมูลสัตว์ว่าเป็นสิ่งสกปรก", "เหตุที่มูลสัตว์ไม่ทำให้สะอาด เพราะเป็นสิ่งสกปรก ส่วนกระดูก เพราะเหนียวลื่น ไม่ค่อยเกาะ จึงไม่ซับนะญิสและไม่ตัดความเปียกชื้น เช่นเดียวกับแก้วเรียบ"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "การชำระด้วยก้อนหินทำให้สะอาด", "points_th": ["หะดีษบ่งว่าการชำระด้วยก้อนหินทำให้สะอาด จนไม่จำเป็นต้องใช้น้ำด้วย ไม่ได้เพียงแค่ขจัดออก เพราะท่านให้เหตุผลว่ากระดูกและมูลสัตว์ไม่ทำให้สะอาด แสดงว่าก้อนหินและสิ่งที่มีความหมายเดียวกันทำให้สะอาด ผู้แต่งเห็นว่านี่คือทัศนะที่ถูกต้องในเรื่องนี้ ที่สนับสนุนคือหะดีษอิบนุมัสอูดที่กล่าวแล้ว ท่านนบี ﷺ ขอก้อนหิน และไม่ได้ขอน้ำ และหะดีษสัลมานที่กล่าวแล้วเช่นกัน", "เงื่อนไขคือต้องสะอาดหมดจด ถ้าบริเวณนั้นสะอาดด้วยก้อนหินสามก้อนหรือมากกว่า ก็ใช้ได้ ไม่จำเป็นต้องชำระด้วยน้ำ ถ้าใช้น้ำด้วยก็เป็นเรื่องของความสะอาดและความหมดจด ซึ่งสมบูรณ์กว่า", "เช่นเดียวกัน ถ้าสิ่งขับถ่ายเลยออกจากที่ปกติเล็กน้อย จนไม่สามารถระวังได้ การชำระด้วยก้อนหินก็ใช้ได้", "แต่ถ้ากระจายจนเกินกว่าปกติ เช่น ถึงบางส่วนของแก้มก้น หรือลามถึงส่วนปลายองคชาตมากผิดปกติ การชำระด้วยก้อนหินใช้ได้หรือไม่ มีสองทัศนะ (1) ต้องล้างด้วยน้ำ ใช้ก้อนหินไม่ได้ เป็นทัศนะของหะนะฟีย์ มาลิกีย์ ชาฟิอีย์ และฮัมบะลีย์ เพราะการชำระด้วยก้อนหินในที่ปกติเป็นการผ่อนปรน เพราะลำบากที่จะต้องล้างเนื่องจากนะญิสเกิดซ้ำ ที่ที่นะญิสไม่เกิดซ้ำจึงต้องล้างเท่านั้น เหมือนแข้งและต้นขา อัลบัยฮะกีย์บันทึกจากอะลี (ร.ฎ.) ว่า \"พวกเขาเคยถ่ายเป็นก้อนเหมือนมูลอูฐ แต่พวกท่านถ่ายเหลว จงใช้น้ำตามหลังก้อนหิน\" แต่สำหรับหะนะฟีย์ไม่จำเป็นต้องเป็นน้ำ ของเหลวที่สะอาดและขจัดได้ใช้ได้ทั้งหมด (2) ใช้ก้อนหินได้ทั้งที่แก้มก้นและส่วนปลายองคชาต เป็นทัศนะของอิบนุตัยมียะฮ์ เพราะหลักฐานทั่วไปที่อนุญาตให้ใช้ก้อนหิน และไม่มีรายงานว่าท่านนบี ﷺ กำหนดขอบเขตในเรื่องนี้"]}], "tags_th": ["อิสติจญ์มาร", "กระดูก", "มูลสัตว์", "ความสะอาด", "อิสตินญาอ์"]}, {"id": "v1-h102-103", "volume": 1, "bab": "qada-hajah", "topic_ar": "وجوب التنزه من البول وأنه من أسباب عذاب القبر", "topic_th": "จำเป็นต้องระวังปัสสาวะ และเป็นสาเหตุหนึ่งของการลงโทษในกุโบร์", "pages": [408, 411], "hadith": [{"no": 102, "matn_ar": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «اسْتَنْزِهُوا مِنَ الْبَوْلِ، فَإِنَّ عَامَّةَ عَذَابِ الْقَبْرِ مِنْهُ». رَوَاهُ الدَّارَقُطْنِيُّ.", "translation_th": "จากอบูฮุร็อยเราะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"พวกท่านจงระวังให้พ้นจากปัสสาวะ เพราะการลงโทษในกุโบร์ส่วนใหญ่มาจากมัน\" รายงานโดยอัดดารุกุฏนีย์", "grade_th": "อัดดารุกุฏนีย์ว่าที่ถูกเป็นมุรสัล ผู้รายงานเชื่อถือได้ ยกเว้นมุหัมมัด บินอัศศ็อบบาห์ ที่อัษษะฮะบีย์ว่าไม่เป็นที่รู้จักและรายงานของเขามุนกัร"}, {"no": 103, "matn_ar": "وَلِلْحَاكِمِ: «أَكْثَرُ عَذَابِ الْقَبْرِ مِنَ الْبَوْلِ». وَهُوَ صَحِيحُ الْإِسْنَادِ.", "translation_th": "และของอัลหากิม \"การลงโทษในกุโบร์ส่วนมากมาจากปัสสาวะ\" และสายรายงานศ่อฮีห์", "grade_th": "ศ่อฮีห์ (อัลหากิม อัลบุคอรีย์ อัดดารุกุฏนีย์) แต่อัดดารุกุฏนีย์ว่าแบบเมากูฟอาจถูกต้องกว่า และอบูหาติมว่าการรายงานแบบมัรฟูอ์ไม่ถูกต้อง มีหลักฐานสนับสนุนจากหะดีษอิบนุอับบาส"}], "key_rulings_th": ["วาญิบต้องระวังปัสสาวะ ด้วยการล้างและขจัดร่องรอยออกจากร่างกาย เสื้อผ้า และที่ละหมาด หะรอมที่จะละเลยเรื่องนี้", "การละเลยเรื่องปัสสาวะเป็นสาเหตุหนึ่งของการลงโทษในกุโบร์ และเป็นสาเหตุที่มากที่สุด และเป็นบาปใหญ่ตามหะดีษอิบนุอับบาสเรื่องสองกุโบร์", "ควรปัสสาวะในที่ดินนุ่มเพื่อไม่ให้กระเซ็น หรือปัสสาวะในห้องน้ำที่ช่องถ่าย และถ้าโดนก็รีบล้าง", "หุก่มนี้ใช้กับปัสสาวะของมนุษย์และปัสสาวะที่เป็นนะญิส ส่วนปัสสาวะของสัตว์ที่กินได้ เช่น อูฐและแพะ เป็นของสะอาด", "การลงโทษในกุโบร์มีอยู่จริง ยืนยันด้วยอัลกุรอาน ซุนนะฮ์ และอิจญ์มาอ์"], "vocab": [{"ar": "اسْتَنْزِهُوا", "th": "จงระวังให้พ้น รักษาตัวให้สะอาดจาก"}, {"ar": "عَامَّةَ عَذَابِ الْقَبْرِ", "th": "การลงโทษในกุโบร์ส่วนใหญ่"}, {"ar": "النَّمِيمَةُ", "th": "การยุยงส่อเสียด นำคำพูดไปบอกต่อเพื่อให้แตกแยก"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجهما", "heading_th": "ที่มาของหะดีษ", "points_th": ["หะดีษแรก: อัดดารุกุฏนีย์บันทึก (1/128) ผ่านมุหัมมัด บินอัศศ็อบบาห์ อัสสัมมาน จากอัซฮัร บินสะอ์ด อัสสัมมาน จากอิบนุเอาน์ จากมุหัมมัด บินสีรีน จากอบูฮุร็อยเราะฮ์ แบบมัรฟูอ์ อัดดารุกุฏนีย์ว่า \"ที่ถูกคือเป็นมุรสัล\" ผู้รายงานในสายนี้เชื่อถือได้ ยกเว้นมุหัมมัด บินอัศศ็อบบาห์ อัษษะฮะบีย์ใน \"อัลมีซาน\" ว่า \"ชาวบัศเราะฮ์ รายงานจากอัซฮัร อัสสัมมาน ไม่เป็นที่รู้จัก และรายงานของเขามุนกัร\" ดูเหมือนหมายถึงหะดีษนี้", "หะดีษที่สอง: อะห์มัดบันทึก (15/12) อัดดารุกุฏนีย์ (1/128) และอัลหากิม (1/183) ผ่านอบูอะวานะฮ์ จากอัลอะอ์มัช จากอบูศอลิห์ จากอบูฮุร็อยเราะฮ์ ว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"การลงโทษในกุโบร์ส่วนมากมาจากปัสสาวะ\" สำนวนของอะห์มัดว่า \"ในเรื่องปัสสาวะ\" อัลหากิมว่า \"เป็นหะดีษศ่อฮีห์ตามเงื่อนไขของอัลบุคอรีย์และมุสลิม ฉันไม่รู้ว่ามีข้อบกพร่อง แต่ทั้งสองไม่ได้บันทึก และมีหลักฐานสนับสนุนจากหะดีษของอบูยะห์ยา อัลก็อตตาต\" อัตติรมิซีย์ถามอัลบุคอรีย์เรื่องหะดีษนี้ เขาตอบว่า \"ศ่อฮีห์\" และอัดดารุกุฏนีย์ก็ว่า \"ศ่อฮีห์\"", "เมื่ออัดดารุกุฏนีย์ถูกถามก็กล่าวว่า \"อัลอะอ์มัชรายงานหะดีษนี้และมีความขัดแย้งกัน อบูอะวานะฮ์รายงานแบบมีสายถึงท่านนบี ﷺ แต่ฟุฎ็อยล์รายงานต่างออกไป เป็นเมากูฟ และดูเหมือนแบบเมากูฟจะถูกต้องกว่า\" อิบนุอบีหาติมถามบิดาเรื่องหะดีษนี้ เขาตอบว่า \"การรายงานแบบมัรฟูอ์ไม่ถูกต้อง\" อิบนุหะญัรยกคำนี้ใน \"อัตตัลคีศ\" โดยไม่ได้แย้งอะไร แต่ในที่นี้เขาระบุชัดว่าศ่อฮีห์", "หลักฐานสนับสนุนจากทางอบูยะห์ยา อัลก็อตตาต ตามที่อัลหากิมกล่าว จากมุญาฮิด จากอิบนุอับบาส แบบมัรฟูอ์ว่า \"การลงโทษในกุโบร์ส่วนใหญ่มาจากปัสสาวะ จงระวังให้พ้นจากปัสสาวะ\" (อัลบัซซาร อัฏเฏาะบะรอนีย์ อัดดารุกุฏนีย์ ซึ่งว่า \"สายรายงานไม่มีปัญหา\" และอัลหากิม อัลฮัยษะมีย์ว่ามีอบูยะห์ยา อัลก็อตตาต ซึ่งยะห์ยา บินมะอีนว่าเชื่อถือได้ในรายงานหนึ่ง และคนอื่นว่าอ่อน อัลอัลบานีย์ว่าศ่อฮีห์ ผู้แต่งเห็นว่าคำของอัดดารุกุฏนีย์ว่าไม่มีปัญหา คือเพราะมีหลักฐานสนับสนุน)"]}, {"wajh": 2, "type": "fiqh", "heading_ar": null, "heading_th": "วาญิบต้องระวังปัสสาวะ", "points_th": ["หะดีษเป็นหลักฐานว่าวาญิบที่มนุษย์ต้องระวังให้พ้นจากปัสสาวะ ด้วยการล้าง และขจัดร่องรอยออกจากร่างกาย เสื้อผ้า หรือที่ละหมาด และหะรอมที่จะละเลยเรื่องนี้ และการละเลยเป็นสาเหตุหนึ่งของการลงโทษในกุโบร์ แท้จริงการลงโทษในกุโบร์ส่วนมากมาจากเรื่องนี้", "ส่วนหนึ่งของการระวังคือ ปัสสาวะในที่ดินนุ่ม เพื่อไม่ให้มีอะไรกระเซ็นมาโดน หรือปัสสาวะในห้องน้ำที่ช่องถ่าย และถ้ามีอะไรโดน ก็ให้รีบทำความสะอาดเสื้อผ้าหรือร่างกายที่โดน", "มีหะดีษอีกมากในเรื่องนี้ ที่อัลมุนซิรีย์ยกไว้ ในนั้นมีหะดีษอิบนุอับบาส (ร.ฎ.) ว่า ท่านนบี ﷺ เดินผ่านสองกุโบร์ แล้วกล่าวว่า \"ทั้งสองถูกลงโทษ และถูกลงโทษไม่ใช่ในเรื่องใหญ่\" แล้วกล่าวว่า \"ใช่ (เป็นเรื่องใหญ่) คนหนึ่งไม่ปกปิดตัวจากปัสสาวะ ส่วนอีกคนเดินยุยงส่อเสียด...\" (อัลบุคอรีย์ 216 มุสลิม 292)", "หะดีษนี้บ่งว่าการไม่ระวังปัสสาวะเป็นบาปใหญ่ ในอีกรายงานของอัลบุคอรีย์ว่า \"ทั้งสองไม่ได้ถูกลงโทษในเรื่องใหญ่ แต่มันเป็นเรื่องใหญ่\" อัลบุคอรีย์ตั้งบทในหมวดวุฎูอ์ว่า \"บทการไม่ปกปิดตัวจากปัสสาวะเป็นบาปใหญ่\" เพราะการไม่ระวังปัสสาวะทำให้ละหมาดเป็นโมฆะ การละเลยจึงเป็นบาปใหญ่อย่างไม่ต้องสงสัย อัษษะฮะบีย์ระบุใน \"อัลกะบาอิร\" ว่าการไม่ระวังปัสสาวะเป็นบาปใหญ่ และอิบนุหะญัร อัลฮัยตะมีย์ใน \"อัซซะวาญิร\"", "อัลเคาะฏฏอบีย์ว่า ความหมายคือ ทั้งสองไม่ได้ถูกลงโทษในเรื่องที่ยากลำบากหรือหนักหนาสำหรับพวกเขา หากต้องการจะทำ คือการระวังปัสสาวะและการละการยุยงส่อเสียด ไม่ได้หมายความว่าการฝ่าฝืนในสองเรื่องนี้ไม่ใช่บาปใหญ่ในทางศาสนา หรือว่าเป็นบาปเล็กน้อย อัลมุนซิรีย์ว่า \"เพราะกลัวว่าจะเข้าใจผิดเช่นนั้น ท่านจึงแก้ไขโดยกล่าวว่า ใช่ มันเป็นเรื่องใหญ่\"", "หุก่มนี้เกี่ยวกับปัสสาวะของมนุษย์และปัสสาวะที่เป็นนะญิสที่คล้ายกัน ส่วนผู้ที่ตีความว่าครอบคลุมปัสสาวะทั้งหมด เช่น อัลเคาะฏฏอบีย์ ถูกปฏิเสธ เพราะในอีกรายงานว่า \"เขาไม่ปกปิดตัวจากปัสสาวะของตน\" อะลิฟลามในคำว่า \"ปัสสาวะ\" จึงแทนสรรพนาม ส่วนปัสสาวะของสัตว์ที่กินได้ เช่น อูฐและแพะ เป็นของสะอาด เพราะท่านนบี ﷺ อนุญาตให้ชาวอุร็อยนะฮ์ดื่มปัสสาวะอูฐ (อัลบุคอรีย์ 233 มุสลิม 1671) และไม่ได้สั่งให้พวกเขาล้างภาชนะ หรือสิ่งที่โดน แสดงว่าเป็นของสะอาด"]}, {"wajh": 3, "type": "fawaid", "heading_ar": null, "heading_th": "การลงโทษในกุโบร์", "points_th": ["หะดีษเป็นหลักฐานยืนยันการลงโทษในกุโบร์ ซึ่งยืนยันด้วยอัลกุรอาน ซุนนะฮ์ และอิจญ์มาอ์ อัลลอฮ์ตรัสถึงวงศ์วานฟิรเอาน์ว่า \"ไฟนรก พวกเขาจะถูกนำไปให้เผชิญมันทั้งเช้าและเย็น\" (ฆอฟิร: 46) อิบนุกะษีรว่า \"อายะฮ์นี้เป็นหลักสำคัญในการที่ชาวซุนนะฮ์ใช้เป็นหลักฐานเรื่องการลงโทษในบัรซัค ในกุโบร์\" และหะดีษจากท่านนบี ﷺ ยืนยันการลงโทษในกุโบร์อย่างมุตะวาติร ส่วนหนึ่งคือหะดีษที่กล่าวมา ขออัลลอฮ์ทรงคุ้มครองเราจากการลงโทษในกุโบร์"]}], "tags_th": ["ปัสสาวะ", "การลงโทษในกุโบร์", "บาปใหญ่", "นะญิส", "การยุยงส่อเสียด"]}, {"id": "v1-h104", "volume": 1, "bab": "qada-hajah", "topic_ar": "الاعتماد على الرجل اليسرى عند قضاء الحاجة", "topic_th": "การลงน้ำหนักบนเท้าซ้ายขณะถ่ายทุกข์", "pages": [412, 413], "hadith": [{"no": 104, "matn_ar": "عَنْ سُرَاقَةَ بْنِ مَالِكٍ رَضِيَ اللهُ عَنْهُ قَالَ: عَلَّمَنَا رَسُولُ اللهِ ﷺ فِي الْخَلَاءِ: أَنْ نَقْعُدَ عَلَى الْيُسْرَى، وَنَنْصِبَ الْيُمْنَى. رَوَاهُ الْبَيْهَقِيُّ بِسَنَدٍ ضَعِيفٍ.", "translation_th": "จากสุรอเกาะฮ์ บินมาลิก (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ สอนเราเรื่องการถ่ายทุกข์ ให้เรานั่งบนเท้าซ้าย และตั้งเท้าขวาขึ้น รายงานโดยอัลบัยฮะกีย์ ด้วยสายรายงานที่อ่อน", "grade_th": "ฎออีฟ (อ่อน)"}], "key_rulings_th": ["หะดีษอ่อน และหะดีษอ่อนใช้ยืนยันข้อบัญญัติทางศาสนาไม่ได้", "นักวิชาการระบุว่าท่านั่งแบบนี้ทำให้ขับถ่ายง่าย ผู้แต่งกล่าวว่า ถ้ายืนยันได้ทางการแพทย์ว่าเป็นประโยชน์ ก็เป็นสิ่งที่ต้องการ ไม่ใช่เพราะเป็นซุนนะฮ์ แต่เพราะเป็นประโยชน์ ซึ่งศาสนาสั่งให้ทำ ตราบที่ศาสนาไม่ได้ชี้ว่าไม่ถูกต้อง", "สำนวนของอัลบัยฮะกีย์คือ \"ลงน้ำหนักบนเท้าซ้าย\" ส่วนสำนวนในหนังสือ \"นั่งบนเท้าซ้าย\" มีปัญหา เพราะการถ่ายทุกข์ไม่ใช่การนั่งบนเท้าซ้าย มิฉะนั้นจะเปื้อนนะญิส"], "vocab": [{"ar": "نَقْعُدَ عَلَى الْيُسْرَى", "th": "นั่ง (ลงน้ำหนัก) บนเท้าซ้าย"}, {"ar": "نَنْصِبَ الْيُمْنَى", "th": "ตั้งเท้าขวาขึ้น"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["คืออบูสุฟยาน สุรอเกาะฮ์ บินมาลิก บินญุอ์ชุม อัลมุดลิญีย์ อัลกินานีย์ อาศัยอยู่ที่กุดัยด์ (หมู่บ้านระหว่างคุลัยศ์กับอุสฟาน ใกล้มักกะฮ์) นับเป็นชาวมะดีนะฮ์", "อัลบุคอรีย์รายงานเรื่องที่เขาตามทันท่านรสูล ﷺ ตอนอพยพไปมะดีนะฮ์ ท่านนบี ﷺ ขอดุอาอ์ต่อเขา จนขาม้าของเขาจมลงไปในดิน แล้วเขาขอให้ท่านช่วย และสัญญาว่าจะไม่บอกใครถึงท่าน เขาก็ทำตาม ท่านเขียนหนังสือให้ความปลอดภัยแก่เขา เขารับอิสลามวันพิชิตมักกะฮ์ และเสียชีวิตปี ฮ.ศ. 24 ในสมัยคิลาฟะฮ์ของอุษมาน (ร.ฎ.) บางทัศนะว่าเสียชีวิตหลังอุษมาน"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อบูบักร บินอบีชัยบะฮ์รายงานในมุสนัดของเขา (ตามที่มีใน \"อัลมะฏอลิบ อัลอาลียะฮ์\") อัฏเฏาะบะรอนีย์ใน \"อัลกะบีร\" (7/160–161) และอัลบัยฮะกีย์ใน \"อัสสุนันอัลกุบรอ\" (1/96) ผ่านมุหัมมัด บินอับดิรเราะห์มาน จากชายคนหนึ่งจากบะนีมุดลิจ จากบิดาของเขา ว่า \"สุรอเกาะฮ์ บินญุอ์ชุมมาหาเรา แล้วกล่าวว่า ท่านรสูลุลลอฮ์ ﷺ สอนเราว่า เมื่อคนหนึ่งในหมู่เราเข้าห้องสุขา ให้ลงน้ำหนักบนเท้าซ้าย และตั้งเท้าขวาขึ้น\"", "สายนี้อ่อน อิบนุหะญัรยกมาเพื่อให้รู้สถานะ เพราะมีชายสองคนที่ไม่ระบุชื่อ คือชายจากบะนีมุดลิจและบิดาของเขา และมุหัมมัด บินอับดิรเราะห์มานไม่เป็นที่รู้จัก และหะดีษนี้ไม่มีสายอื่น", "สำนวนของอัลบัยฮะกีย์ดังที่เห็นคือ \"ให้ลงน้ำหนัก\" ความหมายคือให้เอนตัวลงบนเท้าซ้าย ส่วนสำนวนของอิบนุหะญัร \"ให้นั่ง\" มีปัญหา เพราะการถ่ายทุกข์ไม่ใช่การนั่งบนเท้าซ้าย มิฉะนั้นจะเปื้อนนะญิส"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "ท่านั่งขณะถ่ายทุกข์", "points_th": ["หะดีษเป็นหลักฐานว่าส่งเสริมให้ตั้งเท้าขวา และลงน้ำหนักบนเท้าซ้ายขณะถ่ายทุกข์ นักวิชาการระบุว่าท่านี้ทำให้ขับถ่ายง่าย", "แต่หะดีษนี้อ่อนดังกล่าวแล้ว และหะดีษอ่อนใช้ยืนยันข้อบัญญัติทางศาสนาไม่ได้ ผู้แต่งกล่าวว่า ถ้ายืนยันได้ทางการแพทย์ว่าท่านั่งนี้เป็นประโยชน์ ก็เป็นสิ่งที่ต้องการ ไม่ใช่เพราะเป็นซุนนะฮ์ แต่เพราะเป็นประโยชน์ เพราะทุกสิ่งที่มีประโยชน์เป็นสิ่งที่ถูกสั่งให้ทำ ตราบที่ศาสนาไม่ได้ชี้ว่าไม่ถูกต้อง"]}], "tags_th": ["มารยาทการถ่ายทุกข์", "ท่านั่ง", "หะดีษอ่อน", "สุรอเกาะฮ์"]}, {"id": "v1-h105", "volume": 1, "bab": "qada-hajah", "topic_ar": "استحباب نتر الذكر بعد البول", "topic_th": "การส่งเสริมให้รีดอวัยวะเพศหลังปัสสาวะ (นัตร์)", "pages": [414, 416], "hadith": [{"no": 105, "matn_ar": "عَنْ عِيسَى بْنِ يَزْدَادَ، عَنْ أَبِيهِ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «إِذَا بَالَ أَحَدُكُمْ فَلْيَنْتُرْ ذَكَرَهُ ثَلَاثَ مَرَّاتٍ». رَوَاهُ ابْنُ مَاجَهْ بِسَنَدٍ ضَعِيفٍ.", "translation_th": "จากอีสา บินยัซดาด จากบิดาของเขา กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"เมื่อคนหนึ่งในหมู่พวกท่านปัสสาวะ ก็จงรีดอวัยวะเพศของตนสามครั้ง\" รายงานโดยอิบนุมาญะฮ์ ด้วยสายรายงานที่อ่อน", "grade_th": "ฎออีฟ (อ่อน) ตามความเห็นพ้องของนักวิชาการหะดีษ และเนื้อความก็อ่อนด้วย (ผู้แต่ง)"}], "key_rulings_th": ["ผู้แต่งเห็นว่าที่ถูกคือการรีดอวัยวะเพศหลังปัสสาวะไม่เป็นที่ส่งเสริม เพราะหะดีษไม่ถูกต้อง และเพราะทำให้เกิดวัสวาส", "เมื่อปัสสาวะเสร็จ ให้ล้างปลายอวัยวะเพศ การรูดอวัยวะเพศจากโคนถึงปลายสามครั้งที่นักฟิกฮ์กล่าวถึงก็ไม่มีหลักฐาน และอาจเป็นอันตราย", "อิบนุตัยมียะฮ์ว่าการรีดและการรูดเป็นบิดอะฮ์ตามทัศนะที่ถูกต้อง เพราะปัสสาวะออกมาเองตามธรรมชาติ และหยุดเองเมื่อเสร็จ", "ผู้ที่บางครั้งมีปัสสาวะออกมาหลังปัสสาวะเสร็จ ถ้าไม่ขยับหรือเดินสักสองสามก้าว ก็ทำได้โดยไม่เป็นไร โดยมีเงื่อนไขว่าแน่ใจจากประสบการณ์ว่ามีสิ่งออกมาจริง ถ้าเป็นเพียงความระแวงหรือวัสวาสก็ไม่ต้องสนใจ"], "vocab": [{"ar": "فَلْيَنْتُرْ", "th": "จงรีด ดึงเอาปัสสาวะที่เหลือออกจากอวัยวะเพศ"}, {"ar": "السَّلْتُ", "th": "การรูดอวัยวะเพศจากโคนถึงปลาย"}, {"ar": "السَّلَسُ", "th": "ภาวะปัสสาวะเล็ดไม่หยุด"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["คืออีสา บินยัซดาด บางทัศนะว่า บินบัซดาด และบางทัศนะว่า อิซดาด อัลฟาริสีย์ อัลยะมานีย์ รายงานจากบิดา และซะกะริยา บินอิสหากรายงานจากเขา อัลบุคอรีย์ว่า \"หะดีษของเขาไม่ถูกต้อง\" และอิบนุหิบบานยกไว้ใน \"อัษษิกอต\"", "ส่วนบิดาของเขา อบูหาติมว่า \"ไม่ได้เป็นเศาะหาบะฮ์ หะดีษของเขาเป็นมุรสัล\" อิบนุหิบบานว่า \"มีผู้กล่าวว่าเขาเป็นเศาะหาบะฮ์\" ผู้ที่ระบุชัดว่าเขาไม่ได้เป็นเศาะหาบะฮ์ได้แก่ อัลบุคอรีย์ อบูดาวูด อบูหาติม บุตรของเขาอับดุรเราะห์มาน อิบนุอะดีย์ และคนอื่น ตามที่อิบนุกะษีรระบุ และอิบนุมะอีนว่า \"ไม่รู้จักทั้งอีสาและบิดาของเขา\""]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อิบนุมาญะฮ์บันทึก (326) และอะห์มัด (31/399) ผ่านซัมอะฮ์ บินศอลิห์ จากอีสา บินยัซดาด อัลยะมานีย์ จากบิดา และอะห์มัด (31/400) ผ่านซะกะริยา บินอิสหาก จากอีสา", "สายนี้อ่อนตามความเห็นพ้องของนักวิชาการหะดีษ และไม่มีสายที่ถูกต้อง ด้วยเหตุที่กล่าวแล้ว และซัมอะฮ์ บินศอลิห์ก็ถูกวิจารณ์ ส่วนใหญ่ว่าอ่อน อะห์มัด อิบนุมะอีน (ในรายงานหนึ่ง) อบูซุรอะฮ์ อิบนุหิบบาน และคนอื่นว่าอ่อน อันนะวะวีย์ว่า \"เห็นพ้องกันว่าเขาอ่อน\"", "ผู้แต่งว่าหะดีษนี้อ่อนทั้งสายรายงานและเนื้อความ ความหมายไม่ถูกต้อง เพราะการรีดอวัยวะเพศทำให้ปัสสาวะไหลและต่อเนื่อง และคนที่ทำเช่นนี้นำความเดือดร้อนมาสู่ตัวเอง ทั้งปัสสาวะเล็ด วัสวาส และการนั่งถ่ายนาน", "ส่วนที่ผู้อธิบายชาวมัฆริบ และอัศศ็อนอานีย์ที่ตามเขา กล่าวว่าหะดีษอิบนุอับบาสเรื่องสองกุโบร์เป็นหลักฐานสนับสนุนหะดีษนี้ ผู้แต่งเห็นว่าไม่ชัดเจน เพราะหะดีษอิบนุอับบาสบ่งถึงอันตรายและความร้ายแรงของการละเลยเรื่องปัสสาวะ และวาญิบต้องระวัง แต่การระวังไม่ได้หมายความว่าต้องรีดอวัยวะเพศ แต่คือการล้างปัสสาวะ และล้างสิ่งที่โดนร่างกายหรือเสื้อผ้า"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ฟัลยันตุร\" มาจากคำว่า \"อันนัตร์\" ใน \"อัลกอมูส\" ว่า \"อิสตันตะเราะ มิน เบาลิฮี คือดึงและเอาปัสสาวะที่เหลือออกจากอวัยวะเพศเมื่อชำระ ด้วยความตั้งใจและใส่ใจ\" ลักษณะคือสะบัดอวัยวะเพศเพื่อเอาสิ่งที่เหลือในท่อออก"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "การรีดอวัยวะเพศหลังปัสสาวะ", "points_th": ["หะดีษเป็นหลักฐานว่าส่งเสริมให้รีดสามครั้งหลังปัสสาวะ เพื่อเอาปัสสาวะที่เหลือออกจากอวัยวะเพศ เพื่อความสะอาดยิ่งขึ้น นักฟิกฮ์หลายคน เช่น ชาฟิอีย์และฮัมบะลีย์ ส่งเสริมเรื่องนี้ ไม่ว่าจะใช้หะดีษนี้เป็นหลักฐาน หรืออาศัยความหมายที่กล่าวมา", "ผู้แต่งเห็นว่าที่ถูกคือไม่ส่งเสริม เพราะหะดีษไม่ถูกต้อง และเพราะทำให้เกิดวัสวาสดังกล่าวแล้ว แต่เมื่อปัสสาวะเสร็จ ให้ล้างปลายอวัยวะเพศ เช่นเดียวกับการรูด (สัลต์) ที่นักฟิกฮ์กล่าวถึง คือรูดอวัยวะเพศจากโคนถึงปลายสามครั้ง ไม่มีสิ่งใดถูกต้องในเรื่องนี้ และอาจเป็นอันตราย", "อิบนุตัยมียะฮ์กล่าวว่า \"การรีดอวัยวะเพศเป็นบิดอะฮ์ตามทัศนะที่ถูกต้อง... การรูดปัสสาวะก็เช่นกัน ท่านรสูลุลลอฮ์ ﷺ ไม่ได้บัญญัติไว้ หะดีษที่รายงานเรื่องนี้อ่อน ไม่มีที่มา ปัสสาวะออกมาเองตามธรรมชาติ และเมื่อเสร็จก็หยุดเองตามธรรมชาติ เหมือนที่กล่าวกันว่า มันเหมือนเต้านม ถ้าปล่อยไว้ก็หยุด ถ้ารีดก็ไหล\" อิบนุลก็อยยิมว่า \"ฉันทบทวนกับอาจารย์ของเรา (อิบนุตัยมียะฮ์) เรื่องการรูดและการรีด เขาไม่เห็นด้วย และว่า หะดีษไม่ถูกต้อง\"", "ถ้าบางคนพบว่ามีบางสิ่งออกมาหลังปัสสาวะ ถ้าไม่ขยับหรือเดินสักสองสามก้าว ก็มีหุก่มเฉพาะ ไม่ควรทำเป็นเรื่องทั่วไปสำหรับทุกคน คนแบบนี้ไม่เป็นไรถ้าจะขยับหรือเดินสักสองสามก้าว โดยมีเงื่อนไขว่าแน่ใจจากประสบการณ์ว่ามีบางสิ่งออกมา ถ้าเป็นเพียงความระแวงหรือวัสวาส ก็ไม่ต้องใส่ใจและไม่ควรสนใจ อันนะวะวีย์ว่า \"ที่เลือกคือ เรื่องนี้ต่างกันตามแต่ละคน จุดประสงค์คือให้มั่นใจว่าไม่มีอะไรเหลือในท่อปัสสาวะที่กลัวว่าจะออกมา... และทุกคนไม่ควรไปถึงขั้นวัสวาส\""]}], "tags_th": ["ปัสสาวะ", "วัสวาส", "บิดอะฮ์", "หะดีษอ่อน", "อิสตินญาอ์"]}, {"id": "v1-h106-107", "volume": 1, "bab": "qada-hajah", "topic_ar": "حكم الجمع بين الحجارة والماء في الاستنجاء", "topic_th": "ข้อตัดสินการใช้ทั้งก้อนหินและน้ำในการชำระ", "pages": [417, 420], "hadith": [{"no": 106, "matn_ar": "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللهُ عَنْهُمَا أَنَّ النَّبِيَّ ﷺ سَأَلَ أَهْلَ قُبَاءٍ، فَقَالُوا: إِنَّا نُتْبِعُ الْحِجَارَةَ الْمَاءَ. رَوَاهُ الْبَزَّارُ بِسَنَدٍ ضَعِيفٍ.", "translation_th": "จากอิบนุอับบาส (ร.ฎ.) ว่า ท่านนบี ﷺ ถามชาวกุบาอ์ พวกเขาตอบว่า \"พวกเราใช้น้ำตามหลังก้อนหิน\" รายงานโดยอัลบัซซาร ด้วยสายรายงานที่อ่อน", "grade_th": "ฎออีฟ (อ่อน)"}, {"no": 107, "matn_ar": "وَأَصْلُهُ فِي أَبِي دَاوُدَ، وَالتِّرْمِذِيِّ، وَصَحَّحَهُ ابْنُ خُزَيْمَةَ مِنْ حَدِيثِ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ بِدُونِ ذِكْرِ الْحِجَارَةِ.", "translation_th": "และต้นเรื่องของหะดีษนี้อยู่ในอบูดาวูดและอัตติรมิซีย์ และอิบนุคุซัยมะฮ์ตัดสินว่าศ่อฮีห์ จากหะดีษของอบูฮุร็อยเราะฮ์ (ร.ฎ.) โดยไม่กล่าวถึงก้อนหิน", "grade_th": "สายรายงานอ่อน (อันนะวะวีย์ อิบนุหะญัร) แต่ศ่อฮีห์ด้วยหลักฐานสนับสนุนจำนวนมาก (อัลอัลบานีย์)"}], "key_rulings_th": ["การชำระมีสามกรณี (1) ใช้ก้อนหินแล้วตามด้วยน้ำ ไม่มีหะดีษที่ยืนยันได้ทั้งคำพูดและการกระทำ แต่ผู้แต่งว่าไม่ต้องสงสัยว่าการใช้ทั้งสองอย่างประเสริฐและสะอาดสมบูรณ์กว่า", "(2) ใช้น้ำอย่างเดียว ประเสริฐกว่าใช้ก้อนหินอย่างเดียว เพราะทำให้บริเวณนั้นสะอาด", "(3) ใช้ก้อนหินอย่างเดียว ก็เพียงพอ ไม่ว่าจะมีน้ำหรือไม่ อยู่บ้านหรือเดินทาง สุขภาพดีหรือป่วย", "ศาสนาบัญญัติให้ล้างทวารหนักจากร่องรอยสิ่งขับถ่ายด้วยน้ำ ตามหะดีษชาวกุบาอ์ ซึ่งอัลลอฮ์ทรงสรรเสริญความสะอาดของพวกเขา"], "vocab": [{"ar": "قُبَاءٌ", "th": "กุบาอ์ (ฎ็อมมะฮ์ที่กอฟ มีมัด) สถานที่ห่างจากมะดีนะฮ์ราวสามไมล์ ปัจจุบันเป็นย่านหนึ่งของมะดีนะฮ์"}, {"ar": "نُتْبِعُ الْحِجَارَةَ الْمَاءَ", "th": "เราใช้น้ำตามหลังก้อนหิน"}, {"ar": "النَّجْوُ", "th": "สิ่งขับถ่าย (อุจจาระ)"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجهما", "heading_th": "ที่มาของหะดีษ", "points_th": ["หะดีษอิบนุอับบาส: อัลบัซซารบันทึกในมุสนัด (150 มุคตะศ็อร ซะวาอิดิฮี) จากอับดุลลอฮ์ บินชะบีบ จากอะห์มัด บินมุหัมมัด บินอับดิลอะซีซ ว่า \"ฉันพบในตำราของบิดาฉัน\" จากอัซซุฮ์รีย์ จากอุบัยดุลลอฮ์ บินอับดิลลาฮ์ จากอิบนุอับบาสว่า อายะฮ์นี้ลงมาเกี่ยวกับชาวกุบาอ์ \"ในนั้นมีชายที่ชอบทำความสะอาด และอัลลอฮ์ทรงรักผู้ที่ทำความสะอาด\" (อัตเตาบะฮ์: 108) ท่านรสูลุลลอฮ์ ﷺ จึงถามพวกเขา พวกเขาตอบว่า \"พวกเราใช้น้ำตามหลังก้อนหิน\"", "สายนี้อ่อน เพราะมีมุหัมมัด บินอับดิลอะซีซ บินอุมัร อัซซุฮ์รีย์ อันนะสาอีย์ว่า \"มัตรูก\" อิบนุอบีหาติมถามบิดาเรื่องเขา บิดาตอบว่า \"เป็นพี่น้องสามคน มุหัมมัด อับดุลลอฮ์ และอิมรอน บุตรอับดุลอะซีซ อ่อนในหะดีษ ไม่มีหะดีษที่ตรงของพวกเขา\" อัลฮัยษะมีย์ยกจากอัลบุคอรีย์ว่าอ่อน และอัลบัซซารกล่าวหลังหะดีษว่า \"เราไม่รู้ว่ามีใครรายงานจากอัซซุฮ์รีย์นอกจากมุหัมมัด บินอับดิลอะซีซ และไม่มีใครรายงานจากเขานอกจากบุตรของเขา\" ในสายยังมีอับดุลลอฮ์ บินชะบีบ ซึ่งอ่อน อัษษะฮะบีย์ว่า \"นักประวัติศาสตร์ที่รอบรู้ แต่ไม่น่าเชื่อถือ\" อบูอะห์มัด อัลหากิมว่า \"หะดีษของเขาไม่มีค่า\" และอิบนุหิบบานว่า \"เขาสลับและขโมยรายงาน\"", "หะดีษอบูฮุร็อยเราะฮ์: อบูดาวูดบันทึก (44) อัตติรมิซีย์ (3100) และอิบนุมาญะฮ์ (357) ผ่านยูนุส บินอัลหาริษ จากอิบรอฮีม บินอบีมัยมูนะฮ์ จากอบูศอลิห์ จากอบูฮุร็อยเราะฮ์ จากท่านนบี ﷺ ว่า \"อายะฮ์นี้ลงมาเกี่ยวกับชาวกุบาอ์ ในนั้นมีชายที่ชอบทำความสะอาด... เขากล่าวว่า พวกเขาชำระด้วยน้ำ อายะฮ์นี้จึงลงมาเกี่ยวกับพวกเขา\" สายนี้อ่อน อันนะวะวีย์และอิบนุหะญัรว่าอ่อน มีข้อบกพร่องสองประการ (1) ยูนุส บินอัลหาริษอ่อน อะห์มัดว่า \"หะดีษของเขาสับสน\" อิบนุมะอีนว่า \"ไม่มีน้ำหนักอะไร\" และในอีกรายงานว่า \"ไม่มีปัญหา เขียนหะดีษของเขาไว้ได้\" อบูหาติมว่า \"ไม่แข็งแรง\" อบูดาวูดว่า \"เป็นที่รู้จัก มีหลายคนรายงานจากเขา\" (2) อิบรอฮีม บินอบีมัยมูนะฮ์ไม่เป็นที่รู้จัก อิบนุลก็อฏฏอนว่า \"สภาพไม่เป็นที่รู้จัก ไม่มีใครรายงานจากเขานอกจากยูนุส บินอัลหาริษ ซึ่งอ่อน... การไม่รู้จักอิบรอฮีมก็เพียงพอที่จะถือว่าหะดีษมีข้อบกพร่อง\"", "แต่หะดีษนี้มีหลักฐานสนับสนุนจำนวนมากที่ทำให้ศ่อฮีห์ และบ่งว่าศาสนาบัญญัติให้ล้างทวารหนักจากร่องรอยสิ่งขับถ่าย เช่น จากทางอบูอุวัยส์ จากชุเราะห์บีล จากอุวัยม์ บินสาอิดะฮ์ อัลอันศอรีย์ ว่าท่านนบี ﷺ มาหาพวกเขาที่มัสยิดกุบาอ์ แล้วกล่าวว่า \"แท้จริงอัลลอฮ์ทรงสรรเสริญพวกท่านอย่างดีในเรื่องความสะอาด ในเรื่องมัสยิดของพวกท่าน ความสะอาดที่พวกท่านทำคืออะไร\" พวกเขาตอบว่า \"ขอสาบานต่ออัลลอฮ์ โอ้ท่านรสูลุลลอฮ์ เราไม่รู้อะไร นอกจากว่าเรามีเพื่อนบ้านเป็นชาวยิว พวกเขาล้างทวารหนักจากอุจจาระ เราจึงล้างเหมือนที่พวกเขาล้าง\" (อะห์มัด อัลหากิม อิบนุคุซัยมะฮ์ สายอ่อนเพราะอบูอุวัยส์และชุเราะห์บีล แต่ได้รับการเสริมด้วยหะดีษก่อนหน้า)", "ในบทนี้ยังมีหะดีษอบูอุมามะฮ์ หะดีษอับดุลลอฮ์ บินสะลาม (ทั้งสองสายอ่อน) และหะดีษอาอิชะฮ์ \"จงสั่งสามีของพวกเธอให้ชำระด้วยน้ำ เพราะฉันอายพวกเขา แท้จริงท่านรสูลุลลอฮ์ ﷺ เคยทำเช่นนั้น\" (อัตติรมิซีย์ 19 อันนะสาอีย์ อะห์มัด อัตติรมิซีย์ว่าศ่อฮีห์ แต่มีข้อบกพร่อง)", "อิบนุหะญัรใน \"ฟัตหุลบารีย์\" ยกหะดีษของบทนี้ คือหะดีษอบูฮุร็อยเราะฮ์ และว่า \"สายรายงานศ่อฮีห์\" ผู้แต่งเห็นว่านี่เป็นความผิดพลาดของเขา ถ้าเขากล่าวว่า \"เป็นหะดีษศ่อฮีห์\" ก็จะถูก คือเพราะมีหลักฐานสนับสนุน ตามที่อัลอัลบานีย์ระบุ"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"กุบาอ์\" (ฎ็อมมะฮ์ที่กอฟ มีมัด) เป็นคำเพศชายที่ผันได้ ซึ่งเป็นทัศนะที่ถูกต้องของนักวิชาการผู้ตรวจสอบและคนส่วนใหญ่ อีกสำเนียงหนึ่งเป็นคำเพศหญิงที่ผันไม่ได้ เพราะเป็นชื่อเฉพาะและเพศหญิง และอีกสำเนียงหนึ่งเป็นคำที่ไม่มีมัด เป็นชื่อสถานที่ใกล้มะดีนะฮ์ราวสามไมล์ ซึ่งเป็นในอดีต ปัจจุบันเป็นย่านหนึ่งของมะดีนะฮ์"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "สามกรณีของการชำระ", "points_th": ["หะดีษเป็นหลักฐานว่าการขจัดนะญิสจากทวาร ด้วยการทำให้เบาลงด้วยก้อนหินแล้วตามด้วยน้ำ เป็นการทำความสะอาดที่สมบูรณ์ที่สุด เพื่อให้สะอาดหมดจด นี่คือกรณีแรก กรณีนี้ไม่มีหะดีษที่ยืนยันได้ทั้งคำพูดและการกระทำ เพราะหะดีษอะนัสที่กล่าวแล้วตอนต้นบท (ฉันกับเด็กหนุ่มคนหนึ่งตามไปพร้อมภาชนะน้ำ แล้วท่านก็ชำระด้วยน้ำ) มีความเป็นไปได้หลายทาง แต่ไม่ต้องสงสัยว่าการใช้ทั้งสองอย่างประเสริฐและสะอาดสมบูรณ์กว่า", "กรณีที่สอง: ใช้น้ำอย่างเดียว ซึ่งประเสริฐกว่าใช้ก้อนหินอย่างเดียว เพราะทำให้บริเวณนั้นสะอาด นี่คือความหมายตามตัวบทของหะดีษอะนัสที่ว่าท่านนบี ﷺ ชำระด้วยน้ำ ซึ่งอาจหมายความว่าท่านชำระด้วยน้ำหลังชำระด้วยก้อนหิน หรือชำระด้วยน้ำอย่างเดียว", "กรณีที่สาม: ใช้ก้อนหินอย่างเดียว ไม่ต่างกันว่าจะมีน้ำหรือไม่ อยู่บ้านหรือเดินทาง สุขภาพดีหรือป่วย หลักฐานคือหะดีษสัลมานที่กล่าวแล้ว \"ท่านรสูลุลลอฮ์ ﷺ ห้ามเราชำระด้วยก้อนหินน้อยกว่าสามก้อน\" และหะดีษอิบนุมัสอูด (ร.ฎ.) ที่ท่านรสูล ﷺ สั่งให้นำก้อนหินสามก้อนมา และหะดีษอบูฮุร็อยเราะฮ์ (ร.ฎ.) ว่าเขารวบรวมก้อนหินให้ท่านนบี ﷺ แล้วนำมาที่ชายเสื้อ วางไว้ข้างท่าน แล้วก็จากไป (อัลบุคอรีย์ 155)", "อิบนุลก็อยยิมระบุในแนวทางของท่านนบี ﷺ เรื่องการถ่ายทุกข์ว่า บางครั้งท่านชำระด้วยน้ำ บางครั้งชำระด้วยก้อนหิน และบางครั้งใช้ทั้งสองอย่าง ผู้แต่งเห็นว่าสองกรณีแรกยืนยันได้ ส่วนการใช้ทั้งสองอย่างจากการกระทำของท่านยืนยันไม่ได้ (ผู้แต่งยกจาก \"อัลมันฮัลอัลอัซบ์อัลเมารูด\" ว่า) \"ถ้ายืนยันได้ ผู้ที่กล่าวว่าการใช้ทั้งสองอย่างประเสริฐที่สุด ก็คงไม่ต้องใช้หะดีษชาวกุบาอ์ที่อัลบัซซารบันทึก ซึ่งอ่อนเป็นหลักฐาน และการกระทำของท่านก็คงเป็นหลักฐานว่าประเสริฐกว่า ถ้ายืนยันได้\""]}], "tags_th": ["อิสตินญาอ์", "อิสติจญ์มาร", "ชำระด้วยน้ำ", "ชาวกุบาอ์", "ความสะอาด"]}, {"id": "v2-h108", "volume": 2, "bab": "ghusl", "topic_ar": "ما جاء في أنه لا اغتسال إلا من إنزال", "topic_th": "ไม่ต้องอาบน้ำ (ฆุสล์) นอกจากเมื่อมีการหลั่งอสุจิ", "pages": [6, 8], "hadith": [{"no": 108, "matn_ar": "وَعَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «الْمَاءُ مِنَ الْمَاءِ». رَوَاهُ مُسْلِمٌ، وَأَصْلُهُ فِي الْبُخَارِيِّ.", "translation_th": "และจากอบูสะอีด อัลคุดรีย์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"น้ำ (การอาบน้ำ) เนื่องมาจากน้ำ (อสุจิ)\" รายงานโดยมุสลิม และต้นเรื่องอยู่ในอัลบุคอรีย์", "grade_th": "ศ่อฮีห์ (มุสลิม) แต่ข้อบัญญัติถูกยกเลิก (มันซูค)"}], "key_rulings_th": ["ตัวบทของหะดีษบ่งว่าวาญิบต้องอาบน้ำเมื่อหลั่งอสุจิ และความหมายแฝงบ่งว่าไม่ต้องอาบถ้าไม่หลั่ง แม้จะร่วมประเวณีแล้วก็ตาม", "นี่เป็นข้อบัญญัติในช่วงต้นอิสลาม เป็นการผ่อนปรนเพราะเสื้อผ้ามีน้อย แล้วถูกยกเลิก ต่อมาบัญญัติให้อาบน้ำเพียงแค่สอดใส่ แม้ไม่หลั่ง", "นักวิชาการบางคนตีความหะดีษนี้ว่าหมายถึงการฝันเปียก แต่ผู้แต่งเห็นว่าทัศนะนี้อ่อน เพราะสาเหตุของหะดีษคือการร่วมประเวณี ไม่ใช่การฝัน และสาเหตุย่อมรวมอยู่ในหุก่มแน่นอนตามนักวิชาการส่วนใหญ่"], "vocab": [{"ar": "الْمَاءُ مِنَ الْمَاءِ", "th": "น้ำแรกคือน้ำที่ใช้อาบ น้ำที่สองคืออสุจิที่หลั่งออกมาอย่างแรงพร้อมความรู้สึกสุข"}, {"ar": "أُعْجِلْتَ", "th": "ถูกเร่งให้รีบ (ออกจากภรรยาก่อนหลั่ง)"}, {"ar": "قُحِطْتَ", "th": "ร่วมประเวณีแต่ไม่หลั่ง (อิกสาล)"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["มุสลิมบันทึก (343) ในหมวดประจำเดือน บท \"น้ำนั้นเนื่องมาจากน้ำเท่านั้น\" ผ่านชะรีก บินอบีนะมิร จากอับดุรเราะห์มาน บินอบีสะอีด อัลคุดรีย์ จากบิดาว่า \"ฉันออกไปกับท่านรสูลุลลอฮ์ ﷺ วันจันทร์ไปยังกุบาอ์ เมื่อถึงบะนีสาลิม ท่านหยุดที่ประตูบ้านอิตบาน แล้วเรียกเขา เขาออกมาพร้อมลากผ้านุ่ง ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า เราทำให้ชายผู้นี้ต้องรีบ อิตบานถามว่า โอ้ท่านรสูลุลลอฮ์ ท่านเห็นอย่างไรเกี่ยวกับชายที่ถูกเร่งให้ออกจากภรรยาโดยไม่ได้หลั่ง เขาต้องทำอะไร ท่านตอบว่า น้ำนั้นเนื่องมาจากน้ำเท่านั้น\"", "อัลบุคอรีย์ (180) และมุสลิม (345) บันทึกผ่านชุอ์บะฮ์ จากอัลหะกัม จากซักวาน อบูศอลิห์ จากอบูสะอีดว่า ท่านรสูลุลลอฮ์ ﷺ ส่งคนไปเรียกชายชาวอันศอร เขามาโดยศีรษะยังมีน้ำหยด ท่านนบี ﷺ กล่าวว่า \"บางทีเราทำให้ท่านต้องรีบ\" เขาตอบว่า \"ใช่\" ท่านกล่าวว่า \"เมื่อท่านถูกเร่ง หรือไม่ได้หลั่ง ก็ให้อาบน้ำละหมาด\" นี่เป็นสำนวนของอัลบุคอรีย์"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"น้ำเนื่องมาจากน้ำ\" สำนวนของมุสลิมคือ \"น้ำนั้นเนื่องมาจากน้ำเท่านั้น\" น้ำแรกเป็นประธาน หมายถึงน้ำที่ใช้อาบ น้ำที่สองเกี่ยวกับภาคแสดงที่ละไว้ หมายถึงอสุจิที่หลั่งออกมาอย่างแรงพร้อมความรู้สึกสุข อัลลอฮ์ทรงเรียกอสุจิว่าน้ำ ดังอายะฮ์ \"เขาถูกสร้างจากน้ำที่พุ่งออกมา\" (อัฏฏอริก: 6) ในหะดีษนี้มีการพ้องคำที่สมบูรณ์ คือคำสองคำเหมือนกันทุกตัวอักษร แต่ความหมายต่างกัน", "ในหะดีษมีรูปแบบการจำกัดความ (อัลก็อศร์) ตามหลักวาทศิลป์ ด้วยคำว่า \"อินนะมา\" ความหมายคือ การอาบน้ำจำกัดอยู่ที่การหลั่งเท่านั้น"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "หะดีษนี้ถูกยกเลิก", "points_th": ["หะดีษเป็นหลักฐานว่าวาญิบต้องอาบน้ำเมื่อหลั่งอสุจิ นี่คือตัวบท ส่วนความหมายแฝงบ่งว่าไม่ต้องอาบน้ำถ้าไม่หลั่ง ถ้าร่วมประเวณีกับภรรยาแล้วไม่หลั่ง ก็ไม่ต้องอาบน้ำ ดังที่บ่งไว้ในคำว่า \"เมื่อท่านถูกเร่ง หรือไม่ได้หลั่ง ก็ให้อาบน้ำละหมาด\" \"อุอ์ญิลตะ\" (ฎ็อมมะฮ์ที่ฮัมซะฮ์ กัสเราะฮ์ที่ญีม) และ \"กุหิฏตะ\" (ฎ็อมมะฮ์ที่กอฟ) คือร่วมประเวณีแต่ไม่หลั่ง ซึ่งเรียกว่าอัลอิกสาล", "ความหมายนี้มีรายงานจากเศาะหาบะฮ์จำนวนหนึ่ง เช่น อุษมาน และอุบัย บินกะอ์บ ซึ่งหะดีษของทั้งสองอยู่ในเศาะฮีห์ทั้งสอง รอฟิอ์ บินเคาะดีจ (อะห์มัด) และอบูอัยยูบ (อันนะสาอีย์ อิบนุมาญะฮ์) ซัยด์ บินคอลิด อัลญุฮะนีย์ถามอุษมาน บินอัฟฟานว่า \"ท่านเห็นอย่างไร ถ้าชายร่วมประเวณีกับภรรยาแต่ไม่หลั่ง\" อุษมานตอบว่า \"ให้อาบน้ำละหมาดเหมือนอาบน้ำละหมาดเพื่อละหมาด และล้างอวัยวะเพศ\" อุษมานกล่าวว่า \"ฉันได้ยินจากท่านรสูลุลลอฮ์ ﷺ\" แล้วฉันถามอะลี อัซซุบัยร์ ฏ็อลหะฮ์ และอุบัย บินกะอ์บ พวกเขาก็สั่งเช่นนั้น (อัลบุคอรีย์ 292 มุสลิม 347)", "นี่อยู่ในช่วงต้นอิสลาม ผู้ที่ร่วมประเวณีแต่ไม่หลั่งให้ชำระและอาบน้ำละหมาด แล้วต่อมาบัญญัติให้อาบน้ำโดยทั่วไปเพียงแค่สอดใส่ แม้ไม่หลั่ง มีรายงานที่บ่งถึงการยกเลิก ผ่านอิบนุชิฮาบ ว่า \"บางคนที่ฉันพอใจเล่าให้ฉันฟังว่า สะฮ์ล บินสะอ์ด อัสสาอิดีย์บอกเขาว่า อุบัย บินกะอ์บบอกเขาว่า ท่านรสูลุลลอฮ์ ﷺ ทำสิ่งนั้นเป็นการผ่อนปรนในช่วงต้นอิสลาม เพราะเสื้อผ้ามีน้อย แล้วสั่งให้อาบน้ำ และห้ามสิ่งนั้น\" (อบูดาวูด 214 สายศ่อฮีห์ และอาจารย์ของอิบนุชิฮาบน่าจะเป็นอบูหาซิม สะละมะฮ์ บินดีนาร ซึ่งเชื่อถือได้ ตามที่อิบนุคุซัยมะฮ์และคนอื่นระบุ) อบูดาวูดกล่าวว่า \"หมายถึง น้ำเนื่องมาจากน้ำ\"", "นักวิชาการบางคนตีความหะดีษของบทนี้ว่าหมายถึงการฝันเปียก อันนะสาอีย์ตั้งชื่อบทในสุนันตามนั้น อิบนุหะญัรเอียงไปทางนี้ และเชคอับดุลอะซีซ บินบาซสนับสนุน มีรายงานจากอิบนุอับบาส (ร.ฎ.) ว่า \"น้ำนั้นเนื่องมาจากน้ำ ในเรื่องการฝันเปียกเท่านั้น\" (อัตติรมิซีย์ 112)", "ผู้แต่งเห็นว่า การรวมการฝันเปียกเข้าไปอยู่ในแง่ความกว้างของถ้อยคำ แต่ตัวหะดีษไม่ได้เกี่ยวกับการฝัน เพราะมีการระบุสาเหตุชัดเจนว่าเป็นคำถามเรื่องการร่วมประเวณี ไม่ใช่การฝัน และกรณีที่เป็นสาเหตุย่อมรวมอยู่ในหุก่มแน่นอนตามนักวิชาการส่วนใหญ่ ทัศนะที่ว่าเฉพาะการฝันเปียกในขณะหลับจึงอ่อน"]}], "tags_th": ["ฆุสล์", "ญะนาบะฮ์", "การยกเลิกข้อบัญญัติ (นัสค์)", "การร่วมประเวณี", "การฝันเปียก"]}, {"id": "v2-h109", "volume": 2, "bab": "ghusl", "topic_ar": "وجوب الغسل من الجماع", "topic_th": "วาญิบต้องอาบน้ำ (ฆุสล์) เพราะการร่วมประเวณี", "pages": [9, 12], "hadith": [{"no": 109, "matn_ar": "وَعَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «إِذَا جَلَسَ بَيْنَ شُعَبِهَا الْأَرْبَعِ، ثُمَّ جَهَدَهَا، فَقَدْ وَجَبَ الْغُسْلُ». مُتَّفَقٌ عَلَيْهِ. زَادَ مُسْلِمٌ: «وَإِنْ لَمْ يُنْزِلْ».", "translation_th": "และจากอบูฮุร็อยเราะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"เมื่อ (ชาย) นั่งลงระหว่างสี่ส่วนของนาง แล้วพยายามกับนาง การอาบน้ำย่อมเป็นวาญิบ\" บันทึกโดยอัลบุคอรีย์และมุสลิม มุสลิมเพิ่มว่า \"แม้จะไม่หลั่ง\"", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["วาญิบต้องอาบน้ำเพราะการร่วมประเวณี ทั้งชายและหญิง ไม่ว่าจะหลั่งหรือไม่", "ที่หมายถึงคือการสอดส่วนหัวขององคชาตเข้าไปในอวัยวะเพศ ไม่ใช่เพียงการสัมผัส", "หะดีษนี้ยกเลิกความหมายแฝงของหะดีษ \"น้ำนั้นเนื่องมาจากน้ำเท่านั้น\" หลักฐานการยกเลิกคือหะดีษอุบัย บินกะอ์บ และอันนะวะวีย์และคนอื่นยกว่ามีอิจญ์มาอ์ว่าวาญิบต้องอาบน้ำเพราะการร่วมประเวณีแม้ไม่หลั่ง"], "vocab": [{"ar": "شُعَبُهَا الْأَرْبَعُ", "th": "สี่ส่วนของนาง ตามทัศนะที่ชัดเจนที่สุดคือมือทั้งสองและเท้าทั้งสอง เป็นคำเลี่ยงหมายถึงท่าร่วมประเวณี"}, {"ar": "جَهَدَهَا", "th": "พยายามกับนาง คือสอดใส่แล้วเคลื่อนไหว เป็นคำเลี่ยงหมายถึงการร่วมประเวณี"}, {"ar": "الْتِقَاءُ الْخِتَانَيْنِ", "th": "การพบกันของสองที่ขลิบ คือการที่ส่วนหัวขององคชาตหายเข้าไปในอวัยวะเพศ"}, {"ar": "الْإِكْسَالُ", "th": "การร่วมประเวณีโดยไม่หลั่ง"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึก (291) ในหมวดการอาบน้ำ บท \"เมื่อสองที่ขลิบพบกัน\" และมุสลิม (348) ผ่านฮิชาม อัดดัสตุวาอีย์ จากเกาะตาดะฮ์ จากอัลหะสัน อัลบัศรีย์ จากอบูรอฟิอ์ (นุฟัยอ์ บินอัลหาริษ) จากอบูฮุร็อยเราะฮ์ แบบมัรฟูอ์ และมุสลิมบันทึกอีกสายผ่านมะฏัร อัลวัรร็อก จากอัลหะสัน ซึ่งมีคำว่า \"แม้จะไม่หลั่ง\""]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"เมื่อนั่ง\" คือชาย ซึ่งเข้าใจได้จากบริบท การนั่งหมายถึงการอยู่ในตำแหน่งนั้น \"ระหว่างสี่ส่วนของนาง\" คือสี่ส่วนของผู้หญิง สรรพนามไม่มีคำที่อ้างถึงก่อนหน้า แต่รู้ได้จากบริบท \"ชุอับ\" (ฎ็อมมะฮ์ที่ชีน) พหูพจน์ของ \"ชุอ์บะฮ์\" คือส่วนหนึ่งของสิ่งใด ในที่นี้ตามทัศนะที่ชัดเจนที่สุดคือมือและเท้าของนาง เป็นคำเลี่ยงหมายถึงตำแหน่งของชายต่อหญิงขณะร่วมประเวณี ซึ่งเป็นสภาพที่ไม่ควรพูดตรง ๆ จึงเลี่ยงด้วยคำว่า \"ชุอับ\" ซึ่งหมายถึงแขนขา เพื่อให้เข้าใจว่าหมายถึงการเชื่อมต่อของอวัยวะร่วมประเวณี", "\"แล้วพยายามกับนาง\" (ฟัตหะฮ์ที่ญีมและฮาอ์) คือถึงความเหน็ดเหนื่อย ความหมายคือพยายามในตัวนาง ด้วยการสอดอวัยวะเพศเข้าไป แล้วทำให้นางเหนื่อยด้วยการเคลื่อนไหว เพราะผู้หญิงแม้จะมีความสุขกับสิ่งนี้ แต่ก็มีความเหน็ดเหนื่อยด้วย นี่เป็นความงามของภาษาที่เลี่ยงสิ่งที่ละอายจะกล่าวตรง ๆ ด้วยสิ่งที่บ่งถึงมัน จุดประสงค์คือการเลี่ยงหมายถึงการร่วมประเวณีและการสอดใส่ และเมื่อเกิดขึ้นการอาบน้ำก็เป็นวาญิบแม้ไม่หลั่ง ในอีกรายงานว่า \"และสองที่ขลิบแนบกัน\" แทน \"แล้วพยายามกับนาง\" แสดงว่าความพยายามเป็นคำเลี่ยงหมายถึงการสอดใส่ และในอีกรายงานของมุสลิมว่า \"เมื่อที่ขลิบสัมผัสที่ขลิบ\"", "ที่หมายถึงการพบกันของสองที่ขลิบ คือการที่ส่วนหัวขององคชาตหายเข้าไปในอวัยวะเพศ ส่วน \"การสัมผัส\" ไม่ได้หมายถึงการสัมผัสจริง เพราะที่ขลิบของผู้หญิงอยู่ส่วนบนของอวัยวะเพศ และองคชาตไม่ได้สัมผัสมันขณะร่วมประเวณี \"การอาบน้ำย่อมเป็นวาญิบ\" คือแก่ทั้งสองคน"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "การอาบน้ำเพราะการร่วมประเวณี", "points_th": ["หะดีษเป็นหลักฐานว่าวาญิบต้องอาบน้ำเพราะการร่วมประเวณีทั้งชายและหญิง ไม่ว่าจะหลั่งหรือไม่ ตามคำในรายงานของมุสลิม \"แม้จะไม่หลั่ง\"", "มุสลิมบันทึกผ่านฮิชาม จากหุมัยด์ บินฮิลาล จากอบูบุรดะฮ์ จากอบูมูซาว่า กลุ่มมุฮาญิรีนและอันศอรขัดแย้งกันในเรื่องนี้ ชาวอันศอรว่า \"ไม่ต้องอาบน้ำนอกจากเพราะการพุ่งออกหรือน้ำ (อสุจิ)\" ชาวมุฮาญิรีนว่า \"เมื่อสัมผัสกันการอาบน้ำก็เป็นวาญิบ\" อบูมูซาจึงกล่าวว่า \"ฉันจะทำให้พวกท่านหายข้องใจ\" แล้วไปขออนุญาตพบอาอิชะฮ์ (ร.ฎ.) และกล่าวว่า \"แม่ หรือ โอ้มารดาของผู้ศรัทธา ฉันต้องการถามท่านเรื่องหนึ่ง แต่ฉันอายท่าน\" นางตอบว่า \"อย่าอายที่จะถามฉันในเรื่องที่ท่านจะถามแม่ที่ให้กำเนิดท่าน เพราะฉันก็คือแม่ของท่าน\" เขาถามว่า \"อะไรทำให้ต้องอาบน้ำ\" นางตอบว่า \"ท่านถามผู้ที่รู้ดีแล้ว ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า เมื่อนั่งระหว่างสี่ส่วนของนาง และที่ขลิบสัมผัสที่ขลิบ การอาบน้ำย่อมเป็นวาญิบ\" (มุสลิม 349)"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "หะดีษนี้ยกเลิกหะดีษ \"น้ำเนื่องมาจากน้ำ\"", "points_th": ["หะดีษนี้ยกเลิกความหมายแฝงของหะดีษ \"น้ำนั้นเนื่องมาจากน้ำเท่านั้น\" หลักฐานการยกเลิกคือหะดีษอุบัย บินกะอ์บว่า \"น้ำเนื่องมาจากน้ำเป็นการผ่อนปรนในช่วงต้นอิสลาม แล้วถูกห้าม\" (อัตติรมิซีย์ 110 อะห์มัด ผ่านอัซซุฮ์รีย์ จากสะฮ์ล บินสะอ์ด จากอุบัย บินกะอ์บ มีหลายสายจากอัซซุฮ์รีย์ อัตติรมิซีย์ อิบนุคุซัยมะฮ์ และอิบนุหิบบานว่าศ่อฮีห์) ซึ่งระบุชัดถึงการยกเลิก", "อีกทั้งหะดีษที่ให้อาบน้ำแม้ไม่หลั่ง แม้หากการยกเลิกไม่ยืนยันได้ ก็มีน้ำหนักกว่า เพราะเป็นตัวบท (มันฏูก) ส่วนอีกหะดีษเป็นความหมายแฝง (มัฟฮูม) และตัวบทมาก่อนความหมายแฝงในการปฏิบัติ", "มุสลิมบันทึกผ่านอบุซซุบัยร์ จากญาบิร จากอุมมุกุลษูม จากอาอิชะฮ์ ภรรยาท่านนบี ﷺ ว่า ชายคนหนึ่งถามท่านรสูลุลลอฮ์ ﷺ เรื่องชายที่ร่วมประเวณีกับภรรยาแล้วไม่หลั่ง ทั้งสองต้องอาบน้ำหรือไม่ ขณะที่อาอิชะฮ์นั่งอยู่ ท่านรสูลุลลอฮ์ ﷺ ตอบว่า \"ฉันทำเช่นนั้นกับนางผู้นี้ แล้วเราก็อาบน้ำ\" (มุสลิม 350) อิบนุเราะญับยกจากอัดดารุกุฏนีย์ว่า \"ไม่มีความขัดแย้งจากอบุซซุบัยร์ในการรายงานหะดีษนี้แบบมัรฟูอ์\" อุมมุกุลษูมคือน้องสาวของอาอิชะฮ์ (อิบนุเราะญับ อันนะวะวีย์) และอันนะวะวีย์ว่า \"นี่เป็นการรายงานของผู้อาวุโสจากผู้น้อย\"", "อันนะวะวีย์และคนอื่นยกว่ามีอิจญ์มาอ์ว่าวาญิบต้องอาบน้ำเพราะการร่วมประเวณี แม้ไม่หลั่ง และวาญิบเพราะการหลั่ง เศาะหาบะฮ์กลุ่มหนึ่งเคยเห็นว่าไม่ต้องอาบน้ำนอกจากเพราะการหลั่ง แล้วบางคนเปลี่ยนความเห็น และอิจญ์มาอ์ก็เกิดขึ้นหลังจากคนอื่น ๆ", "อิมามมุสลิมยกในเศาะฮีห์ ณ ที่นี้ จากอบุลอะลาอ์ บินอัชชิคคีร ว่า \"ท่านรสูลุลลอฮ์ ﷺ ยกเลิกหะดีษของท่านบางบทด้วยบางบท เหมือนที่อัลกุรอานยกเลิกบางส่วนด้วยบางส่วน\" (มุสลิม 344) ผู้แต่งเห็นว่าจุดประสงค์ของมุสลิมคือชี้ว่าหะดีษ \"น้ำเนื่องมาจากน้ำ\" ถูกยกเลิก"]}], "tags_th": ["ฆุสล์", "ญะนาบะฮ์", "การร่วมประเวณี", "การยกเลิกข้อบัญญัติ (นัสค์)", "อิจญ์มาอ์"]}, {"id": "v2-h110-111", "volume": 2, "bab": "ghusl", "topic_ar": "وجوب الغسل على المرأة بخروج المني منها", "topic_th": "วาญิบที่ผู้หญิงต้องอาบน้ำเมื่ออสุจิ (น้ำกาม) ออกจากนาง", "pages": [13, 18], "hadith": [{"no": 110, "matn_ar": "وَعَنْ أُمِّ سَلَمَةَ رَضِيَ اللهُ عَنْهَا أَنَّ أُمَّ سُلَيْمٍ وَهِيَ امْرَأَةُ أَبِي طَلْحَةَ رَضِيَ اللهُ عَنْهُمَا قَالَتْ: يَا رَسُولَ اللهِ! إِنَّ اللهَ لَا يَسْتَحِي مِنَ الْحَقِّ، فَهَلْ عَلَى الْمَرْأَةِ الْغُسْلُ إِذَا احْتَلَمَتْ؟ قَالَ: «نَعَمْ، إِذَا رَأَتِ الْمَاءَ» الْحَدِيثَ. مُتَّفَقٌ عَلَيْهِ.", "translation_th": "และจากอุมมุสะละมะฮ์ (ร.ฎ.) ว่า อุมมุสุลัยม์ ซึ่งเป็นภรรยาของอบูฏ็อลหะฮ์ (ร.ฎ.) กล่าวว่า \"โอ้ท่านรสูลุลลอฮ์ แท้จริงอัลลอฮ์ไม่ทรงละอายในเรื่องความจริง ผู้หญิงต้องอาบน้ำหรือไม่ เมื่อนางฝันเปียก\" ท่านตอบว่า \"ใช่ เมื่อนางเห็นน้ำ\" (หะดีษยังมีต่อ) บันทึกโดยอัลบุคอรีย์และมุสลิม", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}, {"no": 111, "matn_ar": "عَنْ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ فِي الْمَرْأَةِ تَرَى فِي مَنَامِهَا مَا يَرَى الرَّجُلُ قَالَ: «تَغْتَسِلُ». مُتَّفَقٌ عَلَيْهِ. زَادَ مُسْلِمٌ: فَقَالَتْ أُمُّ سُلَيْمٍ: وَهَلْ يَكُونُ هَذَا؟ قَالَ: «نَعَمْ، فَمِنْ أَيْنَ يَكُونُ الشَّبَهُ؟».", "translation_th": "จากอะนัส บินมาลิก (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวถึงผู้หญิงที่ฝันเห็นเหมือนที่ผู้ชายเห็นว่า \"นางต้องอาบน้ำ\" บันทึกโดยอัลบุคอรีย์และมุสลิม มุสลิมเพิ่มว่า อุมมุสุลัยม์ถามว่า \"เรื่องนี้เกิดขึ้นได้หรือ\" ท่านตอบว่า \"ใช่ แล้วความคล้ายคลึง (ของลูก) จะมาจากไหนเล่า\"", "grade_th": "ศ่อฮีห์ (มุสลิม) ผู้แต่งเห็นว่าอิบนุหะญัรผิดพลาดที่ระบุว่าอัลบุคอรีย์บันทึกด้วย"}], "key_rulings_th": ["ผู้หญิงเหมือนผู้ชาย ถ้าฝันว่าร่วมประเวณี ต้องอาบน้ำ โดยมีเงื่อนไขว่าเห็นน้ำอสุจิ", "ผู้ฝันเปียกมีสามกรณี (1) จำได้ว่าฝันและเห็นอสุจิ ต้องอาบน้ำ (2) ฝันแต่ไม่เห็นน้ำ ไม่ต้องอาบ (3) เห็นน้ำแต่จำไม่ได้ว่าฝัน ต้องอาบน้ำ", "ถ้าตื่นมาพบความเปียกชื้นแต่ไม่รู้ว่าเป็นอสุจิหรือไม่ ทัศนะที่มีน้ำหนักกว่าคือไม่ต้องอาบน้ำ เพราะยังไม่แน่ใจว่าเป็นอสุจิ และหลักเดิมคือพ้นจากภาระ", "สำหรับคนที่ตื่นอยู่ ผู้แต่งสนับสนุนว่าอสุจิที่ทำให้ต้องอาบน้ำคือที่ออกมาพร้อมความรู้สึกสุข ถ้าออกมาโดยไม่มีความรู้สึกสุข (เช่น เพราะป่วย) ไม่ต้องอาบน้ำ", "ไม่ควรให้ความละอายขัดขวางการถามเรื่องศาสนา แต่ควรกล่าวขออภัยก่อน และอัลลอฮ์ทรงมีคุณลักษณะความละอายตามที่เหมาะสมกับพระองค์"], "vocab": [{"ar": "لَا يَسْتَحِي مِنَ الْحَقِّ", "th": "ไม่ทรงละอายที่จะกล่าวถึงความจริง"}, {"ar": "احْتَلَمَتْ", "th": "ฝันว่าร่วมประเวณี (ฝันเปียก)"}, {"ar": "إِذَا رَأَتِ الْمَاءَ", "th": "เมื่อนางเห็นอสุจิ คือแน่ใจว่าออกมาจริง"}, {"ar": "الشَّبَهُ", "th": "ความคล้ายคลึงของลูกกับพ่อหรือแม่"}, {"ar": "أَمْشَاجٍ", "th": "ส่วนผสม คือน้ำของชายและหญิงที่ผสมกัน"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجهما", "heading_th": "ที่มาของหะดีษ", "points_th": ["หะดีษแรก: อัลบุคอรีย์บันทึก (282) ในหมวดการอาบน้ำ บท \"เมื่อผู้หญิงฝันเปียก\" และมุสลิม (313) ผ่านฮิชาม บินอุรวะฮ์ จากบิดา จากซัยนับ บินติอบีสะละมะฮ์ จากอุมมุสะละมะฮ์ว่า อุมมุสุลัยม์มาหาท่านนบี ﷺ แล้วกล่าวว่า \"โอ้ท่านรสูลุลลอฮ์ แท้จริงอัลลอฮ์ไม่ทรงละอายในเรื่องความจริง ผู้หญิงต้องอาบน้ำหรือไม่ เมื่อนางฝันเปียก\" ท่านตอบว่า \"ใช่ เมื่อนางเห็นน้ำ\" อุมมุสะละมะฮ์จึงกล่าวว่า \"โอ้ท่านรสูลุลลอฮ์ ผู้หญิงฝันเปียกด้วยหรือ\" ท่านตอบว่า \"มือของเธอเปื้อนดิน (คำอุทาน) แล้วลูกของนางจะคล้ายนางได้อย่างไร\" นี่เป็นสำนวนของมุสลิม และอีกรายงานเพิ่มว่า \"นาง (อุมมุสะละมะฮ์) กล่าวว่า เธอทำให้ผู้หญิงขายหน้า\"", "หะดีษที่สอง: มุสลิมบันทึก (311) ผ่านสะอีด บินอบีอะรูบะฮ์ จากเกาะตาดะฮ์ ว่าอะนัส บินมาลิกเล่าว่า อุมมุสุลัยม์เล่าว่านางถามท่านนบี ﷺ เรื่องผู้หญิงที่ฝันเห็นเหมือนที่ผู้ชายเห็น ท่านรสูลุลลอฮ์ ﷺ ตอบว่า \"เมื่อผู้หญิงเห็นเช่นนั้น ก็จงอาบน้ำ\" อุมมุสุลัยม์กล่าวว่า และฉันรู้สึกอายในเรื่องนั้น แล้วถามว่า \"เรื่องนี้เกิดขึ้นได้หรือ\" ท่านนบี ﷺ ตอบว่า \"ใช่ แล้วความคล้ายคลึงจะมาจากไหนเล่า น้ำของผู้ชายข้นและขาว น้ำของผู้หญิงใสและเหลือง น้ำของคนใดอยู่เหนือหรือมาก่อน ความคล้ายคลึงก็จะมาจากคนนั้น\"", "ผู้แต่งเห็นว่าอิบนุหะญัรผิดพลาดที่ระบุว่าหะดีษนี้อยู่ในอัลบุคอรีย์ เพราะเป็นหะดีษที่มุสลิมบันทึกเพียงคนเดียว อัลมิซซีย์ก็ระบุไว้โดยไม่ได้ระบุว่าอยู่ในอัลบุคอรีย์", "ตามความหมายของหะดีษนี้และหะดีษก่อนหน้า การโต้ตอบเกิดขึ้นระหว่างอุมมุสุลัยม์กับอุมมุสะละมะฮ์ ซึ่งยืนยันในเศาะฮีห์ทั้งสองจากรายงานของฮิชาม บินอุรวะฮ์ จากบิดา แต่มุสลิมบันทึกจากรายงานของอัซซุฮ์รีย์ จากอุรวะฮ์ โดยว่า \"จากอาอิชะฮ์\" แทนอุมมุสะละมะฮ์ และในนั้นการโต้ตอบเกิดระหว่างอุมมุสุลัยม์กับอาอิชะฮ์ ผู้แต่งเห็นว่าวิธีรวมรายงานที่ดีที่สุดคือที่อันนะวะวีย์กล่าว คือเป็นไปได้ว่าทั้งอาอิชะฮ์และอุมมุสะละมะฮ์ต่างทักท้วงอุมมุสุลัยม์ เพราะไม่มีอะไรขัดขวางที่อะนัส อาอิชะฮ์ และอุมมุสะละมะฮ์จะอยู่ในเหตุการณ์นี้ และอาจเป็นไปได้ว่าอะนัสรายงานจากแม่ของเขาคืออุมมุสุลัยม์"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظهما", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"อุมมุสุลัยม์\" คือสะฮ์ละฮ์ บินติมิลหาน (กัสเราะฮ์ที่มีมตามที่รู้จักกันมากกว่า) อัลอันศอรียะฮ์ มารดาของอะนัส บินมาลิก เป็นเศาะหาบียะฮ์และรายงานหะดีษ ในสมัยญาฮิลียะฮ์เป็นภรรยาของมาลิก บินอันนัฎร์ และให้กำเนิดอะนัส เมื่ออิสลามมา นางรับอิสลามพร้อมกลุ่มชนอันศอรของนาง สามีโกรธจึงไปชามและเสียชีวิตที่นั่น อบูฏ็อลหะฮ์จึงมาขอนาง นางตอบว่า \"ถ้าท่านรับอิสลาม ฉันจะแต่งงานกับท่าน และไม่ต้องการสินสอดอื่นใดจากท่าน\" เขาก็รับอิสลาม และอะนัสลูกชายของนางเป็นผู้แต่งงานนางให้เขา นางเป็นผู้หญิงที่มีปัญญาที่สุดคนหนึ่ง ใจมั่นคงที่สุด และมีมารยาทและศาสนาดีที่สุด เรื่องของนางกับอบูฏ็อลหะฮ์เมื่อลูกเสียชีวิตแล้วนางไม่บอกเขาจนกระทั่งเขาร่วมหลับนอนกับนาง เป็นที่รู้จัก อยู่ในเศาะฮีห์ทั้งสอง อิบนุลมุลักกินว่า \"ไม่พบผู้ใดบันทึกปีที่นางเสียชีวิต\"", "\"ภรรยาของอบูฏ็อลหะฮ์\" คือซัยด์ บินสะฮ์ล อัลอันศอรีย์ อัลค็อซเราะญีย์ รู้จักด้วยชื่อเรียก เป็นเศาะหาบะฮ์ที่ประเสริฐ เข้าร่วมสงครามบัดร์และอุหุด และบริจาคทรัพย์ที่เขารักที่สุดเมื่ออายะฮ์ \"พวกเจ้าจะไม่ได้รับความดีจนกว่าพวกเจ้าจะบริจาคจากสิ่งที่พวกเจ้ารัก\" (อาลิอิมรอน: 92) ถูกประทานลงมา เขาเสียชีวิตปี ฮ.ศ. 50 หรือ 51", "\"แท้จริงอัลลอฮ์ไม่ทรงละอายในเรื่องความจริง\" คือไม่ทรงละเว้นการกล่าวถึงมันเพราะความละอาย ความละอายทางภาษาคือความเปลี่ยนแปลงและความหดหู่ที่เกิดขึ้นในจิตใจ เพราะกลัวสิ่งที่จะถูกตำหนิ ทางศาสนาคือคุณลักษณะที่ผลักดันให้ละสิ่งที่น่าเกลียด และห้ามมิให้บกพร่องต่อสิทธิของผู้มีสิทธิ ความจริงคือทุกข่าวที่ปราศจากความเท็จ และทุกหุก่มที่ปราศจากความอยุติธรรม ประโยคนี้เป็นประโยคเริ่มต้นเพื่อขออภัยก่อนเรื่องที่จะถาม เพราะเป็นเรื่องที่น่าอายต่อหน้าผู้ชาย", "\"ผู้หญิงต้องอาบน้ำหรือไม่\" เป็นสำนวนของอัลบุคอรีย์ในหมวดเรื่องราวของบรรดานบี สำนวนของเศาะฮีห์ทั้งสองในหมวดความสะอาดคือ \"มีการอาบน้ำหรือไม่\" \"เมื่อนางฝันเปียก\" คือเมื่อนางเห็นในฝันว่านางร่วมประเวณี การฝันเปียก (อิห์ติลาม) มาจากคำว่า \"อัลหุลม์\" (ฎ็อมมะฮ์ที่หาอ์ สุกูนที่ลาม) คือสิ่งที่ผู้หลับเห็นในขณะหลับ ส่วน \"หิลม์\" (กัสเราะฮ์) คือความอดทนให้อภัย ในที่นี้หมายถึงเฉพาะการร่วมประเวณี ความหมายแรกเป็นการใช้ตามรากศัพท์ อันนี้เป็นการใช้ตามธรรมเนียม", "\"ใช่ เมื่อนางเห็นน้ำ\" คือใช่ นางต้องอาบน้ำเมื่อนางเห็นน้ำ ซึ่งคืออสุจิ หมายถึงแน่ใจว่าเกิดขึ้นจริง \"(หะดีษยังมีต่อ)\" เป็นการชี้ว่ายังมีส่วนที่เหลือ อิบนุหะญัรอาจละไว้เพื่อย่อ และเพียงพอกับสิ่งที่มาในตอนท้ายของหะดีษอะนัส"]}, {"wajh": 3, "type": "fawaid", "heading_ar": null, "heading_th": "ความประเสริฐของอุมมุสุลัยม์", "points_th": ["ทั้งสองหะดีษบ่งถึงความประเสริฐของอุมมุสุลัยม์ (ร.ฎ.) ที่ใฝ่ใจในการเข้าใจศาสนา และมีมารยาทดี เพราะนางกล่าวขออภัยก่อนถาม"]}, {"wajh": 4, "type": "fawaid", "heading_ar": null, "heading_th": "ความละอายไม่ควรขัดขวางการถาม", "points_th": ["มนุษย์ควรถามในสิ่งที่ตนต้องการ แม้ในเรื่องที่น่าอาย และไม่ควรให้ความละอายขัดขวางการรู้ความจริงและการถาม แต่ควรกล่าวขออภัยก่อน หรือมอบหมายให้คนอื่นถาม", "ส่วนการไม่ถามในสิ่งที่ควรถาม หรือละทิ้งการสั่งใช้ความดีและห้ามปรามความชั่ว หรือบกพร่องในสิทธิบางอย่าง นี่คือความอ่อนแอ ความอ่อนหย่อน และความต่ำต้อย ไม่ได้เรียกว่าความละอาย แต่คนบางกลุ่มเรียกว่าความละอายตามธรรมเนียม โดยอนุโลม เพราะคล้ายกับความละอายที่แท้จริง", "มีรายงานจากอาอิชะฮ์ (ร.ฎ.) ว่า \"ผู้หญิงที่ดีที่สุดคือผู้หญิงชาวอันศอร ความละอายไม่ขัดขวางพวกนางจากการทำความเข้าใจในศาสนา\" (มุสลิม 332 และอัลบุคอรีย์ยกแบบตะอ์ลีก)"]}, {"wajh": 5, "type": "fawaid", "heading_ar": null, "heading_th": "อัลลอฮ์ไม่ทรงละอายในเรื่องความจริง", "points_th": ["หะดีษบ่งว่าคุณลักษณะความละอายในเรื่องความจริงไม่มีในอัลลอฮ์ เพราะความยุติธรรมและความเมตตาที่สมบูรณ์ของพระองค์", "ความละอายเป็นคุณลักษณะที่ยืนยันแก่อัลลอฮ์ ตามที่เหมาะสมกับความยิ่งใหญ่ของพระองค์ ไม่เหมือนกับสิ่งที่ถูกสร้าง เช่นเดียวกับคุณลักษณะอื่นของพระองค์ มีหะดีษยะอ์ลา บินอุมัยยะฮ์ (ร.ฎ.) ว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"แท้จริงอัลลอฮ์ทรงมีความละอาย ทรงปกปิด ทรงรักความละอายและการปกปิด\" (อบูดาวูด 4012 อันนะสาอีย์ อะห์มัด ศ่อฮีห์ด้วยหลายสาย)"]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "ผู้หญิงฝันเปียกและกรณีต่าง ๆ", "points_th": ["หะดีษเป็นหลักฐานว่าผู้หญิงเหมือนผู้ชาย ถ้าเห็นในฝันว่าร่วมประเวณี ต้องอาบน้ำเหมือนผู้ชาย แต่มีเงื่อนไขว่าพบน้ำ ซึ่งคืออสุจิ ตามคำว่า \"เมื่อนางเห็นน้ำ\"", "ผู้ฝันเปียกมีสามกรณี (1) จำได้ว่าฝันและเห็นอสุจิ ต้องอาบน้ำ ตามที่หะดีษแรกบ่ง (2) เห็นการกระทำแต่ไม่เห็นน้ำ คือฝันว่าร่วมประเวณีแต่ไม่เห็นน้ำ ไม่ต้องอาบน้ำ ตามความหมายแฝงของคำว่า \"ใช่ เมื่อนางเห็นน้ำ\" (3) เห็นน้ำแต่จำไม่ได้ว่าฝัน ต้องอาบน้ำ ตามความกว้างของ \"น้ำนั้นเนื่องมาจากน้ำเท่านั้น\" และเพราะคนอาจฝันเห็นบางอย่างแล้วลืม", "ถ้าผู้บรรลุนิติภาวะหรือผู้ที่อาจบรรลุแล้วตื่นขึ้นมา พบความเปียกชื้นที่เสื้อผ้า แต่ไม่รู้ว่าเป็นอสุจิหรือไม่ ถ้าก่อนนอนมีการคิดเรื่องการร่วมประเวณี ก็ถือว่าเป็นอสุจิ ถ้าไม่มี บางทัศนะว่าให้อาบน้ำเพื่อความระมัดระวัง บางทัศนะว่าไม่ต้องอาบน้ำ เป็นรายงานหนึ่งจากอะห์มัด ซึ่งอิบนุตัยมียะฮ์เลือก ผู้แต่งเห็นว่าทัศนะนี้มีน้ำหนักกว่า ตามคำว่า \"เมื่อนางเห็นน้ำ\" คือเห็นอสุจิ แต่ในกรณีนี้ผู้ตื่นยังไม่แน่ใจว่าความเปียกชื้นนั้นเป็นอสุจิ จึงไม่วาญิบต้องอาบน้ำเพราะความสงสัย เพราะหลักเดิมคือพ้นจากภาระ นี่สำหรับผู้หลับ", "ส่วนผู้ที่ตื่นอยู่ ตามความหมายตามตัวบทของ \"น้ำนั้นเนื่องมาจากน้ำเท่านั้น\" การออกมาของอสุจิทำให้ต้องอาบน้ำในทุกกรณี แม้ไม่มีอารมณ์ และไม่ว่าออกมาด้วยสาเหตุใด เป็นมัซฮับของชาฟิอีย์และรายงานหนึ่งจากอะห์มัด แต่ที่รู้จักกันในมัซฮับ (ฮัมบะลีย์) ไม่เป็นเช่นนั้น หะนะฟีย์ มาลิกีย์ และฮัมบะลีย์ว่า ไม่ต้องอาบน้ำนอกจากเมื่อออกมาอย่างพุ่งและพร้อมความรู้สึกสุข ผู้แต่งเห็นว่าที่ชัดเจนคือ ถ้ามีความรู้สึกสุขก็ต้องพุ่ง ผู้เขียน \"อัลมุนตะฮา\" จึงกล่าวเพียงความรู้สึกสุข โดยไม่กล่าวถึงการพุ่ง", "หลักฐานคือหะดีษอะลี (ร.ฎ.) ว่า \"ฉันเป็นคนที่มีน้ำมัซยีมาก จึงถามท่านนบี ﷺ ท่านตอบว่า เมื่อท่านปล่อยน้ำออกมาแรง ก็จงอาบน้ำจากญะนาบะฮ์ ถ้าไม่ได้ออกมาแรง ก็ไม่ต้องอาบน้ำ\" และในอีกสำนวนว่า \"เมื่อท่านพ่นน้ำออกมา ก็จงอาบน้ำ\" (ดูหะดีษที่ 69) \"อัลค็อซฟ์\" และ \"อัลฟัฎค์\" คือการออกมาอย่างแรงด้วยการพุ่ง ดังนั้นการบรรยายว่าพุ่งจึงใกล้ความจริงและสอดคล้องกว่า ตามอายะฮ์ \"เขาถูกสร้างจากน้ำที่พุ่งออกมา\" (อัฏฏอริก: 6)", "ตามนี้ ถ้าออกมาโดยไม่มีความรู้สึกสุข ก็ไม่ต้องอาบน้ำ แต่เป็นนะญิส ไม่ใช่อสุจิ และหะดีษ \"น้ำนั้นเนื่องมาจากน้ำเท่านั้น\" ตีความได้ว่าหมายถึงน้ำที่เป็นที่รู้จัก คือที่ออกมาพร้อมความรู้สึกสุข และทำให้ร่างกายอ่อนแรงและอ่อนเพลีย"]}, {"wajh": 7, "type": "fawaid", "heading_ar": null, "heading_th": "ผู้หญิงก็มีน้ำอสุจิ", "points_th": ["หะดีษบ่งว่าผู้หญิงฝันเปียกและหลั่งอสุจิเหมือนผู้ชาย และทารกถูกสร้างจากน้ำของทั้งชายและหญิง ดังอายะฮ์ \"แท้จริงเราได้สร้างมนุษย์จากหยดน้ำที่ผสมกัน\" (อัลอินซาน: 2) อิบนุอับบาส (ร.ฎ.) กล่าวว่า \"คือน้ำของผู้ชายและน้ำของผู้หญิง เมื่อรวมกันแล้วก็เปลี่ยนจากระยะหนึ่งไปอีกระยะ จากสภาพหนึ่งไปอีกสภาพ จากสีหนึ่งไปอีกสี\" อิกริมะฮ์ มุญาฮิด อัลหะสัน และอัรเราะบีอ์ บินอะนัสก็กล่าวเช่นนั้น \"อัมชาจ\" คือการผสมของน้ำผู้ชายกับน้ำผู้หญิง"]}, {"wajh": 8, "type": "fawaid", "heading_ar": null, "heading_th": "ความคล้ายคลึงของลูก", "points_th": ["หะดีษบ่งว่าความคล้ายคลึงของลูก ไม่ว่าชายหรือหญิง กับพ่อหรือแม่ ขึ้นอยู่กับว่าน้ำของคนใดมาก่อน ถ้าน้ำของคนใดมาก่อน ความคล้ายคลึงก็จะเป็นของคนนั้น ผู้แต่งอ้างถึงว่านี่คือสิ่งที่แพทย์เรียกว่าพันธุกรรม"]}], "tags_th": ["ฆุสล์", "การฝันเปียก", "สตรี", "อุมมุสุลัยม์", "ความละอาย", "อสุจิ"]}, {"id": "v2-h112", "volume": 2, "bab": "ghusl", "topic_ar": "حكم الغسل من تغسيل الميت", "topic_th": "ข้อตัดสินการอาบน้ำหลังอาบน้ำศพ", "pages": [19, 22], "hadith": [{"no": 112, "matn_ar": "وَعَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: كَانَ النَّبِيُّ ﷺ يَغْتَسِلُ مِنْ أَرْبَعٍ: مِنَ الْجَنَابَةِ، وَيَوْمَ الْجُمُعَةِ، وَمِنَ الْحِجَامَةِ، وَمِنْ غُسْلِ الْمَيِّتِ. رَوَاهُ أَبُو دَاوُدَ، وَصَحَّحَهُ ابْنُ خُزَيْمَةَ.", "translation_th": "และจากอาอิชะฮ์ (ร.ฎ.) กล่าวว่า ท่านนบี ﷺ อาบน้ำเพราะสี่สิ่ง คือ เพราะญะนาบะฮ์ ในวันศุกร์ เพราะการกรอกเลือด และเพราะการอาบน้ำศพ รายงานโดยอบูดาวูด และอิบนุคุซัยมะฮ์ตัดสินว่าศ่อฮีห์", "grade_th": "ฎออีฟ (อ่อน) ตามที่ผู้แต่งสรุป อิบนุคุซัยมะฮ์และอัลหากิมว่าศ่อฮีห์"}], "key_rulings_th": ["การอาบน้ำเพราะญะนาบะฮ์เป็นวาญิบตามอิจญ์มาอ์", "การอาบน้ำวันศุกร์ส่งเสริมตามทัศนะของนักวิชาการส่วนใหญ่ (จะกล่าวในหัวข้อถัดไป)", "การอาบน้ำหลังกรอกเลือด นักวิชาการบางคนว่าเป็นซุนนะฮ์ รวมทั้งเชคอิบนุบาซ แต่นักวิชาการส่วนใหญ่ว่าไม่ส่งเสริม เพราะไม่มีหลักฐาน อะห์มัดว่าไม่มีรายงานที่ยืนยันได้จากท่านนบี ﷺ", "การอาบน้ำหลังอาบน้ำศพ ได้กล่าวแล้วที่หะดีษ 76 ว่าทัศนะที่มีน้ำหนักกว่าคือส่งเสริม"], "vocab": [{"ar": "يَغْتَسِلُ مِنْ أَرْبَعٍ", "th": "อาบน้ำเพราะสี่สิ่ง"}, {"ar": "الْحِجَامَةُ", "th": "การกรอกเลือด"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อบูดาวูดบันทึก (348) ในหมวดความสะอาด บทการอาบน้ำวันศุกร์ และในหมวดศพ (3160) บทการอาบน้ำเพราะอาบน้ำศพ และอิบนุคุซัยมะฮ์ (256) ผ่านมุศอับ บินชัยบะฮ์ จากฏ็อลก์ บินหะบีบ อัลอะนะซีย์ จากอับดุลลอฮ์ บินอัซซุบัยร์ จากอาอิชะฮ์ว่า ท่านนบี ﷺ อาบน้ำเพราะสี่สิ่ง ในรายงานของอบูดาวูดเป็นการกระทำของท่าน ﷺ ตามที่อิบนุหะญัรยกมา ส่วนของอิบนุคุซัยมะฮ์เป็นคำพูดของท่าน สำนวนคือ \"ให้อาบน้ำเพราะสี่สิ่ง...\"", "อัลหากิมบันทึก (1/268) และว่า \"หะดีษนี้ศ่อฮีห์ตามเงื่อนไขของอัลบุคอรีย์และมุสลิม แต่ทั้งสองไม่ได้บันทึก\" มีผู้แย้งว่าอัลบุคอรีย์ไม่ได้บันทึกหะดีษของมุศอับ บินชัยบะฮ์ อิบนุอับดิลฮาดีย์จึงว่า \"ตามเงื่อนไขของมุสลิม\" แต่ถึงจะตามเงื่อนไขของมุสลิม มุศอับ บินชัยบะฮ์ก็ถูกวิจารณ์ นักวิชาการส่วนใหญ่ว่าเขาอ่อน อัษษะฮะบีย์ยกไว้ในหนังสือ \"ผู้ที่ถูกวิจารณ์แต่เชื่อถือได้\" และยกจากอัดดารุกุฏนีย์ว่า \"ไม่แข็งแรง\" อิบนุมะอีนว่าเชื่อถือได้ในรายงานของอิสหาก บินมันศูร และอัลอิจลีย์ว่าเชื่อถือได้", "อบูดาวูดกล่าวหลังหะดีษในที่ที่สองว่า \"หะดีษของมุศอับอ่อน มีหลายเรื่อง ไม่มีการปฏิบัติตาม\" อัดดารุกุฏนีย์ว่า \"มุศอับ บินชัยบะฮ์ไม่แข็งแรงและไม่ใช่นักจำ\" อัตติรมิซีย์ว่าอัลบุคอรีย์กล่าวว่า \"หะดีษอาอิชะฮ์ในบทนี้ไม่ค่อยดี\" อะห์มัดว่า \"มุศอับ บินชัยบะฮ์รายงานหะดีษมุนกัร\" อบูหาติมว่า \"พวกเขาไม่ชมเขา และเขาไม่แข็งแรง\" และอัษษะฮะบีย์ยกหะดีษนี้ว่าเป็นหนึ่งในหะดีษมุนกัรของเขา", "อัลบัยฮะกีย์ว่า \"มุสลิมบันทึกหะดีษของมุศอับ บินชัยบะฮ์ จากฏ็อลก์ บินหะบีบ จากอิบนุซซุบัยร์ จากอาอิชะฮ์ จากท่านนบี ﷺ ว่า สิบอย่างเป็นธรรมชาติ (ฟิฏเราะฮ์) และไม่ได้บันทึกหะดีษนี้ ฉันเห็นว่าเขาไม่บันทึกเพราะนักจำบางคนวิจารณ์\" ผู้แต่งเห็นว่าดูเหมือนอิมามมุสลิมไม่ได้ใส่ใจคำวิจารณ์มุศอับ เมื่อบันทึกเขาในเศาะฮีห์ ก็แสดงว่าเขาเชื่อถือได้ในทัศนะของมุสลิม แต่อัลอุก็อยลีย์ยกจากอะห์มัดว่า หะดีษ \"สิบอย่างเป็นธรรมชาติ\" เป็นหนึ่งในหะดีษมุนกัรของมุศอับ อบูซุรอะฮ์ว่า \"หะดีษนี้ไม่ถูกต้อง มุศอับ บินชัยบะฮ์รายงาน ซึ่งไม่แข็งแรง\" อิบนุอบีหาติมถามว่าไม่มีรายงานจากอาอิชะฮ์นอกจากหะดีษของมุศอับหรือ เขาตอบว่า \"ไม่มี\" และอิบนุหะญัรยกคำนี้ใน \"อันนุกัต อัซซิร็อฟ\" โดยไม่ได้แย้ง", "สรุปคือหะดีษนี้อ่อน ผู้ที่ว่าอ่อน ได้แก่ อะห์มัด อะลี บินอัลมะดีนีย์ (ทั้งสองว่า \"ไม่มีสิ่งใดถูกต้องในบทนี้\") มุหัมมัด บินยะห์ยา อัษษุฮ์ลีย์ (ตามที่อัลมุนซิรีย์ยกมา) และอิบนุอับดิลบัรร์ อิบนุดะกีกิลอีดยกการตัดสินว่าศ่อฮีห์ของอัลหากิม และคำของอัลบัยฮะกีย์ว่า \"ผู้รายงานหะดีษนี้เชื่อถือได้ทั้งหมด\" แล้วกล่าวว่า \"มีผู้ระบุข้อบกพร่อง และมุศอับ บินชัยบะฮ์ ผู้รายงานก็ถูกวิจารณ์ แม้มุสลิมจะใช้เขาเป็นหลักฐาน\"", "ที่สนับสนุนว่าอ่อนคือ มีรายงานจากอาอิชะฮ์ (ร.ฎ.) ที่ขัดกัน มีผู้ถามนางว่าผู้ที่อาบน้ำศพต้องอาบน้ำหรือไม่ นางตอบว่า \"ไม่\" อิบนุอับดิลบัรร์กล่าวหลังยกคำของอาอิชะฮ์ว่า \"นี่บ่งว่าหะดีษของมุศอับ บินชัยบะฮ์ใช้ไม่ได้ เพราะถ้าถูกต้องจากนาง นางจะไม่ขัดกับมัน... การวิเคราะห์ก็เช่นกัน ความสะอาดจะไม่วาญิบแก่ผู้ที่อัลลอฮ์ไม่ได้กำหนดในคัมภีร์ และรสูลของพระองค์ไม่ได้กำหนดจากทางที่ยืนยันได้ และนักวิชาการไม่ได้เห็นพ้องว่าวาญิบ\" อิบนุตตุรกุมานีย์ว่า \"เมื่อยืนยันได้ว่าอาอิชะฮ์ปฏิเสธการอาบน้ำเพราะอาบน้ำศพ นางจะรายงานจากท่านนบี ﷺ แล้วปฏิเสธได้อย่างไร\" อีกทั้งไม่ยืนยันว่าท่านนบี ﷺ เคยอาบน้ำศพ ซึ่งบ่งว่าหะดีษอ่อน"]}, {"wajh": 2, "type": "fiqh", "heading_ar": null, "heading_th": "การอาบน้ำเพราะสี่สิ่ง", "points_th": ["หะดีษบ่งว่าศาสนาบัญญัติให้อาบน้ำเพราะสี่สิ่ง", "(1) ญะนาบะฮ์ การอาบน้ำเพราะญะนาบะฮ์เป็นวาญิบตามอิจญ์มาอ์ ดังอายะฮ์ \"และหากพวกเจ้ามีญะนาบะฮ์ ก็จงทำความสะอาด\" (อัลมาอิดะฮ์: 6)", "(2) วันศุกร์ การอาบน้ำในวันนี้ส่งเสริมตามทัศนะของนักวิชาการส่วนใหญ่ จะกล่าวต่อไป", "(3) การกรอกเลือด นักวิชาการบางคนว่าการอาบน้ำหลังกรอกเลือดเป็นซุนนะฮ์ เชคอับดุลอะซีซ บินบาซก็ว่าเช่นนั้น นักวิชาการส่วนใหญ่ว่าไม่ส่งเสริม เพราะไม่มีหลักฐาน มีรายงานจากอิมามอะห์มัดว่า \"ไม่ต้องอาบน้ำเพราะการกรอกเลือด และไม่มีรายงานที่ยืนยันได้จากท่านนบี ﷺ\" เพราะเป็นเลือดที่ออกมาเหมือนเลือดกำเดา เหตุผลของการอาบน้ำตามผู้ที่มีทัศนะเช่นนั้น วัลลอฮุอะอ์ลัม คือการกรอกเลือดทำให้ร่างกายอ่อนแอ เพราะเลือดซึ่งเป็นพลังของมนุษย์ออกไป ทำให้เกียจคร้าน เหนื่อย และอ่อนแรง เมื่ออาบน้ำความกระปรี้กระเปร่าก็กลับมา", "(4) การอาบน้ำศพ การอาบน้ำเพราะอาบน้ำศพได้กล่าวแล้วในบทสิ่งที่ทำให้วุฎูอ์เสีย ที่หะดีษอบูฮุร็อยเราะฮ์ (หะดีษที่สิบของบทนั้น คือหะดีษ 76) และได้ระบุว่าทัศนะที่มีน้ำหนักกว่าคือส่งเสริม"]}], "tags_th": ["ฆุสล์", "การอาบน้ำศพ", "การกรอกเลือด", "วันศุกร์", "หะดีษอ่อน"]}, {"id": "v2-h113", "volume": 2, "bab": "ghusl", "topic_ar": "حكم الغسل بعد الإسلام", "topic_th": "ข้อตัดสินการอาบน้ำหลังรับอิสลาม", "pages": [23, 26], "hadith": [{"no": 113, "matn_ar": "وَعَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ فِي قِصَّةِ ثُمَامَةَ بْنِ أُثَالٍ، عِنْدَمَا أَسْلَمَ وَأَمَرَهُ النَّبِيُّ ﷺ أَنْ يَغْتَسِلَ. رَوَاهُ عَبْدُ الرَّزَّاقِ، وَأَصْلُهُ مُتَّفَقٌ عَلَيْهِ.", "translation_th": "และจากอบูฮุร็อยเราะฮ์ (ร.ฎ.) ในเรื่องของษุมามะฮ์ บินอุษาล เมื่อเขารับอิสลาม และท่านนบี ﷺ สั่งให้เขาอาบน้ำ รายงานโดยอับดุรร็อซซาก และต้นเรื่องอยู่ในอัลบุคอรีย์และมุสลิม", "grade_th": "ศ่อฮีห์ (อัลอัลบานีย์ว่าสายศ่อฮีห์ตามเงื่อนไขของอัลบุคอรีย์และมุสลิม) คำสั่งให้อาบน้ำมีเฉพาะในรายงานของอับดุรร็อซซาก"}], "key_rulings_th": ["นักวิชาการมีสามทัศนะ (1) วาญิบที่ผู้ปฏิเสธศรัทธาต้องอาบน้ำเมื่อรับอิสลาม (มาลิกีย์ ทัศนะที่รู้จักของฮัมบะลีย์ อัชเชากานีย์ว่ามีน้ำหนักกว่า) (2) ไม่วาญิบ นอกจากเคยมีสิ่งที่ทำให้ต้องอาบน้ำในช่วงที่ปฏิเสธศรัทธา ถ้าไม่มีก็ส่งเสริม (หะนะฟีย์ มาลิกีย์ ชาฟิอีย์) (3) ไม่วาญิบเลย", "ผู้แต่งเห็นว่าที่ชัดเจนกว่าคือการอาบน้ำเพราะรับอิสลามไม่วาญิบ แต่ส่งเสริม เพื่อรวมหลักฐานเข้าด้วยกัน", "ผู้คนจำนวนมากรับอิสลามโดยท่านนบี ﷺ ไม่ได้สั่งให้อาบน้ำ และเมื่อท่านส่งมุอาซไปเยเมนก็ไม่ได้สั่งให้เขาบอกเรื่องการอาบน้ำ", "ที่ระมัดระวังกว่าคือผู้รับอิสลามควรอาบน้ำ เพราะไม่ลำบากและมีประโยชน์มาก"], "vocab": [{"ar": "ثُمَامَةُ بْنُ أُثَالٍ", "th": "ษุมามะฮ์ บินอุษาล อัลหะนะฟีย์ หัวหน้าชาวยะมามะฮ์"}, {"ar": "تُنْعِمْ تُنْعِمْ عَلَى شَاكِرٍ", "th": "ถ้าท่านให้ความกรุณา ท่านก็ให้ความกรุณาแก่ผู้ที่รู้คุณ"}, {"ar": "ذَا دَمٍ", "th": "ผู้ที่เลือดของเขามีค่า (เพราะเป็นผู้นำ) การฆ่าเขาจะมีผู้มาแก้แค้น"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อับดุรร็อซซากบันทึก (6/9) และผ่านทางเขา อิบนุคุซัยมะฮ์ (1/125) อิบนุหิบบาน (4/41) อิบนุลญารูด (15) และอัลบัยฮะกีย์ (1/171) จากอุบัยดุลลอฮ์และอับดุลลอฮ์ บุตรอุมัร จากสะอีด อัลมักบุรีย์ จากอบูฮุร็อยเราะฮ์ว่า ษุมามะฮ์ อัลหะนะฟีย์ถูกจับเป็นเชลย ท่านนบี ﷺ ไปหาเขาและถามว่า \"ท่านมีอะไร ษุมามะฮ์\" เขาตอบว่า \"ถ้าท่านฆ่า ท่านก็ฆ่าผู้ที่เลือดมีค่า ถ้าท่านให้ความกรุณา ท่านก็ให้แก่ผู้ที่รู้คุณ ถ้าท่านต้องการทรัพย์ เราจะให้ท่านเท่าที่ท่านต้องการ\" บรรดาเศาะหาบะฮ์ชอบค่าไถ่ และกล่าวว่า \"เราจะทำอะไรกับการฆ่าคนนี้\" วันหนึ่งท่านนบี ﷺ เดินผ่าน เขาก็รับอิสลาม ท่านจึงปล่อยเขา และส่งเขาไปที่สวนของอบูฏ็อลหะฮ์ และสั่งให้เขาอาบน้ำ เขาอาบน้ำและละหมาดสองร็อกอะฮ์ ท่านนบี ﷺ กล่าวว่า \"อิสลามของพี่น้องของพวกท่านดีแล้ว\"", "อัลอัลบานีย์ว่า \"สายนี้ศ่อฮีห์ตามเงื่อนไขของอัลบุคอรีย์และมุสลิม อับดุลลอฮ์ บินอุมัรแม้จะอ่อน แต่อุบัยดุลลอฮ์ บินอุมัรรายงานสนับสนุน ซึ่งเชื่อถือได้ และอัลบุคอรีย์กับมุสลิมรายงานจากเขา\"", "ต้นเรื่องอยู่ในอัลบุคอรีย์ (4372) และมุสลิม (1764) ผ่านอัลลัยษ์ จากสะอีด บินอบีสะอีด อัลมักบุรีย์ ว่าเขาได้ยินอบูฮุร็อยเราะฮ์เล่า... จนถึงตอนที่ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"จงปล่อยษุมามะฮ์\" เขาจึงไปที่สวนอินทผลัมใกล้มัสยิดแล้วอาบน้ำ... ในนั้นไม่มีคำสั่งให้อาบน้ำ คำสั่งให้อาบน้ำมีเฉพาะในสำนวนของอับดุรร็อซซาก อิบนุหะญัรจึงยกสำนวนนี้ และชี้ถึงรายงานของเศาะฮีห์ทั้งสอง", "หะดีษของบทนี้มีหลักฐานสนับสนุนจากหะดีษเกาะยส์ บินอาศิม (ร.ฎ.) ว่า \"ฉันมาหาท่านนบี ﷺ ต้องการรับอิสลาม ท่านสั่งให้ฉันอาบน้ำด้วยน้ำและใบพุทรา\" (อบูดาวูด 355 อัตติรมิซีย์ 605 อันนะสาอีย์ อะห์มัด เป็นหะดีษศ่อฮีห์ อิบนุคุซัยมะฮ์และอิบนุหิบบานว่าศ่อฮีห์ อิบนุลมุนซิรว่า \"หะดีษที่ยืนยันได้\" และอันนะวะวีย์ว่าศ่อฮีห์)"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ษุมามะฮ์ บินอุษาล\" (ฎ็อมมะฮ์ที่ษาอ์ มีมไม่มีชัดดะฮ์ อุษาล ฎ็อมมะฮ์ที่ฮัมซะฮ์) คือษุมามะฮ์ บินอุษาล บินอันนุอ์มาน อัลหะนะฟีย์ หัวหน้าชาวยะมามะฮ์", "อบูฮุร็อยเราะฮ์เล่าว่า ท่านนบี ﷺ ส่งกองทหารม้าไปทางนัจด์ พวกเขาจับชายจากบะนีหะนีฟะฮ์ชื่อษุมามะฮ์ บินอุษาลมา แล้วมัดเขาไว้กับเสาต้นหนึ่งในมัสยิด (เพื่อให้เขาเห็นผู้คน) ท่านนบี ﷺ ออกมาหาเขาและถามว่า \"ท่านมีอะไร ษุมามะฮ์\" เขาตอบว่า \"ฉันมีแต่ความดี โอ้มุหัมมัด ถ้าท่านฆ่า ท่านก็ฆ่าผู้ที่เลือดมีค่า ถ้าท่านให้ความกรุณา ท่านก็ให้แก่ผู้ที่รู้คุณ ถ้าท่านต้องการทรัพย์ ก็ขอเท่าที่ต้องการ\" ท่านปล่อยเขาไว้จนวันรุ่งขึ้น ถามอีกและเขาตอบเหมือนเดิม จนถึงวันที่สาม ท่านกล่าวว่า \"จงปล่อยษุมามะฮ์\" เขาจึงไปที่สวนอินทผลัมใกล้มัสยิด อาบน้ำ แล้วเข้ามัสยิดและกล่าวว่า \"ฉันขอปฏิญาณว่าไม่มีพระเจ้าอื่นใดนอกจากอัลลอฮ์ และขอปฏิญาณว่ามุหัมมัดเป็นรสูลของอัลลอฮ์ โอ้มุหัมมัด ขอสาบานต่ออัลลอฮ์ บนแผ่นดินนี้ไม่มีใบหน้าใดที่ฉันเกลียดมากกว่าใบหน้าของท่าน บัดนี้ใบหน้าของท่านเป็นใบหน้าที่ฉันรักที่สุด ไม่มีศาสนาใดที่ฉันเกลียดมากกว่าศาสนาของท่าน บัดนี้ศาสนาของท่านเป็นศาสนาที่ฉันรักที่สุด ไม่มีเมืองใดที่ฉันเกลียดมากกว่าเมืองของท่าน บัดนี้เมืองของท่านเป็นเมืองที่ฉันรักที่สุด ทหารม้าของท่านจับฉันขณะที่ฉันต้องการทำอุมเราะฮ์ ท่านเห็นอย่างไร\" ท่านรสูลุลลอฮ์ ﷺ แจ้งข่าวดีแก่เขาและสั่งให้ทำอุมเราะฮ์ เมื่อเขาไปถึงมักกะฮ์ มีคนถามว่า \"ท่านเปลี่ยนศาสนาแล้วหรือ\" เขาตอบว่า \"ไม่ แต่ฉันรับอิสลามพร้อมมุหัมมัด ﷺ ขอสาบานต่ออัลลอฮ์ จะไม่มีเมล็ดข้าวสาลีจากยะมามะฮ์มาถึงพวกท่านแม้แต่เมล็ดเดียว จนกว่าท่านนบี ﷺ จะอนุญาต\" (อัลบุคอรีย์ 4372 มุสลิม 1764)", "อิบนุอิสหากระบุว่าษุมามะฮ์ยืนหยัดในอิสลามเมื่อชาวยะมามะฮ์ตกศาสนา เขาและผู้ที่เชื่อฟังเขาจากกลุ่มชนของเขาเดินทางไปสมทบกับอัลอะลาอ์ บินอัลหัฎเราะมีย์ และร่วมต่อสู้กับผู้ตกศาสนาจากชาวบะห์เรน เมื่อชนะ ษุมามะฮ์ซื้อชุดหนึ่งที่เป็นของหัวหน้าของพวกเขา คนจากบะนีเกาะยส์ บินษะอ์ละบะฮ์เห็นชุดนั้น คิดว่าเขาเป็นคนที่ฆ่าหัวหน้าของพวกเขาและยึดทรัพย์ จึงฆ่าเขา ในปี ฮ.ศ. 12"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "การอาบน้ำเมื่อรับอิสลาม", "points_th": ["หะดีษเป็นหลักฐานว่าวาญิบที่ผู้ปฏิเสธศรัทธาต้องอาบน้ำเมื่อรับอิสลาม ตามคำในรายงานของอับดุรร็อซซาก \"และสั่งให้เขาอาบน้ำ แล้วเขาก็อาบน้ำ\" ซึ่งเป็นคำสั่ง และคำสั่งบ่งถึงความวาญิบ ส่วนในรายงานของเศาะฮีห์ทั้งสอง การอาบน้ำยืนยันโดยการยอมรับของท่าน ความหมายตามตัวบทคือ ไม่ว่าในช่วงที่ปฏิเสธศรัทธาจะมีสิ่งที่ทำให้ต้องอาบน้ำ เช่น ประจำเดือนหรือญะนาบะฮ์ หรือไม่ก็ตาม นี่เป็นทัศนะในมัซฮับมาลิกีย์ เป็นที่รู้จักในมัซฮับฮัมบะลีย์ อิบนุลมุนซิรและอัลเคาะฏฏอบีย์เลือก และอัชเชากานีย์ว่ามีน้ำหนักกว่า พวกเขายังให้เหตุผลว่าผู้ปฏิเสธศรัทธาโดยทั่วไปไม่พ้นจากญะนาบะฮ์ จึงให้ภาวะที่คาดว่าเกิดขึ้นแทนความจริง เหมือนการนอน", "ทัศนะที่สอง: ไม่วาญิบต้องอาบน้ำ นอกจากในช่วงที่ปฏิเสธศรัทธามีสิ่งที่ทำให้ต้องอาบน้ำ ถ้าไม่มีก็ส่งเสริมให้อาบ นี่เป็นมัซฮับหะนะฟีย์ มาลิกีย์ และชาฟิอีย์", "ทัศนะที่สาม: ไม่วาญิบที่ผู้ปฏิเสธศรัทธาต้องอาบน้ำในทุกกรณี เป็นทัศนะหนึ่งในมัซฮับฮัมบะลีย์ หลักฐานของสองทัศนะหลังคือ (1) ผู้คนจำนวนมากรับอิสลาม และท่านนบี ﷺ ไม่ได้สั่งให้พวกเขาอาบน้ำ ถ้าท่านสั่ง ก็ต้องมีการรายงานมากเพราะเป็นเรื่องที่ผู้คนใส่ใจจะรายงาน และถ้าเป็นวาญิบ ก็จะไม่สั่งเฉพาะบางคน นี่จึงเป็นสิ่งบ่งชี้ที่เปลี่ยนคำสั่งให้เป็นการส่งเสริม (2) เมื่อท่านนบี ﷺ ส่งมุอาซไปเยเมน ท่านกล่าวว่า \"จงเรียกร้องพวกเขาสู่การปฏิญาณว่าไม่มีพระเจ้าอื่นใดนอกจากอัลลอฮ์ และมุหัมมัดเป็นบ่าวและรสูลของพระองค์...\" (อัลบุคอรีย์ 1395 มุสลิม 19 จะกล่าวในต้นหมวดซะกาต) ถ้าการอาบน้ำเป็นวาญิบ ท่านก็จะสั่งให้บอกพวกเขา เพราะเป็นวาญิบแรกของอิสลาม", "ผู้แต่งเห็นว่าที่ชัดเจนกว่า วัลลอฮุอะอ์ลัม คือการอาบน้ำเพราะรับอิสลามไม่วาญิบ แต่เป็นการส่งเสริม เพื่อรวมหลักฐานเข้าด้วยกัน และที่ระมัดระวังกว่าคือผู้รับอิสลามควรอาบน้ำ เพราะการอาบน้ำไม่มีความลำบาก และมีประโยชน์มาก"]}], "tags_th": ["ฆุสล์", "การรับอิสลาม", "ษุมามะฮ์ บินอุษาล", "ผู้ปฏิเสธศรัทธา"]}, {"id": "v2-h114-115", "volume": 2, "bab": "ghusl", "topic_ar": "حكم الغسل لصلاة الجمعة", "topic_th": "ข้อตัดสินการอาบน้ำสำหรับละหมาดวันศุกร์", "pages": [27, 35], "hadith": [{"no": 114, "matn_ar": "وَعَنْ أَبِي سَعِيدٍ رَضِيَ اللهُ عَنْهُ أَنَّ رَسُولَ اللهِ ﷺ قَالَ: «غُسْلُ الْجُمُعَةِ وَاجِبٌ عَلَى كُلِّ مُحْتَلِمٍ». أَخْرَجَهُ السَّبْعَةُ.", "translation_th": "และจากอบูสะอีด (ร.ฎ.) ว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"การอาบน้ำวันศุกร์เป็นวาญิบแก่ผู้บรรลุนิติภาวะทุกคน\" บันทึกโดยนักบันทึกทั้งเจ็ด", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม) ผู้แต่งเห็นว่าการที่อิบนุหะญัรระบุว่าอัตติรมิซีย์บันทึกด้วยเป็นความผิดพลาด"}, {"no": 115, "matn_ar": "وَعَنْ سَمُرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «مَنْ تَوَضَّأَ يَوْمَ الْجُمُعَةِ فَبِهَا وَنِعْمَتْ، وَمَنِ اغْتَسَلَ فَالْغُسْلُ أَفْضَلُ». رَوَاهُ الْخَمْسَةُ، وَحَسَّنَهُ التِّرْمِذِيُّ.", "translation_th": "และจากสะมุเราะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"ผู้ใดอาบน้ำละหมาดในวันศุกร์ ก็ถือตามการผ่อนปรน และเป็นสิ่งที่ดี ผู้ใดอาบน้ำ การอาบน้ำก็ประเสริฐกว่า\" รายงานโดยนักบันทึกทั้งห้า และอัตติรมิซีย์ว่าหะซัน", "grade_th": "หะซัน (อัตติรมิซีย์) สายของอัลหะสันจากสะมุเราะฮ์มีความขัดแย้งเรื่องการได้ยิน"}], "key_rulings_th": ["นักวิชาการมีสองทัศนะหลัก (1) วาญิบ (ซอฮิรีย์ เศาะหาบะฮ์กลุ่มหนึ่ง และรายงานหนึ่งจากมาลิกและอะห์มัด) (2) ส่งเสริม (นักฟิกฮ์ส่วนใหญ่) และมีทัศนะที่สามว่าวาญิบแก่ผู้ที่มีกลิ่นตัวที่ต้องขจัด", "ผู้แต่งเห็นว่าทัศนะว่าวาญิบมีน้ำหนัก เพราะหลักฐานแข็งแรงกว่าทั้งสายรายงานและชัดเจนกว่า มีทั้งคำสั่ง คำว่าวาญิบ และคำว่าเป็นสิทธิ และหะดีษสะมุเราะฮ์ที่ขัดแย้งนั้นถูกโต้แย้งเรื่องความถูกต้อง", "ที่ระมัดระวังกว่าคือมุสลิมไม่ควรละการอาบน้ำวันศุกร์เมื่อทำได้ และควรพิจารณาเหตุผลของการวาญิบ คือกลิ่นที่รบกวนผู้มาละหมาดและมะลาอิกะฮ์", "ตามทัศนะว่าวาญิบ การอาบน้ำก็ไม่ใช่เงื่อนไขของความถูกต้องของละหมาด อัลเคาะฏฏอบีย์ว่าประชาชาติไม่ขัดแย้งว่าละหมาดของผู้ไม่อาบน้ำใช้ได้", "การอาบน้ำเป็นของละหมาด ไม่ใช่ของวัน (นักวิชาการส่วนใหญ่) จึงต้องอาบก่อนไปละหมาด และส่งเสริมให้อาบใกล้เวลาไป ส่วนซอฮิรีย์ว่าเป็นของวัน"], "vocab": [{"ar": "غُسْلُ الْجُمُعَةِ", "th": "การอาบน้ำวันศุกร์ ตามทัศนะที่ใกล้กว่าคือการอาบน้ำเพราะละหมาดวันศุกร์"}, {"ar": "مُحْتَلِمٍ", "th": "ผู้ที่ถึงวัยฝันเปียก คือผู้บรรลุนิติภาวะ"}, {"ar": "فَبِهَا وَنِعْمَتْ", "th": "ก็ถือตามการผ่อนปรน และการผ่อนปรนนั้นเป็นสิ่งที่ดี"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["คือสะมุเราะฮ์ บินญุนดุบ (ฟัตหะฮ์หรือฎ็อมมะฮ์ที่ดาล) บินฮิลาล อัลฟะซารีย์ พันธมิตรของชาวอันศอร มารดาพาเขามามะดีนะฮ์หลังบิดาเสียชีวิต ขณะยังเป็นเด็ก วันหนึ่งท่านนบี ﷺ ตรวจเด็กหนุ่มชาวอันศอรที่จะไปรบ ท่านอนุญาตเด็กคนหนึ่ง แต่ไม่อนุญาตสะมุเราะฮ์ เขาจึงกล่าวว่า \"โอ้ท่านรสูลุลลอฮ์ ท่านอนุญาตคนนี้แต่ไม่อนุญาตฉัน ถ้าฉันปล้ำกับเขา ฉันจะชนะ\" ท่านนบี ﷺ กล่าวว่า \"จงปล้ำกับเขา\" เขาปล้ำและชนะ ท่านรสูลุลลอฮ์ ﷺ จึงอนุญาตเขา", "เขามีหะดีษจากท่านนบี ﷺ มาก บุตรของเขาสุลัยมาน อิมรอน บินหุศ็อยน์ อัลหะสัน อัลบัศรีย์ อัชชะอ์บีย์ และคนอื่นรายงานจากเขา ซิยาดแต่งตั้งเขาเป็นผู้แทนที่กูฟะฮ์หกเดือน และที่บัศเราะฮ์หกเดือน เมื่อซิยาดเสียชีวิต มุอาวิยะฮ์แต่งตั้งเขาปกครองบัศเราะฮ์ แล้วปลดเขา และเขาอยู่ที่นั่นจนเสียชีวิตปี ฮ.ศ. 58"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجهما", "heading_th": "ที่มาของหะดีษ", "points_th": ["หะดีษอบูสะอีด: อัลบุคอรีย์บันทึก (879) ในหมวดวันศุกร์ บทความประเสริฐของการอาบน้ำวันศุกร์ มุสลิม (846) อบูดาวูด (341) อันนะสาอีย์ (3/92) อิบนุมาญะฮ์ (1089) และอะห์มัด (18/125) ทั้งหมดผ่านเศาะฟวาน บินสุลัยม์ จากอะฏออ์ บินยะสาร จากอบูสะอีด อัลคุดรีย์ แบบมัรฟูอ์ ผู้แต่งเห็นว่าการที่อิบนุหะญัรระบุว่าอัตติรมิซีย์บันทึกด้วยเป็นความผิดพลาด เพราะอัตติรมิซีย์ไม่ได้บันทึกไว้ในญามิอ์ของเขา", "หะดีษสะมุเราะฮ์: อบูดาวูดบันทึก (354) ในหมวดความสะอาด บทการผ่อนปรนให้ไม่อาบน้ำวันศุกร์ อัตติรมิซีย์ (497) อันนะสาอีย์ (3/94) และอะห์มัด (33/308) ทั้งหมดผ่านเกาะตาดะฮ์ จากอัลหะสัน อัลบัศรีย์ จากสะมุเราะฮ์ แบบมัรฟูอ์ สายนี้ดีที่สุดของหะดีษนี้ และมีสายอื่นที่นักจำว่าอ่อน อับดุรร็อซซาก (5311) และอัลบัยฮะกีย์บันทึกผ่านเกาะตาดะฮ์ จากอัลหะสัน จากท่านนบี ﷺ แบบมุรสัล ส่วนการที่อิบนุหะญัรระบุว่าอิบนุมาญะฮ์บันทึก ผู้แต่งเห็นว่าเป็นความผิดพลาด เพราะหะดีษในอิบนุมาญะฮ์มาจากรายงานของอะนัส (ร.ฎ.) ไม่ใช่สะมุเราะฮ์", "หะดีษนี้เป็นรายงานของอัลหะสัน อัลบัศรีย์จากสะมุเราะฮ์ ซึ่งมีความขัดแย้งสามทัศนะว่าเขาได้ยินจากสะมุเราะฮ์หรือไม่ (1) ได้ยินโดยทั่วไป หะดีษของเขาจึงถือว่าต่อเนื่อง เป็นทัศนะของอะลี บินอัลมะดีนีย์ อัลบุคอรีย์ และอัตติรมิซีย์ อัตติรมิซีย์ยกจากอัลบุคอรีย์ว่า \"การที่อัลหะสันได้ยินจากสะมุเราะฮ์ บินญุนดุบถูกต้อง\" เชคอับดุลอะซีซ บินบาซเห็นว่ามีน้ำหนักกว่า และว่า \"ทัศนะว่าเขาได้ยินจากสะมุเราะฮ์เป็นทัศนะที่แข็งแรง เพราะสะมุเราะฮ์อยู่ที่บัศเราะฮ์ และเสียชีวิตปี 58 หรือ 59 และอัลหะสันก็อยู่ที่บัศเราะฮ์ จึงไม่น่าเป็นไปได้ที่เขาจะไม่พบเขาเลย และรับเฉพาะหะดีษอะกีเกาะฮ์ ทั้งที่ตาบิอีนใฝ่ใจจะพบเศาะหาบะฮ์และรับจากพวกเขา\" (2) ไม่ได้ยินเลย แต่เป็นตำรา ไม่ใช่การได้ยิน เป็นทัศนะของยะห์ยา อัลก็อฏฏอน อิบนุมะอีน และอิบนุหิบบาน อิบนุหะญัรว่าสิ่งนี้ไม่ได้ทำให้สายขาด และอิบนุลก็อยยิมสนับสนุน (3) ได้ยินเพียงหะดีษเดียว คือหะดีษอะกีเกาะฮ์ อัลบุคอรีย์ระบุในเศาะฮีห์จากหะบีบ บินอัชชะฮีดว่า \"อิบนุสีรีนสั่งให้ฉันถามอัลหะสันว่าเขาได้ยินหะดีษอะกีเกาะฮ์จากใคร ฉันถาม เขาตอบว่า จากสะมุเราะฮ์ บินญุนดุบ\" เป็นทัศนะของอันนะสาอีย์ อัดดารุกุฏนีย์ อัลบัซซาร อิบนุอะสากิรเลือก และอับดุลหักก์อ้างว่าเป็นทัศนะที่ถูกต้อง"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظهما", "heading_th": "อธิบายถ้อยคำ", "points_th": ["อิบนุหะญัรยกสองหะดีษนี้ หะดีษแรกความหมายตามตัวบทคือวาญิบ หะดีษที่สองความหมายตามตัวบทคือส่งเสริม และในบทนี้ยังมีหะดีษอื่นในสองหุก่มนี้ แต่จุดประสงค์ของอิบนุหะญัร วัลลอฮุอะอ์ลัม คือชี้ว่าการอาบน้ำวันศุกร์มีสองทัศนะ (ผู้แต่งกล่าวไว้ก่อนเริ่มวัจญ์)", "\"การอาบน้ำวันศุกร์เป็นวาญิบ\" การเชื่อมการอาบน้ำกับวันศุกร์ อาจเป็นการเชื่อมสิ่งหนึ่งกับสาเหตุ คือละหมาดวันศุกร์เป็นสาเหตุของการวาญิบอาบน้ำ หรือเป็นการเชื่อมสิ่งหนึ่งกับเวลา คือการอาบน้ำในวันศุกร์ ตามแบบแรก จะไม่ได้ความประเสริฐของการอาบน้ำ นอกจากอาบในเวลาไปละหมาดวันศุกร์ ตามแบบที่สอง การอาบน้ำในวันศุกร์ไม่ว่าก่อนหรือหลังละหมาดก็ได้ ผู้แต่งเห็นว่าแบบแรกใกล้ความจริงกว่า", "\"แก่ผู้บรรลุนิติภาวะทุกคน\" (มุห์ตะลิม ฎ็อมมะฮ์ที่มีม สุกูนที่หาอ์) คือผู้ที่ถึงวัยฝันเปียก (อัลหุลุม) หมายถึงผู้บรรลุนิติภาวะ ที่กล่าวถึงการฝันเปียกเพราะเป็นกรณีส่วนใหญ่", "\"ฟะบิฮา วะนิอ์มัต\" สรรพนามอ้างถึงสิ่งที่เข้าใจจากบริบท คำบุพบทเกี่ยวกับคำที่ละไว้ ความหมายคือ ผู้ใดอาบน้ำละหมาด ก็ถือตามการผ่อนปรน และการผ่อนปรนนั้นเป็นสิ่งที่ดี เพราะเป็นความสะดวกแก่ผู้คน การอาบน้ำละหมาดจึงเป็นการผ่อนปรน และการอาบน้ำเป็นซุนนะฮ์ อัซซะมัคชะรีย์ว่า \"บาอ์เกี่ยวกับกริยาที่ละไว้ คือ ด้วยลักษณะหรือการกระทำนี้ คือวุฎูอ์ เขาได้รับความประเสริฐ และนิอ์มัต คือ ลักษณะนั้นดี\" อัลอัศมะอีย์ถูกถามเรื่องนี้ เขาตอบว่า \"ฉันคิดว่าหมายถึง ก็ถือตามซุนนะฮ์\""]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "หลักฐานของทัศนะว่าวาญิบ", "points_th": ["หะดีษอบูสะอีด (ร.ฎ.) เป็นหลักฐานชัดเจนสำหรับผู้ที่ว่าการอาบน้ำวันศุกร์เป็นวาญิบ ได้แก่ เศาะหาบะฮ์กลุ่มหนึ่ง เช่น อุมัร อบูฮุร็อยเราะฮ์ อบูสะอีด อัมมาร และคนอื่น ตามที่อิบนุลมุนซิรยกมา และเป็นทัศนะของชาวซอฮิรีย์ รายงานหนึ่งจากมาลิก ตามที่อัลเคาะฏฏอบีย์ยก และรายงานหนึ่งจากอิมามอะห์มัดสำหรับผู้ที่ต้องละหมาดวันศุกร์", "หลักฐานอื่นของฝ่ายนี้ (1) หะดีษอิบนุอุมัร (ร.ฎ.) ว่า \"ฉันได้ยินท่านรสูลุลลอฮ์ ﷺ กล่าวว่า เมื่อคนหนึ่งในหมู่พวกท่านต้องการไปละหมาดวันศุกร์ ก็จงอาบน้ำ\" (อัลบุคอรีย์ 877 มุสลิม 844) (2) หะดีษอิบนุอับบาส (ร.ฎ.) ว่าเฏาวูสกล่าวกับอิบนุอับบาสว่า มีคนกล่าวว่าท่านนบี ﷺ กล่าวว่า \"จงอาบน้ำในวันศุกร์ และล้างศีรษะ แม้พวกท่านไม่มีญะนาบะฮ์ และจงใส่น้ำหอม\" อิบนุอับบาสกล่าวว่า \"ส่วนการอาบน้ำนั้นใช่ ส่วนน้ำหอมฉันไม่รู้\" (อัลบุคอรีย์ 884 มุสลิม 848) ซึ่งคำว่า \"จงอาบน้ำ\" เป็นคำสั่ง ซึ่งบ่งถึงความวาญิบ (3) หะดีษอบูฮุร็อยเราะฮ์ (ร.ฎ.) ว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"เป็นสิทธิของอัลลอฮ์เหนือมุสลิมทุกคน ที่จะอาบน้ำในทุกเจ็ดวัน ล้างศีรษะและร่างกาย\" (อัลบุคอรีย์ 896 มุสลิม 849)", "(4) หะดีษอิบนุอุมัรว่า ขณะที่อุมัร บินอัลค็อฏฏอบ (ร.ฎ.) ยืนคุฏบะฮ์ในวันศุกร์ มีชายคนหนึ่งในมุฮาญิรีนรุ่นแรกจากเศาะหาบะฮ์ของท่านนบี ﷺ เข้ามา อุมัรเรียกเขาว่า \"นี่เวลาอะไร\" เขาตอบว่า \"ฉันติดธุระ จึงยังไม่ได้กลับบ้านจนได้ยินอะซาน แล้วก็ไม่ได้ทำอะไรมากกว่าอาบน้ำละหมาด\" อุมัรกล่าวว่า \"และเพียงวุฎูอ์อีกหรือ\" (อัลบุคอรีย์ 878 มุสลิม 845 และในอีกรายงานของมุสลิมจากอบูฮุร็อยเราะฮ์ระบุชัดว่าผู้ที่เข้ามาคืออุษมาน (ร.ฎ.)) หลักฐานคืออุมัรหยุดคุฏบะฮ์และตำหนิผู้ที่เข้ามา และทักท้วงที่เขาไม่อาบน้ำ ถ้าเป็นเพียงสิ่งที่อนุญาต ก็จะไม่ทำเช่นนั้น และผู้ที่อยู่ ณ ที่นั้นซึ่งคือเศาะหาบะฮ์ส่วนใหญ่ก็ยอมรับ นี่เป็นหลักฐานที่ชัดที่สุดว่าความวาญิบเป็นที่รู้กันในหมู่เศาะหาบะฮ์ ถ้าไม่ใช่วาญิบ ก็จะไม่มีการตำหนิ และเศาะหาบะฮ์คนนั้นก็จะไม่ต้องอ้างเหตุ", "ส่วนการที่ใช้หะดีษนี้เป็นหลักฐานว่าส่งเสริม เพราะอุมัร (ร.ฎ.) ไม่ได้สั่งให้ผู้ที่เข้ามาออกไปอาบน้ำ ตามที่อันนะวะวีย์และกลุ่มหนึ่งกล่าว ผู้แต่งเห็นว่าไม่ใช่หลักฐานที่ใช้ได้ เว้นแต่การอาบน้ำเป็นเงื่อนไขความถูกต้องของละหมาด และเพราะการเห็นคนละวาญิบของศาสนาไม่ได้ทำให้ต้องทำอะไรมากกว่าการทักท้วงคนที่ละวาญิบ ซึ่งอุมัร (ร.ฎ.) ก็ทำแล้ว อีกทั้งอาจเป็นไปได้ว่าอุษมาน (ร.ฎ.) อาบน้ำแล้วตอนต้นวัน เพราะยืนยันจากหุมรอน ผู้รับใช้ของเขาว่า อุษมานไม่เคยผ่านวันใดโดยไม่ราดน้ำบนตัว เขาเพียงไม่ได้อ้างเรื่องนี้กับอุมัร เหมือนที่อ้างเรื่องการมาช้า เพราะการอาบน้ำของเขาไม่ได้ต่อเนื่องกับการไปละหมาดวันศุกร์"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "หลักฐานของทัศนะว่าส่งเสริม และการชั่งน้ำหนัก", "points_th": ["หะดีษสะมุเราะฮ์ (ร.ฎ.) เป็นหลักฐานของผู้ที่ว่าการอาบน้ำวันศุกร์ส่งเสริม ไม่ใช่วาญิบ ซึ่งเป็นทัศนะของนักฟิกฮ์ส่วนใหญ่ทั้งรุ่นก่อนและรุ่นหลัง หลักฐานคือหะดีษบ่งว่าการอาบน้ำและวุฎูอ์มีความประเสริฐร่วมกัน และการอาบน้ำไม่จำเป็น", "หลักฐานอื่นคือหะดีษอาอิชะฮ์ (ร.ฎ.) ว่า \"ผู้คนทำงานด้วยตัวเอง และเมื่อไปละหมาดวันศุกร์ ก็ไปในสภาพนั้น จึงมีผู้กล่าวแก่พวกเขาว่า ถ้าพวกท่านอาบน้ำก็จะดี\" และอีกรายงานผ่านอุรวะฮ์จากอาอิชะฮ์ว่า \"ผู้คนผลัดกันมาละหมาดวันศุกร์จากบ้านของพวกเขาในที่สูงรอบมะดีนะฮ์ มาในเสื้อคลุม ฝุ่นจับตัว จนมีกลิ่นออกมา คนหนึ่งในพวกเขามาหาท่านรสูลุลลอฮ์ ﷺ ขณะท่านอยู่กับฉัน ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า ถ้าพวกท่านทำความสะอาดสำหรับวันนี้ก็จะดี\" (อัลบุคอรีย์ 902 มุสลิม 847) หลักฐานคือคำว่า \"ถ้าพวกท่านอาบน้ำ\" บ่งว่าการอาบน้ำไม่ใช่วาญิบ เพราะความหมายคือ ก็จะประเสริฐและสมบูรณ์กว่า", "และหะดีษอบูฮุร็อยเราะฮ์ (ร.ฎ.) ว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"ผู้ใดอาบน้ำละหมาดอย่างดี แล้วมาละหมาดวันศุกร์ ฟังและเงียบ เขาจะได้รับการอภัยสิ่งที่อยู่ระหว่างวันนั้นถึงวันศุกร์หน้า และเพิ่มอีกสามวัน และผู้ใดเล่นก้อนกรวด ก็ถือว่าพูดเหลวไหล\" (มุสลิม 857) หลักฐานคือการกล่าวถึงวุฎูอ์และสิ่งอื่นที่มีผลบุญตามมาซึ่งบ่งถึงความถูกต้อง บ่งว่าวุฎูอ์เพียงพอ อิบนุหะญัรว่า \"เป็นหลักฐานที่แข็งแรงที่สุดที่ใช้ว่าการอาบน้ำวันศุกร์ไม่ใช่ฟัรฎู\"", "มีทัศนะที่สามที่อิบนุลก็อยยิมยก คือแยกแยะ ผู้ที่มีกลิ่นที่ต้องขจัดต้องอาบน้ำ ผู้ที่ไม่มีก็ส่งเสริม แล้วเขาระบุว่าทั้งสามทัศนะเป็นของสานุศิษย์อะห์มัด อิบนุหะญัรชี้ถึงทัศนะนี้ และอิบนุตัยมียะฮ์เลือก", "ผู้แต่งกล่าวว่า \"ทัศนะว่าวาญิบแข็งแรง ตามที่ปรากฏแก่ฉัน\" ด้วยเหตุผลต่อไปนี้ (1) หลักฐานของความวาญิบแข็งแรงกว่าในสายรายงาน และชัดเจนกว่าในการบ่งชี้ บางครั้งมาเป็นคำสั่ง บางครั้งว่าวาญิบ บางครั้งว่าเป็นสิทธิ และความวาญิบยืนยันได้ด้วยน้อยกว่านั้น ท่านรสูล ﷺ เป็นผู้ที่พูดชัดเจนที่สุดในหมู่มนุษย์ ท่านจะไม่พูดคำที่ไม่ได้หมายถึงความหมายตามตัวบท แม้จะมีผู้แย้งการใช้คำว่า \"การอาบน้ำวันศุกร์เป็นวาญิบ\" ว่าบ่งถึงความวาญิบ โดยอ้างว่าคำว่า \"วาญิบ\" ในตัวบทอัลกุรอานและซุนนะฮ์ไม่ได้ใช้ในความหมายทางวิชาการของนักอุศูล แต่ความหลากหลายของรูปแบบสนับสนุนดังที่กล่าวแล้ว", "(2) จะไม่เปลี่ยนจากความวาญิบนี้ นอกจากด้วยสิ่งที่แข็งแรง เพราะการเปลี่ยนคำจากความหมายตามตัวบทจะทำได้เมื่อหลักฐานที่ขัดแย้งมีน้ำหนักกว่าในการบ่งชี้ จึงจะละความหมายตามตัวบท และยึดหลักฐานที่มีน้ำหนักกว่า หลักฐานที่แข็งแรงที่สุดที่ใช้ขัดแย้งคือหะดีษสะมุเราะฮ์ ซึ่งตอบได้สองทาง (ก) มีความขัดแย้งเรื่องความถูกต้อง จึงไม่เทียบเท่าสายรายงานของหะดีษที่บ่งถึงความวาญิบ ซึ่งอยู่ในเศาะฮีห์ทั้งสอง (ข) หากสมมุติว่าถูกต้องตามทัศนะที่ว่าอัลหะสันได้ยินจากสะมุเราะฮ์ ก็ไม่ได้บ่งว่าการอาบน้ำไม่วาญิบ แต่บ่งว่าวุฎูอ์ก็ดี และการอาบน้ำประเสริฐกว่า ซึ่งไม่ต้องสงสัย อัลลอฮ์ตรัสว่า \"และหากชาวคัมภีร์ศรัทธา ก็จะเป็นการดีแก่พวกเขา\" (อาลิอิมรอน: 110) จะบ่งว่าการศรัทธาไม่ใช่ฟัรฎูหรือ", "ส่วนหะดีษอบูฮุร็อยเราะฮ์ \"ผู้ใดอาบน้ำละหมาดอย่างดี...\" ตอบได้สองทาง (ก) ไม่ได้ปฏิเสธการอาบน้ำ แต่อาจหมายถึงวุฎูอ์สำหรับผู้ที่อาบน้ำก่อนไป แล้วต้องอาบน้ำละหมาดใหม่ จึงถูกจำกัดด้วยหะดีษเรื่องการอาบน้ำ (ข) ในมุสลิมมีสำนวนว่า \"ผู้ใดอาบน้ำ แล้วมาละหมาดวันศุกร์ ละหมาดตามที่ถูกกำหนดให้ แล้วเงียบจนอิมามคุฏบะฮ์เสร็จ แล้วละหมาดพร้อมอิมาม เขาจะได้รับการอภัยสิ่งที่อยู่ระหว่างวันนั้นถึงวันศุกร์หน้า และเพิ่มอีกสามวัน\"", "(3) ที่สนับสนุนความวาญิบอีกคือ หะดีษที่ระบุชัดว่าการอาบน้ำวันศุกร์วาญิบ มีหุก่มที่เพิ่มขึ้นจากหะดีษที่บ่งว่าส่งเสริม และวาญิบต้องยึดสิ่งที่มีส่วนเพิ่ม", "ที่ระมัดระวังกว่าสำหรับมุสลิมคือไม่ละการอาบน้ำวันศุกร์เมื่อมีโอกาส เพราะหะดีษเห็นพ้องกันในความประเสริฐและการส่งเสริม และควรพิจารณาหลักฐานที่มีการกล่าวถึงความวาญิบพร้อมเหตุผล คือมีกลิ่นที่รบกวนผู้มาละหมาด และแม้แต่มะลาอิกะฮ์ผู้มีเกียรติ", "ตามทัศนะว่าวาญิบ การอาบน้ำก็ไม่ใช่เงื่อนไขความถูกต้องของละหมาด อัลเคาะฏฏอบีย์ว่า \"ประชาชาติไม่ขัดแย้งว่าละหมาดของผู้ไม่อาบน้ำใช้ได้\" แต่ในหนังสือ \"อัรริซาละฮ์\" ของอัชชาฟิอีย์มีทัศนะว่าการอาบน้ำวาญิบ และความสะอาดสำหรับละหมาดวันศุกร์ใช้ไม่ได้นอกจากการอาบน้ำ เหมือนที่ความสะอาดของผู้มีญะนาบะฮ์ใช้ไม่ได้นอกจากการอาบน้ำ"]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "การอาบน้ำเป็นของละหมาดหรือของวัน", "points_th": ["ความหมายตามตัวบทของคำว่า \"การอาบน้ำวันศุกร์\" คือการอาบน้ำเป็นของวัน เพราะการเชื่อมกับวัน นี่เป็นทัศนะของชาวซอฮิรีย์ ซึ่งสรุปว่าเวลาอาบน้ำของพวกเขาเริ่มตั้งแต่ฟัจญ์ขึ้น จนถึงก่อนดวงอาทิตย์ตกพอที่จะอาบน้ำเสร็จ ผู้ที่อาบน้ำในเวลานี้ได้รับความประเสริฐและปฏิบัติวาญิบแล้ว", "นักวิชาการส่วนใหญ่ว่าการอาบน้ำเป็นของละหมาด ไม่ใช่ของวัน เพราะมีหลักฐานชัดเจนสนับสนุน เช่น หะดีษอิบนุอุมัรที่กล่าวแล้ว \"เมื่อคนหนึ่งในหมู่พวกท่านต้องการไปละหมาดวันศุกร์ ก็จงอาบน้ำ\" และในรายงานของอิบนุคุซัยมะฮ์ว่า \"ผู้ใดมาละหมาดวันศุกร์ ทั้งชายและหญิง ก็จงอาบน้ำ และผู้ใดไม่มา ก็ไม่ต้องอาบน้ำ ทั้งชายและหญิง\" นี่ระบุชัดว่าการอาบน้ำเป็นของละหมาด ไม่ใช่ของวัน เพราะบัญญัติเพื่อความสะอาดและขจัดกลิ่นไม่ดี ซึ่งเหมาะกับละหมาด และเพราะวันศุกร์มีบัญญัติเฉพาะที่ละหมาดอื่นไม่มี", "ส่วนหะดีษของบทที่ชาวซอฮิรีย์ใช้ ไม่ได้หมายถึงวันโดยทั่วไป แต่หมายถึงละหมาดในวันนั้น เพราะเป็นพิธีกรรมที่ยิ่งใหญ่ที่สุดที่จัดในวันนี้ เป็นญะมาอะฮ์ในมัสยิดที่ใหญ่ที่สุดของเมือง และความสะอาดเป็นสิ่งที่จำเป็น เพื่อไม่ให้ผู้ละหมาดรบกวนกัน ซึ่งไม่เกิดขึ้นหลังละหมาด ถ้าเรากล่าวว่าการอาบน้ำหลังละหมาดก็ใช้ได้", "จากตรงนี้ มาลิกีย์จึงกำหนดเงื่อนไขว่าการอาบน้ำต้องต่อเนื่องกับการไปละหมาดวันศุกร์ เพื่อให้บรรลุเหตุผลของการบัญญัติ ถ้าระยะห่างระหว่างการอาบน้ำกับละหมาดนาน ต้องอาบใหม่ แต่ระยะห่างเล็กน้อยไม่เป็นไร ส่วนนักวิชาการส่วนใหญ่ไม่กำหนดว่าต้องต่อเนื่องกับการไป แต่ส่งเสริมให้อาบใกล้เวลาไป เพื่อให้ได้จุดประสงค์อย่างดีที่สุด"]}], "tags_th": ["ฆุสล์", "วันศุกร์", "ละหมาดญุมุอะฮ์", "วาญิบ", "สะมุเราะฮ์"]}, {"id": "v2-h116", "volume": 2, "bab": "ghusl", "topic_ar": "حكم قراءة القرآن للجنب", "topic_th": "ข้อตัดสินการอ่านอัลกุรอานของผู้มีญะนาบะฮ์", "pages": [36, 40], "hadith": [{"no": 116, "matn_ar": "وَعَنْ عَلِيٍّ رَضِيَ اللهُ عَنْهُ قَالَ: كَانَ رَسُولُ اللهِ ﷺ يُقْرِئُنَا الْقُرْآنَ مَا لَمْ يَكُنْ جُنُبًا. رَوَاهُ الْخَمْسَةُ، وَهَذَا لَفْظُ التِّرْمِذِيِّ وَحَسَّنَهُ، وَصَحَّحَهُ ابْنُ حِبَّانَ.", "translation_th": "และจากอะลี (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ เคยสอนเราอ่านอัลกุรอาน ตราบใดที่ท่านไม่มีญะนาบะฮ์ รายงานโดยนักบันทึกทั้งห้า นี่เป็นสำนวนของอัตติรมิซีย์ ซึ่งว่าหะซัน และอิบนุหิบบานว่าศ่อฮีห์", "grade_th": "มีความขัดแย้ง อัตติรมิซีย์ อิบนุหิบบาน อิบนุหะญัร และเชคอิบนุบาซว่าหะซันหรือศ่อฮีห์ แต่นักวิชาการส่วนใหญ่ว่าอ่อน เพราะอับดุลลอฮ์ บินสะลิมะฮ์ความจำเปลี่ยนในบั้นปลาย"}], "key_rulings_th": ["ผู้มีญะนาบะฮ์ห้ามอ่านอัลกุรอานจนกว่าจะอาบน้ำ เป็นทัศนะของนักวิชาการส่วนใหญ่ มาลิกีย์ยกเว้นเล็กน้อยเพื่อคุ้มครองตัว เช่น อายะตุลกุรซีย์ ชาฟิอีย์อนุญาตถ้าตั้งใจเป็นซิกิร และอะห์มัดผ่อนปรนให้อ่านหนึ่งอายะฮ์หรือทำนองนั้น", "อีกทัศนะว่าผู้มีญะนาบะฮ์อ่านได้ (อิบนุหัซม์ อิบนุอับบาส อิบนุลมุซัยยิบ อิบนุลมุนซิร)", "ผู้แต่งเห็นว่าทัศนะว่าอนุญาตมีน้ำหนัก เพราะหะดีษที่ห้ามถูกวิจารณ์ แต่ความระมัดระวังที่อิมามชาฟิอีย์เสนอ (ไม่อ่าน) มีน้ำหนักมาก โดยเฉพาะเมื่อผู้มีญะนาบะฮ์ส่วนใหญ่สามารถขจัดฮะดัษได้", "ผู้หญิงมีประจำเดือนอ่านอัลกุรอานได้ ผู้แต่งเห็นว่าที่ชัดเจนกว่าคืออนุญาตโดยทั่วไป เพราะไม่มีตัวบท และการเทียบกับผู้มีญะนาบะฮ์ไม่ถูกต้องเพราะมีความต่าง (อิบนุตัยมียะฮ์ อิบนุลก็อยยิม)"], "vocab": [{"ar": "يُقْرِئُنَا الْقُرْآنَ", "th": "สอนเราอ่านอัลกุรอาน"}, {"ar": "مَا لَمْ يَكُنْ جُنُبًا", "th": "ตราบใดที่ไม่มีญะนาบะฮ์"}, {"ar": "عِلْجَانِ", "th": "ชายสองคนที่แข็งแรงตัวใหญ่"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อบูดาวูดบันทึก (229) ในหมวดความสะอาด บทผู้มีญะนาบะฮ์อ่านอัลกุรอาน อัตติรมิซีย์ (146) อันนะสาอีย์ (1/144) อิบนุมาญะฮ์ (594) อะห์มัด (2/61) และอิบนุหิบบาน (799, 800) ผ่านชุอ์บะฮ์ จากอัมรฺ บินมุรเราะฮ์ จากอับดุลลอฮ์ บินสะลิมะฮ์ อัลมุรอดีย์ ว่า \"ฉันกับชายสองคนเข้าไปหาอะลี (ร.ฎ.) ...อะลีส่งทั้งสองไปทำงานที่หนึ่ง และกล่าวว่า พวกท่านเป็นชายแข็งแรง จงไปปกป้องศาสนาของพวกท่าน แล้วอะลีลุกเข้าห้องสุขา แล้วออกมาขอน้ำ ตักน้ำหนึ่งกำมือล้าง
