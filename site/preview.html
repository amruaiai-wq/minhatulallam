่อาบน้ำละหมาด อิบนุอับบาสถามว่า \"ท่านละหมาดโดยไม่อาบน้ำละหมาด ทั้งที่หลับไปแล้ว\" ท่านตอบว่า \"การอาบน้ำละหมาดนั้นจำเป็นเฉพาะผู้ที่นอนหลับในท่านอนตะแคงเท่านั้น\"", "อบูดาวูดกล่าวว่า คำว่า \"การอาบน้ำละหมาดจำเป็นแก่ผู้ที่นอนตะแคง\" เป็นหะดีษมุนกัร มีเพียงยะซีด อบูคอลิด อัดดาลานีย์ที่รายงานจากเกาะตาดะฮ์ และกลุ่มหนึ่งรายงานตอนต้นของหะดีษจากอิบนุอับบาส โดยไม่กล่าวถึงส่วนนี้", "นักวิชาการเกือบเป็นเอกฉันท์ว่าอ่อน อันนะวะวีย์กล่าวว่า \"เป็นหะดีษอ่อนตามความเห็นพ้องของนักวิชาการหะดีษ\" ในบรรดาผู้ระบุว่าอ่อนจากรุ่นก่อน ได้แก่ อะห์มัด อัลบุคอรีย์ อบูดาวูด และอิบรอฮีม อัลหัรบีย์ (ว่ามุนกัร) และอิมามุลหะเราะมัยน์ยกมาว่านักวิชาการหะดีษเห็นพ้องว่าอ่อน ผู้แต่งว่า \"เป็นดังที่เขากล่าว ความอ่อนชัดเจน\"", "อบูดาวูดเล่าว่า เขาเล่าหะดีษของยะซีด อัดดาลานีย์ให้อะห์มัดฟัง อะห์มัดตวาดเขาเพราะเห็นเป็นเรื่องใหญ่ แล้วกล่าวว่า \"ยะซีด อัดดาลานีย์มีอะไรถึงจะเข้ามาในหมู่ศิษย์ของเกาะตาดะฮ์\" และไม่ใส่ใจหะดีษนี้"]}, {"wajh": 2, "type": "fiqh", "heading_ar": null, "heading_th": "การนอนตะแคงกับการหลับลึก", "points_th": ["หะดีษบ่งว่าการนอนหลับขณะวางสีข้างลงบนพื้นทำให้วุฎูอ์เสีย และระบุเฉพาะการนอนตะแคงเพราะเป็นกรณีส่วนใหญ่ โดยปกติไม่มีใครหลับลึกนอกจากในท่านอนตะแคง ทั้งนี้หากสมมุติว่าหะดีษถูกต้อง", "แต่ผู้แต่งเห็นว่าหะดีษอ่อนทั้งสายรายงานและเนื้อความ สายรายงานได้กล่าวแล้ว ส่วนเนื้อความ ความหมายใช้ไม่ได้ทั้งทางตรงและทางกลับ ทางตรงบ่งว่าทุกคนที่นอนตะแคงต้องอาบน้ำละหมาด ไม่ว่าจะหลับมากจนไม่รู้สึกตัวเมื่อมีฮะดัษ หรือหลับน้อยจนยังรู้สึกตัว ทางกลับบ่งว่าทุกคนที่หลับในท่าอื่นวุฎูอ์ไม่เสีย ทั้งสองความหมายไม่ถูกต้อง", "ทางตรงไม่ถูก เพราะได้อธิบายแล้วในหะดีษอะนัส (หะดีษแรกของบท) ว่าการนอนหลับไม่ทำให้วุฎูอ์เสีย นอกจากการหลับลึก ส่วนการหลับที่ไม่ลึกไม่ทำให้เสียในทุกท่า ทางกลับก็ไม่ถูก เพราะผู้ที่หลับลึก วุฎูอ์ก็เสีย แม้จะไม่ได้นอนตะแคง"]}], "tags_th": ["การนอนหลับ", "นอนตะแคง", "หลับลึก", "สิ่งที่ทำให้วุฎูอ์เสีย", "มุนกัร"]}, {"id": "v1-h082-085", "volume": 1, "bab": "nawaqid", "topic_ar": "ما جاء في تشكيك الشيطان ابن آدم في طهارته", "topic_th": "ชัยฏอนทำให้มนุษย์สงสัยในความสะอาดของตน", "pages": [352, 355], "hadith": [{"no": 82, "matn_ar": "وَعَنِ ابْنِ عَبَّاسٍ رَضِيَ اللهُ عَنْهُمَا أَنَّ رَسُولَ اللهِ ﷺ قَالَ: «يَأْتِي أَحَدَكُمُ الشَّيْطَانُ فِي صَلَاتِهِ، فَيَنْفُخُ فِي مَقْعَدَتِهِ فَيُخَيَّلُ إِلَيْهِ أَنَّهُ أَحْدَثَ، وَلَمْ يُحْدِثْ، فَإِذَا وَجَدَ ذَلِكَ فَلَا يَنْصَرِفْ حَتَّى يَسْمَعَ صَوْتًا أَوْ يَجِدَ رِيحًا». أَخْرَجَهُ الْبَزَّارُ.", "translation_th": "และจากอิบนุอับบาส (ร.ฎ.) ว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"ชัยฏอนมาหาคนหนึ่งในหมู่พวกท่านขณะละหมาด แล้วเป่าที่ก้นของเขา ทำให้เขาคิดไปว่าตนมีฮะดัษ ทั้งที่ไม่มี เมื่อเขารู้สึกเช่นนั้น ก็อย่าออกจากละหมาด จนกว่าจะได้ยินเสียง หรือได้กลิ่น\" บันทึกโดยอัลบัซซาร", "grade_th": "หะซัน (ตามผู้แต่ง)"}, {"no": 83, "matn_ar": "وَأَصْلُهُ فِي الصَّحِيحَيْنِ مِنْ حَدِيثِ عَبْدِ اللهِ بْنِ زَيْدٍ.", "translation_th": "และต้นเรื่องของหะดีษนี้อยู่ในเศาะฮีห์ทั้งสอง จากหะดีษของอับดุลลอฮ์ บินซัยด์", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}, {"no": 84, "matn_ar": "وَلِمُسْلِمٍ: عَنْ أَبِي هُرَيْرَةَ نَحْوُهُ.", "translation_th": "และของมุสลิม จากอบูฮุร็อยเราะฮ์ ทำนองเดียวกัน", "grade_th": "ศ่อฮีห์ (มุสลิม)"}, {"no": 85, "matn_ar": "وَلِلْحَاكِمِ: عَنْ أَبِي سَعِيدٍ مَرْفُوعًا: «إِذَا جَاءَ أَحَدَكُمُ الشَّيْطَانُ، فَقَالَ: إِنَّكَ أَحْدَثْتَ، فَلْيَقُلْ: كَذَبْتَ»، وَأَخْرَجَهُ ابْنُ حِبَّانَ بِلَفْظِ: «فَلْيَقُلْ فِي نَفْسِهِ».", "translation_th": "และของอัลหากิม จากอบูสะอีด แบบมัรฟูอ์ว่า \"เมื่อชัยฏอนมาหาคนหนึ่งในหมู่พวกท่าน แล้วกล่าวว่า เจ้ามีฮะดัษแล้ว ก็จงตอบว่า เจ้าโกหก\" และอิบนุหิบบานบันทึกด้วยสำนวน \"ก็จงกล่าวในใจของเขา\"", "grade_th": "ผู้แต่งคาดว่าหะซันด้วยหลักฐานสนับสนุน (หะซัน ลิฆ็อยริฮี) ไม่ใช่ด้วยตัวเอง เพราะอิยาฎ บินฮิลาลไม่เป็นที่รู้จัก"}], "key_rulings_th": ["ผู้ที่มีความสะอาดแล้วสงสัยว่าวุฎูอ์เสียหรือไม่ วุฎูอ์ของเขายังคงอยู่ ละหมาดต่อได้ และไม่ต้องอาบน้ำละหมาดใหม่ จนกว่าจะแน่ใจว่ามีฮะดัษ ด้วยการได้ยินเสียงหรือได้กลิ่น", "ชัยฏอนเป็นศัตรูร้ายแรงของมนุษย์ พยายามทำลายอิบาดะฮ์ โดยเฉพาะละหมาด ด้วยความสงสัยและความระแวง ทั้งด้วยการกระทำและคำกระซิบ", "มุสลิมไม่ควรยอมจำนนต่อเสียงกระซิบ (วัสวาส) ไม่ใส่ใจ และไม่ออกจากละหมาดจนกว่าจะแน่ใจว่าความสะอาดเสียแล้ว", "ทางออกจากความระแวงคือการปฏิเสธชัยฏอน ด้วยการกล่าวในใจว่า \"เจ้าโกหก\""], "vocab": [{"ar": "الشَّيْطَانُ", "th": "ชัยฏอน หมายถึงชนิดของชัยฏอน"}, {"ar": "فِي صَلَاتِهِ", "th": "ขณะที่เขาอยู่ในละหมาด"}, {"ar": "فَيَنْفُخُ", "th": "เป่า (อ่านฎ็อมมะฮ์ที่ฟาอ์) คือพ่นลมออกจากปาก"}, {"ar": "مَقْعَدَتِهِ", "th": "ก้น ส่วนล่างของร่างกาย (อ่านฟัตหะฮ์ที่มีม)"}, {"ar": "فَيُخَيَّلُ إِلَيْهِ", "th": "ทำให้เขาคิดไปเองหรือเข้าใจผิดว่าตนมีฮะดัษ"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجها", "heading_th": "ที่มาของหะดีษ", "points_th": ["หะดีษอิบนุอับบาส: อัลบัซซารบันทึก (171 มุคตะศ็อร ซะวาอิดิฮี) ผ่านอิสมาอีล บินเศาะบีห์ จากอบูอุวัยส์ จากเษาร์ บินซัยด์ จากอิกริมะฮ์ จากอิบนุอับบาส แบบมัรฟูอ์ อัลบัซซารกล่าวว่า \"เราไม่รู้จักสำนวนนี้นอกจากทางอิบนุอับบาส แต่ความหมายมีรายงานจากทางอื่น\" ผู้แต่งว่าสายนี้หะซัน อิสมาอีล บินเศาะบีห์ ศอดูก (ซื่อสัตย์) อบูอุวัยส์ ศอดูกแต่มีความเข้าใจผิดบ้าง และอัดดะรอวัรดีย์รายงานสนับสนุนเขาในรายงานของอัลบัยฮะกีย์ (2/254)", "ต้นเรื่องอยู่ในอัลบุคอรีย์ (137) และมุสลิม (361) จากหะดีษอับดุลลอฮ์ บินซัยด์ (ร.ฎ.) ว่า มีผู้ร้องเรียนต่อท่านนบี ﷺ เรื่องชายที่คิดไปว่าพบบางสิ่งขณะละหมาด ท่านตอบว่า \"อย่าออกจากละหมาดจนกว่าจะได้ยินเสียง หรือได้กลิ่น\" และในเศาะฮีห์มุสลิม (362) จากหะดีษอบูฮุร็อยเราะฮ์ (ร.ฎ.) ซึ่งกล่าวแล้วในต้นบทนี้ เป็นหะดีษที่ห้า", "หะดีษอบูสะอีด: อัลหากิมบันทึก (1/134) และอิบนุหิบบาน (6/389) ผ่านยะห์ยา บินอบีกะษีร จากอิยาฎ บินฮิลาล จากอบูสะอีด อัลคุดรีย์ (ร.ฎ.) ตอนต้นของหะดีษคือ \"เมื่อคนหนึ่งในหมู่พวกท่านละหมาดแล้วไม่รู้ว่าละหมาดไปสามหรือสี่ (ร็อกอะฮ์) ก็จงสุญูดสองครั้งขณะนั่ง และเมื่อ (ชัยฏอน) มา...\" และตอนท้ายในรายงานของทั้งสองคือ \"จนกว่าจะได้ยินเสียงด้วยหู หรือได้กลิ่นด้วยจมูก\"", "ผู้รายงานเป็นผู้รายงานที่เชื่อถือได้ของอัลบุคอรีย์และมุสลิม ยกเว้นอิยาฎ บินฮิลาล ซึ่งมีเพียงอิบนุหิบบานที่ว่าเชื่อถือได้ และมีเพียงยะห์ยา บินอบีกะษีรที่รายงานจากเขา อิบนุหะญัรกล่าวใน \"อัตตักรีบ\" ว่าเขาไม่เป็นที่รู้จัก (มัจญ์ฮูล) จากชั้นที่สาม อบูดาวูด (1029) และอัตติรมิซีย์ (396) ก็บันทึกด้วยสายเดียวกัน และอัตติรมิซีย์ว่าหะซัน", "ผู้แต่งคาดว่าเป็นหะซันด้วยหลักฐานสนับสนุน ไม่ใช่ด้วยตัวเอง เพราะอิยาฎ แต่อะฏออ์ บินยะสารรายงานสนับสนุนเขาจากอบูสะอีดในมุสลิม (จะกล่าวในบทสุญูดสะฮ์วี) แต่ในรายงานนั้นไม่มีประโยค \"และเมื่อ (ชัยฏอน) มา...\" ประโยคนี้จึงเป็นสิ่งที่อิยาฎรายงานแต่ผู้เดียว จุดประสงค์ที่อิบนุหะญัรยกสำนวนของอิบนุหิบบาน คือแสดงว่าการกล่าวว่า \"เจ้าโกหก\" ให้กล่าวในใจ ไม่ใช่พูดออกมา"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ชัยฏอน\" หมายถึงชนิดของชัยฏอน \"ในละหมาดของเขา\" คือขณะที่เขาอยู่ในละหมาด", "\"ยันฟุคุ\" (อ่านฎ็อมมะฮ์ที่ฟาอ์ในรูปปัจจุบัน) คือเป่าลมออกจากปาก \"มักอะดะฮ์\" (อ่านฟัตหะฮ์ที่มีม) คือส่วนล่างของร่างกาย", "\"ยุคอยยะลุ อิลัยฮิ\" อาจเป็นรูปกริยาที่ระบุผู้กระทำ โดยผู้กระทำคือชัยฏอน คือชัยฏอนทำให้ผู้ละหมาดคิดไปว่าตนมีฮะดัษ หรืออาจเป็นรูปกริยาที่ไม่ระบุผู้กระทำ โดยประโยค \"ว่าเขามีฮะดัษ\" ทำหน้าที่แทนผู้กระทำ ความหมายคือทำให้เขาเข้าใจหรือคาดไปเช่นนั้น"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "ความสงสัยในวุฎูอ์", "points_th": ["ผู้แต่งเห็นว่าอิบนุหะญัรควรรวมสามหะดีษนี้ไว้กับหะดีษอบูฮุร็อยเราะฮ์ ซึ่งเป็นหะดีษที่ห้าของบท และเขาก็ได้ชี้ถึงหะดีษนั้นในที่นี้ เพราะเรื่องเดียวกัน คือข้อตัดสินเรื่องความสงสัยในความสะอาด แต่หะดีษเหล่านี้มีประโยชน์เพิ่มเติม", "หะดีษอิบนุอับบาสและหะดีษถัดมายืนยันสิ่งที่กล่าวไว้ในหะดีษที่ห้า คือผู้ที่มีความสะอาดแล้วสงสัยว่าวุฎูอ์เสียหรือไม่ วุฎูอ์ของเขายังคงอยู่ ละหมาดด้วยความสะอาดนั้นได้ และไม่ต้องอาบน้ำละหมาด จนกว่าจะแน่ใจว่ามีฮะดัษ ด้วยการได้ยินเสียงหรือได้กลิ่น"]}, {"wajh": 4, "type": "fawaid", "heading_ar": null, "heading_th": "ความเป็นศัตรูของชัยฏอน", "points_th": ["หะดีษแสดงความเป็นศัตรูร้ายแรงของชัยฏอนต่อมนุษย์ ด้วยการทำลายอิบาดะฮ์ของเขา โดยเฉพาะละหมาดและสิ่งที่เกี่ยวข้อง ชัยฏอนทำให้เขาตกอยู่ในความสงสัยและความระแวง จนความสะอาดเสีย และละหมาดเป็นโมฆะ บางครั้งด้วยการกระทำ (เป่าที่ก้นของเขา) บางครั้งด้วยคำพูดที่กระซิบ (เจ้ามีฮะดัษแล้ว)", "อัลลอฮ์ทรงบอกถึงความเป็นศัตรูของชัยฏอนว่า \"แท้จริงชัยฏอนเป็นศัตรูของพวกเจ้า ดังนั้นจงถือมันเป็นศัตรู แท้จริงมันเรียกร้องพรรคพวกของมัน เพื่อให้พวกเขาเป็นชาวไฟนรก\" (ฟาฏิร: 6)"]}, {"wajh": 5, "type": "fawaid", "heading_ar": null, "heading_th": "การรักษาวัสวาส", "points_th": ["หะดีษเหล่านี้แสดงวิธีรักษาวัสวาส มุสลิมไม่ควรยอมจำนนต่อเสียงกระซิบของชัยฏอน และไม่ใส่ใจ ไม่ออกจากละหมาดจนกว่าจะแน่ใจว่าความสะอาดเสียแล้ว", "วัสวาสเป็นโรคร้ายที่รักษายาก เมื่อหนักขึ้นจะไม่ยอมจากเจ้าของ และยากที่จะหลุดพ้น ทำให้เขาลำบากในความสะอาด ละหมาด และทุกสภาพของเขา แต่เมื่อใดที่เขาไม่สนใจและละทิ้งมัน มันก็จะหายไปด้วยอนุมัติของอัลลอฮ์ ท่านนบี ﷺ จึงชี้แนะไม่ให้ยอมจำนนต่อมัน ด้วยคำว่า \"ก็จงตอบว่า เจ้าโกหก\""]}, {"wajh": 6, "type": "fawaid", "heading_ar": null, "heading_th": "ส่วนเพิ่มจากหะดีษอบูฮุร็อยเราะฮ์", "points_th": ["หะดีษเหล่านี้มีส่วนเพิ่มจากหะดีษอบูฮุร็อยเราะฮ์ที่กล่าวไปแล้ว ได้แก่ (1) ระบุชัดว่าความสงสัยเหล่านี้ในเรื่องความสะอาดมาจากชัยฏอน (2) บอกตำแหน่งของความสงสัย คือที่ก้นของมนุษย์ (3) บอกทางออกจากความระแวง คือการปฏิเสธชัยฏอนว่าโกหก"]}], "tags_th": ["ความสงสัย", "วัสวาส", "ชัยฏอน", "ความสะอาด", "สิ่งที่ทำให้วุฎูอ์เสีย"]}, {"id": "v1-h086", "volume": 1, "bab": "qada-hajah", "topic_ar": "كراهة دخول الخلاء بما فيه ذكر الله تعالى", "topic_th": "การเข้าห้องสุขาพร้อมสิ่งที่มีพระนามของอัลลอฮ์เป็นมักรูฮ์", "pages": [358, 361], "hadith": [{"no": 86, "matn_ar": "عَنْ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللهُ عَنْهُ قَالَ: كَانَ رَسُولُ اللهِ ﷺ إِذَا دَخَلَ الْخَلَاءَ وَضَعَ خَاتَمَهُ. أَخْرَجَهُ الْأَرْبَعَةُ، وَهُوَ مَعْلُولٌ.", "translation_th": "จากอะนัส บินมาลิก (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ เมื่อเข้าห้องสุขา ท่านจะถอดแหวนของท่านวางไว้ บันทึกโดยนักบันทึกทั้งสี่ และหะดีษนี้มีข้อบกพร่อง (มะอ์ลูล)", "grade_th": "มะอ์ลูล (มีข้อบกพร่อง) ตามอิบนุหะญัรและนักวิชาการกลุ่มหนึ่ง บางส่วนเห็นว่าหะซันหรือปกป้องหะดีษนี้ ผู้แต่งพิจารณาข้อบัญญัติบนสมมุติว่าหะดีษถูกต้อง"}], "key_rulings_th": ["ทัศนะที่รู้จักกันของนักวิชาการคือ การเข้าห้องสุขาพร้อมสิ่งที่มีพระนามของอัลลอฮ์เป็นมักรูฮ์ และส่งเสริมให้ถอดออก (สมมุติว่าหะดีษถูกต้อง) ไม่ถึงขั้นวาญิบ เพราะเป็นเพียงการกระทำของท่านนบี ﷺ", "ถ้าเป็นส่วนหนึ่งของอัลกุรอานก็หนักกว่า บางคนตัดสินว่าหะรอม เพราะการเข้าห้องสุขาพร้อมสิ่งนั้นเป็นการไม่ให้เกียรติ", "ถ้ากลัวว่าจะถูกขโมย ถูกลมพัด หรือลืม ก็ไม่เป็นมักรูฮ์ ส่วนมุศหัฟ ถ้ากลัวถูกขโมยก็นำเข้าไปได้ แต่ที่ระมัดระวังกว่าคือไม่นำเข้าเลย ให้ฝากผู้อื่นไว้"], "vocab": [{"ar": "الْخَلَاءُ", "th": "ที่ว่างเปล่า ต่อมาใช้เรียกสถานที่ที่สร้างไว้สำหรับถ่ายทุกข์ เรียกอีกอย่างว่า มิรฟัก กะนีฟ มิรหาฎ"}, {"ar": "وَضَعَ خَاتَمَهُ", "th": "ถอดแหวนออกวางไว้"}, {"ar": "مَعْلُولٌ", "th": "มะอ์ลูล คือหะดีษที่มีข้อบกพร่องแอบแฝงที่ทำให้เสียความถูกต้อง"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อบูดาวูดบันทึก (19) หมวดความสะอาด บทแหวนที่มีพระนามของอัลลอฮ์ ถูกนำเข้าห้องสุขา อัตติรมิซีย์ (1746) อันนะสาอีย์ (8/178) และอิบนุมาญะฮ์ (303) ผ่านฮัมมาม จากอิบนุญุร็อยจ์ จากอัซซุฮ์รีย์ จากอะนัส", "นักวิชาการกลุ่มหนึ่ง รวมทั้งอบูดาวูด ระบุข้อบกพร่องสองประการ (1) ขาดผู้รายงานคนกลางระหว่างอิบนุญุร็อยจ์กับอัซซุฮ์รีย์ คืออิบนุญุร็อยจ์ไม่ได้ยินจากอัซซุฮ์รีย์ แต่รายงานผ่านซิยาด บินสะอ์ด (2) เนื้อความถูกสลับเป็นอีกหะดีษหนึ่ง ที่ถูกคือ อิบนุญุร็อยจ์ จากซิยาด บินสะอ์ด จากอัซซุฮ์รีย์ จากอะนัส ว่าท่านนบี ﷺ ทำแหวนเงินแล้วถอดทิ้ง ความผิดพลาดมาจากฮัมมาม บินยะห์ยา อัลบัยฮะกีย์ยกคำของอบูดาวูดและเห็นด้วย อันนะสาอีย์ว่า \"หะดีษนี้ไม่มะห์ฟูซ\" อัดดารุกุฏนีย์ว่าชาซ และอันนะวะวีย์ว่าอ่อน โดยอ้างว่าเป็นทัศนะของนักวิชาการส่วนใหญ่", "อีกกลุ่มหนึ่งว่าไม่มีความผิดพลาด แต่เป็นสองหะดีษต่างกันทั้งสายและเนื้อความ หะดีษของบทนี้อิบนุญุร็อยจ์รายงานจากอัซซุฮ์รีย์โดยตรง อีกหะดีษผ่านคนกลาง การกล่าวว่าฮัมมามเผลอย้ายจากหะดีษหนึ่งไปอีกหะดีษหนึ่งทั้งที่ต่างกันทั้งสายและเนื้อความ ต้องเป็นความเผลอร้ายแรงที่ไม่เหมาะกับฮัมมาม ซึ่งเป็นนักจำที่เชื่อถือได้ อิบนุหิบบานเอียงไปทางนี้ จึงบันทึกทั้งสองหะดีษในเศาะฮีห์ของเขา อัลมุนซิรีย์ยกการที่อัตติรมิซีย์ว่าหะซันมา และผู้เขียน \"อัลมันฮัลอัลอัซบ์\" ก็ปกป้องหะดีษนี้ เชคอิบนุบาซกล่าวว่า \"ทัศนะนี้ใกล้ความจริงและเหมาะสมกว่า เพราะการกล่าวหาว่าผู้เชื่อถือได้ผิดพลาด ต้องมีหลักฐาน\"", "ยะห์ยา บินอัลมุตะวักกิล อัลบัศรีย์ (ศอดูกแต่ผิดพลาด) และยะห์ยา บินอัฎฎุร็อยส์ (ศอดูก) รายงานสนับสนุนฮัมมาม แต่ผู้แต่งตั้งข้อสังเกตว่าทั้งสองไม่ใช่ศิษย์อาวุโสของอิบนุญุร็อยจ์ ประกอบกับคำของนักวิชาการว่าฮัมมามรายงานคนเดียว และอัลบัยฮะกีย์ (นักวิชาการศตวรรษที่ห้า) ยกมาเพียงคนเดียว จึงมีแนวโน้มว่าผิดพลาดในการรายงาน", "ยังมีข้อบกพร่องอีกข้อ คืออิบนุญุร็อยจ์เป็นมุดัลลิสและรายงานด้วยคำว่า \"จาก\" (อันอะนะฮ์) อิบนุญุร็อยจ์เองกล่าวว่า \"ฉันไม่ได้ยินอะไรจากอัซซุฮ์รีย์เลย เขาเพียงให้ส่วนหนึ่ง (ของหะดีษ) แก่ฉัน ฉันจึงคัดลอก และเขาอนุญาตให้ฉัน (รายงาน)\" อัษษะฮะบีย์อธิบายว่าการรายงานแบบนี้มีโอกาสผิดพลาดจากการอ่านตัวเขียน โดยเฉพาะยุคที่ยังไม่มีสระและจุด อิบนุมะอีนจึงกล่าวว่า \"อิบนุญุร็อยจ์ไม่ได้มีน้ำหนักอะไรในการรายงานจากอัซซุฮ์รีย์\""]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"เมื่อเข้าห้องสุขา\" คือตั้งใจจะเข้า \"อัลเคาะลาอ์\" (มีมัด) เดิมหมายถึงที่ว่างเปล่า ต่อมาตามธรรมเนียมใช้เรียกอาคารที่สร้างไว้สำหรับถ่ายทุกข์ เรียกอีกอย่างว่า อัลมิรฟัก อัลกะนีฟ และอัลมิรหาฎ คำว่า \"อัลกะนีฟ\" มีในหะดีษอะนัส (จะกล่าวในหะดีษที่สอง)", "\"ถอดแหวนวางไว้\" ท่านนบี ﷺ ทำเช่นนั้นเพื่อรักษาพระนามของอัลลอฮ์ให้พ้นจากที่สกปรก มีรายงานจากอะนัสว่า \"ลายสลักแหวนของท่านนบี ﷺ มีสามบรรทัด มุหัมมัดหนึ่งบรรทัด เราะสูลหนึ่งบรรทัด และอัลลอฮ์หนึ่งบรรทัด\" (อัลบุคอรีย์ 5878 มุสลิม 2092)", "และจากอะนัสว่า แหวนอยู่ที่มือท่านนบี ﷺ แล้วอยู่ที่มืออบูบักรหลังจากท่าน แล้วที่มืออุมัรหลังจากอบูบักร เมื่ออุษมานนั่งที่ขอบบ่ออะรีส ท่านถอดแหวนออกมาเล่น แล้วแหวนก็ตกลงไป อะนัสกล่าวว่า \"เราไปมาหาสู่กับอุษมานสามวัน สูบน้ำในบ่อออก แต่ก็หาไม่พบ\" (อัลบุคอรีย์ 5879)"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "การนำสิ่งที่มีพระนามของอัลลอฮ์เข้าห้องสุขา", "points_th": ["ผู้ที่ถือว่าการเข้าห้องสุขาพร้อมสิ่งที่มีพระนามของอัลลอฮ์เป็นมักรูฮ์ และส่งเสริมให้ถอดออก ใช้หะดีษนี้เป็นหลักฐาน หะดีษเป็นเพียงการกระทำ จึงไม่บ่งว่าวาญิบ แต่บ่งว่าส่งเสริม ทั้งนี้บนสมมุติว่าหะดีษถูกต้อง", "ทัศนะว่ามักรูฮ์เป็นที่รู้จักกันในหมู่นักวิชาการ รวมทั้งฮัมบะลีย์ และเป็นรายงานหนึ่งจากอะห์มัด แต่อิบนุมุฟลิห์ยกรายงานจากอะห์มัดว่าไม่มักรูฮ์ อิบนุเราะญับกล่าวถึงรายงานนี้ และว่าเป็นทัศนะของสะลัฟจำนวนมาก อิบนุมุฟลิห์ว่า \"ฉันไม่พบหลักฐานว่ามักรูฮ์นอกจากนี้ ซึ่งยังต้องการหลักฐาน และหลักเดิมคือไม่มักรูฮ์\" ในหนังสือ \"อันนุกัต อะลัลมุหัรร็อร\" ยกทัศนะของฮัมบะลีย์บางคนว่าการถอดออกประเสริฐกว่า และว่า \"นี่เป็นทัศนะที่สาม และอาจใกล้ความจริงกว่า\" ตามทัศนะนี้ การละสิ่งที่ประเสริฐกว่าไม่ได้หมายความว่าตกในสิ่งที่มักรูฮ์", "ถ้าเป็นส่วนหนึ่งของอัลกุรอานก็หนักกว่า บางคนตัดสินว่าหะรอม เพราะความศักดิ์สิทธิ์ของพระดำรัสของอัลลอฮ์ ดังอายะฮ์ \"แท้จริงมันคืออัลกุรอานอันทรงเกียรติ\" (อัลวากิอะฮ์: 77) และ \"กอฟ ขอสาบานด้วยอัลกุรอานอันทรงเกียรติ\" (กอฟ: 1) การนำเข้าห้องสุขาเป็นการไม่ให้เกียรติประเภทหนึ่ง", "ทั้งนี้ถ้าทำได้ ถ้ากลัวว่าสิ่งที่ติดตัวจะถูกขโมย ถูกลมพัด หรือลืม ก็ไม่เป็นมักรูฮ์ เพราะบางคนขี้ลืม วางไว้ที่หนึ่งแล้วลืม มุศหัฟก็เช่นกัน ถ้ากลัวถูกขโมยก็นำเข้าไปได้ แต่ที่ระมัดระวังกว่าคือไม่นำเข้าเลย ให้ฝากผู้ที่จะเก็บรักษาไว้จนกว่าจะออกมา"]}], "tags_th": ["ห้องสุขา", "แหวน", "พระนามของอัลลอฮ์", "มุศหัฟ", "มะอ์ลูล", "ตัดลีส"]}, {"id": "v1-h087", "volume": 1, "bab": "qada-hajah", "topic_ar": "ما يقال عند دخول الخلاء", "topic_th": "สิ่งที่กล่าวเมื่อเข้าห้องสุขา", "pages": [362, 364], "hadith": [{"no": 87, "matn_ar": "وَعَنْهُ قَالَ: كَانَ رَسُولُ اللهِ ﷺ إِذَا دَخَلَ الْخَلَاءَ قَالَ: «اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ». أَخْرَجَهُ السَّبْعَةُ.", "translation_th": "และจากเขา (อะนัส (ร.ฎ.)) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ เมื่อเข้าห้องสุขา ท่านกล่าวว่า \"โอ้อัลลอฮ์ ข้าพระองค์ขอความคุ้มครองต่อพระองค์จากชัยฏอนเพศผู้และชัยฏอนเพศเมีย\" บันทึกโดยนักบันทึกทั้งเจ็ด", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["ส่งเสริมให้กล่าวดุอาอ์นี้เมื่อจะเข้าที่ถ่ายทุกข์ โดยกล่าวก่อนเข้า ไม่ใช่หลังเข้าไปแล้ว ถ้าอยู่กลางที่โล่งให้กล่าวเมื่อเริ่มถลกเสื้อผ้า", "การขอความคุ้มครองนี้ไม่ต่างกันระหว่างในอาคารกับที่โล่ง เพราะสถานที่นั้นกลายเป็นที่อยู่ของชัยฏอนเมื่อมีสิ่งขับถ่ายออกมา", "การกล่าว \"บิสมิลลาฮ์\" ก่อนดุอาอ์นี้มีในหลายหะดีษ แต่ล้วนมีข้อบกพร่อง หะดีษอะนัสในเศาะฮีห์ทั้งสองและสุนันไม่มีบัสมะละฮ์", "สถานที่สกปรก เช่น ห้องอาบน้ำ ห้องสุขา และที่ทิ้งขยะ เป็นที่อยู่ของชัยฏอน และสิ่งถูกสร้างทั้งหมดต้องพึ่งอัลลอฮ์ในการปัดป้องสิ่งที่ทำร้ายพวกเขา"], "vocab": [{"ar": "إِذَا دَخَلَ", "th": "เมื่อต้องการจะเข้า"}, {"ar": "اللَّهُمَّ", "th": "โอ้อัลลอฮ์ ตัดคำเรียก (ยา) ออก แล้วเติมมีมไว้ท้ายแทน"}, {"ar": "أَعُوذُ بِكَ", "th": "ข้าพระองค์ขอความคุ้มครองต่อพระองค์ รูปประโยคบอกเล่าแต่ความหมายเป็นการขอ"}, {"ar": "الْخُبُثُ", "th": "พหูพจน์ของ เคาะบีษ คือชัยฏอนเพศผู้ หรือ (ถ้าอ่านว่า อัลคุบษ์) ความชั่ว"}, {"ar": "الْخَبَائِثُ", "th": "พหูพจน์ของ เคาะบีษะฮ์ คือชัยฏอนเพศเมีย หรือสิ่งที่ชั่วร้าย"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกในหมวดวุฎูอ์ บทสิ่งที่กล่าวเมื่อเข้าห้องสุขา (142) มุสลิม (375) อบูดาวูด (4) อัตติรมิซีย์ (5) อันนะสาอีย์ (1/20) อิบนุมาญะฮ์ (296) และอะห์มัด (19/13) ทั้งหมดผ่านอับดุลอะซีซ บินศุฮัยบ์ ว่า \"ฉันได้ยินอะนัสกล่าวว่า...\""]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"เมื่อเข้า\" คือเมื่อต้องการจะเข้า ในกรณีที่เป็นสถานที่สร้างไว้สำหรับถ่ายทุกข์ เช่นในบ้านปัจจุบัน ถ้าอยู่ในที่โล่ง ให้กล่าวเมื่อเริ่มถลกเสื้อผ้า อัลบุคอรีย์ยกแบบตะอ์ลีกจากสะอีด บินซัยด์ว่า \"เมื่อต้องการจะเข้า\" และอิบนุหะญัรระบุว่าอัลบุคอรีย์รายงานแบบมีสายใน \"อัลอะดับ อัลมุฟร็อด\" ด้วยสำนวน \"ท่านนบี ﷺ เมื่อต้องการจะเข้าห้องสุขา...\" แสดงว่ากล่าวดุอาอ์นี้ก่อนเข้า ไม่ใช่หลังเข้า", "\"อัลลอฮุมมะ\" คือ \"ยาอัลลอฮ์\" ตัดคำเรียกออกแล้วเติมมีมแทน เพื่อเริ่มด้วยพระนามของอัลลอฮ์ และเพราะใช้บ่อย \"อะอูซุบิกะ\" คือข้าพระองค์ขอความคุ้มครองต่อพระองค์ รูปประโยคบอกเล่าแต่ความหมายเป็นการขอ เหมือนกล่าวว่า \"โอ้อัลลอฮ์ โปรดคุ้มครองข้าพระองค์\"", "\"อัลคุบุษ\" (ฎ็อมมะฮ์ที่คอและบาอ์) พหูพจน์ของ \"เคาะบีษ\" คือชัยฏอนเพศผู้ และ \"อัลเคาะบาอิษ\" พหูพจน์ของ \"เคาะบีษะฮ์\" คือชัยฏอนเพศเมีย เหมือนขอความคุ้มครองจากชัยฏอนทั้งเพศผู้และเพศเมีย บางทัศนะว่า \"อัลคุบษ์\" (บาอ์สุกูน) คือความชั่ว และ \"อัลเคาะบาอิษ\" คือสิ่งที่ชั่วร้าย เหมือนขอความคุ้มครองจากความชั่วและผู้ที่ชั่ว", "อัลเคาะฏฏอบีย์ว่าที่ถูกคือฎ็อมมะฮ์ที่บาอ์ และนักหะดีษทั่วไปอ่านสุกูนซึ่งผิด ผู้แต่งเห็นว่าที่ถูกคืออ่านได้ทั้งสองแบบ เพราะการอ่านสุกูนเพื่อให้เบาเป็นที่อนุญาตตามหลักภาษา เช่น รุสุล/รุสล์ กุตุบ/กุตบ์ อันนะวะวีย์ยกจากนักวิชาการกลุ่มหนึ่ง รวมทั้งอบูอุบัยด์ อัลกอสิม บินสัลลาม ว่าอ่านสุกูน และอัลกุรฏุบีย์ว่า \"เราได้รับรายงานเช่นนั้นด้วย\""]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "ดุอาอ์เมื่อเข้าห้องสุขาและบัสมะละฮ์", "points_th": ["หะดีษเป็นหลักฐานว่าส่งเสริมให้กล่าวดุอาอ์นี้เมื่อเข้าสถานที่สำหรับถ่ายทุกข์ เหตุผลของดุอาอ์นี้ปรากฏในหะดีษซัยด์ บินอัรก็อม (ร.ฎ.) ว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"ที่ถ่ายทุกข์เหล่านี้มีชัยฏอนมาชุมนุม ดังนั้นเมื่อคนหนึ่งในหมู่พวกท่านไปห้องสุขา ก็จงกล่าวว่า ฉันขอความคุ้มครองต่ออัลลอฮ์จากชัยฏอนเพศผู้และเพศเมีย\" (อบูดาวูด 6 อิบนุมาญะฮ์ 296 อะห์มัด เป็นหะดีษศ่อฮีห์ตามเงื่อนไขของอัลบุคอรีย์ ตามที่อัลอัลบานีย์ระบุ)", "ไม่ต่างกันระหว่างในอาคารกับที่โล่ง เพราะสถานที่นั้นกลายเป็นที่อยู่ของชัยฏอนเมื่อมีสิ่งขับถ่ายออกมาและก่อนจะจากไป", "มีส่วนเพิ่มการกล่าวบิสมิลลาฮ์ผ่านอับดุลอะซีซ บินอัลมุคตาร จากอับดุลอะซีซ บินศุฮัยบ์ ในรูปคำสั่งว่า \"เมื่อพวกท่านเข้าห้องสุขา จงกล่าวว่า บิสมิลลาฮ์ อะอูซุบิลลาฮิ มินัลคุบุษิ วัลเคาะบาอิษ\" อิบนุลมุลักกินระบุว่ามาจากสะอีด บินมันศูร อบูหาติม และอิบนุสสะกัน อิบนุหะญัรว่า \"สายรายงานตามเงื่อนไขของมุสลิม\" และในอิบนุอบีชัยบะฮ์ผ่านอบูมะอ์ชัร (อิบนุหะญัรว่า อ่อน แก่แล้วความจำสับสน) แต่อัลอัลบานีย์ตัดสินว่าส่วนเพิ่มบิสมิลลาฮ์เป็นชาซ เพราะขัดกับทุกสายของหะดีษจากอับดุลอะซีซ บินศุฮัยบ์", "และมีรายงานจากอะลี (ร.ฎ.) ว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"สิ่งปิดกั้นระหว่างสายตาของญินกับเอาเราะฮ์ของลูกหลานอาดัม เมื่อคนหนึ่งในหมู่พวกเขาเข้าห้องสุขา คือการกล่าวว่า บิสมิลลาฮ์\" (อัตติรมิซีย์ 606 ซึ่งว่าเฆาะรีบ สายรายงานไม่แข็งแรง)", "ผู้แต่งสรุปว่า การกล่าวบิสมิลลาฮ์มีในหลายหะดีษ แต่ล้วนมีข้อบกพร่อง และเพียงพอแล้วที่หะดีษอะนัสในเศาะฮีห์ทั้งสองและสุนันไม่มีบัสมะละฮ์ ส่วนสิ่งที่กล่าวเมื่อออกจากห้องสุขาจะมาในหะดีษอาอิชะฮ์ ผู้แต่งเห็นว่าถ้าอิบนุหะญัรยกมาไว้ที่นี่จะเหมาะกว่า"]}, {"wajh": 4, "type": "fawaid", "heading_ar": null, "heading_th": "สถานที่สกปรกเป็นที่อยู่ของชัยฏอน", "points_th": ["หะดีษบ่งว่าสถานที่สกปรก เช่น ห้องอาบน้ำ ห้องสุขา และที่ทิ้งขยะ เป็นที่อยู่ของชัยฏอน จึงให้ขอความคุ้มครองต่ออัลลอฮ์จากชัยฏอนทั้งเพศผู้และเพศเมีย หรือจากความชั่วทั้งหมดและผู้ที่ชั่ว และบ่งว่าสิ่งถูกสร้างทั้งหมดต้องพึ่งอัลลอฮ์ในการปัดป้องสิ่งที่ทำร้ายหรือเป็นอันตรายแก่พวกเขา"]}], "tags_th": ["ดุอาอ์", "ห้องสุขา", "ชัยฏอน", "บัสมะละฮ์", "การขอความคุ้มครอง"]}, {"id": "v1-h088", "volume": 1, "bab": "qada-hajah", "topic_ar": "حكم الاستنجاء بالماء من البول أو الغائط", "topic_th": "ข้อตัดสินการชำระด้วยน้ำหลังปัสสาวะหรืออุจจาระ (อิสตินญาอ์)", "pages": [365, 367], "hadith": [{"no": 88, "matn_ar": "وَعَنْهُ قَالَ: كَانَ رَسُولُ اللهِ ﷺ يَدْخُلُ الْخَلَاءَ، فَأَحْمِلُ أَنَا وَغُلَامٌ نَحْوِي إِدَاوَةً مِنْ مَاءٍ وَعَنَزَةً، فَيَسْتَنْجِي بِالْمَاءِ. مُتَّفَقٌ عَلَيْهِ.", "translation_th": "และจากเขา (อะนัส (ร.ฎ.)) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ เข้าไปยังที่ถ่ายทุกข์ ฉันกับเด็กหนุ่มคนหนึ่งรุ่นราวคราวเดียวกับฉันจะถือภาชนะหนังใส่น้ำและหอกสั้นไปด้วย แล้วท่านก็ชำระด้วยน้ำ บันทึกโดยอัลบุคอรีย์และมุสลิม", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["อนุญาตให้ชำระด้วยน้ำเพียงอย่างเดียว แม้จะไม่ได้ใช้ก้อนหินหรือสิ่งอื่นก่อน", "ผู้แต่งเห็นว่าทัศนะที่ถือว่าการชำระด้วยน้ำเป็นมักรูฮ์อ่อน เพราะขัดกับหะดีษศ่อฮีห์นี้ น้ำทำความสะอาดได้หมดจด และการสัมผัสนะญิสเพื่อขจัดออกไม่มีข้อห้าม", "มุสลิมควรเตรียมน้ำสำหรับชำระไว้เมื่อจะถ่ายทุกข์ เพื่อไม่ต้องลุกขึ้นไปหา และไม่เปื้อนนะญิส"], "vocab": [{"ar": "الْخَلَاءُ", "th": "ในที่นี้คือที่ว่างกลางแจ้งที่ท่านไปถ่ายทุกข์"}, {"ar": "غُلَامٌ", "th": "เด็กชาย ตั้งแต่หย่านมจนถึงราวเจ็ดขวบ หรือจนถึงวัยมีเครา"}, {"ar": "نَحْوِي", "th": "รุ่นราวคราวเดียวกับฉัน (มีในรายงานของมุสลิม)"}, {"ar": "إِدَاوَةٌ", "th": "ภาชนะเล็กทำจากหนัง"}, {"ar": "عَنَزَةٌ", "th": "หอกสั้น"}, {"ar": "يَسْتَنْجِي", "th": "ชำระสองทวารจากร่องรอยปัสสาวะและอุจจาระ"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกในหมวดวุฎูอ์ บทการชำระด้วยน้ำ (150) และมุสลิม (271) (70) ผ่านชุอ์บะฮ์ จากอบูมุอาซ (ชื่ออะฏออ์ บินอบีมัยสะเราะฮ์ ตามที่พิมพ์ในหนังสือ) ว่า \"ฉันได้ยินอะนัส บินมาลิก (ร.ฎ.) กล่าวว่า...\" สำนวนนี้เป็นของมุสลิม"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"เข้าไปยังที่ถ่ายทุกข์\" ในที่นี้คือที่ว่างกลางแจ้งที่ท่านไปถ่ายทุกข์ เพราะอีกรายงานหนึ่งว่า \"เมื่อท่านออกไปเพื่อธุระ\" และเพราะมีการถือหอกสั้นไปพร้อมน้ำ และเพราะห้องสุขาในบ้าน การรับใช้ในนั้นเป็นของคนในบ้าน", "\"เฆาะลาม\" คือเด็กชาย อิบนุสีดะฮ์ว่า \"ตั้งแต่หย่านมจนถึงเจ็ดขวบ\" อิบนุหะญัรยกจากอัซซะมัคชะรีย์ว่าเฆาะลามคือเด็กจนถึงวัยมีเครา ถ้าเรียกหลังจากนั้นถือเป็นการใช้โดยอนุโลม", "\"นะห์วีย์\" มีในรายงานของมุสลิม ไม่มีในอัลบุคอรีย์ คือรุ่นราวคราวเดียวกับฉัน บางรายงานว่า \"ฉันกับเด็กหนุ่มชาวอันศอรคนหนึ่งออกไป\" และในอัลบุคอรีย์ว่า \"ฉันกับเด็กหนุ่มในหมู่เราตามไป\" นักวิชาการบางคนว่าเด็กหนุ่มคืออับดุลลอฮ์ บินมัสอูด ผู้แต่งเห็นว่าไม่มีน้ำหนัก เพราะอิบนุมัสอูดเป็นมุฮาญิรรุ่นแรก เสียชีวิต ฮ.ศ. 32 อายุราวหกสิบปี จึงอายุมากแล้วตอนท่านนบี ﷺ เสียชีวิต ขณะที่อะนัสอายุสิบกว่าปี ในรายงานของมุสลิมอะนัสยังกล่าวว่า \"เขาเด็กที่สุดในหมู่เรา\" และคำว่า \"ชาวอันศอร\" ก็ทำให้ห่างไกลจากการเป็นอิบนุมัสอูด แต่ลักษณะการเรียงบทของอัลบุคอรีย์บ่งว่าเป็นอิบนุมัสอูด", "\"อิดาวะฮ์\" (กัสเราะฮ์ที่ฮัมซะฮ์) คือภาชนะเล็กทำจากหนัง \"อะนะซะฮ์\" (ฟัตหะฮ์ที่อัยน์และนูน) คือหอกสั้น อัลเคาะวาริซมีย์ว่า อันนะญาชีย์มอบให้ท่านนบี ﷺ ใช้ปักไว้ด้านหน้าเมื่อท่านออกไปละหมาดกลางแจ้ง และคอลีฟะฮ์สืบทอดกันต่อมา จุดประสงค์ของการถือไปคือ เมื่อท่านชำระแล้วจะอาบน้ำละหมาด และเมื่ออาบน้ำละหมาดแล้วจะละหมาด อิบนุหะญัรว่านี่เป็นคำอธิบายที่แข็งแรงที่สุด อัลบุคอรีย์ตั้งบทหะดีษอะนัสในหมวดละหมาดว่า \"บทการละหมาดหันไปทางหอกสั้น\"", "\"ยัสตันญี บิลมาอ์\" คือชำระด้วยน้ำในภาชนะหนัง จากร่องรอยปัสสาวะและอุจจาระที่ติดสองทวาร"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "การชำระด้วยน้ำเพียงอย่างเดียว", "points_th": ["หะดีษเป็นหลักฐานว่าอนุญาตให้ชำระด้วยน้ำเพียงอย่างเดียว แม้จะไม่ได้ใช้ก้อนหินหรือสิ่งอื่นก่อน", "นักวิชาการบางคนถือว่ามักรูฮ์ โดยให้เหตุผลว่าเป็นการเอามือสัมผัสนะญิส อิบนุหะญัรกล่าวถึงชื่อบทของอัลบุคอรีย์ \"บทการชำระด้วยน้ำ\" ว่า \"เขาต้องการตอบโต้ผู้ที่ถือว่ามักรูฮ์ และผู้ที่ปฏิเสธว่าท่านนบี ﷺ เคยทำ\" ในบรรดาผู้ที่ถือว่ามักรูฮ์ได้แก่ หุซัยฟะฮ์ อิบนุอุมัร และอิบนุซซุบัยร์ (ร.ฎ.) และอิบนุตตีนยกจากมาลิกว่าเขาปฏิเสธว่าท่านนบี ﷺ ชำระด้วยน้ำ", "ผู้แต่งเห็นว่าทัศนะนี้อ่อน และเหตุผลไม่ถูกต้อง เพราะ (1) ขัดกับหะดีษศ่อฮีห์นี้ (2) น้ำทำความสะอาดได้หมดจด (3) การสัมผัสนะญิสเพื่อขจัดออกไม่มีข้อห้าม จะกล่าวเพิ่มเติมที่หะดีษสุดท้ายของบทนี้"]}, {"wajh": 4, "type": "fawaid", "heading_ar": null, "heading_th": "เตรียมน้ำไว้ก่อนถ่ายทุกข์", "points_th": ["หะดีษบ่งว่ามุสลิมควรเตรียมน้ำสำหรับชำระไว้เมื่อจะถ่ายทุกข์ เพื่อไม่ต้องลุกขึ้นไปหาเพราะไม่ได้เตรียมไว้ และไม่เปื้อนนะญิส"]}, {"wajh": 5, "type": "fawaid", "heading_ar": null, "heading_th": "ความประเสริฐของอะนัส", "points_th": ["หะดีษแสดงความประเสริฐของอะนัส (ร.ฎ.) ที่ได้รับเกียรติรับใช้ท่านนบี ﷺ โดยเฉพาะเรื่องที่เกี่ยวกับความสะอาด อัลบุคอรีย์ตั้งชื่อบทหนึ่งของหะดีษนี้ว่า \"บทผู้ที่มีคนถือน้ำไปให้เพื่อชำระ\""]}], "tags_th": ["อิสตินญาอ์", "ชำระด้วยน้ำ", "ห้องสุขา", "อะนัส", "นะญิส"]}, {"id": "v1-h089", "volume": 1, "bab": "qada-hajah", "topic_ar": "استحباب البعد والاستتار عند قضاء الحاجة", "topic_th": "ส่งเสริมให้ไปให้ไกลและปกปิดตัวเมื่อถ่ายทุกข์", "pages": [368, 368], "hadith": [{"no": 89, "matn_ar": "عَنِ الْمُغِيرَةِ بْنِ شُعْبَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ لِيَ النَّبِيُّ ﷺ: «خُذِ الْإِدَاوَةَ». فَانْطَلَقَ حَتَّى تَوَارَى عَنِّي، فَقَضَى حَاجَتَهُ. مُتَّفَقٌ عَلَيْهِ.", "translation_th": "จากอัลมุฆีเราะฮ์ บินชุอ์บะฮ์ (ร.ฎ.) กล่าวว่า ท่านนบี ﷺ กล่าวแก่ฉันว่า \"จงถือภาชนะน้ำไว้\" แล้วท่านก็เดินไปจนลับสายตาฉัน แล้วถ่ายทุกข์ บันทึกโดยอัลบุคอรีย์และมุสลิม", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["ส่งเสริมให้ไปให้ไกลและหลบจากผู้คนเมื่อจะถ่ายทุกข์ เพื่อไม่ให้ใครเห็นเอาเราะฮ์ ได้ยินเสียง หรือได้กลิ่น", "ทั้งนี้เมื่ออยู่กลางที่โล่ง ส่วนในอาคาร จุดประสงค์บรรลุแล้วด้วยห้องที่สร้างไว้สำหรับถ่ายทุกข์"], "vocab": [{"ar": "الْإِدَاوَةُ", "th": "ภาชนะเล็กทำจากหนังใส่น้ำ"}, {"ar": "تَوَارَى عَنِّي", "th": "หลบลับสายตาฉัน ด้วยต้นไม้ เนินดิน ระยะทาง หรือสิ่งอื่น"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกไว้หลายแห่งในเศาะฮีห์ สำนวนที่ยกมาเป็นส่วนหนึ่งของหะดีษที่บันทึกในหมวดละหมาด บทการละหมาดในเสื้อคลุมแบบชาม (363) และมุสลิม (274) (77) ผ่านอัลอะอ์มัช จากมุสลิม บินศุบัยห์ จากมัสรูก จากอัลมุฆีเราะฮ์ บินชุอ์บะฮ์ (ร.ฎ.)"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"จนลับสายตาฉัน\" คือหลบจากฉัน ด้วยต้นไม้ เนินดิน การไปให้ไกล หรือสิ่งอื่นทำนองนั้น"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "การไปให้ไกลและปกปิดตัว", "points_th": ["หะดีษเป็นหลักฐานว่าส่งเสริมให้ไปให้ไกลและหลบจากผู้คนเมื่อต้องการถ่ายทุกข์ เพื่อไม่ให้ใครเห็นเอาเราะฮ์ ได้ยินเสียง หรือได้กลิ่น ทั้งนี้เมื่ออยู่กลางที่โล่ง ถ้าอยู่ในอาคาร จุดประสงค์บรรลุแล้วด้วยห้องที่สร้างไว้สำหรับถ่ายทุกข์"]}], "tags_th": ["มารยาทการถ่ายทุกข์", "ปกปิดเอาเราะฮ์", "อัลมุฆีเราะฮ์"]}, {"id": "v1-h090-093", "volume": 1, "bab": "qada-hajah", "topic_ar": "بيان بعض الأماكن التي يُنهى عن التخلي فيها", "topic_th": "สถานที่บางแห่งที่ห้ามถ่ายทุกข์", "pages": [369, 373], "hadith": [{"no": 90, "matn_ar": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «اتَّقُوا اللَّاعِنَيْنِ: الَّذِي يَتَخَلَّى فِي طَرِيقِ النَّاسِ، أَوْ فِي ظِلِّهِمْ». رَوَاهُ مُسْلِمٌ.", "translation_th": "จากอบูฮุร็อยเราะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"พวกท่านจงระวังสองสิ่งที่นำมาซึ่งการสาปแช่ง คือผู้ที่ถ่ายทุกข์บนทางเดินของผู้คน หรือในที่ร่มของพวกเขา\" รายงานโดยมุสลิม", "grade_th": "ศ่อฮีห์ (มุสลิม)"}, {"no": 91, "matn_ar": "زَادَ أَبُو دَاوُدَ، عَنْ مُعَاذٍ: «وَالْمَوَارِدِ».", "translation_th": "อบูดาวูดเพิ่มเติมจากมุอาซว่า \"และแหล่งน้ำ\"", "grade_th": "ฎออีฟ (อ่อน) ในส่วนเพิ่ม \"แหล่งน้ำ\" ส่วนที่เหลือศ่อฮีห์ตามหะดีษอบูฮุร็อยเราะฮ์"}, {"no": 92, "matn_ar": "وَلِأَحْمَدَ عَنِ ابْنِ عَبَّاسٍ: «أَوْ نَقْعِ مَاءٍ». وَفِيهِمَا ضَعْفٌ.", "translation_th": "และของอะห์มัดจากอิบนุอับบาสว่า \"หรือที่น้ำขัง\" และทั้งสองรายงานมีความอ่อน", "grade_th": "ฎออีฟ (อ่อน) ในส่วนเพิ่ม \"ที่น้ำขัง\" ส่วนที่เหลือศ่อฮีห์ตามหะดีษอบูฮุร็อยเราะฮ์"}, {"no": 93, "matn_ar": "وَأَخْرَجَ الطَّبَرَانِيُّ النَّهْيَ عَنْ تَحْتِ الْأَشْجَارِ الْمُثْمِرَةِ، وَضَفَّةِ النَّهْرِ الْجَارِي مِنْ حَدِيثِ ابْنِ عُمَرَ بِسَنَدٍ ضَعِيفٍ.", "translation_th": "และอัฏเฏาะบะรอนีย์บันทึกการห้าม (ถ่ายทุกข์) ใต้ต้นไม้ที่ออกผล และริมแม่น้ำที่ไหล จากหะดีษของอิบนุอุมัร ด้วยสายรายงานที่อ่อน", "grade_th": "ฎออีฟ (อ่อน)"}], "key_rulings_th": ["ห้ามถ่ายทุกข์ในสถานที่ที่ทำให้ผู้คนเดือดร้อน ด้วยความสกปรก กลิ่นเหม็น และการแพร่โรค ซึ่งขัดกับคำสอนของอิสลามที่เรียกร้องความสะอาด", "สถานที่ที่ห้ามจากหะดีษเหล่านี้มีหก คือ ทางเดินของผู้คน ที่ร่มที่ผู้คนใช้ประโยชน์ แหล่งน้ำ ที่น้ำขัง ใต้ต้นไม้ที่ออกผล และริมแม่น้ำ", "หะดีษมุอาซ อิบนุอับบาส และอิบนุอุมัรอ่อนทั้งหมด แต่มีหะดีษอบูฮุร็อยเราะฮ์ในมุสลิมสนับสนุนความหมาย และหลักศาสนาที่ว่า ทุกสิ่งที่ทำร้ายมุสลิมเป็นหะรอม", "ทางเดินที่ร้างคนและที่ร่มที่ไม่มีใครใช้ ถ่ายทุกข์ได้เมื่อจำเป็น และต้นไม้ที่ผลไม่ใช่อาหารและไม่มีใครเก็บก็ถ่ายใต้ต้นได้ ถ้าไม่ใช่ที่ร่มที่ผู้คนใช้"], "vocab": [{"ar": "اللَّاعِنَيْنِ", "th": "สองสิ่งที่นำมาซึ่งการสาปแช่ง เพราะผู้ทำมักถูกผู้คนสาปแช่งและด่าทอ (สำนวนของมุสลิมคือ อัลลาอานัยน์ รูปเน้นย้ำ)"}, {"ar": "يَتَخَلَّى", "th": "ถ่ายทุกข์ (ถ่ายอุจจาระ)"}, {"ar": "ظِلِّهِمْ", "th": "ที่ร่มที่ผู้คนใช้เป็นที่พักผ่อนหรือที่นั่ง"}, {"ar": "الْمَوَارِدُ", "th": "พหูพจน์ของ เมาริด คือแหล่งที่ผู้คนไปตักน้ำ เช่น ตาน้ำหรือบ่อ"}, {"ar": "الْبَرَازُ", "th": "เดิมคือที่โล่งกว้าง ใช้เป็นคำเลี่ยงหมายถึงอุจจาระ"}, {"ar": "نَقْعُ مَاءٍ", "th": "ที่น้ำขัง แหล่งรวมน้ำ"}, {"ar": "ضَفَّةُ النَّهْرِ", "th": "ริมแม่น้ำ (อ่านฟัตหะฮ์หรือกัสเราะฮ์ที่ฎอด)"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["คือมุอาซ บินญะบัล บินอัมรฺ บินเอาส์ อัลอันศอรีย์ อัลค็อซเราะญีย์ (ร.ฎ.) เข้าร่วมสัตยาบันอัลอะเกาะบะฮ์ครั้งที่สอง สงครามบัดร์ และสงครามหลังจากนั้น ช่วงท้ายชีวิตของท่านนบี ﷺ ท่านส่งเขาไปเยเมนเป็นผู้เผยแผ่ ผู้สอน และผู้พิพากษา ท่านส่งเขาและขอดุอาอ์ให้ว่า \"ขออัลลอฮ์คุ้มครองท่านจากด้านหน้า ด้านหลัง ด้านขวา ด้านซ้าย ด้านบน และด้านล่าง และปัดป้องความชั่วของญินและมนุษย์จากท่าน\"", "เขากลับมาในสมัยคิลาฟะฮ์ของอบูบักร (ร.ฎ.) อุมัร (ร.ฎ.) แต่งตั้งเขาปกครองชามต่อจากอบูอุบัยดะฮ์ (ร.ฎ.) แล้วเขาเสียชีวิตในปีเดียวกันจากโรคระบาดอัมวาส ปี ฮ.ศ. 18 อายุ 34 ปี"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجها", "heading_th": "ที่มาของหะดีษ", "points_th": ["หะดีษอบูฮุร็อยเราะฮ์: มุสลิมบันทึกในหมวดความสะอาด บทห้ามถ่ายทุกข์บนทางเดินและในที่ร่ม (269) และอบูดาวูด (25) ผ่านอิสมาอีล บินญะอ์ฟัร จากอัลอะลาอ์ จากบิดา จากอบูฮุร็อยเราะฮ์ แบบมัรฟูอ์ สำนวน \"อัลลาอินัยน์\" ใน \"อัลบุลูฆ\" เป็นสำนวนของอบูดาวูด ส่วนสำนวนของมุสลิมคือ \"อัลลาอานัยน์\" รูปเน้นย้ำ", "หะดีษมุอาซ: อบูดาวูดบันทึก (26) ผ่านอบูสะอีด อัลหิมยะรีย์ จากมุอาซ บินญะบัล ว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"พวกท่านจงระวังสามสิ่งที่นำมาซึ่งการสาปแช่ง คือการถ่ายอุจจาระที่แหล่งน้ำ กลางทาง และในที่ร่ม\" สายนี้อ่อนดังที่อิบนุหะญัรกล่าว เพราะอบูสะอีด อัลหิมยะรีย์ไม่ได้ยินจากมุอาซ อิบนุหะญัรว่าเขา \"เป็นชาวชาม ไม่เป็นที่รู้จัก จากชั้นที่สาม และรายงานจากมุอาซแบบมุรสัล\" และอิบนุลก็อฏฏอนว่าหะดีษนี้ไม่รู้จักจากสายอื่น ผู้แต่งสรุปว่าหะดีษอ่อนในส่วนเพิ่ม \"แหล่งน้ำ\" ส่วนที่เหลือศ่อฮีห์ตามหะดีษอบูฮุร็อยเราะฮ์", "หะดีษอิบนุอับบาส: อะห์มัดบันทึก (4/448) ผ่านอับดุลลอฮ์ บินอัลมุบาร็อก จากอิบนุละฮีอะฮ์ จากอิบนุฮุบัยเราะฮ์ จากผู้ที่ได้ยินอิบนุอับบาส ว่า \"ฉันได้ยินท่านรสูลุลลอฮ์ ﷺ กล่าวว่า จงระวังสามสิ่งที่นำมาซึ่งการสาปแช่ง มีผู้ถามว่า โอ้ท่านรสูลุลลอฮ์ อะไรคือสามสิ่งนั้น ท่านตอบว่า การที่คนหนึ่งนั่ง (ถ่ายทุกข์) ในที่ร่มที่ผู้คนอาศัยร่ม หรือบนทางเดิน หรือที่น้ำขัง\" สายนี้อ่อน เพราะไม่ระบุชื่อผู้รายงานจากอิบนุอับบาส อัลฮัยษะมีย์ว่า \"มีอิบนุละฮีอะฮ์ และชายที่ไม่ระบุชื่อ\"", "ผู้แต่งอธิบายเรื่องอิบนุละฮีอะฮ์ว่า (ดังกล่าวที่หะดีษ 31) นักวิชาการกลุ่มหนึ่งระบุว่ารายงานของอับดุลลอฮ์ บินอัลมุบาร็อก อับดุลลอฮ์ บินวะฮ์บ์ และอับดุลลอฮ์ บินยะซีด อัลมุกริอ์ จากอิบนุละฮีอะฮ์ ดีกว่าคนอื่น เพราะได้ยินก่อนตำราของเขาถูกไฟไหม้ อับดุลฆ่อนีย์ บินสะอีด อัลอัซดีย์ว่า \"เมื่ออับดุลลอฮ์ทั้งสามรายงานจากอิบนุละฮีอะฮ์ ก็ถือว่าศ่อฮีห์\" และกุตัยบะฮ์ บินสะอีดก็เช่นกัน มิฉะนั้นอิบนุละฮีอะฮ์อ่อน เพราะความจำไม่ดีและตำราถูกไฟไหม้ เขาจึงรายงานจากความจำแล้วสับสน หะดีษของเขาในฐานะสายสนับสนุนไม่ต่ำกว่าระดับหะซัน แต่นักวิชาการผู้ตรวจสอบเห็นว่าอ่อนโดยรวม ทั้งก่อนและหลังตำราถูกไฟไหม้ สรุปว่าหะดีษอ่อนในส่วนเพิ่ม \"หรือที่น้ำขัง\" ส่วนที่เหลือศ่อฮีห์ตามหะดีษอบูฮุร็อยเราะฮ์", "หะดีษอิบนุอุมัร: อัฏเฏาะบะรอนีย์บันทึกฉบับเต็มใน \"อัลเอาสัฏ\" (3/199) ผ่านอัลหะกัม บินมัรวาน อัลกูฟีย์ จากฟุร็อต บินอัสสาอิบ จากมัยมูน บินมิฮ์รอน จากอิบนุอุมัร ว่า \"ท่านรสูลุลลอฮ์ ﷺ ห้ามมิให้ชายคนใดถ่ายทุกข์ใต้ต้นไม้ที่ออกผล และห้ามถ่ายทุกข์ที่ริมแม่น้ำที่ไหล\" สายนี้อ่อน อัฏเฏาะบะรอนีย์ว่า \"ไม่มีผู้รายงานจากมัยมูนนอกจากฟุร็อต บินอัสสาอิบ ซึ่งอัลหะกัมรายงานคนเดียว\" และฟุร็อตเป็นผู้ที่หะดีษถูกทิ้ง (มัตรูก) ตามที่อัลบุคอรีย์และคนอื่นกล่าว", "ผู้แต่งสรุปว่า หะดีษมุอาซ อิบนุอับบาส และอิบนุอุมัรอ่อนทั้งหมด แต่หะดีษอบูฮุร็อยเราะฮ์ในมุสลิมสนับสนุนความหมาย และหลักศาสนาก็ยืนยัน คือทุกสิ่งที่ทำร้ายมุสลิมเป็นหะรอม ดังอายะฮ์ \"และบรรดาผู้ที่ทำร้ายผู้ศรัทธาชายและหญิงโดยที่พวกเขาไม่ได้ทำผิด แน่นอนพวกเขาได้แบกการใส่ร้ายและบาปอันชัดแจ้ง\" (อัลอะห์ซาบ: 58) และหะดีษ \"ผู้ใดทำร้ายมุสลิมบนทางเดินของพวกเขา การสาปแช่งของพวกเขาย่อมตกแก่ผู้นั้น\" (อัฏเฏาะบะรอนีย์ใน \"อัลกะบีร\" อัลมุนซิรีย์ อัลฮัยษะมีย์ และอัลอัลบานีย์ว่าหะซัน)"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظها", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"จงระวังอัลลาอินัยน์\" เป็นสำนวนของอบูดาวูด สำนวนของมุสลิมคือ \"อัลลาอานัยน์\" อันนะวะวีย์ว่า \"ทั้งสองรายงานถูกต้อง\" คือสองสิ่งที่นำมาซึ่งการสาปแช่งและทำให้ผู้คนสาปแช่ง เพราะผู้ที่ทำสองสิ่งนี้จะถูกสาปแช่งและด่าทอ ตามธรรมเนียมของผู้คน จึงเป็นการใช้คำโดยอนุโลมทางเหตุผล (มะญาซ อักลีย์) เพราะความสัมพันธ์เชิงเหตุ หรือ \"ลาอิน\" อาจหมายถึงผู้ถูกสาปแช่ง คือผู้กระทำสองสิ่งนี้ ซึ่งก็เป็นมะญาซ อักลีย์เช่นกัน ส่วนสำนวนของมุสลิม \"อัลลาอานัยน์\" เป็นรูปทวิพจน์ของรูปเน้นย้ำ ความหมายคือ จงระวังการกระทำของสองคนที่ถูกสาปแช่งมาก เป็นการเรียกสิ่งหนึ่งด้วยชื่อของเหตุ", "\"ทางเดินของผู้คน\" คือถ่ายอุจจาระในที่ที่ผู้คนเดินผ่าน มีคำที่ละไว้ คือการถ่ายทุกข์ของผู้ที่ถ่ายบนทางเดินของผู้คน เหตุที่ห้ามเพราะทำร้ายมุสลิม ด้วยการทำให้ผู้ที่เดินผ่านเปื้อนนะญิส ได้กลิ่นเหม็น และรังเกียจ", "\"หรือในที่ร่มของพวกเขา\" คือที่ร่มที่ผู้คนใช้เป็นที่พักกลางวันและที่พักผ่อน การเชื่อมคำว่าที่ร่มกับพวกเขาบ่งว่าหมายถึงที่ร่มที่ใช้ประโยชน์ คือที่นั่งของพวกเขา", "\"อัลบะรอซ ฟิลมะวาริด\" มะวาริดพหูพจน์ของเมาริด คือที่ที่ผู้คนไปตักน้ำ เช่น ตาน้ำหรือบึง \"บะรอซ\" (ฟัตหะฮ์ที่บาอ์ตามที่รู้จักกันมากกว่า) เดิมคือที่โล่งกว้าง ใช้เป็นคำเลี่ยงหมายถึงอุจจาระ \"หรือที่น้ำขัง\" คือที่รวมของน้ำ", "\"ใต้ต้นไม้ที่ออกผล\" ไม่ว่าผลนั้นจะเป็นที่ต้องการหรือเป็นผลที่ควรให้เกียรติ ที่เป็นที่ต้องการคือที่ผู้คนไปเก็บ แม้ไม่ใช่อาหาร เช่น ต้นฝ้าย ไม่อนุญาตให้ใครถ่ายใต้ต้น เพราะผลอาจหล่นแล้วเปื้อนนะญิส และเพื่อไม่ให้ผู้ที่จะเก็บผลเปื้อน ส่วนผลที่ควรให้เกียรติ เช่น อินทผลัมและมะเดื่อ เพราะเป็นอาหารที่ควรให้เกียรติ จึงไม่อนุญาตให้ทำให้เปื้อนนะญิสเมื่อหล่น หรือทำให้ผู้ที่จะเก็บผลเปื้อน", "\"บนฎ็อฟฟะฮ์ของแม่น้ำที่ไหล\" (ฟัตหะฮ์หรือกัสเราะฮ์ที่ฎอด) คือริมแม่น้ำ"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "สถานที่หกแห่งที่ห้ามถ่ายทุกข์", "points_th": ["หะดีษเหล่านี้บ่งว่าห้ามถ่ายทุกข์ในบางสถานที่ เพราะทำร้ายผู้คนด้วยความสกปรก ความรังเกียจ และกลิ่นเหม็น และเป็นเหตุแพร่โรค เป็นภาพที่ไม่ดี ขัดกับคำสอนของอิสลามที่เรียกร้องความสะอาด สถานที่ที่ได้จากหะดีษเหล่านี้มีหก คือ ทางเดินของผู้คน ที่ร่ม แหล่งน้ำ ที่น้ำขัง ต้นไม้ที่ออกผล และริมแม่น้ำ", "(1) ทางเดินของผู้คนและกลางทาง คือทางที่ผู้คนสัญจร ส่วนทางที่ร้าง ถ่ายทุกข์ได้เมื่อจำเป็น", "(2) ที่ร่มที่ผู้คนอาศัย ไม่ว่าจากต้นไม้ กำแพง ภูเขา หรือสิ่งอื่นที่ใช้ประโยชน์ รวมถึงที่ที่ผู้คนนั่งตากแดดในฤดูหนาว และสถานที่ที่ผู้คนไปมา เช่น สถานที่พักผ่อน สวนสาธารณะ และจุดพักบนทางหลวง ส่วนที่ร่มที่ไม่มีใครใช้และไม่มีใครนั่ง ถ่ายทุกข์ได้ เพราะคำว่า \"หรือในที่ร่มของพวกเขา\"", "(3) แหล่งน้ำที่ผู้คนไปตักดื่ม เช่น ลำธารและบ่อ รวมถึงที่อาบน้ำละหมาดที่ไม่ได้สร้างไว้สำหรับถ่ายทุกข์ เช่น ในห้องน้ำที่มัสยิด และที่อื่นที่ผู้คนจะเดือดร้อน", "(4) ที่น้ำขัง ทั้งถ่ายลงในน้ำหรือรอบ ๆ เพราะถ้าถ่ายลงไปก็ทำให้น้ำเสียสำหรับผู้อื่น ถ้าถ่ายรอบ ๆ ใกล้ ๆ ผู้ที่มาใช้น้ำก็จะเดือดร้อน", "(5) ใต้ต้นไม้ที่ออกผล เพื่อไม่ให้ผลหล่นบนสิ่งที่ถ่ายไว้แล้วเปื้อนนะญิส หรือผู้ที่จะเก็บผลเปื้อน ถ้าเป็นต้นที่ไม่ออกผล หรือผลไม่มีใครเก็บ ก็ถ่ายใต้ต้นได้ ถ้าไม่ใช่ที่ร่มที่ผู้คนอาศัย", "(6) ริมแม่น้ำและชายฝั่งทะเล"]}], "tags_th": ["มารยาทการถ่ายทุกข์", "ทางเดิน", "ที่ร่ม", "แหล่งน้ำ", "การทำร้ายผู้อื่น", "อิบนุละฮีอะฮ์"]}, {"id": "v1-h094", "volume": 1, "bab": "qada-hajah", "topic_ar": "النهي عن التكشف والتحدث حال قضاء الحاجة", "topic_th": "ห้ามเปิดเอาเราะฮ์และพูดคุยกันขณะถ่ายทุกข์", "pages": [374, 377], "hadith": [{"no": 94, "matn_ar": "عَنْ جَابِرٍ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «إِذَا تَغَوَّطَ الرَّجُلَانِ فَلْيَتَوَارَ كُلُّ وَاحِدٍ مِنْهُمَا عَنْ صَاحِبِهِ، وَلَا يَتَحَدَّثَا. فَإِنَّ اللهَ يَمْقُتُ عَلَى ذَلِكَ». رَوَاهُ وَصَحَّحَهُ ابْنُ السَّكَنِ، وَابْنُ الْقَطَّانِ، وَهُوَ مَعْلُولٌ.", "translation_th": "จากญาบิร (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"เมื่อชายสองคนถ่ายอุจจาระ ก็ให้แต่ละคนหลบให้พ้นสายตาอีกคน และอย่าพูดคุยกัน เพราะอัลลอฮ์ทรงกริ้วอย่างยิ่งต่อสิ่งนั้น\" อิบนุสสะกันรายงานและตัดสินว่าศ่อฮีห์ และอิบนุลก็อฏฏอนก็ตัดสินว่าศ่อฮีห์ และหะดีษนี้มีข้อบกพร่อง (มะอ์ลูล)", "grade_th": "มะอ์ลูล (มีข้อบกพร่อง) ตามอิบนุหะญัร อิบนุสสะกันและอิบนุลก็อฏฏอนว่าศ่อฮีห์"}], "key_rulings_th": ["ผู้ถ่ายทุกข์ต้องปกปิดตนเอง และไม่พูดคุยกับผู้อื่นขณะถ่ายทุกข์ เพราะเป็นความต่ำทรามและขาดความละอาย", "ความหมายตามตัวบทคือหะรอม และอัชเชากานีย์เลือกทัศนะว่าหะรอม แต่นักวิชาการส่วนใหญ่ถือว่าเป็นมักรูฮ์ อาจเพราะหะดีษถูกวิจารณ์", "ขณะถ่ายทุกข์เป็นเวลาสงบและนอบน้อมต่ออัลลอฮ์ ยอมรับความอ่อนแอของมนุษย์ และใคร่ครวญความโปรดปรานของพระองค์ ไม่ใช่เวลาสนทนา", "ถ้ามีความจำเป็นต้องพูดก็ไม่เป็นไร บางครั้งอาจเป็นวาญิบ เช่น เตือนคนตาบอดที่กำลังจะตกหลุม หรือเตือนเรื่องแมงป่องหรืองู"], "vocab": [{"ar": "تَغَوَّطَ", "th": "ถ่ายอุจจาระ มาจากคำว่า เฆาะอิฏ เดิมคือที่ลุ่ม แล้วใช้เรียกสิ่งขับถ่ายเพราะผู้คนถ่ายทุกข์ในที่ลุ่ม"}, {"ar": "فَلْيَتَوَارَ", "th": "ให้หลบซ่อนและปกปิดตัว"}, {"ar": "يَمْقُتُ", "th": "ทรงกริ้วอย่างยิ่ง (มักต์ คือความโกรธเกลียดที่รุนแรงที่สุดต่อสิ่งที่น่ารังเกียจ)"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["ต้นฉบับ \"อัลบุลูฆ\" ต่างกันตรงนี้ บางฉบับว่า \"รายงานโดยอะห์มัด\" บางฉบับว่า \"รายงาน...\" โดยไม่ระบุผู้บันทึก ฉบับที่ใช้ใน \"อัลบัดรุตตะมาม\" ของอัลมัฆริบีย์ก็เช่นนั้น และเขาไม่ได้อธิบาย แต่ยกหะดีษอบูสะอีดมาแทน ผู้แต่งเห็นว่าความหมายคือ \"อิบนุสสะกันรายงานและตัดสินว่าศ่อฮีห์ และอิบนุลก็อฏฏอนก็ตัดสินว่าศ่อฮีห์\" ซึ่งตรงกับที่มีใน \"อัลอิลมาม\" ของอิบนุดะกีกิลอีด", "อัศศ็อนอานีย์ใน \"อัสสุบุล\" อธิบายข้อบกพร่องของหะดีษอบูสะอีด (ร.ฎ.) ที่อบูดาวูด (15) และอิบนุมาญะฮ์ (342) บันทึก ผ่านอิกริมะฮ์ บินอัมมาร จากยะห์ยา บินอบีกะษีร จากฮิลาล บินอิยาฎ จากอบูสะอีด หะดีษนี้มีข้อบกพร่องสามประการ", "(1) ความสับสน (อิฎฏิร็อบ) ในรายงานของอิกริมะฮ์ บินอัมมารจากยะห์ยา บินอบีกะษีร ตามที่อะห์มัด ยะห์ยา บินมะอีน อัลบุคอรีย์ อันนะสาอีย์ อบูหาติม และคนอื่นกล่าว เช่น บางครั้งรายงานจากยะห์ยา จากฮิลาล บางครั้งจากยะห์ยา จากอบูสะลามะฮ์ จากอบูฮุร็อยเราะฮ์ และรูปแบบอื่นที่อัดดารุกุฏนีย์ระบุ อบูดาวูดว่า \"ไม่มีผู้รายงานแบบมีสายนอกจากอิกริมะฮ์ บินอัมมาร\" คือหะดีษอ่อนเพราะอิกริมะฮ์รายงานคนเดียว แต่อิบนุลก็อฏฏอนไม่ถือว่าเป็นข้อบกพร่อง และอัชเชากานีย์ก็เห็นด้วยว่า \"ไม่มีเหตุที่จะถือว่าอ่อนเพราะเรื่องนี้ เพราะมุสลิมบันทึกหะดีษของเขาจากยะห์ยา และอัลบุคอรีย์ก็ใช้หะดีษของเขาประกอบ\" อีกทั้งอิกริมะฮ์ก็ไม่ได้รายงานคนเดียว อะบาน บินยะซีดรายงานสนับสนุน (ตามที่อิบนุดะกีกิลอีดระบุ) และอัลเอาซาอีย์ก็รายงานสนับสนุนจากยะห์ยาแบบมุรสัล", "(2) ฮิลาล บินอิยาฎไม่เป็นที่รู้จัก อิบนุหะญัรว่า \"มัจญ์ฮูล จากชั้นที่สาม มีเพียงยะห์ยา บินอบีกะษีรที่รายงานจากเขา\" และเห็นว่าชื่อที่ถูกคืออิยาฎ บินฮิลาล อัลบุคอรีย์ อิบนุอบีหาติม อัลเคาะฏีบ และคนอื่นก็ระบุเช่นนั้น อิบนุลก็อฏฏอนระบุหลายแห่งใน \"บะยานุลวะฮ์มิ วัลอีฮาม\" ว่านี่คือข้อบกพร่องที่ใหญ่ที่สุด", "(3) ความสับสนในเนื้อความ บางรายงานกล่าวถึงความกริ้วต่อการเปิดเอาเราะฮ์และการพูดคุย บางรายงานไม่กล่าวถึงการพูดคุย บางรายงานไม่กล่าวถึงการเปิดเอาเราะฮ์ (อิบนุลก็อฏฏอน)", "อิบนุดะกีกิลอีดยกหะดีษญาบิร (ร.ฎ.) และว่า \"อัลหาฟิซ อบูอะลี บินอัสสะกันบันทึก และอัลหาฟิซ อบุลหะสัน อัลก็อฏฏอนตัดสินว่าศ่อฮีห์\" ผู้แต่งตรวจสอบใน \"บะยานุลวะฮ์มิ\" พบว่าอิบนุลก็อฏฏอนยกสายรายงาน: อบูอะลี บินอัสสะกัน จากยะห์ยา บินมุหัมมัด บินศออิด จากอัลหะสัน บินอะห์มัด บินอบีชุอัยบ์ อัลหัรรอนีย์ จากมิสกีน บินบุกัยร์ จากอัลเอาซาอีย์ จากยะห์ยา บินอบีกะษีร จากมุหัมมัด บินอับดิรเราะห์มาน จากญาบิร บินอับดิลลาฮ์ แล้วตัดสินว่าศ่อฮีห์ โดยว่า อัลหะสัน บินอะห์มัด ศอดูก ไม่มีปัญหา มิสกีน บินบุกัยร์ ไม่มีปัญหา (อิบนุมะอีน) มุหัมมัด บินอับดิรเราะห์มาน เชื่อถือได้ และได้ยินจากญาบิรจริง ส่วนคนอื่นในสายไม่ต้องถาม อิบนุกะษีรก็ยกการตัดสินว่าศ่อฮีห์ของอิบนุลก็อฏฏอน", "ผู้แต่งสรุปว่า ข้อความใน \"อัลบุลูฆ\" ถูกต้องไม่มีตกหล่น ส่วนการเพิ่มคำว่า \"อะห์มัด\" ในบางฉบับไม่ถูกต้อง เพราะหะดีษนี้ไม่มีในมุสนัดจากหะดีษญาบิร แต่มาจากหะดีษอบูสะอีด จึงตรงกับ \"อัลอิลมาม\" และหนังสือของอิบนุลก็อฏฏอน แต่ดูเหมือนว่าการมาของหะดีษจากสายนี้ (ญาบิร) เป็นหนึ่งในรูปแบบความสับสนในสายรายงาน ซึ่งอัดดารุกุฏนีย์กล่าวไว้ ส่วนคำว่า \"และหะดีษนี้มีข้อบกพร่อง\" ใช้ได้ทั้งกับหะดีษอบูสะอีด และกับหะดีษญาบิร ในแง่ความขัดแย้งในรายงานของยะห์ยา บินอบีกะษีร ตามที่อัดดารุกุฏนีย์และอิบนุหะญัรใน \"อิตหาฟุลมะฮะเราะฮ์\" ระบุ"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ตะเฆาวะฏ\" มาจาก \"เฆาะอิฏ\" คือสิ่งที่ออกจากมนุษย์ที่น่ารังเกียจ เดิมหมายถึงที่ลุ่ม การเรียกสิ่งที่ขับถ่ายด้วยคำนี้เป็นการเลี่ยงไม่เรียกตรง ๆ เพราะผู้คนถ่ายทุกข์ในที่ลุ่ม จึงเป็นการใช้คำโดยอนุโลมแบบความใกล้ชิด", "\"ชายสองคน\" การระบุผู้ชายไม่มีความหมายกลับ แต่พูดตามกรณีส่วนใหญ่ หญิงสองคนหรือชายกับหญิงยิ่งน่ารังเกียจกว่า", "\"ฟัลยะตะวาร\" คือให้หลบซ่อนและปกปิด แต่ละคนจากอีกคน รูปกริยาถูกทำให้เป็นญัซม์ด้วยลามคำสั่ง โดยตัดอักษรอิลละฮ์ออก \"วะลายะตะหัดดะษา\" ลาเป็นคำห้าม กริยาจึงเป็นญัซม์โดยตัดนูนออก", "\"ยัมกุตุ\" รูปปัจจ مٍ.", "translation_th": "จากอบูเกาะตาดะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"คนหนึ่งในหมู่พวกท่านอย่าจับอวัยวะเพศของตนด้วยมือขวาขณะปัสสาวะ และอย่าชำระหลังถ่ายทุกข์ด้วยมือขวา และอย่าหายใจในภาชนะ\" บันทึกโดยอัลบุคอรีย์และมุสลิม สำนวนเป็นของมุสลิม", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["ห้ามจับอวัยวะเพศด้วยมือขวาขณะปัสสาวะ ผู้แต่งเห็นว่าทัศนะของนักวิชาการส่วนใหญ่ที่ถือว่าเป็นมักรูฮ์ (การห้ามเชิงมารยาท) มีน้ำหนักกว่าทัศนะว่าหะรอม แต่ที่ระมัดระวังกว่าคือไม่จับเลยนอกจากมีเหตุจำเป็น", "ห้ามชำระ (อิสตินญาอ์) ด้วยมือขวา ทั้งด้วยก้อนหินและน้ำ นักวิชาการส่วนใหญ่ว่ามักรูฮ์ บางคนว่าหะรอม ที่ระมัดระวังกว่าคือไม่ชำระด้วยมือขวา ถ้ามีความจำเป็นก็ไม่เป็นไร", "ผู้หญิงเหมือนผู้ชายในเรื่องการจับทวารด้วยมือขวา เพราะเหตุผลคือการให้เกียรติมือขวา", "ห้ามหายใจในภาชนะขณะดื่ม และซุนนะฮ์คือดื่มสามครั้ง หายใจนอกภาชนะ และห้ามเป่าในภาชนะด้วย"], "vocab": [{"ar": "لَا يُمْسِكَنَّ", "th": "อย่าจับ (ลาเป็นคำห้าม กริยามีนูนเน้นย้ำ)"}, {"ar": "وَهُوَ يَبُولُ", "th": "ขณะที่เขาปัสสาวะ (ประโยคบอกสภาพ)"}, {"ar": "يَتَمَسَّحْ مِنَ الْخَلَاءِ", "th": "ชำระสิ่งขับถ่ายด้วยก้อนหินหรือน้ำ"}, {"ar": "يَتَنَفَّسْ فِي الْإِنَاءِ", "th": "หายใจออกลงในภาชนะที่ดื่ม"}, {"ar": "أَرْوَى، أَبْرَأُ، أَمْرَأُ", "th": "ดับกระหายได้ดีกว่า ปลอดภัยจากโรคหรือความเจ็บปวดกว่า และกลืนลงคอได้ดีและเบาท้องกว่า"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกไว้หลายแห่ง เช่น หมวดวุฎูอ์ บทห้ามชำระด้วยมือขวา (153) และมุสลิม (267) ผ่านยะห์ยา บินอบีกะษีร จากอับดุลลอฮ์ บินอบีเกาะตาดะฮ์ จากบิดา ผู้ที่รายงานจากยะห์ยาในอัลบุคอรีย์ได้แก่ ฮิชาม อัดดัสตุวาอีย์ อัลเอาซาอีย์ และชัยบาน บินอับดิรเราะห์มาน อัตตะมีมีย์ และในมุสลิมได้แก่ ฮัมมาม บินยะห์ยา ฮิชาม อัดดัสตุวาอีย์ และอัยยูบ บินอันนัจญาร", "อิบนุหะญัรจะยกหะดีษนี้อีกครั้งในมารยาทการกินและดื่ม บทอัลวะลีมะฮ์ โดยยกเฉพาะประโยคสุดท้าย"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ลายุมสิกันนะ\" คืออย่าจับ เป็นรูปปัจจุบันที่ลงท้ายด้วยฟัตหะฮ์เพราะติดกับนูนเน้นย้ำ ลาเป็นคำห้าม ในสำนวนของอัลบุคอรีย์และมุสลิมว่า \"อย่าแตะอวัยวะเพศด้วยมือขวา\"", "\"ขณะที่เขาปัสสาวะ\" เป็นสำนวนของมุสลิม สำนวนของอัลบุคอรีย์คือ \"เมื่อคนหนึ่งในหมู่พวกท่านปัสสาวะ ก็อย่าจับอวัยวะเพศด้วยมือขวา\" เป็นประโยคบอกสภาพ ความหมายคือ อย่าจับอวัยวะเพศด้วยมือขวาในขณะปัสสาวะ", "\"อย่าชำระหลังถ่ายทุกข์ด้วยมือขวา\" คืออย่าชำระปัสสาวะหรืออุจจาระด้วยก้อนหินหรือน้ำด้วยมือขวา ในสำนวนหนึ่งของมุสลิมว่า \"ท่านห้ามชำระด้วยมือขวา\"", "\"อย่าหายใจในภาชนะ\" คืออย่าหายใจออกจากในตัวลงในภาชนะที่ดื่ม เช่น ภาชนะนมหรือน้ำ"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "การจับอวัยวะเพศด้วยมือขวา", "points_th": ["หะดีษเป็นหลักฐานว่าห้ามผู้ปัสสาวะจับอวัยวะเพศด้วยมือขวาขณะปัสสาวะ เพราะขัดกับการให้เกียรติมือขวา", "นักวิชาการส่วนใหญ่ถือว่าเป็นมักรูฮ์ ตามที่อันนะวะวีย์และคนอื่นระบุ เพราะเป็นเรื่องมารยาทและการชี้แนะ และเป็นการรักษามือขวาให้สะอาด จึงไม่ถึงขั้นหะรอม ดาวูด อัซซอฮิรีย์และอิบนุหัซม์ว่าหะรอม ตามหลักว่าคำห้ามโดยพื้นฐานคือหะรอม", "ผู้แต่งเห็นว่าทัศนะของนักวิชาการส่วนใหญ่มีน้ำหนักกว่า คือเป็นการห้ามเชิงอบรมและชี้แนะ ที่สนับสนุนคือคำของท่านนบี ﷺ เรื่องอวัยวะเพศว่า \"มันเป็นเพียงชิ้นส่วนหนึ่งของท่าน\" (กล่าวแล้วในบทสิ่งที่ทำให้วุฎูอ์เสีย)", "ที่ระมัดระวังกว่าสำหรับมุกัลลัฟคือไม่แตะอวัยวะเพศด้วยมือขวาขณะปัสสาวะ เพราะหะดีษห้ามไว้ และการห้ามนี้เมื่อไม่มีความจำเป็น ถ้าจำเป็นก็ทำได้ไม่เป็นมักรูฮ์ ผู้หญิงเหมือนผู้ชายในเรื่องการแตะทวารหน้าและทวารหลังด้วยมือขวา เพราะเหตุผลของการห้ามคือการให้เกียรติมือขวาและรักษาให้พ้นจากสิ่งสกปรก"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "การห้ามเฉพาะขณะปัสสาวะหรือไม่", "points_th": ["การห้ามจับอวัยวะเพศด้วยมือขวาถูกจำกัดด้วยคำว่า \"ขณะที่เขาปัสสาวะ\" เงื่อนไขนี้ใช้หรือไม่ มีสองทัศนะ", "ทัศนะแรก: เงื่อนไขนี้ใช้ การห้ามเฉพาะขณะปัสสาวะตามความหมายตามตัวบท เพราะมือขวาอาจเปื้อนเมื่อจับอวัยวะเพศในขณะนั้น ถ้าไม่ได้ปัสสาวะก็ทำได้ ตามหะดีษ \"มันเป็นเพียงชิ้นส่วนหนึ่งของท่าน\" เมื่อเป็นชิ้นส่วนหนึ่งของตัวเขา ก็ไม่ต่างกันระหว่างแตะด้วยมือขวาหรือมือซ้าย เพราะบ่งว่าทำได้ทุกสภาพ แล้วสภาพขณะปัสสาวะถูกยกเว้นด้วยหะดีษศ่อฮีห์ของอบูเกาะตาดะฮ์ ที่เหลือก็คงเป็นที่อนุญาต", "ทัศนะที่สอง: การห้ามครอบคลุมทั่วไป เป็นมักรูฮ์ที่จะแตะอวัยวะเพศด้วยมือขวาทั้งขณะปัสสาวะและไม่ปัสสาวะ โดยอ้างหะดีษอบูเกาะตาดะฮ์นี้ในอีกรายงานหนึ่งของมุสลิม: \"ท่านนบี ﷺ ห้ามหายใจในภาชนะ และห้ามแตะอวัยวะเพศด้วยมือขวา...\" ซึ่งไม่มีเงื่อนไขขณะปัสสาวะ พวกเขากล่าวว่า การระบุสภาพขณะปัสสาวะเป็นการชี้ว่ากรณีทั่วไปยิ่งควรห้าม เพราะเมื่อห้ามแตะขณะปัสสาวะซึ่งเป็นภาวะที่จำเป็น สภาพอื่นยิ่งควรห้าม", "ผู้แต่งเห็นว่าที่ชัดเจนคือให้ตีความรายงานที่ไม่มีเงื่อนไขตามรายงานที่มีเงื่อนไข เพราะเป็นหะดีษเดียวกันที่ผู้รายงานต่างกัน และเงื่อนไขเป็นส่วนเพิ่มจากผู้รายงานที่เชื่อถือได้ ซึ่งนักวิชาการยอมรับ ดังที่อิบนุดะกีกิลอีดกล่าว แต่ผู้เขียน \"อัลมันฮัลอัลอัซบ์อัลเมารูด\" ว่า \"ที่ถูกคือนี่เป็นการกล่าวถึงบางส่วนของความหมายกว้าง ไม่ใช่เรื่องไม่มีเงื่อนไขกับมีเงื่อนไข เพราะกริยาอยู่ในหุก่มคำนามไม่ชี้เฉพาะ และคำนามไม่ชี้เฉพาะในบริบทปฏิเสธมีความหมายกว้าง\" ตามนี้ การกล่าวถึงบางส่วนของความหมายกว้างด้วยหุก่มเดียวกันไม่ทำให้จำกัดความหมาย ดังที่รู้กันในอุศูล", "เมื่อหะดีษมาทั้งแบบไม่มีเงื่อนไขและมีเงื่อนไข ที่ระมัดระวังกว่าคือไม่แตะอวัยวะเพศด้วยมือขวา นอกจากมีเหตุจำเป็น เช่น มือซ้ายพิการ หรือมีบาดแผล หรือสิ่งอื่นทำนองนั้น"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "การชำระด้วยมือขวา", "points_th": ["หะดีษบ่งว่าห้ามชำระปัสสาวะและอุจจาระด้วยมือขวา ไม่ว่าด้วยก้อนหินหรือน้ำ ความขัดแย้งเหมือนข้างต้น นักวิชาการส่วนใหญ่ว่าเป็นการห้ามเชิงมักรูฮ์และมารยาท ไม่ใช่หะรอม ส่วนชาวซอฮิรีย์บางคนว่าหะรอม และชาฟิอีย์บางคนก็ว่าเช่นนั้น เช่น ผู้เขียน \"อัลมุฮัษษับ\" ที่ว่า \"ไม่อนุญาตให้ชำระด้วยมือขวา\" แต่อันนะวะวีย์ในคำอธิบายตีความให้ตรงกับมัซฮับของนักวิชาการส่วนใหญ่", "ที่ระมัดระวังกว่าสำหรับมุสลิมคือไม่ชำระด้วยมือขวา เพราะท่านนบี ﷺ ห้ามไว้ และท่านกล่าวว่า \"สิ่งใดที่ฉันห้ามพวกท่าน ก็จงหลีกเลี่ยง\" (อัลบุคอรีย์ 7288 มุสลิม 1337) ถ้ามีความจำเป็นก็ไม่เป็นไร ดังกล่าวแล้ว"]}, {"wajh": 6, "type": "fawaid", "heading_ar": null, "heading_th": "การหายใจในภาชนะ", "points_th": ["หะดีษเป็นหลักฐานว่าห้ามหายใจในภาชนะ ให้หายใจนอกภาชนะ ซึ่งเป็นซุนนะฮ์ที่มั่นคงและเป็นมารยาทการดื่มในศาสนา การหายใจในภาชนะมีข้อเสียสามประการ (1) ทำให้เครื่องดื่มสกปรกสำหรับผู้ดื่มคนต่อไป เพราะอาจมีบางสิ่งจากปากหรือจมูกตกลงไปขณะหายใจ (2) ลมหายใจอาจนำโรคมาเปื้อนภาชนะ (3) อาจสำลัก เพราะน้ำไหลลงขณะลมหายใจขึ้น เมื่อทั้งสองพบกัน คนอาจสำลักและน้ำลายกระเด็นลงในภาชนะ ทั้งหมดนี้ขัดกับมารยาท", "ซุนนะฮ์คือไม่ดื่มรวดเดียว แต่ดื่มสองหรือสามครั้ง โดยยกแก้วออกจากปาก เพราะเบาท้องกว่า ดับกระหายได้ดีกว่า มารยาทดีกว่า และห่างไกลจากการกระทำของคนตะกละ จากอะนัสว่า \"ท่านรสูลุลลอฮ์ ﷺ หายใจขณะดื่มสามครั้ง และกล่าวว่า มันดับกระหายได้ดีกว่า ปลอดภัยกว่า และกลืนได้ดีกว่า\" อะนัสกล่าวว่า \"ฉันจึงหายใจขณะดื่มสามครั้ง\" (มุสลิม 2028) \"อัรวา\" คือดับกระหายได้มากกว่า \"อับเราะอุ\" คือหายจากความเจ็บปวดของความกระหายมากกว่า หรือปลอดภัยจากโรคหรืออันตรายที่เกิดจากการดื่มรวดเดียว \"อัมเราะอุ\" คือกลืนลงคอได้ดีกว่าและเบาท้องกว่า", "มีการห้ามเป่าในภาชนะด้วย ซึ่งหนักกว่า ดังหะดีษอิบนุอับบาสว่า \"ท่านรสูลุลลอฮ์ ﷺ ห้ามหายใจในภาชนะ หรือเป่าลงไป\" (อบูดาวูด 3728 อัตติรมิซีย์ 1889 ซึ่งว่าหะซันศ่อฮีห์)"]}], "tags_th": ["มารยาทการถ่ายทุกข์", "มือขวา", "อิสตินญาอ์", "มารยาทการดื่ม", "การหายใจในภาชนะ"]}, {"id": "v1-h096", "volume": 1, "bab": "qada-hajah", "topic_ar": "بعض الآداب المتعلقة بقضاء الحاجة ومنها النهي عن الاستجمار بأقل من ثلاثة أحجار", "topic_th": "มารยาทบางประการเกี่ยวกับการถ่ายทุกข์ รวมถึงการห้ามชำระด้วยก้อนหินน้อยกว่าสามก้อน", "pages": [382, 387], "hadith": [{"no": 96, "matn_ar": "عَنْ سَلْمَانَ رَضِيَ اللهُ عَنْهُ قَالَ: لَقَدْ نَهَانَا رَسُولُ اللهِ ﷺ أَنْ نَسْتَقْبِلَ الْقِبْلَةَ بِغَائِطٍ أَوْ بَوْلٍ، أَوْ أَنْ نَسْتَنْجِيَ بِالْيَمِينِ، أَوْ أَنْ نَسْتَنْجِيَ بِأَقَلَّ مِنْ ثَلَاثَةِ أَحْجَارٍ، أَوْ أَنْ نَسْتَنْجِيَ بِرَجِيعٍ أَوْ عَظْمٍ. رَوَاهُ مُسْلِمٌ.", "translation_th": "จากสัลมาน (ร.ฎ.) กล่าวว่า แน่นอนท่านรสูลุลลอฮ์ ﷺ ได้ห้ามพวกเรามิให้หันหน้าไปทางกิบละฮ์ขณะถ่ายอุจจาระหรือปัสสาวะ หรือชำระด้วยมือขวา หรือชำระด้วยก้อนหินน้อยกว่าสามก้อน หรือชำระด้วยมูลสัตว์หรือกระดูก รายงานโดยมุสลิม", "grade_th": "ศ่อฮีห์ (มุสลิม)"}], "key_rulings_th": ["ห้ามหันหน้าไปทางกิบละฮ์ขณะถ่ายอุจจาระหรือปัสสาวะ และห้ามชำระด้วยมือขวา", "ห้ามชำระด้วยก้อนหินน้อยกว่าสามก้อน แม้จะตามด้วยน้ำ ผู้แต่งเห็นว่าการถือตามความหมายของหะดีษมีน้ำหนักกว่า ถ้ายังไม่สะอาดก็เพิ่ม และส่งเสริมให้จบที่จำนวนคี่ ส่วนการใช้น้ำเพียงอย่างเดียวเพียงพอ", "ไม่จำเป็นต้องเป็นก้อนหินเท่านั้น ทุกสิ่งที่ทำความสะอาดได้ เช่น ผ้า ไม้ กระดาษทิชชู ใช้ได้ (ทัศนะนักวิชาการส่วนใหญ่ ซึ่งผู้แต่งเห็นว่ามีน้ำหนักกว่า)", "ที่หมายถึงคือการเช็ดสามครั้ง ก้อนหินที่มีสามมุมเช็ดได้สามครั้งก็ใช้ได้ (ทัศนะนักวิชาการส่วนใหญ่ ซึ่งผู้แต่งเห็นว่าชัดเจนกว่า)", "ห้ามชำระด้วยกระดูกและมูลสัตว์ กระดูกสัตว์ที่เชือดถูกต้องเป็นอาหารของญิน มูลสัตว์ที่สะอาดเป็นอาหารสัตว์ของพวกเขา และสิ่งที่เป็นนะญิสก็ทำให้สะอาดไม่ได้"], "vocab": [{"ar": "الْخِرَاءَةُ", "th": "(กัสเราะฮ์ที่คอ มีมัด) มารยาทการถ่ายทุกข์และการนั่งถ่ายทุกข์"}, {"ar": "أَجَلْ", "th": "ใช่ คำตอบยืนยันข่าว"}, {"ar": "نَسْتَنْجِي", "th": "ชำระสิ่งขับถ่าย ในที่นี้หมายถึงด้วยก้อนหิน"}, {"ar": "الرَّجِيعُ", "th": "มูลสัตว์และอุจจาระ เพราะกลับจากสภาพเดิมที่เป็นอาหารหรือหญ้า"}, {"ar": "الْاسْتِجْمَارُ", "th": "การชำระด้วยก้อนหินหรือสิ่งอื่นที่ไม่ใช่น้ำ"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["คืออบูอับดิลลาฮ์ สัลมาน อัลฟาริสีย์ มีอีกชื่อว่า สัลมาน อัลค็อยร์ เป็นเมาลาของท่านรสูลุลลอฮ์ ﷺ เดิมเป็นชาวเปอร์เซีย เดินทางแสวงหาศาสนา จึงเข้ารีตคริสต์ อ่านคัมภีร์ แล้วตกอยู่ในมือชาวอาหรับกลุ่มหนึ่ง ซึ่งขายเขาให้ชาวยิว เรื่องการรับอิสลามของเขาอะห์มัดบันทึกไว้ยาวในมุสนัด และอิบนุสะอ์ดก็กล่าวถึง มีรายงานหลายทางว่าท่านนบี ﷺ ซื้อเขาเพื่อปลดปล่อยเป็นไท เขารับอิสลามเมื่อท่านนบีมาถึงมะดีนะฮ์", "สงครามแรกที่เขาเข้าร่วมคือสงครามคันดัก และเขาเป็นผู้เสนอให้ขุดสนามเพลาะ หลังจากนั้นเขาไม่เคยขาดสงครามใดกับท่านรสูลุลลอฮ์ ﷺ เป็นคนดี ประเสริฐ มีความรู้ และสมถะ มีการกล่าวว่าเขาอายุยืนมาก แต่อัษษะฮะบีย์ปฏิเสธ เขากินจากน้ำพักน้ำแรงของตน และบริจาคเงินที่ได้รับ", "อัฏเฏาะบะรอนีย์และอัลหากิมบันทึกผ่านกะษีร บินอับดิลลาฮ์ อัลมุซะนีย์ จากบิดา จากปู่ว่า เมื่อสัลมานเสนอให้ขุดสนามเพลาะ มุฮาญิรีนและอันศอรต่างอ้างสัลมาน เพราะเขาเป็นชายแข็งแรง มุฮาญิรีนว่า สัลมานเป็นของเรา อันศอรก็ว่า สัลมานเป็นของเรา ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"สัลมานเป็นของเรา ชาวบ้าน (อะฮ์ลุลบัยต์)\" ผู้แต่งว่าหะดีษนี้อ่อนมาก เพราะกะษีร บินอับดิลลาฮ์ อัลมุซะนีย์ อัดดารุกุฏนีย์และคนอื่นว่า \"มัตรูก\" อิบนุอะดีย์ว่า \"ส่วนใหญ่ที่เขารายงานไม่มีใครรายงานสนับสนุน\" และอัชชาฟิอีย์ว่า \"เป็นเสาหลักหนึ่งของการโกหก\" ผู้แต่งยกหะดีษนี้เพื่อให้รู้สถานะของมัน", "เขาเสียชีวิตที่มะดีนะฮ์ปลายสมัยคิลาฟะฮ์ของอุษมาน (ร.ฎ.) ปี ฮ.ศ. 35 ตามทัศนะของคนส่วนใหญ่"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["มุสลิมบันทึกในหมวดความสะอาด บทอัลอิสติฏอบะฮ์ (262) หลายสายผ่านอัลอะอ์มัช จากอิบรอฮีม บินยะซีด อันนะเคาะอีย์ จากลุงของเขา อับดุรเราะห์มาน บินยะซีด อันนะเคาะอีย์ จากสัลมาน ว่า มีคนกล่าวกับเขาว่า \"นบีของพวกท่านสอนพวกท่านทุกอย่าง แม้แต่มารยาทการถ่ายทุกข์\" เขาตอบว่า \"ใช่ แน่นอนท่านได้ห้ามพวกเรา...\""]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"มีคนกล่าวกับเขา\" ในอีกรายงานของมุสลิมผ่านสุฟยาน จากอัลอะอ์มัชและมันศูร จากอิบรอฮีม จากอับดุรเราะห์มาน บินยะซีด จากสัลมาน ว่า \"พวกมุชริกกล่าวกับเราว่า ฉันเห็นสหายของพวกท่านสอนพวกท่าน แม้แต่มารยาทการถ่ายทุกข์\" แสดงว่าผู้ที่กล่าวคือพวกมุชริก", "\"อัลคิรออะฮ์\" (กัสเราะฮ์ที่คอ ไม่มีชัดดะฮ์ที่รออ์ มีมัด) เป็นคำนามบอกลักษณะของการถ่ายทุกข์ คือมารยาทการถ่ายทุกข์และการนั่ง ส่วนตัวสิ่งที่ขับถ่ายคือ \"อัลคิรออ์\" ไม่มีตาอ์ อ่านฟัตหะฮ์หรือกัสเราะฮ์ที่คอ", "\"อะญัล\" เป็นคำตอบเหมือน \"นะอัม\" ใช้ยืนยันข่าวและยืนยันคำขอ อัลอัคฟัชว่าใช้ได้ทั้งกับข่าวและคำถาม แต่ในข่าว \"อะญัล\" ดีกว่า \"นะอัม\" และในคำถาม \"นะอัม\" ดีกว่า สัลมานต้องการยืนยันข่าวนี้ คือท่านนบี ﷺ สอนเราทุกอย่างที่เราต้องการในศาสนาของเรา แม้แต่การถ่ายทุกข์ที่ท่านกล่าวถึง ท่านสอนมารยาทเรา ห้ามเราเรื่องนั้นเรื่องนี้ ดังที่มาในหะดีษนี้และหะดีษอื่น", "\"ละก็อด นะฮานา\" ประโยคถูกเน้นย้ำสามอย่าง คือ คำสาบานที่ละไว้ ลามที่บ่งการสาบาน และ \"ก็อด\" เพราะบริบทต้องการการเน้นย้ำ เนื่องจากพูดกับผู้ที่ต้องการให้ยืนยัน", "\"บิเฆาะอิฏิน เอาบะวลิน\" เป็นเช่นนี้ใน \"บุลูฆุลมะรอม\" และ \"มุคตะศ็อร เศาะฮีห์มุสลิม\" ของอัลกุรฏุบีย์และอัลมุนซิรีย์ แต่ใน \"เศาะฮีห์มุสลิม\" เป็น \"ลิเฆาะอิฏ\" ด้วยลาม ฉบับที่ใช้ในคำอธิบายของอิยาฎและอันนะวะวีย์ก็เช่นกัน อันนะวะวีย์ว่าทั้ง \"ลิเฆาะอิฏ\" \"บิเฆาะอิฏ\" และ \"บิลเฆาะอิฏ\" มีความหมายเดียวกัน", "\"หรือชำระด้วยก้อนหินน้อยกว่าสามก้อน\" อิสตินญาอ์คือการขจัดสิ่งขับถ่าย ส่วนใหญ่ใช้กับการชำระด้วยน้ำ บางทัศนะว่าใช้กับการขจัดด้วยก้อนหินด้วย ซึ่งหมายถึงในที่นี้", "\"อัรเราะญีอ์\" คือมูลสัตว์และอุจจาระ เป็นรูป \"ฟะอีล\" ในความหมายผู้กระทำ เพราะกลับจากสภาพแรกหลังจากที่เคยเป็นอาหารหรือหญ้า"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "การหันหน้าไปทางกิบละฮ์", "points_th": ["หะดีษเป็นหลักฐานว่าห้ามหันหน้าไปทางกิบละฮ์ขณะถ่ายอุจจาระหรือปัสสาวะ จะกล่าวในหะดีษถัดไป"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "การชำระด้วยมือขวา", "points_th": ["หะดีษเป็นหลักฐานว่าห้ามชำระด้วยมือขวา ซึ่งกล่าวแล้วในหะดีษก่อนหน้า"]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "การชำระด้วยก้อนหินน้อยกว่าสามก้อน", "points_th": ["หะดีษเป็นหลักฐานว่าห้ามชำระด้วยก้อนหินน้อยกว่าสามก้อน เพราะน้อยกว่าสามก้อนโดยทั่วไปไม่สะอาด เว้นแต่ต้องการใช้น้ำตามหลังก้อนหิน ก็ใช้น้อยกว่าสามก้อนได้ เพราะน้ำอย่างเดียวก็เพียงพอ ดังที่กล่าวแล้วในหะดีษอะนัส (ร.ฎ.)", "ผู้แต่งเห็นว่าการถือตามความหมายของหะดีษแข็งแรงกว่า คือไม่น้อยกว่าสามก้อน แม้จะต้องการตามด้วยน้ำ เพราะคนอาจลืม แล้วอาบน้ำละหมาดโดยไม่ได้ชำระด้วยน้ำ หรืออาจมีเหงื่อ ทำให้กางเกงและบริเวณทวารเปื้อน", "ถ้าสามก้อนยังไม่สะอาดก็เพิ่มจนกว่าจะสะอาด ที่สมบูรณ์คือให้จบที่จำนวนคี่ ถ้าสะอาดด้วยสี่ก็เพิ่มเป็นห้า เป็นต้น เพื่อให้จบที่จำนวนคี่ เหมือนเรื่องศาสนาหลายเรื่องที่จบด้วยจำนวนคี่ หลักฐานคือหะดีษอบูฮุร็อยเราะฮ์ (ร.ฎ.) \"ผู้ใดชำระด้วยก้อนหิน ก็จงทำเป็นจำนวนคี่\" (อัลบุคอรีย์ 162 มุสลิม 278) ความหมายตามตัวบทคือวาญิบ แต่อีกรายงานหนึ่งว่า \"ผู้ใดชำระด้วยก้อนหิน ก็จงทำเป็นจำนวนคี่ ผู้ใดทำก็ดีแล้ว ผู้ใดไม่ทำก็ไม่เป็นไร\" (อบูดาวูด 35 อิบนุมาญะฮ์ 337 อะห์มัด) อิบนุหะญัรว่า \"เป็นส่วนเพิ่ม "شَرِّقُوا أَوْ غَرِّبُوا", "th": "จงหันไปทางทิศตะวันออกหรือตะวันตก พูดกับชาวมะดีนะฮ์และผู้ที่กิบละฮ์อยู่ทางใต้"}, {"ar": "الْمَرَاحِيضُ", "th": "พหูพจน์ของ มิรหาฎ คือที่ถ่ายทุกข์ เดิมคือที่ล้าง"}, {"ar": "نَنْحَرِفُ", "th": "เราเอียงตัวหลบไปจากทิศของห้องสุขาที่หันไปทางกะอ์บะฮ์"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["คืออบูอัยยูบ คอลิด บินซัยด์ อัลอันศอรีย์ อันนัจญารีย์ เป็นที่รู้จักด้วยชื่อเรียกอบูอัยยูบ เข้าร่วมสัตยาบันอัลอะเกาะบะฮ์ และท่านนบี ﷺ พักที่บ้านเขาเมื่อมาถึงมะดีนะฮ์ จนสร้างมัสยิดและบ้านของท่านเสร็จ ท่านผูกภราดรภาพระหว่างเขากับมุศอับ บินอุมัยร์", "เข้าร่วมสงครามบัดร์และหลังจากนั้น และการพิชิตต่าง ๆ ไม่เคยขาดสงครามใด นอกจากอยู่ในอีกสงครามหนึ่ง จนเสียชีวิตในสงครามกุสฏอนฏีนิยะฮ์ (คอนสแตนติโนเปิล) ในดินแดนโรมัน สมัยมุอาวิยะฮ์ ปี ฮ.ศ. 52"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกในหมวดวุฎูอ์ บทห้ามหันหน้าไปทางกิบละฮ์ขณะถ่ายอุจจาระหรือปัสสาวะ ยกเว้นในอาคาร เช่น กำแพงหรือสิ่งอื่น (140) และอีกสายในหมวดละหมาด บทกิบละฮ์ของชาวมะดีนะฮ์และชาวชาม (394) มุสลิม (264) อบูดาวูด (9) อัตติรมิซีย์ (8) อันนะสาอีย์ (1/22) อิบนุมาญะฮ์ (318) และอะห์มัด (38/506, 518, 551) ทั้งหมดผ่านอัซซุฮ์รีย์ จากอะฏออ์ บินยะซีด อัลลัยษีย์ จากอบูอัยยูบ (ร.ฎ.) ว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"เมื่อพวกท่านไปถ่ายทุกข์ ก็อย่าหันหน้าไปทางกิบละฮ์ขณะถ่ายอุจจาระหรือปัสสาวะ และอย่าหันหลังให้ แต่จงหันไปทางทิศตะวันออกหรือทิศตะวันตก\" อบูอัยยูบกล่าวว่า \"เราไปถึงชาม พบห้องสุขาที่สร้างหันไปทางกะอ์บะฮ์ เราจึงเอียงตัวหลบ และขออภัยโทษต่ออัลลอฮ์\" นี่เป็นสำนวนของอัลบุคอรีย์", "ผู้ที่รายงานจากอัซซุฮ์รีย์มีหลายคน ได้แก่ อิบนุอบีซิอ์บ ในอัลบุคอรีย์ สุฟยาน บินอุยัยนะฮ์ ในอัลบุคอรีย์ มุสลิม อบูดาวูด อันนะสาอีย์ และอัตติรมิซีย์ ยูนุส บินยะซีด ในอิบนุมาญะฮ์ และมะอ์มัร บินรอชิด ในอะห์มัด", "สำนวนในหนังสือเป็นของอบูดาวูด ซึ่งไม่มีคำว่า \"และอย่าหันหลังให้\" ในต้นฉบับ \"อัลบุลูฆ\" บางฉบับมีประโยคนี้ ผู้แต่งเห็นว่าถ้าอิบนุหะญัรกล่าวว่า \"และของนักบันทึกทั้งเจ็ด จากหะดีษอบูอัยยูบ แบบมัรฟูอ์...\" จะดีกว่า แต่เขาย่อไว้ หรือคำนี้ตกหล่นจากต้นฉบับ"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"เมื่อพวกท่านไปที่เฆาะอิฏ\" ในที่นี้คือที่ลุ่มที่ผู้คนไปถ่ายทุกข์ก่อนมีการสร้างห้องสุขา \"อย่าหันหน้าไปทางกิบละฮ์\" คือกะอ์บะฮ์หรือทิศของกะอ์บะฮ์ \"บิเฆาะอิฏ\" ในที่นี้คือสิ่งสกปรกที่ออกจากทวารหลัง", "\"แต่จงหันไปทางทิศตะวันออกหรือทิศตะวันตก\" พูดกับชาวมะดีนะฮ์และผู้ที่อยู่ในทิศเดียวกัน ที่เมื่อหันไปตะวันออกหรือตะวันตกจะพ้นจากกิบละฮ์ เพราะกิบละฮ์ของพวกเขาอยู่ทางใต้ เมื่อหันไปตะวันออกหรือตะวันตก กิบละฮ์จะอยู่ทางขวาหรือซ้ายของพวกเขา", "\"เราไปถึงชาม\" คือหลังจากพิชิต \"มะรอหีฎ\" พหูพจน์ของ \"มิรหาฎ\" คือที่ล้าง ในที่นี้คือที่ถ่ายทุกข์ ใน \"อัลมิศบาห์ อัลมุนีร\" ว่า \"เราะหัฎตุษษเษาบะ คือฉันซักผ้า มิรหาฎ (กัสเราะฮ์ที่มีม) คือที่ซัก แล้วใช้เป็นคำเลี่ยงหมายถึงที่ถ่ายทุกข์ เพราะเป็นที่ล้างสิ่งขับถ่าย\"", "\"เราเอียงตัวหลบ และขออภัยโทษต่ออัลลอฮ์\" คือเราเอียงตัวจากทิศของห้องสุขาที่หันไปทางกะอ์บะฮ์ และขออภัยโทษในที่นี้ อาจเพราะพวกเขาไม่ได้เปลี่ยนทิศห้องสุขาไปทางอื่นที่ไม่ใช่กิบละฮ์ หรือเพราะการเอียงตัวของพวกเขาไม่ได้ทำให้พ้นจากกิบละฮ์อย่างสมบูรณ์ เนื่องจากทำได้ยาก เพราะห้องสุขาหันไปทางนั้น"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "การหันหน้าหรือหันหลังให้กิบละฮ์", "points_th": ["หะดีษเป็นหลักฐานว่าห้ามหันหน้าหรือหันหลังให้กิบละฮ์ขณะปัสสาวะหรือถ่ายอุจจาระ และการห้ามนี้คือหะรอมตามนักวิชาการส่วนใหญ่ มีความขัดแย้งหลายทัศนะ ที่สำคัญที่สุดคือ", "ทัศนะแรก: ห้ามทั่วไป คือหะรอมที่จะหันหน้าหรือหันหลังให้กิบละฮ์ทั้งในที่โล่งและในอาคาร เป็นทัศนะของนักวิชาการกลุ่มหนึ่ง เป็นทัศนะที่รู้จักของมัซฮับหะนะฟีย์ และรายงานหนึ่งจากอิมามอะห์มัด ซึ่งอบูบักร อับดุลอะซีซเลือก และอิบนุตัยมียะฮ์ ศิษย์ของเขาอิบนุลก็อยยิม อิบนุลอะเราะบีย์ และอิบนุหัซม์เลือก อัชเชากานีย์ อัลมุบาร็อกฟูรีย์ (ผู้อธิบาย \"ญามิอ์ อัตติรมิซีย์\") และเชคมุหัมมัด บินอิบรอฮีม เห็นว่ามีน้ำหนักกว่า หลักฐานคือหะดีษอบูอัยยูบและหะดีษที่มีความหมายเดียวกัน ซึ่งระบุชัดว่าห้ามหันหน้าและหันหลัง และเพราะการกระทำของผู้รายงาน (ที่เอียงตัวหลบในห้องสุขาที่ชาม)", "ทัศนะที่สอง: ของมาลิก อัชชาฟิอีย์ และนักวิชาการกลุ่มหนึ่ง รวมทั้งอัลบุคอรีย์ ว่าหะรอมที่จะหันหน้าและหันหลังในที่โล่ง แต่อนุญาตในอาคาร เป็นรายงานหนึ่งจากอิมามอะห์มัดและเป็นมัซฮับ (ฮัมบะลีย์) อัศศ็อนอานีย์เห็นว่ามีน้ำหนักกว่า หลักฐานคือหะดีษอิบนุอุมัร (ร.ฎ.) ว่า \"วันหนึ่งฉันขึ้นไปบนบ้านของหัฟเศาะฮ์ เห็นท่านรสูลุลลอฮ์ ﷺ ถ่ายทุกข์ หันหน้าไปทางชาม หันหลังให้กะอ์บะฮ์\" และอีกรายงานว่า \"หันหน้าไปทางบัยตุลมักดิส\" (อัลบุคอรีย์ 148 มุสลิม 266) ผู้แต่งเห็นว่าอิบนุหะญัรควรยกหะดีษนี้ไว้หลังหะดีษอบูอัยยูบ เหมือนที่อิบนุดะกีกิลอีดทำใน \"อัลอิลมาม\" และอัลมักดิซีย์ใน \"อัลอุมดะฮ์\" เพื่อให้รู้หลักฐานของผู้ที่มีทัศนะตามนั้น และคำตอบของผู้ที่เห็นต่าง", "พวกเขากล่าวว่า หะดีษนี้เป็นหลักฐานว่าอนุญาตในอาคาร เพราะการกระทำของท่านรสูล ﷺ อธิบายคำพูดของท่าน เมื่อท่านห้ามสิ่งหนึ่งแล้วทำเอง แสดงว่าการห้ามนั้นไม่ใช่หะรอม แต่เป็นมักรูฮ์ และเมื่อท่านสั่งสิ่งหนึ่งแล้วละเว้น แสดงว่าไม่ใช่วาญิบ แต่เป็นการส่งเสริม หะดีษอิบนุอุมัรมีเฉพาะการหันหลัง การหันหน้าจึงนับรวมด้วยการกิยาส หรือด้วยหะดีษญาบิร (ร.ฎ.) ว่า \"ท่านรสูลุลลอฮ์ ﷺ ห้ามเราหันหลังหรือหันหน้าให้กิบละฮ์ด้วยอวัยวะเพศเมื่อเราปัสสาวะ แล้วฉันเห็นท่านก่อนท่านเสียชีวิตหนึ่งปี ปัสสาวะหันหน้าไปทางกิบละฮ์\" (อบูดาวูด 13 อัตติรมิซีย์ 9 อิบนุมาญะฮ์ 325 อะห์มัด ผ่านอิบนุอิสหาก สายนี้หะซันเพราะอิบนุอิสหาก อัตติรมิซีย์ว่าหะซัน อันนะวะวีย์ก็ว่าหะซัน และอิบนุลมุลักกินยกว่าอัลบุคอรีย์ว่าศ่อฮีห์ อิบนุลก็อยยิมว่า ถ้าอัลบุคอรีย์หมายถึงถูกต้องจากอิบนุอิสหาก ก็ไม่ได้บ่งว่าตัวหะดีษถูกต้อง ถ้าหมายถึงถูกต้องในตัว ก็เป็นเหตุการณ์เฉพาะที่หุก่มเหมือนหะดีษอิบนุอุมัร)", "ฝ่ายแรกตอบหะดีษอิบนุอุมัรว่า เป็นการกระทำ และการกระทำของท่าน ﷺ ไม่ขัดกับคำพูดที่พูดกับประชาชาติทั้งหมด เพราะการกระทำมีความเป็นไปได้หลายทาง จึงไม่หักล้างคำห้ามที่ชัดเจน (1) อาจเกิดก่อนการห้าม คำห้ามจึงมีน้ำหนักกว่า เพราะเป็นสิ่งที่เปลี่ยนจากหลักเดิมคือการอนุญาต (2) อาจเป็นเฉพาะท่านนบี ﷺ คนอื่นจึงไม่นับรวม และความเป็นไปได้อื่นที่อิบนุลก็อยยิมกล่าว รวมหกข้อ บางข้ออ่อน เช่น ที่ว่าเกิดก่อนการห้าม ซึ่งเป็นเพียงความเป็นไปได้ จึงไม่เพียงพอ เพราะไม่มีหลักฐาน ส่วนการอ้างว่าเป็นเฉพาะท่านนบีก็ตกไป เพราะหลักเดิมคือการเอาแบบอย่างท่าน ﷺ ในการกระทำ ตราบใดที่ไม่มีหลักฐานว่าเป็นเฉพาะท่าน แต่เมื่อหลักฐานมีความเป็นไปได้หลายทาง การใช้เป็นหลักฐานก็อ่อน เพราะไม่สามารถยืนยันได้ว่าเป็นข้อใด จึงไม่ละทิ้งหะดีษศ่อฮีห์ที่ชัดเจนเพราะเรื่องเช่นนี้", "และตอบหะดีษญาบิรว่า มีอิบนุอิสหาก ซึ่งแม้ไม่มีปัญหา แต่ไม่เทียบเท่าผู้ที่รายงานหะดีษห้ามทั่วไป ซึ่งเป็นหะดีษในเศาะฮีห์ทั้งสอง เช่น หะดีษอบูอัยยูบที่นักบันทึกทั้งเจ็ดบันทึก อีกทั้งหะดีษนี้เป็นการเล่าการกระทำซึ่งไม่มีความหมายกว้าง และอาจเป็นเพราะมีเหตุจำเป็น และไม่ได้บ่งว่าอยู่ในอาคาร จะให้มาก่อนตัวบทศ่อฮีห์ที่ชัดเจนเรื่องการห้ามได้อย่างไร", "ผู้แต่งกล่าวว่า \"ที่ชัดเจนสำหรับฉัน วัลลอฮุอะอ์ลัม คือทัศนะแรก\" ด้วยเหตุผลสองประการ (1) คำห้ามมาด้วยคำพูดที่ชัดเจน พูดกับประชาชาติทั้งหมด และไม่มีสิ่งใดที่เปลี่ยนแปลงในส่วนของประชาชาติของท่าน ﷺ ทั้งแบบทั่วไปและบางส่วน และมีเศาะหาบะฮ์จำนวนหนึ่งรายงาน เช่น อบูอัยยูบในเศาะฮีห์ทั้งสอง สัลมาน อัลฟาริสีย์ และอบูฮุร็อยเราะฮ์ในมุสลิม และคนอื่น ส่วนหลักฐานที่ขัดแย้งนั้นหากไม่มีข้อบกพร่องในสาย ก็อ่อนในการบ่งชี้ (2) เหตุผลของการห้ามคือการให้เกียรติกิบละฮ์ ซึ่งเป็นความหมายที่เหมาะกับการห้ามจึงเป็นเหตุผลของมัน และไม่ต่างกันระหว่างที่โล่งกับอาคาร ถ้าสิ่งกั้นเพียงพอให้อนุญาตในอาคาร ในที่โล่งก็มีภูเขาและหุบเขาซึ่งเพียงพอกว่า", "อัชเชากานีย์กล่าวว่า \"ที่ยุติธรรมคือตัดสินว่าห้ามโดยทั่วไป และยืนยันว่าหะรอม จนกว่าจะมีหลักฐานที่ใช้ได้สำหรับการยกเลิก การจำกัด หรือการหักล้าง ซึ่งเราไม่พบเลย\""]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "การหันหน้าไปทางดวงอาทิตย์หรือดวงจันทร์", "points_th": ["หะดีษเป็นหลักฐานว่าอนุญาตให้หันหน้าไปทางดวงอาทิตย์หรือดวงจันทร์ขณะปัสสาวะหรือถ่ายอุจจาระ ด้วยสองเหตุผล (1) ท่านห้ามพวกเขาหันหน้าและหันหลังให้กิบละฮ์ และไม่ได้ห้ามทิศอื่น (2) คำว่า \"จงหันไปทางทิศตะวันออกหรือทิศตะวันตก\" มีความหมายกว้างทุกเวลา เมื่อหันไปตะวันออกในเวลาที่ดวงอาทิตย์หรือดวงจันทร์ขึ้น ก็หันหน้าไปทางนั้น และเมื่อหันไปตะวันตกในเวลาที่ใกล้ตก ก็หันหน้าไปทางนั้น", "ส่วนที่มีในตำราฟิกฮ์ว่าเป็นมักรูฮ์ที่จะหันหน้าไปทางดวงอาทิตย์และดวงจันทร์ เพราะมีรัศมีของอัลลอฮ์ ผู้แต่งเห็นว่าไม่ถูกต้องด้วยสองเหตุผล (1) แสงในดวงอาทิตย์และดวงจันทร์ไม่ใช่รัศมีของอัลลอฮ์ที่เป็นคุณลักษณะของพระองค์ แต่เป็นแสงที่ถูกสร้าง (2) แสงนี้ไม่ได้มีเฉพาะในทั้งสอง แต่มีในดวงดาวอื่นด้วย ก็จะต้องเป็นมักรูฮ์ที่จะหันหน้าไปทางดวงดาวด้วย ซึ่งไม่มีใครกล่าวเช่นนั้น"]}, {"wajh": 6, "type": "fawaid", "heading_ar": null, "heading_th": "การให้เกียรติกะอ์บะฮ์", "points_th": ["หะดีษเป็นหลักฐานถึงการให้เกียรติและเคารพกะอ์บะฮ์ เพราะเป็นบ้านของอัลลอฮ์ ซึ่งพระองค์ทรงพาดพิงถึงพระองค์เอง ดังอายะฮ์ \"และจงทำให้บ้านของข้าสะอาด\" (อัลหัจญ์: 26) กะอ์บะฮ์มีสถานะยิ่งใหญ่ในหัวใจของมุสลิม อัลลอฮ์ทรงกำหนดให้วาญิบต้องหันหน้าไปในละหมาด ซึ่งเป็นสภาพที่สมบูรณ์ที่สุดของบ่าว เพราะเป็นการเชื่อมระหว่างบ่าวกับพระผู้อภิบาล และทรงให้กะอ์บะฮ์พ้นจากการเป็นทิศที่พวกเขาหันหน้าไปขณะปัสสาวะหรือถ่ายอุจจาระ หรืออยู่ด้านหลังพวกเขา เพื่อให้เกียรติและเคารพ"]}], "tags_th": ["กิบละฮ์", "มารยาทการถ่ายทุกข์", "กะอ์บะฮ์", "อบูอัยยูบ", "หะดีษขัดแย้ง"]}, {"id": "v1-h098", "volume": 1, "bab": "qada-hajah", "topic_ar": "وجوب الاستتار عند قضاء الحاجة", "topic_th": "จำเป็นต้องปกปิดตัวเมื่อถ่ายทุกข์", "pages": [394, 396], "hadith": [{"no": 98, "matn_ar": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا أَنَّ النَّبِيَّ ﷺ قَالَ: «مَنْ أَتَى الْغَائِطَ فَلْيَسْتَتِرْ». رَوَاهُ أَبُو دَاوُدَ.", "translation_th": "จากอาอิชะฮ์ (ร.ฎ.) ว่า ท่านนบี ﷺ กล่าวว่า \"ผู้ใดไปถ่ายทุกข์ ก็จงปกปิดตัว\" รายงานโดยอบูดาวูด", "grade_th": "ฎออีฟ (อ่อน) แต่ความหมายถูกต้อง ผู้แต่งเห็นว่าแท้จริงเป็นหะดีษอบูฮุร็อยเราะฮ์ ไม่ใช่อาอิชะฮ์ (อิบนุหะญัรใน \"อัลฟัตห์\" ว่าหะซัน)"}], "key_rulings_th": ["ศาสนาต้องการให้ปกปิดตัวจากสายตาผู้คนเมื่อถ่ายทุกข์ ด้วยกำแพง เนินทราย หรือสิ่งอื่น", "แม้หะดีษจะอ่อน แต่ความหมายถูกต้อง หลักทั่วไปของศาสนาบ่งว่าเป็นสิ่งที่ต้องการ และเป็นการเอาแบบอย่างท่านนบี ﷺ ที่ไปไกลเมื่อจะถ่ายทุกข์", "การปกปิดรวมถึงการไม่ยกผ้าขึ้นจนกว่าจะใกล้พื้น และต้องรักษาเอาเราะฮ์ไว้ นอกจากต่อภรรยาหรือทาสหญิง"], "vocab": [{"ar": "أَتَى الْغَائِطَ", "th": "ไปยังที่ถ่ายทุกข์"}, {"ar": "فَلْيَسْتَتِرْ", "th": "จงปกปิดตัวจากสายตาผู้คน"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อบูดาวูดบันทึก (35) หมวดความสะอาด บทการปกปิดตัวในห้องสุขา ผ่านเษาร์ บินยะซีด จากอัลหุศ็อยน์ อัลหุบรอนีย์ จากอบูสะอีด อัลหุบรอนีย์ จากอบูฮุร็อยเราะฮ์ จากท่านนบี ﷺ ว่า \"...และผู้ใดไปถ่ายทุกข์ ก็จงปกปิดตัว ถ้าไม่พบสิ่งใดนอกจากรวบทรายมาเป็นกอง ก็จงหันหลังให้มัน เพราะชัยฏอนเล่นกับก้นของลูกหลานอาดัม ผู้ใดทำก็ดีแล้ว ผู้ใดไม่ทำก็ไม่เป็นไร\" อบูดาวูดกล่าวว่า อบูอาศิมรายงานจากเษาร์ว่า \"หุศ็อยน์ อัลหิมยะรีย์\" และอับดุลมะลิก บินอัศศ็อบบาหรายงานจากเษาร์ว่า \"อบูสะอีด อัลค็อยร์\" และอบูดาวูดว่า อบูสะอีด อัลค็อยร์เป็นเศาะหาบะฮ์ของท่านนบี ﷺ", "ผู้แต่งว่า จากตรงนี้เห็นชัดว่าการระบุว่าเป็นหะดีษของอาอิชะฮ์เป็นความผิดพลาดของอิบนุหะญัร ที่ถูกคือเป็นหะดีษของอบูฮุร็อยเราะฮ์ (ร.ฎ.)", "สายรายงานนี้อ่อน เพราะมาจากหุศ็อยน์ อัลหุบรอนีย์ อัษษะฮะบีย์ว่า \"หุศ็อยน์ อัลหิมยะรีย์ อัลหุบรอนีย์ ไม่เป็นที่รู้จัก อยู่ในสมัยตาบิอีน อบูดาวูดและอิบนุมาญะฮ์บันทึกหะดีษของเขา\" อิบนุหิบบานยกไว้ใน \"อัษษิกอต\" อบูซุรอะฮ์ว่า \"ชัยค์\" (คือไม่ใช่หลักฐาน แต่เขียนหะดีษของเขาไว้ใช้ประกอบได้) และอิบนุหะญัรใน \"อัตตักรีบ\" ว่า \"มัจญ์ฮูล\" ส่วนอบูสะอีด อัลหุบรอนีย์มีความขัดแย้ง บางคนว่าเป็นเศาะหาบะฮ์ ซึ่งไม่ถูกต้อง เขาไม่เป็นที่รู้จัก อิบนุหิบบานว่าเชื่อถือได้", "อิบนุหะญัรไม่ได้ระบุว่าอ่อนตามปกติของเขา เพราะเขาว่าหะซันใน \"อัลฟัตห์\" ดังที่กล่าวแล้วที่หะดีษสัลมาน และอิบนุลมุลักกินยกการตัดสินว่าศ่อฮีห์จากอิบนุหิบบานและอัลหากิม"]}, {"wajh": 2, "type": "fiqh", "heading_ar": null, "heading_th": "การปกปิดตัวจากสายตาผู้คน", "points_th": ["หะดีษเป็นหลักฐานว่าการปกปิดตัวจากสายตาผู้คนเมื่อถ่ายทุกข์เป็นสิ่งที่ต้องการ และได้กล่าวแล้วว่าท่านนบี ﷺ เมื่อจะถ่ายทุกข์ ท่านไปไกล ซึ่งเพื่อการปกปิด มิฉะนั้นการปกปิดกับการแยกตัวเป็นคนละเรื่องกัน แต่สองอย่างนี้เสริมกัน", "หะดีษแม้จะอ่อน แต่ความหมายถูกต้อง หลักทั่วไปของศาสนาบ่งว่าเป็นสิ่งที่ต้องการ และเป็นการเอาแบบอย่างท่านนบี ﷺ การปกปิดทำได้ด้วยกำแพง เนินทราย หรือสิ่งอื่นที่วางไว้ด้านหลัง เพื่อไม่ให้ใครเห็น", "ส่วนหนึ่งของการปกปิดคือที่มาในหะดีษอิบนุอุมัร (ร.ฎ.) ว่า \"ท่านรสูลุลลอฮ์ ﷺ เมื่อจะถ่ายทุกข์ ท่านจะไปให้ห่าง และไม่ยกผ้าขึ้นจนกว่าจะใกล้พื้น\" (อบูดาวูด 14 อัลบัยฮะกีย์ ผู้แต่งว่าสายอ่อนเพราะชายที่ไม่ระบุชื่อ อบูดาวูดและอัตติรมิซีย์บันทึกจากอะนัสทำนองเดียวกัน อบูดาวูดว่าอ่อน อัลบุคอรีย์ว่าทั้งสองเป็นมุรสัล แต่อัลอัลบานีย์ยกไว้ใน \"อัศเศาะฮีหะฮ์\")", "และในหะดีษบะฮ์ซ์ บินหะกีม จากบิดา จากปู่ว่า \"ฉันถามว่า โอ้ท่านรสูลุลลอฮ์ เอาเราะฮ์ของเรา ส่วนไหนที่เราเปิดได้และส่วนไหนที่ต้องปกปิด ท่านตอบว่า จงรักษาเอาเราะฮ์ของท่าน นอกจากต่อภรรยาและทาสหญิงของท่าน ฉันถามว่า ถ้าผู้คนอยู่ปะปนกันล่ะ ท่านตอบว่า ถ้าท่านทำได้ที่จะไม่ให้ใครเห็นมัน ก็อย่าให้ใครเห็น ฉันถามว่า ถ้าคนหนึ่งในหมู่เราอยู่คนเดียวล่ะ ท่านตอบว่า อัลลอฮ์ทรงสมควรยิ่งกว่าที่จะละอายต่อพระองค์\" (อบูดาวูด 4017 อัตติรมิซีย์ 2794 อิบนุมาญะฮ์ 1920 อะห์มัด อัตติรมิซีย์ว่าหะซัน)"]}], "tags_th": ["มารยาทการถ่ายทุกข์", "ปกปิดเอาเราะฮ์", "ความละอาย", "ข้อผิดพลาดในการระบุผู้รายงาน"]}, {"id": "v1-h099", "volume": 1, "bab": "qada-hajah", "topic_ar": "ما يقال عند الخروج من الخلاء", "topic_th": "สิ่งที่กล่าวเมื่อออกจากห้องสุขา", "pages": [397, 399], "hadith": [{"no": 99, "matn_ar": "وَعَنْهَا أَنَّ النَّبِيَّ ﷺ كَانَ إِذَا خَرَجَ مِنَ الْغَائِطِ قَالَ: «غُفْرَانَكَ». أَخْرَجَهُ الْخَمْسَةُ. وَصَحَّحَهُ أَبُو حَاتِمٍ، وَالْحَاكِمُ.", "translation_th": "และจากนาง (อาอิชะฮ์ (ร.ฎ.)) ว่า ท่านนบี ﷺ เมื่อออกจากที่ถ่ายทุกข์ ท่านกล่าวว่า \"(ข้าพระองค์ขอ) การอภัยโทษจากพระองค์\" บันทึกโดยนักบันทึกทั้งห้า อบูหาติมและอัลหากิมตัดสินว่าศ่อฮีห์", "grade_th": "หะซัน (ผู้แต่ง) อบูหาติม อัลหากิม อันนะวะวีย์ อิบนุหะญัร และอัลอัลบานีย์ว่าศ่อฮีห์"}], "key_rulings_th": ["ส่งเสริมให้กล่าว \"ฆุฟรอนะกะ\" หลังถ่ายทุกข์และออกจากที่นั้น ถ้าอยู่ในอาคารให้กล่าวเมื่อออกมา ถ้าอยู่กลางที่โล่งให้กล่าวเมื่อออกจากที่ที่ถ่ายทุกข์", "เป็นซุนนะฮ์ ไม่ใช่วาญิบ เพราะเป็นเพียงการกระทำเพื่อความใกล้ชิดอัลลอฮ์", "เหตุผลที่ผู้แต่งเห็นว่าชัดเจนกว่า: เมื่อร่างกายเบาจากสิ่งที่ทำร้าย ก็ระลึกถึงความหนักของบาป จึงขอพระองค์ให้เบาจากบาปเหมือนที่ทรงทำให้ร่างกายเบา", "ดุอาอ์อื่นเมื่อออกจากห้องสุขา เช่น \"อัลหัมดุลิลลาฮิลละซี อัซฮะบะ อันนิลอะซา วะอาฟานี\" มาในหะดีษอ่อน และหะดีษศ่อฮีห์เพียงพอแล้ว"], "vocab": [{"ar": "غُفْرَانَكَ", "th": "ข้าพระองค์ขอการอภัยโทษจากพระองค์ (กรรมของกริยาที่ละไว้)"}, {"ar": "الْمَغْفِرَةُ", "th": "การปกปิดบาปและการให้อภัย"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["นักบันทึกทั้งห้าบันทึก คือ อบูดาวูด (30) หมวดความสะอาด อัตติรมิซีย์ (7) อันนะสาอีย์ใน \"อะมะลุลเยามิ วัลลัยละฮ์\" (79) ซึ่งอยู่ใน \"อัสสุนันอัลกุบรอ\" (6/24) อิบนุมาญะฮ์ (300) และอะห์มัด (42/124) และอิบนุหิบบาน (4/291) และอัลหากิม (1/185) ทั้งหมดผ่านอิสรออีล บินยูนุส จากยูสุฟ บินอบีบุรดะฮ์ จากบิดา ว่าอาอิชะฮ์ (ร.ฎ.) เล่าให้ฟัง", "ผู้แต่งว่าสายรายงานนี้หะซัน ยูสุฟ บินอบีบุรดะฮ์ อัลอิจลีย์และอัลหากิมว่าเชื่อถือได้ อิบนุหิบบานยกไว้ใน \"อัษษิกอต\" อัษษะฮะบีย์ใน \"อัลกาชิฟ\" ว่า \"เชื่อถือได้\" และอิบนุหะญัรใน \"อัตตักรีบ\" ว่า \"มักบูล\" อัตติรมิซีย์ว่า \"หะซันเฆาะรีบ เราไม่รู้จักนอกจากจากหะดีษของอิสรออีล จากยูสุฟ บินอบีบุรดะฮ์\" เชคอะห์มัด ชากิรว่า \"ความเฆาะรีบของมันเพราะอิสรออีลรายงานคนเดียว และอิสรออีลเชื่อถือได้ เป็นหลักฐาน\"", "อัลหากิมว่า \"หะดีษนี้ศ่อฮีห์ ยูสุฟ บินอบีบุรดะฮ์เป็นผู้เชื่อถือได้จากตระกูลอบูมูซา เราไม่พบใครวิจารณ์เขา และมีการระบุว่าบิดาของเขาได้ยินจากอาอิชะฮ์\" ส่วนการที่อบูหาติมว่าศ่อฮีห์ บุตรของเขายกมาว่า \"ฉันได้ยินบิดากล่าวว่า สิ่งที่ถูกต้องที่สุดในบทนี้ คือบทดุอาอ์เมื่อออกจากห้องสุขา คือหะดีษอาอิชะฮ์\" ผู้ที่ตัดสินว่าศ่อฮีห์ยังมี อันนะวะวีย์ อิบนุหะญัร และอัลอัลบานีย์"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ฆุฟรอนะกะ\" คือข้าพระองค์ขอการอภัยโทษจากพระองค์ เป็นกรรมของกริยาที่ละไว้ ดังอายะฮ์ \"(เราขอ) การอภัยโทษจากพระองค์ โอ้พระผู้อภิบาลของเรา\" (อัลบะเกาะเราะฮ์: 285) คือโปรดประทานการอภัยโทษแก่เรา การอภัยโทษคือการปกปิดบาปและให้อภัย"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "ดุอาอ์เมื่อออกจากห้องสุขาและเหตุผล", "points_th": ["หะดีษเป็นหลักฐานว่าส่งเสริมให้กล่าว \"ฆุฟรอนะกะ\" หลังถ่ายทุกข์และออกจากที่นั้น ถ้าอยู่ในอาคารให้กล่าวเมื่อออกมา ถ้าอยู่กลางที่โล่งให้กล่าวเมื่อออกจากที่ที่ถ่ายทุกข์ เหตุที่เป็นเพียงการส่งเสริม เพราะเป็นเพียงการกระทำเพื่อความใกล้ชิดอัลลอฮ์ จึงเป็นการส่งเสริม ตามทัศนะที่ชัดเจนที่สุดในวิชาอุศูล", "ความเหมาะสมของดุอาอ์นี้ คือเมื่อร่างกายของมนุษย์เบาลงหลังถ่ายทุกข์ และสบายจากสิ่งที่ทำร้าย เขาก็ระลึกถึงความหนักของบาปและผลของมัน จึงขอต่อพระผู้อภิบาลให้ทำให้เขาเบาจากสิ่งที่ทำร้ายของบาป เหมือนที่ทรงโปรดทำให้เขาเบาจากสิ่งที่ทำร้ายร่างกาย สิ่งขับถ่ายทำให้ร่างกายหนักและเจ็บ บาปทำให้หัวใจหนักและเจ็บ เป็นการระลึกถึงสิ่งหนึ่งด้วยสิ่งที่คล้ายกัน อิบนุลก็อยยิมชี้ถึงความหมายนี้", "อัลบะเฆาะวีย์ว่า \"เหมือนท่านเห็นว่าการละการรำลึกถึงอัลลอฮ์ในช่วงที่อยู่ในห้องสุขาเป็นความบกพร่อง จึงชดเชยด้วยการขออภัยโทษ\" อัลเคาะฏฏอบีย์กล่าวก่อนหน้าเขา และอันนะวะวีย์ยกมา", "ผู้แต่งเห็นว่าเหตุผลแรกชัดเจนกว่า ส่วนเหตุผลที่สองยังต้องพิจารณา เพราะท่านงดการรำลึกถึงอัลลอฮ์ในที่นั้นตามคำสั่งของอัลลอฮ์ เมื่อเป็นเช่นนั้น จะกล่าวว่าท่านเผลอจากการรำลึกไม่ได้ แต่ท่านปฏิบัติตามคำสั่งเพื่อเป็นอิบาดะฮ์ต่ออัลลอฮ์ เหมือนหญิงมีประจำเดือนที่ไม่ละหมาดและไม่ถือศีลอด และไม่มีซุนนะฮ์ให้นางขออภัยโทษต่ออัลลอฮ์เมื่อสะอาดแล้ว เพราะการละเว้นนั้น"]}, {"wajh": 4, "type": "fawaid", "heading_ar": null, "heading_th": "หะดีษอ่อนเรื่องดุอาอ์เมื่อออกจากห้องสุขา", "points_th": ["มีหะดีษหลายบทที่นักฟิกฮ์ยกไว้ในเรื่องนี้ แต่อ่อน อบูหาติมจึงกล่าวว่า \"สิ่งที่ถูกต้องที่สุดในเรื่องนี้คือหะดีษอาอิชะฮ์\" ดังกล่าวแล้ว", "ในนั้นมีหะดีษอะนัส (ร.ฎ.) ว่า ท่านรสูลุลลอฮ์ ﷺ เมื่อออกจากห้องสุขา ท่านกล่าวว่า \"มวลการสรรเสริญเป็นของอัลลอฮ์ ผู้ทรงขจัดสิ่งที่ทำร้ายออกจากฉัน และทรงทำให้ฉันปลอดภัย\" (อิบนุมาญะฮ์ 301 สายอ่อน เพราะอิสมาอีล บินมูซา อัลบัศรีย์ ผู้ที่อบูซุรอะฮ์ว่าอ่อน อะห์มัดว่ามุนกัรอัลหะดีษ และอัลบูศีรีย์ว่า \"เห็นพ้องกันว่าอ่อน\") และในหะดีษศ่อฮีห์ก็เพียงพอแล้วโดยไม่ต้องใช้หะดีษอ่อน"]}], "tags_th": ["ดุอาอ์", "ห้องสุขา", "การขออภัยโทษ", "อิสติฆฟาร"]}, {"id": "v1-h100", "volume": 1, "bab": "qada-hajah", "topic_ar": "وجوب الاستنجاء بثلاثة أحجار", "topic_th": "จำเป็นต้องชำระด้วยก้อนหินสามก้อน", "pages": [400, 404], "hadith": [{"no": 100, "matn_ar": "وَعَنِ ابْنِ مَسْعُودٍ رَضِيَ اللهُ عَنْهُ قَالَ: أَتَى النَّبِيُّ ﷺ الْغَائِطَ، فَأَمَرَنِي أَنْ آتِيَهُ بِثَلَاثَةِ أَحْجَارٍ، فَوَجَدْتُ حَجَرَيْنِ، وَلَمْ أَجِدْ ثَالِثًا، فَأَتَيْتُهُ بِرَوْثَةٍ، فَأَخَذَهُمَا وَأَلْقَى الرَّوْثَةَ، وَقَالَ: «هَذَا رِكْسٌ». أَخْرَجَهُ الْبُخَارِيُّ، زَادَ أَحْمَدُ، وَالدَّارَقُطْنِيُّ: «ائْتِنِي بِغَيْرِهَا».", "translation_th": "และจากอิบนุมัสอูด (ร.ฎ.) กล่าวว่า ท่านนบี ﷺ ไปถ่ายทุกข์ แล้วสั่งให้ฉันนำก้อนหินสามก้อนมาให้ท่าน ฉันพบสองก้อน และหาก้อนที่สามไม่พบ จึงนำมูลสัตว์แห้งก้อนหนึ่งมาให้ ท่านรับก้อนหินสองก้อนไว้ และโยนมูลสัตว์ทิ้ง แล้วกล่าวว่า \"นี่เป็นสิ่งสกปรก\" บันทึกโดยอัลบุคอรีย์ อะห์มัดและอัดดารุกุฏนีย์เพิ่มว่า \"จงนำก้อนอื่นมาให้ฉัน\"", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์) ส่วนเพิ่มของอะห์มัดศ่อฮีห์ หากอบูอิสหากได้ยินจากอัลเกาะมะฮ์จริง"}], "key_rulings_th": ["การชำระด้วยก้อนหินต้องไม่น้อยกว่าสามก้อน เป็นทัศนะของชาฟิอีย์และฮัมบะลีย์ และผู้แต่งเห็นว่ามีน้ำหนักกว่า", "แม้การขจัดนะญิสจะมีเหตุผลที่เข้าใจได้คือความสะอาด แต่ศาสนากำหนดจำนวนสามไว้ จึงต้องยึดตาม และมีหลักฐานทั้งคำพูดและการกระทำของท่านนบี ﷺ", "หะนะฟีย์และมาลิกีย์ว่าสองก้อนก็พอ เพราะท่านไม่ได้ขอก้อนที่สาม ผู้แต่งตอบว่ามีรายงานว่าท่านขอก้อนที่สาม (\"จงนำก้อนอื่นมาให้ฉัน\")", "ห้ามชำระด้วยมูลสัตว์ เพราะเป็นสิ่งสกปรก"], "vocab": [{"ar": "أَتَى الْغَائِطَ", "th": "ไปยังที่ลุ่มเพื่อถ่ายทุกข์"}, {"ar": "رَوْثَةٌ", "th": "มูลของสัตว์มีกีบ เช่น ม้าและลา"}, {"ar": "رِكْسٌ", "th": "สิ่งสกปรก (ริจส์) หรือเหมือนมูลสัตว์ เพราะกลับจากสภาพอาหารเป็นมูล"}, {"ar": "فَلْيَسْتَطِبْ", "th": "จงชำระ (อิสติฏอบะฮ์ = อิสตินญาอ์)"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["คืออับดุลลอฮ์ บินมัสอูด บินฆอฟิล บินหะบีบ อัลฮุซะลีย์ (ร.ฎ.) เป็นชายคนที่หกที่รับอิสลาม อพยพสองครั้ง เข้าร่วมสงครามบัดร์และหลังจากนั้น ช่วงต้นอิสลามท่านนบี ﷺ กล่าวแก่เขาว่า \"ท่านเป็นเด็กหนุ่มที่ได้รับการสอนแล้ว\" (อะห์มัด สายหะซัน) อัลบุคอรีย์รายงานว่าเขากล่าวว่า \"ขอสาบานต่ออัลลอฮ์ ฉันรับมาจากปากท่านรสูลุลลอฮ์ ﷺ เจ็ดสิบกว่าซูเราะฮ์\" และท่านนบี ﷺ กล่าวว่า \"ผู้ใดชอบที่จะอ่านอัลกุรอานสด ๆ เหมือนที่ถูกประทานลงมา ก็จงอ่านตามการอ่านของอิบนุอุมมิอับด์\" (อะห์มัด อิบนุมาญะฮ์ สายหะซัน และมีหลักฐานสนับสนุนจนถึงระดับศ่อฮีห์)", "เขาเป็นหนึ่งในผู้รับใช้ท่านนบี ﷺ ดูแลสิวาก รองเท้า และหมอนของท่าน หุซัยฟะฮ์ (ร.ฎ.) กล่าวว่า \"ฉันไม่รู้จักใครที่มีความนอบน้อม แนวทาง และบุคลิกใกล้เคียงท่านนบี ﷺ มากกว่าอิบนุอุมมิอับด์\" (อัลบุคอรีย์)", "เขาเป็นผู้พิพากษาและดูแลคลังที่กูฟะฮ์ในสมัยอุมัร (ร.ฎ.) และช่วงต้นคิลาฟะฮ์ของอุษมาน (ร.ฎ.) แล้วอุษมานเรียกเขากลับมะดีนะฮ์ และเขาเสียชีวิตที่นั่นปี ฮ.ศ. 32"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกในหมวดวุฎูอ์ บทห้ามชำระด้วยมูลสัตว์ (156) ผ่านซุฮัยร์ บินมุอาวิยะฮ์ จากอบูอิสหาก อัสสะบีอีย์ ว่า \"ไม่ใช่อบูอุบัยดะฮ์ที่เล่า แต่อับดุรเราะห์มาน บินอัลอัสวัดเล่าจากบิดาของเขา ว่าเขาได้ยินอับดุลลอฮ์กล่าวว่า...\" แล้วอัลบุคอรีย์กล่าวว่า \"และอิบรอฮีม บินยูสุฟ กล่าวจากบิดา จากอบูอิสหากว่า อับดุรเราะห์มานเล่าให้ฉันฟัง...\" อิบรอฮีมคือหลานของอบูอิสหาก อิบนุหะญัรว่า \"ศอดูก มีความเข้าใจผิดบ้าง\" กลุ่มหนึ่งรายงานจากซุฮัยร์ ได้แก่ ยะห์ยา อัลก็อฏฏอน อะห์มัด บินยูนุส ยะห์ยา บินอาดัม อบูนุอัยม์ อัลหะสัน บินมูซา และคนอื่น", "อิบนุหะญัรกล่าวว่า อบูอิสหากเลี่ยงการรายงานจากอบูอุบัยดะฮ์ ไปรายงานจากอับดุรเราะห์มาน ทั้งที่สายของอบูอุบัยดะฮ์สูงกว่า เพราะอบูอุบัยดะฮ์ไม่ได้ยินจากบิดาของเขาตามทัศนะที่ถูกต้อง จึงเป็นสายขาด ส่วนสายของอับดุรเราะห์มานต่อเนื่อง จุดประสงค์ของอัลบุคอรีย์ที่ยกคำว่า \"และอิบรอฮีมกล่าว...\" คือตอบโต้ผู้ที่อ้างว่าอบูอิสหากทำตัดลีสในหะดีษนี้ อัลหากิมยกจากอบูอิสหาก อัชชาซะกูนีย์ว่า \"ฉันไม่เคยได้ยินตัดลีสที่แปลกและแนบเนียนกว่านี้ เขาว่า อบูอุบัยดะฮ์ไม่ได้เล่าให้ฉันฟัง แต่อับดุรเราะห์มานจากคนนั้น จากคนนั้น โดยไม่ได้กล่าวว่าเล่าให้ฉันฟัง\" หะดีษนี้จึงเลยไปและแพร่หลาย", "อัตติรมิซีย์และอัดดารุกุฏนีย์ระบุว่าหะดีษนี้มีความสับสน (อิฎฏิร็อบ) เพราะอบูอิสหากรายงานหลายรูปแบบ อัดดารุกุฏนีย์เลือกรายงานของซุฮัยร์จากอบูอิสหาก ซึ่งอัลบุคอรีย์บันทึก แล้วกล่าวว่า \"ในใจยังมีอะไรอยู่ เพราะความขัดแย้งมากที่อบูอิสหาก\" ส่วนอัตติรมิซีย์เลือกรายงานของอิสรออีลจากอบูอิสหาก จากอบูอุบัยดะฮ์ จากอับดุลลอฮ์ และว่ารายงานของซุฮัยร์อ่อน เพราะซุฮัยร์ได้ยินจากอบูอิสหากช่วงหลัง ขณะที่อบูอิสหากความจำสับสนแล้ว", "ผู้แต่งเห็นว่าที่ถูกอยู่กับอัลบุคอรีย์ เพราะแม้สมมุติว่าซุฮัยร์ได้ยินจากอบูอิสหากช่วงหลัง ก็มีผู้รายงานสนับสนุนดังที่อิบนุหะญัรกล่าว คือยูสุฟ บินอิสหาก บินอบีอิสหาก อิบนุอุยัยนะฮ์ว่า \"ในบรรดาลูกหลานของอบูอิสหาก ไม่มีใครจำได้ดีกว่าเขา\" และอิสรออีลก็ได้ยินจากอบูอิสหากช่วงหลังเช่นกัน ตามที่อิมามอะห์มัดกล่าว และอบูดาวูดกล่าว (ใน \"สุอาลาต อัลอาญุรรีย์\") ว่าซุฮัยร์เหนือกว่าอิสรออีลมาก อิบนุหะญัรใน \"อัลมุก็อดดิมะฮ์\" ปฏิเสธความสับสนนี้ เพราะยืนยันได้ว่ารายงานของซุฮัยร์จากอบูอิสหากมีน้ำหนักกว่ารายงานของอิสรออีล ซึ่งเป็นสองรายงานที่มีน้ำหนักที่สุด", "อะห์มัดบันทึกผ่านอบูอิสหาก จากอัลเกาะมะฮ์ บินเกาะยส์ จากอิบนุมัสอูด สำนวนว่า \"ท่านโยนมูลสัตว์ทิ้ง และกล่าวว่า มันเป็นสิ่งสกปรก จงนำก้อนหินมาให้ฉัน\" ผู้แต่งว่าส่วนเพิ่มนี้ศ่อฮีห์ หากยืนยันได้ว่าอบูอิสหากได้ยินจากอัลเกาะมะฮ์ อบูหาติมและอบูซุรอะฮ์ว่า \"อบูอิสหากไม่ได้ยินอะไรจากอัลเกาะมะฮ์เลย\" แต่อิบนุหะญัรยกจากอัลกะรอบีสีย์ว่า เขายืนยันว่าอบูอิสหากได้ยินหะดีษนี้จากอัลเกาะมะฮ์ และอัดดารุกุฏนีย์บันทึกด้วยสายนี้ สำนวน \"จงนำก้อนอื่นมาให้ฉัน\""]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ไปที่เฆาะอิฏ\" คือไปยังที่ลุ่มเพื่อถ่ายทุกข์", "\"ฉันจึงนำเราษะฮ์มาให้\" (ฟัตหะฮ์ที่รออ์ สุกูนที่วาว) คือมูลของสัตว์มีกีบ ในรายงานของอิบนุคุซัยมะฮ์ว่า \"ฉันพบก้อนหินสองก้อนและมูลลาก้อนหนึ่ง\"", "\"มันเป็นริกส์\" (กัสเราะฮ์ที่รออ์ สุกูนที่กาฟ) ในรายงานของอิบนุมาญะฮ์และอิบนุคุซัยมะฮ์ว่า \"มันเป็นริจส์\" อบูอุบัยด์ว่า \"มีความหมายคล้ายเราะญีอ์\" คือกลับจากสภาพอาหารเป็นมูล อัลฟัยยูมีย์ว่า \"ริกส์ (กัสเราะฮ์) คือริจส์ และทุกสิ่งที่สกปรกเรียกว่าริกส์\""]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "จำนวนก้อนหินในการชำระ", "points_th": ["หะดีษเป็นหลักฐานว่าการชำระต้องไม่น้อยกว่าสามก้อน เพราะท่านนบี ﷺ ขอให้อิบนุมัสอูดนำก้อนหินสามก้อนมา และได้กล่าวแล้วในหะดีษสัลมาน (ร.ฎ.) ในมุสลิม \"ท่านห้ามเราชำระด้วยก้อนหินน้อยกว่าสามก้อน\" และจากอาอิชะฮ์ (ร.ฎ.) ว่า
