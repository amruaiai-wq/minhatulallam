ัก", "อัตติรมิซีย์บันทึก (55) พร้อมส่วนเพิ่ม \"โอ้อัลลอฮ์ โปรดให้ฉันอยู่ในหมู่ผู้กลับเนื้อกลับตัว...\" จากญะอ์ฟัร บินมุหัมมัด บินอิมรอน อัษษะอ์ละบีย์ จากซัยด์ บินอัลหุบาบ จากมุอาวิยะฮ์ บินศอลิห์ จากเราะบีอะฮ์ บินยะซีด จากอบูอิดรีสและอบูอุษมาน จากอุมัร โดยไม่ระบุอุกบะฮ์ บินอามิรในสาย อัตติรมิซีย์กล่าวว่า \"หะดีษนี้สายรายงานสับสน และไม่มีหะดีษที่ถูกต้องจากท่านนบี ﷺ ในบทนี้มากนัก\" หมายถึงในสายแรกตัดอุกบะฮ์ระหว่างอบูอิดรีสกับอุมัร และในสายที่สองตัดญุบัยร์และอุกบะฮ์ระหว่างอบูอุษมานกับอุมัร", "ผู้แต่งเห็นว่าคำของอัตติรมิซีย์มีข้อพิจารณา เพราะหะดีษศ่อฮีห์และสายรายงานตรง มุสลิมบันทึกในเศาะฮีห์ อิบนุหะญัรว่า \"รายงานของมุสลิมพ้นจากข้อวิจารณ์นี้\" ความจริงคือหะดีษไม่สับสน ผู้รายงานทุกคนจากมุอาวิยะฮ์ บินศอลิห์ตรงกันเรื่องสาย และเศาะหาบะฮ์คืออุกบะฮ์ บินอามิร ความสับสนอยู่ในสายที่อัตติรมิซีย์ยก จากเขาหรือผู้เล่าให้เขาฟัง ในรายงานของซัยด์ บินอัลหุบาบเท่านั้น และซัยด์เองก็รายงานจากมุอาวิยะฮ์ทั้งสองสายในมุสลิม ซึ่งมีน้ำหนักกว่าเพราะมาจากผู้เชื่อถือได้และแม่นยำ อบูอะลี อัลฆ็อสสานีย์ว่าอาจารย์ของอัตติรมิซีย์จำสายรายงานไม่แม่น และอิบนุหะญัรยืนยันว่ามุหัมมัด บินญะอ์ฟัร อาจารย์ของอัตติรมิซีย์ จำสายรายงานไม่แม่น", "ส่วนเพิ่มนี้ไม่มีในรายงานอื่นทั้งหมด นอกจากรายงานของอัตติรมิซีย์ ซึ่งสับสน จึงไม่ใช่หลักฐานยืนยันส่วนเพิ่มนี้ ตามที่อะห์มัด ชากิรกล่าว แต่อัลอัลบานีย์ว่าศ่อฮีห์ เพราะความสับสนนั้นมีรายงานที่มีน้ำหนักกว่า และยกหลักฐานสนับสนุนจากหะดีษเษาบานในอัฏเฏาะบะรอนีย์และอิบนุสสุนนีย์ (ผ่านอบูสะอ์ด์ อัลบักกอล ซึ่งอัลฮัยษะมีย์ว่าส่วนใหญ่ว่าอ่อน และสำนวนของอัฏเฏาะบะรอนีย์ไม่มีประโยคนี้) อิบนุบาซก็ว่าศ่อฮีห์ และว่า \"รายงานนี้ของอัตติรมิซีย์สายรายงานดี\" ส่วนเพิ่มนี้ยังมีอีกสายในอัฏเฏาะบะรอนีย์ ผ่านอัลอะอ์มัช จากสาลิม บินอบิลญะอ์ด์ จากเษาบาน ซึ่งอ่อน เพราะสาลิมไม่ได้ฟังจากเษาบาน และผู้รายงานจากอัลอะอ์มัชไม่เป็นที่รู้จัก"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ไม่มีผู้ใดในพวกท่าน\" คำว่า \"ผู้ใด\" เป็นคำกว้าง เพราะเป็นคำนามไม่ชี้เฉพาะในบริบทปฏิเสธ และเพิ่มคำว่า \"มิน\" เพื่อให้ครอบคลุมทั้งหมด ความหมายคือ ไม่ว่าใครในพวกท่าน จึงรวมทั้งชายและหญิง", "\"อาบน้ำละหมาดอย่างทั่วถึง\" การทำให้ทั่วถึงหมายถึงล้างให้ทั่วที่ฟัรฎู หรือล้างเกินระดับวาญิบ คือครั้งที่สองและสาม ที่ชัดคือความหมายหลัง อักษรฟาอ์ในที่นี้บ่งลำดับในการกล่าว ไม่ใช่ลำดับเวลา เพราะการทำให้ทั่วถึงไม่ได้มาหลังวุฎูอ์ แต่ไปพร้อมกับแต่ละอวัยวะ", "\"แล้วกล่าว\" คือหลังจบวุฎูอ์ทันที ไม่เว้นช่วง คำว่า \"แล้ว\" บ่งการทิ้งช่วงเวลา ซึ่งต่างกันตามแต่ละที่", "\"ฉันขอปฏิญาณว่าไม่มีพระเจ้าอื่นใดนอกจากอัลลอฮ์\" คือ ฉันยอมรับด้วยใจและกล่าวด้วยปาก เหมือนผู้ที่เห็นสิ่งที่ตนยอมรับ การปฏิญาณคือความเชื่อมั่นที่ลิ้นกล่าวออกมา ความหมายคือ ไม่มีสิ่งใดที่ถูกเคารพบูชาโดยสัจจริง นอกจากอัลลอฮ์ อัลลอฮ์คือพระเจ้าที่แท้จริง เพราะความสมบูรณ์ของพระองค์และคุณลักษณะของพระองค์ ส่วนสิ่งที่ถูกเคารพบูชานอกจากพระองค์ไม่ใช่พระเจ้า แม้จะถูกเรียกเช่นนั้น \"สิ่งเหล่านั้นไม่ใช่อะไรอื่นนอกจากชื่อที่พวกเจ้าและบรรพบุรุษตั้งขึ้น อัลลอฮ์ไม่ได้ประทานหลักฐานใดลงมา\" (อันนัจม์: 23)", "\"องค์เดียว\" ยืนยันการยืนยัน \"ไม่มีภาคีใดสำหรับพระองค์\" ยืนยันการปฏิเสธ ภาคีคือผู้ร่วมและผู้ช่วยในสิ่งหนึ่ง", "\"และฉันขอปฏิญาณว่ามุหัมมัดเป็นบ่าวและรสูลของพระองค์\" คือบ่าวผู้นอบน้อมต่อพระองค์ด้วยการเชื่อฟังและการเผยแผ่สาร และเรียกร้องสู่อัลลอฮ์ด้วยวิทยปัญญาและคำตักเตือนที่ดี และเป็นรสูลที่ถูกส่งมาจากพระองค์พร้อมศาสนาแก่มวลโลก", "\"เว้นแต่ประตูสวรรค์จะถูกเปิดให้แก่เขา\" คือประตูทั้งแปด ตามสำนวนของมุสลิม หะดีษสะฮ์ล์ บินสะอ์ด์: \"ในสวรรค์มีแปดประตู ประตูหนึ่งชื่ออัรร็อยยาน ไม่มีใครเข้าทางนั้นนอกจากผู้ถือศีลอด\" (อัลบุคอรีย์ มุสลิม) การเปิดประตูสวรรค์มีสองความหมาย (1) อำนวยความสะดวกให้ทำความดีที่นำไปสู่ประตูเหล่านั้น (2) จะถูกเปิดให้เขาในวันกิยามะฮ์ ใช้รูปอดีตแทนอนาคตเพราะแน่นอนว่าจะเกิด เช่น \"คำบัญชาของอัลลอฮ์มาแล้ว ดังนั้นอย่าเร่งรีบ\" (อันนะห์ล์: 1)", "\"โอ้อัลลอฮ์\" (อัลลอฮุมมะ) อักษรมีมที่มีชัดดะฮ์แทนคำเรียก \"ยา\" ที่ถูกตัดออก \"ผู้กลับเนื้อกลับตัว\" (อัตเตาวาบีน) รูปคำที่เน้นความมาก คือ โปรดให้ฉันอยู่ในหมู่ผู้ที่กลับเนื้อกลับตัวและขออภัยโทษมาก ๆ จากบาปที่ทำ \"ผู้ชำระตน\" คือผู้ที่พ้นจากบาป ฮะดัษ และนะญิส รวมทั้งสองไว้ด้วยกันตามอายะฮ์ \"แท้จริงอัลลอฮ์ทรงรักบรรดาผู้กลับเนื้อกลับตัว และทรงรักบรรดาผู้ชำระตน\" (อัลบะเกาะเราะฮ์: 222) เมื่อการกลับเนื้อกลับตัวเป็นการชำระภายในจากความสกปรกของบาป และวุฎูอ์เป็นการชำระภายนอกจากฮะดัษและนะญิส ซึ่งเป็นอุปสรรคต่อการใกล้ชิดอัลลอฮ์ จึงเหมาะที่จะรวมกัน"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "ซิกิรหลังวุฎูอ์และความประเสริฐ", "points_th": ["ส่งเสริมให้กล่าวซิกิรอันยิ่งใหญ่ที่รวมชะฮาดะฮ์ทั้งสองไว้เมื่อจบวุฎูอ์ เพราะเป็นเหตุของความสุขนิรันดร์ คือการเข้าสวรรค์จากประตูใดก็ได้ นี่คือความประเสริฐที่ยิ่งใหญ่ มีรายงานว่าละหมาดมีประตูหนึ่ง การบริจาคมีประตูหนึ่ง ญิฮาดมีประตูหนึ่ง และการถือศีลอดมีประตูหนึ่ง (ดังที่กล่าวมา) แต่ถ้อยคำอันยิ่งใหญ่นี้หลังวุฎูอ์ทำให้ทุกประตูเปิดให้เข้าได้ตามต้องการ", "ความประเสริฐนี้ผูกกับซิกิรนี้ ไม่ใช่กับวุฎูอ์ที่ไม่มีซิกิร เพื่อไม่ให้ขัดกับรายงานว่าละหมาดมีประตูหนึ่ง และวุฎูอ์ซึ่งเป็นสื่อไปสู่ละหมาดก็ได้รับความประเสริฐนี้", "ซิกิรนี้มีความเหมาะสมอย่างยิ่ง เพราะเมื่อผู้อาบน้ำละหมาดทำความสะอาดภายนอกด้วยน้ำและอาบอย่างทั่วถึงแล้ว เขาก็ทำให้ภายในสมบูรณ์ด้วยความเชื่อในเตาฮีด และถ้อยคำแห่งความบริสุทธิ์ใจ ซึ่งเป็นถ้อยคำที่ประเสริฐที่สุด", "อัศศ็อนอานีย์กล่าวว่า \"ไม่ต้องสงสัยว่าการที่ผู้แต่ง (อิบนุหะญัร) ปิดบทวุฎูอ์ด้วยดุอาอ์นี้ ซึ่งกล่าวเมื่อจบวุฎูอ์ในทางปฏิบัติ จึงเป็นการกล่าวเมื่อจบหลักฐานในทางการเรียบเรียง เป็นการเรียบเรียงที่งดงาม\"", "มีรายงานจากอบูสะอีด อัลคุดรีย์ว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"ผู้ใดอาบน้ำละหมาดอย่างทั่วถึง แล้วกล่าวเมื่อเสร็จว่า 'มหาบริสุทธิ์ยิ่งแด่พระองค์ โอ้อัลลอฮ์ และด้วยการสรรเสริญพระองค์ ฉันขอปฏิญาณว่าไม่มีพระเจ้าอื่นใดนอกจากพระองค์ ฉันขออภัยโทษและกลับเนื้อกลับตัวต่อพระองค์' จะถูกประทับตรา แล้ววางไว้ใต้บัลลังก์ (อัลอัรช์) และจะไม่ถูกทำลายจนถึงวันกิยามะฮ์\" (อัฏเฏาะบะรอนีย์ อัลหากิม แบบมัรฟูอ์ และอันนะสาอีย์ในอะมะลุลยะวมิวัลลัยละฮ์ ทั้งแบบมัรฟูอ์และเมากูฟ อันนะสาอีย์และอิบนุหะญัรว่ารายงานแบบเมากูฟถูกต้องกว่า ผู้แต่งระบุในเชิงอรรถว่าสายรายงานศ่อฮีห์ ความต่างอยู่ที่ว่าเป็นคำของท่านนบี ﷺ หรือของอบูสะอีด)"]}], "tags_th": ["ซิกิรหลังวุฎูอ์", "ชะฮาดะฮ์", "ประตูสวรรค์", "ดุอาอ์", "เตาบะฮ์"]}, {"id": "v1-h058", "volume": 1, "bab": "khuffayn", "topic_ar": "بيان حكم المسح على الخفين", "topic_th": "หุก่มการเช็ดรองเท้าหุ้มข้อ", "pages": [248, 252], "hadith": [{"no": 58, "matn_ar": "عَنِ الْمُغِيرَةِ بْنِ شُعْبَةَ رَضِيَ اللهُ عَنْهُ قَالَ: كُنْتُ مَعَ النَّبِيِّ ﷺ، فَتَوَضَّأَ، فَأَهْوَيْتُ لِأَنْزِعَ خُفَّيْهِ، فَقَالَ: «دَعْهُمَا، فَإِنِّي أَدْخَلْتُهُمَا طَاهِرَتَيْنِ»، فَمَسَحَ عَلَيْهِمَا. مُتَّفَقٌ عَلَيْهِ.", "translation_th": "จากอัลมุฆีเราะฮ์ บินชุอ์บะฮ์ (ร.ฎ.) กล่าวว่า ฉันอยู่กับท่านนบี ﷺ ท่านอาบน้ำละหมาด ฉันจึงก้มลงจะถอดรองเท้าหุ้มข้อของท่าน ท่านกล่าวว่า \"ปล่อยไว้ เพราะฉันสวมมันขณะที่ (เท้าทั้งสอง) สะอาด\" แล้วท่านก็เช็ดบนรองเท้าทั้งสอง บันทึกโดยอัลบุคอรีย์และมุสลิม", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["อนุญาตให้เช็ดรองเท้าหุ้มข้อแทนการล้างเท้า ทั้งในการเดินทางและขณะอยู่บ้าน ไม่ว่าจะจำเป็นหรือไม่", "สำหรับผู้สวมอยู่แล้ว การเช็ดดีกว่าถอดออกแล้วล้างเท้า ส่วนผู้ไม่ได้สวม การล้างดีกว่า ไม่ต้องสวมเพื่อจะเช็ด", "เช็ดได้บนรองเท้าหุ้มข้อทุกแบบ แม้มีรูหรือรอยขาด ตามทัศนะที่ถูกต้อง เพราะซุนนะฮ์กล่าวไว้โดยไม่มีเงื่อนไข", "เงื่อนไขคือต้องสวมขณะมีความสะอาดด้วยน้ำ ผู้แต่งเห็นว่ารอบคอบกว่าที่จะสวมหลังวุฎูอ์ครบแล้ว", "ถุงเท้า (เญาริบ) และผ้าพันเท้าเทียบกับรองเท้าหุ้มข้อได้"], "vocab": [{"ar": "الْخُفّ", "th": "รองเท้าหุ้มข้อ ทำจากหนังบาง คลุมเท้า พหูพจน์คือ خِفَاف"}, {"ar": "الْجَوَارِب", "th": "ถุงเท้า ทำจากวัสดุอื่นที่ไม่ใช่หนัง เช่น ผ้า"}, {"ar": "فَأَهْوَيْتُ", "th": "ฉันก้มลงยื่นมือ"}, {"ar": "لِأَنْزِعَ", "th": "เพื่อถอด"}, {"ar": "دَعْهُمَا", "th": "ปล่อยมันไว้ (รองเท้าทั้งสอง)"}, {"ar": "أَدْخَلْتُهُمَا طَاهِرَتَيْنِ", "th": "ฉันสวมรองเท้าทั้งสองขณะที่เท้าทั้งสองสะอาด"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกในหมวดวุฎูอ์ บทเมื่อสวมโดยเท้าทั้งสองสะอาด (206) และมุสลิม (274) ผ่านซะกะริยา บินอบีซาอิดะฮ์ จากอามิร อัชชะอ์บีย์ จากอุรวะฮ์ บินอัลมุฆีเราะฮ์ จากบิดา", "อิบนุหะญัรระบุว่าซะกะริยาเป็นมุดัลลิส และรายงานจากอามิรด้วยคำว่า \"จาก\" เท่านั้น แต่ท่านไม่ได้สังเกตว่าอบูอะวานะฮ์บันทึกในมุสนัดของเขาสามสายจากซะกะริยา ว่า \"อามิรเล่าให้เราฟัง\" ซึ่งระบุชัดว่าได้ยิน ความกังวลเรื่องการตัดลีสจึงหมดไป อีกทั้งนักวิชาการส่วนใหญ่ถือว่ารายงานของมุดัลลิสในเศาะฮีหัยน์ด้วยคำว่า \"จาก\" มีหุก่มต่อเนื่องและถูกต้อง", "อิบนุหะญัรระบุว่าหะดีษนี้มีหลายสายจากอัลมุฆีเราะฮ์ และยกคำของอัลบัซซารว่ารายงานจากอัลมุฆีเราะฮ์ราวหกสิบสาย จึงเป็นหะดีษที่มีชื่อเสียงที่สุดเรื่องการเช็ดรองเท้าหุ้มข้อ"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ฉันอยู่กับท่านนบี ﷺ ท่านอาบน้ำละหมาด\" ในฉบับบุลูฆเป็นเช่นนี้ ในอัลบุคอรีย์ว่า \"ในการเดินทาง\" แทน \"ท่านอาบน้ำละหมาด\" ความหมายของ \"อาบน้ำละหมาด\" คือเริ่มอาบ ไม่ใช่อาบเสร็จ ตามบริบท การเดินทางในที่นี้คือการเดินทางในสงครามตะบูก เดือนเราะญับ ปี ฮ.ศ. 9 ก่อนละหมาดศุบห์ ตามที่มีในหมวดสงคราม", "\"ฉันก้มลง\" คือก้มยื่นมือ \"เพื่อถอด\" การที่อัลมุฆีเราะฮ์ทำเช่นนี้ อาจเพราะไม่รู้เรื่องข้อผ่อนผันให้เช็ด หรือรู้แต่คิดว่าท่านนบี ﷺ จะทำสิ่งที่ประเสริฐกว่า ตามทัศนะว่าการล้างประเสริฐกว่า", "\"ปล่อยไว้\" สรรพนามหมายถึงรองเท้าหุ้มข้อ หรือเท้า แต่ความหมายแรกชัดกว่า \"เพราะฉันสวมมันขณะที่สะอาด\" สรรพนามใน \"สวมมัน\" หมายถึงเท้า ตามรายงานของอบูดาวูด \"ปล่อยรองเท้าไว้ เพราะฉันใส่เท้าเข้าไปในรองเท้าขณะที่เท้าสะอาด\" ประโยคนี้บอกเหตุผลของคำว่า \"ปล่อยไว้\" ในรายงานของยะห์ยา บินสะอีด อัลก็อฏฏอน จากซะกะริยา ในอะห์มัด ใช้สำนวน \"ฉันใส่มันเข้าไปขณะที่มันสะอาด\" (ความต่างของสองสำนวนจะกล่าวต่อไป)"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "อนุญาตให้เช็ดรองเท้าหุ้มข้อ", "points_th": ["หะดีษเป็นหลักฐานว่าในวุฎูอ์อนุญาตให้เช็ดรองเท้าหุ้มข้อแทนการล้างเท้า ในการเดินทางตามหะดีษนี้ และขณะอยู่บ้านตามหะดีษอะลีที่จะกล่าวต่อไป หะดีษหุซัยฟะฮ์ก็เช่นกัน", "ไม่ต่างกันว่าการเช็ดเป็นเพราะจำเป็นหรือไม่ จึงอนุญาตให้สตรีที่อยู่แต่ในบ้าน และผู้ป่วยที่ไม่ได้เดิน อันนะวะวีย์รายงานว่ามีอิจญ์มาอ์ในเรื่องนี้", "สิ่งที่ปิดเท้า เช่น ถุงเท้าและผ้าพันเท้า เทียบกับรองเท้าหุ้มข้อได้ (จะกล่าวต่อไป)"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "เช็ดหรือถอดแล้วล้าง อะไรดีกว่า", "points_th": ["หะดีษเป็นหลักฐานว่าการเช็ดรองเท้าหุ้มข้อสำหรับผู้ที่สวมอยู่ ดีกว่าถอดออกแล้วล้างเท้า เพราะคำว่า \"ปล่อยไว้\" และเพราะการเช็ดเป็นซุนนะฮ์ที่ยืนยันจากท่านรสูลุลลอฮ์ ﷺ ซึ่งกลุ่มผู้อุตริบางกลุ่มคัดค้าน การฟื้นฟูสิ่งที่ฝ่ายตรงข้ามคัดค้านจึงดีกว่าปล่อยให้ซุนนะฮ์ตาย", "ผู้ที่ถอดรองเท้าทุกครั้งที่อาบน้ำละหมาด ถือว่าขัดกับซุนนะฮ์ และเกรงว่าจะเป็นการเลียนแบบพวกรอฟิเฎาะฮ์ ส่วนผู้ที่ไม่ได้สวม การล้างดีกว่า และไม่ต้องสวมเพื่อจะเช็ด เพราะในกรณีนี้การล้างประเสริฐกว่า"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "เช็ดได้บนรองเท้าทุกแบบ", "points_th": ["หะดีษแสดงว่าการเช็ดใช้กับรองเท้าหุ้มข้อทั่วไป สิ่งที่เรียกว่ารองเท้าหุ้มข้อก็เช็ดได้ แม้จะมีรู รอยขาด หรือรอยแตก ตามทัศนะที่ถูกต้องจากสองทัศนะของนักวิชาการ เพราะซุนนะฮ์กล่าวถึงการเช็ดโดยไม่มีเงื่อนไข และรองเท้าหุ้มข้อโดยปกติมักมีรอยปริหรือขาด โดยเฉพาะเมื่อใช้นาน และเศาะหาบะฮ์หลายคนยากจน ไม่สามารถเปลี่ยนใหม่ได้", "สิ่งที่ศาสนากล่าวไว้โดยไม่มีเงื่อนไข ไม่มีใครจำกัดได้นอกจากด้วยหลักฐานทางศาสนา และไม่มีรายงานจากเศาะหาบะฮ์คนใดที่จำกัดรองเท้าหุ้มข้อด้วยเงื่อนไขใด แต่พวกเขากล่าวถึงการเช็ดโดยไม่มีเงื่อนไข ทั้งที่รู้สภาพของมัน จึงรู้ได้ว่าพวกเขาเข้าใจจากนบีของพวกเขาว่าเช็ดรองเท้าหุ้มข้อได้โดยไม่มีเงื่อนไข (อิบนุตัยมียะฮ์)", "จึงไม่ถูกต้องที่จะกำหนดเงื่อนไขที่ไม่มีที่มาในศาสนา และทำให้จุดประสงค์ของข้อผ่อนผันเสียไป"]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "ต้องชำระครบก่อนสวมหรือไม่", "points_th": ["นักวิชาการบางท่านใช้คำว่า \"เพราะฉันสวมมันขณะที่สะอาด\" เป็นหลักฐานว่าการชำระให้ครบเป็นเงื่อนไขของการเช็ด คือสวมได้หลังชำระเท้าทั้งสองแล้วเท่านั้น เพราะ \"ขณะที่มันสะอาด\" บอกสภาพของเท้าแต่ละข้าง ความหมายคือ ฉันสวมแต่ละข้างขณะที่มันสะอาด ซึ่งจะเป็นได้เมื่อชำระครบ ดังนั้นถ้าล้างเท้าขวาแล้วสวม แล้วล้างเท้าซ้ายแล้วสวม การเช็ดใช้ไม่ได้ เพราะไม่ได้สวมขณะที่ทั้งสองสะอาด แต่สวมข้างแรกก่อนชำระข้างที่สอง เป็นทัศนะของมาลิก อัชชาฟิอีย์ และอีกรายงานจากอะห์มัด ตามทัศนะนี้ ถ้าทำเช่นนั้นต้องถอดข้างขวาแล้วสวมใหม่ ให้การสวมอยู่หลังชำระครบ", "ทัศนะที่สอง: ผู้ที่ล้างเท้าข้างหนึ่งแล้วสวม แล้วล้างอีกข้างแล้วสวม การชำระของเขาครบ และเช็ดได้ เป็นทัศนะของหะนะฟีย์ ชาฟิอีย์บางท่าน และอีกรายงานจากอิมามอะห์มัด เพราะเมื่อล้างหน้า มือ เช็ดศีรษะ และล้างเท้าข้างหนึ่ง เท้าที่ล้างก็สะอาดแล้ว เมื่อสวมก็สวมขณะที่สะอาด แล้วล้างอีกข้างแล้วสวมทันที ก็สวมขณะที่สะอาด จึงสวมรองเท้าทั้งสองขณะที่เท้าสะอาด อิบนุตัยมียะฮ์เลือกและกล่าวว่า \"นี่คือสิ่งที่ถูกต้องอย่างไม่ต้องสงสัย\" อิบนุลก็อยยิมก็เลือกและว่า \"เป็นทัศนะที่ถูกต้องกว่าในสองทัศนะ\"", "คำว่า \"เพราะฉันสวมมันขณะที่สะอาด\" ไม่ได้ระบุชัดตามที่ทัศนะแรกกล่าว แต่อาจหมายความเช่นนั้น หรือหมายถึงสวมแต่ละข้างขณะที่สะอาด แต่หะดีษอบูบักเราะฮ์ (ร.ฎ.) สนับสนุนทัศนะแรก ว่าท่านนบี ﷺ ผ่อนผันให้ผู้เดินทางสามวันสามคืน และผู้อยู่บ้านหนึ่งวันหนึ่งคืน \"เมื่อเขาชำระแล้วสวมรองเท้า ก็ให้เช็ดบนมัน\" (จะกล่าวต่อไป) คำว่า \"เมื่อเขาชำระแล้วสวม\" บ่งว่าไม่สวมก่อนล้างเท้าซ้าย เพราะผู้ที่ทำเช่นนั้นยังไม่เรียกว่าชำระแล้ว", "ผู้แต่งเห็นว่าทัศนะแรกรอบคอบกว่าในเรื่องนี้ คือสวมรองเท้าหลังชำระครบ แต่ผู้ที่ยึดทัศนะที่สอง เราก็ไม่ตัดสินแน่นอนว่าการชำระและการละหมาดของเขาเสีย เพราะยังมีความเป็นไปได้"]}, {"wajh": 7, "type": "fiqh", "heading_ar": null, "heading_th": "สวมด้วยความสะอาดจากน้ำ", "points_th": ["หะดีษเป็นหลักฐานของเงื่อนไขหนึ่งของการเช็ดรองเท้าหุ้มข้อ คือต้องสวมขณะมีความสะอาด และตามรูปคำคือความสะอาดด้วยน้ำ เพราะเป็นความหมายเมื่อกล่าวไว้โดยไม่มีเงื่อนไข นี่คือทัศนะของนักวิชาการส่วนใหญ่", "ถ้าสวมหลังการชำระด้วยการตะยัมมุม ก็เช็ดไม่ได้เมื่อมีน้ำ เพราะการตะยัมมุมไม่เกี่ยวกับเท้า คำว่า \"ขณะที่มันสะอาด\" จึงไม่เกิดขึ้น"]}, {"wajh": 8, "type": "fawaid", "heading_ar": null, "heading_th": "บอกเหตุผลของหุก่ม", "points_th": ["หะดีษแสดงจริยธรรมอันดีงามและการสอนของท่านนบี ﷺ เมื่อห้ามอัลมุฆีเราะฮ์ไม่ให้ถอด ท่านอธิบายเหตุผลว่า ท่านสวมขณะที่เท้าสะอาด การบอกเหตุผลมีประโยชน์สามประการ (ดังที่กล่าวในหะดีษแมว)", "(1) ทำให้ใจสงบและยอมรับ เพราะเมื่อรู้เหตุผลของหุก่มก็สบายใจ แม้ผู้ศรัทธาจะสบายใจอยู่แล้ว แต่การบอกเหตุผลเพิ่มก็เป็นสิ่งดี (2) ความสูงส่งของศาสนา ไม่มีหุก่มใดที่ไม่มีเหตุผลและวิทยปัญญา (3) หุก่มครอบคลุมตามเหตุผล สิ่งใดที่มีเหตุผลนั้น หุก่มที่ผูกกับเหตุผลนั้นก็ใช้กับสิ่งนั้น"]}], "tags_th": ["เช็ดรองเท้าหุ้มข้อ", "คุฟฟ์", "ถุงเท้า", "ข้อผ่อนผัน", "วุฎูอ์"]}, {"id": "v1-h059-060", "volume": 1, "bab": "khuffayn", "topic_ar": "محل المسح على الخفين", "topic_th": "ตำแหน่งที่เช็ดบนรองเท้าหุ้มข้อ", "pages": [253, 256], "hadith": [{"no": 59, "matn_ar": "وَلِلْأَرْبَعَةِ عَنْهُ إِلَّا النَّسَائِيَّ: أَنَّ النَّبِيَّ ﷺ مَسَحَ أَعْلَى الْخُفِّ وَأَسْفَلَهُ. وَفِي إِسْنَادِهِ ضَعْفٌ.", "translation_th": "และในรายงานของนักบันทึกทั้งสี่ ยกเว้นอันนะสาอีย์ จากอัลมุฆีเราะฮ์ (ร.ฎ.) ว่า ท่านนบี ﷺ เช็ดด้านบนและด้านล่างของรองเท้าหุ้มข้อ และสายรายงานมีความอ่อน", "grade_th": "ฎออีฟ (อ่อน) อัลบุคอรีย์ อะห์มัด อบูดาวูด อัตติรมิซีย์ อบูหาติม อบูซุรอะฮ์ และอัดดารุกุฏนีย์ว่าอ่อน"}, {"no": 60, "matn_ar": "عَنْ عَلِيٍّ رَضِيَ اللهُ عَنْهُ قَالَ: لَوْ كَانَ الدِّينُ بِالرَّأْيِ لَكَانَ أَسْفَلُ الْخُفِّ أَوْلَى بِالْمَسْحِ مِنْ أَعْلَاهُ، وَقَدْ رَأَيْتُ رَسُولَ اللهِ ﷺ يَمْسَحُ عَلَى ظَاهِرِ خُفَّيْهِ. أَخْرَجَهُ أَبُو دَاوُدَ بِإِسْنَادٍ حَسَنٍ.", "translation_th": "จากอะลี (ร.ฎ.) กล่าวว่า หากศาสนาเป็นไปตามความเห็น ด้านล่างของรองเท้าหุ้มข้อคงสมควรถูกเช็ดมากกว่าด้านบน แต่ฉันเห็นท่านรสูลุลลอฮ์ ﷺ เช็ดบนด้านบนของรองเท้าหุ้มข้อทั้งสองของท่าน บันทึกโดยอบูดาวูด ด้วยสายรายงานที่หะซัน", "grade_th": "ศ่อฮีห์ (อิบนุหะญัรว่าหะซันที่นี่ และศ่อฮีห์ในอัตตัลคีศ อะห์มัด ชากิรและอัลอัลบานีย์ว่าศ่อฮีห์)"}], "key_rulings_th": ["การเช็ดรองเท้าหุ้มข้ออยู่ที่ด้านบนเท่านั้น ไม่ใช่ด้านล่าง", "หะดีษที่ว่าเช็ดทั้งด้านบนและด้านล่างอ่อน และขัดกับหะดีษที่ถูกต้องกว่า", "การเช็ดรองเท้าหุ้มข้อเป็นเรื่องที่ต้องยึดตามตัวบท ไม่ใช่ใช้ความเห็น เพราะเป็นการเคารพภักดี ไม่ใช่การทำความสะอาด", "วิธีเช็ด: ลูบมือขวาที่เปียกน้ำ กางนิ้ว บนเท้าขวา และมือซ้ายบนเท้าซ้าย ครั้งเดียว ไม่ทำซ้ำ"], "vocab": [{"ar": "الرَّأْي", "th": "ความเห็นที่คนเห็นว่าดีโดยไม่ได้พิจารณาศาสนา"}, {"ar": "ظَاهِرِ خُفَّيْهِ", "th": "ด้านบนของรองเท้าหุ้มข้อทั้งสอง"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجهما", "heading_th": "ที่มาของทั้งสองหะดีษ", "points_th": ["หะดีษอัลมุฆีเราะฮ์: อบูดาวูด (165) ในหมวดฏอฮาเราะฮ์ บทวิธีเช็ด อัตติรมิซีย์ (97) และอิบนุมาญะฮ์ (550) ผ่านอัลวะลีด บินมุสลิม จากเษาร์ บินยะซีด จากเราะญาอ์ บินหัยวะฮ์ จากเลขานุการของอัลมุฆีเราะฮ์ จากอัลมุฆีเราะฮ์ สายรายงานอ่อนตามที่อิบนุหะญัรกล่าว ท่านยกมาเพื่อให้รู้สถานะ มีข้อบกพร่องร้ายแรงสองข้อ", "ข้อแรก: สายขาดระหว่างเษาร์กับเราะญาอ์ อบูดาวูดกล่าวว่า \"ฉันได้ยินว่าเษาร์ไม่ได้ฟังหะดีษนี้จากเราะญาอ์\" อัดดารุกุฏนีย์กล่าวว่า อิบนุลมุบาร็อกรายงานจากเษาร์ว่า \"มีคนเล่าให้ฉันฟังจากเราะญาอ์ บินหัยวะฮ์ จากเลขานุการของอัลมุฆีเราะฮ์ จากท่านนบี ﷺ\" แบบมุรสัล ไม่มีอัลมุฆีเราะฮ์", "ข้อที่สอง: เป็นมุรสัล เพราะเลขานุการของอัลมุฆีเราะฮ์รายงานจากท่านนบี ﷺ โดยไม่ทันยุคท่าน ตามรายงานของอิบนุลมุบาร็อก ซึ่งอัลบุคอรีย์ อบูหาติม และอบูซุรอะฮ์ว่ามีน้ำหนักกว่า อัตติรมิซีย์ถามอัลบุคอรีย์ เขาตอบว่า \"ไม่ถูกต้อง\" อิบนุอบีหาติมถามอบูซุรอะฮ์และบิดา ทั้งสองตอบว่า \"สายนี้ใกล้ความจริงกว่า\" คือสายของอิบนุลมุบาร็อกที่ไม่มีอัลมุฆีเราะฮ์", "ข้อที่สาม: เลขานุการของอัลมุฆีเราะฮ์ไม่เป็นที่รู้จัก ตามที่อิบนุหัซม์กล่าว แต่ข้อนี้ไม่ร้ายแรง เพราะในรายงานของอิบนุมาญะฮ์ระบุชื่อว่า วัรร็อด ซึ่งเป็นที่รู้จักและเชื่อถือได้ นักบันทึกทั้งหกใช้เป็นหลักฐาน สรุปคือสายรายงานอ่อน อิมามหะดีษหลายท่านว่าอ่อน คืออัลบุคอรีย์ อะห์มัด อบูดาวูด อัตติรมิซีย์ อบูหาติม อบูซุรอะฮ์ อัดดารุกุฏนีย์ และคนอื่น ๆ ส่วนตัวบทขัดกับหะดีษศ่อฮีห์ที่ระบุแต่การเช็ดด้านบน ไม่ใช่ด้านล่าง และที่สนับสนุนว่าการเช็ดด้านล่างไม่เป็นที่รู้จักคือหะดีษที่สอง", "หะดีษอะลี: อบูดาวูดบันทึก (162) ผ่านอัลอะอ์มัช จากอบูอิสหาก อัสสะบีอีย์ จากอับดุคอยร์ จากอะลี เขาบันทึกคนเดียวในหกเล่ม อิบนุหะญัรว่าสายรายงานหะซันที่นี่ แต่ในอัตตัลคีศว่า \"สายรายงานศ่อฮีห์\" อะห์มัด ชากิรว่าศ่อฮีห์ อัลอัลบานีย์ว่า \"นี่คือสิ่งที่ถูกต้อง\" อับดุคอยร์คืออิบนุยะซีด อัลฮัมดานีย์ อิบนุมะอีนและอัลอิจลีย์ว่าเชื่อถือได้", "สำนวนของรายงานนี้มีความต่างกัน อัดดารุกุฏนีย์ในอัลอิลัลว่าที่ถูกต้องคือสำนวนของผู้ที่กล่าวว่า \"ฉันเคยเห็นว่าด้านล่างของรองเท้าหุ้มข้อสมควรถูกเช็ดมากกว่าด้านบน\""]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"หากศาสนาเป็นไปตามความเห็น\" ศาสนาหมายถึงหุก่มของอิสลาม ความเห็นคือสิ่งที่คนเห็นว่าดีโดยไม่พิจารณาศาสนา ความหมายคือ หากที่มาของหุก่มศาสนาเป็นเพียงสติปัญญา ด้านล่างของรองเท้าคงสมควรถูกเช็ดมากกว่าด้านบน เพราะด้านล่างสัมผัสสิ่งสกปรกและนะญิส แต่ที่วาญิบคือให้ตัวบทที่ถูกต้องมาก่อนความเห็น และอาจหมายถึงความเห็นตามเปลือกนอก มิฉะนั้นสติปัญญาก็บ่งว่าที่สมควรคือเช็ดด้านบนเท่านั้น เพราะการเช็ดนี้ไม่ได้มีไว้เพื่อทำความสะอาด แต่เพื่อเคารพภักดี และไม่เช็ดด้านล่าง เพราะการเช็ดด้านล่างทำให้มือเปื้อน", "สติปัญญาที่สมบูรณ์ตามศาสนา เพราะไม่สามารถเข้าใจวิทยปัญญาของพระเจ้าได้ทั้งหมด จึงต้องยอมรับและเคารพภักดีอย่างบริสุทธิ์ตามความเป็นบ่าว นี่คือสติปัญญาที่ปลอดจากโรคความคลุมเครือและโรคตัณหา และผู้ที่หลงผิด ทั้งผู้ปฏิเสธศรัทธา นักปรัชญา ผู้อุตริ และผู้ตามอารมณ์ หลงผิดเพราะตามสติปัญญาและละทิ้งการยึดตามตัวบท", "\"แต่ฉันเห็นท่านรสูลุลลอฮ์ ﷺ...\" เหมือนบอกเหตุผลของสิ่งที่ละไว้ในประโยค คือ แต่ด้านล่างของรองเท้าไม่สมควรถูกเช็ด เพราะฉันเห็นท่านรสูลุลลอฮ์ ﷺ เช็ดเฉพาะด้านบน"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "เช็ดด้านบนเท่านั้น", "points_th": ["หะดีษอะลีเป็นหลักฐานของตำแหน่งที่เช็ด คือด้านบนของรองเท้าหุ้มข้อ ไม่ใช่ด้านล่าง ส่วนหะดีษอัลมุฆีเราะฮ์อ่อนและขัดกับหะดีษที่ถูกต้องกว่า อิบนุลก็อยยิมกล่าวว่า \"ท่านนบี ﷺ เช็ดด้านบนของรองเท้าหุ้มข้อ และไม่มีรายงานที่ถูกต้องว่าท่านเช็ดด้านล่าง นอกจากในหะดีษที่สายขาด และหะดีษที่ถูกต้องขัดกับมัน\""]}, {"wajh": 4, "type": "fawaid", "heading_ar": null, "heading_th": "เรื่องที่ต้องยึดตามตัวบท", "points_th": ["การเช็ดรองเท้าหุ้มข้อไม่ได้ปฏิบัติตามความเห็น แต่เป็นเรื่องที่ต้องยึดตามตัวบท (เตาฟีกียะฮ์) ไม่มีความเหมาะสมที่เห็นชัด นอกจากการผ่อนปรนและความง่าย จึงขึ้นอยู่กับสิ่งที่ศาสนากำหนด และศาสนากำหนดให้เช็ดด้านบน ไม่ใช่ด้านล่าง"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "วิธีและปริมาณการเช็ด", "points_th": ["ไม่มีหะดีษที่พึ่งได้ในเรื่องวิธีและปริมาณการเช็ดรองเท้าหุ้มข้อ ที่ชัดคือ เมื่อผู้รับภาระทำสิ่งที่ทางภาษาเรียกว่าการเช็ดบนรองเท้าหุ้มข้อ ก็ใช้ได้", "วิธีคือ ลูบมือขวาที่เปียกน้ำ กางนิ้ว บนเท้าขวา และมือซ้ายบนเท้าซ้ายเช่นกัน เช็ดครั้งเดียว และไม่มีในศาสนาที่จะเช็ดซ้ำ"]}], "tags_th": ["เช็ดรองเท้าหุ้มข้อ", "ด้านบน", "ความเห็น", "ตัวบท", "หะดีษอ่อน"]}, {"id": "v1-h061-062", "volume": 1, "bab": "khuffayn", "topic_ar": "توقيت المسح وأنه مختص بالحدث الأصغر", "topic_th": "กำหนดเวลาการเช็ด และใช้เฉพาะฮะดัษเล็ก", "pages": [257, 261], "hadith": [{"no": 61, "matn_ar": "عَنْ صَفْوَانَ بْنِ عَسَّالٍ رَضِيَ اللهُ عَنْهُ قَالَ: كَانَ رَسُولُ اللهِ ﷺ يَأْمُرُنَا إِذَا كُنَّا سَفْرًا أَنْ لَا نَنْزِعَ خِفَافَنَا ثَلَاثَةَ أَيَّامٍ وَلَيَالِيَهُنَّ، إِلَّا مِنْ جَنَابَةٍ، وَلَكِنْ مِنْ غَائِطٍ وَبَوْلٍ، وَنَوْمٍ. أَخْرَجَهُ النَّسَائِيُّ، وَالتِّرْمِذِيُّ وَاللَّفْظُ لَهُ، وَابْنُ خُزَيْمَةَ وَصَحَّحَاهُ.", "translation_th": "จากเศาะฟวาน บินอัสสาล (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ เคยสั่งเรา เมื่อเราเป็นผู้เดินทาง ว่าไม่ต้องถอดรองเท้าหุ้มข้อของเราสามวันสามคืน เว้นแต่เพราะญะนาบะฮ์ แต่ (ไม่ต้องถอด) เพราะอุจจาระ ปัสสาวะ และการนอน บันทึกโดยอันนะสาอีย์ และอัตติรมิซีย์ (สำนวนเป็นของเขา) และอิบนุคุซัยมะฮ์ ทั้งสองระบุว่าศ่อฮีห์", "grade_th": "หะซัน และถึงระดับศ่อฮีห์ด้วยสายสนับสนุน (อัตติรมิซีย์ว่าหะซันศ่อฮีห์)"}, {"no": 62, "matn_ar": "وَعَنْ عَلِيِّ بْنِ أَبِي طَالِبٍ رَضِيَ اللهُ عَنْهُ قَالَ: جَعَلَ النَّبِيُّ ﷺ ثَلَاثَةَ أَيَّامٍ وَلَيَالِيَهُنَّ لِلْمُسَافِرِ، وَيَوْمًا وَلَيْلَةً لِلْمُقِيمِ. يَعْنِي: فِي الْمَسْحِ عَلَى الْخُفَّيْنِ. أَخْرَجَهُ مُسْلِمٌ.", "translation_th": "จากอะลี บินอบีฏอลิบ (ร.ฎ.) กล่าวว่า ท่านนบี ﷺ กำหนดสามวันสามคืนสำหรับผู้เดินทาง และหนึ่งวันหนึ่งคืนสำหรับผู้อยู่บ้าน หมายถึงในการเช็ดรองเท้าหุ้มข้อ บันทึกโดยมุสลิม", "grade_th": "ศ่อฮีห์ (มุสลิม)"}], "key_rulings_th": ["การเช็ดรองเท้าหุ้มข้อมีกำหนดเวลา ผู้เดินทางสามวันสามคืน ผู้อยู่บ้านหนึ่งวันหนึ่งคืน ตามทัศนะของนักวิชาการส่วนใหญ่", "การเช็ดใช้เฉพาะฮะดัษเล็ก เช่น การนอน ปัสสาวะ อุจจาระ ส่วนญะนาบะฮ์ต้องถอดรองเท้าแล้วล้างเท้า แม้ยังอยู่ในกำหนดเวลา", "เงื่อนไขการเช็ดสี่ข้อ: สวมขณะมีความสะอาด เช็ดในกำหนดเวลา ใช้เฉพาะฮะดัษเล็ก และรองเท้าต้องสะอาด", "ผู้แต่งเห็นว่าทัศนะที่มีน้ำหนักคือ กำหนดเวลาเริ่มนับจากการเช็ดครั้งแรก ไม่ใช่จากการสวมหรือจากฮะดัษหลังสวม ผู้อยู่บ้านจึงเช็ดได้ 24 ชั่วโมง ผู้เดินทาง 72 ชั่วโมง โดยนับตามเวลา ไม่ใช่จำนวนละหมาด"], "vocab": [{"ar": "سَفْرًا", "th": "อ่านสระอะแล้วสุกูน เป็นคำนามรวม หมายถึงผู้เดินทาง"}, {"ar": "يَأْمُرُنَا", "th": "อนุญาตให้เรา คำสั่งในที่นี้หมายถึงการอนุญาต เพราะมีอิจญ์มาอ์ว่าการเช็ดเป็นสิ่งอนุญาต ไม่ใช่วาญิบ"}, {"ar": "جَنَابَة", "th": "สภาพหลังการหลั่งอสุจิ (หรือร่วมประเวณี) รากศัพท์แปลว่าความห่าง"}, {"ar": "جَعَلَ", "th": "กำหนดเป็นบทบัญญัติและกำหนดเวลา"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["เศาะฟวาน บินอัสสาล อัลมุรอดีย์ เศาะหาบะฮ์ที่มีชื่อเสียง อาศัยอยู่ที่กูฟะฮ์ รายงานหะดีษหลายบทจากท่านนบี ﷺ รวมถึงหะดีษยาวเรื่องการเช็ดรองเท้าหุ้มข้อ ความประเสริฐของการแสวงหาความรู้ ความรัก และเวลาสุดท้ายที่การเตาบะฮ์ยังถูกรับ", "เขาร่วมสงครามกับท่านนบี ﷺ สิบสองครั้ง มีผู้รายงานจากเขาหลายคน รวมถึงเศาะหาบะฮ์ผู้ยิ่งใหญ่ อับดุลลอฮ์ บินมัสอูด"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجهما", "heading_th": "ที่มาของทั้งสองหะดีษ", "points_th": ["หะดีษเศาะฟวาน: อัตติรมิซีย์ (96) ในบทการเช็ดรองเท้าหุ้มข้อสำหรับผู้เดินทางและผู้อยู่บ้าน อันนะสาอีย์ และอิบนุคุซัยมะฮ์ (196) ผ่านอาศิม บินอบินนะญูด จากซิรร์ บินหุบัยช์ จากเศาะฟวาน อัตติรมิซีย์ว่า \"หะซันศ่อฮีห์\" และยกคำของอัลบุคอรีย์ว่า \"สิ่งที่ดีที่สุดในบทนี้คือหะดีษเศาะฟวาน บินอัสสาล\"", "หะดีษนี้หมุนรอบอาศิม บินอบินนะญูด ซึ่งความจำมีความอ่อน หะดีษของเขาไม่ต่ำกว่าระดับหะซัน แต่ไม่ถึงระดับศ่อฮีห์ อิบนุหะญัรว่า \"สัจจริง มีความเข้าใจผิดบ้าง เป็นหลักฐานในเรื่องการอ่านอัลกุรอาน หะดีษของเขาในเศาะฮีหัยน์มาพร้อมผู้อื่น\" แต่เขาไม่ได้รายงานคนเดียว ฏ็อลหะฮ์ บินมุศ็อรริฟ หะบีบ บินอบีษาบิต และคนอื่นรายงานสนับสนุน สายสนับสนุนเหล่านี้มีข้อวิจารณ์ แต่รวมกันทำให้หะดีษแข็งแรง และหะดีษเดิมเป็นหะดีษยาว บางสายสนับสนุนไม่มีเรื่องการเช็ด", "ที่ชัดคือการที่อัตติรมิซีย์ว่าศ่อฮีห์ เพราะพิจารณาจากสายต่าง ๆ เขากล่าวว่า \"หะดีษนี้รายงานจากเศาะฟวานจากสายอื่นที่ไม่ใช่อาศิมด้วย\" ผู้ที่ว่าศ่อฮีห์ นอกจากที่กล่าวมา ยังมีอิบนุคุซัยมะฮ์ อิบนุหิบบาน อัลค็อฏฏอบีย์ อันนะวะวีย์ และอิบนุหะญัร อิบนุดะกีกิลอีดกล่าวว่า \"มีผู้รายงานจากอาศิมกว่าสามสิบคนจากบรรดาอิมาม และเป็นที่รู้จักจากหะดีษของอาศิม\" อัตติรมิซีย์ยกหะดีษนี้ฉบับเต็มไว้ในหมวดดุอาอ์", "หะดีษอะลี: มุสลิมบันทึกในหมวดฏอฮาเราะฮ์ (276) ผ่านชุร็อยห์ บินฮานิอ์ ว่า ฉันไปถามอาอิชะฮ์เรื่องการเช็ดรองเท้าหุ้มข้อ นางกล่าวว่า จงไปถามอิบนุอบีฏอลิบ เพราะเขาเคยเดินทางกับท่านรสูลุลลอฮ์ ﷺ เราจึงไปถามเขา เขากล่าวว่า... โดยไม่มีคำว่า \"หมายถึงในการเช็ดรองเท้าหุ้มข้อ\" ซึ่งแทรกเข้ามา ที่ชัดคือเป็นคำของอิบนุหะญัร"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظهما", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"เคยสั่งเรา\" คืออนุญาตให้เรา คำสั่งในที่นี้หมายถึงการอนุญาต ไม่ใช่ความหมายเดิมคือวาญิบ สิ่งที่เปลี่ยนความหมายคืออิจญ์มาอ์ว่าการเช็ดเป็นสิ่งอนุญาต ไม่ใช่วาญิบ", "\"เมื่อเราเป็นผู้เดินทาง\" (สัฟร็อน) อ่านสระอะแล้วสุกูน เป็นคำนามรวมของผู้เดินทาง ไม่ใช่พหูพจน์", "\"เว้นแต่เพราะญะนาบะฮ์\" คือให้ถอด แม้ยังไม่ครบสามวัน ญะนาบะฮ์คือการหลั่งอสุจิ ได้ชื่อนี้เพราะอสุจิห่างจากที่และเคลื่อนออก รากศัพท์แปลว่าความห่าง", "\"แต่เพราะอุจจาระ ปัสสาวะ และการนอน\" คำว่า \"แต่\" ใช้แก้ความเข้าใจ เพราะก่อนหน้ามีการปฏิเสธและการยกเว้น ความหมายคือ เราไม่ถอดเพราะอุจจาระ ปัสสาวะ และการนอน เว้นแต่ครบกำหนด เพื่อให้รู้ว่าข้อผ่อนผันมีเฉพาะฮะดัษประเภทนี้ ไม่รวมญะนาบะฮ์ ในสำนวนของอันนะสาอีย์: \"ท่านรสูลุลลอฮ์ ﷺ เคยสั่งเรา เมื่อเราเป็นผู้เดินทาง ให้เช็ดรองเท้าหุ้มข้อ และไม่ถอดสามวัน เพราะอุจจาระ ปัสสาวะ และการนอน เว้นแต่เพราะญะนาบะฮ์\"", "\"กำหนด\" (ญะอะละ) คือบัญญัติและกำหนดเวลา"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "การเช็ดมีกำหนดเวลา", "points_th": ["ทั้งสองหะดีษบ่งว่าการเช็ดรองเท้าหุ้มข้อมีกำหนดเวลา ไม่ได้ไม่มีขอบเขต ผู้เดินทางเช็ดสามวันสามคืน ผู้อยู่บ้านหนึ่งวันหนึ่งคืน เป็นทัศนะของนักวิชาการส่วนใหญ่จากเศาะหาบะฮ์ ตาบิอีน และรุ่นหลัง", "การแยกผู้เดินทางกับผู้อยู่บ้านคำนึงถึงสภาพการเดินทางและความยากลำบาก ผู้เดินทางจึงต้องการเวลามากกว่า แสดงว่าศาสนาอิสลามตั้งอยู่บนความง่ายและการขจัดความยุ่งยาก ทั้งในหุก่มทั่วไปและในอิบาดะฮ์โดยเฉพาะ", "การกำหนดเวลานี้คือเงื่อนไขที่สองของการเช็ดที่ใช้ได้ คือเช็ดในเวลาที่ศาสนากำหนด เงื่อนไขแรกคือสวมขณะมีความสะอาด ดังในหะดีษอัลมุฆีเราะฮ์"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "เฉพาะฮะดัษเล็ก และรองเท้าต้องสะอาด", "points_th": ["หะดีษเศาะฟวานบ่งว่าการเช็ดรองเท้าหุ้มข้อใช้เฉพาะฮะดัษเล็ก เช่น การนอน ปัสสาวะ และอุจจาระ ส่วนฮะดัษใหญ่ เช่น ญะนาบะฮ์ ไม่ใช้การเช็ด ถ้าเกิดญะนาบะฮ์ขณะสวมรองเท้า ต้องถอดแล้วล้างเท้า แม้อยู่ในกำหนดเวลา นี่คือเงื่อนไขที่สาม คือการเช็ดใช้กับฮะดัษเล็ก ไม่ใช่ญะนาบะฮ์หรือสิ่งที่ทำให้ต้องอาบน้ำ เงื่อนไขทั้งสามนี้ได้จากหะดีษในบทนี้", "เหลือเงื่อนไขที่สี่ คือรองเท้าหุ้มข้อหรือสิ่งที่มีความหมายเดียวกัน เช่น ถุงเท้า ต้องสะอาด ถ้าเป็นนะญิสก็เช็ดไม่ได้ เพราะมีรายงานที่ถูกต้องว่าท่านรสูลุลลอฮ์ ﷺ ถอดรองเท้าระหว่างละหมาด เมื่อญิบรีลบอกว่ามีสิ่งสกปรกอยู่"]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "เริ่มนับเวลาเมื่อใด", "points_th": ["ทัศนะที่หนึ่ง: กำหนดเวลาเริ่มจากการเช็ดครั้งแรก ไม่ใช่จากการสวม และไม่ใช่จากฮะดัษหลังสวม เพราะคำว่า \"ผู้อยู่บ้านเช็ดหนึ่งวันหนึ่งคืน และผู้เดินทางเช็ดสามวัน\" ซึ่งเกือบระบุชัดว่าเวลาเริ่มจากการเช็ด และไม่อาจเรียกเขาว่าผู้เช็ด นอกจากด้วยการเช็ดจริง เป็นทัศนะของอัลเอาซาอีย์ อบูเษาร์ และอีกรายงานจากอิมามอะห์มัด อิบนุลมุนซิรเลือก อันนะวะวีย์ว่า \"เป็นทัศนะที่หลักฐานมีน้ำหนัก\"", "อับดุรร็อซซากบันทึกจากอบูอุษมาน อันนะฮ์ดีย์ว่า \"ฉันอยู่ด้วยเมื่อสะอ์ด์และอิบนุอุมัรโต้แย้งกันต่อหน้าอุมัรเรื่องการเช็ดรองเท้าหุ้มข้อ อุมัรกล่าวว่า ให้เช็ดบนมันจนถึงเวลาเดียวกันของวันและคืนของเขา\" (สายรายงานศ่อฮีห์ตามเงื่อนไขของอัลบุคอรีย์และมุสลิม ตามที่อัลอัลบานีย์กล่าว) ตามทัศนะนี้ ผู้อยู่บ้านเช็ดได้ยี่สิบสี่ชั่วโมงนับจากการเช็ดครั้งแรก ผู้เดินทางเจ็ดสิบสองชั่วโมง โดยนับตามเวลา ไม่ใช่จำนวนละหมาด", "ทัศนะที่สอง: กำหนดเวลาเริ่มจากฮะดัษหลังสวม ถ้ามีฮะดัษก็เริ่มนับ เป็นทัศนะของอบูหะนีฟะฮ์ อัชชาฟิอีย์ อะห์มัด และนักวิชาการมาลิกีย์ที่เห็นว่าการเช็ดมีกำหนดเวลา เช่น อิบนุอับดิลบัรร์ และชาวมะดีนะฮ์บางท่าน พวกเขาว่า การเช็ดเป็นอิบาดะฮ์ที่มีกำหนดเวลา จึงนับจากเวลาที่ทำได้ และหลังฮะดัษคือเวลาที่เช็ดได้ จึงเป็นจุดเริ่มของกำหนดเวลา", "ผู้แต่งเห็นว่าทัศนะแรกมีน้ำหนักกว่า เพราะสอดคล้องกับหะดีษที่กำหนดเวลาด้วยการเช็ด จึงต้องเริ่มจากการเช็ด สนับสนุนด้วยฟัตวาของอุมัร (ร.ฎ.) และเพราะเวลาก่อนเช็ดและหลังฮะดัษเป็นเวลาที่ละหมาดไม่ได้ เมื่อเช็ดแล้วละหมาดจึงใช้ได้ การนับเวลาจึงควรเริ่มจากเวลาที่ละหมาดได้"]}], "tags_th": ["เช็ดรองเท้าหุ้มข้อ", "กำหนดเวลา", "ผู้เดินทาง", "ญะนาบะฮ์", "ฮะดัษเล็ก"]}, {"id": "v1-h063", "volume": 1, "bab": "khuffayn", "topic_ar": "جواز المسح على العمامة", "topic_th": "อนุญาตให้เช็ดบนผ้าโพกศีรษะ", "pages": [262, 267], "hadith": [{"no": 63, "matn_ar": "عَنْ ثَوْبَانَ رَضِيَ اللهُ عَنْهُ قَالَ: بَعَثَ رَسُولُ اللهِ ﷺ سَرِيَّةً، فَأَمَرَهُمْ أَنْ يَمْسَحُوا عَلَى الْعَصَائِبِ؛ يَعْنِي: الْعَمَائِمَ، وَالتَّسَاخِينِ؛ يَعْنِي: الْخِفَافَ. رَوَاهُ أَحْمَدُ، وَأَبُو دَاوُدَ، وَصَحَّحَهُ الْحَاكِمُ.", "translation_th": "จากเษาบาน (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ ส่งกองทหารหน่วยหนึ่งออกไป แล้วสั่งให้พวกเขาเช็ดบนอะศออิบ คือผ้าโพกศีรษะ และบนตะสาคีน คือรองเท้าหุ้มข้อ รายงานโดยอะห์มัดและอบูดาวูด และอัลหากิมระบุว่าศ่อฮีห์", "grade_th": "ศ่อฮีห์ (อัลหากิม อัซซะฮะบีย์เห็นด้วย) มีผู้วิจารณ์ว่าสายขาดระหว่างรอชิดกับเษาบาน แต่อัลบุคอรีย์ยืนยันว่ารอชิดได้ยินจากเษาบาน"}], "key_rulings_th": ["อนุญาตให้เช็ดบนรองเท้าหุ้มข้อและบนผ้าโพกศีรษะ ทั้งในการเดินทางและขณะอยู่บ้าน", "เช็ดเฉพาะบนผ้าโพกโดยไม่เช็ดศีรษะเลยก็ใช้ได้ (อะห์มัด อัลเอาซาอีย์ อิสหาก อบูเษาร์ ซอฮิรียะฮ์) ถ้าส่วนหน้าของศีรษะโผล่ ควรเช็ดด้วย", "ผู้แต่งเห็นว่าการพันใต้คาง (ตะห์นีก) ไม่ใช่เงื่อนไขของผ้าโพก ตามที่อิบนุตัยมียะฮ์เลือก แต่ผ้าโพกที่ถอดง่ายและไม่มีอันตราย ไม่เช็ดดีกว่า", "ถุงเท้าและผ้าพันเท้ามีหุก่มเหมือนรองเท้าหุ้มข้อ เพราะคำว่า \"ตะสาคีน\" ครอบคลุมทุกสิ่งที่ทำให้เท้าอุ่น", "ผู้แต่งเห็นว่าการกำหนดเวลาในการเช็ดผ้าโพกมีน้ำหนักและรอบคอบกว่า แม้ทัศนะที่ไม่กำหนดเวลาก็แข็งแรง"], "vocab": [{"ar": "سَرِيَّة", "th": "กองทหารหน่วยย่อย ห้าคนถึงสามร้อยคน บ้างว่าถึงสี่ร้อย"}, {"ar": "الْعَصَائِب", "th": "ผ้าโพกศีรษะ (พหูพจน์ของ عِصَابَة) คือทุกสิ่งที่พันศีรษะ เช่น ผ้าโพกหรือผ้าพัน"}, {"ar": "التَّسَاخِين", "th": "ทุกสิ่งที่ทำให้เท้าอุ่น เช่น รองเท้าหุ้มข้อ ถุงเท้า ในหะดีษอธิบายว่ารองเท้าหุ้มข้อ"}, {"ar": "اللَّفَائِف", "th": "ผ้าพันเท้า"}, {"ar": "التَّحْنِيك", "th": "การพันผ้าโพกส่วนหนึ่งใต้คาง"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อบูอับดิลลาฮ์ เษาบาน บินบุจญ์ดุด จากชาวอัสสะรอฮ์ (ดินแดนระหว่างมักกะฮ์กับเยเมน) เศาะหาบะฮ์ที่มีชื่อเสียง เคยถูกจับเป็นเชลย ท่านรสูลุลลอฮ์ ﷺ ซื้อและปลดปล่อยเขา เขาติดตามท่านนบี ﷺ ทั้งขณะอยู่บ้านและเดินทาง จนท่านเสียชีวิต และรายงานหะดีษจากท่าน", "จากนั้นย้ายไปชาม พักที่อัรร็อมละฮ์ แล้วย้ายไปหิมศ์ และอยู่ที่นั่นจนเสียชีวิตปี ฮ.ศ. 54"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อะห์มัด อบูดาวูด (146) และอัลหากิม บันทึกผ่านยะห์ยา บินสะอีด จากเษาร์ บินยะซีด จากรอชิด บินสะอ์ด์ จากเษาบาน ว่า \"ท่านรสูลุลลอฮ์ ﷺ ส่งกองทหารหน่วยหนึ่ง แล้วพวกเขาเจออากาศหนาว เมื่อกลับมาหาท่าน ท่านสั่งให้เช็ดบนผ้าโพกและรองเท้าหุ้มข้อ\" นี่เป็นสำนวนของอบูดาวูด ซึ่งระบุเรื่องความหนาว อะห์มัดและอัลหากิมก็เช่นกัน ในรายงานของอะห์มัด \"เมื่อพวกเขากลับมาหาท่านนบี ﷺ พวกเขาบ่นถึงความหนาวที่ประสบ\"", "อัลหากิมว่าศ่อฮีห์ และว่า \"ศ่อฮีห์ตามเงื่อนไขของมุสลิม\" อัซซะฮะบีย์เห็นด้วย แต่อัซซัยละอีย์แย้งว่า \"มีข้อพิจารณา เพราะมาจากเษาร์ บินยะซีด จากรอชิด บินสะอ์ด์ และมุสลิมไม่ได้บันทึกจากเษาร์ มีแต่อัลบุคอรีย์ และอัลบุคอรีย์กับมุสลิมไม่ได้ใช้รอชิด บินสะอ์ด์เป็นหลักฐาน\"", "มีผู้วิจารณ์ว่าสายขาด ตามที่อิบนุหะญัรระบุ อัลค็อลลาลยกคำของอะห์มัดว่า \"รอชิดไม่น่าจะได้ยินจากเษาบาน เพราะเษาบานเสียชีวิตไปนานแล้ว\" อบูหาติมและอัลหัรบีย์ก็กล่าวเช่นนั้น อัซซัยละอีย์แย้งว่า \"คำนี้มีข้อพิจารณา เพราะพวกเขาว่ารอชิดร่วมกับมุอาวิยะฮ์ในสงครามศิฟฟีน ตามที่อัลบุคอรีย์ระบุในหมวดญิฮาด และเษาบานเสียชีวิตปี ฮ.ศ. 54 รอชิดเสียชีวิตปี ฮ.ศ. 108\" อัลบุคอรีย์ยังยืนยันในอัตตารีคของเขาว่ารอชิดได้ยินจากเษาบาน", "อิบนุหะญัรยกว่าอิบนุมะอีน อบูหาติม อัลอิจลีย์ ยะอ์กูบ บินชัยบะฮ์ และอันนะสาอีย์ว่ารอชิดเชื่อถือได้ อะห์มัดว่า \"ไม่เป็นไร\" และอิบนุหัซม์ว่าอ่อน"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"กองทหารหน่วยหนึ่ง\" (สะรียะฮ์) คือกองทหารห้าคนถึงสามร้อยคน บ้างว่าถึงสี่ร้อย ได้ชื่อนี้เพราะส่วนใหญ่เดินทางกลางคืนและซ่อนตัวกลางวัน บ้างว่าเพราะเป็นทหารคัดเลือกที่ดีที่สุดของกองทัพ", "\"แล้วสั่งพวกเขา\" คืออนุญาตให้พวกเขา หลังจากพวกเขาบ่นถึงความหนาว ตามรายงานของอะห์มัด", "\"บนอะศออิบ\" ในหะดีษอธิบายว่าผ้าโพกศีรษะ ที่ชัดคือการอธิบายนี้เป็นคำของอิบนุหะญัร เพราะผู้แต่งไม่พบว่าแทรกอยู่ในแหล่งที่มา อะศออิบเป็นพหูพจน์ของอิศอบะฮ์ คือผ้าโพก อบูอุบัยด์ อิมามด้านภาษาก็อธิบายเช่นนั้น ได้ชื่อนี้เพราะใช้พันศีรษะ ทุกสิ่งที่ใช้พันศีรษะ เช่น ผ้าโพกหรือผ้าพัน ก็เรียกว่าอิศอบะฮ์", "\"ตะสาคีน\" ในหะดีษอธิบายว่ารองเท้าหุ้มข้อ อบูอุบัยด์ก็อธิบายเช่นนั้น ไม่มีคำเอกพจน์ตามที่ษะอ์ลับกล่าว อัลมุบัรริดและคนอื่นว่ามีเอกพจน์ และกล่าวว่า รากของคำคือทุกสิ่งที่ทำให้เท้าอุ่น ทั้งรองเท้าหุ้มข้อ ถุงเท้า และอื่น ๆ จึงไม่เฉพาะรองเท้าหุ้มข้อ ตามที่ได้จากอัลกอมูสและลิสานุลอะร็อบ", "สิ่งที่สวมที่เท้ามีหลายชื่อ แบ่งได้สามประเภท (1) รองเท้าหุ้มข้อ (2) สิ่งที่ใช้แทน เช่น ถุงเท้า มูก (รองเท้าหุ้มทับรองเท้าหุ้มข้ออีกชั้น โดยเฉพาะในเมืองหนาว) และญุรมูก (3) ผ้าพันเท้า ผ้าพันเท้าอยู่ในความหมายของ \"ตะสาคีน\" อย่างชัดเจน จึงมีหุก่มเหมือนการเช็ดรองเท้าหุ้มข้อ อิบนุตัยมียะฮ์เลือกเช่นนี้ เพราะผ้าพันเท้าแทบไม่มีใครใช้นอกจากผู้ที่จำเป็น แล้วจะห้ามผู้ที่จำเป็นมากกว่า แต่ผ่อนผันให้ผู้ที่จำเป็นน้อยกว่าได้อย่างไร"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "เช็ดบนผ้าโพกศีรษะ", "points_th": ["หะดีษเป็นหลักฐานว่าอนุญาตให้เช็ดบนรองเท้าหุ้มข้อและผ้าโพกศีรษะในการเดินทาง และขณะอยู่บ้านก็เทียบได้ เพราะข้อผ่อนผันเป็นเรื่องทั่วไป", "การเช็ดบนผ้าโพกอย่างเดียว โดยไม่เช็ดส่วนใดของศีรษะ ใช้ได้ เป็นหนึ่งในสองทัศนะของนักวิชาการ คือทัศนะของอิมามอะห์มัด อัลเอาซาอีย์ อิสหาก อบูเษาร์ และซอฮิรียะฮ์ หลักฐานคือหะดีษนี้และหะดีษที่คล้ายกัน อิบนุลก็อยยิมกล่าวว่า \"การเช็ดบนผ้าโพกเป็นซุนนะฮ์จากท่านรสูลุลลอฮ์ ﷺ ที่ปฏิบัติสืบมา และเป็นที่รู้จักในหมู่นักวิชาการที่น่าเชื่อถือในทุกเมือง\" อัชเชากานีย์กล่าวว่า \"สรุปคือมีรายงานที่ถูกต้องว่าเช็ดบนศีรษะอย่างเดียว บนผ้าโพกอย่างเดียว และบนศีรษะกับผ้าโพก ทั้งหมดศ่อฮีห์ การจำกัดความใช้ได้ไว้เพียงบางแบบโดยไม่มีเหตุ ไม่ใช่วิสัยของผู้ที่เป็นธรรม\"", "หะดีษอัลมุฆีเราะฮ์ในบทวุฎูอ์ว่าท่านรสูลุลลอฮ์ ﷺ เช็ดที่ส่วนหน้าของศีรษะและบนผ้าโพก ส่วนหะดีษเษาบานนี้ตามรูปคำคือการเช็ดบนผ้าโพกอย่างเดียว ถ้าผ้าโพกปิดศีรษะทั้งหมด เช็ดบนผ้าโพกก็พอ ถ้าศีรษะโผล่บางส่วน เช่น ส่วนหน้า ควรเช็ดพร้อมกับผ้าโพก ตามการกระทำของท่านนบี ﷺ", "หันบะลีย์กำหนดว่าผ้าโพกต้องเป็นแบบของมุสลิม คือมีส่วนหนึ่งพันใต้คาง เพราะเป็นผ้าโพกของชาวอาหรับ ไม่ว่าจะมีชายห้อยหรือไม่ และเช็ดบนผ้าโพกที่มีชายห้อยได้ ส่วนผ้าโพกที่พันรอบศีรษะเฉย ๆ ไม่พันใต้คาง และไม่มีชายห้อย ซึ่งคล้ายผ้าโพกของชาวซิมมีย์ ตามทัศนะหนึ่งในหันบะลีย์ เช็ดไม่ได้ เพราะเหมือนหมวก (เฏาะวากีย์) ซึ่งถอดไม่ยาก", "อิบนุตัยมียะฮ์แย้งเรื่องนี้ และอธิบายว่าการพันใต้คางไม่ใช่เงื่อนไข สลัฟพันใต้คางเพราะพวกเขาขี่ม้าและออกญิฮาดในหนทางของอัลลอฮ์ บางคนผูกด้วยตะขอหรือผ้าพัน", "ผู้แต่งเห็นว่าที่ชัดกว่าคือไม่ใช่เงื่อนไข เพราะคำว่าผ้าโพกในตัวบทกล่าวไว้โดยไม่มีเงื่อนไข และการพันใต้คางไม่ใช่ลักษณะของผ้าโพกที่ต้องกล่าวถึง เมื่อเป็นผ้าโพกก็เช็ดได้ และวิทยปัญญาของการเช็ดบนผ้าโพกไม่ได้ขึ้นอยู่กับความยากในการถอดเท่านั้น อาจคำนึงถึงการที่ผ้าโพกจะคลายถ้าขยับเพื่อเช็ดศีรษะ หรือเกรงอันตรายจากความหนาวหรือความเจ็บป่วยถ้าถอด โดยเฉพาะในเมืองหนาว แต่ความรอบคอบเป็นสิ่งที่ควร ถ้าเป็นผ้าโพกแบบพันเฉย ๆ ที่ถอดแล้วไม่มีอันตราย ไม่เช็ดดีกว่า เพราะถอดง่ายและคล้ายหมวก และหลักเดิมของหุก่มคือมีเหตุผล"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "กำหนดเวลาการเช็ดผ้าโพก", "points_th": ["ตามรูปคำ หะดีษบ่งว่าไม่มีกำหนดเวลาทั้งในการเช็ดรองเท้าหุ้มข้อและผ้าโพก ส่วนรองเท้าหุ้มข้อได้กล่าวไปแล้วว่ามีกำหนดเวลา หะดีษนี้จึงตีความตามหลักฐานเรื่องกำหนดเวลา (จะกล่าวในหะดีษต่อไป)", "ส่วนผ้าโพกมีสองทัศนะ ทัศนะแรก: มีกำหนดเวลา เป็นมัซฮับหันบะลีย์ โดยเทียบกับรองเท้าหุ้มข้อ เพราะถ้ารองเท้าหุ้มข้อมีกำหนดเวลา ทั้งที่โดยทั่วไปถอดยากกว่าผ้าโพก สิ่งที่ถอดง่ายกว่าก็ยิ่งสมควรมีกำหนด ทัศนะที่สอง: ไม่มีกำหนดเวลา ตามหลักของมัซฮับมาลิกีย์ ซึ่งไม่ถือกำหนดเวลาในการเช็ดรองเท้าหุ้มข้อ อิบนุหัซม์เลือก และอัชเชากานีย์เอนเอียงไปทางนี้ เพราะไม่มีรายงานจากท่านนบี ﷺ ว่ากำหนดเวลาการเช็ดผ้าโพก ท่านเช็ดทั้งผ้าโพกและรองเท้าหุ้มข้อ กำหนดเวลาให้รองเท้า แต่ไม่ได้กำหนดให้ผ้าโพก ผู้ที่ทำให้ทั้งสองมีหุก่มเดียวกัน ก็กล่าวสิ่งที่ท่านรสูล ﷺ ไม่ได้กล่าว", "ผู้แต่งเห็นว่าทัศนะนี้แข็งแรงเพราะเหตุผลแข็งแรง ส่วนการเทียบกับรองเท้าหุ้มข้อมีข้อพิจารณา เพราะการชำระอวัยวะที่ถูกปิดในกรณีผ้าโพกคือการเช็ด ส่วนในกรณีเท้าคือการล้าง และการเช็ดเบากว่าการล้าง จึงเทียบกันไม่ได้ แต่อาจกล่าวได้ว่าความคล้ายกันคือทั้งสองเป็นการเช็ด และเป็นข้อผ่อนผัน ทัศนะว่ามีกำหนดเวลาจึงมีความแข็งแรง โดยเฉพาะเพราะรอบคอบกว่า และการถอดผ้าโพกหลังผ่านสามวันสำหรับผู้เดินทาง และหนึ่งวันหนึ่งคืนสำหรับผู้อยู่บ้าน ไม่ได้ลำบากมาก เป็นที่รู้กันว่าคนมักถอดผ้าโพกเมื่อนอน และสวมเมื่อตื่นเมื่อต้องการ ซึ่งมักเป็นทุกวัน และอาจมากกว่าหนึ่งครั้ง ทัศนะว่ามีกำหนดเวลาจึงมีน้ำหนัก", "ส่วนวิธีเช็ดผ้าโพก ไม่มีระบุในตัวบท การเช็ดมีรายงานโดยไม่กำหนด ถ้าเช็ดส่วนใหญ่ของผ้าโพกก็พอ และถ้าส่วนหน้าของศีรษะโผล่ ก็เช็ดพร้อมกับผ้าโพก"]}], "tags_th": ["ผ้าโพกศีรษะ", "เช็ดรองเท้าหุ้มข้อ", "ถุงเท้า", "ผ้าพันเท้า", "กำหนดเวลา"]}, {"id": "v1-h064", "volume": 1, "bab": "khuffayn", "topic_ar": "ما جاء غير صريح في مسح الخفين من غير توقيت", "topic_th": "รายงานที่ไม่ชัดเจนว่าเช็ดรองเท้าหุ้มข้อได้โดยไม่มีกำหนดเวลา", "pages": [268, 273], "hadith": [{"no": 64, "matn_ar": "عَنْ عُمَرَ مَوْقُوفًا، وَعَنْ أَنَسٍ مَرْفُوعًا: «إِذَا تَوَضَّأَ أَحَدُكُمْ وَلَبِسَ خُفَّيْهِ فَلْيَمْسَحْ عَلَيْهِمَا، وَلْيُصَلِّ فِيهِمَا، وَلَا يَخْلَعْهُمَا إِنْ شَاءَ إِلَّا مِنْ جَنَابَةٍ». أَخْرَجَهُ الدَّارَقُطْنِيُّ، وَالْحَاكِمُ وَصَحَّحَهُ.", "translation_th": "จากอุมัร (ร.ฎ.) เป็นคำของเขา (เมากูฟ) และจากอนัส (ร.ฎ.) ถึงท่านนบี ﷺ (มัรฟูอ์): \"เมื่อผู้ใดในพวกท่านอาบน้ำละหมาดและสวมรองเท้าหุ้มข้อ ก็ให้เช็ดบนรองเท้า และละหมาดในรองเท้า และไม่ต้องถอดหากเขาไม่ต้องการ เว้นแต่เพราะญะนาบะฮ์\" บันทึกโดยอัดดารุกุฏนีย์ และอัลหากิมซึ่งระบุว่าศ่อฮีห์", "grade_th": "รายงานมัรฟูอ์จากอนัส: อัลหากิมว่าศ่อฮีห์ตามเงื่อนไขของมุสลิม อิบนุอับดิลฮาดีว่าสายรายงานแข็งแรง รายงานเมากูฟจากอุมัร: สายรายงานแข็งแรง"}], "key_rulings_th": ["ต้องสวมรองเท้าหุ้มข้อหลังความสะอาดที่สมบูรณ์จากฮะดัษเล็ก คือวุฎูอ์", "ผู้ที่เห็นว่าการเช็ดไม่มีกำหนดเวลา (มาลิก อัลลัยษ์ อัลเอาซาอีย์) อ้างหะดีษนี้ แต่นักวิชาการส่วนใหญ่ รวมถึงอบูหะนีฟะฮ์ อัชชาฟิอีย์ และอะห์มัด ว่ามีกำหนดเวลา", "ผู้แต่งเห็นว่าที่ถูกต้องคือมีกำหนดเวลา เพราะหะดีษเรื่องกำหนดเวลาศ่อฮีห์และมุตะวาติร ส่วนหะดีษนี้กล่าวไว้โดยไม่มีเงื่อนไข จึงตีความตามหะดีษที่จำกัด", "ข้อยกเว้นตามอิบนุตัยมียะฮ์: เมื่อจำเป็น เช่น หนาวจัดที่ถอดแล้วเป็นอันตราย หรือถอดแล้วจะพลัดจากคณะเดินทาง ก็เช็ดต่อหลังครบกำหนดได้ เหมือนเฝือก (ญะบีเราะฮ์) ในขอบเขตแคบ"], "vocab": [{"ar": "مَوْقُوف", "th": "เมากูฟ (ศัพท์หะดีษ) คือรายงานที่เป็นคำของเศาะหาบะฮ์ และไม่มีหุก่มว่ามาถึงท่านนบี ﷺ"}, {"ar": "مَرْفُوع", "th": "มัรฟูอ์ (ศัพท์หะดีษ) คือรายงานที่พาดพิงถึงท่านนบี ﷺ"}, {"ar": "مُنْكَرُ الْحَدِيثِ", "th": "หะดีษของเขามุงกัร คือคุณลักษณะของผู้รายงานที่ควรทิ้งหะดีษของเขา ต่างจาก \"รายงานหะดีษมุงกัร\" ซึ่งหมายถึงเกิดขึ้นบางครั้ง ไม่ใช่เสมอ"}, {"ar": "الْجَبِيرَة", "th": "เฝือก หรือผ้าพันแผลที่พันอวัยวะที่หักหรือบาดเจ็บ"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["หะดีษนี้มีรายงานแบบเมากูฟจากอุมัร และแบบมัรฟูอ์จากอนัส เมากูฟคือสิ่งที่พาดพิงถึงเศาะหาบะฮ์ และไม่มีหุก่มว่ามาถึงท่านนบี ﷺ มัรฟูอ์คือสิ่งที่พาดพิงถึงท่านนบี ﷺ", "รายงานมัรฟูอ์จากอนัส: อัดดารุกุฏนีย์และอัลหากิม ผ่านอับดุลฆ็อฟฟาร บินดาวูด อัลหัรรอนีย์ จากหัมมาด บินสะละมะฮ์ จากอุบัยดุลลอฮ์ บินอบีบักร์ และษาบิต จากอนัส อัลหากิมว่า \"สายรายงานศ่อฮีห์ตามเงื่อนไขของมุสลิม และผู้รายงานทั้งหมดเชื่อถือได้\" อัดดารุกุฏนีย์ยังบันทึกผ่านอะสัด บินมูซา จากหัมมาด บินสะละมะฮ์ อิบนุอับดิลฮาดีว่า \"สายรายงานแข็งแรง อะสัด บินมูซาสัจจริง อันนะสาอีย์และคนอื่นว่าเชื่อถือได้\" อิบนุลเญาซีย์ไม่ได้ชี้ข้อบกพร่องในอัตตะห์กีก แต่กล่าวว่า \"นี่ตีความว่าหมายถึงภายในกำหนดสามวัน\"", "อิบนุหัซม์ชี้ข้อบกพร่องว่าอะสัด บินมูซารายงานคนเดียวจากหัมมาด และอะสัดหะดีษของเขามุงกัร ใช้เป็นหลักฐานไม่ได้ อิบนุดะกีกิลอีดและอิบนุหะญัรแย้งว่า อะสัดไม่ได้รายงานคนเดียว เพราะอัลหากิมและอัดดารุกุฏนีย์บันทึกผ่านอับดุลฆ็อฟฟารด้วย และอะสัดเชื่อถือได้", "อิบนุดะกีกิลอีดกล่าวว่า \"อิบนุหัซม์อาจอ่านคำของอิบนุยูนุสในตารีคุลฆุเราะบาอ์ว่า อะสัด บินมูซารายงานหะดีษมุงกัร แต่เขาเชื่อถือได้ และน่าจะเป็นความบกพร่องจากคนอื่น ถ้าเขาเอาคำนี้มา ก็ไม่ดีนัก เพราะการกล่าวว่า 'หะดีษของเขามุงกัร' ไม่เหมือนการกล่าวว่า 'รายงานหะดีษมุงกัร' เพราะ 'หะดีษของเขามุงกัร' เป็นคุณลักษณะของผู้รายงานที่ควรทิ้งหะดีษ ส่วนอีกสำนวนหมายถึงเกิดขึ้นบางครั้ง ไม่ใช่เสมอ อะห์มัดกล่าวถึงมุหัมมัด บินอิบรอฮีม อัตตัยมีย์ว่า 'รายงานหะดีษมุงกัร' ทั้งที่อัลบุคอรีย์และมุสลิมใช้เขาเป็นหลักฐาน และเป็นผู้รายงานหะดีษ 'แท้จริงการกระทำขึ้นอยู่กับเจตนา' ... อิบนุยูนุสตัดสินว่าเขาเชื่อถือได้ แล้วจะเชื่อถือได้แต่ใช้หะดีษเป็นหลักฐานไม่ได้อย่างไร\"", "รายงานเมากูฟ: อัดดารุกุฏนีย์บันทึกผ่านอะสัด บินมูซา จากหัมมาด บินสะละมะฮ์ จากมุหัมมัด บินซิยาด จากซุบัยด์ บินอัศศ็อลต์ ว่าได้ยินอุมัรกล่าว... สายรายงานแข็งแรง มุหัมมัด บินซิยาดคืออัลกุร็อชีย์ อัลมะดะนีย์ เชื่อถือได้ นักบันทึกทั้งหกบันทึกหะดีษของเขา ซุบัยด์ บินอัศศ็อลต์ อบูหาติมระบุว่ารายงานจากอุมัรและทันยุคเขา อิบนุมะอีนว่า \"ซุบัยด์เชื่อถือได้\" แต่อิบนุหัซม์รายงานด้วยสำนวน \"และให้ละหมาดในรองเท้าตราบที่ไม่ถอด\" แล้วชี้ข้อบกพร่องของรายงานอับดุรเราะห์มาน บินมะฮ์ดีย์ จากหัมมาด ด้วยสำนวน \"ให้เช็ดบนรองเท้าถ้าต้องการ และไม่ต้องถอด\"", "การที่อิบนุหัซม์ถือว่ารายงานเมากูฟจากอุมัรมีน้ำหนักกว่า และอะสัด บินมูซารายงานคนเดียว มีข้อพิจารณาสองข้อ (1) ศิษย์รุ่นใหญ่ของหัมมาด บินสะละมะฮ์ไม่ได้รายงานหะดีษนี้จากเขา อัลหากิมกล่าวว่า \"หะดีษนี้ไม่มีที่ชาวบัศเราะฮ์จากหัมมาด\" (2) อับดุรเราะห์มาน บินมะฮ์ดีย์ อิมามผู้เชี่ยวชาญ รายงานตรงกับอะสัด บินมูซาว่าเป็นคำของอุมัร", "มีรายงานจากอุกบะฮ์ บินอามิรว่า เขาไปหาอุมัรเมื่อพิชิตดิมัชก์ \"ฉันสวมรองเท้าหุ้มข้อ อุมัรถามว่า อุกบะฮ์ ท่านไม่ได้ถอดรองเท้ามานานเท่าไร ฉันบอกว่าตั้งแต่วันศุกร์ คือแปดวัน เขากล่าวว่า ท่านทำดีแล้ว และถูกตามซุนนะฮ์\" (อัดดารุกุฏนีย์ อัลหากิมว่าศ่อฮีห์ตามเงื่อนไขของมุสลิม อัซซะฮะบีย์เห็นด้วย อัลอัลบานีย์ใส่ไว้ในอัศเศาะฮีหะฮ์ และอิบนุตัยมียะฮ์ว่าศ่อฮีห์ แต่อัดดารุกุฏนีย์ในอัลอิลัลว่าคำว่า \"ซุนนะฮ์\" ไม่ใช่สำนวนที่ถูกต้อง) คำของอัลบัยฮะกีย์ในการประสานรายงานต่าง ๆ จากอุมัรจะกล่าวต่อไป ซึ่งบ่งว่ารายงานนี้ศ่อฮีห์ เพราะถ้าอ่อน ก็ไม่ต้องประสานกับหะดีษเรื่องกำหนดเวลา"]}, {"wajh": 2, "type": "fiqh", "heading_ar": null, "heading_th": "ต้องสวมหลังวุฎูอ์", "points_th": ["หะดีษเป็นหลักฐานว่าต้องสวมรองเท้าหุ้มข้อขณะมีความสะอาด เพราะคำว่า \"เมื่อผู้ใดในพวกท่านอาบน้ำละหมาด\" (กล่าวไปแล้วในหะดีษอัลมุฆีเราะฮ์) แต่หะดีษนี้ให้ความรู้เพิ่มว่า ความสะอาดในหะดีษอัลมุฆีเราะฮ์และหะดีษที่มีความหมายเดียวกัน หมายถึงความสะอาดที่สมบูรณ์จากฮะดัษเล็ก คือวุฎูอ์", "อิบนุอับดิลบัรร์กล่าวว่า \"นี่คือหลักที่เห็นพ้องกัน ไม่ให้เช็ดรองเท้าหุ้มข้อ นอกจากผู้ที่สวมขณะเท้าทั้งสองสะอาด\""]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "มีกำหนดเวลาหรือไม่", "points_th": ["หะดีษนี้บ่งว่าเช็ดรองเท้าหุ้มข้อได้โดยไม่มีกำหนดเวลา เพราะคำว่า \"และไม่ต้องถอดหากเขาไม่ต้องการ เว้นแต่เพราะญะนาบะฮ์\" อัดดารุกุฏนีย์ตั้งชื่อบทในสุนันของเขาว่า \"บทสิ่งที่มีรายงานเรื่องการเช็ดรองเท้าหุ้มข้อโดยไม่มีกำหนดเวลา\"", "นี่เป็นหลักฐานหนึ่งของผู้ที่ว่าการเช็ดไม่มีกำหนดเวลา ผู้สวมเช็ดได้ตราบที่ไม่ถอดหรือไม่มีญะนาบะฮ์ ทัศนะนี้พาดพิงถึงมาลิกและศิษย์ อัลลัยษ์ บินสะอ์ด์ และอัลเอาซาอีย์ อิบนุอับดิลบัรร์กล่าวว่า \"มีรายงานเช่นนี้จากอุมัร บินอัลค็อฏฏอบ อุกบะฮ์ บินอามิร อับดุลลอฮ์ บินอุมัร และอัลหะซัน อัลบัศรีย์\"", "หลักฐานของพวกเขาอีกข้อคือหะดีษอุบัยย์ บินอิมาเราะฮ์ ที่ถามท่านรสูลุลลอฮ์ ﷺ ว่า เช็ดรองเท้าหุ้มข้อได้ไหม ท่านตอบว่า \"ได้\" เขาถามว่า หนึ่งวันหรือ ท่านตอบว่า \"หนึ่งวัน\" สองวันหรือ \"และสองวัน\" สามวันหรือ \"ได้ และตามที่ท่านต้องการ\" (จะกล่าวว่าเป็นหะดีษอ่อน) และพวกเขาให้เหตุผลว่า นี่คือการชำระ จึงไม่กำหนดด้วยเวลา เหมือนการล้างเท้า อิบนุรุชด์ระบุว่ากำหนดเวลาไม่มีผลต่อการเสียของความสะอาด เพราะสิ่งที่ทำให้เสียคือฮะดัษ พวกเขาจึงถือว่าการเทียบนี้ขัดกับหะดีษอย่างหะดีษอะลีและเศาะฟวาน ตามที่อิบนุรุชด์กล่าว แต่เป็นเหตุผลที่ยืนไม่ได้เมื่อเทียบกับตัวบทศ่อฮีห์ที่ชัดเจน", "ทัศนะว่ามีกำหนดเวลาเป็นมัซฮับของนักวิชาการส่วนใหญ่ รวมถึงอิมามทั้งสาม คืออบูหะนีฟะฮ์ อัชชาฟิอีย์ และอะห์มัด และอิบนุอับดิลบัรร์จากมาลิกีย์เลือก (หลักฐานกล่าวไปแล้ว) อัฏเฏาะหาวีย์ระบุว่าหะดีษจากท่านรสูลุลลอฮ์ ﷺ เรื่องกำหนดเวลาในการเช็ดรองเท้าหุ้มข้อมาอย่างมุตะวาติร คือสามวันสามคืนสำหรับผู้เดินทาง และหนึ่งวันหนึ่งคืนสำหรับผู้อยู่บ้าน", "อิบนุอับดิลบัรร์กล่าวว่า \"ตาบิอีนและนักนิติศาสตร์ส่วนใหญ่ยึดเช่นนี้ และสำหรับฉันนี่คือความรอบคอบ เพราะการเช็ดยืนยันอย่างมุตะวาติร ชาวซุนนะฮ์และอัลญะมาอะฮ์เห็นพ้อง และใจสบายกับการเห็นพ้องของพวกเขา เมื่อส่วนใหญ่ว่าผู้อยู่บ้านเช็ดได้ไม่เกินห้าละหมาด หนึ่งวันหนึ่งคืน และผู้เดินทางไม่เกินสิบห้าละหมาด สามวันสามคืน ผู้รู้ก็ต้องปฏิบัติละหมาดของตนด้วยความมั่นใจ ความมั่นใจคือการล้าง จนกว่าจะเห็นพ้องเรื่องการเช็ด และพวกเขาไม่ได้เห็นพ้องเกินสามวันสำหรับผู้เดินทาง และเกินหนึ่งวันสำหรับผู้อยู่บ้าน\"", "หะดีษอนัสที่กล่าวมาตอบได้สองทาง (1) เป็นหะดีษที่กล่าวไว้โดยไม่มีเงื่อนไข จึงตีความตามหะดีษที่จำกัด (2) คำว่า \"หากต้องการ\" อาจบ่งว่าการเช็ดไม่ใช่วาญิบ เพื่อขจัดความเข้าใจว่าเป็นวาญิบจากรูปคำ เพราะรูปคำของข้อห้ามคือหะรอม (อัศศ็อนอานีย์กล่าว) จึงถอดและล้างได้ แม้ยังอยู่ในกำหนดเวลา", "ส่วนรายงานจากอุมัรว่าไม่มีกำหนดเวลา ก็มีรายงานจากเขาที่บ่งว่ามีกำหนดเวลา คืออับดุรร็อซซากบันทึกจากอบูอุษมาน อันนะฮ์ดีย์ว่า \"ฉันอยู่ด้วยเมื่อสะอ์ด์และอิบนุอุมัรโต้แย้งกันต่อหน้าอุมัรเรื่องการเช็ดรองเท้าหุ้มข้อ อุมัรกล่าวว่า ให้เช็ดจนถึงเวลาเดียวกันของวันและคืนของเขา\" ซึ่งชัดเจนว่าอุมัรเห็นว่ามีกำหนดเวลา และหัมมาดรายงานจากอิบรอฮีม จากอัลอัสวัด จากนุบาตะฮ์ จากอุมัรว่า \"ผู้เดินทางสามวัน ผู้อยู่บ้านหนึ่งวันหนึ่งคืน\"", "อัลบัยฮะกีย์ตอบความขัดแย้งนี้ว่า \"เรามีรายงานจากอุมัรเรื่องกำหนดเวลา ซึ่งอาจเป็นสิ่งที่เขากลับมาเห็น เมื่อรายงานที่ถูกต้องจากท่านนบี ﷺ เรื่องกำหนดเวลามาถึงเขา หรือคำที่สอดคล้องกับซุนนะฮ์ที่มีชื่อเสียงย่อมสมควรกว่า\" อันนะวะวีย์ยกคำนี้และเห็นด้วย", "รายงานจากอุมัรในเรื่องของอุกบะฮ์ บินอามิร อาจตีความว่าเป็นกรณีจำเป็น และถอดรองเท้าไม่ได้ เพราะจะพลัดจากคณะเดินทางหรือเหตุอื่น อิบนุตัยมียะฮ์เห็นเช่นนี้ โดยกล่าวว่า \"การเช็ดรองเท้าหุ้มข้อมีกำหนดเวลาตามทัศนะของนักวิชาการส่วนใหญ่... แต่ถ้าการถอดหลังครบเวลามีอันตราย เช่น หนาวจัด ถอดแล้วเป็นอันตราย เช่น ในดินแดนหิมะ หรืออยู่ในคณะเดินทางที่ถ้าถอดแล้วล้างจะไม่รอ จนพลัดจากพวกเขา ไม่รู้ทาง หรือกลัวศัตรูหรือสัตว์ร้าย หรือถ้าทำเช่นนั้นจะพลาดสิ่งวาญิบ เป็นต้น กรณีนี้บางท่านว่าให้ตะยัมมุม บางท่านว่าให้เช็ดเพราะความจำเป็น ซึ่งแข็งแรงกว่า เพราะการสวมรองเท้าในกรณีนี้เหมือนการพันเฝือกในบางแง่ หะดีษเรื่องกำหนดเวลาสั่งให้เช็ดหนึ่งวันหนึ่งคืน และสามวันสามคืน ไม่มีการห้ามเกินนั้น นอกจากโดยนัย และความหมายโดยนัยไม่ครอบคลุมทุกกรณี ถ้าถอดหลังครบเวลาได้ก็ปฏิบัติตามหะดีษเหล่านี้ หะดีษอุกบะฮ์ บินอามิรจึงตีความเช่นนี้... และเป็นหะดีษศ่อฮีห์\"", "อิบนุตัยมียะฮ์เองปฏิบัติเช่นนี้ในการเดินทางครั้งหนึ่ง โดยกล่าวว่า \"เมื่อฉันเดินทางด้วยม้าส่งสาร และเร่งเดินทาง กำหนดเวลาการเช็ดหมด ถอดแล้วอาบน้ำละหมาดไม่ได้นอกจากจะพลัดจากคณะเดินทาง หรือทำให้พวกเขาต้องรอเป็นอันตราย ฉันจึงเห็นว่ากรณีจำเป็นไม่มีกำหนดเวลา และถือเหมือนกรณีเฝือก และตีความหะดีษอุมัรและคำของเขากับอุกบะฮ์ว่า 'ท่านถูกตามซุนนะฮ์' ตามนี้ เพื่อประสานรายงานต่าง ๆ แล้วฉันพบว่ามีระบุชัดในมะฆอซีของอิบนุอาอิซ ว่าเขาเดินทางด้วยม้าส่งสารเหมือนที่ฉันเดินทางเมื่อพิชิตดิมัชก์... ฉันจึงสรรเสริญอัลลอฮ์ที่ตรงกัน\" และกล่าวว่า \"เป็นประเด็นที่มีประโยชน์มาก\"", "ผู้แต่งเห็นว่าที่ถูกต้องในประเด็นนี้คือมีกำหนดเวลา เพราะหะดีษเรื่องกำหนดเวลาศ่อฮีห์และมุตะวาติร ไม่มีสิ่งใดขัด ส่วนรายงานที่ไม่มีกำหนดเวลาเป็นแบบไม่มีเงื่อนไข จึงถูกจำกัดด้วยหะดีษเหล่านั้น ตามหลักอุศูลว่าสิ่งที่ไม่มีเงื่อนไขตีความตามสิ่งที่มีเงื่อนไข เพื่อประสานหลักฐาน และอาจปฏิบัติตามรายงานนั้นในขอบเขตแคบ ตามที่อิบนุตัยมียะฮ์กล่าว เพื่อไม่ให้การยึดรายงานนั้นทำให้ทิ้งหะดีษเรื่องกำหนดเวลา"]}], "tags_th": ["เช็ดรองเท้าหุ้มข้อ", "กำหนดเวลา", "ความจำเป็น", "เมากูฟ", "อุมัร"]}, {"id": "v1-h065", "volume": 1, "bab": "khuffayn", "topic_ar": "اشتراط لبس الخف على طهارة", "topic_th": "เงื่อนไขว่าต้องสวมรองเท้าหุ้มข้อขณะมีความสะอาด", "pages": [274, 276], "hadith": [{"no": 65, "matn_ar": "عَنْ أَبِي بَكْرَةَ رَضِيَ اللهُ عَنْهُ، عَنِ النَّبِيِّ ﷺ: أَنَّهُ رَخَّصَ لِلْمُسَافِرِ ثَلَاثَةَ أَيَّامٍ وَلَيَالِيَهُنَّ، وَلِلْمُقِيمِ يَوْمًا وَلَيْلَةً، إِذَا تَطَهَّرَ فَلَبِسَ خُفَّيْهِ: أَنْ يَمْسَحَ عَلَيْهِمَا. أَخْرَجَهُ الدَّارَقُطْنِيُّ، وَصَحَّحَهُ ابْنُ خُزَيْمَةَ.", "translation_th": "จากอบูบักเราะฮ์ (ร.ฎ.) จากท่านนบี ﷺ ว่า ท่านผ่อนผันให้ผู้เดินทางสามวันสามคืน และผู้อยู่บ้านหนึ่งวันหนึ่งคืน เมื่อเขาชำระแล้วสวมรองเท้าหุ้มข้อ ให้เช็ดบนรองเท้าทั้งสอง บันทึกโดยอัดดารุกุฏนีย์ และอิบนุคุซัยมะฮ์ระบุว่าศ่อฮีห์", "grade_th": "หะซันด้วยหลักฐานสนับสนุน (อัลบุคอรีย์และอัลอัลบานีย์ว่าหะซัน) สายรายงานมีความอ่อนเพราะอัลมุฮาจิร"}], "key_rulings_th": ["การเช็ดรองเท้าหุ้มข้อมีกำหนดเวลา ผู้เดินทางสามวันสามคืน ผู้อยู่บ้านหนึ่งวันหนึ่งคืน", "เงื่อนไขคือต้องสวมขณะมีความสะอาดที่สมบูรณ์ คือวุฎูอ์ ไม่จำเป็นต้องสวมทันทีหลังชำระ", "การเช็ดรองเท้าหุ้มข้อเป็นข้อผ่อนผัน (รุคเศาะฮ์) ส่วนการล้างเท้าเป็นหุก่มเดิม (อะซีมะฮ์)", "หะดีษนี้จำกัดหะดีษเษาบานและหะดีษอื่นที่กล่าวไว้โดยไม่มีเงื่อนไข"], "vocab": [{"ar": "رَخَّصَ", "th": "ผ่อนผัน ทำให้ง่าย"}, {"ar": "الرُّخْصَة", "th": "ข้อผ่อนผัน คือหุก่มที่ยืนยันต่างจากหลักฐานเดิมเพราะมีเหตุ คู่ตรงข้ามคืออะซีมะฮ์ (หุก่มเดิม)"}, {"ar": "إِذَا تَطَهَّرَ", "th": "เมื่อชำระด้วยวุฎูอ์ที่สมบูรณ์ ด้วยน้ำ"}, {"ar": "الْبَكْرَة", "th": "รอกไม้กลมที่มีร่องตรงกลาง ใช้ตักน้ำ"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อบูบักเราะฮ์ นุฟัยอ์ บินอัลหาริษ อัษษะเกาะฟีย์ บ้างว่านุฟัยอ์ บินมัสรูห์ เป็นที่รู้จักด้วยกุนยะฮ์ เขาไต่ลงมาหาท่านนบี ﷺ จากป้อมฏออิฟด้วยรอก (บักเราะฮ์) จึงได้กุนยะฮ์ว่าอบูบักเราะฮ์ เขาเป็นทาส ท่านนบี ﷺ ปลดปล่อยเขา เขาจึงกล่าวว่า \"ฉันคือทาสที่ได้รับการปลดปล่อยของท่านรสูลุลลอฮ์ ﷺ\"", "เขาเป็นเศาะหาบะฮ์ที่ประเสริฐ ลูก ๆ ของเขาเป็นคนมีชื่อเสียง เขารายงานหลายหะดีษจากท่านนบี ﷺ และลูก ๆ รายงานจากเขา อิบนุอับดิลบัรร์กล่าวว่า \"เขาเปรียบเหมือนหัวลูกศรในการทำอิบาดะฮ์\" เขาเสียชีวิตปี ฮ.ศ. 49 บ้างว่า 51 หรือ 52"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัดดารุกุฏนีย์ อิบนุคุซัยมะฮ์ (192) และอิบนุมาญะฮ์ (556) และคนอื่น บันทึกผ่านอับดุลวะฮ์ฮาบ อัษษะเกาะฟีย์ ว่าอัลมุฮาจิร อบูมัคละด์ เล่าให้ฟัง จากอับดุรเราะห์มาน บินอบีบักเราะฮ์ จากบิดา", "สายรายงานมีความอ่อน เพราะอัลมุฮาจิรถูกวิจารณ์ อิบนุมะอีนว่า \"พอใช้ได้\" (ศอลิห์) อัสสาญีย์ว่า \"สัจจริง\" อบูหาติมว่า \"หะดีษของเขาอ่อน ไม่ค่อยดี ไม่แม่นยำ เขียนหะดีษของเขาไว้ได้\" (คือนับเป็นผู้อ่อน แต่เขียนหะดีษไว้พิจารณาได้ ความอ่อนไม่รุนแรง) แต่หะดีษนี้มีหลักฐานสนับสนุนจนถึงระดับหะซัน", "อัตติรมิซีย์ยกคำของอัลบุคอรีย์ว่า \"หะดีษอบูบักเราะฮ์หะซัน\" และอัลอัลบานีย์ก็ว่าหะซัน"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ผ่อนผัน\" ข้อผ่อนผัน (รุคเศาะฮ์) ทางภาษาคือการทำให้ง่ายในเรื่องต่าง ๆ ทางศาสนาคือหุก่มที่ยืนยันต่างจากหลักฐาน เพราะมีเหตุ คือสิ่งที่ทำให้ง่ายแก่ผู้รับภาระเพราะเหตุที่ต้องการการผ่อนปรน ทั้งที่เหตุของหุก่มเดิมยังมีอยู่ คู่ตรงข้ามคืออะซีมะฮ์ (หุก่มเดิม) การล้างเท้าในวุฎูอ์คืออะซีมะฮ์ และการเช็ดรองเท้าหุ้มข้อคือรุคเศาะฮ์", "\"เมื่อเขาชำระ\" หมายถึงวุฎูอ์ที่สมบูรณ์ คือการชำระด้วยน้ำ ดังที่กล่าวในหะดีษอนัส \"เมื่อผู้ใดในพวกท่านอาบน้ำละหมาดและสวมรองเท้าหุ้มข้อ\"", "\"แล้วสวมรองเท้าหุ้มข้อ\" อักษรฟาอ์ในที่นี้เป็นเพียงคำเชื่อม ไม่ได้บ่งว่าต้องต่อเนื่องทันที เพราะเป็นที่รู้ว่าความต่อเนื่องไม่ใช่เงื่อนไขของการเช็ด ที่ต้องการคือสวมขณะมีความสะอาด แม้จะเว้นช่วงระหว่างการชำระกับการสวม หรืออาจกล่าวว่าบ่งความต่อเนื่อง ซึ่งความต่อเนื่องในแต่ละที่ต่างกันไป เช่นคำว่า \"เขาแต่งงาน แล้วก็มีลูก\"", "\"ให้เช็ดบนรองเท้าทั้งสอง\" เป็นกรรมของคำว่า \"ผ่อนผัน\" คือ ท่านผ่อนผันให้ผู้เดินทางและผู้อยู่บ้านเช็ดบนรองเท้าหุ้มข้อด้วยเงื่อนไขที่กล่าวมา"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "กำหนดเวลา และสวมขณะสะอาด", "points_th": ["หะดีษเป็นหลักฐานว่าการเช็ดมีกำหนดเวลา ดังที่กล่าวในหะดีษอะลี และเงื่อนไขของการเช็ดคือสวมขณะมีความสะอาด ดังที่หะดีษอุมัรและอนัสบ่งชี้", "ที่ชัดคืออิบนุหะญัรยกหะดีษนี้ เพราะรวมทั้งสองประเด็น คือการกำหนดเวลาและเงื่อนไขการสวมขณะสะอาด หะดีษนี้จึงจำกัดสิ่งที่กล่าวมาในหะดีษเษาบานและหะดีษอื่น"]}], "tags_th": ["เช็ดรองเท้าหุ้มข้อ", "เงื่อนไข", "ความสะอาด", "กำหนดเวลา", "รุคเศาะฮ์"]}, {"id": "v1-h066", "volume": 1, "bab": "khuffayn", "topic_ar": "ما جاء صريحاً في مسح الخفين بلا توقيت", "topic_th": "รายงานที่ชัดเจนว่าเช็ดรองเท้าหุ้มข้อโดยไม่มีกำหนดเวลา", "pages": [277, 278], "hadith": [{"no": 66, "matn_ar": "عَنْ أُبَيِّ بْنِ عِمَارَةَ رَضِيَ اللهُ عَنْهُ أَنَّهُ قَالَ: يَا رَسُولَ اللهِ أَمْسَحُ عَلَى الْخُفَّيْنِ؟ قَالَ: «نَعَمْ» قَالَ: يَوْمًا؟ قَالَ: «يَوْمًا»، قَالَ: وَيَوْمَيْنِ؟ قَالَ: «نَعَمْ»، قَالَ: وَثَلَاثَةً؟ قَالَ: «نَعَمْ، وَمَا شِئْتَ». أَخْرَجَهُ أَبُو دَاوُدَ، وَقَالَ: لَيْسَ بِالْقَوِيِّ.", "translation_th": "จากอุบัยย์ บินอิมาเราะฮ์ (ร.ฎ.) ว่า เขาถามว่า โอ้ท่านรสูลุลลอฮ์ ฉันเช็ดบนรองเท้าหุ้มข้อได้ไหม ท่านตอบว่า \"ได้\" เขาถามว่า หนึ่งวันหรือ ท่านตอบว่า \"หนึ่งวัน\" เขาถามว่า และสองวันหรือ ท่านตอบว่า \"ได้\" เขาถามว่า และสามวันหรือ ท่านตอบว่า \"ได้ และตามที่ท่านต้องการ\" บันทึกโดยอบูดาวูด และเขากล่าวว่า ไม่แข็งแรง", "grade_th": "ฎออีฟ (อ่อน)"}], "key_rulings_th": ["หะดีษนี้อ่อน จึงยืนขัดกับหะดีษศ่อฮีห์เรื่องกำหนดเวลาไม่ได้", "สมมุติว่าศ่อฮีห์ ก็ถูกจำกัดด้วยหะดีษเรื่องกำหนดเวลา หรือตีความตามที่อิบนุตัยมียะฮ์กล่าว คือผู้เดินทางที่ถอดรองเท้าแล้วเป็นอันตราย", "หรืออาจหมายความว่า เช็ดได้ทุกครั้งที่ต้องการ แต่ไม่เกินเงื่อนไขกำหนดเวลา เมื่อครบก็ถอดแล้วสวมใหม่ ซึ่งรวมแล้ววันที่เช็ดอาจมากกว่า"], "vocab": [{"ar": "أُبَيّ بْن عِمَارَة", "th": "อุบัยย์ อ่านสระอุ ฟัตหะฮ์ที่บาอ์ และชัดดะฮ์ที่ยาอ์ บินอิมาเราะฮ์ อ่านสระอิที่อัยน์ (บ้างว่าสระอุ)"}, {"ar": "لَيْسَ بِالْقَوِيِّ", "th": "ไม่แข็งแรง (คำตัดสินของอบูดาวูดเรื่องสายรายงาน หรือตัวหะดีษ)"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อิบนุหะญัรยกหะดีษนี้เพราะอ่อน เพื่อให้รู้สถานะ เนื่องจากหะดีษอนัสและรายงานจากอุมัรที่ผ่านมาบ่งว่าไม่มีกำหนดเวลา", "อุบัยย์ บินอิมาเราะฮ์ เศาะหาบะฮ์ที่มีชื่อเสียง นับอยู่ในชาวมะดีนะฮ์ อาศัยอยู่ที่อียิปต์ มีเพียงหะดีษเดียวเรื่องการเช็ดรองเท้าหุ้มข้อ อิบนุหิบบานกล่าวว่า \"เขาละหมาดกับท่านรสูลุลลอฮ์ ﷺ ไปยังกิบลัตทั้งสอง แต่ฉันไม่พึ่งสายรายงานของหะดีษของเขา\""]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อบูดาวูดบันทึกในหมวดฏอฮาเราะฮ์ บทกำหนดเวลาการเช็ด (158) ผ่านยะห์ยา บินอัยยูบ จากอับดุรเราะห์มาน บินเราะซีน จากมุหัมมัด บินยะซีด จากอัยยูบ บินเกาะฏ็อน จากอุบัยย์ บินอิมาเราะฮ์ ยะห์ยา บินอัยยูบกล่าวว่า \"เขาเคยละหมาดกับท่านรสูลุลลอฮ์ ﷺ ไปยังกิบลัตทั้งสอง\" อิบนุมาญะฮ์ (557) บันทึกด้วยสำนวน \"ท่านรสูลุลลอฮ์ ﷺ เคยละหมาดในบ้านของเขา ไปยังกิบลัตทั้งสอง\"", "หะดีษนี้อ่อน อิบนุหะญัรยกเพื่อให้รู้สถานะ และเพราะเป็นรายงานที่ชัดที่สุดว่าไม่มีกำหนดเวลา อบูดาวูดกล่าวว่า \"สายรายงานมีความขัดแย้ง และไม่แข็งแรง\" คือสายนี้ไม่แข็งแรงเพราะผู้รายงานบางคนอ่อน หรืออาจหมายถึงตัวหะดีษไม่แข็งแรง เพราะสายรายงานสับสน มีความขัดแย้งเรื่องยะห์ยา บินอัยยูบมาก", "อิมามอะห์มัดกล่าวถึงยะห์ยา บินอัยยูบว่า \"ความจำไม่ดี\" อิบนุมะอีนว่า \"พอใช้ได้\" อัดดารุกุฏนีย์ว่า \"หะดีษของเขาบางส่วนสับสน\" อบูหาติมว่า \"อยู่ในระดับสัจจริง เขียนหะดีษไว้ได้ แต่ใช้เป็นหลักฐานไม่ได้\" อัดดารุกุฏนีย์กล่าวว่า \"สายรายงานนี้ไม่ถูกต้อง และมีความขัดแย้งมากเรื่องยะห์ยา บินอัยยูบ... และอับดุรเราะห์มาน บินเราะซีน มุหัมมัด บินยะซีด และอัยยูบ บินเกาะฏ็อน ล้วนไม่เป็นที่รู้จัก\"", "อบูซุรอะฮ์ อัดดิมัชกีย์ยกคำของอะห์มัดว่า \"ผู้รายงานไม่เป็นที่รู้จัก\" อิบนุอับดิลบัรร์กล่าวว่า \"ไม่ถูกต้อง และไม่มีสายรายงานที่ยืนได้\""]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "ยืนขัดหะดีษกำหนดเวลาไม่ได้", "points_th": ["หะดีษบ่งว่าการเช็ดรองเท้าหุ้มข้อไม่มีกำหนดเวลา ทั้งขณะอยู่บ้านและเดินทาง ถ้าศ่อฮีห์ ก็ถูกจำกัดด้วยหะดีษเรื่องกำหนดเวลาที่กล่าวมา หรือตีความตามที่อิบนุตัยมียะฮ์กล่าว คือผู้เดินทางที่ถ้าถอดจะเป็นอันตราย เพราะจะล่าช้าจากคณะเดินทาง หรือหนาวจัด เป็นต้น", "หรืออาจหมายความว่า ทุกครั้งที่จำเป็นต้องเช็ดก็เช็ดได้ แต่ไม่เกินเงื่อนไขกำหนดเวลา เมื่อครบกำหนดก็ถอดแล้วสวมใหม่ เมื่อสวมขณะสะอาดก็เช็ดได้ ถ้าดูรวมทั้งหมด วันที่เช็ดอาจมากกว่า", "แต่ตราบใดที่เป็นหะดีษอ่อน ก็ยืนขัดกับหะดีษศ่อฮีห์ที่บ่งว่ามีกำหนดเวลาไม่ได้"]}], "tags_th": ["เช็ดรองเท้าหุ้มข้อ", "กำหนดเวลา", "หะดีษอ่อน"]}, {"id": "v1-h067", "volume": 1, "bab": "nawaqid", "topic_ar": "ما جاء في أن النوم اليسير لا ينقض الوضوء", "topic_th": "การหลับเพียงเล็กน้อยไม่ทำให้วุฎูอ์เสีย", "pages": [280, 283], "hadith": [{"no": 67, "matn_ar": "عَنْ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللهُ عَنْهُ قَالَ: كَانَ أَصْحَابُ رَسُولِ اللهِ ﷺ عَلَى عَهْدِهِ يَنْتَظِرُونَ الْعِشَاءَ حَتَّى تَخْفِقَ رُؤُوسُهُمْ، ثُمَّ يُصَلُّونَ وَلَا يَتَوَضَّؤُونَ. أَخْرَجَهُ أَبُو دَاوُدَ، وَصَحَّحَهُ الدَّارَقُطْنِيُّ، وَأَصْلُهُ فِي مُسْلِمٍ.", "translation_th": "จากอนัส บินมาลิก (ร.ฎ.) กล่าวว่า เศาะหาบะฮ์ของท่านรสูลุลลอฮ์ ﷺ ในสมัยของท่าน เคยรอละหมาดอิชาอ์จนศีรษะของพวกเขาสัปหงก แล้วพวกเขาก็ละหมาดโดยไม่อาบน้ำละหมาดใหม่ บันทึกโดยอบูดาวูด อัดดารุกุฏนีย์ระบุว่าศ่อฮีห์ และที่มาของหะดีษอยู่ในมุสลิม", "grade_th": "ศ่อฮีห์"}], "key_rulings_th": ["การหลับเพียงเล็กน้อย คือสัปหงกจนศีรษะผงก ไม่ทำให้วุฎูอ์เสีย ส่วนการหลับสนิทจนไม่รู้สึกตัวทำให้วุฎูอ์เสีย", "ผู้แต่งเห็นว่าที่ถูกต้องคือ ไม่ต่างกันว่าหลับในท่านอน นั่ง พิงหรือไม่พิง", "ตัวการหลับไม่ใช่สิ่งที่ทำให้วุฎูอ์เสีย แต่เป็นสภาพที่น่าจะเกิดฮะดัษ (มะซินนะฮ์) ถ้าหลับแล้วยังรู้สึกตัวว่ามีฮะดัษหรือไม่ วุฎูอ์ไม่เสีย", "แนวทางนี้ประสานหลักฐานได้ทั้งหมด คือหะดีษเศาะฟวาน (นอนทำให้วุฎูอ์เสีย) หมายถึงหลับสนิท ส่วนหะดีษนี้หมายถึงช่วงเริ่มหลับ"], "vocab": [{"ar": "عَلَى عَهْدِهِ", "th": "ในสมัยของท่าน แสดงว่าท่านนบี ﷺ รู้และยอมรับ หะดีษจึงมีหุก่มเป็นมัรฟูอ์"}, {"ar": "الْعِشَاء", "th": "อ่านสระอิและยาว คือช่วงแรกของความมืดกลางคืน ตั้งแต่ละหมาดมัฆริบถึงอะตะมะฮ์ ในที่นี้คือละหมาดอิชาอ์"}, {"ar": "تَخْفِقَ رُؤُوسُهُمْ", "th": "ศีรษะสัปหงกผงกลงเพราะง่วง โดยร่างกายส่วนอื่นยังอยู่"}, {"ar": "النَّوَاقِض", "th": "สิ่งที่ทำให้เสีย (พหูพจน์ของ نَاقِض) นักวิชาการแบ่งเป็นชนิดที่เห็นพ้อง (มีตัวบท) และชนิดที่ขัดแย้ง (ขึ้นกับการวินิจฉัย)"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อบูดาวูด (200) ในหมวดฏอฮาเราะฮ์ บทวุฎูอ์เพราะการนอน และอัดดารุกุฏนีย์ บันทึกผ่านฮิชาม อัดดัสตุวาอีย์ จากเกาะตาดะฮ์ จากอนัส สำนวนเป็นของอบูดาวูด อัดดารุกุฏนีย์ว่า \"ศ่อฮีห์\"", "แต่คำว่า \"ในสมัยของท่าน\" ไม่มีในอัดดารุกุฏนีย์และในอบูดาวูดด้วยสายนี้ อบูดาวูดยกไว้แบบไม่มีสายจากชุอ์บะฮ์ จากเกาะตาดะฮ์ ว่า \"เราอยู่ในสมัยท่านรสูลุลลอฮ์ ﷺ\" (อัลอัลบานีย์ว่าศ่อฮีห์) และอัลบัยฮะกีย์บันทึกด้วยสายถึงชุอ์บะฮ์ว่า \"เศาะหาบะฮ์ของท่านรสูลุลลอฮ์ ﷺ หลับ แล้วลุกขึ้นละหมาด โดยไม่อาบน้ำละหมาด ในสมัยท่านรสูลุลลอฮ์ ﷺ\"", "ที่มาของหะดีษในมุสลิม (376) ผ่านชุอ์บะฮ์ จากเกาะตาดะฮ์ ว่าได้ยินอนัสกล่าวว่า \"เศาะหาบะฮ์ของท่านรสูลุลลอฮ์ ﷺ เคยหลับ แล้วละหมาดโดยไม่อาบน้ำละหมาด\" ฉันถามว่า ท่านได้ยินจากอนัสหรือ เขาตอบว่า ใช่ ขอสาบานต่ออัลลอฮ์ อัตติรมิซีย์ (78) บันทึกด้วยสายนี้และว่าหะซันศ่อฮีห์", "อิบนุหะญัรยกสำนวนของอบูดาวูดเพราะชัดกว่าสำนวนของมุสลิม เพราะมีคำว่า \"จนศีรษะของพวกเขาสัปหงก\" ซึ่งอธิบายว่าการหลับในสำนวนของมุสลิมคือการง่วงและสัปหงก ไม่ใช่หลับสนิทหนักจนไม่รู้สึกตัวว่ามีอะไรออกมา"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ในสมัยของท่าน\" หะดีษจึงมีหุก่มเป็นมัรฟูอ์ เพราะท่านนบี ﷺ รู้และยอมรับ นี่คือจุดที่ใช้เป็นหลักฐาน", "\"รอละหมาดอิชาอ์\" ในฉบับบุลูฆเป็นเช่นนี้ ในอบูดาวูดและอัดดารุกุฏนีย์ว่า \"อิชาอ์สุดท้าย\" อิชาอ์คือช่วงแรกของความมืดกลางคืน ตั้งแต่ละหมาดมัฆริบถึงอะตะมะฮ์ อิบนุฟาริสว่า \"สองอิชาอ์คือมัฆริบและอะตะมะฮ์\"", "\"จนศีรษะของพวกเขาสัปหงก\" ในอัลมิศบาห์ว่า สัปหงกคือเมื่อง่วงแล้วศีรษะเอียงลงโดยร่างกายอื่นไม่ได้ล้ม ในอัลกอมูสว่า \"ศีรษะผงกเมื่อง่วง\""]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "หลับเล็กน้อยและหลับสนิท", "points_th": ["หะดีษเป็นหลักฐานว่าการหลับเล็กน้อยที่ไม่สนิท คือการง่วงที่ศีรษะผงก ไม่ทำให้วุฎูอ์เสีย ต่างจากการหลับสนิทหนักจนไม่รู้สึกว่าอาจมีอะไรออกมา ซึ่งทำให้วุฎูอ์เสีย หะดีษนี้อาจเป็นหลักฐานของทั้งสองประเด็น คือหลับเล็กน้อยไม่เสีย และหลับมากเสีย เพราะในใจของเศาะหาบะฮ์ผู้รายงานรู้กันอยู่แล้วว่าการหลับทำให้วุฎูอ์เสีย นอกจากระดับเล็กน้อยที่เขาเห็นนี้", "ไม่ต่างกัน ตามทัศนะที่ถูกต้อง ว่าหลับในท่านอน นั่ง พิงหรือไม่พิง นี่คือทัศนะที่มีน้ำหนักในประเด็นการหลับทำให้วุฎูอ์เสีย คือถ้าผู้หลับรู้สึกตัวว่าหากมีฮะดัษ วุฎูอ์ไม่เสีย ซึ่งเป็นกรณีหลับเล็กน้อย ส่วนถ้าหลับสนิทจนถ้ามีฮะดัษก็ไม่รู้สึก วุฎูอ์ต้องอาบใหม่ เพราะตัวการหลับไม่ใช่สิ่งที่ทำให้เสีย แต่เป็นสภาพที่น่าจะเกิดฮะดัษ เพราะผู้หลับไม่รู้และไม่รู้สึกถ้ามีอะไรออกมา", "หลักฐานว่าการหลับไม่ใช่สิ่งที่ทำให้เสียในตัวเอง คือการหลับเล็กน้อยไม่ทำให้วุฎูอ์เสียตามหะดีษในบทนี้ ถ้าการหลับทำให้เสียในตัว การหลับที่ศีรษะผงกก็คงทำให้เสีย และเล็กน้อยกับมากคงเหมือนกัน เช่นปัสสาวะและอุจจาระ", "เหตุผลที่ทัศนะนี้มีน้ำหนักสามประการ (1) ทัศนะนี้ประสานหลักฐานได้ทั้งหมด หะดีษเศาะฟวาน บินอัสสาล \"แต่เพราะอุจจาระ ปัสสาวะ และการนอน\" บ่งว่าการนอนทำให้เสีย ส่วนหะดีษในบทนี้ \"พวกเขารอละหมาดอิชาอ์จนศีรษะสัปหงก แล้วละหมาดโดยไม่อาบน้ำละหมาด\" จึงตีความหะดีษแรกว่าหลับสนิทจนถ้ามีฮะดัษก็ไม่รู้สึก และหะดีษที่สองว่าเป็นช่วงเริ่มหลับก่อนหลับสนิท จนถ้ามีฮะดัษก็รู้สึก เพราะศีรษะผงกเกิดในการหลับเล็กน้อย ถ้าทำให้เสีย อัลลอฮ์คงไม่ยอมให้พวกเขาละหมาดในสภาพนั้น แต่คงมีวะห์ยูลงมาแก่ท่านรสูลุลลอฮ์ ﷺ เหมือนเรื่องศาสนาอื่น ๆ และหลักคือเศาะหาบะฮ์มีเกียรติสูง และไม่ได้ไม่รู้ว่าอะไรทำให้วุฎูอ์เสีย โดยเฉพาะผู้ที่รอละหมาดกับท่านนบี ﷺ ซึ่งเป็นเศาะหาบะฮ์ระดับแนวหน้า", "อัลค็อฏฏอบีย์กล่าวว่า \"คำว่า 'เศาะหาบะฮ์ของท่านรสูลุลลอฮ์ ﷺ เคยรอละหมาดอิชาอ์สุดท้ายจนศีรษะสัปหงก' บ่งว่าเรื่องนี้เกิดซ้ำ ๆ จนเหมือนเป็นนิสัย ไม่ได้เกิดน้อยครั้ง ซึ่งยืนยันว่าตัวการหลับไม่ใช่ฮะดัษ\" ส่วนหะดีษอนัสที่ว่า \"ฉันเห็นเศาะหาบะฮ์ของท่านรสูลุลลอฮ์ ﷺ ถูกปลุกให้ละหมาด จนฉันได้ยินเสียงกรนของบางคน แล้วพวกเขาละหมาดโดยไม่อาบน้ำละหมาด\" (อัดดารุกุฏนีย์ ว่าศ่อฮีห์) ไม่กระทบ เพราะการปลุกและการกรนอาจเกิดกับผู้ที่เพิ่งเริ่มหลับ และไม่จำเป็นว่าต้องหลับสนิท", "(2) หะดีษมุอาวิยะฮ์ (จะกล่าวต่อไป): \"ตาคือเชือกผูกทวาร เมื่อตาหลับ เชือกก็หลุด\" สนับสนุนการประสานข้างต้น ความหมายคือ การตื่นคือเชือกผูกทวาร การหลับที่เชือกหลุดคือการหลับสนิทจนไม่รู้สึกตัวว่ามีอะไรออกมา ซึ่งคือการหลับที่ทำให้วุฎูอ์เสีย ส่วนนอกจากนั้นไม่เสีย (3) หะดีษอิบนุอับบาสเรื่องละหมาดกลางคืน: \"เมื่อฉันง่วง ท่านก็จับติ่งหูของฉัน\" (อัลบุคอรีย์ มุสลิม) บ่งว่าการหลับเล็กน้อยขณะละหมาดไม่ทำให้วุฎูอ์เสีย"]}], "tags_th": ["สิ่งที่ทำให้วุฎูอ์เสีย", "การนอน", "สัปหงก", "ฮะดัษ", "อิชาอ์"]}, {"id": "v1-h068", "volume": 1, "bab": "nawaqid", "topic_ar": "ما جاء في أن دم الاستحاضة ناقض للوضوء", "topic_th": "เลือดเสีย (อิสติหาเฎาะฮ์) ทำให้วุฎูอ์เสีย", "pages": [284, 288], "hadith": [{"no": 68, "matn_ar": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: جَاءَتْ فَاطِمَةُ بِنْتُ أَبِي حُبَيْشٍ إِلَى النَّبِيِّ ﷺ، فَقَالَتْ: يَا رَسُولَ اللهِ! إِنِّي امْرَأَةٌ أُسْتَحَاضُ فَلَا أَطْهُرُ، أَفَأَدَعُ الصَّلَاةَ؟ قَالَ: «لَا، إِنَّمَا ذَلِكِ عِرْقٌ، وَلَيْسَ بِحَيْضٍ، فَإِذَا أَقْبَلَتْ حَيْضَتُكِ فَدَعِي الصَّلَاةَ، وَإِذَا أَدْبَرَتْ فَاغْسِلِي عَنْكِ الدَّمَ، ثُمَّ صَلِّي». مُتَّفَقٌ عَلَيْهِ. وَلِلْبُخَارِيِّ: «ثُمَّ تَوَضَّئِي لِكُلِّ صَلَاةٍ»، وَأَشَارَ مُسْلِمٌ إِلَى أَنَّهُ حَذَفَهَا عَمْدًا.", "translation_th": "จากอาอิชะฮ์ (ร.ฎ.) กล่าวว่า ฟาฏิมะฮ์ บินติอบีหุบัยช์ มาหาท่านนบี ﷺ แล้วกล่าวว่า โอ้ท่านรสูลุลลอฮ์ ฉันเป็นผู้หญิงที่มีเลือดเสีย ไม่สะอาดเลย ฉันต้องละการละหมาดหรือ ท่านตอบว่า \"ไม่ นั่นคือเลือดจากเส้นเลือด ไม่ใช่ประจำเดือน เมื่อประจำเดือนของเธอมา ก็จงละการละหมาด และเมื่อมันหมดไป ก็จงล้างเลือดออกจากตัวเธอ แล้วละหมาด\" บันทึกโดยอัลบุคอรีย์และมุสลิม และในรายงานของอัลบุคอรีย์: \"แล้วจงอาบน้ำละหมาดทุกละหมาด\" และมุสลิมชี้ว่าเขาตัดส่วนนี้ออกโดยเจตนา", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม) ส่วนเพิ่ม \"แล้วจงอาบน้ำละหมาดทุกละหมาด\" มีข้อขัดแย้งว่าเป็นคำของท่านนบี ﷺ หรือของอุรวะฮ์"}], "key_rulings_th": ["เลือดเสียเป็นฮะดัษที่ทำให้วุฎูอ์เสีย ตามทัศนะของนักวิชาการส่วนใหญ่ ยกเว้นมาลิกีย์", "ทุกสิ่งที่ออกจากทวารทั้งสอง ทั้งปัสสาวะ อุจจาระ เลือด มะซีย์ และลม ทำให้วุฎูอ์เสียโดยอิจญ์มาอ์ ยกเว้นผู้มีฮะดัษต่อเนื่อง เช่น ปัสสาวะเล็ด", "ผู้ที่ยึดส่วนเพิ่มของอัลบุคอรีย์ เห็นว่าหญิงที่มีเลือดเสียต้องอาบน้ำละหมาดทุกละหมาดหลังเข้าเวลา", "เลือดประจำเดือนและเลือดเสียเป็นนะญิส ต้องล้างออก", "ผู้แต่งเห็นว่าทัศนะที่ว่าส่วนเพิ่มเป็นคำของอุรวะฮ์ (เมากูฟ) มีน้ำหนัก ตามที่มุสลิม อันนะสาอีย์ และอัลบัยฮะกีย์ตัดสิน"], "vocab": [{"ar": "فَاطِمَة بِنْت أَبِي حُبَيْش", "th": "อบูหุบัยช์ (รูปย่อ) ชื่อจริงคือก็อยส์ บินอัลมุฏฏอลิบ บินอะสัด นางเป็นชาวกุร็อยช์ เผ่าอะสัด หนึ่งในหญิงที่มีเลือดเสียในสมัยท่านนบี ﷺ"}, {"ar": "أُسْتَحَاضُ", "th": "ฉันมีเลือดเสีย (อิสติหาเฎาะฮ์) คือเลือดที่ไหลนอกช่วงเวลาปกติ"}, {"ar": "عِرْق", "th": "เลือดจากเส้นเลือดที่เรียกว่า อัลอาซิล (หรืออัลอาซิร) ไม่ใช่เลือดประจำเดือนที่ออกจากก้นมดลูกตามเวลาที่รู้กัน"}, {"ar": "أَقْبَلَتْ حَيْضَتُكِ / أَدْبَرَتْ", "th": "ประจำเดือนมา คือเลือดเริ่มออกในวันตามปกติ / หมดไป คือเลือดหยุดตามวันปกติ"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกในหมวดวุฎูอ์ บทการล้างเลือด (228) และมุสลิมในหมวดประจำเดือน บทหญิงที่มีเลือดเสีย การอาบน้ำและการละหมาดของนาง (333) ผ่านฮิชาม บินอุรวะฮ์ จากบิดา จากอาอิชะฮ์ สำนวนเป็นของอัลบุคอรีย์ ใกล้เคียงกับของมุสลิม", "อัลบุคอรีย์มีส่วนเพิ่มจากมุสลิม ผ่านอบูมุอาวิยะฮ์ จากฮิชาม ว่า บิดาของฉัน (อุรวะฮ์) กล่าวว่า \"แล้วจงอาบน้ำละหมาดทุกละหมาด\" นักวิชาการกลุ่มหนึ่ง รวมถึงอิบนุหะญัร ว่าเป็นคำของท่านนบี ﷺ ที่ต่อเนื่องด้วยสายเดียวกัน เพราะถ้าเป็นคำของอุรวะฮ์ ก็คงกล่าวว่า \"แล้วนางอาบน้ำละหมาด\" ในรูปบอกเล่า แต่มาในรูปคำสั่ง จึงบ่งว่าเป็นส่วนของหะดีษ สนับสนุนด้วยรายงานของอัตติรมิซีย์ผ่านอบูมุอาวิยะฮ์: \"และท่านกล่าวว่า จงอาบน้ำละหมาดทุกละหมาด จนกว่าเวลานั้นจะมาถึง\"", "นักวิชาการผู้เชี่ยวชาญกลุ่มหนึ่งว่าเป็นคำของอุรวะฮ์ (เมากูฟ) เพราะคำของฮิชามตอนท้าย \"และบิดาของฉันกล่าวว่า แล้วจงอาบน้ำละหมาดทุกละหมาด จนกว่าเวลานั้นจะมาถึง\" ซึ่งชัดว่าเป็นคำของอุรวะฮ์ เพราะฮิชามไม่ได้รายงานหะดีษนี้จากคนอื่นนอกจากบิดา จุดประสงค์ของเขาจึงเป็นการแยกส่วนที่เป็นมัรฟูอ์จากเมากูฟ อีกทั้งส่วนเพิ่มนี้มาจากความขัดแย้งในรายงานของอบูมุอาวิยะฮ์ ซึ่งรายงานไม่คงที่ อิมามอะห์มัดว่า \"นอกจากหะดีษอัลอะอ์มัช เขาสับสน จำได้ไม่ดี\"", "มุสลิมบันทึกผ่านหัมมาด บินซัยด์ จากฮิชามด้วย และกล่าวว่า \"ในหะดีษหัมมาดมีคำหนึ่งที่เราไม่ได้กล่าวถึง\" คือส่วนเพิ่มในอัลบุคอรีย์ มุสลิมคงตัดออกเพราะหัมมาดรายงานคนเดียว อันนะสาอีย์สนับสนุนว่า \"หลายคนรายงานหะดีษนี้จากฮิชาม ไม่มีใครกล่าวว่า 'และจงอาบน้ำละหมาด' นอกจากหัมมาด\" อัลบัยฮะกีย์ว่า \"มีส่วนเพิ่มเรื่องอาบน้ำละหมาดทุกละหมาด และไม่ใช่สำนวนที่ถูกต้อง\"", "อิบนุหะญัรแย้งว่าการที่อันนะสาอีย์ชี้ข้อบกพร่องของหัมมาดไม่ดีนัก เพราะอบูมุอาวิยะฮ์รายงานตรงกัน (อัลบุคอรีย์ อัตติรมิซีย์) และหัมมาด บินสะละมะฮ์ก็รายงานตรงกัน (อัดดาริมีย์: \"...ก็จงล้างเลือดออกจากตัวเธอ และอาบน้ำละหมาดและละหมาด\") แต่ผู้แต่งชี้ว่านี่ไม่ได้มีคำสั่งให้อาบน้ำละหมาดทุกละหมาด มีแค่คำสั่งให้อาบน้ำละหมาดหลังล้างเลือด อิบนุอับดิลบัรร์บันทึกผ่านอัฟฟาน จากหัมมาด โดยไม่มีคำว่า \"และอาบน้ำละหมาด\" และอัฟฟานเป็นศิษย์ที่แม่นที่สุดของหัมมาด จึงมาก่อน อบูหัมซะฮ์ อัสสุกกะรีย์และอบูอะวานะฮ์ก็รายงานตรงกัน แต่บางครั้งต่อเนื่อง บางครั้งมุรสัล หรือรายงานตามความหมาย", "ผู้แต่งเห็นว่าทัศนะว่าส่วนนี้เป็นคำของอุรวะฮ์ และการยกเป็นมัรฟูอ์ไม่ใช่สำนวนที่ถูกต้อง มีน้ำหนักด้วยสามเหตุ (1) ตามรูปการเรียบเรียงของอัลบุคอรีย์ เพราะฮิชามรายงานหะดีษจากบิดาเท่านั้น แล้วกล่าวว่า \"บิดาของฉันกล่าวว่า...\" ถ้าไม่ได้ต้องการแยกมัรฟูอ์จากเมากูฟ ก็ไม่มีเหตุให้ระบุเช่นนั้น (2) อิมามรุ่นใหญ่ตัดสินว่าไม่ใช่สำนวนที่ถูกต้อง เช่น มุสลิม อันนะสาอีย์ และอัลบัยฮะกีย์ อิบนุเราะญับว่า \"ที่ถูกคือคำว่าวุฎูอ์ในหะดีษแทรกเข้ามาจากคำของอุรวะฮ์\" มาลิกก็รายงานจากฮิชาม จากบิดาว่า \"หญิงที่มีเลือดเสียไม่ต้องทำอะไร นอกจากอาบน้ำครั้งเดียว แล้วอาบน้ำละหมาดหลังจากนั้นทุกละหมาด\" (3) มีผู้รายงานหะดีษนี้จากฮิชามสิบกว่าคน รวมถึงอิมามผู้เชี่ยวชาญ เช่น มาลิก วะกีอ์ สุฟยาน บินอุยัยนะฮ์ และยะห์ยา บินสะอีด ไม่มีใครกล่าวถึงส่วนเพิ่มนี้ การแทรกในส่วนมัรฟูอ์อาจเกิดจากผู้รายงานบางคนที่ไม่แม่นเท่าผู้ที่ไม่ได้กล่าวถึง", "คำว่า \"แล้วจงอาบน้ำละหมาดทุกละหมาด\" คือจุดประสงค์ที่อิบนุหะญัรยกหะดีษนี้ในบทสิ่งที่ทำให้วุฎูอ์เสีย ส่วนความเกี่ยวข้องกับบทประจำเดือน ท่านจะยกไว้ที่นั่น"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ฉันมีเลือดเสีย\" คือเลือดไหลนอกเวลาปกติ (จะกล่าวในบทประจำเดือน) \"ไม่สะอาดเลย\" ความสะอาดในที่นี้คือการพ้นจากเลือด ความหมายคือ ไม่พ้นจากเลือด สิ่งที่นางรู้คือหญิงที่มีประจำเดือนจะรู้ว่าสะอาดเมื่อเลือดหยุด จึงสื่อถึงการไม่สะอาดว่าเลือดไหลต่อเนื่อง", "\"ฉันต้องละการละหมาดหรือ\" เป็นการถามว่าหุก่มประจำเดือนยังคงอยู่ในสภาพที่เลือดไหลต่อเนื่องหรือไม่ หลังจากนางรู้ว่าหญิงมีประจำเดือนห้ามละหมาด จึงคิดว่าหุก่มนั้นผูกกับการไหลของเลือด \"ไม่\" คืออย่าละการละหมาด", "\"นั่นคือเลือดจากเส้นเลือด\" อ่านกัสเราะฮ์ที่อักษรกาฟ เพราะพูดกับผู้หญิงที่ถาม เส้นเลือดนี้เรียกว่า อัลอาซิล (บ้างว่าอัลอาซิร) ความหมายคือ เลือดของเธอไม่ใช่เลือดประจำเดือน เพราะเลือดประจำเดือนออกจากก้นมดลูกในเวลาที่รู้กัน ส่วนนี้เกิดจากเส้นเลือดแตก ซึ่งเป็นการบอกถึงความต่างของที่มา", "\"เมื่อประจำเดือนของเธอมา...\" ประจำเดือนมาคือเลือดเริ่มออกในวันปกติของนาง และหมดไปคือเวลาที่เลือดหยุดตามวันปกติ ความหมายคือ นางแยกเลือดประจำเดือนกับเลือดเสียได้ จึงงดละหมาดในวันปกติ เมื่อหมดก็อาบน้ำแล้วละหมาด และไม่ต้องสนใจเลือดที่ยังมีอยู่หลังจากนั้น เพราะเป็นเลือดเสีย"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "เลือดเสียและสิ่งที่ออกจากทวาร", "points_th": ["ผู้ที่เห็นว่าเลือดเสียเป็นฮะดัษที่ทำให้วุฎูอ์เสียอ้างหะดีษนี้ เพราะศาสนาสั่งให้อาบน้ำละหมาดเพราะมันในคำว่า \"แล้วจงอาบน้ำละหมาดทุกละหมาด\" เป็นทัศนะของนักวิชาการส่วนใหญ่ ยกเว้นมาลิกีย์ ซึ่งเห็นว่าเลือดเสียไม่ทำให้เสีย", "ทุกสิ่งที่ออกจากทวารทั้งสองทำให้วุฎูอ์เสีย ไม่ว่าจะเป็นปัสสาวะ อุจจาระ เลือด หรือมะซีย์ ลมจากทวารหนักก็เช่นกัน เรื่องนี้เป็นอิจญ์มาอ์ตามที่อิบนุลมุนซิรและคนอื่นรายงาน นี่คือจุดประสงค์ของอิบนุหะญัรในการยกหะดีษนี้ไว้ในบทนี้", "ยกเว้นผู้มีฮะดัษต่อเนื่อง ซึ่งวุฎูอ์ไม่เสีย เช่น ผู้มีปัสสาวะเล็ด ลม หรืออุจจาระไหลไม่หยุด และในมาลิกีย์ เลือดเสียก็เช่นกัน"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "อาบน้ำละหมาดทุกละหมาด", "points_th": ["ผู้ที่ยึดว่าส่วนเพิ่มเรื่องวุฎูอ์ถูกต้อง อ้างหะดีษนี้ว่าหญิงที่มีเลือดเสียต้องอาบน้ำละหมาดทุกละหมาด เพราะรูปคำสั่งบ่งว่าเป็นวาญิบ ความหมายคือ นางไม่อาบน้ำละหมาดสำหรับละหมาดที่มีกำหนดเวลา เช่น ซุฮ์รี จนกว่าจะเข้าเวลา ส่วนละหมาดที่ไม่มีกำหนดเวลา เช่น ละหมาดฎุฮา นางอาบน้ำละหมาดเมื่อต้องการทำ", "ผู้แต่งจะอธิบายประเด็นนี้ละเอียดกว่านี้ในบทประจำเดือน เมื่อกล่าวถึงการอาบน้ำของหญิงที่มีเลือดเสีย"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "เลือดประจำเดือนและเลือดเสียเป็นนะญิส", "points_th": ["หะดีษเป็นหลักฐานว่าเลือดประจำเดือนเป็นนะญิส เลือดเสียก็เช่นกัน เพราะคำว่า \"และเมื่อมันหมดไป ก็จงล้างเลือดออกจากตัวเธอ แล้วละหมาด\" (กล่าวไปแล้วในบทการขจัดนะญิส)", "ประโยชน์อื่นของหะดีษนี้และหุก่มของหญิงที่มีเลือดเสีย ผู้แต่งจะกล่าวในบทประจำเดือน อินชาอัลลอฮ์"]}], "tags_th": ["สิ่งที่ทำให้วุฎูอ์เสีย", "เลือดเสีย", "อิสติหาเฎาะฮ์", "ประจำเดือน", "มุดร็อจ"]}, {"id": "v1-h069", "volume": 1, "bab": "nawaqid", "topic_ar": "بيان حكم المذي", "topic_th": "หุก่มของมะซีย์", "pages": [289, 296], "hadith": [{"no": 69, "matn_ar": "عَنْ عَلِيِّ بْنِ أَبِي طَالِبٍ رَضِيَ اللهُ عَنْهُ قَالَ: كُنْتُ رَجُلًا مَذَّاءً، فَأَمَرْتُ الْمِقْدَادَ بْنَ الْأَسْوَدِ أَنْ يَسْأَلَ النَّبِيَّ ﷺ، فَسَأَلَهُ؟ فَقَالَ: «فِيهِ الْوُضُوءُ». مُتَّفَقٌ عَلَيْهِ، وَاللَّفْظُ لِلْبُخَارِيِّ.", "translation_th": "จากอะลี บินอบีฏอลิบ (ร.ฎ.) กล่าวว่า ฉันเป็นคนที่มีมะซีย์ออกมาก จึงขอให้อัลมิกดาด บินอัลอัสวัด ถามท่านนบี ﷺ เขาจึงถาม ท่านตอบว่า \"ในกรณีนั้นต้องอาบน้ำละหมาด\" บันทึกโดยอัลบุคอรีย์และมุสลิม สำนวนเป็นของอัลบุคอรีย์", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["มะซีย์ทำให้วุฎูอ์เสีย และไม่ต้องอาบน้ำ (ฆุสล์) โดยอิจญ์มาอ์", "มะซีย์เป็นนะญิส แต่ตามทัศนะที่ถูกต้อง เล็กน้อยได้รับการอนุโลม เพราะหลีกเลี่ยงยาก", "ผู้แต่งเห็นว่าทัศนะที่ตรงกับหะดีษคือต้องล้างอวัยวะเพศทั้งหมดและอัณฑะ ไม่ใช่แค่ที่เปื้อน (อิบนุตัยมียะฮ์และอิบนุบาซเห็นว่ามีน้ำหนัก)", "การขจัดมะซีย์ต้องใช้น้ำ ใช้หินแทนไม่ได้", "ผู้แต่งเห็นว่ามะซีย์ที่เปื้อนเสื้อ เพียงพรมน้ำก็พอ ไม่ต้องล้าง (อิบนุตัยมียะฮ์และอิบนุลก็อยยิมเลือก)", "อนุญาตให้ฝากผู้อื่นถามปัญหาศาสนาเมื่อมีเหตุ เช่น ความเขินอาย และรับข่าวจากผู้เชื่อถือได้คนเดียวได้"], "vocab": [{"ar": "مَذَّاء", "th": "คนที่มีมะซีย์ออกมาก (รูปคำเน้นความมาก)"}, {"ar": "الْمَذْي", "th": "น้ำใสบาง ออกตามหลังความใคร่ โดยไม่พุ่งและไม่รู้สึกว่าออก"}, {"ar": "فِيهِ الْوُضُوءُ", "th": "ในกรณีนั้นต้องอาบน้ำละหมาด ในรายงานของมุสลิมว่า مِنْهُ الْوُضُوءُ"}, {"ar": "النَّضْح", "th": "การพรมน้ำ บางครั้งหมายถึงการล้าง"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกในหมวดความรู้ บทผู้ที่อายแล้วให้ผู้อื่นถาม (132) ผ่านอับดุลลอฮ์ บินดาวูด จากอัลอะอ์มัช จากมุนซิร อัษเษารีย์ จากมุหัมมัด บินอัลหะนะฟียะฮ์ จากอะลี ในหมวดวุฎูอ์ บทผู้ที่ไม่เห็นว่าต้องอาบน้ำละหมาดนอกจากสิ่งที่ออกจากทวารทั้งสอง (178) ผ่านญะรีร บินอับดิลหะมีด จากอัลอะอ์มัช และในหมวดการอาบน้ำ บทการล้างมะซีย์และอาบน้ำละหมาดเพราะมัน (269) ผ่านซาอิดะฮ์ จากอบูหะศีน จากอบูอับดิรเราะห์มาน อัสสุละมีย์ จากอะลี สำนวนในบุลูฆเป็นของอัลบุคอรีย์ในหมวดความรู้", "มุสลิมบันทึกในหมวดประจำเดือน บทมะซีย์ (303) หลายสาย ด้วยสำนวน \"ท่านตอบว่า ต้องอาบน้ำละหมาดเพราะมัน\" อิบนุอับดิลบัรร์กล่าวว่า \"หะดีษนี้ยืนยันในหมู่นักวิชาการ ศ่อฮีห์ มีหลายสายจากอะลี อัลมิกดาด และอัมมาร ทั้งหมดศ่อฮีห์หะซัน\"", "ผู้ที่ถามท่านรสูลุลลอฮ์ ﷺ เรื่องมะซีย์มีสามคน คืออะลี (หะดีษในเศาะฮีหัยน์) สะฮ์ล์ บินหุนัยฟ์ และอับดุลลอฮ์ บินสะอ์ด์ อัลอันศอรีย์ (จะกล่าวต่อไป)"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ฉันเป็นคนที่มีมะซีย์ออกมาก\" (มัซซาอ์) รูปคำเน้นความมาก ในอีกรายงานเขาเล่าว่า \"ฉันเป็นคนที่มีมะซีย์ออกมาก ฉันจึงอาบน้ำในฤดูหนาวจนหลังแตก ฉันเล่าให้ท่านรสูลุลลอฮ์ ﷺ ฟัง ท่านกล่าวว่า อย่าทำ เมื่อเธอเห็นมะซีย์ ก็ล้างอวัยวะเพศ และอาบน้ำละหมาดเหมือนวุฎูอ์ละหมาด และเมื่ออสุจิพุ่งออก ก็อาบน้ำ\" (อบูดาวูด อันนะสาอีย์ อะห์มัด สายรายงานศ่อฮีห์) มะซีย์คือน้ำใสที่ออกตามหลังความใคร่ โดยไม่พุ่งและไม่รู้สึกว่าออก", "\"ฉันขอให้อัลมิกดาด บินอัลอัสวัด ถามท่านนบี ﷺ\" ในรายงานของอัลบุคอรีย์มีเหตุผลว่า \"ฉันอายที่จะถามท่านรสูลุลลอฮ์ ﷺ\" และอีกสำนวน \"เพราะลูกสาวของท่านเป็นภรรยาฉัน\" ในมุสลิม \"เพราะฟาฏิมะฮ์\" เหตุผลคือเขาอายท่านรสูลุลลอฮ์ ﷺ เพราะลูกสาวของท่านเป็นภรรยาของเขา และมะซีย์เกี่ยวกับเรื่องความใคร่", "ตามบริบท ผู้ถามคืออัลมิกดาด บินอัลอัสวัด คืออัลมิกดาด บินอัมร์ บินษะอ์ละบะฮ์ อัลกินดีย์ ที่เรียกว่าบินอัลอัสวัด เพราะอัลอัสวัด บินอับดิยะฆูษ อัซซุฮ์รีย์ รับเขาเป็นบุตรบุญธรรม เขาเข้ารับอิสลามแต่เนิ่น ๆ อพยพทั้งสองครั้ง แต่งงานกับฎุบาอะฮ์ บินติอัซซุบัยร์ บินอับดิลมุฏฏอลิบ ลูกพี่ลูกน้องของท่านนบี ﷺ ร่วมสงครามบัดร์และหลังจากนั้น เสียชีวิตปี ฮ.ศ. 33 และฝังที่อัลบะกีอ์", "อะลีขอให้อัลมิกดาดถาม ไม่ใช่คนอื่น เพราะมีการสนทนาเรื่องมะซีย์ระหว่างพวกเขา อับดุรร็อซซากบันทึกว่า อะลี อัมมาร และอัลมิกดาดคุยกันเรื่องมะซีย์ อะลีกล่าวว่า ฉันเป็นคนที่มีมะซีย์มาก จงถามท่านรสูลุลลอฮ์ ﷺ เพราะฉันอายที่จะถามเพราะลูกสาวของท่าน ถ้าไม่ใช่เพราะเหตุนั้น ฉันคงถามเอง แล้วหนึ่งในสองคนนั้น อัมมารหรืออัลมิกดาด ก็ถาม บางรายงานว่าเขาขอให้อัมมารถาม และอีกรายงานว่าเขาถามท่านนบี ﷺ เองเรื่องมะซีย์ ท่านตอบว่า \"มะซีย์ต้องอาบน้ำละหมาด อสุจิต้องอาบน้ำ\" (อัตติรมิซีย์ว่าหะซันศ่อฮีห์ บางท่านว่าอ่อนเพราะยะซีด บินอบีซิยาด)", "ประสานรายงานเหล่านี้ได้ว่า อะลีขอให้อัลมิกดาดถาม แล้วเขาก็ถาม ส่วนการพาดพิงการถามถึงอัมมารเป็นการพูดโดยอนุโลม เพราะอะลีตั้งใจให้เขาถาม แต่อัลมิกดาดเป็นผู้พูดเอง ส่วนการพาดพิงการถามถึงอะลี อาจเพราะเขาให้อัลมิกดาดถาม แล้วตัวเขาถามเองทีหลัง หรือผู้รายงานบางคนเรียกว่าเขาถาม เพราะเขาเป็นผู้สั่ง สิ่งที่สนับสนุนคือเขาอายที่จะถามเพราะฟาฏิมะฮ์ จึงทำให้ทัศนะว่าเขาถามเองอ่อน", "\"ในกรณีนั้นต้องอาบน้ำละหมาด\" ในรายงานของมุสลิม \"ต้องอาบน้ำละหมาดเพราะมัน\" สำนวนที่อิบนุหะญัรยกไม่มีคำว่าล้างอวัยวะเพศ ซึ่งมีในเศาะฮีหัยน์ อิบนุหะญัรอาจยกเฉพาะส่วนที่เกี่ยวกับวุฎูอ์ เพราะเป็นบทสิ่งที่ทำให้วุฎูอ์เสีย ส่วนการล้างอวัยวะเพศเกี่ยวกับการขจัดนะญิส"]}, {"wajh": 3, "type": "fawaid", "heading_ar": null, "heading_th": "ฝากผู้อื่นถามปัญหาศาสนา", "points_th": ["หะดีษเป็นหลักฐานว่าอนุญาตให้ฝากผู้อื่นถามและขอคำวินิจฉัยเมื่อมีเหตุ เช่น ความอาย ไม่ว่าผู้ขอคำวินิจฉัยจะอยู่ด้วยหรือไม่ อัลบุคอรีย์ตั้งชื่อบทของหะดีษนี้ว่า \"บทผู้ที่อายแล้วให้ผู้อื่นถาม\"", "ผู้รับฝากต้องเป็นผู้ที่เชื่อถือได้ในความเข้าใจ ความจำ และศาสนา เพื่อจะส่งคำถามและเข้าใจคำตอบได้อย่างถูกต้อง"]}, {"wajh": 4, "type": "fawaid", "heading_ar": null, "heading_th": "รับข่าวจากคนเดียว", "points_th": ["หะดีษเป็นหลักฐานว่ารับข่าวจากคนเดียว (เคาะบัรวาหิด) ได้ ทั้งในเรื่องวิชาการและการรายงาน หากผู้บอกเชื่อถือได้"]}, {"wajh": 5, "type": "fawaid", "heading_ar": null, "heading_th": "มารยาทต่อพ่อตาแม่ยาย", "points_th": ["เป็นมารยาทและการอยู่ร่วมที่ดีกับญาติของภรรยา ที่สามีจะไม่พูดถึงเรื่องที่เกี่ยวกับการร่วมประเวณี สิ่งที่นำไปสู่มัน และความสุขกับภรรยา ต่อหน้าพ่อ พี่น้อง ลูก หรือญาติของนาง ทั้งที่การถามในหะดีษนี้เป็นการถามหุก่มศาสนา แล้วถ้าพูดโดยไม่จำเป็นจะเป็นอย่างไร"]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "มะซีย์เป็นนะญิส แต่อนุโลมเล็กน้อย", "points_th": ["หะดีษเป็นหลักฐานว่ามะซีย์เป็นนะญิส เพราะสั่งให้ล้างอวัยวะเพศและอาบน้ำละหมาด จึงมีหุก่มเหมือนปัสสาวะในเรื่องความเป็นนะญิส", "ตามทัศนะที่ถูกต้องจากสองทัศนะ มะซีย์เล็กน้อยได้รับการอนุโลม เป็นอีกรายงานจากอิมามอะห์มัด ผู้แต่งอัลอินศ็อฟกล่าวว่า \"นี่คือสิ่งที่ถูกต้อง โดยเฉพาะสำหรับคนหนุ่ม\" เพราะเป็นนะญิสที่หลีกเลี่ยงยาก เนื่องจากเปื้อนเสื้อผ้าของคนหนุ่มโสดบ่อย จึงสมควรได้รับการผ่อนปรนยิ่งกว่าปัสสาวะทารกชายและสิ่งที่ติดใต้รองเท้าหุ้มข้อ"]}, {"wajh": 7, "type": "fiqh", "heading_ar": null, "heading_th": "มะซีย์ทำให้วุฎูอ์เสีย", "points_th": ["มะซีย์ทำให้วุฎูอ์เสีย ต้องอาบน้ำละหมาดเพราะมัน ตามคำว่า \"จงล้างอวัยวะเพศและอาบน้ำละหมาด\" และไม่ต้องอาบน้ำ (ฆุสล์) โดยอิจญ์มาอ์ ตามที่อิบนุอับดิลบัรร์รายงาน และอิบนุกุดามะฮ์ยกจากอิบนุลมุนซิร", "หะดีษอับดุลลอฮ์ บินสะอ์ด์ อัลอันศอรีย์: \"ฉันถามท่านรสูลุลลอฮ์ ﷺ ถึงสิ่งที่ทำให้ต้องอาบน้ำ และน้ำที่ออกหลังน้ำ (ปัสสาวะ) ท่านตอบว่า นั่นคือมะซีย์ ผู้ชายทุกคนมีมะซีย์ จงล้างอวัยวะเพศและอัณฑะเพราะมัน และอาบน้ำละหมาดเหมือนวุฎูอ์ละหมาด\" (อบูดาวูด อิบนุหะญัรว่าอ่อนในอัตตัลคีศ)", "ถ้ามะซีย์ไหลไม่หยุด หุก่มเหมือนปัสสาวะเล็ด เมื่อเข้าเวลาละหมาด ให้ล้างอวัยวะเพศ แล้วพันด้วยบางสิ่งเพื่อไม่ให้นะญิสเปื้อนเสื้อผ้าและร่างกาย แล้วอาบน้ำละหมาดและละหมาด สิ่งที่ออกมาหลังจากนั้นไม่เป็นไร เพราะเกิดโดยไม่สมัครใจ เทียบกับหญิงที่มีเลือดเสีย", "ในรายงานของอัลบุคอรีย์ \"จงอาบน้ำละหมาดและล้างอวัยวะเพศ\" ตามรูปคำ คำสั่งให้อาบน้ำละหมาดมาก่อนการล้างอวัยวะเพศ แต่ในอุมดะตุลอะห์กาม \"จงล้างอวัยวะเพศและอาบน้ำละหมาด\" และคำว่า \"และ\" ไม่บ่งลำดับ อีกทั้งสำนวนของมุสลิม \"ให้ล้างอวัยวะเพศและอาบน้ำละหมาด\" อธิบายความหมาย สิ่งที่เหมาะสมกว่าคือล้างอวัยวะเพศก่อนอาบน้ำละหมาด"]}, {"wajh": 8, "type": "fiqh", "heading_ar": null, "heading_th": "ล้างอวัยวะเพศทั้งหมดหรือเฉพาะที่เปื้อน", "points_th": ["ทัศนะที่หนึ่ง: วาญิบให้ล้างอวัยวะเพศทั้งหมด ทั้งส่วนที่มะซีย์เปื้อนและไม่เปื้อน เพราะคำว่า \"จงล้างอวัยวะเพศ\" เป็นคำสั่ง และคำสั่งหมายถึงวาญิบ เป็นทัศนะของมาลิก และอีกรายงานจากอะห์มัด", "ทัศนะที่สอง: ล้างอวัยวะเพศทั้งหมดและอัณฑะ เป็นทัศนะที่รู้จักในมัซฮับหันบะลีย์ ตามรายงาน \"ให้ล้างอวัยวะเพศและอัณฑะ แล้วอาบน้ำละหมาด\" และในหะดีษอับดุลลอฮ์ บินสะอ์ด์ \"จงล้างอวัยวะเพศและอัณฑะเพราะมัน และอาบน้ำละหมาด\" แต่คำว่า \"และอัณฑะ\" ไม่ยืนยันในหะดีษอะลี", "ทัศนะที่สาม: ล้างเพียงปลายอวัยวะเพศ หรือที่ที่นะญิสเปื้อน เป็นทัศนะของนักนิติศาสตร์ส่วนใหญ่จากชาฟิอีย์และหะนะฟีย์ และอีกรายงานจากอะห์มัด โดยเทียบกับนะญิสอื่น เพราะเป็นฮะดัษหนึ่ง จึงล้างเฉพาะที่ออก เหมือนปัสสาวะและอุจจาระ และเพราะหะดีษบางบทกล่าวถึงแต่วุฎูอ์", "ผู้แต่งเห็นว่าทัศนะที่สองสอดคล้องกับรูปคำของหะดีษมากกว่า เพราะความกว้างของคำว่า \"ให้ล้างอวัยวะเพศ\" บังคับให้ล้างทั้งหมด ทั้งที่เปื้อนและไม่เปื้อน ประกอบกับการล้างอัณฑะ ดังที่กล่าวมา เมื่อยืนยันด้วยหลักฐานที่ถูกต้อง ก็ต้องปฏิบัติตาม และนี่คือทัศนะที่ชัดของอิบนุตัยมียะฮ์ และอิบนุบาซเห็นว่ามีน้ำหนัก", "วิทยปัญญาของคำสั่งให้ล้างอวัยวะเพศและอัณฑะ ตามทัศนะที่เห็นเช่นนั้น คือมะซีย์ซึ่งเกิดจากการเล้าโลมภรรยา อาจกระจายไปบนอวัยวะเพศและอัณฑะโดยคนไม่รู้สึก (อัลค็อฏฏอบีย์) บางท่านว่า เพราะช่วยลดหรือหยุดมะซีย์ โดยเฉพาะถ้าล้างด้วยน้ำเย็น ซึ่งเป็นเหตุให้หยุดและไม่ออกต่อเนื่อง", "ส่วนสำนวนของอัลบุคอรีย์ \"จงอาบน้ำละหมาดและพรมน้ำที่อวัยวะเพศ\" หมายถึงการล้าง เพราะการพรม (นัฎห์) อาจหมายถึงการล้างหรือการพรมก็ได้ และในอีกสำนวนของอัลบุคอรีย์ \"จงล้างอวัยวะเพศ\" การพรมในที่นี้จึงหมายถึงการล้าง", "นักหะดีษผู้เชี่ยวชาญวิจารณ์รายงานของอะห์มัดและอบูดาวูด ผ่านฮิชาม บินอุรวะฮ์ จากบิดา จากอะลี ว่าเป็นมุรสัล เพราะอุรวะฮ์ไม่ได้ฟังจากอะลี ตามที่อบูหาติมและอบูซุรอะฮ์กล่าว แต่อบูอะวานะฮ์บันทึกผ่านอุบัยดะฮ์ อัสสัลมานีย์ จากอะลี พร้อมส่วนเพิ่ม \"ให้ล้างอวัยวะเพศและอัณฑะ\" อิบนุหะญัรว่า \"สายรายงานไม่มีข้อวิจารณ์\" และอิบนุตัยมียะฮ์กล่าวว่า \"ถ้ามีผู้ว่า ฮิชามรายงานจากบิดา จากอะลี ซึ่งไม่ทันยุคเขา เราตอบว่า ผู้รายงานแบบมุรสัลคือหนึ่งในนักนิติศาสตร์ทั้งเจ็ด รายงานเพื่ออธิบายหุก่ม และนี่เป็นมุรสัลที่แข็งแรงที่สุดประเภทหนึ่ง\""]}, {"wajh": 9, "type": "fiqh", "heading_ar": null, "heading_th": "ต้องใช้น้ำ", "points_th": ["หะดีษเป็นหลักฐานว่าการขจัดมะซีย์ต้องใช้น้ำ ใช้หินหรือสิ่งอื่นแทนไม่ได้ เพราะกำหนดให้ล้าง และสิ่งที่ถูกกำหนดจะปฏิบัติตามได้ก็ด้วยการทำสิ่งนั้น และเทียบกับปัสสาวะไม่ได้ เพราะศาสนาสั่งให้ล้างอวัยวะเพศและอัณฑะ จึงเป็นหุก่มเฉพาะมะซีย์ ไม่ใช่ปัสสาวะ ซึ่งล้างเฉพาะที่เปื้อน", "และรายงาน
