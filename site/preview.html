ย"], "vocab": [{"ar": "لَمْ يُؤَاكِلُوهَا", "th": "ไม่กินร่วมกับนาง"}, {"ar": "النِّكَاحُ", "th": "ในที่นี้คือการร่วมประเวณี"}, {"ar": "فَأَتَّزِرُ", "th": "ฉันนุ่งผ้านุ่ง (อิซาร) รากเดิม อะอ์ตะซิร"}, {"ar": "يُبَاشِرُنِي", "th": "แนบผิวกายกับผิวกาย ในที่นี้ไม่ได้หมายถึงการร่วมประเวณีตามอิจญ์มาอ์"}, {"ar": "الْمَحِيضُ", "th": "ที่ของประจำเดือน (อวัยวะเพศ) หรือช่วงเวลาประจำเดือน"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجهما", "heading_th": "ที่มาของหะดีษ", "points_th": ["หะดีษแรก: มุสลิมบันทึก (302) ในหมวดประจำเดือน บท \"อนุญาตให้หญิงมีประจำเดือนล้างศีรษะสามีและหวีผมให้ และน้ำที่เหลือของนางสะอาด...\" ผ่านหัมมาด บินสะละมะฮ์ จากษาบิต จากอะนัสว่า ชาวยิวเมื่อผู้หญิงมีประจำเดือน ไม่กินร่วมกับนาง และไม่อยู่ร่วมกับนางในบ้าน เศาะหาบะฮ์ถามท่านนบี ﷺ อัลลอฮ์จึงประทานอายะฮ์ \"และพวกเขาถามเจ้าเรื่องประจำเดือน จงกล่าวว่ามันเป็นสิ่งที่ทำร้าย ดังนั้นจงออกห่างผู้หญิงในประจำเดือน...\" (อัลบะเกาะเราะฮ์: 222) ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"จงทำทุกอย่าง ยกเว้นการร่วมประเวณี\" ชาวยิวรู้ข่าวจึงกล่าวว่า \"ชายผู้นี้ไม่ต้องการละเว้นสิ่งใดของเรา นอกจากจะขัดแย้งกับเรา\" อุสัยด์ บินหุฎ็อยร์ และอับบาด บินบิชร์มากล่าวว่า \"โอ้ท่านรสูลุลลอฮ์ ชาวยิวพูดอย่างนั้นอย่างนี้ เราจะไม่ร่วมประเวณีกับพวกนางเลยหรือ\" สีหน้าของท่านรสูลุลลอฮ์ ﷺ เปลี่ยน จนเราคิดว่าท่านโกรธทั้งสอง ทั้งสองออกไป แล้วมีนมเป็นของขวัญมาถึงท่านนบี ﷺ ท่านส่งคนตามทั้งสองไปให้ดื่ม ทั้งสองจึงรู้ว่าท่านไม่ได้โกรธ", "หะดีษที่สอง: อัลบุคอรีย์บันทึกในหมวดประจำเดือน บทการแนบกายกับหญิงมีประจำเดือน (300) และมุสลิม (293) ผ่านมันศูร จากอิบรอฮีม จากอัลอัสวัด จากอาอิชะฮ์ สำนวนนี้เป็นของอัลบุคอรีย์ สำนวนของมุสลิมว่า \"เมื่อคนหนึ่งในหมู่เรามีประจำเดือน ท่านรสูลุลลอฮ์ ﷺ สั่งนางให้นุ่งผ้า แล้วแนบกายกับนาง\""]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظهما", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"แล้วฉันนุ่งผ้า\" คือสวมผ้านุ่ง (อิซาร) ผ้าห่มขนาดเล็ก รากเดิมคือ \"อะอ์ตะซิร\" ด้วยสองฮัมซะฮ์ ตามแบบ \"อิฟตะอะละ\" แล้วรวมเสียงเป็น \"อิตตะซิร\" ด้วยอะลิฟและตาอ์ชัดดะฮ์ นักไวยากรณ์ส่วนใหญ่ เช่น อิบนุฮิชาม ระบุว่าเป็นการผิด ตามหลักควรเป็น \"อาตะซิร\" แต่ที่ถูกคือจำกัดตามที่ได้ยินจากชาวอาหรับ", "\"แล้วท่านแนบกายกับฉัน\" บาชะเราะร็อจญุลุมรอะตะฮู คือสัมผัสผิวของนางโดยแนบผิวกับผิว คำนี้อาจหมายถึงการร่วมประเวณีด้วย แต่ในที่นี้หมายถึงความหมายแรกตามอิจญ์มาอ์"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "ห้ามร่วมประเวณีกับหญิงมีประจำเดือน", "points_th": ["หะดีษอะนัส (ร.ฎ.) เป็นหลักฐานว่าหะรอมที่จะร่วมประเวณีกับหญิงมีประจำเดือน และอายะฮ์ \"และพวกเขาถามเจ้าเรื่องประจำเดือน จงกล่าวว่ามันเป็นสิ่งที่ทำร้าย ดังนั้นจงออกห่างผู้หญิงในประจำเดือน และอย่าเข้าใกล้พวกนางจนกว่าจะสะอาด\" (อัลบะเกาะเราะฮ์: 222) อัลมะฮีฎหมายถึงเวลาหรือที่ของประจำเดือน คืออวัยวะเพศ และการเข้าใกล้หมายถึงคำเลี่ยงของการร่วมประเวณี ไม่ใช่ห้ามเข้าใกล้โดยทั่วไป หลักฐานคือหะดีษอะนัสนี้", "มุสลิมเห็นพ้องกันว่าหะรอมที่จะร่วมประเวณีกับหญิงมีประจำเดือนทางอวัยวะเพศ อิบนุลมุนซิร อิบนุหัซม์ อิบนุกุดามะฮ์ อันนะวะวีย์ อิบนุตัยมียะฮ์ และนักอรรถาธิบายกลุ่มหนึ่งยกว่ามีอิจญ์มาอ์ อันนะวะวีย์ยกจากอัชชาฟิอีย์ว่า \"ผู้ใดทำเช่นนั้น ได้ทำบาปใหญ่\" และยกจากชาฟิอีย์และคนอื่นว่า ผู้ที่ถือว่าการร่วมประเวณีกับหญิงมีประจำเดือนอนุญาตเป็นการปฏิเสธศรัทธา เพราะปฏิเสธสิ่งที่เห็นพ้องกันว่าหะรอม"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "การแนบกายกับหญิงมีประจำเดือน", "points_th": ["หะดีษอาอิชะฮ์ (ร.ฎ.) เป็นหลักฐานว่าอนุญาตให้แนบกายกับหญิงมีประจำเดือน ซึ่งไม่ได้หมายถึงการร่วมประเวณีดังกล่าวแล้ว มีสองประเภท", "(1) การหาความสุขกับหญิงมีประจำเดือนเหนือสะดือและใต้เข่า เช่น จูบ กอด สัมผัส หรือสิ่งอื่น อนุญาตตามตัวบทและอิจญ์มาอ์ ตามที่อิบนุกุดามะฮ์และอันนะวะวีย์ยก", "(2) การหาความสุขกับนางระหว่างสะดือกับเข่า ที่ไม่ใช่อวัยวะเพศและทวารหนัก ส่วนอวัยวะเพศและทวารหนักนั้นหะรอมทั้งสอง และทวารหนักหะรอมโดยทั่วไป ส่วนที่เหลือ เช่น ต้นขาทั้งสอง แนบกายได้ ตามอายะฮ์ \"ดังนั้นจงออกห่างผู้หญิงในประจำเดือน\" (อัลบะเกาะเราะฮ์: 222) อัลมะฮีฎเป็นชื่อของที่หรือเวลาของประจำเดือน การระบุที่ของเลือดด้วยการออกห่าง บ่งว่าส่วนอื่นอนุญาต และอายะฮ์ไม่ได้ตีความว่า จงออกห่างผู้หญิงในช่วงประจำเดือน เพราะตัวบท คือหะดีษอะนัสและอาอิชะฮ์ และอิจญ์มาอ์ปฏิเสธความหมายนั้น และเพราะสาเหตุของการประทานอายะฮ์ดังกล่าวแล้ว", "ที่ดีกว่าคือไม่แนบกายนอกจากมีสิ่งกั้น ตามการกระทำของท่านนบี ﷺ ถ้าแนบกายโดยไม่มีสิ่งกั้น ก็อนุญาตถ้ามั่นใจในตัวเองว่าจะไม่ตกในสิ่งที่ห้าม อิบนุลมุนซิรกล่าวว่า \"ที่สูงกว่าและประเสริฐกว่าคือปฏิบัติตามซุนนะฮ์ ยืนยันว่าท่านนบี ﷺ สั่งอาอิชะฮ์ให้นุ่งผ้า แล้วแนบกายกับนางขณะมีประจำเดือน แต่ในความเห็นฉันไม่หะรอมที่จะแนบกายกับนางนอกอวัยวะเพศ ถ้าหลีกเลี่ยงที่ของสิ่งที่ทำร้าย\" อันนะวะวีย์กล่าวว่า \"ส่วนการแนบกายของท่านนบี ﷺ เหนือผ้านุ่ง ตีความว่าเป็นการส่งเสริม เพื่อรวมคำพูดกับการกระทำของท่าน\" ผู้แต่งว่าเขาอาจหมายถึงคำพูดในหะดีษอะนัสที่กล่าวแล้ว"]}, {"wajh": 5, "type": "fawaid", "heading_ar": null, "heading_th": "อันตรายของการร่วมประเวณีขณะมีประจำเดือน", "points_th": ["ศาสนาห้ามร่วมประเวณีกับหญิงมีประจำเดือน เพราะมีอันตรายร้ายแรง ผู้แต่งอ้างถึงคำอธิบายทางการแพทย์สมัยใหม่ว่า (1) ทำให้เลือดประจำเดือนออกมากขึ้น เพราะเส้นเลือดในมดลูกคั่งและฉีกง่าย (2) ทำให้มดลูกเสี่ยงติดเชื้อแบคทีเรีย เพราะความต้านทานอ่อนลงจากประจำเดือน ระบบป้องกันหยุดทำงาน และสภาพแวดล้อมเหมาะแก่การเพิ่มของเชื้อโรค (3) อันตรายอาจลามไปถึงท่อปัสสาวะ กระเพาะปัสสาวะ ท่อไต และไต (4) ร่างกายของหญิงมีประจำเดือนอ่อนแอเพราะได้รับผลกระทบหลายอย่าง และจิตใจระหว่างประจำเดือน โดยเฉพาะช่วงแรก มีความวิตกกังวลและซึมเศร้า ซึ่งไม่เอื้อต่อความต้องการร่วมประเวณี", "ผู้ชายก็ได้รับอันตราย เพราะการสอดอวัยวะเพศเข้าไปในช่องคลอดของหญิงมีประจำเดือนเป็นสาเหตุของโรคมาก ซึ่งไม่จำกัดที่อวัยวะเพศ แต่ลามไปถึงท่อปัสสาวะ หรือทั้งระบบทางเดินปัสสาวะรวมถึงไต และยังทำให้ผนังช่องคลอดเกิดรอยถลอกซึ่งนำไปสู่การอักเสบของมดลูก หรือการอักเสบที่อวัยวะเพศชายจากรอยถลอกระหว่างการเสียดสี และอัลลอฮ์ทรงปรีชา ทรงรอบรู้"]}], "tags_th": ["ประจำเดือน", "การร่วมประเวณี", "การแนบกาย", "อิจญ์มาอ์", "ชาวยิว"]}, {"id": "v2-h146", "volume": 2, "bab": "hayd", "topic_ar": "كفارة وطء الحائض", "topic_th": "การชดเชย (กัฟฟาเราะฮ์) ของการร่วมประเวณีกับหญิงมีประจำเดือน", "pages": [144, 148], "hadith": [{"no": 146, "matn_ar": "وَعَنِ ابْنِ عَبَّاسٍ رَضِيَ اللهُ عَنْهُمَا، عَنِ النَّبِيِّ ﷺ فِي الَّذِي يَأْتِي امْرَأَتَهُ وَهِيَ حَائِضٌ قَالَ: «يَتَصَدَّقُ بِدِينَارٍ، أَوْ نِصْفِ دِينَارٍ». رَوَاهُ الْخَمْسَةُ، وَصَحَّحَهُ الْحَاكِمُ وَابْنُ الْقَطَّانِ، وَرَجَّحَ غَيْرُهُمَا وَقْفَهُ.", "translation_th": "และจากอิบนุอับบาส (ร.ฎ.) จากท่านนบี ﷺ เกี่ยวกับผู้ที่ร่วมประเวณีกับภรรยาขณะนางมีประจำเดือน ท่านกล่าวว่า \"ให้เขาบริจาคหนึ่งดีนาร หรือครึ่งดีนาร\" รายงานโดยนักบันทึกทั้งห้า อัลหากิมและอิบนุลก็อฏฏอนว่าศ่อฮีห์ และคนอื่นเห็นว่าเป็นเมากูฟมีน้ำหนักกว่า", "grade_th": "มีความขัดแย้งมาก อัชชาฟิอีย์ อิบนุลมุนซิร อิบนุอับดิลบัรร์ และอันนะวะวีย์ว่าอ่อน อัลหากิม อิบนุลก็อฏฏอน อิบนุดะกีกิลอีด อิบนุหะญัร อิบนุตัยมียะฮ์ อิบนุลก็อยยิม อะห์มัด ชากิร อัลอัลบานีย์ และเชคอิบนุบาซว่าศ่อฮีห์ ผู้แต่งเห็นว่าใช้เป็นหลักฐานไม่ได้ เพราะความสับสนและความขัดแย้งในสายมาก"}], "key_rulings_th": ["ทัศนะแรก: ผู้ที่ร่วมประเวณีกับภรรยาขณะมีประจำเดือน ต้องบริจาคหนึ่งหรือครึ่งดีนารเป็นการชดเชยบาป (อะห์มัด และอัชชาฟิอีย์ในทัศนะเก่า)", "ทัศนะที่สอง: ไม่ต้องจ่ายอะไรจากทรัพย์ แต่ให้ขออภัยโทษต่ออัลลอฮ์ (นักวิชาการส่วนใหญ่ หะนะฟีย์ มาลิกีย์ ชาฟิอีย์ในทัศนะใหม่ ซอฮิรีย์ อิบนุสีรีน อะฏออ์ อันนะเคาะอีย์)", "ผู้แต่งเห็นว่าทัศนะที่สองชัดเจนกว่า อินชาอัลลอฮ์ เพราะหะดีษที่บังคับกัฟฟาเราะฮ์ไม่ใช่หลักฐานที่พอจะบังคับภาระ และหลักเดิมคือพ้นจากภาระ", "ตามทัศนะที่ว่าต้องจ่าย ผู้แต่งเห็นว่าผู้หญิงที่ยินยอมและรู้ว่าหะรอมก็ต้องจ่ายด้วย ส่วนผู้ที่ไม่รู้หรือถูกบังคับไม่ต้องจ่าย"], "vocab": [{"ar": "يَأْتِي امْرَأَتَهُ", "th": "ร่วมประเวณีกับภรรยา"}, {"ar": "يَتَصَدَّقُ بِدِينَارٍ", "th": "บริจาคทานหนึ่งดีนาร (เหรียญทอง)"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อบูดาวูดบันทึก (264) ในหมวดความสะอาด บทการร่วมประเวณีกับหญิงมีประจำเดือน อัตติรมิซีย์ (136) อันนะสาอีย์ (1/153) อิบนุมาญะฮ์ (640) อะห์มัด (3/473) และอัลหากิม (1/172) ทั้งหมดผ่านชุอ์บะฮ์ จากอัลหะกัม จากอับดุลหะมีด บินอับดิรเราะห์มาน จากมิกสัม จากอิบนุอับบาส จากท่านนบี ﷺ สำนวนนี้เป็นของอบูดาวูด หะดีษนี้มาหลายสายและหลายสำนวน และนักวิชาการวิจารณ์มากเรื่องข้อบกพร่อง", "สายส่วนใหญ่ขึ้นอยู่กับมิกสัม ผู้รับใช้ของอิบนุอับบาส ซึ่งถูกวิจารณ์ กลุ่มหนึ่งว่าเชื่อถือได้ เช่น ยะอ์กูบ บินอบีสุฟยาน และอัดดารุกุฏนีย์ คนอื่นว่าอ่อน เช่น อิบนุสะอ์ด และอิบนุหัซม์ อิบนุหะญัรใน \"อัตตักรีบ\" ว่า \"ศอดูก และรายงานแบบมุรสัล ในอัลบุคอรีย์เขามีเพียงหะดีษเดียว\" และใน \"อัตตัลคีศ\" ว่า \"อัลบุคอรีย์บันทึกเขาเพียงหะดีษเดียวในตัฟซีรซูเราะฮ์อันนิสาอ์ และมีผู้รายงานสนับสนุน\"", "ข้อบกพร่องที่สำคัญที่สุดมีสอง (1) ความขัดแย้งว่ามัรฟูอ์หรือเมากูฟ ตามที่อิบนุหะญัรกล่าว กลุ่มหนึ่งรายงานจากชุอ์บะฮ์แบบเมากูฟจากอิบนุอับบาส และชุอ์บะฮ์เคยรายงานแบบมัรฟูอ์แล้วเปลี่ยน อิบนุลญารูดรายงานว่า ชุอ์บะฮ์เล่าหะดีษนี้โดยไม่ยกถึงท่านนบี มีชายคนหนึ่งกล่าวกับชุอ์บะฮ์ว่า \"ท่านเคยยกถึงท่านนบี\" เขาตอบว่า \"ฉันบ้าไปแล้ว แต่ตอนนี้หายแล้ว\" อบูหาติมว่า \"รายงานขัดแย้งกัน บางคนรายงานจากมิกสัม จากอิบนุอับบาสแบบเมากูฟ บางคนจากมิกสัม จากท่านนบี ﷺ แบบมุรสัล ส่วนหะดีษของชุอ์บะฮ์ ยะห์ยา บินสะอีดรายงานแบบมีสาย และเล่าว่าชุอ์บะฮ์รายงานแบบมีสาย และว่า อัลหะกัมรายงานแบบมีสายแก่ฉันครั้งหนึ่ง และแบบเมากูฟอีกครั้งหนึ่ง\" (2) เนื้อความสับสน บางรายงานว่า \"หนึ่งดีนาร หรือครึ่งดีนาร\" แบบสงสัย บางรายงานว่า \"บริจาคหนึ่งดีนาร ถ้าไม่มี ก็ครึ่งดีนาร\" บางรายงานแยกระหว่างร่วมประเวณีในช่วงแรกของเลือด หรือช่วงเลือดหยุด และรูปแบบความขัดแย้งอื่น", "อิมามอัชชาฟิอีย์ อิบนุลมุนซิร อิบนุอับดิลบัรร์ อันนะวะวีย์ และคนอื่นว่าหะดีษอ่อน อีกกลุ่มหนึ่งว่าศ่อฮีห์ ได้แก่ อัลหากิม อิบนุลก็อฏฏอน อิบนุดะกีกิลอีด และอิบนุหะญัร ซึ่งกล่าวว่า \"นี่ถูกต้อง หะดีษจำนวนมากที่ใช้เป็นหลักฐานมีความขัดแย้งมากกว่านี้ เช่น หะดีษบ่อบุฎออะฮ์ และหะดีษกุลละตัยน์ และทำนองนั้น และนี่เป็นข้อแย้งต่ออันนะวะวีย์ ที่อ้างใน \"ชัรห์อัลมุฮัษษับ\" \"อัตตันกีห์\" และ \"อัลคุลาเศาะฮ์\" ว่านักวิชาการทั้งหมดขัดแย้งกับอัลหากิมที่ว่าศ่อฮีห์ และที่ถูกคืออ่อนตามความเห็นพ้อง ซึ่งอันนะวะวีย์ตามอิบนุศศ็อลาห์ในบางส่วน\" อิบนุตัยมียะฮ์ อิบนุลก็อยยิม อะห์มัด ชากิร อัลอัลบานีย์ และเชคอับดุลอะซีซ บินบาซก็ว่าศ่อฮีห์", "พวกเขาตอบข้อบกพร่องว่า การเป็นเมากูฟจากอิบนุอับบาสไม่ขัดกับการเป็นมัรฟูอ์ แต่สนับสนุน และเรื่องนี้ไม่ใช่เรื่องที่ใช้ความเห็นได้ จึงอยู่ในหุก่มมัรฟูอ์ และคำของชุอ์บะฮ์ไม่เป็นปัญหา เพราะการรายงานแบบมัรฟูอ์เป็นส่วนเพิ่มจากผู้เชื่อถือได้ อบูบักร อัลเคาะฏีบกล่าวว่า \"ความขัดแย้งของสองรายงานในการเป็นมัรฟูอ์หรือเมากูฟ ไม่มีผลต่อหะดีษว่าอ่อน นี่เป็นมัซฮับของนักอุศูล เพราะรายงานหนึ่งไม่ได้หักล้างอีกรายงาน และการถือตามรายงานมัรฟูอ์เป็นการถือตามส่วนเพิ่ม ซึ่งวาญิบต้องรับ\" และชุอ์บะฮ์ไม่ได้รายงานแบบมัรฟูอ์คนเดียว แต่มีผู้รายงานสนับสนุน เช่น เกาะตาดะฮ์ ในอัลบัยฮะกีย์และอันนะสาอีย์ แต่ในสองสายนี้มีการวิจารณ์", "ส่วนความสับสนในเนื้อความ ต้องดูว่ารายงานใดมีน้ำหนักกว่า เพราะความสับสนจะยืนยันได้เมื่อรายงานเท่ากัน ถ้ารายงานหนึ่งมีน้ำหนักกว่า ก็ไม่มีความสับสน อบูดาวูดจึงกล่าวว่า \"อย่างนี้เป็นรายงานที่ถูกต้อง เขากล่าวว่า หนึ่งดีนาร หรือครึ่งดีนาร\" คือให้เลือก ต่างจากรายงานอื่นที่มีว่าครึ่งดีนาร หนึ่งในห้าดีนาร หรือปลดปล่อยทาส ซึ่งอ่อน"]}, {"wajh": 2, "type": "fiqh", "heading_ar": null, "heading_th": "กัฟฟาเราะฮ์ของการร่วมประเวณีกับหญิงมีประจำเดือน", "points_th": ["ผู้ที่ว่าผู้ที่ร่วมประเวณีกับภรรยาขณะนางมีประจำเดือน ต้องบริจาคหนึ่งหรือครึ่งดีนารเป็นกัฟฟาเราะฮ์ของบาป ใช้หะดีษนี้เป็นหลักฐาน เป็นทัศนะของอิมามอะห์มัด และอัชชาฟิอีย์ในทัศนะเก่า", "ทัศนะที่สอง: ไม่ต้องจ่ายอะไรจากทรัพย์ แต่ให้ขออภัยโทษต่ออัลลอฮ์ เป็นทัศนะของนักวิชาการส่วนใหญ่ ได้แก่ หะนะฟีย์ มาลิกีย์ ชาฟิอีย์ในทัศนะใหม่ เป็นรายงานหนึ่งจากอิมามอะห์มัด ทัศนะของซอฮิรีย์ และสะลัฟกลุ่มหนึ่ง เช่น อิบนุสีรีน อะฏออ์ และอิบรอฮีม อันนะเคาะอีย์ พวกเขาใช้หะดีษอบูฮุร็อยเราะฮ์ (ร.ฎ.) ว่าท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"ผู้ใดร่วมประเวณีกับหญิงมีประจำเดือน หรือผู้หญิงทางทวารหนัก หรือไปหาหมอดูแล้วเชื่อ ก็ได้พ้นจากสิ่งที่ถูกประทานแก่มุหัมมัดแล้ว\" และอีกรายงานว่า \"ก็ได้ปฏิเสธศรัทธาแล้ว\" (อบูดาวูด 3904 อัตติรมิซีย์ อันนะสาอีย์ใน \"อัลกุบรอ\" อะห์มัด สายอ่อนเพราะสายขาด เพราะเป็นรายงานของอบูตะมีมะฮ์ อัลฮุญัยมีย์จากอบูฮุร็อยเราะฮ์ ซึ่งไม่รู้ว่าได้ยินจากเขา ตามที่อัลบุคอรีย์ระบุ และที่รู้จักคือเมากูฟจากอบูฮุร็อยเราะฮ์ และไม่มีการกล่าวถึงการร่วมประเวณีกับหญิงมีประจำเดือน) หลักฐานคือท่านไม่ได้กล่าวว่าต้องจ่ายกัฟฟาเราะฮ์ พวกเขากล่าวว่าหะดีษที่บังคับกัฟฟาเราะฮ์สับสนในเนื้อความ และสายถูกวิจารณ์ จึงไม่แข็งแรงพอจะเป็นหลักฐานของการบังคับภาระ และหลักเดิมคือพ้นจากภาระ นอกจากด้วยหลักฐานที่ไม่มีข้อโต้แย้ง", "อิบนุรุชด์ระบุว่าสาเหตุของความขัดแย้งคือความขัดแย้งเรื่องความถูกต้องของหะดีษในเรื่องนี้ แล้วกล่าวว่า \"ผู้ใดเห็นว่าหะดีษใดถูกต้อง ก็ถือตาม และผู้ใดไม่เห็นว่าถูกต้อง ซึ่งคือนักวิชาการส่วนใหญ่ ก็ปฏิบัติตามหลักเดิม คือไม่มีหุก่มจนกว่าจะยืนยันด้วยหลักฐาน\" ผู้แต่งเห็นว่านี่คือทัศนะที่ชัดเจนกว่า อินชาอัลลอฮ์ เพราะหะดีษเช่นนี้ใช้เป็นหลักฐานไม่ได้ เพราะความสับสนและความขัดแย้งมากในสาย และไม่มีการยกจากนักวิชาการรุ่นแรกที่จะพึ่งได้ ทุกคนที่ว่าศ่อฮีห์อยู่ในศตวรรษที่สี่เป็นต้นมา และคำวินิจฉัยของสะลัฟก็ขัดกับมัน", "ตามทัศนะว่าวาญิบต้องจ่ายกัฟฟาเราะฮ์ ก็วาญิบแก่ผู้ชาย ส่วนผู้หญิง ถ้านางยินยอมและรู้ว่าหะรอม นางต้องจ่ายเหมือนผู้ชาย เพราะเป็นการร่วมประเวณีที่ทำให้ต้องจ่ายกัฟฟาเราะฮ์ จึงวาญิบแก่ผู้หญิงที่ยินยอม เหมือนกัฟฟาเราะฮ์การร่วมประเวณีขณะครองเอียะห์รอม อิบนุกุดามะฮ์ยกจากอะห์มัด ทัศนะที่สอง: ผู้หญิงไม่ต้องจ่าย อัลกอฎีย์ระบุว่าเป็นแนวหนึ่งในมัซฮับอะห์มัด เพราะศาสนาไม่ได้บังคับนาง และความวาญิบรับจากศาสนา ผู้แต่งเห็นว่าทัศนะแรกชัดเจนกว่า เพราะที่กล่าวแล้ว และเพราะทั้งสองเท่ากันในการทำสิ่งต้องห้าม ถ้านางไม่รู้หรือถูกบังคับ ไม่ต้องจ่าย ตามอายะฮ์ \"นอกจากผู้ที่ถูกบังคับ ขณะที่หัวใจของเขามั่นคงด้วยการศรัทธา\" (อันนะห์ล: 106) เมื่อผู้มีภาระได้รับการอภัยเพราะถูกบังคับแม้ในการปฏิเสธศรัทธา สิ่งที่ต่ำกว่านั้นยิ่งได้รับการอภัย"]}], "tags_th": ["ประจำเดือน", "กัฟฟาเราะฮ์", "การร่วมประเวณี", "การขออภัยโทษ", "หะดีษขัดแย้ง"]}, {"id": "v2-h147", "volume": 2, "bab": "hayd", "topic_ar": "الحائض تترك الصوم والصلاة", "topic_th": "หญิงมีประจำเดือนละการถือศีลอดและละหมาด", "pages": [149, 151], "hadith": [{"no": 147, "matn_ar": "وَعَنْ أَبِي سَعِيدٍ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «أَلَيْسَ إِذَا حَاضَتْ لَمْ تُصَلِّ وَلَمْ تَصُمْ؟». مُتَّفَقٌ عَلَيْهِ فِي حَدِيثٍ.", "translation_th": "และจากอบูสะอีด (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"เมื่อนางมีประจำเดือน นางไม่ละหมาดและไม่ถือศีลอดมิใช่หรือ\" บันทึกโดยอัลบุคอรีย์และมุสลิมในหะดีษบทหนึ่ง", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์ ส่วนมุสลิมยกสายโดยไม่ได้ยกสำนวน ตามที่อิบนุหะญัรระบุ)"}], "key_rulings_th": ["หญิงมีประจำเดือนละละหมาดระหว่างมีประจำเดือน และถ้าละหมาดก็ใช้ไม่ได้ เพราะความสะอาดเป็นเงื่อนไขของละหมาด ตามอิจญ์มาอ์", "หญิงมีประจำเดือนละการถือศีลอด และถ้าถือก็ใช้ไม่ได้ ตามอิจญ์มาอ์", "นักวิชาการเห็นพ้องว่าไม่วาญิบต้องชดใช้ละหมาด แต่วาญิบต้องชดใช้การถือศีลอด ตามหะดีษมุอาซะฮ์จากอาอิชะฮ์", "วิทยปัญญา (อิบนุลก็อยยิมและคนอื่น): ละหมาดเกิดซ้ำทุกวันและประจำเดือนเกิดเกือบทุกเดือน การบังคับให้ชดใช้จึงลำบาก ส่วนการถือศีลอดเป็นปีละหนึ่งเดือน ถ้าตกไปก็ไม่มีทางชดเชย จึงสั่งให้ชดใช้"], "vocab": [{"ar": "أَلَيْسَ إِذَا حَاضَتْ", "th": "มิใช่หรือว่าเมื่อนางมีประจำเดือน"}, {"ar": "نَاقِصَاتُ عَقْلٍ وَدِينٍ", "th": "ขาดตกบกพร่องทางปัญญาและศาสนา (ตามที่อธิบายในหะดีษเต็ม)"}, {"ar": "أَحَرُورِيَّةٌ أَنْتِ", "th": "เธอเป็นชาวหะรูรออ์หรือ (ฝ่ายเคาะวาริจที่เห็นว่าหญิงมีประจำเดือนต้องชดใช้ละหมาด)"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกในหมวดประจำเดือน บทหญิงมีประจำเดือนละการถือศีลอด (304) ผ่านสะอีด บินอบีมัรยัม จากมุหัมมัด บินญะอ์ฟัร จากซัยด์ บินอัสลัม จากอิยาฎ บินอับดิลลาฮ์ จากอบูสะอีด อัลคุดรีย์ว่า ท่านรสูลุลลอฮ์ ﷺ ออกไปยังที่ละหมาดในวันอีดิลอัฎฮาหรืออีดิลฟิฏร์ เดินผ่านผู้หญิง แล้วกล่าวว่า \"โอ้ผู้หญิงทั้งหลาย จงบริจาคทาน เพราะฉันเห็นว่าพวกเธอเป็นชาวนรกมากที่สุด\" พวกนางถามว่า \"เพราะอะไร โอ้ท่านรสูลุลลอฮ์\" ท่านตอบว่า \"พวกเธอสาปแช่งมาก และเนรคุณสามี ฉันไม่เคยเห็นผู้ใดที่ขาดตกบกพร่องทางปัญญาและศาสนา ที่จะทำให้ชายผู้เด็ดเดี่ยวหมดสติได้มากกว่าคนหนึ่งในหมู่พวกเธอ\" พวกนางถามว่า \"อะไรคือความบกพร่องทางศาสนาและปัญญาของเรา\" ท่านตอบว่า \"การเป็นพยานของผู้หญิงเท่ากับครึ่งหนึ่งของการเป็นพยานของผู้ชายมิใช่หรือ\" ตอบว่า \"ใช่\" ท่านกล่าวว่า \"นั่นคือความบกพร่องทางปัญญา เมื่อนางมีประจำเดือน นางไม่ละหมาดและไม่ถือศีลอดมิใช่หรือ\" ตอบว่า \"ใช่\" ท่านกล่าวว่า \"นั่นคือความบกพร่องทางศาสนา\"", "นี่เป็นสำนวนของอัลบุคอรีย์ อิบนุหะญัรยกเฉพาะส่วนที่ต้องการ ส่วนอิมามมุสลิมยกสายโดยไม่ยกเนื้อความ (132) (80) ในหมวดอีมาน บทการบกพร่องของอีมานเพราะการบกพร่องของการปฏิบัติ และให้อ้างถึงหะดีษอิบนุอุมัรที่เขายก (132) (79) ซึ่งมีว่า \"ส่วนความบกพร่องทางปัญญา การเป็นพยานของผู้หญิงสองคนเท่ากับผู้ชายหนึ่งคน นี่คือความบกพร่องทางปัญญา และนางอยู่หลายคืนโดยไม่ละหมาด และไม่ถือศีลอดในเราะมะฎอน นี่คือความบกพร่องทางศาสนา\" อิบนุหะญัรว่า \"ที่จริงมุสลิมไม่ได้ยกสำนวนเลย แต่ยกหะดีษอิบนุอุมัรด้วยอีกสายในเรื่องผู้หญิงและความบกพร่องของปัญญาและศาสนาของพวกนางโดยเฉพาะ แล้วตามด้วยหะดีษอบูสะอีด\""]}, {"wajh": 2, "type": "fiqh", "heading_ar": null, "heading_th": "หญิงมีประจำเดือนละละหมาด", "points_th": ["หะดีษเป็นหลักฐานว่าหญิงมีประจำเดือนละละหมาดระหว่างมีประจำเดือน และถ้าละหมาดก็ใช้ไม่ได้ เพราะความสะอาดเป็นเงื่อนไขความถูกต้องของละหมาด และนางไม่สะอาด นี่เป็นเรื่องที่เห็นพ้องกัน"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "หญิงมีประจำเดือนละการถือศีลอด", "points_th": ["หะดีษเป็นหลักฐานว่าหญิงมีประจำเดือนละการถือศีลอดระหว่างมีประจำเดือน และถ้าถือก็ใช้ไม่ได้ นี่เป็นเรื่องที่เห็นพ้องกัน อัลบุคอรีย์ตั้งบทของหะดีษนี้ว่า \"บทหญิงมีประจำเดือนละการถือศีลอด\" อิบนุหะญัรยกจากอิบนุรุชัยด์และคนอื่นว่า \"อัลบุคอรีย์ดำเนินตามแนวของเขาในการอธิบายสิ่งที่ยาก ไม่ใช่สิ่งที่ชัด เพราะการละละหมาดชัดเจน เนื่องจากความสะอาดเป็นเงื่อนไขของละหมาด และนางไม่สะอาด ส่วนการถือศีลอดไม่มีเงื่อนไขความสะอาด การละทิ้งจึงเป็นอิบาดะฮ์ล้วน ๆ จึงต้องระบุชัด ต่างจากละหมาด\""]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "การชดใช้การถือศีลอดแต่ไม่ชดใช้ละหมาด", "points_th": ["นักวิชาการเห็นพ้องว่าหญิงมีประจำเดือนไม่วาญิบต้องชดใช้ละหมาด และวาญิบต้องชดใช้การถือศีลอด หลักฐานคือหะดีษมุอาซะฮ์ อัลอะดะวียะฮ์ ว่า \"ฉันถามอาอิชะฮ์ (ร.ฎ.) ว่า ทำไมหญิงมีประจำเดือนชดใช้การถือศีลอด แต่ไม่ชดใช้ละหมาด นางตอบว่า เธอเป็นชาวหะรูรออ์หรือ ฉันตอบว่า ฉันไม่ใช่ชาวหะรูรออ์ แต่ฉันถาม นางตอบว่า เรื่องนั้นเคยเกิดกับเรา เราถูกสั่งให้ชดใช้การถือศีลอด และไม่ถูกสั่งให้ชดใช้ละหมาด\" (อัลบุคอรีย์ 321 มุสลิม 335 สำนวนของมุสลิม) \"เธอเป็นชาวหะรูรออ์หรือ\" เป็นคำถามแบบทักท้วง หะรูรออ์คือหมู่บ้านในอิรักใกล้กูฟะฮ์ ที่กลุ่มแรกที่แยกตัวจากอะลี (ร.ฎ.) ไปตั้งค่าย คนเคาะวาริจจึงถูกเรียกตามชื่อนี้ ความเห็นผิดของพวกเขาคือหญิงมีประจำเดือนชดใช้ละหมาดเหมือนชดใช้การถือศีลอด", "นี่เป็นหลักฐานเด็ดขาดว่าหญิงมีประจำเดือนชดใช้การถือศีลอดและไม่ชดใช้ละหมาด ตามคำของอาอิชะฮ์ \"เราถูกสั่งให้ชดใช้การถือศีลอด และไม่ถูกสั่งให้ชดใช้ละหมาด\" นางพอใจที่จะกล่าวถึงหลักฐานศาสนาโดยไม่กล่าวถึงวิทยปัญญา เพราะผู้ศรัทธายอมรับด้วยหลักฐาน และศาสนาครอบคลุมวิทยปัญญาในทุกกรณี", "นักวิชาการ รวมทั้งอิบนุลก็อยยิม ระบุว่าวิทยปัญญาที่หญิงมีประจำเดือนชดใช้การถือศีลอดแต่ไม่ชดใช้ละหมาด คือละหมาดเกิดซ้ำทุกวัน และประจำเดือนโดยทั่วไปเกิดซ้ำทุกเดือน การบังคับให้ชดใช้จึงลำบาก และละหมาดในวันสะอาดก็เพียงพอแทนละหมาดในวันประจำเดือน นางได้ประโยชน์ของละหมาดในช่วงสะอาดเพราะเกิดซ้ำทุกวัน ต่างจากการถือศีลอดที่ไม่เกิดซ้ำ แต่เป็นปีละหนึ่งเดือน ถ้าตกไปเพราะประจำเดือน นางไม่มีทางทดแทน และจะสูญเสียประโยชน์ จึงถูกสั่งให้ชดใช้สิ่งที่ขาดไป เพื่อให้ได้ประโยชน์ของการถือศีลอด"]}], "tags_th": ["ประจำเดือน", "ละหมาด", "การถือศีลอด", "การชดใช้", "อิจญ์มาอ์"]}, {"id": "v2-h148", "volume": 2, "bab": "hayd", "topic_ar": "نهي الحائض عن الطواف بالبيت", "topic_th": "การห้ามหญิงมีประจำเดือนเฏาะวาฟรอบกะอ์บะฮ์", "pages": [152, 154], "hadith": [{"no": 148, "matn_ar": "وَعَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: لَمَّا جِئْنَا سَرِفَ حِضْتُ، فَقَالَ النَّبِيُّ ﷺ: «افْعَلِي مَا يَفْعَلُ الْحَاجُّ، غَيْرَ أَلَّا تَطُوفِي بِالْبَيْتِ حَتَّى تَطْهُرِي». مُتَّفَقٌ عَلَيْهِ فِي حَدِيثٍ.", "translation_th": "และจากอาอิชะฮ์ (ร.ฎ.) กล่าวว่า เมื่อเรามาถึงสะริฟ ฉันมีประจำเดือน ท่านนบี ﷺ กล่าวว่า \"จงทำสิ่งที่ผู้ทำหัจญ์ทำ ยกเว้นอย่าเฏาะวาฟรอบบ้าน (กะอ์บะฮ์) จนกว่าเธอจะสะอาด\" บันทึกโดยอัลบุคอรีย์และมุสลิมในหะดีษบทหนึ่ง", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["หญิงมีประจำเดือนทำพิธีหัจญ์ได้ทุกอย่าง เช่น วุกูฟที่อะเราะฟะฮ์ ค้างที่มุซดะลิฟะฮ์ ขว้างเสา ค้างที่มินา และสะอีย์ระหว่างเศาะฟากับมัรวะฮ์ (ถ้าเฏาะวาฟก่อนมีประจำเดือน) เพราะพิธีเหล่านี้ไม่มีเงื่อนไขความสะอาด", "หะรอมที่หญิงมีประจำเดือนจะเฏาะวาฟ และเฏาะวาฟใช้ไม่ได้ ถ้ามีประจำเดือนระหว่างเฏาะวาฟก็เสีย (นักวิชาการส่วนใหญ่) อิบนุอับดิลบัรร์ อิบนุหัซม์ อิบนุรุชด์ อันนะวะวีย์ อิบนุตัยมียะฮ์ และคนอื่นยกว่ามีอิจญ์มาอ์", "แต่ถ้าหญิงมีประจำเดือนไม่สามารถอยู่มักกะฮ์จนสะอาดแล้วเฏาะวาฟได้ เช่น กลัวต่อตัวเองหรือทรัพย์ หรือคณะเดินทางไม่รอ และมาจากที่ไกลที่กลับมาไม่ได้ อิบนุตัยมียะฮ์และอิบนุลก็อยยิมว่านางเฏาะวาฟได้ เพราะเงื่อนไขและวาญิบตกไปเมื่อทำไม่ได้", "ถ้านางอยู่ได้ หรืออยู่ใกล้ที่สามารถกลับมาพร้อมมะห์รอมหลังสะอาด ก็ให้ไปแล้วกลับมาเฏาะวาฟ"], "vocab": [{"ar": "سَرِفُ", "th": "สะริฟ หุบเขาทางเหนือของมักกะฮ์ ห่างจากเขตหะรอมทางตันอีมราวสิบกิโลเมตร ปัจจุบันมีชุมชนแล้ว"}, {"ar": "طَمِثْتُ", "th": "ฉันมีประจำเดือน"}, {"ar": "نَفِسْتِ", "th": "เธอมีประจำเดือน (นะฟิสติ ฟัตหะฮ์ที่นูน) หรือนิฟาส (นุฟิสติ ฎ็อมมะฮ์)"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกในหมวดประจำเดือน บทหญิงมีประจำเดือนทำพิธีทั้งหมด ยกเว้นเฏาะวาฟรอบบ้าน (305) และมุสลิม (1211) (120) ผ่านอับดุรเราะห์มาน บินอัลกอสิม จากบิดา จากอาอิชะฮ์ว่า \"เราออกไปกับท่านนบี ﷺ โดยตั้งใจเพียงหัจญ์ เมื่อเรามาถึงสะริฟ ฉันมีประจำเดือน ท่านนบี ﷺ เข้ามาหาฉันขณะฉันร้องไห้ ท่านถามว่า อะไรทำให้เธอร้องไห้ ฉันตอบว่า ขอสาบานต่ออัลลอฮ์ ฉันอยากไม่ได้มาหัจญ์ปีนี้ ท่านถามว่า บางทีเธออาจมีประจำเดือน ฉันตอบว่า ใช่ ท่านกล่าวว่า นั่นเป็นสิ่งที่อัลลอฮ์ทรงกำหนดแก่ลูกหลานหญิงของอาดัม ดังนั้นจงทำสิ่งที่ผู้ทำหัจญ์ทำ ยกเว้นอย่าเฏาะวาฟรอบบ้านจนกว่าเธอจะสะอาด\" นี่เป็นสำนวนของอัลบุคอรีย์"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"สะริฟ\" (ฟัตหะฮ์ที่สีน กัสเราะฮ์ที่รออ์) ผันไม่ได้เพราะเป็นชื่อเฉพาะและเพศหญิง เป็นหุบเขาทางเหนือของมักกะฮ์ ระหว่างมักกะฮ์กับหุบเขาอัลญะมูม (มัรรุซซอฮ์รอน) ห่างจากเขตหะรอมทางตันอีมราวสิบกิโลเมตร มีบ่อน้ำและไร่เล็ก ๆ ปัจจุบันมีชุมชน และเส้นทางระหว่างมักกะฮ์กับมะดีนะฮ์ผ่าน", "\"เฏาะมิษตุ\" (ฟัตหะฮ์หรือกัสเราะฮ์ที่มีม) คือฉันมีประจำเดือน \"นะฟิสติ\" ฟัตหะฮ์ที่นูนสำหรับประจำเดือน และฎ็อมมะฮ์สำหรับนิฟาส นี่เป็นทัศนะของคนส่วนใหญ่ อบูหาติมยกจากอัลอัศมะอีย์ว่า \"กล่าวว่า นุฟิสะติลมัรอะฮ์ ในเรื่องประจำเดือนและการคลอด ด้วยฎ็อมมะฮ์ที่นูนทั้งสอง\" อิบนุหะญัรว่า \"ยืนยันในรายงานของเราทั้งสองแบบ ฟัตหะฮ์และฎ็อมมะฮ์ที่นูน\""]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "สิ่งที่หญิงมีประจำเดือนทำได้ในหัจญ์", "points_th": ["หะดีษเป็นหลักฐานว่าหญิงมีประจำเดือนทำสิ่งที่ผู้ทำหัจญ์ทำ เช่น วุกูฟที่อะเราะฟะฮ์ ค้างที่มุซดะลิฟะฮ์ ขว้างเสา ค้างที่มินา และสะอีย์ระหว่างเศาะฟากับมัรวะฮ์ ถ้านางเฏาะวาฟก่อนมีประจำเดือน เพราะพิธีเหล่านี้ไม่มีเงื่อนไขความสะอาด"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "ห้ามหญิงมีประจำเดือนเฏาะวาฟ", "points_th": ["หะดีษเป็นหลักฐานว่าหะรอมที่หญิงมีประจำเดือนจะเฏาะวาฟ และใช้ไม่ได้ และถ้ามีประจำเดือนระหว่างเฏาะวาฟ เฏาะวาฟก็เสีย นี่เป็นมัซฮับของนักวิชาการส่วนใหญ่ ได้แก่ มาลิกีย์ ชาฟิอีย์ ฮัมบะลีย์ในที่รู้จัก และซอฮิรีย์ ตามคำว่า \"จงทำสิ่งที่ผู้ทำหัจญ์ทำ ยกเว้นอย่าเฏาะวาฟรอบบ้านจนกว่าเธอจะสะอาด\" และในรายงานของมุสลิมว่า \"จนกว่าเธอจะอาบน้ำ\" นี่เป็นตัวบทชัดเจน และการปฏิเสธชัดในการห้ามหญิงมีประจำเดือนเฏาะวาฟ และไม่ถูกต้อง เพราะการห้ามโดยหลักเดิมบ่งถึงความเป็นโมฆะ", "อิบนุอับดิลบัรร์ว่า \"หญิงมีประจำเดือนไม่เฏาะวาฟรอบบ้าน นี่เป็นเรื่องที่เห็นพ้องกัน ฉันไม่รู้ว่ามีความขัดแย้ง\" อิบนุหัซม์ อิบนุรุชด์ อันนะวะวีย์ อิบนุตัยมียะฮ์ และคนอื่นก็ยกอิจญ์มาอ์", "แต่ถ้าหญิงมีประจำเดือนไม่สามารถอยู่ที่มักกะฮ์จนสะอาดแล้วเฏาะวาฟ เพราะกลัวต่อตัวเองหรือทรัพย์ หรือคณะเดินทางหรือมะห์รอมไม่ยอมอยู่ และนางมาจากเมืองไกลที่กลับมาอีกไม่ได้ อิบนุตัยมียะฮ์และอิบนุลก็อยยิมว่านางเฏาะวาฟได้ในกรณีนี้ โดยอิงหลักศาสนาที่ตัวบทจำนวนมากบ่งไว้ คือเงื่อนไขและวาญิบทั้งหมดที่เกี่ยวกับอิบาดะฮ์ผูกกับความสามารถของผู้มีภาระ ผู้ใดไม่สามารถทำเงื่อนไข รุกน หรือวาญิบ ก็ตกไปจากเขา ส่วนถ้านางอยู่ได้ หรืออยู่ในที่ใกล้ที่สามารถมากับมะห์รอมหลังสะอาดเพื่อเฏาะวาฟ ก็ให้ไปแล้วกลับมา", "อิบนุตัยมียะฮ์อธิบายยาวเพื่อสนับสนุนทัศนะนี้ และถือว่าอิจญ์มาอ์เรื่องห้ามหญิงมีประจำเดือนเฏาะวาฟ ใช้กับผู้ที่สามารถเฏาะวาฟพร้อมความสะอาดได้ ศิษย์ของเขาอิบนุลก็อยยิมก็ทำเช่นนั้น"]}], "tags_th": ["ประจำเดือน", "หัจญ์", "เฏาะวาฟ", "อาอิชะฮ์", "ความจำเป็น"]}, {"id": "v2-h149", "volume": 2, "bab": "hayd", "topic_ar": "موضع مباشرة الحائض", "topic_th": "ส่วนที่แนบกายกับหญิงมีประจำเดือนได้", "pages": [155, 156], "hadith": [{"no": 149, "matn_ar": "وَعَنْ مُعَاذٍ رَضِيَ اللهُ عَنْهُ أَنَّهُ سَأَلَ النَّبِيَّ ﷺ: مَا يَحِلُّ لِلرَّجُلِ مِنِ امْرَأَتِهِ، وَهِيَ حَائِضٌ؟ قَالَ: «مَا فَوْقَ الْإِزَارِ». رَوَاهُ أَبُو دَاوُدَ وَضَعَّفَهُ.", "translation_th": "และจากมุอาซ (ร.ฎ.) ว่าเขาถามท่านนบี ﷺ ว่า อะไรที่อนุญาตแก่ผู้ชายจากภรรยาของเขาขณะนางมีประจำเดือน ท่านตอบว่า \"ส่วนที่อยู่เหนือผ้านุ่ง\" รายงานโดยอบูดาวูด และเขาว่าอ่อน", "grade_th": "ฎออีฟ (อ่อน) สายขาด สะอ์ด อัลอัฆเฏาะช์อ่อน และบะกียะฮ์เป็นมุดัลลิสที่รายงานด้วยคำว่า \"จาก\""}], "key_rulings_th": ["ความหมายตามตัวบทคืออนุญาตให้หาความสุขกับหญิงมีประจำเดือนนอกช่วงระหว่างสะดือกับเข่า และความหมายแฝงคือใต้ผ้านุ่งไม่อนุญาต (หะนะฟีย์ มาลิกีย์ ชาฟิอีย์)", "ทัศนะที่สอง: อนุญาตใต้ผ้านุ่งด้วย หะรอมเฉพาะการสอดใส่ในอวัยวะเพศ (ฮัมบะลีย์ อิบนุหัซม์) ตามหะดีษ \"จงทำทุกอย่าง ยกเว้นการร่วมประเวณี\"", "ผู้แต่งเห็นว่าทัศนะที่สองมีน้ำหนักกว่า เพราะหลักฐานแข็งแรงกว่า หะดีษของบทอ่อน และหากถูกต้อง ก็เป็นความหมายแฝง ส่วนหะดีษ \"จงทำทุกอย่าง...\" เป็นตัวบท ซึ่งมาก่อน"], "vocab": [{"ar": "مَا فَوْقَ الْإِزَارِ", "th": "ส่วนที่อยู่เหนือผ้านุ่ง คือนอกช่วงระหว่างสะดือกับเข่า"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อบูดาวูดบันทึกในหมวดความสะอาด บทการแนบกายกับหญิงมีประจำเดือนและการกินร่วมกับนาง (ในต้นฉบับส่วนใหญ่ไม่มีชื่อบทนี้ และหะดีษอยู่ในบทอัลมัซยี ซึ่งเกี่ยวข้องเพราะการแนบกายกับหญิงมีประจำเดือนเป็นเหตุให้มัซยีออก) จากฮิชาม บินอับดิลมะลิก อัลยะซะนีย์ จากบะกียะฮ์ บินอัลวะลีด จากสะอ์ด อัลอัฆเฏาะช์ (อิบนุอับดิลลาฮ์) จากอับดุรเราะห์มาน บินอาอิซ อัลอัซดีย์ (ฮิชามว่าคืออิบนุกุรฏ์ เจ้าเมืองหิมศ์) จากมุอาซ บินญะบัล และตอนท้ายมีว่า \"และการงดเว้นจากนั้นประเสริฐกว่า\"", "สายนี้อ่อน อบูดาวูดกล่าวหลังหะดีษว่า \"มันไม่แข็งแรง\" เพราะ (1) สายขาด อับดุรเราะห์มาน บินอาอิซไม่ได้ยินจากมุอาซ อิบนุอบีหาติมว่า \"ฉันได้ยินบิดากล่าวว่า อับดุรเราะห์มาน บินอาอิซ อัลอัซดีย์ไม่ทันมุอาซ\" (2) สะอ์ด บินอับดิลลาฮ์ อัลอัฆเฏาะช์อ่อน อับดุลหักก์ อัลอิชบีลีย์ว่าอ่อน ตามที่อิบนุหะญัรยก และว่า \"อบูดาวูดบันทึกหะดีษเดียวของเขาเรื่องสิ่งที่อนุญาตจากหญิงมีประจำเดือนแก่สามี\" อิบนุหิบบานยกไว้ใน \"อัษษิกอต\" และอิบนุหะญัรใน \"อัตตักรีบ\" ว่า \"หะดีษอ่อน\" (3) ในสายมีบะกียะฮ์ บินอัลวะลีด ซึ่งเป็นมุดัลลิส และรายงานด้วยคำว่า \"จาก\""]}, {"wajh": 2, "type": "fiqh", "heading_ar": null, "heading_th": "ใต้ผ้านุ่งอนุญาตหรือไม่", "points_th": ["หะดีษเป็นหลักฐานว่าอนุญาตให้หาความสุขกับหญิงมีประจำเดือนในส่วนอื่นนอกจากระหว่างสะดือกับเข่า เพราะหมายถึงที่ของผ้านุ่ง คือระหว่างสะดือกับเข่า ความหมายแฝงของคำว่า \"ส่วนที่อยู่เหนือผ้านุ่ง\" คือใต้ผ้านุ่งไม่อนุญาตให้หาความสุข หะนะฟีย์ มาลิกีย์ และชาฟิอีย์ถือตาม โดยใช้หะดีษนี้และที่มีความหมายเดียวกัน", "ทัศนะที่สอง: อนุญาตใต้ผ้านุ่ง และไม่หะรอมนอกจากการสอดใส่ในอวัยวะเพศโดยเฉพาะ เป็นมัซฮับฮัมบะลีย์ อิบนุหัซม์ และบางคนจากมัซฮับอื่น ตามคำของท่านนบี ﷺ ที่กล่าวแล้ว \"จงทำทุกอย่าง ยกเว้นการร่วมประเวณี\"", "ผู้แต่งเห็นว่าทัศนะนี้มีน้ำหนักกว่า เพราะหลักฐานแข็งแรง ส่วนหะดีษของบทอ่อน จึงไม่ขัดกับหะดีษศ่อฮีห์ และหากสมมุติว่าถูกต้อง การใช้เป็นหลักฐานว่าใต้ผ้านุ่งหะรอมก็ผ่านความหมายแฝง ส่วนการใช้หลักฐานว่าไม่หะรอมนอกจากอวัยวะเพศเป็นตัวบท และตัวบทมาก่อนความหมายแฝง", "อิบนุเราะญับกล่าวว่า \"ส่วนหะดีษที่รายงานจากท่านนบี ﷺ ว่าท่านถูกถามว่าอะไรอนุญาตจากหญิงมีประจำเดือน แล้วตอบว่า เหนือผ้านุ่ง มีรายงานหลายทาง สายของมันไม่พ้นความอ่อน และผู้รายงานไม่ใช่ผู้เด่นในความจำ บางคนอาจรายงานตามความหมายที่เข้าใจจากการที่ท่านนบี ﷺ แนบกายกับหญิงมีประจำเดือนเหนือผ้านุ่ง\""]}], "tags_th": ["ประจำเดือน", "การแนบกาย", "หะดีษอ่อน", "มุอาซ บินญะบัล", "ตัวบทกับความหมายแฝง"]}, {"id": "v2-h150", "volume": 2, "bab": "hayd", "topic_ar": "مقدار ما تمكثه النفساء من غير صلاة ولا صوم", "topic_th": "ระยะเวลาที่หญิงหลังคลอด (นิฟาส) งดละหมาดและการถือศีลอด", "pages": [157, 163], "hadith": [{"no": 150, "matn_ar": "وَعَنْ أُمِّ سَلَمَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: كَانَتِ النُّفَسَاءُ تَقْعُدُ فِي عَهْدِ رَسُولِ اللهِ ﷺ بَعْدَ نِفَاسِهَا أَرْبَعِينَ. رَوَاهُ الْخَمْسَةُ إِلَّا النَّسَائِيَّ، وَاللَّفْظُ لِأَبِي دَاوُدَ. وَفِي لَفْظٍ لَهُ: «وَلَمْ يَأْمُرْهَا النَّبِيُّ ﷺ بِقَضَاءِ صَلَاةِ النِّفَاسِ»، وَصَحَّحَهُ الْحَاكِمُ.", "translation_th": "และจากอุมมุสะละมะฮ์ (ร.ฎ.) กล่าวว่า ในสมัยท่านรสูลุลลอฮ์ ﷺ หญิงหลังคลอดงด (ละหมาด) หลังการคลอดสี่สิบ (วัน) รายงานโดยนักบันทึกทั้งห้ายกเว้นอันนะสาอีย์ สำนวนเป็นของอบูดาวูด และในอีกสำนวนของเขาว่า \"และท่านนบี ﷺ ไม่ได้สั่งนางให้ชดใช้ละหมาดในช่วงนิฟาส\" และอัลหากิมว่าศ่อฮีห์", "grade_th": "ผู้แต่งสรุปว่าไม่พ้นความอ่อน เพราะมุสสะฮ์ อัลอัซดียะฮ์ไม่เป็นที่รู้จัก แต่มีหลักฐานสนับสนุน เช่น เมากูฟจากอิบนุอับบาส อัลหากิมว่าศ่อฮีห์ อันนะวะวีย์ว่าหะซัน"}], "key_rulings_th": ["ระยะนิฟาสมากที่สุดคือสี่สิบวัน (หะนะฟีย์ และที่รู้จักในมัซฮับฮัมบะลีย์) ผู้แต่งเห็นว่านี่มีน้ำหนักกว่า อินชาอัลลอฮ์ ตามหะดีษนี้และรายงานของอิบนุอับบาส", "นิฟาสไม่มีระยะน้อยที่สุด เมื่อเห็นความสะอาดก่อนสี่สิบวัน ก็อาบน้ำและละหมาด (นักวิชาการส่วนใหญ่) อัตติรมิซีย์ยกว่ามีอิจญ์มาอ์ของเศาะหาบะฮ์และตาบิอีน", "หุก่มนิฟาสใช้เมื่อคลอดสิ่งที่มีรูปร่างมนุษย์ชัดเจนแล้ว ระยะที่น้อยที่สุดคือแปดสิบเอ็ดวันนับจากตั้งครรภ์ และโดยทั่วไปเก้าสิบวัน", "ถ้าเลือดเกินสี่สิบวัน และตรงกับรอบประจำเดือน ก็เป็นประจำเดือน ถ้าต่อเนื่องก็เป็นเลือดเสีย บางคนว่าถ้าเกินเล็กน้อยตามรอบหรือมีสัญญาณใกล้หมด ก็ให้รอ", "หญิงหลังคลอดไม่ต้องชดใช้ละหมาดในช่วงนิฟาส"], "vocab": [{"ar": "النُّفَسَاءُ", "th": "หญิงหลังคลอด"}, {"ar": "النِّفَاسُ", "th": "การคลอด (มาจากการหายใจหรือการแตกออก) ทางฟิกฮ์คือเลือดที่มดลูกขับออกเพราะการคลอด"}, {"ar": "تَقْعُدُ", "th": "งดละหมาดและการถือศีลอด"}, {"ar": "مُخَلَّقَةٍ وَغَيْرِ مُخَلَّقَةٍ", "th": "ก้อนเนื้อที่มีรูปร่างแล้วและยังไม่มีรูปร่าง"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อบูดาวูดบันทึก (311) ในหมวดความสะอาด บทเวลาของหญิงหลังคลอด อัตติรมิซีย์ (139) อิบนุมาญะฮ์ (648) และอะห์มัด (44/186) ทั้งหมดผ่านอะลี บินอับดิลอะอ์ลา จากอบูสะฮ์ล จากมุสสะฮ์ อัลอัซดียะฮ์ จากอุมมุสะละมะฮ์ เป็นสำนวนของอบูดาวูดตามที่อิบนุหะญัรกล่าว แต่ในฉบับพิมพ์ของอบูดาวูดว่า \"สี่สิบวันหรือสี่สิบคืน\" ในบางฉบับของ \"อัลบุลูฆ\" ว่า \"สี่สิบ\" และบางฉบับว่า \"สี่สิบวัน\"", "อบูดาวูด (312) และอัลหากิมบันทึกผ่านยูนุส บินนาฟิอ์ จากกะษีร บินซิยาด (อบูสะฮ์ล) ว่ามุสสะฮ์ อัลอัซดียะฮ์เล่าว่า \"ฉันไปหัจญ์และเข้าไปหาอุมมุสะละมะฮ์ ฉันถามว่า โอ้มารดาผู้ศรัทธา สะมุเราะฮ์ บินญุนดุบสั่งผู้หญิงให้ชดใช้ละหมาดในช่วงประจำเดือน นางตอบว่า ไม่ต้องชดใช้ ผู้หญิงในภรรยาของท่านนบี ﷺ งดในนิฟาสสี่สิบคืน ท่านนบี ﷺ ไม่ได้สั่งนางให้ชดใช้ละหมาดในช่วงนิฟาส\"", "หะดีษนี้ขึ้นอยู่กับอบูสะฮ์ล กะษีร บินซิยาด จากมุสสะฮ์ อัลอัซดียะฮ์ จากอุมมุสะละมะฮ์ อบูสะฮ์ล อิบนุมะอีนว่า \"เชื่อถือได้\" ในรายงานของอิสหาก บินมันศูร และอบูหาติมว่า \"เชื่อถือได้ เป็นศิษย์อาวุโสของอัลหะสัน\" มีสองคนรายงานจากอบูสะฮ์ล คืออะลี บินอับดิลอะอ์ลา และยูนุส บินนาฟิอ์ อะลี บินอับดิลอะอ์ลา อัลบุคอรีย์ว่าเชื่อถือได้ อะห์มัดและอันนะสาอีย์ว่า \"ไม่มีปัญหา\" อิบนุหิบบานยกไว้ใน \"อัษษิกอต\" อัษษะฮะบีย์ว่า \"ศอดูก\" อบูหาติมว่า \"ไม่แข็งแรง\" อัดดารุกุฏนีย์ว่า \"ไม่แข็งแรง\" และการรับรองมาก่อน เพราะชัดเจน จึงมาก่อนการวิจารณ์ที่ไม่ชัดเจน ส่วนยูนุส บินนาฟิอ์ อิบนุอบีหาติมยกไว้โดยไม่กล่าวอะไร อิบนุหิบบานยกไว้ใน \"อัษษิกอต\" และว่า \"ผิดพลาด\"", "นักวิชาการขัดแย้งเรื่องหะดีษนี้ ผู้ที่ว่าอ่อนระบุข้อบกพร่อง สำคัญที่สุดสองข้อ (1) ความแปลกของเนื้อความในรายงานของยูนุส คือรายงานที่สอง อิบนุลก็อฏฏอนว่า \"ข่าวนี้สายอ่อน เนื้อความแปลก เพราะภรรยาของท่านนบี ﷺ ไม่มีใครมีนิฟาสในช่วงที่อยู่กับท่าน นอกจากเคาะดีญะฮ์ และการแต่งงานกับนางก่อนฮิจญ์เราะฮ์ จึงไม่มีความหมายที่นางกล่าวว่า ผู้หญิงในภรรยาของท่านนบี ﷺ งดในนิฟาสสี่สิบวัน\" อิบนุหะญัรก็ระบุว่าภรรยาของท่านนบี ﷺ ไม่มีใครคลอดหลังละหมาดถูกบัญญัติ เพราะเคาะดีญะฮ์ (ร.ฎ.) เสียชีวิตก่อนละหมาดถูกบัญญัติ ตอบได้ว่ารายงานของอะลี บินอับดิลอะอ์ลาที่ไม่มีสำนวนนี้มาก่อน เพราะเขาจำได้ดีกว่า และนักวิชาการว่าเชื่อถือได้ ต่างจากยูนุสที่ผิดพลาด หรือตอบว่าภรรยาของท่านหมายถึงคนอื่นนอกจากภรรยา เช่น ลูกสาว ญาติ และทาสหญิงมาริยะฮ์ ข้อบกพร่องนี้จึงไม่ร้ายแรง และไม่กระทบต่อตัวหะดีษ โดยเฉพาะหะดีษเป็นที่รู้จักจากรายงานของอะลี บินอับดิลอะอ์ลา ไม่ใช่ยูนุส บินนาฟิอ์", "(2) มุสสะฮ์ (ฎ็อมมะฮ์ที่มีม ชัดดะฮ์ที่สีน) ไม่เป็นที่รู้จัก อิบนุลก็อฏฏอนว่า \"ข้อบกพร่องของข่าวคือมุสสะฮ์ ซึ่งชื่อเรียกว่าอุมมุบุสสะฮ์ ไม่รู้จักทั้งสภาพและ       + '<header class="hero pad"><div class="hero-top"><span>มินหะตุลอัลลาม</span></div>'
      + '<div class="ar">منحة العلام في شرح بلوغ المرام</div>'
      + '<h1>สรุปมินหะตุลอัลลาม</h1><p>คำอธิบายบุลูฆุลมะรอม ฉบับสรุปภาษาไทย อ่านทีละหะดีษ</p>'
      + '<form class="searchbox" id="homeSearch" role="search">' + ICON.search
      + '<label for="hq" style="position:absolute;width:1px;height:1px;overflow:hidden">ค้นหา</label>'
      + '<input id="hq" type="search" placeholder="ค้นหา: คำไทย, อาหรับ หรือเลขหะดีษ"></form></header>'
      + '<div class="home-body pad">'
      + '<a class="card continue" href="#' + slug(le) + '"><div class="row-between"><b style="font-size:13px;color:var(--gold)">' + (last ? "อ่านต่อจากที่ค้างไว้" : "เริ่มอ่าน") + '</b><span class="muted" style="font-size:13px">หะดีษที่ ' + label(le) + '</span></div>'
      + '<div style="font-size:16px;font-weight:600;line-height:1.5">' + esc(b.th) + ' · ' + esc(le.topic_th) + '</div>'
      + '<div class="progress"><div style="width:' + pct + '%"></div></div>'
      + '<div class="muted" style="font-size:13px">' + KNAME[kitabOf(b)] + ' · หะดีษ ' + done + ' จาก ' + TOTAL + '</div></a>'
      + '<section style="display:flex;flex-direction:column;gap:12px"><div class="row-between"><h2 class="h2">สารบัญกิตาบ</h2><a href="#toc" style="font-size:14px;font-weight:600">ดูทั้งหมด</a></div><div class="kgrid">'
      + KITABS.map(function (k) {
          var ready = k.vol ? entries.length : 0;
          return '<a class="card kcard' + (k.vol ? '' : ' off') + '" href="' + (k.vol ? '#toc' : '#home') + '"' + (k.vol ? '' : ' aria-disabled="true" tabindex="-1"') + '><div class="ar">' + k.ar + '</div><div style="font-size:15px;font-weight:600">' + k.th + '</div><div class="muted" style="font-size:12px">' + (k.vol ? 'สรุปแล้ว ' + k.done + (k.total ? ' จาก ' + k.total : '') + ' หะดีษ' : 'เร็ว ๆ นี้') + '</div></a>';
        }).join("")
      + '</div></section>'
      + '<section style="display:flex;flex-direction:column;gap:12px"><h2 class="h2">หัวข้อยอดนิยม</h2><div class="chips">'
      + tagCounts().slice(0, 10).map(function (t) { return '<a class="chip" href="#search">' + esc(t) + '</a>'; }).join("")
      + '</div></section></div></div>';
    root.innerHTML = h;
    document.getElementById("homeSearch").addEventListener("submit", function (ev) { ev.preventDefault(); query = document.getElementById("hq").value; location.hash = "search"; });
    root.querySelectorAll(".chips .chip").forEach(function (a) { a.addEventListener("click", function () { query = a.textContent; filter = "tag"; }); });
  }

  function viewHadith(s) {
    var i = entries.findIndex(function (e) { return slug(e) === s; });
    if (i < 0) return viewHome();
    var e = entries[i], b = babById[e.bab], saved = store.get("saved", []), on = saved.indexOf(s) >= 0;
    store.set("last", s);
    var prev = entries[i - 1], next = entries[i + 1];
    var h = '<div class="view">'
      + '<div class="topbar"><a class="icon-btn" href="#toc" aria-label="กลับไปสารบัญ">' + ICON.back + '</a>'
      + '<div class="t"><small>' + KNAME[kitabOf(b)] + ' › ' + esc(b.th) + '</small><b>หะดีษที่ ' + label(e) + '</b></div>'
      + '<button class="icon-btn" id="bm" aria-pressed="' + on + '" aria-label="บุ๊กมาร์ก">' + (on ? ICON.markOn : ICON.mark) + '</button></div>'
      + '<div class="pad" style="padding-top:16px"><div class="seg" role="group" aria-label="โหมดการอ่าน">'
      + '<button id="mq" aria-pressed="' + (mode === "quick") + '">อ่านเร็ว</button><button id="md" aria-pressed="' + (mode !== "quick") + '">อ่านละเอียด</button></div></div>'
      + '<div class="hbody pad">'
      + '<div class="topic-title"><div class="ar">' + esc(e.topic_ar) + '</div><h1>' + esc(e.topic_th) + '</h1><span class="muted" style="font-size:13px">หน้า ' + e.pages[0] + '–' + e.pages[1] + ' ในเล่ม ' + volOf(e) + '</span></div>'
      + '<div class="hgrid"><div class="hcol hcol-a">'
      + e.hadith.map(function (hd) {
          return '<section class="card matn-card"><div class="hno"><span>หะดีษที่ ' + hd.no + '</span><span class="grade">' + esc(hd.grade_th) + '</span></div>'
            + '<p class="matn ar" lang="ar">' + esc(hd.matn_ar) + '</p><p class="tr">' + esc(hd.translation_th) + '</p></section>';
        }).join("")
      + '<section class="card sec"><h2>สรุปข้อตัดสิน</h2><ol>' + e.key_rulings_th.map(function (r) { return "<li>" + esc(r) + "</li>"; }).join("") + '</ol></section></div><div class="hcol hcol-b deep">'
      + ((e.vocab || []).length ? '<section class="sec deep" style="padding:0"><h2>คำศัพท์</h2><div class="vocab">' + e.vocab.map(function (v) { return '<div class="v"><div class="ar" lang="ar">' + esc(v.ar) + '</div><div>' + esc(v.th) + '</div></div>'; }).join("") + '</div></section>' : '')
      + '<section class="card sec deep"><h2>คำอธิบายของผู้แต่ง</h2>' + e.sections.map(function (sc) {
          return '<div class="wajh"><div class="wajh-head"><b>' + esc(sc.heading_th) + '</b><span class="ar" lang="ar">الوجه ' + sc.wajh + '</span></div><ul>' + sc.points_th.map(function (p) { return "<li>" + esc(p) + "</li>"; }).join("") + '</ul></div>';
        }).join("") + '</section></div></div>'
      + '<div class="chips">' + (e.tags_th || []).map(function (t) { return '<a class="chip" style="font-size:13px;padding:6px 12px" href="#search" data-tag="' + esc(t) + '">#' + esc(t) + '</a>'; }).join("") + '</div>'
      + '<div class="pager">'
      + (prev ? '<a class="prev" href="#' + slug(prev) + '"><small class="muted">ก่อนหน้า</small><span>‹ หะดีษที่ ' + label(prev) + '</span></a>' : '<a class="prev dis" aria-disabled="true"><small>ก่อนหน้า</small><span>—</span></a>')
      + (next ? '<a class="next" href="#' + slug(next) + '"><small>ถัดไป</small><span>หะดีษที่ ' + label(next) + ' ›</span></a>' : '<a class="prev dis" aria-disabled="true" style="text-align:right"><small>ถัดไป</small><span>ยังไม่มี</span></a>')
      + '</div></div></div>';
    root.innerHTML = h;
    var setMode = function (m) { mode = m; store.set("mode", m); document.body.classList.toggle("quick", m === "quick"); document.getElementById("mq").setAttribute("aria-pressed", m === "quick"); document.getElementById("md").setAttribute("aria-pressed", m !== "quick"); };
    document.getElementById("mq").onclick = function () { setMode("quick"); };
    document.getElementById("md").onclick = function () { setMode("deep"); };
    setMode(mode);
    document.getElementById("bm").onclick = function () {
      var sv = store.get("saved", []), k = sv.indexOf(s);
      if (k >= 0) sv.splice(k, 1); else sv.push(s);
      store.set("saved", sv); var now = k < 0;
      this.setAttribute("aria-pressed", now); this.innerHTML = now ? ICON.markOn : ICON.mark;
    };
    root.querySelectorAll("[data-tag]").forEach(function (a) { a.addEventListener("click", function () { query = a.getAttribute("data-tag"); filter = "tag"; }); });
  }

  var query = "", filter = "all";
  var FILTERS = [["all", "ทั้งหมด"], ["ar", "ตัวบทอาหรับ"], ["rul", "ข้อตัดสิน"], ["tag", "หัวข้อ"]];
  function hay(e, f) {
    var ar = e.topic_ar + " " + e.hadith.map(function (h) { return h.matn_ar; }).join(" ");
    var rul = e.key_rulings_th.join(" ");
    var tag = (e.tags_th || []).join(" ");
    if (f === "ar") return ar;
    if (f === "rul") return rul;
    if (f === "tag") return tag;
    return [ar, rul, tag, e.topic_th, e.hadith.map(function (h) { return h.translation_th; }).join(" "), e.sections.map(function (s) { return s.points_th.join(" "); }).join(" ")].join(" ");
  }
  var strip = function (s) { return s.replace(/[ً-ٰٟ]/g, ""); };
  function viewSearch() {
    root.innerHTML = '<div class="view"><form class="sbar" id="sf" role="search"><a class="icon-btn" href="#home" aria-label="กลับหน้าแรก">' + ICON.back + '</a>'
      + '<label class="searchbox">' + ICON.search + '<span style="position:absolute;width:1px;height:1px;overflow:hidden">ค้นหา</span><input id="sq" type="search" placeholder="คำไทย อาหรับ หรือเลขหะดีษ" value="' + esc(query) + '"></label></form>'
      + '<div class="pad" style="padding-block:16px;display:flex;flex-direction:column;gap:16px"><div class="filters" role="group" aria-label="ตัวกรอง">'
      + FILTERS.map(function (f) { return '<button type="button" data-f="' + f[0] + '" aria-pressed="' + (filter === f[0]) + '">' + f[1] + '</button>'; }).join("")
      + '</div><div id="count" class="muted" style="font-size:13px"></div><div id="results" style="display:flex;flex-direction:column;gap:12px"></div></div></div>';
    var input = document.getElementById("sq");
    function run() {
      query = input.value.trim();
      var q = strip(query.toLowerCase()), list;
      if (!q) list = entries;
      else if (/^\d+$/.test(q)) list = entries.filter(function (e) { return nos(e).indexOf(+q) >= 0; });
      else list = entries.filter(function (e) { return strip(hay(e, filter).toLowerCase()).indexOf(q) >= 0; });
      document.getElementById("count").textContent = q ? "พบ " + list.length + " หัวข้อ" : "ทุกหัวข้อที่สรุปแล้ว (" + list.length + ")";
      var hl = function (s) { if (!q || /^\d+$/.test(q)) return esc(s); var i = s.toLowerCase().indexOf(q); return i < 0 ? esc(s) : esc(s.slice(0, i)) + "<mark>" + esc(s.slice(i, i + q.length)) + "</mark>" + esc(s.slice(i + q.length)); };
      document.getElementById("results").innerHTML = list.length ? list.map(function (e) {
        var b = babById[e.bab];
        var line = e.key_rulings_th.find(function (r) { return q && r.toLowerCase().indexOf(q) >= 0; }) || e.topic_th;
        var ar = e.hadith[0].matn_ar.match(/«([^»]+)»/); ar = ar ? ar[1] : e.topic_ar;
        return '<a class="card result" href="#' + slug(e) + '"><div class="meta"><span>' + KSHORT[kitabOf(b)] + ' › ' + esc(b.th) + '</span><b>หะดีษที่ ' + label(e) + '</b></div>'
          + '<div class="ar" lang="ar">' + esc(ar) + '</div><div style="font-size:15px;line-height:1.6">' + hl(line) + '</div></a>';
      }).join("") : '<div class="empty">ไม่พบหะดีษที่ตรงกับ "' + esc(query) + '"<br>ลองคำอื่น หรือพิมพ์เลขหะดีษ</div>';
    }
    input.addEventListener("input", run);
    document.getElementById("sf").addEventListener("submit", function (ev) { ev.preventDefault(); input.blur(); });
    root.querySelectorAll("[data-f]").forEach(function (bt) { bt.onclick = function () { filter = bt.getAttribute("data-f"); root.querySelectorAll("[data-f]").forEach(function (x) { x.setAttribute("aria-pressed", x === bt); }); run(); }; });
    run();
  }

  function viewToc() {
    var have = {}; entries.forEach(function (e) { have[e.bab + ":" + e.pages[0]] = e; });
    var vols = []; babs.forEach(function (b) { var v = b.volume || 1; if (vols.indexOf(v) < 0) vols.push(v); });
    var lastHead = "";
    root.innerHTML = '<div class="view"><div class="topbar"><a class="icon-btn" href="#home" aria-label="กลับหน้าแรก">' + ICON.back + '</a><div class="t"><small>เล่ม ' + vols.join("–") + '</small><b>สารบัญ</b></div></div>'
      + '<div class="pad" style="padding-block:16px;display:flex;flex-direction:column;gap:12px">'
      + babs.map(function (b) {
          var n = b.topics.filter(function (t) { return have[b.id + ":" + t.page]; }).length;
          var head = "เล่ม " + (b.volume || 1) + " · " + KNAME[kitabOf(b)], hh = head === lastHead ? "" : '<h2 class="h2" style="margin-top:8px">' + head + '</h2>';
          lastHead = head;
          return hh + '<section class="card bab"><div class="bab-head"><div><div style="font-weight:700">' + esc(b.th) + '</div><div class="muted" style="font-size:12px">สรุปแล้ว ' + n + ' จาก ' + b.topics.length + ' หัวข้อ</div></div><div class="ar" lang="ar">' + esc(b.ar) + '</div></div>'
            + b.topics.map(function (t) { var e = have[b.id + ":" + t.page]; return e ? '<a class="topic-link" href="#' + slug(e) + '"><span>' + esc(e.topic_th) + '</span><b>หะดีษที่ ' + label(e) + '</b></a>' : '<span class="topic-link off"><span class="ar" lang="ar" style="text-align:left;direction:rtl">' + esc(t.ar) + '</span><b>รอสรุป</b></span>'; }).join("")
            + '</section>';
        }).join("") + '</div></div>';
  }

  function viewSaved() {
    var sv = store.get("saved", []), list = entries.filter(function (e) { return sv.indexOf(slug(e)) >= 0; });
    root.innerHTML = '<div class="view"><div class="topbar"><a class="icon-btn" href="#home" aria-label="กลับหน้าแรก">' + ICON.back + '</a><div class="t"><small>เก็บไว้ในเครื่องนี้</small><b>บุ๊กมาร์ก</b></div></div>'
      + '<div class="pad" style="padding-block:16px;display:flex;flex-direction:column;gap:12px">'
      + (list.length ? list.map(function (e) { return '<a class="card result" href="#' + slug(e) + '"><div class="meta"><span>' + esc(babById[e.bab].th) + '</span><b>หะดีษที่ ' + label(e) + '</b></div><div style="font-size:16px;font-weight:600">' + esc(e.topic_th) + '</div></a>'; }).join("")
        : '<div class="empty">ยังไม่มีบุ๊กมาร์ก<br>กดไอคอนบุ๊กมาร์กที่มุมขวาบนของหน้าหะดีษเพื่อเก็บไว้อ่านทีหลัง</div>')
      + '</div></div>';
  }

  function route() {
    var h = (location.hash || "#home").slice(1), tab = "home";
    document.body.classList.remove("quick");
    if (/^h\d+$/.test(h)) { viewHadith(h); tab = "toc"; }
    else if (h === "search") { viewSearch(); tab = "search"; }
    else if (h === "toc") { viewToc(); tab = "toc"; }
    else if (h === "saved") { viewSaved(); tab = "saved"; }
    else viewHome();
    document.querySelectorAll(".tabbar a").forEach(function (a) { if (a.getAttribute("data-tab") === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
