งบทได้กล่าวแล้วว่าเป็นเมากูฟและไม่ใช่หลักฐาน ส่วนหะดีษอัมมาร ให้ยึดรายงานของเศาะฮีห์ทั้งสอง ส่วนรายงานอื่นไม่ยึด เพราะสะละมะฮ์สงสัย มันศูร บินอัลมุอ์ตะมิรกล่าวกับเขาวันหนึ่งว่า \"ดูสิ่งที่ท่านพูด เพราะไม่มีใครกล่าวถึงแขนนอกจากท่าน\" (อบูดาวูด) และอันนะสาอีย์ระบุว่าสะละมะฮ์สงสัย ไม่รู้ว่าถึงข้อศอกหรือฝ่ามือ", "ส่วนการลูบถึงรักแร้ อาจเป็นสิ่งที่บัญญัติเช่นนั้นแล้วถูกยกเลิกเพื่อความสะดวกและความเมตตาแก่ประชาชาตินี้ หรือพวกเขาทำด้วยการวินิจฉัยและไม่ได้ถาม จึงผิดพลาด ผู้แต่งเห็นว่านี่ใกล้ความจริงกว่า เพราะคำว่า \"เราตะยัมมุม...\" เป็นการเล่าการกระทำของพวกเขา", "อายะฮ์ตะยัมมุมกล่าวถึงมือโดยไม่ระบุขอบเขต \"แล้วจงลูบหน้าและมือของพวกเจ้าจากมัน\" (อัลมาอิดะฮ์: 6) และมือเมื่อไม่ระบุหมายถึงฝ่ามือเท่านั้น หลักฐานคืออายะฮ์ \"และขโมยชายและขโมยหญิง จงตัดมือของทั้งสอง\" (อัลมาอิดะฮ์: 38) และมือของขโมยตัดที่ฝ่ามือตามอิจญ์มาอ์ ส่วนในวุฎูอ์มีการจำกัดไว้ \"และมือของพวกเจ้าถึงข้อศอก\" (อัลมาอิดะฮ์: 6) จะนำการจำกัดนี้มาใช้กับที่นี่ไม่ได้ เพราะเงื่อนไขคือหุก่มต้องเหมือนกัน แต่ที่นี่ไม่เหมือน หุก่มในอายะฮ์วุฎูอ์คือการล้าง และในอายะฮ์ตะยัมมุมคือการลูบ"]}], "tags_th": ["ตะยัมมุม", "วิธีตะยัมมุม", "เมากูฟ", "หะดีษอ่อน", "ข้อศอก"]}, {"id": "v2-h131-132", "volume": 2, "bab": "tayammum", "topic_ar": "التيمم رافع للحدث بمنزلة الوضوء", "topic_th": "ตะยัมมุมขจัดฮะดัษได้เหมือนวุฎูอ์", "pages": [88, 92], "hadith": [{"no": 131, "matn_ar": "وَعَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «الصَّعِيدُ وَضُوءُ الْمُسْلِمِ، وَإِنْ لَمْ يَجِدِ الْمَاءَ عَشْرَ سِنِينَ، فَإِذَا وَجَدَ الْمَاءَ فَلْيَتَّقِ اللهَ، وَلْيُمِسَّهُ بَشَرَتَهُ». رَوَاهُ الْبَزَّارُ، وَصَحَّحَهُ ابْنُ الْقَطَّانِ، وَلَكِنْ صَوَّبَ الدَّارَقُطْنِيُّ إِرْسَالَهُ.", "translation_th": "และจากอบูฮุร็อยเราะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"เศาะอีด (ผิวดิน) คือวุฎูอ์ของมุสลิม แม้เขาจะไม่พบน้ำสิบปี เมื่อเขาพบน้ำ ก็จงยำเกรงอัลลอฮ์ และให้น้ำถูกผิวกายของเขา\" รายงานโดยอัลบัซซาร อิบนุลก็อฏฏอนว่าศ่อฮีห์ แต่อัดดารุกุฏนีย์ว่าที่ถูกคือเป็นมุรสัล", "grade_th": "อิบนุลก็อฏฏอนว่าศ่อฮีห์ อัดดารุกุฏนีย์ว่าที่ถูกเป็นมุรสัลจากอิบนุสีรีน"}, {"no": 132, "matn_ar": "وَلِلتِّرْمِذِيِّ عَنْ أَبِي ذَرٍّ نَحْوُهُ، وَصَحَّحَهُ.", "translation_th": "และของอัตติรมิซีย์ จากอบูซัรร์ ทำนองเดียวกัน และเขาว่าศ่อฮีห์", "grade_th": "หะซัน (ผู้แต่ง: ไม่ต่ำกว่าระดับหะซันด้วยหลักฐานสนับสนุน) อัตติรมิซีย์ว่าหะซันศ่อฮีห์ อิบนุหิบบานและอัลหากิมว่าศ่อฮีห์"}], "key_rulings_th": ["ตะยัมมุมทำความสะอาดและขจัดฮะดัษได้ ไม่ใช่เพียงทำให้ละหมาดได้ เพราะท่านรสูล ﷺ เรียกว่าวุฎูอ์ (อบูหะนีฟะฮ์ รายงานหนึ่งจากอะห์มัด อิบนุตัยมียะฮ์ อิบนุลก็อยยิม อัศศ็อนอานีย์)", "นักวิชาการส่วนใหญ่ (มาลิก อัชชาฟิอีย์ ที่รู้จักในมัซฮับอะห์มัด) ว่าตะยัมมุมเพียงทำให้ละหมาดได้ ไม่ได้ขจัดฮะดัษ", "ผู้แต่งเห็นว่าทัศนะแรกชัดเจนกว่า คือตะยัมมุมขจัดฮะดัษชั่วคราว จนกว่าจะพบน้ำหรือใช้น้ำได้ เพราะสิ่งทดแทนมีหุก่มเหมือนสิ่งที่ถูกทดแทน ตามทัศนะนี้ ตะยัมมุมก่อนเวลาได้ และใช้ละหมาดหลายครั้งได้", "ผู้ที่ตะยัมมุมเพราะญะนาบะฮ์ แล้วสามารถใช้น้ำได้ ต้องอาบน้ำ ตามทัศนะของนักวิชาการทั้งหมด"], "vocab": [{"ar": "الصَّعِيدُ وَضُوءُ الْمُسْلِمِ", "th": "ผิวดินที่สะอาดคือวุฎูอ์ของมุสลิม (คือแทนน้ำในการทำความสะอาด)"}, {"ar": "وَلَوْ إِلَى عَشْرِ سِنِينَ", "th": "แม้สิบปี หมายถึงนานเท่าใดก็ได้ ไม่ใช่กำหนดตายตัว"}, {"ar": "وَلْيُمِسَّهُ بَشَرَتَهُ", "th": "ให้น้ำถูกผิวกาย คือใช้น้ำทำความสะอาด"}, {"ar": "ابْدُ فِيهَا", "th": "จงออกไปอยู่ในทะเลทรายกับฝูงแพะ"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["คืออบูซัรร์ ญุนดุบ บินญุนาดะฮ์ ตามที่รู้จักกันมากที่สุด รับอิสลามแต่แรก เป็นเศาะหาบะฮ์อาวุโส เรื่องการรับอิสลามของเขาอยู่ในเศาะฮีห์ทั้งสอง จากรายงานของอิบนุอับบาสในอัลบุคอรีย์ และอับดุลลอฮ์ บินอัศศอมิตในมุสลิม ซึ่งต่างกันอย่างเห็นได้ชัด เขาถูกทรมานและถูกทำร้ายมากในหนทางอิสลาม เป็นคนสมถะ ซื่อสัตย์ มีความรู้ ปฏิบัติตามความรู้ กล้าหาญ ยิงธนูแม่น ท่านนบี ﷺ กล่าวถึงเขาว่า \"แผ่นดินไม่เคยแบก และท้องฟ้าไม่เคยบังร่มให้ชายใดที่พูดจริงกว่าอบูซัรร์\" (อะห์มัด หะดีษหะซันด้วยหลายสายและหลักฐานสนับสนุน) เขาเสียชีวิตที่อัรเราะบะซะฮ์ (หมู่บ้านทางตะวันออกของมะดีนะฮ์ เอียงไปทางใต้ ห่าง 98 ไมล์) ปี ฮ.ศ. 32"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجهما", "heading_th": "ที่มาของหะดีษ", "points_th": ["หะดีษแรก: อัลบัซซารบันทึก (1/175 มุคตะศ็อร ซะวาอิดิฮี) จากมุก็อดดัม บินมุหัมมัด บินอะลี บินมุก็อดดัม อัลมุก็อดดะมีย์ จากลุงของเขา อัลกอสิม บินยะห์ยา บินอะฏออ์ บินมุก็อดดัม จากฮิชาม บินหัสสาน จากมุหัมมัด บินสีรีน จากอบูฮุร็อยเราะฮ์ และตอนท้ายมีว่า \"เพราะนั่นดีกว่า\" อัลบัซซารว่า \"เราไม่รู้ว่ามีรายงานจากอบูฮุร็อยเราะฮ์นอกจากทางนี้ และมุก็อดดัมเป็นที่รู้จัก เชื่อถือได้\" อัลฮัยษะมีย์ว่า \"ผู้รายงานเป็นผู้รายงานของเศาะฮีห์\" อิบนุลก็อฏฏอนว่าศ่อฮีห์ และอัดดารุกุฏนีย์ว่า \"ที่ถูกคือจากอิบนุสีรีนแบบมุรสัล\"", "หะดีษที่สอง คือหะดีษอบูซัรร์: อบูดาวูดบันทึกในหมวดความสะอาด บทผู้มีญะนาบะฮ์ตะยัมมุม (332) อัตติรมิซีย์ (124) อันนะสาอีย์ (1/171) และอะห์มัด (35/448) ผ่านอบูกิลาบะฮ์ จากอัมรฺ บินบุจดาน จากอบูซัรร์ว่า \"ฝูงแพะเล็ก ๆ มารวมกันที่ท่านรสูลุลลอฮ์ ﷺ ท่านกล่าวว่า โอ้อบูซัรร์ จงออกไปอยู่ทะเลทรายกับมัน ฉันจึงออกไปที่อัรเราะบะซะฮ์ และฉันมีญะนาบะฮ์ อยู่ห้าหกวัน แล้วฉันมาหาท่านนบี ﷺ ท่านกล่าวว่า อบูซัรร์ ฉันเงียบ ท่านกล่าวว่า แม่ของท่านจงสูญเสียท่าน อบูซัรร์ แม่ของท่านจงพบความวิบัติ แล้วท่านเรียกทาสหญิงผิวดำ นางนำถ้วยใหญ่ที่มีน้ำมา นางกั้นฉันด้วยผ้า และฉันก็บังด้วยอูฐแล้วอาบน้ำ เหมือนฉันได้วางภูเขาลงจากตัว แล้วท่านกล่าวว่า เศาะอีดที่สะอาดคือวุฎูอ์ของมุสลิม แม้สิบปี เมื่อท่านพบน้ำ ก็จงให้มันถูกผิวกายของท่าน เพราะนั่นดีกว่า\" นี่เป็นสำนวนของอบูดาวูด สำนวนของอัตติรมิซีย์ย่อ และอัตติรมิซีย์ว่า \"หะดีษหะซันศ่อฮีห์\"", "อัมรฺ บินบุจดาน อิบนุหิบบานและอัลอิจลีย์ว่าเชื่อถือได้ อัลบุคอรีย์และอิบนุอบีหาติมระบุชื่อเขาโดยไม่กล่าวถึงการวิจารณ์หรือการรับรอง ส่วนใหญ่ว่าเขาไม่เป็นที่รู้จักสภาพ อับดุลลอฮ์ บินอะห์มัดถามบิดาว่า \"อัมรฺ บินบุจดานเป็นที่รู้จักหรือไม่\" ตอบว่า \"ไม่\" อิบนุลก็อฏฏอนว่า \"ไม่เป็นที่รู้จัก\" อัษษะฮะบีย์ว่า \"สภาพไม่เป็นที่รู้จัก\" และอิบนุหะญัรใน \"อัตตักรีบ\" ว่า \"ไม่รู้จักสภาพ\"", "ผู้แต่งเห็นว่า อัตติรมิซีย์อาจว่าศ่อฮีห์โดยพิจารณาหลักฐานสนับสนุน เช่น หะดีษอบูฮุร็อยเราะฮ์ก่อนหน้า เพราะส่วนใหญ่ยืนยันว่าอัมรฺ บินบุจดานไม่เป็นที่รู้จัก อิบนุหิบบานและอัลหากิมก็ว่าศ่อฮีห์ และลักษณะการเขียนของอิบนุหะญัรบ่งว่าเขาว่าศ่อฮีห์ เพราะเขายกการตัดสินว่าศ่อฮีห์ของอัตติรมิซีย์และยอมรับ ใน \"ฟัตหุลบารีย์\" ก็เช่นกัน และเพิ่มอิบนุหิบบานกับอัดดารุกุฏนีย์ อัดดารุกุฏนีย์บันทึกหะดีษนี้และไม่ได้วิจารณ์ ผู้แต่งกล่าวว่า \"ที่ปรากฏ วัลลอฮุอะอ์ลัม คือหะดีษนี้ เมื่อพิจารณาสิ่งที่กล่าวมา ไม่ต่ำกว่าระดับหะซัน\""]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظهما", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"เศาะอีดคือวุฎูอ์ของมุสลิม\" เป็นประธานและภาคแสดง สำนวนของอบูดาวูดจากหะดีษอบูซัรร์คือ \"เศาะอีดที่ดี (ฏ็อยยิบ)\" คือที่สะอาดและทำให้สะอาด และเศาะอีดได้อธิบายแล้ว", "\"วะฎูอ์\" (ฟัตหะฮ์ที่วาว) เพราะดินเหมือนน้ำในแง่ใช้ทำความสะอาดได้ถูกต้อง บางทัศนะว่า \"วุฎูอ์\" (ฎ็อมมะฮ์ที่วาว) คือการใช้เศาะอีดตามวิธีเฉพาะเหมือนวุฎูอ์ของมุสลิม เป็นการเปรียบเทียบอย่างสมบูรณ์ ทั้งสองแบบบ่งว่าตะยัมมุมขจัดฮะดัษได้ ดังจะกล่าว", "\"แม้สิบปี\" หมายถึงจำนวนมาก ไม่ใช่การกำหนด ความหมายคือเขาตะยัมมุมครั้งแล้วครั้งเล่าได้ แม้ระยะเวลาที่ไม่มีน้ำจะถึงสิบปี \"ก็จงยำเกรงอัลลอฮ์\" เหมาะสมเพื่อแสดงความสำคัญของความสะอาด และเรื่องนี้ยิ่งใหญ่", "\"และให้มันถูกผิวกาย\" (ฎ็อมมะฮ์ที่ยาอ์ ในรูปปัจจุบัน อดีตคือ อะมัสสะ) ความหมายคือ เมื่อท่านพบน้ำที่พอสำหรับความสะอาด เกินจากความจำเป็น และท่านสามารถใช้ได้ ก็จงใช้ทำความสะอาด"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "ตะยัมมุมขจัดฮะดัษหรือไม่", "points_th": ["หะดีษเป็นหลักฐานว่าตะยัมมุมทำความสะอาดและขจัดฮะดัษ ไม่ใช่เพียงทำให้ทำสิ่งที่ต้องมีความสะอาดได้ เพราะท่านรสูล ﷺ เรียกว่าวุฎูอ์ ท่านกล่าวว่า \"ตะยัมมุมคือวุฎูอ์ของมุสลิม\" นี่เป็นมัซฮับอบูหะนีฟะฮ์ และรายงานหนึ่งจากอิมามอะห์มัด ซึ่งอิบนุตัยมียะฮ์ อิบนุลก็อยยิม อัศศ็อนอานีย์ และกลุ่มหนึ่งเลือก", "ทัศนะที่สอง: ตะยัมมุมทำให้ละหมาดและทำนองนั้นได้ ไม่ได้ขจัดฮะดัษ เป็นมัซฮับของนักวิชาการส่วนใหญ่ รวมทั้งมาลิก อัชชาฟิอีย์ และที่รู้จักในมัซฮับอิมามอะห์มัด พวกเขาใช้คำว่า \"เมื่อเขาพบน้ำ ก็จงยำเกรงอัลลอฮ์ และให้น้ำถูกผิวกาย\" ท่านสั่งให้เขาให้น้ำถูกผิวกายเมื่อพบน้ำ แสดงว่าตะยัมมุมไม่ได้ขจัดฮะดัษ แต่ทำให้เขาทำสิ่งที่บัญญัติความสะอาดไว้ได้ ถ้าขจัดฮะดัษแล้ว ก็ไม่ต้องใช้น้ำเมื่อพบ", "ผู้แต่งเห็นว่าทัศนะแรกชัดเจนกว่า คือตะยัมมุมขจัดฮะดัษชั่วคราว จนกว่าจะพบน้ำหรือสามารถใช้ได้ ที่สนับสนุนคือ (1) อายะฮ์หลังกล่าวถึงตะยัมมุม \"อัลลอฮ์ไม่ทรงประสงค์จะให้มีความลำบากแก่พวกเจ้า แต่ทรงประสงค์จะทำให้พวกเจ้าสะอาด\" (อัลมาอิดะฮ์: 6) อัลลอฮ์ทรงบอกว่าพระองค์ประสงค์จะทำให้เราสะอาดด้วยดิน เหมือนทำให้สะอาดด้วยน้ำ และท่านนบี ﷺ บรรยายตะยัมมุมว่าเป็นฏะฮูร (2) ตะยัมมุมเป็นสิ่งทดแทนความสะอาดด้วยน้ำ และหลักศาสนาคือ สิ่งทดแทนมีหุก่มเหมือนสิ่งที่ถูกทดแทน เมื่อความสะอาดด้วยน้ำขจัดฮะดัษ ตะยัมมุมก็ขจัดฮะดัษเช่นกัน", "อิบนุตัยมียะฮ์กล่าวว่า \"มีทัศนะว่า ตะยัมมุมแทนน้ำโดยทั่วไป ทำให้ทำสิ่งที่ทำได้ด้วยน้ำ ตะยัมมุมก่อนเวลาได้ เหมือนอาบน้ำละหมาดก่อนเวลา และยังคงอยู่หลังเวลา เหมือนความสะอาดด้วยน้ำ ถ้าตะยัมมุมสำหรับละหมาดสุนัต ก็ละหมาดฟัรฎูได้ เหมือนถ้าอาบน้ำละหมาดสำหรับละหมาดสุนัต นี่เป็นทัศนะของนักวิชาการจำนวนมาก เป็นมัซฮับอบูหะนีฟะฮ์ และอะห์มัดในรายงานที่สอง อะห์มัดกล่าวว่า นี่คือกิยาส... ทัศนะนี้ถูกต้อง และอัลกุรอาน ซุนนะฮ์ และการพิจารณาบ่งตามนั้น\" แล้วกล่าวว่า \"ตะยัมมุมขจัดฮะดัษ ทำให้ผู้ทำสะอาด แต่การขจัดชั่วคราวจนกว่าจะสามารถใช้น้ำ เพราะเป็นสิ่งทดแทนน้ำ จึงทำให้สะอาดตราบที่ไม่สามารถใช้น้ำ\" และกล่าวว่า \"อัลลอฮ์ทรงทำให้มันเป็นฏะฮูรสำหรับมุสลิมเมื่อไม่มีน้ำ ไม่อนุญาตให้ใครทำให้มุสลิมลำบากในสิ่งที่อัลลอฮ์ทรงทำให้กว้าง พระองค์ทรงประสงค์จะขจัดความลำบากจากประชาชาติ ไม่มีใครมีสิทธิ์ทำให้มีความลำบากในเรื่องนี้\""]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "ผู้ตะยัมมุมเพราะญะนาบะฮ์แล้วพบน้ำ", "points_th": ["หะดีษเป็นหลักฐานว่าผู้ที่ตะยัมมุมเพราะญะนาบะฮ์ แล้วสามารถใช้น้ำได้ ต้องอาบน้ำ เป็นทัศนะของนักวิชาการทั้งหมด"]}], "tags_th": ["ตะยัมมุม", "การขจัดฮะดัษ", "อบูซัรร์", "สิ่งทดแทน", "ญะนาบะฮ์"]}, {"id": "v2-h133", "volume": 2, "bab": "tayammum", "topic_ar": "حكم من تيمم وصلى ثم وجد الماء في الوقت", "topic_th": "ข้อตัดสินผู้ที่ตะยัมมุมและละหมาดแล้ว ต่อมาพบน้ำภายในเวลา", "pages": [93, 98], "hadith": [{"no": 133, "matn_ar": "وَعَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ رَضِيَ اللهُ عَنْهُ قَالَ: خَرَجَ رَجُلَانِ فِي سَفَرٍ، فَحَضَرَتِ الصَّلَاةُ وَلَيْسَ مَعَهُمَا مَاءٌ فَتَيَمَّمَا صَعِيدًا طَيِّبًا، فَصَلَّيَا، ثُمَّ وَجَدَا الْمَاءَ فِي الْوَقْتِ، فَأَعَادَ أَحَدُهُمَا الصَّلَاةَ وَالْوُضُوءَ، وَلَمْ يُعِدِ الْآخَرُ، ثُمَّ أَتَيَا رَسُولَ اللهِ ﷺ فَذَكَرَا ذَلِكَ لَهُ، فَقَالَ لِلَّذِي لَمْ يُعِدْ: «أَصَبْتَ السُّنَّةَ وَأَجْزَأَتْكَ صَلَاتُكَ»، وَقَالَ لِلْآخَرِ: «لَكَ الْأَجْرُ مَرَّتَيْنِ». رَوَاهُ أَبُو دَاوُدَ، وَالنَّسَائِيُّ.", "translation_th": "และจากอบูสะอีด อัลคุดรีย์ (ร.ฎ.) กล่าวว่า ชายสองคนออกเดินทาง แล้วเวลาละหมาดมาถึง ทั้งสองไม่มีน้ำ จึงตะยัมมุมด้วยเศาะอีดที่สะอาดแล้วละหมาด ต่อมาทั้งสองพบน้ำภายในเวลา คนหนึ่งอาบน้ำละหมาดและละหมาดใหม่ อีกคนไม่ทำใหม่ แล้วทั้งสองมาหาท่านรสูลุลลอฮ์ ﷺ และเล่าให้ท่านฟัง ท่านกล่าวแก่คนที่ไม่ได้ทำใหม่ว่า \"ท่านทำถูกตามซุนนะฮ์ และละหมาดของท่านใช้ได้\" และกล่าวแก่อีกคนว่า \"ท่านได้ผลบุญสองครั้ง\" รายงานโดยอบูดาวูดและอันนะสาอีย์", "grade_th": "ที่ถูกเป็นมุรสัลจากอะฏออ์ บินยะสาร (อบูดาวูด อัดดารุกุฏนีย์ อัฏเฏาะบะรอนีย์) รายงานต่อเนื่องของอิบนุสสะกันเป็นชาซ แต่มีเมากูฟจากอิบนุอุมัรสนับสนุน (สายศ่อฮีห์)"}], "key_rulings_th": ["ผู้ที่ตะยัมมุมและละหมาดแล้วพบน้ำภายในเวลา ไม่ต้องละหมาดใหม่ และไม่ควรทำใหม่ เพราะซุนนะฮ์คือไม่ทำใหม่ (นักวิชาการส่วนใหญ่ รวมทั้งสี่อิมาม ผู้แต่งเห็นว่ามีน้ำหนักกว่า)", "ผู้ที่พบน้ำแล้วทำใหม่เพราะไม่รู้ซุนนะฮ์และวินิจฉัยเอง ได้ผลบุญ แต่ถ้ารู้ซุนนะฮ์แล้วยังทำใหม่เพื่อหวังผลบุญสองครั้ง ถือว่าทำผิด เพราะจงใจขัดซุนนะฮ์", "ถ้าพบน้ำหลังละหมาดและหมดเวลาแล้ว ไม่ต้องทำใหม่ตามอิจญ์มาอ์", "ถ้าพบน้ำขณะกำลังละหมาด ผู้แต่งเห็นว่าทัศนะที่มีน้ำหนักและระมัดระวังกว่าคือ ตะยัมมุมเสียและละหมาดเสีย ต้องหยุดละหมาด อาบน้ำละหมาด แล้วเริ่มใหม่ (ที่รู้จักในมัซฮับฮัมบะลีย์ หะนะฟีย์ อิบนุหัซม์ เชคอิบนุบาซ)"], "vocab": [{"ar": "فَتَيَمَّمَا صَعِيدًا طَيِّبًا", "th": "มุ่งไปยังผิวดินที่สะอาดเพื่อลูบหน้าและมือ (ตะยัมมุมตามศาสนา)"}, {"ar": "أَصَبْتَ السُّنَّةَ", "th": "ท่านทำถูกตามหุก่มที่อัลกุรอานและซุนนะฮ์บัญญัติ"}, {"ar": "أَجْزَأَتْكَ صَلَاتُكَ", "th": "ละหมาดของท่านใช้ได้ ไม่ต้องชดใช้"}, {"ar": "لَكَ الْأَجْرُ مَرَّتَيْنِ", "th": "ได้ผลบุญสองครั้ง สำหรับละหมาดแรกด้วยตะยัมมุม และละหมาดที่สองด้วยวุฎูอ์"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อบูดาวูดบันทึก (338) ในหมวดความสะอาด บทผู้ตะยัมมุมพบน้ำหลังละหมาดภายในเวลา และอันนะสาอีย์ (1/213) ผ่านอับดุลลอฮ์ บินนาฟิอ์ จากอัลลัยษ์ บินสะอ์ด จากบักร์ บินสะวาดะฮ์ จากอะฏออ์ บินยะสาร จากอบูสะอีด อัลคุดรีย์ อับดุลลอฮ์ บินนาฟิอ์ คือ อิบนุอบีนาฟิอ์ อัศศออิฆ อัลมัคซูมีย์ ถูกวิจารณ์ อบูซุรอะฮ์และอันนะสาอีย์ว่า \"ไม่มีปัญหา\" อบูหาติมว่า \"ไม่ใช่นักจำ ความจำของเขาอ่อน และตำราของเขาถูกต้องกว่า\" อิบนุหะญัรว่า \"เชื่อถือได้ ตำราถูกต้อง ความจำอ่อน\"", "หะดีษนี้มีการวิจารณ์เรื่องมุรสัลหรือต่อเนื่อง และมีข้อบกพร่องเรื่องสายขาดระหว่างอัลลัยษ์กับบักร์ อบูดาวูดกล่าวว่า \"คนอื่นนอกจากอิบนุนาฟิอ์รายงานจากอัลลัยษ์ จากอุมัยเราะฮ์ บินอบีนาญิยะฮ์ จากบักร์ บินสะวาดะฮ์ จากอะฏออ์ บินยะสาร จากท่านนบี ﷺ\" และว่า \"การกล่าวถึงอบูสะอีด อัลคุดรีย์ในหะดีษนี้ไม่มะห์ฟูซ เป็นมุรสัล\" คือเป็นมุรสัลของอะฏออ์", "จุดประสงค์ของอบูดาวูดคือ คนอื่นนอกจากอิบนุนาฟิอ์ คือ อับดุลลอฮ์ บินอัลมุบาร็อก และยะห์ยา บินบุกัยร์ รายงานหะดีษนี้จากอัลลัยษ์ ด้วยสายถึงอะฏออ์ บินยะสารแบบมุรสัล โดยไม่กล่าวถึงอบูสะอีด แสดงว่าสานุศิษย์ของอัลลัยษ์ขัดแย้งกัน อับดุลลอฮ์ บินนาฟิอ์รายงานจากเขา จากบักร์แบบต่อเนื่อง แต่ขาดคนกลางระหว่างอัลลัยษ์กับบักร์ คืออุมัยเราะฮ์ บินอบีนาญิยะฮ์ อับดุลลอฮ์ บินอัลมุบาร็อกรายงานแบบมุรสัลโดยตัดอบูสะอีด ไม่ขาดตอน (อันนะสาอีย์ อัดดารุกุฏนีย์ แต่ไม่ได้กล่าวถึงคนกลาง) และยะห์ยา บินบุกัยร์ ซึ่งเป็นผู้แม่นยำที่สุดในหะดีษของอัลลัยษ์ รายงานแบบมุรสัลไม่ขาดตอน (อัลบัยฮะกีย์ อัลหากิม) วะกีอ์ก็รายงานตามทั้งสองในอิบนุอบีชัยบะฮ์ สรุปคืออับดุลลอฮ์ บินนาฟิอ์รายงานคนเดียวแบบต่อเนื่อง และอิบนุลมุบาร็อกกับยะห์ยา บินบุกัยร์รายงานต่างจากเขาเป็นมุรสัลของอะฏออ์", "แต่มีผู้แย้งคำของอบูดาวูด เพราะอิบนุสสะกันรายงานหะดีษนี้ในเศาะฮีห์ของเขา (ตามที่อิบนุลก็อฏฏอนกล่าว) ผ่านอบุลวะลีด อัฏเฏาะยาลิสีย์ จากอัลลัยษ์ จากอัมรฺ บินอัลหาริษ และอุมัยเราะฮ์ บินอบีนาญิยะฮ์ จากบักร์ บินสะวาดะฮ์ จากอะฏออ์ จากอบูสะอีด ซึ่งเชื่อมระหว่างอัลลัยษ์กับบักร์ด้วยอัมรฺ บินอัลหาริษซึ่งเชื่อถือได้ และต่อเนื่องถึงอบูสะอีด อัลอัลบานีย์ว่า \"สายศ่อฮีห์\" แต่ผู้แต่งตั้งข้อสังเกตว่านักวิชาการ เช่น อบูดาวูด ไม่ได้กล่าวถึงการรายงานสนับสนุนนี้ อัดดารุกุฏนีย์ว่า \"อับดุลลอฮ์ บินนาฟิอ์รายงานคนเดียวจากอัลลัยษ์ด้วยสายนี้แบบต่อเนื่อง อิบนุลมุบาร็อกและคนอื่นรายงานต่างไป\" อัฏเฏาะบะรอนีย์ก็กล่าวเช่นนั้น ดังนั้นรายงานของอิบนุสสะกันจึงเป็นชาซ เพราะขัดกับรายงานของผู้เชื่อถือได้จากอัลลัยษ์ และความผิดพลาดอาจมาจากอบุลวะลีดหรือคนต่ำกว่า"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ทั้งสองตะยัมมุมด้วยเศาะอีดที่ดี\" คือมุ่งไปยังเศาะอีดที่สะอาด เพื่อลูบหน้าและมือ หมายถึงตะยัมมุมตามความหมายทางศาสนา", "\"คนหนึ่งทำใหม่\" อาจเพราะเขาคิดว่าละหมาดแรกเสียเมื่อพบน้ำภายในเวลา หรือเพื่อความระมัดระวัง ส่วนอีกคนไม่ทำใหม่ เพราะเชื่อว่าละหมาดนั้นใช้ได้ เพราะเขาตะยัมมุมและละหมาดในขณะไม่มีน้ำ", "\"ท่านทำถูกตามซุนนะฮ์\" คือตรงกับหุก่มที่อัลกุรอานและซุนนะฮ์บัญญัติ เป็นการยืนยันว่าการวินิจฉัยของเขาถูก และของอีกคนผิด \"และละหมาดของท่านใช้ได้\" คือพอแก่ท่านโดยไม่ต้องชดใช้ เป็นการเชื่อมสิ่งที่ตามมากับสิ่งที่นำ เพราะการทำถูกตามซุนนะฮ์ย่อมทำให้ใช้ได้ \"ท่านได้ผลบุญสองครั้ง\" ครั้งหนึ่งสำหรับละหมาดแรกด้วยตะยัมมุม และอีกครั้งสำหรับละหมาดที่สองด้วยวุฎูอ์ เพราะทั้งสองถูกต้อง"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "ไม่ต้องละหมาดใหม่", "points_th": ["หะดีษเป็นหลักฐานว่าผู้ที่ตะยัมมุมและละหมาด แล้วพบน้ำระหว่างเวลา ไม่ต้องละหมาดใหม่ และไม่ควรทำใหม่ เพราะซุนนะฮ์คือไม่ทำใหม่ ตามคำแก่ผู้ที่พอกับละหมาดแรกว่า \"ท่านทำถูกตามซุนนะฮ์\" หะดีษนี้แม้จะถูกระบุว่ามีข้อบกพร่องเรื่องมุรสัล แต่ได้รับการสนับสนุนจากรายงานของนาฟิอ์ว่า อิบนุอุมัรตะยัมมุมและละหมาดอัศรีขณะที่ระหว่างเขากับมะดีนะฮ์ห่างหนึ่งหรือสองไมล์ แล้วเขาเข้ามะดีนะฮ์ขณะที่ดวงอาทิตย์ยังสูงอยู่ และไม่ได้ทำใหม่ (อับดุรร็อซซากผ่านอัษเษารีย์ สายศ่อฮีห์ และมีสายอื่น)"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "ผู้ที่ละหมาดใหม่", "points_th": ["หะดีษเป็นหลักฐานว่าผู้ที่ตะยัมมุมและละหมาด แล้วพบน้ำและละหมาดใหม่ ได้รับผลบุญ โดยมีเงื่อนไขว่าเขาเชื่อว่านี่คือสิ่งที่วาญิบแก่เขา เพราะไม่รู้ซุนนะฮ์ จึงวินิจฉัย และเขาผิดซุนนะฮ์ เพราะซุนนะฮ์คือไม่ทำใหม่", "แต่ถ้าเขาทำโดยรู้หุก่มศาสนาและรู้ว่าซุนนะฮ์คือไม่ทำใหม่ แต่ทำใหม่เพื่อหวังผลบุญสองครั้ง ก็ถือว่าทำผิด เพราะจงใจขัดซุนนะฮ์"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "สามกรณีของผู้ที่พบน้ำ", "points_th": ["ผู้ที่ตะยัมมุมเพราะไม่มีน้ำ แล้วพบน้ำ มีสามกรณี (1) พบหลังละหมาดและหลังหมดเวลา ไม่ต้องทำใหม่ตามอิจญ์มาอ์ (อิบนุลมุนซิรยก และอัลมุวัฟฟัก อิบนุกุดามะฮ์ยกจากเขา) (2) พบหลังละหมาดก่อนหมดเวลา ไม่ต้องทำใหม่ และไม่มีบัญญัติให้ทำใหม่ ตามทัศนะที่มีน้ำหนักกว่า เป็นมัซฮับของนักวิชาการส่วนใหญ่ รวมทั้งสี่อิมาม และอิบนุลมุนซิรเห็นว่ามีน้ำหนักกว่า ที่สนับสนุนคือเขาปฏิบัติฟัรฎูตามที่ถูกสั่งแล้ว ผู้ที่อ้างว่าเสียและวาญิบต้องทำใหม่ต้องมีหลักฐาน", "(3) พบน้ำขณะกำลังละหมาด เช่น ส่งคนไปหาน้ำแล้วเขานำมาขณะละหมาด มีสองทัศนะ ทัศนะแรก: ตะยัมมุมเสียและละหมาดเสีย ต้องอาบน้ำละหมาดและเริ่มใหม่ เป็นที่รู้จักในมัซฮับฮัมบะลีย์ มัซฮับหะนะฟีย์ อิบนุหัซม์เลือก อิบนุลมุนซิรยกจากอัษเษารีย์ และเป็นทัศนะของเชคอับดุลอะซีซ บินบาซ หลักฐานคือ (ก) ความกว้างของอายะฮ์ \"แล้วพวกเจ้าไม่พบน้ำ ก็จงตะยัมมุม\" (อัลมาอิดะฮ์: 6) ผู้นี้พบน้ำระหว่างละหมาด หุก่มตะยัมมุมจึงเสีย และเมื่อหุก่มตะยัมมุมเสีย ละหมาดก็เสีย เพราะฮะดัษกลับมา (ข) ความกว้างของหะดีษอบูฮุร็อยเราะฮ์ \"เมื่อเขาพบน้ำ ก็จงยำเกรงอัลลอฮ์ และให้น้ำถูกผิวกาย\" ผู้นี้พบน้ำก่อนละหมาดจบ จึงต้องให้น้ำถูกผิวกาย ซึ่งทำให้ตะยัมมุมเสีย", "ทัศนะที่สอง: ตะยัมมุมไม่เสีย และไม่ต้องละหมาดใหม่ เป็นทัศนะของนักวิชาการส่วนใหญ่ รวมทั้งมาลิกีย์ ชาฟิอีย์ และรายงานหนึ่งจากอิมามอะห์มัด แต่มีผู้กล่าวว่าเขาเปลี่ยนความเห็นแล้ว อิบนุลมุนซิรยกจากอบูเษาร์และเลือก หลักฐานคือผู้ตะยัมมุมนี้เข้าละหมาดในแบบที่ศาสนาอนุญาต เขาทำความสะอาดเสร็จแล้วเริ่มละหมาด และในละหมาดเขาไม่ได้ถูกสั่งให้ทำความสะอาด จึงไม่อนุญาตให้ทำให้ความสะอาดที่เวลาของมันผ่านไปแล้วเสีย และทำให้ละหมาดที่ทำตามที่ถูกกำหนดเสีย นอกจากด้วยหลักฐานจากอัลกุรอาน ซุนนะฮ์ หรืออิจญ์มาอ์ ซึ่งไม่มี", "ผู้แต่งเห็นว่าทัศนะแรกมีน้ำหนักกว่าและระมัดระวังกว่า คือไม่ละหมาดต่อ แต่หยุดละหมาดและอาบน้ำละหมาด เพราะหลักฐานแข็งแรง เพราะผู้นี้พบน้ำแล้ว อิบนุลก็อยยิมสนับสนุนโดยอิงหลักที่เขากล่าว คือ \"สิ่งทดแทนที่หุก่มเสียเมื่อมีสิ่งที่ถูกทดแทน จะไม่ใช้เป็นอิบาดะฮ์ได้อีกเลย การพบสิ่งที่ถูกทดแทนหลังเริ่มทำจึงเหมือนพบก่อนเริ่ม ส่วนสิ่งที่หุก่มไม่เสียทั้งหมด แต่ยังใช้ได้โดยรวม การพบสิ่งที่ถูกทดแทนหลังเริ่มทำก็ไม่ทำให้มันเสีย\""]}], "tags_th": ["ตะยัมมุม", "การละหมาดใหม่", "การพบน้ำ", "มุรสัล", "ซุนนะฮ์"]}, {"id": "v2-h134", "volume": 2, "bab": "tayammum", "topic_ar": "حكم المريض إذا كان يضره الماء", "topic_th": "ข้อตัดสินผู้ป่วยที่น้ำเป็นอันตรายต่อเขา", "pages": [99, 100], "hadith": [{"no": 134, "matn_ar": "وَعَنِ ابْنِ عَبَّاسٍ رَضِيَ اللهُ عَنْهُمَا فِي قَوْلِهِ تَعَالَى: ﴿وَإِنْ كُنْتُمْ مَرْضَى أَوْ عَلَى سَفَرٍ﴾ [المائدة: 6]، قَالَ: إِذَا كَانَتْ بِالرَّجُلِ الْجِرَاحَةُ فِي سَبِيلِ اللهِ، وَالْقُرُوحُ، فَيُجْنِبُ، فَيَخَافُ أَنْ يَمُوتَ إِنِ اغْتَسَلَ: تَيَمَّمَ. رَوَاهُ الدَّارَقُطْنِيُّ مَوْقُوفًا، وَرَفَعَهُ الْبَزَّارُ، وَصَحَّحَهُ ابْنُ خُزَيْمَةَ، وَالْحَاكِمُ.", "translation_th": "และจากอิบนุอับบาส (ร.ฎ.) เกี่ยวกับดำรัสของอัลลอฮ์ \"และหากพวกเจ้าป่วย หรืออยู่ในการเดินทาง\" (อัลมาอิดะฮ์: 6) เขากล่าวว่า \"เมื่อชายคนหนึ่งมีบาดแผลจากการต่อสู้ในหนทางของอัลลอฮ์ หรือมีแผลพุพอง แล้วเขามีญะนาบะฮ์ และกลัวว่าจะตายถ้าอาบน้ำ ก็ให้ตะยัมมุม\" อัดดารุกุฏนีย์รายงานแบบเมากูฟ อัลบัซซารรายงานแบบมัรฟูอ์ และอิบนุคุซัยมะฮ์กับอัลหากิมว่าศ่อฮีห์", "grade_th": "ที่ถูกคือเมากูฟจากอิบนุอับบาส (ร.ฎ.) การรายงานแบบมัรฟูอ์เป็นความผิดพลาดของญะรีร (อบูหาติมและอบูซุรอะฮ์เห็นเช่นนั้น)"}], "key_rulings_th": ["ผู้ป่วยทุกคนที่การใช้น้ำเป็นอันตราย ตะยัมมุมได้ แม้การใช้น้ำจะไม่ถึงขั้นทำให้ตาย", "รวมถึงกรณีกลัวว่าแผลจะเน่า หรือเพิ่มขึ้น หรือหายช้า หรือป่วยนานขึ้น ตามความกว้างของอายะฮ์ \"และหากพวกเจ้าป่วย...\"", "การกล่าวถึงบาดแผลจากการต่อสู้และแผลพุพองเป็นเพียงตัวอย่าง ไม่ได้จำกัดเฉพาะ และการกล่าวถึงญะนาบะฮ์ก็เป็นตัวอย่าง ฮะดัษเล็กก็มีหุก่มเดียวกัน", "การเดินทางในอายะฮ์กล่าวตามกรณีส่วนใหญ่ เพราะเป็นภาวะที่มักไม่มีน้ำ การเดินทางเองไม่ใช่เหตุที่ทำให้ตะยัมมุมได้ ถ้าผู้เดินทางพบน้ำและใช้ได้โดยไม่เป็นอันตราย ก็ตะยัมมุมไม่ได้"], "vocab": [{"ar": "الْجِرَاحَةُ", "th": "บาดแผล"}, {"ar": "الْقُرُوحُ", "th": "แผลพุพอง"}, {"ar": "الْجُدَرِيُّ", "th": "ฝีดาษ (มีในบางรายงาน)"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัดดารุกุฏนีย์บันทึก (1/177) แบบเมากูฟผ่านญะรีร จากอะฏออ์ บินอัสสาอิบ จากสะอีด บินญุบัยร์ จากอิบนุอับบาส (ร.ฎ.) เกี่ยวกับอายะฮ์ \"และหากพวกเจ้าป่วย หรืออยู่ในการเดินทาง\" เขากล่าวว่า \"เมื่อชายคนหนึ่งมีบาดแผลในหนทางของอัลลอฮ์ หรือแผลพุพอง หรือฝีดาษ แล้วมีญะนาบะฮ์ และกลัวว่าจะตายถ้าอาบน้ำ ก็ให้ตะยัมมุม\" นี่เป็นสำนวนของอัดดารุกุฏนีย์", "อัซเราะฮ์ บินอับดิรเราะห์มาน บินซุรอเราะฮ์ ก็รายงานแบบเมากูฟสนับสนุนอะฏออ์ บินอัสสาอิบ ในอัลบัยฮะกีย์ ผ่านชุอ์บะฮ์ จากอาศิม อัลอะห์วัล จากเกาะตาดะฮ์ จากอัซเราะฮ์ จากสะอีด บินญุบัยร์ จากอิบนุอับบาส (ร.ฎ.) ว่า \"ในผู้ที่เป็นฝีดาษและทำนองนั้น ถ้ามีญะนาบะฮ์ ก็ให้ตะยัมมุมด้วยเศาะอีด\" และอัซเราะฮ์เชื่อถือได้ ตามที่ระบุใน \"อัตตักรีบ\"", "อิบนุคุซัยมะฮ์ (1/138) อัลหากิม (1/270) และอัลบัยฮะกีย์บันทึกแบบมัรฟูอ์ ผ่านญะรีร จากอะฏออ์ บินอัสสาอิบ จากสะอีด บินญุบัยร์ จากอิบนุอับบาส ที่รายงานถึงท่านนบี ﷺ เกี่ยวกับอายะฮ์... อิบนุคุซัยมะฮ์ว่า \"ข่าวนี้ไม่มีใครรายงานแบบมัรฟูอ์นอกจากอะฏออ์ บินอัสสาอิบ\" ผู้ที่รายงานจากอะฏออ์คือญะรีร บินอับดิลหะมีด และอิบนุอะดีย์กับอิบนุมะอีนระบุว่าเขาได้ยินจากอะฏออ์หลังความจำของอะฏออ์สับสน ผู้แต่งจึงเห็นว่าการรายงานแบบมัรฟูอ์เป็นความผิดพลาดของเขา และที่ถูกคือเมากูฟ อบูหาติมและอบูซุรอะฮ์ก็เห็นว่าเมากูฟมีน้ำหนักกว่า"]}, {"wajh": 2, "type": "fiqh", "heading_ar": null, "heading_th": "ผู้ป่วยที่น้ำเป็นอันตราย", "points_th": ["การที่อิบนุอับบาส (ร.ฎ.) อธิบายการป่วยด้วยบาดแผลในหนทางของอัลลอฮ์และแผลพุพอง ไม่ได้เป็นการจำกัด แต่เป็นตัวอย่าง มิฉะนั้นผู้ป่วยทุกคนที่การใช้น้ำเป็นอันตรายก็ตะยัมมุมได้ แม้การใช้น้ำจะไม่ถึงขั้นทำให้ตาย ถ้ากลัวว่าแผลจะเน่า หรือเพิ่มขึ้น หรือหายช้า หรือป่วยนานขึ้น และทำนองนั้น ก็ตะยัมมุม ตามความกว้างของอายะฮ์ \"และหากพวกเจ้าป่วย...\" (อัลมาอิดะฮ์: 6)"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "ไม่เฉพาะญะนาบะฮ์", "points_th": ["การมีญะนาบะฮ์ของผู้มีบาดแผล ตามความหมายตามตัวบทของหะดีษ ไม่ใช่เงื่อนไขของตะยัมมุม ถ้าเขามีฮะดัษเล็ก หุก่มก็เหมือนกัน การกล่าวถึงญะนาบะฮ์ในหะดีษเป็นเพียงตัวอย่าง"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "การเดินทางไม่ใช่เหตุของตะยัมมุม", "points_th": ["การกล่าวถึงการเดินทางในอายะฮ์อิงกรณีส่วนใหญ่ เพราะการเดินทางเป็นภาวะที่คาดว่าจะไม่มีน้ำ ถ้าผู้เดินทางไม่มีน้ำ หรือพบน้ำที่จำเป็นต้องใช้ดื่ม ทำอาหาร หรือทำนองนั้น ก็ตะยัมมุมได้ แต่การเดินทางเองไม่ใช่เหตุที่ทำให้ตะยัมมุมได้ ถ้าผู้เดินทางพบน้ำและการใช้ไม่เป็นอันตราย ก็ตะยัมมุมไม่ได้"]}], "tags_th": ["ตะยัมมุม", "ผู้ป่วย", "บาดแผล", "การเดินทาง", "เมากูฟ"]}, {"id": "v2-h135-136", "volume": 2, "bab": "tayammum", "topic_ar": "حكم المسح على الجبيرة", "topic_th": "ข้อตัดสินการเช็ดบนเฝือก (ญะบีเราะฮ์)", "pages": [101, 107], "hadith": [{"no": 135, "matn_ar": "وَعَنْ عَلِيٍّ رَضِيَ اللهُ عَنْهُ قَالَ: انْكَسَرَتْ إِحْدَى زَنْدَيَّ فَسَأَلْتُ رَسُولَ اللهِ ﷺ، فَأَمَرَنِي أَنْ أَمْسَحَ عَلَى الْجَبَائِرِ. رَوَاهُ ابْنُ مَاجَهْ بِسَنَدٍ وَاهٍ جِدًّا.", "translation_th": "และจากอะลี (ร.ฎ.) กล่าวว่า กระดูกแขนท่อนล่างข้างหนึ่งของฉันหัก ฉันจึงถามท่านรสูลุลลอฮ์ ﷺ ท่านสั่งให้ฉันเช็ดบนเฝือก รายงานโดยอิบนุมาญะฮ์ ด้วยสายรายงานที่อ่อนมาก", "grade_th": "อ่อนมาก (เมาฎูอ์ตามบางคน) เพราะอัมรฺ บินคอลิด อัลวาสิฏีย์ถูกกล่าวหาว่าแต่งหะดีษ อบูหาติมว่าเป็นโมฆะ ไม่มีที่มา"}, {"no": 136, "matn_ar": "وَعَنْ جَابِرِ بْنِ عَبْدِ اللهِ رَضِيَ اللهُ عَنْهُمَا فِي الرَّجُلِ الَّذِي شُجَّ، فَاغْتَسَلَ فَمَاتَ: «إِنَّمَا كَانَ يَكْفِيهِ أَنْ يَتَيَمَّمَ، وَيَعْصِبَ عَلَى جُرْحِهِ خِرْقَةً، ثُمَّ يَمْسَحَ عَلَيْهَا وَيَغْسِلَ سَائِرَ جَسَدِهِ». رَوَاهُ أَبُو دَاوُدَ بِسَنَدٍ فِيهِ ضَعْفٌ، وَفِيهِ اخْتِلَافٌ عَلَى رُوَاتِهِ.", "translation_th": "และจากญาบิร บินอับดิลลาฮ์ (ร.ฎ.) เกี่ยวกับชายที่ศีรษะแตก แล้วเขาอาบน้ำและเสียชีวิต ว่า \"เพียงพอแก่เขาที่จะตะยัมมุม และพันผ้าบนแผล แล้วเช็ดบนผ้านั้น และล้างร่างกายที่เหลือ\" รายงานโดยอบูดาวูด ด้วยสายรายงานที่มีความอ่อน และมีความขัดแย้งในหมู่ผู้รายงาน", "grade_th": "ฎออีฟ (อ่อน) ส่วนเพิ่มเรื่องเช็ดบนเฝือกเป็นมุนกัร (อัลอัลบานีย์) ต้นเรื่องของหะดีษมะห์ฟูซโดยไม่มีส่วนเพิ่มนี้"}], "key_rulings_th": ["ไม่มีหลักฐานเรื่องการเช็ดบนเฝือกที่ปลอดจากการวิจารณ์ นักวิชาการจึงขัดแย้ง บางคนว่าหะดีษสองบทนี้เสริมกัน (อัศศ็อนอานีย์ อัชเชากานีย์ เชคอิบนุบาซ) บางคนว่าอ่อนจนใช้ไม่ได้", "ผู้แต่งเห็นว่าที่ชัดเจนกว่าและใกล้หลักการกว่า แม้ไม่พิจารณาหะดีษในบท คือเช็ดบนเฝือกและสิ่งที่คล้ายกัน (นักวิชาการส่วนใหญ่ ฮัมบะลีย์ ชาฟิอีย์ มาลิกีย์ หะนะฟีย์ อิบนุลมุนซิร อิบนุตัยมียะฮ์)", "หลักฐานคือการเทียบกับการเช็ดบนรองเท้าหุ้มข้อ (ซึ่งเป็นความจำเป็นยิ่งกว่า และไม่มีกำหนดเวลา) การเช็ดด้วยน้ำบนที่ที่ต้องล้างประเสริฐกว่าตะยัมมุมนอกที่นั้น และอิบนุอุมัรเช็ดบนผ้าพันแผล", "ผู้แต่งเห็นว่าทัศนะที่มีน้ำหนักคือเช็ดอย่างเดียวพอ ไม่ต้องตะยัมมุมด้วย (อิบนุตัยมียะฮ์) เพราะการบังคับให้ทำความสะอาดสองแบบสำหรับอวัยวะเดียวขัดกับหลักศาสนา", "อวัยวะที่มีแผล: ถ้าปิดอยู่ให้เช็ด ถ้าเปิดอยู่: ล้างได้ถ้าไม่เป็นอันตราย ถ้าล้างไม่ได้แต่เช็ดได้ก็เช็ด ถ้าทั้งล้างและเช็ดเป็นอันตราย ก็ตะยัมมุม"], "vocab": [{"ar": "زَنْدَيَّ", "th": "กระดูกแขนท่อนล่างทั้งสองข้าง (ท่อนที่ต่อกับฝ่ามือ)"}, {"ar": "الْجَبَائِرُ", "th": "พหูพจน์ของ ญะบีเราะฮ์ คือสิ่งที่ใช้ดามกระดูกหัก เช่น ไม้หรือผ้า รวมถึงเฝือกปูนและพลาสเตอร์ปิดแผลในปัจจุบัน"}, {"ar": "وَاهٍ", "th": "อ่อนถึงที่สุด ใช้ไม่ได้แม้เป็นหลักฐานสนับสนุน"}, {"ar": "شُجَّ", "th": "ถูกตีจนหนังแตก (ชัจญะฮ์ คือแผลที่ใบหน้าหรือศีรษะ)"}, {"ar": "الْعِيُّ", "th": "ความไม่รู้ (อัลอิยย์) ยาของมันคือการถาม"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجهما", "heading_th": "ที่มาของหะดีษ", "points_th": ["หะดีษอะลี: อิบนุมาญะฮ์บันทึก (657) ผ่านอิสรออีล บินยูนุส จากอัมรฺ บินคอลิด จากซัยด์ บินอะลี จากบิดา จากปู่ คืออะลี บินอบีฏอลิบ สายนี้อ่อนมากตามที่อิบนุหะญัรกล่าว เพราะมีอัมรฺ บินคอลิด อัลกุรชีย์ อัลวาสิฏีย์ อัลบัยฮะกีย์ว่า \"อัมรฺ บินคอลิด อัลวาสิฏีย์เป็นที่รู้จักว่าแต่งหะดีษ อะห์มัดและยะห์ยา บินมะอีนและอิมามหะดีษคนอื่นว่าเขาโกหก วะกีอ์ บินอัลญัรรอห์ว่าเขาแต่งหะดีษ เขาอยู่ใกล้เรา เมื่อถูกจับได้ก็ย้ายไปวาสิฏ อุมัร บินมูซา บินวะญีฮ์ก็รายงานสนับสนุนจากซัยด์ บินอะลีทำนองเดียวกัน แต่อุมัร บินมูซาก็มัตรูก ถูกกล่าวหาว่าแต่งหะดีษ ขออัลลอฮ์คุ้มครองจากความเสื่อม\" อัลบุคอรีย์ว่า \"มุนกัรอัลหะดีษ\" อัลหากิมว่า \"รายงานหะดีษที่แต่งขึ้นจากซัยด์ บินอะลี\" อบูหาติมว่า \"หะดีษนี้เป็นโมฆะ ไม่มีที่มา และอัมรฺ บินคอลิดมัตรูกอัลหะดีษ\" อิบนุหัซม์ว่า \"เป็นข่าวที่ไม่อนุญาตให้รายงาน นอกจากเพื่อชี้ว่ามันตก\"", "หะดีษญาบิร: อบูดาวูดบันทึกในหมวดความสะอาด บทผู้มีบาดแผลตะยัมมุม (336) จากมูซา บินอับดิรเราะห์มาน อัลอันฏอกีย์ จากมุหัมมัด บินสะละมะฮ์ จากอัซซุบัยร์ บินคุร็อยก์ จากอะฏออ์ บินอบีเราะบาห์ จากญาบิร ว่า \"เราออกเดินทาง ชายคนหนึ่งในหมู่เราถูกหินกระแทกศีรษะแตก แล้วเขาฝันเปียก เขาถามสหายว่า พวกท่านเห็นว่าฉันได้รับการผ่อนปรนให้ตะยัมมุมไหม พวกเขาตอบว่า เราไม่เห็นว่าท่านได้รับการผ่อนปรน เพราะท่านใช้น้ำได้ เขาจึงอาบน้ำแล้วเสียชีวิต เมื่อเรามาถึงท่านนบี ﷺ มีคนบอกท่าน ท่านกล่าวว่า พวกเขาฆ่าเขา ขออัลลอฮ์ฆ่าพวกเขา ทำไมไม่ถามเมื่อไม่รู้ เพราะยาของความไม่รู้คือการถาม เพียงพอแก่เขาที่จะตะยัมมุม และบีบ หรือพัน (มูซาสงสัย) ผ้าบนแผล แล้วเช็ดบนผ้า และล้างร่างกายที่เหลือ\" อิบนุหะญัรย่อไว้ และดูเหมือนเป็นเมากูฟจากญาบิร แต่จริงเป็นมัรฟูอ์ ผู้แต่งอาจไม่กล่าวว่าเป็นมัรฟูอ์เพื่อย่อ", "ผู้รายงานเชื่อถือได้ ยกเว้นอัซซุบัยร์ บินคุร็อยก์ ซึ่งอ่อนในหะดีษ และรายงานคนเดียว อบูบักร์ บินอบีดาวูดว่า \"ไม่มีผู้รายงานจากอะฏออ์ จากญาบิร นอกจากอัซซุบัยร์ บินคุร็อยก์ และเขาไม่แข็งแรง\" และมีความขัดแย้งในสาย อัลเอาซาอีย์รายงานจากอะฏออ์ จากอิบนุอับบาส (อบูดาวูด 337 อิบนุมาญะฮ์ อะห์มัด อิบนุคุซัยมะฮ์) สำนวนว่า \"ชายคนหนึ่งมีญะนาบะฮ์ในฤดูหนาว เขาถาม แล้วถูกสั่งให้อาบน้ำ เขาอาบแล้วเสียชีวิต มีคนบอกท่านนบี ﷺ ท่านกล่าวว่า ทำไมพวกเขาฆ่าเขา ขออัลลอฮ์ฆ่าพวกเขา (สามครั้ง) อัลลอฮ์ทรงทำให้เศาะอีด หรือตะยัมมุม เป็นฏะฮูรแล้ว\" (อิบนุอับบาสสงสัย แล้วยืนยันภายหลัง)", "รายงานของอัลเอาซาอีย์มีน้ำหนักกว่ารายงานของอัซซุบัยร์ด้วยสองเหตุผล (1) อัลเอาซาอีย์เชื่อถือได้มากกว่าอัซซุบัยร์หลายขั้น (2) อัซซุบัยร์เพิ่มเรื่องการเช็ดบนเฝือกในหะดีษ และรายงานคนเดียว จึงเป็นส่วนเพิ่มที่อ่อนและมุนกัร ตามที่อัลอัลบานีย์กล่าว และต้นเรื่องของหะดีษมะห์ฟูซด้วยหลายสายและหลักฐานสนับสนุน แต่ไม่มีส่วนเพิ่มนี้ ดังในสำนวนของอิบนุอับบาสข้างต้น แต่ก็มีความขัดแย้งจากอัลเอาซาอีย์ บางคนรายงานว่าจากอะฏออ์ บางคนว่า \"ฉันได้ข่าวจากอะฏออ์\" อัดดารุกุฏนีย์ว่า \"อัลเอาซาอีย์รายงานตอนท้ายแบบมุรสัล จากอะฏออ์ จากท่านนบี ﷺ ซึ่งถูกต้อง\"", "ในอิบนุมาญะฮ์และอัลหากิมกับอัดดารุกุฏนีย์ก็มาเช่นนั้น แต่ความหมายตามตัวบทคือสายขาด ตามที่อัลบูศีรีย์กล่าว เพราะอัลเอาซาอีย์ระบุชัดว่าไม่ได้ยินจากอะฏออ์ และระหว่างทั้งสองคืออิบนุอบีอัลอิชรีน อิบนุอบีหาติมว่า \"ฉันถามบิดาและอบูซุรอะฮ์ ทั้งสองตอบว่า อิบนุอบีอัลอิชรีนรายงานจากอัลเอาซาอีย์ จากอิสมาอีล บินมุสลิม จากอะฏออ์ จากอิบนุอับบาส\" แต่อิบนุมาญะฮ์รายงานผ่านอิบนุอบีอัลอิชรีนโดยไม่กล่าวถึงอิสมาอีล ซึ่งคืออิบนุมุสลิม อัลมักกีย์ ถ้าการกล่าวถึงเขาถูกต้อง สายก็อ่อน เพราะอิสมาอีลนี้ อิบนุมะอีนว่า \"ไม่มีน้ำหนักอะไร\" อันนะสาอีย์ว่า \"มัตรูกอัลหะดีษ\" และอิบนุอบีอัลอิชรีนคืออับดุลหะมีด บินหะบีบ อัดดิมัชกีย์ ศอดูกแต่บางครั้งผิด อบูหาติมว่า \"เป็นเลขานุการ ไม่ใช่นักหะดีษ\" และเขาขัดกับผู้ที่เชื่อถือได้มากกว่า ตามที่อิบนุอับดิลบัรร์ระบุ ผู้เขียน \"อัลมันฮัลอัลอัซบ์อัลเมารูด\" ว่า \"อาจเป็นไปได้ว่าอัลเอาซาอีย์รายงานหะดีษจากอะฏออ์ทั้งผ่านคนกลางและไม่ผ่าน\"", "อัลหากิมรายงานใน \"อัลมุสตัดร็อก\" และอัลบัยฮะกีย์ใน \"อัลคิลาฟิยาต\" ผ่านบิชร์ บินบักร์ ว่า \"อัลเอาซาอีย์เล่าว่า อะฏออ์ บินอบีเราะบาห์เล่าว่าเขาได้ยินอับดุลลอฮ์ บินอับบาส...\" สายนี้ศ่อฮีห์ถ้าบิชร์จำได้ดี แต่อัลหากิมกล่าวต่อว่า \"อัลฮิกล์ บินซิยาดรายงาน ซึ่งเป็นศิษย์ที่แม่นยำที่สุดของอัลเอาซาอีย์ และไม่ได้กล่าวว่าอัลเอาซาอีย์ได้ยินจากอะฏออ์\" อัลหากิมจึงชี้ว่าบิชร์ขัดกับคนอื่น จึงมีข้อบกพร่อง สะละมะฮ์ บินกอสิมว่าบิชร์ \"รายงานจากอัลเอาซาอีย์บางเรื่องที่เขารายงานคนเดียว\" และอิบนุหะญัรใน \"อัตตักรีบ\" ว่า \"เชื่อถือได้ แต่มีเรื่องแปลก\" ตามนี้สายนี้ไม่ถูกต้อง เพราะขัดกับผู้ที่มากกว่าและดีกว่า", "สรุป: หะดีษของบทอ่อน ใช้เป็นหลักฐานไม่ได้ อัลบัยฮะกีย์ว่า \"ไม่มีสิ่งใดยืนยันจากท่านนบี ﷺ ในบทนี้ ที่ถูกต้องที่สุดคือหะดีษอะฏออ์ บินอบีเราะบาห์ที่กล่าวแล้ว ซึ่งไม่แข็งแรง แต่เป็นทัศนะของนักฟิกฮ์รุ่นตาบิอีนและหลังจากนั้น พร้อมกับที่เรารายงานจากอิบนุอุมัรเรื่องการเช็ดบนผ้าพันแผล\" (เรื่องอิบนุอุมัรจะกล่าวในเรื่องข้อบัญญัติ)"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظهما", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"อิห์ดา ซันดัยยะ\" (ฟัตหะฮ์ที่ซาย สุกูนที่นูน แล้วดาลฟัตหะฮ์ ท้ายด้วยยาอ์ชัดดะฮ์) ทวิพจน์ของ \"ซันด์\" คือส่วนของแขนที่ไม่มีเนื้อ อัลเญาฮะรีย์ว่า \"ซันด์คือที่ต่อปลายแขนกับฝ่ามือ มีสองซันด์ คืออัลกูอ์และอัลกุรสูอ์\" อัลกูอ์คือปลายซันด์ที่ติดนิ้วโป้ง อัลกุรสูอ์คือปลายซันด์ที่ติดนิ้วก้อย คือส่วนที่นูนที่ข้อมือ", "\"อัลญะบาอิร\" พหูพจน์ของ \"ญะบีเราะฮ์\" คือสิ่งที่ใช้ดามกระดูกที่หัก เช่น ไม้ที่มัดไว้หรือผ้าพัน รวมถึงอุปกรณ์การแพทย์ เช่น เฝือกปูนบนกระดูกหัก และแผ่นแปะบนร่างกายหรือแผล", "\"ด้วยสายรายงานที่วาฮินญิดดัน\" (กัสเราะฮ์ที่ญีม) เป็นนัศบ์ฐานะมัศดัรของกริยาที่ละไว้ คือ อะญิดดุ ญิดดัน ความหมายคืออ่อนถึงที่สุด อัลวาฮีคือหะดีษที่ใช้ไม่ได้ทั้งเป็นหลักฐานสนับสนุนหรือรายงานสนับสนุน", "\"ที่ศีรษะแตก (ชุจญะ)\" (ฎ็อมมะฮ์ที่ชีน) รูปกริยาที่ไม่ระบุผู้กระทำ ชัจญะฮูคือทำให้หนังแตก ชัจญะฮ์คือบาดแผล เรียกเช่นนี้เมื่อเป็นที่ใบหน้าหรือศีรษะ"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "การเช็ดบนเฝือก", "points_th": ["หะดีษสองบทนี้ (อะลีและญาบิร) เกี่ยวกับการเช็ดบนเฝือก และมีความอ่อนมากดังกล่าวแล้ว ในเรื่องการเช็ดบนเฝือกไม่มีหลักฐานที่ปลอดจากการโต้แย้ง นักวิชาการจึงขัดแย้ง", "บางคนว่าหะดีษญาบิร (ร.ฎ.) ทั้งสองสายร่วมกับหะดีษอะลี (ร.ฎ.) แม้จะอ่อน แต่เสริมกันจนบ่งว่าบัญญัติให้เช็ดบนเฝือก อัศศ็อนอานีย์ อัชเชากานีย์ และเชคอับดุลอะซีซ บินบาซกล่าวเช่นนี้ พร้อมกับสิ่งที่สนับสนุนดังจะกล่าว", "บางคนว่าเป็นหะดีษอ่อนที่ใช้เป็นหลักฐานไม่ได้เพราะอ่อนมาก พวกเขาแบ่งเป็นสองฝ่าย ฝ่ายแรก: การทำความสะอาดที่เฝือกตกไป เพราะทำไม่ได้ จึงไม่ต้องเช็ดหรือตะยัมมุม เป็นทัศนะของอิบนุหัซม์ อัซซอฮิรีย์ ซึ่งยกจากอัชชะอ์บีย์ที่เห็นตรงกัน และเช่นเดียวกันจากดาวูดและสานุศิษย์ อิบนุหัซม์ว่า \"หลักฐานคืออายะฮ์ อัลลอฮ์ไม่ทรงบังคับชีวิตใดเกินความสามารถ (อัลบะเกาะเราะฮ์: 286) และหะดีษ เมื่อฉันสั่งพวกท่านเรื่องใด ก็จงทำตามความสามารถ (อัลบุคอรีย์ มุสลิม) อัลกุรอานและซุนนะฮ์จึงทำให้ทุกสิ่งที่คนทำไม่ได้ตกไป และการทดแทนต้องมาจากศาสนา และศาสนาไม่บังคับนอกจากด้วยอัลกุรอานหรือซุนนะฮ์ และไม่มีอัลกุรอานหรือซุนนะฮ์ที่ให้ทดแทนด้วยการเช็ดบนเฝือกและยาสำหรับสิ่งที่ล้างไม่ได้ ทัศนะนั้นจึงตกไป\" อิบนุหัซม์ปฏิเสธทัศนะที่ว่าการเช็ดบนเฝือกเทียบกับการเช็ดบนรองเท้าหุ้มข้อ และว่า \"เป็นการกิยาสที่เป็นโมฆะ\" ฝ่ายที่สอง: ตะยัมมุมแทนส่วนที่ไม่ได้ล้าง และไม่เช็ดบนเฝือก เป็นทัศนะของชาฟิอีย์บางคน", "ผู้แต่งเห็นว่าที่ชัดเจนกว่าในเรื่องนี้ และใกล้หลักการกว่า โดยไม่พิจารณาหะดีษในบท คือเช็ดบนเฝือกและสิ่งที่คล้ายกัน เป็นทัศนะของนักวิชาการส่วนใหญ่ จากฮัมบะลีย์ ชาฟิอีย์ มาลิกีย์ และหะนะฟีย์ อิบนุลมุนซิรเลือก และยกจากอิบนุอุมัร อะฏออ์ อุบัยด์ บินอุมัยร์ อิบรอฮีม อัลหะสัน และคนอื่น และอิบนุตัยมียะฮ์เลือก ที่สนับสนุนคือ (1) เทียบกับการเช็ดบนรองเท้าหุ้มข้อ อวัยวะนี้วาญิบต้องล้าง และถูกปิดด้วยสิ่งที่ศาสนาอนุญาตให้ปิด จึงเช็ดได้เหมือนรองเท้าหุ้มข้อ การเช็ดบนรองเท้าหุ้มข้อสนับสนุนการเช็ดบนเฝือก เพราะการเช็ดบนรองเท้าหุ้มข้อไม่ได้เพราะความจำเป็น แต่เป็นความผ่อนปรนและความเมตตาจากอัลลอฮ์แก่บ่าว เมื่อเช็ดบนรองเท้าหุ้มข้อได้โดยไม่จำเป็น บนเฝือกซึ่งเป็นที่จำเป็นยิ่งได้ การเช็ดบนเฝือกจึงไม่มีกำหนดเวลา แต่เช็ดตลอดที่จำเป็น ต่างจากการเช็ดบนรองเท้าหุ้มข้อที่มีกำหนดเวลา เพราะเป็นการเช็ดโดยเลือก", "(2) การทำความสะอาดด้วยการเช็ดด้วยน้ำบนที่ที่วาญิบต้องล้าง ดีกว่าการทำความสะอาดด้วยการเช็ดด้วยดินนอกที่ที่ต้องล้าง เพราะน้ำดีกว่าดิน และสิ่งที่อยู่บนที่ของฟัรฎูดีกว่าสิ่งที่อยู่นอก (อิบนุตัยมียะฮ์) (3) อัลบัยฮะกีย์บันทึกผ่านมูซา บินยะสาร จากนาฟิอ์ จากอิบนุอุมัร (ร.ฎ.) ว่าเขาอาบน้ำละหมาดขณะที่มือมีผ้าพัน แล้วเช็ดบนผ้าพัน และล้างส่วนอื่น (อัลบัยฮะกีย์ว่าศ่อฮีห์จากอิบนุอุมัร)", "ไม่ต้องตะยัมมุมพร้อมกับการเช็ด แต่เช็ดอย่างเดียวก็พอ ตามทัศนะที่มีน้ำหนักกว่าในสองทัศนะของนักวิชาการ ตามที่อิบนุตัยมียะฮ์กล่าว เพราะการบังคับให้ทำความสะอาดสองแบบสำหรับอวัยวะเดียวขัดกับหลักศาสนา เพราะอวัยวะนี้วาญิบต้องทำความสะอาดด้วยแบบนี้หรือแบบนั้น ส่วนการบังคับให้ทำความสะอาดสองแบบไม่มีแบบอย่างในศาสนา แต่ถ้าอวัยวะเปิดอยู่ และการล้างและการเช็ดเป็นอันตราย ก็ตะยัมมุมสำหรับมัน", "อวัยวะที่มีแผลหรือทำนองนั้นมีสองกรณี (1) ถูกปิด หุก่มคือเช็ดบนเฝือก (2) เปิดอยู่ มีสามกรณี (ก) การล้างไม่เป็นอันตราย ก็ล้างถ้าอยู่ในอวัยวะวุฎูอ์ (ข) การล้างเป็นอันตราย แต่การเช็ดไม่เป็น ก็เช็ด (ค) ทั้งการล้างและการเช็ดเป็นอันตราย ก็ตะยัมมุมสำหรับมัน"]}], "tags_th": ["เฝือก", "ตะยัมมุม", "บาดแผล", "การเช็ด", "หะดีษอ่อน"]}, {"id": "v2-h137", "volume": 2, "bab": "tayammum", "topic_ar": "ما جاء في أن التيمم لا يُصلى به إلا صلاة واحدة", "topic_th": "ตะยัมมุมครั้งหนึ่งใช้ละหมาดได้เพียงละหมาดเดียวหรือไม่", "pages": [108, 109], "hadith": [{"no": 137, "matn_ar": "وَعَنِ ابْنِ عَبَّاسٍ رَضِيَ اللهُ عَنْهُمَا قَالَ: مِنَ السُّنَّةِ أَنْ لَا يُصَلِّيَ الرَّجُلُ بِالتَّيَمُّمِ إِلَّا صَلَاةً وَاحِدَةً، ثُمَّ يَتَيَمَّمُ لِلصَّلَاةِ الْأُخْرَى. رَوَاهُ الدَّارَقُطْنِيُّ بِإِسْنَادٍ ضَعِيفٍ جِدًّا.", "translation_th": "และจากอิบนุอับบาส (ร.ฎ.) กล่าวว่า เป็นซุนนะฮ์ที่ชายคนหนึ่งจะไม่ละหมาดด้วยตะยัมมุม (ครั้งหนึ่ง) นอกจากละหมาดเดียว แล้วตะยัมมุมใหม่สำหรับละหมาดอื่น รายงานโดยอัดดารุกุฏนีย์ ด้วยสายรายงานที่อ่อนมาก", "grade_th": "อ่อนมาก อัลอัลบานีย์ว่าเมาฎูอ์ (อัลหะสัน บินอุมาเราะฮ์มัตรูก)"}], "key_rulings_th": ["หะดีษนี้อ่อนมาก และไม่ถูกต้องจากอิบนุอับบาส แต่ยืนยันจากเขาตรงกันข้าม ในบทนี้ไม่มีรายงานจากเศาะหาบะฮ์ที่ถูกต้องนอกจากของอิบนุอุมัร (ร.ฎ.) ว่า \"ให้ตะยัมมุมทุกละหมาด แม้ไม่มีฮะดัษ\"", "ทัศนะแรก: ละหมาดด้วยตะยัมมุมครั้งเดียวได้เพียงละหมาดเดียว (อัชชาฟิอีย์ มาลิก และที่รู้จักจากอะห์มัด) ตามหลักว่าตะยัมมุมเพียงทำให้ละหมาดได้", "ทัศนะที่สอง: ละหมาดได้หลายละหมาดเท่าที่ต้องการ (อบูหะนีฟะฮ์ รายงานหนึ่งจากอะห์มัด อิบนุตัยมียะฮ์ อิบนุลมุนซิร อิบนุหัซม์ อัศศ็อนอานีย์) ตามหลักว่าตะยัมมุมขจัดฮะดัษจนกว่าจะพบน้ำ ผู้แต่งเห็นว่าทัศนะนี้ชัดเจนกว่า"], "vocab": [{"ar": "مِنَ السُّنَّةِ", "th": "เป็นแนวทางของท่านนบี ﷺ (เมื่อเศาะหาบะฮ์กล่าวเช่นนี้ ถือว่าอยู่ในหุก่มมัรฟูอ์)"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัดดารุกุฏนีย์บันทึก (1/185) อับดุรร็อซซาก (1/214) และอัลบัยฮะกีย์ (1/221) ผ่านอัลหะสัน บินอุมาเราะฮ์ จากอัลหะกัม บินอุตัยบะฮ์ จากมุญาฮิด จากอิบนุอับบาส อัดดารุกุฏนีย์กล่าวหลังหะดีษว่า \"อัลหะสัน บินอุมาเราะฮ์อ่อน\"", "สายนี้อ่อนมากตามที่อิบนุหะญัรกล่าว เพราะอัลหะสัน บินอุมาเราะฮ์ บินอัลมุฎ็อรริบ อัลบะญะลีย์ มัตรูกอัลหะดีษ ตามที่อิมามอะห์มั ทุกละหมาด\" (286, 304) อันนะสาอีย์ (1/185) อิบนุหิบบาน (1348) และอัลหากิม (1/174) และในตอนท้ายของอบูดาวูด อันนะสาอีย์ และอัลหากิมว่า \"มันเป็นเพียงเส้นเลือด\" ทั้งหมดผ่านมุหัมมัด บินอบีอะดีย์ จากความจำของเขา จากมุหัมมัด บินอัมรฺ จากอิบนุชิฮาบ จากอุรวะฮ์ จากอาอิชะฮ์ว่า ฟาฏิมะฮ์ บินติหุบัยช์... หะดีษนี้มีความขัดแย้งทั้งในสายและเนื้อความ", "ความขัดแย้งในสาย: บางรายงานว่าจากอิบนุชิฮาบ จากอุรวะฮ์ จากฟาฏิมะฮ์ บางรายงานว่าจากอิบนุชิฮาบ จากอุรวะฮ์ จากอาอิชะฮ์ว่าฟาฏิมะฮ์... แบบแรกเป็นมุสนัดของฟาฏิมะฮ์ แบบที่สองเป็นมุสนัดของอาอิชะฮ์ ทั้งสองสายขึ้นอยู่กับมุหัมมัด บินอบีอะดีย์ ซึ่งรายงานแบบแรกจากตำรา และแบบที่สองจากความจำ บางคนเห็นว่าแบบแรกมีน้ำหนักกว่าเพราะมาจากตำรา อิบนุหัซม์ปฏิเสธว่าเป็นความสับสน และว่า \"ทั้งหมดนี้ทำให้ข่าวแข็งแรงขึ้น ไม่ใช่ความสับสน เพราะอุรวะฮ์รายงานจากทั้งฟาฏิมะฮ์และอาอิชะฮ์ และพบทั้งสองคน อาอิชะฮ์เป็นน้องสาวของแม่เขา และฟาฏิมะฮ์ บินติอบีหุบัยช์ บินอัลมุฏฏ็อลิบ บินอะสัด เป็นลูกพี่ลูกน้องของเขา... และมุหัมมัด บินอบีอะดีย์เชื่อถือได้ เป็นนักจำที่ไว้ใจได้\"", "ความขัดแย้งในเนื้อความ: หะดีษนี้มาในเศาะฮีห์ทั้งสอง แต่ไม่มีคำว่า \"ดำที่รู้จักกัน\" ซึ่งบริบทนี้ระบุชัดว่าพิจารณาด้วยการแยกแยะ ไม่ใช่รอบ แต่ความหมายตามตัวบทของเรื่องฟาฏิมะฮ์ในเศาะฮีห์ทั้งสองคือท่านนบี ﷺ ให้นางกลับไปใช้รอบ และเรื่องนี้เกิดซ้ำไม่ได้ ในเศาะฮีห์ทั้งสองผ่านฮิชาม จากอุรวะฮ์ จากอาอิชะฮ์ว่า ฟาฏิมะฮ์ บินติอบีหุบัยช์กล่าวว่า \"โอ้ท่านรสูลุลลอฮ์ ฉันไม่สะอาด ฉันจะละละหมาดหรือไม่\" ท่านรสูลุลลอฮ์ ﷺ ตอบว่า \"นั่นเป็นเพียงเส้นเลือด ไม่ใช่ประจำเดือน เมื่อประจำเดือนมา จงละละหมาด เมื่อมันหมดไปตามระยะของมัน ก็จงล้างเลือดและละหมาด\" (สำนวนของอัลบุคอรีย์) อิบนุเราะญับว่า \"ที่ชัดเจนกว่า วัลลอฮุอะอ์ลัม คือท่านนบี ﷺ ให้นางกลับไปใช้รอบ ไม่ใช่การแยกแยะ ตามคำว่า เมื่อมันหมดไปตามระยะของมัน\"", "ตามนี้ คำว่า \"ดำที่รู้จักกัน\" ในหะดีษของบทไม่มีในเศาะฮีห์ทั้งสอง แต่มุหัมมัด บินอัมรฺรายงานคนเดียว ซึ่งไม่ใช่คนที่รับการขัดแย้งได้ อบูหาติมจึงกล่าวว่า \"ไม่มีผู้รายงานสนับสนุนมุหัมมัด บินอัมรฺในรายงานนี้ และมันมุนกัร\" ความหมายตามตัวบทคือหมายถึงเนื้อความ อันนะสาอีย์กล่าวหลังหะดีษว่า \"หลายคนรายงานหะดีษนี้ ไม่มีใครกล่าวถึงสิ่งที่อิบนุอบีอะดีย์กล่าว\"", "กลุ่มหนึ่งว่าหะดีษศ่อฮีห์ ได้แก่ อิบนุหิบบาน อัลหากิม ซึ่งว่าศ่อฮีห์ตามเงื่อนไขของมุสลิม และอัษษะฮะบีย์ไม่ได้แย้ง อิบนุหัซม์และอันนะวะวีย์ก็ว่าศ่อฮีห์ อัลอัลบานีย์แย้งอัลหากิมและอัษษะฮะบีย์ว่าหะดีษไม่ถึงระดับศ่อฮีห์ แต่เป็นระดับหะซัน เพราะมีมุหัมมัด บินอัมรฺ คือ อิบนุอัลเกาะมะฮ์ ซึ่งอัลบุคอรีย์บันทึกร่วมกับคนอื่น และมุสลิมบันทึกเป็นรายงานสนับสนุน ความจำของเขาอ่อนเล็กน้อย หะดีษของเขาจึงอยู่ในระดับหะซัน อิบนุหะญัรใน \"อัตตักรีบ\" ว่า \"ศอดูก มีความเข้าใจผิดบ้าง\"", "หะดีษนี้แม้จะถูกวิจารณ์ แต่นักวิชาการปฏิบัติตาม และใช้กับหญิงที่เพิ่งเริ่มมีประจำเดือนและไม่มีรอบให้อ้างอิง แต่แยกแยะเลือดได้ พวกเขาว่าให้ใช้การแยกแยะ ซึ่งดีกว่าการให้กลับไปใช้รอบของผู้หญิงส่วนใหญ่ ดังจะกล่าว"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ฟาฏิมะฮ์ บินติหุบัยช์\" กล่าวแล้วในบทสิ่งที่ทำให้วุฎูอ์เสีย \"ตุสตะหาฎ\" คือมีประจำเดือนมาก สีนและตาอ์บ่งความมาก อิสติหาเฎาะฮ์คือเลือดออกจากผู้หญิงต่อเนื่องตลอดเวลาหรือเกือบตลอด", "เลือดเสียอาจมาจากมดลูก หรือจากส่วนล่างของมดลูก หรือจากช่องคลอด ผู้แต่งอ้างถึงว่าแพทย์ระบุสาเหตุหลายประการ เช่น เนื้องอกในตัวมดลูก แผลที่ปากมดลูก ก้อนที่ปากมดลูก และการอักเสบ เนื้องอก หรือสิ่งแปลกปลอมในช่องคลอด และการสัมมนาครั้งที่สามด้านการแพทย์กับฟิกฮ์ที่คูเวต (20 ชะอ์บาน ฮ.ศ. 1407) สรุปว่า \"อิสติหาเฎาะฮ์ทางการแพทย์คือเลือดที่เกิดจากโรค ไม่ปกติ และมีสาเหตุทางโรคหลายอย่าง\"", "\"ดำที่รู้จักกัน (ยุอ์เราะฟ)\" (ฎ็อมมะฮ์ที่ยาอ์ ฟัตหะฮ์ที่รออ์) รูปที่ไม่ระบุผู้กระทำ จากความรู้ คือผู้หญิงรู้จักจากสีและความข้น เหมือนที่รู้จักจากรอบ หรืออ่าน \"ยุอ์ริฟ\" (กัสเราะฮ์ที่รออ์) จากคำว่า อิอ์ร็อฟ คือมีกลิ่น (อัลอัรฟ์ คือกลิ่น)", "\"เมื่อเป็นเช่นนั้น (ซาลิกิ)\" (กัสเราะฮ์ที่กาฟ) สิ่งที่ชี้คือเลือดดำ ผู้ที่ถูกพูดด้วยคือฟาฏิมะฮ์ \"จงงดละหมาด\" ในรายงานของเศาะฮีห์ทั้งสองว่า \"จงละละหมาด\" \"เมื่อเป็นเลือดอื่น\" คือไม่ใช่สีดำ เช่น เหลือง แดง หรือขุ่น \"มันเป็นเพียงเส้นเลือด\" มีคำที่ละไว้ คือเลือดจากเส้นเลือด ความหมายคือ เลือดที่ไม่ดำไม่ใช่ประจำเดือน จงอาบน้ำและอาบน้ำละหมาด เพราะเป็นเลือดจากเส้นเลือดที่แตก ไม่ใช่ประจำเดือน จึงไม่ห้ามละหมาด ถือศีลอด หรือสิ่งอื่นที่อนุญาตแก่หญิงที่สะอาด"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "หญิงมีเลือดเสีย: การแยกแยะกับรอบ", "points_th": ["หะดีษเป็นหลักฐานว่าหญิงมีเลือดเสียที่เลือดออกมาก จนสับสนกับประจำเดือน ให้ดูที่เลือด นางแยกแยะวันประจำเดือนได้ด้วยสีของเลือด เลือดดำคือประจำเดือน นางงดละหมาด ส่วนที่เหลือคือเลือดเสีย", "นักวิชาการกลุ่มหนึ่งใช้หะดีษนี้กับหญิงที่เพิ่งเริ่มมีประจำเดือน และเลือดออกต่อเนื่องตั้งแต่แรก นางกลับไปใช้การแยกแยะไม่ว่ากรณีใด เพราะไม่มีรอบให้อ้างอิง อิบนุอบีชัยบะฮ์บันทึกด้วยสายของเขาจากอะนัส บินสีรีนว่า \"หญิงคนหนึ่งในครอบครัวอะนัสมีเลือดเสีย พวกเขาสั่งให้ฉันถามอิบนุอับบาส (ร.ฎ.) เขาตอบว่า ส่วนที่นางเห็นเลือดบะห์รอนีย์ อย่าละหมาด เมื่อนางเห็นความสะอาด แม้เพียงชั่วโมงหนึ่งของกลางวัน ก็จงอาบน้ำและละหมาด\" (สายศ่อฮีห์) ใน \"ตาญุลอะรูส\" ว่า \"เลือดบะห์รอนีย์ คือแดงจัด... และโดยอนุโลม คือดำ เชื่อมกับก้นมดลูก ซึ่งคือส่วนลึกของมัน\" รายงานนี้สนับสนุนหะดีษของบท และบ่งว่าหญิงมีเลือดเสียที่ไม่มีรอบ ให้ใช้การแยกแยะ", "ถ้านางมีรอบที่รู้ แล้วเกิดเลือดเสีย มีสองทัศนะ (1) ใช้รอบ ไม่ดูการแยกแยะ เป็นที่รู้จักในมัซฮับอิมามอะห์มัด เป็นทัศนะของหะนะฟีย์ และทัศนะหนึ่งในมัซฮับชาฟิอีย์ เพราะยืนยันว่าท่านนบี ﷺ กล่าวแก่ฟาฏิมะฮ์ว่า \"เมื่อประจำเดือนมา จงละละหมาด เมื่อมันหมดไปตามระยะของมัน ก็จงล้างเลือดและละหมาด\" โดยท่านไม่ได้ถามว่านางแยกแยะได้หรือไม่ (2) ใช้การแยกแยะ และให้มาก่อนรอบ โดยใช้หะดีษนี้ เพราะรอบอาจเปลี่ยน ให้มาในปลายเดือนแทนต้นเดือน เป็นที่รู้จักในมัซฮับมาลิกีย์และชาฟิอีย์ พร้อมรายละเอียดที่มีในตำราฟิกฮ์ และเป็นรายงานหนึ่งจากอิมามอะห์มัด", "ผู้แต่งเห็นว่าทัศนะที่ให้ใช้รอบมีน้ำหนักกว่า เพราะยืนยันในเศาะฮีห์ทั้งสอง ง่ายกว่าสำหรับผู้หญิง และห่างไกลจากความสับสน ถ้านางไม่มีทั้งการแยกแยะและรอบ ให้ใช้รอบของผู้หญิงส่วนใหญ่ คือหกหรือเจ็ดวันจากทุกเดือน ซึ่งเป็นที่รู้จักในมัซฮับฮัมบะลีย์ และเป็นทัศนะหนึ่งในมัซฮับชาฟิอีย์ ตามหะดีษหัมนะฮ์ บินติญะห์ช (ร.ฎ.) (จะกล่าวต่อไป)"]}, {"wajh": 4, "type": "fawaid", "heading_ar": null, "heading_th": "ความต่างระหว่างเลือดประจำเดือนกับเลือดเสีย", "points_th": ["หะดีษบ่งว่าความต่างหนึ่งระหว่างเลือดประจำเดือนกับเลือดเสียคือสี เลือดประจำเดือนดำ เลือดเสียแดงอมเหลือง มีในหะดีษอาอิชะฮ์ (ร.ฎ.) ด้วยว่า \"หญิงคนหนึ่งในภรรยาของท่านรสูลุลลอฮ์ ﷺ ที่มีเลือดเสีย อิอ์ติกาฟพร้อมท่าน นางเห็นสีแดงและสีเหลือง บางครั้งเราวางถาดไว้ใต้นางขณะนางละหมาด\" (อัลบุคอรีย์ 309) อิบนุเราะญับว่า \"ในหะดีษอาอิชะฮ์มีสิ่งบ่งว่าเลือดเสียแยกจากเลือดประจำเดือนด้วยสีและความเหลือง\" นี่คือความต่างที่มาในซุนนะฮ์อย่างชัดเจน", "นักวิชาการระบุความต่างอีกสามข้อ ซึ่งผู้แต่งอ้างถึงจากแพทย์ (1) เลือดประจำเดือนข้น เลือดเสียใส สาเหตุอาจเป็นที่ ดร.มุหัมมัด อัลบาร กล่าวว่า \"เมื่อตรวจเลือดประจำเดือนด้วยกล้องจุลทรรศน์ เราเห็นเม็ดเลือดแดงและขาว และชิ้นส่วนเยื่อบุมดลูก\" และ \"เลือดประจำเดือนมีชิ้นส่วนเยื่อบุมดลูกที่แตกออก\" (2) เลือดประจำเดือนมีกลิ่นไม่ดี เลือดเสียไม่มีกลิ่น นักฟิกฮ์บางคนและ ดร.อัลบาร กล่าวไว้ (3) เลือดประจำเดือนไม่จับตัว แต่เลือดเสียจับตัว ซึ่งอาจเข้าใจได้จากคำว่า \"นั่นเป็นเพียงเส้นเลือด\" และเลือดจากเส้นเลือดจับตัว ดร.อัลบาร ยกจากแพทย์ตะวันตกบางคนว่า เลือดประจำเดือนไม่จับตัว เพราะอาจจับตัวในมดลูกแล้วแตกและไหลออก ถ้าระหว่างมีประจำเดือนพบเลือดที่จับตัว ก็เป็นเลือดที่ไม่ปกติ"]}], "tags_th": ["ประจำเดือน", "อิสติหาเฎาะฮ์", "การแยกแยะเลือด", "รอบประจำเดือน", "ฟาฏิมะฮ์ บินติอบีหุบัยช์"]}, {"id": "v2-h139", "volume": 2, "bab": "hayd", "topic_ar": "ما جاء في اغتسال المستحاضة ووقته", "topic_th": "การอาบน้ำของหญิงที่มีเลือดเสียและเวลาของมัน", "pages": [119, 122], "hadith": [{"no": 139, "matn_ar": "وَفِي حَدِيثِ أَسْمَاءَ بِنْتِ عُمَيْسٍ عِنْدَ أَبِي دَاوُدَ: «لِتَجْلِسْ فِي مِرْكَنٍ، فَإِذَا رَأَتْ صُفْرَةً فَوْقَ الْمَاءِ، فَلْتَغْتَسِلْ لِلظُّهْرِ وَالْعَصْرِ غُسْلًا وَاحِدًا، وَتَغْتَسِلْ لِلْمَغْرِبِ وَالْعِشَاءِ غُسْلًا وَاحِدًا، وَتَغْتَسِلْ لِلْفَجْرِ غُسْلًا، وَتَتَوَضَّأْ فِيمَا بَيْنَ ذَلِكَ».", "translation_th": "และในหะดีษอัสมาอ์ บินติอุมัยส์ที่อบูดาวูดบันทึกว่า \"ให้นางนั่งในอ่าง เมื่อนางเห็นสีเหลืองอยู่บนผิวน้ำ ก็จงอาบน้ำครั้งเดียวสำหรับซุฮ์รีและอัศรี อาบน้ำครั้งเดียวสำหรับมัฆริบและอิชาอ์ อาบน้ำหนึ่งครั้งสำหรับฟัจญ์รี และอาบน้ำละหมาดระหว่างนั้น\"", "grade_th": "ผู้แต่งเห็นว่ารายงานนี้ไม่ได้รับการยอมรับ เพราะสุฮัยล์ บินอบีศอลิห์ (ความจำเปลี่ยนในบั้นปลาย) ขัดกับรายงานของผู้รายงานส่วนใหญ่ และรายงานของเศาะฮีห์ทั้งสองมาก่อน อัลหากิมว่าศ่อฮีห์ตามเงื่อนไขของมุสลิม"}], "key_rulings_th": ["ตามความหมายของหะดีษ หญิงมีเลือดเสียอาบน้ำวันละสามครั้ง สำหรับซุฮ์รีกับอัศรี มัฆริบกับอิชาอ์ และฟัจญ์รี โดยรวมละหมาด (ทัศนะของอะลี อิบนุอับบาส และอันนะเคาะอีย์)", "แต่ผู้แต่งเห็นว่าที่ถูกคือรายงานของเศาะฮีห์ทั้งสอง คือวาญิบต้องอาบน้ำครั้งเดียวเมื่อประจำเดือนหมด แล้วอาบน้ำละหมาดตามปกติ", "การรวมละหมาด อบูดาวูดยกว่าอิบนุอับบาส (ร.ฎ.) สั่งนางให้รวมละหมาดเมื่อการอาบน้ำลำบากสำหรับนาง", "การนั่งในอ่างน้ำเป็นวิธีแยกแยะเลือด ถ้าสีเหลืองอยู่บนผิวน้ำคือเลือดเสีย ถ้าสีอื่นอยู่บนคือประจำเดือน"], "vocab": [{"ar": "مِرْكَنٌ", "th": "อ่างหรือภาชนะใหญ่สำหรับซักผ้า (กัสเราะฮ์ที่มีม)"}, {"ar": "صُفْرَةً فَوْقَ الْمَاءِ", "th": "สีเหลืองลอยบนผิวน้ำ บ่งว่าเป็นเลือดเสีย"}, {"ar": "وَتَتَوَضَّأُ فِيمَا بَيْنَ ذَلِكَ", "th": "ถ้าต้องการละหมาดระหว่างนั้นและวุฎูอ์เสีย ก็อาบน้ำละหมาด ไม่ต้องอาบน้ำ"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["คืออัสมาอ์ บินติอุมัยส์ (ฎ็อมมะฮ์ที่อัยน์) มีความขัดแย้งมากเรื่องเชื้อสาย เป็นหนึ่งในผู้รับอิสลามรุ่นแรก นางอพยพไปเอธิโอเปียพร้อมสามี ญะอ์ฟัร บินอบีฏอลิบ และมีบุตรสามคนที่นั่น แล้วอพยพไปมะดีนะฮ์ ในเศาะฮีห์อัลบุคอรีย์จากหะดีษอบูมูซา (ร.ฎ.) ซึ่งยาว เมื่ออุมัรกล่าวแก่นางว่า \"เราอพยพก่อนพวกท่าน เราจึงมีสิทธิ์ต่อท่านรสูลุลลอฮ์ ﷺ มากกว่าพวกท่าน\" นางเล่าให้ท่านรสูลุลลอฮ์ ﷺ ฟัง ท่านตอบว่า \"เขาไม่ได้มีสิทธิ์ต่อฉันมากกว่าพวกท่าน เขาและสหายมีการอพยพครั้งเดียว แต่พวกท่าน ชาวเรือ มีการอพยพสองครั้ง\" (อัลบุคอรีย์ 4230 มุสลิม 2503)", "เมื่อสามีเสียชีวิตในสงครามมุอ์ตะฮ์ อบูบักร อัศศิดดีก (ร.ฎ.) แต่งงานกับนาง และนางให้กำเนิดมุหัมมัดในเวลาครองเอียะห์รอมในหัจญ์อำลา เมื่ออัศศิดดีกเสียชีวิต อัสมาอ์เป็นผู้อาบน้ำศพเขา แล้วอะลี (ร.ฎ.) แต่งงานกับนาง อัษษะฮะบีย์ยกจากอัชชะอ์บีย์ว่า \"คนแรกที่แนะนำโลงศพปิดสำหรับผู้หญิงคืออัสมาอ์ นางเห็นชาวคริสต์ทำที่เอธิโอเปีย\" ผู้ที่รายงานจากนางได้แก่ อับดุลลอฮ์ บินญะอ์ฟัร บุตรของนาง อับดุลลอฮ์ บินชัดดาด บุตรของน้องสาว สะอีด บินอัลมุซัยยิบ อุรวะฮ์ อัชชะอ์บีย์ และคนอื่น"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อบูดาวูดบันทึก (296) ในหมวดความสะอาด บท \"ผู้ที่ว่ารวมสองละหมาดและอาบน้ำครั้งเดียวสำหรับทั้งสอง\" อัดดารุกุฏนีย์ (1/215) อัลหากิม (1/281) และอัลบัยฮะกีย์ (1/353) ผ่านสุฮัยล์ บินอบีศอลิห์ จากอัซซุฮ์รีย์ จากอุรวะฮ์ บินอัซซุบัยร์ จากอัสมาอ์ บินติอุมัยส์ว่า \"ฉันถามว่า โอ้ท่านรสูลุลลอฮ์ ฟาฏิมะฮ์ บินติอบีหุบัยช์มีเลือดเสียมาตั้งแต่เท่านั้นเท่านี้ และไม่ได้ละหมาด ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า สุบหานัลลอฮ์ นี่มาจากชัยฏอน ให้นางนั่งในอ่าง...\" (สำนวนของอบูดาวูด) อัลหากิมว่า \"หะดีษศ่อฮีห์ตามเงื่อนไขของมุสลิม แต่ทั้งสองไม่ได้บันทึกด้วยสำนวนนี้\"", "ผู้แต่งเห็นว่ายังต้องพิจารณา เพราะในสายมีสุฮัยล์ บินอบีศอลิห์ ซึ่งถูกวิจารณ์ อิบนุหิบบานยกไว้ใน \"อัษษิกอต\" และว่า \"ผิดพลาด\" อันนะสาอีย์ว่า \"ไม่มีปัญหา\" อะห์มัดว่า \"หะดีษของเขาดีมาก\" อบูหาติมว่า \"เขียนหะดีษของเขาได้ แต่ไม่ใช้เป็นหลักฐาน\" อิบนุลมะดีนีย์ว่า \"สุฮัยล์มีพี่ชายที่เสียชีวิต เขาเสียใจมากจนลืมหะดีษมาก\" และอิบนุหะญัรใน \"อัตตักรีบ\" ว่า \"ศอดูก ความจำเปลี่ยนในบั้นปลาย อัลบุคอรีย์รายงานจากเขาร่วมกับคนอื่นและแบบตะอ์ลีก\"", "สุฮัยล์ขัดกับผู้รายงานคนอื่นจากอัซซุฮ์รีย์ อัลลัยษ์ อิบรอฮีม บินสะอ์ด อิบนุอุยัยนะฮ์ มะอ์มัร อัลเอาซาอีย์ อัมรฺ บินอัลหาริษ อิบนุอิสหาก อิบนุอบีซิอ์บ และคนอื่น รายงานจากอัซซุฮ์รีย์ จากอุรวะฮ์ บางครั้งจากอัมเราะฮ์ บินติอับดิรเราะห์มาน บิน สะอ์ด (ซึ่งรู้หะดีษอาอิชะฮ์ดีที่สุด) บางครั้งรวมทั้งสองจากอาอิชะฮ์ และไม่กล่าวถึงอัสมาอ์ และทำให้เป็นเรื่องของอุมมุหะบีบะฮ์ ไม่ใช่เรื่องของฟาฏิมะฮ์ (อัลบัยฮะกีย์) นักวิชาการบางคน เช่น อิบนุอับดิลบัรร์ ตัดสินว่าหะดีษอัซซุฮ์รีย์สับสนเพราะเหตุนี้ ผู้แต่งเห็นว่ายังต้องพิจารณา เพราะไม่มีอะไรขัดขวางที่อัซซุฮ์รีย์จะได้ยินจากทั้งอุรวะฮ์และอัมเราะฮ์ จากอาอิชะฮ์ บางครั้งรวม บางครั้งแยก และในเศาะฮีห์ทั้งสองมีรายงานจากอุรวะฮ์และอัมเราะฮ์รวมกัน อัดดารุกุฏนีย์ว่า \"ถูกต้องจากอุรวะฮ์และอัมเราะฮ์ทั้งสอง\"", "สุฮัยล์ขัดกับพวกเขา โดยรายงานจากอัซซุฮ์รีย์ จากอุรวะฮ์ จากอัสมาอ์ แล้วยังมีความขัดแย้งในสำนวนจากสุฮัยล์ เพราะเขากล่าวถึงการอาบน้ำสำหรับละหมาดที่รวมกัน และฟัจญ์รีด้วย ซึ่งขัดกับรายงานของคนส่วนใหญ่ ซึ่งไม่มีคำสั่งให้อาบน้ำสำหรับละหมาดที่รวมกัน แต่มีว่า \"เมื่อมันหมดไป จงล้างเลือดและละหมาด\" และอีกรายงานว่า \"เมื่อมันหมดไป จงอาบน้ำและละหมาด\" ไม่ต้องสงสัยว่าการขัดแย้งนี้ไม่ได้รับการยอมรับจากเขา โดยเฉพาะเมื่อความจำของเขาเปลี่ยนในบั้นปลาย หะดีษของเขาอยู่ในระดับหะซัน โดยมีเงื่อนไขว่าไม่ขัดแย้งและไม่มีความขัดแย้งจากเขา ซึ่งไม่เป็นเช่นนั้นในหะดีษนี้ รายงานของเศาะฮีห์ทั้งสองจึงมาก่อนรายงานของเขา ในอบูดาวูด (281) จากรายงานของญะรีรจากสุฮัยล์ สำนวนว่า \"ท่านรสูลุลลอฮ์ ﷺ สั่งนางให้งดในวันที่นางเคยงด แล้วอาบน้ำ\" ซึ่งใกล้กับสำนวนของอัลบุคอรีย์"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ให้นางนั่งในมิรกัน\" (กัสเราะฮ์ที่มีม สุกูนที่รออ์) คือภาชนะสำหรับซักผ้า \"เมื่อนางเห็นสีเหลืองบนน้ำ\" คือนางนั่งในอ่างที่มีน้ำเพื่อรู้สภาพเลือด ถ้าสีเหลืองอยู่บนผิวน้ำ ก็เป็นเลือดเสีย ถ้าสีอื่นอยู่บน ก็เป็นประจำเดือน", "\"และอาบน้ำละหมาดระหว่างนั้น\" คือถ้านางต้องการละหมาดอื่นระหว่างละหมาดเหล่านั้น และเห็นสิ่งที่ทำให้วุฎูอ์เสีย นางอาบน้ำละหมาด ไม่ต้องอาบน้ำ เพราะการอาบน้ำเฉพาะเวลาทั้งห้า"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "การอาบน้ำของหญิงมีเลือดเสีย", "points_th": ["หะดีษเป็นหลักฐานว่าหญิงมีเลือดเสียอาบน้ำครั้งเดียวสำหรับทุกสองละหมาด อาบครั้งเดียวสำหรับซุฮ์รีและอัศรี ครั้งเดียวสำหรับมัฆริบและอิชาอ์ และครั้งเดียวสำหรับฟัจญ์รี และนางละหมาดซุฮ์รีตอนท้ายเวลา และอัศรีตอนต้นเวลา มัฆริบกับอิชาอ์ก็เช่นกัน เศาะหาบะฮ์และตาบิอีนกลุ่มหนึ่งกล่าวเช่นนี้ เช่น อะลี อิบนุอับบาส (ร.ฎ.) และอิบรอฮีม อันนะเคาะอีย์", "แต่ได้กล่าวแล้วว่าที่ถูกคือรายงานของเศาะฮีห์ทั้งสอง คือวาญิบต้องอาบน้ำครั้งเดียวเมื่อประจำเดือนหมด", "ส่วนการรวมละหมาด อบูดาวูดกล่าวหลังยกหะดีษว่า \"มุญาฮิดรายงานจากอิบนุอับบาส (ร.ฎ.) ว่าเมื่อการอาบน้ำลำบากสำหรับนาง เขาสั่งนางให้รวมสองละหมาด\""]}], "tags_th": ["อิสติหาเฎาะฮ์", "ฆุสล์", "การรวมละหมาด", "อัสมาอ์ บินติอุมัยส์", "ประจำเดือน"]}, {"id": "v2-h140", "volume": 2, "bab": "hayd", "topic_ar": "المستحاضة تجمع بين الصلاتين", "topic_th": "หญิงที่มีเลือดเสียรวมละหมาดสองเวลา", "pages": [123, 128], "hadith": [{"no": 140, "matn_ar": "وَعَنْ حَمْنَةَ بِنْتِ جَحْشٍ قَالَتْ: كُنْتُ أُسْتَحَاضُ حَيْضَةً كَبِيرَةً شَدِيدَةً، فَأَتَيْتُ النَّبِيَّ ﷺ أَسْتَفْتِيهِ، فَقَالَ: «إِنَّمَا هِيَ رَكْضَةٌ مِنَ الشَّيْطَانِ، فَتَحَيَّضِي سِتَّةَ أَيَّامٍ، أَوْ سَبْعَةً، ثُمَّ اغْتَسِلِي، فَإِذَا اسْتَنْقَأْتِ فَصَلِّي أَرْبَعَةً وَعِشْرِينَ، أَوْ ثَلَاثَةً وَعِشْرِينَ، وَصُومِي وَصَلِّي، فَإِنَّ ذَلِكَ يُجْزِئُكِ، وَكَذَلِكَ فَافْعَلِي كَمَا تَحِيضُ النِّسَاءُ، فَإِنْ قَوِيتِ عَلَى أَنْ تُؤَخِّرِي الظُّهْرَ وَتُعَجِّلِي الْعَصْرَ، ثُمَّ تَغْتَسِلِي حِينَ تَطْهُرِينَ وَتُصَلِّينَ الظُّهْرَ وَالْعَصْرَ جَمِيعًا، ثُمَّ تُؤَخِّرِينَ الْمَغْرِبَ وَتُعَجِّلِينَ الْعِشَاءَ، ثُمَّ تَغْتَسِلِينَ وَتَجْمَعِينَ بَيْنَ الصَّلَاتَيْنِ، فَافْعَلِي، وَتَغْتَسِلِينَ مَعَ الصُّبْحِ وَتُصَلِّينَ». قَالَ: «وَهُوَ أَعْجَبُ الْأَمْرَيْنِ إِلَيَّ». رَوَاهُ الْخَمْسَةُ إِلَّا النَّسَائِيَّ، وَصَحَّحَهُ التِّرْمِذِيُّ، وَحَسَّنَهُ الْبُخَارِيُّ.", "translation_th": "และจากหัมนะฮ์ บินติญะห์ช กล่าวว่า ฉันมีเลือดเสียออกมากและรุนแรง ฉันจึงไปหาท่านนบี ﷺ เพื่อขอคำวินิจฉัย ท่านกล่าวว่า \"นี่เป็นเพียงการกระทืบหนึ่งของชัยฏอน ดังนั้นจงถือว่ามีประจำเดือนหกหรือเจ็ดวัน แล้วอาบน้ำ เมื่อเธอสะอาดหมดจดแล้ว ก็จงละหมาดยี่สิบสี่หรือยี่สิบสามวัน และถือศีลอดและละหมาด เพราะนั่นเพียงพอแก่เธอ และจงทำเช่นนี้ (ทุกเดือน) เหมือนที่ผู้หญิงมีประจำเดือน ถ้าเธอทำได้ที่จะเลื่อนซุฮ์รีและเร่งอัศรี แล้วอาบน้ำเมื่อสะอาด และละหมาดซุฮ์รีกับอัศรีรวมกัน แล้วเลื่อนมัฆริบและเร่งอิชาอ์ แล้วอาบน้ำและรวมสองละหมาด ก็จงทำ และอาบน้ำพร้อมกับ (ละหมาด) ศุบห์และละหมาด\" ท่านกล่าวว่า \"และนั่นเป็นสิ่งที่ฉันชอบที่สุดในสองทาง\" รายงานโดยนักบันทึกทั้งห้ายกเว้นอันนะสาอีย์ อัตติรมิซีย์ว่าศ่อฮีห์ และอัลบุคอรีย์ว่าหะซัน", "grade_th": "ผู้แต่งเห็นว่าที่ชัดเจนกว่าคืออ่อน เพราะขึ้นอยู่กับอิบนุอะกีลซึ่งรายงานคนเดียวและขัดกับหะดีษในเศาะฮีห์ทั้งสอง อัตติรมิซีย์ว่าหะซันศ่อฮีห์ อัลบุคอรีย์และอะห์มัดว่าหะซัน (ตามที่อัตติรมิซีย์ยก) แต่อบูดาวูดยกว่าอะห์มัดว่าในใจยังมีอะไรอยู่"}], "key_rulings_th": ["ผู้ที่ใช้หะดีษนี้ว่า หญิงมีเลือดเสียที่ไม่รู้รอบเดิมและแยกแยะเลือดไม่ได้ ให้ใช้รอบของผู้หญิงส่วนใหญ่ หกหรือเจ็ดวันทุกเดือน นับจากเริ่มเห็นเลือด (ที่รู้จักในมัซฮับฮัมบะลีย์ และทัศนะหนึ่งในชาฟิอีย์)", "หกหรือเจ็ดวันไม่ใช่ให้เลือกตามใจ แต่ให้วินิจฉัยตามผู้หญิงที่ใกล้เคียงกับนางที่สุดในรูปร่าง อายุ และเครือญาติ", "อีกทัศนะว่าให้ใช้รอบของผู้หญิงในครอบครัว เช่น แม่หรือพี่สาว (รายงานหนึ่งจากอะห์มัด และมาลิก)", "ผู้แต่งเห็นว่าหะดีษนี้อ่อน เพราะอิบนุอะกีลรายงานคนเดียว และขัดกับหะดีษในเศาะฮีห์ทั้งสองที่ให้หญิงมีเลือดเสียกลับไปใช้รอบของตนเอง", "หญิงมีเลือดเสียรวมละหมาดสองเวลาด้วยการอาบน้ำครั้งเดียวได้ ถ้าทำได้"], "vocab": [{"ar": "أُسْتَحَاضُ حَيْضَةً", "th": "มีเลือดเสียออก (หัยเฎาะฮ์ ฟัตหะฮ์ที่หาอ์ เป็นมัศดัร)"}, {"ar": "كَبِيرَةً شَدِيدَةً", "th": "มากในปริมาณ และรุนแรงในลักษณะ คือพุ่งแรง"}, {"ar": "رَكْضَةٌ مِنَ الشَّيْطَانِ", "th": "การกระทืบของชัยฏอน คือชัยฏอนหาทางทำให้นางสับสนเรื่องศาสนา เวลาสะอาด และละหมาด"}, {"ar": "فَتَحَيَّضِي", "th": "จงถือตัวเองว่ามีประจำเดือน และทำอย่างที่หญิงมีประจำเดือนทำ"}, {"ar": "اسْتَنْقَأْتِ", "th": "สะอาดหมดจด (ฮัมซะฮ์ที่ไม่ใช่ตามหลักเป็นสำเนียงอาหรับที่ใช้กัน)"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["คือหัมนะฮ์ (ฟัตหะฮ์ที่หาอ์ สุกูนที่มีม) บินติญะห์ช อัลอะสะดียะฮ์ น้องสาวของมารดาผู้ศรัทธาซัยนับ และที่ถูกคือชื่อนี้เป็นชื่อจริงของนาง นางเป็นภรรยาของมุศอับ บินอุมัยร์ ซึ่งเสียชีวิตวันอุหุด แล้วฏ็อลหะฮ์ บินอุบัยดิลลาฮ์ หนึ่งในสิบคนที่ได้รับข่าวดีเรื่องสวรรค์ แต่งงานกับนาง นางให้สัตยาบัน และเข้าร่วมสงครามอุหุด ให้น้ำผู้กระหาย แบกผู้บาดเจ็บและรักษา นางมีเลือดเสียดังในหะดีษนี้ น้องสาวของนางอุมมุหะบีบะฮ์ บินติญะห์ช ภรรยาของอับดุรเราะห์มาน บินเอาฟ์ ก็เช่นกัน อิบนุหะญัรยังระบุว่าลูกสาวทั้งหมดของญะห์ชมีเลือดเสีย และยกจากอัลวากิดีย์ว่าเขาปฏิเสธว่าหัมนะฮ์มีเลือดเสีย แล้วกล่าวว่า \"ความรู้อยู่ที่อัลลอฮ์\""]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["ผู้แต่งเห็นว่าอิบนุหะญัรเรียบเรียงสำนวนเอง ตัดบางคำ และรวมจากสำนวนของอบูดาวูดและอัตติรมิซีย์ อบูดาวูดบันทึก (287) ในหมวดความสะอาด บท \"ผู้ที่ว่า เมื่อประจำเดือนมาให้ละละหมาด\" อัตติรมิซีย์ (128) บท \"หญิงมีเลือดเสียรวมสองละหมาดด้วยการอาบน้ำครั้งเดียว\" อิบนุมาญะฮ์ (627) และอะห์มัด (6/439) ทั้งหมดผ่านอับดุลลอฮ์ บินมุหัมมัด บินอะกีล จากอิบรอฮีม บินมุหัมมัด บินฏ็อลหะฮ์ จากอาของเขา อิมรอน บินฏ็อลหะฮ์ จากแม่ของเขา หัมนะฮ์ บินติญะห์ช", "สายนี้อ่อน อัลบัยฮะกีย์ว่า \"อับดุลลอฮ์ บินมุหัมมัด บินอะกีลรายงานคนเดียว และมีความขัดแย้งในการใช้เป็นหลักฐาน\" ได้กล่าวแล้วว่าอิบนุอุยัยนะฮ์กล่าวว่า \"สี่คนจากกุร็อยช์ที่หะดีษถูกทิ้ง\" และระบุอิบนุอะกีลด้วย อบูดาวูดหลังยกหะดีษยกจากอิมามอะห์มัดว่า \"หะดีษอิบนุอะกีล ในใจฉันยังมีอะไรอยู่\" อิบนุอบีหาติมว่า \"ฉันถามบิดาเรื่องหะดีษที่อิบนุอะกีลรายงาน... เรื่องประจำเดือน เขาถือว่าอ่อน และไม่ถือว่าสายแข็งแรง\" อัดดารุกุฏนีย์และอิบนุมันดะฮ์ก็ว่าอ่อน ตามที่อิบนุเราะญับยก", "ส่วนอัตติรมิซีย์ว่า \"หะดีษหะซันศ่อฮีห์\" และว่า \"ฉันถามมุหัมมัด (อัลบุคอรีย์) เรื่องหะดีษนี้ เขาตอบว่า หะดีษหะซันศ่อฮีห์ และอะห์มัด บินหันบัลก็กล่าวว่า หะดีษหะซันศ่อฮีห์\" (ใน \"อิลัลอัตติรมิซีย์\" ว่า \"หะดีษหะซัน\" ซึ่งตรงกับที่มีใน \"อัลบุลูฆ\") สิ่งที่อัตติรมิซีย์ยกจากอิมามอะห์มัดที่นี่ขัดกับที่อบูดาวูดยก ถ้าชั่งน้ำหนัก ที่อบูดาวูดยกมีน้ำหนักกว่า เพราะเขาเป็นศิษย์ที่อยู่ใกล้อิมามอะห์มัด และมีหนังสือ \"อัลมะสาอิล\" ที่รู้จักกันจากเขา หรือคำของอบูดาวูดอาจมาก่อน เพราะอิบนุเราะญับระบุว่าอิมามอะห์มัดว่าหะดีษอ่อนและไม่ถือตาม แล้วยกจากอบูบักร อัลค็อลลาลว่าอิมามเปลี่ยนมาถือตามหะดีษหัมนะฮ์", "ผู้แต่งชี้ว่า การกล่าวถึงหะดีษและการถือตาม ไม่ได้หมายความว่าตัดสินว่าศ่อฮีห์ ตราบที่นักหะดีษไม่ได้ระบุชัดว่าหะดีษศ่อฮีห์ ในญามิอ์อัตติรมิซีย์ก็มีหะดีษอ่อน แล้วระบุว่านักวิชาการปฏิบัติตาม ซึ่งไม่ได้หมายความว่าศ่อฮีห์", "ผู้แต่งเห็นว่าที่ชัดเจนกว่าคือหะดีษนี้อ่อน เพราะขึ้นอยู่กับอิบนุอะกีล ซึ่งหะดีษของเขาเป็นหะซัน (อัษษะฮะบีย์และคนอื่น) เมื่อไม่ขัดแย้ง แต่เมื่อขัดแย้งก็ไม่ใช่หลักฐาน และหะดีษนี้ขัดกับหะดีษในเศาะฮีห์ทั้งสอง ที่ให้หญิงมีเลือดเสียกลับไปใช้รอบของตนเอง ไม่ใช่รอบของผู้หญิงส่วนใหญ่ดังในหะดีษนี้ การรายงานคนเดียวของอิบนุอะกีลในหุก่มเช่นนี้จึงไม่ทำให้มาก่อนหะดีษในเศาะฮีห์ทั้งสอง นักวิชาการบางคนใช้หะดีษนี้กับหญิงที่เพิ่งเริ่มมีประจำเดือน ซึ่งไม่มีรอบและแยกแยะไม่ได้ ดังจะกล่าว"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ฉันมีเลือดเสีย หัยเฎาะฮ์\" (ฟัตหะฮ์ที่หาอ์) เป็นมัศดัรของ \"หาฎ็อต\" ไม่ใช่ของ \"อิสติหาเฎาะฮ์\" เป็นแบบเดียวกับ \"อันบะตะฮุลลอฮุ นะบาตัน\" และการที่นักวิชาการแยกประจำเดือนกับเลือดเสียในศัพท์วิชาการไม่เป็นปัญหา เพราะคำพูดนี้เป็นไปตามรากภาษา", "\"มากและรุนแรง\" สำนวนของอบูดาวูดและอัตติรมิซีย์ว่า \"มากและรุนแรง\" และในบางฉบับของอัตติรมิซีย์ว่า \"ใหญ่และรุนแรง\" \"มากหรือใหญ่\" คือวันของนางมาก หรือมากในปริมาณ \"รุนแรง\" คือในลักษณะ หมายถึงเลือดของนางพุ่งแรง", "\"นี่เป็นเพียงการกระทืบหนึ่งของชัยฏอน\" เป็นสำนวนของอัตติรมิซีย์ ของอบูดาวูดว่า \"นี่เป็นเพียงการกระทืบหนึ่งในการกระทืบของชัยฏอน\" รากของอัรร็อกฎ์คือการตีด้วยเท้าและการทำร้าย ความหมาย วัลลอฮุอะอ์ลัม คือชัยฏอนพบหนทางที่จะทำให้นางสับสนเรื่องศาสนา เวลาสะอาด และละหมาด จนนางลืมรอบของตน เหมือนเป็นการกระทืบที่นางได้รับ บางทัศนะว่าเป็นความจริง คือชัยฏอนตีนางจนเส้นเลือดแตก", "\"จงถือว่ามีประจำเดือนหกหรือเจ็ดวัน\" ตะหัยยะเฎาะติลมัรอะฮ์ คือนางงดในวันประจำเดือนเพื่อรอให้หมด หมายถึงจงนับตัวเองว่ามีประจำเดือน และทำสิ่งที่หญิงมีประจำเดือนทำ ที่ระบุหกและเจ็ดเพราะเป็นวันประจำเดือนส่วนใหญ่ และ \"หรือ\" ในหะดีษไม่ใช่การให้เลือก แต่เป็นการให้วินิจฉัย โดยพิจารณาผู้หญิงที่ใกล้เคียงกับนางที่สุดในรูปร่าง อายุ และเครือญาติ แล้วถือสภาพของนางเหมือนสภาพของคนเหล่านั้น ถ้าคนที่ใกล้ที่สุดหกวัน ก็หกวัน ถ้าเจ็ดก็เจ็ด", "\"เมื่อเธอสะอาดหมดจด (อิสตันเกาะอ์ติ)\" เป็นเช่นนี้ด้วยฮัมซะฮ์ในอบูดาวูด อัตติรมิซีย์ และคนอื่น และในอัดดารุกุฏนีย์ด้วยยาอ์ (อิสตันกอยติ) ซึ่งพวกเขาว่าตามหลัก เพราะมาจาก นะกิยะ ยันกอ อัลมุฏัรริซีย์ว่าการใส่ฮัมซะฮ์ผิด แต่ผู้แต่งเห็นว่าที่ถูกคือไม่ผิด เพราะการใส่ฮัมซะฮ์ในคำที่ไม่มีฮัมซะฮ์มีมากในภาษาอาหรับ อัสสุยูฏีย์ยกจากยูนุสว่า \"ชาวมักกะฮ์ขัดกับคนอื่น โดยใส่ฮัมซะฮ์ในคำว่า อันนะบีอ์ อัลบะรีอะฮ์ อัซซุรรีอะฮ์ และอัลคอบิอะฮ์\" และอัลเญาฮะรีย์ยกจากอิบนุสสิกกีตว่า หญิงอาหรับคนหนึ่งกล่าวว่า \"ฉันไว้ทุกข์ (เราะษะอ์ตุ) ให้สามีด้วยบทกวี\" โดยใส่ฮัมซะฮ์ และอัลฟัรรออ์ว่า \"บางครั้งความชำนาญภาษาพาให้พวกเขาใส่ฮัมซะฮ์ในคำที่ไม่มีฮัมซะฮ์\"", "\"แล้วอาบน้ำ\" คือหลังหกหรือเจ็ดวันของประจำเดือน \"จงละหมาดยี่สิบสี่หรือยี่สิบสามวัน\" คือตามระยะเวลาประจำเดือนที่นางงด ส่วนที่เหลือของเดือนคือช่วงสะอาด ที่นางละหมาด \"และถือศีลอดและละหมาด\" คือตามที่ต้องการ ทั้งฟัรฎูหรือสุนัต \"และจงทำเช่นนี้เหมือนที่ผู้หญิงมีประจำเดือน\" ในอบูดาวูดว่า \"จงทำเช่นนี้ทุกเดือน\" คือให้ระยะประจำเดือนของเธอทุกเดือนเท่ากับที่ผู้หญิงมีประจำเดือนตามปกติ หกหรือเจ็ด และช่วงสะอาดก็เช่นกัน", "\"ถ้าเธอทำได้ที่จะเลื่อนซุฮ์รี...\" คือถ้าเธอสามารถหลังจากหกหรือเจ็ดวัน ที่จะอาบน้ำครั้งเดียวสำหรับซุฮ์รีและอัศรี และรวมทั้งสองแบบรวมในรูป คือละหมาดซุฮ์รีตอนท้ายเวลา และอัศรีตอนต้นเวลา มัฆริบและอิชาอ์ก็เช่นกัน และอาบน้ำสำหรับศุบห์ ก็จงทำ \"แล้วอาบน้ำเมื่อสะอาด\" เป็นสำนวนของอัตติรมิซีย์ ของอบูดาวูดว่า \"แล้วอาบน้ำและรวมสองละหมาด ซุฮ์รีและอัศรี\"", "\"ท่านกล่าวว่า และนั่นเป็นสิ่งที่ฉันชอบที่สุดในสองทาง\" คือการรวมสองละหมาดด้วยการอาบน้ำครั้งเดียวเป็นทางที่ฉันชอบที่สุด ทางแรกไม่ได้กล่าวถึงชัดในบริบท แต่ในอบูดาวูดและอัตติรมิซีย์ตอนต้นหะดีษว่า \"ฉันจะสั่งเธอสองทาง ทางใดที่เธอทำ ก็พอแก่เธอจากอีกทาง ถ้าเธอทำได้ทั้งสอง เธอรู้ดีที่สุด\" และทางแรกไม่ได้กล่าวชัดในบริบทของทั้งสอง ที่ชัดเจนคือทางแรกคือการอาบน้ำทุกละหมาด เพราะอบูดาวูดกล่าวว่ามีในหะดีษอิบนุอะกีลทั้งสองทาง ซึ่งมีว่า \"ถ้าเธอทำได้ จงอาบน้ำทุกละหมาด มิฉะนั้นจงรวม\" ซึ่งมาจากรายงานของอัลกอสิม บินมับรูรจากอิบนุอะกีล คือเขารายงานทั้งสองทางจากเขา แต่ความหมายนี้ขึ้นอยู่กับว่ารายงานของอัลกอสิม บินมับรูรจากอิบนุอะกีลยืนยันได้หรือไม่"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "หญิงมีเลือดเสียที่ไม่มีรอบและแยกแยะไม่ได้", "points_th": ["ผู้ที่ใช้หะดีษนี้ว่า หญิงมีเลือดเสียที่ไม่รู้รอบประจำเดือนเดิมของตน และเลือดของนางไม่มีการแยกแยะที่ใช้ได้ ที่จะทำให้นางรู้เลือดประจำเดือนจากเลือดเสีย ให้ใช้รอบของผู้หญิงส่วนใหญ่ ประจำเดือนของนางจึงเป็นหกหรือเจ็ดวันจากทุกเดือน เริ่มตั้งแต่ต้นช่วงที่นางเห็นเลือด ส่วนที่เหลือเป็นเลือดเสีย ได้กล่าวแล้วว่านี่เป็นที่รู้จักในมัซฮับฮัมบะลีย์ และเป็นทัศนะหนึ่งในมัซฮับชาฟิอีย์ นี่คือประเภทที่สามของหญิงมีเลือดเสีย คือผู้ที่ไม่มีรอบที่รู้และไม่มีการแยกแยะที่ใช้ได้ สองประเภทแรกได้กล่าวแล้วในหะดีษแรก", "ทัศนะที่สอง: หญิงมีเลือดเสียนี้ใช้รอบของผู้หญิงในครอบครัว เช่น แม่และพี่สาว เป็นรายงานหนึ่งจากอะห์มัด และทัศนะของมาลิก เพราะโดยทั่วไปนางคล้ายกับพวกเขา", "จุดประสงค์คือผู้ที่ใช้หะดีษเป็นหลักฐานถือตามทัศนะแรก และใช้หะดีษกับหญิงที่เพิ่งเริ่มซึ่งไม่มีรอบและการแยกแยะ ทั้งที่การใช้หะดีษเช่นนี้ต้องมีหลักฐาน เพราะท่านรสูล ﷺ ไม่ได้ถามนางเรื่องใดเลย ส่วนผู้ที่ไม่ถือตามเพราะหะดีษอ่อน ก็ให้คำวินิจฉัยตามทัศนะที่สอง ในเรื่องนี้ยังมีทัศนะอื่นอีก ซึ่งอ่อนทั้งหมด"]}], "tags_th": ["อิสติหาเฎาะฮ์", "การรวมละหมาด", "รอบประจำเดือน", "หัมนะฮ์ บินติญะห์ช", "อิบนุอะกีล"]}, {"id": "v2-h141-142", "volume": 2, "bab": "hayd", "topic_ar": "حكم اغتسال المستحاضة ووضوئها لكل صلاة", "topic_th": "ข้อตัดสินการอาบน้ำและการอาบน้ำละหมาดทุกละหมาดของหญิงที่มีเลือดเสีย", "pages": [129, 135], "hadith": [{"no": 141, "matn_ar": "وَعَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا أَنَّ أُمَّ حَبِيبَةَ بِنْتَ جَحْشٍ شَكَتْ إِلَى رَسُولِ اللهِ ﷺ الدَّمَ، فَقَالَ: «امْكُثِي قَدْرَ مَا كَانَتْ تَحْبِسُكِ حَيْضَتُكِ، ثُمَّ اغْتَسِلِي»، فَكَانَتْ تَغْتَسِلُ كُلَّ صَلَاةٍ. رَوَاهُ مُسْلِمٌ.", "translation_th": "และจากอาอิชะฮ์ (ร.ฎ.) ว่า อุมมุหะบีบะฮ์ บินติญะห์ช ร้องเรียนต่อท่านรสูลุลลอฮ์ ﷺ เรื่องเลือด ท่านกล่าวว่า \"จงงด (ละหมาด) ตามระยะเวลาที่ประจำเดือนของเธอเคยกักเธอไว้ แล้วอาบน้ำ\" นางจึงอาบน้ำทุกละหมาด รายงานโดยมุสลิม", "grade_th": "ศ่อฮีห์ (มุสลิม)"}, {"no": 142, "matn_ar": "وَفِي رِوَايَةٍ لِلْبُخَارِيِّ: «وَتَوَضَّئِي لِكُلِّ صَلَاةٍ»، وَهِيَ لِأَبِي دَاوُدَ وَغَيْرِهِ مِنْ وَجْهٍ آخَرَ.", "translation_th": "และในอีกรายงานของอัลบุคอรีย์ว่า \"และจงอาบน้ำละหมาดทุกละหมาด\" และมีในอบูดาวูดและคนอื่นจากอีกสายหนึ่ง", "grade_th": "อยู่ในอัลบุคอรีย์ แต่ผู้แต่งว่า \"ในใจยังมีอะไรอยู่\" เพราะผู้รายงานส่วนใหญ่จากฮิชามไม่ได้กล่าวถึง สายของอบูดาวูดอ่อน"}], "key_rulings_th": ["หญิงมีเลือดเสียต้องอาบน้ำเมื่อพ้นระยะประจำเดือนเดิมของตน", "ผู้แต่งเห็นว่าทัศนะของนักวิชาการส่วนใหญ่ชัดเจนกว่า คือวาญิบอาบน้ำครั้งเดียวเมื่อประจำเดือนหมด เพราะยืนยันในเศาะฮีห์ทั้งสอง และการอาบน้ำทุกละหมาดหรือทุกวันเป็นความลำบากมากที่ศาสนาไม่นำมา", "การที่อุมมุหะบีบะฮ์อาบน้ำทุกละหมาด เป็นการกระทำของนางเอง ท่านนบี ﷺ ไม่ได้สั่ง จึงไม่ใช่หลักฐาน", "เรื่องวุฎูอ์ทุกละหมาด: บางคนว่าวาญิบทุกเวลาละหมาด (หะนะฟีย์ ฮัมบะลีย์) บางคนว่าทุกฟัรฎู (ชาฟิอีย์ ซึ่งผู้แต่งว่าอ่อนที่สุด) บางคนว่าส่งเสริม (มาลิกีย์) ผู้แต่งเห็นว่าทัศนะส่งเสริมมีน้ำหนัก แต่การอาบน้ำละหมาดระมัดระวังกว่าและพ้นภาระกว่า", "ประจำเดือนไม่มีกำหนดวันน้อยที่สุดหรือมากที่สุด (ทัศนะที่ผู้แต่งเลือก อิบนุตัยมียะฮ์) ศาสนาผูกหุก่มกับการเริ่มและการหมดของประจำเดือน"], "vocab": [{"ar": "امْكُثِي", "th": "จงงด (ละหมาด) อยู่"}, {"ar": "قَدْرَ مَا كَانَتْ تَحْبِسُكِ حَيْضَتُكِ", "th": "ตามจำนวนวันที่ประจำเดือนเดิมของเธอเคยกักเธอไว้จากละหมาด"}, {"ar": "سَلَسُ الْبَوْلِ", "th": "ภาวะปัสสาวะเล็ดไม่หยุด"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجهما", "heading_th": "ที่มาของหะดีษ", "points_th": ["หะดีษแรก: มุสลิมบันทึก (334) (63) ผ่านอัลลัยษ์ จากอิบนุชิฮาบ จากอุรวะฮ์ บินอัซซุบัยร์ จากอาอิชะฮ์ สำนวนว่า \"นั่นเป็นเพียงเส้นเลือด จงอาบน้ำแล้วละหมาด\" นางจึงอาบน้ำทุกละหมาด อัลลัยษ์ บินสะอ์ดกล่าวว่า \"อิบนุชิฮาบไม่ได้กล่าวว่าท่านรสูลุลลอฮ์ ﷺ สั่งอุมมุหะบีบะฮ์ บินติญะห์ชให้อาบน้ำทุกละหมาด แต่เป็นสิ่งที่นางทำเอง\" และอิบนุรุมห์กล่าวในรายงานของเขาว่า \"บุตรีของญะห์ช\" ไม่ได้กล่าวว่าอุมมุหะบีบะฮ์ มุสลิมยังบันทึกผ่านญะอ์ฟัร บินเราะบีอะฮ์ จากอิรอก บินมาลิก จากอุรวะฮ์ จากอาอิชะฮ์ด้วยสำนวนที่มีในหนังสือ", "รายงานของอัลบุคอรีย์: บันทึกในหมวดวุฎูอ์ บทการล้างเลือด (228) ผ่านอบูมุอาวิยะฮ์ จากฮิชาม บินอุรวะฮ์ จากบิดา จากอาอิชะฮ์ ในนั้นมีว่า \"แล้วจงอาบน้ำละหมาดทุกละหมาด จนกว่าเวลานั้นจะมาถึง\" ได้กล่าวแล้วในบทสิ่งที่ทำให้วุฎูอ์เสียถึงบริบทของหะดีษ และการยกสำนวนของอัลบุคอรีย์ และการชี้ว่ามุสลิมตัดประโยคนี้โดยเจตนา เพราะหัมมาด บินซัยด์รายงานคนเดียว ตามที่อันนะสาอีย์ระบุในสุนัน", "ได้กล่าวแล้วในบทสิ่งที่ทำให้วุฎูอ์เสียว่า หะดีษเรื่องวุฎูอ์ทุกละหมาดขึ้นอยู่กับฮิชาม บินอุรวะฮ์ มีกลุ่มหนึ่งรายงานจากฮิชาม บางคนกล่าวถึงส่วนเพิ่มนี้ บางคนไม่ ผู้ที่ไม่กล่าวเป็นอิมามที่เชื่อถือได้ ซึ่งสูงกว่าและมากกว่าผู้ที่กล่าว เช่น อิมามมาลิก วะกีอ์ บินอัลญัรรอห์ ซุฮัยร์ บินมุอาวิยะฮ์ ยะห์ยา บินสะอีด อัลก็อฏฏอน และนักจำคนอื่น รวมสิบหกคน และหะดีษของบางคนอยู่ในเศาะฮีห์ทั้งสอง ผู้แต่งจึงว่า \"ในใจยังมีอะไรอยู่เรื่องการยืนยันส่วนเพิ่มนี้ และความรู้อยู่ที่อัลลอฮ์\"", "ส่วนคำของอิบนุหะญัร \"และมีในอบูดาวูดและคนอื่นจากอีกสายหนึ่ง\" ชี้ถึงที่อบูดาวูดบันทึก (298) ผ่านวะกีอ์ จากอัลอะอ์มัช จากหะบีบ บินอบีษาบิต จากอุรวะฮ์ จากอาอิชะฮ์ว่า \"ฟาฏิมะฮ์ บินติอบีหุบัยช์มาหาท่านนบี ﷺ\" แล้วกล่าวเรื่องของนาง และว่า \"แล้วจงอาบน้ำละหมาดทุกละหมาด และละหมาด\" อะห์มัดและอิบนุมาญะฮ์ (624) ก็บันทึก หะดีษนี้อ่อน เพราะหะบีบ บินอบีษาบิตรายงานด้วยคำว่า \"จาก\" และเขาตัดลีสมาก และเพราะมีความขัดแย้งว่าอุรวะฮ์เป็นใคร อบูดาวูดและอะห์มัดไม่ได้ระบุ อิบนุมาญะฮ์ระบุชัดในรายงานว่าอุรวะฮ์ บินอัซซุบัยร์ ถ้าใช่ สายก็ขาด เพราะหะบีบไม่ได้ยินจากเขา ตามที่อัลบุคอรีย์ อะห์มัด ยะห์ยา บินมะอีน และคนอื่นกล่าว ถ้าเป็นอุรวะฮ์ อัลมุซะนีย์ ก็ไม่เป็นที่รู้จัก และหะดีษมีความขัดแย้งว่ามัรฟูอ์หรือเมากูฟ และผู้ที่รายงานแบบเมากูฟเป็นผู้แม่นยำ ตามที่อัดดารุกุฏนีย์กล่าว"]}, {"wajh": 2, "type": "fiqh", "heading_ar": null, "heading_th": "หญิงมีเลือดเสียต้องอาบน้ำกี่ครั้ง", "points_th": ["หะดีษเป็นหลักฐานว่าวาญิบที่หญิงมีเลือดเสียต้องอาบน้ำ เมื่อระยะวันของรอบเดิมผ่านไป นักวิชาการขัดแย้งว่าต้องอาบซ้ำหรือไม่ มีหลายทัศนะ", "ทัศนะแรก: นักวิชาการส่วนใหญ่ ได้แก่ หะนะฟีย์ มาลิกีย์ ชาฟิอีย์ และฮัมบะลีย์ ว่าวาญิบอาบน้ำครั้งเดียวเมื่อประจำเดือนหมด โดยใช้รายงานในเศาะฮีห์ทั้งสองผ่านฮิชาม บินอุรวะฮ์ จากบิดา จากอาอิชะฮ์ ซึ่งมีว่า \"แต่จงละละหมาดตามจำนวนวันที่เธอเคยมีประจำเดือน แล้วอาบน้ำและละหมาด\"", "ทัศนะที่สอง: วาญิบอาบน้ำทุกละหมาด มีรายงานจากอิบนุอุมัร อิบนุซซุบัยร์ และอะฏออ์ บินอบีเราะบาห์ และเป็นทัศนะของอะลีและอิบนุอับบาส (ร.ฎ.) พวกเขาใช้สิ่งที่มีในเรื่องของอุมมุหะบีบะฮ์ บินติญะห์ชในอะห์มัด ผ่านอับดุลอะซีซ บินอบีหาซิม จากยะซีด บินอับดิลลาฮ์ บินอัลฮาด จากอบูบักร (อิบนุมุหัมมัด บินอัมรฺ บินหัซม์) จากอัมเราะฮ์ จากอาอิชะฮ์ ซึ่งมีว่า \"ให้นางรอตามรอบที่นางเคยมีประจำเดือน และละละหมาด แล้วรอสิ่งที่เกิดหลังจากนั้น แล้วอาบน้ำทุกละหมาด และละหมาด\" ผู้รายงานเชื่อถือได้ ยกเว้นอับดุลอะซีซ บินอบีหาซิม ซึ่งอิบนุหะญัรว่า \"ศอดูก ฟะกีฮ์\" แต่การกล่าวถึงการอาบน้ำทุกวันแบบมัรฟูอ์เป็นชาซ ดังจะกล่าว", "ทัศนะที่สาม: อาบน้ำครั้งเดียวสำหรับทุกสองละหมาดที่รวมกัน และอาบครั้งเดียวสำหรับฟัจญ์รี เป็นทัศนะของอะลี อิบนุอับบาส อิบรอฮีม อันนะเคาะอีย์ และกลุ่มหนึ่ง โดยใช้หะดีษหัมนะฮ์ บินติญะห์ชที่กล่าวแล้ว", "ทัศนะที่สี่: อาบน้ำจากซุฮ์รีถึงซุฮ์รี (ทุกวัน) มีรายงานจากอิบนุอุมัรและอะนัส บินมาลิก ตามที่อบูดาวูดยก และเป็นทัศนะของสะอีด บินอัลมุซัยยิบ ตามรายงานจากสุมัยย์ ผู้รับใช้ของอบูบักร ว่าอัลเกาะอ์กออ์ บินหะกีมและซัยด์ บินอัสลัมส่งเขาไปถามสะอีด บินอัลมุซัยยิบว่าหญิงมีเลือดเสียอาบน้ำอย่างไร เขาตอบว่า \"อาบน้ำจากซุฮ์รีถึงซุฮ์รี และอาบน้ำละหมาดทุกละหมาด ถ้าเลือดมาก ก็ใช้ผ้าซับ\" (มาลิก อบูดาวูด สายศ่อฮีห์) แต่อิบนุอับดิลบัรร์ว่า \"มาลิกกล่าวว่า ฉันเห็นว่าผู้ที่เล่าให้ฉันฟังว่าจากซุฮ์รีถึงซุฮ์รี เข้าใจผิด\" หมายความว่าที่ถูกคือ \"จากฏุฮ์รถึงฏุฮ์ร\" ด้วยฏออ์ (คือจากความสะอาดถึงความสะอาด) แทนซออ์ อบูดาวูดยกเรื่องนี้จากมาลิกในสุนัน อิบนุอับดิลบัรร์ว่า \"ไม่ใช่ความเข้าใจผิด เพราะถูกต้องจากสะอีดและเป็นที่รู้จักจากเขา\" แต่ที่สนับสนุนคำของอิมามมาลิกคือที่อิบนุอบีชัยบะฮ์รายงาน ผ่านอัลเกาะอ์กออ์ บินหะกีมว่า \"ฉันถามสะอีด บินอัลมุซัยยิบเรื่องหญิงมีเลือดเสีย เขาตอบว่า ไม่มีใครรู้เรื่องนี้ดีกว่าฉัน เมื่อประจำเดือนมา ให้นางละละหมาด เมื่อหมดไป ให้นางอาบน้ำและล้างเลือด และอาบน้ำละหมาดทุกละหมาด\" (สายศ่อฮีห์) ซึ่งตรงกับทัศนะแรก คือทัศนะของนักวิชาการส่วนใหญ่", "ผู้แต่งกล่าวว่า \"ที่ปรากฏแก่ฉัน วัลลอฮุอะอ์ลัม คือทัศนะของนักวิชาการส่วนใหญ่\" คือวาญิบอาบน้ำเมื่อประจำเดือนหมด เพราะยืนยันในเศาะฮีห์ทั้งสอง ส่วนอื่นไม่ใช่หลักฐานของความวาญิบ อีกทั้งการอาบน้ำทุกละหมาด หรือทุกสองละหมาด หรือทุกวัน มีความลำบากมาก ซึ่งศาสนาไม่นำมา โดยเฉพาะการอาบน้ำในฤดูหนาว ส่วนที่มีในเศาะฮีห์มุสลิมจากหะดีษอาอิชะฮ์เรื่องอุมมุหะบีบะฮ์ บินติญะห์ช \"นางจึงอาบน้ำทุกละหมาด\" ไม่ใช่หลักฐาน เพราะเป็นสิ่งที่นางทำเอง ท่านนบี ﷺ ไม่ได้สั่ง แต่ท่านกล่าวแก่นางว่า \"จงงดตามระยะเวลาที่ประจำเดือนของเธอเคยกักเธอไว้ แล้วอาบน้ำ\" ดังกล่าวแล้ว", "อัชเชากานีย์กล่าวถึงหะดีษเรื่องการอาบน้ำทุกละหมาดว่า \"นักจำกลุ่มหนึ่งระบุชัดว่าใช้เป็นหลักฐานไม่ได้ และหากสมมุติว่าบางบทเสริมกัน ก็ไม่แข็งแรงพอจะขัดกับสิ่งที่อยู่ในเศาะฮีห์ทั้งสองและที่อื่น ที่ท่าน ﷺ สั่งนางให้อาบน้ำเมื่อประจำเดือนหมดเท่านั้น และการละเว้นการอธิบายในเวลาที่จำเป็นไม่อนุญาต ตามที่กำหนดในอุศูล\""]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "วุฎูอ์ทุกละหมาดของหญิงมีเลือดเสีย", "points_th": ["หะดีษเป็นหลักฐานว่าวาญิบที่หญิงมีเลือดเสียต้องอาบน้ำละหมาดทุกเวลาละหมาด และนางละหมาดด้วยวุฎูอ์นั้นได้ทั้งฟัรฎูและสุนัตตามต้องการ ตราบที่ยังไม่หมดเวลา โดยอิงหลักว่าการออกของเลือดเสียเป็นสิ่งที่ทำให้วุฎูอ์เสีย หะนะฟีย์และฮัมบะลีย์กล่าวเช่นนี้ พวกเขากล่าวว่า \"ทุกละหมาด\" ในหะดีษนี้หมายถึงเวลาของทุกละหมาด เพราะมีการใช้คำว่าละหมาดหมายถึงเวลา เช่นในหะดีษญาบิรที่กล่าวแล้วในบทตะยัมมุม \"ชายคนใดในประชาชาติของฉันที่เวลาละหมาดมาถึง ก็จงละหมาด\" คือเวลาละหมาดมาถึง", "ทัศนะที่สอง: วาญิบอาบน้ำละหมาดทุกฟัรฎู ไม่ว่าละหมาดในเวลาหรือชดใช้ ส่วนสุนัตละหมาดด้วยความสะอาดนั้นได้ตามต้องการ เป็นมัซฮับชาฟิอีย์ โดยใช้คำว่า \"และจงอาบน้ำละหมาดทุกละหมาด\" โดยตีความละหมาดในหะดีษว่าเป็นฟัรฎู ไม่ใช่สุนัต ผู้แต่งเห็นว่าการแยกนี้ไม่มีหลักฐาน และรูปความหมายกว้างในหะดีษไม่ยอมให้แยก และหลักเดิมในศาสนาคือฟัรฎูและสุนัตเท่ากันในเรื่องความสะอาด อิบนุหัซม์จึงกล่าวว่า \"เป็นสิ่งที่เป็นไปไม่ได้ในศาสนา ที่ไม่เคยมีตัวบท และไม่มีหลักฐานว่าคนหนึ่งจะสะอาดถ้าต้องการละหมาดสุนัต และมีฮะดัษไม่สะอาดในเวลานั้นเอง ถ้าต้องการละหมาดฟัรฎู นี่เป็นสิ่งที่ไม่มีความลับ มีแต่สะอาดหรือมีฮะดัษ\" ผู้แต่งจึงเห็นว่านี่เป็นทัศนะที่อ่อนที่สุด", "ทัศนะที่สาม: ไม่วาญิบอาบน้ำละหมาด แต่ส่งเสริม เพราะเลือดเสียไม่ใช่ฮะดัษที่ทำให้วุฎูอ์เสีย เป็นทัศนะของมาลิกีย์ อบูดาวูดยกด้วยสายของเขาจากเราะบีอะฮ์ บินอบีอับดิรเราะห์มาน และเป็นทัศนะของอิกริมะฮ์ หลักฐานคือที่อิบนุอับดิลบัรร์กล่าวว่า ผู้ที่มีฮะดัษต่อเนื่อง เช่น เลือดเสียและปัสสาวะเล็ด ฮะดัษของเขาไม่หมดด้วยวุฎูอ์ จึงเป็นการส่งเสริมสำหรับเขา ไม่ใช่วาญิบ", "ผู้แต่งเห็นว่าทัศนะนี้มีน้ำหนัก เพราะเลือดเสียเกิดซ้ำในสมัยท่านนบี ﷺ ถ้าวุฎูอ์วาญิบ ท่านรสูล ﷺ ก็จะไม่เงียบ และจะสั่งแต่ละคน และจะมีการรายงานที่ถูกต้องเหมือนที่รายงานคำสั่งให้อาบน้ำ และทัศนะว่าวาญิบอาบน้ำละหมาดทุกละหมาดไม่พ้นความลำบาก แต่ผู้ที่ให้คำวินิจฉัยเช่นนั้นจากนักวิชาการทั้งรุ่นก่อนและรุ่นหลัง เห็นว่ารายงานเรื่องวุฎูอ์เสริมกัน และวุฎูอ์ระมัดระวังกว่าและพ้นภาระกว่า และนางละหมาดด้วยวุฎูอ์นั้นได้ทั้งฟัรฎูและสุนัตตามต้องการ"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "ประจำเดือนไม่มีกำหนดวันน้อยสุดหรือมากสุด", "points_th": ["หะดีษอาอิชะฮ์ (ร.ฎ.) เป็นหลักฐานของทัศนะที่ผู้แต่งเลือก คือประจำเดือนไม่มีกำหนดวันน้อยที่สุดหรือมากที่สุด เพราะท่านรสูล ﷺ ผูกหุก่มประจำเดือนกับการเริ่ม และผูกหุก่มความสะอาดกับการหมด ดังในบางรายงาน ถ้ามีกำหนดที่ไม่เกินนั้น ท่านก็จะอธิบายแก่นางและแก่ประชาชาติโดยทั่วไป เพราะมีหุก่มศาสนาที่เกี่ยวข้องมาก ที่สำคัญที่สุดคือละหมาดและการถือศีลอด", "อิบนุลมุนซิรยกทัศนะนี้จากนักวิชาการกลุ่มหนึ่ง และอันนะวะวีย์ยกจากอัดดาริมีย์ เป็นทัศนะที่อิบนุตัยมียะฮ์เลือก เขากล่าวว่า \"ในนั้นมีคำว่าประจำเดือน ซึ่งอัลลอฮ์ทรงผูกหุก่มมากมายในอัลกุรอานและซุนนะฮ์ แต่ไม่ได้กำหนดน้อยสุดหรือมากสุด หรือช่วงสะอาดระหว่างสองประจำเดือน ทั้งที่ประชาชาติประสบเรื่องนี้ทั่วไปและต้องการมัน และภาษาก็ไม่แยกระหว่างจำนวนหนึ่งกับอีกจำนวนหนึ่ง ผู้ใดกำหนดขอบเขตในเรื่องนี้ ก็ขัดกับอัลกุรอานและซุนนะฮ์\"", "ที่แสดงความอ่อนของทัศนะที่กำหนดขอบเขต คือความขัดแย้งและความสับสนของทัศนะเหล่านั้น ซึ่งบ่งว่าในเรื่องนี้ไม่มีหลักฐานที่ต้องยึด แต่เป็นทัศนะที่ตั้งอยู่บนการวินิจฉัย ซึ่งอาจผิดหรือถูก"]}], "tags_th": ["อิสติหาเฎาะฮ์", "ฆุสล์", "วุฎูอ์", "อุมมุหะบีบะฮ์ บินติญะห์ช", "ระยะประจำเดือน"]}, {"id": "v2-h143", "volume": 2, "bab": "hayd", "topic_ar": "حكم الصفرة والكدرة", "topic_th": "ข้อตัดสินของเหลวสีเหลืองและสีขุ่น", "pages": [136, 139], "hadith": [{"no": 143, "matn_ar": "وَعَنْ أُمِّ عَطِيَّةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: كُنَّا لَا نَعُدُّ الْكُدْرَةَ وَالصُّفْرَةَ بَعْدَ الطُّهْرِ شَيْئًا. رَوَاهُ الْبُخَارِيُّ، وَأَبُو دَاوُدَ وَاللَّفْظُ لَهُ.", "translation_th": "และจากอุมมุอะฏิยยะฮ์ (ร.ฎ.) กล่าวว่า พวกเราไม่นับสีขุ่นและสีเหลืองหลังจากสะอาดแล้วว่าเป็นอะไรเลย รายงานโดยอัลบุคอรีย์และอบูดาวูด สำนวนเป็นของอบูดาวูด", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์ โดยไม่มีคำว่า \"หลังจากสะอาด\" ซึ่งมีในอบูดาวูด และชื่อบทของอัลบุคอรีย์สอดคล้อง)"}], "key_rulings_th": ["สีขุ่นและสีเหลืองหลังจากสะอาดแล้วไม่ใช่ประจำเดือน ไม่ต้องสนใจ", "แต่ถ้าเกิดระหว่างมีประจำเดือน หรือต่อเนื่องกับประจำเดือนก่อนสะอาด ก็เป็นประจำเดือน มีหุก่มประจำเดือน (หะนะฟีย์ ฮัมบะลีย์ และทัศนะหนึ่งของมาลิกีย์)", "คำว่า \"พวกเรา...\" เมื่อเศาะหาบะฮ์กล่าวและเชื่อมกับสมัยท่านนบี ﷺ อยู่ในหุก่มมัรฟูอ์ตามทัศนะที่ถูกต้อง", "สัญญาณความสะอาดคือของเหลวสีขาว (อัลก็อศเศาะฮ์ อัลบัยฎออ์) หรือความแห้ง โดยใส่สำลีแล้วออกมาขาวไม่มีสีเหลืองหรือขุ่น"], "vocab": [{"ar": "الْكُدْرَةُ", "th": "สีแดงอมดำ คือเลือดขุ่นระหว่างเหลืองกับดำ"}, {"ar": "الصُّفْرَةُ", "th": "สีแดงอมขาว คือเห็นเลือดเป็นสีเหลืองเหมือนน้ำเหลืองจากแผล"}, {"ar": "بَعْدَ الطُّهْرِ", "th": "หลังเลือดหยุดและเห็นสัญญาณความสะอาด"}, {"ar": "الْقَصَّةُ الْبَيْضَاءُ", "th": "ของเหลวสีขาวที่มดลูกขับออกมาเมื่อประจำเดือนหมด (เปรียบกับปูนขาว)"}, {"ar": "الدُّرْجَةُ … الْكُرْسُفُ", "th": "ภาชนะหรือผ้าห่อ … สำลี"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["คืออุมมุอะฏิยยะฮ์ นุสัยบะฮ์ (ฎ็อมมะฮ์ที่นูน) บินติอัลหาริษ อัลอันศอรียะฮ์ เป็นที่รู้จักทั้งด้วยชื่อและชื่อเรียก รายงานหะดีษจากท่านนบี ﷺ หลายบท และออกรบกับท่านเจ็ดครั้ง อยู่ดูแลที่พักของทหาร ตามที่มุสลิมรายงานจากนาง นางเป็นหนึ่งในผู้ที่อาบน้ำศพผู้หญิงในสมัยท่านนบี ﷺ และหุก่มการอาบน้ำศพจำนวนมากรับมาจากนาง อิบนุอับดิลบัรร์ว่า \"หะดีษของนางเป็นหลักในเรื่องการอาบน้ำศพ เศาะหาบะฮ์และนักวิชาการตาบิอีนกลุ่มหนึ่งที่บัศเราะฮ์รับเรื่องการอาบน้ำศพจากนาง\" ผู้ที่รายงานจากนางได้แก่ มุหัมมัด บินสีรีน น้องสาวของเขาหัฟเศาะฮ์ และคนอื่น"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึก (326) ในหมวดประจำเดือน บทสีเหลืองและสีขุ่นนอกวันประจำเดือน อบูดาวูด (308) อันนะสาอีย์ (1/186) และอิบนุมาญะฮ์ ผ่านอิสมาอีล บินอุลัยยะฮ์ จากอัยยูบ จากมุหัมมัด บินสีรีน จากอุมมุอะฏิยยะฮ์ นี่เป็นสำนวนของอบูดาวูดตามที่อิบนุหะญัรกล่าว สำนวนของอัลบุคอรีย์คือ \"พวกเราไม่นับสีขุ่นและสีเหลืองว่าเป็นอะไรเลย\" แต่ชื่อบทของอัลบุคอรีย์สอดคล้องกับรายงานของอบูดาวูด ซึ่งบ่งว่าเขาเห็นว่าส่วนเพิ่ม \"หลังจากสะอาด\" ถูกต้อง อบูดาวูดยังบันทึกผ่านหัมมาด บินสะละมะฮ์ จากเกาะตาดะฮ์ จากอุมมุลฮุซัยล์ หัฟเศาะฮ์ บินติสีรีน จากอุมมุอะฏิยยะฮ์ด้วยสำนวนข้างต้น", "มีความขัดแย้งจากอัยยูบ มะอ์มัรรายงานจากเขา จากอิบนุสีรีน จากอุมมุอะฏิยยะฮ์ (มุศ็อนนัฟอับดุรร็อซซาก และผ่านเขาอิบนุมาญะฮ์) และอิสมาอีลรายงานจากเขาดังกล่าวแล้ว แต่วุฮัยบ์ บินคอลิดรายงานต่างไป จากอัยยูบ จากหัฟเศาะฮ์ บินติสีรีน จากอุมมุอะฏิยยะฮ์ว่า \"พวกเราไม่นับสีเหลืองและสีขุ่นว่าเป็นอะไรเลย\" (อิบนุมาญะฮ์ 647) อิบนุหะญัรว่า \"การที่อัลบุคอรีย์เห็นว่ารายงานของอิสมาอีลถูกต้อง มีน้ำหนักกว่า เพราะมะอ์มัรรายงานตรงกัน และอิสมาอีลจำหะดีษของอัยยูบได้ดีกว่าคนอื่น และอาจเป็นไปได้ว่าอัยยูบได้ยินจากทั้งสอง\" คือจากอิบนุสีรีนและจากหัฟเศาะฮ์ น้องสาวของเขา"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"พวกเรา...\" รูปนี้อยู่ในหุก่มมัรฟูอ์ เมื่อเศาะหาบะฮ์กล่าวและเชื่อมกับสมัยท่านนบี ﷺ ตามทัศนะที่ถูกต้อง เพราะคำของนางตีความว่าเป็นสมัยท่านนบี ﷺ อัลหากิม อบูอับดิลลาฮ์ ระบุแน่นอน และเป็นทัศนะของนักวิชาการส่วนใหญ่ เพราะความหมายตามตัวบทคือท่านนบี ﷺ รู้และยอมรับ", "\"อัลกุดเราะฮ์\" (ฎ็อมมะฮ์ที่กาฟ สุกูนที่ดาล แล้วรออ์ฟัตหะฮ์) คือสีแดงอมดำ หมายถึงเลือดขุ่นระหว่างสีเหลืองกับสีดำ \"อัศศุฟเราะฮ์\" (ฎ็อมมะฮ์ที่ศอด สุกูนที่ฟาอ์) คือสีแดงอมขาว หมายถึงเห็นเลือดเป็นสีเหลืองเหมือนน้ำเหลืองจากแผล", "\"หลังจากสะอาด\" คือหลังเลือดหยุดและเห็นความสะอาด ความสะอาดมีสองแบบ (1) เห็นอัลก็อศเศาะฮ์ อัลบัยฎออ์ คือน้ำขาวที่มดลูกขับออกมาเมื่อประจำเดือนหมด ตามที่อิบนุหะญัรกล่าว อัลก็อศศ์คือปูนขาวในภาษาชาวหิญาซ เปรียบความสะอาดกับมันเพราะความขาว อิบนุหะญัรยกจากมาลิกว่า \"ฉันถามผู้หญิงเรื่องนี้ เป็นสิ่งที่พวกนางรู้จักเมื่อสะอาด\" (2) ความแห้ง คือรู้สึกว่าสะอาดเมื่อแห้ง สัญญาณคือใส่สำลีแล้วออกมาขาว ไม่มีสีเหลืองหรือขุ่น ผู้หญิงต่างกันในเรื่องนี้ ส่วนใหญ่ใช้สัญญาณแรก บางคนใช้สัญญาณที่สอง และอัลก็อศเศาะฮ์ อัลบัยฎออ์บ่งชัดกว่าความแห้ง", "\"อะไรเลย\" เป็นกรรมของ \"นะอุดด์\" คือ เราไม่ถือว่าสีเหลืองและสีขุ่นหลังสะอาดเป็นประจำเดือน ที่ผู้หญิงจะงดละหมาด ถือศีลอด และอิบาดะฮ์อื่น"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "สีเหลืองและสีขุ่นหลังสะอาด", "points_th": ["หะดีษเป็นหลักฐานว่าสีขุ่นและสีเหลืองหลังสะอาดไม่ใช่ประจำเดือน ไม่ต้องสนใจ ส่วนถ้าเกิดระหว่างประจำเดือน หรือต่อเนื่องกับประจำเดือนก่อนสะอาด ก็เป็นประจำเดือน มีหุก่มประจำเดือน นี่เป็นมัซฮับหะนะฟีย์และฮัมบะลีย์ และทัศนะหนึ่งในมัซฮับมาลิกีย์ บางคนถึงกับว่าเป็นมัซฮับ", "หลักฐานจากหะดีษของบทคือคำของอุมมุอะฏิยยะฮ์ \"หลังจากสะอาด\" ซึ่งบ่งว่าก่อนสะอาดเป็นประจำเดือน และในรายงานของอัดดาริมีย์ว่า \"พวกเราไม่ถือสีเหลืองและสีขุ่นหลังอาบน้ำว่าเป็นอะไร\" (อันนะวะวีย์ใน \"อัลคุลาเศาะฮ์\" ว่าสายศ่อฮีห์)", "อิบนุหะญัรกล่าวถึงชื่อบทของอัลบุคอรีย์ \"บทสีเหลืองและสีขุ่นนอกวันประจำเดือน\" ว่า \"เขาชี้ถึงการรวมระหว่างหะดีษอาอิชะฮ์ที่กล่าวแล้ว (จนกว่าพวกเธอจะเห็นอัลก็อศเศาะฮ์ อัลบัยฎออ์) กับหะดีษอุมมุอะฏิยยะฮ์ในบทนี้ ว่าหะดีษอาอิชะฮ์ใช้กับกรณีที่เห็นสีเหลืองและสีขุ่นในวันประจำเดือน ส่วนนอกวันประจำเดือนเป็นไปตามที่อุมมุอะฏิยยะฮ์กล่าว\"", "หะดีษอาอิชะฮ์ที่เขาชี้ถึงคือที่มาลิกรายงานจากอัลเกาะมะฮ์ บินอบีอัลเกาะมะฮ์ จากแม่ของเขา ผู้รับใช้ของอาอิชะฮ์ มารดาผู้ศรัทธา ว่า \"ผู้หญิงส่งดุรญะฮ์ที่มีสำลีไปให้อาอิชะฮ์ มารดาผู้ศรัทธา ซึ่งมีสีเหลืองจากเลือดประจำเดือน นางกล่าวแก่พวกนางว่า อย่ารีบจนกว่าจะเห็นอัลก็อศเศาะฮ์ อัลบัยฎออ์\" (อัลบุคอรีย์ยกแบบตะอ์ลีกด้วยรูปยืนยันในหมวดประจำเดือน บทการเริ่มและการหมดของประจำเดือน อิบนุหะญัรไม่ได้วิจารณ์ใน \"อัลฟัตห์\" และอันนะวะวีย์ว่าศ่อฮีห์ใน \"อัลมัจญ์มูอ์\") หลักฐานคืออาอิชะฮ์ (ร.ฎ.) ถือว่าสีเหลืองในช่วงรอบประจำเดือนเป็นประจำเดือน และกล่าวว่า \"อย่ารีบจนกว่าจะเห็นอัลก็อศเศาะฮ์ อัลบัยฎออ์\" คือสัญญาณความสะอาด", "อัลก็อศเศาะฮ์ อัลบัยฎออ์ (ฟัตหะฮ์ที่กอฟ ชัดดะฮ์ที่ศอด) คือน้ำขาวที่มดลูกขับออกมาเมื่อประจำเดือนหมด \"อัดดิรอญะฮ์\" (กัสเราะฮ์ที่ดาล ฟัตหะฮ์ที่รออ์และญีม) พหูพจน์ของ \"ดุรจ์\" บางทัศนะว่า \"อัดดุรญะฮ์\"
