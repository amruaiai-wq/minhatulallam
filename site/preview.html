ล่าวว่า \"มีผู้รายงานจากอาศิมกว่าสามสิบคนจากบรรดาอิมาม และเป็นที่รู้จักจากหะดีษของอาศิม\" อัตติรมิซีย์ยกหะดีษนี้ฉบับเต็มไว้ในหมวดดุอาอ์", "หะดีษอะลี: มุสลิมบันทึกในหมวดฏอฮาเราะฮ์ (276) ผ่านชุร็อยห์ บินฮานิอ์ ว่า ฉันไปถามอาอิชะฮ์เรื่องการเช็ดรองเท้าหุ้มข้อ นางกล่าวว่า จงไปถามอิบนุอบีฏอลิบ เพราะเขาเคยเดินทางกับท่านรสูลุลลอฮ์ ﷺ เราจึงไปถามเขา เขากล่าวว่า... โดยไม่มีคำว่า \"หมายถึงในการเช็ดรองเท้าหุ้มข้อ\" ซึ่งแทรกเข้ามา ที่ชัดคือเป็นคำของอิบนุหะญัร"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظهما", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"เคยสั่งเรา\" คืออนุญาตให้เรา คำสั่งในที่นี้หมายถึงการอนุญาต ไม่ใช่ความหมายเดิมคือวาญิบ สิ่งที่เปลี่ยนความหมายคืออิจญ์มาอ์ว่าการเช็ดเป็นสิ่งอนุญาต ไม่ใช่วาญิบ", "\"เมื่อเราเป็นผู้เดินทาง\" (สัฟร็อน) อ่านสระอะแล้วสุกูน เป็นคำนามรวมของผู้เดินทาง ไม่ใช่พหูพจน์", "\"เว้นแต่เพราะญะนาบะฮ์\" คือให้ถอด แม้ยังไม่ครบสามวัน ญะนาบะฮ์คือการหลั่งอสุจิ ได้ชื่อนี้เพราะอสุจิห่างจากที่และเคลื่อนออก รากศัพท์แปลว่าความห่าง", "\"แต่เพราะอุจจาระ ปัสสาวะ และการนอน\" คำว่า \"แต่\" ใช้แก้ความเข้าใจ เพราะก่อนหน้ามีการปฏิเสธและการยกเว้น ความหมายคือ เราไม่ถอดเพราะอุจจาระ ปัสสาวะ และการนอน เว้นแต่ครบกำหนด เพื่อให้รู้ว่าข้อผ่อนผันมีเฉพาะฮะดัษประเภทนี้ ไม่รวมญะนาบะฮ์ ในสำนวนของอันนะสาอีย์: \"ท่านรสูลุลลอฮ์ ﷺ เคยสั่งเรา เมื่อเราเป็นผู้เดินทาง ให้เช็ดรองเท้าหุ้มข้อ และไม่ถอดสามวัน เพราะอุจจาระ ปัสสาวะ และการนอน เว้นแต่เพราะญะนาบะฮ์\"", "\"กำหนด\" (ญะอะละ) คือบัญญัติและกำหนดเวลา"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "การเช็ดมีกำหนดเวลา", "points_th": ["ทั้งสองหะดีษบ่งว่าการเช็ดรองเท้าหุ้มข้อมีกำหนดเวลา ไม่ได้ไม่มีขอบเขต ผู้เดินทางเช็ดสามวันสามคืน ผู้อยู่บ้านหนึ่งวันหนึ่งคืน เป็นทัศนะของนักวิชาการส่วนใหญ่จากเศาะหาบะฮ์ ตาบิอีน และรุ่นหลัง", "การแยกผู้เดินทางกับผู้อยู่บ้านคำนึงถึงสภาพการเดินทางและความยากลำบาก ผู้เดินทางจึงต้องการเวลามากกว่า แสดงว่าศาสนาอิสลามตั้งอยู่บนความง่ายและการขจัดความยุ่งยาก ทั้งในหุก่มทั่วไปและในอิบาดะฮ์โดยเฉพาะ", "การกำหนดเวลานี้คือเงื่อนไขที่สองของการเช็ดที่ใช้ได้ คือเช็ดในเวลาที่ศาสนากำหนด เงื่อนไขแรกคือสวมขณะมีความสะอาด ดังในหะดีษอัลมุฆีเราะฮ์"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "เฉพาะฮะดัษเล็ก และรองเท้าต้องสะอาด", "points_th": ["หะดีษเศาะฟวานบ่งว่าการเช็ดรองเท้าหุ้มข้อใช้เฉพาะฮะดัษเล็ก เช่น การนอน ปัสสาวะ และอุจจาระ ส่วนฮะดัษใหญ่ เช่น ญะนาบะฮ์ ไม่ใช้การเช็ด ถ้าเกิดญะนาบะฮ์ขณะสวมรองเท้า ต้องถอดแล้วล้างเท้า แม้อยู่ในกำหนดเวลา นี่คือเงื่อนไขที่สาม คือการเช็ดใช้กับฮะดัษเล็ก ไม่ใช่ญะนาบะฮ์หรือสิ่งที่ทำให้ต้องอาบน้ำ เงื่อนไขทั้งสามนี้ได้จากหะดีษในบทนี้", "เหลือเงื่อนไขที่สี่ คือรองเท้าหุ้มข้อหรือสิ่งที่มีความหมายเดียวกัน เช่น ถุงเท้า ต้องสะอาด ถ้าเป็นนะญิสก็เช็ดไม่ได้ เพราะมีรายงานที่ถูกต้องว่าท่านรสูลุลลอฮ์ ﷺ ถอดรองเท้าระหว่างละหมาด เมื่อญิบรีลบอกว่ามีสิ่งสกปรกอยู่"]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "เริ่มนับเวลาเมื่อใด", "points_th": ["ทัศนะที่หนึ่ง: กำหนดเวลาเริ่มจากการเช็ดครั้งแรก ไม่ใช่จากการสวม และไม่ใช่จากฮะดัษหลังสวม เพราะคำว่า \"ผู้อยู่บ้านเช็ดหนึ่งวันหนึ่งคืน และผู้เดินทางเช็ดสามวัน\" ซึ่งเกือบระบุชัดว่าเวลาเริ่มจากการเช็ด และไม่อาจเรียกเขาว่าผู้เช็ด นอกจากด้วยการเช็ดจริง เป็นทัศนะของอัลเอาซาอีย์ อบูเษาร์ และอีกรายงานจากอิมามอะห์มัด อิบนุลมุนซิรเลือก อันนะวะวีย์ว่า \"เป็นทัศนะที่หลักฐานมีน้ำหนัก\"", "อับดุรร็อซซากบันทึกจากอบูอุษมาน อันนะฮ์ดีย์ว่า \"ฉันอยู่ด้วยเมื่อสะอ์ด์และอิบนุอุมัรโต้แย้งกันต่อหน้าอุมัรเรื่องการเช็ดรองเท้าหุ้มข้อ อุมัรกล่าวว่า ให้เช็ดบนมันจนถึงเวลาเดียวกันของวันและคืนของเขา\" (สายรายงานศ่อฮีห์ตามเงื่อนไขของอัลบุคอรีย์และมุสลิม ตามที่อัลอัลบานีย์กล่าว) ตามทัศนะนี้ ผู้อยู่บ้านเช็ดได้ยี่สิบสี่ชั่วโมงนับจากการเช็ดครั้งแรก ผู้เดินทางเจ็ดสิบสองชั่วโมง โดยนับตามเวลา ไม่ใช่จำนวนละหมาด", "ทัศนะที่สอง: กำหนดเวลาเริ่มจากฮะดัษหลังสวม ถ้ามีฮะดัษก็เริ่มนับ เป็นทัศนะของอบูหะนีฟะฮ์ อัชชาฟิอีย์ อะห์มัด และนักวิชาการมาลิกีย์ที่เห็นว่าการเช็ดมีกำหนดเวลา เช่น อิบนุอับดิลบัรร์ และชาวมะดีนะฮ์บางท่าน พวกเขาว่า การเช็ดเป็นอิบาดะฮ์ที่มีกำหนดเวลา จึงนับจากเวลาที่ทำได้ และหลังฮะดัษคือเวลาที่เช็ดได้ จึงเป็นจุดเริ่มของกำหนดเวลา", "ผู้แต่งเห็นว่าทัศนะแรกมีน้ำหนักกว่า เพราะสอดคล้องกับหะดีษที่กำหนดเวลาด้วยการเช็ด จึงต้องเริ่มจากการเช็ด สนับสนุนด้วยฟัตวาของอุมัร (ร.ฎ.) และเพราะเวลาก่อนเช็ดและหลังฮะดัษเป็นเวลาที่ละหมาดไม่ได้ เมื่อเช็ดแล้วละหมาดจึงใช้ได้ การนับเวลาจึงควรเริ่มจากเวลาที่ละหมาดได้"]}], "tags_th": ["เช็ดรองเท้าหุ้มข้อ", "กำหนดเวลา", "ผู้เดินทาง", "ญะนาบะฮ์", "ฮะดัษเล็ก"]}, {"id": "v1-h063", "volume": 1, "bab": "khuffayn", "topic_ar": "جواز المسح على العمامة", "topic_th": "อนุญาตให้เช็ดบนผ้าโพกศีรษะ", "pages": [262, 267], "hadith": [{"no": 63, "matn_ar": "عَنْ ثَوْبَانَ رَضِيَ اللهُ عَنْهُ قَالَ: بَعَثَ رَسُولُ اللهِ ﷺ سَرِيَّةً، فَأَمَرَهُمْ أَنْ يَمْسَحُوا عَلَى الْعَصَائِبِ؛ يَعْنِي: الْعَمَائِمَ، وَالتَّسَاخِينِ؛ يَعْنِي: الْخِفَافَ. رَوَاهُ أَحْمَدُ، وَأَبُو دَاوُدَ، وَصَحَّحَهُ الْحَاكِمُ.", "translation_th": "จากเษาบาน (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ ส่งกองทหารหน่วยหนึ่งออกไป แล้วสั่งให้พวกเขาเช็ดบนอะศออิบ คือผ้าโพกศีรษะ และบนตะสาคีน คือรองเท้าหุ้มข้อ รายงานโดยอะห์มัดและอบูดาวูด และอัลหากิมระบุว่าศ่อฮีห์", "grade_th": "ศ่อฮีห์ (อัลหากิม อัซซะฮะบีย์เห็นด้วย) มีผู้วิจารณ์ว่าสายขาดระหว่างรอชิดกับเษาบาน แต่อัลบุคอรีย์ยืนยันว่ารอชิดได้ยินจากเษาบาน"}], "key_rulings_th": ["อนุญาตให้เช็ดบนรองเท้าหุ้มข้อและบนผ้าโพกศีรษะ ทั้งในการเดินทางและขณะอยู่บ้าน", "เช็ดเฉพาะบนผ้าโพกโดยไม่เช็ดศีรษะเลยก็ใช้ได้ (อะห์มัด อัลเอาซาอีย์ อิสหาก อบูเษาร์ ซอฮิรียะฮ์) ถ้าส่วนหน้าของศีรษะโผล่ ควรเช็ดด้วย", "ผู้แต่งเห็นว่าการพันใต้คาง (ตะห์นีก) ไม่ใช่เงื่อนไขของผ้าโพก ตามที่อิบนุตัยมียะฮ์เลือก แต่ผ้าโพกที่ถอดง่ายและไม่มีอันตราย ไม่เช็ดดีกว่า", "ถุงเท้าและผ้าพันเท้ามีหุก่มเหมือนรองเท้าหุ้มข้อ เพราะคำว่า \"ตะสาคีน\" ครอบคลุมทุกสิ่งที่ทำให้เท้าอุ่น", "ผู้แต่งเห็นว่าการกำหนดเวลาในการเช็ดผ้าโพกมีน้ำหนักและรอบคอบกว่า แม้ทัศนะที่ไม่กำหนดเวลาก็แข็งแรง"], "vocab": [{"ar": "سَرِيَّة", "th": "กองทหารหน่วยย่อย ห้าคนถึงสามร้อยคน บ้างว่าถึงสี่ร้อย"}, {"ar": "الْعَصَائِب", "th": "ผ้าโพกศีรษะ (พหูพจน์ของ عِصَابَة) คือทุกสิ่งที่พันศีรษะ เช่น ผ้าโพกหรือผ้าพัน"}, {"ar": "التَّسَاخِين", "th": "ทุกสิ่งที่ทำให้เท้าอุ่น เช่น รองเท้าหุ้มข้อ ถุงเท้า ในหะดีษอธิบายว่ารองเท้าหุ้มข้อ"}, {"ar": "اللَّفَائِف", "th": "ผ้าพันเท้า"}, {"ar": "التَّحْنِيك", "th": "การพันผ้าโพกส่วนหนึ่งใต้คาง"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อบูอับดิลลาฮ์ เษาบาน บินบุจญ์ดุด จากชาวอัสสะรอฮ์ (ดินแดนระหว่างมักกะฮ์กับเยเมน) เศาะหาบะฮ์ที่มีชื่อเสียง เคยถูกจับเป็นเชลย ท่านรสูลุลลอฮ์ ﷺ ซื้อและปลดปล่อยเขา เขาติดตามท่านนบี ﷺ ทั้งขณะอยู่บ้านและเดินทาง จนท่านเสียชีวิต และรายงานหะดีษจากท่าน", "จากนั้นย้ายไปชาม พักที่อัรร็อมละฮ์ แล้วย้ายไปหิมศ์ และอยู่ที่นั่นจนเสียชีวิตปี ฮ.ศ. 54"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อะห์มัด อบูดาวูด (146) และอัลหากิม บันทึกผ่านยะห์ยา บินสะอีด จากเษาร์ บินยะซีด จากรอชิด บินสะอ์ด์ จากเษาบาน ว่า \"ท่านรสูลุลลอฮ์ ﷺ ส่งกองทหารหน่วยหนึ่ง แล้วพวกเขาเจออากาศหนาว เมื่อกลับมาหาท่าน ท่านสั่งให้เช็ดบนผ้าโพกและรองเท้าหุ้มข้อ\" นี่เป็นสำนวนของอบูดาวูด ซึ่งระบุเรื่องความหนาว อะห์มัดและอัลหากิมก็เช่นกัน ในรายงานของอะห์มัด \"เมื่อพวกเขากลับมาหาท่านนบี ﷺ พวกเขาบ่นถึงความหนาวที่ประสบ\"", "อัลหากิมว่าศ่อฮีห์ และว่า \"ศ่อฮีห์ตามเงื่อนไขของมุสลิม\" อัซซะฮะบีย์เห็นด้วย แต่อัซซัยละอีย์แย้งว่า \"มีข้อพิจารณา เพราะมาจากเษาร์ บินยะซีด จากรอชิด บินสะอ์ด์ และมุสลิมไม่ได้บันทึกจากเษาร์ มีแต่อัลบุคอรีย์ และอัลบุคอรีย์กับมุสลิมไม่ได้ใช้รอชิด บินสะอ์ด์เป็นหลักฐาน\"", "มีผู้วิจารณ์ว่าสายขาด ตามที่อิบนุหะญัรระบุ อัลค็อลลาลยกคำของอะห์มัดว่า \"รอชิดไม่น่าจะได้ยินจากเษาบาน เพราะเษาบานเสียชีวิตไปนานแล้ว\" อบูหาติมและอัลหัรบีย์ก็กล่าวเช่นนั้น อัซซัยละอีย์แย้งว่า \"คำนี้มีข้อพิจารณา เพราะพวกเขาว่ารอชิดร่วมกับมุอาวิยะฮ์ในสงครามศิฟฟีน ตามที่อัลบุคอรีย์ระบุในหมวดญิฮาด และเษาบานเสียชีวิตปี ฮ.ศ. 54 รอชิดเสียชีวิตปี ฮ.ศ. 108\" อัลบุคอรีย์ยังยืนยันในอัตตารีคของเขาว่ารอชิดได้ยินจากเษาบาน", "อิบนุหะญัรยกว่าอิบนุมะอีน อบูหาติม อัลอิจลีย์ ยะอ์กูบ บินชัยบะฮ์ และอันนะสาอีย์ว่ารอชิดเชื่อถือได้ อะห์มัดว่า \"ไม่เป็นไร\" และอิบนุหัซม์ว่าอ่อน"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"กองทหารหน่วยหนึ่ง\" (สะรียะฮ์) คือกองทหารห้าคนถึงสามร้อยคน บ้างว่าถึงสี่ร้อย ได้ชื่อนี้เพราะส่วนใหญ่เดินทางกลางคืนและซ่อนตัวกลางวัน บ้างว่าเพราะเป็นทหารคัดเลือกที่ดีที่สุดของกองทัพ", "\"แล้วสั่งพวกเขา\" คืออนุญาตให้พวกเขา หลังจากพวกเขาบ่นถึงความหนาว ตามรายงานของอะห์มัด", "\"บนอะศออิบ\" ในหะดีษอธิบายว่าผ้าโพกศีรษะ ที่ชัดคือการอธิบายนี้เป็นคำของอิบนุหะญัร เพราะผู้แต่งไม่พบว่าแทรกอยู่ในแหล่งที่มา อะศออิบเป็นพหูพจน์ของอิศอบะฮ์ คือผ้าโพก อบูอุบัยด์ อิมามด้านภาษาก็อธิบายเช่นนั้น ได้ชื่อนี้เพราะใช้พันศีรษะ ทุกสิ่งที่ใช้พันศีรษะ เช่น ผ้าโพกหรือผ้าพัน ก็เรียกว่าอิศอบะฮ์", "\"ตะสาคีน\" ในหะดีษอธิบายว่ารองเท้าหุ้มข้อ อบูอุบัยด์ก็อธิบายเช่นนั้น ไม่มีคำเอกพจน์ตามที่ษะอ์ลับกล่าว อัลมุบัรริดและคนอื่นว่ามีเอกพจน์ และกล่าวว่า รากของคำคือทุกสิ่งที่ทำให้เท้าอุ่น ทั้งรองเท้าหุ้มข้อ ถุงเท้า และอื่น ๆ จึงไม่เฉพาะรองเท้าหุ้มข้อ ตามที่ได้จากอัลกอมูสและลิสานุลอะร็อบ", "สิ่งที่สวมที่เท้ามีหลายชื่อ แบ่งได้สามประเภท (1) รองเท้าหุ้มข้อ (2) สิ่งที่ใช้แทน เช่น ถุงเท้า มูก (รองเท้าหุ้มทับรองเท้าหุ้มข้ออีกชั้น โดยเฉพาะในเมืองหนาว) และญุรมูก (3) ผ้าพันเท้า ผ้าพันเท้าอยู่ในความหมายของ \"ตะสาคีน\" อย่างชัดเจน จึงมีหุก่มเหมือนการเช็ดรองเท้าหุ้มข้อ อิบนุตัยมียะฮ์เลือกเช่นนี้ เพราะผ้าพันเท้าแทบไม่มีใครใช้นอกจากผู้ที่จำเป็น แล้วจะห้ามผู้ที่จำเป็นมากกว่า แต่ผ่อนผันให้ผู้ที่จำเป็นน้อยกว่าได้อย่างไร"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "เช็ดบนผ้าโพกศีรษะ", "points_th": ["หะดีษเป็นหลักฐานว่าอนุญาตให้เช็ดบนรองเท้าหุ้มข้อและผ้าโพกศีรษะในการเดินทาง และขณะอยู่บ้านก็เทียบได้ เพราะข้อผ่อนผันเป็นเรื่องทั่วไป", "การเช็ดบนผ้าโพกอย่างเดียว โดยไม่เช็ดส่วนใดของศีรษะ ใช้ได้ เป็นหนึ่งในสองทัศนะของนักวิชาการ คือทัศนะของอิมามอะห์มัด อัลเอาซาอีย์ อิสหาก อบูเษาร์ และซอฮิรียะฮ์ หลักฐานคือหะดีษนี้และหะดีษที่คล้ายกัน อิบนุลก็อยยิมกล่าวว่า \"การเช็ดบนผ้าโพกเป็นซุนนะฮ์จากท่านรสูลุลลอฮ์ ﷺ ที่ปฏิบัติสืบมา และเป็นที่รู้จักในหมู่นักวิชาการที่น่าเชื่อถือในทุกเมือง\" อัชเชากานีย์กล่าวว่า \"สรุปคือมีรายงานที่ถูกต้องว่าเช็ดบนศีรษะอย่างเดียว บนผ้าโพกอย่างเดียว และบนศีรษะกับผ้าโพก ทั้งหมดศ่อฮีห์ การจำกัดความใช้ได้ไว้เพียงบางแบบโดยไม่มีเหตุ ไม่ใช่วิสัยของผู้ที่เป็นธรรม\"", "หะดีษอัลมุฆีเราะฮ์ในบทวุฎูอ์ว่าท่านรสูลุลลอฮ์ ﷺ เช็ดที่ส่วนหน้าของศีรษะและบนผ้าโพก ส่วนหะดีษเษาบานนี้ตามรูปคำคือการเช็ดบนผ้าโพกอย่างเดียว ถ้าผ้าโพกปิดศีรษะทั้งหมด เช็ดบนผ้าโพกก็พอ ถ้าศีรษะโผล่บางส่วน เช่น ส่วนหน้า ควรเช็ดพร้อมกับผ้าโพก ตามการกระทำของท่านนบี ﷺ", "หันบะลีย์กำหนดว่าผ้าโพกต้องเป็นแบบของมุสลิม คือมีส่วนหนึ่งพันใต้คาง เพราะเป็นผ้าโพกของชาวอาหรับ ไม่ว่าจะมีชายห้อยหรือไม่ และเช็ดบนผ้าโพกที่มีชายห้อยได้ ส่วนผ้าโพกที่พันรอบศีรษะเฉย ๆ ไม่พันใต้คาง และไม่มีชายห้อย ซึ่งคล้ายผ้าโพกของชาวซิมมีย์ ตามทัศนะหนึ่งในหันบะลีย์ เช็ดไม่ได้ เพราะเหมือนหมวก (เฏาะวากีย์) ซึ่งถอดไม่ยาก", "อิบนุตัยมียะฮ์แย้งเรื่องนี้ และอธิบายว่าการพันใต้คางไม่ใช่เงื่อนไข สลัฟพันใต้คางเพราะพวกเขาขี่ม้าและออกญิฮาดในหนทางของอัลลอฮ์ บางคนผูกด้วยตะขอหรือผ้าพัน", "ผู้แต่งเห็นว่าที่ชัดกว่าคือไม่ใช่เงื่อนไข เพราะคำว่าผ้าโพกในตัวบทกล่าวไว้โดยไม่มีเงื่อนไข และการพันใต้คางไม่ใช่ลักษณะของผ้าโพกที่ต้องกล่าวถึง เมื่อเป็นผ้าโพกก็เช็ดได้ และวิทยปัญญาของการเช็ดบนผ้าโพกไม่ได้ขึ้นอยู่กับความยากในการถอดเท่านั้น อาจคำนึงถึงการที่ผ้าโพกจะคลายถ้าขยับเพื่อเช็ดศีรษะ หรือเกรงอันตรายจากความหนาวหรือความเจ็บป่วยถ้าถอด โดยเฉพาะในเมืองหนาว แต่ความรอบคอบเป็นสิ่งที่ควร ถ้าเป็นผ้าโพกแบบพันเฉย ๆ ที่ถอดแล้วไม่มีอันตราย ไม่เช็ดดีกว่า เพราะถอดง่ายและคล้ายหมวก และหลักเดิมของหุก่มคือมีเหตุผล"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "กำหนดเวลาการเช็ดผ้าโพก", "points_th": ["ตามรูปคำ หะดีษบ่งว่าไม่มีกำหนดเวลาทั้งในการเช็ดรองเท้าหุ้มข้อและผ้าโพก ส่วนรองเท้าหุ้มข้อได้กล่าวไปแล้วว่ามีกำหนดเวลา หะดีษนี้จึงตีความตามหลักฐานเรื่องกำหนดเวลา (จะกล่าวในหะดีษต่อไป)", "ส่วนผ้าโพกมีสองทัศนะ ทัศนะแรก: มีกำหนดเวลา เป็นมัซฮับหันบะลีย์ โดยเทียบกับรองเท้าหุ้มข้อ เพราะถ้ารองเท้าหุ้มข้อมีกำหนดเวลา ทั้งที่โดยทั่วไปถอดยากกว่าผ้าโพก สิ่งที่ถอดง่ายกว่าก็ยิ่งสมควรมีกำหนด ทัศนะที่สอง: ไม่มีกำหนดเวลา ตามหลักของมัซฮับมาลิกีย์ ซึ่งไม่ถือกำหนดเวลาในการเช็ดรองเท้าหุ้มข้อ อิบนุหัซม์เลือก และอัชเชากานีย์เอนเอียงไปทางนี้ เพราะไม่มีรายงานจากท่านนบี ﷺ ว่ากำหนดเวลาการเช็ดผ้าโพก ท่านเช็ดทั้งผ้าโพกและรองเท้าหุ้มข้อ กำหนดเวลาให้รองเท้า แต่ไม่ได้กำหนดให้ผ้าโพก ผู้ที่ทำให้ทั้งสองมีหุก่มเดียวกัน ก็กล่าวสิ่งที่ท่านรสูล ﷺ ไม่ได้กล่าว", "ผู้แต่งเห็นว่าทัศนะนี้แข็งแรงเพราะเหตุผลแข็งแรง ส่วนการเทียบกับรองเท้าหุ้มข้อมีข้อพิจารณา เพราะการชำระอวัยวะที่ถูกปิดในกรณีผ้าโพกคือการเช็ด ส่วนในกรณีเท้าคือการล้าง และการเช็ดเบากว่าการล้าง จึงเทียบกันไม่ได้ แต่อาจกล่าวได้ว่าความคล้ายกันคือทั้งสองเป็นการเช็ด และเป็นข้อผ่อนผัน ทัศนะว่ามีกำหนดเวลาจึงมีความแข็งแรง โดยเฉพาะเพราะรอบคอบกว่า และการถอดผ้าโพกหลังผ่านสามวันสำหรับผู้เดินทาง และหนึ่งวันหนึ่งคืนสำหรับผู้อยู่บ้าน ไม่ได้ลำบากมาก เป็นที่รู้กันว่าคนมักถอดผ้าโพกเมื่อนอน และสวมเมื่อตื่นเมื่อต้องการ ซึ่งมักเป็นทุกวัน และอาจมากกว่าหนึ่งครั้ง ทัศนะว่ามีกำหนดเวลาจึงมีน้ำหนัก", "ส่วนวิธีเช็ดผ้าโพก ไม่มีระบุในตัวบท การเช็ดมีรายงานโดยไม่กำหนด ถ้าเช็ดส่วนใหญ่ของผ้าโพกก็พอ และถ้าส่วนหน้าของศีรษะโผล่ ก็เช็ดพร้อมกับผ้าโพก"]}], "tags_th": ["ผ้าโพกศีรษะ", "เช็ดรองเท้าหุ้มข้อ", "ถุงเท้า", "ผ้าพันเท้า", "กำหนดเวลา"]}, {"id": "v1-h064", "volume": 1, "bab": "khuffayn", "topic_ar": "ما جاء غير صريح في مسح الخفين من غير توقيت", "topic_th": "รายงานที่ไม่ชัดเจนว่าเช็ดรองเท้าหุ้มข้อได้โดยไม่มีกำหนดเวลา", "pages": [268, 273], "hadith": [{"no": 64, "matn_ar": "عَنْ عُمَرَ مَوْقُوفًا، وَعَنْ أَنَسٍ مَرْفُوعًا: «إِذَا تَوَضَّأَ أَحَدُكُمْ وَلَبِسَ خُفَّيْهِ فَلْيَمْسَحْ عَلَيْهِمَا، وَلْيُصَلِّ فِيهِمَا، وَلَا يَخْلَعْهُمَا إِنْ شَاءَ إِلَّا مِنْ جَنَابَةٍ». أَخْرَجَهُ الدَّارَقُطْنِيُّ، وَالْحَاكِمُ وَصَحَّحَهُ.", "translation_th": "จากอุมัร (ร.ฎ.) เป็นคำของเขา (เมากูฟ) และจากอนัส (ร.ฎ.) ถึงท่านนบี ﷺ (มัรฟูอ์): \"เมื่อผู้ใดในพวกท่านอาบน้ำละหมาดและสวมรองเท้าหุ้มข้อ ก็ให้เช็ดบนรองเท้า และละหมาดในรองเท้า และไม่ต้องถอดหากเขาไม่ต้องการ เว้นแต่เพราะญะนาบะฮ์\" บันทึกโดยอัดดารุกุฏนีย์ และอัลหากิมซึ่งระบุว่าศ่อฮีห์", "grade_th": "รายงานมัรฟูอ์จากอนัส: อัลหากิมว่าศ่อฮีห์ตามเงื่อนไขของมุสลิม อิบนุอับดิลฮาดีว่าสายรายงานแข็งแรง รายงานเมากูฟจากอุมัร: สายรายงานแข็งแรง"}], "key_rulings_th": ["ต้องสวมรองเท้าหุ้มข้อหลังความสะอาดที่สมบูรณ์จากฮะดัษเล็ก คือวุฎูอ์", "ผู้ที่เห็นว่าการเช็ดไม่มีกำหนดเวลา (มาลิก อัลลัยษ์ อัลเอาซาอีย์) อ้างหะดีษนี้ แต่นักวิชาการส่วนใหญ่ รวมถึงอบูหะนีฟะฮ์ อัชชาฟิอีย์ และอะห์มัด ว่ามีกำหนดเวลา", "ผู้แต่งเห็นว่าที่ถูกต้องคือมีกำหนดเวลา เพราะหะดีษเรื่องกำหนดเวลาศ่อฮีห์และมุตะวาติร ส่วนหะดีษนี้กล่าวไว้โดยไม่มีเงื่อนไข จึงตีความตามหะดีษที่จำกัด", "ข้อยกเว้นตามอิบนุตัยมียะฮ์: เมื่อจำเป็น เช่น หนาวจัดที่ถอดแล้วเป็นอันตราย หรือถอดแล้วจะพลัดจากคณะเดินทาง ก็เช็ดต่อหลังครบกำหนดได้ เหมือนเฝือก (ญะบีเราะฮ์) ในขอบเขตแคบ"], "vocab": [{"ar": "مَوْقُوف", "th": "เมากูฟ (ศัพท์หะดีษ) คือรายงานที่เป็นคำของเศาะหาบะฮ์ และไม่มีหุก่มว่ามาถึงท่านนบี ﷺ"}, {"ar": "مَرْفُوع", "th": "มัรฟูอ์ (ศัพท์หะดีษ) คือรายงานที่พาดพิงถึงท่านนบี ﷺ"}, {"ar": "مُنْكَرُ الْحَدِيثِ", "th": "หะดีษของเขามุงกัร คือคุณลักษณะของผู้รายงานที่ควรทิ้งหะดีษของเขา ต่างจาก \"รายงานหะดีษมุงกัร\" ซึ่งหมายถึงเกิดขึ้นบางครั้ง ไม่ใช่เสมอ"}, {"ar": "الْجَبِيرَة", "th": "เฝือก หรือผ้าพันแผลที่พันอวัยวะที่หักหรือบาดเจ็บ"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["หะดีษนี้มีรายงานแบบเมากูฟจากอุมัร และแบบมัรฟูอ์จากอนัส เมากูฟคือสิ่งที่พาดพิงถึงเศาะหาบะฮ์ และไม่มีหุก่มว่ามาถึงท่านนบี ﷺ มัรฟูอ์คือสิ่งที่พาดพิงถึงท่านนบี ﷺ", "รายงานมัรฟูอ์จากอนัส: อัดดารุกุฏนีย์และอัลหากิม ผ่านอับดุลฆ็อฟฟาร บินดาวูด อัลหัรรอนีย์ จากหัมมาด บินสะละมะฮ์ จากอุบัยดุลลอฮ์ บินอบีบักร์ และษาบิต จากอนัส อัลหากิมว่า \"สายรายงานศ่อฮีห์ตามเงื่อนไขของมุสลิม และผู้รายงานทั้งหมดเชื่อถือได้\" อัดดารุกุฏนีย์ยังบันทึกผ่านอะสัด บินมูซา จากหัมมาด บินสะละมะฮ์ อิบนุอับดิลฮาดีว่า \"สายรายงานแข็งแรง อะสัด บินมูซาสัจจริง อันนะสาอีย์และคนอื่นว่าเชื่อถือได้\" อิบนุลเญาซีย์ไม่ได้ชี้ข้อบกพร่องในอัตตะห์กีก แต่กล่าวว่า \"นี่ตีความว่าหมายถึงภายในกำหนดสามวัน\"", "อิบนุหัซม์ชี้ข้อบกพร่องว่าอะสัด บินมูซารายงานคนเดียวจากหัมมาด และอะสัดหะดีษของเขามุงกัร ใช้เป็นหลักฐานไม่ได้ อิบนุดะกีกิลอีดและอิบนุหะญัรแย้งว่า อะสัดไม่ได้รายงานคนเดียว เพราะอัลหากิมและอัดดารุกุฏนีย์บันทึกผ่านอับดุลฆ็อฟฟารด้วย และอะสัดเชื่อถือได้", "อิบนุดะกีกิลอีดกล่าวว่า \"อิบนุหัซม์อาจอ่านคำของอิบนุยูนุสในตารีคุลฆุเราะบาอ์ว่า อะสัด บินมูซารายงานหะดีษมุงกัร แต่เขาเชื่อถือได้ และน่าจะเป็นความบกพร่องจากคนอื่น ถ้าเขาเอาคำนี้มา ก็ไม่ดีนัก เพราะการกล่าวว่า 'หะดีษของเขามุงกัร' ไม่เหมือนการกล่าวว่า 'รายงานหะดีษมุงกัร' เพราะ 'หะดีษของเขามุงกัร' เป็นคุณลักษณะของผู้รายงานที่ควรทิ้งหะดีษ ส่วนอีกสำนวนหมายถึงเกิดขึ้นบางครั้ง ไม่ใช่เสมอ อะห์มัดกล่าวถึงมุหัมมัด บินอิบรอฮีม อัตตัยมีย์ว่า 'รายงานหะดีษมุงกัร' ทั้งที่อัลบุคอรีย์และมุสลิมใช้เขาเป็นหลักฐาน และเป็นผู้รายงานหะดีษ 'แท้จริงการกระทำขึ้นอยู่กับเจตนา' ... อิบนุยูนุสตัดสินว่าเขาเชื่อถือได้ แล้วจะเชื่อถือได้แต่ใช้หะดีษเป็นหลักฐานไม่ได้อย่างไร\"", "รายงานเมากูฟ: อัดดารุกุฏนีย์บันทึกผ่านอะสัด บินมูซา จากหัมมาด บินสะละมะฮ์ จากมุหัมมัด บินซิยาด จากซุบัยด์ บินอัศศ็อลต์ ว่าได้ยินอุมัรกล่าว... สายรายงานแข็งแรง มุหัมมัด บินซิยาดคืออัลกุร็อชีย์ อัลมะดะนีย์ เชื่อถือได้ นักบันทึกทั้งหกบันทึกหะดีษของเขา ซุบัยด์ บินอัศศ็อลต์ อบูหาติมระบุว่ารายงานจากอุมัรและทันยุคเขา อิบนุมะอีนว่า \"ซุบัยด์เชื่อถือได้\" แต่อิบนุหัซม์รายงานด้วยสำนวน \"และให้ละหมาดในรองเท้าตราบที่ไม่ถอด\" แล้วชี้ข้อบกพร่องของรายงานอับดุรเราะห์มาน บินมะฮ์ดีย์ จากหัมมาด ด้วยสำนวน \"ให้เช็ดบนรองเท้าถ้าต้องการ และไม่ต้องถอด\"", "การที่อิบนุหัซม์ถือว่ารายงานเมากูฟจากอุมัรมีน้ำหนักกว่า และอะสัด บินมูซารายงานคนเดียว มีข้อพิจารณาสองข้อ (1) ศิษย์รุ่นใหญ่ของหัมมาด บินสะละมะฮ์ไม่ได้รายงานหะดีษนี้จากเขา อัลหากิมกล่าวว่า \"หะดีษนี้ไม่มีที่ชาวบัศเราะฮ์จากหัมมาด\" (2) อับดุรเราะห์มาน บินมะฮ์ดีย์ อิมามผู้เชี่ยวชาญ รายงานตรงกับอะสัด บินมูซาว่าเป็นคำของอุมัร", "มีรายงานจากอุกบะฮ์ บินอามิรว่า เขาไปหาอุมัรเมื่อพิชิตดิมัชก์ \"ฉันสวมรองเท้าหุ้มข้อ อุมัรถามว่า อุกบะฮ์ ท่านไม่ได้ถอดรองเท้ามานานเท่าไร ฉันบอกว่าตั้งแต่วันศุกร์ คือแปดวัน เขากล่าวว่า ท่านทำดีแล้ว และถูกตามซุนนะฮ์\" (อัดดารุกุฏนีย์ อัลหากิมว่าศ่อฮีห์ตามเงื่อนไขของมุสลิม อัซซะฮะบีย์เห็นด้วย อัลอัลบานีย์ใส่ไว้ในอัศเศาะฮีหะฮ์ และอิบนุตัยมียะฮ์ว่าศ่อฮีห์ แต่อัดดารุกุฏนีย์ในอัลอิลัลว่าคำว่า \"ซุนนะฮ์\" ไม่ใช่สำนวนที่ถูกต้อง) คำของอัลบัยฮะกีย์ในการประสานรายงานต่าง ๆ จากอุมัรจะกล่าวต่อไป ซึ่งบ่งว่ารายงานนี้ศ่อฮีห์ เพราะถ้าอ่อน ก็ไม่ต้องประสานกับหะดีษเรื่องกำหนดเวลา"]}, {"wajh": 2, "type": "fiqh", "heading_ar": null, "heading_th": "ต้องสวมหลังวุฎูอ์", "points_th": ["หะดีษเป็นหลักฐานว่าต้องสวมรองเท้าหุ้มข้อขณะมีความสะอาด เพราะคำว่า \"เมื่อผู้ใดในพวกท่านอาบน้ำละหมาด\" (กล่าวไปแล้วในหะดีษอัลมุฆีเราะฮ์) แต่หะดีษนี้ให้ความรู้เพิ่มว่า ความสะอาดในหะดีษอัลมุฆีเราะฮ์และหะดีษที่มีความหมายเดียวกัน หมายถึงความสะอาดที่สมบูรณ์จากฮะดัษเล็ก คือวุฎูอ์", "อิบนุอับดิลบัรร์กล่าวว่า \"นี่คือหลักที่เห็นพ้องกัน ไม่ให้เช็ดรองเท้าหุ้มข้อ นอกจากผู้ที่สวมขณะเท้าทั้งสองสะอาด\""]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "มีกำหนดเวลาหรือไม่", "points_th": ["หะดีษนี้บ่งว่าเช็ดรองเท้าหุ้มข้อได้โดยไม่มีกำหนดเวลา เพราะคำว่า \"และไม่ต้องถอดหากเขาไม่ต้องการ เว้นแต่เพราะญะนาบะฮ์\" อัดดารุกุฏนีย์ตั้งชื่อบทในสุนันของเขาว่า \"บทสิ่งที่มีรายงานเรื่องการเช็ดรองเท้าหุ้มข้อโดยไม่มีกำหนดเวลา\"", "นี่เป็นหลักฐานหนึ่งของผู้ที่ว่าการเช็ดไม่มีกำหนดเวลา ผู้สวมเช็ดได้ตราบที่ไม่ถอดหรือไม่มีญะนาบะฮ์ ทัศนะนี้พาดพิงถึงมาลิกและศิษย์ อัลลัยษ์ บินสะอ์ด์ และอัลเอาซาอีย์ อิบนุอับดิลบัรร์กล่าวว่า \"มีรายงานเช่นนี้จากอุมัร บินอัลค็อฏฏอบ อุกบะฮ์ บินอามิร อับดุลลอฮ์ บินอุมัร และอัลหะซัน อัลบัศรีย์\"", "หลักฐานของพวกเขาอีกข้อคือหะดีษอุบัยย์ บินอิมาเราะฮ์ ที่ถามท่านรสูลุลลอฮ์ ﷺ ว่า เช็ดรองเท้าหุ้มข้อได้ไหม ท่านตอบว่า \"ได้\" เขาถามว่า หนึ่งวันหรือ ท่านตอบว่า \"หนึ่งวัน\" สองวันหรือ \"และสองวัน\" สามวันหรือ \"ได้ และตามที่ท่านต้องการ\" (จะกล่าวว่าเป็นหะดีษอ่อน) และพวกเขาให้เหตุผลว่า นี่คือการชำระ จึงไม่กำหนดด้วยเวลา เหมือนการล้างเท้า อิบนุรุชด์ระบุว่ากำหนดเวลาไม่มีผลต่อการเสียของความสะอาด เพราะสิ่งที่ทำให้เสียคือฮะดัษ พวกเขาจึงถือว่าการเทียบนี้ขัดกับหะดีษอย่างหะดีษอะลีและเศาะฟวาน ตามที่อิบนุรุชด์กล่าว แต่เป็นเหตุผลที่ยืนไม่ได้เมื่อเทียบกับตัวบทศ่อฮีห์ที่ชัดเจน", "ทัศนะว่ามีกำหนดเวลาเป็นมัซฮับของนักวิชาการส่วนใหญ่ รวมถึงอิมามทั้งสาม คืออบูหะนีฟะฮ์ อัชชาฟิอีย์ และอะห์มัด และอิบนุอับดิลบัรร์จากมาลิกีย์เลือก (หลักฐานกล่าวไปแล้ว) อัฏเฏาะหาวีย์ระบุว่าหะดีษจากท่านรสูลุลลอฮ์ ﷺ เรื่องกำหนดเวลาในการเช็ดรองเท้าหุ้มข้อมาอย่างมุตะวาติร คือสามวันสามคืนสำหรับผู้เดินทาง และหนึ่งวันหนึ่งคืนสำหรับผู้อยู่บ้าน", "อิบนุอับดิลบัรร์กล่าวว่า \"ตาบิอีนและนักนิติศาสตร์ส่วนใหญ่ยึดเช่นนี้ และสำหรับฉันนี่คือความรอบคอบ เพราะการเช็ดยืนยันอย่างมุตะวาติร ชาวซุนนะฮ์และอัลญะมาอะฮ์เห็นพ้อง และใจสบายกับการเห็นพ้องของพวกเขา เมื่อส่วนใหญ่ว่าผู้อยู่บ้านเช็ดได้ไม่เกินห้าละหมาด หนึ่งวันหนึ่งคืน และผู้เดินทางไม่เกินสิบห้าละหมาด สามวันสามคืน ผู้รู้ก็ต้องปฏิบัติละหมาดของตนด้วยความมั่นใจ ความมั่นใจคือการล้าง จนกว่าจะเห็นพ้องเรื่องการเช็ด และพวกเขาไม่ได้เห็นพ้องเกินสามวันสำหรับผู้เดินทาง และเกินหนึ่งวันสำหรับผู้อยู่บ้าน\"", "หะดีษอนัสที่กล่าวมาตอบได้สองทาง (1) เป็นหะดีษที่กล่าวไว้โดยไม่มีเงื่อนไข จึงตีความตามหะดีษที่จำกัด (2) คำว่า \"หากต้องการ\" อาจบ่งว่าการเช็ดไม่ใช่วาญิบ เพื่อขจัดความเข้าใจว่าเป็นวาญิบจากรูปคำ เพราะรูปคำของข้อห้ามคือหะรอม (อัศศ็อนอานีย์กล่าว) จึงถอดและล้างได้ แม้ยังอยู่ในกำหนดเวลา", "ส่วนรายงานจากอุมัรว่าไม่มีกำหนดเวลา ก็มีรายงานจากเขาที่บ่งว่ามีกำหนดเวลา คืออับดุรร็อซซากบันทึกจากอบูอุษมาน อันนะฮ์ดีย์ว่า \"ฉันอยู่ด้วยเมื่อสะอ์ด์และอิบนุอุมัรโต้แย้งกันต่อหน้าอุมัรเรื่องการเช็ดรองเท้าหุ้มข้อ อุมัรกล่าวว่า ให้เช็ดจนถึงเวลาเดียวกันของวันและคืนของเขา\" ซึ่งชัดเจนว่าอุมัรเห็นว่ามีกำหนดเวลา และหัมมาดรายงานจากอิบรอฮีม จากอัลอัสวัด จากนุบาตะฮ์ จากอุมัรว่า \"ผู้เดินทางสามวัน ผู้อยู่บ้านหนึ่งวันหนึ่งคืน\"", "อัลบัยฮะกีย์ตอบความขัดแย้งนี้ว่า \"เรามีรายงานจากอุมัรเรื่องกำหนดเวลา ซึ่งอาจเป็นสิ่งที่เขากลับมาเห็น เมื่อรายงานที่ถูกต้องจากท่านนบี ﷺ เรื่องกำหนดเวลามาถึงเขา หรือคำที่สอดคล้องกับซุนนะฮ์ที่มีชื่อเสียงย่อมสมควรกว่า\" อันนะวะวีย์ยกคำนี้และเห็นด้วย", "รายงานจากอุมัรในเรื่องของอุกบะฮ์ บินอามิร อาจตีความว่าเป็นกรณีจำเป็น และถอดรองเท้าไม่ได้ เพราะจะพลัดจากคณะเดินทางหรือเหตุอื่น อิบนุตัยมียะฮ์เห็นเช่นนี้ โดยกล่าวว่า \"การเช็ดรองเท้าหุ้มข้อมีกำหนดเวลาตามทัศนะของนักวิชาการส่วนใหญ่... แต่ถ้าการถอดหลังครบเวลามีอันตราย เช่น หนาวจัด ถอดแล้วเป็นอันตราย เช่น ในดินแดนหิมะ หรืออยู่ในคณะเดินทางที่ถ้าถอดแล้วล้างจะไม่รอ จนพลัดจากพวกเขา ไม่รู้ทาง หรือกลัวศัตรูหรือสัตว์ร้าย หรือถ้าทำเช่นนั้นจะพลาดสิ่งวาญิบ เป็นต้น กรณีนี้บางท่านว่าให้ตะยัมมุม บางท่านว่าให้เช็ดเพราะความจำเป็น ซึ่งแข็งแรงกว่า เพราะการสวมรองเท้าในกรณีนี้เหมือนการพันเฝือกในบางแง่ หะดีษเรื่องกำหนดเวลาสั่งให้เช็ดหนึ่งวันหนึ่งคืน และสามวันสามคืน ไม่มีการห้ามเกินนั้น นอกจากโดยนัย และความหมายโดยนัยไม่ครอบคลุมทุกกรณี ถ้าถอดหลังครบเวลาได้ก็ปฏิบัติตามหะดีษเหล่านี้ หะดีษอุกบะฮ์ บินอามิรจึงตีความเช่นนี้... และเป็นหะดีษศ่อฮีห์\"", "อิบนุตัยมียะฮ์เองปฏิบัติเช่นนี้ในการเดินทางครั้งหนึ่ง โดยกล่าวว่า \"เมื่อฉันเดินทางด้วยม้าส่งสาร และเร่งเดินทาง กำหนดเวลาการเช็ดหมด ถอดแล้วอาบน้ำละหมาดไม่ได้นอกจากจะพลัดจากคณะเดินทาง หรือทำให้พวกเขาต้องรอเป็นอันตราย ฉันจึงเห็นว่ากรณีจำเป็นไม่มีกำหนดเวลา และถือเหมือนกรณีเฝือก และตีความหะดีษอุมัรและคำของเขากับอุกบะฮ์ว่า 'ท่านถูกตามซุนนะฮ์' ตามนี้ เพื่อประสานรายงานต่าง ๆ แล้วฉันพบว่ามีระบุชัดในมะฆอซีของอิบนุอาอิซ ว่าเขาเดินทางด้วยม้าส่งสารเหมือนที่ฉันเดินทางเมื่อพิชิตดิมัชก์... ฉันจึงสรรเสริญอัลลอฮ์ที่ตรงกัน\" และกล่าวว่า \"เป็นประเด็นที่มีประโยชน์มาก\"", "ผู้แต่งเห็นว่าที่ถูกต้องในประเด็นนี้คือมีกำหนดเวลา เพราะหะดีษเรื่องกำหนดเวลาศ่อฮีห์และมุตะวาติร ไม่มีสิ่งใดขัด ส่วนรายงานที่ไม่มีกำหนดเวลาเป็นแบบไม่มีเงื่อนไข จึงถูกจำกัดด้วยหะดีษเหล่านั้น ตามหลักอุศูลว่าสิ่งที่ไม่มีเงื่อนไขตีความตามสิ่งที่มีเงื่อนไข เพื่อประสานหลักฐาน และอาจปฏิบัติตามรายงานนั้นในขอบเขตแคบ ตามที่อิบนุตัยมียะฮ์กล่าว เพื่อไม่ให้การยึดรายงานนั้นทำให้ทิ้งหะดีษเรื่องกำหนดเวลา"]}], "tags_th": ["เช็ดรองเท้าหุ้มข้อ", "กำหนดเวลา", "ความจำเป็น", "เมากูฟ", "อุมัร"]}, {"id": "v1-h065", "volume": 1, "bab": "khuffayn", "topic_ar": "اشتراط لبس الخف على طهارة", "topic_th": "เงื่อนไขว่าต้องสวมรองเท้าหุ้มข้อขณะมีความสะอาด", "pages": [274, 276], "hadith": [{"no": 65, "matn_ar": "عَنْ أَبِي بَكْرَةَ رَضِيَ اللهُ عَنْهُ، عَنِ النَّبِيِّ ﷺ: أَنَّهُ رَخَّصَ لِلْمُسَافِرِ ثَلَاثَةَ أَيَّامٍ وَلَيَالِيَهُنَّ، وَلِلْمُقِيمِ يَوْمًا وَلَيْلَةً، إِذَا تَطَهَّرَ فَلَبِسَ خُفَّيْهِ: أَنْ يَمْسَحَ عَلَيْهِمَا. أَخْرَجَهُ الدَّارَقُطْنِيُّ، وَصَحَّحَهُ ابْنُ خُزَيْمَةَ.", "translation_th": "จากอบูบักเราะฮ์ (ร.ฎ.) จากท่านนบี ﷺ ว่า ท่านผ่อนผันให้ผู้เดินทางสามวันสามคืน และผู้อยู่บ้านหนึ่งวันหนึ่งคืน เมื่อเขาชำระแล้วสวมรองเท้าหุ้มข้อ ให้เช็ดบนรองเท้าทั้งสอง บันทึกโดยอัดดารุกุฏนีย์ และอิบนุคุซัยมะฮ์ระบุว่าศ่อฮีห์", "grade_th": "หะซันด้วยหลักฐานสนับสนุน (อัลบุคอรีย์และอัลอัลบานีย์ว่าหะซัน) สายรายงานมีความอ่อนเพราะอัลมุฮาจิร"}], "key_rulings_th": ["การเช็ดรองเท้าหุ้มข้อมีกำหนดเวลา ผู้เดินทางสามวันสามคืน ผู้อยู่บ้านหนึ่งวันหนึ่งคืน", "เงื่อนไขคือต้องสวมขณะมีความสะอาดที่สมบูรณ์ คือวุฎูอ์ ไม่จำเป็นต้องสวมทันทีหลังชำระ", "การเช็ดรองเท้าหุ้มข้อเป็นข้อผ่อนผัน (รุคเศาะฮ์) ส่วนการล้างเท้าเป็นหุก่มเดิม (อะซีมะฮ์)", "หะดีษนี้จำกัดหะดีษเษาบานและหะดีษอื่นที่กล่าวไว้โดยไม่มีเงื่อนไข"], "vocab": [{"ar": "رَخَّصَ", "th": "ผ่อนผัน ทำให้ง่าย"}, {"ar": "الرُّخْصَة", "th": "ข้อผ่อนผัน คือหุก่มที่ยืนยันต่างจากหลักฐานเดิมเพราะมีเหตุ คู่ตรงข้ามคืออะซีมะฮ์ (หุก่มเดิม)"}, {"ar": "إِذَا تَطَهَّرَ", "th": "เมื่อชำระด้วยวุฎูอ์ที่สมบูรณ์ ด้วยน้ำ"}, {"ar": "الْبَكْرَة", "th": "รอกไม้กลมที่มีร่องตรงกลาง ใช้ตักน้ำ"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อบูบักเราะฮ์ นุฟัยอ์ บินอัลหาริษ อัษษะเกาะฟีย์ บ้างว่านุฟัยอ์ บินมัสรูห์ เป็นที่รู้จักด้วยกุนยะฮ์ เขาไต่ลงมาหาท่านนบี ﷺ จากป้อมฏออิฟด้วยรอก (บักเราะฮ์) จึงได้กุนยะฮ์ว่าอบูบักเราะฮ์ เขาเป็นทาส ท่านนบี ﷺ ปลดปล่อยเขา เขาจึงกล่าวว่า \"ฉันคือทาสที่ได้รับการปลดปล่อยของท่านรสูลุลลอฮ์ ﷺ\"", "เขาเป็นเศาะหาบะฮ์ที่ประเสริฐ ลูก ๆ ของเขาเป็นคนมีชื่อเสียง เขารายงานหลายหะดีษจากท่านนบี ﷺ และลูก ๆ รายงานจากเขา อิบนุอับดิลบัรร์กล่าวว่า \"เขาเปรียบเหมือนหัวลูกศรในการทำอิบาดะฮ์\" เขาเสียชีวิตปี ฮ.ศ. 49 บ้างว่า 51 หรือ 52"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัดดารุกุฏนีย์ อิบนุคุซัยมะฮ์ (192) และอิบนุมาญะฮ์ (556) และคนอื่น บันทึกผ่านอับดุลวะฮ์ฮาบ อัษษะเกาะฟีย์ ว่าอัลมุฮาจิร อบูมัคละด์ เล่าให้ฟัง จากอับดุรเราะห์มาน บินอบีบักเราะฮ์ จากบิดา", "สายรายงานมีความอ่อน เพราะอัลมุฮาจิรถูกวิจารณ์ อิบนุมะอีนว่า \"พอใช้ได้\" (ศอลิห์) อัสสาญีย์ว่า \"สัจจริง\" อบูหาติมว่า \"หะดีษของเขาอ่อน ไม่ค่อยดี ไม่แม่นยำ เขียนหะดีษของเขาไว้ได้\" (คือนับเป็นผู้อ่อน แต่เขียนหะดีษไว้พิจารณาได้ ความอ่อนไม่รุนแรง) แต่หะดีษนี้มีหลักฐานสนับสนุนจนถึงระดับหะซัน", "อัตติรมิซีย์ยกคำของอัลบุคอรีย์ว่า \"หะดีษอบูบักเราะฮ์หะซัน\" และอัลอัลบานีย์ก็ว่าหะซัน"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ผ่อนผัน\" ข้อผ่อนผัน (รุคเศาะฮ์) ทางภาษาคือการทำให้ง่ายในเรื่องต่าง ๆ ทางศาสนาคือหุก่มที่ยืนยันต่างจากหลักฐาน เพราะมีเหตุ คือสิ่งที่ทำให้ง่ายแก่ผู้รับภาระเพราะเหตุที่ต้องการการผ่อนปรน ทั้งที่เหตุของหุก่มเดิมยังมีอยู่ คู่ตรงข้ามคืออะซีมะฮ์ (หุก่มเดิม) การล้างเท้าในวุฎูอ์คืออะซีมะฮ์ และการเช็ดรองเท้าหุ้มข้อคือรุคเศาะฮ์", "\"เมื่อเขาชำระ\" หมายถึงวุฎูอ์ที่สมบูรณ์ คือการชำระด้วยน้ำ ดังที่กล่าวในหะดีษอนัส \"เมื่อผู้ใดในพวกท่านอาบน้ำละหมาดและสวมรองเท้าหุ้มข้อ\"", "\"แล้วสวมรองเท้าหุ้มข้อ\" อักษรฟาอ์ในที่นี้เป็นเพียงคำเชื่อม ไม่ได้บ่งว่าต้องต่อเนื่องทันที เพราะเป็นที่รู้ว่าความต่อเนื่องไม่ใช่เงื่อนไขของการเช็ด ที่ต้องการคือสวมขณะมีความสะอาด แม้จะเว้นช่วงระหว่างการชำระกับการสวม หรืออาจกล่าวว่าบ่งความต่อเนื่อง ซึ่งความต่อเนื่องในแต่ละที่ต่างกันไป เช่นคำว่า \"เขาแต่งงาน แล้วก็มีลูก\"", "\"ให้เช็ดบนรองเท้าทั้งสอง\" เป็นกรรมของคำว่า \"ผ่อนผัน\" คือ ท่านผ่อนผันให้ผู้เดินทางและผู้อยู่บ้านเช็ดบนรองเท้าหุ้มข้อด้วยเงื่อนไขที่กล่าวมา"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "กำหนดเวลา และสวมขณะสะอาด", "points_th": ["หะดีษเป็นหลักฐานว่าการเช็ดมีกำหนดเวลา ดังที่กล่าวในหะดีษอะลี และเงื่อนไขของการเช็ดคือสวมขณะมีความสะอาด ดังที่หะดีษอุมัรและอนัสบ่งชี้", "ที่ชัดคืออิบนุหะญัรยกหะดีษนี้ เพราะรวมทั้งสองประเด็น คือการกำหนดเวลาและเงื่อนไขการสวมขณะสะอาด หะดีษนี้จึงจำกัดสิ่งที่กล่าวมาในหะดีษเษาบานและหะดีษอื่น"]}], "tags_th": ["เช็ดรองเท้าหุ้มข้อ", "เงื่อนไข", "ความสะอาด", "กำหนดเวลา", "รุคเศาะฮ์"]}, {"id": "v1-h066", "volume": 1, "bab": "khuffayn", "topic_ar": "ما جاء صريحاً في مسح الخفين بلا توقيت", "topic_th": "รายงานที่ชัดเจนว่าเช็ดรองเท้าหุ้มข้อโดยไม่มีกำหนดเวลา", "pages": [277, 278], "hadith": [{"no": 66, "matn_ar": "عَنْ أُبَيِّ بْنِ عِمَارَةَ رَضِيَ اللهُ عَنْهُ أَنَّهُ قَالَ: يَا رَسُولَ اللهِ أَمْسَحُ عَلَى الْخُفَّيْنِ؟ قَالَ: «نَعَمْ» قَالَ: يَوْمًا؟ قَالَ: «يَوْمًا»، قَالَ: وَيَوْمَيْنِ؟ قَالَ: «نَعَمْ»، قَالَ: وَثَلَاثَةً؟ قَالَ: «نَعَمْ، وَمَا شِئْتَ». أَخْرَجَهُ أَبُو دَاوُدَ، وَقَالَ: لَيْسَ بِالْقَوِيِّ.", "translation_th": "จากอุบัยย์ บินอิมาเราะฮ์ (ร.ฎ.) ว่า เขาถามว่า โอ้ท่านรสูลุลลอฮ์ ฉันเช็ดบนรองเท้าหุ้มข้อได้ไหม ท่านตอบว่า \"ได้\" เขาถามว่า หนึ่งวันหรือ ท่านตอบว่า \"หนึ่งวัน\" เขาถามว่า และสองวันหรือ ท่านตอบว่า \"ได้\" เขาถามว่า และสามวันหรือ ท่านตอบว่า \"ได้ และตามที่ท่านต้องการ\" บันทึกโดยอบูดาวูด และเขากล่าวว่า ไม่แข็งแรง", "grade_th": "ฎออีฟ (อ่อน)"}], "key_rulings_th": ["หะดีษนี้อ่อน จึงยืนขัดกับหะดีษศ่อฮีห์เรื่องกำหนดเวลาไม่ได้", "สมมุติว่าศ่อฮีห์ ก็ถูกจำกัดด้วยหะดีษเรื่องกำหนดเวลา หรือตีความตามที่อิบนุตัยมียะฮ์กล่าว คือผู้เดินทางที่ถอดรองเท้าแล้วเป็นอันตราย", "หรืออาจหมายความว่า เช็ดได้ทุกครั้งที่ต้องการ แต่ไม่เกินเงื่อนไขกำหนดเวลา เมื่อครบก็ถอดแล้วสวมใหม่ ซึ่งรวมแล้ววันที่เช็ดอาจมากกว่า"], "vocab": [{"ar": "أُبَيّ بْن عِمَارَة", "th": "อุบัยย์ อ่านสระอุ ฟัตหะฮ์ที่บาอ์ และชัดดะฮ์ที่ยาอ์ บินอิมาเราะฮ์ อ่านสระอิที่อัยน์ (บ้างว่าสระอุ)"}, {"ar": "لَيْسَ بِالْقَوِيِّ", "th": "ไม่แข็งแรง (คำตัดสินของอบูดาวูดเรื่องสายรายงาน หรือตัวหะดีษ)"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อิบนุหะญัรยกหะดีษนี้เพราะอ่อน เพื่อให้รู้สถานะ เนื่องจากหะดีษอนัสและรายงานจากอุมัรที่ผ่านมาบ่งว่าไม่มีกำหนดเวลา", "อุบัยย์ บินอิมาเราะฮ์ เศาะหาบะฮ์ที่มีชื่อเสียง นับอยู่ในชาวมะดีนะฮ์ อาศัยอยู่ที่อียิปต์ มีเพียงหะดีษเดียวเรื่องการเช็ดรองเท้าหุ้มข้อ อิบนุหิบบานกล่าวว่า \"เขาละหมาดกับท่านรสูลุลลอฮ์ ﷺ ไปยังกิบลัตทั้งสอง แต่ฉันไม่พึ่งสายรายงานของหะดีษของเขา\""]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อบูดาวูดบันทึกในหมวดฏอฮาเราะฮ์ บทกำหนดเวลาการเช็ด (158) ผ่านยะห์ยา บินอัยยูบ จากอับดุรเราะห์มาน บินเราะซีน จากมุหัมมัด บินยะซีด จากอัยยูบ บินเกาะฏ็อน จากอุบัยย์ บินอิมาเราะฮ์ ยะห์ยา บินอัยยูบกล่าวว่า \"เขาเคยละหมาดกับท่านรสูลุลลอฮ์ ﷺ ไปยังกิบลัตทั้งสอง\" อิบนุมาญะฮ์ (557) บันทึกด้วยสำนวน \"ท่านรสูลุลลอฮ์ ﷺ เคยละหมาดในบ้านของเขา ไปยังกิบลัตทั้งสอง\"", "หะดีษนี้อ่อน อิบนุหะญัรยกเพื่อให้รู้สถานะ และเพราะเป็นรายงานที่ชัดที่สุดว่าไม่มีกำหนดเวลา อบูดาวูดกล่าวว่า \"สายรายงานมีความขัดแย้ง และไม่แข็งแรง\" คือสายนี้ไม่แข็งแรงเพราะผู้รายงานบางคนอ่อน หรืออาจหมายถึงตัวหะดีษไม่แข็งแรง เพราะสายรายงานสับสน มีความขัดแย้งเรื่องยะห์ยา บินอัยยูบมาก", "อิมามอะห์มัดกล่าวถึงยะห์ยา บินอัยยูบว่า \"ความจำไม่ดี\" อิบนุมะอีนว่า \"พอใช้ได้\" อัดดารุกุฏนีย์ว่า \"หะดีษของเขาบางส่วนสับสน\" อบูหาติมว่า \"อยู่ในระดับสัจจริง เขียนหะดีษไว้ได้ แต่ใช้เป็นหลักฐานไม่ได้\" อัดดารุกุฏนีย์กล่าวว่า \"สายรายงานนี้ไม่ถูกต้อง และมีความขัดแย้งมากเรื่องยะห์ยา บินอัยยูบ... และอับดุรเราะห์มาน บินเราะซีน มุหัมมัด บินยะซีด และอัยยูบ บินเกาะฏ็อน ล้วนไม่เป็นที่รู้จัก\"", "อบูซุรอะฮ์ อัดดิมัชกีย์ยกคำของอะห์มัดว่า \"ผู้รายงานไม่เป็นที่รู้จัก\" อิบนุอับดิลบัรร์กล่าวว่า \"ไม่ถูกต้อง และไม่มีสายรายงานที่ยืนได้\""]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "ยืนขัดหะดีษกำหนดเวลาไม่ได้", "points_th": ["หะดีษบ่งว่าการเช็ดรองเท้าหุ้มข้อไม่มีกำหนดเวลา ทั้งขณะอยู่บ้านและเดินทาง ถ้าศ่อฮีห์ ก็ถูกจำกัดด้วยหะดีษเรื่องกำหนดเวลาที่กล่าวมา หรือตีความตามที่อิบนุตัยมียะฮ์กล่าว คือผู้เดินทางที่ถ้าถอดจะเป็นอันตราย เพราะจะล่าช้าจากคณะเดินทาง หรือหนาวจัด เป็นต้น", "หรืออาจหมายความว่า ทุกครั้งที่จำเป็นต้องเช็ดก็เช็ดได้ แต่ไม่เกินเงื่อนไขกำหนดเวลา เมื่อครบกำหนดก็ถอดแล้วสวมใหม่ เมื่อสวมขณะสะอาดก็เช็ดได้ ถ้าดูรวมทั้งหมด วันที่เช็ดอาจมากกว่า", "แต่ตราบใดที่เป็นหะดีษอ่อน ก็ยืนขัดกับหะดีษศ่อฮีห์ที่บ่งว่ามีกำหนดเวลาไม่ได้"]}], "tags_th": ["เช็ดรองเท้าหุ้มข้อ", "กำหนดเวลา", "หะดีษอ่อน"]}, {"id": "v1-h067", "volume": 1, "bab": "nawaqid", "topic_ar": "ما جاء في أن النوم اليسير لا ينقض الوضوء", "topic_th": "การหลับเพียงเล็กน้อยไม่ทำให้วุฎูอ์เสีย", "pages": [280, 283], "hadith": [{"no": 67, "matn_ar": "عَنْ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللهُ عَنْهُ قَالَ: كَانَ أَصْحَابُ رَسُولِ اللهِ ﷺ عَلَى عَهْدِهِ يَنْتَظِرُونَ الْعِشَاءَ حَتَّى تَخْفِقَ رُؤُوسُهُمْ، ثُمَّ يُصَلُّونَ وَلَا يَتَوَضَّؤُونَ. أَخْرَجَهُ أَبُو دَاوُدَ، وَصَحَّحَهُ الدَّارَقُطْنِيُّ، وَأَصْلُهُ فِي مُسْلِمٍ.", "translation_th": "จากอนัส บินมาลิก (ร.ฎ.) กล่าวว่า เศาะหาบะฮ์ของท่านรสูลุลลอฮ์ ﷺ ในสมัยของท่าน เคยรอละหมาดอิชาอ์จนศีรษะของพวกเขาสัปหงก แล้วพวกเขาก็ละหมาดโดยไม่อาบน้ำละหมาดใหม่ บันทึกโดยอบูดาวูด อัดดารุกุฏนีย์ระบุว่าศ่อฮีห์ และที่มาของหะดีษอยู่ในมุสลิม", "grade_th": "ศ่อฮีห์"}], "key_rulings_th": ["การหลับเพียงเล็กน้อย คือสัปหงกจนศีรษะผงก ไม่ทำให้วุฎูอ์เสีย ส่วนการหลับสนิทจนไม่รู้สึกตัวทำให้วุฎูอ์เสีย", "ผู้แต่งเห็นว่าที่ถูกต้องคือ ไม่ต่างกันว่าหลับในท่านอน นั่ง พิงหรือไม่พิง", "ตัวการหลับไม่ใช่สิ่งที่ทำให้วุฎูอ์เสีย แต่เป็นสภาพที่น่าจะเกิดฮะดัษ (มะซินนะฮ์) ถ้าหลับแล้วยังรู้สึกตัวว่ามีฮะดัษหรือไม่ วุฎูอ์ไม่เสีย", "แนวทางนี้ประสานหลักฐานได้ทั้งหมด คือหะดีษเศาะฟวาน (นอนทำให้วุฎูอ์เสีย) หมายถึงหลับสนิท ส่วนหะดีษนี้หมายถึงช่วงเริ่มหลับ"], "vocab": [{"ar": "عَلَى عَهْدِهِ", "th": "ในสมัยของท่าน แสดงว่าท่านนบี ﷺ รู้และยอมรับ หะดีษจึงมีหุก่มเป็นมัรฟูอ์"}, {"ar": "الْعِشَاء", "th": "อ่านสระอิและยาว คือช่วงแรกของความมืดกลางคืน ตั้งแต่ละหมาดมัฆริบถึงอะตะมะฮ์ ในที่นี้คือละหมาดอิชาอ์"}, {"ar": "تَخْفِقَ رُؤُوسُهُمْ", "th": "ศีรษะสัปหงกผงกลงเพราะง่วง โดยร่างกายส่วนอื่นยังอยู่"}, {"ar": "النَّوَاقِض", "th": "สิ่งที่ทำให้เสีย (พหูพจน์ของ نَاقِض) นักวิชาการแบ่งเป็นชนิดที่เห็นพ้อง (มีตัวบท) และชนิดที่ขัดแย้ง (ขึ้นกับการวินิจฉัย)"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อบูดาวูด (200) ในหมวดฏอฮาเราะฮ์ บทวุฎูอ์เพราะการนอน และอัดดารุกุฏนีย์ บันทึกผ่านฮิชาม อัดดัสตุวาอีย์ จากเกาะตาดะฮ์ จากอนัส สำนวนเป็นของอบูดาวูด อัดดารุกุฏนีย์ว่า \"ศ่อฮีห์\"", "แต่คำว่า \"ในสมัยของท่าน\" ไม่มีในอัดดารุกุฏนีย์และในอบูดาวูดด้วยสายนี้ อบูดาวูดยกไว้แบบไม่มีสายจากชุอ์บะฮ์ จากเกาะตาดะฮ์ ว่า \"เราอยู่ในสมัยท่านรสูลุลลอฮ์ ﷺ\" (อัลอัลบานีย์ว่าศ่อฮีห์) และอัลบัยฮะกีย์บันทึกด้วยสายถึงชุอ์บะฮ์ว่า \"เศาะหาบะฮ์ของท่านรสูลุลลอฮ์ ﷺ หลับ แล้วลุกขึ้นละหมาด โดยไม่อาบน้ำละหมาด ในสมัยท่านรสูลุลลอฮ์ ﷺ\"", "ที่มาของหะดีษในมุสลิม (376) ผ่านชุอ์บะฮ์ จากเกาะตาดะฮ์ ว่าได้ยินอนัสกล่าวว่า \"เศาะหาบะฮ์ของท่านรสูลุลลอฮ์ ﷺ เคยหลับ แล้วละหมาดโดยไม่อาบน้ำละหมาด\" ฉันถามว่า ท่านได้ยินจากอนัสหรือ เขาตอบว่า ใช่ ขอสาบานต่ออัลลอฮ์ อัตติรมิซีย์ (78) บันทึกด้วยสายนี้และว่าหะซันศ่อฮีห์", "อิบนุหะญัรยกสำนวนของอบูดาวูดเพราะชัดกว่าสำนวนของมุสลิม เพราะมีคำว่า \"จนศีรษะของพวกเขาสัปหงก\" ซึ่งอธิบายว่าการหลับในสำนวนของมุสลิมคือการง่วงและสัปหงก ไม่ใช่หลับสนิทหนักจนไม่รู้สึกตัวว่ามีอะไรออกมา"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ในสมัยของท่าน\" หะดีษจึงมีหุก่มเป็นมัรฟูอ์ เพราะท่านนบี ﷺ รู้และยอมรับ นี่คือจุดที่ใช้เป็นหลักฐาน", "\"รอละหมาดอิชาอ์\" ในฉบับบุลูฆเป็นเช่นนี้ ในอบูดาวูดและอัดดารุกุฏนีย์ว่า \"อิชาอ์สุดท้าย\" อิชาอ์คือช่วงแรกของความมืดกลางคืน ตั้งแต่ละหมาดมัฆริบถึงอะตะมะฮ์ อิบนุฟาริสว่า \"สองอิชาอ์คือมัฆริบและอะตะมะฮ์\"", "\"จนศีรษะของพวกเขาสัปหงก\" ในอัลมิศบาห์ว่า สัปหงกคือเมื่อง่วงแล้วศีรษะเอียงลงโดยร่างกายอื่นไม่ได้ล้ม ในอัลกอมูสว่า \"ศีรษะผงกเมื่อง่วง\""]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "หลับเล็กน้อยและหลับสนิท", "points_th": ["หะดีษเป็นหลักฐานว่าการหลับเล็กน้อยที่ไม่สนิท คือการง่วงที่ศีรษะผงก ไม่ทำให้วุฎูอ์เสีย ต่างจากการหลับสนิทหนักจนไม่รู้สึกว่าอาจมีอะไรออกมา ซึ่งทำให้วุฎูอ์เสีย หะดีษนี้อาจเป็นหลักฐานของทั้งสองประเด็น คือหลับเล็กน้อยไม่เสีย และหลับมากเสีย เพราะในใจของเศาะหาบะฮ์ผู้รายงานรู้กันอยู่แล้วว่าการหลับทำให้วุฎูอ์เสีย นอกจากระดับเล็กน้อยที่เขาเห็นนี้", "ไม่ต่างกัน ตามทัศนะที่ถูกต้อง ว่าหลับในท่านอน นั่ง พิงหรือไม่พิง นี่คือทัศนะที่มีน้ำหนักในประเด็นการหลับทำให้วุฎูอ์เสีย คือถ้าผู้หลับรู้สึกตัวว่าหากมีฮะดัษ วุฎูอ์ไม่เสีย ซึ่งเป็นกรณีหลับเล็กน้อย ส่วนถ้าหลับสนิทจนถ้ามีฮะดัษก็ไม่รู้สึก วุฎูอ์ต้องอาบใหม่ เพราะตัวการหลับไม่ใช่สิ่งที่ทำให้เสีย แต่เป็นสภาพที่น่าจะเกิดฮะดัษ เพราะผู้หลับไม่รู้และไม่รู้สึกถ้ามีอะไรออกมา", "หลักฐานว่าการหลับไม่ใช่สิ่งที่ทำให้เสียในตัวเอง คือการหลับเล็กน้อยไม่ทำให้วุฎูอ์เสียตามหะดีษในบทนี้ ถ้าการหลับทำให้เสียในตัว การหลับที่ศีรษะผงกก็คงทำให้เสีย และเล็กน้อยกับมากคงเหมือนกัน เช่นปัสสาวะและอุจจาระ", "เหตุผลที่ทัศนะนี้มีน้ำหนักสามประการ (1) ทัศนะนี้ประสานหลักฐานได้ทั้งหมด หะดีษเศาะฟวาน บินอัสสาล \"แต่เพราะอุจจาระ ปัสสาวะ และการนอน\" บ่งว่าการนอนทำให้เสีย ส่วนหะดีษในบทนี้ \"พวกเขารอละหมาดอิชาอ์จนศีรษะสัปหงก แล้วละหมาดโดยไม่อาบน้ำละหมาด\" จึงตีความหะดีษแรกว่าหลับสนิทจนถ้ามีฮะดัษก็ไม่รู้สึก และหะดีษที่สองว่าเป็นช่วงเริ่มหลับก่อนหลับสนิท จนถ้ามีฮะดัษก็รู้สึก เพราะศีรษะผงกเกิดในการหลับเล็กน้อย ถ้าทำให้เสีย อัลลอฮ์คงไม่ยอมให้พวกเขาละหมาดในสภาพนั้น แต่คงมีวะห์ยูลงมาแก่ท่านรสูลุลลอฮ์ ﷺ เหมือนเรื่องศาสนาอื่น ๆ และหลักคือเศาะหาบะฮ์มีเกียรติสูง และไม่ได้ไม่รู้ว่าอะไรทำให้วุฎูอ์เสีย โดยเฉพาะผู้ที่รอละหมาดกับท่านนบี ﷺ ซึ่งเป็นเศาะหาบะฮ์ระดับแนวหน้า", "อัลค็อฏฏอบีย์กล่าวว่า \"คำว่า 'เศาะหาบะฮ์ของท่านรสูลุลลอฮ์ ﷺ เคยรอละหมาดอิชาอ์สุดท้ายจนศีรษะสัปหงก' บ่งว่าเรื่องนี้เกิดซ้ำ ๆ จนเหมือนเป็นนิสัย ไม่ได้เกิดน้อยครั้ง ซึ่งยืนยันว่าตัวการหลับไม่ใช่ฮะดัษ\" ส่วนหะดีษอนัสที่ว่า \"ฉันเห็นเศาะหาบะฮ์ของท่านรสูลุลลอฮ์ ﷺ ถูกปลุกให้ละหมาด จนฉันได้ยินเสียงกรนของบางคน แล้วพวกเขาละหมาดโดยไม่อาบน้ำละหมาด\" (อัดดารุกุฏนีย์ ว่าศ่อฮีห์) ไม่กระทบ เพราะการปลุกและการกรนอาจเกิดกับผู้ที่เพิ่งเริ่มหลับ และไม่จำเป็นว่าต้องหลับสนิท", "(2) หะดีษมุอาวิยะฮ์ (จะกล่าวต่อไป): \"ตาคือเชือกผูกทวาร เมื่อตาหลับ เชือกก็หลุด\" สนับสนุนการประสานข้างต้น ความหมายคือ การตื่นคือเชือกผูกทวาร การหลับที่เชือกหลุดคือการหลับสนิทจนไม่รู้สึกตัวว่ามีอะไรออกมา ซึ่งคือการหลับที่ทำให้วุฎูอ์เสีย ส่วนนอกจากนั้นไม่เสีย (3) หะดีษอิบนุอับบาสเรื่องละหมาดกลางคืน: \"เมื่อฉันง่วง ท่านก็จับติ่งหูของฉัน\" (อัลบุคอรีย์ มุสลิม) บ่งว่าการหลับเล็กน้อยขณะละหมาดไม่ทำให้วุฎูอ์เสีย"]}], "tags_th": ["สิ่งที่ทำให้วุฎูอ์เสีย", "การนอน", "สัปหงก", "ฮะดัษ", "อิชาอ์"]}, {"id": "v1-h068", "volume": 1, "bab": "nawaqid", "topic_ar": "ما جاء في أن دم الاستحاضة ناقض للوضوء", "topic_th": "เลือดเสีย (อิสติหาเฎาะฮ์) ทำให้วุฎูอ์เสีย", "pages": [284, 288], "hadith": [{"no": 68, "matn_ar": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: جَاءَتْ فَاطِمَةُ بِنْتُ أَبِي حُبَيْشٍ إِلَى النَّبِيِّ ﷺ، فَقَالَتْ: يَا رَسُولَ اللهِ! إِنِّي امْرَأَةٌ أُسْتَحَاضُ فَلَا أَطْهُرُ، أَفَأَدَعُ الصَّلَاةَ؟ قَالَ: «لَا، إِنَّمَا ذَلِكِ عِرْقٌ، وَلَيْسَ بِحَيْضٍ، فَإِذَا أَقْبَلَتْ حَيْضَتُكِ فَدَعِي الصَّلَاةَ، وَإِذَا أَدْبَرَتْ فَاغْسِلِي عَنْكِ الدَّمَ، ثُمَّ صَلِّي». مُتَّفَقٌ عَلَيْهِ. وَلِلْبُخَارِيِّ: «ثُمَّ تَوَضَّئِي لِكُلِّ صَلَاةٍ»، وَأَشَارَ مُسْلِمٌ إِلَى أَنَّهُ حَذَفَهَا عَمْدًا.", "translation_th": "จากอาอิชะฮ์ (ร.ฎ.) กล่าวว่า ฟาฏิมะฮ์ บินติอบีหุบัยช์ มาหาท่านนบี ﷺ แล้วกล่าวว่า โอ้ท่านรสูลุลลอฮ์ ฉันเป็นผู้หญิงที่มีเลือดเสีย ไม่สะอาดเลย ฉันต้องละการละหมาดหรือ ท่านตอบว่า \"ไม่ นั่นคือเลือดจากเส้นเลือด ไม่ใช่ประจำเดือน เมื่อประจำเดือนของเธอมา ก็จงละการละหมาด และเมื่อมันหมดไป ก็จงล้างเลือดออกจากตัวเธอ แล้วละหมาด\" บันทึกโดยอัลบุคอรีย์และมุสลิม และในรายงานของอัลบุคอรีย์: \"แล้วจงอาบน้ำละหมาดทุกละหมาด\" และมุสลิมชี้ว่าเขาตัดส่วนนี้ออกโดยเจตนา", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม) ส่วนเพิ่ม \"แล้วจงอาบน้ำละหมาดทุกละหมาด\" มีข้อขัดแย้งว่าเป็นคำของท่านนบี ﷺ หรือของอุรวะฮ์"}], "key_rulings_th": ["เลือดเสียเป็นฮะดัษที่ทำให้วุฎูอ์เสีย ตามทัศนะของนักวิชาการส่วนใหญ่ ยกเว้นมาลิกีย์", "ทุกสิ่งที่ออกจากทวารทั้งสอง ทั้งปัสสาวะ อุจจาระ เลือด มะซีย์ และลม ทำให้วุฎูอ์เสียโดยอิจญ์มาอ์ ยกเว้นผู้มีฮะดัษต่อเนื่อง เช่น ปัสสาวะเล็ด", "ผู้ที่ยึดส่วนเพิ่มของอัลบุคอรีย์ เห็นว่าหญิงที่มีเลือดเสียต้องอาบน้ำละหมาดทุกละหมาดหลังเข้าเวลา", "เลือดประจำเดือนและเลือดเสียเป็นนะญิส ต้องล้างออก", "ผู้แต่งเห็นว่าทัศนะที่ว่าส่วนเพิ่มเป็นคำของอุรวะฮ์ (เมากูฟ) มีน้ำหนัก ตามที่มุสลิม อันนะสาอีย์ และอัลบัยฮะกีย์ตัดสิน"], "vocab": [{"ar": "فَاطِمَة بِنْت أَبِي حُبَيْش", "th": "อบูหุบัยช์ (รูปย่อ) ชื่อจริงคือก็อยส์ บินอัลมุฏฏอลิบ บินอะสัด นางเป็นชาวกุร็อยช์ เผ่าอะสัด หนึ่งในหญิงที่มีเลือดเสียในสมัยท่านนบี ﷺ"}, {"ar": "أُسْتَحَاضُ", "th": "ฉันมีเลือดเสีย (อิสติหาเฎาะฮ์) คือเลือดที่ไหลนอกช่วงเวลาปกติ"}, {"ar": "عِرْق", "th": "เลือดจากเส้นเลือดที่เรียกว่า อัลอาซิล (หรืออัลอาซิร) ไม่ใช่เลือดประจำเดือนที่ออกจากก้นมดลูกตามเวลาที่รู้กัน"}, {"ar": "أَقْبَلَتْ حَيْضَتُكِ / أَدْبَرَتْ", "th": "ประจำเดือนมา คือเลือดเริ่มออกในวันตามปกติ / หมดไป คือเลือดหยุดตามวันปกติ"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกในหมวดวุฎูอ์ บทการล้างเลือด (228) และมุสลิมในหมวดประจำเดือน บทหญิงที่มีเลือดเสีย การอาบน้ำและการละหมาดของนาง (333) ผ่านฮิชาม บินอุรวะฮ์ จากบิดา จากอาอิชะฮ์ สำนวนเป็นของอัลบุคอรีย์ ใกล้เคียงกับของมุสลิม", "อัลบุคอรีย์มีส่วนเพิ่มจากมุสลิม ผ่านอบูมุอาวิยะฮ์ จากฮิชาม ว่า บิดาของฉัน (อุรวะฮ์) กล่าวว่า \"แล้วจงอาบน้ำละหมาดทุกละหมาด\" นักวิชาการกลุ่มหนึ่ง รวมถึงอิบนุหะญัร ว่าเป็นคำของท่านนบี ﷺ ที่ต่อเนื่องด้วยสายเดียวกัน เพราะถ้าเป็นคำของอุรวะฮ์ ก็คงกล่าวว่า \"แล้วนางอาบน้ำละหมาด\" ในรูปบอกเล่า แต่มาในรูปคำสั่ง จึงบ่งว่าเป็นส่วนของหะดีษ สนับสนุนด้วยรายงานของอัตติรมิซีย์ผ่านอบูมุอาวิยะฮ์: \"และท่านกล่าวว่า จงอาบน้ำละหมาดทุกละหมาด จนกว่าเวลานั้นจะมาถึง\"", "นักวิชาการผู้เชี่ยวชาญกลุ่มหนึ่งว่าเป็นคำของอุรวะฮ์ (เมากูฟ) เพราะคำของฮิชามตอนท้าย \"และบิดาของฉันกล่าวว่า แล้วจงอาบน้ำละหมาดทุกละหมาด จนกว่าเวลานั้นจะมาถึง\" ซึ่งชัดว่าเป็นคำของอุรวะฮ์ เพราะฮิชามไม่ได้รายงานหะดีษนี้จากคนอื่นนอกจากบิดา จุดประสงค์ของเขาจึงเป็นการแยกส่วนที่เป็นมัรฟูอ์จากเมากูฟ อีกทั้งส่วนเพิ่มนี้มาจากความขัดแย้งในรายงานของอบูมุอาวิยะฮ์ ซึ่งรายงานไม่คงที่ อิมามอะห์มัดว่า \"นอกจากหะดีษอัลอะอ์มัช เขาสับสน จำได้ไม่ดี\"", "มุสลิมบันทึกผ่านหัมมาด บินซัยด์ จากฮิชามด้วย และกล่าวว่า \"ในหะดีษหัมมาดมีคำหนึ่งที่เราไม่ได้กล่าวถึง\" คือส่วนเพิ่มในอัลบุคอรีย์ มุสลิมคงตัดออกเพราะหัมมาดรายงานคนเดียว อันนะสาอีย์สนับสนุนว่า \"หลายคนรายงานหะดีษนี้จากฮิชาม ไม่มีใครกล่าวว่า 'และจงอาบน้ำละหมาด' นอกจากหัมมาด\" อัลบัยฮะกีย์ว่า \"มีส่วนเพิ่มเรื่องอาบน้ำละหมาดทุกละหมาด และไม่ใช่สำนวนที่ถูกต้อง\"", "อิบนุหะญัรแย้งว่าการที่อันนะสาอีย์ชี้ข้อบกพร่องของหัมมาดไม่ดีนัก เพราะอบูมุอาวิยะฮ์รายงานตรงกัน (อัลบุคอรีย์ อัตติรมิซีย์) และหัมมาด บินสะละมะฮ์ก็รายงานตรงกัน (อัดดาริมีย์: \"...ก็จงล้างเลือดออกจากตัวเธอ และอาบน้ำละหมาดและละหมาด\") แต่ผู้แต่งชี้ว่านี่ไม่ได้มีคำสั่งให้อาบน้ำละหมาดทุกละหมาด มีแค่คำสั่งให้อาบน้ำละหมาดหลังล้างเลือด อิบนุอับดิลบัรร์บันทึกผ่านอัฟฟาน จากหัมมาด โดยไม่มีคำว่า \"และอาบน้ำละหมาด\" และอัฟฟานเป็นศิษย์ที่แม่นที่สุดของหัมมาด จึงมาก่อน อบูหัมซะฮ์ อัสสุกกะรีย์และอบูอะวานะฮ์ก็รายงานตรงกัน แต่บางครั้งต่อเนื่อง บางครั้งมุรสัล หรือรายงานตามความหมาย", "ผู้แต่งเห็นว่าทัศนะว่าส่วนนี้เป็นคำของอุรวะฮ์ และการยกเป็นมัรฟูอ์ไม่ใช่สำนวนที่ถูกต้อง มีน้ำหนักด้วยสามเหตุ (1) ตามรูปการเรียบเรียงของอัลบุคอรีย์ เพราะฮิชามรายงานหะดีษจากบิดาเท่านั้น แล้วกล่าวว่า \"บิดาของฉันกล่าวว่า...\" ถ้าไม่ได้ต้องการแยกมัรฟูอ์จากเมากูฟ ก็ไม่มีเหตุให้ระบุเช่นนั้น (2) อิมามรุ่นใหญ่ตัดสินว่าไม่ใช่สำนวนที่ถูกต้อง เช่น มุสลิม อันนะสาอีย์ และอัลบัยฮะกีย์ อิบนุเราะญับว่า \"ที่ถูกคือคำว่าวุฎูอ์ในหะดีษแทรกเข้ามาจากคำของอุรวะฮ์\" มาลิกก็รายงานจากฮิชาม จากบิดาว่า \"หญิงที่มีเลือดเสียไม่ต้องทำอะไร นอกจากอาบน้ำครั้งเดียว แล้วอาบน้ำละหมาดหลังจากนั้นทุกละหมาด\" (3) มีผู้รายงานหะดีษนี้จากฮิชามสิบกว่าคน รวมถึงอิมามผู้เชี่ยวชาญ เช่น มาลิก วะกีอ์ สุฟยาน บินอุยัยนะฮ์ และยะห์ยา บินสะอีด ไม่มีใครกล่าวถึงส่วนเพิ่มนี้ การแทรกในส่วนมัรฟูอ์อาจเกิดจากผู้รายงานบางคนที่ไม่แม่นเท่าผู้ที่ไม่ได้กล่าวถึง", "คำว่า \"แล้วจงอาบน้ำละหมาดทุกละหมาด\" คือจุดประสงค์ที่อิบนุหะญัรยกหะดีษนี้ในบทสิ่งที่ทำให้วุฎูอ์เสีย ส่วนความเกี่ยวข้องกับบทประจำเดือน ท่านจะยกไว้ที่นั่น"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ฉันมีเลือดเสีย\" คือเลือดไหลนอกเวลาปกติ (จะกล่าวในบทประจำเดือน) \"ไม่สะอาดเลย\" ความสะอาดในที่นี้คือการพ้นจากเลือด ความหมายคือ ไม่พ้นจากเลือด สิ่งที่นางรู้คือหญิงที่มีประจำเดือนจะรู้ว่าสะอาดเมื่อเลือดหยุด จึงสื่อถึงการไม่สะอาดว่าเลือดไหลต่อเนื่อง", "\"ฉันต้องละการละหมาดหรือ\" เป็นการถามว่าหุก่มประจำเดือนยังคงอยู่ในสภาพที่เลือดไหลต่อเนื่องหรือไม่ หลังจากนางรู้ว่าหญิงมีประจำเดือนห้ามละหมาด จึงคิดว่าหุก่มนั้นผูกกับการไหลของเลือด \"ไม่\" คืออย่าละการละหมาด", "\"นั่นคือเลือดจากเส้นเลือด\" อ่านกัสเราะฮ์ที่อักษรกาฟ เพราะพูดกับผู้หญิงที่ถาม เส้นเลือดนี้เรียกว่า อัลอาซิล (บ้างว่าอัลอาซิร) ความหมายคือ เลือดของเธอไม่ใช่เลือดประจำเดือน เพราะเลือดประจำเดือนออกจากก้นมดลูกในเวลาที่รู้กัน ส่วนนี้เกิดจากเส้นเลือดแตก ซึ่งเป็นการบอกถึงความต่างของที่มา", "\"เมื่อประจำเดือนของเธอมา...\" ประจำเดือนมาคือเลือดเริ่มออกในวันปกติของนาง และหมดไปคือเวลาที่เลือดหยุดตามวันปกติ ความหมายคือ นางแยกเลือดประจำเดือนกับเลือดเสียได้ จึงงดละหมาดในวันปกติ เมื่อหมดก็อาบน้ำแล้วละหมาด และไม่ต้องสนใจเลือดที่ยังมีอยู่หลังจากนั้น เพราะเป็นเลือดเสีย"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "เลือดเสียและสิ่งที่ออกจากทวาร", "points_th": ["ผู้ที่เห็นว่าเลือดเสียเป็นฮะดัษที่ทำให้วุฎูอ์เสียอ้างหะดีษนี้ เพราะศาสนาสั่งให้อาบน้ำละหมาดเพราะมันในคำว่า \"แล้วจงอาบน้ำละหมาดทุกละหมาด\" เป็นทัศนะของนักวิชาการส่วนใหญ่ ยกเว้นมาลิกีย์ ซึ่งเห็นว่าเลือดเสียไม่ทำให้เสีย", "ทุกสิ่งที่ออกจากทวารทั้งสองทำให้วุฎูอ์เสีย ไม่ว่าจะเป็นปัสสาวะ อุจจาระ เลือด หรือมะซีย์ ลมจากทวารหนักก็เช่นกัน เรื่องนี้เป็นอิจญ์มาอ์ตามที่อิบนุลมุนซิรและคนอื่นรายงาน นี่คือจุดประสงค์ของอิบนุหะญัรในการยกหะดีษนี้ไว้ในบทนี้", "ยกเว้นผู้มีฮะดัษต่อเนื่อง ซึ่งวุฎูอ์ไม่เสีย เช่น ผู้มีปัสสาวะเล็ด ลม หรืออุจจาระไหลไม่หยุด และในมาลิกีย์ เลือดเสียก็เช่นกัน"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "อาบน้ำละหมาดทุกละหมาด", "points_th": ["ผู้ที่ยึดว่าส่วนเพิ่มเรื่องวุฎูอ์ถูกต้อง อ้างหะดีษนี้ว่าหญิงที่มีเลือดเสียต้องอาบน้ำละหมาดทุกละหมาด เพราะรูปคำสั่งบ่งว่าเป็นวาญิบ ความหมายคือ นางไม่อาบน้ำละหมาดสำหรับละหมาดที่มีกำหนดเวลา เช่น ซุฮ์รี จนกว่าจะเข้าเวลา ส่วนละหมาดที่ไม่มีกำหนดเวลา เช่น ละหมาดฎุฮา นางอาบน้ำละหมาดเมื่อต้องการทำ", "ผู้แต่งจะอธิบายประเด็นนี้ละเอียดกว่านี้ในบทประจำเดือน เมื่อกล่าวถึงการอาบน้ำของหญิงที่มีเลือดเสีย"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "เลือดประจำเดือนและเลือดเสียเป็นนะญิส", "points_th": ["หะดีษเป็นหลักฐานว่าเลือดประจำเดือนเป็นนะญิส เลือดเสียก็เช่นกัน เพราะคำว่า \"และเมื่อมันหมดไป ก็จงล้างเลือดออกจากตัวเธอ แล้วละหมาด\" (กล่าวไปแล้วในบทการขจัดนะญิส)", "ประโยชน์อื่นของหะดีษนี้และหุก่มของหญิงที่มีเลือดเสีย ผู้แต่งจะกล่าวในบทประจำเดือน อินชาอัลลอฮ์"]}], "tags_th": ["สิ่งที่ทำให้วุฎูอ์เสีย", "เลือดเสีย", "อิสติหาเฎาะฮ์", "ประจำเดือน", "มุดร็อจ"]}, {"id": "v1-h069", "volume": 1, "bab": "nawaqid", "topic_ar": "بيان حكم المذي", "topic_th": "หุก่มของมะซีย์", "pages": [289, 296], "hadith": [{"no": 69, "matn_ar": "عَنْ عَلِيِّ بْنِ أَبِي طَالِبٍ رَضِيَ اللهُ عَنْهُ قَالَ: كُنْتُ رَجُلًا مَذَّاءً، فَأَمَرْتُ الْمِقْدَادَ بْنَ الْأَسْوَدِ أَنْ يَسْأَلَ النَّبِيَّ ﷺ، فَسَأَلَهُ؟ فَقَالَ: «فِيهِ الْوُضُوءُ». مُتَّفَقٌ عَلَيْهِ، وَاللَّفْظُ لِلْبُخَارِيِّ.", "translation_th": "จากอะลี บินอบีฏอลิบ (ร.ฎ.) กล่าวว่า ฉันเป็นคนที่มีมะซีย์ออกมาก จึงขอให้อัลมิกดาด บินอัลอัสวัด ถามท่านนบี ﷺ เขาจึงถาม ท่านตอบว่า \"ในกรณีนั้นต้องอาบน้ำละหมาด\" บันทึกโดยอัลบุคอรีย์และมุสลิม สำนวนเป็นของอัลบุคอรีย์", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["มะซีย์ทำให้วุฎูอ์เสีย และไม่ต้องอาบน้ำ (ฆุสล์) โดยอิจญ์มาอ์", "มะซีย์เป็นนะญิส แต่ตามทัศนะที่ถูกต้อง เล็กน้อยได้รับการอนุโลม เพราะหลีกเลี่ยงยาก", "ผู้แต่งเห็นว่าทัศนะที่ตรงกับหะดีษคือต้องล้างอวัยวะเพศทั้งหมดและอัณฑะ ไม่ใช่แค่ที่เปื้อน (อิบนุตัยมียะฮ์และอิบนุบาซเห็นว่ามีน้ำหนัก)", "การขจัดมะซีย์ต้องใช้น้ำ ใช้หินแทนไม่ได้", "ผู้แต่งเห็นว่ามะซีย์ที่เปื้อนเสื้อ เพียงพรมน้ำก็พอ ไม่ต้องล้าง (อิบนุตัยมียะฮ์และอิบนุลก็อยยิมเลือก)", "อนุญาตให้ฝากผู้อื่นถามปัญหาศาสนาเมื่อมีเหตุ เช่น ความเขินอาย และรับข่าวจากผู้เชื่อถือได้คนเดียวได้"], "vocab": [{"ar": "مَذَّاء", "th": "คนที่มีมะซีย์ออกมาก (รูปคำเน้นความมาก)"}, {"ar": "الْمَذْي", "th": "น้ำใสบาง ออกตามหลังความใคร่ โดยไม่พุ่งและไม่รู้สึกว่าออก"}, {"ar": "فِيهِ الْوُضُوءُ", "th": "ในกรณีนั้นต้องอาบน้ำละหมาด ในรายงานของมุสลิมว่า مِنْهُ الْوُضُوءُ"}, {"ar": "النَّضْح", "th": "การพรมน้ำ บางครั้งหมายถึงการล้าง"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกในหมวดความรู้ บทผู้ที่อายแล้วให้ผู้อื่นถาม (132) ผ่านอับดุลลอฮ์ บินดาวูด จากอัลอะอ์มัช จากมุนซิร อัษเษารีย์ จากมุหัมมัด บินอัลหะนะฟียะฮ์ จากอะลี ในหมวดวุฎูอ์ บทผู้ที่ไม่เห็นว่าต้องอาบน้ำละหมาดนอกจากสิ่งที่ออกจากทวารทั้งสอง (178) ผ่านญะรีร บินอับดิลหะมีด จากอัลอะอ์มัช และในหมวดการอาบน้ำ บทการล้างมะซีย์และอาบน้ำละหมาดเพราะมัน (269) ผ่านซาอิดะฮ์ จากอบูหะศีน จากอบูอับดิรเราะห์มาน อัสสุละมีย์ จากอะลี สำนวนในบุลูฆเป็นของอัลบุคอรีย์ในหมวดความรู้", "มุสลิมบันทึกในหมวดประจำเดือน บทมะซีย์ (303) หลายสาย ด้วยสำนวน \"ท่านตอบว่า ต้องอาบน้ำละหมาดเพราะมัน\" อิบนุอับดิลบัรร์กล่าวว่า \"หะดีษนี้ยืนยันในหมู่นักวิชาการ ศ่อฮีห์ มีหลายสายจากอะลี อัลมิกดาด และอัมมาร ทั้งหมดศ่อฮีห์หะซัน\"", "ผู้ที่ถามท่านรสูลุลลอฮ์ ﷺ เรื่องมะซีย์มีสามคน คืออะลี (หะดีษในเศาะฮีหัยน์) สะฮ์ล์ บินหุนัยฟ์ และอับดุลลอฮ์ บินสะอ์ด์ อัลอันศอรีย์ (จะกล่าวต่อไป)"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ฉันเป็นคนที่มีมะซีย์ออกมาก\" (มัซซาอ์) รูปคำเน้นความมาก ในอีกรายงานเขาเล่าว่า \"ฉันเป็นคนที่มีมะซีย์ออกมาก ฉันจึงอาบน้ำในฤดูหนาวจนหลังแตก ฉันเล่าให้ท่านรสูลุลลอฮ์ ﷺ ฟัง ท่านกล่าวว่า อย่าทำ เมื่อเธอเห็นมะซีย์ ก็ล้างอวัยวะเพศ และอาบน้ำละหมาดเหมือนวุฎูอ์ละหมาด และเมื่ออสุจิพุ่งออก ก็อาบน้ำ\" (อบูดาวูด อันนะสาอีย์ อะห์มัด สายรายงานศ่อฮีห์) มะซีย์คือน้ำใสที่ออกตามหลังความใคร่ โดยไม่พุ่งและไม่รู้สึกว่าออก", "\"ฉันขอให้อัลมิกดาด บินอัลอัสวัด ถามท่านนบี ﷺ\" ในรายงานของอัลบุคอรีย์มีเหตุผลว่า \"ฉันอายที่จะถามท่านรสูลุลลอฮ์ ﷺ\" และอีกสำนวน \"เพราะลูกสาวของท่านเป็นภรรยาฉัน\" ในมุสลิม \"เพราะฟาฏิมะฮ์\" เหตุผลคือเขาอายท่านรสูลุลลอฮ์ ﷺ เพราะลูกสาวของท่านเป็นภรรยาของเขา และมะซีย์เกี่ยวกับเรื่องความใคร่", "ตามบริบท ผู้ถามคืออัลมิกดาด บินอัลอัสวัด คืออัลมิกดาด บินอัมร์ บินษะอ์ละบะฮ์ อัลกินดีย์ ที่เรียกว่าบินอัลอัสวัด เพราะอัลอัสวัด บินอับดิยะฆูษ อัซซุฮ์รีย์ รับเขาเป็นบุตรบุญธรรม เขาเข้ารับอิสลามแต่เนิ่น ๆ อพยพทั้งสองครั้ง แต่งงานกับฎุบาอะฮ์ บินติอัซซุบัยร์ บินอับดิลมุฏฏอลิบ ลูกพี่ลูกน้องของท่านนบี ﷺ ร่วมสงครามบัดร์และหลังจากนั้น เสียชีวิตปี ฮ.ศ. 33 และฝังที่อัลบะกีอ์", "อะลีขอให้อัลมิกดาดถาม ไม่ใช่คนอื่น เพราะมีการสนทนาเรื่องมะซีย์ระหว่างพวกเขา อับดุรร็อซซากบันทึกว่า อะลี อัมมาร และอัลมิกดาดคุยกันเรื่องมะซีย์ อะลีกล่าวว่า ฉันเป็นคนที่มีมะซีย์มาก จงถามท่านรสูลุลลอฮ์ ﷺ เพราะฉันอายที่จะถามเพราะลูกสาวของท่าน ถ้าไม่ใช่เพราะเหตุนั้น ฉันคงถามเอง แล้วหนึ่งในสองคนนั้น อัมมารหรืออัลมิกดาด ก็ถาม บางรายง จึงมีหุก่มเหมือนปัสสาวะในเรื่องความเป็นนะญิส", "ตามทัศนะที่ถูกต้องจากสองทัศนะ มะซีย์เล็กน้อยได้รับการอนุโลม เป็นอีกรายงานจากอิมามอะห์มัด ผู้แต่งอัลอินศ็อฟกล่าวว่า \"นี่คือสิ่งที่ถูกต้อง โดยเฉพาะสำหรับคนหนุ่ม\" เพราะเป็นนะญิสที่หลีกเลี่ยงยาก เนื่องจากเปื้อนเสื้อผ้าของคนหนุ่มโสดบ่อย จึงสมควรได้รับการผ่อนปรนยิ่งกว่าปัสสาวะทารกชายและสิ่งที่ติดใต้รองเท้าหุ้มข้อ"]}, {"wajh": 7, "type": "fiqh", "heading_ar": null, "heading_th": "มะซีย์ทำให้วุฎูอ์เสีย", "points_th": ["มะซีย์ทำให้วุฎูอ์เสีย ต้องอาบน้ำละหมาดเพราะมัน ตามคำว่า \"จงล้างอวัยวะเพศและอาบน้ำละหมาด\" และไม่ต้องอาบน้ำ (ฆุสล์) โดยอิจญ์มาอ์ ตามที่อิบนุอับดิลบัรร์รายงาน และอิบนุกุดามะฮ์ยกจากอิบนุลมุนซิร", "หะดีษอับดุลลอฮ์ บินสะอ์ด์ อัลอันศอรีย์: \"ฉันถามท่านรสูลุลลอฮ์ ﷺ ถึงสิ่งที่ทำให้ต้องอาบน้ำ และน้ำที่ออกหลังน้ำ (ปัสสาวะ) ท่านตอบว่า นั่นคือมะซีย์ ผู้ชายทุกคนมีมะซีย์ จงล้างอวัยวะเพศและอัณฑะเพราะมัน และอาบน้ำละหมาดเหมือนวุฎูอ์ละหมาด\" (อบูดาวูด อิบนุหะญัรว่าอ่อนในอัตตัลคีศ)", "ถ้ามะซีย์ไหลไม่หยุด หุก่มเหมือนปัสสาวะเล็ด เมื่อเข้าเวลาละหมาด ให้ล้างอวัยวะเพศ แล้วพันด้วยบางสิ่งเพื่อไม่ให้นะญิสเปื้อนเสื้อผ้าและร่างกาย แล้วอาบน้ำละหมาดและละหมาด สิ่งที่ออกมาหลังจากนั้นไม่เป็นไร เพราะเกิดโดยไม่สมัครใจ เทียบกับหญิงที่มีเลือดเสีย", "ในรายงานของอัลบุคอรีย์ \"จงอาบน้ำละหมาดและล้างอวัยวะเพศ\" ตามรูปคำ คำสั่งให้อาบน้ำละหมาดมาก่อนการล้างอวัยวะเพศ แต่ในอุมดะตุลอะห์กาม \"จงล้างอวัยวะเพศและอาบน้ำละหมาด\" และคำว่า \"และ\" ไม่บ่งลำดับ อีกทั้งสำนวนของมุสลิม \"ให้ล้างอวัยวะเพศและอาบน้ำละหมาด\" อธิบายความหมาย สิ่งที่เหมาะสมกว่าคือล้างอวัยวะเพศก่อนอาบน้ำละหมาด"]}, {"wajh": 8, "type": "fiqh", "heading_ar": null, "heading_th": "ล้างอวัยวะเพศทั้งหมดหรือเฉพาะที่เปื้อน", "points_th": ["ทัศนะที่หนึ่ง: วาญิบให้ล้างอวัยวะเพศทั้งหมด ทั้งส่วนที่มะซีย์เปื้อนและไม่เปื้อน เพราะคำว่า \"จงล้างอวัยวะเพศ\" เป็นคำสั่ง และคำสั่งหมายถึงวาญิบ เป็นทัศนะของมาลิก และอีกรายงานจากอะห์มัด", "ทัศนะที่สอง: ล้างอวัยวะเพศทั้งหมดและอัณฑะ เป็นทัศนะที่รู้จักในมัซฮับหันบะลีย์ ตามรายงาน \"ให้ล้างอวัยวะเพศและอัณฑะ แล้วอาบน้ำละหมาด\" และในหะดีษอับดุลลอฮ์ บินสะอ์ด์ \"จงล้างอวัยวะเพศและอัณฑะเพราะมัน และอาบน้ำละหมาด\" แต่คำว่า \"และอัณฑะ\" ไม่ยืนยันในหะดีษอะลี", "ทัศนะที่สาม: ล้างเพียงปลายอวัยวะเพศ หรือที่ที่นะญิสเปื้อน เป็นทัศนะของนักนิติศาสตร์ส่วนใหญ่จากชาฟิอีย์และหะนะฟีย์ และอีกรายงานจากอะห์มัด โดยเทียบกับนะญิสอื่น เพราะเป็นฮะดัษหนึ่ง จึงล้างเฉพาะที่ออก เหมือนปัสสาวะและอุจจาระ และเพราะหะดีษบางบทกล่าวถึงแต่วุฎูอ์", "ผู้แต่งเห็นว่าทัศนะที่สองสอดคล้องกับรูปคำของหะดีษมากกว่า เพราะความกว้างของคำว่า \"ให้ล้างอวัยวะเพศ\" บังคับให้ล้างทั้งหมด ทั้งที่เปื้อนและไม่เปื้อน ประกอบกับการล้างอัณฑะ ดังที่กล่าวมา เมื่อยืนยันด้วยหลักฐานที่ถูกต้อง ก็ต้องปฏิบัติตาม และนี่คือทัศนะที่ชัดของอิบนุตัยมียะฮ์ และอิบนุบาซเห็นว่ามีน้ำหนัก", "วิทยปัญญาของคำสั่งให้ล้างอวัยวะเพศและอัณฑะ ตามทัศนะที่เห็นเช่นนั้น คือมะซีย์ซึ่งเกิดจากการเล้าโลมภรรยา อาจกระจายไปบนอวัยวะเพศและอัณฑะโดยคนไม่รู้สึก (อัลค็อฏฏอบีย์) บางท่านว่า เพราะช่วยลดหรือหยุดมะซีย์ โดยเฉพาะถ้าล้างด้วยน้ำเย็น ซึ่งเป็นเหตุให้หยุดและไม่ออกต่อเนื่อง", "ส่วนสำนวนของอัลบุคอรีย์ \"จงอาบน้ำละหมาดและพรมน้ำที่อวัยวะเพศ\" หมายถึงการล้าง เพราะการพรม (นัฎห์) อาจหมายถึงการล้างหรือการพรมก็ได้ และในอีกสำนวนของอัลบุคอรีย์ \"จงล้างอวัยวะเพศ\" การพรมในที่นี้จึงหมายถึงการล้าง", "นักหะดีษผู้เชี่ยวชาญวิจารณ์รายงานของอะห์มัดและอบูดาวูด ผ่านฮิชาม บินอุรวะฮ์ จากบิดา จากอะลี ว่าเป็นมุรสัล เพราะอุรวะฮ์ไม่ได้ฟังจากอะลี ตามที่อบูหาติมและอบูซุรอะฮ์กล่าว แต่อบูอะวานะฮ์บันทึกผ่านอุบัยดะฮ์ อัสสัลมานีย์ จากอะลี พร้อมส่วนเพิ่ม \"ให้ล้างอวัยวะเพศและอัณฑะ\" อิบนุหะญัรว่า \"สายรายงานไม่มีข้อวิจารณ์\" และอิบนุตัยมียะฮ์กล่าวว่า \"ถ้ามีผู้ว่า ฮิชามรายงานจากบิดา จากอะลี ซึ่งไม่ทันยุคเขา เราตอบว่า ผู้รายงานแบบมุรสัลคือหนึ่งในนักนิติศาสตร์ทั้งเจ็ด รายงานเพื่ออธิบายหุก่ม และนี่เป็นมุรสัลที่แข็งแรงที่สุดประเภทหนึ่ง\""]}, {"wajh": 9, "type": "fiqh", "heading_ar": null, "heading_th": "ต้องใช้น้ำ", "points_th": ["หะดีษเป็นหลักฐานว่าการขจัดมะซีย์ต้องใช้น้ำ ใช้หินหรือสิ่งอื่นแทนไม่ได้ เพราะกำหนดให้ล้าง และสิ่งที่ถูกกำหนดจะปฏิบัติตามได้ก็ด้วยการทำสิ่งนั้น และเทียบกับปัสสาวะไม่ได้ เพราะศาสนาสั่งให้ล้างอวัยวะเพศและอัณฑะ จึงเป็นหุก่มเฉพาะมะซีย์ ไม่ใช่ปัสสาวะ ซึ่งล้างเฉพาะที่เปื้อน", "และรายงานต่าง ๆ แม้สำนวนและสายจะต่างกัน ไม่มีรายงานใดกล่าวถึงการชำระด้วยหิน จึงแสดงว่าการชำระด้วยหินมีเฉพาะปัสสาวะและอุจจาระ"]}, {"wajh": 10, "type": "fiqh", "heading_ar": null, "heading_th": "มะซีย์ที่เปื้อนเสื้อผ้า", "points_th": ["ทัศนะที่หนึ่ง: ต้องล้างเท่านั้น เป็นทัศนะของหะนะฟีย์ มาลิกีย์ ชาฟิอีย์ และทัศนะหนึ่งในหันบะลีย์ โดยยึดหะดีษที่สั่งให้ล้าง", "ทัศนะที่สอง: เพียงพรมน้ำ (นัฎห์) ก็พอ เป็นอีกรายงานจากอะห์มัด อัตติรมิซีย์ยกคำของเขาว่า \"ฉันหวังว่าการพรมน้ำจะเพียงพอ\" หลักฐานคือหะดีษสะฮ์ล์ บินหุนัยฟ์ ว่าท่านรสูลุลลอฮ์ ﷺ กล่าวแก่เขาว่า \"เพียงพอสำหรับท่านที่จะตักน้ำหนึ่งกอบ แล้วพรมบนเสื้อตรงที่เห็นว่าเปื้อน\" (อบูดาวูด อัตติรมิซีย์ว่าหะซันศ่อฮีห์ ผ่านมุหัมมัด บินอิสหาก ซึ่งระบุชัดว่าได้ยินในรายงานของอะห์มัด ความสงสัยเรื่องการตัดลีสจึงหมดไป)", "ผู้แต่งเห็นว่าที่ถูกต้อง อินชาอัลลอฮ์ คือการพรมน้ำบนเสื้อก็พอ ไม่ต้องล้าง อิบนุตัยมียะฮ์และอิบนุลก็อยยิมศิษย์ของเขาเลือก เพราะการล้างมีกล่าวถึงที่อวัยวะเพศ ไม่ใช่ที่เสื้อ และรายงานเรื่องการพรมเสื้อไม่มีสิ่งใดขัด ส่วนอวัยวะเพศมีทั้งรายงานการพรมและการล้าง การพรมจึงอธิบายด้วยการล้าง อิบนุอับดิลบัรร์ระบุว่า การพรมในภาษาอาหรับบางครั้งหมายถึงการล้าง บางครั้งหมายถึงการพรม", "อิบนุตัยมียะฮ์กล่าวว่า \"มะซีย์ได้รับการอนุโลมตามรายงานที่แข็งแรงกว่า เพราะเป็นเรื่องที่เกิดกับทุกคน และหลีกเลี่ยงยาก จึงเหมือนเลือด หรือยิ่งกว่า เพราะมีข้อขัดแย้งว่าเป็นนะญิสหรือไม่ และว่าการพรมน้ำเพียงพอหรือไม่\""]}], "tags_th": ["สิ่งที่ทำให้วุฎูอ์เสีย", "มะซีย์", "นะญิส", "การพรมน้ำ", "การขอคำวินิจฉัย"]}, {"id": "v1-h070", "volume": 1, "bab": "nawaqid", "topic_ar": "تقبيل المرأة ولمسها لا ينقض الوضوء", "topic_th": "การจูบและสัมผัสภรรยาไม่ทำให้วุฎูอ์เสีย", "pages": [297, 304], "hadith": [{"no": 70, "matn_ar": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا أَنَّ النَّبِيَّ ﷺ قَبَّلَ بَعْضَ نِسَائِهِ، ثُمَّ خَرَجَ إِلَى الصَّلَاةِ وَلَمْ يَتَوَضَّأْ. أَخْرَجَهُ أَحْمَدُ، وَضَعَّفَهُ الْبُخَارِيُّ.", "translation_th": "จากอาอิชะฮ์ (ร.ฎ.) ว่า ท่านนบี ﷺ จูบภรรยาบางคนของท่าน แล้วออกไปละหมาดโดยไม่ได้อาบน้ำละหมาด บันทึกโดยอะห์มัด และอัลบุคอรีย์ว่าอ่อน", "grade_th": "มีข้อบกพร่อง (มะอ์ลูล) ตามอัลบุคอรีย์ อบูหาติม และอบูซุรอะฮ์ นักวิชาการรุ่นหลังหลายท่านว่าศ่อฮีห์"}], "key_rulings_th": ["ผู้แต่งเห็นว่าทัศนะที่มีน้ำหนักคือ การสัมผัสผู้หญิงไม่ทำให้วุฎูอ์เสียเลย ไม่ว่าจะมีความใคร่หรือไม่ เว้นแต่มีมะซีย์หรือสิ่งอื่นออกมา (อบูหะนีฟะฮ์ อิบนุตัยมียะฮ์ อิบนุบาซ)", "อัชชาฟิอีย์ว่าการสัมผัสทำให้เสียทุกกรณี ส่วนมัซฮับหันบะลีย์และมาลิกว่าเสียเฉพาะเมื่อมีความใคร่", "คำว่า \"หรือพวกเจ้าสัมผัสผู้หญิง\" ในอายะฮ์ หมายถึงการร่วมประเวณี ตามคำอธิบายของอิบนุอับบาส", "หลักฐานหลักคือหะดีษอาอิชะฮ์ในเศาะฮีหัยน์ ที่ท่านนบี ﷺ แตะเท้านางขณะละหมาดแล้วละหมาดต่อ"], "vocab": [{"ar": "قَبَّلَ بَعْضَ نِسَائِهِ", "th": "จูบภรรยาบางคนของท่าน"}, {"ar": "اللَّمْس / الْمُلَامَسَة", "th": "การสัมผัส ความหมายจริงคือแตะด้วยมือ และใช้เป็นนัยหมายถึงการร่วมประเวณี"}, {"ar": "مَظِنَّة الْحَدَث", "th": "สภาพที่น่าจะเกิดฮะดัษ"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อะห์มัดบันทึกผ่านวะกีอ์ จากอัลอะอ์มัช จากหะบีบ บินอบีษาบิต จากอุรวะฮ์ บินอัซซุบัยร์ จากอาอิชะฮ์ ตอนท้ายอุรวะฮ์กล่าวว่า ฉันถามนางว่า จะเป็นใครนอกจากท่าน นางก็หัวเราะ อบูดาวูด (179) อัตติรมิซีย์ (86) และอิบนุมาญะฮ์ บันทึกผ่านวะกีอ์ จากอัลอะอ์มัช ด้วยสายเดียวกัน", "อัลบุคอรีย์ว่าหะดีษนี้อ่อน ตามที่อิบนุหะญัรระบุ อบูหาติมและอบูซุรอะฮ์ก็ตัดสินเช่นกัน อัลบัยฮะกีย์ว่า \"นี่คือหะดีษที่มีชื่อเสียงที่สุดในบทนี้ และมีข้อบกพร่อง\" ข้อบกพร่องมีสองข้อ", "ข้อแรก: อุรวะฮ์ในสายนี้ไม่ใช่อิบนุอัซซุบัยร์ แต่เป็นผู้อาวุโสที่ไม่เป็นที่รู้จัก ชื่ออุรวะฮ์ อัลมุซะนีย์ ตามที่ระบุในอีกสาย อิมามหลายท่านเห็นเช่นนี้ รวมถึงอิบนุหัซม์ ข้อที่สอง: สายขาด เพราะหะบีบ บินอบีษาบิตไม่ได้ฟังจากอุรวะฮ์ ตามที่ยะห์ยา บินสะอีด อัลก็อฏฏอน อะห์มัด อัลบุคอรีย์ อบูหาติม และยะห์ยา บินมะอีนกล่าว พวกเขาตามสุฟยาน อัษเษารีย์ ซึ่งอบูดาวูดยกว่า \"หะบีบไม่ได้เล่าให้เราฟังนอกจากจากอุรวะฮ์ อัลมุซะนีย์\" ดูเหมือนอบูดาวูดไม่พอใจคำของอัษเษารีย์ จึงยกด้วยถ้อยคำที่ไม่ยืนยัน แล้วกล่าวว่า \"หัมซะฮ์ อัซซัยยาตรายงานจากหะบีบ จากอุรวะฮ์ บินอัซซุบัยร์ จากอาอิชะฮ์ หะดีษหนึ่งที่ศ่อฮีห์\" แต่หัมซะฮ์ อัซซัยยาตถูกวิจารณ์ อัตติรมิซีย์ถามอัลบุคอรีย์ เขาตอบว่า \"หะบีบ บินอบีษาบิตไม่ได้ฟังจากอุรวะฮ์\"", "นักวิชาการรุ่นหลังกลุ่มหนึ่งว่าศ่อฮีห์ เช่น อิบนุญะรีร อิบนุอับดิลบัรร์ อิบนุกะษีร อิบนุตตุรกุมานีย์ อัซซัยละอีย์ อะห์มัด ชากิร อัลอัลบานีย์ และอิบนุบาซ พวกเขาว่าข้อบกพร่องไม่ร้ายแรง ข้อแรกตอบได้ว่า (1) ผู้รายงานที่เชื่อถือได้หลายคนจากวะกีอ์ระบุชื่อว่าอิบนุอัซซุบัยร์ เช่น อะห์มัดในมุสนัด และอิบนุมาญะฮ์ (2) ท้ายหะดีษ อุรวะฮ์ถามว่า \"จะเป็นใครนอกจากท่าน\" นางก็หัวเราะ คนอื่นนอกจากอุรวะฮ์ บินอัซซุบัยร์คงไม่กล้าพูดกับอาอิชะฮ์เช่นนี้ เพราะนางเป็นน้าของเขา (3) ถ้าอุรวะฮ์คนนี้ไม่เป็นที่รู้จัก แล้วอาจารย์ของอัลอะอ์มัชหลายคนจะรายงานจากเขาได้อย่างไร (4) ตามหลักของนักหะดีษ ผู้ที่ไม่ระบุสกุลต้องตีความว่าเป็นคนที่รู้จักกันดี ไม่ใช่คนที่ไม่เป็นที่รู้จัก", "ข้อที่สองตอบว่า หะบีบเชื่อถือได้โดยเห็นพ้อง การพบอุรวะฮ์ไม่ใช่เรื่องแปลก เพราะเขารายงานจากผู้ที่อาวุโสกว่าอุรวะฮ์ อิบนุอับดิลบัรร์กล่าวว่า \"ไม่ต้องสงสัยว่าเขาพบอุรวะฮ์\" และคำของอบูดาวูดว่าหัมซะฮ์ อัซซัยยาตรายงานหะดีษศ่อฮีห์ คือหะดีษ \"โอ้อัลลอฮ์ โปรดให้ร่างกายของฉันมีสุขภาพดี และสายตาของฉันมีสุขภาพดี\" (อัตติรมิซีย์)", "ผู้แต่งเห็นว่าข้อบกพร่องเรื่องสายขาดยังไม่หมดไป เพราะคำของอิบนุอับดิลบัรร์ยืนขัดกับคำของอิมามรุ่นใหญ่ไม่ได้ และอิบนุอับดิลบัรร์มีแค่ความเป็นไปได้ว่าพบกัน ซึ่งไม่ได้พิสูจน์ว่าหะบีบได้ฟังจากอุรวะฮ์ และไม่พอที่จะหักล้างคำของอิมาม ส่วนคำของอบูดาวูดก็มาจากสายของหัมซะฮ์ อัซซัยยาต และถ้าถูกต้องก็หมายถึงหะดีษเฉพาะบทนั้น ไม่ได้แปลว่าหะบีบได้ฟังจากอุรวะฮ์ทั้งหมด", "หะดีษในบทนี้ยังมีสายผ่านอบูเราว์ก จากอิบรอฮีม อัตตัยมีย์ จากอาอิชะฮ์ (อบูดาวูด 178 อันนะสาอีย์) แต่เป็นมุรสัล เพราะอิบรอฮีม อัตตัยมีย์ไม่ได้ฟังจากอาอิชะฮ์ ตามที่อบูดาวูด อันนะสาอีย์ และอัตติรมิซีย์กล่าว อิบรอฮีมเสียชีวิตปี ฮ.ศ. 92 อายุสี่สิบปี และอาอิชะฮ์เสียชีวิตปี ฮ.ศ. 58 ส่วนอบูเราว์ก (อะฏิยะฮ์ บินอัลหาริษ) อิบนุหัซม์และอัลบัยฮะกีย์ว่าอ่อน แต่ที่ถูกคือเขาเชื่อถือได้ และมีสายที่สามผ่านอับดุรเราะห์มาน บินมัฆรออ์ จากอัลอะอ์มัช จากศิษย์ของเขา จากอุรวะฮ์ อัลมุซะนีย์ (อบูดาวูด 180) ซึ่งอ่อน สรุปคือหะดีษนี้มีข้อบกพร่อง มีสายและหลักฐานสนับสนุนที่มีข้อบกพร่องเช่นกัน อะห์มัด ชากิรยกไว้บางส่วน และตัดสินว่าบางสายศ่อฮีห์ และบางสายใกล้ศ่อฮีห์"]}, {"wajh": 2, "type": "fiqh", "heading_ar": null, "heading_th": "การสัมผัสผู้หญิงทำให้วุฎูอ์เสียหรือไม่", "points_th": ["ทัศนะที่หนึ่ง: การจูบและสัมผัสผู้หญิงไม่ทำให้วุฎูอ์เสีย เป็นทัศนะของอบูหะนีฟะฮ์ อีกรายงานจากอิมามอะห์มัดที่อิบนุกุดามะฮ์ระบุ มีรายงานจากอะลี อิบนุอับบาส อะฏออ์ เฏาะวูส อัลหะซัน และมัสรูก อิบนุตัยมียะฮ์และอิบนุบาซเห็นว่ามีน้ำหนัก", "ทัศนะที่สอง: การสัมผัสผู้หญิงทำให้วุฎูอ์เสียทุกกรณี ไม่ว่าจะมีความใคร่หรือไม่ เป็นทัศนะของชาฟิอีย์และอีกรายงานจากอะห์มัด หลักฐานคืออายะฮ์ \"หรือพวกเจ้าสัมผัสผู้หญิง\" (อัลมาอิดะฮ์: 6) ซึ่งหัมซะฮ์และอัลกิสาอีย์ (จากเจ็ดการอ่าน) อ่านว่า \"เลามัสตุม\" (ไม่มีอลิฟ) จึงหมายถึงการสัมผัสด้วยมือ เพราะความหมายจริงของการสัมผัสคือแตะด้วยมือ ส่วนการใช้หมายถึงการร่วมประเวณีเป็นความหมายอนุโลมหรือนัย และไม่เปลี่ยนจากความหมายจริงนอกจากเมื่อใช้ไม่ได้ อายะฮ์บังคับให้อาบน้ำละหมาด การสัมผัสผู้หญิงจึงทำให้เสีย", "ทัศนะที่สาม: แยกกรณี ถ้าสัมผัสด้วยความใคร่ วุฎูอ์เสีย ถ้าไม่ใช่ ก็ไม่เสีย เป็นทัศนะที่รู้จักในมัซฮับหันบะลีย์ ทัศนะของมาลิก และสลัฟกลุ่มหนึ่ง หลักฐาน (1) อายะฮ์ที่กล่าวมา โดยตีความว่าเป็นการสัมผัสด้วยความใคร่ เพราะความใคร่เป็นสภาพที่น่าจะเกิดฮะดัษ (2) หะดีษอาอิชะฮ์: \"ฉันเคยนอนอยู่ตรงหน้าท่านรสูลุลลอฮ์ ﷺ โดยเท้าของฉันอยู่ทางกิบลัตของท่าน เมื่อท่านสุญูด ท่านก็แตะฉัน ฉันจึงหดเท้า เมื่อท่านลุกขึ้น ฉันก็เหยียดเท้า\" นางกล่าวว่า \"บ้านในสมัยนั้นไม่มีตะเกียง\" (อัลบุคอรีย์ มุสลิม) ถ้าเพียงการสัมผัสทำให้วุฎูอ์เสีย วุฎูอ์ของท่านนบี ﷺ ก็คงเสีย และท่านคงเริ่มละหมาดใหม่ (3) การบังคับให้อาบน้ำละหมาดแก่ทุกคนที่สัมผัสทำให้ผู้คนลำบาก เพราะแทบไม่มีใครเลี่ยงได้ และสิ่งที่ลำบากถูกปฏิเสธในศาสนา อิบนุรุชด์ระบุว่าที่มาของข้อขัดแย้งคือคำว่า \"สัมผัส\" ในภาษาอาหรับมีสองความหมาย คือการแตะด้วยมือ (ทัศนะที่สอง) และการร่วมประเวณี (ทัศนะที่หนึ่ง)", "ผู้แต่งเห็นว่าทัศนะที่มีน้ำหนักคือทัศนะแรก คือการสัมผัสผู้หญิงไม่ทำให้วุฎูอ์เสียเลย เว้นแต่มีสิ่งใดออกมา เช่น มะซีย์ เหตุผล (1) หะดีษอาอิชะฮ์ในเศาะฮีหัยน์ และหะดีษอบูฮุร็อยเราะฮ์จากอาอิชะฮ์: \"คืนหนึ่งฉันไม่พบท่านรสูลุลลอฮ์ ﷺ ที่ที่นอน ฉันจึงคลำหา แล้วมือของฉันไปโดนฝ่าเท้าของท่าน...\" (มุสลิม) (2) หลักเดิมคือวุฎูอ์ไม่เสียและความสะอาดยังคงอยู่ จนกว่าจะมีหลักฐานศ่อฮีห์ที่ชัดเจน (3) การสัมผัสผู้หญิงเป็นเรื่องที่เกิดทั่วไปในบ้าน ถ้าทำให้วุฎูอ์เสีย ท่านนบี ﷺ คงอธิบายแก่ประชาชาติอย่างชัดเจน เมื่อไม่ได้อธิบาย ก็แสดงว่าไม่ทำให้เสีย", "ส่วนอายะฮ์ไม่ได้บ่งตามที่กล่าว เพราะการสัมผัสในอายะฮ์หมายถึงการร่วมประเวณี ไม่ใช่การแตะด้วยมือ ด้วยเหตุผล (1) อิบนุอับบาส นักวิชาการแห่งประชาชาติและล่ามอัลกุรอาน ซึ่งอัลลอฮ์สอนการตีความคัมภีร์ของพระองค์ และตอบรับดุอาอ์ของท่านรสูลให้แก่เขา อธิบายว่าการสัมผัสคือการร่วมประเวณี อัลบุคอรีย์ยกในเศาะฮีห์แบบไม่มีสายว่าเขากล่าวว่า \"การเข้าหา การสัมผัส และการแตะต้อง คือการร่วมประเวณี\" อับดุรร็อซซากบันทึกว่า อุบัยด์ บินอุมัยร์ สะอีด บินญุบัยร์ และอะฏออ์ บินอบีเราะบาห์ เห็นต่างกันเรื่องการสัมผัส สะอีดและอะฏออ์ว่าคือการแตะและการบีบ อุบัยด์ว่าคือการแต่งงาน อิบนุอับบาสออกมาหาพวกเขา พวกเขาถาม เขากล่าวว่า \"ทาสสองคนนั้นผิด และชาวอาหรับถูก คือการร่วมประเวณี แต่อัลลอฮ์ทรงสงวนและใช้นัย\" (สายรายงานศ่อฮีห์) คำอธิบายของเขามีน้ำหนักกว่าคนอื่นเพราะเหตุนี้ อิบนุญะรีรยกคำอธิบายนี้จากสลัฟกลุ่มหนึ่ง อิบนุกะษีรว่า \"มีรายงานศ่อฮีห์จากอับดุลลอฮ์ บินอับบาสหลายสาย\" และอิบนุญะรีรเห็นว่ามีน้ำหนัก", "(2) ถ้าตีความการสัมผัสในทั้งสองการอ่านว่าการร่วมประเวณี อายะฮ์ก็ครอบคลุมฮะดัษทั้งสอง คือฮะดัษเล็กในคำว่า \"หรือคนใดในพวกเจ้ามาจากที่ถ่ายทุกข์\" และฮะดัษใหญ่ในคำว่า \"หรือพวกเจ้าสัมผัสผู้หญิง\" ซึ่งสมบูรณ์และครอบคลุมกว่า ถ้าหมายถึงการแตะด้วยมือ ก็มีประโยชน์น้อย เพราะการมาจากที่ถ่ายทุกข์และการแตะ ล้วนเป็นสิ่งที่ทำให้ต้องอาบน้ำละหมาด อายะฮ์ก็จะไม่ได้กล่าวถึงสิ่งที่ทำให้ต้องอาบน้ำ คือฮะดัษใหญ่ (3) การตีความการสัมผัสว่าการร่วมประเวณีเป็นการประสานหลักฐานและใช้ทั้งหมด ต่างจากการตีความว่าแตะด้วยมือ ซึ่งทำให้ซุนนะฮ์ที่บ่งว่าการสัมผัสไม่ทำให้ต้องอาบน้ำละหมาดถูกยกเลิก", "ส่วนที่ว่าความหมายจริงของการสัมผัสคือการแตะด้วยมือนั้นถูก แต่เป็นที่รู้กันว่าเมื่อเชื่อมกับคำว่า \"ผู้หญิง\" จะหมายถึงการร่วมประเวณี เกือบจะเป็นความหมายตามรูปคำ เหมือนคำว่า \"วัฏอ์\" ความหมายจริงคือการเดินด้วยเท้า แต่เมื่อเชื่อมกับผู้หญิง ก็เข้าใจว่าคือการร่วมประเวณีเท่านั้น ส่วนการตีความอายะฮ์ว่าการสัมผัสด้วยความใคร่ เพราะเป็นสภาพที่น่าจะเกิดฮะดัษ ถูกตอบว่าสภาพที่น่าจะเกิดไม่ทำให้วุฎูอ์เสีย ถ้าไม่ได้แข็งแรง เพราะหลักเดิมคือความสะอาด (ดังจะกล่าวในหะดีษอบูฮุร็อยเราะฮ์)", "ส่วนหะดีษอาอิชะฮ์ในเศาะฮีหัยน์เป็นหลักฐานว่าการสัมผัสไม่ทำให้วุฎูอ์เสีย ส่วนที่อิบนุหะญัรแย้งว่า \"อาจมีสิ่งกั้น หรืออาจเป็นเรื่องเฉพาะท่านนบี ﷺ\" ไม่มีน้ำหนัก เพราะหลักเดิมคือไม่ใช่เรื่องเฉพาะ นอกจากมีหลักฐาน ตามหลักอุศูล แล้วจะตั้งประเด็นบนความเป็นไปได้ได้อย่างไร ส่วนความเป็นไปได้ว่ามีสิ่งกั้น ไม่มีใครคิดนอกจากผู้ที่เข้าข้างทัศนะตน และอิบนุหะญัรเองก็ขัดกับคำของท่านในอัตตัลคีศ ที่ว่าหะดีษนี้เป็นหลักฐานว่าการสัมผัสในอายะฮ์คือการร่วมประเวณี เพราะท่านนบี ﷺ แตะนางขณะละหมาดแล้วละหมาดต่อ และนี่คือความจริง อินชาอัลลอฮ์", "อิบนุตัยมียะฮ์ถือว่าทัศนะว่าการสัมผัสผู้หญิงโดยไม่มีความใคร่ทำให้วุฎูอ์เสีย เป็นทัศนะที่แปลกแยก ไม่มีที่มาในอัลกุรอาน ซุนนะฮ์ หรือรายงานจากสลัฟคนใดของประชาชาติ และไม่สอดคล้องกับหลักของศาสนา เพราะการสัมผัสที่ไม่มีความใคร่ไม่มีผลต่ออิบาดะฮ์ใด ผู้ที่ทำให้มันทำลายความสะอาด ก็ขัดกับหลักของศาสนา"]}], "tags_th": ["สิ่งที่ทำให้วุฎูอ์เสีย", "สัมผัสผู้หญิง", "การจูบ", "อิบนุอับบาส", "ตัฟซีร"]}, {"id": "v1-h071", "volume": 1, "bab": "nawaqid", "topic_ar": "حكم الشك في الحدث مع تيقن الطهارة", "topic_th": "หุก่มการสงสัยว่ามีฮะดัษ ขณะแน่ใจว่ามีความสะอาด", "pages": [305, 307], "hadith": [{"no": 71, "matn_ar": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «إِذَا وَجَدَ أَحَدُكُمْ فِي بَطْنِهِ شَيْئًا، فَأَشْكَلَ عَلَيْهِ: أَخَرَجَ مِنْهُ شَيْءٌ، أَمْ لَا؟ فَلَا يَخْرُجَنَّ مِنَ الْمَسْجِدِ حَتَّى يَسْمَعَ صَوْتًا، أَوْ يَجِدَ رِيحًا». أَخْرَجَهُ مُسْلِمٌ.", "translation_th": "จากอบูฮุร็อยเราะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"เมื่อผู้ใดในพวกท่านรู้สึกบางอย่างในท้อง แล้วไม่แน่ใจว่ามีอะไรออกมาหรือไม่ ก็อย่าออกจากมัสยิด จนกว่าจะได้ยินเสียงหรือได้กลิ่น\" บันทึกโดยมุสลิม", "grade_th": "ศ่อฮีห์ (มุสลิม)"}], "key_rulings_th": ["ผู้ที่มีความสะอาดแล้วสงสัยว่ามีฮะดัษ ไม่ต้องอาบน้ำละหมาดใหม่ ให้ละหมาดด้วยความสะอาดเดิม จนกว่าจะแน่ใจว่ามีฮะดัษ", "หะดีษเป็นหลักฐานของหลักนิติศาสตร์ใหญ่ \"ความแน่ใจไม่หมดไปด้วยความสงสัย\" และหลักเดิมคือสิ่งต่าง ๆ คงอยู่ตามเดิม", "หะดีษนี้เป็นหลักสำคัญในการปิดประตูความระแวง (วัสวะสะฮ์) ที่ชัยฏอนใช้ทำลายความสะอาดและการละหมาด", "ลมทำให้วุฎูอ์เสีย"], "vocab": [{"ar": "وَجَدَ فِي بَطْنِهِ شَيْئًا", "th": "รู้สึกลมเคลื่อนในท้อง คือเสียงท้องร้อง"}, {"ar": "فَأَشْكَلَ عَلَيْهِ", "th": "สับสน ไม่แน่ใจว่ามีสิ่งที่ทำให้วุฎูอ์เสียเกิดขึ้นหรือไม่"}, {"ar": "حَتَّى يَسْمَعَ صَوْتًا أَوْ يَجِدَ رِيحًا", "th": "จนกว่าจะแน่ใจว่ามีฮะดัษ ด้วยการได้ยินหรือได้กลิ่น"}, {"ar": "الْوَسْوَسَة", "th": "ความระแวง ความคิดที่ชัยฏอนแทรกเข้ามาในใจ"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["มุสลิมบันทึกในหมวดประจำเดือน บทหลักฐานว่าผู้ที่แน่ใจว่ามีความสะอาดแล้วสงสัยว่ามีฮะดัษ ให้ละหมาดด้วยความสะอาดนั้น (362) ผ่านญะรีร บินอับดิลหะมีด จากสุฮัยล์ บินอบีศอลิห์ จากบิดา (อบูศอลิห์ ซักวาน อัสสัมมาน เชื่อถือได้ แม่นยำ) จากอบูฮุร็อยเราะฮ์", "มีหะดีษอื่นในความหมายเดียวกัน (จะกล่าวต่อไป)"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"เมื่อผู้ใดในพวกท่านรู้สึกบางอย่างในท้อง\" คือรู้สึกลมเคลื่อนในท้อง ซึ่งเป็นเสียงของลำไส้ คือเสียงท้องร้อง \"แล้วไม่แน่ใจ\" คือสับสนว่ามีสิ่งที่ทำให้วุฎูอ์เสียเกิดขึ้นหรือไม่ \"ก็อย่าออกจากมัสยิด\" คือเพื่อไปอาบน้ำละหมาด", "\"จนกว่าจะได้ยินเสียงหรือได้กลิ่น\" คือจนกว่าจะแน่ใจว่ามีฮะดัษ ด้วยการได้ยินหรือได้กลิ่น คำว่า \"หรือ\" บ่งประเภท ที่ระบุการได้ยินและการได้กลิ่นเพราะเป็นกรณีส่วนใหญ่ มิฉะนั้น ถ้าคนนั้นไม่ได้ยินหรือไม่ได้กลิ่นเพราะความบกพร่องหรือโรค และแน่ใจด้วยวิธีอื่น วุฎูอ์ก็เสีย"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "สงสัยว่ามีฮะดัษ", "points_th": ["หะดีษเป็นหลักฐานว่าผู้ที่มีความสะอาด ถ้าสงสัยว่ามีฮะดัษ ไม่ต้องอาบน้ำละหมาด แต่ละหมาดด้วยความสะอาดนั้น จนกว่าจะแน่ใจว่ามีฮะดัษ ด้วยการได้ยินเสียงหรือได้กลิ่นลม", "หะดีษอับดุลลอฮ์ บินซัยด์ก็บ่งเช่นกัน ว่าเขาร้องเรียนกับท่านนบี ﷺ เรื่องชายที่รู้สึกว่ามีอะไรขณะละหมาด ท่านตอบว่า \"อย่าออกจากละหมาด จนกว่าจะได้ยินเสียงหรือได้กลิ่น\" (อัลบุคอรีย์ มุสลิม)"]}, {"wajh": 4, "type": "fawaid", "heading_ar": null, "heading_th": "ความแน่ใจไม่หมดไปด้วยความสงสัย", "points_th": ["หะดีษนี้เป็นหลักฐานของหลักใหญ่ของศาสนา คือ \"ความแน่ใจไม่หมดไปด้วยความสงสัย\" และหลักเดิมคือสิ่งต่าง ๆ คงอยู่ตามเดิม ซึ่งเป็นหนึ่งในหลักนิติศาสตร์ใหญ่ที่แตกประเด็นย่อยได้มากมาย ทั้งในอิบาดะฮ์ ธุรกรรม และสัญญา", "อัลก็อรอฟีย์กล่าวว่า \"นี่คือหลักที่เห็นพ้อง คือทุกสิ่งที่สงสัย ให้ถือว่าไม่มี เหมือนสิ่งที่แน่ใจว่าไม่มี\" อบูดาวูดกล่าวว่า \"ฉันได้ยินอะห์มัดถูกถามเรื่องชายที่สงสัยในวุฎูอ์ของเขา เขาตอบว่า ถ้าอาบน้ำละหมาดแล้ว เขาก็อยู่บนวุฎูอ์ จนกว่าจะแน่ใจว่ามีฮะดัษ และถ้ามีฮะดัษในวุฎูอ์ เขาก็มีฮะดัษ จนกว่าจะแน่ใจว่าอาบน้ำละหมาดแล้ว\""]}, {"wajh": 5, "type": "fawaid", "heading_ar": null, "heading_th": "ปิดประตูความระแวง", "points_th": ["หะดีษนี้เป็นหลักสำคัญในการปิดประตูความระแวง ที่ชัยฏอนใช้แทรกเข้ามาหาบ่าว เพื่อทำลายความสะอาด การละหมาด และอิบาดะฮ์ของเขา", "หะดีษบ่งว่ามุสลิมไม่ควรยอมจำนนต่อความระแวง เพราะเป็นโรคเรื้อรัง ถ้ารุนแรงจะไม่ยอมจากเจ้าของ เขาจะตกอยู่ในความลำบาก และเหนื่อยยากในการปฏิบัติสิ่งวาญิบ ความระแวงส่วนใหญ่เกิดจากความสงสัย เมื่อใดคนยอมจำนนและทำตาม เขาก็จะเหนื่อยกับมัน เมื่อใดที่ไม่สนใจและไม่ใส่ใจ มันก็จะหายไปด้วยอนุมัติของอัลลอฮ์"]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "ลมทำให้วุฎูอ์เสีย", "points_th": ["หะดีษบ่งว่าลมทำให้วุฎูอ์เสีย เพราะคำว่า \"จนกว่าจะได้ยินเสียงหรือได้กลิ่น\"", "อิบนุหะญัรจะยกหะดีษในเรื่องนี้ไว้ท้ายบท ผู้แต่งเห็นว่าควรรวมไว้ที่เดียวกัน"]}], "tags_th": ["สิ่งที่ทำให้วุฎูอ์เสีย", "ความสงสัย", "ความแน่ใจ", "วัสวะสะฮ์", "หลักนิติศาสตร์"]}, {"id": "v1-h072", "volume": 1, "bab": "nawaqid", "topic_ar": "ما جاء في أن مس الذكر لا ينقض الوضوء", "topic_th": "รายงานว่าการจับอวัยวะเพศไม่ทำให้วุฎูอ์เสีย", "pages": [308, 310], "hadith": [{"no": 72, "matn_ar": "عَنْ طَلْقِ بْنِ عَلِيٍّ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَجُلٌ: مَسِسْتُ ذَكَرِي. أَوْ قَالَ: الرَّجُلُ يَمَسُّ ذَكَرَهُ فِي الصَّلَاةِ، أَعَلَيْهِ وُضُوءٌ؟ فَقَالَ النَّبِيُّ ﷺ: «لَا، إِنَّمَا هُوَ بَضْعَةٌ مِنْكَ». أَخْرَجَهُ الْخَمْسَةُ، وَصَحَّحَهُ ابْنُ حِبَّانَ، وَقَالَ ابْنُ الْمَدِينِيِّ: هُوَ أَحْسَنُ مِنْ حَدِيثِ بُسْرَةَ.", "translation_th": "จากฏ็อลก์ บินอะลี (ร.ฎ.) กล่าวว่า ชายคนหนึ่งกล่าวว่า ฉันจับอวัยวะเพศของฉัน หรือเขากล่าวว่า ชายคนหนึ่งจับอวัยวะเพศของเขาขณะละหมาด เขาต้องอาบน้ำละหมาดไหม ท่านนบี ﷺ ตอบว่า \"ไม่ มันเป็นเพียงชิ้นเนื้อส่วนหนึ่งของท่าน\" บันทึกโดยนักบันทึกทั้งห้า อิบนุหิบบานระบุว่าศ่อฮีห์ และอิบนุลมะดีนีย์กล่าวว่า หะดีษนี้ดีกว่าหะดีษบุสเราะฮ์", "grade_th": "ศ่อฮีห์ (อัฏเฏาะหาวีย์ อิบนุหิบบาน อิบนุหัซม์) แต่อัชชาฟิอีย์ อบูหาติม อบูซุรอะฮ์ อัดดารุกุฏนีย์ และอัลบัยฮะกีย์ว่าอ่อน เพราะก็อยส์ บินฏ็อลก์"}], "key_rulings_th": ["ผู้ที่เห็นว่าการจับอวัยวะเพศไม่ทำให้วุฎูอ์เสียอ้างหะดีษนี้ (หะนะฟีย์ มาลิกีย์บางท่าน อีกรายงานจากอะห์มัด อิบนุลมุนซิร)", "เพราะท่านนบี ﷺ อธิบายว่าอวัยวะเพศเป็นชิ้นเนื้อหนึ่งของร่างกาย เหมือนการจับหู มือ หรือเท้า", "ผู้แต่งจะอธิบายประเด็นนี้และทัศนะที่มีน้ำหนักในหะดีษถัดไป (หะดีษบุสเราะฮ์)"], "vocab": [{"ar": "مَسِسْتُ", "th": "ฉันจับ คือแตะด้วยมือโดยไม่มีสิ่งกั้น"}, {"ar": "بَضْعَة", "th": "อ่านสระอะ (หรือสระอิ) ชิ้นเนื้อ ความหมายคือเหมือนมือ หู หรือเท้า"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อบูอะลี ฏ็อลก์ บินอะลี บินฏ็อลก์ บินอัมร์ บ้างว่าฏ็อลก์ บินอะลี บินอัลมุนซิร บินก็อยส์ อัสสุหัยมีย์ อัลยะมามีย์ เป็นที่รู้จัก เป็นเศาะหาบะฮ์ เป็นตัวแทนเผ่า และรายงานหะดีษ", "ในเศาะฮีห์อิบนุหิบบาน ผ่านก็อยส์ บินฏ็อลก์ จากบิดาว่า \"ฉันสร้างมัสยิดมะดีนะฮ์กับท่านรสูลุลลอฮ์ ﷺ ท่านกล่าวว่า จงให้คนยะมามะฮ์ทำดินให้ใกล้ เพราะเขาเป็นคนที่จับดินเก่งที่สุดในหมู่พวกท่าน\" (สายรายงานแข็งแรง) ผู้รายงานจากเขาคือก็อยส์ลูกชาย และเคาะละดะฮ์ลูกสาว และคนอื่น"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อบูดาวูดบันทึกในหมวดฏอฮาเราะฮ์ บทข้อผ่อนผัน (182, 183) อัตติรมิซีย์ (85) อันนะสาอีย์ อิบนุมาญะฮ์ (483) และอิบนุหิบบาน (1119) ทั้งหมดผ่านมุลาซิม บินอัมร์ อัลหะนะฟีย์ จากอับดุลลอฮ์ บินบัดร์ จากก็อยส์ บินฏ็อลก์ จากบิดา", "อัฏเฏาะหาวีย์กล่าวว่า \"นี่คือหะดีษมุลาซิม ศ่อฮีห์ สายรายงานตรง ไม่สับสนทั้งสายและตัวบท\" และยกคำของอิบนุลมะดีนีย์ว่า \"หะดีษมุลาซิมนี้ดีกว่าหะดีษบุสเราะฮ์\" อัตติรมิซีย์ว่า \"หะดีษนี้ดีที่สุดที่รายงานในบทนี้\" อิบนุหัซม์ว่า \"เป็นรายงานที่ศ่อฮีห์\" และอิบนุตตุรกุมานีย์ว่าศ่อฮีห์ อะห์มัดบันทึกผ่านอัยยูบ บินอุตบะฮ์ จากก็อยส์ จากบิดา อัยยูบอ่อน แต่มีสายสนับสนุน และหะดีษมีสายอื่น", "นักวิชาการอีกกลุ่มว่าอ่อน เช่น อัชชาฟิอีย์ อบูหาติม อบูซุรอะฮ์ อัดดารุกุฏนีย์ อัลบัยฮะกีย์ และอิบนุลเญาซีย์ เพราะก็อยส์ บินฏ็อลก์ไม่แข็งแรง ตามที่อัลบัยฮะกีย์กล่าว อัดดารุกุฏนีย์ยกคำของยะห์ยา บินมะอีนว่า \"คนพูดถึงก็อยส์มาก ใช้เป็นหลักฐานไม่ได้\" อัซซะฮะบีย์ว่า \"อะห์มัดและยะห์ยาว่าอ่อนในหนึ่งในสองรายงานจากเขา\"", "แต่มีรายงานที่ถูกต้องจากยะห์ยาที่ขัดกัน อุษมาน บินสะอีด อัดดาริมีย์รายงานว่า ฉันถามว่า อับดุลลอฮ์ บินนุอ์มาน จากก็อยส์ บินฏ็อลก์ เป็นอย่างไร เขาตอบว่า \"ผู้อาวุโสชาวยะมามะฮ์ที่เชื่อถือได้\" ส่วนที่อิบนุลเญาซีย์ยกว่าอะห์มัดว่าอ่อน สิ่งที่อัลค็อลลาลยกจากอะห์มัดคือ \"คนอื่นแม่นยำกว่าเขา\" ซึ่งไม่ใช่การว่าอ่อน อิบนุหิบบานใส่ไว้ในรายชื่อผู้เชื่อถือได้ และอัลอิจลีย์ว่า \"ก็อยส์ บินฏ็อลก์ ชาวยะมามะฮ์ ตาบิอีน เชื่อถือได้\"", "ส่วนที่อันนะวะวีย์ว่า \"อ่อนตามมติของนักหะดีษผู้เชี่ยวชาญ\" เป็นความเข้าใจผิดของเขา และดูเหมือนอิบนุอับดิลฮาดีหมายถึงเขาที่กล่าวว่า \"ผู้ที่รายงานว่ามีมติว่าอ่อนนั้นผิด\""]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ฉันจับอวัยวะเพศของฉัน\" ทางภาษาคือการแตะด้วยมือโดยไม่มีสิ่งกั้น \"ไม่\" คือไม่ต้องอาบน้ำละหมาดเพราะจับมัน", "\"ชิ้นเนื้อส่วนหนึ่งของท่าน\" (บัฎอะฮ์) อ่านสระอะ หรือสระอิก็ได้ คือชิ้นเนื้อ หมายความว่าเหมือนมือ หู เท้า และอวัยวะอื่น"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "จับอวัยวะเพศไม่ทำให้วุฎูอ์เสีย", "points_th": ["หะดีษเป็นหลักฐานของผู้ที่ว่าการจับอวัยวะเพศไม่ทำให้วุฎูอ์เสีย เพราะท่านนบี ﷺ อธิบายว่ามันเป็นชิ้นเนื้อส่วนหนึ่งของร่างกาย เหมือนการจับหูหรือมือ เป็นทัศนะของหะนะฟีย์ มาลิกีย์บางท่าน อีกรายงานจากอิมามอะห์มัด และทัศนะของอิบนุลมุนซิร", "ผู้แต่งจะอธิบายประเด็นนี้และทัศนะที่มีน้ำหนักในหะดีษถัดไป อินชาอัลลอฮ์"]}], "tags_th": ["สิ่งที่ทำให้วุฎูอ์เสีย", "จับอวัยวะเพศ", "ฏ็อลก์ บินอะลี"]}, {"id": "v1-h073", "volume": 1, "bab": "nawaqid", "topic_ar": "ما جاء في أن مس الذكر ينقض الوضوء", "topic_th": "รายงานว่าการจับอวัยวะเพศทำให้วุฎูอ์เสีย", "pages": [311, 315], "hadith": [{"no": 73, "matn_ar": "عَنْ بُسْرَةَ بِنْتِ صَفْوَانَ رَضِيَ اللهُ عَنْهَا أَنَّ رَسُولَ اللهِ ﷺ قَالَ: «مَنْ مَسَّ ذَكَرَهُ فَلْيَتَوَضَّأْ». أَخْرَجَهُ الْخَمْسَةُ، وَصَحَّحَهُ التِّرْمِذِيُّ وَابْنُ حِبَّانَ، وَقَالَ الْبُخَارِيُّ: هُوَ أَصَحُّ شَيْءٍ فِي هَذَا الْبَابِ.", "translation_th": "จากบุสเราะฮ์ บินติเศาะฟวาน (ร.ฎ.) ว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"ผู้ใดจับอวัยวะเพศของเขา ก็จงอาบน้ำละหมาด\" บันทึกโดยนักบันทึกทั้งห้า อัตติรมิซีย์และอิบนุหิบบานระบุว่าศ่อฮีห์ และอัลบุคอรีย์กล่าวว่า หะดีษนี้ถูกต้องที่สุดในบทนี้", "grade_th": "ศ่อฮีห์ (อัตติรมิซีย์ว่าหะซันศ่อฮีห์)"}], "key_rulings_th": ["หะดีษบุสเราะฮ์ (จับแล้วต้องอาบน้ำละหมาด) ขัดกับหะดีษฏ็อลก์ (ไม่ต้อง) นักวิชาการมีสามแนวทางในการแก้", "แนวทางยกเลิก (นัสค์): หะดีษฏ็อลก์มาก่อน ถูกยกเลิกด้วยหะดีษบุสเราะฮ์ ผู้แต่งเห็นว่าอ่อน เพราะต้องประสานก่อน และลำดับเวลาไม่ชัด", "แนวทางเลือกน้ำหนัก: หะดีษบุสเราะฮ์มีน้ำหนักกว่า จึงต้องอาบน้ำละหมาด (อัศศ็อนอานีย์ อิบนุบาซ) เพราะศ่อฮีห์กว่า มีหลักฐานสนับสนุนจากเศาะหาบะฮ์สิบเจ็ดคน และรอบคอบกว่า", "แนวทางประสาน ซึ่งผู้แต่งว่าเป็นแนวทางที่ดี: (1) ส่งเสริมให้อาบน้ำละหมาด แต่ไม่วาญิบ (อิบนุลมุนซิร อิบนุตัยมียะฮ์) หรือ (2) ถ้าจับด้วยความใคร่ต้องอาบน้ำละหมาด ถ้าไม่มีความใคร่ ไม่ต้อง", "การจับอวัยวะเพศ (ฟัรจ์) ของหญิงก็มีหุก่มเดียวกัน"], "vocab": [{"ar": "بُسْرَة", "th": "อ่านสระอุแล้วสุกูน"}, {"ar": "الْبَرَاءَة الْأَصْلِيَّة", "th": "สภาพเดิม คือไม่มีหุก่มหรือภาระ จนกว่าจะมีหลักฐาน"}, {"ar": "النَّسْخ", "th": "การยกเลิกหุก่มเดิมด้วยหุก่มที่มาทีหลัง"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["บุสเราะฮ์ บินติเศาะฟวาน บินเนาฟัล บินอะสัด บินอับดิลอุซซา อัลกุร็อชียะฮ์ อัลอะสะดียะฮ์ หลานสาวของวะเราะเกาะฮ์ บินเนาฟัล และพี่สาวน้องสาวร่วมมารดาของอุกบะฮ์ บินอบีมุอัยฏ์ มีความเห็นอื่นเรื่องเชื้อสายของนาง แต่อิบนุอับดิลบัรร์ว่าที่กล่าวมาถูกต้อง อิบนุลอะษีรว่า \"นี่ถูกต้องที่สุด\"", "ผู้ที่รายงานจากนางคืออับดุลลอฮ์ บินอุมัร มัรวาน บินอัลหะกัม อิบนุลมุสัยยิบ และคนอื่น อัชชาฟิอีย์กล่าวว่า \"นางเข้ารับอิสลามแต่เนิ่น ๆ และอพยพ\" อิบนุหิบบานว่า \"นางเป็นหนึ่งในหญิงที่อพยพ\" และมุศอับ บินอัซซุบัยร์ว่า \"นางเป็นหนึ่งในหญิงที่ให้สัตยาบัน\""]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อบูดาวูดบันทึกในหมวดฏอฮาเราะฮ์ บทการอาบน้ำละหมาดเพราะจับอวัยวะเพศ (181) อันนะสาอีย์ อะห์มัด มาลิก และอิบนุหิบบาน (1112) ผ่านอับดุลลอฮ์ บินอบีบักร์ ว่าได้ยินอุรวะฮ์กล่าวว่า ฉันเข้าไปหามัรวาน บินอัลหะกัม เราคุยกันเรื่องสิ่งที่ทำให้ต้องอาบน้ำละหมาด มัรวานกล่าวว่า และเพราะการจับอวัยวะเพศ อุรวะฮ์กล่าวว่า ฉันไม่รู้เรื่องนั้น มัรวานกล่าวว่า บุสเราะฮ์ บินติเศาะฟวานเล่าให้ฉันฟัง... แล้วเล่าหะดีษ", "อัตติรมิซีย์ (83) อิบนุมาญะฮ์ (479) และอิบนุหิบบาน (1115) บันทึกผ่านฮิชาม บินอุรวะฮ์ จากบิดา จากมัรวาน จากบุสเราะฮ์ ในสำนวนของอิบนุหิบบาน \"ผู้ใดจับอวัยวะเพศ (ฟัรจ์) ของเขา ก็จงอาบน้ำละหมาด\" อัตติรมิซีย์ว่า \"หะดีษหะซันศ่อฮีห์\" และยกคำของอัลบุคอรีย์ว่า \"สิ่งที่ถูกต้องที่สุดในบทนี้คือหะดีษบุสเราะฮ์\"", "ตามบริบทของอบูดาวูดและคนอื่น หะดีษนี้มาจากมัรวาน บินอัลหะกัม จากบุสเราะฮ์ บางคนวิจารณ์เขาเพราะเรื่องการปกครอง และข่าวทางประวัติศาสตร์ว่าเขาสังหารฏ็อลหะฮ์ และชูดาบแสวงหาเคาะลีฟะฮ์ อิบนุหะญัรแก้ต่างว่าการสังหารฏ็อลหะฮ์เขาทำโดยตีความ ส่วนการชูดาบแสวงหาเคาะลีฟะฮ์เกิดหลังจากรายงานหะดีษนี้ เพราะเขารายงานขณะเป็นผู้ปกครองมะดีนะฮ์ อัลบุคอรีย์ใช้เขาเป็นหลักฐานในเศาะฮีห์ มาลิกในอัลมุวัฏเฏาะอ์ และอะห์มัดในมุสนัด ซึ่งเพียงพอให้ใช้เป็นหลักฐาน", "หะดีษนี้มีรายงานผ่านฮิชาม บินอุรวะฮ์ จากอุรวะฮ์ จากบุสเราะฮ์ โดยไม่มีมัรวาน (อัตติรมิซีย์ 82 อันนะสาอีย์ 447 อะห์มัด) ซึ่งขัดกับรายงานของผู้รายงานส่วนใหญ่ จึงอาจตัดสินว่าเป็นชาซ หรืออาจกล่าวว่าอุรวะฮ์ได้ยินจากมัรวานก่อน แล้วต้องการความมั่นใจ จึงไปพบบุสเราะฮ์และได้ยินจากนาง ตามรายงานของชุอัยบ์ บินอิสหาก ในอิบนุหิบบาน (1113) และอัดดารุกุฏนีย์"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "ประสานหะดีษบุสเราะฮ์กับหะดีษฏ็อลก์", "points_th": ["หะดีษเป็นหลักฐานของผู้ที่ว่าการจับอวัยวะเพศ และการจับฟัรจ์ (ของหญิง) ทำให้วุฎูอ์เสีย เป็นทัศนะของอัชชาฟิอีย์ ของมาลิกตามที่รู้จัก และที่รู้จักในมัซฮับอะห์มัด แต่หะดีษนี้ขัดกับหะดีษฏ็อลก์ บินอะลีที่ผ่านมา นักวิชาการมีสามแนวทางในการขจัดความขัดแย้ง ซึ่งเป็นแนวทางที่รู้กันในอุศูล", "แนวทางที่หนึ่ง การยกเลิก (นัสค์): หะดีษฏ็อลก์ถูกยกเลิกด้วยหะดีษบุสเราะฮ์ เพราะหะดีษของเขามาก่อน และหะดีษของนางมาทีหลัง หลักฐานคือในชีวประวัติของเขา เขามามะดีนะฮ์ขณะที่ท่านรสูลุลลอฮ์ ﷺ กำลังสร้างมัสยิดในช่วงแรกของการอพยพ ผู้ที่ว่ายกเลิกได้แก่ อิบนุหิบบาน อัฏเฏาะบะรอนีย์ อิบนุลอะเราะบีย์ อัลหาซิมีย์ อัลบัยฮะกีย์ และอิบนุหัซม์ อิบนุหัซม์สนับสนุนด้วยคำว่า \"มันเป็นเพียงชิ้นเนื้อส่วนหนึ่งของท่าน\" ว่าบ่งว่าเกิดก่อนคำสั่งให้อาบน้ำละหมาด เพราะถ้าเกิดหลัง ท่านคงไม่พูดเช่นนั้น แต่จะบอกว่าคำสั่งนั้นถูกยกเลิก และคำนี้บ่งว่ายังไม่มีหุก่มเรื่องนี้มาก่อน และอวัยวะเพศเหมือนอวัยวะอื่น", "ผู้แต่งเห็นว่าทัศนะว่ายกเลิกอ่อนด้วยสองเหตุ (1) หลักของนักอุศูลคือไม่ไปที่การยกเลิก นอกจากเมื่อประสานสองหลักฐานไม่ได้ เพราะการยกเลิกคือการทิ้งหลักฐานหนึ่ง ส่วนการประสานคือการใช้ทั้งสอง และประสานได้ (2) นักวิชาการกล่าวว่าลำดับเวลาไม่รู้ได้จากการที่ผู้รายงานเข้ารับอิสลามก่อนหรือรับหะดีษก่อน เพราะผู้รายงานที่มาทีหลังอาจรายงานจากเศาะหาบะฮ์คนอื่น อัชเชากานีย์จึงกล่าวว่า \"นี่ไม่ใช่หลักฐานในหมู่นักอุศูลผู้เชี่ยวชาญ\"", "แนวทางที่สอง การเลือกน้ำหนัก (ตัรญีห์): นักวิชาการผู้เชี่ยวชาญเลือกหะดีษบุสเราะฮ์เหนือหะดีษฏ็อลก์ จึงต้องอาบน้ำละหมาดเพราะจับอวัยวะเพศ อัศศ็อนอานีย์และอิบนุบาซเลือก เหตุผล (1) หะดีษบุสเราะฮ์ศ่อฮีห์กว่า สายรายงานปลอดภัย ส่วนหะดีษฏ็อลก์มีหลายคนว่าอ่อน อัลบุคอรีย์ว่าหะดีษบุสเราะฮ์ \"ถูกต้องที่สุดในบทนี้\" แม้อาจารย์ของเขา อะลี บินอัลมะดีนีย์ จะเห็นต่างและเลือกหะดีษฏ็อลก์ แต่คำของอัลบุคอรีย์ในที่นี้สมควรกว่า เพราะมีสิ่งสนับสนุน อิบนุหะญัรยกคำของอัลบัยฮะกีย์ว่า \"เพียงพอในการเลือกหะดีษบุสเราะฮ์เหนือหะดีษฏ็อลก์ ที่อัลบุค
