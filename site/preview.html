<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body { margin: 0; }</style>
<title>Minhat al-Allam Thai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@500;700&display=swap">
<style>
/* Layout: phone-first single column app (max 520px, centered), green header band, bottom tab bar. Light only, matching the mockup. */
:root {
  --green: #2E5641; --green-dark: #1F3D2D; --green-soft: #EAEDDC; --on-green-soft: #E2E8D6;
  --gold: #8A5A16; --gold-line: #A8752B; --gold-soft: #FBEFD9; --gold-ink: #4A3A1E;
  --bg: #F8F2E7; --card: #FFFCF6; --ink: #2A231D; --muted: #6B5F52; --faint: #A6998A;
  --line: #E8DDCB; --line-strong: #DDD0BA; --seg: #EFE6D5; --field: #F3EBDC;
  --ff-th: "Noto Sans Thai", Tahoma, sans-serif;
  --ff-ar: "Noto Naskh Arabic", "Traditional Arabic", serif;
  color-scheme: light;
}
html { background: var(--bg); }
body { background: var(--bg); color: var(--ink); font-family: var(--ff-th); font-size: 16px; line-height: 1.7; }
a { color: var(--green); text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--gold-line); outline-offset: 2px; }
.app { max-width: 520px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px)); }
.pad { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.ar { font-family: var(--ff-ar); direction: rtl; text-align: right; }
.view { display: flex; flex-direction: column; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.h2 { margin: 0; font-size: 18px; font-weight: 700; }
.muted { color: var(--muted); }
.chip { display: inline-block; font-size: 14px; padding: 8px 14px; border-radius: 999px; background: var(--green-soft); color: var(--green); font-weight: 500; border: 0; }
.icon-btn { width: 44px; height: 44px; border: 0; background: transparent; color: var(--ink); display: flex; align-items: center; justify-content: center; flex: none; }
.icon-btn[aria-pressed="true"] { color: var(--gold); }

/* home */
.hero { background: var(--green); color: #fff; padding-block: 24px 28px; display: flex; flex-direction: column; gap: 16px; }
.hero-top { display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: 600; }
.hero .ar { font-size: 30px; font-weight: 700; line-height: 1.5; }
.hero h1 { margin: 0; font-size: 20px; line-height: 1.4; }
.hero p { margin: 0; font-size: 14px; color: var(--on-green-soft); }
.searchbox { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 12px; padding: 0 14px; height: 48px; color: var(--muted); }
.searchbox input { border: 0; outline: none; flex: 1; min-width: 0; font: 15px var(--ff-th); background: transparent; color: var(--ink); }
.home-body { padding-block: 20px; display: flex; flex-direction: column; gap: 24px; }
.continue { display: flex; flex-direction: column; gap: 10px; padding: 16px; color: var(--ink); }
.row-between { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.progress { height: 6px; background: var(--seg); border-radius: 3px; overflow: hidden; }
.progress > div { height: 6px; background: var(--green); }
.kgrid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.kcard { display: flex; flex-direction: column; gap: 6px; padding: 14px; color: var(--ink); min-height: 104px; border-radius: 12px; }
.kcard .ar { font-size: 18px; color: var(--green); font-weight: 700; }
.kcard.off { opacity: .55; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 4px; padding-block: 8px; padding-left: max(4px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); background: var(--card); border-bottom: 1px solid var(--line); }
.topbar .t { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.4; }
.topbar .t small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .t b { font-size: 15px; }

/* hadith */
.seg { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); background: var(--seg); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { height: 44px; border: 0; border-radius: 9px; font-size: 15px; font-weight: 500; background: transparent; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--green); font-weight: 600; box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.hbody { padding-block: 16px 32px; display: flex; flex-direction: column; gap: 16px; }
.topic-title { display: flex; flex-direction: column; gap: 2px; }
.topic-title .ar { font-size: 22px; color: var(--green); font-weight: 700; line-height: 1.6; }
.topic-title h1 { margin: 0; font-size: 19px; line-height: 1.5; text-wrap: balance; }
.matn-card { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.hno { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--gold); font-weight: 600; }
.grade { background: var(--gold-soft); padding: 0 10px; border-radius: 999px; font-weight: 500; text-align: right; }
.matn { margin: 0; font-size: 26px; line-height: 2; color: var(--green); font-weight: 700; }
.tr { margin: 0; font-size: 17px; line-height: 1.75; }
.vocab { display: flex; flex-direction: column; gap: 8px; }
.v { display: flex; flex-direction: column; gap: 2px; background: var(--gold-soft); border-radius: 10px; padding: 10px 12px; }
.v .ar { font-size: 17px; color: var(--gold); font-weight: 700; }
.v div:last-child { font-size: 14px; line-height: 1.6; color: var(--gold-ink); }
.sec { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.sec h2 { margin: 0; font-size: 16px; color: var(--green); }
.sec ol, .sec ul { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 10px; font-size: 15px; line-height: 1.75; }
.wajh { display: flex; flex-direction: column; gap: 6px; padding-top: 12px; border-top: 1px dashed var(--line); }
.wajh:first-of-type { border-top: 0; padding-top: 0; }
.wajh-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.wajh-head .ar { font-size: 15px; color: var(--gold); }
.wajh-head b { font-size: 15px; }
.pager { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; padding-top: 8px; }
.pager a { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 12px; min-height: 44px; }
.pager .prev { border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.pager .next { background: var(--green); color: #fff; text-align: right; }
.pager .next small { color: var(--on-green-soft); }
.pager .dis { color: var(--faint); pointer-events: none; }
.pager small { font-size: 12px; }
.pager span { font-size: 14px; font-weight: 600; }
body.quick .deep { display: none !important; }

/* search */
.sbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; padding-block: 10px; padding-left: max(4px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--card); border-bottom: 1px solid var(--line); }
.sbar .searchbox { flex: 1; background: var(--field); height: 46px; }
.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.filters button { flex: none; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--card); color: var(--ink); font-size: 14px; }
.filters button[aria-pressed="true"] { background: var(--green); color: #fff; border-color: var(--green); font-weight: 600; }
.result { display: flex; flex-direction: column; gap: 8px; padding: 16px; color: var(--ink); }
.result .ar { font-size: 18px; line-height: 1.7; color: var(--green); font-weight: 700; }
.result .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.result .meta b { flex: none; color: var(--gold); }
mark { background: var(--gold-soft); color: inherit; padding: 0 2px; border-radius: 3px; }
.empty { padding: 32px 8px; text-align: center; color: var(--muted); }

/* toc */
.bab { display: flex; flex-direction: column; gap: 0; overflow: hidden; }
.bab-head { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--card); }
.bab-head .ar { font-size: 18px; color: var(--green); font-weight: 700; }
.topic-link { display: flex; justify-content: space-between; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); color: var(--ink); font-size: 15px; }
.topic-link b { flex: none; font-size: 12px; color: var(--gold); font-weight: 600; padding-top: 3px; }
.topic-link.off { color: var(--faint); pointer-events: none; }

/* nav */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar nav { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); padding: 6px max(0px, env(safe-area-inset-right, 0px)) 8px max(0px, env(safe-area-inset-left, 0px)); }
.tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--muted); padding: 6px 0; }
.tabbar a[aria-current="page"] { color: var(--green); font-weight: 600; }
.tabbar .brand { display: none; }
.hgrid, .hcol { display: flex; flex-direction: column; gap: 16px; }

/* tablet: wider single column */
@media (min-width: 768px) {
  .app, .tabbar nav { max-width: 760px; }
  .pad { padding-left: 32px; padding-right: 32px; }
  .hero { padding-block: 32px 36px; }
  .hero .ar { font-size: 36px; }
  .hero h1 { font-size: 24px; }
  .kgrid { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .matn { font-size: 28px; }
  #results { display: grid !important; grid-template-columns: repeat(2, minmax(0,1fr)); align-items: start; }
}

/* desktop: side rail instead of bottom tabs, hadith page in two columns */
@media (min-width: 1100px) {
  body { padding-left: 232px; }
  .app { max-width: 1120px; padding-bottom: 0; }
  .tabbar { top: 0; right: auto; width: 232px; border-top: 0; border-right: 1px solid var(--line); padding-bottom: 0; }
  .tabbar nav { max-width: none; grid-template-columns: 1fr; grid-auto-rows: min-content; gap: 4px; padding: 24px 14px; }
  .tabbar .brand { display: flex; flex-direction: column; align-items: flex-start; gap: 0; padding: 0 12px 20px; margin-bottom: 8px; border-bottom: 1px solid var(--line); color: var(--ink); font-size: 13px; }
  .tabbar .brand .ar { font-size: 24px; font-weight: 700; color: var(--green); text-align: left; }
  .tabbar a:not(.brand) { flex-direction: row; gap: 12px; font-size: 15px; padding: 10px 12px; border-radius: 10px; }
  .tabbar a[aria-current="page"] { background: var(--green-soft); }
  .tabbar a:not(.brand):hover { background: var(--seg); }
  .hero { border-radius: 0 0 20px 20px; }
  .kgrid { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .hgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 24px; align-items: start; }
  .hcol-a { position: sticky; top: 76px; max-height: calc(100vh - 92px); overflow-y: auto; }
  body.quick .hgrid { grid-template-columns: minmax(0, 760px); }
  .topbar, .sbar { padding-left: 16px; }
  #results { grid-template-columns: repeat(3, minmax(0,1fr)); }
}
@media (prefers-reduced-motion: no-preference) { .view { animation: in .18s ease-out; } @keyframes in { from { opacity: .4; } to { opacity: 1; } } }
</style>

าะหาบะฮ์ที่รายงานหะดีษมากที่สุดคนหนึ่ง อิบนุอุมัรเคยกล่าวกับเขาว่า ท่านอยู่กับท่านรสูลมากกว่าพวกเรา และรู้หะดีษของท่านดีกว่าพวกเรา", "เป็นผู้มีความรู้และเป็นหนึ่งในผู้ให้ฟัตวาคนสำคัญ ควบคู่กับความน่าเกรงขาม การทำอิบาดะฮ์ และความถ่อมตน อัลบุคอรีย์กล่าวว่ามีผู้รายงานจากเขาแปดร้อยคนหรือมากกว่า", "เสียชีวิตปี ฮ.ศ. 57 ที่มะดีนะฮ์"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["บันทึกโดยอบูดาวูด (83) บทการอาบน้ำละหมาดด้วยน้ำทะเล, อัตติรมิซีย์ (69), อันนะสาอีย์ (1/50) และอิบนุมาญะฮ์ (386) ซึ่งคือ \"นักบันทึกทั้งสี่\" นอกจากนี้ยังมีอิบนุอบีชัยบะฮ์ มาลิก อัชชาฟิอีย์ และอะห์มัด ทุกสายมาจากมาลิก ผ่านเศาะฟวาน บินสุลัยม์ สะอีด บินสะละมะฮ์ และอัลมุฆีเราะฮ์ บินอบีบุรดะฮ์ จากอบูฮุร็อยเราะฮ์", "สถานะ: ศ่อฮีห์ ผู้รายงานเชื่อถือได้ทั้งหมด เป็นผู้รายงานของอัลบุคอรีย์และมุสลิม ยกเว้นอัลมุฆีเราะฮ์และสะอีด บินสะละมะฮ์ ซึ่งอันนะสาอีย์และอิบนุหิบบานรับรองว่าเชื่อถือได้", "นักวิชาการหะดีษจำนวนมากยืนยันว่าศ่อฮีห์ ได้แก่ อัลบุคอรีย์ (เมื่ออัตติรมิซีย์ถาม) อิบนุคุซัยมะฮ์ อิบนุหิบบาน อัลบะเฆาะวีย์ อัฏเฏาะหาวีย์ อิบนุลมุนซิร อัลค็อฏฏอบีย์ อัลหากิม อัลบัยฮะกีย์ และคนอื่น ๆ", "อิบนุอับดิลบัรร์กล่าวว่า หะดีษนี้ศ่อฮีห์ เพราะนักวิชาการยอมรับและปฏิบัติตาม โดยไม่มีนักฟิกฮ์คนใดขัดแย้ง"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["ประโยค \"هو الطهور ماؤه\" มีลักษณะเจาะจงความเป็นฏอฮูรไว้ที่น้ำทะเล แต่ไม่ใช่การจำกัดจริง เพราะน้ำอื่นก็ฏอฮูร เป็นการยืนยันคำตอบแก่ผู้ถามที่ลังเลว่าใช้อาบน้ำละหมาดได้หรือไม่ ท่านนบี ﷺ จึงชี้ชัดว่าใช้ได้", "คำว่า \"الحل ميتته\" ในมุศ็อนนัฟของอิบนุอบีชัยบะฮ์มาโดยไม่มีวาว (و) ผู้แต่งต้นฉบับจึงระบุว่าสำนวนเป็นของอิบนุอบีชัยบะฮ์", "ผู้ถามไม่ได้ถามเรื่องซากสัตว์ทะเล แต่ท่านนบี ﷺ รู้ว่าเมื่อเขาสงสัยเรื่องน้ำทะเลแล้ว เรื่องซากสัตว์ทะเลยิ่งน่าสงสัยกว่า จึงตอบไว้ด้วย", "รายละเอียดเรื่องซากสัตว์ทะเลจะอธิบายเพิ่มในหะดีษที่ 13"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "เหตุการณ์ของหะดีษ", "points_th": ["อิบนุหะญัรย่อหะดีษนี้ เหลือเฉพาะส่วนที่เป็นหลักฐาน ฉบับเต็มคือ มีชายคนหนึ่งมาถามว่า โอ้ท่านรสูลุลลอฮ์ เราเดินทางทางทะเลและนำน้ำจืดไปน้อย หากใช้อาบน้ำละหมาดเราจะกระหายน้ำ เราอาบน้ำละหมาดด้วยน้ำทะเลได้หรือไม่ ท่านจึงตอบด้วยหะดีษนี้", "เศาะหาบะฮ์ลังเลเพราะน้ำทะเลเค็มและมีกลิ่น จึงเข้าใจว่าน้ำที่ดื่มไม่ได้ก็อาจใช้ชำระความสะอาดไม่ได้", "ท่านนบี ﷺ ไม่ตอบเพียงว่า \"ได้\" เพื่อไม่ให้เข้าใจว่าอนุญาตเฉพาะยามจำเป็น และไม่ให้เข้าใจว่าใช้ได้แค่อาบน้ำละหมาด แต่ใช้ยกฮะดัษอื่นหรือล้างนะญิสไม่ได้"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "ข้อตัดสินเรื่องน้ำทะเล", "points_th": ["น้ำทะเลเป็นน้ำฏอฮูร ยกฮะดัษเล็กและฮะดัษใหญ่ได้ และขจัดนะญิสได้ เพราะเป็นน้ำสะอาดที่ยังคงสภาพเดิมตามธรรมชาติ"]}, {"wajh": 6, "type": "fawaid", "heading_ar": null, "heading_th": "ประโยชน์ด้านการให้ฟัตวา", "points_th": ["เมื่อผู้ให้ฟัตวาเห็นว่าผู้ถามจำเป็นต้องรู้เรื่องอื่นที่ไม่ได้ถาม ควรอธิบายให้ด้วย ถือเป็นความดีงามของการให้ฟัตวา และแสดงถึงความเฉลียวฉลาด การสังเกต และความใส่ใจที่จะให้ประโยชน์แก่ผู้คน"]}], "tags_th": ["น้ำ", "น้ำทะเล", "น้ำละหมาด", "อาหารฮาลาล", "สัตว์ทะเล", "การให้ฟัตวา"]}, {"id": "v1-h002", "volume": 1, "bab": "miyah", "topic_ar": "الأصل في الماء الطهارة", "topic_th": "หลักพื้นฐานคือน้ำเป็นสิ่งสะอาด", "pages": [29, 31], "hadith": [{"no": 2, "matn_ar": "وَعَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «إِنَّ الْمَاءَ طَهُورٌ لَا يُنَجِّسُهُ شَيْءٌ». أَخْرَجَهُ الثَّلَاثَةُ، وَصَحَّحَهُ أَحْمَدُ.", "translation_th": "จากอบูสะอีด อัลคุดรีย์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"แท้จริงน้ำนั้นสะอาดและทำให้สะอาดได้ ไม่มีสิ่งใดทำให้มันเป็นนะญิส\" บันทึกโดยนักบันทึกทั้งสาม และอะห์มัดระบุว่าศ่อฮีห์", "grade_th": "ศ่อฮีห์ (ด้วยสายรายงานและหลักฐานสนับสนุน)"}], "key_rulings_th": ["หลักพื้นฐานของน้ำทุกประเภท ทั้งน้ำทะเล แม่น้ำ บ่อ และน้ำฝน คือสะอาดและทำให้สะอาดได้ จนกว่าจะรู้แน่ชัดว่าเป็นนะญิส", "ความหมายกว้างของหะดีษถูกจำกัดด้วยอิจญ์มาอ์: น้ำที่เปลี่ยนสภาพเพราะนะญิสถือเป็นนะญิส", "หะดีษนี้เป็นหนึ่งในถ้อยคำสั้นแต่ครอบคลุมความหมายกว้าง (ญะวามิอุลกะลิม) ของท่านนบี ﷺ"], "vocab": [{"ar": "أَنَتَوَضَّأُ", "th": "\"พวกเราจะอาบน้ำละหมาดหรือ\" (อ่านด้วยนูน) อันนะวะวีย์เห็นว่าควรอ่านด้วยตาอ์ (أتتوضأ: ท่านจะอาบน้ำละหมาดหรือ) แต่อัลอิรอกีย์โต้แย้ง ที่ถูกคือมีรายงานทั้งสองแบบ"}, {"ar": "بِئْرُ بُضَاعَةَ", "th": "บ่อบุฎออะฮ์ ในมะดีนะฮ์ (อ่านสระอุที่บาอ์ อ่านสระอิได้ด้วย)"}, {"ar": "الْحِيَضُ", "th": "ผ้าที่ใช้เช็ดเลือดประจำเดือน"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อบูสะอีด คือ สะอด์ บินมาลิก บินสินาน อัลคุดรีย์ ชาวอันศอร จากเผ่าค็อซร็อจญ์", "ร่วมสงครามกับท่านนบี ﷺ สิบสองครั้ง ครั้งแรกคือสงครามค็อนดัก ปี ฮ.ศ. 5 เพราะก่อนหน้านั้นยังเด็ก", "จดจำความรู้จากท่านนบี ﷺ ไว้มาก เป็นนักวิชาการและผู้ทรงคุณธรรมคนหนึ่งของชาวอันศอร", "เสียชีวิตปี ฮ.ศ. 74 ฝังที่บะกีอ์"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["บันทึกโดยอบูดาวูด (66) บทว่าด้วยบ่อบุฎออะฮ์, อัตติรมิซีย์ (66), อันนะสาอีย์ (1/174) และอะห์มัด (17/190) ผ่านสายอบูอุสามะฮ์ จากอัลวะลีด บินกะษีร จากมุหัมมัด บินกะอ์บ จากอุบัยดุลลอฮ์ บินอับดิลลาฮ์ บินรอฟิอ์ จากอบูสะอีด", "ฉบับเต็ม: มีผู้ถามท่านรสูลุลลอฮ์ ﷺ ว่า เราจะอาบน้ำละหมาดจากบ่อบุฎออะฮ์ได้หรือ ซึ่งเป็นบ่อที่มีผ้าเลือดประจำเดือน เนื้อสุนัข และสิ่งสกปรกถูกทิ้งลงไป ท่านตอบว่า \"น้ำนั้นสะอาด ไม่มีสิ่งใดทำให้มันเป็นนะญิส\"", "สถานะ: ศ่อฮีห์ ด้วยสายรายงานและหลักฐานสนับสนุน ผู้รายงานส่วนใหญ่เชื่อถือได้ ยกเว้นอุบัยดุลลอฮ์ บินอับดิลลาฮ์ ที่อิบนุมันดะฮ์ว่าไม่เป็นที่รู้จัก อิบนุหะญัรว่า \"มัสตูร\" (ไม่ทราบสถานภาพแน่ชัด) แต่จุดนี้ไม่ทำให้หะดีษอ่อน เพราะมีสายรายงานอื่นจากอบูสะอีด", "ผู้ที่ระบุว่าศ่อฮีห์: อิมามอะห์มัด ยะห์ยา บินสะอีด และอิบนุหัซม์ อัตติรมิซีย์กล่าวว่า อบูอุสามะฮ์รายงานหะดีษนี้ได้ดีที่สุด"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["ไม่ควรคิดว่าเศาะหาบะฮ์ ซึ่งเป็นผู้สะอาดที่สุด จงใจทิ้งสิ่งสกปรกลงบ่อทั้งที่น้ำหายาก ความจริงคือบ่ออยู่ในที่ลุ่ม น้ำหลากหรือลมพัดพาสิ่งสกปรกลงไป (อธิบายโดยอัลค็อฏฏอบีย์)", "\"الماء\" ในที่นี้หมายถึงน้ำทุกชนิด", "\"لا
