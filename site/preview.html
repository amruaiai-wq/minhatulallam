่าวว่า ชาวอาหรับใช้เรียกแมลงบินหลายชนิด แต่ที่หมายถึงในหะดีษน่าจะเป็นแมลงวันบ้านที่รู้จักกันทั่วไป ที่เรียกว่า ذباب เพราะเคลื่อนไหวไปมาตลอด"}, {"ar": "فَلْيَغْمِسْهُ", "th": "ให้จุ่มมันลงไปในอาหารหรือเครื่องดื่ม ในรายงานบทการแพทย์ของอัลบุคอรีย์มีว่า \"ให้จุ่มทั้งตัว\" เพื่อไม่ให้เข้าใจว่าจุ่มบางส่วนก็พอ"}, {"ar": "دَاءً... شِفَاءً", "th": "โรค... ยารักษา ในหะดีษอบูสะอีดระบุว่า \"ปีกข้างหนึ่งเป็นพิษ อีกข้างเป็นยารักษา มันจะเอาข้างที่เป็นพิษลงก่อน และเก็บข้างที่เป็นยาไว้\" แสดงว่า \"โรค\" ในที่นี้คือพิษ"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["บันทึกโดยอัลบุคอรีย์ (3320) ในบทการเริ่มต้นการสร้าง และ (5782) ในบทการแพทย์ ผ่านสายอุตบะฮ์ บินมุสลิม จากอุบัยด์ บินหุนัยน์ จากอบูฮุร็อยเราะฮ์", "สำนวนที่สองบันทึกโดยอบูดาวูด (3844) สายรายงานหะซัน และมีรายงานจากอบูสะอีด อัลคุดรีย์ (อะห์มัด และอิบนุมาญะฮ์ 3504 ศ่อฮีห์ด้วยสายอื่นสนับสนุน) และจากอนัส บินมาลิก (อัลบัซซาร ผู้รายงานเป็นผู้รายงานของเศาะฮีห์)", "หะดีษนี้มีสายรายงานมากกว่าห้าสิบสาย ซึ่งมีนักวิจัยรวบรวมไว้ เพียงพอสำหรับผู้ที่ต้องการรู้ความจริงด้วยใจที่บริสุทธิ์และปัญญาที่เปิดกว้าง"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ในเครื่องดื่ม\" เป็นสำนวนในบทการเริ่มต้นการสร้าง ส่วนในบทการแพทย์ใช้ \"ในภาชนะ\" และหะดีษอบูสะอีดใช้ \"ในอาหาร\" คำว่า \"ภาชนะ\" ครอบคลุมที่สุด แต่อิบนุหะญัรเลือกสำนวน \"เครื่องดื่ม\" เพราะเข้ากับบทว่าด้วยน้ำ", "คำสั่งให้จุ่มเพื่อให้ยารักษาออกมาเหมือนที่โรคออกมาแล้ว สารพิษจะถูกหักล้างด้วยสารที่เป็นประโยชน์ซึ่งอัลลอฮ์ทรงใส่ไว้ในปีกอีกข้าง อันตรายจึงหมดไปด้วยอนุมัติของอัลลอฮ์ แพทย์ผู้เชี่ยวชาญในอดีตกล่าวถึงเรื่องนี้ไว้ อิบนุลก็อยยิมและอิบนุหะญัรก็กล่าวไว้ และการค้นพบทางวิทยาศาสตร์ยุคใหม่ก็ยืนยัน", "คำสั่งนี้เป็นคำแนะนำ (อิรชาด) ไม่ใช่คำสั่งบังคับ", "อิบนุหะญัรกล่าวว่า ไม่พบรายงานใดระบุว่าปีกข้างไหนมียารักษา แต่นักวิชาการบางท่านสังเกตว่าแมลงวันใช้ปีกซ้ายป้องกันตัว จึงรู้ได้ว่าปีกขวาคือข้างที่มียารักษา"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "แมลงวันสะอาด", "points_th": ["หะดีษเป็นหลักฐานว่าแมลงวันสะอาด ไม่ทำให้อาหาร เครื่องดื่ม หรือน้ำที่มันตกลงไปเป็นนะญิสหรือเสีย เพราะท่านรสูล ﷺ สั่งให้จุ่มมัน ไม่ได้สั่งให้เททิ้ง"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "การจุ่มและการใช้ต่อ", "points_th": ["หะดีษสั่งให้จุ่มแมลงวันทั้งตัว แล้วหยิบออก และใช้อาหารหรือเครื่องดื่มนั้นต่อได้ ด้วยเหตุผลที่ระบุไว้", "อาหารอาจร้อน และเป็นที่รู้กันว่าแมลงวันจะตายเมื่อถูกจุ่ม ถ้ามันทำให้อาหารเป็นนะญิส ท่านนบี ﷺ คงไม่สั่งสิ่งที่ทำให้อาหารเสีย แต่ท่านสั่งเพื่อให้อาหารดีขึ้น", "คำสั่งนี้ไม่ใช่วาญิบ เป็นคำแนะนำสำหรับผู้ที่ต้องการกินหรือดื่มสิ่งที่แมลงวันตกลงไป ส่วนผู้ที่ไม่อยากกินเพราะรังเกียจ หะดีษไม่ได้กล่าวถึง"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "สัตว์อื่นที่เทียบกับแมลงวัน", "points_th": ["สัตว์ทุกชนิดที่คล้ายแมลงวัน คือไม่มีเลือดไหล และไม่ได้เกิดจากนะญิส เช่น ต่อ แมงมุม ด้วง แมลงปีกแข็ง ผึ้ง ตัวเรือด ยุง ถ้าตกลงในอาหารหรือเครื่องดื่ม ไม่ทำให้เป็นหะรอมหรือนะญิส เพราะหุก่มขึ้นอยู่กับเหตุของมัน", "เหตุที่ทำให้ซากสัตว์เป็นนะญิส คือเลือดที่คั่งอยู่ในตัวสัตว์เมื่อมันตาย สิ่งนี้ไม่มีในสัตว์ที่ไม่มีเลือดไหล จึงไม่เป็นนะญิส", "อิบนุลมุนซิรกล่าวว่า นักวิชาการทั่วไปเห็นว่าน้ำไม่เสียเพราะแมลงวันหรือด้วงตาย และไม่รู้ว่ามีผู้เห็นต่างนอกจากทัศนะหนึ่งของอัชชาฟิอีย์ อันนะวะวีย์กล่าวว่า ที่ถูกต้องคือทั้งหมดสะอาด เพราะหะดีษ เพราะเป็นสิ่งที่พบบ่อย และหลีกเลี่ยงได้ยาก"]}, {"wajh": 6, "type": "fawaid", "heading_ar": null, "heading_th": "อิสลามกับความรู้ทางการแพทย์", "points_th": ["ผู้แต่งเห็นว่าหะดีษนี้แสดงว่าอิสลามล้ำหน้าความรู้ทางการแพทย์ ในการบอกถึงอันตรายของแมลงวันที่พาโรคและเชื้อโรค และบอกวิธีกำจัดอันตรายเมื่อมันตกลงในอาหาร", "ผู้แต่งอ้างงานศึกษาที่ระบุว่า แมลงวันพาเชื้อจุลินทรีย์ที่ฆ่าแบคทีเรียได้ (แบคเทอริโอฟาจ) อยู่มากบนปีก การจุ่มแมลงวันจึงช่วยปล่อยสารที่ฆ่าเชื้อโรคออกมามากขึ้น และเชื้อโรคที่แมลงวันทิ้งไว้จะลดลงแทนที่จะเพิ่มจำนวน มวลการสรรเสริญเป็นของอัลลอฮ์ในความสมบูรณ์ของบทบัญญัตินี้"]}], "tags_th": ["แมลงวัน", "แมลง", "นะญิส", "อาหาร", "การแพทย์"]}, {"id": "v1-h015", "volume": 1, "bab": "miyah", "topic_ar": "ما قطع من الحي فهو ميت", "topic_th": "ส่วนที่ถูกตัดจากสัตว์ที่ยังมีชีวิตถือเป็นซากสัตว์", "pages": [75, 77], "hadith": [{"no": 15, "matn_ar": "عَنْ أَبِي وَاقِدٍ اللَّيْثِيِّ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ النَّبِيُّ ﷺ: «مَا قُطِعَ مِنَ الْبَهِيمَةِ - وَهِيَ حَيَّةٌ - فَهُوَ مَيِّتٌ». أَخْرَجَهُ أَبُو دَاوُدَ، وَالتِّرْمِذِيُّ وَحَسَّنَهُ، وَاللَّفْظُ لَهُ.", "translation_th": "จากอบูวากิด อัลลัยษีย์ (ร.ฎ.) กล่าวว่า ท่านนบี ﷺ กล่าวว่า \"สิ่งที่ถูกตัดจากสัตว์ ขณะที่มันยังมีชีวิตอยู่ ถือเป็นซากสัตว์\" บันทึกโดยอบูดาวูด และอัตติรมิซีย์ซึ่งระบุว่าหะซัน สำนวนนี้เป็นของเขา", "grade_th": "หะซัน (ตามอัตติรมิซีย์) อัดดารุกุฏนีย์เห็นว่ารายงานแบบมุรสัลใกล้ความถูกต้องกว่า"}], "key_rulings_th": ["ส่วนใดก็ตามที่ถูกตัดจากสัตว์ขณะยังมีชีวิต เช่น โหนกอูฐ หรือหางแกะ ถือเป็นซากสัตว์ เป็นนะญิส ห้ามกินและห้ามใช้ประโยชน์ อิบนุตัยมิยะฮ์กล่าวว่าเรื่องนี้นักวิชาการเห็นพ้องกัน", "ยกเว้นส่วนที่ตัดจากสัตว์ที่ซากของมันสะอาด เช่น ตั๊กแตนและปลา ซึ่งสะอาด ถ้าตกลงในน้ำก็ไม่ทำให้น้ำเป็นนะญิส", "ขน ขนสัตว์ และขนนก ถ้าตัดโดยไม่ถอนราก ถือว่าสะอาด", "ถ้าส่วนที่ตัดจากสัตว์ที่ซากเป็นนะญิสตกลงในน้ำหรือสิ่งอื่น ก็มีหุก่มเป็นนะญิส นี่คือเหตุที่อิบนุหะญัรนำหะดีษนี้มาไว้ในบทว่าด้วยน้ำ"], "vocab": [{"ar": "الْبَهِيمَة", "th": "สัตว์สี่เท้า เช่น อูฐ วัว แกะ หรือสัตว์ที่ไม่มีสติปัญญาทุกชนิด ความหมายหลังกว้างกว่า แต่เหตุการณ์ของหะดีษชี้ว่าหมายถึงอูฐและแกะ"}, {"ar": "فَهُوَ مَيِّتٌ / مَيْتَةٌ", "th": "ถือเป็นซากสัตว์ ในฉบับบุลูฆุลมะรอมบางฉบับเขียน \"ميت\" ส่วนในรายงานของอัตติรมิซีย์คือ \"ميتة\" ซากสัตว์คือสิ่งที่ไม่ได้ผ่านการเชือดตามบทบัญญัติ ความหมายคือเป็นหะรอมเหมือนซากสัตว์ เพราะส่วนนั้นตายเมื่อชีวิตหมดไปจากมัน"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อบูวากิด อัลลัยษีย์ เป็นที่รู้จักด้วยกุนยะฮ์ ชื่อจริงมีความเห็นต่างกัน อัตติรมิซีย์ระบุว่าคือ อัลหาริษ บินเอาฟ์", "รับอิสลามตั้งแต่ช่วงแรก และร่วมสงครามบะดัรตามทัศนะที่ถูกต้องที่สุด นับเป็นชาวมะดีนะฮ์ ต่อมาไปพำนักที่มักกะฮ์หนึ่งปี และเสียชีวิตที่นั่น ปี ฮ.ศ. 68"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["บันทึกโดยอบูดาวูด (2858) ในกิตาบการล่าสัตว์ และอัตติรมิซีย์ (1480) ผ่านสายอับดุรเราะห์มาน บินอับดิลลาฮ์ บินดีนาร จากซัยด์ บินอัสลัม จากอะฏออ์ บินยะสาร จากอบูวากิด", "อัตติรมิซีย์ระบุว่าหะซัน แม้อับดุรเราะห์มาน บินอับดิลลาฮ์ บินดีนาร จะถูกวิจารณ์ อิบนุมะอีนว่ามีความอ่อน อบูหาติมว่าเขียนหะดีษของเขาได้แต่ไม่ใช้เป็นหลักฐาน อิบนุหะญัรว่า \"ซื่อสัตย์แต่ผิดพลาดบ้าง\"", "มีอีกสายหนึ่งผ่านอับดุลลอฮ์ บินญะอ์ฟัร จากซัยด์ บินอัสลัม อัลหากิมว่าสายรายงานศ่อฮีห์ แต่อัษษะฮะบีย์ค้าน เพราะอับดุลลอฮ์ บินญะอ์ฟัรอ่อน อย่างไรก็ตาม เมื่อนำสายนี้มารวมกับสายแรก หะดีษก็แข็งแรงขึ้น", "ยังมีรายงานจากอบูสะอีด อัลคุดรีย์ ซึ่งอัลหากิมว่าศ่อฮีห์ตามเงื่อนไขของอัลบุคอรีย์และมุสลิม อัลอัลบานีย์แก้ว่าตามเงื่อนไขของอัลบุคอรีย์เท่านั้น แต่มีผู้รายงานหลายคนรายงานจากซัยด์ บินอัสลัมแบบมุรสัล อัดดารุกุฏนีย์จึงกล่าวว่า รายงานแบบมุรสัลใกล้ความถูกต้องกว่า"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "เหตุการณ์ของหะดีษ", "points_th": ["อิบนุหะญัรย่อหะดีษ เหลือเฉพาะส่วนที่เป็นหลักฐาน ตอนต้นของหะดีษคือ ท่านนบี ﷺ มาถึงมะดีนะฮ์ ขณะที่ชาวเมืองตัดโหนกอูฐและหางแกะจากสัตว์ที่ยังมีชีวิตมากิน ท่านจึงกล่าวหะดีษนี้ (สำนวนของอัตติรมิซีย์) ส่วนอบูดาวูดไม่ได้ระบุเหตุการณ์"]}, {"wajh": 4, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["คำว่า \"ما\" (สิ่งที่) ตีความได้ทั้งเป็นคำเชื่อมหรือคำเงื่อนไข ทั้งสองแบบให้ความหมายครอบคลุมทุกสิ่งที่ถูกตัด"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "หลักใหญ่จากหะดีษนี้", "points_th": ["นักวิชาการถือว่าถ้อยคำของหะดีษนี้เป็นหลักใหญ่หลักหนึ่งของบทบัญญัติ: ส่วนใดที่ถูกตัดจากสัตว์ขณะยังมีชีวิต เช่น โหนกอูฐ หรือหางแกะ ถือเป็นซากสัตว์ เป็นนะญิส ห้ามกินและห้ามใช้ประโยชน์เช่นเดียวกับซากสัตว์ อิบนุตัยมิยะฮ์กล่าวว่าเรื่องนี้นักวิชาการเห็นพ้องกัน", "หลักนี้มีข้อยกเว้น คือส่วนที่ตัดจากสัตว์ที่ซากของมันสะอาด เช่น ตั๊กแตนและปลา ซึ่งสะอาด และถ้าตกลงในน้ำ น้ำก็ยังสะอาด", "ยกเว้นขน ขนสัตว์ และขนนกด้วย ถ้าตัดโดยไม่ถอนราก"]}], "tags_th": ["ซากสัตว์", "นะญิส", "อาหารฮาลาล", "หลักฟิกฮ์"]}, {"id": "v1-h016", "volume": 1, "bab": "aniyah", "topic_ar": "تحريم الأكل والشرب في آنية الذهب والفضة", "topic_th": "ห้ามกินและดื่มในภาชนะทองคำและเงิน", "pages": [79, 84], "hadith": [{"no": 16, "matn_ar": "عَنْ حُذَيْفَةَ بْنِ الْيَمَانِ رَضِيَ اللهُ عَنْهُمَا، قَالَ: قَالَ النَّبِيُّ ﷺ: «لَا تَشْرَبُوا فِي آنِيَةِ الذَّهَبِ وَالْفِضَّةِ، وَلَا تَأْكُلُوا فِي صِحَافِهَا، فَإِنَّهَا لَهُمْ فِي الدُّنْيَا، وَلَكُمْ فِي الْآخِرَةِ». مُتَّفَقٌ عَلَيْهِ.", "translation_th": "จากหุซัยฟะฮ์ บินอัลยะมาน (ร.ฎ.) กล่าวว่า ท่านนบี ﷺ กล่าวว่า \"พวกท่านอย่าดื่มในภาชนะทองคำและเงิน และอย่ากินในจานของมัน เพราะมันเป็นของพวกเขาในดุนยา และเป็นของพวกท่านในอาคิเราะฮ์\" บันทึกโดยอัลบุคอรีย์และมุสลิม", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["หะรอมกินและดื่มในภาชนะทองคำและเงิน ทั้งชายและหญิง ไม่ว่าภาชนะจะเป็นทองหรือเงินล้วน หรือมีทองหรือเงินผสม", "เหตุผลที่ตัวบทระบุคือ การเลียนแบบผู้ปฏิเสธศรัทธา (กาฟิร) ซึ่งใช้ภาชนะเหล่านี้ในดุนยา ส่วนผู้ศรัทธาจะได้ใช้ในอาคิเราะฮ์", "นักวิชาการส่วนใหญ่เห็นว่าห้ามใช้ทุกรูปแบบ เช่น ใส่น้ำหอม ทากุห์ล (ผงทาขอบตา) อาบน้ำละหมาด ส่วนอัศศ็อนอานีย์ อัชเชากานีย์ และอิบนุอุษัยมีน เห็นว่าห้ามเฉพาะกินและดื่ม", "ผู้แต่งเห็นว่าทัศนะหลังมีน้ำหนัก แต่ความยำเกรงและความรอบคอบคือ หลีกเลี่ยงการใช้ทุกรูปแบบ ซึ่งอัสสะอ์ดีย์และอิบนุบาซเลือก"], "vocab": [{"ar": "آنِيَة", "th": "ภาชนะ (พหูพจน์ของ إِنَاء) พหูพจน์จำนวนมากคือ أَوَانِي ในบทนี้หมายถึงภาชนะใส่น้ำละหมาด และกว้างไปถึงภาชนะอาหารและเครื่องดื่ม"}, {"ar": "صِحَاف", "th": "พหูพจน์ของ صَحْفَة คือจานใหญ่ที่อิ่มได้ห้าคน แต่ไม่ได้จำกัดเฉพาะขนาดนี้ จานสำหรับคนเดียวที่ทำจากทองหรือเงินก็ห้ามเช่นกัน"}, {"ar": "فَإِنَّهَا لَهُمْ", "th": "สรรพนาม \"พวกเขา\" หมายถึงผู้ปฏิเสธศรัทธา แม้ไม่ได้เอ่ยถึงมาก่อน แต่เข้าใจได้จากบริบท"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["หุซัยฟะฮ์ บินอัลยะมาน บินญาบิร อัลอับสีย์ ชื่อจริงของอัลยะมานคือ หุสัยล์ (ตามที่ระบุในเศาะฮีห์มุสลิม) ทั้งเขาและบิดาเข้ารับอิสลาม และตั้งใจจะร่วมสงครามบัดร์ แต่พวกมุชริกขัดขวางไว้", "ทั้งสองร่วมสงครามอุหุด บิดาของเขาถูกมุสลิมสังหารโดยไม่รู้ว่าเป็นใคร (อัลบุคอรีย์) อิบนุอิสหากเล่าว่า หุซัยฟะฮ์บริจาคค่าสินไหม (ดิยะฮ์) ของบิดาให้แก่มุสลิม", "เขาได้รับฉายาว่า \"เจ้าของความลับ\" เพราะท่านนบี ﷺ บอกชื่อพวกมุนาฟิกที่วางแผนร้ายต่อท่านขณะเดินทางกลับจากตะบูกแก่เขา และเขากล่าวว่า ท่านนบี ﷺ เล่าให้เขาฟังถึงสิ่งที่จะเกิดขึ้นจนถึงวันกิยามะฮ์", "ร่วมสงครามคันดักและหลังจากนั้น และการพิชิตอิรัก อุมัรแต่งตั้งเขาเป็นผู้ปกครองอัลมะดาอิน อยู่ที่นั่นจนเสียชีวิตปี ฮ.ศ. 36 สี่สิบคืนหลังการสังหารอุษมาน"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกในหมวดอาหาร บทการกินในภาชนะที่ประดับเงิน (5426) ผ่านสายมุญาฮิด จากอับดุรเราะห์มาน บินอบีลัยลา ว่า พวกเขาอยู่กับหุซัยฟะฮ์ เขาขอน้ำดื่ม ชาวมะญูสีคนหนึ่งยกมาให้ในภาชนะเงิน เมื่อวางลงในมือ เขาก็ขว้างทิ้ง แล้วกล่าวว่า ถ้าไม่ใช่เพราะฉันห้ามเขามาแล้วหลายครั้ง (ฉันคงไม่ทำเช่นนี้) แต่ฉันได้ยินท่านนบี ﷺ กล่าวว่า \"อย่าสวมผ้าไหมและผ้าดีบาจ อย่าดื่มในภาชนะทองคำและเงิน อย่ากินในจานของมัน เพราะมันเป็นของพวกเขาในดุนยา และของเราในอาคิเราะฮ์\"", "สำนวนของอัลบุคอรีย์ใช้ \"ของเรา\" แทน \"ของพวกท่าน\" แต่ในอีกรายงานของอัลบุคอรีย์ในหมวดเครื่องแต่งกาย (5830, 5833) ใช้ \"ของพวกท่าน\"", "มุสลิมบันทึก (2067) ผ่านสายอิบนุอบีลัยลาในหมวดเครื่องแต่งกาย โดยไม่มีคำว่า \"ของพวกท่านในอาคิเราะฮ์\" แต่มีคำนี้ในสายอิบนุอุกัยม์ จากหุซัยฟะฮ์ (2067)"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"อย่าดื่ม\" เป็นคำพูดกับผู้ชายที่อยู่ ณ ที่นั้น แต่ครอบคลุมทุกคนที่คำสั่งนี้ไปถึง ทั้งชายและหญิง", "\"เพราะมันเป็นของพวกเขาในดุนยา...\" เป็นประโยคบอกเหตุผล ความหมายคือ ผู้ปฏิเสธศรัทธาใช้ภาชนะเหล่านี้ในดุนยา เพราะไม่มีศาสนาห้ามพวกเขา ไม่ได้หมายความว่าอนุมัติสำหรับพวกเขา เพราะผู้ปฏิเสธศรัทธาไม่มีสิทธิ์เสพความโปรดปรานของอัลลอฮ์ขณะที่ยังปฏิเสธพระองค์", "ผู้ศรัทธาถูกห้ามเลียนแบบพวกเขา และจะได้ใช้ในอาคิเราะฮ์เป็นรางวัลที่ละทิ้งมันในดุนยา ส่วนพวกเขาจะถูกห้ามในอาคิเราะฮ์เพราะการฝ่าฝืนในดุนยา", "หะดีษอัลบะรออ์ บินอาซิบ (มุสลิม): ท่านนบี ﷺ ห้ามเจ็ดเรื่อง หนึ่งในนั้นคือ \"ดื่มในภาชนะเงิน เพราะผู้ที่ดื่มในมันในดุนยา จะไม่ได้ดื่มในมันในอาคิเราะฮ์\" และหะดีษอบูฮุร็อยเราะฮ์ (อันนะสาอีย์ อิบนุหะญัรว่าสายรายงานแข็งแรง): \"...และภาชนะของชาวสวรรค์คือทองคำและเงิน\"", "นักวิชาการเพิ่มเหตุผลอื่น เช่น เป็นช่องทางสู่ความโอหัง และทำให้คนยากจนช้ำใจ แต่ผู้แต่งว่าเหตุผลเหล่านี้ยังมีข้อพิจารณา อิบนุลก็อยยิมกล่าวว่า เหตุผลที่ถูกต้องคือ การใช้ภาชนะเหล่านี้ทำให้หัวใจมีสภาพที่ขัดกับความเป็นบ่าว ท่านนบี ﷺ จึงให้เหตุผลว่ามันเป็นของผู้ปฏิเสธศรัทธาในดุนยา เพราะพวกเขาไม่มีส่วนในความเป็นบ่าว"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "ข้อห้ามเป็นหะรอม และครอบคลุมทุกคน", "points_th": ["หะดีษเป็นหลักฐานห้ามกินและดื่มในภาชนะทองคำและเงิน และข้อห้ามนี้หมายถึงหะรอม เหตุผลคือการเลียนแบบผู้ปฏิเสธศรัทธา อิบนุตัยมียะฮ์กล่าวว่า นักวิชาการจึงถือว่าการใช้ผ้าไหมและภาชนะทองคำเงินเป็นการเลียนแบบผู้ปฏิเสธศรัทธา", "หุก่มนี้ครอบคลุมทั้งชายและหญิง ไม่ว่าภาชนะจะเป็นทองหรือเงินล้วน หรือผสมทองหรือเงิน", "หะดีษนี้ที่จริงอยู่ในเรื่องอาหารและเครื่องดื่ม แต่อิบนุหะญัรนำมาไว้ในบทภาชนะของหมวดฏอฮาเราะฮ์ เพื่อแสดงว่าห้ามอาบน้ำละหมาดจากภาชนะทองคำและเงินด้วย เพราะเป็นการใช้ภาชนะนั้น", "ผู้แต่งยกหะดีษอิบนุอุมัร (อัดดารุกุฏนีย์): \"ผู้ใดดื่มจากภาชนะทองหรือเงิน หรือภาชนะที่มีส่วนหนึ่งเป็นทองหรือเงิน เขากำลังกรอกไฟนรกญะฮันนัมลงในท้อง\" อัดดารุกุฏนีย์ว่าสายรายงานหะซัน และอิบนุบาซก็ว่าหะซัน แต่อิบนุหะญัรว่ามีข้อบกพร่องเพราะผู้รายงานไม่เป็นที่รู้จัก และอัซซะฮะบีย์ว่าเป็นหะดีษมุงกัร"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "ห้ามเฉพาะกินดื่ม หรือห้ามทุกการใช้", "points_th": ["ทัศนะที่หนึ่ง (นักวิชาการส่วนใหญ่): ห้ามใช้ทุกรูปแบบ อัลกุรฏุบีย์กล่าวว่า หะดีษห้ามการกินดื่ม และนำสิ่งที่มีความหมายเดียวกันมารวมด้วย เช่น ใส่น้ำหอม ทากุห์ล ซึ่งนักวิชาการส่วนใหญ่ทั้งยุคแรกและยุคหลังเห็นเช่นนี้ เหตุผลคือ ตัวบทกว้าง เหตุผลของข้อห้ามครอบคลุมทุกการใช้ และผู้หญิงได้รับข้อยกเว้นเฉพาะเรื่องเครื่องประดับเพื่อแต่งตัวให้สามี", "พวกเขากล่าวว่า ตัวบทระบุการกินดื่มเพราะเป็นการใช้ที่พบบ่อยที่สุด และหุก่มที่ผูกกับกรณีส่วนใหญ่ไม่ได้จำกัดหุก่มไว้เฉพาะกรณีนั้น เมื่อห้ามการกินดื่มซึ่งจำเป็นที่สุด การใช้อย่างอื่นก็ยิ่งต้องห้าม", "ทัศนะที่สอง (อัศศ็อนอานีย์ อัชเชากานีย์ อิบนุอุษัยมีน): หะรอมเฉพาะกินและดื่ม การใช้อื่น เช่น ใส่น้ำหอม ทากุห์ล อาบน้ำละหมาด อาบน้ำ อนุญาต เพราะท่านนบี ﷺ ห้ามสิ่งที่เจาะจง ถ้าต้องการห้ามทุกการใช้คงไม่เจาะจงการกินดื่ม และการกินดื่มเป็นที่แสดงความโอ้อวดมากที่สุด", "ทัศนะนี้อ้างหะดีษอุษมาน บินอับดุลลอฮ์ บินเมาฮับ (อัลบุคอรีย์): ครอบครัวส่งเขาไปหาอุมมุสะละมะฮ์พร้อมถ้วยน้ำ นางนำกระบอกเงินที่บรรจุเส้นผมของท่านนบี ﷺ ออกมา เมื่อมีคนถูกตาหรือเจ็บป่วย ก็จะส่งภาชนะใส่น้ำมาหานาง นี่คือการใช้ภาชนะเงินที่ไม่ใช่การกินดื่ม และอุมมุสะละมะฮ์คือผู้รายงานหะดีษห้ามเอง", "อัชเชากานีย์กล่าวว่า การเทียบการใช้อื่นกับการกินดื่มเป็นการเทียบที่ต่างกัน เพราะเหตุผลของข้อห้ามคือการเลียนแบบชาวสวรรค์ที่จะมีคนเวียนนำภาชนะเงินมาให้ ดังหะดีษที่ท่านนบี ﷺ ถามชายที่สวมแหวนทองว่า \"ทำไมฉันเห็นเครื่องประดับของชาวสวรรค์บนตัวท่าน\"", "ผู้แต่งเห็นว่า ทัศนะที่สองมีน้ำหนัก แต่ความยำเกรงและความรอบคอบคือ หลีกเลี่ยงภาชนะทองคำเงินในทุกการใช้ ทั้งกิน ดื่ม อาบน้ำละหมาด อาบน้ำ ทาน้ำมัน ใส่น้ำหอม โดยยึดความกว้างของความหมายและเหตุผล อัสสะอ์ดีย์เลือกทัศนะนี้ และอิบนุบาซกล่าวว่า \"นี่คือสิ่งที่ถูกต้อง\"", "หะดีษอุมมุสะละมะฮ์เป็นเหตุการณ์เฉพาะที่ตีความได้หลายทาง เช่น ภาชนะอาจแค่ชุบเงิน หรือเป็นภาชนะเล็ก ๆ สำหรับใส่เส้นผม และผู้รายงานยังต่างกันว่าคำคือ \"มินฟิฎเฎาะฮ์\" (จากเงิน) หรือ \"มินกุศเศาะฮ์\" (จากผมหน้าม้า) แม้อิบนุหะญัรว่าที่ถูกคือ \"จากเงิน\" แต่หะดีษห้ามมีน้ำหนักกว่า การยึดตามจึงรอบคอบและปลอดภัยกว่า"]}], "tags_th": ["ภาชนะ", "ทองคำ", "เงิน", "เลียนแบบกาฟิร", "หะรอม"]}, {"id": "v1-h017", "volume": 1, "bab": "aniyah", "topic_ar": "تحريم الشرب في آنية الفضة", "topic_th": "ห้ามดื่มในภาชนะเงิน", "pages": [85, 87], "hadith": [{"no": 17, "matn_ar": "عَنْ أُمِّ سَلَمَةَ رَضِيَ اللهُ عَنْهَا، قَالَتْ: قَالَ رَسُولُ اللهِ ﷺ: «الَّذِي يَشْرَبُ فِي إِنَاءِ الْفِضَّةِ إِنَّمَا يُجَرْجِرُ فِي بَطْنِهِ نَارَ جَهَنَّمَ». مُتَّفَقٌ عَلَيْهِ.", "translation_th": "จากอุมมุสะละมะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"ผู้ที่ดื่มในภาชนะเงิน แท้จริงเขากำลังกรอกไฟนรกญะฮันนัมลงในท้องของเขา\" บันทึกโดยอัลบุคอรีย์และมุสลิม", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["หะรอมดื่มในภาชนะเงิน และเป็นบาปใหญ่ เพราะมีคำขู่ด้วยไฟนรก", "ภาชนะทองคำยิ่งหะรอม เพราะทองคำเข้มงวดกว่าเงิน เช่น ผู้ชายสวมแหวนเงินได้ แต่สวมแหวนทองไม่ได้", "การตอบแทนเป็นชนิดเดียวกับการกระทำ ผู้ที่กรอกน้ำในภาชนะเงิน จะกรอกไฟนรกในวันกิยามะฮ์ เว้นแต่เขาสำนึกผิด (เตาบะฮ์)"], "vocab": [{"ar": "يُجَرْجِرُ", "th": "กรอกดื่มต่อเนื่องจนได้ยินเสียง มาจาก الْجَرْجَرَة คือเสียงน้ำตกลงในท้อง"}, {"ar": "نَارَ جَهَنَّمَ", "th": "อ่าน نَارَ (กรรม) เป็นที่รู้จักมากกว่า แปลว่า \"กรอกไฟนรกลงท้อง\" หรืออ่าน نَارُ (ประธาน) แปลว่า \"ไฟนรกส่งเสียงอยู่ในท้อง\""}, {"ar": "جَهَنَّم", "th": "ไฟอันยิ่งใหญ่ ลึกสุดหยั่ง ได้ชื่อนี้เพราะความลึก หรือมาจาก الْجُهُومَة คือความดุร้าย เพราะการลงโทษในนั้นรุนแรง"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อุมมุลมุอ์มินีน อุมมุสะละมะฮ์ ชื่อจริงคือ ฮินด์ บินติอบีอุมัยยะฮ์ หุซัยฟะฮ์ บินอัลมุฆีเราะฮ์ จากเผ่ากุร็อยช์ ตระกูลมัคซูม เป็นที่รู้จักด้วยชื่อเล่น (กุนยะฮ์) มากกว่าชื่อจริง เข้ารับอิสลามแต่เนิ่น ๆ", "สามีคนแรกคืออบูสะละมะฮ์ ลูกของป้าท่านรสูลุลลอฮ์ ﷺ และพี่น้องร่วมนมของท่าน เขาเสียชีวิตหลังสงครามอุหุด นางรักเขามาก", "นางรายงานหะดีษเรื่องดุอาอ์เมื่อประสบเคราะห์ \"อินนาลิลลาฮิ วะอินนาอิลัยฮิรอญิอูน อัลลอฮุมมะอ์ญุรนี ฟีมุศีบะตี วะอัคลุฟลี ค็อยร็อนมินฮา\" (มุสลิม) นางเล่าว่า เมื่ออบูสะละมะฮ์เสียชีวิต นางคิดว่ามุสลิมคนใดจะดีกว่าเขา แต่เมื่อนางกล่าวดุอาอ์นี้ อัลลอฮ์ก็ทรงประทานท่านรสูลุลลอฮ์ ﷺ แทน", "ท่านนบี ﷺ แต่งงานกับนางหลังพ้นอิดดะฮ์ ในปี ฮ.ศ. 4 นางเสียชีวิตที่มะดีนะฮ์ปี ฮ.ศ. 62 เป็นภรรยาคนสุดท้ายของท่านนบี ﷺ ที่เสียชีวิต"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกในหมวดเครื่องดื่ม (5634) ด้วยสำนวนข้างต้น ผ่านสายอับดุลลอฮ์ บินอับดุรเราะห์มาน บินอบีบักร์ ทนเป็นชนิดเดียวกับการกระทำ", "points_th": ["การตอบแทนเป็นชนิดเดียวกับการกระทำ ผู้ที่ดื่มในภาชนะเงินและกรอกน้ำลงท้อง จะกรอกไฟนรกญะฮันนัมลงท้องในวันกิยามะฮ์ เว้นแต่เขาสำนึกผิด แล้วอัลลอฮ์ทรงรับการสำนึกผิดของเขา"]}], "tags_th": ["ภาชนะ", "เงิน", "ทองคำ", "บาปใหญ่", "ญะฮันนัม"]}, {"id": "v1-h018-020", "volume": 1, "bab": "aniyah", "topic_ar": "طهارة جلد الميتة إذا دبغ", "topic_th": "หนังซากสัตว์สะอาดเมื่อฟอกแล้ว", "pages": [88, 94], "hadith": [{"no": 18, "matn_ar": "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللهُ عَنْهُمَا قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «إِذَا دُبِغَ الْإِهَابُ فَقَدْ طَهُرَ». أَخْرَجَهُ مُسْلِمٌ. وَعِنْدَ الْأَرْبَعَةِ: «أَيُّمَا إِهَابٍ دُبِغَ».", "translation_th": "จากอิบนุอับบาส (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"เมื่อหนังสัตว์ถูกฟอกแล้ว แน่นอนมันก็สะอาด\" บันทึกโดยมุสลิม และในรายงานของนักบันทึกทั้งสี่: \"หนังสัตว์ใดก็ตามที่ถูกฟอก...\"", "grade_th": "ศ่อฮีห์ (มุสลิม)"}, {"no": 19, "matn_ar": "وَعَنْ سَلَمَةَ بْنِ الْمُحَبِّقِ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «دِبَاغُ جُلُودِ الْمَيْتَةِ طُهُورُهَا». صَحَّحَهُ ابْنُ حِبَّانَ.", "translation_th": "จากสะละมะฮ์ บินอัลมุหับบิก (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"การฟอกหนังซากสัตว์ คือการชำระมันให้สะอาด\" อิบนุหิบบานระบุว่าศ่อฮีห์", "grade_th": "ศ่อฮีห์ด้วยหลักฐานสนับสนุน (ศ่อฮีห์ ลิฆ็อยริฮี)"}, {"no": 20, "matn_ar": "وَعَنْ مَيْمُونَةَ رَضِيَ اللهُ عَنْهَا، قَالَتْ: مَرَّ رَسُولُ اللهِ ﷺ بِشَاةٍ يَجُرُّونَهَا، فَقَالَ: «لَوْ أَخَذْتُمْ إِهَابَهَا؟» فَقَالُوا: إِنَّهَا مَيْتَةٌ، فَقَالَ: «يُطَهِّرُهَا الْمَاءُ وَالْقَرَظُ». أَخْرَجَهُ أَبُو دَاوُدَ، وَالنَّسَائِيُّ.", "translation_th": "จากมัยมูนะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ เดินผ่านแพะตัวหนึ่งที่พวกเขากำลังลากไป ท่านกล่าวว่า \"ถ้าพวกท่านเอาหนังของมันไว้ (คงจะดี)\" พวกเขากล่าวว่า มันเป็นซากสัตว์ ท่านกล่าวว่า \"น้ำและใบเกาะร็อซจะชำระมันให้สะอาด\" บันทึกโดยอบูดาวูดและอันนะสาอีย์", "grade_th": "ศ่อฮีห์ด้วยหลักฐานสนับสนุน (อัลอัลบานีย์ว่าศ่อฮีห์)"}], "key_rulings_th": ["หนังซากสัตว์สะอาดเมื่อฟอกแล้ว และใช้ใส่ได้ทั้งของแห้งและของเหลว เ ังทุกชนิด ดังที่อีกรายงานว่า \"หนังสัตว์ใดก็ตาม\"", "\"ฏ็อฮุเราะ\" อ่านอักษรฮาอ์ได้ทั้งสระอุและสระอะ อันนะวะวีย์เลือกสระอะ ความสะอาด (ฏุฮร์) คือความสะอาดจากสิ่งสกปรกและนะญิส", "\"ยุฏ็อฮฮิรุฮา\" (ชำระมัน) ตามรูปคำ สรรพนามย้อนไปที่ซากสัตว์ ไม่เช่นนั้นจะใช้คำว่า \"ยุฏ็อฮฮิรุฮู\" (ชำระหนัง) จึงอาจละคำว่า \"หนัง\" ไว้ คือ ชำระหนังซากสัตว์ หรือหมายถึงหนังสัตว์ทั้งประเภท", "\"อัลเกาะร็อซ\" คือเมล็ดจากต้นอิฎอฮ์ ใช้ฟอกหนัง ใบอัรฏออ์ (ไม้ทะเลทรายชนิดหนึ่ง) และวัสดุอื่นใช้แทนได้ เพราะการระบุเกาะร็อซไม่ได้หมายความว่าสิ่งอื่นใช้ไม่ได้ เป็นเพียงตัวอย่าง หรือเพราะเป็นวัสดุที่รู้จักกันในสมัยนั้น", "ปัจจุบันการฟอกหนังทำในโรงงานใหญ่ด้วยสารเคมี ซึ่งใช้ได้ เพราะเป้าหมายคือขจัดส่วนเกินและทำให้หนังแห้งจากความชื้น ใช้สิ่งใดที่ได้ผลก็ถือว่าใช้ได้"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "ทัศนะว่าหนังทุกชนิดสะอาดเมื่อฟอก", "points_th": ["หะดีษอิบนุอับบาสเป็นหลักฐานว่า หนังทุกชนิดเมื่อฟอกแล้วก็สะอาด เพราะใช้รูปคำที่ครอบคลุม (\"อัลอิฮาบ\" และ \"หนังสัตว์ใดก็ตาม\") ไม่ว่าจะเป็นสัตว์ที่สะอาดขณะมีชีวิต เช่น อูฐ วัว แพะ หรือไม่สะอาด เช่น สุนัขและสุกร", "นี่คือทัศนะของดาวูดและสำนักอัซซอฮิรียะฮ์ และอัชเชากานีย์เลือกทัศนะนี้ โดยกล่าวว่า หะดีษในเรื่องนี้ไม่ได้แยกสุนัข สุกร และสัตว์อื่น ความจริงคือการฟอกทำให้สะอาด ไม่มีหะดีษที่ขัดแย้ง ไม่แยกระหว่างสัตว์ที่กินเนื้อได้และกินไม่ได้ และอัชเชากานีย์ว่านี่คือทัศนะของนักวิชาการส่วนใหญ่", "อัชเชากานีย์ยังกล่าวว่า ตามหลักอุศูล ตัวบทที่มีความหมายกว้างไม่ถูกจำกัดด้วยเหตุการณ์ที่เป็นที่มา จึงอ้างว่าเหตุการณ์ในหะดีษคือแพะของมัยมูนะฮ์มาจำกัดหุก่มไม่ได้"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "ทัศนะว่าเฉพาะสัตว์ที่กินเนื้อได้ และทัศนะของผู้แต่ง", "points_th": ["อีกทัศนะอ้างหะดีษสะละมะฮ์และมัยมูนะฮ์ว่า การฟอกทำให้สะอาดเฉพาะหนังของสัตว์ที่การเชือดทำให้เป็นที่อนุมัติ คือสัตว์ที่กินเนื้อได้ เพราะในสำนวน \"การฟอกหนังซากสัตว์คือการเชือดมัน\" ท่านนบี ﷺ เปรียบการฟอกกับการเชือด และการเชือดมีผลเฉพาะกับสัตว์ที่กินเนื้อได้ การฟอกก็เช่นกัน", "นี่คือทัศนะในมัซฮับหันบะลีย์ อิบนุตัยมียะฮ์เลือก อัสสะอ์ดีย์ว่าถูกต้อง และอิบนุบาซก็เช่นกัน อันนะวะวีย์ว่าเป็นทัศนะของอัลเอาซาอีย์ อิบนุลมุบาร็อก อบูเษาร์ และอิสหาก บินรอฮะวัยฮ์", "สัตว์ที่การเชือดไม่ทำให้อนุมัติ เช่น แมว หนังจะไม่สะอาดด้วยการฟอก แม้จะสะอาดขณะมีชีวิต เพราะมันสะอาดขณะมีชีวิตเนื่องจากหลีกเลี่ยงได้ยาก เหตุผลนี้หมดไปเมื่อมันตาย มันจึงกลับสู่หลักเดิมคือนะญิส", "ผู้แต่งเห็นว่า ทัศนะที่ว่าหะดีษมีความหมายกว้างครอบคลุมหนังทุกชนิดเป็นทัศนะที่แข็งแรง แต่ทัศนะที่ชัดที่สุดและใกล้ความถูกต้องที่สุดคือ เฉพาะสัตว์ที่กินเนื้อได้ และความยำเกรงคือ ละเว้นหนังสัตว์อื่น ตามหะดีษ \"ผู้ใดระวังสิ่งคลุมเครือ เขาได้รักษาศาสนาและเกียรติของเขาไว้\" (อัลบุคอรีย์ มุสลิม) และ \"จงละสิ่งที่ทำให้ท่านสงสัย ไปสู่สิ่งที่ไม่ทำให้ท่านสงสัย\" (อัตติรมิซีย์ อันนะสาอีย์ สายรายงานศ่อฮีห์)", "การที่ศาสนาให้การฟอกทำให้หนังซากสัตว์สะอาดเป็นความเมตตาของอัลลอฮ์ ให้ผู้ที่จำเป็น เช่น คนยากจน ได้ใช้ประโยชน์ ศาสนาจึงยกเว้นหนังออกจากข้อห้ามซากสัตว์ที่มีในอัลกุรอาน", "ผู้แต่งจึงเห็นว่า รอบคอบกว่าที่จะไม่สวมเสื้อขนสัตว์ที่ทำจากหนังสัตว์ล่าเหยื่อ (สิบาอ์) ซึ่งมีขายมากในปัจจุบัน แม้ตามทัศนะที่ถือความหมายกว้างจะถือว่าสะอาดก็ตาม สนับสนุนด้วยหะดีษอัลมิกดาม บินมะอ์ดีกะริบ ว่าท่านรสูลุลลอฮ์ ﷺ ห้ามสวมหนังสัตว์ล่าเหยื่อและห้ามขี่บนมัน (อบูดาวูด อันนะสาอีย์ ศ่อฮีห์)"]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "หะดีษอับดุลลอฮ์ บินอุกัยม์", "points_th": ["หะดีษในบทนี้ศ่อฮีห์กว่าหะดีษอับดุลลอฮ์ บินอุกัยม์ ที่ว่า \"หนังสือของท่านรสูลุลลอฮ์ ﷺ มาถึงเราว่า อย่าใช้ประโยชน์จากซากสัตว์ ทั้งหนัง (อิฮาบ) และเอ็น\" (อบูดาวูด 4128 อัตติรมิซีย์ 1729 อันนะสาอีย์ อิบนุมาญะฮ์ อะห์มัด) ซึ่งเป็นหลักฐานของผู้ที่เห็นว่าการฟอกไม่ทำให้หนังซากสัตว์สะอาด และเป็นทัศนะในมัซฮับหันบะลีย์", "นักวิชาการวิจารณ์หะดีษนี้ว่าสับสน (มุฎฏ่อริบ) ในสายรายงาน เพราะอิบนุอบีลัยลาบางครั้งรายงานจากอิบนุอุกัยม์โดยตรง บางครั้งจากผู้อาวุโสเผ่าญุฮัยนะฮ์ และสับสนในตัวบท บางรายงานว่ามาถึงก่อนท่านนบี ﷺ เสียชีวิตสามวัน บ้างว่าหนึ่งเดือน สองเดือน หรือสี่สิบวัน และยังมีข้อขัดแย้งว่าอิบนุอุกัยม์เป็นเศาะหาบะฮ์หรือไม่ อัลบุคอรีย์ว่า เขาทันยุคท่านนบี ﷺ แต่ไม่ปรากฏว่าได้ยินจากท่านโดยตรง", "หะดีษลักษณะนี้จึงยืนขัดกับหะดีษศ่อฮีห์ไม่ได้ หะดีษศ่อฮีห์ชัดกว่า ถูกต้องกว่า เป็นประโยชน์แก่ประชาชาติมากกว่า และใกล้กับหลักศาสนามากกว่า", "ถ้าหะดีษนี้ศ่อฮีห์ ก็ประสานได้ว่า \"อิฮาบ\" คือหนังที่ยังไม่ฟอก จึงเป็นการห้ามใช้หนังซากสัตว์ก่อนฟอก อิบนุหะญัรสนับสนุนการประสานนี้ อัลหาซิมีย์กล่าวว่า หลังฟอกแล้วเรียกว่า \"ญิลด์\" (หนัง) ไม่เรียกว่าอิฮาบ เป็นที่รู้กันในหมู่นักภาษา การประสานเช่นนี้ทำให้ไม่มีความขัดแย้งระหว่างหะดีษ"]}, {"wajh": 7, "type": "fiqh", "heading_ar": null, "heading_th": "ใช้หนังที่ฟอกแล้วใส่ของแห้งและของเหลว", "points_th": ["หะดีษมัยมูนะฮ์และหะดีษก่อนหน้าเป็นหลักฐานว่า ใช้หนังที่ฟอกแล้วใส่ของแห้ง เช่น ข้าวสาลีและข้าวบาร์เลย์ และของเหลว เช่น น้ำ นม เนย น้ำผึ้ง ได้ เพราะคำว่า \"น้ำและใบเกาะร็อซจะชำระมัน\" เมื่อสะอาดแล้ว หุก่มก็เหมือนสิ่งสะอาดอื่น", "ในหะดีษสะละมะฮ์มีถุงหนังแขวนอยู่ แสดงว่าใช้ใส่น้ำ และท่านนบี ﷺ ไม่ได้คัดค้าน แต่ยอมรับ", "อิบนุอับบาสรายงานจากเสาดะฮ์ ภรรยาท่านนบี ﷺ ว่า \"แพะของเราตัวหนึ่งตาย เราจึงฟอกหนังของมัน แล้วเราก็ใช้ทำน้ำนะบีซ (น้ำแช่อินทผลัม) ในนั้นเรื่อยมาจนมันกลายเป็นถุงหนังเก่า\" (อัลบุคอรีย์)"]}], "tags_th": ["หนังซากสัตว์", "การฟอกหนัง", "ซากสัตว์", "ภาชนะ", "สัตว์ล่าเหยื่อ"]}, {"id": "v1-h021", "volume": 1, "bab": "aniyah", "topic_ar": "حكم آنية أهل الكتاب", "topic_th": "หุก่มภาชนะของชาวคัมภีร์", "pages": [95, 97], "hadith": [{"no": 21, "matn_ar": "عَنْ أَبِي ثَعْلَبَةَ الْخُشَنِيِّ رَضِيَ اللهُ عَنْهُ قَالَ: قُلْتُ: يَا رَسُولَ اللهِ، إِنَّا بِأَرْضِ قَوْمٍ أَهْلِ كِتَابٍ، أَفَنَأْكُلُ فِي آنِيَتِهِمْ؟ قَالَ: «لَا تَأْكُلُوا فِيهَا، إِلَّا أَنْ لَا تَجِدُوا غَيْرَهَا، فَاغْسِلُوهَا، وَكُلُوا فِيهَا». مُتَّفَقٌ عَلَيْهِ.", "translation_th": "จากอบูษะอ์ละบะฮ์ อัลคุชะนีย์ (ร.ฎ.) กล่าวว่า ฉันถามว่า โอ้ท่านรสูลุลลอฮ์ เราอยู่ในดินแดนของชนชาวคัมภีร์ เราจะกินในภาชนะของพวกเขาได้ไหม ท่านตอบว่า \"อย่ากินในภาชนะเหล่านั้น เว้นแต่พวกท่านไม่พบภาชนะอื่น ก็จงล้างมัน แล้วกินในมันได้\" บันทึกโดยอัลบุคอรีย์และมุสลิม", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["ใช้ภาชนะของชาวคัมภีร์ (ยิวและคริสต์) ได้ด้วยสองเงื่อนไขในหะดีษ คือ ไม่มีภาชนะอื่น และล้างก่อนใช้", "เงื่อนไขแรกเป็นเรื่องความยำเกรงและความรอบคอบ เพราะพวกเขาไม่ระวังนะญิส อาจใส่สุรา หรือปรุงซากสัตว์และเนื้อสุกรในภาชนะ", "คำสั่งให้ล้างเป็นสุนัต ไม่ใช่วาญิบ เพราะอาหารของชาวคัมภีร์อนุมัติแก่เรา (อัลมาอิดะฮ์: 5) ซึ่งย่อมอยู่ในภาชนะของพวกเขา เว้นแต่มีเหตุที่ต้องล้าง เช่น มีสุรา หรือซากสัตว์ที่ตายด้วยการรัดคอหรือการตี", "เศาะหาบะฮ์ใส่ใจถามเรื่องที่สำคัญหรือสงสัย ซึ่งเป็นหน้าที่ของมุสลิมทุกคนที่จะถามเรื่องศาสนาที่ตนไม่รู้"], "vocab": [{"ar": "أَهْلُ الْكِتَابِ", "th": "ชาวคัมภีร์ คือยิวและคริสต์ ในหะดีษนี้น่าจะหมายถึงคริสต์ เพราะชนเผ่าอาหรับหลายเผ่าในแผ่นดินชาม เช่น ฆัสสาน ตะนูค บะฮ์ร และบางสาขาของกุฎออะฮ์ รวมถึงบนีคุชัยน์ เผ่าของอบูษะอ์ละบะฮ์ ได้เข้ารีตคริสต์"}, {"ar": "إِنَّا بِأَرْضِ قَوْمٍ", "th": "\"เรา\" คือตัวเขาและเผ่าคุชัยน์ \"ดินแดน\" คือแผ่นดินชาม"}, {"ar": "آنِيَتِهِمْ", "th": "ภาชนะของพวกเขา (พหูพจน์ของ إِنَاء)"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อบูษะอ์ละบะฮ์ อัลคุชะนีย์ เศาะหาบะฮ์ที่รู้จักด้วยกุนยะฮ์ \"อัลคุชะนีย์\" สืบเชื้อสายไปถึงคุชัยน์ บินอันนะมิร จากเผ่ากุฎออะฮ์ ชื่อของเขาและบิดามีความเห็นต่างกันมาก อิบนุหะญัรว่าส่วนใหญ่ระบุว่าชื่อ ญุรษูม", "เขาให้สัตยาบันกับท่านนบี ﷺ ในบัยอะตุรริฎวาน ได้รับส่วนแบ่งในสงครามค็อยบัร และท่านนบี ﷺ ส่งเขาไปเผยแผ่แก่เผ่าของเขาจนพวกเขาเข้ารับอิสลาม", "เขาเป็นชาวชนบทที่ยังชีพด้วยการล่าสัตว์ จึงมีคำถามหลายข้อต่อท่านนบี ﷺ เช่น เรื่องภาชนะของชาวคัมภีร์และเรื่องการล่าสัตว์ เขาไปอยู่ที่ชาม และเสียชีวิตที่นั่นปี ฮ.ศ. 75 ขณะกำลังสุญูด"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกในหมวดการล่าสัตว์ สามแห่ง (5478, 5488, 5496) ผ่านสายอบูอิดรีส อัลเคาลานีย์ จากอบูษะอ์ละบะฮ์ และมุสลิมบันทึกในหะดีษเรื่องการล่าสัตว์ (1930)", "หะดีษนี้มีหลายสายและหลายสำนวนในมุสนัด เศาะฮีหัยน์ และหนังสือสุนัน อิบนุหะญัรเลือกเฉพาะส่วนที่ถามเรื่องภาชนะ ไม่รวมส่วนที่ถามเรื่องการล่าสัตว์ด้วยธนูและสุนัขที่ฝึกแล้ว", "ผู้แต่งระบุว่า ไม่พบสำนวนตามที่อยู่ในบุลูฆในเศาะฮีหัยน์ตรงตัว สำนวนที่ใกล้ที่สุดคือของอัลบุคอรีย์ในหมวดการล่าสัตว์ บทการล่าด้วยธนู (5478)"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"เราอยู่ในดินแดนของชนชาวคัมภีร์\" หมายถึงตัวเขาและเผ่าคุชัยน์ในแผ่นดินชาม ชาวคัมภีร์คือยิวและคริสต์ และในที่นี้น่าจะหมายถึงคริสต์ เพราะชนเผ่าอาหรับหลายเผ่าที่อยู่ชามได้เข้ารีตคริสต์", "\"จงล้างมัน\" ตามรูปคำเป็นคำสั่งที่เป็นวาญิบ สั่งให้ล้างก่อนใช้เพราะคาดว่าภาชนะเป็นนะญิส เนื่องจากพวกเขาไม่หลีกเลี่ยงนะญิส เช่น สุราและเนื้อสุกร (จะอธิบายต่อในข้อที่หก)", "\"แล้วกินในมันได้\" เป็นคำสั่งที่หมายถึงการอนุญาต เพราะมาหลังคำถาม \"เราจะกินในภาชนะของพวกเขาได้ไหม\" และหลังข้อห้าม \"อย่ากินในภาชนะเหล่านั้น\""]}, {"wajh": 4, "type": "fawaid", "heading_ar": null, "heading_th": "ความใส่ใจของเศาะหาบะฮ์ในการถาม", "points_th": ["หะดีษแสดงถึงความใส่ใจของเศาะหาบะฮ์ในการถามเรื่องที่สำคัญหรือสงสัย ซึ่งเป็นหน้าที่ของมุสลิมทุกคน คือถามเรื่องศาสนาที่ตนไม่รู้ เพื่อจะได้เคารพภักดีต่ออัลลอฮ์อย่างรู้แจ้ง อัลลอฮ์ตรัสว่า \"ดังนั้นจงถามผู้รู้ หากพวกเจ้าไม่รู้\" (อัลอัมบิยาอ์: 7)"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "หลีกเลี่ยงการกินในภาชนะของชาวคัมภีร์", "points_th": ["หะดีษเป็นหลักฐานให้หลีกเลี่ยงการกินในภาชนะของชาวคัมภีร์ ทั้งยิวและคริสต์ เพราะพวกเขาไม่ระวังนะญิส อาจใส่สุรา หรือปรุงซากสัตว์และเนื้อสุกรในภาชนะ", "กรณีนี้เป็นการขัดกันระหว่างหลักเดิม (สิ่งต่าง ๆ โดยหลักเดิมสะอาด) กับการคาดการณ์ที่มีน้ำหนัก (ว่าพวกเขาไม่ระวังนะญิส) ในที่นี้การคาดการณ์มีน้ำหนักกว่า เพราะมีเหตุผลแข็งแรง", "สนับสนุนด้วยสำนวนของอบูดาวูด (3839): \"เราอยู่ใกล้ชาวคัมภีร์ พวกเขาปรุงสุกรในหม้อ และดื่มสุราในภาชนะของพวกเขา...\""]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "เงื่อนไขการใช้ภาชนะของชาวคัมภีร์", "points_th": ["หะดีษเป็นหลักฐานว่าใช้ภาชนะของชาวคัมภีร์ได้ด้วยสองเงื่อนไข คือ ไม่มีภาชนะอื่น และล้างก่อน", "เงื่อนไขแรก เป็นเรื่องความยำเกรงและความรอบคอบ จึงไม่ใช้ภาชนะของพวกเขา แม้ล้างแล้ว เว้นแต่ไม่มีภาชนะอื่น", "เงื่อนไขที่สอง เพื่อให้แน่ใจว่าภาชนะสะอาด คำสั่งให้ล้างนี้ไม่ใช่วาญิบ แต่เป็นสุนัต เพราะอาหารของชาวคัมภีร์อนุมัติแก่เรา ดังอายะฮ์ \"และอาหารของบรรดาผู้ที่ได้รับคัมภีร์เป็นที่อนุมัติแก่พวกเจ้า\" (อัลมาอิดะฮ์: 5) และอาหารของพวกเขาย่อมอยู่ในภาชนะของพวกเขา แสดงว่าไม่จำเป็นต้องล้าง อายะฮ์นี้จึงเปลี่ยนคำสั่งในหะดีษจากวาญิบเป็นสุนัต เพื่อประสานหลักฐานเข้าด้วยกัน", "เว้นแต่มีเหตุที่ทำให้ต้องล้าง เช่น พบว่ามีสุราในภาชนะ หรือมีซากสัตว์ที่พวกเขาฆ่าด้วยการรัดคอหรือการตี ก็ต้องล้าง ดังที่สำนวนของอบูดาวูดที่กล่าวมาบ่งชี้"]}], "tags_th": ["ภาชนะ", "ชาวคัมภีร์", "นะญิส", "การล้าง", "หลักเดิมคือสะอาด"]}, {"id": "v1-h022", "volume": 1, "bab": "aniyah", "topic_ar": "جواز استعمال آنية المشركين", "topic_th": "อนุญาตให้ใช้ภาชนะของพวกมุชริก", "pages": [98, 101], "hadith": [{"no": 22, "matn_ar": "عَنْ عِمْرَانَ بْنِ حُصَيْنٍ رَضِيَ اللهُ عَنْهُمَا أَنَّ النَّبِيَّ ﷺ وَأَصْحَابَهُ تَوَضَّأُوا مِنْ مَزَادَةِ امْرَأَةٍ مُشْرِكَةٍ. مُتَّفَقٌ عَلَيْهِ، فِي حَدِيثٍ طَوِيلٍ.", "translation_th": "จากอิมรอน บินหุศ็อยน์ (ร.ฎ.) ว่า ท่านนบี ﷺ และเหล่าเศาะหาบะฮ์ของท่าน อาบน้ำละหมาดจากถุงน้ำหนังของหญิงมุชริกคนหนึ่ง บันทึกโดยอัลบุคอรีย์และมุสลิม เป็นส่วนหนึ่งของหะดีษยาว", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม) แต่คำว่า \"อาบน้ำละหมาด\" ไม่ได้ระบุชัดในเศาะฮีหัยน์"}], "key_rulings_th": ["ใช้ภาชนะของพวกมุชริกได้ ตราบที่ไม่แน่ใจว่ามีนะญิส เพราะเศาะหาบะฮ์ดื่มและตักน้ำจากถุงน้ำของหญิงมุชริก", "หะดีษบ่งชี้ว่าหนังซากสัตว์สะอาดเมื่อฟอก เพราะถุงน้ำทำจากหนังสัตว์ที่มุชริกเชือด ซึ่งถือเป็นซากสัตว์", "ผู้ที่จำเป็นอย่างยิ่งเอาน้ำของผู้อื่นได้ แม้ด้วยกำลัง หากไม่ทำให้เจ้าของเดือดร้อน", "หะดีษมีปาฏิหาริย์ของท่านนบี ﷺ คือน้ำในถุงเพิ่มพูนจนทุกคนได้ดื่ม และถุงน้ำกลับคืนไปเต็มเหมือนเดิม"], "vocab": [{"ar": "مَزَادَة", "th": "อ่านสระอะที่มีม ถุงน้ำหนังขนาดใหญ่ ที่เพิ่มหนังอีกชิ้นเข้าไปให้จุมากขึ้น เรียกอีกอย่างว่า سَطِيحَة"}, {"ar": "الْعَزَالِي", "th": "ปากเทน้ำด้านล่างของถุงน้ำหนัง ถุงหนึ่งมีสองปาก (พหูพจน์ของ عَزْلَاء)"}, {"ar": "الصِّرْم", "th": "อ่านสระอิ กลุ่มกระโจมหรือบ้านเรือนที่อยู่รวมกัน"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อิมรอน บินหุศ็อยน์ บินอุบัยด์ อัลคุซาอีย์ เข้ารับอิสลามในปีค็อยบัร และเป็นผู้ถือธงของเผ่าคุซาอะฮ์ในปีพิชิตมักกะฮ์", "อิบนุอับดิลบัรร์กล่าวว่า เขาเป็นเศาะหาบะฮ์ผู้ประเสริฐและมีความรู้ทางนิติศาสตร์ อุมัร บินอัลค็อฏฏอบ ส่งเขาไปบัศเราะฮ์เพื่อสอนศาสนาแก่ชาวเมือง และเขาเสียชีวิตที่นั่นปี ฮ.ศ. 52"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["ดูเหมือนอิบนุหะญัรหมายถึงหะดีษที่อัลบุคอรีย์บันทึกในหมวดตะยัมมุม บท \"ดินที่สะอาดคือน้ำละหมาดของมุสลิม\" (344) และมุสลิมบันทึกในบทการชดละหมาดที่ขาดไป (682) ผ่านอบูเราะญาอ์ อัลอุฏอริดีย์ จากอิมรอน", "ผู้แต่งชี้ว่า ในหะดีษนี้ไม่มีคำว่าท่านนบี ﷺ อาบน้ำละหมาดจากถุงน้ำของหญิงมุชริก", "สรุปเหตุการณ์: ในการเดินทางครั้งหนึ่ง พวกเขาหลับในช่วงท้ายคืนจนแดดร้อนปลุก อุมัรตื่นขึ้นและกล่าวตักบีรเสียงดังจนท่านนบี ﷺ ตื่น ท่านกล่าวว่า \"ไม่เป็นไร จงออกเดินทาง\" แล้วลงพัก อาบน้ำละหมาด และนำละหมาด ท่านเห็นชายคนหนึ่งไม่ละหมาดด้วยเพราะมีญะนาบะฮ์และไม่มีน้ำ ท่านจึงบอกว่า \"จงใช้ดิน เพราะมันเพียงพอสำหรับท่าน\"", "ต่อมาผู้คนกระหายน้ำ ท่านส่งอะลีกับอีกคนไปหาน้ำ ทั้งสองพบหญิงคนหนึ่งบนอูฐพร้อมถุงน้ำสองถุง จึงพานางมาหาท่านนบี ﷺ ท่านให้เทน้ำจากปากถุงลงภาชนะ แล้วปิดปากบน เปิดปากล่าง ประกาศให้ผู้คนดื่มและตักน้ำ และให้น้ำแก่ชายที่มีญะนาบะฮ์ไปอาบ ถุงน้ำกลับดูเต็มกว่าตอนเริ่มเสียอีก ท่านให้รวบรวมอาหารให้นาง และกล่าวว่า \"เธอรู้ไหมว่าเราไม่ได้ลดน้ำของเธอเลย แต่อัลลอฮ์คือผู้ทรงให้เราดื่ม\"", "นางกลับไปเล่าให้ครอบครัวฟังว่า พบชายที่เป็นนักเวทที่เก่งที่สุด หรือไม่ก็เป็นรสูลของอัลลอฮ์จริง ๆ ต่อมามุสลิมบุกโจมตีพวกมุชริกรอบ ๆ แต่ไม่แตะกลุ่มบ้านของนาง นางจึงชวนเผ่าของนางเข้ารับอิสลาม แล้วพวกเขาก็เข้ารับอิสลาม", "สำนวนนี้ไม่ได้ระบุชัดว่าท่านนบี ﷺ อาบน้ำละหมาดจากถุงน้ำ แต่ในสำนวนของอัลบัยฮะกีย์มีว่า \"ท่านบ้วนปากในน้ำ แล้วเทกลับเข้าปากถุงทั้งสอง...\" อัลอัลบานีย์ว่าสายรายงานศ่อฮีห์ ซึ่งแสดงว่าท่านใช้ถุงน้ำของหญิงมุชริก จึงบ่งชี้ว่าภาชนะของผู้ปฏิเสธศรัทธาสะอาด", "ส่วนเรื่องอาบน้ำละหมาด ผู้แต่งเห็นว่าอิบนุหะญัรอาจหมายความว่า พวกเขาเติมน้ำใส่ถุงและภาชนะของตน ซึ่งรวมถึงการใช้น้ำนั้นอาบน้ำละหมาดด้วย หะดีษด้วยสำนวนแบบในบุลูฆพบบ่อยในตำราฟิกฮ์ อัลมัจญ์ระบุไว้ในอัลมุนตะกอ และอัชเชากานีย์ไม่ได้วิจารณ์ ส่วนอิบนุดะกีกิลอีดยกเฉพาะส่วนที่ว่า \"ท่านนบี ﷺ ขอภาชนะแล้วเทน้ำจากปากถุงลงไป\""]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ท่านนบี ﷺ และเหล่าเศาะหาบะฮ์\" ระบุเศาะหาบะฮ์ด้วย เพื่อไม่ให้เข้าใจว่าเป็นเรื่องเฉพาะท่านนบี ﷺ", "\"อาบน้ำละหมาด\" ตามที่กล่าวแล้ว บริบทของหะดีษไม่ได้ระบุชัด แต่เข้าใจได้จากการที่พวกเขาขาดน้ำ แล้วได้น้ำจากหญิงมุชริกด้วยความโปรดปรานของอัลลอฮ์ และการใช้น้ำนั้นย่อมรวมถึงการอาบน้ำละหมาด", "\"มะซาดะฮ์\" คือถุงน้ำหนังขนาดใหญ่ ที่เพิ่มหนังอีกชิ้นเข้าไป เรียกอีกอย่างว่า สะฏีหะฮ์"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "ใช้ภาชนะของพวกมุชริกได้", "points_th": ["หะดีษเป็นหลักฐานว่าใช้ภาชนะของพวกมุชริกได้ ตราบที่ไม่แน่ใจว่ามีนะญิส เพราะเศาะหาบะฮ์ตักน้ำนี้และดื่ม ซึ่งแสดงว่าพวกเขาจะใช้อาบน้ำละหมาดด้วย"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "หนังซากสัตว์สะอาดเมื่อฟอก", "points_th": ["หะดีษเป็นหลักฐานว่าหนังซากสัตว์สะอาดด้วยการฟอก เพราะถุงน้ำทั้งสองทำจากหนังสัตว์ที่พวกมุชริกเชือด และสัตว์ที่พวกมุชริกเชือดถือเป็นซากสัตว์"]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "เอาน้ำของผู้อื่นเมื่อจำเป็น", "points_th": ["ผู้ที่จำเป็นเอาน้ำที่ผู้อื่นครอบครองได้ โดยเฉพาะเมื่อไม่ทำให้เจ้าของเดือดร้อน จึงเอาน้ำพอดับกระหายได้แม้ด้วยกำลัง เพราะเป็นการปกป้องชีวิตตนเองจากความกระหาย และไม่ทำให้เจ้าของเดือดร้อน", "นี่เป็นกรณีที่ถือว่าหญิงคนนั้นมีพันธสัญญากับมุสลิม แต่บางท่านกล่าวว่า พวกเขาเอาน้ำของนางได้ เพราะนางเป็นผู้ปฏิเสธศรัทธาที่อยู่ฝ่ายศัตรู (กาฟิรหัรบีย์)"]}, {"wajh": 7, "type": "fawaid", "heading_ar": null, "heading_th": "ปาฏิหาริย์ของท่านนบี ﷺ", "points_th": ["หะดีษมีปาฏิหาริย์ที่ชัดเจนอันเป็นสัญญาณแห่งความเป็นนบี อัลลอฮ์ทรงประทานความจำเริญในน้ำนี้ จนผู้คนดื่มและตักน้ำ และถุงน้ำทั้งสองกลับเป็นเหมือนเดิม", "ในรายงานของเศาะฮีหัยน์: \"พวกเราสี่สิบคนที่กระหายน้ำได้ดื่มจนอิ่ม และเติมถุงหนังและภาชนะน้ำทุกใบที่มีอยู่ เพียงแต่เราไม่ได้ให้อูฐดื่ม และถุงน้ำนั้นเกือบจะล้นออกมาเพราะความเต็ม\"", "อิบนุหะญัรอธิบายคำว่า \"เราไม่ได้ลดน้ำของเธอเลย\" ว่า ตามรูปคำ น้ำทั้งหมดที่พวกเขาเอาไป เป็นน้ำที่อัลลอฮ์ทรงเพิ่มและสร้างขึ้นใหม่ ไม่ได้ปะปนกับน้ำของนางเลยในความเป็นจริง แม้ภายนอกจะดูเหมือนปะปนกัน และนี่เป็นปาฏิหาริย์ที่น่าอัศจรรย์ยิ่งกว่า"]}], "tags_th": ["ภาชนะ", "มุชริก", "หนังซากสัตว์", "ปาฏิหาริย์", "อาบน้ำละหมาด"]}, {"id": "v1-h023", "volume": 1, "bab": "aniyah", "topic_ar": "جواز إصلاح الإناء بسلسلة من الفضة", "topic_th": "อนุญาตให้ซ่อมภาชนะด้วยลวดเงิน", "pages": [102, 103], "hadith": [{"no": 23, "matn_ar": "عَنْ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللهُ عَنْهُ: أَنَّ قَدَحَ النَّبِيِّ ﷺ انْكَسَرَ، فَاتَّخَذَ مَكَانَ الشَّعْبِ سِلْسِلَةً مِنْ فِضَّةٍ. أَخْرَجَهُ الْبُخَارِيُّ.", "translation_th": "จากอนัส บินมาลิก (ร.ฎ.) ว่า ถ้วยดื่มน้ำของท่านนบี ﷺ แตก ท่านจึงใช้ลวดเงินเย็บตรงรอยร้าว บันทึกโดยอัลบุคอรีย์", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์)"}], "key_rulings_th": ["อนุญาตให้ซ่อมภาชนะที่แตกด้วยลวดเงินเมื่อจำเป็น ที่หะรอมคือภาชนะที่ทำจากเงิน ส่วนการยึดด้วยเงินเล็กน้อยไม่เป็นไร", "ข้ออนุโลมนี้เฉพาะเงิน ทองคำใช้ไม่ได้ เพราะมีค่ามากกว่าและข้อห้ามรุนแรงกว่า", "ควรซ่อมภาชนะและข้าวของที่ซ่อมได้ แทนการทิ้งแล้วซื้อใหม่ เพราะเป็นความพอดีและการบริหารทรัพย์สินที่ดี"], "vocab": [{"ar": "قَدَح", "th": "ถ้วยดื่มน้ำ พหูพจน์คือ أَقْدَاح"}, {"ar": "انْكَسَرَ", "th": "แตก ในอีกรายงานของอัลบุคอรีย์ว่า انْصَدَعَ คือร้าว"}, {"ar": "الشَّعْب", "th": "รอยร้าว รอยแตก"}, {"ar": "سِلْسِلَة", "th": "อ่านสระอิ คือลวดเงิน หรือชิ้นเงินที่เชื่อมสองข้างของรอยแตก"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกในหมวดการแบ่งคุมุส บทสิ่งที่กล่าวถึงเกี่ยวกับเสื้อเกราะ ไม้เท้า ดาบ และถ้วยของท่านนบี ﷺ (3109) ด้วยสำนวนนี้ ตอนท้ายอาศิมกล่าวว่า \"ฉันเห็นถ้วยนั้นและได้ดื่มจากมัน\"", "อัลบุคอรีย์ยังบันทึกในหมวดเครื่องดื่ม (5638) ผ่านสายอาศิม อัลอะห์วัล จากอิบนุสีรีน จากอนัส", "ผู้แต่งไม่ได้ใส่ชีวประวัติผู้รายงานในหัวข้อนี้ ข้อแรกจึงเป็นที่มาของหะดีษ"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ท่านจึงใช้...\" ตามรูปคำ ผู้ใช้ลวดเงินคือท่านนบี ﷺ สนับสนุนด้วยคำของอิบนุสีรีน (อัลบุคอรีย์): ในถ้วยมีห่วงเหล็ก อนัสต้องการเปลี่ยนเป็นห่วงทองหรือเงิน อบูฏ็อลหะฮ์กล่าวว่า \"อย่าเปลี่ยนสิ่งที่ท่านรสูลุลลอฮ์ ﷺ ทำไว้\" อนัสจึงไม่เปลี่ยน", "เรื่องนี้ยืนยันว่า ผู้ใช้ลวดเงินคือท่านรสูลุลลอฮ์ ﷺ ถ้วยไม่ได้เปลี่ยนจากที่เป็นอยู่ในสมัยท่าน และห่วงเหล็กที่อนัสต้องการเปลี่ยนเป็นทองหรือเงินเป็นคนละชิ้นกับลวดเงิน"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "ซ่อมภาชนะด้วยเงิน", "points_th": ["หะดีษเป็นหลักฐานว่า อนุญาตให้ซ่อมภาชนะที่แตกด้วยลวดเงินเมื่อจำเป็น ที่หะรอมคือการที่ภาชนะทำจากเงิน ส่วนการยึดด้วยเงินเล็กน้อยไม่เป็นไร เพราะเห็นประโยชน์ชัดเจน และภาชนะส่วนใหญ่มีขนาดเล็ก ไม่ต้องใช้เงินมาก", "ส่วนหะดีษอิบนุอุมัร \"หรือภาชนะที่มีส่วนหนึ่งเป็นทองหรือเงิน\" ที่กล่าวไปแล้ว (ในหะดีษที่ 16) หากศ่อฮีห์ ก็ไม่ขัดกับหะดีษนี้ เพราะคำว่า \"ส่วนหนึ่ง\" มีความหมายกว้าง และหะดีษนี้จำกัดความหมายนั้น ตามที่อัชเชากานีย์กล่าว"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "ข้ออนุโลมเฉพาะเงิน ไม่รวมทองคำ", "points_th": ["ข้ออนุโลมนี้เฉพาะเงิน เพราะตัวบทระบุเงิน ส่วนทองคำใช้ในกรณีเช่นนี้ไม่ได้ เพราะมีค่ามากกว่าและข้อห้ามรุนแรงกว่า", "และถ้าทองคำใช้ได้ ท่านนบี ﷺ คงใช้กับภาชนะ เพราะทองคำไม่เป็นสนิมยิ่งกว่าเงิน"]}, {"wajh": 5, "type": "fawaid", "heading_ar": null, "heading_th": "ซ่อมแทนทิ้ง", "points_th": ["หะดีษแสดงว่า เมื่อซ่อมภาชนะหรือข้าวของในบ้านได้ ก็ควรซ่อม ไม่ทิ้งแล้วซื้อใหม่ เพราะการซ่อมเป็นความพอดีและการบริหารทรัพย์สินที่ดี", "ผู้แต่งว่า นี่เป็นบทเรียนสำหรับผู้ที่ชอบเปลี่ยนของใหม่และตามกระแส ทั้งยานพาหนะ เฟอร์นิเจอร์ และเสื้อผ้า ส่วนของเก่าขายในราคาถูก ถ้าไม่ถูกทิ้งไปเสียก่อน ซึ่งเป็นการบริหารที่ไม่ดีและไม่รักษาทรัพย์สิน"]}], "tags_th": ["ภาชนะ", "เงิน", "ทองคำ", "การซ่อมแซม", "ความพอดี"]}, {"id": "v1-h024", "volume": 1, "bab": "najasah", "topic_ar": "نجاسة الخمر", "topic_th": "สุราเป็นนะญิส", "pages": [105, 108], "hadith": [{"no": 24, "matn_ar": "عَنْ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللهُ عَنْهُ قَالَ: سُئِلَ رَسُولُ اللهِ ﷺ عَنِ الْخَمْرِ تُتَّخَذُ خَلًّا؟ قَالَ: «لَا». أَخْرَجَهُ مُسْلِمٌ.", "translation_th": "จากอนัส บินมาลิก (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ ถูกถามเรื่องสุราว่า นำมาทำเป็นน้ำส้มสายชูได้ไหม ท่านตอบว่า \"ไม่ได้\" บันทึกโดยมุสลิม", "grade_th": "ศ่อฮีห์ (มุสลิม)"}], "key_rulings_th": ["ผู้แต่งเห็นว่าสุราเป็นนะญิส ตามทัศนะของนักวิชาการส่วนใหญ่ (สี่มัซฮับและซอฮิรียะฮ์) อิบนุตัยมียะฮ์ อัชชันกีฏีย์ และอิบนุบาซเลือก", "บางท่านเห็นว่าสุราสะอาด เช่น เราะบีอะฮ์ อัลลัยษ์ อัลมุซะนีย์ อัศศ็อนอานีย์ อัชเชากานีย์ และอะห์มัด ชากิร", "ห้ามทำสุราให้เป็นน้ำส้มสายชู และสุราที่ถูกทำเป็นน้ำส้มสายชูไม่สะอาด ยังคงเป็นนะญิส", "ถ้าสุรากลายเป็นน้ำส้มสายชูเองโดยไม่มีใครทำ นักวิชาการส่วนใหญ่เห็นว่าใช้ได้ เพราะความมึนเมาหมดไปแล้ว"], "vocab": [{"ar": "الْخَمْر", "th": "สุรา คือสิ่งที่ทำให้มึนเมา จากน้ำคั้นหรือน้ำแช่ของสิ่งใดก็ได้ ทั้งองุ่น อินทผลัม หรืออื่น ๆ"}, {"ar": "الْخَلّ", "th": "น้ำส้มสายชู คือน้ำคั้นองุ่นหรือสิ่งอื่นที่เปรี้ยวแล้ว"}, {"ar": "تُتَّخَذُ خَلًّا", "th": "ทำให้สุรากลายเป็นน้ำส้มสายชู เช่น ใส่หัวหอม ขนมปัง ยีสต์ หรือหินลงไป ย้ายจากที่ร่มไปที่แดด หรือผสมกับน้ำส้มสายชู"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อิบนุหะญัรนำหะดีษนี้มาในบทนี้เพื่อแสดงว่าสุราเป็นนะญิส ตามทัศนะของนักวิชาการส่วนใหญ่ ก่อนหน้าท่าน อิบนุดะกีกิลอีด (อัลอิลมาม) และอิบนุอับดิลฮาดี (อัลมุหัรร็อร) ก็ทำเช่นนี้ ส่วนนักหะดีษทั่วไปนำหะดีษนี้ไว้ในหมวดเครื่องดื่ม", "มุสลิมบันทึกในหมวดเครื่องดื่ม (1983) ผ่านสายสุฟยาน อัษเษารีย์ จากอัสสุดดีย์ จากยะห์ยา บินอับบาด จากอนัส อัตติรมิซีย์บันทึกในหมวดการซื้อขาย (1294) และว่าหะซันศ่อฮีห์", "อบูดาวูดบันทึกในหมวดเครื่องดื่ม (3675) ด้วยสายเดียวกัน สำนวนว่า อบูฏ็อลหะฮ์ถามท่านนบี ﷺ เรื่องเด็กกำพร้าที่ได้รับมรดกเป็นสุรา ท่านตอบว่า \"จงเททิ้ง\" เขาถามว่า ทำเป็นน้ำส้มสายชูไม่ได้หรือ ท่านตอบว่า \"ไม่ได้\""]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ถูกถามเรื่องสุรา\" สุราคือสิ่งที่ทำให้สติมึนเมา จากน้ำคั้นหรือน้ำแช่ของสิ่งใดก็ได้ ผู้ถามอาจเป็นอบูฏ็อลหะฮ์ ดังรายงานของอบูดาวูด หรืออาจเป็นคนอื่น", "\"นำมาทำเป็นน้ำส้มสายชู\" ดูเหมือนคำถามนี้เกิดหลังการห้ามสุรา ความหมายคือ ทำให้สุรากลายเป็นน้ำส้มสายชูหลังจากที่มันแรงและเป็นฟองแล้ว ด้วยการใส่สิ่งต่าง ๆ ลงไป เช่น หัวหอม ขนมปัง ยีสต์ หิน ย้ายจากที่ร่มไปที่แดดหรือกลับกัน หรือผสมกับน้ำส้มสายชู"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "สุราเป็นนะญิสหรือไม่", "points_th": ["ทัศนะที่หนึ่ง: สุราเป็นนะญิสเมื่อแรงและทำให้มึนเมา ถ้าเปื้อนร่างกาย เสื้อผ้า หรือภาชนะ ต้องล้าง เป็นทัศนะของนักนิติศาสตร์ส่วนใหญ่จากหะนะฟีย์ มาลิกีย์ ชาฟิอีย์ หันบะลีย์ และซอฮิรียะฮ์ อิบนุตัยมียะฮ์ อัชชันกีฏีย์ และอิบนุบาซเลือกทัศนะนี้", "ทัศนะที่สอง: สุราสะอาด อัลกุรฏุบีย์ระบุว่าเป็นทัศนะของเราะบีอะฮ์ บินอับดิรเราะห์มาน (อาจารย์ของอิมามมาลิก) อัลลัยษ์ บินสะอ์ด์ และอัลมุซะนีย์ และนักนิติศาสตร์กลุ่มหนึ่ง อัศศ็อนอานีย์ อัชเชากานีย์ และอะห์มัด ชากิร เลือกทัศนะนี้", "หลักฐานของทัศนะแรก (1) อายะฮ์ \"แท้จริงสุรา การพนัน แท่นหินบูชา และการเสี่ยงทาย เป็นสิ่งโสมม (ริจส์) จากการกระทำของชัยฏอน ดังนั้นจงหลีกห่างจากมัน\" (อัลมาอิดะฮ์: 90) อัลลอฮ์เรียกสุราว่า ริจส์ ซึ่งหมายถึงสิ่งสกปรกที่เป็นนะญิส ดังที่ทรงเรียกซากสัตว์ เลือดที่ไหล และเนื้อสุกรว่า ริจส์ และคำว่า \"จงหลีกห่าง\" หมายถึงหลีกห่างทุกทาง ไม่ว่าจะดื่ม ขาย ทำเป็นน้ำส้มสายชู หรือใช้รักษาโรค", "(2) หะดีษอบูษะอ์ละบะฮ์ (หะดีษที่ 21) ท่านนบี ﷺ สั่งให้ล้างภาชนะของชาวคัมภีร์ที่ใช้ปรุงสุกรและดื่มสุรา คำสั่งให้ล้างแสดงว่าเป็นนะญิส ถ้าสะอาด ท่านคงไม่สั่งให้ล้าง", "หลักฐานของทัศนะที่สอง (1) หะดีษอนัส (อัลบุคอรีย์): เมื่อสุราถูกห้าม ผู้คนก็ออกมาเทสุราในตลาด ถ้าสุราเป็นนะญิส ท่านนบี ﷺ คงห้ามพวกเขา เหมือนที่ห้ามถ่ายทุกข์บนทาง (2) หลักเดิมของสิ่งต่าง ๆ คือสะอาด จนกว่าจะมีหลักฐานว่าเป็นนะญิส และหลักฐานของอีกฝ่ายไม่ชัดเจน", "ผู้แต่งเห็นว่า ทัศนะที่ชัดคือสุราเป็นนะญิส เพราะหลักฐานแข็งแรง โดยเฉพาะหะดีษอบูษะอ์ละบะฮ์ ซึ่งถามถึงภาชนะที่ปรุงสุกรและดื่มสุราพร้อมกัน แล้วได้คำตอบเดียวกันสำหรับทั้งสองว่า \"ถ้าพวกท่านไม่พบภาชนะอื่น ก็จงล้างมัน แล้วปรุงและดื่มในนั้น\" อีกทั้งการถือว่าเป็นนะญิสช่วยให้ทำลายสุราและไม่เก็บไว้ ต่างจากการถือว่าสะอาด ที่อาจทำให้ผู้คนหละหลวมในการเก็บมันไว้", "ผู้แต่งตอบหลักฐานการเทสุราบนถนนว่า สมัยนั้นไม่มีท่อระบายน้ำใต้ดิน และการนำออกไปนอกเมืองลำบาก สุราที่เทไม่ได้มากจนท่วมทุกทาง ยังมีทางให้คนเดินเลี่ยง และถนนไม่ใช่ที่ละหมาด ถ้าจะเหยียบโดนก็มีหลักในซุนนะฮ์ว่าดินที่สะอาดหลังจากนั้นจะชำระเท้าหรือรองเท้าได้ ที่จริงหลักฐานนี้กลับชี้ว่าสุราเป็นนะญิส เพราะของสะอาดย่อมไม่เททิ้งบนถนน แต่จะนำไปใช้ประโยชน์"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "ห้ามทำสุราเป็นน้ำส้มสายชู", "points_th": ["หะดีษเป็นหลักฐานว่า ห้ามทำสุราให้เป็นน้ำส้มสายชู และสุราไม่สะอาดเพราะการกระทำของคน แต่ยังเป็นนะญิส", "เพราะท่านนบี ﷺ ตอบคำถามด้วยการปฏิเสธ ซึ่งแสดงว่าหะรอม และเพราะสุราต้องเททิ้ง การไม่เททิ้งแต่กลับทำเป็นน้ำส้มสายชูจึงเป็นการฝ่าฝืน ซึ่งไม่ทำให้สุราสะอาด การห้ามนี้ยังเป็นการปิดช่องทางสู่ความชั่ว (สัดดุซซะรีอะฮ์)", "ท่านนบี ﷺ ห้ามทำสุราของเด็กกำพร้าเป็นน้ำส้มสายชูอย่างชัดเจน (รายงานของอบูดาวูด) ถ้าทำได้ เด็กกำพร้าย่อมสมควรได้รับการอนุโลมมากที่สุด เพราะทรัพย์สินของเด็กกำพร้าสมควรได้รับการรักษาและดูแลมากกว่าทรัพย์สินอื่น", "แต่ถ้าสุรากลายเป็นน้ำส้มสายชูเองโดยไม่มีใครทำ นักวิชาการส่วนใหญ่เห็นว่าไม่เป็นไร เพราะความมึนเมาซึ่งเป็นเหตุของข้อห้ามหมดไปแล้ว และน้ำส้มสายชูเป็นสิ่งอนุมัติ ท่านนบี ﷺ ขอกับข้าวจากครอบครัวของท่าน พวกเขาตอบว่ามีแต่น้ำส้มสายชู ท่านจึงกินกับมันและกล่าวว่า \"กับข้าวที่ดีคือน้ำส้มสายชู\" (มุสลิม)"]}], "tags_th": ["สุรา", "นะญิส", "น้ำส้มสายชู", "เด็กกำพร้า", "สัดดุซซะรีอะฮ์"]}, {"id": "v1-h025", "volume": 1, "bab": "najasah", "topic_ar": "نجاسة الحمر الأهلية", "topic_th": "ลาบ้านเป็นนะญิส", "pages": [109, 112], "hadith": [{"no": 25, "matn_ar": "وَعَنْهُ قَالَ: لَمَّا كَانَ يَوْمُ خَيْبَرَ، أَمَرَ رَسُولُ اللهِ ﷺ أَبَا طَلْحَةَ، فَنَادَى: «إِنَّ اللهَ وَرَسُولَهُ يَنْهَيَانِكُمْ عَنْ لُحُومِ الْحُمُرِ الْأَهْلِيَّةِ، فَإِنَّهَا رِجْسٌ». مُتَّفَقٌ عَلَيْهِ.", "translation_th": "จากอนัส (ร.ฎ.) กล่าวว่า ในวันค็อยบัร ท่านรสูลุลลอฮ์ ﷺ สั่งอบูฏ็อลหะฮ์ เขาจึงประกาศว่า \"แท้จริงอัลลอฮ์และรสูลของพระองค์ห้ามพวกท่านกินเนื้อลาบ้าน เพราะมันเป็นสิ่งโสมม (ริจส์)\" บันทึกโดยอัลบุคอรีย์และมุสลิม", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["เนื้อลาบ้านหะรอม และเนื้อ เลือด ปัสสาวะ และมูลของมันเป็นนะญิส เรื่องนี้ไม่มีข้อขัดแย้ง", "นักวิชาการต่างกันเรื่องตัว เหงื่อ น้ำลาย และน้ำที่เหลือจากการดื่มของลา มัซฮับอิมามอะห์มัดว่าเป็นนะญิส นักวิชาการส่วนใหญ่ว่าสะอาด", "ผู้แต่งเห็นว่าทัศนะที่มีน้ำหนักคือสะอาด เพราะท่านนบี ﷺ และเศาะหาบะฮ์ขี่ลา และหลีกเลี่ยงได้ยากเหมือนแมว ซึ่งเหมาะกับความง่ายของศาสนา", "ใช้คนประกาศหุก่มสำคัญได้ ถ้าเป็นผู้ที่เชื่อถือได้ และใช้ล่ามได้ ถ้าซื่อสัตย์และรู้ทั้งสองภาษา", "อนุญาตให้รวมพระนามของอัลลอฮ์กับผู้อื่นในสรรพนามเดียว เช่น \"ทั้งสองห้ามพวกท่าน\""], "vocab": [{"ar": "يَوْمُ خَيْبَرَ", "th": "สงครามค็อยบัร ปลายเดือนมุหัรร็อม ฮ.ศ. 7 ค็อยบัรอยู่ห่างจากมะดีนะฮ์ราว 160 กิโลเมตร ในภาษาของชาวยิวแปลว่าป้อม เป็นชื่อของป้อมและไร่นาของชาวยิว"}, {"ar": "الْحُمُرُ الْأَهْلِيَّة", "th": "ลาบ้าน (الحُمُر พหูพจน์ของ حِمَار) คำว่า \"บ้าน\" เพื่อแยกจากลาป่า ซึ่งเป็นที่อนุมัติ"}, {"ar": "رِجْس", "th": "สิ่งสกปรกโสมมทุกอย่าง"}, {"ar": "يَنْهَيَانِكُمْ", "th": "ทั้งสอง (อัลลอฮ์และรสูล) ห้ามพวกท่าน"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกหลายแห่ง หนึ่งในนั้นคือหมวดการล่าสัตว์และการเชือด บทเนื้อลาบ้าน (5528) และมุสลิม (1940) ผ่านสายมุหัมมัด บินสีรีน จากอนัส มุสลิมเพิ่มคำว่า \"จากการกระทำของชัยฏอน\"", "สำนวนในบุลูฆใกล้กับของอัลบุคอรีย์ แต่อัลบุคอรีย์ไม่ได้ระบุชื่อผู้ประกาศ ชื่ออบูฏ็อลหะฮ์มีในรายงานของมุสลิม"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"วันค็อยบัร\" คือสงครามค็อยบัร ปลายเดือนมุหัรร็อม ฮ.ศ. 7 อิบนุลก็อยยิมระบุว่าเป็นทัศนะของนักวิชาการส่วนใหญ่", "\"อบูฏ็อลหะฮ์\" คือ ซัยด์ บินสะฮ์ล์ อัลนัจญารีย์ อัลอันศอรีย์ รู้จักด้วยกุนยะฮ์ เป็นเศาะหาบะฮ์ผู้ประเสริฐ สามีของอุมมุสุลัยม์ มารดาของอนัส อิมามอะห์มัดบันทึกว่าท่านนบี ﷺ กล่าวว่า \"เสียงของอบูฏ็อลหะฮ์น่าเกรงขามต่อพวกมุชริกยิ่งกว่าทหารหนึ่งกองร้อย\" สายรายงานศ่อฮีห์ตามเงื่อนไขของมุสลิม ส่วนสายของอะลี บินญุดอานอ่อน เขาเสียชีวิตปี ฮ.ศ. 34", "\"เพราะมันเป็นริจส์\" เป็นประโยคบอกเหตุผล สรรพนาม \"มัน\" อาจหมายถึงตัวลา จึงทำให้เหงื่อ น้ำลาย น้ำตา และน้ำมูกของมันเป็นนะญิส หรืออาจหมายถึงเนื้อที่อยู่ในหม้อ จึงมีเพียงเนื้อที่เป็นนะญิส ส่วนสิ่งที่กล่าวมาสะอาด"]}, {"wajh": 3, "type": "fawaid", "heading_ar": null, "heading_th": "การประกาศหุก่ม และการใช้ล่าม", "points_th": ["หะดีษแสดงว่าศาสนาให้ประกาศเพื่อแจ้งหุก่มสำคัญและเรื่องอื่น ๆ และให้ผู้อื่นประกาศแทนได้ ถ้าผู้ประกาศเชื่อถือได้ ส่วนผู้ที่เชื่อถือไม่ได้ ไม่อนุญาต", "จากหะดีษนี้ยังได้ว่า ใช้ล่ามแปลคำพูดจากภาษาหนึ่งไปอีกภาษาได้ โดยมีเงื่อนไขว่าล่ามต้องซื่อสัตย์และรู้ทั้งสองภาษา เพื่อไม่ให้แปลผิดหรือบิดเบือนความหมาย"]}, {"wajh": 4, "type": "fawaid", "heading_ar": null, "heading_th": "รวมพระนามอัลลอฮ์กับผู้อื่นในสรรพนามเดียว", "points_th": ["หะดีษแสดงว่าอนุญาตให้รวมพระนามของอัลลอฮ์กับผู้อื่นในสรรพนามเดียว เช่นเดียวกับหะดีษ \"...ให้อัลลอฮ์และรสูลของพระองค์เป็นที่รักแก่เขายิ่งกว่าสิ่งอื่นใดนอกจากทั้งสอง\" (อัลบุคอรีย์ มุสลิม)", "ส่วนหะดีษอะดีย์ บินหาติม (มุสลิม) ว่า ชายคนหนึ่งกล่าวคุฏบะฮ์ว่า \"ผู้ใดเชื่อฟังอัลลอฮ์และรสูลของพระองค์ เขาได้รับทางนำ และผู้ใดฝ่าฝืนทั้งสอง เขาหลงผิด\" ท่านนบี ﷺ กล่าวว่า \"ท่านเป็นผู้กล่าวคุฏบะฮ์ที่แย่ จงกล่าวว่า ผู้ใดฝ่าฝืนอัลลอฮ์และรสูลของพระองค์ เขาหลงผิด\" นักวิชาการตอบไว้หลายแนว", "แนวที่หนึ่ง (เป็นที่รู้จักที่สุด อันนะวะวีย์ระบุ): ที่ตำหนิเพราะคุฏบะฮ์ต้องอธิบายให้ละเอียดชัดเจนและเลี่ยงการพูดเป็นนัย ส่วนในหะดีษของบทนี้ไม่ใช่คุฏบะฮ์ แต่เป็นการสอนหุก่ม ยิ่งสั้นก็ยิ่งจำง่าย", "แนวที่สอง: ใช้สรรพนามคู่ในที่นี้ เพื่อบ่งว่าสิ่งที่อัลลอฮ์ห้าม รสูลก็ห้ามด้วย และกลับกัน ทั้งสองแยกจากกันไม่ได้ ส่วนในคุฏบะฮ์สั่งให้แยก เพื่อบ่งว่าการฝ่าฝืนแต่ละฝ่ายก็ทำให้หลงผิดได้ในตัวเอง ระบุในตำราอธิบายกิตาบุตเตาฮีด และพาดพิงถึงอัลบัยฎอวีย์", "แนวที่สาม: เป็นสิทธิพิเศษของท่านนบี ﷺ ที่รวมตัวท่านกับพระผู้อภิบาลในสรรพนามเดียวได้ ผู้อื่นทำไม่ได้ เพราะอาจทำให้เข้าใจว่าเท่าเทียมกัน ส่วนท่านนบี ﷺ ไม่มีทางถูกเข้าใจเช่นนั้น อัสสุยูฏีย์ระบุและพาดพิงถึงอัลอิซซ์ บินอับดิสสลาม และอัลกุรฏุบีย์ก็ชี้ไว้"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "เนื้อลาบ้านหะรอม และลาเป็นนะญิสหรือไม่", "points_th": ["หะดีษเป็นหลักฐานว่าเนื้อลาบ้านหะรอม และเนื้อ เลือด ปัสสาวะ และมูลของมันเป็นนะญิสทั้งหมด เพราะคำว่า \"ทั้งสองห้ามพวกท่าน\" และ \"เพราะมันเป็นริจส์\" หลักเดิมของข้อห้ามคือหะรอม และหลักเดิมของริจส์ (สิ่งสกปรก) คือต้องหลีกห่าง เรื่องนี้ไม่มีข้อขัดแย้ง", "ข้อขัดแย้งอยู่ที่ตัว เหงื่อ น้ำที่เหลือจากการดื่ม และน้ำลายของลา ทัศนะที่หนึ่ง: เป็นนะญิส ถ้าลาดื่มน้ำแล้วเหลือ น้ำนั้นเป็นนะญิส เหงื่อและน้ำมูกก็เช่นกัน เป็นมัซฮับอิมามอะห์มัด หลักฐานคือหะดีษนี้ ถ้าลาบ้านเป็นนะญิส น้ำที่เหลือจากการดื่มและสิ่งที่กล่าวมาก็เป็นนะญิสด้วย", "ทัศนะที่สอง: สะอาด เป็นมัซฮับของนักวิชาการส่วนใหญ่ และเป็นอีกรายงานหนึ่งจากอิมามอะห์มัด อิบนุกุดามะฮ์และผู้แต่งอัลอินศ็อฟเลือก หลักฐาน (1) ท่านนบี ﷺ และเศาะหาบะฮ์ขี่ลา ซึ่งย่อมเปื้อนเหงื่อ ถ้าเป็นนะญิส ท่านนบี ﷺ คงอธิบาย เพราะผู้คนจำเป็นต้องรู้ (2) ผู้เลี้ยงลาหลีกเลี่ยงได้ยาก จึงคล้ายกับแมวที่ตัวบทระบุว่า \"มันเป็นสัตว์ที่วนเวียนอยู่กับพวกท่าน\" เมื่อแมวได้รับการอนุโลมเพราะวนเวียนอยู่ใกล้ ลาก็ยิ่งสมควรได้รับการอนุโลม โดยเฉพาะผู้ที่ขี่ลาเป็นประจำ", "ผู้แต่งเห็นว่าทัศนะที่สองนี้มีน้ำหนักกว่า อินชาอัลลอฮ์ เพราะเหตุผลแข็งแรง เหมาะกับความง่ายของศาสนามากที่สุด และห่างไกลจากความยุ่งยาก", "ทัศนะที่สองตอบว่า หลักฐานของฝ่ายที่ว่าน้ำลายและเหงื่อเป็นนะญิสไม่ได้ชัดเจน เพราะ \"ริจส์\" อาจหมายถึงหะรอม ดังในอายะฮ์เรื่องสุราและการพนัน (อัลมาอิดะฮ์: 90) และอาจหมายถึงเนื้อที่อยู่ในหม้อ ซึ่งเป็นนะญิสเพราะการเชือดสัตว์ที่กินไม่ได้ไม่ทำให้มันสะอาด อิบนุลก็อยยิมจึงกล่าวว่า หลักฐานว่าเป็นนะญิสสู้หลักฐานว่าสะอาดไม่ได้"]}], "tags_th": ["ลาบ้าน", "นะญิส", "ค็อยบัร", "เหงื่อและน้ำลาย", "ล่าม"]}, {"id": "v1-h026", "volume": 1, "bab": "najasah", "topic_ar": "طهارة لعاب الإبل", "topic_th": "น้ำลายอูฐสะอาด", "pages": [113, 115], "hadith": [{"no": 26, "matn_ar": "عَنْ عَمْرِو بْنِ خَارِجَةَ رَضِيَ اللهُ عَنْهُ قَالَ: خَطَبَنَا رَسُولُ اللهِ ﷺ بِمِنًى، وَهُوَ عَلَى رَاحِلَتِهِ، وَلُعَابُهَا يَسِيلُ عَلَى كَتِفِي. أَخْرَجَهُ أَحْمَدُ، وَالتِّرْمِذِيُّ وَصَحَّحَهُ.", "translation_th": "จากอัมร์ บินคอริญะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวคุฏบะฮ์แก่พวกเราที่มินา ขณะที่ท่านอยู่บนพาหนะ (อูฐ) ของท่าน และน้ำลายของมันไหลลงบนบ่าของฉัน บันทึกโดยอะห์มัดและอัตติรมิซีย์ และอัตติรมิซีย์ระบุว่าศ่อฮีห์", "grade_th": "อัตติรมิซีย์ว่าหะซันศ่อฮีห์ สายรายงานมีจุดอ่อน แต่มีหลักฐานสนับสนุนมาก"}], "key_rulings_th": ["น้ำลายอูฐสะอาด เพราะท่านนบี ﷺ เห็นน้ำลายไหลบนบ่าของเศาะหาบะฮ์แต่ไม่ได้สั่งให้ล้าง", "สัตว์ที่กินเนื้อได้ทุกชนิด เช่น วัว แพะ แกะ น้ำลาย ปัสสาวะ มูล และสิ่งที่ขับถ่ายออกมาสะอาดทั้งหมด", "ข้อห้ามละหมาดในคอกอูฐไม่ได้เป็นเพราะนะญิส แต่เพราะอูฐถูกสร้างมาจากชัยฏอน", "ผู้กล่าวคุฏบะฮ์ควรอยู่ในที่สูง และอนุญาตให้กล่าวคุฏบะฮ์บนหลังพาหนะเมื่อมีประโยชน์และไม่นานเกินไป"], "vocab": [{"ar": "مِنًى", "th": "มินา อ่านสระอิที่มีม เป็นสถานที่หนึ่งในพิธีหัจญ์ ได้ชื่อนี้เพราะเลือดของสัตว์พลีถูกหลั่ง (تُمْنَى) ที่นั่น"}, {"ar": "رَاحِلَة", "th": "อูฐที่ใช้ขี่ ทั้งตัวผู้และตัวเมีย บางท่านว่าหมายถึงอูฐตัวเมียที่เหมาะจะผูกอานขี่"}, {"ar": "لُعَاب", "th": "อ่านสระอุ น้ำลายที่ไหลจากปาก"}, {"ar": "كَتِف", "th": "กระดูกแผ่นกว้างหลังหัวไหล่ (บ่า) ในอีกรายงานของอะห์มัดและอัตติรมิซีย์ว่า \"ไหลระหว่างบ่าทั้งสองของฉัน\""}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อัมร์ บินคอริญะฮ์ บินอัลมุนตะฟิก อัลอะสะดีย์ นับอยู่ในชาวชาม ผู้ที่รายงานจากเขาคือ อับดุรเราะห์มาน บินฆันม์ และชะฮ์ร์ บินเหาชับ"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อะห์มัดและอัตติรมิซีย์ (2121) บันทึกผ่านสายเกาะตาดะฮ์ จากชะฮ์ร์ บินเหาชับ จากอับดุรเราะห์มาน บินฆันม์ จากอัมร์ บินคอริญะฮ์ อัตติรมิซีย์ว่าหะซันศ่อฮีห์", "ผู้แต่งว่าสายรายงานนี้มีจุดอ่อนเพราะชะฮ์ร์ บินเหาชับ ซึ่งอิบนุหะญัรว่า \"เชื่อถือได้ แต่รายงานแบบมุรสัลและผิดพลาดบ่อย\" อันนะสาอีย์บันทึกผ่านสายอิสมาอีล บินอบีคอลิด จากเกาะตาดะฮ์ จากอัมร์ บินคอริญะฮ์", "หะดีษนี้มีหลายสายและหลักฐานสนับสนุน การที่อัตติรมิซีย์ว่าศ่อฮีห์อาจเป็นเพราะหลักฐานสนับสนุนที่มีมาก เช่น หะดีษอนัส: \"ฉันอยู่ใต้อูฐของท่านรสูลุลลอฮ์ ﷺ น้ำลายของมันไหลลงบนตัวฉัน ฉันได้ยินท่านกล่าวว่า...\" (อิบนุมาญะฮ์ อัดดารุกุฏนีย์ อัลบัยฮะกีย์ อัลบูศีรีย์ว่าสายรายงานศ่อฮีห์)"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ที่มินา\" อ่านสระอิที่มีม เป็นสถานที่หนึ่งในพิธีหัจญ์ ได้ชื่อนี้เพราะเลือดของสัตว์พลีถูกหลั่งที่นั่นด้วยการเชือด", "\"ขณะที่ท่านอยู่บนพาหนะของท่าน\" เป็นประโยคบอกสภาพ พาหนะ (ราหิละฮ์) คืออูฐที่ใช้ขี่ ทั้งตัวผู้และตัวเมีย", "\"น้ำลายของมัน\" คือน้ำที่ไหลจากปาก \"บนบ่าของฉัน\" อาจเป็นบ่าเดียวหรือทั้งสองบ่า ในอีกรายงานของอะห์มัดและอัตติรมิซีย์ว่า \"ไหลระหว่างบ่าทั้งสองของฉัน\""]}, {"wajh": 4, "type": "fawaid", "heading_ar": null, "heading_th": "ผู้กล่าวคุฏบะฮ์ควรอยู่ในที่สูง", "points_th": ["ผู้กล่าวคุฏบะฮ์ควรอยู่ในที่สูง เช่น มิมบัรหรือเก้าอี้ เพราะเสียงจะได้ยินชัดกว่า สื่อสารได้ดีกว่า ผู้ฟังให้ความสำคัญมากกว่า และถามได้ง่ายกว่า"]}, {"wajh": 5, "type": "fawaid", "heading_ar": null, "heading_th": "ความใส่ใจในการเผยแผ่หุก่ม", "points_th": ["หะดีษแสดงถึงความใส่ใจของท่านนบี ﷺ ในการเผยแผ่หุก่มแก่ประชาชาติด้วยการกล่าวคุฏบะฮ์ และผู้นำของผู้ประกอบพิธีหัจญ์ควรกล่าวคุฏบะฮ์แก่พวกเขาที่มินา เพื่อสอนหุก่มพิธีที่เหลือ เช่น การขว้างเสาหิน การเชือดสัตว์พลี การโกนผม และการเฏาะวาฟ"]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "กล่าวคุฏบะฮ์บนหลังพาหนะ", "points_th": ["อนุญาตให้กล่าวคุฏบะฮ์และให้คำตักเตือนบนหลังพาหนะ เพราะมีประโยชน์ และไม่ได้ทำซ้ำหรือนานเกินไป ท่านนบี ﷺ ก็หยุดยืนที่อะเราะฟะฮ์บนพาหนะในช่วงบ่าย (อัลบุคอรีย์ มุสลิม)", "ส่วนหะดีษที่ห้ามนั้น หมายถึงกรณีที่ทำให้สัตว์ลำบาก คือขี่โดยไม่มีเหตุจำเป็น เพียงเพื่อนั่งบนหลังมันเหมือนที่นั่ง เช่นหะดีษอบูฮุร็อยเราะฮ์ (อบูดาวูด ศ่อฮีห์): \"พวกท่านอย่าใช้หลังสัตว์พาหนะเป็นมิมบัร เพราะอัลลอฮ์ทรงให้มันรับใช้พวกท่านเพื่อพาพวกท่านไปยังเมืองที่พวกท่านจะไปไม่ถึงนอกจากด้วยความยากลำบาก และทรงให้แผ่นดินแก่พวกท่าน จงทำธุระของพวกท่านบนแผ่นดิน\""]}, {"wajh": 7, "type": "fiqh", "heading_ar": null, "heading_th": "น้ำลายอูฐและของเสียจากสัตว์ที่กินเนื้อได้สะอาด", "points_th": ["หะดีษเป็นหลักฐานว่าน้ำลายอูฐสะอาด ไม่ใช่นะญิส เพราะท่านนบี ﷺ ย่อมเห็นน้ำลายไหลบนบ่าของอัมร์ บินคอริญะฮ์ แต่ไม่ได้สั่งให้ล้าง และการที่ท่านนิ่งเงียบยอมรับถือเป็นซุนนะฮ์ ถ้าสมมุติว่าท่านไม่รู้ อัลลอฮ์ทรงรู้ ถ้าเป็นนะญิส พระองค์คงไม่ปล่อยให้ท่านยอมรับ", "สัตว์เลี้ยงอื่นที่กินเนื้อได้ เช่น วัวและแพะแกะ ก็เหมือนอูฐ น้ำลาย ปัสสาวะ มูล และสิ่งที่ขับถ่ายออกมาสะอาดทั้งหมด", "หลักฐานคือหะดีษญาบิร บินสะมุเราะฮ์ (มุสลิม): \"ฉันละหมาดในคอกแพะได้ไหม\" ท่านตอบว่า \"ได้\" \"ฉันละหมาดในที่พักของอูฐได้ไหม\" ท่านตอบว่า \"ไม่ได้\" ท่านอนุญาตให้ละหมาดในคอกแพะ ทั้งที่คอกแพะย่อมมีปัสสาวะและมูล อันนะวะวีย์ระบุว่าเรื่องนี้นักวิชาการเห็นตรงกัน", "ส่วนการห้ามละหมาดในที่พักของอูฐไม่ได้เป็นเพราะนะญิส เพราะท่านนบี ﷺ อนุญาตให้ชาวอุร็อยนะฮ์ไปอยู่กับอูฐซะกาตและดื่มนมและปัสสาวะของมัน (อัลบุคอรีย์ มุสลิม) แต่เพราะตามหะดีษอัลบะรออ์ บินอาซิบ ท่านกล่าวว่า \"อย่าละหมาดในที่พักของอูฐ เพราะมันมาจากชัยฏอน...\" (อบูดาวูด อัตติรมิซีย์ อิบนุมาญะฮ์ อะห์มัด สายรายงานศ่อฮีห์)"]}, {"wajh": 8, "type": "fawaid", "heading_ar": null, "heading_th": "ความแม่นยำของเศาะหาบะฮ์", "points_th": ["หะดีษแสดงถึงความตื่นตัวของเศาะหาบะฮ์และความแม่นยำในการจดจำหะดีษ โดยเล่าแม้กระทั่งสภาพแวดล้อมขณะที่ได้ยินจากท่านนบี ﷺ"]}], "tags_th": ["อูฐ", "น้ำลาย", "สะอาด", "คุฏบะฮ์", "สัตว์ที่กินเนื้อได้"]}, {"id": "v1-h027-028", "volume": 1, "bab": "najasah", "topic_ar": "بيان كيفية إزالة المني من الثوب", "topic_th": "วิธีขจัดอสุจิออกจากเสื้อผ้า", "pages": [116, 121], "hadith": [{"no": 27, "matn_ar": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا، قَالَتْ: كَانَ رَسُولُ اللهِ ﷺ يَغْسِلُ الْمَنِيَّ، ثُمَّ يَخْرُجُ إِلَى الصَّلَاةِ فِي ذَلِكَ الثَّوْبِ، وَأَنَا أَنْظُرُ إِلَى أَثَرِ الْغَسْلِ فِيهِ. مُتَّفَقٌ عَلَيْهِ.", "translation_th": "จากอาอิชะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ เคยล้างอสุจิ แล้วออกไปละหมาดในเสื้อตัวนั้น โดยที่ฉันยังเห็นรอยล้างอยู่บนเสื้อ บันทึกโดยอัลบุคอรีย์และมุสลิม", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}, {"no": 28, "matn_ar": "وَلِمُسْلِمٍ: لَقَدْ كُنْتُ أَفْرُكُهُ مِنْ ثَوْبِ رَسُولِ اللهِ ﷺ فَرْكًا، فَيُصَلِّي فِيهِ. وَفِي لَفْظٍ لَهُ: لَقَدْ كُنْتُ أَحُكُّهُ يَابِسًا بِظُفُرِي مِنْ ثَوْبِهِ.", "translation_th": "และในรายงานของมุสลิม: แน่นอนฉันเคยขยี้มันออกจากเสื้อของท่านรสูลุลลอฮ์ ﷺ แล้วท่านก็ละหมาดในเสื้อนั้น และในอีกสำนวนของมุสลิม: แน่นอนฉันเคยขูดมันออกจากเสื้อของท่านด้วยเล็บของฉันขณะที่มันแห้ง", "grade_th": "ศ่อฮีห์ (มุสลิม)"}], "key_rulings_th": ["ผู้แต่งเห็นว่าอสุจิของมนุษย์สะอาด เป็นทัศนะที่รู้จักกันในมัซฮับหันบะลีย์และชาฟิอีย์ ส่วนหะนะฟีย์และมาลิกีย์เห็นว่าเป็นนะญิส", "แนวทางของท่านนบี ﷺ คือล้างอสุจิที่เปียก และขยี้หรือขูดอสุจิที่แห้ง", "การล้างอสุจิเป็นสุนัตเพื่อความสะอาด ไม่ใช่วาญิบ จึงไม่ขัดกับหะดีษเรื่องการขยี้", "ภรรยาควรรับใช้สามีตามธรรมเนียม เช่น ซักเสื้อผ้า ทำความสะอาดบ้าน และทำอาหาร ซึ่งเป็นการอยู่ร่วมกันที่ดี"], "vocab": [{"ar": "الْمَنِيّ", "th": "อสุจิของผู้ชาย น้ำสีขาวข้น พุ่งออกเป็นจังหวะพร้อมความใคร่ ตามด้วยความอ่อนล้า"}, {"ar": "الْمَذْي", "th": "น้ำใสเหนียว ออกเมื่อมีความใคร่หรืออวัยวะแข็งตัว เช่น ขณะเล้าโลมหรือนึกถึงการร่วมประเวณี"}, {"ar": "الْوَدْي", "th": "น้ำขาวขุ่นข้น ไม่มีกลิ่น ออกตามหลังปัสสาวะ เป็นนะญิสโดยอิจญ์มาอ์"}, {"ar": "أَفْرُكُهُ", "th": "ขยี้ด้วยมือจนหลุดร่วงออก"}, {"ar": "أَحُكُّهُ يَابِسًا", "th": "ขูดออกให้รอยหมดไปขณะที่มันแห้ง"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อุมมุลมุอ์มินีน อาอิชะฮ์ บินติอบีบักร์ อัศศิดดีก ท่านนบี ﷺ แต่งงานกับนางที่มักกะฮ์หลังเคาะดีญะฮ์เสียชีวิต ขณะนางอายุหกปี และอยู่ร่วมกันเมื่อนางอายุเก้าปี นางอยู่กับท่านเก้าปี (อัลบุคอรีย์ มุสลิม)", "นางเป็นภรรยาที่ท่านรักที่สุด ท่านกล่าวว่า \"ความประเสริฐของอาอิชะฮ์เหนือสตรีทั้งหลาย เหมือนความประเสริฐของษะรีดเหนืออาหารอื่น\" และกล่าวแก่อุมมุสะละมะฮ์ว่า \"ขอสาบานต่ออัลลอฮ์ วะห์ยูไม่เคยลงมาแก่ฉันขณะอยู่ในผ้าห่มของภรรยาคนใดในพวกเธอ นอกจากนาง\" (อัลบุคอรีย์)", "อัลลอฮ์ทรงรับวิญญาณท่านนบี ﷺ ในวันที่เป็นเวรของนาง ในบ้านของนาง ขณะที่ท่านพิงอกของนาง นางไม่มีบุตรกับท่านนบี ﷺ ตามทัศนะที่ถูกต้อง นางขอให้ท่านตั้งกุนยะฮ์ให้ ท่านกล่าวว่า \"จงใช้ชื่อลูกของพี่สาวเธอ\" นางจึงมีกุนยะฮ์ว่า อุมมุอับดิลลาฮ์", "นางมีความรู้ สติปัญญา และความเข้าใจอย่างสูง เผยแพร่ความรู้มากมายแก่ประชาชาติ เสียชีวิตที่มะดีนะฮ์ เดือนเราะมะฎอน ปี ฮ.ศ. 58"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجهما", "heading_th": "ที่มาของทั้งสองหะดีษ", "points_th": ["หะดีษแรก: อัลบุคอรีย์บันทึกในหมวดวุฎูอ์ บทล้างและขยี้อสุจิ (229) และมุสลิมในหมวดฏอฮาเราะฮ์ (289) ผ่านสายสุลัยมาน บินยะสาร สำนวนในบุลูฆเป็นของมุสลิม ในสายนี้สุลัยมานระบุชัดว่าได้ยินจากอาอิชะฮ์ (ในสายของอัลบุคอรีย์ก็เช่นกัน) จึงเป็นการตอบผู้ที่ว่าสุลัยมานไม่ได้ยินจากอาอิชะฮ์", "หะดีษที่สอง: มุสลิมบันทึก (288) ผ่านสายอัลก็อมะฮ์และอัลอัสวัด ว่า ชายคนหนึ่งพักที่บ้านอาอิชะฮ์ ตอนเช้าเขาซักเสื้อ อาอิชะฮ์กล่าวว่า \"ที่จริงท่านแค่ล้างตรงที่เห็นก็พอ ถ้าไม่เห็นก็พรมน้ำรอบ ๆ และฉันเคยขยี้มัน...\"", "สำนวนที่สอง มุสลิมบันทึก (290) ผ่านอับดุลลอฮ์ บินชิฮาบ อัลเคาลานีย์ ว่า เขาพักที่บ้านอาอิชะฮ์แล้วฝันเปียก จึงจุ่มเสื้อทั้งสองชิ้นลงน้ำ สาวใช้ไปบอกอาอิชะฮ์ นางถามว่า เธอเห็นอะไรบนเสื้อไหม เขาตอบว่า ไม่ นางกล่าวว่า \"ถ้าเธอเห็นอะไรก็ล้างมันเสีย ฉันเคยขูดมันออกจากเสื้อของท่านรสูลุลลอฮ์ ﷺ ด้วยเล็บขณะที่มันแห้ง\"", "อัลบุคอรีย์ไม่ได้บันทึกหะดีษเรื่องการขยี้ แต่ชี้ไว้ในชื่อบทตามแนวทางของท่าน นี่อาจเป็นเหตุที่อิบนุหะญัรระบุรายงานของมุสลิม"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظهما", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"เคยล้าง\" กริยาปัจจุบันหลังคำว่า \"กานะ\" บ่งว่าทำซ้ำเป็นประจำ เว้นแต่มีหลักฐานบ่งเป็นอย่างอื่น", "สิ่งที่ออกจากอวัยวะเพศชายมีสี่อย่าง (1) อสุจิ (มะนีย์) น้ำสีขาวข้น พุ่งออกเป็นจังหวะพร้อมความใคร่ ตามด้วยความอ่อนล้า เพราะความใคร่สงบลงเมื่อมันออก (2) มัซีย์ น้ำใสเหนียว ออกเมื่อมีความใคร่ เช่น ขณะเล้าโลมหรือนึกถึงการร่วมประเวณี (จะอธิบายในหะดีษเรื่องสิ่งที่ทำให้เสียวุฎูอ์) (3) วะดีย์ น้ำขาวขุ่นข้น ไม่มีกลิ่น ออกตามหลังปัสสาวะ ในฤดูหนาวมากกว่าฤดูร้อน เป็นนะญิสโดยอิจญ์มาอ์ (4) ปัสสาวะ ผู้แต่งอธิบายว่าเป็นของเหลวที่ไตกรองแยกจากเลือด เพื่อขับน้ำและเกลือแร่ส่วนเกินออกจากร่างกาย", "\"ขยี้มัน... ขยี้\" ใช้คำซ้ำ (มัศดัร) เพื่อยืนยัน และตัดความเป็นไปได้ว่าหมายถึงขยี้พร้อมล้าง จึงชัดว่าขยี้อย่างเดียว ไม่ได้ล้าง", "\"แล้วท่านก็ละหมาดในนั้น\" อักษรฟาอ์บ่งว่าต่อเนื่องกัน ไม่มีการล้างระหว่างการขยี้กับการละหมาด ในรายงานของอิบนุคุซัยมะฮ์ยังว่า นางขูดอสุจิออกจากเสื้อของท่านรสูลุลลอฮ์ ﷺ ขณะที่ท่านกำลังละหมาด", "\"ขูดมันขณะที่แห้ง\" คือขูดให้รอยหมดไปขณะที่มันแห้งไม่มีความชื้น"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "อสุจิสะอาดหรือเป็นนะญิส", "points_th": ["หะดีษเป็นหลักฐานว่าอสุจิของมนุษย์สะอาด แนวทางของท่านนบี ﷺ คือล้างที่เปียก และขยี้ที่แห้ง การขยี้ออกจากเสื้อแล้วละหมาดโดยไม่ล้าง แสดงว่ามันสะอาด นี่เป็นทัศนะที่รู้จักกันในมัซฮับหันบะลีย์และชาฟิอีย์", "หะนะฟีย์และมาลิกีย์ว่าอสุจิของมนุษย์เป็นนะญิส มาลิกีย์ว่าต้องชำระด้วยน้ำทั้งเปียกและแห้ง หะนะฟีย์ว่าที่เปียกต้องใช้น้ำ ที่แห้งขยี้ได้ หลักฐานคือหะดีษอาอิชะฮ์ที่กล่าวไป และอีกรายงานว่า \"ฉันเคยล้างญะนาบะฮ์ออกจากเสื้อของท่านรสูลุลลอฮ์ ﷺ แล้วท่านออกไปละหมาด ทั้งที่รอยน้ำยังอยู่บนเสื้อ\" พวกเขาว่าการล้างมีเพื่อนะญิสเท่านั้น และกริยาหลัง \"กานะ\" บ่งว่าทำประจำ จึงบ่งว่าต้องล้าง", "ผู้แต่งเห็นว่าคำตอบของพวกเขาต่อหะดีษเรื่องการขยี้ไม่มีน้ำหนัก เช่น อ้างว่าการขยี้ไม่ได้หมายความว่าสะอาด หรือว่าเสื้อที่อาอิชะฮ์ขยี้เป็นเสื้อนอน ไม่ใช่เสื้อละหมาด ซึ่งขัดกับความหมายตรงของตัวบทและเป็นการตีความอย่างฝืน", "พวกเขายังอ้างว่าอสุจิออกจากทางขับถ่าย และทุกสิ่งที่ออกจากทางขับถ่ายเป็นนะญิส หะนะฟีย์ยอมรับว่าตามการเทียบ (กิยาส) ที่แห้งก็ต้องล้าง แต่ละการเทียบไว้เพราะหะดีษเรื่องการขยี้", "ผู้แต่งเห็นว่าทัศนะที่มีน้ำหนักคืออสุจิสะอาด เพราะหลักฐานแข็งแรง ถ้าเป็นนะญิส การเทียบย่อมบังคับให้ต้องล้างเหมือนนะญิสอื่น เช่น เลือด ไม่ใช่แค่ขยี้ เพราะการขยี้ไม่ทำให้นะญิสหมดไปจากเสื้อ", "หะดีษเรื่องล้างกับขยี้ไม่ขัดกัน เพราะประสานได้ว่าการล้างเป็นสุนัตเพื่อความสะอาด ไม่ใช่วาญิบ การล้างไม่ได้แสดงว่าสิ่งนั้นเป็นนะญิส เพราะของสะอาดอย่างดิน โคลน หรือน้ำมันที่เปื้อนตัวหรือเสื้อก็ล้างได้ อีกทั้งไม่มีคำสั่งให้ล้างอสุจิ และการกระทำเพียงอย่างเดียวบ่งได้แค่ว่าอนุญาต", "สนับสนุนด้วยหะดีษอาอิชะฮ์ (อิบนุคุซัยมะฮ์ สายรายงานหะซัน): \"ท่านรสูลุลลอฮ์ ﷺ เคยปาดอสุจิออกจากเสื้อด้วยรากหญ้าอิซคิร แล้วละหมาดในนั้น และขูดมันออกจากเสื้อขณะที่แห้ง แล้วละหมาดในนั้น\" อิบนุลก็อยยิมว่าข้อนี้ชัดเจนว่าอสุจิสะอาด ตีความเป็นอื่นไม่ได้ และยังแสดงว่า ศาสนาให้ขจัดรอยอสุจิ ไม่ปล่อยไว้บนเสื้อ แม้ตามทัศนะที่ว่าสะอาด", "หะดีษอิบนุอับบาส: ท่านนบี ﷺ ถูกถามเรื่องอสุจิที่เปื้อนเสื้อ ท่านตอบว่า \"มันเหมือนน้ำมูกและน้ำลาย เพียงเช็ดด้วยเศษผ้าหรือหญ้าอิซคิรก็พอ\" อัดดารุกุฏนีย์และอัลบัยฮะกีย์ว่ารายงานแบบเมากูฟ (คำของอิบนุอับบาส) ถูกต้องกว่า แต่อิบนุลเญาซีย์และอัลมัจญ์ อิบนุตัยมียะฮ์ รับรายงานที่มาถึงท่านนบี ﷺ ส่วนอิบนุตัยมียะฮ์ (ผู้เป็นหลาน) แย้งไว้", "ส่วนที่อ้างว่าทุกสิ่งที่ออกจากทางขับถ่ายเป็นนะญิส ผู้แต่งว่าเป็นการเอาประเด็นที่ยังขัดแย้งมาเป็นหลักฐาน จึงรับไม่ได้ และการเทียบด้วยการออกจากทางเดียวกันก็ใช้ไม่ได้ เพราะปากเป็นทางออกของเสมหะและน้ำลายที่สะอาด และของอาเจียนที่เป็นนะญิส (ตามทัศนะของนักวิชาการส่วนใหญ่) ทวารเป็นทางออกของลมที่สะอาดและอุจจาระที่เป็นนะญิส การที่อสุจิออกทางเดียวกับปัสสาวะจึงไม่ทำให้เป็นนะญิส เพราะการสัมผัสนะญิสภายในร่างกายไม่มีผล มีผลเฉพาะภายนอก"]}, {"wajh": 5, "type": "fawaid", "heading_ar": null, "heading_th": "ความประเสริฐของอาอิชะฮ์ และการรับใช้สามี", "points_th": ["หะดีษแสดงความประเสริฐของอาอิชะฮ์ (ร.ฎ.) และการที่นางรับใช้ท่านนบี ﷺ จึงได้ข้อส่งเสริมให้ภรรยารับใช้สามี เช่น ซักเสื้อผ้า ทำความสะอาดบ้าน ทำอาหาร และสิ่งอื่นตามธรรมเนียม ซึ่งเป็นการอยู่ร่วมกันที่ดีและความเป็นคู่ชีวิตที่งดงาม"]}], "tags_th": ["อสุจิ", "นะญิส", "การขยี้", "อาอิชะฮ์", "เสื้อผ้า"]}, {"id": "v1-h029", "volume": 1, "bab": "najasah", "topic_ar": "كيفية تطهير الثوب من بول الغلام والجارية", "topic_th": "วิธีชำระเสื้อผ้าจากปัสสาวะของทารกชายและทารกหญิง", "pages": [122, 125], "hadith": [{"no": 29, "matn_ar": "عَنْ أَبِي السَّمْحِ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ النَّبِيُّ ﷺ: «يُغْسَلُ مِنْ بَوْلِ الْجَارِيَةِ، وَيُرَشُّ مِنْ بَوْلِ الْغُلَامِ». أَخْرَجَهُ أَبُو دَاوُدَ، وَالنَّسَائِيُّ، وَصَحَّحَهُ الْحَاكِمُ.", "translation_th": "จากอบุสสัมห์ (ร.ฎ.) กล่าวว่า ท่านนบี ﷺ กล่าวว่า \"ปัสสาวะของทารกหญิงให้ล้าง ส่วนปัสสาวะของทารกชายให้พรมน้ำ\" บันทึกโดยอบูดาวูดและอันนะสาอีย์ และอัลหากิมระบุว่าศ่อฮีห์", "grade_th": "หะซัน (อัลบุคอรีย์ว่าหะซัน) และมีหลักฐานสนับสนุนที่ศ่อฮีห์"}], "key_rulings_th": ["ปัสสาวะของทารกชายและทารกหญิงต่างกันที่วิธีชำระ ปัสสาวะทารกชายเพียงพรมน้ำให้ทั่วก็พอ ไม่ต้องล้างหรือบิด ส่วนปัสสาวะทารกหญิงต้องล้างเหมือนนะญิสอื่น", "การพรมน้ำใช้ได้เฉพาะทารกชายที่ยังไม่กินอาหารเป็นหลัก เมื่อกินอาหารแล้ว ปัสสาวะของเขาก็เหมือนของผู้ใหญ่", "การพรมน้ำไม่ได้แสดงว่าปัสสาวะทารกชายสะอาด มันเป็นนะญิส แต่ได้รับการผ่อนปรนในการขจัด", "อุจจาระของทารก ทั้งชายและหญิงต้องล้างเหมือนนะญิสอื่น"], "vocab": [{"ar": "الْجَارِيَة", "th": "เด็กหญิง ได้ชื่อนี้เพราะความคล่องแคล่ว ในที่นี้หมายถึงทารกหญิงที่ยังอยู่ในวัยดื่มนม"}, {"ar": "يُرَشُّ", "th": "พรมหรือราดน้ำให้ทั่วที่ปัสสาวะ ในหะดีษอื่นใช้คำว่า يُنْضَحُ"}, {"ar": "الْغُلَام", "th": "เด็กชาย ตั้งแต่เกิดจนบรรลุศาสนภาวะ ในที่นี้หมายถึงทารกชายที่ยังอยู่ในวัยดื่มนม"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อบุสสัมห์ ทาสที่ได้รับการปลดปล่อยของท่านรสูลุลลอฮ์ ﷺ และเรียกกันว่าผู้รับใช้ท่านรสูลุลลอฮ์ ﷺ ว่ากันว่าชื่อจริงคือ อิยาด เขารายงานหะดีษจากท่านนบี ﷺ เพียงหะดีษเดียว ผู้รายงานจากเขาคือ มุหิลล์ บินเคาะลีฟะฮ์ อัฏฏออีย์", "อิบนุอับดิลบัรร์กล่าวว่า มีคนเล่าว่าเขาหลงทาง และไม่มีใครรู้ว่าเขาเสียชีวิตที่ไหน"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อบูดาวูดบันทึกในหมวดฏอฮาเราะฮ์ บทปัสสาวะของเด็กที่เปื้อนเสื้อ (376) ผ่านมุหิลล์ บินเคาะลีฟะฮ์ ว่า อบุสสัมห์เล่าว่า ฉันรับใช้ท่านนบี ﷺ เมื่อท่านจะอาบน้ำ ท่านบอกว่า \"หันหลังให้ฉัน\" ฉันหันหลังและกั้นท่านไว้ ต่อมามีคนพาหะซันหรือหุสัยน์ (ร.ฎ.) มา แล้วเขาปัสสาวะบนอกของท่าน ฉันจะไปล้าง ท่านกล่าวว่า \"ปัสสาวะของทารกหญิงให้ล้าง ส่วนปัสสาวะของทารกชายให้พรมน้ำ\"", "อันนะสาอีย์บันทึกแยกเป็นสองแห่ง ครึ่งแรกในบทการกำบังขณะอาบน้ำ (224) ครึ่งหลังในบทปัสสาวะของทารกหญิง (304) นักวิชาการบางคนจึงเข้าใจว่าอบุสสัมห์มีสองหะดีษ ที่จริงเป็นหะดีษเดียวด้วยสายเดียว อันนะสาอีย์แยกไว้ ดังที่อิบนุหะญัรระบุ", "อัลหากิมบันทึกครึ่งหลังและว่าศ่อฮีห์ อัซซะฮะบีย์เห็นด้วย และอัลบัยฮะกีย์รายงานว่าอัลบุคอรีย์กล่าวว่า \"หะดีษอบุสสัมห์นี้หะซัน\"", "หลักฐานสนับสนุน: หะดีษอะลี (อบูดาวูด อัตติรมิซีย์ อิบนุมาญะฮ์ อัตติรมิซีย์ว่าหะซันศ่อฮีห์) ว่าท่านนบี ﷺ กล่าวถึงทารกที่ยังดื่มนมว่า \"ปัสสาวะทารกชายให้พรมน้ำ ปัสสาวะทารกหญิงให้ล้าง\" เกาะตาดะฮ์กล่าวว่า กรณีนี้เมื่อทั้งสองยังไม่กินอาหาร เมื่อกินอาหารแล้วให้ล้างทั้งสอง", "และหะดีษอุมมุลฟัฎล์ ลุบาบะฮ์ บินติลหาริษ (อบูดาวูด อิบนุมาญะฮ์ อะห์มัด อัลหากิมว่าศ่อฮีห์): อัลหุสัยน์ บินอะลี อยู่บนตักท่านนบี ﷺ แล้วปัสสาวะใส่ นางขอเสื้อท่านไปซัก ท่านกล่าวว่า \"ปัสสาวะของผู้หญิงเท่านั้นที่ต้องล้าง ส่วนปัสสาวะของผู้ชายให้พรมน้ำ\" อัลบัยฮะกีย์กล่าวว่า หะดีษที่แยกปัสสาวะทารกชายและหญิง เมื่อนำมารวมกันก็มีน้ำหนักแข็งแรง", "ส่วนเฉพาะทารกชาย มีหะดีษอุมมุก็อยส์ บินติมิห์ศ็อน (อัลบุคอรีย์ มุสลิม) ว่า นางพาลูกชายที่ยังไม่กินอาหารมาหาท่านนบี ﷺ ท่านอุ้มไว้บนตัก แล้วเด็กปัสสาวะบนเสื้อท่าน ท่านขอน้ำมาพรม โดยไม่ได้ล้าง ผู้แต่งชี้ว่า อัลบุคอรีย์และมุสลิมไม่ได้บันทึกหะดีษที่แยกระหว่างปัสสาวะทารกชายกับทารกหญิง แต่อัลบุคอรีย์ว่าหะดีษอบุสสัมห์หะซัน"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ญาริยะฮ์\" คือเด็กหญิง ในที่นี้หมายถึงทารกหญิงที่ยังอยู่ในวัยดื่มนม \"ฆุลาม\" คือเด็กชายตั้งแต่เกิดจนบรรลุศาสนภาวะ ในที่นี้หมายถึงทารกชายที่ยังดื่มนม ตามรายงานของอัตติรมิซีย์ในหะดีษอะลี: \"ปัสสาวะของทารกชายที่ยังดื่มนม...\"", "\"ให้พรมน้ำ\" คือเทน้ำให้ทั่วที่ปัสสาวะ ความต่างระหว่างการล้างกับการพรมคือ การล้างต้องให้น้ำท่วมแล้วไหลออก ส่วนการพรมไม่ต้องให้น้ำไหลออก เพียงให้น้ำมากพอทั่วที่ แม้ไม่ถึงขั้นไหลหรือหยดออก"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "แยกวิธีชำระปัสสาวะทารกชายและหญิง", "points_th": ["หะดีษเป็นหลักฐานว่าปัสสาวะทารกชายและหญิงต่างกัน ทั้งสองต้องใช้น้ำ แต่ต่างกันที่วิธีใช้ ปัสสาวะทารกชายเพียงพรมน้ำให้ทั่วก็พอ ไม่ต้องล้างหรือบิด ดังหะดีษอุมมุก็อยส์ในมุสลิมว่า \"ท่านขอน้ำมาพรม และไม่ได้ล้าง\" ส่วนปัสสาวะทารกหญิงต้องล้างเหมือนนะญิสอื่น"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "เงื่อนไข: ยังไม่กินอาหาร", "points_th": ["หุก่มการพรมน้ำมีเงื่อนไขว่าทารกยังไม่กินอาหาร ตามที่เกาะตาดะฮ์ผู้รายงานระบุ ในหะดีษอุมมุก็อยส์ว่า \"ยังไม่กินอาหาร\" และในรายงานของมุสลิมว่า \"ยังไม่ถึงวัยกินอาหาร\"", "\"ยังไม่กินอาหาร\" หมายความว่าอาหารยังไม่ใช่อาหารหลัก เพราะยังเล็ก อาหารหลักของเขาคือนม ไม่ว่าจะเป็นนมแม่ นมสัตว์ หรือนมผงอย่างในปัจจุบัน ไม่ได้หมายความว่าไม่มีอะไรเข้าท้องเลย เพราะทารกได้รับยา น้ำตาล และการป้อนอินทผลัม (ตะห์นีก) ตั้งแต่เกิด เมื่อกินอาหารเป็นหลักแล้ว ปัสสาวะของเขาก็เหมือนของผู้ใหญ่ แม้บางครั้งยังดื่มนมอยู่"]}, {"wajh": 6, "type": "fawaid", "heading_ar": null, "heading_th": "วิทยปัญญาของการแยก", "points_th": ["อิบนุลก็อยยิมกล่าวว่า การแยกระหว่างปัสสาวะทารกชายและหญิงเป็นความงามและวิทยปัญญาของศาสนา ด้วยสามเหตุผล (1) ผู้คนทั้งชายและหญิงอุ้มทารกชายบ่อยกว่า ปัสสาวะของเขาจึงเปื้อนบ่อย การล้างจึงลำบาก (2) ปัสสาวะทารกชายไม่ตกที่เดียว แต่กระจายไปหลายที่ การล้างทุกจุดจึงลำบาก ต่างจากทารกหญิง (3) ปัสสาวะทารกหญิงสกปรกและเหม็นกว่า เพราะเพศชายมีความร้อนและเพศหญิงมีความชื้น ความร้อนลดกลิ่นเหม็นของปัสสาวะและละลายความชื้นได้", "อิบนุมาญะฮ์เล่าจากอบุลยะมาน อัลมิศรีย์ว่า เขาถามอัชชาฟิอีย์ถึงหะดีษนี้ ทั้งที่น้ำทั้งสองก็เหมือนกัน อัชชาฟิอีย์ตอบว่า เพราะปัสสาวะทารกชายมาจากน้ำและดิน ส่วนปัสสาวะทารกหญิงมาจากเนื้อและเลือด เพราะเมื่ออัลลอฮ์ทรงสร้างอาดัม หะวาอ์ถูกสร้างจากซี่โครงสั้นของเขา อิบนุลมุลักกินว่าเป็นคำตอบที่ดีและหายาก แต่น่าแปลกที่นักวิชาการชาฟิอีย์ไม่ได้บันทึกไว้ในตำราของพวกเขา"]}, {"wajh": 7, "type": "fiqh", "heading_ar": null, "heading_th": "ปัสสาวะทารกชายเป็นนะญิส", "points_th": ["การอนุญาตให้พรมน้ำไม่ได้แสดงว่าปัสสาวะทารกชายสะอาด มันเป็นนะญิส แต่ได้รับการผ่อนปรนในการขจัด อันนะวะวีย์กล่าวว่า นักวิชาการชาฟิอีย์บางท่านรายงานว่ามีอิจญ์มาอ์ว่าเป็นนะญิส และไม่มีผู้ใดเห็นต่างนอกจากดาวูด อัซซอฮิรีย์"]}, {"wajh": 8, "type": "fiqh", "heading_ar": null, "heading_th": "อุจจาระของทารก", "points_th": ["โดยนัยของหะดีษ อุจจาระของทารกชายและหญิงเหมือนกัน ต้องล้างเหมือนนะญิสอื่น เพราะทั้งสองเท่ากันในทุกกรณี แต่ซุนนะฮ์แยกไว้เฉพาะเรื่องปัสสาวะ ส่วนอื่นคืออุจจาระจึงคงอยู่ตามหลักเดิม"]}], "tags_th": ["ปัสสาวะ", "ทารก", "การพรมน้ำ", "นะญิส", "เสื้อผ้า"]}, {"id": "v1-h030", "volume": 1, "bab": "najasah", "topic_ar": "كيفية تطهير الثوب من دم الحيض", "topic_th": "วิธีชำระเสื้อผ้าจากเลือดประจำเดือน", "pages": [126, 132], "hadith": [{"no": 30, "matn_ar": "عَنْ أَسْمَاءَ بِنْتِ أَبِي بَكْرٍ رَضِيَ اللهُ عَنْهُمَا أَنَّ النَّبِيَّ ﷺ قَالَ - فِي دَمِ الْحَيْضِ يُصِيبُ الثَّوْبَ -: «تَحُتُّهُ، ثُمَّ تَقْرُصُهُ بِالْمَاءِ، ثُمَّ تَنْضَحُهُ، ثُمَّ تُصَلِّي فِيهِ». مُتَّفَقٌ عَلَيْهِ.", "translation_th": "จากอัสมาอ์ บินติอบีบักร์ (ร.ฎ.) ว่า ท่านนบี ﷺ กล่าวเกี่ยวกับเลือดประจำเดือนที่เปื้อนเสื้อผ้าว่า \"ให้นางขูดมันออก แล้วขยี้มันด้วยน้ำ แล้วล้างมัน แล้วละหมาดในเสื้อนั้นได้\" บันทึกโดยอัลบุคอรีย์และมุสลิม", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["เลือดประจำเดือนเป็นนะญิสโดยอิจญ์มาอ์ ต้องล้างทั้งน้อยและมาก แต่ตามทัศนะที่มีน้ำหนัก เลือดเพียงเล็กน้อยได้รับการอนุโลม", "วิธีชำระนะญิสที่แห้ง: ขูดออกก่อน แล้วขยี้ด้วยน้ำ แล้วล้าง", "เลือดอื่นนอกจากเลือดประจำเดือน นักวิชาการส่วนใหญ่ว่าเป็นนะญิส อัชเชากานีย์ อัลอัลบานีย์ และอิบนุอุษัยมีนว่าสะอาด ผู้แต่งเห็นว่าควรชำระด้วยความรอบคอบ ยกเว้นเลือดจากบาดแผลที่ไหลไม่หยุด", "ผู้แต่งเห็นว่าที่ถูกต้องคือ ขจัดนะญิสด้วยสิ่งใดก็ได้ที่ขจัดได้ ไม่จำเป็นต้องเป็นน้ำ เช่น น้ำส้มสายชู หรือน้ำยาฆ่าเชื้อสมัยใหม่", "สตรีละหมาดในเสื้อผ้าที่สวมขณะมีประจำเดือนได้ เมื่อชำระแล้ว"], "vocab": [{"ar": "الْحَيْض", "th": "เลือดตามธรรมชาติที่ออกจากสตรีในช่วงเวลาที่รู้กัน เมื่อบรรลุวัยและพร้อมตั้งครรภ์"}, {"ar": "تَحُتُّهُ", "th": "ขูดหรือแซะออกด้วยปลายหินหรือไม้ เพื่อขจัดตัวเลือดออกก่อน"}, {"ar": "تَقْرُصُهُ بِالْمَاءِ", "th": "ขยี้เลือดด้วยปลายนิ้วกับน้ำ ให้มันละลายและออกจากเนื้อผ้า"}, {"ar": "تَنْضَحُهُ", "th": "ล้างมันด้วยน้ำ"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อัสมาอ์ บินติอบีบักร์ อัศศิดดีก เข้ารับอิสลามแต่เนิ่น ๆ ที่มักกะฮ์ หลังจากมีผู้เข้ารับอิสลามแล้วสิบเจ็ดคน แต่งงานกับอัซซุบัยร์ บินอัลเอาวาม และอพยพไปมะดีนะฮ์ขณะตั้งครรภ์อับดุลลอฮ์ บินอัซซุบัยร์ แล้วคลอดที่กุบาอ์ในปีที่อพยพ ตามทัศนะที่ถูกต้องที่สุด", "นางได้ฉายาว่า \"ซาตุนนิฏอกัยน์\" (เจ้าของผ้าคาดเอวสองผืน) อิบนุสะอ์ด์รายงาน (อิบนุหะญัรว่าสายรายงานศ่อฮีห์) ว่า นางเตรียมเสบียงให้ท่านนบี ﷺ ที่บ้านอบูบักร์เมื่อท่านจะอพยพ แต่ไม่มีอะไรผูกถุงเสบียงและถุงน้ำ นางจึงฉีกผ้าคาดเอวเป็นสองชิ้น ผูกถุงน้ำชิ้นหนึ่ง และถุงเสบียงอีกชิ้นหนึ่ง", "ผู้รายงานจากนางคือ อับดุลลอฮ์และอุรวะฮ์ลูกชายของนาง ฟาฏิมะฮ์ บินติลมุนซิร และคนอื่น ๆ นางมีชีวิตจนอับดุลลอฮ์ลูกชายได้เป็นเคาะลีฟะฮ์และถูกสังหารปี ฮ.ศ. 73 แล้วนางเสียชีวิตไม่นานหลังจากนั้น ฮิชาม บินอุรวะฮ์เล่าว่า นางอายุถึงร้อยปี ฟันไม่หลุดสักซี่ และสติปัญญายังดี"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกในหมวดวุฎูอ์ บทล้างเลือด (227) และในหมวดประจำเดือน บทล้างเลือดประจำเดือน (307) ชื่อบทแรกกว้างกว่าบทที่สอง ดังที่อิบนุหะญัรระบุ มุสลิมบันทึกในหมวดฏอฮาเราะฮ์ (291) ทั้งสองผ่านสายฟาฏิมะฮ์ บินติลมุนซิร จากย่า (ยาย) ของนาง คืออัสมาอ์ สำนวนเป็นของมุสลิม"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"เลือดประจำเดือน\" คือเลือดตามธรรมชาติที่สตรีมีเป็นประจำในช่วงเวลาที่รู้กัน เมื่อบรรลุวัยและพร้อมตั้งครรภ์ (จะอธิบายในบทว่าด้วยประจำเดือน)", "\"ให้นางขูดมัน\" คือขูดหรือแซะด้วยปลายหินหรือไม้ ในรายงานของอิบนุคุซัยมะฮ์ว่า \"จงขูดมัน แล้วขยี้ด้วยน้ำ\" จุดประสงค์คือขจัดตัวเลือดออก เพื่อให้ล้างด้วยน้ำได้ง่าย", "\"แล้วขยี้มันด้วยน้ำ\" คือใช้ปลายนิ้วขยี้เลือดกับน้ำ ให้มันละลาย และสิ่งที่ซึมเข้าเนื้อผ้าออกมา", "\"แล้วนัฎห์มัน\" คือล้างมันด้วยน้ำ หะดีษอาอิชะฮ์ (อัลบุคอรีย์) ระบุชัด: \"พวกเราคนหนึ่งมีประจำเดือน เมื่อหมดก็ขยี้เลือดออกจากเสื้อแล้วล้าง และพรมน้ำที่ส่วนที่เหลือ แล้วละหมาดในนั้น\" หะดีษอาอิชะฮ์จึงอธิบายหะดีษอัสมาอ์ว่า นัฎห์ในที่นี้หมายถึงการล้าง ส่วนการพรมที่ส่วนอื่นของเสื้อเป็นเพียงการพรมเพื่อความสบายใจ เพราะไม่ได้พรมตรงที่มีเลือด และการพรมตรงที่ไม่มีเลือดเป็นการป้องกันความระแวง (วัสวะสะฮ์)"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "เลือดประจำเดือนและเลือดอื่น", "points_th": ["หะดีษเป็นหลักฐานว่าเลือดประจำเดือนเป็นนะญิส ต้องล้างทั้งน้อยและมาก และเป็นนะญิสโดยอิจญ์มาอ์ เพราะท่านนบี ﷺ สั่งให้ล้างจากเสื้อก่อนละหมาด อิบนุบัฏฏ็อลว่า หะดีษอัสมาอ์เป็นหลักในการล้างนะญิสจากเสื้อผ้า และอัชชาฟิอีย์ว่า หะดีษนี้แสดงว่าเลือดประจำเดือนเป็นนะญิส และเลือดอื่นทุกชนิดก็เช่นกัน ตามทัศนะที่มีน้ำหนักจากสองทัศนะของนักวิชาการ เลือดเพียงเล็กน้อยได้รับการอนุโลม", "เลือดที่ออกจากทางอื่นนอกจากทวารทั้งสอง เช่น เลือดกำเดา เลือดจากฟัน หรือบาดแผล มีสองทัศนะ ทัศนะที่หนึ่ง: เป็นนะญิส ต้องล้าง แต่เล็กน้อยได้รับการอนุโลม เป็นทัศนะของนักวิชาการส่วนใหญ่ หลายท่านรายงานว่ามีอิจญ์มาอ์ เช่น อิบนุหัซม์ อิบนุอับดิลบัรร์ อิบนุรุชด์ อันนะวะวีย์ และอัลอัยนีย์ และอิบนุตัยมียะฮ์ยกคำของอิมามอะห์มัดว่า \"มุสลิมไม่ได้ขัดแย้งกันในเรื่องเลือด\" คือว่าเป็นนะญิส", "พวกเขายังอ้างอายะฮ์ \"จงกล่าวเถิด ฉันไม่พบในสิ่งที่ถูกวะห์ยูแก่ฉันว่าเป็นที่ต้องห้ามแก่ผู้กิน นอกจากซากสัตว์ หรือเลือดที่ไหล หรือเนื้อสุกร เพราะมันเป็นริจส์\" (อัลอันอาม: 145) ริจส์ในที่นี้หมายถึงความสกปรกตามศาสนา คือนะญิส เพราะความสกปรกทางภาษาอย่างเดียวไม่ได้หมายถึงนะญิส และถ้อยคำของศาสนาต้องตีความตามความหมายทางศาสนา", "ทัศนะที่สอง: เลือดสะอาด ยกเว้นเลือดประจำเดือน เป็นทัศนะของอัชเชากานีย์ ตามด้วยศิดดีก หะซัน คาน อัลอัลบานีย์ และอิบนุอุษัยมีน หลักฐาน (1) หลักเดิมของสิ่งต่าง ๆ คือสะอาดจนกว่าจะมีหลักฐานว่าเป็นนะญิส และไม่มีหลักฐานให้ล้างเลือดอื่นนอกจากเลือดประจำเดือน ทั้งที่จำเป็นต้องอธิบาย เพราะผู้คนบาดเจ็บหรือเลือดกำเดาออกบ่อย โดยเฉพาะเศาะหาบะฮ์ที่ออกญิฮาดและบาดเจ็บมาก", "(2) เรื่องเศาะหาบะฮ์ที่ถูกมุชริกยิงธนูสามดอกขณะยืนละหมาดกลางคืน แต่เขายังละหมาดต่อทั้งที่เลือดไหล ในสงครามซาตุรริกออ์ (อบูดาวูด อะห์มัด อัลบุคอรีย์ยกไว้แบบไม่มีสาย ในเชิงอรรถระบุว่าสายรายงานอ่อน) (3) มีรายงานจากเศาะหาบะฮ์หลายรายงานที่แสดงว่าเลือดสะอาด เช่น อิบนุมัสอูดละหมาดทั้งที่มีมูลและเลือดจากอูฐที่เขาเชือดติดอยู่บนท้อง (สายรายงานศ่อฮีห์) อิบนุอุมัรบีบสิวบนหน้าจนเลือดออก แล้วขยี้ด้วยนิ้วและละหมาดโดยไม่อาบน้ำละหมาด และอับดุลลอฮ์ บินอบีเอาฟาบ้วนน้ำลายปนเลือดแล้วละหมาด", "ผู้แต่งเห็นว่าทัศนะที่ว่าเลือดสะอาดมีน้ำหนักในการพิจารณา และอายะฮ์ที่ฝ่ายแรกอ้างถูกแย้งได้สองทาง: (1) อายะฮ์ไม่ได้มาเพื่ออธิบายความสะอาดและนะญิส แต่อธิบายสิ่งที่ห้ามกิน และสิ่งที่หะรอมไม่จำเป็นต้องเป็นนะญิส เช่น ยาพิษสะอาดแต่หะรอม (2) ริจส์ในที่นี้อาจหมายถึงสิ่งชั่วร้ายที่ห้ามกิน ไม่ใช่นะญิส เพราะริจส์บางครั้งหมายถึงความสกปรกทางนามธรรม เช่น \"จงผินหน้าออกจากพวกเขา แท้จริงพวกเขาเป็นริจส์\" (อัตเตาบะฮ์: 95)", "จึงเหลือหลักฐานอิจญ์มาอ์ หากไม่ขัดกับรายงานจากเศาะหาบะฮ์ ซึ่งมีผู้รายงานอิจญ์มาอ์ไว้มาก ข้ออ้างว่านักวิชาการลอกการรายงานอิจญ์มาอ์ต่อกันมา ถูกตอบด้วยการที่อิจญ์มาอ์นี้พาดพิงถึงอิมามอะห์มัด ซึ่งเข้มงวดในการอ้างอิจญ์มาอ์ ส่วนรายงานจากเศาะหาบะฮ์อาจหมายถึงเลือดเพียงเล็กน้อยที่ได้รับการอนุโลม", "ผู้แต่งจึงสรุปว่า ทัศนะที่มีน้ำหนักคือให้ชำระเลือด เพราะเป็นความรอบคอบ ปลดภาระให้พ้น และระวังสิ่งคลุมเครือ \"ผู้ใดระวังสิ่งคลุมเครือ เขาได้รักษาศาสนาและเกียรติของเขาไว้\" ยกเว้นเลือดจากบาดแผลที่ไหลไม่หยุด เพราะหลีกเลี่ยงได้ยาก"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "ขั้นตอนชำระนะญิสที่แห้ง", "points_th": ["หะดีษเป็นหลักฐานว่าต้องทำความสะอาดเสื้อจากเลือดประจำเดือน โดยขูดเลือดแห้งด้วยเล็บ ไม้ หิน หรือสิ่งอื่น ให้ตัวเลือดหลุดออก แล้วขยี้ด้วยน้ำ แล้วล้างเพื่อให้นะญิสที่เหลือหมดไป การทำตามลำดับนี้เป็นวิธีที่ดีที่สุดในการขจัดนะญิสที่แห้ง"]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "ละหมาดในเสื้อผ้าที่สวมขณะมีประจำเดือน", "points_th": ["หะดีษแสดงว่าสตรีละหมาดในเสื้อผ้าที่สวมขณะมีประจำเดือนได้ เมื่อชำระแล้ว เพราะคำว่า \"แล้วละหมาดในนั้น\" ซึ่งบ่งว่าจะไม่ละหมาดในเสื้อผ้าที่เป็นนะญิส แต่ละหมาดในเสื้อผ้าที่สะอาด เป็นหลักฐานที่แข็งแรงที่สุดข้อหนึ่งว่า ต้องชำระเสื้อผ้าก่อนละหมาด"]}, {"wajh": 7, "type": "fiqh", "heading_ar": null, "heading_th": "ขจัดนะญิสด้วยสิ่งอื่นนอกจากน้ำ", "points_th": ["ผู้ที่เห็นว่าการขจัดนะญิสต้องใช้น้ำ และของเหลวอื่นใช้แทนไม่ได้ อ้างหะดีษนี้ เป็นทัศนะของชาฟิอีย์ มาลิกีย์ และทัศนะที่มีน้ำหนักในมัซฮับหันบะลีย์", "ผู้แต่งเห็นว่าที่ถูกต้องคือ ขจัดนะญิสด้วยสิ่งใดก็ได้ที่ขจัดได้ ทั้งน้ำและสิ่งอื่น เช่น น้ำส้มสายชู น้ำกุหลาบ เป็นทัศนะของหะนะฟีย์ อิบนุตัยมียะฮ์เลือกและปกป้องทัศนะนี้ เพราะเป้าหมายคือขจัดนะญิส และสิ่งอื่นก็ทำได้เช่นเดียวกับน้ำ", "ศาสนาเองก็ให้ใช้สิ่งอื่นนอกจากน้ำชำระนะญิส เช่นหะดีษอบูสะอีด: \"เมื่อผู้ใดในพวกท่านมาที่
