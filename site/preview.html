หากิม หะซัน)", "ผู้แต่งเตือนว่า มุสลิมควรฝึกตัวเองให้ประหยัดน้ำ และระวังการฟุ่มเฟือยที่หลายคนเป็นอยู่ทุกวันนี้ เพราะใช้ก๊อกน้ำในการอาบน้ำละหมาด เพื่อฝึกความพอดี ควรใช้ภาชนะใส่น้ำอาบน้ำละหมาด จะได้ไม่ฟุ่มเฟือย"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "การถูอวัยวะ: สุนัตหรือวาญิบ", "points_th": ["หะดีษแสดงว่าศาสนาให้ถูอวัยวะขณะอาบน้ำละหมาด นักวิชาการส่วนใหญ่ว่าเป็นสุนัต ไม่ใช่วาญิบ ต่างจากมาลิกีย์ (ที่ว่าวาญิบ) เพราะอัลลอฮ์สั่งให้ล้างในอายะฮ์วุฎูอ์ และการล้างไม่จำเป็นต้องลูบมือ ตามที่นักภาษากลุ่มหนึ่งระบุ เพราะการล้างคือให้น้ำไหลผ่านอวัยวะ จึงไม่มีเหตุผลให้เป็นเงื่อนไข เพราะเป็นสิ่งที่เพิ่มจากความหมายตรงของอัลกุรอานและความหมายทางภาษาของคำว่าล้าง", "แต่ถ้าการอาบน้ำละหมาดจะครบได้ก็ต่อเมื่อถู เช่น น้ำน้อย ก็ต้องลูบมือบนอวัยวะ ตามหลักสิ่งที่วาญิบจะสมบูรณ์ไม่ได้ถ้าขาด ก็เป็นวาญิบด้วย หะดีษนี้ตีความได้เช่นนั้น เพราะการอาบน้ำละหมาดด้วยน้ำสองในสามมุดด์จะครบไม่ได้ถ้าไม่ถู ถ้าการถูไม่ได้ทำให้วาญิบครบ ก็เป็นสุนัต"]}], "tags_th": ["ถูอวัยวะ", "ประหยัดน้ำ", "ฟุ่มเฟือย", "วุฎูอ์", "มุดด์"]}, {"id": "v1-h042", "volume": 1, "bab": "wudu", "topic_ar": "مشروعية أخذ ماء جديد للرأس", "topic_th": "การตักน้ำใหม่สำหรับเช็ดศีรษะ", "pages": [188, 191], "hadith": [{"no": 42, "matn_ar": "عَنْ عَبْدِ اللهِ بْنِ زَيْدٍ رَضِيَ اللهُ عَنْهُ: أَنَّهُ رَأَى النَّبِيَّ ﷺ يَأْخُذُ لِأُذُنَيْهِ مَاءً خِلَافَ الْمَاءِ الَّذِي أَخَذَ لِرَأْسِهِ. أَخْرَجَهُ الْبَيْهَقِيُّ. وَهُوَ عِنْدَ مُسْلِمٍ مِنْ هَذَا الْوَجْهِ بِلَفْظِ: وَمَسَحَ بِرَأْسِهِ بِمَاءٍ غَيْرِ فَضْلِ يَدَيْهِ، وَهُوَ الْمَحْفُوظُ.", "translation_th": "จากอับดุลลอฮ์ บินซัยด์ (ร.ฎ.) ว่า เขาเห็นท่านนบี ﷺ ตักน้ำสำหรับหูทั้งสอง ต่างจากน้ำที่ท่านตักสำหรับศีรษะ บันทึกโดยอัลบัยฮะกีย์ และในรายงานของมุสลิมจากสายเดียวกัน สำนวนว่า และท่านเช็ดศีรษะด้วยน้ำที่ไม่ใช่น้ำที่เหลือจากมือทั้งสอง และสำนวนนี้คือสำนวนที่ถูกต้อง (มะห์ฟูซ)", "grade_th": "สำนวนของมุสลิมคือมะห์ฟูซ (ถูกต้อง) สำนวนของอัลบัยฮะกีย์เป็นชาซ"}], "key_rulings_th": ["ศีรษะเช็ดด้วยน้ำใหม่ ไม่ใช่น้ำที่เหลือจากการล้างมือ เพราะมือกับศีรษะเป็นคนละอวัยวะ ตามทัศนะของนักวิชาการส่วนใหญ่ และผู้แต่งเห็นว่ามีน้ำหนัก", "หูเช็ดด้วยน้ำที่เหลือจากการเช็ดศีรษะ ไม่ต้องตักน้ำใหม่ เพราะหูเป็นส่วนของศีรษะ แต่ถ้าผมหนาจนมือแห้ง ตักน้ำใหม่ให้หูก็ไม่เป็นไร", "วิธีตักน้ำเช็ดศีรษะที่มีในซุนนะฮ์: ตักน้ำหนึ่งกำมือด้วยมือขวา สะบัด แล้วเช็ดด้วยน้ำที่เหลือ หรือตักหนึ่งกอบแล้วรับด้วยมือซ้ายวางกลางศีรษะ", "เช็ดศีรษะด้วยวิธีใดก็ใช้ได้ แต่ทำตามแบบอย่างท่านนบี ﷺ ดีกว่า"], "vocab": [{"ar": "فَضْلِ يَدَيْهِ", "th": "น้ำที่เหลือติดมือทั้งสองหลังจากล้างแขน"}, {"ar": "الْمَحْفُوظ", "th": "มะห์ฟูซ (ศัพท์หะดีษ) คือรายงานของผู้ที่น่าเชื่อถือกว่าซึ่งขัดกับรายงานของผู้เชื่อถือได้ คู่ตรงข้ามของชาซ"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["หะดีษนี้มีสองรายงาน รายงานแรก อัลบัยฮะกีย์บันทึกในสุนันของเขา ผ่านอัลฮัยษัม บินคอริญะฮ์ จากอับดุลลอฮ์ บินวะฮ์บ จากอัมร์ บินอัลหาริษ จากหิบบาน บินวาสิอ์ อัลอันศอรีย์ ว่าบิดาของเขาเล่าว่าได้ยินอับดุลลอฮ์ บินซัยด์... และกล่าวว่า \"สายรายงานนี้ศ่อฮีห์\"", "รายงานที่สอง มุสลิมบันทึก (236) ผ่านฮารูน บินมะอ์รูฟ ฮารูน บินสะอีด อัลอัยลีย์ และอบุฏฏอฮิร จากอิบนุวะฮ์บ อิบนุหะญัรว่า \"นี่คือมะห์ฟูซ\" มะห์ฟูซในศัพท์ของนักหะดีษคือคู่ตรงข้ามของชาซ คือสิ่งที่ผู้น่าเชื่อถือกว่ารายงานขัดกับรายงานของผู้เชื่อถือได้ ส่วนชาซคือสิ่งที่ผู้ที่รับได้รายงานขัดกับผู้ที่เหนือกว่า", "รายงานของอัลบัยฮะกีย์จึงเป็นชาซ เพราะอัลฮัยษัม บินคอริญะฮ์แม้เชื่อถือได้ แต่รายงานขัดกับผู้ที่มากกว่า คือกลุ่มที่รายงานจากอิบนุวะฮ์บว่า \"เช็ดศีรษะด้วยน้ำที่ไม่ใช่น้ำที่เหลือจากมือ\" รายงานนี้จึงไม่ศ่อฮีห์ แม้ผู้รายงานเชื่อถือได้ เพราะไม่ปลอดจากความเป็นชาซ ซึ่งเป็นเงื่อนไขของหะดีษศ่อฮีห์ และอัลบัยฮะกีย์เองก็ยกสำนวนของมุสลิมไว้และกล่าวว่า \"นี่ถูกต้องกว่าอันก่อน\""]}, {"wajh": 2, "type": "fiqh", "heading_ar": null, "heading_th": "หูเช็ดด้วยน้ำที่เหลือจากศีรษะ", "points_th": ["หะดีษเป็นหลักฐานว่าการเช็ดหูใช้น้ำที่เหลือจากการเช็ดศีรษะ ไม่ต้องตักน้ำใหม่ เพราะหูเป็นส่วนของศีรษะ และผู้ที่อธิบายการอาบน้ำละหมาดของท่านนบี ﷺ ไม่ได้กล่าวว่าท่านตักน้ำใหม่สำหรับหู อิบนุลก็อยยิมกล่าวว่า \"ไม่มีรายงานที่ถูกต้องว่าท่านตักน้ำใหม่สำหรับหู\"", "อิบนุลมุนซิรพาดพิงถึงมาลิก อัชชาฟิอีย์ และอะห์มัดว่า เห็นให้ผู้อาบน้ำละหมาดตักน้ำใหม่สำหรับหู แล้วกล่าวว่า \"แต่ไม่มีในรายงานที่ถูกต้องซึ่งอธิบายการอาบน้ำละหมาดของท่านรสูลุลลอฮ์ ﷺ ว่าท่านตักน้ำใหม่สำหรับหู\"", "แต่ถ้าสมมุติว่าผมหนา และใช้น้ำในมือหมดจนมือแห้ง ก็ไม่เป็นไรที่จะตักน้ำใหม่สำหรับหู ถ้ามือยังเปียกอยู่ก็เพียงพอสำหรับเช็ดหู"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "ศีรษะเช็ดด้วยน้ำใหม่", "points_th": ["การเช็ดศีรษะกล่าวไปแล้วในหะดีษอุษมานต้นบท อิบนุหะญัรยกหะดีษนี้ เพราะแสดงว่าศาสนาให้ตักน้ำใหม่สำหรับศีรษะ จึงเป็นหลักฐานว่าศีรษะเช็ดด้วยน้ำใหม่ ไม่ใช่น้ำที่เหลือจากมือ เพราะมือเป็นอวัยวะหนึ่ง และศีรษะเป็นอีกอวัยวะหนึ่ง นี่คือทัศนะของนักวิชาการส่วนใหญ่", "ในหะดีษอับดุลลอฮ์ บินซัยด์ที่อธิบายการอาบน้ำละหมาดของท่านนบี ﷺ: \"แล้วท่านสอดมือลงในภาชนะ แล้วเช็ดศีรษะ\" (อัลบุคอรีย์) อัตติรมิซีย์กล่าวหลังหะดีษนี้ว่า \"นักวิชาการส่วนใหญ่ปฏิบัติตามนี้ คือเห็นให้ตักน้ำใหม่สำหรับศีรษะ\" ในหะดีษหุมรอนจากอุษมาน: \"แล้วท่านสอดมือตักน้ำแล้วเช็ดศีรษะ\" (อบูดาวูด) และในหะดีษอะลี: \"แล้วท่านเอามือใส่ในภาชนะแล้วเช็ดศีรษะครั้งเดียว\"", "นักวิชาการบางท่านเห็นว่าเช็ดศีรษะด้วยน้ำที่เหลือจากอวัยวะก่อนหน้าได้ บางท่านว่าด้วยน้ำที่เหลือจากมือ อิบนุลมุนซิรพาดพิงถึงอัลหะซัน อุรวะฮ์ และอัลเอาซาอีย์ บางท่านว่าเช็ดด้วยน้ำที่เปียกเครา เป็นทัศนะของมาลิกีย์บางท่าน ตามที่อิบนุลอะเราะบีย์และอิบนุอับดิลบัรร์ระบุ พวกเขาอาจอ้างหะดีษอัรรุบัยยิอ์: \"และท่านเช็ดศีรษะด้วยน้ำที่เหลืออยู่ในมือ\" และเพราะการเช็ดตั้งอยู่บนการผ่อนปรน", "ผู้แต่งเห็นว่าทัศนะแรกมีน้ำหนักกว่า เพราะหลักฐานแข็งแรง หะดีษอับดุลลอฮ์ บินซัยด์และหะดีษอื่นที่กล่าวมาเป็นหลักฐานแก่ผู้ที่เห็นต่าง เว้นแต่จะตีความว่าการกระทำของท่านนบี ﷺ ไม่ใช่การอธิบายอายะฮ์ที่กล่าวกว้าง ๆ แต่เป็นสุนัต ทว่าที่ชัดคือการกระทำของท่านเป็นการอธิบายวิธีเช็ดศีรษะที่อายะฮ์กล่าวไว้กว้าง ๆ", "ส่วนหะดีษอัรรุบัยยิอ์ สายรายงานถูกวิจารณ์ และตัวบทสับสน เพราะมาจากอับดุลลอฮ์ บินมุหัมมัด บินอะกีล (กล่าวไปแล้ว) ส่วนความสับสนของตัวบท อิบนุมาญะฮ์บันทึกผ่านชะรีก จากอิบนุอะกีล จากอัรรุบัยยิอ์ว่า \"และท่านตักน้ำใหม่แล้วเช็ดศีรษะ\" รายงานของมุสลิมจึงต้องมาก่อนเมื่อขัดกัน"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "วิธีตักน้ำเช็ดศีรษะ", "points_th": ["วิธีที่หนึ่ง: ตามหะดีษอิบนุอับบาส \"พวกท่านอยากเห็นไหมว่าท่านรสูลุลลอฮ์ ﷺ อาบน้ำละหมาดอย่างไร...\" จนถึง \"แล้วท่านกำน้ำหนึ่งกำมือ แล้วสะบัดมือ แล้วเช็ดศีรษะและหูด้วยมัน\" (อบูดาวูด สายรายงานหะซัน) คือตักน้ำหนึ่งกำมือด้วยมือขวา สะบัด แล้วเช็ดศีรษะด้วยน้ำที่เหลือ", "วิธีที่สอง: ตักน้ำหนึ่งกอบด้วยมือขวา แล้วรับด้วยมือซ้าย วางลงบนศีรษะโดยไม่สะบัดมือ หลักฐานคือมุอาวิยะฮ์ (ร.ฎ.) อาบน้ำละหมาดให้ผู้คนดูตามที่เห็นท่านรสูลุลลอฮ์ ﷺ อาบ เมื่อถึงศีรษะ เขาตักน้ำหนึ่งกอบ รับด้วยมือซ้าย วางกลางศีรษะจนน้ำหยดหรือเกือบหยด แล้วเช็ดจากหน้าไปหลัง และจากหลังมาหน้า (อบูดาวูด อัลอัลบานีย์ว่าสายรายงานศ่อฮีห์)", "วิธีที่สาม ที่คนส่วนใหญ่ทำ คือตักน้ำหนึ่งกอบด้วยมือขวา แล้วรับด้วยมือซ้าย สะบัดเบา ๆ แล้วเช็ดด้วยสองมือพร้อมกัน ผู้แต่งไม่พบหลักฐานของวิธีนี้ แต่ที่ชัดคือใช้ได้ เพราะอัลลอฮ์สั่งให้เช็ดศีรษะ และผู้นี้ก็เช็ดศีรษะด้วยมือแล้ว จึงใช้ได้ แต่การทำตามที่มีรายงานและตามแบบอย่างท่านนบี ﷺ ดีกว่า"]}], "tags_th": ["เช็ดศีรษะ", "น้ำใหม่", "เช็ดหู", "วุฎูอ์", "ชาซ"]}, {"id": "v1-h043", "volume": 1, "bab": "wudu", "topic_ar": "بيان فضيلة الوضوء وثوابه", "topic_th": "ความประเสริฐและผลบุญของการอาบน้ำละหมาด", "pages": [192, 199], "hadith": [{"no": 43, "matn_ar": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: سَمِعْتُ رَسُولَ اللهِ ﷺ يَقُولُ: «إِنَّ أُمَّتِي يَأْتُونَ يَوْمَ الْقِيَامَةِ غُرًّا مُحَجَّلِينَ، مِنْ أَثَرِ الْوُضُوءِ، فَمَنِ اسْتَطَاعَ مِنْكُمْ أَنْ يُطِيلَ غُرَّتَهُ فَلْيَفْعَلْ». مُتَّفَقٌ عَلَيْهِ، وَاللَّفْظُ لِمُسْلِمٍ.", "translation_th": "จากอบูฮุร็อยเราะฮ์ (ร.ฎ.) กล่าวว่า ฉันได้ยินท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"แท้จริงประชาชาติของฉันจะมาในวันกิยามะฮ์ ด้วยใบหน้า มือ และเท้าที่ขาวผ่อง จากร่องรอยของการอาบน้ำละหมาด ดังนั้นผู้ใดในพวกท่านสามารถทำให้ความขาวผ่องของเขายาวขึ้น ก็จงทำเถิด\" บันทึกโดยอัลบุคอรีย์และมุสลิม สำนวนเป็นของมุสลิม", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม) แต่ประโยค \"ผู้ใดสามารถ...\" เป็นคำของอบูฮุร็อยเราะฮ์ที่แทรกเข้ามา (มุดร็อจ) ตามทัศนะที่มีน้ำหนัก"}], "key_rulings_th": ["การอาบน้ำละหมาดมีความประเสริฐและผลบุญยิ่งใหญ่ ทำให้ประชาชาตินี้เป็นที่รู้จักในวันกิยามะฮ์ด้วยใบหน้า มือ และเท้าที่ขาวผ่อง", "ประโยค \"ผู้ใดสามารถทำให้ความขาวผ่องยาวขึ้น...\" เป็นคำของอบูฮุร็อยเราะฮ์ ไม่ใช่คำของท่านนบี ﷺ ตามที่อัลมุนซิรีย์ อิบนุตัยมียะฮ์ อิบนุลก็อยยิม อิบนุหะญัร และอิบนุบาซเห็น", "ผู้แต่งเห็นว่าที่ถูกต้องคือไม่ล้างเกินขอบเขตของฟัรฎู เว้นแต่เพื่อให้ทั่วที่ฟัรฎู เช่น ล้างเลยขึ้นไปที่ต้นแขนและหน้าแข้งเล็กน้อยให้ข้อศอกและตาตุ่มรวมอยู่ด้วย", "ผู้แต่งเห็นว่าวุฎูอ์ไม่ใช่ลักษณะเฉพาะของประชาชาตินี้ ประชาชาติก่อนก็มีวุฎูอ์ แต่ที่เฉพาะคือความขาวผ่องที่เป็นเครื่องหมายในวันกิยามะฮ์"], "vocab": [{"ar": "غُرًّا", "th": "ใบหน้าขาวผ่อง มาจาก الْغُرَّة คือจุดขาวบนหน้าม้า"}, {"ar": "مُحَجَّلِين", "th": "มือและเท้าขาวผ่อง มาจาก التَّحْجِيل คือสีขาวที่ขาม้า"}, {"ar": "يَوْمَ الْقِيَامَةِ", "th": "วันที่มนุษย์ลุกขึ้นจากหลุมศพเพื่อการสอบสวนและตอบแทน มีชื่อเรียกหลายชื่อในอัลกุรอานเพราะความยิ่งใหญ่ของมัน"}, {"ar": "الْحِلْيَة", "th": "เครื่องประดับของผู้ศรัทธาในสวรรค์ เช่น ทองคำ"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกในหมวดวุฎูอ์ บทความประเสริฐของวุฎูอ์ (136) และมุสลิมในหมวดฏอฮาเราะฮ์ (246) ผ่านนุอัยม์ บินอับดิลลาฮ์ อัลมุจญ์มิร จากอบูฮุร็อยเราะฮ์ สำนวนเป็นของมุสลิมตามที่อิบนุหะญัรระบุ ของอัลบุคอรีย์คือ \"แท้จริงประชาชาติของฉันจะถูกเรียกในวันกิยามะฮ์...\"", "ในอีกสำนวนของมุสลิม นุอัยม์เล่าว่า เขาเห็นอบูฮุร็อยเราะฮ์อาบน้ำละหมาด ล้างหน้าให้ทั่ว ล้างมือจนขึ้นไปถึงต้นแขน ล้างเท้าจนขึ้นไปถึงหน้าแข้ง แล้วกล่าวว่า อย่างนี้แหละที่ฉันเห็นท่านรสูลุลลอฮ์ ﷺ อาบน้ำละหมาด และท่านกล่าวว่า \"พวกท่านคือผู้ขาวผ่องในวันกิยามะฮ์จากการอาบน้ำละหมาดให้ทั่ว ผู้ใดในพวกท่านสามารถก็จงทำให้ความขาวผ่องยาวขึ้น\"", "ประโยค \"ผู้ใดสามารถ...\" เป็นคำของอบูฮุร็อยเราะฮ์ที่แทรกเข้ามา เป็นความเข้าใจของเขาจากคำว่า \"ขาวผ่อง\" แล้วผู้รายงานจากเขา คือนุอัยม์ ใส่ไว้ในหะดีษ อิบนุหะญัรกล่าวว่า \"ฉันไม่เห็นประโยคนี้ในรายงานของเศาะหาบะฮ์คนอื่นที่รายงานหะดีษนี้ ซึ่งมีสิบคน และไม่เห็นในรายงานของผู้อื่นที่รายงานจากอบูฮุร็อยเราะฮ์ นอกจากรายงานของนุอัยม์นี้\"", "อะห์มัดบันทึกผ่านลัยษ์ บินอบีสุลัยม์ จากกะอ์บ อัลมะดะนีย์ จากอบูฮุร็อยเราะฮ์ โดยมีคำนี้ตอนท้าย สายรายงานอ่อน เพราะลัยษ์อ่อนเพราะความจำสับสน และกะอ์บไม่เป็นที่รู้จัก จึงมีสองคนที่รายงานคำนี้จากอบูฮุร็อยเราะฮ์ และอิบนุหะญัรไม่ได้สังเกตรายงานของกะอ์บ อะห์มัดยังบันทึกผ่านฟุลัยห์ บินสุลัยมาน จากนุอัยม์ โดยนุอัยม์กล่าวเพิ่มว่า \"ฉันไม่รู้ว่า ผู้ใดสามารถ... เป็นคำของท่านรสูลุลลอฮ์ ﷺ หรือของอบูฮุร็อยเราะฮ์\"", "นักหะดีษผู้เชี่ยวชาญหลายท่าน เช่น อัลมุนซิรีย์ อิบนุตัยมียะฮ์ อิบนุลก็อยยิม อิบนุหะญัร และอิบนุบาซ เห็นว่าคำนี้แทรกเข้ามา เป็นคำของอบูฮุร็อยเราะฮ์ ด้วยเหตุผล (1) เศาะหาบะฮ์หลายคน เช่น อิบนุมัสอูด ญาบิร อบูสะอีด อบูอุมามะฮ์ และหุซัยฟะฮ์ รายงานหะดีษนี้โดยไม่มีคำนี้ (2) การทำให้ความขาวผ่องยาวขึ้นทำไม่ได้ เพราะหน้าเป็นอวัยวะหนึ่ง ศีรษะเป็นอีกอวัยวะหนึ่ง ถ้าล้างเลยไปก็โดนศีรษะ ซึ่งฟัรฎูคือการเช็ด", "(3) ไม่มีรายงานว่าท่านนบี ﷺ ทำให้ความขาวผ่องยาวขึ้น ท่านล้างแขนจนขึ้นไปถึงต้นแขน และล้างเท้าจนขึ้นไปถึงหน้าแข้ง เพื่อให้ข้อศอกและตาตุ่มรวมอยู่ด้วย ไม่มีรายงานว่าท่านทำเกินกว่านั้น (4) มุสลิมบันทึกจากอบูหาซิมว่า เขาอยู่หลังอบูฮุร็อยเราะฮ์ที่กำลังอาบน้ำละหมาด ซึ่งล้างมือจนถึงรักแร้ เขาถามว่า นี่วุฎูอ์อะไร อบูฮุร็อยเราะฮ์ตอบว่า \"โอ้บนีฟัรรูค พวกท่านอยู่ที่นี่หรือ ถ้าฉันรู้ว่าพวกท่านอยู่ที่นี่ ฉันคงไม่อาบน้ำละหมาดแบบนี้ ฉันได้ยินคนรักของฉัน ﷺ กล่าวว่า เครื่องประดับของผู้ศรัทธาจะไปถึงที่ที่วุฎูอ์ไปถึง\" ในที่นี้ไม่มีประโยค \"ผู้ใดสามารถ\" ถ้าเป็นคำของท่านนบี ﷺ อบูฮุร็อยเราะฮ์คงยกมาอ้างกับอบูหาซิม แทนที่จะต้องอนุมานเอง และการอนุมานแม้ถูกต้อง ก็ไม่มีน้ำหนักเท่าตัวบท"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ประชาชาติของฉัน\" หมายถึงผู้ที่ศรัทธาและปฏิบัติตามท่าน เพราะพวกเขาคือผู้ที่ร่องรอยของวุฎูอ์ปรากฏ", "\"จะมา\" เป็นรายงานของมุสลิม ของอัลบุคอรีย์ว่า \"จะถูกเรียก\" สำนวนแรกอาจเป็นผลของสำนวนที่สอง คือถูกเรียกแล้วจึงมา ความหมายคือ ถูกเรียกไปยังที่สอบสวน ตาชั่ง หรือที่อื่น ๆ ในวันกิยามะฮ์ คือพวกเขาถูกเรียกในวันกิยามะฮ์จากท่ามกลางประชาชาติทั้งหลาย โดยใบหน้า มือ และเท้าเปล่งแสงและขาวผ่อง จากร่องรอยวุฎูอ์ที่พวกเขาทำในดุนยาเพื่อเคารพภักดีต่ออัลลอฮ์และให้เกียรติการละหมาด", "\"วันกิยามะฮ์\" คือวันที่มนุษย์ลุกขึ้นจากหลุมศพเพื่อการสอบสวนและตอบแทน มีชื่อเรียกหลายชื่อ คือวันกิยามะฮ์ซึ่งมีในอัลกุรอานราวเจ็ดสิบอายะฮ์ วันสุดท้าย วันที่ใกล้เข้ามา วันรวมพล วันขาดทุน อัลกอริอะฮ์ วันตัดสิน และอื่น ๆ สิ่งใดที่ยิ่งใหญ่ ชาวอาหรับจะมีหลายชื่อเรียก", "\"ขาวผ่อง\" (ฆุรร็อน) พหูพจน์ของ \"อะฆ็อรร์\" ฆุรเราะฮ์คือจุดขาวบนหน้าม้า ความหมายคือ ประชาชาติของมุหัมมัด ﷺ จะมาในวันกิยามะฮ์ด้วยใบหน้าที่เปล่งประกายขาวผ่องจากร่องรอยวุฎูอ์ ขออัลลอฮ์ประทานความจำเริญของวันนั้นแก่เรา", "\"มุหัจญะลีน\" ตะห์จีลคือสีขาวที่ขาม้าทั้งสี่ บางท่านว่าที่ขาสามขา ความหมายคือ มือและเท้าของพวกเขามีความขาวและแสงสว่างจากร่องรอยวุฎูอ์ ท่านนบี ﷺ ครอบคลุมอวัยวะวุฎูอ์ทั้งหมดด้วยการกล่าวถึงฆุรเราะฮ์และตะห์จีล ฆุรเราะฮ์คือความขาวที่ใบหน้า ตะห์จีลคือความขาวที่มือและเท้า และศีรษะรวมอยู่ในความหมายของฆุรเราะฮ์", "\"จากร่องรอยของวุฎูอ์\" คำว่า \"จาก\" บอกเหตุผล ร่องรอย (เอกพจน์) ตามรายงานของมุสลิม อีกรายงานว่า \"จากร่องรอยทั้งหลาย\" ซึ่งเป็นรายงานของอัลบุคอรีย์ ร่องรอยคือสิ่งที่เกิดตามมา", "\"ผู้ใดในพวกท่านสามารถทำให้ยาวขึ้น\" คือผู้ใดสามารถเพิ่มความขาวผ่องก็จงทำ ในสำนวนของมุสลิม \"ก็จงทำให้ความขาวผ่องและความขาวที่มือเท้ายาวขึ้น\" ในสำนวนในบทนี้ระบุเฉพาะฆุรเราะฮ์ เพราะสื่อถึงอีกอย่างด้วย"]}, {"wajh": 3, "type": "fawaid", "heading_ar": null, "heading_th": "ความประเสริฐของวุฎูอ์", "points_th": ["หะดีษแสดงความประเสริฐของวุฎูอ์และผลบุญที่ยิ่งใหญ่ และเป็นเหตุให้ประชาชาตินี้เป็นที่รู้จักท่ามกลางประชาชาติทั้งหลายในวันกิยามะฮ์ ด้วยความขาวผ่องของใบหน้า มือ และเท้า", "หะดีษอบูฮุร็อยเราะฮ์ที่กล่าวมาว่า ฉันได้ยินคนรักของฉัน ﷺ กล่าวว่า \"เครื่องประดับของผู้ศรัทธาจะไปถึงที่ที่วุฎูอ์ไปถึง\" หมายถึงเครื่องประดับของผู้ศรัทธาในสวรรค์ ทั้งทองคำและอื่น ๆ"]}, {"wajh": 4, "type": "fawaid", "heading_ar": null, "heading_th": "วุฎูอ์เป็นลักษณะเฉพาะของประชาชาตินี้หรือไม่", "points_th": ["นักวิชาการบางท่านใช้หะดีษนี้เป็นหลักฐานว่าวุฎูอ์เป็นลักษณะเฉพาะของประชาชาตินี้ อิบนุหะญัรพาดพิงทัศนะนี้ถึงอัลหะลีมีย์ นักหะดีษและนักนิติศาสตร์ชาฟิอีย์ เพราะท่านนบี ﷺ ระบุความขาวผ่องเฉพาะประชาชาตินี้ ถ้าคนอื่นมีวุฎูอ์ ก็คงได้สิ่งที่ประชาชาตินี้ได้", "ทัศนะที่สอง: วุฎูอ์ไม่ใช่ลักษณะเฉพาะของประชาชาตินี้ คนก่อนหน้าก็มีวุฎูอ์ แต่ที่เฉพาะคือความขาวผ่อง หลักฐานคือหะดีษอบูฮุร็อยเราะฮ์เรื่องสาเราะฮ์ ภรรยาของอิบรอฮีม อัลเคาะลีล เมื่อผู้ปกครองทรราชเรียกตัวนาง นางลุกขึ้นอาบน้ำละหมาดและละหมาด แล้วกล่าวว่า \"โอ้อัลลอฮ์ หากฉันศรัทธาต่อพระองค์และรสูลของพระองค์... ขออย่าให้ผู้ปฏิเสธศรัทธามีอำนาจเหนือฉัน\" (อัลบุคอรีย์) ซึ่งบอกชัดว่ามีการอาบน้ำละหมาดก่อนประชาชาตินี้ และหะดีษอบูฮุร็อยเราะฮ์เรื่องญุร็อยจญ์ นักพรต: \"แล้วเขาก็อาบน้ำละหมาดและละหมาด\" (อัลบุคอรีย์ มุสลิม)", "ผู้แต่งเห็นว่าทัศนะที่สองชัดกว่า อินชาอัลลอฮ์ เพราะหลักฐานแข็งแรง และสนับสนุนด้วยหะดีษอบูฮุร็อยเราะฮ์ว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"แท้จริงบ่อน้ำของฉันกว้างกว่าระยะทางจากอัยละฮ์ถึงอะดัน... และฉันจะกันผู้คนออกจากมัน เหมือนชายที่กันอูฐของคนอื่นออกจากบ่อน้ำของเขา\" พวกเขาถามว่า โอ้ท่านรสูลุลลอฮ์ วันนั้นท่านจะรู้จักเราหรือ ท่านตอบว่า \"ใช่ พวกท่านมีเครื่องหมายที่ไม่มีในประชาชาติอื่น พวกท่านจะมาหาฉันด้วยใบหน้า มือ และเท้าที่ขาวผ่องจากร่องรอยวุฎูอ์\" (มุสลิม) ซึ่งแสดงว่าวุฎูอ์ไม่ใช่ลักษณะเฉพาะของประชาชาตินี้ ที่เฉพาะคือความขาวผ่อง ซึ่งถูกทำให้เป็นเครื่องหมายของพวกเขา"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "ล้างเกินขอบเขตของฟัรฎู", "points_th": ["ทัศนะที่หนึ่ง: ไม่มีในศาสนาที่จะล้างเกินขอบเขตของฟัรฎู เป็นมัซฮับของมาลิกีย์ ซอฮิรียะฮ์ นักนิติศาสตร์หะนะฟีย์บางท่าน และอีกรายงานจากอิมามอะห์มัด ซึ่งศิษย์บางท่านของเขาเลือก นักวิชาการผู้เชี่ยวชาญหลายท่านเลือกทัศนะนี้ เช่น อิบนุตัยมียะฮ์ และอิบนุลก็อยยิมศิษย์ของเขา", "ทัศนะที่สอง: ศาสนาให้ล้างเกินขอบเขตฟัรฎู โดยมีรายละเอียดต่างกันในวิธี เป็นทัศนะของชาฟิอีย์ นักนิติศาสตร์หะนะฟีย์บางท่าน หันบะลีย์ และเป็นอีกรายงานจากอิมามอะห์มัด และทัศนะของอบูฮุร็อยเราะฮ์และอิบนุอุมัร อิบนุอบีชัยบะฮ์และอบูอุบัยด์บันทึกว่า อิบนุอุมัรอาบน้ำละหมาดในฤดูร้อน บางครั้งล้างถึงรักแร้ (อิบนุหะญัรว่าสายรายงานหะซัน แต่อัลอัลบานีย์แย้งว่าอ่อน เพราะมาจากอับดุลลอฮ์ บินอุมัร อัลอุมะรีย์ ซึ่งอิบนุหะญัรเองว่าอ่อน)", "อันนะวะวีย์กล่าวว่า พวกเขาต่างกันในขนาดที่ส่งเสริม (1) ส่งเสริมให้ล้างเกินข้อศอกและตาตุ่มโดยไม่กำหนดขอบเขต (2) ถึงครึ่งต้นแขนและหน้าแข้ง (3) ถึงไหล่และเข่า และหะดีษในบทนี้บ่งชี้ทั้งหมด ส่วนการเพิ่มที่ใบหน้าคือล้างส่วนหน้าของศีรษะบ้าง", "ทัศนะแรกอ้างอัลกุรอาน ซุนนะฮ์ และการพิจารณา จากอัลกุรอาน: \"โอ้บรรดาผู้ศรัทธา เมื่อพวกเจ้าลุกขึ้นไปละหมาด จงล้างหน้า...\" (อัลมาอิดะฮ์: 6) อัลลอฮ์กำหนดขอบเขตของอวัยวะวุฎูอ์ที่ล้างและเช็ด และอายะฮ์นี้อยู่ในกลุ่มที่ลงมาท้ายสุด การกำหนดขอบเขตจึงหมายความว่าไม่เพิ่มเกิน มิฉะนั้นการกำหนดก็ไม่มีประโยชน์", "จากซุนนะฮ์: ผู้ที่อธิบายวุฎูอ์ของท่านนบี ﷺ เช่น อุษมาน อะลี และอับดุลลอฮ์ บินซัยด์ ไม่มีใครกล่าวว่าท่านล้างหรือเช็ดเกินที่ถูกสั่ง ท่านล้างแขนจนขึ้นไปถึงต้นแขนเพื่อให้ข้อศอกรวมอยู่ และล้างเท้าจนขึ้นไปถึงหน้าแข้งเพื่อให้ตาตุ่มรวมอยู่ ไม่มีรายงานว่าทำเกินกว่านั้น ถ้าการเพิ่มเกินมีในศาสนา ท่านนบี ﷺ คงอธิบายและทำแม้สักครั้ง", "จากการพิจารณา (1) การล้างเกินทำให้อวัยวะทับซ้อนกัน ถ้าล้างหน้าเกิน ก็จะล้ำไปถึงศีรษะ แล้วส่วนที่ต้องเช็ดก็ถูกล้าง ทั้งที่หน้าเป็นอวัยวะหนึ่งและศีรษะเป็นอีกอวัยวะหนึ่ง ถ้าบอกว่าการเพิ่มที่ใบหน้าคือล้างถึงข้างคอ คอก็เป็นอวัยวะแยกที่ไม่ใช่อวัยวะวุฎูอ์ (2) การเพิ่มทำให้สิ่งที่ไม่ได้ถูกสั่งกลายเป็นสิ่งที่ถูกสั่ง เช่น ต้นแขนซึ่งไม่ใช่อวัยวะวุฎูอ์ (3) ทำให้ความขาวผ่องยาวขึ้นไม่ได้ เพราะเฉพาะที่ใบหน้า ถ้าล้ำไปที่ศีรษะก็ไม่เรียกว่าฆุรเราะฮ์ เพราะไม่มีฆุรเราะฮ์ที่ศีรษะ", "ผู้ที่เห็นว่าศาสนาให้ล้างเกิน หลักฐานหลักคือคำว่า \"ผู้ใดในพวกท่านสามารถทำให้ความขาวผ่องยาวขึ้น ก็จงทำ\" พวกเขาว่า อบูฮุร็อยเราะฮ์กล่าวเช่นนั้นตามความเข้าใจของเขา และเป็นการอธิบาย ซึ่งการอธิบายของผู้รายงานต้องรับไว้ หากไม่ขัดกับความหมายตรง และเพราะเขาคงไม่ทำเช่นนั้นเอง แต่ทำตามที่เห็นท่านนบี ﷺ ทำ ดังที่กล่าวในส่วนที่มาของหะดีษ", "ผู้แต่งเห็นว่าที่ถูกต้องคือทัศนะแรก เพราะหลักฐานแข็งแรง คือไม่ล้างเกินปริมาณที่วาญิบ เว้นแต่เพื่อให้ทั่วที่ฟัรฎู ซึ่งการที่ท่านนบี ﷺ ล้างขึ้นไปที่ต้นแขนและหน้าแข้งก็บ่งเช่นนั้น ส่วนคำในหะดีษในบทนี้ \"ผู้ใดสามารถ\" เป็นคำของอบูฮุร็อยเราะฮ์ที่แทรกเข้ามาดังที่กล่าวมา และสิ่งที่เขาทำเป็นการวินิจฉัยของเขาเอง ตามหลักฐานจากเรื่องของเขากับอบูหาซิม ส่วนการกระทำของท่านนบี ﷺ ไม่ใช่การล้างเกินขอบเขตฟัรฎู แต่เพื่อให้ทั่วฟัรฎู"]}], "tags_th": ["ความประเสริฐของวุฎูอ์", "วันกิยามะฮ์", "ความขาวผ่อง", "มุดร็อจ", "อวัยวะวุฎูอ์"]}, {"id": "v1-h044", "volume": 1, "bab": "wudu", "topic_ar": "حكم التيمن في الأمور ومنها الوضوء", "topic_th": "หุก่มการเริ่มด้วยขวาในกิจการต่าง ๆ รวมถึงการอาบน้ำละหมาด", "pages": [200, 203], "hadith": [{"no": 44, "matn_ar": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: كَانَ النَّبِيُّ ﷺ يُعْجِبُهُ التَّيَمُّنُ فِي تَنَعُّلِهِ، وَتَرَجُّلِهِ، وَطُهُورِهِ، وَفِي شَأْنِهِ كُلِّهِ. مُتَّفَقٌ عَلَيْهِ.", "translation_th": "จากอาอิชะฮ์ (ร.ฎ.) กล่าวว่า ท่านนบี ﷺ ชอบการเริ่มด้วยขวาในการสวมรองเท้า การหวีผม การชำระร่างกาย และในกิจการทั้งหมดของท่าน บันทึกโดยอัลบุคอรีย์และมุสลิม", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["ส่งเสริมให้เริ่มด้วยเท้าขวาเมื่อสวมรองเท้า ถุงเท้า และรองเท้าหุ้มข้อ และเริ่มด้วยแขนขวาเมื่อสวมเสื้อและกางเกง ส่วนเวลาถอดให้ถอดซ้ายก่อน", "เมื่อหวีหรือโกนผม ส่งเสริมให้เริ่มที่ศีรษะซีกขวาของผู้ถูกโกน", "เริ่มด้วยขวาในการอาบน้ำละหมาดและอาบน้ำเป็นสุนัตโดยอิจญ์มาอ์ ถ้าทำกลับกัน วุฎูอ์ใช้ได้แต่พลาดความประเสริฐ ส่วนหู ฝ่ามือ และแก้มล้างพร้อมกันได้", "เริ่มด้วยขวาใช้กับสิ่งที่มีเกียรติ ส่วนสิ่งที่ไม่มีเกียรติ เช่น เข้าห้องน้ำ ออกจากมัสยิด ชำระทวาร ให้ใช้ซ้าย"], "vocab": [{"ar": "يُعْجِبُهُ", "th": "ท่านชอบและพอใจ ในอีกสำนวนว่า \"ท่านรัก\""}, {"ar": "التَّيَمُّن", "th": "การเริ่มด้วยด้านขวาก่อนด้านซ้าย (คำนี้ยังแปลว่าการหวังความจำเริญได้ด้วย)"}, {"ar": "تَنَعُّلِهِ", "th": "การสวมรองเท้าของท่าน"}, {"ar": "تَرَجُّلِهِ", "th": "การหวีผม ทาน้ำมัน และจัดผมให้สวย"}, {"ar": "طُهُورِهِ", "th": "อ่านสระอุ คือการชำระในการอาบน้ำละหมาดและอาบน้ำ"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกหลายแห่ง แห่งแรกในหมวดวุฎูอ์ บทการเริ่มด้วยขวาในการอาบน้ำละหมาดและอาบน้ำ (168) และมุสลิม (268) ผ่านสายอัชอัษ บินสุลัยม์ จากบิดา จากมัสรูก จากอาอิชะฮ์ สำนวนนี้เป็นของอัลบุคอรีย์ สำนวนของมุสลิมคือ \"ท่านรักการเริ่มด้วยขวาในกิจการทั้งหมดของท่าน ในการสวมรองเท้า การหวีผม และการชำระร่างกาย\""]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ชอบ\" คือทำให้ท่านยินดีและพอใจ ในอีกสำนวนว่า \"ท่านรักการเริ่มด้วยขวา\" อาอิชะฮ์รู้ว่าท่านรักเรื่องนี้ อาจเพราะท่านบอกนาง หรือจากสิ่งบ่งชี้ อิบนุบัฏฏ็อลกล่าวว่า การที่ท่านเริ่มด้วยขวาในทุกกิจการ อาจเป็นเพราะเป็นลางดีจากคำว่า \"ขวา\" (ยะมีน) เพราะท่านชอบลางดี", "\"ตะยัมมุน\" มีสองความหมาย คือการหวังความจำเริญ (ยุมน์) และการเริ่มด้วยขวาก่อนซ้าย ซึ่งในที่นี้หมายถึงความหมายหลัง ในสำนวนหนึ่งว่า \"ท่านรักการเริ่มด้วยขวาเท่าที่ทำได้\" (อัลบุคอรีย์) ซึ่งแสดงว่าท่านรักษาเรื่องนี้เสมอ เว้นแต่มีอุปสรรค", "\"ในการสวมรองเท้า\" คือการใส่รองเท้า \"การหวีผม\" คือหวี ทาน้ำมัน และจัดผมให้สวย ไม่ว่าผมของตนหรือของผู้อื่น \"การชำระร่างกาย\" (ฏุฮูร) อ่านสระอุ คือการชำระในการอาบน้ำละหมาดและอาบน้ำ อิบนุลอะษีรยกจากสีบะวัยฮ์ว่า \"ฏะฮูร\" (สระอะ) ใช้ได้ทั้งน้ำและการกระทำ จึงอ่านได้ทั้งสองแบบ", "\"และในกิจการทั้งหมดของท่าน\" เป็นการกล่าวกว้างหลังการกล่าวเฉพาะ คำว่า \"ทั้งหมด\" ยืนยันความกว้าง แต่ความกว้างนี้มีข้อยกเว้น เช่น การเข้าห้องน้ำ การสั่งน้ำมูก การชำระทวาร และสิ่งอื่นที่ใช้ซ้าย"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "สวมรองเท้าและเสื้อผ้า", "points_th": ["หะดีษเป็นหลักฐานว่าศาสนาให้เริ่มด้วยเท้าขวาเมื่อสวมรองเท้า และถุงเท้าหรือรองเท้าหุ้มข้อก็เช่นกัน การสวมเสื้อและกางเกงก็เริ่มด้วยแขนขาข้างขวา", "เมื่อถอดรองเท้า ให้ถอดข้างซ้ายก่อน เพราะการใส่รองเท้าให้เท้าดีกว่าการเดินเท้าเปล่า การถอดเสื้อและกางเกงก็เช่นกัน อัลค็อฏฏอบีย์กล่าวว่า เมื่อรู้ว่าการสวมรองเท้าเป็นการรักษาและปกป้องเท้า การเริ่มด้วยขวาก็เป็นการให้เกียรติเท้าขวามากขึ้น การให้เท้าขวาสวมอยู่หลังถอดข้างซ้ายแล้วก็เช่นกัน"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "หวีผมและโกนผม", "points_th": ["หะดีษเป็นหลักฐานว่าศาสนาให้เริ่มที่ศีรษะซีกขวาเมื่อหวีผม และเมื่อโกนผมด้วย ช่างโกนให้เริ่มที่ศีรษะซีกขวาก่อนแล้วจึงซีกซ้าย การเริ่มด้วยขวาในการโกนจึงพิจารณาจากผู้ถูกโกน ไม่ใช่ช่างโกน ซึ่งเป็นทัศนะที่ชัดกว่า", "ตามหะดีษอนัส (ร.ฎ.) เรื่องหัจญ์ของท่านนบี ﷺ: \"แล้วท่านบอกช่างโกนว่า จงเอาไป และชี้ไปที่ซีกขวา แล้วซีกซ้าย\" (มุสลิม)"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "เริ่มด้วยขวาในการอาบน้ำละหมาดและอาบน้ำ", "points_th": ["ศาสนาให้เริ่มด้วยขวาในการอาบน้ำละหมาดและอาบน้ำ ในวุฎูอ์ให้ล้างมือและเท้าข้างขวาก่อนข้างซ้าย ในการอาบน้ำให้ล้างร่างกายซีกขวาก่อนซีกซ้าย", "อิบนุลมุนซิรกล่าวว่า \"มีรายงานที่ถูกต้องว่าท่านรสูลุลลอฮ์ ﷺ เริ่มล้างมือขวาแล้วจึงมือซ้ายในวุฎูอ์ของท่าน ผู้อาบน้ำละหมาดก็ทำเช่นนี้ หากต้องการปฏิบัติตามซุนนะฮ์\"", "อันนะวะวีย์กล่าวว่า \"นักวิชาการเห็นพ้องว่าการเริ่มด้วยมือขวาก่อนซ้าย และเท้าขวาก่อนซ้ายในวุฎูอ์เป็นซุนนะฮ์ ถ้าทำกลับกัน ก็พลาดความประเสริฐ แต่วุฎูอ์ใช้ได้\" และว่า \"พึงรู้ว่าอวัยวะวุฎูอ์บางส่วนไม่ส่งเสริมให้เริ่มด้วยขวา คือหู ฝ่ามือ และแก้มทั้งสอง แต่ให้ล้างพร้อมกันทีเดียว ถ้าทำไม่ได้ เช่น ผู้ที่มือขาด ก็ให้เริ่มข้างขวา\""]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "ขวาสำหรับสิ่งมีเกียรติ ซ้ายสำหรับสิ่งอื่น", "points_th": ["ตามรูปคำ หะดีษบ่งว่าศาสนาให้เริ่มด้วยขวาในทุกสิ่ง แต่นักวิชาการจำกัดไว้เฉพาะสิ่งที่เป็นการให้เกียรติ เช่น การรับและให้ สวมเสื้อ กางเกง และรองเท้าหุ้มข้อ เข้ามัสยิด ด้านขวาของมัสยิด สวมรองเท้า กินและดื่ม (ซึ่งวาญิบให้ใช้มือขวา) การจับมือ การทาตา การแปรงฟัน และการโกนผมเริ่มที่ด้านขวา", "ส่วนสิ่งที่ตรงกันข้าม ให้ใช้ซ้าย เช่น เข้าห้องน้ำ ออกจากมัสยิด สั่งน้ำมูก ชำระทวาร ถอดเสื้อผ้า กางเกง และรองเท้าหุ้มข้อ", "หลักฐานของการจำกัดนี้คือหะดีษหัฟเศาะฮ์ ภรรยาท่านนบี ﷺ ว่า \"ท่านนบี ﷺ ใช้มือขวาสำหรับอาหาร เครื่องดื่ม และเสื้อผ้า และใช้มือซ้ายสำหรับสิ่งอื่น\" (อบูดาวูด อะห์มัด อันนะวะวีย์ว่าสายรายงานดี อัลอัลบานีย์ว่าศ่อฮีห์)", "และหะดีษอาอิชะฮ์: \"มือขวาของท่านรสูลุลลอฮ์ ﷺ ใช้สำหรับการชำระร่างกายและอาหาร มือซ้ายใช้สำหรับการถ่ายทุกข์และสิ่งสกปรก\" (อบูดาวูด อะห์มัด สายรายงานนี้อ่อน เพราะอิบรอฮีม อันนะเคาะอีย์ไม่ได้ฟังจากอาอิชะฮ์ แต่หะดีษหัฟเศาะฮ์อาจเสริมให้แข็งแรงขึ้น)"]}], "tags_th": ["เริ่มด้วยขวา", "วุฎูอ์", "สวมรองเท้า", "มารยาท", "การให้เกียรติ"]}, {"id": "v1-h045", "volume": 1, "bab": "wudu", "topic_ar": "الأمر بالبدء بالميامن في الوضوء", "topic_th": "คำสั่งให้เริ่มด้วยข้างขวาในการอาบน้ำละหมาด", "pages": [204, 206], "hadith": [{"no": 45, "matn_ar": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «إِذَا تَوَضَّأْتُمْ فَابْدَؤُوا بِمَيَامِنِكُمْ». أَخْرَجَهُ الْأَرْبَعَةُ، وَصَحَّحَهُ ابْنُ خُزَيْمَةَ.", "translation_th": "จากอบูฮุร็อยเราะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"เมื่อพวกท่านอาบน้ำละหมาด จงเริ่มด้วยข้างขวาของพวกท่าน\" บันทึกโดยนักบันทึกทั้งสี่ และอิบนุคุซัยมะฮ์ระบุว่าศ่อฮีห์", "grade_th": "สายรายงานศ่อฮีห์ (อันนะวะวีย์ว่าหะซัน สายรายงานดี)"}], "key_rulings_th": ["ศาสนาให้เริ่มด้วยมือและเท้าข้างขวาก่อนข้างซ้ายในการอาบน้ำละหมาด", "นักวิชาการส่วนใหญ่ว่าเป็นสุนัต ไม่ใช่วาญิบ อันนะวะวีย์และอิบนุกุดามะฮ์รายงานอิจญ์มาอ์ ส่วนอิบนุบาซเลือกว่าวาญิบ", "เหตุที่คำสั่งเปลี่ยนจากวาญิบเป็นสุนัต: อายะฮ์สั่งล้างมือและเท้าโดยไม่ระบุว่าเริ่มข้างไหน มือทั้งสองนับเป็นอวัยวะเดียว และหะดีษอาอิชะฮ์ใช้คำว่า \"ชอบ\" ไม่ใช่คำบังคับ", "ผู้แต่งชี้ว่า การพาดพิงสำนวนนี้ถึงนักบันทึกทั้งสี่และอิบนุคุซัยมะฮ์ไม่แม่นยำ สำนวนนี้เป็นของอิบนุมาญะฮ์เท่านั้น"], "vocab": [{"ar": "إِذَا تَوَضَّأْتُمْ", "th": "เมื่อพวกท่านเริ่มอาบน้ำละหมาด"}, {"ar": "مَيَامِنِكُمْ", "th": "พหูพจน์ของ مَيْمَنَة คือข้างขวา ตรงข้ามกับ مَيْسَرَة ข้างซ้าย"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["ผู้แต่งชี้ว่าอิบนุหะญัรยกหะดีษด้วยสำนวนที่ต่างจากหนังสือที่พาดพิงถึง สำนวนนี้เป็นของอิบนุมาญะฮ์ (402) เท่านั้น ส่วนคนอื่นต่างไป อบูดาวูด (4141) ในหมวดเครื่องแต่งกาย: \"เมื่อพวกท่านสวมเสื้อผ้าและอาบน้ำละหมาด จงเริ่มด้วยข้างขวาของพวกท่าน\" อิบนุคุซัยมะฮ์ก็สำนวนเดียวกัน", "อัตติรมิซีย์บันทึกในหมวดเครื่องแต่งกาย (1766) สำนวนว่า \"ท่านรสูลุลลอฮ์ ﷺ เมื่อสวมเสื้อ ท่านเริ่มด้วยข้างขวา\" อันนะสาอีย์ในอัสสุนันอัลกุบรอก็เช่นกัน ทั้งหมดผ่านอัลอะอ์มัช จากอบูศอลิห์ จากอบูฮุร็อยเราะฮ์", "จึงเห็นว่าในรายงานของอบูดาวูด อิบนุมาญะฮ์ และอิบนุคุซัยมะฮ์ หะดีษมาในรูปคำสั่ง จึงเป็นซุนนะฮ์จากคำพูด ส่วนในรายงานของอัตติรมิซีย์และอันนะสาอีย์มาในรูปเล่าการกระทำของท่านรสูลุลลอฮ์ ﷺ จึงเป็นซุนนะฮ์จากการกระทำ การพาดพิงสำนวนนี้ถึงนักบันทึกทั้งสี่และอิบนุคุซัยมะฮ์จึงไม่แม่นยำ อัลมิซซีย์จึงไม่ได้พาดพิงหะดีษนี้ถึงอัตติรมิซีย์และอันนะสาอีย์ และอิบนุลมุลักกินกล่าวว่า \"อัตติรมิซีย์ไม่ได้รายงานหะดีษนี้เลย นั่นเป็นอีกหะดีษหนึ่ง\"", "สายรายงานศ่อฮีห์ อิบนุคุซัยมะฮ์ว่าศ่อฮีห์ตามที่อิบนุหะญัรระบุ อัซซัยละอีย์ยกคำของอิบนุดะกีกิลอีดว่า \"สมควรที่จะศ่อฮีห์\" อิบนุลมุลักกินว่าศ่อฮีห์ และอันนะวะวีย์ว่า \"หะดีษหะซัน สายรายงานดี\""]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"เมื่อพวกท่านอาบน้ำละหมาด\" คือเมื่อเริ่มอาบ จึงรวมทั้งตอนเริ่ม เช่น การล้างฝ่ามือให้เริ่มข้างขวาก่อนข้างซ้าย และระหว่างอาบ เช่น การล้างมือและเท้า แต่ตามที่อันนะวะวีย์กล่าวไปแล้ว ฝ่ามือทั้งสองล้างพร้อมกันทีเดียว", "\"ข้างขวาของพวกท่าน\" (มะยามิน) พหูพจน์ของมัยมะนะฮ์ คือข้างขวา ตรงข้ามกับข้างซ้าย ดังอายะฮ์ \"ชาวขวา ชาวขวาคือใคร และชาวซ้าย ชาวซ้ายคือใคร\" (อัลวากิอะฮ์: 8–9)"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "เริ่มด้วยขวาเป็นวาญิบหรือสุนัต", "points_th": ["เหตุที่อิบนุหะญัรยกหะดีษนี้ต่อจากหะดีษอาอิชะฮ์ คือหะดีษนี้แสดงการเริ่มด้วยขวาในวุฎูอ์ด้วยรูปคำสั่ง จึงเป็นซุนนะฮ์จากคำพูด ส่วนหะดีษก่อนเป็นซุนนะฮ์จากการกระทำ แต่ท่านยกหะดีษอาอิชะฮ์ก่อน เพราะเป็นหลักของการเริ่มด้วยขวาโดยทั่วไป และแข็งแรงกว่าหะดีษอบูฮุร็อยเราะฮ์", "ตามรูปคำ หะดีษบ่งว่าการเริ่มด้วยขวาก่อนซ้ายในการล้างมือและเท้าเป็นวาญิบ เพราะหลักเดิมของคำสั่งคือวาญิบ และท่านรสูลุลลอฮ์ ﷺ ทำเป็นประจำ ดังหะดีษอุษมาน อับดุลลอฮ์ บินซัยด์ อะลี และคนอื่น ๆ และการกระทำของท่านอธิบายอายะฮ์ \"จงล้างหน้าของพวกเจ้าและมือของพวกเจ้า\"", "อิบนุบาซเลือกว่าวาญิบ อัรรอซีย์พาดพิงทัศนะนี้ถึงอะห์มัด แต่อัซซัรกะชีย์กล่าวว่า \"เป็นเรื่องที่ไม่ถูกต้อง\" อัรรอฟิอีย์ก็ยกจากชาฟิอีย์ว่าเป็นทัศนะของอะห์มัดด้วย แต่ผู้แต่งไม่พบในตำราหันบะลีย์ที่เขาได้อ่าน โดยเฉพาะอัลมุฆนีย์และอัลอินศ็อฟ อิบนุกุดามะฮ์กลับกล่าวว่า \"การเรียงข้างขวาก่อนซ้ายไม่ใช่วาญิบ เราไม่รู้ว่ามีข้อขัดแย้ง\"", "นักวิชาการส่วนใหญ่จึงเห็นว่าการเริ่มด้วยขวาเป็นสุนัต อิบนุคุซัยมะฮ์ตั้งชื่อบทของหะดีษนี้ว่า \"บทคำสั่งให้เริ่มด้วยขวาในวุฎูอ์ เป็นคำสั่งแบบส่งเสริม ไม่ใช่บังคับ\" คำสั่งในหะดีษจึงเปลี่ยนจากวาญิบเป็นสุนัต", "หลักฐานที่เปลี่ยนความหมาย (1) อายะฮ์ \"จงล้างหน้าของพวกเจ้าและมือของพวกเจ้าจนถึงข้อศอก\" อัลลอฮ์สั่งให้ล้างมือและเท้า โดยไม่ได้ระบุให้เริ่มข้างขวา แสดงว่าสิ่งที่วาญิบคือล้างมือและเท้า ไม่ว่าแบบใด และนักนิติศาสตร์นับมือทั้งสองเป็นอวัยวะเดียว เท้าทั้งสองเป็นอวัยวะเดียว และการเรียงลำดับภายในอวัยวะเดียวไม่ใช่วาญิบ (2) หะดีษอาอิชะฮ์ว่าท่านนบี ﷺ ชอบการเริ่มด้วยขวา แสดงว่าการเริ่มขวาในการชำระเป็นเรื่องความชอบและความยินดี ไม่ใช่การบังคับ ถ้าเป็นการบังคับ อาอิชะฮ์คงอธิบาย เพราะนางเป็นผู้เข้าใจแนวทางของท่านนบี ﷺ และการกล่าวถึงการสวมรองเท้าและการหวีผมคู่กับการชำระ ก็แสดงว่าเรื่องนี้มีความยืดหยุ่น", "และได้กล่าวไปแล้วว่ามีอิจญ์มาอ์ว่าการเริ่มด้วยขวาเป็นสุนัต ตามที่อันนะวะวีย์และอิบนุกุดามะฮ์รายงาน"]}], "tags_th": ["เริ่มด้วยขวา", "วุฎูอ์", "สุนัต", "อิจญ์มาอ์"]}, {"id": "v1-h046", "volume": 1, "bab": "wudu", "topic_ar": "الاكتفاء بمسح الناصية مع العمامة", "topic_th": "เช็ดหน้าผากพร้อมกับผ้าโพกศีรษะ", "pages": [207, 208], "hadith": [{"no": 46, "matn_ar": "وَعَنِ الْمُغِيرَةِ بْنِ شُعْبَةَ رَضِيَ اللهُ عَنْهُ، أَنَّ النَّبِيَّ ﷺ تَوَضَّأَ، فَمَسَحَ بِنَاصِيَتِهِ، وَعَلَى الْعِمَامَةِ وَالْخُفَّيْنِ. أَخْرَجَهُ مُسْلِمٌ.", "translation_th": "จากอัลมุฆีเราะฮ์ บินชุอ์บะฮ์ (ร.ฎ.) ว่า ท่านนบี ﷺ อาบน้ำละหมาด แล้วเช็ดที่ส่วนหน้าของศีรษะ และบนผ้าโพกศีรษะ และบนรองเท้าหุ้มข้อทั้งสอง บันทึกโดยมุสลิม", "grade_th": "ศ่อฮีห์ (มุสลิม)"}], "key_rulings_th": ["ผู้ที่สวมผ้าโพกศีรษะ ให้เช็ดส่วนหน้าของศีรษะที่โผล่ออกมา แล้วเช็ดบนผ้าโพกต่อให้ครบ", "ผู้แต่งเห็นว่าหะดีษนี้ไม่ใช่หลักฐานว่าเช็ดบางส่วนของศีรษะก็พอ เพราะท่านนบี ﷺ ไม่ได้เช็ดแค่ส่วนหน้า แต่เช็ดบนผ้าโพกต่อจนครบ", "ถ้าศีรษะไม่มีอะไรคลุม ก็ต้องเช็ดทั้งศีรษะ (หะดีษอับดุลลอฮ์ บินซัยด์)", "ผู้แต่งเห็นว่าอิบนุหะญัรอาจยกหะดีษนี้ไว้ตรงนี้เพื่อแสดงการเรียงลำดับภายในอวัยวะเดียว คือเริ่มที่ส่วนหน้าของศีรษะ แล้วผ้าโพกซึ่งอยู่ตรงกลางและด้านหลัง"], "vocab": [{"ar": "النَّاصِيَة", "th": "ผมด้านหน้าของศีรษะ บางท่านว่าส่วนหน้าของศีรษะ ไม่ว่ามีผมหรือไม่"}, {"ar": "الْعِمَامَة", "th": "ผ้าโพกศีรษะ"}, {"ar": "الْخُفَّيْن", "th": "รองเท้าหุ้มข้อทั้งสองข้าง (คุฟฟ์) ทำจากหนัง"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อัลมุฆีเราะฮ์ บินชุอ์บะฮ์ บินอบีอามิร บินมัสอูด อัษษะเกาะฟีย์ เข้ารับอิสลามในปีสงครามคันดักและมาเป็นผู้อพยพ สงครามแรกที่ร่วมคืออัลหุดัยบิยะฮ์ เขาเป็นหนึ่งในผู้รับใช้ท่านนบี ﷺ เรื่องน้ำอาบน้ำละหมาด", "ผู้รายงานจากเขา เช่น ลูกชาย อุรวะฮ์และหัมซะฮ์ ทาสที่ปลดปล่อย วัรร็อด และอบูบุรดะฮ์ บินอบีมูซา เขาเป็นหนึ่งในชาวอาหรับที่เฉลียวฉลาดที่สุด ปกครองบัศเราะฮ์ แล้วกูฟะฮ์สองครั้ง ครั้งแรกในสมัยอุมัร ครั้งที่สองในสมัยมุอาวิยะฮ์ และเสียชีวิตที่กูฟะฮ์ปี ฮ.ศ. 50"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["มุสลิมบันทึกในหมวดฏอฮาเราะฮ์ (274) ผ่านบักร์ บินอับดิลลาฮ์ อัลมุซะนีย์ จากหัมซะฮ์ บินอัลมุฆีเราะฮ์ จากบิดา สำนวนว่า \"และบนผ้าโพกศีรษะ และบนรองเท้าหุ้มข้อ\" โดยเพิ่มคำว่า \"บน\" ครั้งที่สอง ต่างจากในบุลูฆ", "อิบนุลเญาซีย์พลาดที่พาดพิงหะดีษนี้ถึงอัลบุคอรีย์และมุสลิม อิบนุอับดิลฮาดีได้แก้ไว้ว่าเป็นหะดีษที่มุสลิมบันทึกคนเดียว อับดุลหักก์ อัลอิชบีลีย์ก็ระบุชัดในอัลญัมอุบัยนัศเศาะฮีหัยน์ และอิบนุลมุลักกินระบุว่าอันนะวะวีย์ก็พลาดแบบเดียวกัน"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"นาศิยะฮ์\" คือผมที่อยู่ด้านหน้าของศีรษะ บางท่านว่าคือส่วนหน้าของศีรษะ ไม่ว่ามีผมหรือไม่"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "เหตุที่ยกหะดีษนี้ และการเช็ดบางส่วนของศีรษะ", "points_th": ["ดูเหมือนอิบนุหะญัรยกหะดีษนี้เพื่อแสดงว่าเช็ดบางส่วนของศีรษะก็พอ เพราะในฟัตหุลบารีย์ท่านใช้หะดีษนี้เป็นหลักฐานว่าการเช็ดทั่วศีรษะไม่ใช่ฟัรฎู มิฉะนั้นเรื่องการเช็ดผ้าโพกและรองเท้าหุ้มข้อจะอยู่ในบทเฉพาะหลังบทวุฎูอ์ แต่ผู้แต่งเห็นว่าหะดีษนี้ไม่ใช่หลักฐานของเรื่องนั้น", "เมื่อพิจารณาแล้ว ผู้แต่งเห็นว่าอิบนุหะญัรอาจมีจุดประสงค์อื่น เพราะถ้าต้องการเรื่องการเช็ดศีรษะ ท่านคงยกไว้กับหะดีษเรื่องการเช็ดศีรษะก่อนหน้า แต่ท่านยกไว้หลังหะดีษ \"เมื่อพวกท่านอาบน้ำละหมาด จงเริ่มด้วยข้างขวา\" และก่อนหะดีษ \"จงเริ่มด้วยสิ่งที่อัลลอฮ์ทรงเริ่ม\" หะดีษแรกเป็นเรื่องการเรียงลำดับระหว่างอวัยวะที่เป็นคู่ เช่น มือและเท้า แล้วหะดีษอัลมุฆีเราะฮ์เป็นการเรียงลำดับภายในอวัยวะเดียวคือศีรษะ เริ่มที่ส่วนหน้าของศีรษะ แล้วผ้าโพกซึ่งอยู่กลางและหลังศีรษะ แล้วหะดีษญาบิรเป็นการเรียงลำดับระหว่างอวัยวะต่างชนิด", "ผู้แต่งเห็นว่าหะดีษนี้ไม่ใช่หลักฐานของเรื่องนั้น (ตามที่กล่าวในเรื่องการเช็ดศีรษะ) เพราะท่านนบี ﷺ เช็ดที่ส่วนหน้าของศีรษะแล้วเช็ดบนผ้าโพกต่อจนครบ ท่านไม่ได้เช็ดแค่ส่วนหน้า จนจะใช้เป็นหลักฐานว่าเช็ดบางส่วนได้ แต่เมื่อสวมผ้าโพกอยู่ ก็เช็ดบนผ้าโพกและส่วนที่โผล่ของศีรษะ ถ้าศีรษะไม่มีอะไรคลุม ก็เช็ดทั้งหมด ดังที่ยืนยันในหะดีษอับดุลลอฮ์ บินซัยด์และหะดีษอื่น", "อิบนุลก็อยยิมกล่าวว่า \"ไม่มีรายงานที่ถูกต้องจากท่านแม้แต่หะดีษเดียวว่าท่านเช็ดเพียงบางส่วนของศีรษะ แต่เมื่อท่านเช็ดที่ส่วนหน้าของศีรษะ ท่านก็เช็ดบนผ้าโพกต่อจนครบ\""]}], "tags_th": ["ผ้าโพกศีรษะ", "เช็ดศีรษะ", "รองเท้าหุ้มข้อ", "วุฎูอ์"]}, {"id": "v1-h047", "volume": 1, "bab": "wudu", "topic_ar": "وجوب الترتيب في الوضوء", "topic_th": "การเรียงลำดับในการอาบน้ำละหมาดเป็นวาญิบ", "pages": [209, 214], "hadith": [{"no": 47, "matn_ar": "عَنْ جَابِرِ بْنِ عَبْدِ اللهِ رَضِيَ اللهُ عَنْهُمَا - فِي صِفَةِ حَجِّ النَّبِيِّ ﷺ - قَالَ ﷺ: «ابْدَؤُوا بِمَا بَدَأَ اللهُ بِهِ». أَخْرَجَهُ النَّسَائِيُّ، هَكَذَا بِلَفْظِ الْأَمْرِ، وَهُوَ عِنْدَ مُسْلِمٍ بِلَفْظِ الْخَبَرِ.", "translation_th": "จากญาบิร บินอับดิลลาฮ์ (ร.ฎ.) เกี่ยวกับการทำหัจญ์ของท่านนบี ﷺ ท่านกล่าวว่า \"จงเริ่มด้วยสิ่งที่อัลลอฮ์ทรงเริ่ม\" บันทึกโดยอันนะสาอีย์ ในรูปคำสั่งเช่นนี้ และในรายงานของมุสลิมเป็นรูปบอกเล่า (\"ฉันเริ่มด้วยสิ่งที่อัลลอฮ์ทรงเริ่ม\")", "grade_th": "ศ่อฮีห์ในรูปบอกเล่า (มุสลิม) ส่วนรูปคำสั่ง ผู้แต่งเห็นว่าเป็นชาซ"}], "key_rulings_th": ["ผู้แต่งเห็นว่าการเรียงลำดับอวัยวะวุฎูอ์เป็นวาญิบ (หน้า มือ ศีรษะ เท้า) ผู้ที่สลับอวัยวะ วุฎูอ์ใช้ไม่ได้ เป็นทัศนะของอะห์มัดและอัชชาฟิอีย์", "มาลิกและหะนะฟีย์ว่าไม่วาญิบ เพราะคำว่า \"และ\" ในอายะฮ์ไม่บ่งลำดับ แต่การกระทำของท่านนบี ﷺ อธิบายว่าในอายะฮ์นี้หมายถึงลำดับ", "การเรียงระหว่างสิ่งที่เป็นสุนัต หรือระหว่างสุนัตกับฟัรฎู ไม่ใช่วาญิบตามทัศนะของนักวิชาการส่วนใหญ่", "ผู้แต่งเห็นว่าสำนวนคำสั่ง \"จงเริ่ม...\" เป็นชาซ สำนวนที่ถูกต้องคือบอกเล่า \"ฉันเริ่ม...\" ซึ่งยังบ่งว่าวาญิบ เพราะการกระทำของท่านในพิธีหัจญ์เป็นการอธิบายสิ่งวาญิบ", "ถ้อยคำที่กว้างใช้ตามความกว้าง ไม่จำกัดเฉพาะเหตุที่เป็นที่มา หะดีษนี้เกิดในเรื่องสะแอระหว่างเศาะฟาและมัรวะฮ์ แต่ใช้กับอายะฮ์วุฎูอ์ด้วย"], "vocab": [{"ar": "ابْدَؤُوا", "th": "จงเริ่ม (คำสั่ง) ในรายงานของมุสลิมว่า أَبْدَأُ (ฉันเริ่ม) และอีกรายงานว่า نَبْدَأُ (เราเริ่ม)"}, {"ar": "التَّرْتِيب", "th": "การเรียงลำดับอวัยวะวุฎูอ์ตามที่อัลลอฮ์ทรงกล่าว"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["ญาบิร บินอับดิลลาฮ์ บินหะรอม อัลอันศอรีย์ อัสสะละมีย์ เศาะหาบะฮ์ และบิดาก็เป็นเศาะหาบะฮ์ เป็นหนึ่งในเศาะหาบะฮ์ที่มีชื่อเสียงและรายงานหะดีษมาก เขารายงานวิธีทำหัจญ์ของท่านนบี ﷺ และใส่ใจเรื่องนี้ หะดีษของเขาเรื่องหัจญ์เป็นตำราพิธีหัจญ์ในตัวเอง (อิบนุหะญัรจะยกไว้ในหมวดหัจญ์)", "ในเศาะฮีห์มีว่าเขาร่วมบัยอะตุลอะเกาะบะฮ์ และร่วมสงครามทั้งหมดกับท่านนบี ﷺ ยกเว้นบัดร์และอุหุด เพราะบิดาให้อยู่ดูแลพี่สาวน้องสาว มุสลิมบันทึกว่าเขากล่าวว่า \"ฉันร่วมสงครามกับท่านรสูลุลลอฮ์ ﷺ สิบเก้าครั้ง... ฉันไม่ได้ร่วมบัดร์และอุหุด บิดาห้ามไว้ เมื่ออับดุลลอฮ์ (บิดา) ถูกสังหารในวันอุหุด ฉันก็ไม่เคยขาดสงครามใดกับท่านรสูลุลลอฮ์ ﷺ อีกเลย\"", "เขามีวงสอนหะดีษและความรู้ในมัสยิดของท่านรสูลุลลอฮ์ ﷺ ตาบอดในบั้นปลายชีวิต และเสียชีวิตที่มะดีนะฮ์ปี ฮ.ศ. 74"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["มุสลิมบันทึกแบบยาวในเรื่องวิธีทำหัจญ์ของท่านนบี ﷺ (1218) ผ่านหาติม บินอิสมาอีล อัลมะดะนีย์ จากญะอ์ฟัร บินมุหัมมัด จากบิดา จากญาบิร มีว่า \"เมื่อท่านใกล้ถึงเศาะฟา ท่านอ่าน 'แท้จริงเศาะฟาและมัรวะฮ์เป็นส่วนหนึ่งของเครื่องหมายของอัลลอฮ์' (อัลบะเกาะเราะฮ์: 158) ฉันเริ่มด้วยสิ่งที่อัลลอฮ์ทรงเริ่ม แล้วท่านก็เริ่มที่เศาะฟา\" ซึ่งเป็นรูปบอกเล่า", "อันนะสาอีย์ในอัสสุนันอัศศุฆรอ (2962) บันทึกในรูปคำสั่ง อะห์มัดก็เช่นกัน อิบนุลมุลักกินว่าศ่อฮีห์ และว่า \"อันนะสาอีย์รายงานด้วยสายรายงานตามเงื่อนไขของมุสลิม\" อันนะสาอีย์บันทึกในอัสสุนันอัลกุบรอด้วย และอัลมิซซีย์พาดพิงถึงเขา อันนะสาอีย์ยังบันทึก (2970) ด้วยคำว่า \"เราเริ่มด้วยสิ่งที่อัลลอฮ์ทรงเริ่ม\" เช่นเดียวกับอบูดาวูด (1905) อัตติรมิซีย์ (862) และอิบนุมาญะฮ์ (3074)", "อิบนุหะญัรยกรายงานของอันนะสาอีย์ก่อน เพราะมาในรูปคำสั่ง ซึ่งบ่งความบังคับ ส่วนรูปบอกเล่าบ่งว่าท่านนบี ﷺ ทำตามแนวทางของอัลกุรอาน ซึ่งกว้างกว่า อาจบ่งวาญิบหรือสุนัต", "อัลอัลบานีย์ปฏิเสธว่าหะดีษนี้มีในอัสสุนันอัศศุฆรอ และสงสัยว่ามีในรูปคำสั่งในอัลกุบรอ ทั้งที่มีในทั้งสองเล่ม", "นักวิชาการตัดสินว่าคำ \"จงเริ่ม\" เป็นชาซ เพราะสุฟยาน อัษเษารีย์ และสุลัยมาน บินบิลาล รายงานคนเดียว ขัดกับผู้รายงานที่เชื่อถือได้คนอื่นที่รายงานจากญะอ์ฟัรในรูปบอกเล่า ซึ่งมีเจ็ดคน อัลอัลบานีย์ไล่ชื่อไว้ในอัลอิรวาอ์ เช่น อิมามมาลิก สุฟยาน บินอุยัยนะฮ์ ยะห์ยา บินสะอีด อัลก็อฏฏอน และหาติม บินอิสมาอีล อัดดารุกุฏนีย์มีรายงานผ่านอัลฮัยษัม บินมุอาวิยะฮ์ จากหาติม ในรูปคำสั่ง แต่ผู้รายงานคนอื่นจากหาติมรายงานในรูปบอกเล่า", "ผู้แต่งชี้ว่าการที่สุฟยาน อัษเษารีย์รายงานคนเดียวต้องพิจารณา เพราะเขาเป็นอิมามที่เป็นหลักฐาน ไม่มีใครขัดแย้งเขาโดยที่คำของเขาจะไม่ถูกเลือก ตามที่อิบนุมะอีนและคนอื่นกล่าว ความผิดพลาดอาจมาจากผู้ที่รายงานจากเขา คืออิบนุอุยัยนะฮ์และเกาะบีเศาะฮ์ (อัดดารุกุฏนีย์) และอัลฟิรยาบีย์กับเกาะบีเศาะฮ์ (อัลบัยฮะกีย์)", "อิบนุดะกีกิลอีดกล่าวว่า \"หะดีษนี้อยู่ในเศาะฮีห์ แต่ในรูปบอกเล่า 'เราเริ่ม' และ 'ฉันเริ่ม' ไม่ใช่รูปคำสั่ง รายงานส่วนใหญ่เป็นเช่นนี้ และเป็นหะดีษเดียวกัน\" อิบนุหะญัรเพิ่มว่า \"มาลิก สุฟยาน และยะห์ยา บินสะอีด อัลก็อฏฏอน รายงานว่า 'เราเริ่ม' ด้วยอักษรนูนซึ่งเป็นพหูพจน์\" และกล่าวว่า \"พวกเขาจำได้แม่นกว่าคนอื่น\" ผู้แต่งเห็นว่านี่ถูกต้อง อินชาอัลลอฮ์ เพราะไม่อาจกล่าวว่าทั้งสองสำนวนศ่อฮีห์ เนื่องจากเป็นหะดีษเดียว และท่านนบี ﷺ กล่าวเพียงครั้งเดียวเมื่อขึ้นเศาะฟา จึงต้องเลือก"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "หะดีษหัจญ์ใช้กับวุฎูอ์ได้อย่างไร", "points_th": ["หะดีษนี้อยู่ในเรื่องหัจญ์ของท่านนบี ﷺ แต่อิบนุหะญัรยกไว้ในบทวุฎูอ์ เพื่อเป็นหลักฐานว่าการเรียงลำดับในการล้างอวัยวะเป็นวาญิบ เริ่มด้วยหน้า แล้วมือ ตามที่อัลลอฮ์ทรงกล่าวในอัลกุรอาน สิ่งที่อัลลอฮ์ทรงเริ่ม เราก็เริ่มด้วยทั้งในการบอกเล่าและการกระทำตามคำสั่ง เพราะพระดำรัสของพระองค์เปี่ยมวิทยปัญญา พระองค์จะไม่ทรงเริ่มกล่าวสิ่งใด นอกจากสิ่งที่สมควรเริ่มทำก่อน และท่านนบี ﷺ เรียงลำดับเช่นนี้ เราจึงต้องตามแบบอย่างท่าน", "เรื่องนี้ตั้งอยู่บนหลักอุศูลว่า ให้ถือความหมายกว้างของถ้อยคำ ไม่ใช่เหตุเฉพาะที่เป็นที่มา ถ้อยคำนี้แม้มาในเรื่องสะแอระหว่างเศาะฟาและมัรวะฮ์ แต่เป็นถ้อยคำกว้าง จึงใช้ตามความกว้าง ว่าทุกสิ่งที่อัลลอฮ์ทรงเริ่ม เราก็เริ่ม อายะฮ์วุฎูอ์จึงรวมอยู่ในความกว้างนั้น", "ตามรายงานรูปคำสั่ง ความหมายวาญิบชัดเจน ตามรายงานรูปบอกเล่า ก็เพราะการกระทำของท่านนบี ﷺ ตามรูปคือการอธิบายพิธีหัจญ์ และท่านกล่าวว่า \"พวกท่านจงเอาพิธีหัจญ์ของพวกท่านไปจากฉัน\" (มุสลิม) ซึ่งที่ชัดคือการอธิบายสิ่งวาญิบ ไม่ใช่สิ่งที่ประเสริฐกว่า"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "การเรียงลำดับในวุฎูอ์เป็นวาญิบหรือไม่", "points_th": ["การเรียงลำดับในวุฎูอ์มีสามแบบ (1) ระหว่างฟัรฎูกับฟัรฎู คืออวัยวะทั้งสี่ในอัลกุรอาน เช่น ล้างมือหลังล้างหน้า นี่คือประเด็นที่ขัดแย้งกัน (2) ระหว่างสุนัตกับสุนัต เช่น บ้วนปากก่อนสูดน้ำเข้าจมูก ตามทัศนะว่าทั้งสองเป็นสุนัต (3) ระหว่างสุนัตกับฟัรฎู เช่น บ้วนปากกับล้างหน้า", "นักวิชาการส่วนใหญ่ว่าการเรียงระหว่างสุนัตด้วยกัน และระหว่างสุนัตกับฟัรฎู เป็นสุนัต ไม่ใช่วาญิบ เพราะเมื่อตัวการกระทำที่เป็นสุนัตไม่ใช่วาญิบ วิธีทำก็ยิ่งไม่วาญิบ แต่ตามทัศนะว่าการบ้วนปากและสูดน้ำเข้าจมูกเป็นวาญิบ ข้อขัดแย้งในแบบที่หนึ่งก็รวมถึงทั้งสองด้วย อิบนุรุชด์ระบุว่าที่มาของข้อขัดแย้งในการเรียงลำดับมีสองอย่าง คือ คำว่า \"และ\" บางครั้งบ่งลำดับ บางครั้งไม่ และความต่างกันว่าการกระทำของท่านนบี ﷺ บ่งวาญิบหรือสุนัต", "ทัศนะที่หนึ่ง: การเรียงลำดับในวุฎูอ์เป็นวาญิบ เริ่มล้างหน้า แล้วมือ แล้วเช็ดศีรษะ แล้วล้างเท้า ผู้ที่เอาอวัยวะหนึ่งไปก่อนอีกอวัยวะ วุฎูอ์ใช้ไม่ได้ เป็นทัศนะของอะห์มัดและอัชชาฟิอีย์ และอบูอุบัยด์เลือก หลักฐาน (1) อายะฮ์อัลมาอิดะฮ์ เมื่ออัลลอฮ์กล่าวถึงอวัยวะทั้งสี่ ทรงแทรกอวัยวะที่เช็ด คือศีรษะ ไว้ระหว่างอวัยวะที่ล้าง คือมือและเท้า และชาวอาหรับจะไม่แยกสิ่งที่เหมือนกันออกจากกันนอกจากมีประโยชน์ ถ้าการเรียงลำดับไม่วาญิบ ก็คงรวมสิ่งที่เหมือนกันไว้ด้วยกัน (2) ทุกคนที่อธิบายวุฎูอ์ของท่านนบี ﷺ เล่าเรียงลำดับด้วยคำว่า \"แล้ว\" (ษุมม์) เช่น หะดีษอุษมานและอับดุลลอฮ์ บินซัยด์ ไม่มีใครกล่าวว่าท่านเอาอวัยวะใดไปก่อนอย่างขัดกับอายะฮ์ และการกระทำของท่านอธิบายคัมภีร์ของอัลลอฮ์", "ทัศนะที่สอง: การเรียงลำดับไม่วาญิบ ผู้ที่เอาอวัยวะหนึ่งไปก่อน วุฎูอ์ของเขาสมบูรณ์ เป็นทัศนะของมาลิก และนักวิชาการฝ่ายเราะอ์ยุ (หะนะฟีย์) และอีกรายงานจากอะห์มัดที่อบุลค็อฏฏอบระบุ สลัฟกลุ่มหนึ่งเห็นเช่นนี้ และอิบนุลมุนซิรเลือก หลักฐาน (1) หะดีษอัรรุบัยยิอ์ บินติมุเอาวิซ เรื่องวุฎูอ์ของท่านนบี ﷺ: \"ท่านล้างฝ่ามือสามครั้ง ล้างหน้าสามครั้ง บ้วนปากและสูดน้ำเข้าจมูกครั้งเดียว...\" และอีกสำนวน: \"...แล้วท่านอาบน้ำละหมาด ล้างหน้าสามครั้ง แล้วบ้วนปากสามครั้ง และสูดน้ำเข้าจมูกสามครั้ง...\" (อบูดาวูด อัดดารุกุฏนีย์ อัลอัลบานีย์ว่าหะซัน) (2) อัลลอฮ์สั่งให้ล้างอวัยวะ และเชื่อมกันด้วยคำว่า \"และ\" ซึ่งไม่บ่งลำดับ ไม่ว่าล้างแบบใดก็ถือว่าปฏิบัติตามแล้ว", "ผู้แต่งเห็นว่าทัศนะที่มีน้ำหนักคือทัศนะแรก คือการเรียงลำดับอวัยวะวุฎูอ์เป็นวาญิบ เพราะหลักฐานแข็งแรง อบูดาวูดกล่าวว่า \"ฉันได้ยินอะห์มัดถูกถามว่า ถ้าเขาเอาวุฎูอ์ส่วนหนึ่งไปก่อนอีกส่วน เขาตอบว่า ไม่ได้ จนกว่าจะทำตามที่มีในคัมภีร์และซุนนะฮ์\"", "หลักฐานของทัศนะที่สอง คือหะดีษอัรรุบัยยิอ์ ตอบได้สองทาง (1) เป็นหะดีษที่มีข้อบกพร่อง เพราะมาจากอับดุลลอฮ์ บินมุหัมมัด บินอะกีล (กล่าวไปแล้ว) (2) สมมุติว่าศ่อฮีห์ การบ้วนปากและสูดน้ำเข้าจมูกที่เอาไว้หลังคือการเอาสุนัตไว้หลังฟัรฎู ซึ่งนักวิชาการส่วนใหญ่ว่าทำได้ ตามทัศนะว่าทั้งสองเป็นสุนัต หรือว่าการบ้วนปากและสูดน้ำเข้าจมูกเป็นส่วนของใบหน้า", "ส่วนที่ว่าอัลลอฮ์สั่งให้ล้างอวัยวะและเชื่อมด้วย \"และ\" นั้นถูกต้อง แต่ท่านนบี ﷺ อธิบายด้วยการกระทำว่า \"และ\" ในอายะฮ์นี้หมายถึงลำดับ ไม่ใช่แค่การรวม การกระทำของท่านอธิบายคัมภีร์ของอัลลอฮ์ จึงบ่งว่าวาญิบ เพราะการกระทำของท่านนบี ﷺ ที่อธิบายสิ่งวาญิบก็เป็นวาญิบ และความกว้างของคำว่า \"จงเริ่มด้วยสิ่งที่อัลลอฮ์ทรงเริ่ม\" ก็สนับสนุน", "ส่วนการบ้วนปากและสูดน้ำเข้าจมูกก่อนล้างหน้า มีสองทัศนะ ทัศนะแรก: ส่งเสริมให้ทำก่อนล้างหน้า เป็นทัศนะที่ถูกต้องในมัซฮับหันบะลีย์ เพราะความเป็นวาญิบของทั้งสองยืนยันด้วยซุนนะฮ์ ส่วนการเรียงลำดับวาญิบด้วยหลักฐานจากอัลกุรอานที่ซุนนะฮ์สนับสนุน ซึ่งไม่มีในทั้งสอง ทัศนะที่สอง: วาญิบให้ทำก่อนล้างหน้า เป็นอีกทัศนะในมัซฮับหันบะลีย์ และอันนะวะวีย์ระบุว่าการเรียงลำดับระหว่างทั้งสองกับอวัยวะวุฎูอ์อื่นเป็นเงื่อนไข เพราะทุกคนที่อธิบายวุฎูอ์ของท่านนบี ﷺ ในหะดีษศ่อฮีห์ระบุว่าท่านเริ่มด้วยบ้วนปากและสูดน้ำเข้าจมูก และผู้รายงานเรียงลำดับอวัยวะด้วยคำว่า \"แล้ว\" ในบริบทของการอธิบาย ซึ่งบ่งลำดับ"]}], "tags_th": ["เรียงลำดับ", "วุฎูอ์", "วาญิบ", "หัจญ์", "ชาซ"]}, {"id": "v1-h048", "volume": 1, "bab": "wudu", "topic_ar": "إدخال المرفقين في الوضوء", "topic_th": "การล้างข้อศอกรวมด้วยเมื่ออาบน้ำละหมาด", "pages": [215, 216], "hadith": [{"no": 48, "matn_ar": "وَعَنْهُ قَالَ: كَانَ النَّبِيُّ ﷺ إِذَا تَوَضَّأَ أَدَارَ الْمَاءَ عَلَى مِرْفَقَيْهِ. أَخْرَجَهُ الدَّارَقُطْنِيُّ بِإِسْنَادٍ ضَعِيفٍ.", "translation_th": "จากญาบิร (ร.ฎ.) กล่าวว่า ท่านนบี ﷺ เมื่ออาบน้ำละหมาด ท่านให้น้ำไหลรอบข้อศอกทั้งสองของท่าน บันทึกโดยอัดดารุกุฏนีย์ ด้วยสายรายงานที่อ่อน", "grade_th": "ฎออีฟ (อ่อนมาก) แต่ความหมายถูกต้อง"}], "key_rulings_th": ["ต้องล้างข้อศอกรวมด้วยเมื่อล้างมือ และล้างตาตุ่มรวมด้วยเมื่อล้างเท้า", "หะดีษนี้อ่อนมาก แต่ความหมายถูกต้อง และมีหะดีษอบูฮุร็อยเราะฮ์ในมุสลิมที่ชัดเจนแทนได้", "คำว่า \"ถึง\" (อิลา) ในอายะฮ์ \"มือของพวกเจ้าถึงข้อศอก\" หมายถึง \"พร้อมกับ\" เพราะซุนนะฮ์อธิบายอัลกุรอาน"], "vocab": [{"ar": "أَدَارَ الْمَاءَ عَلَى مِرْفَقَيْهِ", "th": "ให้น้ำไหลรอบข้อศอกทั้งสอง คือล้างข้อศอกรวมด้วย"}, {"ar": "الْمَتْرُوك", "th": "ผู้รายงานที่ถูกทิ้ง (ศัพท์หะดีษ) คือผู้ถูกกล่าวหาว่าโกหก หรือผิดพลาดมาก ดีกว่าผู้กุหะดีษเล็กน้อย"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัดดารุกุฏนีย์บันทึกในสุนันของเขา ผ่านอัลกอสิม บินมุหัมมัด บินอับดิลลาฮ์ บินอะกีล จากปู่ จากญาบิร", "สายรายงานอ่อนมาก อิบนุหะญัรยกหะดีษนี้เพื่อให้รู้สถานะว่าอ่อน แต่ไม่ได้บอกว่าอ่อนแค่ไหน อ่อนเพราะอัลกอสิม บินมุหัมมัด บินอับดิลลาฮ์ บินอะกีล อัซซะฮะบีย์ยกคำของอิบนุมะอีนว่า \"ไม่มีค่าอะไร\" อบูหาติมว่า \"ถูกทิ้ง\" อิมามอะห์มัดว่า \"ไม่มีค่าอะไร\" อบูซุรอะฮ์ว่า \"หะดีษของเขามุงกัร และหะดีษของเขาอ่อน\" ส่วนอับดุลลอฮ์ บินอะกีลได้กล่าวไปแล้ว", "\"ถูกทิ้ง\" (มัตรูก) คือผู้ที่ถูกกล่าวหาว่าโกหก หรือผิดพลาดมาก สถานะของเขาดีกว่าผู้กุหะดีษเล็กน้อย ถ้ากล่าวว่า \"นักวิชาการเห็นพ้องกันว่าทิ้งเขา\" ก็หนักกว่าการกล่าวว่า \"คนหนึ่งทิ้งเขา\""]}, {"wajh": 2, "type": "fiqh", "heading_ar": null, "heading_th": "ต้องล้างข้อศอกรวมด้วย", "points_th": ["หะดีษเป็นหลักฐานว่าการล้างข้อศอกในการอาบน้ำละหมาดเป็นวาญิบ เพราะท่านนบี ﷺ ให้น้ำไหลรอบข้อศอก หุก่มที่หะดีษบ่งชี้นี้ถูกต้อง ตัวบทจึงถูกต้องในความหมาย แต่สายรายงานอ่อน", "หะดีษอบูฮุร็อยเราะฮ์ที่กล่าวไปแล้วใช้แทนได้: เขาอาบน้ำละหมาด ล้างหน้าให้ทั่ว แล้วล้างมือขวาจนขึ้นไปถึงต้นแขน แล้วมือซ้ายจนขึ้นไปถึงต้นแขน... และตอนท้ายกล่าวว่า \"อย่างนี้แหละที่ฉันเห็นท่านรสูลุลลอฮ์ ﷺ อาบน้ำละหมาด\" นี่เป็นตัวบทที่ถูกต้องว่าข้อศอกรวมอยู่ในการล้างมือ และตาตุ่มรวมอยู่ในการล้างเท้า", "หะดีษนี้จึงเป็นหลักฐานว่าขอบเขตรวมอยู่ด้วย และคำว่า \"ถึง\" ในอายะฮ์ \"มือของพวกเจ้าถึงข้อศอก\" หมายถึง \"พร้อมกับ\" เพราะซุนนะฮ์อธิบายอัลกุรอาน (กล่าวไปแล้วในหะดีษอุษมาน หะดีษที่สองของบทวุฎูอ์)"]}], "tags_th": ["ข้อศอก", "วุฎูอ์", "ล้างมือ", "หะดีษอ่อน"]}, {"id": "v1-h049-051", "volume": 1, "bab": "wudu", "topic_ar": "حكم التسمية في الوضوء", "topic_th": "หุก่มการกล่าวบิสมิลลาฮ์เมื่ออาบน้ำละหมาด", "pages": [217, 224], "hadith": [{"no": 49, "matn_ar": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «لَا وُضُوءَ لِمَنْ لَمْ يَذْكُرِ اسْمَ اللهِ عَلَيْهِ». أَخْرَجَهُ أَحْمَدُ، وَأَبُو دَاوُدَ، وَابْنُ مَاجَهْ، بِإِسْنَادٍ ضَعِيفٍ.", "translation_th": "จากอบูฮุร็อยเราะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"ไม่มีวุฎูอ์สำหรับผู้ที่ไม่กล่าวพระนามของอัลลอฮ์ในการอาบน้ำละหมาด\" บันทึกโดยอะห์มัด อบูดาวูด และอิบนุมาญะฮ์ ด้วยสายรายงานที่อ่อน", "grade_th": "ฎออีฟ (อ่อน)"}, {"no": 50, "matn_ar": "وَلِلتِّرْمِذِيِّ: عَنْ سَعِيدِ بْنِ زَيْدٍ.", "translation_th": "และในรายงานของอัตติรมิซีย์ จากสะอีด บินซัยด์ (ร.ฎ.) (ด้วยความหมายเดียวกัน)", "grade_th": "ฎออีฟ (อ่อน)"}, {"no": 51, "matn_ar": "وَأَبِي سَعِيدٍ نَحْوُهُ. قَالَ أَحْمَدُ: لَا يَثْبُتُ فِيهِ شَيْءٌ.", "translation_th": "และจากอบูสะอีด (ร.ฎ.) ด้วยความหมายใกล้เคียงกัน อะห์มัดกล่าวว่า ไม่มีหะดีษใดในเรื่องนี้ที่ถูกต้อง", "grade_th": "สายรายงานพอใช้ได้ (ศอลิห์) แต่ละสายอ่อน และเมื่อรวมกันอาจถึงระดับหะซัน ลิฆ็อยริฮี"}], "key_rulings_th": ["หะดีษทุกสายในเรื่องนี้อ่อน แต่เมื่อรวมกันแล้ว นักวิชาการหลายท่านเห็นว่ามีที่มาและถึงระดับหะซัน", "ผู้แต่งเห็นว่าทัศนะที่มีน้ำหนักคือ การกล่าวบิสมิลลาฮ์เป็นสุนัตที่หนักแน่น (ทัศนะของนักวิชาการส่วนใหญ่) ไม่ควรละไว้โดยตั้งใจ แต่ถ้าละไว้ วุฎูอ์ยังใช้ได้", "อีกทัศนะว่าเป็นวาญิบ (ซอฮิรียะฮ์ อีกรายงานจากอะห์มัด และอิสหาก)", "คำว่า \"ไม่มีวุฎูอ์\" หมายถึงไม่สมบูรณ์ ไม่ใช่ใช้ไม่ได้ เพื่อให้สอดคล้องกับหะดีษศ่อฮีห์อื่น", "กล่าวว่า \"บิสมิลลาฮ์\" หลังการตั้งเจตนา ก่อนเริ่มการชำระ การเพิ่ม \"อัรเราะห์มานิรเราะฮีม\" ไม่มีหลักฐาน การกล่าวตามที่มีรายงานดีกว่า"], "vocab": [{"ar": "لَا وُضُوءَ", "th": "ไม่มีวุฎูอ์ ในที่นี้หมายถึงวุฎูอ์ที่สมบูรณ์ ไม่ใช่วุฎูอ์ที่ใช้ได้"}, {"ar": "اسْمَ اللهِ", "th": "การกล่าวว่า บิสมิลลาฮ์ (ด้วยพระนามของอัลลอฮ์) คำอื่นใช้แทนไม่ได้"}, {"ar": "فِيهِ لِين", "th": "มีความอ่อน (ศัพท์หะดีษ) คือความจำของผู้รายงานถูกวิจารณ์ แต่ยังไม่หลุดจากขอบเขตที่นำหะดีษมาพิจารณาได้ และไม่กระทบความน่าเชื่อถือด้านศาสนา"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["สะอีด บินซัยด์ บินอัมร์ บินนุฟัยล์ บินอับดิลอุซซา อัลกุร็อชีย์ อัลอะดะวีย์ หนึ่งในสิบคนที่ได้รับแจ้งข่าวดีว่าจะเข้าสวรรค์ เข้ารับอิสลามแต่เนิ่น ๆ ภรรยาของเขาคือฟาฏิมะฮ์ บินติลค็อฏฏอบ น้องสาวของอุมัร และที่บ้านของเขาเป็นที่อุมัรเข้ารับอิสลาม", "เขาร่วมทุกสงคราม ยกเว้นบัดร์ เพราะอยู่ที่ชาม เขาร่วมสงครามยัรมูกและการพิชิตดิมัชก์ เป็นเศาะหาบะฮ์ที่ประเสริฐ อัซซะฮะบีย์ระบุว่าเขามีสี่สิบแปดหะดีษ อัลบุคอรีย์และมุสลิมบันทึกตรงกันสองหะดีษ อัลบุคอรีย์บันทึกคนเดียวอีกหนึ่งหะดีษ เรื่องของเขากับอัรวา บินติอุวัยส์ ที่ดุอาอ์ของเขาถูกตอบรับเป็นที่รู้จักและอยู่ในเศาะฮีหัยน์ (จะกล่าวในบทการแย่งชิงในหมวดการซื้อขาย) เขาเสียชีวิตปี ฮ.ศ. 50"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجها", "heading_th": "ที่มาของหะดีษทั้งสาม", "points_th": ["หะดีษอบูฮุร็อยเราะฮ์: อะห์มัด อบูดาวูด (101) ในหมวดฏอฮาเราะฮ์ บทการกล่าวบิสมิลลาฮ์ในวุฎูอ์ และอิบนุมาญะฮ์ (399) ผ่านยะอ์กูบ บินสะละมะฮ์ อัลลัยษีย์ จากบิดา จากอบูฮุร็อยเราะฮ์ สำนวนว่า \"ไม่มีละหมาดสำหรับผู้ที่ไม่มีวุฎูอ์ และไม่มีวุฎูอ์สำหรับผู้ที่ไม่กล่าวพระนามของอัลลอฮ์\" สายรายงานอ่อนด้วยสองเหตุ (1) ยะอ์กูบและบิดาไม่เป็นที่รู้จัก อิบนุหะญัรว่ายะอ์กูบเป็นผู้มีหะดีษน้อย มีเพียงมุหัมมัด บินมูซา อัลฟิฏรีย์ที่รายงานจากเขา และบิดาไม่เป็นที่รู้จัก มีเพียงลูกชายที่รายงานจากเขา (2) ความต่อเนื่องของสายน่าสงสัย อัลบุคอรีย์กล่าวว่า \"ไม่เป็นที่รู้ว่าสะละมะฮ์ได้ยินจากอบูฮุร็อยเราะฮ์ และยะอ์กูบได้ยินจากบิดา\"", "อัลหากิมพลาดที่ว่า \"สายรายงานศ่อฮีห์ มุสลิมใช้ยะอ์กูบ บินอบีสะละมะฮ์ อัลมาญิชูนเป็นหลักฐาน\" เพราะเข้าใจผิดว่าเป็นคนละคน อัซซะฮะบีย์แก้ว่า \"ที่ถูกคือ อัลลัยษีย์... และสายรายงานมีความอ่อน\" หะดีษนี้ยังมีสายอื่นที่อ่อนทั้งหมด และมีหลักฐานสนับสนุนที่อิบนุหะญัรยกสองบท คือหะดีษสะอีด บินซัยด์และหะดีษอบูสะอีด", "หะดีษสะอีด บินซัยด์: อัตติรมิซีย์บันทึก (25) ผ่านอบูษิฟาล อัลมุรรีย์ จากเราะบาห์ บินอับดิรเราะห์มาน จากย่า (ยาย) ของเขา จากบิดาของนาง คือสะอีด บินซัยด์ แบบมัรฟูอ์ \"ไม่มีวุฎูอ์สำหรับผู้ที่ไม่กล่าวพระนามของอัลลอฮ์\" สายรายงานอ่อน อบูษิฟาลมีผู้รายงานจากเขาหลายคน แต่อัลบุคอรีย์กล่าวว่า \"หะดีษของเขาต้องพิจารณา\" ซึ่งเป็นสำนวนที่เขาใช้กับผู้ที่เขาถือว่าอ่อน อัซซะฮะบีย์ว่า \"ไม่แข็งแรง และสายรายงานไม่ผ่าน\" อิบนุหะญัรว่า \"เป็นที่รับได้\" ส่วนเราะบาห์ อบูหาติมและอบูซุรอะฮ์ว่าไม่เป็นที่รู้จัก ย่า (ยาย) ของเราะบาห์ชื่ออัสมาอ์ บินติสะอีด บินซัยด์ มีการกล่าวถึงในฐานะเศาะหาบะฮ์ แต่อัซซะฮะบีย์นับนางเป็นหญิงที่ไม่เป็นที่รู้จัก อัตติรมิซีย์ยกคำของอัลบุคอรีย์ว่า \"สิ่งที่ดีที่สุดในบทนี้คือหะดีษของเราะบาห์ บินอับดิรเราะห์มาน\"", "หะดีษอบูสะอีด อัลคุดรีย์: อิบนุมาญะฮ์ (397) อะห์มัด และอัตติรมิซีย์ในอัลอิลัลอัลกะบีร ผ่านกะษีร บินซัยด์ จากรุบัยห์ บินอับดิรเราะห์มาน บินอบีสะอีด จากบิดา จากปู่ \"ไม่มีวุฎูอ์สำหรับผู้ที่ไม่กล่าวพระนามของอัลลอฮ์\" สายรายงานพอใช้ได้ กะษีร บินซัยด์ บางคนว่าเชื่อถือได้ บางคนว่าอ่อน ผู้แต่งสรุปว่าเขาใกล้ความแข็งแรงมากกว่าความอ่อน ตามหลักว่า ถ้าผู้วิจารณ์และผู้รับรองเท่ากัน หะดีษเป็นหะซันเมื่อมีหลักฐานสนับสนุน ถ้าฝ่ายวิจารณ์มากกว่าก็อ่อน และถ้าฝ่ายรับรองมากกว่า โดยฝ่ายวิจารณ์ไม่ได้อธิบายเหตุผล ก็ใกล้ความแข็งแรง", "รุบัยห์ อิบนุหิบบานว่าเชื่อถือได้ อิบนุอะดีย์ว่า \"ฉันหวังว่าเขาไม่เป็นไร\" อบูหาติมว่า \"เป็นผู้อาวุโส\" (คือเขียนหะดีษของเขาไว้ได้และพิจารณา) อิมามอะห์มัดว่า \"รุบัยห์เป็นคนที่ไม่เป็นที่รู้จัก\" อิบนุลมุลักกินว่าข้อนี้ไม่ใช่การวิจารณ์ เพราะคนอื่นรู้จักเขา และผู้ที่รู้เป็นหลักฐานเหนือผู้ที่ไม่รู้ อัลบุคอรีย์ว่า \"หะดีษของเขามุงกัร\" อิบนุหะญัรว่า \"เป็นที่รับได้\" คือเมื่อมีสายสนับสนุน", "อิบนุอะดีย์ยกว่าอะห์มัดถูกถามเรื่องการกล่าวบิสมิลลาฮ์ในวุฎูอ์ เขาตอบว่า \"ฉันไม่รู้หะดีษใดในเรื่องนี้ที่ถูกต้อง ที่แข็งแรงที่สุดคือหะดีษของกะษีร บินซัยด์ จากรุบัยห์ และรุบัยห์ไม่เป็นที่รู้จัก\" อิบนุหะญัรแย้งว่า การไม่รู้ไม่ได้หมายความว่าไม่มี และการไม่ถูกต้องไม่ได้หมายความว่าอ่อน เพราะอาจหมายถึงไม่ถึงระดับศ่อฮีห์ จึงไม่ปฏิเสธระดับหะซัน และการปฏิเสธทีละหะดีษไม่ได้หมายถึงปฏิเสธเมื่อรวมกัน อัลอะษร็อมถามอะห์มัด เขาตอบว่า \"สิ่งที่ดีที่สุดคือหะดีษของรุบัยห์ จากอบูสะอีด\" ซึ่งไม่ขัดกัน เพราะอันนะวะวีย์กล่าวว่า คำว่า \"ถูกต้องที่สุดในบทนี้\" ไม่ได้หมายความว่าหะดีษศ่อฮีห์ แต่หมายถึงมีน้ำหนักที่สุดหรืออ่อนน้อยที่สุด อิสหาก บินรอฮะวัยฮ์ก็ว่าหะดีษนี้ถูกต้องที่สุดในบท", "ในเรื่องนี้ยังมีหะดีษอื่น ซึ่งสายรายงานล้วนมีข้อวิจารณ์ แต่บางหะดีษเสริมกัน อัลมุนซิรีย์กล่าวว่า \"ไม่ต้องสงสัยว่าหะดีษเรื่องการกล่าวบิสมิลลาฮ์ แม้ไม่มีหะดีษใดพ้นจากข้อวิจารณ์ ก็เสริมกันด้วยสายที่มาก และมีความแข็งแรง\" อิบนุหะญัรว่า \"ที่ชัดคือหะดีษทั้งหมดรวมกันมีความแข็งแรง บ่งว่ามีที่มา\" อิบนุกะษีรว่า \"รายงานจากหลายสายที่เสริมกัน จึงเป็นหะดีษหะซันหรือศ่อฮีห์\" และอิบนุลก็อยยิมว่า \"หะดีษเรื่องการกล่าวบิสมิลลาฮ์ในวุฎูอ์เป็นหะดีษหะซัน\""]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظها", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ไม่มีละหมาดสำหรับผู้ที่ไม่มีวุฎูอ์\" คำว่า \"ไม่\" ปฏิเสธทั้งประเภท ความหมายคือ ไม่มีละหมาดที่ใช้ได้สำหรับผู้ไม่มีวุฎูอ์ เพราะวุฎูอ์เป็นเงื่อนไขของละหมาดที่ใช้ได้โดยอิจญ์มาอ์ของมุสลิม", "\"และไม่มีวุฎูอ์\" ความหมายคือ ไม่มีวุฎูอ์ที่ใช้ได้ หรือที่สมบูรณ์ คำนี้เป็นการปฏิเสธความสมบูรณ์หรือความใช้ได้ เพราะการปฏิเสธตัวการกระทำเป็นไปไม่ได้ ผู้ที่อาบน้ำละหมาดโดยไม่กล่าวพระนามอัลลอฮ์ก็ถือว่าอาบแล้วจริง เพราะการกระทำของวุฎูอ์เกิดขึ้นแล้ว", "หะนะฟีย์ถือว่าตัวบทลักษณะนี้คลุมเครือ (มุจมัล) ความหมายไม่ชัด เพราะอาจหมายถึงทั้งปฏิเสธความใช้ได้หรือปฏิเสธความสมบูรณ์ นักวิชาการส่วนใหญ่ว่า เมื่อการปฏิเสธมุ่งไปที่ความหมายทางศาสนา (เพราะถ้อยคำมาในภาษาศาสนา) ก็ไม่ถือว่าคลุมเครือ แต่ตีความตามจุดประสงค์ เพราะหลักเดิมคือใช้หลักฐานศาสนา และศาสนาไม่ได้พูดด้วยถ้อยคำเหล่านี้นอกจากต้องการให้มีหุก่มตามมา", "หลักเดิมของการปฏิเสธในตัวบทศาสนาคือปฏิเสธความใช้ได้ เพราะมาก่อนการปฏิเสธความสมบูรณ์ เว้นแต่มีหลักฐานว่าหมายถึงความสมบูรณ์ ก็ปฏิบัติตามนั้น ซึ่งในที่นี้เป็นเช่นนั้น เพราะถ้าตีความว่าปฏิเสธความใช้ได้ จะขัดกับหะดีษศ่อฮีห์ (ดังจะกล่าว) แต่ถ้าตีความว่าปฏิเสธความสมบูรณ์ ก็สอดคล้องกับหะดีษศ่อฮีห์ จึงตีความเช่นนั้น เพื่อให้ตัวบทสอดคล้องกันและไม่ขัดกัน", "\"พระนามของอัลลอฮ์\" คือการกล่าวบิสมิลลาฮ์ในวุฎูอ์ โดยกล่าวว่า \"บิสมิลลาฮ์\" คำอื่นใช้แทนไม่ได้ ตำแหน่งของมันคือหลังการตั้งเจตนา ก่อนการกระทำทั้งหมดของการชำระ ที่ต้องการคือกล่าวเพียง \"บิสมิลลาฮ์\" ส่วนการเพิ่ม \"อัรเราะห์มานิรเราะฮีม\" นักนิติศาสตร์กลุ่มหนึ่งเห็นเช่นนั้น ที่ชัดคือเป็นการเห็นว่าดีเอง (อิสติห์สาน) และไม่มีหลักฐาน การกล่าวตามที่มีรายงานจากท่านรสูลุลลอฮ์ ﷺ จึงดีกว่าและประเสริฐกว่า"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "บิสมิลลาฮ์ในวุฎูอ์: วาญิบหรือสุนัต", "points_th": ["ตามรูปคำ หะดีษบ่งว่าการกล่าวบิสมิลลาฮ์ในวุฎูอ์เป็นวาญิบ ตามหลักว่าการปฏิเสธหมายถึงปฏิเสธความใช้ได้ เพราะใกล้กับการปฏิเสธตัวการกระทำมากกว่า ความหมายคือ ไม่มีวุฎูอ์ที่ใช้ได้สำหรับผู้ไม่กล่าวพระนามของอัลลอฮ์ เป็นทัศนะของซอฮิรียะฮ์ อีกรายงานจากอิมามอะห์มัดที่ศิษย์บางท่านเลือก และทัศนะของอิสหาก แต่พวกเขาต่างกันว่าความเป็นวาญิบตกไปเมื่อลืมหรือไม่", "ทัศนะที่สอง: การกล่าวบิสมิลลาฮ์เป็นสุนัต เป็นทัศนะของนักวิชาการส่วนใหญ่ รวมถึงอิมามทั้งสาม และอีกรายงานจากอะห์มัด อัลคิร็อกีย์และอบูมุหัมมัด อิบนุกุดามะฮ์เลือก นักวิชาการหันบะลีย์กลุ่มหนึ่งระบุว่าเป็นมัซฮับที่คำของอะห์มัดมาลงตัว อิบนุลมุนซิร อบูอุบัยด์ อิบนุหัซม์ และอิบนุกะษีรว่ามีน้ำหนัก มุหัมมัด บินอิบรอฮีม และอิบนุบาซเลือก", "หลักฐานของทัศนะที่สอง (1) อายะฮ์ \"โอ้บรรดาผู้ศรัทธา เมื่อพวกเจ้าลุกขึ้นไปละหมาด จงล้างหน้า...\" อัลลอฮ์สั่งให้ล้าง ไม่ได้สั่งให้กล่าวบิสมิลลาฮ์ ถ้าเป็นวาญิบ ก็คงสั่ง เหมือนที่สั่งในการล่าสัตว์ \"และจงกล่าวพระนามของอัลลอฮ์บนมัน\" (อัลมาอิดะฮ์: 4) และในการเชือด \"ดังนั้นจงกล่าวพระนามของอัลลอฮ์บนมัน ขณะที่พวกมันยืนเรียงแถว\" (อัลหัจญ์: 36) อบูซุรอะฮ์ อัดดิมัชกีย์ถามอะห์มัดว่า คำว่า \"ไม่มีวุฎูอ์สำหรับผู้ที่ไม่กล่าวพระนามของอัลลอฮ์\" หมายความว่าอย่างไร เขาตอบว่า \"มีหลายหะดีษ แต่ไม่แข็งแรง อัลลอฮ์ตรัสว่า 'เมื่อพวกเจ้าลุกขึ้นไปละหมาด' พระองค์ไม่ได้บังคับให้กล่าวบิสมิลลาฮ์ และนี่คือสิ่งที่ประทานลงมา และซุนนะฮ์ไม่ได้ยืนยัน\"", "(2) หะดีษริฟาอะฮ์ บินรอฟิอ์ เรื่องผู้ที่ละหมาดไม่ดี: \"จงอาบน้ำละหมาดตามที่อัลลอฮ์ทรงสั่งท่าน\" (อบูดาวูด หะดีษอยู่ในเศาะฮีหัยน์แต่ไม่มีประโยคนี้) ท่านนบี ﷺ ส่งเขาไปยังวิธีอาบน้ำละหมาดตามอายะฮ์ ซึ่งไม่มีการกล่าวบิสมิลลาฮ์ (3) เศาะหาบะฮ์อธิบายวุฎูอ์ของท่านนบี ﷺ อย่างสมบูรณ์ (กล่าวไปแล้ว) ไม่มีใครกล่าวว่าท่านกล่าวบิสมิลลาฮ์ตอนเริ่ม ถ้าเป็นวาญิบ ท่านคงไม่ละไว้", "ผู้แต่งเห็นว่าทัศนะนี้มีน้ำหนัก อินชาอัลลอฮ์ คือการกล่าวบิสมิลลาฮ์เป็นสุนัต ควรทำในการอาบน้ำละหมาดและเป็นสุนัตที่หนักแน่น ไม่ควรละไว้โดยตั้งใจ ถ้าละไว้ วุฎูอ์ใช้ได้ อิมามแห่งซุนนะฮ์ อะห์มัด บินหันบัล ก็ฟัตวาเช่นนี้ อบูดาวูดถามอะห์มัดเรื่องการกล่าวบิสมิลลาฮ์ในวุฎูอ์ เขาตอบว่า \"ฉันหวังว่าจะไม่มีอะไรต่อเขา แต่ฉันไม่ชอบให้เขาละไว้ ไม่ว่าจะพลาดหรือตั้งใจ และหะดีษในเรื่องนี้ไม่มีสายรายงาน (ที่ถูกต้อง)\"", "ส่วนหลักฐานของฝ่ายวาญิบไม่แข็งแรงพอ ด้านสายรายงาน อย่างมากที่สุดก็ถึงระดับหะซันลิฆ็อยริฮี เพราะเสริมกันและรวมกัน และยังขัดกับหะดีษที่ถูกต้องกว่าที่อัลบุคอรีย์และมุสลิมบันทึกตรงกันเรื่องวิธีอาบน้ำละหมาดของท่านนบี ﷺ ประกอบกับความหมายของอายะฮ์ หลักคือ เมื่อหะซันขัดกับศ่อฮีห์ ให้ยึดศ่อฮีห์ นี่เป็นประโยชน์หนึ่งของการแบ่งหะดีษเป็นศ่อฮีห์และหะซัน ด้านตัวบท คำว่า \"ไม่มีวุฎูอ์\" ตีความว่าปฏิเสธความสมบูรณ์ ไม่ใช่ความใช้ได้ ดังที่กล่าวมา"]}], "tags_th": ["บิสมิลลาฮ์", "วุฎูอ์", "สุนัต", "หะซันลิฆ็อยริฮี", "หะดีษอ่อน"]}, {"id": "v1-h052-054", "volume": 1, "bab": "wudu", "topic_ar": "كيفية المضمضة والاستنشاق", "topic_th": "วิธีบ้วนปากและสูดน้ำเข้าจมูก", "pages": [225, 230], "hadith": [{"no": 52, "matn_ar": "عَنْ طَلْحَةَ بْنِ مُصَرِّفٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ قَالَ: رَأَيْتُ رَسُولَ اللهِ ﷺ يَفْصِلُ بَيْنَ الْمَضْمَضَةِ وَالِاسْتِنْشَاقِ. أَخْرَجَهُ أَبُو دَاوُدَ بِإِسْنَادٍ ضَعِيفٍ.", "translation_th": "จากฏ็อลหะฮ์ บินมุศ็อรริฟ จากบิดา จากปู่ของเขา กล่าวว่า ฉันเห็นท่านรสูลุลลอฮ์ ﷺ แยกระหว่างการบ้วนปากกับการสูดน้ำเข้าจมูก บันทึกโดยอบูดาวูด ด้วยสายรายงานที่อ่อน", "grade_th": "ฎออีฟ (อ่อน)"}, {"no": 53, "matn_ar": "عَنْ عَلِيٍّ رَضِيَ اللهُ عَنْهُ - فِي صِفَةِ الْوُضُوءِ -: ثُمَّ تَمَضْمَضَ ﷺ وَاسْتَنْثَرَ ثَلَاثًا، يُمَضْمِضُ وَيَنْثُرُ مِنَ الْكَفِّ الَّذِي يَأْخُذُ مِنْهُ الْمَاءَ. أَخْرَجَهُ أَبُو دَاوُدَ وَالنَّسَائِيُّ.", "translation_th": "จากอะลี (ร.ฎ.) เกี่ยวกับวิธีอาบน้ำละหมาด กล่าวว่า แล้วท่านนบี ﷺ บ้วนปากและสั่งน้ำออกจากจมูกสามครั้ง ท่านบ้วนปากและสั่งน้ำออกจากฝ่ามือที่ท่านตักน้ำนั้น บันทึกโดยอบูดาวูดและอันนะสาอีย์", "grade_th": "ศ่อฮีห์"}, {"no": 54, "matn_ar": "عَنْ عَبْدِ اللهِ بْنِ زَيْدٍ رَضِيَ اللهُ عَنْهُ - فِي صِفَةِ الْوُضُوءِ -: ثُمَّ أَدْخَلَ ﷺ يَدَهُ، فَمَضْمَضَ وَاسْتَنْشَقَ مِنْ كَفٍّ وَاحِدَةٍ، يَفْعَلُ ذَلِكَ ثَلَاثًا. مُتَّفَقٌ عَلَيْهِ.", "translation_th": "จากอับดุลลอฮ์ บินซัยด์ (ร.ฎ.) เกี่ยวกับวิธีอาบน้ำละหมาด กล่าวว่า แล้วท่านนบี ﷺ สอดมือลงไป แล้วบ้วนปากและสูดน้ำเข้าจมูกจากฝ่ามือเดียว ท่านทำเช่นนั้นสามครั้ง บันทึกโดยอัลบุคอรีย์และมุสลิม", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["วิธีที่มีน้ำหนัก (ผู้แต่งและอันนะวะวีย์): บ้วนปากและสูดน้ำเข้าจมูกด้วยน้ำกอบเดียว ทำเช่นนี้สามครั้ง รวมสามกอบ ตามหะดีษอับดุลลอฮ์ บินซัยด์ในเศาะฮีหัยน์", "การแยกบ้วนปากและสูดน้ำเข้าจมูก (หกกอบ) มาจากหะดีษฏ็อลหะฮ์ซึ่งอ่อน ใช้เป็นหลักฐานไม่ได้", "อีกวิธีคือบ้วนปากและสูดน้ำเข้าจมูกสามครั้งด้วยน้ำกอบเดียว แต่ในทางปฏิบัติอาจทำได้ยาก", "อัศศ็อนอานีย์เห็นว่าเลือกได้ และทุกแบบเป็นซุนนะฮ์ แม้รายงานแบบรวมจะมากกว่าและถูกต้องกว่า"], "vocab": [{"ar": "يَفْصِلُ", "th": "แยก คือตักน้ำบ้วนปากต่างหาก แล้วตักน้ำสูดเข้าจมูกต่างหาก"}, {"ar": "مِنْ كَفٍّ وَاحِدَةٍ", "th": "จากน้ำกอบเดียว ใช้ทั้งบ้วนปากและสูดน้ำเข้าจมูก"}, {"ar": "أَيْش", "th": "คำย่อของ أَيُّ شَيْءٍ (อะไร) ใช้ในความหมายตำหนิว่า \"ไม่มีค่าอะไร\""}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["ฏ็อลหะฮ์ บินมุศ็อรริฟ บินกะอ์บ อัลยามีย์ อัลฮัมดานีย์ ชาวกูฟะฮ์ กุนยะฮ์ อบูมุหัมมัด หรืออบูอับดิลลาฮ์ ตาบิอีนผู้มีชื่อเสียงและแม่นยำ ได้รับฉายาว่า \"ผู้นำของนักอ่านอัลกุรอาน\" เชื่อถือได้ และเป็นผู้รายงานของอัลบุคอรีย์และมุสลิม อิบนุหะญัรว่า \"เชื่อถือได้ นักอ่าน ผู้ประเสริฐ\"", "บิดาของเขาคือมุศ็อรริฟ บินอัมร์ บินกะอ์บ ตามที่อิบนุลก็อฏฏอนระบุ บ้างว่าบินกะอ์บ บินอัมร์ ชาวกูฟะฮ์ เขารายงานจากบิดาเรื่องการเช็ดศีรษะของท่านนบี ﷺ ในอบูดาวูด และฏ็อลหะฮ์ลูกชายรายงานจากเขา ส่วนปู่ของฏ็อลหะฮ์ คืออัมร์ บินกะอ์บ หรือกะอ์บ บินอัมร์ มีความเห็นต่างว่าเป็นเศาะหาบะฮ์หรือไม่ นักหะดีษส่วนใหญ่ว่าเป็น อิบนุอับดิลบัรร์ว่า \"เขาเป็นเศาะหาบะฮ์ บางคนปฏิเสธ แต่ไม่มีเหตุผลที่จะปฏิเสธ\"", "นักวิชาการส่วนใหญ่ว่าบิดาของฏ็อลหะฮ์ คือมุศ็อรริฟ ไม่เป็นที่รู้จัก ตามที่อิบนุลก็อฏฏอนกล่าว อบูดาวูดเล่าว่า ได้ยินอะห์มัดกล่าวว่า อิบนุอุยัยนะฮ์ปฏิเสธหะดีษนี้ และกล่าวว่า \"ฏ็อลหะฮ์ จากบิดา จากปู่ นี่อะไรกัน\" (คือสายรายงานนี้ไม่มีค่า) เพราะฏ็อลหะฮ์รายงานจากบิดาและปู่ ซึ่งไม่เป็นที่รู้จัก อุษมาน อัดดาริมีย์ยกจากอะลี บินอัลมะดีนีย์เช่นกัน และอะห์มัดถูกถามว่าปู่ของฏ็อลหะฮ์เป็นเศาะหาบะฮ์หรือไม่ เขาตอบว่า \"ฉันไม่รู้ และได้ยินว่าสุฟยาน บินอุยัยนะฮ์ปฏิเสธว่าเขาเป็นเศาะหาบะฮ์\""]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجها", "heading_th": "ที่มาของหะดีษทั้งสาม", "points_th": ["หะดีษฏ็อลหะฮ์: อบูดาวูดบันทึก (139) ผ่านมุอ์ตะมิร บินสุลัยมาน ว่า ฉันได้ยินลัยษ์เล่าจากฏ็อลหะฮ์ จากบิดา จากปู่ ว่า \"ฉันเข้าไปหาท่านนบี ﷺ ขณะที่ท่านกำลังอาบน้ำละหมาด และน้ำไหลจากหน้าและเคราของท่านลงบนอก ฉันเห็นท่านแยกระหว่างการบ้วนปากกับการสูดน้ำเข้าจมูก\" อบูดาวูดไม่ได้วิจารณ์ สายรายงานอ่อนด้วยสองเหตุ", "เหตุแรก: มาจากลัยษ์ บินอบีสุลัยม์ ซึ่งนักวิชาการส่วนใหญ่ว่าอ่อน อันนะวะวีย์ถึงกับรายงานว่านักวิชาการเห็นพ้องว่าเขาอ่อน อิบนุลมุลักกินว่า \"มีข้อพิจารณา\" ยะห์ยา บินมะอีนและอันนะสาอีย์ว่าอ่อน อะห์มัดว่า \"หะดีษของเขาสับสน แต่คนก็รายงานจากเขา\" อิบนุหิบบานว่า \"เขาเป็นผู้ทำอิบาดะฮ์ แต่ความจำสับสนในบั้นปลาย จนไม่รู้ว่ากำลังเล่าอะไร สลับสายรายงาน ยกรายงานมุรสัลเป็นมัรฟูอ์ และนำสิ่งที่ไม่ใช่หะดีษมาพาดพิงผู้เชื่อถือได้\" อิบนุหะญัรว่า \"สัจจริง ความจำสับสนมาก และแยกหะดีษไม่ออก จึงถูกทิ้ง\" สรุปคือรายงานของเขาถูกปฏิเสธเพราะความจำสับสน และแยกไม่ได้ว่ารายงานใดก่อนหรือหลังสับสน", "เหตุที่สอง: ข้อขัดแย้งเรื่องบิดาและปู่ของฏ็อลหะฮ์ อิบนุอบีหาติมกล่าวว่า \"ฉันถามบิดาเรื่องหะดีษนี้ เขาไม่ยืนยัน และกล่าวว่า มีคนบอกว่าฏ็อลหะฮ์คนนี้เป็นชาวอันศอร บ้างว่าคือฏ็อลหะฮ์ บินมุศ็อรริฟ ถ้าเป็นฏ็อลหะฮ์ บินมุศ็อรริฟจริง ก็คงไม่มีข้อขัดแย้ง\" อบูซุรอะฮ์ว่า \"ฉันไม่รู้ว่ามีใครระบุชื่อบิดาของฏ็อลหะฮ์ เพียงแต่บางคนว่าอิบนุมุศ็อรริฟ\" สรุปคือสายรายงานนี้มีข้อขัดแย้ง นักวิชาการส่วนใหญ่ว่าไม่ถูกต้อง และอิบนุบาซเลือกเช่นนั้น", "หะดีษอะลี: อบูดาวูด (111) บันทึกแบบยาว และอันนะสาอีย์ (ที่มากล่าวไปแล้วในหะดีษที่ 34) อิบนุหะญัรยกไว้สองแห่ง ตามประเด็นที่ต้องการใช้เป็นหลักฐาน", "หะดีษอับดุลลอฮ์ บินซัยด์: อัลบุคอรีย์ (186) และมุสลิม (235) (ที่มากล่าวไปแล้ว คือหะดีษที่ 35) สำนวนนี้ทั้งสองบันทึกผ่านคอลิด บินอับดิลลาฮ์ อัฏเฏาะห์ฮาน จากอัมร์ บินยะห์ยา บินอุมาเราะฮ์ จากบิดา จากอับดุลลอฮ์ บินซัยด์ อัลบุคอรีย์ตั้งชื่อบทว่า \"บทผู้ที่บ้วนปากและสูดน้ำเข้าจมูกจากน้ำกอบเดียว\" (191)"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "สามวิธีของการบ้วนปากและสูดน้ำเข้าจมูก", "points_th": ["วิธีที่หนึ่ง: แยกการบ้วนปากกับการสูดน้ำเข้าจมูก แต่ละอย่างใช้น้ำต่างหาก บ้วนปากสามครั้งด้วยน้ำสามกอบ สูดน้ำเข้าจมูกสามครั้งด้วยน้ำสามกอบ รวมหกกอบ เพื่อให้วุฎูอ์ทั่วถึงกว่า หลักฐานคือหะดีษฏ็อลหะฮ์ ซึ่งอ่อนและใช้เป็นหลักฐานไม่ได้ (แต่มีรายงานที่สนับสนุน ดังจะกล่าว) นักนิติศาสตร์หะนะฟีย์และชาฟิอีย์ส่วนใหญ่เห็นเช่นนี้ และเป็นอีกรายงานจากมาลิกและอะห์มัด อิบนุลมุลักกินกล่าวว่า การแยกยังรวมถึงการตักน้ำหนึ่งกอบบ้วนปากสามครั้ง และอีกกอบสูดน้ำเข้าจมูกสามครั้ง", "วิธีที่สอง: บ้วนปากและสูดน้ำเข้าจมูกสามครั้งจากน้ำกอบเดียว เพื่อประหยัดน้ำ และเพราะปากกับจมูกเป็นส่วนของอวัยวะเดียวคือใบหน้า หลักฐานคือหะดีษอะลี \"ท่านบ้วนปากและสั่งน้ำออกสามครั้ง ท่านบ้วนปากและสั่งน้ำออกจากฝ่ามือที่ท่านตักน้ำนั้น\" แต่ไม่ชัดเจน เพราะอาจหมายความว่าท่านตักน้ำหนึ่งกอบ บ้วนปากและสั่งน้ำออก แล้วตักอีกกอบ... ทำเช่นนี้สามครั้ง ซึ่งน่าจะใกล้ที่สุด เพื่อให้สอดคล้องกับหะดีษอับดุลลอฮ์ บินซัยด์ อีกทั้งวิธีนี้อาจทำได้ยาก เพราะยากที่น้ำจะเหลือในฝ่ามือพอให้บ้วนปากสามครั้งและสูดน้ำเข้าจมูกสามครั้ง", "วิธีที่สาม: บ้วนปากและสูดน้ำเข้าจมูกจากน้ำกอบเดียว ด้วยน้ำสามกอบ หลักฐานคือหะดีษอับดุลลอฮ์ บินซัยด์ในเศาะฮีหัยน์ \"ท่านบ้วนปาก สูดน้ำเข้าจมูก และสั่งน้ำออก ด้วยน้ำสามกอบ\" และอีกรายงาน \"ท่านบ้วนปากและสูดน้ำเข้าจมูกจากน้ำกอบเดียว ทำเช่นนั้นสามครั้ง\" เป็นทัศนะใหม่ของอัชชาฟิอีย์ อีกรายงานจากมาลิกที่อัลกอฎี อิยาฎระบุ และอีกรายงานจากอะห์มัดที่เขาระบุชัด อัลอะษร็อมกล่าวว่า ได้ยินอบูอับดิลลาฮ์ (อะห์มัด) ถูกถามว่า แบบไหนท่านชอบกว่า บ้วนปากและสูดน้ำเข้าจมูกด้วยกอบเดียว หรือแยกกัน เขาตอบว่า \"ด้วยกอบเดียว\"", "ผู้แต่งเห็นว่าวิธีที่มีน้ำหนักคือวิธีสุดท้าย เพราะมีในหะดีษอับดุลลอฮ์ บินซัยด์ในเศาะฮีหัยน์ และหะดีษอะลีก็ตีความไปทางนี้ได้ อันนะวะวีย์ก็ว่ามีน้ำหนัก ส่วนรายงานการแยกอ่อน เพราะหะดีษฏ็อลหะฮ์อ่อน", "แต่อิบนุลมุลักกินและผู้แต่งอาวนุลมะอ์บูดระบุว่า อบูอะลี บินอัสสะกัน (นักหะดีษผู้เชี่ยวชาญ) รายงานในสุนันของเขา ผ่านอบูวาอิล ชะกีก บินสะละมะฮ์ ว่า \"ฉันเห็นอะลี บินอบีฏอลิบและอุษมาน บินอัฟฟานอาบน้ำละหมาดสามครั้ง ๆ และแยกการบ้วนปากกับการสูดน้ำเข้าจมูก แล้วทั้งสองกล่าวว่า อย่างนี้แหละที่เราเห็นท่านรสูลุลลอฮ์ ﷺ อาบน้ำละหมาด\" แล้วกล่าวว่า \"มีรายงานจากทั้งสองหลายสาย\" ซึ่งชัดเจนว่าแยก ชะกีกเชื่อถือได้ นักบันทึกทั้งหกบันทึกหะดีษของเขา เขาทันยุคท่านนบี ﷺ แต่ไม่ได้เห็นท่าน และรายงานจากเคาะลีฟะฮ์ทั้งสี่และเศาะหาบะฮ์หลายคน", "และมีรายงานผ่านอุษมาน บินอับดิรเราะห์มาน อัตตัยมีย์ ว่า อิบนุอบีมุลัยกะฮ์ถูกถามเรื่องวุฎูอ์ เขาตอบว่า \"ฉันเห็นอุษมาน บินอัฟฟานถูกถามเรื่องวุฎูอ์ เขาขอน้ำมา... เทลงบนมือขวา แล้วสอดมือลงไปในน้ำ แล้วบ้วนปากสามครั้ง และสั่งน้ำออกสามครั้ง...\" (อบูดาวูด) ตามรูปคำ เขาตักน้ำบ้วนปากต่างหาก และน้ำสูดเข้าจมูกต่างหาก เพราะการสั่งน้ำออกต้องมีการสูดน้ำเข้าก่อน", "อัศศ็อนอานีย์กล่าวว่า \"เมื่อมีทั้งสองรายงาน คือรวมและไม่รวม ที่ใกล้ที่สุดคือให้เลือก และทั้งหมดเป็นซุนนะฮ์ แม้รายงานแบบรวมจะมากกว่าและถูกต้องกว่า\""]}], "tags_th": ["บ้วนปาก", "สูดน้ำเข้าจมูก", "วุฎูอ์", "หะดีษอ่อน"]}, {"id": "v1-h055", "volume": 1, "bab": "wudu", "topic_ar": "حكم الموالاة في الوضوء", "topic_th": "หุก่มความต่อเนื่องในการอาบน้ำละหมาด", "pages": [231, 236], "hadith": [{"no": 55, "matn_ar": "عَنْ أَنَسٍ رَضِيَ اللهُ عَنْهُ قَالَ: رَأَى النَّبِيُّ ﷺ رَجُلًا، وَفِي قَدَمِهِ مِثْلُ الظُّفُرِ لَمْ يُصِبْهُ الْمَاءُ، فَقَالَ: «ارْجِعْ فَأَحْسِنْ وُضُوءَكَ». أَخْرَجَهُ أَبُو دَاوُدَ، وَالنَّسَائِيُّ.", "translation_th": "จากอนัส (ร.ฎ.) กล่าวว่า ท่านนบี ﷺ เห็นชายคนหนึ่ง ที่เท้าของเขามีที่ขนาดเท่าเล็บที่น้ำไม่ถึง ท่านจึงกล่าวว่า \"จงกลับไปอาบน้ำละหมาดให้ดี\" บันทึกโดยอบูดาวูดและอันนะสาอีย์", "grade_th": "เฆาะรีบ (ญะรีร บินหาซิม รายงานคนเดียวจากเกาะตาดะฮ์) แต่มีหลักฐานสนับสนุนจากมุสลิม"}], "key_rulings_th": ["ต้องล้างให้ทั่วทุกส่วนของอวัยวะวุฎูอ์ ผู้ที่เว้นส่วนใดไว้แม้น้อย วุฎูอ์ใช้ไม่ได้", "ต้องขจัดสิ่งที่กันน้ำไม่ให้ถึงผิวหนัง เช่น แป้ง ปูน ยาง รวมถึงยาทาเล็บที่สตรีใช้", "ผู้แต่งเห็นว่าทัศนะที่มีน้ำหนักคือ ความต่อเนื่อง (มุวาลาต) เป็นฟัรฎูเมื่อจำได้และทำได้ แต่ตกไปเมื่อลืมหรือมีเหตุ เช่น น้ำไม่พอ (ทัศนะของมาลิก และอิบนุตัยมียะฮ์เลือก)", "ความต่อเนื่องคือล้างอวัยวะถัดไปก่อนอวัยวะก่อนหน้าจะแห้ง ในสภาพอากาศปกติ การทำสุนัตหรือขจัดสิ่งที่ติดอยู่ระหว่างนั้นไม่ทำให้ขาดความต่อเนื่อง", "ถ้ารู้ทันทีว่ามีส่วนที่น้ำไม่ถึง ให้ล้างส่วนนั้นแล้วล้างอวัยวะที่ตามมาให้เรียงลำดับ", "ส่งเสริมให้ทักท้วงพี่น้องที่บกพร่องหรือพลาดในสิ่งวาญิบ เพื่อให้อิบาดะฮ์ของเขาถูกต้อง"], "vocab": [{"ar": "الظُّفُر", "th": "เล็บ อ่านสระอุทั้งสองตัว หรือสระอุแล้วสุกูน หรือสระอิ พหูพจน์คือ أَظْفَار"}, {"ar": "ارْجِعْ فَأَحْسِنْ وُضُوءَكَ", "th": "จงกลับไปทำวุฎูอ์ให้สมบูรณ์ อาจหมายถึงล้างส่วนที่เหลือ หรือเริ่มวุฎูอ์ใหม่"}, {"ar": "الْمُوَالَاة", "th": "ความต่อเนื่อง คือล้างอวัยวะต่อกันโดยไม่ทิ้งช่วงจนอวัยวะก่อนหน้าแห้ง"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อบูดาวูดบันทึกในหมวดฏอฮาเราะฮ์ บทการแยกวุฎูอ์ (173) ผ่านอิบนุวะฮ์บ จากญะรีร บินหาซิม ว่าได้ยินเกาะตาดะฮ์ บินดิอามะฮ์ เล่าว่าอนัส บินมาลิกเล่าว่า ชายคนหนึ่งมาหาท่านนบี ﷺ หลังอาบน้ำละหมาด โดยเหลือที่ขนาดเท่าเล็บบนเท้า ท่านนบี ﷺ กล่าวว่า \"จงกลับไปอาบน้ำละหมาดให้ดี\" อบูดาวูดกล่าวว่า \"หะดีษนี้ไม่เป็นที่รู้จักจากญะรีร บินหาซิม และมีเพียงอิบนุวะฮ์บที่รายงาน\" ซึ่งเป็นการชี้ข้อบกพร่อง อัดดารุกุฏนีย์ก็กล่าวว่า ญะรีร บินหาซิมรายงานคนเดียวจากเกาะตาดะฮ์ เขาเชื่อถือได้ และมีเพียงอิบนุวะฮ์บที่รายงานจากเขา", "หะดีษจึงเป็นเฆาะรีบ เพราะมีแค่ญะรีรที่รายงานจากเกาะตาดะฮ์ และแค่อิบนุวะฮ์บที่รายงานจากญะรีร การรายงานคนเดียวของญะรีรถือเป็นข้อบกพร่อง เพราะแม้เชื่อถือได้ แต่เขารายงานหะดีษมุงกัรจากเกาะตาดะฮ์ อิบนุอะดีย์กล่าวว่า \"ญะรีรมีหะดีษมากจากอาจารย์ หะดีษของเขาตรง น่าพอใจ ยกเว้นรายงานจากเกาะตาดะฮ์ เพราะเขารายงานสิ่งที่คนอื่นไม่ได้รายงาน\"", "ผู้แต่งไม่พบหะดีษนี้ในสุนันอันนะสาอีย์ และอัลมิซซีย์พาดพิงถึงอบูดาวูดเท่านั้น จึงดูเหมือนอิบนุหะญัรพลาดที่พาดพิงถึงอันนะสาอีย์ อิบนุมาญะฮ์ (655) และอะห์มัดก็บันทึกด้วย", "หลักฐานสนับสนุน: ญาบิรเล่าว่า อุมัร บินอัลค็อฏฏอบเล่าว่า ชายคนหนึ่งอาบน้ำละหมาดแล้วเหลือที่ขนาดเท่าเล็บบนเท้า ท่านนบี ﷺ เห็นจึงกล่าวว่า \"จงกลับไปอาบน้ำละหมาดให้ดี\" เขาจึงกลับไปแล้วละหมาด (มุสลิม 243 อบูดาวูด 173) และผ่านบะกียะฮ์ บินอัลวะลีด จากบะหีร บินสะอ์ด์ จากคอลิด บินมะอ์ดาน จากเศาะหาบะฮ์บางท่านว่า ท่านนบี ﷺ เห็นชายคนหนึ่งละหมาด ที่หลังเท้ามีจุดขนาดเท่าเหรียญดิรฮัมที่น้ำไม่ถึง ท่านจึงสั่งให้เขาอาบน้ำละหมาดและละหมาดใหม่ (อบูดาวูด อะห์มัด) อัลอะษร็อมถามอะห์มัดว่า สายรายงานนี้ดีไหม เขาตอบว่า \"ใช่\"", "อัตติรมิซีย์ชี้ข้อบกพร่องว่าบะกียะฮ์เป็นมุดัลลิส และรายงานด้วยคำว่า \"จาก\" (อันอะนะฮ์) จากบะหีร อิบนุลก็อยยิมตอบว่าบะกียะฮ์ระบุชัดว่าได้ยินในรายงานของอะห์มัด ผู้แต่งเห็นว่าข้อนี้มีข้อพิจารณา เพราะบะกียะฮ์ระบุชัดว่าได้ยินจากอาจารย์ แต่ใช้คำว่า \"จาก\" ในระดับอาจารย์ของอาจารย์ ซึ่งไม่ยอมรับจากผู้ที่ตัดลีสแบบตัสวิยะฮ์ (ตัดผู้รายงานอ่อนในช่วงกลางสายออก) อย่างบะกียะฮ์"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"เท่าเล็บ\" (ซุฟุร) อ่านสระอุทั้งสองตัว ดังในอัลกุรอาน \"และสำหรับบรรดาผู้ที่เป็นยิว เราได้ห้ามสัตว์ที่มีเล็บทุกชนิด\" (อัลอันอาม: 146) อ่านสุกูนที่อักษรฟาอ์ หรือสระอิทั้งสองตัวก็ได้ พหูพจน์คือ อัซฟาร", "\"จงกลับไปอาบน้ำละหมาดให้ดี\" คือทำให้ครบถ้วนสมบูรณ์ที่สุด จึงเป็นคำสั่งให้ล้างส่วนที่ขาด หรืออาจหมายถึงเริ่มวุฎูอ์ใหม่ตั้งแต่ต้น อัลค็อฏฏอบีย์กล่าวว่า \"นี่คือความหมายตามรูปคำ\" สนับสนุนด้วยหะดีษอิบนุมะอ์ดานที่ว่า \"ท่านสั่งให้เขาอาบน้ำละหมาดและละหมาดใหม่\""]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "ต้องล้างให้ทั่วทุกส่วน", "points_th": ["นักวิชาการใช้หะดีษนี้เป็นหลักฐานว่าต้องล้างให้ทั่วทุกส่วนของอวัยวะวุฎูอ์ ผู้ที่เว้นส่วนใดไว้ แม้น้อย วุฎูอ์ใช้ไม่ได้ เพราะท่านนบี ﷺ สั่งผู้ที่มีที่ขนาดเท่าเล็บที่น้ำไม่ถึงให้อาบน้ำละหมาดให้ดีและครบถ้วน หะดีษระบุชัดเรื่องเท้า และอวัยวะอื่นก็เทียบได้", "หะดีษอบูฮุร็อยเราะฮ์ว่า ท่านนบี ﷺ เห็นชายคนหนึ่งไม่ล้างส้นเท้า ท่านกล่าวว่า \"ความวิบัติแก่ส้นเท้าทั้งหลายจากไฟนรก\" และในอีกสำนวน \"จงอาบน้ำละหมาดให้ทั่ว เพราะอบุลกอสิม ﷺ กล่าวว่า ความวิบัติแก่ส้นเท้าทั้งหลายจากไฟนรก\" (อัลบุคอรีย์ มุสลิม)"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "ขจัดสิ่งที่กันน้ำ", "points_th": ["หะดีษเป็นหลักฐานว่าต้องขจัดสิ่งที่กันน้ำไม่ให้ถึงผิวหนัง เช่น แป้ง ปูน หรือยางเหนียวอย่างกาว เพราะน้ำเข้าไม่ถึงข้างใต้ ส่วนนั้นจึงยังไม่ได้ล้าง และการชำระก็ไม่สมบูรณ์", "รวมถึงสิ่งที่สตรีทาเล็บ ที่เรียกว่ายาทาเล็บ (มานิเคียวร์) หรืออย่างอื่น เพราะมันกันน้ำไม่ให้ถึงผิว"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "ความต่อเนื่องในวุฎูอ์", "points_th": ["มุวาลาตคือการติดตามกัน หมายถึงล้างอวัยวะต่อเนื่องกัน โดยล้างอวัยวะถัดไปก่อนอวัยวะก่อนหน้าจะแห้ง ในสภาพอากาศปกติ ไม่นับการแห้งเร็วเพราะความร้อนจัด ลมแรง หรือร่างกายที่มีไข้และน้ำน้อย และไม่นับการแห้งช้าเพราะความหนาวจัด", "ความต่อเนื่องไม่ขาด ถ้าระหว่างนั้นทำสิ่งที่เป็นสุนัตในอวัยวะอื่น เช่น สางนิ้ว ขจัดสิ่งที่ติดมือ เช่น น้ำมันที่แข็ง หรือน้ำหมด ผู้อาบน้ำละหมาดย้ายจากก๊อกหนึ่งไปอีกก๊อก หรือน้ำออกมาเป็นช่วง ๆ ทั้งหมดนี้ไม่เป็นไร เพราะเกี่ยวข้องกับการชำระ", "หุก่มของความต่อเนื่องมีสามทัศนะ ทัศนะที่หนึ่ง: วาญิบในวุฎูอ์โดยไม่มีเงื่อนไข เป็นทัศนะของอิมามอะห์มัดซึ่งเป็นมัซฮับ ของอัลเอาซาอีย์ และทัศนะเก่าของอัชชาฟิอีย์ ตามทัศนะนี้ ความต่อเนื่องไม่ตกไปเพราะลืม ตามทัศนะที่ถูกต้องในมัซฮับ ทัศนะที่สอง: เป็นสุนัต ไม่ใช่วาญิบ เป็นทัศนะของอบูหะนีฟะฮ์ อีกรายงานจากอะห์มัด ตามรูปคำของอัลคิร็อกีย์ (เพราะไม่ได้นับไว้ในฟัรฎูของวุฎูอ์) ทัศนะใหม่ของอัชชาฟิอีย์ และซอฮิรียะฮ์ ทัศนะที่สาม: เป็นฟัรฎูเมื่อจำได้และทำได้ แต่ตกไปเมื่อลืม และเมื่อจำได้แต่มีเหตุ เช่น น้ำไม่พอ หรือน้ำออกมาเป็นช่วง ๆ เป็นทัศนะของมาลิก และอิบนุตัยมียะฮ์เลือก", "ทัศนะแรกอ้าง (1) อายะฮ์วุฎูอ์ \"เมื่อพวกเจ้าลุกขึ้นไปละหมาด จงล้างหน้าของพวกเจ้า\" อายะฮ์มาในรูปเงื่อนไข และผลของเงื่อนไขเมื่อมีหลายอย่างก็ต่อเนื่องกัน ไม่ล่าช้า เพราะสิ่งที่ถูกกำหนดตามหลังเงื่อนไข (2) หะดีษในบทนี้ หะดีษอุมัรในมุสลิม \"จงอาบน้ำละหมาดให้ดี\" และหะดีษคอลิด บินมะอ์ดาน \"ท่านสั่งให้เขาอาบน้ำละหมาดและละหมาดใหม่\" ถ้าตีความสำนวนแรกตามสำนวนที่สอง ก็ชัดเจน ถ้าไม่ หะดีษที่สองก็บ่งชัด เพราะท่านสั่งให้อาบใหม่ ถ้าความต่อเนื่องไม่วาญิบ ท่านคงสั่งแค่ให้ล้างจุดนั้น ส่วนหะดีษแรก อาจหมายถึงล้างส่วนที่ขาด หรืออาบใหม่ทั้งหมด ตามที่อัลค็อฏฏอบีย์กล่าวว่าเป็นความหมายตามรูปคำ เพื่อให้สำนวนสอดคล้องกัน (3) ผู้ที่อธิบายวุฎูอ์ของท่านนบี ﷺ ระบุว่าท่านอาบต่อเนื่อง ไม่เคยแยกอวัยวะ (4) วุฎูอ์เป็นอิบาดะฮ์เดียว ถ้าแยกส่วนก็ไม่เป็นเช่นนั้น", "ผู้ที่ว่าความต่อเนื่องเป็นสุนัตอ้าง (1) อายะฮ์วุฎูอ์ อัลลอฮ์สั่งให้ล้างอวัยวะ จะล้างแบบใดก็ได้ แยกอวัยวะหรือต่อเนื่องกัน (2) วุฎูอ์เป็นหนึ่งในสองการชำระ จึงไม่ต้องต่อเนื่อง เหมือนการอาบน้ำ (ฆุสล์) พวกเขาว่า การทำให้ดีหมายถึงเติมส่วนที่ขาด ส่วนคำสั่งให้อาบใหม่ในหะดีษอิบนุมะอ์ดาน อาจหมายถึงต้องการเน้นย้ำในการตำหนิ และเตือนว่าผู้ที่ละส่วนหนึ่งเหมือนละทั้งหมด หรือเรียกการล้างส่วนที่ขาดว่าอาบใหม่ ตามที่ผู้อาบน้ำละหมาดคิด", "ผู้ที่ว่าถ้าตั้งใจแยก วุฎูอ์เสีย มิฉะนั้นไม่เสีย อ้างหลักฐานของทัศนะแรก และหลักฐานทั่วไปว่าผู้ลืมได้รับการอภัย เช่น \"แท้จริงอัลลอฮ์ทรงอภัยแก่ประชาชาติของฉัน ในความผิดพลาด การลืม และสิ่งที่ถูกบังคับ\" (อิบนุหิบบาน อัดดารุกุฏนีย์ อัลหากิม อัลบัยฮะกีย์ ศ่อฮีห์ด้วยสายและหลักฐานสนับสนุน อันนะวะวีย์ว่าหะซัน)", "ผู้แต่งเห็นว่าทัศนะนี้มีน้ำหนัก อินชาอัลลอฮ์ เพราะหลักฐานแข็งแรง คือหะดีษทั้งสามที่กล่าวมา คือหะดีษอนัส หะดีษอุมัร และหะดีษคอลิด บินมะอ์ดาน ซึ่งรวมกันอาจเสริมกัน และหะดีษอื่นที่มีความหมายเดียวกัน อิบนุตัยมียะฮ์กล่าวว่า \"ทัศนะที่สามนี้ชัดที่สุด และใกล้หลักของศาสนาและหลักของมัซฮับอะห์มัดและคนอื่นมากที่สุด เพราะหลักฐานของความเป็นวาญิบครอบคลุมเฉพาะผู้ที่ละเลย ไม่ครอบคลุมผู้ที่ไม่สามารถทำต่อเนื่องได้\"", "ทั้งหมดนี้กรณีที่เว้นช่วงนาน แต่ถ้ารู้ทันทีว่าที่เท้ามีส่วนที่น้ำไม่ถึง หรือที่มือ ก็ล้างส่วนที่ขาด แล้วล้างอวัยวะที่ตามมาเพื่อให้เรียงลำดับ ส่วนคำตอบของทัศนะที่สองต่อหะดีษในบทนี้ หะดีษแม้ไม่พ้นจากความอ่อน แต่การตีความคำสั่งให้อาบใหม่ว่าเป็นการเน้นย้ำมีข้อพิจารณา เพราะสถานการณ์นั้นเป็นการสอนและอธิบายแก่ประชาชาติ และนั่นเป็นการเบี่ยงหะดีษออกจากความหมายตามรูปคำโดยไม่มีหลักฐาน และสิ่งที่คลุมเครือในตัวบทต้องย้อนไปหาสิ่งที่อธิบายชัด"]}, {"wajh": 6, "type": "fawaid", "heading_ar": null, "heading_th": "ทักท้วงพี่น้องที่พลาด", "points_th": ["หะดีษแสดงว่าศาสนาให้มุสลิมที่เห็นพี่น้องบกพร่องหรือพลาดในสิ่งวาญิบ ทักท้วงเขา เพื่อให้อิบาดะฮ์ของเขาถูกต้อง ซึ่งอยู่ในความหมายกว้างของอายะฮ์ \"และจงช่วยเหลือกันในความดีและความยำเกรง และอย่าช่วยเหลือกันในบาปและการละเมิด\" (อัลมาอิดะฮ์: 2)"]}], "tags_th": ["ความต่อเนื่อง", "มุวาลาต", "วุฎูอ์", "ล้างให้ทั่ว", "ยาทาเล็บ"]}, {"id": "v1-h056", "volume": 1, "bab": "wudu", "topic_ar": "قدر الماء الذي يكفي في الوضوء والغسل", "topic_th": "ปริมาณน้ำที่เพียงพอสำหรับอาบน้ำละหมาดและอาบน้ำ", "pages": [237, 237], "hadith": [{"no": 56, "matn_ar": "وَعَنْهُ قَالَ: كَانَ رَسُولُ اللهِ ﷺ يَتَوَضَّأُ بِالْمُدِّ، وَيَغْتَسِلُ بِالصَّاعِ إِلَى خَمْسَةِ أَمْدَادٍ. مُتَّفَقٌ عَلَيْهِ.", "translation_th": "จากอนัส (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ อาบน้ำละหมาดด้วยน้ำหนึ่งมุดด์ และอาบน้ำด้วยหนึ่งศออ์ถึงห้ามุดด์ บันทึกโดยอัลบุคอรีย์และมุสลิม", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["น้ำหนึ่งมุดด์เพียงพอสำหรับอาบน้ำละหมาด และหนึ่งศออ์หรือห้ามุดด์เพียงพอสำหรับอาบน้ำ", "ศาสนาให้ประหยัดน้ำในการอาบน้ำละหมาดและอาบน้ำ และไม่ฟุ่มเฟือย แม้น้ำจะหาง่าย", "ปริมาณในหะดีษเป็นค่าประมาณ ไม่ใช่ขอบเขตตายตัว เพราะคนต่างกัน"], "vocab": [{"ar": "الْمُدّ", "th": "มุดด์ เท่ากับน้ำเต็มสองฝ่ามือของคนขนาดปกติ หนึ่งในสี่ของศออ์"}, {"ar": "الصَّاع", "th": "ศออ์ หน่วยตวง เท่ากับสี่มุดด์"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกในหมวดวุฎูอ์ บทการอาบน้ำละหมาดด้วยหนึ่งมุดด์ (201) และมุสลิม (325) ผ่านมิสอัร ว่าอิบนุญับร์เล่าว่า ได้ยินอนัสกล่าว... สำนวนเป็นของมุสลิม", "หะดีษอับดุลลอฮ์ บินซัยด์ได้กล่าวไปแล้ว (หะดีษที่ 41) ว่า \"มีผู้นำน้ำสองในสามมุดด์มาให้ท่านนบี ﷺ ท่านจึงถูแขนทั้งสอง\" (อะห์มัด อิบนุคุซัยมะฮ์ว่าศ่อฮีห์)"]}, {"wajh": 2, "type": "fiqh", "heading_ar": null, "heading_th": "ประหยัดน้ำ", "points_th": ["หะดีษเป็นหลักฐานว่าน้ำหนึ่งมุดด์เพียงพอในการอาบน้ำละหมาด และหนึ่งศออ์หรือห้ามุดด์เพียงพอในการอาบน้ำ ซึ่งบ่งว่าศาสนาให้ประหยัดน้ำในการอาบน้ำละหมาดและอาบน้ำ และไม่ฟุ่มเฟือย แม้น้ำจะหาง่าย", "ปริมาณที่ระบุในหะดีษเป็นค่าประมาณ ไม่ใช่การกำหนดตายตัว เพราะคนต่างกัน (กล่าวไปแล้วในหะดีษอับดุลลอฮ์ บินซัยด์)"]}], "tags_th": ["ปริมาณน้ำ", "มุดด์", "ศออ์", "ประหยัดน้ำ", "อาบน้ำ"]}, {"id": "v1-h057", "volume": 1, "bab": "wudu", "topic_ar": "ما يقول بعد الوضوء", "topic_th": "สิ่งที่กล่าวหลังอาบน้ำละหมาด", "pages": [238, 244], "hadith": [{"no": 57, "matn_ar": "وَعَنْ عُمَرَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «مَا مِنْكُمْ مِنْ أَحَدٍ يَتَوَضَّأُ، فَيُسْبِغُ الْوُضُوءَ، ثُمَّ يَقُولُ: أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ، إِلَّا فُتِحَتْ لَهُ أَبْوَابُ الْجَنَّةِ». أَخْرَجَهُ مُسْلِمٌ. وَالتِّرْمِذِيُّ، وَزَادَ: «اللَّهُمَّ اجْعَلْنِي مِنَ التَّوَّابِينَ، وَاجْعَلْنِي مِنَ الْمُتَطَهِّرِينَ».", "translation_th": "จากอุมัร (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"ไม่มีผู้ใดในพวกท่านที่อาบน้ำละหมาดอย่างทั่วถึง แล้วกล่าวว่า 'ฉันขอปฏิญาณว่าไม่มีพระเจ้าอื่นใดนอกจากอัลลอฮ์ องค์เดียว ไม่มีภาคีใดสำหรับพระองค์ และฉันขอปฏิญาณว่ามุหัมมัดเป็นบ่าวและรสูลของพระองค์' เว้นแต่ประตูสวรรค์จะถูกเปิดให้แก่เขา\" บันทึกโดยมุสลิม และอัตติรมิซีย์เพิ่มว่า \"โอ้อัลลอฮ์ โปรดให้ฉันอยู่ในหมู่ผู้กลับเนื้อกลับตัวเสมอ และโปรดให้ฉันอยู่ในหมู่ผู้ชำระตนให้สะอาด\"", "grade_th": "ศ่อฮีห์ (มุสลิม) ส่วนเพิ่มของอัตติรมิซีย์มีข้อขัดแย้ง อัลอัลบานีย์และอิบนุบาซว่าศ่อฮีห์ อะห์มัด ชากิรว่าสับสน (มุฎฏ่อริบ)"}], "key_rulings_th": ["ส่งเสริมให้กล่าวชะฮาดะฮ์ทั้งสองเมื่ออาบน้ำละหมาดเสร็จ ผลบุญคือประตูสวรรค์ทั้งแปดจะเปิดให้เข้าทางใดก็ได้", "ผลบุญนี้ผูกกับสองเงื่อนไข คืออาบน้ำละหมาดอย่างทั่วถึง แล้วกล่าวซิกิรนี้", "ผู้ที่ทำความสะอาดภายนอกด้วยน้ำ ก็ทำความสะอาดภายในด้วยถ้อยคำเตาฮีดและความบริสุทธิ์ใจ", "ส่วนเพิ่ม \"โอ้อัลลอฮ์ โปรดให้ฉันอยู่ในหมู่ผู้กลับเนื้อกลับตัว...\" มีข้อขัดแย้งเรื่องความถูกต้อง"], "vocab": [{"ar": "فَيُسْبِغُ الْوُضُوءَ", "th": "อาบน้ำละหมาดอย่างทั่วถึง ที่ชัดคือหมายถึงล้างเกินระดับวาญิบ คือครั้งที่สองและสาม"}, {"ar": "أَشْهَدُ", "th": "ฉันยอมรับด้วยใจและกล่าวด้วยปาก เหมือนผู้ที่เห็นด้วยตา"}, {"ar": "عَبْدُهُ وَرَسُولُهُ", "th": "บ่าวผู้นอบน้อมต่อพระองค์ด้วยการเชื่อฟัง และรสูลผู้ถูกส่งมาพร้อมศาสนาแก่มวลโลก"}, {"ar": "التَّوَّابِين", "th": "ผู้กลับเนื้อกลับตัวและขออภัยโทษมาก ๆ"}, {"ar": "الْمُتَطَهِّرِين", "th": "ผู้ชำระตนให้พ้นจากบาป ฮะดัษ และนะญิส"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อบูหัฟศ์ อุมัร บินอัลค็อฏฏอบ บินนุฟัยล์ บินอับดิลอุซซา อัลกุร็อชีย์ อัลอะดะวีย์ อะมีรุลมุอ์มินีน เคาะลีฟะฮ์คนที่สองของประชาชาตินี้ เป็นหนึ่งในผู้มีเกียรติของกุร็อยช์ เข้ารับอิสลามในปีที่ห้าหรือหกหลังการเป็นนบี การเข้ารับอิสลามของเขาเป็นเกียรติแก่มุสลิม เพราะความแข็งแรงและความเข้มแข็งต่อผู้ปฏิเสธศรัทธา อับดุลลอฮ์ บินมัสอูดกล่าวว่า \"เรามีเกียรติตลอดมาตั้งแต่อุมัรเข้ารับอิสลาม\" (อัลบุคอรีย์)", "เขาอพยพไปมะดีนะฮ์ก่อนท่านนบี ﷺ ร่วมทุกสงคราม และเป็นเคาะลีฟะฮ์หลังอบูบักร์ อัศศิดดีก ตามการแต่งตั้งของอบูบักร์ เขาปกครองอย่างดีที่สุด อิสลามงดงามด้วยความยุติธรรมของเขา อัลลอฮ์ทรงให้พิชิตดินแดนมากมาย เช่น บัยตุลมักดิสและแผ่นดินชามทั้งหมด อิสลามจึงแผ่กว้าง", "ในปลายเดือนซุลหิจญะฮ์ เหลืออีกสี่คืน อบูลุอ์ลุอะฮ์ ชาวมะญูสี แทงเขาด้วยมีดสองคมขณะละหมาดศุบห์ตอนตักบีร เขาเสียชีวิตอีกสามคืนต่อมา ปี ฮ.ศ. 23 ฝังร่วมกับท่านนบี ﷺ และอบูบักร์ในห้องของอาอิชะฮ์ หลังอบูบักร์ ศีรษะของเขาอยู่ตรงอกของอบูบักร์ เขาเป็นเคาะลีฟะฮ์สิบปีหกเดือนกับอีกไม่กี่วัน"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["มุสลิมบันทึกในหมวดฏอฮาเราะฮ์ (234) ผ่านมุอาวิยะฮ์ บินศอลิห์ จากเราะบีอะฮ์ บินยะซีด จากอบูอิดรีส อัลเคาลานีย์ จากอุกบะฮ์ บินอามิร และมุอาวิยะฮ์ บินศอลิห์ยังรายงานจากอบูอุษมาน จากญุบัยร์ บินนุฟัยร์ จากอุกบะฮ์ บินอามิรด้วย", "อุกบะฮ์เล่าว่า เราต้องเลี้ยงอูฐ เมื่อถึงเวรของฉัน ฉันพาอูฐกลับตอนเย็น และทันได้ยินท่านรสูลุลลอฮ์ ﷺ ยืนพูดกับผู้คนว่า \"ไม่มีมุสลิมคนใดที่อาบน้ำละหมาดอย่างดี แล้วลุกขึ้นละหมาดสองร็อกอะฮ์ โดยมุ่งหาทั้งสองด้วยใจและใบหน้า เว้นแต่สวรรค์จะเป็นสิทธิ์ของเขา\" ฉันกล่าวว่า ดีจริงหนอ คนข้างหน้าฉันกล่าวว่า ที่ท่านพูดก่อนหน้านั้นดีกว่า ฉันมองไปก็เห็นเป็นอุมัร เขากล่าวว่า ฉันเห็นท่านเพิ่งมา... แล้วเล่าหะดีษ ตอนท้ายว่า \"เว้นแต่ประตูสวรรค์ทั้งแปดจะถูกเปิดให้แก่เขา เข้าทางใดก็ได้ตามต้องการ\"", "มุอาวิยะฮ์ บินศอลิห์คือ อิบนุหุดัยร์ ส่วนอบูอุษมาน อัซซะฮะบีย์ว่า \"ไม่รู้ว่าเป็นใคร มุสลิมบันทึกเป็นสายสนับสนุน\" อิบนุมันญูยะฮ์ว่าน่าจะเป็นสะอีด บินฮานิอ์ อัลเคาลานีย์ อัลมิศรีย์ อิบนุหิบบานว่าน่าจะเป็นหะรีซ บินอุษมาน อัรเราะหะบีย์ ทั้งสองเชื่อถือได้ จึงไม่กระทบสายรายงาน มุสลิมยังบันทึกผ่านอบูบักร์ บินอบีชัยบะฮ์ จากซัยด์ บินอัลหุบาบ ด้วยทั้งสองสาย", "มีส่วนเพิ่ม \"แล้วเงยหน้ามองฟ้า\" ในรายงานของอะห์มัด อบูดาวูด (170) และอิบนุสสุนนีย์ ผ่านอบูอะกีล ซุฮ์เราะฮ์ บินมะอ์บัด จากลูกพี่ลูกน้องของเขา จากอุกบะฮ์ บินอามิร ส่วนเพิ่มนี้มุงกัร เพราะลูกพี่ลูกน้องของอบูอะกีลรายงานคนเดียว และไม่เป็นที่รู้จ
