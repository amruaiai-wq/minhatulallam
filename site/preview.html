ะญิส\" เป็นอิจญ์มาอ์ (มติเอกฉันท์) ของนักวิชาการ", "เพียงคุณลักษณะใดคุณลักษณะหนึ่งเปลี่ยน ไม่จำเป็นต้องเปลี่ยนครบทั้งสาม", "น้ำมีสองประเภทเท่านั้น คือ ฏอฮูร (สะอาดและทำให้สะอาดได้) กับนะญิส นี่คือทัศนะที่ถูกต้องตามนักวิชาการผู้ตรวจสอบ", "น้ำที่เปลี่ยนเพราะสิ่งสะอาดที่หลีกเลี่ยงยาก เช่น ใบไม้ ดิน ยังเป็นฏอฮูร แต่ถ้าเปลี่ยนจนกลายเป็นสิ่งอื่นที่มีชื่อเรียกใหม่ เช่น นม น้ำแกง จะไม่ใช่น้ำฏอฮูรอีกต่อไป", "น้ำที่สัมผัสนะญิสแต่ไม่มีคุณลักษณะใดเปลี่ยน ยังคงเป็นฏอฮูร ไม่ว่าน้ำน้อยหรือมาก"], "vocab": [{"ar": "غَلَبَ عَلَى", "th": "ครอบงำ คือนะญิสเด่นจนทำให้คุณลักษณะของน้ำเปลี่ยนไป"}, {"ar": "وَ ← أَوْ", "th": "คำว่า \"และ\" ในรายงานของอิบนุมาญะฮ์ มีความหมายว่า \"หรือ\" ตามที่รายงานของอัลบัยฮะกีย์อธิบายไว้ คือคุณลักษณะใดคุณลักษณะหนึ่งเปลี่ยนก็พอ"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อบูอุมามะฮ์ คือ ศุดัยย์ บินอัจญ์ลาน อัลบาฮิลีย์ เป็นที่รู้จักด้วยกุนยะฮ์", "อาศัยอยู่ที่แคว้นชาม และเสียชีวิตที่นั่น ปี ฮ.ศ. 81 (บ้างว่า 86)"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجهما", "heading_th": "ที่มาของทั้งสองหะดีษ", "points_th": ["หะดีษที่ 3 บันทึกโดยอิบนุมาญะฮ์ (521), อัดดารุกุฏนีย์ และอัฏเฏาะบะรอนีย์ ผ่านสายริชดีน บินสะอด์ จากมุอาวิยะฮ์ บินศอลิห์ จากรอชิด บินสะอด์ จากอบูอุมามะฮ์", "สถานะ: อ่อน เพราะริชดีน บินสะอด์ ถูกวิจารณ์โดยอะห์มัดและอบูซุรอะฮ์ อบูหาติมว่า \"หะดีษของเขาถูกปฏิเสธ\" อันนะสาอีย์ว่า \"ถูกละทิ้ง\" และยังมีความขัดแย้งในสายรายงาน", "อัดดารุกุฏนีย์และอบูหาติมกล่าวว่า ที่ถูกคือเป็นรายงานแบบมุรสัล (ขาดช่วงเศาะหาบะฮ์) จากรอชิด บินสะอด์ อัชชาฟิอีย์กล่าวว่านักวิชาการหะดีษไม่รับรองหะดีษลักษณะนี้ และอันนะวะวีย์กล่าวว่านักหะดีษเห็นพ้องว่าหะดีษนี้อ่อน", "อิบนุหะญัรยกรายงานของอัลบัยฮะกีย์ (หะดีษที่ 4) มาเพื่ออธิบายว่า \"และ\" ในรายงานแรกหมายถึง \"หรือ\" แต่รายงานนี้ก็อ่อนเช่นกัน เพราะในสายมีอะฏิยะฮ์ บินบะกิยะฮ์ ซึ่งมักผิดพลาด และอัลวะลีดซึ่งเป็นผู้ปกปิดสายรายงาน (มุดัลลิส) อัลบัยฮะกีย์เองกล่าวว่าหะดีษนี้ไม่แข็งแรง"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "สิ่งที่ใช้เป็นหลักฐานจริง", "points_th": ["ส่วนแรกของหะดีษอบูอุมามะฮ์ (\"ไม่มีสิ่งใดทำให้น้ำเป็นนะญิส\") ศ่อฮีห์ ตามหะดีษอบูสะอีดที่ผ่านมา ส่วนที่อ่อนคือข้อยกเว้นที่เพิ่มเข้ามา", "หลักฐานที่ใช้จริงว่าน้ำที่เปลี่ยนสี รส หรือกลิ่นเพราะนะญิสเป็นนะญิส คืออิจญ์มาอ์ ซึ่งนักวิชาการหลายท่านถ่ายทอดไว้", "อัชชาฟิอีย์กล่าวว่าเป็นทัศนะของนักวิชาการทั่วไปที่ไม่รู้ว่ามีผู้ใดเห็นต่าง แม้ท่านเองจะถือว่าหะดีษอ่อน อิบนุลมุนซิรกล่าวว่า นักวิชาการเห็นพ้องกันว่า น้ำน้อยหรือมากที่นะญิสตกลงไปจนรส สี หรือกลิ่นเปลี่ยน ถือเป็นนะญิส อัลบัยฮะกีย์และอิบนุฮุบัยเราะฮ์ก็ถ่ายทอดไว้เช่นกัน"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "ประเภทของน้ำ", "points_th": ["เมื่อนำหะดีษอบูอุมามะฮ์ซึ่งมีอิจญ์มาอ์สนับสนุน มารวมกับหะดีษอบูสะอีด จะได้ข้อสรุปว่าน้ำมีสองประเภทเท่านั้น คือ ฏอฮูร กับ นะญิส ไม่มีประเภทที่สาม", "นี่คือทัศนะที่ถูกต้องตามนักวิชาการผู้ตรวจสอบ เช่น เชคุลอิสลามอิบนุตัยมิยะฮ์ เชคมุหัมมัด บินอับดิลวะฮ์ฮาบ เชคอับดุรเราะห์มาน อัสสะอ์ดีย์ เชคมุหัมมัด บินอิบรอฮีม และเชคอับดุลอะซีซ บินบาซ", "น้ำฏอฮูร คือน้ำที่ยังคงสภาพเดิม ทั้งแบบแท้จริง เช่น น้ำบ่อ น้ำทะเล และแบบโดยหุก่ม คือน้ำที่เปลี่ยนไปเพราะสิ่งที่ไม่ทำให้หมดความเป็นฏอฮูร เช่น สิ่งที่ป้องกันได้ยาก อย่างใบไม้ ดิน สิ่งที่ลมหรือน้ำหลากพัดมา หรือสิ่งสะอาดอื่น ๆ ตราบใดที่ยังเรียกว่า \"น้ำ\" ได้ ก็ยังเป็นฏอฮูร", "ถ้าเปลี่ยนจนพ้นจากความเป็นน้ำ และมีชื่อเรียกใหม่ เช่น นม น้ำแกง หรือน้ำผสมอินทผลัม จะไม่เป็นฏอฮูร เพราะไม่ใช่น้ำแล้ว", "น้ำนะญิส คือน้ำที่เปลี่ยนเพราะนะญิส ไม่ว่าเปลี่ยนมากหรือน้อย ผสมกันหรือไม่ก็ตาม แต่ถ้าน้ำสัมผัสนะญิสแล้วไม่มีคุณลักษณะใดเปลี่ยน ยังคงเป็นฏอฮูร เพราะไม่มีหลักฐานว่าเป็นนะญิส"]}], "tags_th": ["น้ำ", "นะญิส", "ประเภทของน้ำ", "อิจญ์มาอ์", "หะดีษอ่อน"]}, {"id": "v1-h005", "volume": 1, "bab": "miyah", "topic_ar": "بيان قدر الماء الذي ينجس والذي لا ينجس", "topic_th": "ปริมาณน้ำที่เป็นนะญิสและที่ไม่เป็นนะญิส", "pages": [35, 40], "hadith": [{"no": 5, "matn_ar": "عَنْ عَبْدِ اللهِ بْنِ عُمَرَ رَضِيَ اللهُ عَنْهُمَا قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «إِذَا كَانَ الْمَاءُ قُلَّتَيْنِ لَمْ يَحْمِلِ الْخَبَثَ». وَفِي لَفْظٍ: «لَمْ يَنْجُسْ». أَخْرَجَهُ الْأَرْبَعَةُ، وَصَحَّحَهُ ابْنُ خُزَيْمَةَ وَالْحَاكِمُ وَابْنُ حِبَّانَ.", "translation_th": "จากอับดุลลอฮ์ บินอุมัร (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"เมื่อน้ำมีปริมาณสองกุลละฮ์ น้ำนั้นจะไม่รับสิ่งสกปรก\" และในอีกสำนวนหนึ่ง: \"จะไม่เป็นนะญิส\" บันทึกโดยนักบันทึกทั้งสี่ อิบนุคุซัยมะฮ์ อัลหากิม และอิบนุหิบบานระบุว่าศ่อฮีห์", "grade_th": "ศ่อฮีห์ (ตามทัศนะที่ถูกต้อง)"}], "key_rulings_th": ["น้ำตั้งแต่สองกุลละฮ์ขึ้นไปถือเป็นน้ำมาก ไม่เป็นนะญิสเพียงเพราะสัมผัสนะญิส เว้นแต่คุณลักษณะเปลี่ยน ซึ่งเป็นนะญิสตามอิจญ์มาอ์", "สองกุลละฮ์ ตามทัศนะที่ใกล้เคียงที่สุดคือ 500 ริฏล์แบกแดด หรือราวห้าถุงหนังน้ำ ผู้แต่งประมาณไว้ราว 307 ลิตร", "น้ำน้อยกว่าสองกุลละฮ์ที่สัมผัสนะญิสแต่ไม่เปลี่ยน ยังคงเป็นฏอฮูร ตามทัศนะที่มีน้ำหนัก แต่ต้องระวังเป็นพิเศษ เพราะน้ำน้อยเปลี่ยนสภาพง่าย", "การตีความ \"มัฟฮูม\" (ความหมายแฝง) ของหะดีษไม่มีผลครอบคลุมทุกกรณี และไม่อาจหักล้างถ้อยคำชัดเจนในหะดีษ \"น้ำนั้นสะอาด ไม่มีสิ่งใดทำให้เป็นนะญิส\""], "vocab": [{"ar": "قُلَّتَيْن", "th": "สองกุลละฮ์ กุลละฮ์คือโอ่งดินเผาขนาดใหญ่ ที่เรียกเช่นนี้เพราะยกขึ้นได้ โอ่งเมืองฮะญัร (قلال هجر) เป็นที่รู้จักในหมู่เศาะหาบะฮ์"}, {"ar": "لَمْ يَحْمِلِ الْخَبَثَ", "th": "ไม่รับนะญิส คือน้ำขจัดนะญิสออกจากตัวเอง ไม่ใช่หมายความว่าน้ำอ่อนแอเกินกว่าจะรับนะญิส"}, {"ar": "لَمْ يَنْجُسْ", "th": "สำนวนของอัลหากิม มีประโยชน์คือชัดเจนกว่าสำนวนแรก และตัดการตีความผิดที่ว่าน้ำ \"อ่อนแอเกินกว่าจะรับ\" นะญิส"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อบูอับดิรเราะห์มาน อับดุลลอฮ์ บินอุมัร บินอัลค็อฏฏอบ อัลกุรอชีย์ อัลอะดะวีย์ นักฟิกฮ์แห่งมะดีนะฮ์ เป็นผู้โดดเด่นทั้งด้านความรู้และการปฏิบัติ", "รับอิสลามตั้งแต่เด็กพร้อมบิดา สงครามแรกที่ร่วมคือค็อนดัก", "มาลิกกล่าวว่า อิบนุอุมัรมีชีวิตอยู่หลังท่านนบี ﷺ หกสิบปี ผู้คนเดินทางมาหาเพื่อขอความรู้ เขาระมัดระวังมากในการให้ฟัตวา และใส่ใจติดตามร่องรอยของท่านนบี ﷺ อย่างยิ่ง", "เสียชีวิตที่มักกะฮ์ ปี ฮ.ศ. 73"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["บันทึกโดยอบูดาวูด (63), อัตติรมิซีย์ (67), อันนะสาอีย์ และอิบนุมาญะฮ์ (517) ฉบับเต็ม: มีผู้ถามท่านนบี ﷺ เรื่องน้ำที่สัตว์พาหนะและสัตว์ป่าแวะมากิน ท่านตอบด้วยหะดีษนี้", "นักวิชาการเห็นต่างเรื่องสถานะ ฝ่ายที่ว่าศ่อฮีห์ ซึ่งเป็นทัศนะที่ถูกต้อง ได้แก่ อัชชาฟิอีย์ อะห์มัด อบูอุบัยด์ อัฏเฏาะหาวีย์ อัดดารุกุฏนีย์ อิบนุดะกีกิลอีด อัลอะลาอีย์ อิบนุคุซัยมะฮ์ อิบนุหิบบาน และอัลหากิม อัลค็อฏฏอบีย์กล่าวว่า เพียงพอแล้วที่นักวิชาการหะดีษชั้นนำยืนยันว่าศ่อฮีห์และยึดถือตาม", "ฝ่ายที่ว่าอ่อน เช่น อิบนุอับดิลบัรร์และอิบนุลอะเราะบีย์ ให้เหตุผลว่ามีความสับสน (อิฎฏิร็อบ) ทั้งในสายรายงานและตัวบท", "ความสับสนในสายรายงาน: อัลวะลีด บินกะษีร รายงานบางครั้งจากมุหัมมัด บินญะอ์ฟัร บินอัซซุบัยร์ บางครั้งจากมุหัมมัด บินอับบาด บินญะอ์ฟัร และบางครั้งจากอุบัยดุลลอฮ์ บางครั้งจากอับดุลลอฮ์ บุตรของอิบนุอุมัร", "คำตอบที่ถูกต้องคือรวมทั้งสองเข้าด้วยกัน (ญัมอ์): ผู้รายงานทุกคนเชื่อถือได้และอยู่ในเศาะฮีหัยน์ ผู้รายงานที่แม่นยำย่อมรายงานได้ทั้งสองทาง หะดีษจึงศ่อฮีห์ทั้งสองสาย เป็นทัศนะของอัลบัยฮะกีย์ อัลหากิม อัดดารุกุฏนีย์ อัลอะลาอีย์ และอิบนุหะญัร", "ความสับสนในตัวบท: สำนวน \"สองหรือสามกุลละฮ์\" มาจากหัมมาด บินสะละมะฮ์ ซึ่งความจำเปลี่ยนในบั้นปลาย และผู้รายงานจากเขาก็เห็นต่างกัน สำนวน \"สองกุลละฮ์\" อย่างเดียวจึงถูกต้องกว่า ส่วนสำนวน \"สี่สิบกุลละฮ์\" ไม่ได้เป็นส่วนหนึ่งของหะดีษนี้"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["การจำกัดว่าเป็น \"โอ่งเมืองฮะญัร\" ในบางรายงานไม่ถูกต้อง เพราะมาจากผู้รายงานที่รายงานหะดีษถูกปฏิเสธ แต่ความหมายคือโอ่งขนาดใหญ่ เพราะการกำหนดด้วยโอ่งเล็กสองใบไม่มีประโยชน์", "ปริมาณที่แน่นอนมีความเห็นต่างมาก ที่ใกล้เคียงที่สุดคือ 500 ริฏล์แบกแดด หรือห้าถุงหนังน้ำ ถุงละ 100 ริฏล์ อิบนุญุร็อยจ์กล่าวว่าโอ่งเมืองฮะญัรจุราวสองถุงกว่า อัชชาฟิอีย์ให้ถือสองถุงครึ่งต่อโอ่งเพื่อความรอบคอบ", "น้ำปริมาณนี้ขึ้นไปคือน้ำมาก ต่ำกว่าคือน้ำน้อย เป็นทัศนะที่ถูกต้อง และเป็นทัศนะของอัชชาฟิอีย์และอะห์มัด เพราะยึดตัวบท ส่วนการกำหนดด้วยการคาดคะเนนั้นอ่อน และความสะอาดเป็นพื้นฐานของศาสนา ต้องอาศัยหลักฐาน"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "ความหมายตรงและความหมายแฝงของหะดีษ", "points_th": ["ความหมายตรง (มันฏูก): น้ำมากไม่เป็นนะญิสเมื่อนะญิสตกลงไป ไม่ว่าจะเปลี่ยนหรือไม่ แต่ความหมายกว้างนี้ใช้ไม่ได้ทั้งหมด เพราะมีอิจญ์มาอ์ว่าน้ำที่เปลี่ยนเพราะนะญิสเป็นนะญิสไม่ว่าน้อยหรือมาก", "ความหมายแฝง (มัฟฮูม): น้ำน้อยเป็นนะญิสเมื่อสัมผัสนะญิส ไม่ว่าจะเปลี่ยนหรือไม่ แต่ความหมายแฝงไม่มีผลครอบคลุม (المفهوم لا عموم له) จึงไม่จำเป็นว่าน้ำน้อยทุกกรณีจะเป็นนะญิส", "สรุป: น้ำน้อยที่เปลี่ยนเพราะนะญิสเป็นนะญิส ส่วนที่ไม่เปลี่ยน ให้ยึดถ้อยคำชัดเจนในหะดีษอบูสะอีดว่ายังเป็นฏอฮูร เพราะความหมายตรงมาก่อนความหมายแฝง", "แต่น้ำน้อยกว่าสองกุลละฮ์ต้องพิจารณาอย่างระมัดระวัง เพื่อไม่ให้มักง่าย เพราะเปลี่ยนสภาพได้ง่าย หากนะญิสปรากฏในรส สี หรือกลิ่น หรือเป็นนะญิสที่น่าจะส่งผล เช่น สุนัขเลีย (จะกล่าวต่อไป) ก็เป็นนะญิส หากไม่ส่งผลเพราะน้ำมากพอหรือนะญิสไม่ปรากฏ ก็ยังเป็นฏอฮูร", "นี่คือทัศนะของอิมามมาลิก อะห์มัด (ในรายงานหนึ่ง) สำนักซอฮิรียะฮ์ และนักวิชาการหลายท่านทั้งรุ่นสะลัฟและรุ่นหลัง เป็นทัศนะที่อิบนุตัยมิยะฮ์และอิบนุลก็อยยิมเลือก และมีน้ำหนักที่สุดด้านหลักฐาน เพราะความหมายแฝงไม่หนักแน่นพอจะหักล้างถ้อยคำที่ชัดเจน และทำให้หะดีษทั้งหมดสอดคล้องกัน"]}, {"wajh": 5, "type": "fawaid", "heading_ar": null, "heading_th": "น้ำเหลือของสัตว์", "points_th": ["หะดีษนี้แสดงว่าน้ำเหลือจากสัตว์พาหนะและสัตว์ป่ามักมีนะญิสปน เพราะสัตว์ป่ามักเดินลุยน้ำและปัสสาวะ ร่างกายของมันจึงมักเปื้อนปัสสาวะและมูล"]}], "tags_th": ["น้ำ", "นะญิส", "สองกุลละฮ์", "น้ำน้อยน้ำมาก", "อุศูลุลฟิกฮ์"]}, {"id": "v1-h006", "volume": 1, "bab": "miyah", "topic_ar": "حكم البول في الماء الراكد والاغتسال فيه من الجنابة", "topic_th": "ข้อตัดสินการปัสสาวะในน้ำนิ่ง และการอาบน้ำญะนาบะฮ์ในน้ำนั้น", "pages": [41, 45], "hadith": [{"no": 6, "matn_ar": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «لَا يَغْتَسِلْ أَحَدُكُمْ فِي الْمَاءِ الدَّائِمِ وَهُوَ جُنُبٌ». أَخْرَجَهُ مُسْلِمٌ. وَلِلْبُخَارِيِّ: «لَا يَبُولَنَّ أَحَدُكُمْ فِي الْمَاءِ الدَّائِمِ الَّذِي لَا يَجْرِي، ثُمَّ يَغْتَسِلُ فِيهِ». وَلِمُسْلِمٍ: «مِنْهُ». وَلِأَبِي دَاوُدَ: «وَلَا يَغْتَسِلُ فِيهِ مِنَ الْجَنَابَةِ».", "translation_th": "จากอบูฮุร็อยเราะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"อย่าให้ผู้ใดในพวกท่านอาบน้ำในน้ำนิ่งขณะที่มีญะนาบะฮ์\" บันทึกโดยมุสลิม และในรายงานของอัลบุคอรีย์: \"อย่าให้ผู้ใดในพวกท่านปัสสาวะในน้ำนิ่งที่ไม่ไหล แล้วจึงอาบน้ำในนั้น\" ในรายงานของมุสลิม: \"(อาบ) จากน้ำนั้น\" และในรายงานของอบูดาวูด: \"และอย่าอาบน้ำญะนาบะฮ์ในน้ำนั้น\"", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["ห้ามปัสสาวะในน้ำนิ่ง และห้ามอาบน้ำญะนาบะฮ์โดยลงไปแช่ในน้ำนิ่ง แต่ละอย่างเป็นข้อห้ามแยกกัน ไม่ต้องทำทั้งสองอย่างจึงจะผิด", "ใช้ภาชนะหรือมือ (หลังล้างแล้ว) ตักน้ำนิ่งขึ้นมาอาบด้านนอกได้ ไม่อยู่ในข้อห้าม ส่วนน้ำไหลไม่อยู่ในข้อห้ามนี้", "ข้อห้ามนี้เป็นหะรอม ไม่ว่าน้ำนิ่งจะน้อยหรือมาก ยกเว้นน้ำปริมาณมหาศาลอย่างทะเล ซึ่งไม่อยู่ในข้อห้ามโดยมติเห็นพ้อง", "น้ำนั้นไม่กลายเป็นนะญิสเพียงเพราะมีคนปัสสาวะหรืออาบน้ำในนั้น เว้นแต่จะเปลี่ยนสภาพ แต่ผู้ฝ่าฝืนมีบาป", "อุจจาระและสิ่งสกปรกอื่นมีหุก่มเดียวกับปัสสาวะ และการอาบน้ำละหมาดมีหุก่มเดียวกับการอาบน้ำญะนาบะฮ์"], "vocab": [{"ar": "الْمَاءُ الدَّائِمُ", "th": "น้ำนิ่ง อัลบุคอรีย์อธิบายว่า \"ที่ไม่ไหล\" คือน้ำที่ขังอยู่กับที่ เช่น บ่อในสวน แอ่งน้ำในทะเลทราย"}, {"ar": "ثُمَّ يَغْتَسِلُ", "th": "อ่านสระอุ หมายถึง \"แล้วเขาก็จะอาบในนั้น\" ชี้ถึงเหตุผลของข้อห้าม: จะปัสสาวะในน้ำที่ตนจะใช้ชำระตัวภายหลังได้อย่างไร"}, {"ar": "وَهُوَ جُنُبٌ", "th": "ขณะมีญะนาบะฮ์ คือผู้ที่จำเป็นต้องอาบน้ำเพราะร่วมประเวณีหรือหลั่งอสุจิ"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["สำนวนแรกบันทึกโดยมุสลิม (283) บทห้ามอาบน้ำในน้ำนิ่ง ฉบับเต็มมีว่า มีผู้ถามอบูฮุร็อยเราะฮ์ว่าจะทำอย่างไร เขาตอบว่า ให้ตักน้ำขึ้นมาอาบด้านนอก ไม่ต้องลงไปแช่", "สำนวนที่สองบันทึกโดยอัลบุคอรีย์ (239) บทปัสสาวะในน้ำนิ่ง เป็นหะดีษแยกต่างหากจากสำนวนแรก อันนะสาอีย์และอะห์มัดก็บันทึกด้วยสำนวน \"แล้วอาบน้ำละหมาดจากน้ำนั้น\"", "สำนวนที่สามบันทึกโดยมุสลิม (282) และสำนวนที่สี่บันทึกโดยอบูดาวูด (70)"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"أحدكم\" (ผู้ใดในพวกท่าน) ครอบคลุมทั้งชายและหญิง ใช้รูปเพศชายเป็นหลักตามธรรมเนียมภาษา", "ความต่างระหว่างรายงาน: รายงานอัลบุคอรีย์ (\"ในน้ำนั้น\") ห้ามการลงไปแช่โดยตรง รายงานมุสลิม (\"จากน้ำนั้น\") ห้ามการตักใช้ด้วย แต่ละรายงานบ่งชี้ความหมายของอีกรายงาน ส่วนรายงานอบูดาวูดแสดงว่าแต่ละการกระทำถูกห้ามแยกกัน", "สรุปจากทุกรายงาน: ทุกการกระทำข้างต้นถูกห้าม เพราะการปัสสาวะหรืออาบน้ำในน้ำนิ่งทำให้น้ำสกปรกและผู้คนรังเกียจ แม้จะไม่ถึงขั้นเป็นนะญิส หะดีษญาบิรสนับสนุนว่าท่านนบี ﷺ ห้ามปัสสาวะในน้ำนิ่ง (บันทึกโดยมุสลิม)"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "การอาบน้ำญะนาบะฮ์ในน้ำนิ่ง", "points_th": ["ห้ามอาบน้ำญะนาบะฮ์โดยลงไปในน้ำนิ่ง เพราะทำให้น้ำปนเปื้อนสิ่งสกปรกจากร่างกาย", "การตักน้ำด้วยภาชนะ หรือด้วยมือหลังจากล้างมือแล้ว ไม่อยู่ในข้อห้ามนี้ ตามที่อบูฮุร็อยเราะฮ์อธิบาย และความหมายแฝงคือ อาบน้ำญะนาบะฮ์ในน้ำไหลได้"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "การปัสสาวะในน้ำนิ่ง", "points_th": ["ห้ามปัสสาวะในน้ำนิ่ง เพราะทำให้น้ำปนเปื้อนนะญิสและโรคที่ปัสสาวะพามา ซึ่งเป็นอันตรายต่อผู้ใช้น้ำทุกคน หรือแม้แต่ผู้ปัสสาวะเอง", "ไม่ต่างกันระหว่างปัสสาวะลงน้ำโดยตรง ปัสสาวะใส่ภาชนะแล้วเทลงน้ำ หรือปัสสาวะใกล้น้ำจนไหลลงไป ทั้งหมดเป็นสิ่งน่ารังเกียจและถูกห้าม", "ความหมายแฝง: ปัสสาวะในน้ำไหลได้ เพราะปัสสาวะไหลไปกับน้ำ แต่ถ้ามีผู้ใช้น้ำอยู่ทางปลายน้ำ ไม่ควรทำ เพราะเป็นการทำให้น้ำสกปรกสำหรับเขา"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "น้ำนิ่งน้อยหรือมาก", "points_th": ["บางทัศนะแยกว่า ถ้าน้ำนิ่งมากเป็นมักรูฮ์ ถ้าน้อยเป็นหะรอม การห้ามในน้ำน้อยนั้นถูกต้อง เพราะสกปรกเร็วกว่า", "แต่การถือว่าในน้ำมากเป็นเพียงมักรูฮ์ อาจทำให้ผู้คนมักง่าย ทั้งที่ท่านนบี ﷺ ปิดช่องทางสู่ความเสียหาย หุก่มจึงเป็นหะรอมตามความหมายตรง แม้น้ำนิ่งจะมาก เพราะไม่มีรายงานใดกำหนดปริมาณ มีเพียงคำว่า \"น้ำนิ่ง\"", "ส่วนน้ำปริมาณมหาศาลอย่างทะเล ซึ่งไม่อาจเปลี่ยนสภาพเพราะปัสสาวะหรือการอาบน้ำ ไม่อยู่ในข้อห้ามโดยมติเห็นพ้อง ตามที่อิบนุดะกีกิลอีดกล่าวไว้"]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "การอาบน้ำด้วยเหตุอื่น", "points_th": ["การระบุว่า \"อาบน้ำญะนาบะฮ์\" เป็นการระบุตามกรณีส่วนใหญ่ ไม่ได้หมายความว่าอาบน้ำด้วยเหตุอื่น เช่น เพื่อชำระคราบสกปรก จะทำได้ กลับยิ่งควรห้าม เพราะแม้การอาบน้ำญะนาบะฮ์ซึ่งจำเป็นยังถูกห้าม และสิ่งสกปรกทำให้น้ำเปื้อนมากกว่า"]}, {"wajh": 7, "type": "fiqh", "heading_ar": null, "heading_th": "สถานะของน้ำนั้น", "points_th": ["ที่ถูกต้องคือ น้ำนั้นไม่เป็นนะญิส เว้นแต่จะเปลี่ยนสภาพเพราะนะญิสจากการปัสสาวะหรืออาบน้ำ ข้อห้ามไม่ได้หมายความว่าน้ำเป็นนะญิส เพราะท่านนบี ﷺ ห้ามการกระทำ ไม่ได้กล่าวว่าน้ำเป็นนะญิส", "เทียบได้กับผู้ตื่นนอนแล้วจุ่มมือลงภาชนะก่อนล้างสามครั้ง น้ำไม่เป็นนะญิสตามหลักว่า \"น้ำนั้นสะอาด ไม่มีสิ่งใดทำให้เป็นนะญิส\" แต่ผู้ทำมีบาปเพราะฝ่าฝืนข้อห้าม"]}, {"wajh": 8, "type": "fiqh", "heading_ar": null, "heading_th": "สิ่งที่มีหุก่มเดียวกับปัสสาวะ", "points_th": ["อุจจาระ ซึ่งน่ารังเกียจยิ่งกว่า และสิ่งสกปรกอื่น ๆ มีหุก่มเดียวกับปัสสาวะ เพราะมีเหตุผลเดียวกัน คือทำให้น้ำสกปรกและผู้คนรังเกียจ อิบนุกุดามะฮ์กล่าวว่า นักวิชาการส่วนใหญ่ไม่แยกปัสสาวะออกจากนะญิสอื่น"]}, {"wajh": 9, "type": "fiqh", "heading_ar": null, "heading_th": "การอาบน้ำละหมาด", "points_th": ["การอาบน้ำละหมาดในน้ำนิ่งที่มีคนปัสสาวะ มีหุก่มเดียวกับการอาบน้ำญะนาบะฮ์ ดังที่มีรายงานจากอบูฮุร็อยเราะฮ์ว่า \"อย่าให้ผู้ใดในพวกท่านปัสสาวะในน้ำนิ่ง แล้วอาบน้ำละหมาดจากน้ำนั้น\" (ศ่อฮีห์) และเพราะการอาบน้ำกับการอาบน้ำละหมาดมีเหตุผลของข้อห้ามเหมือนกัน"]}], "tags_th": ["น้ำนิ่ง", "ปัสสาวะ", "อาบน้ำญะนาบะฮ์", "น้ำละหมาด", "นะญิส"]}, {"id": "v1-h007", "volume": 1, "bab": "miyah", "topic_ar": "نهي الرجل والمرأة أن يغتسل أحدهما بفضل الآخر", "topic_th": "ข้อห้ามชายและหญิงอาบน้ำด้วยน้ำเหลือของอีกฝ่าย", "pages": [46, 47], "hadith": [{"no": 7, "matn_ar": "عَنْ رَجُلٍ صَحِبَ النَّبِيَّ ﷺ قَالَ: «نَهَى رَسُولُ اللهِ ﷺ أَنْ تَغْتَسِلَ الْمَرْأَةُ بِفَضْلِ الرَّجُلِ، أَوِ الرَّجُلُ بِفَضْلِ الْمَرْأَةِ، وَلْيَغْتَرِفَا جَمِيعًا». أَخْرَجَهُ أَبُو دَاوُدَ، وَالنَّسَائِيُّ، وَإِسْنَادُهُ صَحِيحٌ.", "translation_th": "จากชายผู้หนึ่งที่เคยอยู่กับท่านนบี ﷺ กล่าวว่า \"ท่านรสูลุลลอฮ์ ﷺ ห้ามมิให้ผู้หญิงอาบน้ำด้วยน้ำที่เหลือจากผู้ชาย หรือผู้ชายอาบด้วยน้ำที่เหลือจากผู้หญิง แต่ให้ทั้งสองตักน้ำพร้อมกัน\" บันทึกโดยอบูดาวูดและอันนะสาอีย์ สายรายงานศ่อฮีห์", "grade_th": "ศ่อฮีห์"}], "key_rulings_th": ["ข้อห้ามในหะดีษนี้เป็นเพียงการไม่ส่งเสริม (ตันซีฮ์) ไม่ใช่หะรอม เพื่อให้สอดคล้องกับหะดีษที่แข็งแรงกว่าซึ่งแสดงว่าทำได้", "หากมีน้ำอื่น สิ่งที่ดีกว่าคือไม่อาบด้วยน้ำเหลือของอีกฝ่าย แต่หากจำเป็นต้องใช้ ก็ไม่เป็นมักรูฮ์ เพราะการอาบน้ำและอาบน้ำละหมาดเป็นวาญิบ", "ชายและหญิงอาบน้ำพร้อมกันจากภาชนะเดียวกันได้", "การอาบน้ำละหมาดด้วยน้ำเหลือของผู้หญิงมีข้อห้ามหนักกว่า ตามหะดีษอัลหะกัม บินอัมร์"], "vocab": [{"ar": "بِفَضْلِ", "th": "ด้วยน้ำที่เหลือ คือน้ำที่เหลืออยู่ในภาชนะหลังจากอีกฝ่ายใช้อาบแล้ว"}, {"ar": "وَلْيَغْتَرِفَا جَمِيعًا", "th": "ให้ทั้งสองตักน้ำพร้อมกันจากภาชนะเดียว"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ผู้รายงาน", "points_th": ["ไม่ทราบชื่อ ในสุนันอบูดาวูดระบุว่าเป็น \"ชายที่อยู่กับท่านนบี ﷺ สี่ปี เช่นเดียวกับอบูฮุร็อยเราะฮ์\" แสดงถึงความรอบคอบของผู้รายงานและความรู้จักที่ดีต่อเศาะหาบะฮ์ท่านนี้", "การไม่ระบุชื่อเศาะหาบะฮ์ไม่ทำให้หะดีษบกพร่อง เพราะเศาะหาบะฮ์ทุกคนเป็นผู้ซื่อตรง"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["บันทึกโดยอบูดาวูด (81) บทห้ามอาบน้ำละหมาดด้วยน้ำเหลือของผู้หญิง และอันนะสาอีย์ ผ่านสายดาวูด บินอับดิลลาฮ์ อัลเอาดีย์ จากหุมัยด์ อัลหิมยะรีย์ จากชายผู้นั้น", "สายรายงานศ่อฮีห์ อิบนุหะญัรกล่าวว่า ผู้รายงานเชื่อถือได้ และไม่พบผู้ที่ชี้ข้อบกพร่องด้วยหลักฐานหนักแน่น", "ข้ออ้างของอัลบัยฮะกีย์ว่าเหมือนหะดีษมุรสัลถูกตีตก เพราะการไม่ระบุชื่อเศาะหาบะฮ์ไม่เป็นไร และตาบิอีย์ยืนยันว่าได้พบเขา", "ข้ออ้างของอิบนุหัซม์ว่าดาวูดผู้รายงานคืออิบนุยะซีด อัลเอาดีย์ซึ่งอ่อน ก็ถูกตีตก เพราะแท้จริงคืออิบนุอับดิลลาฮ์ อัลเอาดีย์ ซึ่งเชื่อถือได้ อิบนุลก็อฏฏอนเล่าว่า อัลหุมัยดีย์เคยเขียนจดหมายถึงอิบนุหัซม์เพื่อแจ้งว่าหะดีษนี้ศ่อฮีห์"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "ข้อตัดสินและการประสานหลักฐาน", "points_th": ["หะดีษแสดงข้อห้ามผู้หญิงอาบน้ำด้วยน้ำที่เหลือจากการอาบของผู้ชาย และผู้ชายอาบด้วยน้ำที่เหลือจากผู้หญิง และอนุญาตให้ทั้งสองอาบพร้อมกันโดยตักจากภาชนะเดียว", "ข้อห้ามนี้ขัดกับหะดีษที่แข็งแรงกว่าและมีหลายสายกว่า ซึ่งแสดงว่าทำได้ (ดูหะดีษอิบนุอับบาสถัดไป) จึงใช้หะดีษเหล่านั้น หรือถือว่าข้อห้ามนี้เป็นเพียงการไม่ส่งเสริม (ตันซีฮ์) เพื่อประสานหลักฐานทั้งหมด", "การไม่ส่งเสริมนี้ใช้เมื่อมีน้ำอื่นให้อาบ หากจำเป็นต้องใช้น้ำเหลือของผู้หญิง ความเป็นมักรูฮ์ก็หมดไป เพราะการอาบน้ำและการอาบน้ำละหมาดเป็นวาญิบ และไม่มีมักรูฮ์ในสิ่งวาญิบเมื่อจำเป็น แต่ถ้ามีน้ำมาก สิ่งที่ดีกว่าคือไม่อาบด้วยน้ำเหลือของเธอ", "การอาบน้ำละหมาดด้วยน้ำเหลือของผู้หญิงมีข้อห้ามหนักกว่า ตามหะดีษอัลหะกัม บินอัมร์ อัลฆิฟารีย์ว่า ท่านนบี ﷺ ห้ามผู้ชายอาบน้ำละหมาดด้วยน้ำเหลือของผู้หญิง (บันทึกโดยอบูดาวูด อัตติรมิซีย์ และคนอื่น ๆ อัตติรมิซีย์ว่าหะซัน)"]}], "tags_th": ["อาบน้ำ", "น้ำเหลือ", "ชายและหญิง", "การประสานหลักฐาน"]}, {"id": "v1-h008-009", "volume": 1, "bab": "miyah", "topic_ar": "جواز اغتسال الرجل بفضل المرأة", "topic_th": "อนุญาตให้ผู้ชายอาบน้ำด้วยน้ำเหลือของผู้หญิง", "pages": [48, 51], "hadith": [{"no": 8, "matn_ar": "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللهُ عَنْهُمَا: أَنَّ النَّبِيَّ ﷺ كَانَ يَغْتَسِلُ بِفَضْلِ مَيْمُونَةَ رَضِيَ اللهُ عَنْهَا. أَخْرَجَهُ مُسْلِمٌ.", "translation_th": "จากอิบนุอับบาส (ร.ฎ.) ว่า ท่านนบี ﷺ เคยอาบน้ำด้วยน้ำที่เหลือจากมัยมูนะฮ์ (ร.ฎ.) บันทึกโดยมุสลิม", "grade_th": "ศ่อฮีห์"}, {"no": 9, "matn_ar": "وَلِأَصْحَابِ السُّنَنِ: اغْتَسَلَ بَعْضُ أَزْوَاجِ النَّبِيِّ ﷺ فِي جَفْنَةٍ، فَجَاءَ لِيَغْتَسِلَ مِنْهَا، فَقَالَتْ لَهُ: إِنِّي كُنْتُ جُنُبًا، فَقَالَ: «إِنَّ الْمَاءَ لَا يُجْنِبُ». وَصَحَّحَهُ التِّرْمِذِيُّ، وَابْنُ خُزَيْمَةَ.", "translation_th": "และในรายงานของนักบันทึกหนังสือสุนัน: ภรรยาท่านหนึ่งของท่านนบี ﷺ อาบน้ำในอ่างใบใหญ่ ท่านนบีจึงมาเพื่ออาบน้ำจากอ่างนั้น นางกล่าวกับท่านว่า \"ฉันมีญะนาบะฮ์\" ท่านตอบว่า \"แท้จริงน้ำนั้นไม่มีญะนาบะฮ์\" อัตติรมิซีย์และอิบนุคุซัยมะฮ์ระบุว่าศ่อฮีห์", "grade_th": "ศ่อฮีห์"}], "key_rulings_th": ["ผู้ชายอาบน้ำด้วยน้ำที่เหลือจากการอาบของผู้หญิงได้ และไม่ทำให้น้ำหมดความเป็นฏอฮูร", "การกระทำของท่านนบี ﷺ นี้เป็นตัวบ่งชี้ว่าข้อห้ามในหะดีษที่ 7 ไม่ใช่หะรอม", "ผู้หญิงอาบน้ำด้วยน้ำเหลือของผู้ชายได้เช่นกัน โดยเทียบจากกรณีผู้ชาย ซึ่งเป็นทัศนะของนักวิชาการส่วนใหญ่", "น้ำที่ผู้มีญะนาบะฮ์หรือผู้มีฮะดัษใช้ ส่วนที่เหลือไม่กลายเป็นนะญิส"], "vocab": [{"ar": "جَفْنَة", "th": "อ่างหรือถาดใบใหญ่"}, {"ar": "جُنُب", "th": "ผู้มีญะนาบะฮ์ จากการร่วมประเวณีหรือหลั่งอสุจิ ใช้คำเดียวกันได้ทั้งชายหญิง เอกพจน์ และพหูพจน์"}, {"ar": "لَا يُجْنِبُ", "th": "ไม่มีญะนาบะฮ์ คือน้ำไม่ติดสภาพญะนาบะฮ์จากผู้ใช้ ในรายงานของอันนะสาอีย์ใช้สำนวนว่า \"ไม่มีสิ่งใดทำให้น้ำเป็นนะญิส\" อัสสินดีย์อธิบายว่า เมื่อผู้มีญะนาบะฮ์หรือผู้มีฮะดัษใช้น้ำ ส่วนที่เหลือไม่กลายเป็นนะญิส"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อบุลอับบาส อับดุลลอฮ์ บินอับบาส บินอับดิลมุฏฏอลิบ อัลฮาชิมีย์ อัลกุรอชีย์ ปราชญ์ของประชาชาติ นักฟิกฮ์ และผู้อธิบายอัลกุรอาน", "เกิดก่อนฮิจญ์เราะฮ์สามปี ท่านนบี ﷺ ขอดุอาอ์ให้เขาว่า \"โอ้อัลลอฮ์ โปรดให้เขาเข้าใจศาสนา และสอนการตีความแก่เขา\" เขาจึงมีความรู้มาก", "ท่านนบี ﷺ เสียชีวิตขณะเขาใกล้บรรลุศาสนภาวะ เขาเสียชีวิตที่ฏออิฟ ปี ฮ.ศ. 68 มุหัมมัด บินอัลหะนะฟิยะฮ์ละหมาดญะนาซะฮ์ให้ และกล่าวว่า \"วันนี้ผู้รู้แห่งประชาชาตินี้ได้จากไปแล้ว\""]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجهما", "heading_th": "ที่มาของทั้งสองหะดีษ", "points_th": ["หะดีษที่ 8 บันทึกโดยมุสลิม (323) ผ่านอิบนุญุร็อยจ์ ซึ่งอัมร์ บินดีนารกล่าวว่า \"ความรู้ที่มั่นใจที่สุดของฉัน และสิ่งที่ฉันนึกได้คือ อบุชชะอ์ษาอ์บอกฉันว่า...\" บางคนชี้ว่าเป็นข้อบกพร่องเพราะความลังเลนี้", "ที่ถูกต้องคือไม่เป็นข้อบกพร่องด้วยสองเหตุผล หนึ่ง คำพูดนี้คือความมั่นใจในระดับสูง ไม่ใช่ความสงสัย และหะดีษอาหาดก็ให้ความมั่นใจในระดับนี้อยู่แล้ว สอง หะดีษอิบนุอับบาสมีรายงานในหนังสือสุนันจากสายอื่นที่มีความหมายเดียวกัน (คือหะดีษที่ 9)", "หะดีษที่ 9 บันทึกโดยอบูดาวูด (68), อัตติรมิซีย์ (65), อันนะสาอีย์, อิบนุมาญะฮ์ (370), อิบนุคุซัยมะฮ์ และอัลหากิม ผ่านสายสิมาก บินหัรบ์ จากอิกริมะฮ์ จากอิบนุอับบาส", "บางคนชี้ข้อบกพร่องที่สิมาก ซึ่งความจำสับสนในบั้นปลาย แต่อิบนุหะญัรตอบว่า ชุอ์บะฮ์รายงานหะดีษนี้จากสิมาก และชุอ์บะฮ์รายงานเฉพาะหะดีษที่ถูกต้องจากอาจารย์ของตน ผู้ที่ฟังจากสิมากตั้งแต่ต้นอย่างชุอ์บะฮ์และสุฟยาน หะดีษของพวกเขาถูกต้อง อัตติรมิซีย์ว่าหะซันศ่อฮีห์ อัลหากิมว่าศ่อฮีห์ และอัษษะฮะบีย์เห็นด้วย"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظهما", "heading_th": "อธิบายถ้อยคำ", "points_th": ["มัยมูนะฮ์ บินติอัลหาริษ อัลฮิลาลียะฮ์ ท่านนบี ﷺ แต่งงานกับนางในปี ฮ.ศ. 7 ตอนทำอุมเราะฮ์ชดเชย (อุมเราะตุลก็อฎออ์) ที่ตำบลสะริฟ ห่างจากตันอีมราวสามไมล์ หลังจากสามีคนก่อนเสียชีวิต นางเป็นภรรยาคนสุดท้ายที่ท่านแต่งงานด้วย", "ท่านหญิงอาอิชะฮ์ยกย่องนางว่า เป็นผู้ยำเกรงอัลลอฮ์ที่สุดคนหนึ่งในหมู่พวกเรา และรักษาสายสัมพันธ์เครือญาติมากที่สุด นางเสียชีวิตที่สะริฟ ปี ฮ.ศ. 51 ตามทัศนะที่มีน้ำหนักที่สุด"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "ข้อตัดสินและการประสานกับหะดีษที่ 7", "points_th": ["หะดีษนี้และหะดีษก่อนหน้าเป็นหลักฐานว่า ผู้ชายอาบน้ำด้วยน้ำที่เหลือจากการอาบของผู้หญิงได้ และไม่ส่งผลต่อความเป็นฏอฮูรของน้ำ เพราะน้ำไม่เป็นนะญิส", "การกระทำนี้ของท่านนบี ﷺ เพื่อแสดงบทบัญญัติว่าทำได้ จึงเป็นตัวบ่งชี้ที่เปลี่ยนข้อห้ามในหะดีษที่ 7 จากหะรอมเป็นเพียงการไม่ส่งเสริม เพราะท่านนบี ﷺ บางครั้งห้ามสิ่งหนึ่งแล้วกระทำเอง หรือใช้ให้ทำแล้วละเว้นเอง เพื่อแสดงว่าข้อใช้ไม่ใช่วาญิบ และข้อห้ามไม่ใช่หะรอม", "จะอ้างว่าเป็นกรณีเฉพาะของท่านนบี ﷺ ไม่ได้ เพราะคำกล่าวของท่าน \"น้ำไม่มีญะนาบะฮ์\" และ \"ไม่มีสิ่งใดทำให้น้ำเป็นนะญิส\" แสดงว่าไม่ใช่เรื่องเฉพาะ และคำว่า \"ผู้ชาย\" ในหะดีษข้อห้ามก็ครอบคลุมท่านด้วยตามหลักอุศูล", "ส่วนผู้หญิงอาบน้ำด้วยน้ำเหลือของผู้ชาย ไม่มีหลักฐานเฉพาะ แต่เทียบจากกรณีผู้ชายได้โดยยิ่งกว่า อิบนุอับดิลบัรร์กล่าวว่า ไม่เป็นไรที่ชายหรือหญิงจะชำระตัวด้วยน้ำเหลือของอีกฝ่าย จะอาบพร้อมกันหรือแยกกันก็ตาม เป็นทัศนะของนักฟิกฮ์ในหัวเมืองต่าง ๆ และนักวิชาการส่วนใหญ่ และมีรายงานด้านความหมายนี้มากมาย"]}], "tags_th": ["อาบน้ำ", "น้ำเหลือ", "ชายและหญิง", "ญะนาบะฮ์", "การประสานหลักฐาน"]}, {"id": "v1-h010", "volume": 1, "bab": "miyah", "topic_ar": "كيفية تطهير ما ولغ فيه الكلب", "topic_th": "วิธีชำระภาชนะที่สุนัขเลีย", "pages": [52, 58], "hadith": [{"no": 10, "matn_ar": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «طُهُورُ إِنَاءِ أَحَدِكُمْ إِذَا وَلَغَ فِيهِ الْكَلْبُ أَنْ يَغْسِلَهُ سَبْعَ مَرَّاتٍ، أُولَاهُنَّ بِالتُّرَابِ». أَخْرَجَهُ مُسْلِمٌ. وَفِي لَفْظٍ لَهُ: «فَلْيُرِقْهُ». وَلِلتِّرْمِذِيِّ: «أُخْرَاهُنَّ، أَوْ أُولَاهُنَّ بِالتُّرَابِ».", "translation_th": "จากอบูฮุร็อยเราะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"การชำระภาชนะของผู้ใดในพวกท่านเมื่อสุนัขเลีย คือให้ล้างเจ็ดครั้ง ครั้งแรกด้วยดิน\" บันทึกโดยมุสลิม และในอีกสำนวนของมุสลิม: \"ให้เทสิ่งที่อยู่ในภาชนะทิ้ง\" และในรายงานของอัตติรมิซีย์: \"ครั้งสุดท้าย หรือครั้งแรก ด้วยดิน\"", "grade_th": "ศ่อฮีห์"}], "key_rulings_th": ["สุนัขเป็นนะญิส และเป็นนะญิสที่หนักที่สุด ทั้งน้ำลาย ปัสสาวะ เหงื่อ และทุกสิ่งที่ออกจากร่างกาย ครอบคลุมสุนัขทุกประเภท รวมถึงสุนัขล่าสัตว์และสุนัขเฝ้าปศุสัตว์", "ภาชนะที่สุนัขเลียต้องล้างเจ็ดครั้ง และต้องใช้ดินผสมกับน้ำด้วย สบู่หรือสิ่งอื่นใช้แทนดินไม่ได้ เว้นแต่หาดินไม่ได้", "ดินควรใช้ในครั้งแรก เพราะเป็นรายงานที่มีน้ำหนักที่สุด และน้ำในครั้งต่อ ๆ ไปจะล้างคราบดินออก", "ตามทัศนะของนักวิชาการส่วนใหญ่ การล้างเจ็ดครั้งใช้กับนะญิสทุกอย่างจากสุนัข ไม่เฉพาะการเลีย ซึ่งเป็นทัศนะที่รอบคอบกว่า", "การล้างเจ็ดครั้งเฉพาะสุนัขเท่านั้น ไม่นำไปเทียบกับสุกร ส่วนนะญิสอื่นให้ล้างจนนะญิสและร่องรอยหมดไป ไม่กำหนดจำนวนครั้ง"], "vocab": [{"ar": "طُهُورُ", "th": "(อ่านสระอุ หรือสระอะก็ได้) การชำระให้สะอาด"}, {"ar": "وَلَغَ", "th": "เลียหรือดื่ม คือเอาปลายลิ้นจุ่มลงไปแล้วขยับ ในรายงานของมุสลิมใช้คำว่า \"ดื่ม\""}, {"ar": "الْكَلْب", "th": "สุนัข อัล (ال) ในที่นี้หมายถึงสุนัขทุกประเภท ไม่ต่างกันระหว่างสุนัขที่ได้รับอนุญาตให้เลี้ยง เช่น สุนัขล่าสัตว์ เฝ้าปศุสัตว์ หรือเฝ้าไร่ กับสุนัขอื่น"}, {"ar": "أُولَاهُنَّ بِالتُّرَابِ", "th": "ครั้งแรกให้ล้างโดยมีดินร่วมด้วย"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["บันทึกโดยมุสลิม (279) บทหุก่มการเลียของสุนัข ผ่านสายฮิชาม บินหัสซาน จากมุหัมมัด บินสีรีน จากอบูฮุร็อยเราะฮ์", "สำนวน \"ให้เทออก\" มาจากสายอะลี บินมุสฮิร จากอัลอะอ์มัช ฉบับเต็มว่า \"เมื่อสุนัขเลียในภาชนะของผู้ใดในพวกท่าน ให้เทออกแล้วล้างเจ็ดครั้ง\" แต่นักหะดีษบางท่านวิจารณ์สำนวนนี้ เพราะผู้รายงานจากอัลอะอ์มัชอีกเก้าคน รวมถึงชุอ์บะฮ์ ไม่ได้รายงานไว้", "รากของหะดีษอยู่ในเศาะฮีหัยน์ว่า \"เมื่อสุนัขดื่มในภาชนะของผู้ใดในพวกท่าน ให้ล้างเจ็ดครั้ง\" มุสลิมเพิ่ม \"ครั้งแรกด้วยดิน\" อิบนุหะญัรจึงเลือกรายงานของมุสลิมเพราะสมบูรณ์กว่า", "มีหะดีษสนับสนุนจากอับดุลลอฮ์ บินมุฆ็อฟฟัลว่า \"ให้ล้างเจ็ดครั้ง และขัดครั้งที่แปดด้วยดิน\" (มุสลิม) และอัตติรมิซีย์บันทึกว่า \"...ครั้งแรกหรือครั้งสุดท้ายด้วยดิน และถ้าแมวเลีย ให้ล้างครั้งเดียว\" (หะซันศ่อฮีห์)"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"การชำระภาชนะ... คือให้ล้างเจ็ดครั้ง\" หมายความว่า การชำระภาชนะที่สุนัขเลียทำได้ด้วยการล้างเจ็ดครั้ง", "คำว่า \"สุนัข\" ใช้รูปที่ครอบคลุมทุกตัว จึงจำกัดเฉพาะบางประเภทไม่ได้ เว้นแต่มีหลักฐาน สุนัขที่ได้รับอนุญาตให้เลี้ยงจึงไม่ต่างจากสุนัขอื่น", "\"ครั้งแรกด้วยดิน\" คือลักษณะของการล้างครั้งหนึ่งในเจ็ดครั้ง และคำว่า \"ด้วย\" หมายถึงให้มีดินร่วมกับน้ำ"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "สุนัขเป็นนะญิส", "points_th": ["หะดีษเป็นหลักฐานว่าสุนัขเป็นนะญิส เพราะคำว่า \"การชำระ\" ใช้กับฮะดัษหรือนะญิสเท่านั้น และภาชนะไม่อาจมีฮะดัษ จึงเหลือเพียงนะญิส อีกทั้งยังมีคำสั่งให้เทสิ่งที่อยู่ในภาชนะออก", "ถ้าปากซึ่งเป็นส่วนที่สะอาดที่สุดของสุนัข เพราะหายใจหอบบ่อย ยังเป็นนะญิส ส่วนอื่นของร่างกายยิ่งเป็นนะญิส", "อิบนุดะกีกิลอีดปฏิเสธทัศนะที่ว่าการล้างนี้เป็นเพียงการปฏิบัติตามคำสั่งโดยไม่มีเหตุผล (ตะอับบุด) เพราะเมื่อหุก่มตีความได้ทั้งสองแบบ การถือว่ามีเหตุผลที่เข้าใจได้ย่อมดีกว่า"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "เจ็ดครั้งหรือแปดครั้ง", "points_th": ["หะดีษแสดงว่าต้องล้างเจ็ดครั้ง เพราะนะญิสของสุนัขหนักที่สุด", "หะดีษอิบนุมุฆ็อฟฟัลระบุว่าครั้งที่แปดด้วยดิน อัลหะซัน อัลบัศรีย์เคยให้ฟัตวาตามนี้ อิบนุดะกีกิลอีดเห็นด้วย และมีรายงานจากอะห์มัดและมาลิก", "นักวิชาการบางท่านเลือกหะดีษอบูฮุร็อยเราะฮ์ว่าเจ็ดครั้ง โดยอธิบายว่า ดินถูกนับเป็นอีกครั้งหนึ่งเพราะต่างประเภทจากน้ำ จึงเรียกว่าครั้งที่แปด และอบูฮุร็อยเราะฮ์จำหะดีษได้แม่นยำที่สุดในยุคของเขา", "บางท่านเลือกรายงานอิบนุมุฆ็อฟฟัล เพราะมีข้อมูลเพิ่ม และข้อมูลเพิ่มจากผู้เชื่อถือได้ย่อมรับได้ ผู้แต่งเห็นว่าไม่เป็นไร เพราะเป็นการยึดตัวบทตามความหมายตรงและเป็นการระมัดระวัง"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "สุกรและนะญิสอื่น", "points_th": ["การล้างหลายครั้งเป็นเรื่องเฉพาะนะญิสของสุนัข ไม่นำไปเทียบกับสัตว์อื่น เช่น สุกร เพราะอิบาดะฮ์ต้องมีตัวบทกำหนด ใช้ความเห็นหรือการเทียบไม่ได้ และสุกรถูกกล่าวถึงในอัลกุรอานและมีอยู่ในสมัยท่านนบี ﷺ แต่ไม่มีรายงานให้ล้างเจ็ดครั้ง นะญิสของมันจึงเหมือนนะญิสอื่น", "นะญิสอื่นให้ล้างครั้งเดียวที่ทำให้ตัวนะญิสและร่องรอยหมดไป ถ้ายังไม่หมดให้ล้างเพิ่ม แม้จะเกินเจ็ดครั้ง ไม่ว่าจะเป็นพื้น เสื้อผ้า พรม หรือภาชนะ นี่คือทัศนะของนักวิชาการส่วนใหญ่", "หลักฐานคือหะดีษเรื่องเลือดประจำเดือนที่ให้ขูดออก ล้างน้ำ แล้วละหมาดได้ (จะกล่าวในหะดีษที่ 30) ซึ่งไม่ได้กำหนดจำนวนครั้ง และเพราะเป้าหมายคือขจัดนะญิส เมื่อนะญิสหมดไป หุก่มก็หมดไป"]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "นะญิสส่วนอื่นของสุนัข", "points_th": ["ท่านนบี ﷺ ระบุเรื่องการเลียเพราะเป็นกรณีที่เกิดบ่อย สุนัขไม่ได้ปัสสาวะหรือถ่ายในภาชนะ สิ่งที่ระบุตามกรณีส่วนใหญ่ไม่มีความหมายแฝง นะญิสของสุนัขจึงครอบคลุมทั้งร่างกาย และต้องล้างแบบเดียวกัน นี่คือทัศนะของนักวิชาการส่วนใหญ่", "สำนักซอฮิรียะฮ์เห็นว่าการล้างเจ็ดครั้งเฉพาะการเลีย ส่วนปัสสาวะ มูล เลือด หรือเหงื่อของสุนัขเหมือนนะญิสอื่น อันนะวะวีย์ว่าทัศนะนี้มีน้ำหนักด้านหลักฐาน และอัชเชากานีย์เลือกทัศนะนี้", "อัลอิรอกีย์ตอบว่า การระบุเรื่องการเลียเป็นการระบุตามกรณีส่วนใหญ่ ไม่ใช่เงื่อนไข เพราะสุนัขมักมาที่ภาชนะเพื่อกินหรือดื่ม ผู้แต่งสรุปว่า ทัศนะของนักวิชาการส่วนใหญ่รอบคอบกว่าในเรื่องนี้"]}, {"wajh": 7, "type": "fiqh", "heading_ar": null, "heading_th": "การใช้ดิน", "points_th": ["หะดีษระบุชัดว่าต้องใช้ดินร่วมกับน้ำ เพราะนะญิสของสุนัขรุนแรง เป็นทัศนะของสำนักชาฟิอีย์และหันบะลีย์ จะผสมดินกับน้ำจนขุ่น หรือเทน้ำลงบนดินก็ได้", "สิ่งอื่น เช่น ผงล้างแบบโบราณ (อุชนาน) หรือสบู่ ใช้แทนดินไม่ได้ เว้นแต่หาดินไม่ได้ เพราะเมื่อตัวบทระบุสิ่งหนึ่งไว้และอาจมีความหมายเฉพาะสิ่งนั้น จะละทิ้งสิ่งที่ตัวบทระบุไม่ได้", "แม้ดินอาจมีไว้เพื่อเพิ่มความสะอาด แต่ไม่อาจยืนยันได้ เพราะยังมีความหมายอื่น คือการรวมสารชำระสองอย่าง น้ำกับดิน ซึ่งไม่มีในสบู่ และตามหลักอุศูล ความหมายที่อนุมานขึ้นแล้วไปลบล้างหรือจำกัดตัวบท ถือว่าใช้ไม่ได้"]}, {"wajh": 8, "type": "fiqh", "heading_ar": null, "heading_th": "ใช้ดินครั้งไหน", "points_th": ["รายงานต่าง ๆ ระบุตำแหน่งของดินต่างกัน: \"ครั้งแรก\" \"ครั้งที่แปด\" \"ครั้งแรกหรือครั้งสุดท้าย\" \"ครั้งใดครั้งหนึ่ง\" และ \"ครั้งแรกหรือครั้งที่เจ็ด\"", "ความต่างนี้ไม่ทำให้ต้องตัดการใช้ดินทิ้งเพราะความสับสน ดังที่สำนักหะนะฟีย์และมาลิกีย์เห็น เพราะหะดีษที่สับสนจะตกไปก็ต่อเมื่อทุกรายงานมีน้ำหนักเท่ากัน ถ้ามีรายงานที่มีน้ำหนักกว่า ก็ใช้รายงานนั้น", "\"ครั้งแรก\" มีน้ำหนักที่สุดด้วยสามเหตุผล: (1) ผู้รายงานมากกว่า คือสามคนจากอิบนุสีรีน (2) มุสลิมบันทึกไว้ในเศาะฮีห์ของท่าน (3) ด้านความหมาย ถ้าใช้ดินครั้งแรก น้ำครั้งต่อไปจะล้างคราบดินออก แต่ถ้าใช้ครั้งที่เจ็ด ต้องล้างเพิ่มอีกครั้งเพื่อทำความสะอาดดิน", "รายงานอัตติรมิซีย์ \"ครั้งแรกหรือครั้งสุดท้าย\" ถ้าเป็นคำของท่านนบี ﷺ ก็เป็นการให้เลือก แต่ถ้าเป็นความสงสัยของผู้รายงาน ก็ให้เลือกรายงานที่มีน้ำหนักกว่าคือ \"ครั้งแรก\" ซึ่งมีหลักฐานว่าเป็นความสงสัยของผู้รายงาน", "รายงาน \"ครั้งใดครั้งหนึ่ง\" ไม่มีในหนังสือหกเล่มหลัก และเป็นถ้อยคำกว้าง จึงตีความตามรายงานที่ระบุชัด ส่วนรายงาน \"ครั้งที่แปด\" ของอิบนุมุฆ็อฟฟัล นับรวมดินเป็นอีกครั้งหนึ่งเพิ่มจากน้ำเจ็ดครั้ง ไม่ได้หมายความว่าต้องเป็นครั้งสุดท้าย จึงไม่ขัดกับการใช้ดินในครั้งแรก"]}, {"wajh": 9, "type": "fiqh", "heading_ar": null, "heading_th": "การเทสิ่งที่อยู่ในภาชนะทิ้ง", "points_th": ["สำนวน \"ให้เทออก\" แสดงว่าต้องเทน้ำ นม หรือสิ่งอื่นในภาชนะทิ้ง เพราะน้ำลายสุนัขเป็นนะญิส ภาชนะมักมีขนาดเล็ก และน้ำในนั้นมีน้อย ไม่อาจขจัดนะญิสได้เอง และถ้าสิ่งในภาชนะสะอาด ก็คงไม่มีคำสั่งให้เททิ้ง เพราะการทำลายทรัพย์สินเป็นสิ่งต้องห้าม", "แต่นักหะดีษบางท่านวิจารณ์สำนวนนี้ เพราะอะลี บินมุสฮิรรายงานเพียงคนเดียว อันนะสาอีย์กล่าวว่าไม่รู้ว่ามีใครรายงานสอดคล้องกับเขา", "อัลอิรอกีย์และอิบนุลมุลักกินเห็นว่าไม่เป็นปัญหา เพราะอะลีเชื่อถือได้ และข้อมูลเพิ่มจากผู้เชื่อถือได้ย่อมรับได้ อัดดารุกุฏนีย์กล่าวว่าสายรายงานหะซัน", "แต่ผู้แต่งเห็นว่าสำนวนนี้น่าจะไม่ใช่สำนวนที่ถูกต้อง (ชาซ) เพราะอะลีรายงานขัดกับผู้รายงานส่วนใหญ่ที่ไม่ได้รายงานคำนี้ อิบนุหะญัรเองกล่าวถึงอะลีว่า เชื่อถือได้ แต่มีรายงานแปลก ๆ หลังจากตาบอด และคำของอิมามรุ่นใหญ่ย่อมมาก่อนคำของผู้มาทีหลัง"]}], "tags_th": ["สุนัข", "นะญิส", "ล้างเจ็ดครั้ง", "ดิน", "ภาชนะ"]}, {"id": "v1-h011", "volume": 1, "bab": "miyah", "topic_ar": "طهارة سؤر الهرة", "topic_th": "น้ำเหลือจากแมวสะอาด", "pages": [59, 63], "hadith": [{"no": 11, "matn_ar": "عَنْ أَبِي قَتَادَةَ رَضِيَ اللهُ عَنْهُ: أَنَّ رَسُولَ اللهِ ﷺ قَالَ - فِي الْهِرَّةِ -: «إِنَّهَا لَيْسَتْ بِنَجَسٍ، إِنَّمَا هِيَ مِنَ الطَّوَّافِينَ عَلَيْكُمْ». أَخْرَجَهُ الْأَرْبَعَةُ، وَصَحَّحَهُ التِّرْمِذِيُّ، وَابْنُ خُزَيْمَةَ.", "translation_th": "จากอบูเกาะตาดะฮ์ (ร.ฎ.) ว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวเกี่ยวกับแมวว่า \"แท้จริงมันไม่ใช่นะญิส แท้จริงมันเป็นหนึ่งในบรรดาผู้ที่เดินวนเวียนอยู่รอบตัวพวกท่าน\" บันทึกโดยนักบันทึกทั้งสี่ อัตติรมิซีย์และอิบนุคุซัยมะฮ์ระบุว่าศ่อฮีห์", "grade_th": "ศ่อฮีห์"}], "key_rulings_th": ["ปากแมวและน้ำหรืออาหารที่เหลือจากแมวสะอาด โดยมติเห็นพ้อง ใช้อาบน้ำละหมาดได้", "ร่างกายแมวทั้งหมดสะอาด ไม่เฉพาะปาก ตามทัศนะที่มีน้ำหนัก สิ่งที่แมวสัมผัสจึงสะอาดแม้จะเปียก", "สัตว์ใดที่วนเวียนอยู่กับคนบ่อยและหลีกเลี่ยงได้ยากเหมือนแมว ก็มีหุก่มเดียวกัน การจำกัดด้วยขนาดตัวไม่มีหลักฐาน", "ลาและล่อมีหุก่มเดียวกับแมว คือน้ำเหลือและเหงื่อสะอาด ตามทัศนะที่ถูกต้อง", "เป็นตัวอย่างของหลักใหญ่ \"ความยากลำบากนำมาซึ่งความง่าย\""], "vocab": [{"ar": "سُؤْر", "th": "น้ำหรืออาหารที่เหลือจากการกินดื่ม ความหมายนี้เป็นความหมายที่ใช้ในหะดีษนี้ ส่วนนักฟิกฮ์บางท่านใช้หมายถึงน้ำลายของสัตว์"}, {"ar": "الْهِرَّة", "th": "แมวตัวเมีย ส่วนตัวผู้เรียกว่า هِرّ อิบนุลอันบารีย์ว่า هِرّ ใช้ได้ทั้งตัวผู้และตัวเมีย"}, {"ar": "لَيْسَتْ بِنَجَسٍ", "th": "(อ่านสระอะที่ญีม) ไม่ใช่สิ่งที่เป็นนะญิสในตัวเอง เป็นคำนามกริยาจึงไม่ผันตามเพศ เหมือนในอัลกุรอาน \"แท้จริงพวกมุชริกนั้นเป็นนะญัส\" (อัตเตาบะฮ์: 28)"}, {"ar": "الطَّوَّافِين", "th": "ผู้ที่เดินวนเวียน เปรียบแมวกับคนรับใช้ในบ้านที่วนเวียนดูแลคนในบ้าน ใช้รูปพหูพจน์ของมนุษย์ ชี้ว่าแมวเป็นประเภทเดียวกับผู้ที่ไม่ต้องขออนุญาตเข้าหาในเวลาปกติ นอกจากสามช่วงเวลาที่อัลลอฮ์ระบุ เพราะความจำเป็นและการเข้าออกบ่อย"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อบูเกาะตาดะฮ์ อัลหาริษ บินริบอีย์ อัลอันศอรีย์ อัลค็อซเราะญีย์ ร่วมสงครามอุฮุดและสงครามหลังจากนั้น ได้รับฉายาว่า \"อัศวินของท่านรสูลุลลอฮ์ ﷺ\" ตามที่บันทึกในเศาะฮีห์มุสลิม", "ในการเดินทางครั้งหนึ่ง เขาประคองท่านนบี ﷺ ขณะที่ท่านเอนตัวจากพาหนะเพราะง่วงหลับ เมื่อท่านตื่นจึงกล่าวว่า \"ขออัลลอฮ์ทรงคุ้มครองท่าน เหมือนที่ท่านได้ปกป้องนบีของพระองค์\" (มุสลิม)", "เสียชีวิตที่มะดีนะฮ์ ปี ฮ.ศ. 54"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["บันทึกโดยอบูดาวูด (75) บทน้ำเหลือของแมว, อัตติรมิซีย์ (92), อันนะสาอีย์, อิบนุมาญะฮ์ (367) และอิบนุคุซัยมะฮ์ (104) ผ่านสายอิมามมาลิก จากอิสหาก บินอับดิลลาฮ์ บินอบีฏ็อลหะฮ์ จากหุมัยดะฮ์ บินติอุบัยด์ จากกับชะฮ์ บินติกะอ์บ", "ฉบับเต็ม: กับชะฮ์ (ลูกสะใภ้ของอบูเกาะตาดะฮ์) เล่าว่า อบูเกาะตาดะฮ์เข้ามา นางจึงเทน้ำสำหรับอาบน้ำละหมาดให้ แล้วมีแมวมาดื่ม เขาเอียงภาชนะให้มันจนดื่มเสร็จ เขาเห็นนางมองอยู่จึงถามว่า \"เธอแปลกใจหรือ หลานสาว\" นางตอบว่าใช่ เขาจึงเล่าหะดีษนี้", "อัตติรมิซีย์ว่าหะซันศ่อฮีห์ และมาลิกรายงานได้ดีที่สุด อิบนุหะญัรกล่าวว่า อัลบุคอรีย์ อัตติรมิซีย์ อัลอุก็อยลีย์ อัดดารุกุฏนีย์ อิบนุคุซัยมะฮ์ อิบนุหิบบาน และอัลหากิมยืนยันว่าศ่อฮีห์ ในรายงานของมาลิกมีคำว่า \"والطوافات\" (ทั้งตัวผู้และตัวเมีย) ด้วย", "อิบนุมันดะฮ์ชี้ข้อบกพร่องว่า หุมัยดะฮ์และกับชะฮ์ไม่เป็นที่รู้จัก แต่อิบนุลมุลักกินโต้แย้งโดยอาศัยการรับรองของอิมามหะดีษ และผู้แต่งอธิบายเพิ่มว่า หุมัยดะฮ์มีรายงานอื่นอีก และมีผู้รายงานจากนางหลายคน ส่วนกับชะฮ์ อิบนุหิบบานรับรองว่าเชื่อถือได้ และระบุว่านางเป็นเศาะหาบะฮ์ อิบนุลก็อฏฏอนกล่าวว่า เมื่อผู้รายงานได้รับการรับรองแล้ว สถานะไม่เป็นที่รู้จักก็หมดไป แม้มีผู้รายงานจากเขาเพียงคนเดียว"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["ประโยค \"แท้จริงมันเป็นหนึ่งในบรรดาผู้ที่เดินวนเวียน\" เป็นการให้เหตุผลว่าทำไมแมวไม่เป็นนะญิส คือความจำเป็นจากการที่มันเดินเข้าออกบ้านบ่อย จนยากจะป้องกันภาชนะจากมัน อัลลอฮ์จึงทรงกำหนดให้มันสะอาด ด้วยความเมตตาและเพื่อขจัดความลำบากแก่บ่าวของพระองค์"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "ความสะอาดของแมว", "points_th": ["หะดีษเป็นหลักฐานว่าปากแมวและน้ำเหลือของมันสะอาด โดยมติเห็นพ้อง ด้วยเหตุผลเรื่องการวนเวียนที่ระบุไว้ในหะดีษ การระบุชัดว่าไม่เป็นนะญิส และการที่อบูเกาะตาดะฮ์ใช้น้ำที่เหลือจากแมวอาบน้ำละหมาด", "\"มันไม่ใช่นะญิส\" แสดงว่าร่างกายแมวทั้งหมดสะอาด ตามทัศนะที่มีน้ำหนัก ต่างจากผู้ที่จำกัดความสะอาดไว้เฉพาะน้ำเหลือและสิ่งที่มันใช้ปากหยิบ ซึ่งขัดกับความหมายของหะดีษ", "นี่เป็นตัวอย่างของหลักใหญ่ \"ความยากลำบากนำมาซึ่งความง่าย\" เพราะแมววนเวียนบ่อยและหลีกเลี่ยงได้ยาก สิ่งที่มันสัมผัสจึงสะอาดแม้จะเปียก อิบนุกุดามะฮ์กล่าวว่า หะดีษนี้แสดงว่าน้ำเหลือของแมวและสัตว์ที่วนเวียนอยู่กับคนซึ่งเล็กกว่าแมว ไม่เป็นมักรูฮ์", "ดังนั้นสัตว์ใดที่วนเวียนกับคนบ่อยและหลีกเลี่ยงได้ยากเหมือนแมว ก็สะอาด ส่วนการจำกัดหุก่มด้วยขนาดตัว คือเล็กเท่าแมวหรือเล็กกว่า ไม่มีหลักฐาน"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "ลาและล่อ", "points_th": ["ทัศนะที่ถูกต้องคือ ลาและล่อมีหุก่มเดียวกับแมว น้ำเหลือและเหงื่อของมันสะอาด เพราะมีเหตุผลเดียวกัน และผู้คนจำเป็นต้องใช้ขี่และบรรทุก โดยเฉพาะก่อนมีรถยนต์", "ท่านนบี ﷺ และเศาะหาบะฮ์เคยขี่ลาและล่อ หากมันเป็นนะญิส ท่านนบี ﷺ คงอธิบายไว้"]}, {"wajh": 6, "type": "fawaid", "heading_ar": null, "heading_th": "วิธีสอนของท่านนบี ﷺ", "points_th": ["หะดีษแสดงถึงการสอนที่ดีของท่านนบี ﷺ ที่ผูกหุก่มไว้กับเหตุผล ซึ่งมีประโยชน์หลายประการ: แสดงถึงความสูงส่งและความสมบูรณ์ของบทบัญญัติ ว่าทุกสิ่งมีวิทยปัญญา เสริมความศรัทธาของผู้ปฏิบัติเมื่อรู้เหตุผล และนำหุก่มไปใช้กับทุกกรณีที่มีเหตุผลเดียวกัน"]}], "tags_th": ["แมว", "น้ำเหลือ", "นะญิส", "ลาและล่อ", "ความง่ายในศาสนา"]}, {"id": "v1-h012", "volume": 1, "bab": "miyah", "topic_ar": "كيفية تطهير الأرض من البول", "topic_th": "วิธีชำระพื้นดินที่เปื้อนปัสสาวะ", "pages": [64, 67], "hadith": [{"no": 12, "matn_ar": "عَنْ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللهُ عَنْهُ قَالَ: جَاءَ أَعْرَابِيٌّ فَبَالَ فِي طَائِفَةِ الْمَسْجِدِ، فَزَجَرَهُ النَّاسُ، فَنَهَاهُمُ النَّبِيُّ ﷺ، فَلَمَّا قَضَى بَوْلَهُ أَمَرَ النَّبِيُّ ﷺ بِذَنُوبٍ مِنْ مَاءٍ؛ فَأُهْرِيقَ عَلَيْهِ. مُتَّفَقٌ عَلَيْهِ.", "translation_th": "จากอนัส บินมาลิก (ร.ฎ.) กล่าวว่า ชาวอาหรับเร่ร่อนคนหนึ่งมาปัสสาวะที่มุมหนึ่งของมัสยิด ผู้คนจึงตะคอกห้ามเขา แต่ท่านนบี ﷺ ห้ามพวกเขาไว้ เมื่อเขาปัสสาวะเสร็จ ท่านนบี ﷺ สั่งให้นำน้ำหนึ่งถังใหญ่มาเทราดลงไป (บันทึกโดยอัลบุคอรีย์และมุสลิม)", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["พื้นดินที่เปื้อนนะญิสชำระได้ด้วยการเทน้ำราดครั้งเดียว ไม่ต้องขุดหรือขนดินออก ไม่ว่าดินอ่อนหรือแข็ง โดยมีเงื่อนไขว่าตัวนะญิสต้องหมดไป ถ้านะญิสมีเนื้อ เช่น อุจจาระหรือเลือดแห้ง ต้องเอาออกก่อน", "ต้องรีบชำระมัสยิดเมื่อมีนะญิส และต้องดูแลรักษามัสยิดให้สะอาด", "พื้นดินที่แห้งจนร่องรอยนะญิสหมดไปถือว่าสะอาด ตามทัศนะของหะนะฟีย์ ซึ่งอิบนุตัยมิยะฮ์และอิบนุลก็อยยิมเลือก แต่ส่วนใหญ่เห็นว่าต้องใช้น้ำ", "ต้องสอนผู้ไม่รู้ด้วยความนุ่มนวล", "เมื่อความเสียหายสองอย่างขัดกัน ให้เลือกความเสียหายที่เบากว่า เพื่อป้องกันความเสียหายที่ใหญ่กว่า"], "vocab": [{"ar": "أَعْرَابِيّ", "th": "ชาวอาหรับเร่ร่อนที่อาศัยในทะเลทราย"}, {"ar": "ذَنُوب", "th": "ถังตักน้ำขนาดใหญ่ที่บรรจุน้ำเต็ม"}, {"ar": "فَأُهْرِيقَ عَلَيْهِ", "th": "แล้วน้ำก็ถูกเทราดลงไป"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อนัส บินมาลิก บินอันนัฎร์ อบูหัมซะฮ์ อัลอันศอรีย์ อัลค็อซเราะญีย์ ผู้รับใช้ท่านรสูลุลลอฮ์ ﷺ", "เมื่อท่านนบี ﷺ มาถึงมะดีนะฮ์ อนัสอายุสิบขวบ แม่ของเขา อุมมุสุลัยม์ พามาหาท่านนบีและกล่าวว่า \"นี่คืออนัส เด็กที่จะรับใช้ท่าน\" ท่านนบีจึงรับไว้และขอดุอาอ์ให้ว่า \"โอ้อัลลอฮ์ ขอให้ทรัพย์สินและลูกหลานของเขามากมาย และให้เขาได้เข้าสวรรค์\"", "อนัสกล่าวว่า ฉันได้เห็นสองข้อแรกแล้ว และหวังข้อที่สาม ฉันฝังลูกหลานของตนเองไปแล้วกว่าหนึ่งร้อยยี่สิบห้าคน และสวนของฉันออกผลปีละสองครั้ง", "รับใช้ท่านนบี ﷺ จนท่านเสียชีวิต อยู่ที่มะดีนะฮ์ระยะหนึ่ง แล้วย้ายไปบัศเราะฮ์ และเสียชีวิตที่นั่น ปี ฮ.ศ. 90"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["บันทึกโดยอัลบุคอรีย์ในกิตาบอัลวุฎูอ์ (219, 221) และมีรายงานจากอบูฮุร็อยเราะฮ์ (220) ซึ่งตอนท้ายมีว่า \"แท้จริงพวกท่านถูกส่งมาเพื่อทำให้ง่าย ไม่ได้ถูกส่งมาเพื่อทำให้ยาก\"", "ในกิตาบอัลอะดับ (6010) มีเรื่องว่า ชาวอาหรับเร่ร่อนคนนี้กล่าวในละหมาดว่า \"โอ้อัลลอฮ์ โปรดเมตตาฉันและมุหัมมัด และอย่าเมตตาผู้ใดอีกนอกจากเรา\" หลังสลาม ท่านนบี ﷺ กล่าวกับเขาว่า \"ท่านได้ทำให้สิ่งที่กว้างขวางกลายเป็นแคบ\" หมายถึงความเมตตาของอัลลอฮ์", "มุสลิม (284) บันทึกว่า ท่านนบี ﷺ เรียกเขามาแล้วกล่าวว่า \"มัสยิดเหล่านี้ไม่เหมาะกับปัสสาวะหรือสิ่งสกปรกใด ๆ แท้จริงมันมีไว้เพื่อการรำลึกถึงอัลลอฮ์ การละหมาด และการอ่านอัลกุรอาน\""]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["คำว่า \"ذنوب\" จะเรียกได้ก็ต่อเมื่อถังเต็มน้ำ คำว่า \"من ماء\" (ของน้ำ) จึงเป็นการเน้นย้ำให้ชัดเจน"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "การดูแลมัสยิดและการห้ามปรามที่ถูกวิธี", "points_th": ["หะดีษแสดงว่าต้องดูแล ให้เกียรติ และรักษามัสยิดให้สะอาดจากปัสสาวะ อุจจาระ และสิ่งสกปรกทั้งหลาย", "การที่ผู้คนตะคอกห้ามชายผู้นั้นทันที แสดงว่าการห้ามปรามสิ่งผิดเป็นที่รู้กันในหมู่พวกเขา แต่พวกเขามองไม่เห็นว่าการหยุดเขากลางคันจะเป็นอันตรายต่อเขา และทำให้นะญิสกระจายไปที่อื่นอีก ท่านนบี ﷺ จึงห้ามพวกเขา และสั่งให้ปฏิบัติต่อเขาด้วยความนุ่มนวล"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "วิธีชำระพื้นดิน", "points_th": ["พื้นดินที่เปื้อนนะญิสสะอาดได้ด้วยการเทน้ำราดครั้งเดียว ไม่ต้องทำซ้ำ ไม่ว่าดินอ่อนหรือแข็ง โดยมีเงื่อนไขว่าตัวนะญิสต้องหมดไป และคำว่า \"เทราดลงไป\" แสดงว่าไม่ต้องขุดหรือขนดินออก หรือทำขอบกั้น นี่คือทัศนะของนักวิชาการส่วนใหญ่", "ส่วนรายงานของอบูดาวูดที่ว่า \"จงเอาดินที่เขาปัสสาวะออกไปทิ้ง แล้วเทน้ำลงไปแทน\" อบูดาวูดเองกล่าวว่าเป็นมุรสัล เพราะผู้รายงานไม่ได้ทันพบท่านนบี ﷺ", "ถ้านะญิสมีเนื้อ เช่น อุจจาระหรือเลือดแห้ง ต้องเอาออกก่อนแล้วจึงราดน้ำ"]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "การรีบชำระมัสยิด และพื้นดินที่แห้งเอง", "points_th": ["ต้องรีบชำระมัสยิดเมื่อมีนะญิส ดังคำว่า \"เมื่อเขาปัสสาวะเสร็จ ท่านก็สั่ง...\" เพราะถ้าปล่อยไว้ อาจไม่มีใครรู้ตำแหน่งแล้วไปละหมาดบนนั้น", "นักวิชาการส่วนใหญ่เห็นว่าพื้นดินไม่สะอาดเพียงเพราะแห้ง ไม่ว่าด้วยแดด ลม หรือในที่ร่ม เพราะถ้าการแห้งทำให้สะอาดได้ ท่านนบี ﷺ คงไม่สั่งให้ใช้น้ำ", "สำนักหะนะฟีย์เห็นว่าการแห้งทำให้พื้นดินสะอาดและละหมาดบนนั้นได้ เพราะนะญิสสกปรกในตัวมันเอง เมื่อนะญิสหมดไป สิ่งนั้นก็กลับมาสะอาด เป็นทัศนะที่มีน้ำหนัก อิบนุตัยมิยะฮ์และอิบนุลก็อยยิมเลือก อิบนุตัยมิยะฮ์กล่าวว่าเป็นทัศนะหนึ่งในสำนักชาฟิอีย์และหันบะลีย์ด้วย", "หลักฐานคือหะดีษอิบนุอุมัรว่า ในสมัยท่านนบี ﷺ สุนัขเคยปัสสาวะและเดินเข้าออกมัสยิด แต่พวกเขาไม่ได้ราดน้ำใด ๆ (บันทึกโดยอัลบุคอรีย์) แสดงว่าพื้นดินที่แห้งจนร่องรอยนะญิสหมดไปถือว่าสะอาด เพราะหุก่มขึ้นอยู่กับเหตุของมัน", "ส่วนหลักฐานของนักวิชาการส่วนใหญ่ตอบได้ว่า มัสยิดต้องชำระทันทีเพราะเป็นที่ละหมาดของผู้คน เพื่อไม่ให้ใครเปื้อน หรือให้นะญิสติดเท้าไปที่อื่นในมัสยิด"]}, {"wajh": 7, "type": "fawaid", "heading_ar": null, "heading_th": "การสอนผู้ไม่รู้", "points_th": ["ต้องสอนผู้ไม่รู้ด้วยความนุ่มนวล ไม่ทำร้ายหรือใช้ความรุนแรงกับเขา หากเขาไม่ได้ฝ่าฝืนเพราะดูหมิ่นหรือดื้อดึง"]}, {"wajh": 8, "type": "fawaid", "heading_ar": null, "heading_th": "เลือกความเสียหายที่เบากว่า", "points_th": ["หะดีษเป็นหลักฐานของหลักฟิกฮ์ใหญ่: เมื่อความเสียหายสองอย่างขัดกัน ให้ป้องกันความเสียหายที่ใหญ่กว่าด้วยการยอมรับความเสียหายที่เบากว่า", "การปัสสาวะในมัสยิดเป็นความเสียหายที่เกิดขึ้นแล้ว แต่การให้เขาลุกกลางคันเป็นความเสียหายที่ใหญ่กว่า เพราะ (1) ทำให้เขาเป็นอันตรายจากการกลั้นปัสสาวะ (2) ทำให้เสื้อผ้าและร่างกายของเขาเปื้อน (3) ทำให้นะญิสกระจายไปพื้นที่ในมัสยิดกว้างขึ้น"]}], "tags_th": ["มัสยิด", "ปัสสาวะ", "ชำระพื้นดิน", "การสอน", "หลักฟิกฮ์"]}, {"id": "v1-h013", "volume": 1, "bab": "miyah", "topic_ar": "السمك والجراد إذا ماتا في ماء فإنه لا ينجس", "topic_th": "ปลาและตั๊กแตนที่ตายในน้ำไม่ทำให้น้ำเป็นนะญิส", "pages": [68, 70], "hadith": [{"no": 13, "matn_ar": "عَنِ ابْنِ عُمَرَ رَضِيَ اللهُ عَنْهُمَا قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «أُحِلَّتْ لَنَا مَيْتَتَانِ وَدَمَانِ، فَأَمَّا الْمَيْتَتَانِ: فَالْجَرَادُ وَالْحُوتُ، وَأَمَّا الدَّمَانِ: فَالطِّحَالُ وَالْكَبِدُ». أَخْرَجَهُ أَحْمَدُ، وَابْنُ مَاجَهْ، وَفِيهِ ضَعْفٌ.", "translation_th": "จากอิบนุอุมัร (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"ซากสองอย่างและเลือดสองอย่างถูกอนุมัติแก่พวกเรา ซากสองอย่างคือ ตั๊กแตนและปลา ส่วนเลือดสองอย่างคือ ม้ามและตับ\" บันทึกโดยอะห์มัดและอิบนุมาญะฮ์ ในสายรายงานมีความอ่อน", "grade_th": "สายที่มาถึงท่านนบีอ่อน แต่รายงานที่เป็นคำพูดของอิบนุอุมัรศ่อฮีห์ และมีหุก่มเท่ากับคำของท่านนบี ﷺ"}], "key_rulings_th": ["ซากสัตว์ทะเลทุกชนิดเป็นที่อนุมัติ ไม่ว่าตายเองแล้วลอยขึ้นมา หรือตายเพราะสาเหตุภายนอก เช่น ถูกบีบ กระแทกหิน น้ำลด หรือถูกชาวประมงตี", "ตั๊กแตนเป็นที่อนุมัติ ไม่ว่าจะจับได้ เชือด หรือตายเอง", "ตั๊กแตนที่ตายเพราะยาฆ่าแมลง และปลาที่ตายเพราะสารพิษในทะเล เป็นหะรอม เพราะพิษที่อยู่ในตัว ไม่ใช่เพราะตัวมันเอง", "ตับและม้ามเป็นที่อนุมัติ ถูกยกเว้นจากข้อห้ามเรื่องเลือด โดยอิจญ์มาอ์", "ปลาและตั๊กแตนที่ตายในน้ำ ไม่ทำให้น้ำเป็นนะญิส แม้รส สี หรือกลิ่นของน้ำจะเปลี่ยน เพราะเปลี่ยนด้วยสิ่งสะอาด"], "vocab": [{"ar": "الْجَرَاد", "th": "ตั๊กแตน (อ่านสระอะที่ญีม) เอกพจน์คือ جرادة ใช้ได้ทั้งตัวผู้ตัวเมีย ว่ากันว่ามาจากคำว่า \"ถอนจนเกลี้ยง\" เพราะมันลงที่ใดก็กินจนเกลี้ยง"}, {"ar": "الْحُوت", "th": "ปลา หรือบางทัศนะว่าปลาขนาดใหญ่ ดังในอัลกุรอาน \"แล้วปลาก็กลืนเขา\" (อัศศ็อฟฟาต: 142)"}, {"ar": "الطِّحَال وَالْكَبِد", "th": "ม้ามและตับ"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["บันทึกโดยอะห์มัดและอิบนุมาญะฮ์ (3218, 3314) ผ่านสายอับดุรเราะห์มาน บินซัยด์ บินอัสลัม จากบิดา จากอิบนุอุมัร ในฐานะคำพูดของท่านนบี ﷺ", "สายรายงานนี้อ่อน ตามที่อิบนุหะญัรระบุ เพราะอับดุรเราะห์มาน บินซัยด์ ถูกวิจารณ์โดยอะห์มัด อิบนุลมะดีนีย์ อันนะสาอีย์ และอบูซุรอะฮ์ อิบนุคุซัยมะฮ์กล่าวว่า เขาไม่ใช่ผู้ที่นักวิชาการใช้หะดีษเป็นหลักฐาน เพราะความจำไม่ดี เขาเป็นนักอิบาดะฮ์และสมถะ ไม่ใช่นักหะดีษ", "อัดดารุกุฏนีย์และอัลบัยฮะกีย์บันทึกผ่านสายสุลัยมาน บินบิลาล จากซัยด์ บินอัสลัม จากอิบนุอุมัร เป็นคำพูดของอิบนุอุมัรเอง (เมากูฟ) อัลบัยฮะกีย์กล่าวว่าสายรายงานศ่อฮีห์ อบูซุรอะฮ์และอบูหาติมก็เห็นว่ารายงานแบบเมากูฟถูกต้อง", "รายงานแบบเมากูฟนี้มีหุก่มเท่ากับคำของท่านนบี ﷺ อิบนุลก็อยยิมกล่าวว่า เพราะเมื่อเศาะหาบะฮ์กล่าวว่า \"สิ่งนี้ถูกอนุมัติแก่เรา\" หรือ \"ถูกห้ามแก่เรา\" ย่อมหมายถึงการอนุมัติหรือห้ามของท่านนบี ﷺ"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["ตั๊กแตน (الجراد) เป็นสัตว์ที่รู้จักกันดี ส่วนปลา (الحوت) หมายถึงปลาทั่วไป หรือบางทัศนะว่าปลาขนาดใหญ่ (ดูคำศัพท์)"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "ซากสัตว์ทะเลและตั๊กแตน", "points_th": ["หะดีษแสดงว่าซากสัตว์เป็นหะรอม โดยยกเว้นตั๊กแตนและปลา ซึ่งเป็นที่อนุมัติ สอดคล้องกับหะดีษที่ 1 \"ซากสัตว์ของมันเป็นที่อนุมัติ\" และอายะฮ์ \"สัตว์ที่จับได้ในทะเลและอาหารจากทะเลเป็นที่อนุมัติแก่พวกเจ้า\" (อัลมาอิดะฮ์: 96) อิบนุอับบาสอธิบายว่า สัตว์ที่จับได้คือสิ่งที่จับมา ส่วนอาหารจากทะเลคือสิ่งที่ทะเลซัดขึ้นมา", "ซากสัตว์ทะเลจึงเป็นที่อนุมัติทุกกรณี ไม่ว่าตายเองแล้วลอยขึ้นผิวน้ำ หรือตายเพราะสาเหตุที่เห็นได้ เช่น ถูกบีบ กระแทกหิน น้ำลด หรือถูกชาวประมงตี เพราะหลักฐานมีความหมายกว้าง และการจำกัดหลักฐานที่กว้างต้องมีหลักฐานจากอัลกุรอานหรือสุนนะฮ์", "หะดีษญาบิร: กองทัพเคาะบัฏ ซึ่งมีอบูอุบัยดะฮ์เป็นแม่ทัพ หิวโหยอย่างหนัก ทะเลซัดปลาตายตัวใหญ่ขึ้นมา ชื่อว่า \"อัลอัมบัร\" พวกเขากินอยู่ครึ่งเดือน กระดูกชิ้นหนึ่งของมันใหญ่จนคนขี่พาหนะลอดผ่านได้ เมื่อกลับถึงมะดีนะฮ์ ท่านนบี ﷺ กล่าวว่า \"จงกินเถิด เป็นริซกีที่อัลลอฮ์ประทานแก่พวกท่าน ถ้ามีเหลือก็ให้เรากินบ้าง\" แล้วท่านก็กิน (อัลบุคอรีย์และมุสลิม) การที่ท่านขอกินเองเพื่อให้พวกเขามั่นใจว่าเป็นที่อนุมัติอย่างแน่นอน", "ตั๊กแตนเป็นที่อนุมัติทุกกรณีตามความหมายกว้างของหะดีษ ไม่ว่าจะจับได้ เชือด หรือตายเอง", "ยกเว้นตั๊กแตนที่ตายเพราะยาฆ่าแมลงที่เป็นพิษ ซึ่งเป็นหะรอมเพราะพิษที่ทำให้ถึงตาย และปลาที่ตายเพราะทะเลปนเปื้อนสารพิษ ก็เป็นหะรอมเช่นกัน ไม่ใช่เพราะตัวมันเอง แต่เพราะสารอันตรายที่อยู่ในตัว"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "ตับและม้าม", "points_th": ["หะดีษเป็นหลักฐานว่าตับและม้ามกินได้ และถูกยกเว้นจากข้อห้ามเรื่องเลือด ซึ่งเป็นอิจญ์มาอ์ของนักวิชาการ"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "เหตุที่หะดีษอยู่ในบทว่าด้วยน้ำ", "points_th": ["ปลาและตั๊กแตนที่ตายในน้ำไม่ทำให้น้ำเป็นนะญิส ไม่ว่าน้ำน้อยหรือมาก แม้รส สี หรือกลิ่นจะเปลี่ยน เพราะเปลี่ยนด้วยสิ่งสะอาด ไม่ใช่ด้วยนะญิส นี่คือเหตุผลที่หะดีษนี้อยู่ในบทว่าด้วยน้ำ"]}], "tags_th": ["ปลา", "ตั๊กแตน", "ซากสัตว์", "อาหารฮาลาล", "ตับและม้าม", "น้ำ"]}, {"id": "v1-h014", "volume": 1, "bab": "miyah", "topic_ar": "الذباب لا يُنَجِّسُ ما وقع فيه من ماء أو غيره", "topic_th": "แมลงวันไม่ทำให้น้ำหรือสิ่งที่มันตกลงไปเป็นนะญิส", "pages": [71, 74], "hadith": [{"no": 14, "matn_ar": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «إِذَا وَقَعَ الذُّبَابُ فِي شَرَابِ أَحَدِكُمْ فَلْيَغْمِسْهُ، ثُمَّ لِيَنْزِعْهُ، فَإِنَّ فِي أَحَدِ جَنَاحَيْهِ دَاءً، وَفِي الْآخَرِ شِفَاءً». أَخْرَجَهُ الْبُخَارِيُّ. وَأَبُو دَاوُدَ، وَزَادَ: «وَإِنَّهُ يَتَّقِي بِجَنَاحِهِ الَّذِي فِيهِ الدَّاءُ».", "translation_th": "จากอบูฮุร็อยเราะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"เมื่อแมลงวันตกลงในเครื่องดื่มของผู้ใดในพวกท่าน ให้จุ่มมันลงไป แล้วค่อยหยิบออก เพราะปีกข้างหนึ่งของมันมีโรค และอีกข้างหนึ่งมียารักษา\" บันทึกโดยอัลบุคอรีย์ และอบูดาวูดเพิ่มว่า \"และมันจะใช้ปีกข้างที่มีโรคป้องกันตัว\"", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์)"}], "key_rulings_th": ["แมลงวันสะอาด ไม่ทำให้อาหาร เครื่องดื่ม หรือน้ำที่มันตกลงไปเป็นนะญิสหรือเสีย", "คำสั่งให้จุ่มแมลงวันทั้งตัวเป็นคำแนะนำสำหรับผู้ที่ต้องการกินหรือดื่มต่อ ไม่ใช่วาญิบ ส่วนผู้ที่รังเกียจไม่อยากกินต่อ หะดีษไม่ได้กล่าวถึง", "สัตว์ที่ไม่มีเลือดไหล และไม่ได้เกิดจากนะญิส เช่น ผึ้ง ต่อ แมงมุม ด้วง ยุง ตัวเรือด ถ้าตกลงในอาหารหรือเครื่องดื่ม ไม่ทำให้เป็นหะรอมหรือนะญิส"], "vocab": [{"ar": "الذُّبَاب", "th": "แมลงวัน (อ่านสระอุ) เป็นเอกพจน์ อัดดะมีรีย์กล่าวว่า ชาวอาหรับใช้เรียกแมลงบินหลายชนิด แต่ที่หมายถึงในหะดีษน่าจะเป็นแมลงวันบ้านที่รู้จักกันทั่วไป ที่เรียกว่า ذباب เพราะเคลื่อนไหวไปมาตลอด"}, {"ar": "فَلْيَغْمِسْهُ", "th": "ให้จุ่มมันลงไปในอาหารหรือเครื่องดื่ม ในรายงานบทการแพทย์ของอัลบุคอรีย์มีว่า \"ให้จุ่มทั้งตัว\" เพื่อไม่ให้เข้าใจว่าจุ่มบางส่วนก็พอ"}, {"ar": "دَاءً... شِفَاءً", "th": "โรค... ยารักษา ในหะดีษอบูสะอีดระบุว่า \"ปีกข้างหนึ่งเป็นพิษ อีกข้างเป็นยารักษา มันจะเอาข้างที่เป็นพิษลงก่อน และเก็บข้างที่เป็นยาไว้\" แสดงว่า \"โรค\" ในที่นี้คือพิษ"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["บันทึกโดยอัลบุคอรีย์ (3320) ในบทการเริ่มต้นการสร้าง และ (5782) ในบทการแพทย์ ผ่านสายอุตบะฮ์ บินมุสลิม จากอุบัยด์ บินหุนัยน์ จากอบูฮุร็อยเราะฮ์", "สำนวนที่สองบันทึกโดยอบูดาวูด (3844) สายรายงานหะซัน และมีรายงานจากอบูสะอีด อัลคุดรีย์ (อะห์มัด และอิบนุมาญะฮ์ 3504 ศ่อฮีห์ด้วยสายอื่นสนับสนุน) และจากอนัส บินมาลิก (อัลบัซซาร ผู้รายงานเป็นผู้รายงานของเศาะฮีห์)", "หะดีษนี้มีสายรายงานมากกว่าห้าสิบสาย ซึ่งมีนักวิจัยรวบรวมไว้ เพียงพอสำหรับผู้ที่ต้องการรู้ความจริงด้วยใจที่บริสุทธิ์และปัญญาที่เปิดกว้าง"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ในเครื่องดื่ม\" เป็นสำนวนในบทการเริ่มต้นการสร้าง ส่วนในบทการแพทย์ใช้ \"ในภาชนะ\" และหะดีษอบูสะอีดใช้ \"ในอาหาร\" คำว่า \"ภาชนะ\" ครอบคลุมที่สุด แต่อิบนุหะญัรเลือกสำนวน \"เครื่องดื่ม\" เพราะเข้ากับบทว่าด้วยน้ำ", "คำสั่งให้จุ่มเพื่อให้ยารักษาออกมาเหมือนที่โรคออกมาแล้ว สารพิษจะถูกหักล้างด้วยสารที่เป็นประโยชน์ซึ่งอัลลอฮ์ทรงใส่ไว้ในปีกอีกข้าง อันตรายจึงหมดไปด้วยอนุมัติของอัลลอฮ์ แพทย์ผู้เชี่ยวชาญในอดีตกล่าวถึงเรื่องนี้ไว้ อิบนุลก็อยยิมและอิบนุหะญัรก็กล่าวไว้ และการค้นพบทางวิทยาศาสตร์ยุคใหม่ก็ยืนยัน", "คำสั่งนี้เป็นคำแนะนำ (อิรชาด) ไม่ใช่คำสั่งบังคับ", "อิบนุหะญัรกล่าวว่า ไม่พบรายงานใดระบุว่าปีกข้างไหนมียารักษา แต่นักวิชาการบางท่านสังเกตว่าแมลงวันใช้ปีกซ้ายป้องกันตัว จึงรู้ได้ว่าปีกขวาคือข้างที่มียารักษา"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "แมลงวันสะอาด", "points_th": ["หะดีษเป็นหลักฐานว่าแมลงวันสะอาด ไม่ทำให้อาหาร เครื่องดื่ม หรือน้ำที่มันตกลงไปเป็นนะญิสหรือเสีย เพราะท่านรสูล ﷺ สั่งให้จุ่มมัน ไม่ได้สั่งให้เททิ้ง"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "การจุ่มและการใช้ต่อ", "points_th": ["หะดีษสั่งให้จุ่มแมลงวันทั้งตัว แล้วหยิบออก และใช้อาหารหรือเครื่องดื่มนั้นต่อได้ ด้วยเหตุผลที่ระบุไว้", "อาหารอาจร้อน และเป็นที่รู้กันว่าแมลงวันจะตายเมื่อถูกจุ่ม ถ้ามันทำให้อาหารเป็นนะญิส ท่านนบี ﷺ คงไม่สั่งสิ่งที่ทำให้อาหารเสีย แต่ท่านสั่งเพื่อให้อาหารดีขึ้น", "คำสั่งนี้ไม่ใช่วาญิบ เป็นคำแนะนำสำหรับผู้ที่ต้องการกินหรือดื่มสิ่งที่แมลงวันตกลงไป ส่วนผู้ที่ไม่อยากกินเพราะรังเกียจ หะดีษไม่ได้กล่าวถึง"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "สัตว์อื่นที่เทียบกับแมลงวัน", "points_th": ["สัตว์ทุกชนิดที่คล้ายแมลงวัน คือไม่มีเลือดไหล และไม่ได้เกิดจากนะญิส เช่น ต่อ แมงมุม ด้วง แมลงปีกแข็ง ผึ้ง ตัวเรือด ยุง ถ้าตกลงในอาหารหรือเครื่องดื่ม ไม่ทำให้เป็นหะรอมหรือนะญิส เพราะหุก่มขึ้นอยู่กับเหตุของมัน", "เหตุที่ทำให้ซากสัตว์เป็นนะญิส คือเลือดที่คั่งอยู่ในตัวสัตว์เมื่อมันตาย สิ่งนี้ไม่มีในสัตว์ที่ไม่มีเลือดไหล จึงไม่เป็นนะญิส", "อิบนุลมุนซิรกล่าวว่า นักวิชาการทั่วไปเห็นว่าน้ำไม่เสียเพราะแมลงวันหรือด้วงตาย และไม่รู้ว่ามีผู้เห็นต่างนอกจากทัศนะหนึ่งของอัชชาฟิอีย์ อันนะวะวีย์กล่าวว่า ที่ถูกต้องคือทั้งหมดสะอาด เพราะหะดีษ เพราะเป็นสิ่งที่พบบ่อย และหลีกเลี่ยงได้ยาก"]}, {"wajh": 6, "type": "fawaid", "heading_ar": null, "heading_th": "อิสลามกับความรู้ทางการแพทย์", "points_th": ["ผู้แต่งเห็นว่าหะดีษนี้แสดงว่าอิสลามล้ำหน้าความรู้ทางการแพทย์ ในการบอกถึงอันตรายของแมลงวันที่พาโรคและเชื้อโรค และบอกวิธีกำจัดอันตรายเมื่อมันตกลงในอาหาร", "ผู้แต่งอ้างงานศึกษาที่ระบุว่า แมลงวันพาเชื้อจุลินทรีย์ที่ฆ่าแบคทีเรียได้ (แบคเทอริโอฟาจ) อยู่มากบนปีก การจุ่มแมลงวันจึงช่วยปล่อยสารที่ฆ่าเชื้อโรคออกมามากขึ้น และเชื้อโรคที่แมลงวันทิ้งไว้จะลดลงแทนที่จะเพิ่มจำนวน มวลการสรรเสริญเป็นของอัลลอฮ์ในความสมบูรณ์ของบทบัญญัตินี้"]}], "tags_th": ["แมลงวัน", "แมลง", "นะญิส", "อาหาร", "การแพทย์"]}, {"id": "v1-h015", "volume": 1, "bab": "miyah", "topic_ar": "ما قطع من الحي فهو ميت", "topic_th": "ส่วนที่ถูกตัดจากสัตว์ที่ยังมีชีวิตถือเป็นซากสัตว์", "pages": [75, 77], "hadith": [{"no": 15, "matn_ar": "عَنْ أَبِي وَاقِدٍ اللَّيْثِيِّ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ النَّبِيُّ ﷺ: «مَا قُطِعَ مِنَ الْبَهِيمَةِ - وَهِيَ حَيَّةٌ - فَهُوَ مَيِّتٌ». أَخْرَجَهُ أَبُو دَاوُدَ، وَالتِّرْمِذِيُّ وَحَسَّنَهُ، وَاللَّفْظُ لَهُ.", "translation_th": "จากอบูวากิด อัลลัยษีย์ (ร.ฎ.) กล่าวว่า ท่านนบี ﷺ กล่าวว่า \"สิ่งที่ถูกตัดจากสัตว์ ขณะที่มันยังมีชีวิตอยู่ ถือเป็นซากสัตว์\" บันทึกโดยอบูดาวูด และอัตติรมิซีย์ซึ่งระบุว่าหะซัน สำนวนนี้เป็นของเขา", "grade_th": "หะซัน (ตามอัตติรมิซีย์) อัดดารุกุฏนีย์เห็นว่ารายงานแบบมุรสัลใกล้ความถูกต้องกว่า"}], "key_rulings_th": ["ส่วนใดก็ตามที่ถูกตัดจากสัตว์ขณะยังมีชีวิต เช่น โหนกอูฐ หรือหางแกะ ถือเป็นซากสัตว์ เป็นนะญิส ห้ามกินและห้ามใช้ประโยชน์ อิบนุตัยมิยะฮ์กล่าวว่าเรื่องนี้นักวิชาการเห็นพ้องกัน", "ยกเว้นส่วนที่ตัดจากสัตว์ที่ซากของมันสะอาด เช่น ตั๊กแตนและปลา ซึ่งสะอาด ถ้าตกลงในน้ำก็ไม่ทำให้น้ำเป็นนะญิส", "ขน ขนสัตว์ และขนนก ถ้าตัดโดยไม่ถอนราก ถือว่าสะอาด", "ถ้าส่วนที่ตัดจากสัตว์ที่ซากเป็นนะญิสตกลงในน้ำหรือสิ่งอื่น ก็มีหุก่มเป็นนะญิส นี่คือเหตุที่อิบนุหะญัรนำหะดีษนี้มาไว้ในบทว่าด้วยน้ำ"], "vocab": [{"ar": "الْبَهِيمَة", "th": "สัตว์สี่เท้า เช่น อูฐ วัว แกะ หรือสัตว์ที่ไม่มีสติปัญญาทุกชนิด ความหมายหลังกว้างกว่า แต่เหตุการณ์ของหะดีษชี้ว่าหมายถึงอูฐและแกะ"}, {"ar": "فَهُوَ مَيِّتٌ / مَيْتَةٌ", "th": "ถือเป็นซากสัตว์ ในฉบับบุลูฆุลมะรอมบางฉบับเขียน \"ميت\" ส่วนในรายงานของอัตติรมิซีย์คือ \"ميتة\" ซากสัตว์คือสิ่งที่ไม่ได้ผ่านการเชือดตามบทบัญญัติ ความหมายคือเป็นหะรอมเหมือนซากสัตว์ เพราะส่วนนั้นตายเมื่อชีวิตหมดไปจากมัน"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อบูวากิด อัลลัยษีย์ เป็นที่รู้จักด้วยกุนยะฮ์ ชื่อจริงมีความเห็นต่างกัน อัตติรมิซีย์ระบุว่าคือ อัลหาริษ บินเอาฟ์", "รับอิสลามตั้งแต่ช่วงแรก และร่วมสงครามบะดัรตามทัศนะที่ถูกต้องที่สุด นับเป็นชาวมะดีนะฮ์ ต่อมาไปพำนักที่มักกะฮ์หนึ่งปี และเสียชีวิตที่นั่น ปี ฮ.ศ. 68"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["บันทึกโดยอบูดาวูด (2858) ในกิตาบการล่าสัตว์ และอัตติรมิซีย์ (1480) ผ่านสายอับดุรเราะห์มาน บินอับดิลลาฮ์ บินดีนาร จากซัยด์ บินอัสลัม จากอะฏออ์ บินยะสาร จากอบูวากิด", "อัตติรมิซีย์ระบุว่าหะซัน แม้อับดุรเราะห์มาน บินอับดิลลาฮ์ บินดีนาร จะถูกวิจารณ์ อิบนุมะอีนว่ามีความอ่อน อบูหาติมว่าเขียนหะดีษของเขาได้แต่ไม่ใช้เป็นหลักฐาน อิบนุหะญัรว่า \"ซื่อสัตย์แต่ผิดพลาดบ้าง\"", "มีอีกสายหนึ่งผ่านอับดุลลอฮ์ บินญะอ์ฟัร จากซัยด์ บินอัสลัม อัลหากิมว่าสายรายงานศ่อฮีห์ แต่อัษษะฮะบีย์ค้าน เพราะอับดุลลอฮ์ บินญะอ์ฟัรอ่อน อย่างไรก็ตาม เมื่อนำสายนี้มารวมกับสายแรก หะดีษก็แข็งแรงขึ้น", "ยังมีรายงานจากอบูสะอีด อัลคุดรีย์ ซึ่งอัลหากิมว่าศ่อฮีห์ตามเงื่อนไขของอัลบุคอรีย์และมุสลิม อัลอัลบานีย์แก้ว่าตามเงื่อนไขของอัลบุคอรีย์เท่านั้น แต่มีผู้รายงานหลายคนรายงานจากซัยด์ บินอัสลัมแบบมุรสัล อัดดารุกุฏนีย์จึงกล่าวว่า รายงานแบบมุรสัลใกล้ความถูกต้องกว่า"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "เหตุการณ์ของหะดีษ", "points_th": ["อิบนุหะญัรย่อหะดีษ เหลือเฉพาะส่วนที่เป็นหลักฐาน ตอนต้นของหะดีษคือ ท่านนบี ﷺ มาถึงมะดีนะฮ์ ขณะที่ชาวเมืองตัดโหนกอูฐและหางแกะจากสัตว์ที่ยังมีชีวิตมากิน ท่านจึงกล่าวหะดีษนี้ (สำนวนของอัตติรมิซีย์) ส่วนอบูดาวูดไม่ได้ระบุเหตุการณ์"]}, {"wajh": 4, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["คำว่า \"ما\" (สิ่งที่) ตีความได้ทั้งเป็นคำเชื่อมหรือคำเงื่อนไข ทั้งสองแบบให้ความหมายครอบคลุมทุกสิ่งที่ถูกตัด"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "หลักใหญ่จากหะดีษนี้", "points_th": ["นักวิชาการถือว่าถ้อยคำของหะดีษนี้เป็นหลักใหญ่หลักหนึ่งของบทบัญญัติ: ส่วนใดที่ถูกตัดจากสัตว์ขณะยังมีชีวิต เช่น โหนกอูฐ หรือหางแกะ ถือเป็นซากสัตว์ เป็นนะญิส ห้ามกินและห้ามใช้ประโยชน์เช่นเดียวกับซากสัตว์ อิบนุตัยมิยะฮ์กล่าวว่าเรื่องนี้นักวิชาการเห็นพ้องกัน", "หลักนี้มีข้อยกเว้น คือส่วนที่ตัดจากสัตว์ที่ซากของมันสะอาด เช่น ตั๊กแตนและปลา ซึ่งสะอาด และถ้าตกลงในน้ำ น้ำก็ยังสะอาด", "ยกเว้นขน ขนสัตว์ และขนนกด้วย ถ้าตัดโดยไม่ถอนราก"]}], "tags_th": ["ซากสัตว์", "นะญิส", "อาหารฮาลาล", "หลักฟิกฮ์"]}, {"id": "v1-h016", "volume": 1, "bab": "aniyah", "topic_ar": "تحريم الأكل والشرب في آنية الذهب والفضة", "topic_th": "ห้ามกินและดื่มในภาชนะทองคำและเงิน", "pages": [79, 84], "hadith": [{"no": 16, "matn_ar": "عَنْ حُذَيْفَةَ بْنِ الْيَمَانِ رَضِيَ اللهُ عَنْهُمَا، قَالَ: قَالَ النَّبِيُّ ﷺ: «لَا تَشْرَبُوا فِي آنِيَةِ الذَّهَبِ وَالْفِضَّةِ، وَلَا تَأْكُلُوا فِي صِحَافِهَا، فَإِنَّهَا لَهُمْ فِي الدُّنْيَا، وَلَكُمْ فِي الْآخِرَةِ». مُتَّفَقٌ عَلَيْهِ.", "translation_th": "จากหุซัยฟะฮ์ บินอัลยะมาน (ร.ฎ.) กล่าวว่า ท่านนบี ﷺ กล่าวว่า \"พวกท่านอย่าดื่มในภาชนะทองคำและเงิน และอย่ากินในจานของมัน เพราะมันเป็นของพวกเขาในดุนยา และเป็นของพวกท่านในอาคิเราะฮ์\" บันทึกโดยอัลบุคอรีย์และมุสลิม", "grade_th": "ศ่อฮีห์ (อัลบุคอรีย์และมุสลิม)"}], "key_rulings_th": ["หะรอมกินและดื่มในภาชนะทองคำและเงิน ทั้งชายและหญิง ไม่ว่าภาชนะจะเป็นทองหรือเงินล้วน หรือมีทองหรือเงินผสม", "เหตุผลที่ตัวบทระบุคือ การเลียนแบบผู้ปฏิเสธศรัทธา (กาฟิร) ซึ่งใช้ภาชนะเหล่านี้ในดุนยา ส่วนผู้ศรัทธาจะได้ใช้ในอาคิเราะฮ์", "นักวิชาการส่วนใหญ่เห็นว่าห้ามใช้ทุกรูปแบบ เช่น ใส่น้ำหอม ทากุห์ล (ผงทาขอบตา) อาบน้ำละหมาด ส่วนอัศศ็อนอานีย์ อัชเชากานีย์ และอิบนุอุษัยมีน เห็นว่าห้ามเฉพาะกินและดื่ม", "ผู้แต่งเห็นว่าทัศนะหลังมีน้ำหนัก แต่ความยำเกรงและความรอบคอบคือ หลีกเลี่ยงการใช้ทุกรูปแบบ ซึ่งอัสสะอ์ดีย์และอิบนุบาซเลือก"], "vocab": [{"ar": "آنِيَة", "th": "ภาชนะ (พหูพจน์ของ إِنَاء) พหูพจน์จำนวนมากคือ أَوَانِي ในบทนี้หมายถึงภาชนะใส่น้ำละหมาด และกว้างไปถึงภาชนะอาหารและเครื่องดื่ม"}, {"ar": "صِحَاف", "th": "พหูพจน์ของ صَحْفَة คือจานใหญ่ที่อิ่มได้ห้าคน แต่ไม่ได้จำกัดเฉพาะขนาดนี้ จานสำหรับคนเดียวที่ทำจากทองหรือเงินก็ห้ามเช่นกัน"}, {"ar": "فَإِنَّهَا لَهُمْ", "th": "สรรพนาม \"พวกเขา\" หมายถึงผู้ปฏิเสธศรัทธา แม้ไม่ได้เอ่ยถึงมาก่อน แต่เข้าใจได้จากบริบท"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["หุซัยฟะฮ์ บินอัลยะมาน บินญาบิร อัลอับสีย์ ชื่อจริงของอัลยะมานคือ หุสัยล์ (ตามที่ระบุในเศาะฮีห์มุสลิม) ทั้งเขาและบิดาเข้ารับอิสลาม และตั้งใจจะร่วมสงครามบัดร์ แต่พวกมุชริกขัดขวางไว้", "ทั้งสองร่วมสงครามอุหุด บิดาของเขาถูกมุสลิมสังหารโดยไม่รู้ว่าเป็นใคร (อัลบุคอรีย์) อิบนุอิสหากเล่าว่า หุซัยฟะฮ์บริจาคค่าสินไหม (ดิยะฮ์) ของบิดาให้แก่มุสลิม", "เขาได้รับฉายาว่า \"เจ้าของความลับ\" เพราะท่านนบี ﷺ บอกชื่อพวกมุนาฟิกที่วางแผนร้ายต่อท่านขณะเดินทางกลับจากตะบูกแก่เขา และเขากล่าวว่า ท่านนบี ﷺ เล่าให้เขาฟังถึงสิ่งที่จะเกิดขึ้นจนถึงวันกิยามะฮ์", "ร่วมสงครามคันดักและหลังจากนั้น และการพิชิตอิรัก อุมัรแต่งตั้งเขาเป็นผู้ปกครองอัลมะดาอิน อยู่ที่นั่นจนเสียชีวิตปี ฮ.ศ. 36 สี่สิบคืนหลังการสังหารอุษมาน"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัลบุคอรีย์บันทึกในหมวดอาหาร บทการกินในภาชนะที่ประดับเงิน (5426) ผ่านสายมุญาฮิด จากอับดุรเราะห์มาน บินอบีลัยลา ว่า พวกเขาอยู่กับหุซัยฟะฮ์ เขาขอน้ำดื่ม ชาวมะญูสีคนหนึ่งยกมาให้ในภาชนะเงิน เมื่อวางลงในมือ เขาก็ขว้างทิ้ง แล้วกล่าวว่า ถ้าไม่ใช่เพราะฉันห้ามเขามาแล้วหลายครั้ง (ฉันคงไม่ทำเช่นนี้) แต่ฉันได้ยินท่านนบี ﷺ กล่าวว่า \"อย่าสวมผ้าไหมและผ้าดีบาจ อย่าดื่มในภาชนะทองคำและเงิน อย่ากินในจานของมัน เพราะมันเป็นของพวกเขาในดุนยา และของเราในอาคิเราะฮ์\"", "สำนวนของอัลบุคอรีย์ใช้ \"ของเรา\" แทน \"ของพวกท่าน\" แต่ในอีกรายงานของอัลบุคอรีย์ในหมวดเครื่องแต่งกาย (5830, 5833) ใช้ \"ของพวกท่าน\"", "มุสลิมบันทึก (2067) ผ่านสายอิบนุอบีลัยลาในหมวดเครื่องแต่งกาย โดยไม่มีคำว่า \"ของพวกท่านในอาคิเราะฮ์\" แต่มีคำนี้ในสายอิบนุอุกัยม์ จากหุซัยฟะฮ์ (2067)"]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"อย่าดื่ม\" เป็นคำพูดกับผู้ชายที่อยู่ ณ ที่นั้น แต่ครอบคลุมทุกคนที่คำสั่งนี้ไปถึง ทั้งชายและหญิง", "\"เพราะมันเป็นของพวกเขาในดุนยา...\" เป็นประโยคบอกเหตุผล ความหมายคือ ผู้ปฏิเสธศรัทธาใช้ภาชนะเหล่านี้ในดุนยา เพราะไม่มีศาสนาห้ามพวกเขา ไม่ได้หมายความว่าอนุมัติสำหรับพวกเขา เพราะผู้ปฏิเสธศรัทธาไม่มีสิทธิ์เสพความโปรดปรานของอัลลอฮ์ขณะที่ยังปฏิเสธพระองค์", "ผู้ศรัทธาถูกห้ามเลียนแบบพวกเขา และจะได้ใช้ในอาคิเราะฮ์เป็นรางวัลที่ละทิ้งมันในดุนยา ส่วนพวกเขาจะถูกห้ามในอาคิเราะฮ์เพราะการฝ่าฝืนในดุนยา", "หะดีษอัลบะรออ์ บินอาซิบ (มุสลิม): ท่านนบี ﷺ ห้ามเจ็ดเรื่อง หนึ่งในนั้นคือ \"ดื่มในภาชนะเงิน เพราะผู้ที่ดื่มในมันในดุนยา จะไม่ได้ดื่มในมันในอาคิเราะฮ์\" และหะดีษอบูฮุร็อยเราะฮ์ (อันนะสาอีย์ อิบนุหะญัรว่าสายรายงานแข็งแรง): \"...และภาชนะของชาวสวรรค์คือทองคำและเงิน\"", "นักวิชาการเพิ่มเหตุผลอื่น เช่น เป็นช่องทางสู่ความโอหัง และทำให้คนยากจนช้ำใจ แต่ผู้แต่งว่าเหตุผลเหล่านี้ยังมีข้อพิจารณา อิบนุลก็อยยิมกล่าวว่า เหตุผลที่ถูกต้องคือ การใช้ภาชนะเหล่านี้ทำให้หัวใจมีสภาพที่ขัดกับความเป็นบ่าว ท่านนบี ﷺ จึงให้เหตุผลว่ามันเป็นของผู้ปฏิเสธศรัทธาในดุนยา เพราะพวกเขาไม่มีส่วนในความเป็นบ่าว"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "ข้อห้ามเป็นหะรอม และครอบคลุมทุกคน", "points_th": ["หะดีษเป็นหลักฐานห้ามกินและดื่มในภาชนะทองคำและเงิน และข้อห้ามนี้หมายถึงหะรอม เหตุผลคือการเลียนแบบผู้ปฏิเสธศรัทธา อิบนุตัยมียะฮ์กล่าวว่า นักวิชาการจึงถือว่าการใช้ผ้าไหมและภาชนะทองคำเงินเป็นการเลียนแบบผู้ปฏิเสธศรัทธา", "หุก่มนี้ครอบคลุมทั้งชายและหญิง ไม่ว่าภาชนะจะเป็นทองหรือเงินล้วน หรือผสมทองหรือเงิน", "หะดีษนี้ที่จริงอยู่ในเรื่องอาหารและเครื่องดื่ม แต่อิบนุหะญัรนำมาไว้ในบทภาชนะของหมวดฏอฮาเราะฮ์ เพื่อแสดงว่าห้ามอาบน้ำละหมาดจากภาชนะทองคำและเงินด้วย เพราะเป็นการใช้ภาชนะนั้น", "ผู้แต่งยกหะดีษอิบนุอุมัร (อัดดารุกุฏนีย์): \"ผู้ใดดื่มจากภาชนะทองหรือเงิน หรือภาชนะที่มีส่วนหนึ่งเป็นทองหรือเงิน เขากำลังกรอกไฟนรกญะฮันนัมลงในท้อง\" อัดดารุกุฏนีย์ว่าสายรายงานหะซัน และอิบนุบาซก็ว่าหะซัน แต่อิบนุหะญัรว่ามีข้อบกพร่องเพราะผู้รายงานไม่เป็นที่รู้จัก และอัซซะฮะบีย์ว่าเป็นหะดีษมุงกัร"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "ห้ามเฉพาะกินดื่ม หรือห้ามทุกการใช้", "points_th": ["ทัศนะที่หนึ่ง (นักวิชาการส่วนใหญ่): ห้ามใช้ทุกรูปแบบ อัลกุรฏุบีย์กล่าวว่า หะดีษห้ามการกินดื่ม และนำสิ่งที่มีความหมายเดียวกันมารวมด้วย เช่น ใส่น้ำหอม ทากุห์ล ซึ่งนักวิชาการส่วนใหญ่ทั้งยุคแรกและยุคหลังเห็นเช่นนี้ เหตุผลคือ ตัวบทกว้าง เหตุผลของข้อห้ามครอบคลุมทุกการใช้ และผู้หญิงได้รับข้อยกเว้นเฉพาะเรื่องเครื่องประดับเพื่อแต่งตัวให้สามี", "พวกเขากล่าวว่า ตัวบทระบุการกินดื่มเพราะเป็นการใช้ที่พบบ่อยที่สุด และหุก่มที่ผูกกับกรณีส่วนใหญ่ไม่ได้จำกัดหุก่มไว้เฉพาะกรณีนั้น เมื่อห้ามการกินดื่มซึ่งจำเป็นที่สุด การใช้อย่างอื่นก็ยิ่งต้องห้าม", "ทัศนะที่สอง (อัศศ็อนอานีย์ อัชเชากานีย์ อิบนุอุษัยมีน): หะรอมเฉพาะกินและดื่ม การใช้อื่น เช่น ใส่น้ำหอม ทากุห์ล อาบน้ำละหมาด อาบน้ำ อนุญาต เพราะท่านนบี ﷺ ห้ามสิ่งที่เจาะจง ถ้าต้องการห้ามทุกการใช้คงไม่เจาะจงการกินดื่ม และการกินดื่มเป็นที่แสดงความโอ้อวดมากที่สุด", "ทัศนะนี้อ้างหะดีษอุษมาน บินอับดุลลอฮ์ บินเมาฮับ (อัลบุคอรีย์): ครอบครัวส่งเขาไปหาอุมมุสะละมะฮ์พร้อมถ้วยน้ำ นางนำกระบอกเงินที่บรรจุเส้นผมของท่านนบี ﷺ ออกมา เมื่อมีคนถูกตาหรือเจ็บป่วย ก็จะส่งภาชนะใส่น้ำมาหานาง นี่คือการใช้ภาชนะเงินที่ไม่ใช่การกินดื่ม และอุมมุสะละมะฮ์คือผู้รายงานหะดีษห้ามเอง", "อัชเชากานีย์กล่าวว่า การเทียบการใช้อื่นกับการกินดื่มเป็นการเทียบที่ต่างกัน เพราะเหตุผลของข้อห้ามคือการเลียนแบบชาวสวรรค์ที่จะมีคนเวียนนำภาชนะเงินมาให้ ดังหะดีษที่ท่านนบี ﷺ ถามชายที่สวมแหวนทองว่า \"ทำไมฉันเห็นเครื่องประดับของชาวสวรรค์บนตัวท่าน\"", "ผู้แต่งเห็นว่า ทัศนะที่สองมีน้ำหนัก แต่ความยำเกรงและความรอบคอบคือ หลีกเลี่ยงภาชนะทองคำเงินในทุกการใช้ ทั้งกิน ดื่ม อาบน้ำละหมาด อาบน้ำ ทาน้ำมัน ใส่น้ำหอม โดยยึดความกว้างของความหมายและเหตุผล อัสสะอ์ดีย์เลือกทัศนะนี้ และอิบนุบาซกล่าวว่า \"นี่คือสิ่งที่ถูกต้อง\"", "หะดีษอุมมุสะละมะฮ์เป็นเหตุการณ์เฉพาะที่ตีความได้หลายทาง เช่น ภาชนะอาจแค่ชุบเงิน หรือเป็นภาชนะเล็ก ๆ สำหรับใส่เส้นผม และผู้รายงานยังต่างกันว่าคำคือ \"มินฟิฎเฎาะฮ์\" (จากเงิน) หรือ \"มินกุศเศาะฮ์\" (จากผมหน้าม้า) แม้อิบนุหะญัรว่าที่ถูกคือ \"จากเงิน\" แต่หะดีษห้ามมีน้ำหนักกว่า การยึดตามจึงรอบคอบและปลอดภัยกว่า"]}], "tags_th": ["ภาชนะ", "ทองคำ", "เงิน", "เลียนแบบกาฟิร", "หะรอม"]}, {"id": "v1-h017", "volume": 1, "bab": "aniyah", "topic_ar": "تحريم الشرب في آنية الفضة", "topic_th": "ห้ามดื่มในภาชนะเงิน", "pages": [85, 87], "hadith": [{"no": 17, "matn_ar": "عَنْ أُمِّ سَلَمَةَ رَضِيَ اللهُ عَنْهَا، قَالَتْ: قَالَ رَسُولُ اللهِ ﷺ: «الَّذِي يَشْرَبُ فِي إِنَاءِ الْفِضَّةِ إِنَّمَا يُجَرْجِرُ فِي بَطْنِهِ نَارَ جَهَنَّمَ». مُتَّ ll, "heading_th": "การตอบแทนเป็นชนิดเดียวกับการกระทำ", "points_th": ["การตอบแทนเป็นชนิดเดียวกับการกระทำ ผู้ที่ดื่มในภาชนะเงินและกรอกน้ำลงท้อง จะกรอกไฟนรกญะฮันนัมลงท้องในวันกิยามะฮ์ เว้นแต่เขาสำนึกผิด แล้วอัลลอฮ์ทรงรับการสำนึกผิดของเขา"]}], "tags_th": ["ภาชนะ", "เงิน", "ทองคำ", "บาปใหญ่", "ญะฮันนัม"]}, {"id": "v1-h018-020", "volume": 1, "bab": "aniyah", "topic_ar": "طهارة جلد الميتة إذا دبغ", "topic_th": "หนังซากสัตว์สะอาดเมื่อฟอกแล้ว", "pages": [88, 94], "hadith": [{"no": 18, "matn_ar": "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللهُ عَنْهُمَا قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «إِذَا دُبِغَ الْإِهَابُ فَقَدْ طَهُرَ». أَخْرَجَهُ مُسْلِمٌ. وَعِنْدَ الْأَرْبَعَةِ: «أَيُّمَا إِهَابٍ دُبِغَ».", "translation_th": "จากอิบนุอับบาส (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"เมื่อหนังสัตว์ถูกฟอกแล้ว แน่นอนมันก็สะอาด\" บันทึกโดยมุสลิม และในรายงานของนักบันทึกทั้งสี่: \"หนังสัตว์ใดก็ตามที่ถูกฟอก...\"", "grade_th": "ศ่อฮีห์ (มุสลิม)"}, {"no": 19, "matn_ar": "وَعَنْ سَلَمَةَ بْنِ الْمُحَبِّقِ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «دِبَاغُ جُلُودِ الْمَيْتَةِ طُهُورُهَا». صَحَّحَهُ ابْنُ حِبَّانَ.", "translation_th": "จากสะละมะฮ์ บินอัลมุหับบิก (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"การฟอกหนังซากสัตว์ คือการชำระมันให้สะอาด\" อิบนุหิบบานระบุว่าศ่อฮีห์", "grade_th": "ศ่อฮีห์ด้วยหลักฐานสนับสนุน (ศ่อฮีห์ ลิฆ็อยริฮี)"}, {"no": 20, "matn_ar": "وَعَنْ مَيْمُونَةَ رَضِيَ اللهُ عَنْهَا، قَالَتْ: مَرَّ رَسُولُ اللهِ ﷺ بِشَاةٍ يَجُرُّونَهَا، فَقَالَ: «لَوْ أَخَذْتُمْ إِهَابَهَا؟» فَقَالُوا: إِنَّهَا مَيْتَةٌ، فَقَالَ: «يُطَهِّرُهَا الْمَاءُ وَالْقَرَظُ». أَخْرَجَهُ أَبُو دَاوُدَ، وَالنَّسَائِيُّ.", "translation_th": "จากมัยมูนะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ เดินผ่านแพะตัวหนึ่งที่พวกเขากำลังลากไป ท่านกล่าวว่า \"ถ้าพวกท่านเอาหนังของมันไว้ (คงจะดี)\" พวกเขากล่าวว่า มันเป็นซากสัตว์ ท่านกล่าวว่า \"น้ำและใบเกาะร็อซจะชำระมันให้สะอาด\" บันทึกโดยอบูดาวูดและอันนะสาอีย์", "grade_th": "ศ่อฮีห์ด้วยหลักฐานสนับสนุน (อัลอัลบานีย์ว่าศ่อฮีห์)"}], "key_rulings_th": ["หนังซากสัตว์สะอาดเมื่อฟอกแล้ว และใช้ใส่ ม ส่วนอัตติรมิซีย์ (1728) อันนะสาอีย์ และอิบนุมาญะฮ์ (3609) ใช้สำนวน \"หนังสัตว์ใดก็ตามที่ถูกฟอก ก็สะอาดแล้ว\" อัตติรมิซีย์ว่าหะซันศ่อฮีห์", "ผู้แต่งเห็นว่า อิบนุหะญัรพลาดที่กล่าวว่า \"และในรายงานของนักบันทึกทั้งสี่\" เพราะสำนวนของอบูดาวูดเหมือนสำนวนของมุสลิม", "หะดีษสะละมะฮ์: อิบนุหิบบานบันทึก (4522) ผ่านสายเญาน์ บินเกาะตาดะฮ์ ว่า ในสงครามตะบูก ท่านรสูลุลลอฮ์ ﷺ ไปที่บ้านหลังหนึ่งที่มีถุงหนังแขวนอยู่ ท่านขอน้ำดื่ม มีคนบอกว่าเป็นหนังซากสัตว์ ท่านกล่าวว่า \"การเชือดของหนังคือการฟอกมัน\" อะห์มัดบันทึกด้วยสำนวน \"การฟอกมันคือการชำระมัน หรือการเชือดมัน\" ซึ่งใกล้กับสำนวนในบุลูฆ ส่วนสำนวนในบุลูฆตรงกับหะดีษอาอิชะฮ์ที่อิบนุหิบบาน (1290) อะห์มัด และอันนะสาอีย์บันทึก", "ผู้แต่งเห็นว่าหะดีษสะละมะฮ์ศ่อฮีห์ด้วยหลักฐานสนับสนุน เพราะเญาน์ บินเกาะตาดะฮ์ไม่เป็นที่รู้จัก มีเพียงอิบนุหิบบานที่รับรอง อิมามอะห์มัดว่า \"ไม่รู้จัก\" อิบนุหะญัรว่า \"เป็นที่รับได้\" (คือเมื่อมีสายอื่นสนับสนุน) และอัลบุคอรีย์ว่าไม่รู้จักหะดีษของเขานอกจากหะดีษนี้ แต่หะดีษนี้ศ่อฮีห์ด้วยหลักฐานสนับสนุน เช่น หะดีษอิบนุอับบาสและมัยมูนะฮ์", "หะดีษมัยมูนะฮ์: อบูดาวูด (4126) และอันนะสาอีย์บันทึก ผ่านอับดุลลอฮ์ บินมาลิก บินหุซาฟะฮ์ จากมารดาของเขา อัลอาลิยะฮ์ บินติสุบัยอ์ ว่า นางมีแพะที่อุหุดแล้วมันตาย นางไปหามัยมูนะฮ์ มัยมูนะฮ์บอกว่า ถ้าเธอเอาหนังของมันมาใช้ประโยชน์ (ก็จะดี) นางถามว่า อนุญาตหรือ มัยมูนะฮ์ตอบว่า ใช่ แล้วเล่าเหตุการณ์ในหะดีษ", "อับดุลลอฮ์ บินมาลิก มีเพียงอิบนุหิบบานที่รับรอง ส่วนมารดาของเขา อัลอิจลีย์ว่าเชื่อถือได้ อิบนุหะญัรไม่ได้วิจารณ์หะดีษนี้ และมีหลักฐานสนับสนุน อัลอัลบานีย์ว่าศ่อฮีห์ หลักฐานสนับสนุนคือหะดีษอิบนุอับบาส (อัลบุคอรีย์ มุสลิม): ท่านนบี ﷺ เดินผ่านแพะที่ตายแล้ว ท่านกล่าวว่า \"ทำไมพวกท่านไม่ใช้ประโยชน์จากหนังของมัน\" พวกเขาตอบว่ามันเป็นซากสัตว์ ท่านกล่าวว่า \"ที่หะรอมคือการกินมันเท่านั้น\""]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظها", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"อัลอิฮาบ\" คือหนังก่อนฟอก หะดีษก็บ่งชี้เช่นนั้น อบูดาวูดกล่าวว่า หลังฟอกแล้วไม่เรียกว่าอิฮาบ แต่เรียกว่า ชันน์ หรือ กิรบะฮ์ ส่วนอัลอัซฮะรีย์ว่าชาวอาหรับเรียกหนังทุกชนิดว่าอิฮาบ คำว่า \"อัล\"
