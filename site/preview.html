ต่าง ๆ แม้สำนวนและสายจะต่างกัน ไม่มีรายงานใดกล่าวถึงการชำระด้วยหิน จึงแสดงว่าการชำระด้วยหินมีเฉพาะปัสสาวะและอุจจาระ"]}, {"wajh": 10, "type": "fiqh", "heading_ar": null, "heading_th": "มะซีย์ที่เปื้อนเสื้อผ้า", "points_th": ["ทัศนะที่หนึ่ง: ต้องล้างเท่านั้น เป็นทัศนะของหะนะฟีย์ มาลิกีย์ ชาฟิอีย์ และทัศนะหนึ่งในหันบะลีย์ โดยยึดหะดีษที่สั่งให้ล้าง", "ทัศนะที่สอง: เพียงพรมน้ำ (นัฎห์) ก็พอ เป็นอีกรายงานจากอะห์มัด อัตติรมิซีย์ยกคำของเขาว่า \"ฉันหวังว่าการพรมน้ำจะเพียงพอ\" หลักฐานคือหะดีษสะฮ์ล์ บินหุนัยฟ์ ว่าท่านรสูลุลลอฮ์ ﷺ กล่าวแก่เขาว่า \"เพียงพอสำหรับท่านที่จะตักน้ำหนึ่งกอบ แล้วพรมบนเสื้อตรงที่เห็นว่าเปื้อน\" (อบูดาวูด อัตติรมิซีย์ว่าหะซันศ่อฮีห์ ผ่านมุหัมมัด บินอิสหาก ซึ่งระบุชัดว่าได้ยินในรายงานของอะห์มัด ความสงสัยเรื่องการตัดลีสจึงหมดไป)", "ผู้แต่งเห็นว่าที่ถูกต้อง อินชาอัลลอฮ์ คือการพรมน้ำบนเสื้อก็พอ ไม่ต้องล้าง อิบนุตัยมียะฮ์และอิบนุลก็อยยิมศิษย์ของเขาเลือก เพราะการล้างมีกล่าวถึงที่อวัยวะเพศ ไม่ใช่ที่เสื้อ และรายงานเรื่องการพรมเสื้อไม่มีสิ่งใดขัด ส่วนอวัยวะเพศมีทั้งรายงานการพรมและการล้าง การพรมจึงอธิบายด้วยการล้าง อิบนุอับดิลบัรร์ระบุว่า การพรมในภาษาอาหรับบางครั้งหมายถึงการล้าง บางครั้งหมายถึงการพรม", "อิบนุตัยมียะฮ์กล่าวว่า \"มะซีย์ได้รับการอนุโลมตามรายงานที่แข็งแรงกว่า เพราะเป็นเรื่องที่เกิดกับทุกคน และหลีกเลี่ยงยาก จึงเหมือนเลือด หรือยิ่งกว่า เพราะมีข้อขัดแย้งว่าเป็นนะญิสหรือไม่ และว่าการพรมน้ำเพียงพอหรือไม่\""]}], "tags_th": ["สิ่งที่ทำให้วุฎูอ์เสีย", "มะซีย์", "นะญิส", "การพรมน้ำ", "การขอคำวินิจฉัย"]}, {"id": "v1-h070", "volume": 1, "bab": "nawaqid", "topic_ar": "تقبيل المرأة ولمسها لا ينقض الوضوء", "topic_th": "การจูบและสัมผัสภรรยาไม่ทำให้วุฎูอ์เสีย", "pages": [297, 304], "hadith": [{"no": 70, "matn_ar": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا أَنَّ النَّبِيَّ ﷺ قَبَّلَ بَعْضَ نِسَائِهِ، ثُمَّ خَرَجَ إِلَى الصَّلَاةِ وَلَمْ يَتَوَضَّأْ. أَخْرَجَهُ أَحْمَدُ، وَضَعَّفَهُ الْبُخَارِيُّ.", "translation_th": "จากอาอิชะฮ์ (ร.ฎ.) ว่า ท่านนบี ﷺ จูบภรรยาบางคนของท่าน แล้วออกไปละหมาดโดยไม่ได้อาบน้ำละหมาด บันทึกโดยอะห์มัด และอัลบุคอรีย์ว่าอ่อน", "grade_th": "มีข้อบกพร่อง (มะอ์ลูล) ตามอัลบุคอรีย์ อบูหาติม และอบูซุรอะฮ์ นักวิชาการรุ่นหลังหลายท่านว่าศ่อฮีห์"}], "key_rulings_th": ["ผู้แต่งเห็นว่าทัศนะที่มีน้ำหนักคือ การสัมผัสผู้หญิงไม่ทำให้วุฎูอ์เสียเลย ไม่ว่าจะมีความใคร่หรือไม่ เว้นแต่มีมะซีย์หรือสิ่งอื่นออกมา (อบูหะนีฟะฮ์ อิบนุตัยมียะฮ์ อิบนุบาซ)", "อัชชาฟิอีย์ว่าการสัมผัสทำให้เสียทุกกรณี ส่วนมัซฮับหันบะลีย์และมาลิกว่าเสียเฉพาะเมื่อมีความใคร่", "คำว่า \"หรือพวกเจ้าสัมผัสผู้หญิง\" ในอายะฮ์ หมายถึงการร่วมประเวณี ตามคำอธิบายของอิบนุอับบาส", "หลักฐานหลักคือหะดีษอาอิชะฮ์ในเศาะฮีหัยน์ ที่ท่านนบี ﷺ แตะเท้านางขณะละหมาดแล้วละหมาดต่อ"], "vocab": [{"ar": "قَبَّلَ بَعْضَ نِسَائِهِ", "th": "จูบภรรยาบางคนของท่าน"}, {"ar": "اللَّمْس / الْمُلَامَسَة", "th": "การสัมผัส ความหมายจริงคือแตะด้วยมือ และใช้เป็นนัยหมายถึงการร่วมประเวณี"}, {"ar": "مَظِنَّة الْحَدَث", "th": "สภาพที่น่าจะเกิดฮะดัษ"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อะห์มัดบันทึกผ่านวะกีอ์ จากอัลอะอ์มัช จากหะบีบ บินอบีษาบิต จากอุรวะฮ์ บินอัซซุบัยร์ จากอาอิชะฮ์ ตอนท้ายอุรวะฮ์กล่าวว่า ฉันถามนางว่า จะเป็นใครนอกจากท่าน นางก็หัวเราะ อบูดาวูด (179) อัตติรมิซีย์ (86) และอิบนุมาญะฮ์ บันทึกผ่านวะกีอ์ จากอัลอะอ์มัช ด้วยสายเดียวกัน", "อัลบุคอรีย์ว่าหะดีษนี้อ่อน ตามที่อิบนุหะญัรระบุ อบูหาติมและอบูซุรอะฮ์ก็ตัดสินเช่นกัน อัลบัยฮะกีย์ว่า \"นี่คือหะดีษที่มีชื่อเสียงที่สุดในบทนี้ และมีข้อบกพร่อง\" ข้อบกพร่องมีสองข้อ", "ข้อแรก: อุรวะฮ์ในสายนี้ไม่ใช่อิบนุอัซซุบัยร์ แต่เป็นผู้อาวุโสที่ไม่เป็นที่รู้จัก ชื่ออุรวะฮ์ อัลมุซะนีย์ ตามที่ระบุในอีกสาย อิมามหลายท่านเห็นเช่นนี้ รวมถึงอิบนุหัซม์ ข้อที่สอง: สายขาด เพราะหะบีบ บินอบีษาบิตไม่ได้ฟังจากอุรวะฮ์ ตามที่ยะห์ยา บินสะอีด อัลก็อฏฏอน อะห์มัด อัลบุคอรีย์ อบูหาติม และยะห์ยา บินมะอีนกล่าว พวกเขาตามสุฟยาน อัษเษารีย์ ซึ่งอบูดาวูดยกว่า \"หะบีบไม่ได้เล่าให้เราฟังนอกจากจากอุรวะฮ์ อัลมุซะนีย์\" ดูเหมือนอบูดาวูดไม่พอใจคำของอัษเษารีย์ จึงยกด้วยถ้อยคำที่ไม่ยืนยัน แล้วกล่าวว่า \"หัมซะฮ์ อัซซัยยาตรายงานจากหะบีบ จากอุรวะฮ์ บินอัซซุบัยร์ จากอาอิชะฮ์ หะดีษหนึ่งที่ศ่อฮีห์\" แต่หัมซะฮ์ อัซซัยยาตถูกวิจารณ์ อัตติรมิซีย์ถามอัลบุคอรีย์ เขาตอบว่า \"หะบีบ บินอบีษาบิตไม่ได้ฟังจากอุรวะฮ์\"", "นักวิชาการรุ่นหลังกลุ่มหนึ่งว่าศ่อฮีห์ เช่น อิบนุญะรีร อิบนุอับดิลบัรร์ อิบนุกะษีร อิบนุตตุรกุมานีย์ อัซซัยละอีย์ อะห์มัด ชากิร อัลอัลบานีย์ และอิบนุบาซ พวกเขาว่าข้อบกพร่องไม่ร้ายแรง ข้อแรกตอบได้ว่า (1) ผู้รายงานที่เชื่อถือได้หลายคนจากวะกีอ์ระบุชื่อว่าอิบนุอัซซุบัยร์ เช่น อะห์มัดในมุสนัด และอิบนุมาญะฮ์ (2) ท้ายหะดีษ อุรวะฮ์ถามว่า \"จะเป็นใครนอกจากท่าน\" นางก็หัวเราะ คนอื่นนอกจากอุรวะฮ์ บินอัซซุบัยร์คงไม่กล้าพูดกับอาอิชะฮ์เช่นนี้ เพราะนางเป็นน้าของเขา (3) ถ้าอุรวะฮ์คนนี้ไม่เป็นที่รู้จัก แล้วอาจารย์ของอัลอะอ์มัชหลายคนจะรายงานจากเขาได้อย่างไร (4) ตามหลักของนักหะดีษ ผู้ที่ไม่ระบุสกุลต้องตีความว่าเป็นคนที่รู้จักกันดี ไม่ใช่คนที่ไม่เป็นที่รู้จัก", "ข้อที่สองตอบว่า หะบีบเชื่อถือได้โดยเห็นพ้อง การพบอุรวะฮ์ไม่ใช่เรื่องแปลก เพราะเขารายงานจากผู้ที่อาวุโสกว่าอุรวะฮ์ อิบนุอับดิลบัรร์กล่าวว่า \"ไม่ต้องสงสัยว่าเขาพบอุรวะฮ์\" และคำของอบูดาวูดว่าหัมซะฮ์ อัซซัยยาตรายงานหะดีษศ่อฮีห์ คือหะดีษ \"โอ้อัลลอฮ์ โปรดให้ร่างกายของฉันมีสุขภาพดี และสายตาของฉันมีสุขภาพดี\" (อัตติรมิซีย์)", "ผู้แต่งเห็นว่าข้อบกพร่องเรื่องสายขาดยังไม่หมดไป เพราะคำของอิบนุอับดิลบัรร์ยืนขัดกับคำของอิมามรุ่นใหญ่ไม่ได้ และอิบนุอับดิลบัรร์มีแค่ความเป็นไปได้ว่าพบกัน ซึ่งไม่ได้พิสูจน์ว่าหะบีบได้ฟังจากอุรวะฮ์ และไม่พอที่จะหักล้างคำของอิมาม ส่วนคำของอบูดาวูดก็มาจากสายของหัมซะฮ์ อัซซัยยาต และถ้าถูกต้องก็หมายถึงหะดีษเฉพาะบทนั้น ไม่ได้แปลว่าหะบีบได้ฟังจากอุรวะฮ์ทั้งหมด", "หะดีษในบทนี้ยังมีสายผ่านอบูเราว์ก จากอิบรอฮีม อัตตัยมีย์ จากอาอิชะฮ์ (อบูดาวูด 178 อันนะสาอีย์) แต่เป็นมุรสัล เพราะอิบรอฮีม อัตตัยมีย์ไม่ได้ฟังจากอาอิชะฮ์ ตามที่อบูดาวูด อันนะสาอีย์ และอัตติรมิซีย์กล่าว อิบรอฮีมเสียชีวิตปี ฮ.ศ. 92 อายุสี่สิบปี และอาอิชะฮ์เสียชีวิตปี ฮ.ศ. 58 ส่วนอบูเราว์ก (อะฏิยะฮ์ บินอัลหาริษ) อิบนุหัซม์และอัลบัยฮะกีย์ว่าอ่อน แต่ที่ถูกคือเขาเชื่อถือได้ และมีสายที่สามผ่านอับดุรเราะห์มาน บินมัฆรออ์ จากอัลอะอ์มัช จากศิษย์ของเขา จากอุรวะฮ์ อัลมุซะนีย์ (อบูดาวูด 180) ซึ่งอ่อน สรุปคือหะดีษนี้มีข้อบกพร่อง มีสายและหลักฐานสนับสนุนที่มีข้อบกพร่องเช่นกัน อะห์มัด ชากิรยกไว้บางส่วน และตัดสินว่าบางสายศ่อฮีห์ และบางสายใกล้ศ่อฮีห์"]}, {"wajh": 2, "type": "fiqh", "heading_ar": null, "heading_th": "การสัมผัสผู้หญิงทำให้วุฎูอ์เสียหรือไม่", "points_th": ["ทัศนะที่หนึ่ง: การจูบและสัมผัสผู้หญิงไม่ทำให้วุฎูอ์เสีย เป็นทัศนะของอบูหะนีฟะฮ์ อีกรายงานจากอิมามอะห์มัดที่อิบนุกุดามะฮ์ระบุ มีรายงานจากอะลี อิบนุอับบาส อะฏออ์ เฏาะวูส อัลหะซัน และมัสรูก อิบนุตัยมียะฮ์และอิบนุบาซเห็นว่ามีน้ำหนัก", "ทัศนะที่สอง: การสัมผัสผู้หญิงทำให้วุฎูอ์เสียทุกกรณี ไม่ว่าจะมีความใคร่หรือไม่ เป็นทัศนะของชาฟิอีย์และอีกรายงานจากอะห์มัด หลักฐานคืออายะฮ์ \"หรือพวกเจ้าสัมผัสผู้หญิง\" (อัลมาอิดะฮ์: 6) ซึ่งหัมซะฮ์และอัลกิสาอีย์ (จากเจ็ดการอ่าน) อ่านว่า \"เลามัสตุม\" (ไม่มีอลิฟ) จึงหมายถึงการสัมผัสด้วยมือ เพราะความหมายจริงของการสัมผัสคือแตะด้วยมือ ส่วนการใช้หมายถึงการร่วมประเวณีเป็นความหมายอนุโลมหรือนัย และไม่เปลี่ยนจากความหมายจริงนอกจากเมื่อใช้ไม่ได้ อายะฮ์บังคับให้อาบน้ำละหมาด การสัมผัสผู้หญิงจึงทำให้เสีย", "ทัศนะที่สาม: แยกกรณี ถ้าสัมผัสด้วยความใคร่ วุฎูอ์เสีย ถ้าไม่ใช่ ก็ไม่เสีย เป็นทัศนะที่รู้จักในมัซฮับหันบะลีย์ ทัศนะของมาลิก และสลัฟกลุ่มหนึ่ง หลักฐาน (1) อายะฮ์ที่กล่าวมา โดยตีความว่าเป็นการสัมผัสด้วยความใคร่ เพราะความใคร่เป็นสภาพที่น่าจะเกิดฮะดัษ (2) หะดีษอาอิชะฮ์: \"ฉันเคยนอนอยู่ตรงหน้าท่านรสูลุลลอฮ์ ﷺ โดยเท้าของฉันอยู่ทางกิบลัตของท่าน เมื่อท่านสุญูด ท่านก็แตะฉัน ฉันจึงหดเท้า เมื่อท่านลุกขึ้น ฉันก็เหยียดเท้า\" นางกล่าวว่า \"บ้านในสมัยนั้นไม่มีตะเกียง\" (อัลบุคอรีย์ มุสลิม) ถ้าเพียงการสัมผัสทำให้วุฎูอ์เสีย วุฎูอ์ของท่านนบี ﷺ ก็คงเสีย และท่านคงเริ่มละหมาดใหม่ (3) การบังคับให้อาบน้ำละหมาดแก่ทุกคนที่สัมผัสทำให้ผู้คนลำบาก เพราะแทบไม่มีใครเลี่ยงได้ และสิ่งที่ลำบากถูกปฏิเสธในศาสนา อิบนุรุชด์ระบุว่าที่มาของข้อขัดแย้งคือคำว่า \"สัมผัส\" ในภาษาอาหรับมีสองความหมาย คือการแตะด้วยมือ (ทัศนะที่สอง) และการร่วมประเวณี (ทัศนะที่หนึ่ง)", "ผู้แต่งเห็นว่าทัศนะที่มีน้ำหนักคือทัศนะแรก คือการสัมผัสผู้หญิงไม่ทำให้วุฎูอ์เสียเลย เว้นแต่มีสิ่งใดออกมา เช่น มะซีย์ เหตุผล (1) หะดีษอาอิชะฮ์ในเศาะฮีหัยน์ และหะดีษอบูฮุร็อยเราะฮ์จากอาอิชะฮ์: \"คืนหนึ่งฉันไม่พบท่านรสูลุลลอฮ์ ﷺ ที่ที่นอน ฉันจึงคลำหา แล้วมือของฉันไปโดนฝ่าเท้าของท่าน...\" (มุสลิม) (2) หลักเดิมคือวุฎูอ์ไม่เสียและความสะอาดยังคงอยู่ จนกว่าจะมีหลักฐานศ่อฮีห์ที่ชัดเจน (3) การสัมผัสผู้หญิงเป็นเรื่องที่เกิดทั่วไปในบ้าน ถ้าทำให้วุฎูอ์เสีย ท่านนบี ﷺ คงอธิบายแก่ประชาชาติอย่างชัดเจน เมื่อไม่ได้อธิบาย ก็แสดงว่าไม่ทำให้เสีย", "ส่วนอายะฮ์ไม่ได้บ่งตามที่กล่าว เพราะการสัมผัสในอายะฮ์หมายถึงการร่วมประเวณี ไม่ใช่การแตะด้วยมือ ด้วยเหตุผล (1) อิบนุอับบาส นักวิชาการแห่งประชาชาติและล่ามอัลกุรอาน ซึ่งอัลลอฮ์สอนการตีความคัมภีร์ของพระองค์ และตอบรับดุอาอ์ของท่านรสูลให้แก่เขา อธิบายว่าการสัมผัสคือการร่วมประเวณี อัลบุคอรีย์ยกในเศาะฮีห์แบบไม่มีสายว่าเขากล่าวว่า \"การเข้าหา การสัมผัส และการแตะต้อง คือการร่วมประเวณี\" อับดุรร็อซซากบันทึกว่า อุบัยด์ บินอุมัยร์ สะอีด บินญุบัยร์ และอะฏออ์ บินอบีเราะบาห์ เห็นต่างกันเรื่องการสัมผัส สะอีดและอะฏออ์ว่าคือการแตะและการบีบ อุบัยด์ว่าคือการแต่งงาน อิบนุอับบาสออกมาหาพวกเขา พวกเขาถาม เขากล่าวว่า \"ทาสสองคนนั้นผิด และชาวอาหรับถูก คือการร่วมประเวณี แต่อัลลอฮ์ทรงสงวนและใช้นัย\" (สายรายงานศ่อฮีห์) คำอธิบายของเขามีน้ำหนักกว่าคนอื่นเพราะเหตุนี้ อิบนุญะรีรยกคำอธิบายนี้จากสลัฟกลุ่มหนึ่ง อิบนุกะษีรว่า \"มีรายงานศ่อฮีห์จากอับดุลลอฮ์ บินอับบาสหลายสาย\" และอิบนุญะรีรเห็นว่ามีน้ำหนัก", "(2) ถ้าตีความการสัมผัสในทั้งสองการอ่านว่าการร่วมประเวณี อายะฮ์ก็ครอบคลุมฮะดัษทั้งสอง คือฮะดัษเล็กในคำว่า \"หรือคนใดในพวกเจ้ามาจากที่ถ่ายทุกข์\" และฮะดัษใหญ่ในคำว่า \"หรือพวกเจ้าสัมผัสผู้หญิง\" ซึ่งสมบูรณ์และครอบคลุมกว่า ถ้าหมายถึงการแตะด้วยมือ ก็มีประโยชน์น้อย เพราะการมาจากที่ถ่ายทุกข์และการแตะ ล้วนเป็นสิ่งที่ทำให้ต้องอาบน้ำละหมาด อายะฮ์ก็จะไม่ได้กล่าวถึงสิ่งที่ทำให้ต้องอาบน้ำ คือฮะดัษใหญ่ (3) การตีความการสัมผัสว่าการร่วมประเวณีเป็นการประสานหลักฐานและใช้ทั้งหมด ต่างจากการตีความว่าแตะด้วยมือ ซึ่งทำให้ซุนนะฮ์ที่บ่งว่าการสัมผัสไม่ทำให้ต้องอาบน้ำละหมาดถูกยกเลิก", "ส่วนที่ว่าความหมายจริงของการสัมผัสคือการแตะด้วยมือนั้นถูก แต่เป็นที่รู้กันว่าเมื่อเชื่อมกับคำว่า \"ผู้หญิง\" จะหมายถึงการร่วมประเวณี เกือบจะเป็นความหมายตามรูปคำ เหมือนคำว่า \"วัฏอ์\" ความหมายจริงคือการเดินด้วยเท้า แต่เมื่อเชื่อมกับผู้หญิง ก็เข้าใจว่าคือการร่วมประเวณีเท่านั้น ส่วนการตีความอายะฮ์ว่าการสัมผัสด้วยความใคร่ เพราะเป็นสภาพที่น่าจะเกิดฮะดัษ ถูกตอบว่าสภาพที่น่าจะเกิดไม่ทำให้วุฎูอ์เสีย ถ้าไม่ได้แข็งแรง เพราะหลักเดิมคือความสะอาด (ดังจะกล่าวในหะดีษอบูฮุร็อยเราะฮ์)", "ส่วนหะดีษอาอิชะฮ์ในเศาะฮีหัยน์เป็นหลักฐานว่าการสัมผัสไม่ทำให้วุฎูอ์เสีย ส่วนที่อิบนุหะญัรแย้งว่า \"อาจมีสิ่งกั้น หรืออาจเป็นเรื่องเฉพาะท่านนบี ﷺ\" ไม่มีน้ำหนัก เพราะหลักเดิมคือไม่ใช่เรื่องเฉพาะ นอกจากมีหลักฐาน ตามหลักอุศูล แล้วจะตั้งประเด็นบนความเป็นไปได้ได้อย่างไร ส่วนความเป็นไปได้ว่ามีสิ่งกั้น ไม่มีใครคิดนอกจากผู้ที่เข้าข้างทัศนะตน และอิบนุหะญัรเองก็ขัดกับคำของท่านในอัตตัลคีศ ที่ว่าหะดีษนี้เป็นหลักฐานว่าการสัมผัสในอายะฮ์คือการร่วมประเวณี เพราะท่านนบี ﷺ แตะนางขณะละหมาดแล้วละหมาดต่อ และนี่คือความจริง อินชาอัลลอฮ์", "อิบนุตัยมียะฮ์ถือว่าทัศนะว่าการสัมผัสผู้หญิงโดยไม่มีความใคร่ทำให้วุฎูอ์เสีย เป็นทัศนะที่แปลกแยก ไม่มีที่มาในอัลกุรอาน ซุนนะฮ์ หรือรายงานจากสลัฟคนใดของประชาชาติ และไม่สอดคล้องกับหลักของศาสนา เพราะการสัมผัสที่ไม่มีความใคร่ไม่มีผลต่ออิบาดะฮ์ใด ผู้ที่ทำให้มันทำลายความสะอาด ก็ขัดกับหลักของศาสนา"]}], "tags_th": ["สิ่งที่ทำให้วุฎูอ์เสีย", "สัมผัสผู้หญิง", "การจูบ", "อิบนุอับบาส", "ตัฟซีร"]}, {"id": "v1-h071", "volume": 1, "bab": "nawaqid", "topic_ar": "حكم الشك في الحدث مع تيقن الطهارة", "topic_th": "หุก่มการสงสัยว่ามีฮะดัษ ขณะแน่ใจว่ามีความสะอาด", "pages": [305, 307], "hadith": [{"no": 71, "matn_ar": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «إِذَا وَجَدَ أَحَدُكُمْ فِي بَطْنِهِ شَيْئًا، فَأَشْكَلَ عَلَيْهِ: أَخَرَجَ مِنْهُ شَيْءٌ، أَمْ لَا؟ فَلَا يَخْرُجَنَّ مِنَ الْمَسْجِدِ حَتَّى يَسْمَعَ صَوْتًا، أَوْ يَجِدَ رِيحًا». أَخْرَجَهُ مُسْلِمٌ.", "translation_th": "จากอบูฮุร็อยเราะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"เมื่อผู้ใดในพวกท่านรู้สึกบางอย่างในท้อง แล้วไม่แน่ใจว่ามีอะไรออกมาหรือไม่ ก็อย่าออกจากมัสยิด จนกว่าจะได้ยินเสียงหรือได้กลิ่น\" บันทึกโดยมุสลิม", "grade_th": "ศ่อฮีห์ (มุสลิม)"}], "key_rulings_th": ["ผู้ที่มีความสะอาดแล้วสงสัยว่ามีฮะดัษ ไม่ต้องอาบน้ำละหมาดใหม่ ให้ละหมาดด้วยความสะอาดเดิม จนกว่าจะแน่ใจว่ามีฮะดัษ", "หะดีษเป็นหลักฐานของหลักนิติศาสตร์ใหญ่ \"ความแน่ใจไม่หมดไปด้วยความสงสัย\" และหลักเดิมคือสิ่งต่าง ๆ คงอยู่ตามเดิม", "หะดีษนี้เป็นหลักสำคัญในการปิดประตูความระแวง (วัสวะสะฮ์) ที่ชัยฏอนใช้ทำลายความสะอาดและการละหมาด", "ลมทำให้วุฎูอ์เสีย"], "vocab": [{"ar": "وَجَدَ فِي بَطْنِهِ شَيْئًا", "th": "รู้สึกลมเคลื่อนในท้อง คือเสียงท้องร้อง"}, {"ar": "فَأَشْكَلَ عَلَيْهِ", "th": "สับสน ไม่แน่ใจว่ามีสิ่งที่ทำให้วุฎูอ์เสียเกิดขึ้นหรือไม่"}, {"ar": "حَتَّى يَسْمَعَ صَوْتًا أَوْ يَجِدَ رِيحًا", "th": "จนกว่าจะแน่ใจว่ามีฮะดัษ ด้วยการได้ยินหรือได้กลิ่น"}, {"ar": "الْوَسْوَسَة", "th": "ความระแวง ความคิดที่ชัยฏอนแทรกเข้ามาในใจ"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["มุสลิมบันทึกในหมวดประจำเดือน บทหลักฐานว่าผู้ที่แน่ใจว่ามีความสะอาดแล้วสงสัยว่ามีฮะดัษ ให้ละหมาดด้วยความสะอาดนั้น (362) ผ่านญะรีร บินอับดิลหะมีด จากสุฮัยล์ บินอบีศอลิห์ จากบิดา (อบูศอลิห์ ซักวาน อัสสัมมาน เชื่อถือได้ แม่นยำ) จากอบูฮุร็อยเราะฮ์", "มีหะดีษอื่นในความหมายเดียวกัน (จะกล่าวต่อไป)"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"เมื่อผู้ใดในพวกท่านรู้สึกบางอย่างในท้อง\" คือรู้สึกลมเคลื่อนในท้อง ซึ่งเป็นเสียงของลำไส้ คือเสียงท้องร้อง \"แล้วไม่แน่ใจ\" คือสับสนว่ามีสิ่งที่ทำให้วุฎูอ์เสียเกิดขึ้นหรือไม่ \"ก็อย่าออกจากมัสยิด\" คือเพื่อไปอาบน้ำละหมาด", "\"จนกว่าจะได้ยินเสียงหรือได้กลิ่น\" คือจนกว่าจะแน่ใจว่ามีฮะดัษ ด้วยการได้ยินหรือได้กลิ่น คำว่า \"หรือ\" บ่งประเภท ที่ระบุการได้ยินและการได้กลิ่นเพราะเป็นกรณีส่วนใหญ่ มิฉะนั้น ถ้าคนนั้นไม่ได้ยินหรือไม่ได้กลิ่นเพราะความบกพร่องหรือโรค และแน่ใจด้วยวิธีอื่น วุฎูอ์ก็เสีย"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "สงสัยว่ามีฮะดัษ", "points_th": ["หะดีษเป็นหลักฐานว่าผู้ที่มีความสะอาด ถ้าสงสัยว่ามีฮะดัษ ไม่ต้องอาบน้ำละหมาด แต่ละหมาดด้วยความสะอาดนั้น จนกว่าจะแน่ใจว่ามีฮะดัษ ด้วยการได้ยินเสียงหรือได้กลิ่นลม", "หะดีษอับดุลลอฮ์ บินซัยด์ก็บ่งเช่นกัน ว่าเขาร้องเรียนกับท่านนบี ﷺ เรื่องชายที่รู้สึกว่ามีอะไรขณะละหมาด ท่านตอบว่า \"อย่าออกจากละหมาด จนกว่าจะได้ยินเสียงหรือได้กลิ่น\" (อัลบุคอรีย์ มุสลิม)"]}, {"wajh": 4, "type": "fawaid", "heading_ar": null, "heading_th": "ความแน่ใจไม่หมดไปด้วยความสงสัย", "points_th": ["หะดีษนี้เป็นหลักฐานของหลักใหญ่ของศาสนา คือ \"ความแน่ใจไม่หมดไปด้วยความสงสัย\" และหลักเดิมคือสิ่งต่าง ๆ คงอยู่ตามเดิม ซึ่งเป็นหนึ่งในหลักนิติศาสตร์ใหญ่ที่แตกประเด็นย่อยได้มากมาย ทั้งในอิบาดะฮ์ ธุรกรรม และสัญญา", "อัลก็อรอฟีย์กล่าวว่า \"นี่คือหลักที่เห็นพ้อง คือทุกสิ่งที่สงสัย ให้ถือว่าไม่มี เหมือนสิ่งที่แน่ใจว่าไม่มี\" อบูดาวูดกล่าวว่า \"ฉันได้ยินอะห์มัดถูกถามเรื่องชายที่สงสัยในวุฎูอ์ของเขา เขาตอบว่า ถ้าอาบน้ำละหมาดแล้ว เขาก็อยู่บนวุฎูอ์ จนกว่าจะแน่ใจว่ามีฮะดัษ และถ้ามีฮะดัษในวุฎูอ์ เขาก็มีฮะดัษ จนกว่าจะแน่ใจว่าอาบน้ำละหมาดแล้ว\""]}, {"wajh": 5, "type": "fawaid", "heading_ar": null, "heading_th": "ปิดประตูความระแวง", "points_th": ["หะดีษนี้เป็นหลักสำคัญในการปิดประตูความระแวง ที่ชัยฏอนใช้แทรกเข้ามาหาบ่าว เพื่อทำลายความสะอาด การละหมาด และอิบาดะฮ์ของเขา", "หะดีษบ่งว่ามุสลิมไม่ควรยอมจำนนต่อความระแวง เพราะเป็นโรคเรื้อรัง ถ้ารุนแรงจะไม่ยอมจากเจ้าของ เขาจะตกอยู่ในความลำบาก และเหนื่อยยากในการปฏิบัติสิ่งวาญิบ ความระแวงส่วนใหญ่เกิดจากความสงสัย เมื่อใดคนยอมจำนนและทำตาม เขาก็จะเหนื่อยกับมัน เมื่อใดที่ไม่สนใจและไม่ใส่ใจ มันก็จะหายไปด้วยอนุมัติของอัลลอฮ์"]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "ลมทำให้วุฎูอ์เสีย", "points_th": ["หะดีษบ่งว่าลมทำให้วุฎูอ์เสีย เพราะคำว่า \"จนกว่าจะได้ยินเสียงหรือได้กลิ่น\"", "อิบนุหะญัรจะยกหะดีษในเรื่องนี้ไว้ท้ายบท ผู้แต่งเห็นว่าควรรวมไว้ที่เดียวกัน"]}], "tags_th": ["สิ่งที่ทำให้วุฎูอ์เสีย", "ความสงสัย", "ความแน่ใจ", "วัสวะสะฮ์", "หลักนิติศาสตร์"]}, {"id": "v1-h072", "volume": 1, "bab": "nawaqid", "topic_ar": "ما جاء في أن مس الذكر لا ينقض الوضوء", "topic_th": "รายงานว่าการจับอวัยวะเพศไม่ทำให้วุฎูอ์เสีย", "pages": [308, 310], "hadith": [{"no": 72, "matn_ar": "عَنْ طَلْقِ بْنِ عَلِيٍّ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَجُلٌ: مَسِسْتُ ذَكَرِي. أَوْ قَالَ: الرَّجُلُ يَمَسُّ ذَكَرَهُ فِي الصَّلَاةِ، أَعَلَيْهِ وُضُوءٌ؟ فَقَالَ النَّبِيُّ ﷺ: «لَا، إِنَّمَا هُوَ بَضْعَةٌ مِنْكَ». أَخْرَجَهُ الْخَمْسَةُ، وَصَحَّحَهُ ابْنُ حِبَّانَ، وَقَالَ ابْنُ الْمَدِينِيِّ: هُوَ أَحْسَنُ مِنْ حَدِيثِ بُسْرَةَ.", "translation_th": "จากฏ็อลก์ บินอะลี (ร.ฎ.) กล่าวว่า ชายคนหนึ่งกล่าวว่า ฉันจับอวัยวะเพศของฉัน หรือเขากล่าวว่า ชายคนหนึ่งจับอวัยวะเพศของเขาขณะละหมาด เขาต้องอาบน้ำละหมาดไหม ท่านนบี ﷺ ตอบว่า \"ไม่ มันเป็นเพียงชิ้นเนื้อส่วนหนึ่งของท่าน\" บันทึกโดยนักบันทึกทั้งห้า อิบนุหิบบานระบุว่าศ่อฮีห์ และอิบนุลมะดีนีย์กล่าวว่า หะดีษนี้ดีกว่าหะดีษบุสเราะฮ์", "grade_th": "ศ่อฮีห์ (อัฏเฏาะหาวีย์ อิบนุหิบบาน อิบนุหัซม์) แต่อัชชาฟิอีย์ อบูหาติม อบูซุรอะฮ์ อัดดารุกุฏนีย์ และอัลบัยฮะกีย์ว่าอ่อน เพราะก็อยส์ บินฏ็อลก์"}], "key_rulings_th": ["ผู้ที่เห็นว่าการจับอวัยวะเพศไม่ทำให้วุฎูอ์เสียอ้างหะดีษนี้ (หะนะฟีย์ มาลิกีย์บางท่าน อีกรายงานจากอะห์มัด อิบนุลมุนซิร)", "เพราะท่านนบี ﷺ อธิบายว่าอวัยวะเพศเป็นชิ้นเนื้อหนึ่งของร่างกาย เหมือนการจับหู มือ หรือเท้า", "ผู้แต่งจะอธิบายประเด็นนี้และทัศนะที่มีน้ำหนักในหะดีษถัดไป (หะดีษบุสเราะฮ์)"], "vocab": [{"ar": "مَسِسْتُ", "th": "ฉันจับ คือแตะด้วยมือโดยไม่มีสิ่งกั้น"}, {"ar": "بَضْعَة", "th": "อ่านสระอะ (หรือสระอิ) ชิ้นเนื้อ ความหมายคือเหมือนมือ หู หรือเท้า"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อบูอะลี ฏ็อลก์ บินอะลี บินฏ็อลก์ บินอัมร์ บ้างว่าฏ็อลก์ บินอะลี บินอัลมุนซิร บินก็อยส์ อัสสุหัยมีย์ อัลยะมามีย์ เป็นที่รู้จัก เป็นเศาะหาบะฮ์ เป็นตัวแทนเผ่า และรายงานหะดีษ", "ในเศาะฮีห์อิบนุหิบบาน ผ่านก็อยส์ บินฏ็อลก์ จากบิดาว่า \"ฉันสร้างมัสยิดมะดีนะฮ์กับท่านรสูลุลลอฮ์ ﷺ ท่านกล่าวว่า จงให้คนยะมามะฮ์ทำดินให้ใกล้ เพราะเขาเป็นคนที่จับดินเก่งที่สุดในหมู่พวกท่าน\" (สายรายงานแข็งแรง) ผู้รายงานจากเขาคือก็อยส์ลูกชาย และเคาะละดะฮ์ลูกสาว และคนอื่น"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อบูดาวูดบันทึกในหมวดฏอฮาเราะฮ์ บทข้อผ่อนผัน (182, 183) อัตติรมิซีย์ (85) อันนะสาอีย์ อิบนุมาญะฮ์ (483) และอิบนุหิบบาน (1119) ทั้งหมดผ่านมุลาซิม บินอัมร์ อัลหะนะฟีย์ จากอับดุลลอฮ์ บินบัดร์ จากก็อยส์ บินฏ็อลก์ จากบิดา", "อัฏเฏาะหาวีย์กล่าวว่า \"นี่คือหะดีษมุลาซิม ศ่อฮีห์ สายรายงานตรง ไม่สับสนทั้งสายและตัวบท\" และยกคำของอิบนุลมะดีนีย์ว่า \"หะดีษมุลาซิมนี้ดีกว่าหะดีษบุสเราะฮ์\" อัตติรมิซีย์ว่า \"หะดีษนี้ดีที่สุดที่รายงานในบทนี้\" อิบนุหัซม์ว่า \"เป็นรายงานที่ศ่อฮีห์\" และอิบนุตตุรกุมานีย์ว่าศ่อฮีห์ อะห์มัดบันทึกผ่านอัยยูบ บินอุตบะฮ์ จากก็อยส์ จากบิดา อัยยูบอ่อน แต่มีสายสนับสนุน และหะดีษมีสายอื่น", "นักวิชาการอีกกลุ่มว่าอ่อน เช่น อัชชาฟิอีย์ อบูหาติม อบูซุรอะฮ์ อัดดารุกุฏนีย์ อัลบัยฮะกีย์ และอิบนุลเญาซีย์ เพราะก็อยส์ บินฏ็อลก์ไม่แข็งแรง ตามที่อัลบัยฮะกีย์กล่าว อัดดารุกุฏนีย์ยกคำของยะห์ยา บินมะอีนว่า \"คนพูดถึงก็อยส์มาก ใช้เป็นหลักฐานไม่ได้\" อัซซะฮะบีย์ว่า \"อะห์มัดและยะห์ยาว่าอ่อนในหนึ่งในสองรายงานจากเขา\"", "แต่มีรายงานที่ถูกต้องจากยะห์ยาที่ขัดกัน อุษมาน บินสะอีด อัดดาริมีย์รายงานว่า ฉันถามว่า อับดุลลอฮ์ บินนุอ์มาน จากก็อยส์ บินฏ็อลก์ เป็นอย่างไร เขาตอบว่า \"ผู้อาวุโสชาวยะมามะฮ์ที่เชื่อถือได้\" ส่วนที่อิบนุลเญาซีย์ยกว่าอะห์มัดว่าอ่อน สิ่งที่อัลค็อลลาลยกจากอะห์มัดคือ \"คนอื่นแม่นยำกว่าเขา\" ซึ่งไม่ใช่การว่าอ่อน อิบนุหิบบานใส่ไว้ในรายชื่อผู้เชื่อถือได้ และอัลอิจลีย์ว่า \"ก็อยส์ บินฏ็อลก์ ชาวยะมามะฮ์ ตาบิอีน เชื่อถือได้\"", "ส่วนที่อันนะวะวีย์ว่า \"อ่อนตามมติของนักหะดีษผู้เชี่ยวชาญ\" เป็นความเข้าใจผิดของเขา และดูเหมือนอิบนุอับดิลฮาดีหมายถึงเขาที่กล่าวว่า \"ผู้ที่รายงานว่ามีมติว่าอ่อนนั้นผิด\""]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ฉันจับอวัยวะเพศของฉัน\" ทางภาษาคือการแตะด้วยมือโดยไม่มีสิ่งกั้น \"ไม่\" คือไม่ต้องอาบน้ำละหมาดเพราะจับมัน", "\"ชิ้นเนื้อส่วนหนึ่งของท่าน\" (บัฎอะฮ์) อ่านสระอะ หรือสระอิก็ได้ คือชิ้นเนื้อ หมายความว่าเหมือนมือ หู เท้า และอวัยวะอื่น"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "จับอวัยวะเพศไม่ทำให้วุฎูอ์เสีย", "points_th": ["หะดีษเป็นหลักฐานของผู้ที่ว่าการจับอวัยวะเพศไม่ทำให้วุฎูอ์เสีย เพราะท่านนบี ﷺ อธิบายว่ามันเป็นชิ้นเนื้อส่วนหนึ่งของร่างกาย เหมือนการจับหูหรือมือ เป็นทัศนะของหะนะฟีย์ มาลิกีย์บางท่าน อีกรายงานจากอิมามอะห์มัด และทัศนะของอิบนุลมุนซิร", "ผู้แต่งจะอธิบายประเด็นนี้และทัศนะที่มีน้ำหนักในหะดีษถัดไป อินชาอัลลอฮ์"]}], "tags_th": ["สิ่งที่ทำให้วุฎูอ์เสีย", "จับอวัยวะเพศ", "ฏ็อลก์ บินอะลี"]}, {"id": "v1-h073", "volume": 1, "bab": "nawaqid", "topic_ar": "ما جاء في أن مس الذكر ينقض الوضوء", "topic_th": "รายงานว่าการจับอวัยวะเพศทำให้วุฎูอ์เสีย", "pages": [311, 315], "hadith": [{"no": 73, "matn_ar": "عَنْ بُسْرَةَ بِنْتِ صَفْوَانَ رَضِيَ اللهُ عَنْهَا أَنَّ رَسُولَ اللهِ ﷺ قَالَ: «مَنْ مَسَّ ذَكَرَهُ فَلْيَتَوَضَّأْ». أَخْرَجَهُ الْخَمْسَةُ، وَصَحَّحَهُ التِّرْمِذِيُّ وَابْنُ حِبَّانَ، وَقَالَ الْبُخَارِيُّ: هُوَ أَصَحُّ شَيْءٍ فِي هَذَا الْبَابِ.", "translation_th": "จากบุสเราะฮ์ บินติเศาะฟวาน (ร.ฎ.) ว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"ผู้ใดจับอวัยวะเพศของเขา ก็จงอาบน้ำละหมาด\" บันทึกโดยนักบันทึกทั้งห้า อัตติรมิซีย์และอิบนุหิบบานระบุว่าศ่อฮีห์ และอัลบุคอรีย์กล่าวว่า หะดีษนี้ถูกต้องที่สุดในบทนี้", "grade_th": "ศ่อฮีห์ (อัตติรมิซีย์ว่าหะซันศ่อฮีห์)"}], "key_rulings_th": ["หะดีษบุสเราะฮ์ (จับแล้วต้องอาบน้ำละหมาด) ขัดกับหะดีษฏ็อลก์ (ไม่ต้อง) นักวิชาการมีสามแนวทางในการแก้", "แนวทางยกเลิก (นัสค์): หะดีษฏ็อลก์มาก่อน ถูกยกเลิกด้วยหะดีษบุสเราะฮ์ ผู้แต่งเห็นว่าอ่อน เพราะต้องประสานก่อน และลำดับเวลาไม่ชัด", "แนวทางเลือกน้ำหนัก: หะดีษบุสเราะฮ์มีน้ำหนักกว่า จึงต้องอาบน้ำละหมาด (อัศศ็อนอานีย์ อิบนุบาซ) เพราะศ่อฮีห์กว่า มีหลักฐานสนับสนุนจากเศาะหาบะฮ์สิบเจ็ดคน และรอบคอบกว่า", "แนวทางประสาน ซึ่งผู้แต่งว่าเป็นแนวทางที่ดี: (1) ส่งเสริมให้อาบน้ำละหมาด แต่ไม่วาญิบ (อิบนุลมุนซิร อิบนุตัยมียะฮ์) หรือ (2) ถ้าจับด้วยความใคร่ต้องอาบน้ำละหมาด ถ้าไม่มีความใคร่ ไม่ต้อง", "การจับอวัยวะเพศ (ฟัรจ์) ของหญิงก็มีหุก่มเดียวกัน"], "vocab": [{"ar": "بُسْرَة", "th": "อ่านสระอุแล้วสุกูน"}, {"ar": "الْبَرَاءَة الْأَصْلِيَّة", "th": "สภาพเดิม คือไม่มีหุก่มหรือภาระ จนกว่าจะมีหลักฐาน"}, {"ar": "النَّسْخ", "th": "การยกเลิกหุก่มเดิมด้วยหุก่มที่มาทีหลัง"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["บุสเราะฮ์ บินติเศาะฟวาน บินเนาฟัล บินอะสัด บินอับดิลอุซซา อัลกุร็อชียะฮ์ อัลอะสะดียะฮ์ หลานสาวของวะเราะเกาะฮ์ บินเนาฟัล และพี่สาวน้องสาวร่วมมารดาของอุกบะฮ์ บินอบีมุอัยฏ์ มีความเห็นอื่นเรื่องเชื้อสายของนาง แต่อิบนุอับดิลบัรร์ว่าที่กล่าวมาถูกต้อง อิบนุลอะษีรว่า \"นี่ถูกต้องที่สุด\"", "ผู้ที่รายงานจากนางคืออับดุลลอฮ์ บินอุมัร มัรวาน บินอัลหะกัม อิบนุลมุสัยยิบ และคนอื่น อัชชาฟิอีย์กล่าวว่า \"นางเข้ารับอิสลามแต่เนิ่น ๆ และอพยพ\" อิบนุหิบบานว่า \"นางเป็นหนึ่งในหญิงที่อพยพ\" และมุศอับ บินอัซซุบัยร์ว่า \"นางเป็นหนึ่งในหญิงที่ให้สัตยาบัน\""]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อบูดาวูดบันทึกในหมวดฏอฮาเราะฮ์ บทการอาบน้ำละหมาดเพราะจับอวัยวะเพศ (181) อันนะสาอีย์ อะห์มัด มาลิก และอิบนุหิบบาน (1112) ผ่านอับดุลลอฮ์ บินอบีบักร์ ว่าได้ยินอุรวะฮ์กล่าวว่า ฉันเข้าไปหามัรวาน บินอัลหะกัม เราคุยกันเรื่องสิ่งที่ทำให้ต้องอาบน้ำละหมาด มัรวานกล่าวว่า และเพราะการจับอวัยวะเพศ อุรวะฮ์กล่าวว่า ฉันไม่รู้เรื่องนั้น มัรวานกล่าวว่า บุสเราะฮ์ บินติเศาะฟวานเล่าให้ฉันฟัง... แล้วเล่าหะดีษ", "อัตติรมิซีย์ (83) อิบนุมาญะฮ์ (479) และอิบนุหิบบาน (1115) บันทึกผ่านฮิชาม บินอุรวะฮ์ จากบิดา จากมัรวาน จากบุสเราะฮ์ ในสำนวนของอิบนุหิบบาน \"ผู้ใดจับอวัยวะเพศ (ฟัรจ์) ของเขา ก็จงอาบน้ำละหมาด\" อัตติรมิซีย์ว่า \"หะดีษหะซันศ่อฮีห์\" และยกคำของอัลบุคอรีย์ว่า \"สิ่งที่ถูกต้องที่สุดในบทนี้คือหะดีษบุสเราะฮ์\"", "ตามบริบทของอบูดาวูดและคนอื่น หะดีษนี้มาจากมัรวาน บินอัลหะกัม จากบุสเราะฮ์ บางคนวิจารณ์เขาเพราะเรื่องการปกครอง และข่าวทางประวัติศาสตร์ว่าเขาสังหารฏ็อลหะฮ์ และชูดาบแสวงหาเคาะลีฟะฮ์ อิบนุหะญัรแก้ต่างว่าการสังหารฏ็อลหะฮ์เขาทำโดยตีความ ส่วนการชูดาบแสวงหาเคาะลีฟะฮ์เกิดหลังจากรายงานหะดีษนี้ เพราะเขารายงานขณะเป็นผู้ปกครองมะดีนะฮ์ อัลบุคอรีย์ใช้เขาเป็นหลักฐานในเศาะฮีห์ มาลิกในอัลมุวัฏเฏาะอ์ และอะห์มัดในมุสนัด ซึ่งเพียงพอให้ใช้เป็นหลักฐาน", "หะดีษนี้มีรายงานผ่านฮิชาม บินอุรวะฮ์ จากอุรวะฮ์ จากบุสเราะฮ์ โดยไม่มีมัรวาน (อัตติรมิซีย์ 82 อันนะสาอีย์ 447 อะห์มัด) ซึ่งขัดกับรายงานของผู้รายงานส่วนใหญ่ จึงอาจตัดสินว่าเป็นชาซ หรืออาจกล่าวว่าอุรวะฮ์ได้ยินจากมัรวานก่อน แล้วต้องการความมั่นใจ จึงไปพบบุสเราะฮ์และได้ยินจากนาง ตามรายงานของชุอัยบ์ บินอิสหาก ในอิบนุหิบบาน (1113) และอัดดารุกุฏนีย์"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "ประสานหะดีษบุสเราะฮ์กับหะดีษฏ็อลก์", "points_th": ["หะดีษเป็นหลักฐานของผู้ที่ว่าการจับอวัยวะเพศ และการจับฟัรจ์ (ของหญิง) ทำให้วุฎูอ์เสีย เป็นทัศนะของอัชชาฟิอีย์ ของมาลิกตามที่รู้จัก และที่รู้จักในมัซฮับอะห์มัด แต่หะดีษนี้ขัดกับหะดีษฏ็อลก์ บินอะลีที่ผ่านมา นักวิชาการมีสามแนวทางในการขจัดความขัดแย้ง ซึ่งเป็นแนวทางที่รู้กันในอุศูล", "แนวทางที่หนึ่ง การยกเลิก (นัสค์): หะดีษฏ็อลก์ถูกยกเลิกด้วยหะดีษบุสเราะฮ์ เพราะหะดีษของเขามาก่อน และหะดีษของนางมาทีหลัง หลักฐานคือในชีวประวัติของเขา เขามามะดีนะฮ์ขณะที่ท่านรสูลุลลอฮ์ ﷺ กำลังสร้างมัสยิดในช่วงแรกของการอพยพ ผู้ที่ว่ายกเลิกได้แก่ อิบนุหิบบาน อัฏเฏาะบะรอนีย์ อิบนุลอะเราะบีย์ อัลหาซิมีย์ อัลบัยฮะกีย์ และอิบนุหัซม์ อิบนุหัซม์สนับสนุนด้วยคำว่า \"มันเป็นเพียงชิ้นเนื้อส่วนหนึ่งของท่าน\" ว่าบ่งว่าเกิดก่อนคำสั่งให้อาบน้ำละหมาด เพราะถ้าเกิดหลัง ท่านคงไม่พูดเช่นนั้น แต่จะบอกว่าคำสั่งนั้นถูกยกเลิก และคำนี้บ่งว่ายังไม่มีหุก่มเรื่องนี้มาก่อน และอวัยวะเพศเหมือนอวัยวะอื่น", "ผู้แต่งเห็นว่าทัศนะว่ายกเลิกอ่อนด้วยสองเหตุ (1) หลักของนักอุศูลคือไม่ไปที่การยกเลิก นอกจากเมื่อประสานสองหลักฐานไม่ได้ เพราะการยกเลิกคือการทิ้งหลักฐานหนึ่ง ส่วนการประสานคือการใช้ทั้งสอง และประสานได้ (2) นักวิชาการกล่าวว่าลำดับเวลาไม่รู้ได้จากการที่ผู้รายงานเข้ารับอิสลามก่อนหรือรับหะดีษก่อน เพราะผู้รายงานที่มาทีหลังอาจรายงานจากเศาะหาบะฮ์คนอื่น อัชเชากานีย์จึงกล่าวว่า \"นี่ไม่ใช่หลักฐานในหมู่นักอุศูลผู้เชี่ยวชาญ\"", "แนวทางที่สอง การเลือกน้ำหนัก (ตัรญีห์): นักวิชาการผู้เชี่ยวชาญเลือกหะดีษบุสเราะฮ์เหนือหะดีษฏ็อลก์ จึงต้องอาบน้ำละหมาดเพราะจับอวัยวะเพศ อัศศ็อนอานีย์และอิบนุบาซเลือก เหตุผล (1) หะดีษบุสเราะฮ์ศ่อฮีห์กว่า สายรายงานปลอดภัย ส่วนหะดีษฏ็อลก์มีหลายคนว่าอ่อน อัลบุคอรีย์ว่าหะดีษบุสเราะฮ์ \"ถูกต้องที่สุดในบทนี้\" แม้อาจารย์ของเขา อะลี บินอัลมะดีนีย์ จะเห็นต่างและเลือกหะดีษฏ็อลก์ แต่คำของอัลบุคอรีย์ในที่นี้สมควรกว่า เพราะมีสิ่งสนับสนุน อิบนุหะญัรยกคำของอัลบัยฮะกีย์ว่า \"เพียงพอในการเลือกหะดีษบุสเราะฮ์เหนือหะดีษฏ็อลก์ ที่อัลบุคอรีย์และมุสลิมไม่ได้บันทึกหะดีษฏ็อลก์ และไม่ได้ใช้ผู้รายงานคนใดของมันเป็นหลักฐาน ส่วนหะดีษบุสเราะฮ์ ทั้งสองใช้ผู้รายงานทั้งหมดเป็นหลักฐาน แม้ไม่ได้บันทึกหะดีษนี้\"", "(2) หะดีษบุสเราะฮ์มีหลักฐานสนับสนุนมาก เศาะหาบะฮ์สิบเจ็ดคนรายงาน ส่วนหะดีษฏ็อลก์ไม่มีหลักฐานสนับสนุน เช่น หะดีษอบูฮุร็อยเราะฮ์: \"เมื่อผู้ใดในพวกท่านเอามือแตะอวัยวะเพศ โดยไม่มีสิ่งปิดหรือกั้น ก็จงอาบน้ำละหมาด\" (อะห์มัด อิบนุหิบบาน สายรายงานอ่อนแต่ถึงระดับหะซันด้วยหลายสาย) หะดีษอุมมุหะบีบะฮ์: \"ผู้ใดจับฟัรจ์ของเขา ก็จงอาบน้ำละหมาด\" (อิบนุมาญะฮ์ อัลบัยฮะกีย์ อบูซุรอะฮ์ว่าถูกต้อง) หะดีษอัมร์ บินชุอัยบ์ จากบิดา จากปู่: \"ชายใดจับฟัรจ์ของเขา ก็จงอาบน้ำละหมาด และหญิงใดจับฟัรจ์ของนาง ก็จงอาบน้ำละหมาด\" (อะห์มัด อัดดารุกุฏนีย์ อัลบัยฮะกีย์ สายรายงานหะซัน อัลบุคอรีย์ว่าศ่อฮีห์) และหะดีษซัยด์ บินคอลิด อัลญุฮะนีย์ (อะห์มัด สายรายงานดี)", "(3) หะดีษบุสเราะฮ์ย้ายจากสภาพเดิม (อัลบะรออะฮ์อัลอัศลียะฮ์) คือไม่ต้องอาบน้ำละหมาดเพราะจับอวัยวะเพศ และหลักฐานที่ย้ายจากสภาพเดิมต้องมาก่อน เพราะมีความรู้เพิ่ม (4) หะดีษบุสเราะฮ์รอบคอบกว่า และปลดภาระได้แน่นอนกว่า", "แนวทางที่สาม การประสาน (ญัมอ์): ผู้แต่งว่าเป็นแนวทางที่ดี เพราะใช้หลักฐานทั้งสอง ผู้ที่ประสานต่างกันเป็นสองทัศนะ ทัศนะแรก: การจับอวัยวะเพศส่งเสริมให้อาบน้ำละหมาดทุกกรณี โดยใช้หะดีษบุสเราะฮ์ และไม่วาญิบ โดยใช้หะดีษฏ็อลก์ อิบนุคุซัยมะฮ์ตั้งชื่อบทในเศาะฮีห์ของเขาว่า \"บทการส่งเสริมให้อาบน้ำละหมาดเพราะจับอวัยวะเพศ\" แล้วยกหะดีษบุสเราะฮ์ แล้วรายงานจากมาลิกว่า \"ฉันเห็นว่าอาบน้ำละหมาดเพราะจับอวัยวะเพศเป็นการส่งเสริม ไม่ใช่วาญิบ\" และรายงานว่าอิมามอะห์มัดถูกถาม เขาตอบว่า \"ฉันส่งเสริม แต่ไม่บังคับ\" แล้วอิบนุคุซัยมะฮ์เลือกว่าวาญิบ ตามทัศนะของอัชชาฟิอีย์ ทัศนะส่งเสริมนี้ อิบนุลมุนซิรและอิบนุตัยมียะฮ์เลือก", "ทัศนะที่สอง: ถ้าจับด้วยความใคร่ ต้องอาบน้ำละหมาด ตามหะดีษบุสเราะฮ์ ถ้าไม่มีความใคร่ ไม่ต้อง ตามหะดีษฏ็อลก์ สนับสนุนด้วยคำว่า \"มันเป็นเพียงชิ้นเนื้อส่วนหนึ่งของท่าน\" ในหะดีษฏ็อลก์ ซึ่งบ่งว่าหุก่มการจับอวัยวะเพศเหมือนการจับอวัยวะอื่นที่ไม่มีความใคร่ การจับที่ต่างจากอวัยวะอื่นของร่างกายจึงคือการจับด้วยความใคร่ ซึ่งต้องอาบน้ำละหมาด"]}], "tags_th": ["สิ่งที่ทำให้วุฎูอ์เสีย", "จับอวัยวะเพศ", "บุสเราะฮ์", "การยกเลิก", "การประสานหลักฐาน"]}, {"id": "v1-h074", "volume": 1, "bab": "nawaqid", "topic_ar": "بيان شيء من نواقض الوضوء", "topic_th": "อธิบายสิ่งที่ทำให้วุฎูอ์เสียบางประการ", "pages": [316, 320], "hadith": [{"no": 74, "matn_ar": "وَعَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا أَنَّ رَسُولَ اللهِ ﷺ قَالَ: «مَنْ أَصَابَهُ قَيْءٌ أَوْ رُعَافٌ، أَوْ قَلْسٌ، أَوْ مَذْيٌ فَلْيَنْصَرِفْ فَلْيَتَوَضَّأْ، ثُمَّ لِيَبْنِ عَلَى صَلَاتِهِ، وَهُوَ فِي ذَلِكَ لَا يَتَكَلَّمُ». أَخْرَجَهُ ابْنُ مَاجَهْ، وَضَعَّفَهُ أَحْمَدُ وَغَيْرُهُ.", "translation_th": "จากอาอิชะฮ์ (ร.ฎ.) ว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"ผู้ใดอาเจียน เลือดกำเดาไหล เรอเอาอาหารขึ้นมา หรือมีมะซีย์ออก ก็ให้ออกไปอาบน้ำละหมาด แล้วละหมาดต่อจากที่ค้างไว้ โดยระหว่างนั้นไม่พูด\" บันทึกโดยอิบนุมาญะฮ์ และอะห์มัดกับคนอื่นว่าอ่อน", "grade_th": "ฎออีฟ (อ่อน) ที่ถูกคือรายงานแบบมุรสัล"}], "key_rulings_th": ["หะดีษนี้อ่อน ใช้เป็นหลักฐานไม่ได้", "ผู้แต่งเห็นว่าทัศนะที่มีน้ำหนักคือ เลือดกำเดา อาเจียน และการเรอเอาอาหารขึ้นมา ไม่ทำให้วุฎูอ์เสีย (อัชชาฟิอีย์ มาลิก อิบนุตัยมียะฮ์ อัชเชากานีย์ อัสสะอ์ดีย์ อิบนุบาซ) ส่วนอบูหะนีฟะฮ์และอะห์มัดว่าเสีย", "การอาบน้ำละหมาดเพราะอาเจียนหรือเลือดกำเดาเป็นสิ่งดี เป็นความรอบคอบ แต่ไม่วาญิบ", "มะซีย์ทำให้วุฎูอ์เสียโดยอิจญ์มาอ์", "ที่ถูกต้องคือ ฮะดัษอย่างมะซีย์และลมทำให้ละหมาดเสีย ต้องเริ่มละหมาดใหม่ ไม่ใช่ทำต่อจากที่ค้าง"], "vocab": [{"ar": "قَيْء", "th": "อาเจียน คือการขย้อนสิ่งที่กินดื่มออกมา หรือสิ่งที่กระเพาะขับออกทางปาก"}, {"ar": "رُعَاف", "th": "อ่านสระอุ เลือดกำเดา คือเลือดออกจากจมูก"}, {"ar": "قَلْس", "th": "อ่านสระอะแล้วสุกูน คืออาหารหรือเครื่องดื่มที่ขึ้นมาถึงปากจากท้องขณะเรอ จะคายหรือกลืนกลับก็ตาม ถ้ามากจนเต็มปากก็เรียกว่าอาเจียน"}, {"ar": "لِيَبْنِ عَلَى صَلَاتِهِ", "th": "ให้นับส่วนที่ละหมาดไปแล้วก่อนอาบน้ำละหมาด และละหมาดส่วนที่เหลือต่อ"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อิบนุหะญัรยกหะดีษนี้เพื่อแสดงสิ่งที่ทำให้วุฎูอ์เสีย คืออาเจียน เลือดกำเดา การเรอเอาอาหารขึ้นมา และมะซีย์ อิบนุมาญะฮ์ตั้งชื่อบทในหมวดละหมาดว่า \"บทการละหมาดต่อจากที่ค้าง\" และอิบนุหะญัรจะกล่าวในบทเงื่อนไขของละหมาด และยกหะดีษนี้อีกครั้งที่นั่นตามบางฉบับ", "อิบนุมาญะฮ์บันทึกในหมวดละหมาด (1221) ผ่านอิสมาอีล บินอัยยาช จากอิบนุญุร็อยจญ์ จากอิบนุอบีมุลัยกะฮ์ จากอาอิชะฮ์ หะดีษนี้อิบนุมาญะฮ์บันทึกคนเดียวในหกเล่ม สายรายงานอ่อน อัลบูศีรีย์ว่าอ่อน ด้วยสองเหตุ", "(1) มาจากอิสมาอีล บินอัยยาช จากอิบนุญุร็อยจญ์ อิบนุญุร็อยจญ์เป็นชาวหิญาซ อิสมาอีลเป็นชาวชาม และรายงานของอิสมาอีลจากชาวหิญาซอ่อน และเขารายงานขัดกับผู้เชี่ยวชาญ อิบนุหะญัรว่า \"สัจจริงในรายงานจากคนในเมืองของเขา สับสนเมื่อรายงานจากคนอื่น\" (2) ศิษย์ผู้เชี่ยวชาญของอิบนุญุร็อยจญ์รายงานต่างจากอิสมาอีล คือรายงานจากอับดุลมะลิก บินญุร็อยจญ์ จากบิดา อับดุลอะซีซ บินญุร็อยจญ์ จากท่านนบี ﷺ แบบมุรสัล อิบนุอะดีย์ยกจากอิมามอะห์มัดว่าที่ถูกคือจากอิบนุญุร็อยจญ์ จากบิดา จากท่านนบี ﷺ แบบมุรสัล", "อบูหาติมกล่าวถึงการรายงานแบบต่อเนื่องว่า \"นี่ผิด พวกเขารายงานจากอิบนุญุร็อยจญ์ จากบิดา จากอิบนุอบีมุลัยกะฮ์ จากท่านนบี ﷺ แบบมุรสัล\" อัลบัยฮะกีย์ยกคำของอัชชาฟิอีย์ในหะดีษอิบนุญุร็อยจญ์จากบิดาว่า \"รายงานนี้ไม่ยืนยันจากท่านนบี ﷺ\" ที่ถูกจึงคือ การที่อิสมาอีลยกเป็นมัรฟูอ์เป็นชาซ และสำนวนที่ถูกต้องคือที่กลุ่มผู้รายงานรายงานจากอิบนุญุร็อยจญ์ จากบิดา จากอิบนุอบีมุลัยกะฮ์ จากท่านนบี ﷺ แบบมุรสัล"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"อาเจียน\" คือการขย้อนสิ่งที่กินดื่มออกมา หรือสิ่งที่กระเพาะขับออกทางปาก", "\"เลือดกำเดา\" (รุอาฟ) อ่านสระอุ คือเลือดออกจากจมูก บางท่านว่ารุอาฟคือตัวเลือด รากศัพท์แปลว่าการนำหน้าและมาก่อน เช่น \"ม้ารอฮิฟ\" คือม้าที่นำหน้า เพราะเลือดกำเดามาก่อนผู้ที่มีเลือดกำเดา", "\"การเรอเอาอาหารขึ้นมา\" (ก็อลส์) อ่านสระอะแล้วสุกูน คืออาหารหรือเครื่องดื่มออกจากท้องขึ้นมาถึงปาก ขณะเรอ จะคายออกหรือกลืนกลับ ถ้าเต็มปากหรือน้อยกว่า ถ้ามากก็เป็นอาเจียน และ \"ก็อลัส\" (สระอะทั้งสองตัว) คือชื่อของสิ่งที่ออกมาทางปาก", "\"แล้วละหมาดต่อจากที่ค้างไว้\" คือนับส่วนที่ละหมาดไปแล้วก่อนอาบน้ำละหมาด หนึ่งร็อกอะฮ์หรือมากกว่า แล้วละหมาดส่วนที่เหลือ \"โดยระหว่างนั้นไม่พูด\" คือในขณะที่ออกไปและอาบน้ำละหมาด"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "สิ่งที่ออกจากร่างกายนอกทวาร", "points_th": ["ทัศนะที่หนึ่ง: นะญิสที่ออกจากทางอื่นนอกจากทวารทั้งสอง เช่น อาเจียน การเรอเอาอาหารขึ้นมา และเลือดกำเดา ทำให้วุฎูอ์เสีย เป็นทัศนะของอบูหะนีฟะฮ์และอะห์มัด ตามรายละเอียดของพวกเขา เพราะเป็นนะญิสที่ออกมา และทุกนะญิสที่ออกจากร่างกายทำให้วุฎูอ์เสียตามทัศนะของพวกเขา", "พวกเขายังอ้างหะดีษมะอ์ดาน บินอบีฏ็อลหะฮ์ จากอบุดดัรดาอ์ ว่า \"ท่านรสูลุลลอฮ์ ﷺ อาเจียน แล้วละศีลอด แล้วอาบน้ำละหมาด\" ฉันพบเษาบานที่มัสยิดดิมัชก์ จึงเล่าให้ฟัง เขากล่าวว่า \"จริง ฉันเทน้ำให้ท่านอาบน้ำละหมาด\" (อัตติรมิซีย์ว่า \"สิ่งที่ถูกต้องที่สุดในบทนี้\" อะห์มัดถูกถามว่าหะดีษเษาบานยืนยันสำหรับท่านไหม เขาตอบว่า \"ใช่\") แต่การใช้หะดีษนี้เป็นหลักฐานจะสมบูรณ์ด้วยสองเงื่อนไข (1) อักษรฟาอ์ต้องบ่งเหตุ ซึ่งไม่ได้ชัด อาจบ่งแค่ลำดับ (2) คำว่า \"แล้วอาบน้ำละหมาด\" หลังคำว่า \"อาเจียน\" ต้องเป็นสำนวนที่ถูกต้อง ซึ่งยังต้องพิจารณา และถ้ายืนยันก็ไม่เป็นหลักฐาน (ดังจะกล่าว)", "ทัศนะที่สอง: นะญิสที่ออกจากทางอื่นนอกจากทวารทั้งสองไม่ทำให้วุฎูอ์เสีย ผู้ที่อาเจียนหรือมีเลือดกำเดา ความสะอาดยังคงอยู่ เป็นทัศนะของอัชชาฟิอีย์ มาลิก และอีกรายงานจากอิมามอะห์มัด อิบนุตัยมียะฮ์เลือก และอัชเชากานีย์ อัสสะอ์ดีย์ และอิบนุบาซเลือก หลักฐาน (1) หะดีษญาบิร เรื่องอับบาด บินบิชร์ ในสงครามซาตุรริกออ์ ที่ถูกยิงด้วยลูกศรขณะละหมาด เลือดออกมาก แต่ยังละหมาดต่อ (อบูดาวูด อะห์มัด อิบนุคุซัยมะฮ์ อิบนุหิบบาน สายรายงานอ่อน เพราะอะกีล บินญาบิรไม่เป็นที่รู้จัก อัลบุคอรีย์ยกไว้แบบไม่มีสายและไม่ยืนยัน) พวกเขาว่า เป็นไปไม่ได้ที่ท่านนบี ﷺ จะไม่รู้เหตุการณ์ใหญ่เช่นนี้ และไม่มีรายงานว่าท่านคัดค้านหรือบอกว่าละหมาดเสีย (2) ต้องคงสภาพเดิม จึงไม่ตัดสินว่าเสียจนกว่าศาสนายืนยัน และไม่สรุปว่าเลือดหรืออาเจียนทำให้เสีย นอกจากด้วยหลักฐานที่แข็งแรง และการเทียบใช้ไม่ได้ในเรื่องนี้ เพราะเหตุของการเสียไม่ใช่สิ่งที่เข้าใจได้ด้วยเหตุผล และต่างกันไป", "ผู้แต่งเห็นว่าทัศนะที่มีน้ำหนัก คือเลือดกำเดา อาเจียน และการเรอเอาอาหารขึ้นมาไม่ทำให้วุฎูอ์เสีย เพราะไม่มีหลักฐานชัดเจนบ่งเช่นนั้น จึงคงอยู่ตามหลักเดิม คือไม่เสีย นอกจากด้วยหลักฐานศาสนา และเพราะความสะอาดยืนยันด้วยหลักฐานศาสนา สิ่งที่ยืนยันด้วยหลักฐานศาสนาจะยกเลิกได้ด้วยหลักฐานศาสนาเท่านั้น", "ส่วนหลักฐานของผู้ที่ว่าเสีย หะดีษในบทนี้อ่อน ใช้เป็นหลักฐานไม่ได้ ส่วนหะดีษอบุดดัรดาอ์ไม่ได้บ่งว่าต้องอาบน้ำละหมาดเพราะอาเจียน เพราะท่านนบี ﷺ เคยอาบน้ำละหมาดทุกละหมาด ทั้งที่สะอาดหรือไม่สะอาด และนี่เป็นการกระทำ ซึ่งไม่ได้บ่งว่าวาญิบ แต่บ่งว่าศาสนาให้ทำตาม ผู้ที่อาบน้ำละหมาดเพื่อความรอบคอบก็เป็นสิ่งดี แต่ความเป็นวาญิบไม่มีหลักฐานชัดเจน อิบนุตัยมียะฮ์กล่าวว่า \"ถ้าอาบน้ำละหมาดเพราะเลือดกำเดาก็ดีกว่า แต่ไม่วาญิบตามทัศนะที่ชัดกว่าในสองทัศนะ\" และ \"การส่งเสริมให้อาบน้ำละหมาดเพราะอาเจียนมีเหตุผลชัด และการกระทำบ่งเพียงการส่งเสริม\"", "ส่วนการที่มะซีย์ทำให้วุฎูอ์เสีย ได้กล่าวไปแล้วว่าทำให้เสียโดยอิจญ์มาอ์ ส่วนเลือดอื่นนอกจากเลือดกำเดา ซึ่งออกจากส่วนใดของร่างกายนอกจากทวารทั้งสอง จะกล่าวในหะดีษอนัสที่ว่าท่านนบี ﷺ กรอกเลือด (ฮิญามะฮ์) โดยไม่อาบน้ำละหมาด"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "ละหมาดต่อจากที่ค้างหรือเริ่มใหม่", "points_th": ["หะดีษนี้บ่งว่าผู้ที่อาเจียน เลือดกำเดาไหล เรอเอาอาหารขึ้นมา หรือมีมะซีย์ ขณะละหมาด ให้ออกไปอาบน้ำละหมาด แล้วละหมาดต่อจากที่ค้างไว้ โดยมีเงื่อนไขว่าไม่พูด ตามคำว่า \"โดยระหว่างนั้นไม่พูด\"", "แต่หะดีษนี้อ่อนดังที่กล่าวมา และที่ถูกคือฮะดัษ เช่น มะซีย์ ลม และสิ่งที่คล้ายกัน ทำให้ละหมาดเสีย (จะกล่าวในบทเงื่อนไขของละหมาด) จากหะดีษอะลี บินฏ็อลก์ ว่าท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"เมื่อผู้ใดในพวกท่านผายลมขณะละหมาด ให้ออกไปอาบน้ำละหมาด และละหมาดใหม่\" (นักบันทึกทั้งห้ายกเว้นอิบนุมาญะฮ์ อิบนุหิบบานว่าศ่อฮีห์ แต่เป็นหะดีษอ่อน ดังจะอธิบาย)"]}], "tags_th": ["สิ่งที่ทำให้วุฎูอ์เสีย", "อาเจียน", "เลือดกำเดา", "มะซีย์", "หะดีษอ่อน"]}, {"id": "v1-h075", "volume": 1, "bab": "nawaqid", "topic_ar": "حكم لحم الإبل والغنم من حيث النقض وعدمه", "topic_th": "เนื้ออูฐและเนื้อแพะ ทำให้วุฎูอ์เสียหรือไม่", "pages": [321, 325], "hadith": [{"no": 75, "matn_ar": "عَنْ جَابِرِ بْنِ سَمُرَةَ رَضِيَ اللهُ عَنْهُ أَنَّ رَجُلًا سَأَلَ النَّبِيَّ ﷺ: أَتَوَضَّأُ مِنْ لُحُومِ الْغَنَمِ؟ قَالَ: «إِنْ شِئْتَ». قَالَ: أَتَوَضَّأُ مِنْ لُحُومِ الْإِبِلِ؟ قَالَ: «نَعَمْ». أَخْرَجَهُ مُسْلِمٌ.", "translation_th": "จากญาบิร บินสะมุเราะฮ์ (ร.ฎ.) ว่า ชายคนหนึ่งถามท่านนบี ﷺ ว่า ฉันต้องอาบน้ำละหมาดเพราะกินเนื้อแพะหรือไม่ ท่านตอบว่า \"ถ้าท่านต้องการ\" เขาถามว่า ฉันต้องอาบน้ำละหมาดเพราะกินเนื้ออูฐหรือไม่ ท่านตอบว่า \"ใช่\" บันทึกโดยมุสลิม", "grade_th": "ศ่อฮีห์ (มุสลิม)"}], "key_rulings_th": ["การกินเนื้ออูฐทำให้วุฎูอ์เสีย ต้องอาบน้ำละหมาดใหม่ ผู้แต่งเห็นว่ามีน้ำหนัก (มัซฮับอะห์มัด อิสหาก อิบนุลมุนซิร อิบนุคุซัยมะฮ์ อันนะวะวีย์ว่าหลักฐานแข็งแรงกว่า)", "นักวิชาการส่วนใหญ่ รวมถึงอิมามทั้งสาม ว่าไม่ทำให้เสีย โดยอ้างหะดีษญาบิรว่าท่านนบี ﷺ เลิกอาบน้ำละหมาดเพราะสิ่งที่ผ่านไฟ ผู้แต่งตอบว่าหะดีษนั้นกว้าง ส่วนหะดีษนี้เจาะจง", "การกินเนื้อแพะไม่ทำให้วุฎูอ์เสีย การอาบน้ำละหมาดเพราะมันเป็นเพียงการอนุญาต", "ไม่ต่างกันว่าเนื้ออูฐน้อยหรือมาก ดิบหรือสุก ส่วนเครื่องใน ผู้แต่งเห็นว่ารอบคอบกว่าที่จะถือว่าทำให้เสียด้วย", "นักวิชาการต่างกันว่าหุก่มนี้มีเหตุผลที่เข้าใจได้หรือเป็นตะอับบุด อัลลอฮ์ทรงรู้ดียิ่งถึงวิทยปัญญาของศาสนา"], "vocab": [{"ar": "إِنْ شِئْتَ", "th": "ถ้าท่านต้องการ (อาบน้ำละหมาด) คือไม่บังคับ"}, {"ar": "مَبَارِك الْإِبِل", "th": "ที่พักของอูฐ"}, {"ar": "الْهَبْر", "th": "ชิ้นเนื้อล้วนที่ไม่มีกระดูก"}, {"ar": "ذِرْوَة", "th": "โหนกของอูฐ"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อบูอับดิลลาฮ์ หรืออบูคอลิด ญาบิร บินสะมุเราะฮ์ บินญุนาดะฮ์ อัลอามิรีย์ อัสสุวาอีย์ ตามชื่อของสุวาอ์หนึ่งในบรรพบุรุษ เขาและบิดาเป็นเศาะหาบะฮ์ ย้ายไปอยู่กูฟะฮ์ และเสียชีวิตที่นั่นปี ฮ.ศ. 66 บ้างว่า 74"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["มุสลิมบันทึกในหมวดประจำเดือน บทการอาบน้ำละหมาดเพราะเนื้ออูฐ (360) ผ่านอบูอะวานะฮ์ จากอุษมาน บินอับดิลลาฮ์ บินเมาฮับ จากญะอ์ฟัร บินอบีเษาร์ จากญาบิร บินสะมุเราะฮ์ ว่า ชายคนหนึ่งถามท่านนบี ﷺ ว่า ฉันต้องอาบน้ำละหมาดเพราะเนื้อแพะไหม ท่านตอบว่า \"ถ้าต้องการก็อาบ ถ้าไม่ต้องการก็ไม่ต้องอาบ\" เขาถามว่า เพราะเนื้ออูฐไหม ท่านตอบว่า \"ใช่ จงอาบน้ำละหมาดเพราะเนื้ออูฐ\" เขาถามว่า ฉันละหมาดในคอกแพะได้ไหม ท่านตอบว่า \"ได้\" เขาถามว่า ละหมาดในที่พักของอูฐได้ไหม ท่านตอบว่า \"ไม่ได้\"", "อิบนุคุซัยมะฮ์กล่าวว่า \"เราไม่เห็นว่านักหะดีษขัดแย้งกันว่ารายงานนี้ถูกต้องด้านการถ่ายทอด อัชอัษ บินอบิชชะอ์ษาอ์ และสิมาก บินหัรบ์ ก็รายงานจากญะอ์ฟัร บินอบีเษาร์ ทั้งสามคนเป็นผู้รายงานชั้นนำ\" มุสลิมบันทึกทั้งสองสายนี้ด้วย ดูเหมือนอิบนุคุซัยมะฮ์ต้องการตอบผู้ที่ชี้ข้อบกพร่องว่าญะอ์ฟัร บินอบีเษาร์ผู้รายงานจากญาบิร บินสะมุเราะฮ์ไม่เป็นที่รู้จัก ซึ่งพาดพิงถึงอะลี บินอัลมะดีนีย์ แต่ไม่ถูกต้อง เพราะญะอ์ฟัรเป็นที่รู้จัก รายงานจากปู่ของเขาคือญาบิร บินสะมุเราะฮ์ และมุสลิมบันทึกหะดีษของเขาในเศาะฮีห์"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "เนื้อแพะไม่ทำให้วุฎูอ์เสีย", "points_th": ["หะดีษเป็นหลักฐานว่าการอาบน้ำละหมาดเพราะเนื้อแพะไม่วาญิบ เป็นเพียงการอนุญาต ตามคำว่า \"ถ้าท่านต้องการ\" เพราะไม่ทำให้วุฎูอ์เสีย การอาบน้ำละหมาดเพราะมันจึงเป็นการอาบซ้ำ ใช้เป็นหลักฐานว่าทำได้"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "เนื้ออูฐทำให้วุฎูอ์เสีย", "points_th": ["หะดีษเป็นหลักฐานว่าวาญิบต้องอาบน้ำละหมาดเพราะเนื้ออูฐ ตามคำว่า \"ใช่\" เพราะทำให้วุฎูอ์เสีย เป็นมัซฮับของอิมามอะห์มัด และเป็นหนึ่งในทัศนะเฉพาะของมัซฮับ อิสหาก บินรอฮะวัยฮ์ อิบนุลมุนซิร และอิบนุคุซัยมะฮ์ก็เห็นเช่นนี้ อัลบัยฮะกีย์เลือก มีรายงานจากเศาะหาบะฮ์กลุ่มหนึ่ง อิบนุลก็อยยิมเห็นว่ามีน้ำหนัก และอันนะวะวีย์ว่ามีน้ำหนัก โดยกล่าวว่า \"มัซฮับนี้หลักฐานแข็งแรงกว่า แม้นักวิชาการส่วนใหญ่จะเห็นต่าง\"", "นักวิชาการส่วนใหญ่ รวมถึงอิมามทั้งสาม ว่าเนื้ออูฐไม่ทำให้วุฎูอ์เสีย โดยอ้างหะดีษญาบิร บินอับดิลลาฮ์: \"สิ่งสุดท้ายในสองเรื่องจากท่านรสูลุลลอฮ์ ﷺ คือการเลิกอาบน้ำละหมาดเพราะสิ่งที่ไฟเปลี่ยนแปลง\" และอีกสำนวน \"เพราะสิ่งที่ผ่านไฟ\" (อบูดาวูด อัตติรมิซีย์ อันนะสาอีย์ อิบนุมาญะฮ์ อะห์มัด หะดีษศ่อฮีห์ และสนับสนุนด้วยรายงานของอัลบุคอรีย์ว่าญาบิรถูกถามเรื่องการอาบน้ำละหมาดเพราะสิ่งที่ผ่านไฟ เขาตอบว่า \"ไม่\") พวกเขาว่า คำว่า \"สิ่งที่ผ่านไฟ\" มีความหมายกว้าง รวมเนื้ออูฐ เพราะเป็นส่วนหนึ่งของสิ่งที่ผ่านไฟ เนื่องจากไม่ได้กินดิบ แต่กินสุก เมื่อการอาบน้ำละหมาดเพราะสิ่งที่ผ่านไฟถูกยกเลิก การอาบน้ำละหมาดเพราะกินเนื้ออูฐก็ถูกยกเลิกด้วย", "ผู้แต่งเห็นว่าทัศนะแรกมีน้ำหนักในประเด็นนี้ เพราะหะดีษในบทนี้เป็นตัวบทเจาะจงในเรื่องนี้ สนับสนุนด้วยหะดีษอัลบะรออ์ บินอาซิบ: ท่านรสูลุลลอฮ์ ﷺ ถูกถามเรื่องการอาบน้ำละหมาดเพราะเนื้ออูฐ ท่านตอบว่า \"จงอาบน้ำละหมาดเพราะมัน\" และถูกถามเรื่องเนื้อแพะ ท่านตอบว่า \"อย่าอาบน้ำละหมาดเพราะมัน\" (อบูดาวูด อัตติรมิซีย์ อิบนุมาญะฮ์ ศ่อฮีห์ อะห์มัดและอิสหากว่าศ่อฮีห์)", "ส่วนหะดีษญาบิร บินอับดิลลาฮ์ ตอบได้สามทาง (1) เป็นหะดีษที่สับสน ตามที่อบูหาติมกล่าว และอิบนุหะญัรยกจากอัชชาฟิอีย์ว่าอีกข้อบกพร่องคือ อิบนุลมุงกะดิรไม่ได้ฟังหะดีษนี้จากญาบิร แต่ฟังจากอับดุลลอฮ์ บินมุหัมมัด บินอะกีล ซึ่งสัจจริงแต่หะดีษของเขามีความอ่อน (2) สมมุติว่าศ่อฮีห์ ก็ไม่เป็นหลักฐาน เพราะการอาบน้ำละหมาดเพราะเนื้ออูฐไม่ได้เป็นเพราะผ่านไฟ แต่มีเหตุผลเฉพาะของมัน ซึ่งครอบคลุมทั้งดิบและสุก (3) สิ่งที่ญาบิรกล่าวเป็นการเล่าการกระทำ ไม่ใช่คำพูด เพราะพวกเขาเห็นท่านกินเนื้อแพะแล้วละหมาดโดยไม่อาบน้ำละหมาด (อิบนุตัยมียะฮ์)", "หะดีษญาบิรไม่ขัดกับหะดีษในบทนี้จนจะกล่าวว่ายกเลิก เพราะหะดีษญาบิรมีความหมายกว้าง และหะดีษในบทนี้เจาะจง จึงให้สิ่งเจาะจงมาก่อนสิ่งที่กว้าง และยกเว้นกรณีที่มีหลักฐานเจาะจงออกจากความหมายกว้าง ดังนั้นไม่ต้องอาบน้ำละหมาดเพราะสิ่งที่ผ่านไฟ นอกจากเนื้ออูฐ"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "เนื้อล้วนหรือทุกส่วนของอูฐ", "points_th": ["ไม่ต่างกันว่าเนื้ออูฐน้อยหรือมาก ดิบหรือสุก เพราะล้วนเรียกว่าเนื้อ", "นักวิชาการต่างกันว่าการเสียของวุฎูอ์เฉพาะเนื้อ หรือรวมทุกส่วนของอูฐ ทั้งเนื้อล้วน (ฮับร์ คือชิ้นเนื้อ) กระเพาะ ตับ ไต ลำไส้ และอื่น ๆ ทัศนะที่หนึ่ง: ครอบคลุมทุกส่วนของอูฐ เป็นทัศนะหนึ่งในมัซฮับหันบะลีย์ อิบนุสะอ์ดีย์เลือก หลักฐาน (1) คำว่าเนื้อในศาสนาครอบคลุมทุกส่วนของสัตว์ เช่นอายะฮ์ \"ได้ถูกห้ามแก่พวกเจ้า ซากสัตว์ เลือด และเนื้อสุกร\" (อัลมาอิดะฮ์: 3) เนื้อสุกรครอบคลุมทุกสิ่งในหนัง รวมทั้งหนัง การที่บางส่วนมีชื่อเฉพาะไม่ได้บ่งว่าหลุดจากหุก่มของเนื้อ (2) ความหมายกว้างสนับสนุน เพราะเนื้อล้วนและส่วนอื่นเลี้ยงด้วยเลือดเดียวกัน อาหารเดียวกัน ท่านนบี ﷺ ไม่ได้แยกให้ผู้ถาม ทั้งที่รู้ว่าผู้คนกินทั้งสองอย่าง ถ้าเนื้อต่างกัน ท่านคงอธิบาย (3) ในศาสนาไม่มีสัตว์ที่หุก่มแบ่งตามส่วน ให้บางส่วนอนุมัติบางส่วนหะรอม สัตว์หะรอมทั้งตัว เช่นสุกร หรืออนุมัติทั้งตัว เช่นปศุสัตว์", "ทัศนะที่สอง: ทำให้เสียเฉพาะเนื้อ เป็นทัศนะในมัซฮับหันบะลีย์ อัซซัรกะชีย์ว่า \"เป็นทัศนะที่คนส่วนใหญ่เลือก\" มุหัมมัด บินอิบรอฮีมเลือก หลักฐานคือตัวบทมาในเรื่องเนื้อ ส่วนอื่นไม่อยู่ในตัวบท พวกเขาว่า ใช้อายะฮ์ \"และเนื้อสุกร\" เป็นหลักฐานไม่ได้ เพราะเนื้อสุกรหะรอมเพราะเป็นนะญิสและสกปรก และทุกส่วนของสุกรเป็นนะญิส ไม่มีส่วนใดสะอาด ต่างจากเนื้ออูฐ ซึ่งไม่มีส่วนใดเป็นนะญิส", "ผู้แต่งเห็นว่ารอบคอบกว่าคือทัศนะแรก ด้วยเหตุผลที่กล่าวมา"]}, {"wajh": 6, "type": "fawaid", "heading_ar": null, "heading_th": "วิทยปัญญาของหุก่ม", "points_th": ["นักวิชาการต่างกันว่าการอาบน้ำละหมาดเพราะเนื้ออูฐมีเหตุผลที่เข้าใจได้หรือไม่ ที่ถูกต้องในมัซฮับหันบะลีย์คือไม่มีเหตุผลที่เข้าใจได้ แต่เป็นการปฏิบัติตามคำสั่ง (ตะอับบุด)", "บางท่านว่ามีเหตุผล ตามที่ท่านนบี ﷺ ชี้ว่าอูฐมาจากชัยฏอน ดังหะดีษอบูลาส อัลคุซาอีย์: ท่านรสูลุลลอฮ์ ﷺ ให้เราขี่อูฐซะกาตไปหัจญ์ ฉันกล่าวว่า โอ้ท่านรสูลุลลอฮ์ เราไม่เห็นว่าอูฐเหล่านี้จะพาเราไปได้ ท่านกล่าวว่า \"ไม่มีอูฐตัวใด นอกจากบนโหนกของมันมีชัยฏอน จงกล่าวพระนามของอัลลอฮ์เมื่อขี่มันตามที่พระองค์ทรงสั่ง แล้วใช้มันรับใช้ตัวพวกท่าน เพราะอัลลอฮ์คือผู้ทรงแบกรับ\" (อะห์มัด สายรายงานหะซัน) พวกเขาว่า การกินมันทำให้เกิดสภาพแบบชัยฏอน และชัยฏอนมาจากไฟ ซึ่งน้ำดับมันได้", "อัลลอฮ์ทรงรู้ดียิ่งถึงความลับของศาสนาของพระองค์ หน้าที่ของเราคือศรัทธาและปฏิบัติ และอัลลอฮ์ทรงนำผู้ที่พระองค์ทรงประสงค์สู่ทางที่เที่ยงตรง"]}], "tags_th": ["สิ่งที่ทำให้วุฎูอ์เสีย", "เนื้ออูฐ", "เนื้อแพะ", "การยกเลิก", "ตะอับบุด"]}, {"id": "v1-h076", "volume": 1, "bab": "nawaqid", "topic_ar": "حكم الغسل من غسل الميت والوضوء من حمله", "topic_th": "หุก่มการอาบน้ำหลังอาบน้ำศพ และการอาบน้ำละหมาดหลังแบกศพ", "pages": [326, 330], "hadith": [{"no": 76, "matn_ar": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «مَنْ غَسَّلَ مَيِّتًا فَلْيَغْتَسِلْ، وَمَنْ حَمَلَهُ فَلْيَتَوَضَّأْ». أَخْرَجَهُ أَحْمَدُ، وَالنَّسَائِيُّ، وَالتِّرْمِذِيُّ وَحَسَّنَهُ. وَقَالَ أَحْمَدُ: لَا يَصِحُّ فِي هَذَا الْبَابِ شَيْءٌ.", "translation_th": "จากอบูฮุร็อยเราะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"ผู้ใดอาบน้ำศพ ก็จงอาบน้ำ และผู้ใดแบกศพ ก็จงอาบน้ำละหมาด\" บันทึกโดยอะห์มัด อันนะสาอีย์ และอัตติรมิซีย์ซึ่งว่าหะซัน อะห์มัดกล่าวว่า ไม่มีหะดีษใดในบทนี้ที่ถูกต้อง", "grade_th": "มีข้อขัดแย้ง อัลบุคอรีย์ อบูหาติม และอัลบัยฮะกีย์ว่าเป็นคำของอบูฮุร็อยเราะฮ์ (เมากูฟ) อัตติรมิซีย์ อิบนุหิบบาน และอิบนุหะญัรว่ามัรฟูอ์ถูกต้อง"}], "key_rulings_th": ["นักวิชาการส่วนใหญ่ รวมถึงมาลิก อะห์มัด และอัชชาฟิอีย์ ว่าการอาบน้ำหลังอาบน้ำศพเป็นสุนัต ไม่ใช่วาญิบ เพราะหะดีษไม่แข็งแรงพอจะบ่งวาญิบ", "หลักเกณฑ์ของอิบนุมุฟลิห์: หะดีษอ่อนที่มีรูปคำบ่งวาญิบหรือหะรอม ให้ตีความว่าเป็นสุนัตหรือมักรูฮ์เพื่อความรอบคอบ", "การอาบน้ำละหมาดหลังอาบน้ำศพไม่วาญิบ ตามทัศนะที่ชัดกว่า", "การอาบน้ำละหมาดเพราะแบกศพไม่วาญิบ และอิบนุบาซว่าไม่ส่งเสริมด้วย เพราะไม่มีหลักฐาน ถ้าอาบก็นับเป็นการอาบซ้ำ"], "vocab": [{"ar": "مَنْ غَسَّلَ مَيِّتًا", "th": "ผู้ที่อาบน้ำศพ"}, {"ar": "مَنْ حَمَلَهُ", "th": "ผู้ที่แบกศพ"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อะห์มัด อัตติรมิซีย์ในหมวดศพ บทการอาบน้ำหลังอาบน้ำศพ (993) และอิบนุหิบบาน บันทึกผ่านสุฮัยล์ บินอบีศอลิห์ จากบิดา จากอบูฮุร็อยเราะฮ์ แบบมัรฟูอ์ ผู้รายงานเชื่อถือได้ เป็นผู้รายงานของอัลบุคอรีย์และมุสลิม ยกเว้นสุฮัยล์ซึ่งเป็นผู้รายงานของมุสลิม อัตติรมิซีย์ว่า \"หะดีษหะซัน\"", "อบูดาวูด (3162) บันทึกสองสาย สายหนึ่งตามที่กล่าว แต่มีอิสหาก ทาสที่ได้รับการปลดปล่อยของซาอิดะฮ์ อยู่ระหว่างอบูศอลิห์กับอบูฮุร็อยเราะฮ์ อบูดาวูดกล่าวถึงเรื่องนี้ ซึ่งเหมือนชี้ว่าหะดีษอ่อน อิบนุมาญะฮ์ (1463) บันทึกสายนี้เฉพาะส่วนแรก ในฉบับพิมพ์เขียนว่า \"สะฮ์ล์ บินอบีศอลิห์\" ซึ่งผิด", "ส่วนการพาดพิงถึงอันนะสาอีย์ ดูเหมือนอิบนุหะญัรพลาด เพราะไม่พบในสุนันอันนะสาอีย์ และอัลมิซซีย์ไม่ได้พาดพิงถึงเขาในตุห์ฟะตุลอัชรอฟ", "มีข้อขัดแย้งเรื่องหะดีษนี้ บางท่านว่ารายงานแบบเมากูฟ (คำของอบูฮุร็อยเราะฮ์) ถูกต้อง เช่น อัลบุคอรีย์ตามที่อัตติรมิซีย์ยก และอบูหาติมที่กล่าวถึงการยกเป็นมัรฟูอ์ว่า \"นี่ผิด เป็นแค่เมากูฟจากอบูฮุร็อยเราะฮ์ ผู้เชื่อถือได้ไม่ยกเป็นมัรฟูอ์\" อัลบัยฮะกีย์ก็เลือกเมากูฟ บางท่านว่ามัรฟูอ์ถูกต้อง เช่น อัตติรมิซีย์ อิบนุหิบบาน อัซซะฮะบีย์ และอิบนุหะญัร ซึ่งเป็นรูปการเรียบเรียงของท่านในบุลูฆ เพราะท่านไม่ได้ชี้ข้อบกพร่องว่าเป็นเมากูฟ", "อัตติรมิซีย์ยกจากอัลบุคอรีย์ว่าอะห์มัด บินหันบัลและอะลี บินอัลมะดีนีย์กล่าวว่า \"ไม่มีหะดีษใดในบทนี้ที่ถูกต้อง\" มุหัมมัด บินยะห์ยา อัซซุฮ์ลีย์ อาจารย์ของอัลบุคอรีย์ ก็กล่าวว่า \"ฉันไม่รู้หะดีษใดที่ยืนยันในเรื่องนี้\" อัลบัยฮะกีย์ยกสายส่วนใหญ่ของหะดีษนี้ และอิบนุลก็อยยิมยกสิบเอ็ดสายในตะฮ์ซีบมุคตะศ็อรอัสสุนัน แล้วกล่าวว่า \"สายเหล่านี้บ่งว่าหะดีษถูกต้อง (มะห์ฟูซ)\" อัซซะฮะบีย์ก็เห็นเช่นนี้ก่อนเขา โดยกล่าวว่าสายของหะดีษนี้แข็งแรงกว่าหะดีษหลายบทที่นักนิติศาสตร์ใช้เป็นหลักฐานโดยไม่ชี้ข้อบกพร่องว่าเป็นเมากูฟ แต่เลือกมัรฟูอ์ ผู้แต่งชี้ว่า คำของอิมามรุ่นใหญ่ดังที่กล่าวมาต้องมาก่อนคำของผู้ที่ด้อยกว่า", "อันนะวะวีย์คัดค้านที่อัตติรมิซีย์ว่าหะดีษนี้หะซัน อิบนุหะญัรกล่าวว่าการคัดค้านนี้มีข้อโต้แย้ง เพราะหะดีษที่มีสายมาก อย่างน้อยที่สุดก็เป็นหะซัน"]}, {"wajh": 2, "type": "fiqh", "heading_ar": null, "heading_th": "อาบน้ำหลังอาบน้ำศพ", "points_th": ["หะดีษบ่งว่าผู้ที่อาบน้ำศพต้องอาบน้ำ และความหมายกว้างของคำบ่งว่ารวมศพทุกคน ทั้งผู้ใหญ่ เด็ก ชาย และหญิง นักวิชาการบางท่านเห็นเช่นนี้ อิบนุลก็อยยิมยกจากอะลีและอบูฮุร็อยเราะฮ์ และว่ามีรายงานจากอิบนุลมุสัยยิบ อิบนุสีรีน และอัซซุฮ์รีย์", "นักวิชาการส่วนใหญ่ รวมถึงมาลิก อะห์มัด และอัชชาฟิอีย์ ว่าการอาบน้ำหลังอาบน้ำศพเป็นสุนัต ไม่ใช่วาญิบ เพราะหะดีษไม่แข็งแรงพอจะบ่งว่าวาญิบ ตามคำของนักวิชาการที่กล่าวมา อิบนุมุฟลิห์ อัลหันบะลีย์ระบุหลักเกณฑ์ที่ดีว่า \"หะดีษที่มีความอ่อน ถ้ารูปคำบ่งวาญิบหรือหะรอม ให้ตีความว่าเป็นการส่งเสริมในคำสั่ง และเป็นมักรูฮ์ในข้อห้าม เพื่อความรอบคอบ และไม่ผูกมัดมุสลิมด้วยหุก่มวาญิบหรือหะรอม\"", "สิ่งที่สนับสนุนว่าการอาบน้ำเป็นสุนัตไม่ใช่วาญิบ คือรายงานของอัดดารุกุฏนีย์และอัลค็อฏีบ ผ่านอับดุลลอฮ์ บุตรอิมามอะห์มัด ว่าบิดาของเขากล่าวว่า ท่านเขียนหะดีษอุบัยดุลลอฮ์ จากนาฟิอ์ จากอิบนุอุมัร \"เราเคยอาบน้ำศพ บางคนในหมู่เราอาบน้ำ บางคนไม่อาบ\" ไหม เขาตอบว่า ไม่ บิดากล่าวว่า ในอีกฝั่งนั้นมีชายหนุ่มชื่อมุหัมมัด บินอับดุลลอฮ์ อัลมุคัรริมีย์ เล่าจากอบูฮิชาม จากวุฮัยบ์ จงไปเขียนจากเขา อิบนุหะญัรว่า \"สายรายงานศ่อฮีห์ และเป็นสิ่งที่ดีที่สุดในการประสานหะดีษที่ขัดกัน\" อัชเชากานีย์กล่าวว่า \"นี่ไม่น้อยกว่าที่จะเปลี่ยนคำสั่งจากความหมายจริงคือวาญิบ ไปสู่ความหมายอนุโลมคือการส่งเสริม ทัศนะนั้นจึงเป็นความจริง เพราะประสานหลักฐานได้อย่างดี\"", "การอาบน้ำละหมาดหลังอาบน้ำศพไม่วาญิบ ตามทัศนะที่ชัดกว่าในสองทัศนะ เพราะความเป็นวาญิบต้องมีหลักฐาน", "นักวิชาการต่างกันในวิทยปัญญาของคำสั่งให้อาบน้ำแก่ผู้อาบน้ำศพ (1) การอาบน้ำศพอาจทำให้ผู้อาบรู้สึกหดหู่ อ่อนแรง เพราะเห็นศพและนึกถึงสิ่งหลังความตาย จึงส่งเสริมให้อาบน้ำ เหมือนที่ศาสนาให้อาบน้ำหลังการร่วมประเวณี เพราะความอ่อนเพลีย ประจำเดือนและเลือดหลังคลอดก็เช่นกัน (2) ผู้อาบไม่แน่ใจว่าน้ำที่กระเซ็นจากการอาบศพจะไม่โดนร่างกาย และร่างของศพอาจมีนะญิส เมื่อโดนร่างกายแต่ไม่รู้ว่าตรงไหน จึงส่งเสริมให้อาบทั้งตัว (อัลค็อฏฏอบีย์)"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "อาบน้ำละหมาดหลังแบกศพ", "points_th": ["ตามรูปคำ หะดีษบ่งว่าต้องอาบน้ำละหมาดเพราะแบกศพ แต่หะดีษมีความอ่อนดังที่กล่าวมา จึงไม่พอจะบ่งว่าวาญิบ และในบทนี้ไม่มีรายงานใดเหมือนที่มีเรื่องการอาบน้ำหลังอาบน้ำศพ", "อัลค็อฏฏอบีย์กล่าวว่า \"ฉันไม่รู้ว่ามีนักนิติศาสตร์คนใดบังคับให้อาบน้ำเพราะอาบน้ำศพ หรืออาบน้ำละหมาดเพราะแบกศพ คำสั่งในเรื่องนี้น่าจะเป็นการส่งเสริม และอาจหมายความว่าผู้อาบน้ำศพแทบไม่พ้นที่น้ำกระเซ็นจะโดน... และบางท่านว่า คำว่า 'จงอาบน้ำละหมาด' หมายถึง ให้มีวุฎูอ์อยู่ เพื่อพร้อมละหมาดศพ\" ผู้แต่งชี้ว่าคำว่า \"ฉันไม่รู้ว่ามีใครบังคับให้อาบน้ำเพราะอาบน้ำศพ\" ต้องพิจารณา เพราะได้กล่าวไปแล้วว่ามีผู้ที่ว่าวาญิบ", "อัศศ็อนอานีย์กล่าวว่า \"ฉันไม่รู้ว่ามีใครว่าต้องอาบน้ำละหมาดเพราะแบกศพ หรือส่งเสริม แต่เมื่อหะดีษแข็งแรงพอ ก็ไม่มีข้ออ้างที่จะไม่ปฏิบัติ\" แล้วตีความวุฎูอ์ว่าคือการล้างมือ ผู้แต่งเห็นว่าข้อนี้มีข้อพิจารณา เพราะการตีความคำว่าวุฎูอ์ในคำพูดของศาสนาว่าล้างมือไม่ถูก ที่ต้องทำคือตีความถ้อยคำของศาสนาตามความหมายทางศาสนา ไม่ใช่ความหมายทางภาษา", "อิบนุบาซสนับสนุนทัศนะว่าไม่ส่งเสริมให้อาบน้ำละหมาดเพราะแบกศพ เพราะต้องมีหลักฐาน ถ้าอาบน้ำละหมาด ก็นับเป็นการอาบซ้ำ"]}], "tags_th": ["อาบน้ำศพ", "แบกศพ", "การอาบน้ำ", "สุนัต", "หะดีษอ่อน"]}, {"id": "v1-h077", "volume": 1, "bab": "nawaqid", "topic_ar": "اشتراط الطهارة لمس القرآن", "topic_th": "เงื่อนไขว่าต้องมีความสะอาดจึงจะจับอัลกุรอานได้", "pages": [331, 339], "hadith": [{"no": 77, "matn_ar": "عَنْ عَبْدِ اللهِ بْنِ أَبِي بَكْرٍ رَحِمَهُ اللهُ أَنَّ فِي الْكِتَابِ الَّذِي كَتَبَهُ رَسُولُ اللهِ ﷺ لِعَمْرِو بْنِ حَزْمٍ: «أَلَّا يَمَسَّ الْقُرْآنَ إِلَّا طَاهِرٌ». رَوَاهُ مَالِكٌ مُرْسَلًا، وَوَصَلَهُ النَّسَائِيُّ، وَابْنُ حِبَّانَ، وَهُوَ مَعْلُولٌ.", "translation_th": "จากอับดุลลอฮ์ บินอบีบักร์ (ขออัลลอฮ์เมตตาเขา) ว่า ในหนังสือที่ท่านรสูลุลลอฮ์ ﷺ เขียนถึงอัมร์ บินหัซม์ มีว่า \"ไม่ให้ผู้ใดจับอัลกุรอาน นอกจากผู้ที่สะอาด\" รายงานโดยมาลิกแบบมุรสัล และอันนะสาอีย์กับอิบนุหิบบานรายงานแบบต่อเนื่อง และหะดีษนี้มีข้อบกพร่อง (มะอ์ลูล)", "grade_th": "มีข้อบกพร่อง (มะอ์ลูล) ด้านสายรายงาน แต่หนังสือของอัมร์ บินหัซม์เป็นที่รู้จักและยอมรับในหมู่นักวิชาการ และมีหลักฐานสนับสนุน"}], "key_rulings_th": ["หะรอมจับอัลกุรอาน (มุศหัฟ) นอกจากผู้มีความสะอาด ตามทัศนะของนักวิชาการส่วนใหญ่ รวมถึงอิมามทั้งสี่ ไม่มีใครเห็นต่างนอกจากดาวูด อัซซอฮิรีย์", "ผู้แต่งเห็นว่า \"ผู้ที่สะอาด\" ในหะดีษหมายถึงผู้มีวุฎูอ์ เพราะเป็นความหมายที่ศาสนาใช้บ่อย และเศาะหาบะฮ์เข้าใจและฟัตวาเช่นนั้น", "ผู้แต่งเห็นว่าอายะฮ์ \"ไม่มีผู้ใดสัมผัสมันได้ นอกจากผู้ที่ถูกชำระ\" (อัลวากิอะฮ์: 79) ไม่ใช่หลักฐานโดยตรง เพราะหมายถึงคัมภีร์ในมือมลาอิกะฮ์ แต่ใช้เป็นการชี้นัยได้ ตามอิบนุตัยมียะฮ์", "ห้ามจับทั้งส่วนที่เป็นตัวอักษร ขอบกระดาษ และปก ตามทัศนะที่ถูกต้อง"], "vocab": [{"ar": "عَمْرُو بْنُ حَزْمٍ", "th": "อัมร์ บินหัซม์ อัลอันศอรีย์ ท่านนบี ﷺ แต่งตั้งเป็นผู้ปกครองนัจญ์รอน ปี ฮ.ศ. 10 และเขียนหนังสือยาวเรื่องซุนนะฮ์ ซะกาต มรดก และค่าสินไหมให้เขา"}, {"ar": "يَمَسّ", "th": "จับ คือแตะด้วยมือโดยไม่มีสิ่งกั้น"}, {"ar": "طَاهِر", "th": "ผู้ที่สะอาด คำนี้มีหลายความหมาย: สะอาดจากชิริก สะอาดจากนะญิส หรือสะอาดจากฮะดัษ ผู้แต่งเห็นว่าในที่นี้คือผู้มีวุฎูอ์"}, {"ar": "مَعْلُول", "th": "หะดีษที่มีข้อบกพร่องซ่อนอยู่ที่กระทบความถูกต้อง แม้ภายนอกดูปลอดภัย เช่น การรายงานมุรสัลที่ซ่อนอยู่"}, {"ar": "مُرْسَل", "th": "หะดีษที่ตาบิอีนรายงานจากท่านนบี ﷺ โดยตรง"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["อับดุลลอฮ์ บินอบีบักร์ บินมุหัมมัด บินอัมร์ บินหัซม์ อัลอันศอรีย์ อัลมะดะนีย์ ผู้พิพากษา ตาบิอีน เชื่อถือได้ ผู้ทำอิบาดะฮ์ นักบันทึกทั้งหมดบันทึกหะดีษของเขา เขารายงานจากบิดา อบูบักร์ บินมุหัมมัด และคนอื่น อัซซุฮ์รีย์ มาลิก และฮิชาม บินอุรวะฮ์รายงานจากเขา เสียชีวิตปี ฮ.ศ. 135 บ้างว่า 130", "อัลมัฆริบีย์ ผู้แต่งอัลบัดรุตตะมาม ผิดพลาดที่เขียนชีวประวัติของอับดุลลอฮ์ บินอบีบักร์ อัศศิดดีกแทน และอัศศ็อนอานีย์ตามเขา ผู้แต่งว่าเป็นความผิดพลาดที่ชัดเจน เพราะอับดุลลอฮ์ บินอบีบักร์ อัศศิดดีกไม่ใช่ผู้รายงานหะดีษนี้ เขาเป็นเศาะหาบะฮ์ เสียชีวิตในสมัยการเป็นเคาะลีฟะฮ์ของบิดา ที่ถูกคือคนแรก เพราะในอัลมุวัฏเฏาะอ์ว่า \"ยะห์ยาเล่าจากมาลิก จากอับดุลลอฮ์ บินอบีบักร์ บินหัซม์ ว่าในหนังสือ...\""]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["มาลิกบันทึกในอัลมุวัฏเฏาะอ์แบบมุรสัล (ตาบิอีนรายงานจากท่านนบี ﷺ โดยตรง) เฉพาะประโยคนี้ อันนะสาอีย์บันทึกแบบย่อและต่อเนื่อง ผ่านอัลหะกัม บินมูซา จากยะห์ยา บินหัมซะฮ์ จากสุลัยมาน บินดาวูด จากอัซซุฮ์รีย์ จากอบูบักร์ บินมุหัมมัด บินอัมร์ บินหัซม์ จากบิดา จากปู่ แต่ไม่มีประโยคนี้ อิบนุหิบบานบันทึกแบบยาวและมีประโยคนี้", "ภายนอกสายรายงานนี้ดูปลอดภัยจากข้อบกพร่อง ผู้รายงานทั้งหมดเชื่อถือได้ ผู้ที่ยึดตามภายนอกจึงว่าหะดีษศ่อฮีห์ เช่น อิบนุหิบบาน อัลหากิม และอิบนุอะดีย์ และสายนี้แข็งแรงขึ้นด้วยรายงานมุรสัลของมาลิกและมะอ์มัร จากอับดุลลอฮ์ บินอบีบักร์ และยังมีสายที่สามผ่านอัลหะกัม บินมูซา จากอิสมาอีล บินอัยยาช จากยะห์ยา บินสะอีด ซึ่งอ่อน", "แต่หะดีษมีข้อบกพร่อง ตามที่อิบนุหะญัรกล่าว นักวิชาการระบุข้อบกพร่องที่ซ่อนอยู่และร้ายแรง คืออัลหะกัม บินมูซาผิดพลาด และกล่าวว่าสุลัยมาน บินดาวูด ทั้งที่ที่ถูกคือสุลัยมาน บินอัรก็อม ซึ่งหะดีษของเขาถูกทิ้ง หลายอิมามระบุเรื่องนี้ ส่วนสุลัยมาน บินดาวูดคืออัลเคาลานีย์ อิบนุหิบบานว่าเชื่อถือได้และไว้ใจได้ จึงใส่หะดีษไว้ในเศาะฮีห์ อัลบัยฮะกีย์ยกว่าอบูซุรอะฮ์ อบูหาติม อัดดาริมีย์ และผู้เชี่ยวชาญกลุ่มหนึ่งยกย่องสุลัยมาน บินดาวูด อัลเคาลานีย์ และเห็นว่าหะดีษเรื่องซะกาตนี้ต่อเนื่องและหะซัน แต่ทั้งหมดตั้งอยู่บนสมมติฐานว่าอัลหะกัม บินมูซาจำหะดีษได้แม่น มิฉะนั้นก็ถูกต้องเพียงแบบมุรสัล", "ศอลิห์ ญะซะเราะฮ์กล่าวว่า ดุหัยม์เล่าว่า ฉันดูต้นฉบับหนังสือของยะห์ยาเรื่องหะดีษอัมร์ บินหัซม์ในเรื่องซะกาต ก็พบว่ามาจากสุลัยมาน บินอัรก็อม อบูดาวูดกล่าวว่า \"นี่เป็นความผิดพลาดของอัลหะกัม มุหัมมัด บินบักการรายงานจากยะห์ยา บินหัมซะฮ์ จากสุลัยมาน บินอัรก็อม จากอัซซุฮ์รีย์\" อิบนุอบีหาติมถามบิดา บิดาตอบว่า มีคนว่าสุลัยมาน บินอัรก็อม... ฉันไม่รู้ว่าเป็นคนไหน และไม่คิดว่าเป็นชาวดิมัชก์คนนี้ อบูซุรอะฮ์ อัดดิมัชกีย์ว่า \"ที่ถูกคือสุลัยมาน บินอัรก็อม\" อิบนุมันดะฮ์ว่า \"ฉันเห็นในหนังสือของยะห์ยา บินหัมซะฮ์ด้วยลายมือเขา จากสุลัยมาน บินอัรก็อม จากอัซซุฮ์รีย์ ซึ่งถูกต้อง\" อันนะสาอีย์ยกสายของสุลัยมาน บินอัรก็อมต่อจากสายของสุลัยมาน บินดาวูด และกล่าวว่า \"นี่ใกล้ความถูกต้องกว่า และสุลัยมาน บินอัรก็อม หะดีษของเขาถูกทิ้ง\"", "นักวิชาการยกย่องหนังสือของอัมร์ บินหัซม์ อิบนุมะอีนกล่าวว่า \"หะดีษอัมร์ บินหัซม์ว่าท่านนบี ﷺ เขียนหนังสือถึงพวกเขา\" มีคนถามว่าหนังสือนี้มีสายต่อเนื่องไหม เขาตอบว่า \"ไม่ แต่พอใช้ได้\" อิบนุอับดิลบัรร์ว่า \"เป็นหนังสือที่มีชื่อเสียงในหมู่นักประวัติศาสตร์ เนื้อหาเป็นที่รู้จักในหมู่นักวิชาการ จนไม่ต้องพึ่งสายรายงาน เพราะคล้ายมุตะวาติรในการมาถึง เนื่องจากผู้คนรับและรู้จัก\" และว่า \"หนังสือของอัมร์ บินหัซม์เป็นที่รู้จักในหมู่นักวิชาการ และเนื้อหาส่วนใหญ่เห็นพ้องกัน\" อิบนุตัยมียะฮ์กล่าวว่า \"หนังสือนี้มีชื่อเสียงแพร่หลายในหมู่นักวิชาการ และสำหรับหลายท่าน แข็งแรงกว่ารายงานคนเดียวที่ต่อเนื่อง และถูกต้องโดยอิจญ์มาอ์\""]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"อัมร์ บินหัซม์\" คืออัมร์ บินหัซม์ บินซัยด์ อัลค็อซเราะญีย์ อัลอันศอรีย์ ร่วมสงครามคันดักและหลังจากนั้น ท่านรสูลุลลอฮ์ ﷺ แต่งตั้งเป็นผู้ปกครองชาวนัจญ์รอน เพื่อสอนศาสนา สอนอัลกุรอาน และเก็บซะกาต ในปี ฮ.ศ. 10 และเขียนหนังสือให้เขาเรื่องซุนนะฮ์ ซะกาต มรดก และค่าสินไหม เป็นหนังสือยาว อัลหากิมและอัลบัยฮะกีย์บันทึกฉบับเต็ม เขารายงานจากท่านนบี ﷺ แต่รายงานไม่มาก", "\"ไม่ให้จับ\" การจับคือการแตะด้วยมือโดยไม่มีสิ่งกั้น \"อัลกุรอาน\" หมายถึงตัวอักษรที่เขียน ไม่รวมส่วนสีขาวด้านข้าง หรือหมายถึงมุศหัฟ ซึ่งรวมทั้งตัวอักษรและขอบ เรียกเช่นนั้นเพราะเขียนไว้ในแผ่น ที่กล่าวถึงความหมายแรก เพราะสมัยของหะดีษนี้ยังไม่มีมุศหัฟ", "\"นอกจากผู้ที่สะอาด\" คำนี้มีหลายความหมายในภาษาอาหรับ (1) ความสะอาดทางนามธรรม คือสะอาดจากชิริก ความหมายคือ ไม่ให้ผู้ใดจับอัลกุรอานนอกจากผู้ศรัทธา ส่วนผู้ปฏิเสธศรัทธาไม่สะอาด อัลลอฮ์ตรัสว่า \"แท้จริงพวกมุชริกนั้นโสโครก\" (อัตเตาบะฮ์: 28) (2) ความสะอาดทางรูปธรรม คือสะอาดจากสิ่งสกปรกและนะญิส เช่นคำว่า \"มันไม่ใช่นะญิส\" ในหะดีษแมว คือมันสะอาด (3) ความสะอาดจากฮะดัษเล็กหรือใหญ่ คือวุฎูอ์หรือการอาบน้ำ เช่น \"และหากพวกเจ้ามีญะนาบะฮ์ ก็จงชำระ\" และ \"อัลลอฮ์ไม่ทรงรับละหมาดที่ไม่มีความสะอาด\"", "การที่คำหนึ่งมีหลายความหมายขัดกับหลักเดิม เพราะหลักเดิมคือคำหนึ่งบ่งความหมายเดียว ไม่คลุมเครือ แต่เมื่อมีหลายความหมาย ผู้วินิจฉัยต้องหาสิ่งบ่งชี้ที่จะเลือกความหมายหนึ่ง สิ่งบ่งชี้อาจอยู่ในถ้อยคำ เช่น \"เราได้ทำให้แผ่นดินพุ่งน้ำออกมาเป็นตาน้ำ\" หรืออาจมาจากความกว้างของศาสนา การคำนึงถึงวิทยปัญญาของบทบัญญัติ และเจตนารมณ์ของศาสนา", "ผู้แต่งเห็นว่าที่ชัดกว่าคือ ไม่มีอะไรห้ามที่จะตีความคำนี้ว่าผู้มีวุฎูอ์ เพราะ (1) ภาษาของศาสนาใช้คำนี้กับผู้มีวุฎูอ์บ่อย (2) เศาะหาบะฮ์เข้าใจเช่นนั้น และฟัตวาว่าไม่ให้จับอัลกุรอานนอกจากมีความสะอาด (3) ไม่เคยพบในภาษาของท่านรสูลุลลอฮ์ ﷺ ที่เรียกผู้ศรัทธาว่าผู้ที่สะอาด เพราะการเรียกว่าผู้ศรัทธามีน้ำหนักกว่า (4) บางรายงานมีว่า \"ไม่ให้จับอัลกุรอาน นอกจากในสภาพสะอาด\" (อับดุรร็อซซาก) และในหะดีษหะกีม บินหิซาม \"อย่าจับอัลกุรอาน นอกจากท่านสะอาด\" ซึ่งสายรายงานอ่อน แต่ช่วยสนับสนุนความหมายนี้", "\"และหะดีษนี้มีข้อบกพร่อง\" หะดีษมะอ์ลูลคือหะดีษที่มีข้อบกพร่องซ่อนอยู่ที่กระทบความถูกต้อง แม้ภายนอกดูปลอดภัย เช่น การเป็นมุรสัลที่ซ่อนอยู่ อิบนุศศ็อลาห์และนักวิชาการบางท่านวิจารณ์คำนี้ว่าไม่ถูกตามไวยากรณ์และภาษา และที่ถูกคือ \"มุอัลลัล\" แต่ที่ถูกต้องคือใช้ได้ เพราะมาจากกริยาสามอักษร อัลเญาฮะรีย์และคนอื่นกล่าวว่า \"สิ่งนั้นเป็นข้อบกพร่อง จึงเป็นมะอ์ลูล\" อัสสะคอวีย์ระบุว่าคำนี้มีในคำพูดของอัลบุคอรีย์ อัตติรมิซีย์ และอิมามหะดีษหลายคนทั้งยุคเก่าและใหม่ และนักอุศูลในบทกิยาส ซึ่งใช้คำว่า \"อัลอิลละฮ์และอัลมะอ์ลูล\" จึงใช้ได้ เพราะมีในถ้อยคำของผู้เชี่ยวชาญด้านนี้ และยืนยันทางภาษาด้วย"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "หะรอมจับมุศหัฟโดยไม่มีความสะอาด", "points_th": ["หะดีษเป็นหลักฐานว่าหะรอมจับมุศหัฟนอกจากมีความสะอาด เป็นทัศนะของนักวิชาการส่วนใหญ่จากเศาะหาบะฮ์และตาบิอีน รวมถึงอิมามทั้งสี่ ในอัลมุฆนีย์ว่า \"เราไม่รู้ว่ามีผู้เห็นต่างนอกจากดาวูด\" เพราะคำว่า \"ไม่ให้ผู้ใดจับอัลกุรอาน นอกจากผู้ที่สะอาด\" และมีหะดีษอื่นในบทนี้ที่เสริมกัน", "เช่น รายงานของสุลัยมาน บินมูซา ว่าได้ยินสาลิมเล่าจากบิดาว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"ไม่ให้ผู้ใดจับอัลกุรอาน นอกจากผู้ที่สะอาด\" (อัฏเฏาะบะรอนีย์ อัลบัยฮะกีย์ อิบนุหะญัรว่าสายรายงานไม่เป็นไร และอัลอะษร็อมระบุว่าอะห์มัดใช้เป็นหลักฐาน แต่ชี้ข้อบกพร่องที่ไม่ทำให้อ่อน)", "และรายงานของอับดุรเราะห์มาน บินยะซีด ว่า เราอยู่กับสัลมาน เขาออกไปทำธุระแล้วกลับมา ฉันกล่าวว่า โอ้อบูอับดิลลาฮ์ ถ้าท่านอาบน้ำละหมาด เราอาจถามท่านเรื่องอายะฮ์ เขากล่าวว่า \"ฉันไม่ได้จับมัน เพราะไม่มีใครจับมันได้นอกจากผู้ที่ถูกชำระ\" แล้วอ่านให้เราฟังตามที่เราต้องการ (อัดดารุกุฏนีย์ อัลบัยฮะกีย์ อัลหากิมว่าศ่อฮีห์ตามเงื่อนไขของอัลบุคอรีย์และมุสลิม อัดดารุกุฏนีย์ว่าศ่อฮีห์)", "และจากอิสมาอีล บินมุหัมมัด บินสะอ์ด์ บินอบีวักกอศ จากมุศอับ บินสะอ์ด์ ว่า \"ฉันถือมุศหัฟให้สะอ์ด์ บินอบีวักกอศ แล้วฉันเกา สะอ์ด์กล่าวว่า เธออาจจับอวัยวะเพศใช่ไหม ฉันตอบว่า ใช่ เขากล่าวว่า ลุกไปอาบน้ำละหมาด ฉันจึงลุกไปอาบน้ำละหมาดแล้วกลับมา\" (มาลิก อัลบัยฮะกีย์ อิบนุอบีดาวูด สายรายงานศ่อฮีห์) อิบนุตัยมียะฮ์ระบุว่าการห้ามผู้มีฮะดัษจับมุศหัฟยืนยันจากเศาะหาบะฮ์ และว่า \"เป็นคำของสัลมาน อัลฟาริสีย์ อับดุลลอฮ์ บินอุมัร และคนอื่น และไม่มีเศาะหาบะฮ์คนใดเห็นต่างจากทั้งสอง\""]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "อายะฮ์ \"ไม่มีผู้ใดสัมผัสมัน นอกจากผู้ที่ถูกชำระ\"", "points_th": ["หลักฐานหนึ่งของการห้ามผู้มีฮะดัษจับมุศหัฟ คืออายะฮ์ \"แท้จริงมันคืออัลกุรอานอันทรงเกียรติ ในคัมภีร์ที่ถูกรักษาไว้ ไม่มีผู้ใดสัมผัสมันได้ นอกจากผู้ที่ถูกชำระ เป็นการประทานลงมาจากพระผู้อภิบาลแห่งสากลโลก\" (อัลวากิอะฮ์: 77–80) พวกเขาว่า ในอายะฮ์มีสิ่งบ่งชี้ คือคำว่า \"เป็นการประทานลงมาจากพระผู้อภิบาลแห่งสากลโลก\" และสิ่งที่ประทานลงมาคืออัลกุรอาน ส่วน \"ถูกรักษาไว้\" คือรักษาจากการเปลี่ยนแปลงและบิดเบือน อิบนุกุดามะฮ์ อันนะวะวีย์ และอิบนุลก็อยยิมยกหลักฐานนี้", "ผู้แต่งเห็นว่าการใช้อายะฮ์นี้เป็นหลักฐานไม่สมบูรณ์ เพราะคัมภีร์ในอายะฮ์น่าจะหมายถึงคัมภีร์ที่อยู่ในมือมลาอิกะฮ์ อัชเชากานีย์กล่าวหลังยกหลักฐานนี้ว่า \"จะสมบูรณ์ได้ก็ต่อเมื่อให้สรรพนามย้อนไปหาอัลกุรอาน แต่ที่ชัดคือย้อนไปหาคัมภีร์ คือแผ่นจารึกที่ถูกรักษา (อัลเลาห์อัลมะห์ฟูซ) เพราะใกล้กว่า และผู้ที่ถูกชำระคือมลาอิกะฮ์\"", "อบูบักร์ อัลญัศศอศกล่าวว่า \"ถ้าตีความคำนี้ตามความหมายบอกเล่าจริง ๆ ที่ดีกว่าคือหมายถึงอัลกุรอานที่อยู่กับอัลลอฮ์ และผู้ที่ถูกชำระคือมลาอิกะฮ์ ถ้าตีความเป็นข้อห้าม แม้อยู่ในรูปบอกเล่า ก็ครอบคลุมเราด้วย และนี่ดีกว่า เพราะมีรายงานแพร่หลายจากท่านนบี ﷺ ว่าท่านเขียนในหนังสือถึงอัมร์ บินหัซม์ว่า ไม่ให้ผู้ใดจับอัลกุรอาน นอกจากผู้ที่สะอาด จึงต้องให้ข้อห้ามของท่านมาจากอายะฮ์ เพราะอายะฮ์รองรับความหมายนี้\"", "อิบนุลก็อยยิมเห็นว่าหมายถึงคัมภีร์ที่อยู่ในมือมลาอิกะฮ์ ด้วยสิบเหตุผล หนึ่งในนั้นคือ อัลลอฮ์ตรัสว่า \"นอกจากผู้ที่ถูกชำระ\" (อัลมุฏ็อฮฮะรูน) ไม่ได้ตรัสว่า \"นอกจากผู้ที่ชำระตน\" (อัลมุตะเฏาะฮ์ฮิรูน) ถ้าต้องการห้ามผู้มีฮะดัษจับ คงตรัสว่า \"นอกจากผู้ที่ชำระตน\" เช่นอายะฮ์ \"แท้จริงอัลลอฮ์ทรงรักบรรดาผู้กลับเนื้อกลับตัว และทรงรักบรรดาผู้ชำระตน\" และในหะดีษ \"โอ้อัลลอฮ์ โปรดให้ฉันอยู่ในหมู่ผู้กลับเนื้อกลับตัว และในหมู่ผู้ชำระตน\" ผู้ชำระตนคือผู้ที่ชำระตัวเอง ผู้ถูกชำระคือผู้ที่ผู้อื่นชำระให้ ผู้อาบน้ำละหมาดจึงเป็นผู้ชำระตน ส่วนมลาอิกะฮ์เป็นผู้ถูกชำระ", "อิมามมาลิกกล่าวว่า \"สิ่งที่ดีที่สุดที่ฉันได้ยินเกี่ยวกับอายะฮ์นี้ คือมันเหมือนอายะฮ์ในซูเราะฮ์อะบะสะ ว่า 'มิใช่เช่นนั้น แท้จริงมันคือคำตักเตือน ผู้ใดประสงค์ก็จงรำลึกถึงมัน ในแผ่นคัมภีร์ที่ได้รับเกียรติ ถูกยกย่อง ถูกชำระ ในมือของบรรดาผู้จดบันทึก ผู้ทรงเกียรติ ผู้ทรงคุณธรรม' (อะบะสะ: 11–16)\"", "อิบนุตัยมียะฮ์ยืนยันว่าการใช้อายะฮ์นี้เป็นหลักฐานว่าผู้มีฮะดัษไม่ควรจับมุศหัฟ เป็นการชี้นัยและการบ่งชี้ คือเมื่อแผ่นคัมภีร์ในฟ้ามีแต่ผู้ที่ถูกชำระที่จับได้ แผ่นอัลกุรอานในมือเราก็ไม่ควรให้ผู้ใดจับนอกจากผู้ที่สะอาด อิบนุลก็อยยิมยกเรื่องนี้ไว้ และอิบนุสะอ์ดีย์ยกความหมายนี้ไว้ในตัฟซีรของเขา"]}, {"wajh": 6, "type": "fiqh", "heading_ar": null, "heading_th": "ห้ามจับทั้งตัวอักษรและปก", "points_th": ["ทัศนะที่ถูกต้องจากสองทัศนะของนักวิชาการ คือหะรอมจับมุศหัฟ ไม่ว่าจะจับตัวอักษรเขียน ขอบ หรือปก อันนะวะวีย์ว่า \"นี่คือมัซฮับที่เลือก\" เพราะหุก่มยืนยันในส่วนที่ติดตามมา แม้จะไม่ยืนยันในตัวมันเอง"]}], "tags_th": ["สิ่งที่ทำให้วุฎูอ์เสีย", "จับอัลกุรอาน", "มุศหัฟ", "ความสะอาด", "หะดีษมะอ์ลูล"]}, {"id": "v1-h078", "volume": 1, "bab": "nawaqid", "topic_ar": "الذكر لا يشترط له الوضوء", "topic_th": "การรำลึกถึงอัลลอฮ์ (ซิกิร) ไม่ต้องมีวุฎูอ์", "pages": [340, 343], "hadith": [{"no": 78, "matn_ar": "عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: كَانَ رَسُولُ اللهِ ﷺ يَذْكُرُ اللهَ عَلَى كُلِّ أَحْيَانِهِ. رَوَاهُ مُسْلِمٌ، وَعَلَّقَهُ الْبُخَارِيُّ.", "translation_th": "จากอาอิชะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ รำลึกถึงอัลลอฮ์ในทุกเวลาของท่าน รายงานโดยมุสลิม และอัลบุคอรีย์ยกไว้แบบไม่มีสายรายงาน (ตะอ์ลีก)", "grade_th": "ศ่อฮีห์ (มุสลิม)"}], "key_rulings_th": ["การรำลึกถึงอัลลอฮ์ไม่ต้องมีความสะอาด ทำได้ทุกสภาพ ทั้งมีวุฎูอ์ มีฮะดัษ หรือมีญะนาบะฮ์ เช่น ตัสบีห์ ตะห์มีด ตะห์ลีล ตักบีร", "ยกเว้น (1) การอ่านอัลกุรอานขณะมีญะนาบะฮ์ (2) การซิกิรด้วยลิ้นขณะปัสสาวะ ถ่ายอุจจาระ หรือร่วมประเวณี ซึ่งเป็นมักรูฮ์", "การซิกิรด้วยใจไม่มีข้อยกเว้น", "การซิกิรขณะมีความสะอาดประเสริฐกว่า และผู้ที่ถูกให้สลามขณะถ่ายทุกข์ไม่ควรตอบจนกว่าจะเสร็จ"], "vocab": [{"ar": "يَذْكُرُ اللهَ", "th": "รำลึกถึงอัลลอฮ์ ด้วยตัสบีห์ ตะห์มีด ตะห์ลีล ตักบีร การขออภัยโทษ และการอ่านอัลกุรอาน ซิกิรกว้างกว่า ครอบคลุมทั้งอัลกุรอานและอื่น ๆ"}, {"ar": "عَلَى كُلِّ أَحْيَانِهِ", "th": "ในทุกเวลาของท่าน (อะลา ในความหมายของ ฟี) เป็นคำกว้างที่หมายถึงส่วนใหญ่"}, {"ar": "الْمُعَلَّق", "th": "ตะอ์ลีก คือหะดีษที่ตัดผู้รายงานหนึ่งคนหรือมากกว่าออกจากต้นสาย แม้ถึงปลายสาย"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["มุสลิมบันทึกในหมวดประจำเดือน บทการรำลึกถึงอัลลอฮ์ในสภาพญะนาบะฮ์และอื่น ๆ (373) ผ่านคอลิด บินสะละมะฮ์ จากอัลบะฮีย์ (อับดุลลอฮ์ บินบัชชาร) จากอุรวะฮ์ จากอาอิชะฮ์ แบบต่อเนื่อง", "อัลบุคอรีย์ยกไว้แบบไม่มีสายสองแห่ง ในหมวดประจำเดือน บทหญิงมีประจำเดือนทำพิธีหัจญ์ได้ทุกอย่างยกเว้นเฏาะวาฟ และในหมวดอะซาน บทผู้อะซานหันหน้าไปทางนั้นทางนี้หรือไม่", "ตะอ์ลีกคือการตัดผู้รายงานหนึ่งคนหรือมากกว่าออกจากต้นสาย แม้ถึงปลายสาย ตามที่อิบนุหะญัรนิยาม การตะอ์ลีกมีหลายเหตุ ในเศาะฮีห์อัลบุคอรีย์มีตะอ์ลีกมาก ต่างจากมุสลิมที่มีน้อยมาก (อิบนุศศ็อลาห์) หุก่มคือ ถ้าเป็นรูปยืนยัน เช่น \"ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า...\" หรือ \"คนนั้นกล่าว... รายงาน... หรือกล่าวถึง\" ก็ใช้เป็นหลักฐานได้ เพราะอัลบุคอรีย์ตัดสินว่าถูกต้องจนถึงผู้ที่ยกมา และไม่อนุญาตตนเองให้ยกมาแบบยืนยัน นอกจากเมื่อถูกต้องสำหรับเขา ส่วนที่ไม่ใช่รูปยืนยัน เช่น \"มีรายงานจากท่านรสูลุลลอฮ์ ﷺ\" ไม่ได้ตัดสินว่าถูกต้อง แต่การยกไว้ในเศาะฮีห์บ่งว่ามีที่มา จึงใช้ประกอบและพึ่งได้", "หะดีษนี้เป็นตะอ์ลีกที่ไม่พบแบบต่อเนื่องในที่อื่นของอัลบุคอรีย์ อิบนุหะญัรระบุในบทนำ (ฮัดยุสสารีย์) ว่า อัลบุคอรีย์ยกหะดีษนี้แบบตะอ์ลีก เพราะไม่ถึงเงื่อนไขของเขา แม้จะศ่อฮีห์ตามเงื่อนไขของคนอื่น ซึ่งเป็นหนึ่งในเหตุผลของการตะอ์ลีกของอัลบุคอรีย์"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ท่านรสูลุลลอฮ์ ﷺ รำลึกถึงอัลลอฮ์\" รูปกริยาปัจจุบันหลังคำว่า \"กานะ\" บ่งการทำบ่อยและต่อเนื่อง เว้นแต่มีสิ่งบ่งชี้เป็นอื่น", "\"รำลึกถึงอัลลอฮ์\" หมายถึงทุกสิ่งที่ใช้รำลึกถึงอัลลอฮ์ ทั้งตัสบีห์ ตะห์มีด ตะห์ลีล ตักบีร การขออภัยโทษ และการอ่านอัลกุรอาน ซิกิรกว้างกว่า ครอบคลุมทั้งอัลกุรอานและอื่น ๆ แต่ตามธรรมเนียมจะแยกซิกิรกับการอ่านอัลกุรอาน", "\"ในทุกเวลาของท่าน\" คำว่า \"อะลา\" ใช้ในความหมายของ \"ฟี\" (ใน) ตามทัศนะว่าคำบุพบทใช้แทนกันได้ ซึ่งเป็นประเด็นขัดแย้งในตำราไวยากรณ์ คือในทุกเวลาของท่าน เช่นอายะฮ์ \"และเขาเข้าเมืองในเวลาที่ชาวเมืองเผลอ\" (อัลเกาะศ็อศ: 15) และอายะฮ์ \"และพวกเขาตามสิ่งที่พวกชัยฏอนอ่านในสมัยการปกครองของสุลัยมาน\" (อัลบะเกาะเราะฮ์: 102) ตามทัศนะหนึ่ง \"อะห์ยาน\" พหูพจน์ของ \"หีน\" คือเวลาไม่ว่าน้อยหรือมาก นี่เป็นคำกว้างที่หมายถึงส่วนใหญ่ คือ ในเวลาส่วนใหญ่ของท่าน (ดังจะกล่าว)"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "ซิกิรไม่ต้องมีความสะอาด", "points_th": ["หะดีษเป็นหลักฐานว่าการรำลึกถึงอัลลอฮ์ไม่มีเงื่อนไขว่าต้องมีความสะอาด แต่ทำได้ในทุกสภาพ เพราะความกว้างของคำว่า \"เวลา\" ครอบคลุมทุกสภาพ ไม่ว่าจะสะอาด มีฮะดัษ หรือมีญะนาบะฮ์ ด้วยตัสบีห์ ตะห์มีด ตะห์ลีล ตักบีร การอ่านอัลกุรอาน และซิกิรอื่น ๆ", "นี่คือจุดประสงค์ที่อิบนุหะญัรยกหะดีษนี้ในบทนี้ คือแสดงว่าสิ่งที่ทำให้วุฎูอ์เสียไม่ห้ามการรำลึกถึงอัลลอฮ์ เพราะฮะดัษเล็กเป็นหนึ่งในเวลาที่กล่าวถึง", "อิบนุอับบาสเล่าว่า ท่านนบี ﷺ เมื่อตื่นกลางคืน ท่านอ่านสิบอายะฮ์สุดท้ายของซูเราะฮ์อาลิอิมรอน ก่อนจะอาบน้ำละหมาด อัลบุคอรีย์ตั้งชื่อบทว่า \"บทการอ่านอัลกุรอานหลังมีฮะดัษและอื่น ๆ\""]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "ข้อยกเว้น", "points_th": ["หะดีษนี้ไม่ได้ใช้ตามความกว้างทั้งหมด แต่มีข้อยกเว้น (1) การอ่านอัลกุรอานในสภาพญะนาบะฮ์ ตามหะดีษอะลี: \"ท่านรสูลุลลอฮ์ ﷺ เคยสอนเราอ่านอัลกุรอาน ตราบที่ท่านไม่มีญะนาบะฮ์\" (จะกล่าวต่อไป) อิบนุเราะญับกล่าวว่า \"หะดีษ (อาอิชะฮ์) บ่งว่าฮะดัษและญะนาบะฮ์ไม่ห้ามการรำลึกถึงอัลลอฮ์ แต่ไม่ได้บ่งว่าผู้มีญะนาบะฮ์อ่านอัลกุรอานได้ เพราะซิกิรเมื่อกล่าวโดยไม่มีเงื่อนไข ไม่ได้หมายถึงอัลกุรอาน\" (จะกล่าวในบทการอาบน้ำ)", "(2) การซิกิรขณะปัสสาวะ ถ่ายอุจจาระ หรือร่วมประเวณี แม้จะเป็นหนึ่งในเวลาที่กล่าวถึง เพราะการซิกิรด้วยลิ้นในสภาพเหล่านี้เป็นมักรูฮ์ ตามที่อันนะวะวีย์และคนอื่นระบุ ดังนั้นคำว่า \"ในทุกเวลาของท่าน\" จึงหมายถึงเวลาส่วนใหญ่ เช่น สภาพสะอาด มีฮะดัษ ยืน นั่ง และอื่น ๆ", "ทั้งนี้ถ้าตีความซิกิรในหะดีษว่าซิกิรด้วยลิ้น แต่ถ้าตีความว่าซิกิรด้วยใจ ก็คงความกว้างไว้ ไม่มีข้อยกเว้น เพราะท่านนบี ﷺ ใคร่ครวญอยู่เสมอ ไม่ว่างจากการซิกิรด้วยใจ ทั้งตอนตื่นและตอนหลับ"]}, {"wajh": 5, "type": "fiqh", "heading_ar": null, "heading_th": "ซิกิรขณะมีความสะอาดประเสริฐกว่า", "points_th": ["มีรายงานจากอัลมุฮาจิร บินกุนฟุซ ว่าเขามาหาท่านนบี ﷺ ขณะท่านปัสสาวะ แล้วให้สลาม ท่านไม่ตอบจนกว่าจะอาบน้ำละหมาด แล้วขออภัยเขา และกล่าวว่า \"ฉันไม่ชอบที่จะรำลึกถึงอัลลอฮ์ นอกจากในสภาพสะอาด\" (อบูดาวูด อันนะสาอีย์ อิบนุมาญะฮ์ หะดีษศ่อฮีห์ มีหลายสายและหลักฐานสนับสนุน)", "หะดีษนี้บ่งว่าการรำลึกถึงอัลลอฮ์ขณะถ่ายทุกข์เป็นมักรูฮ์ และผู้ที่ถูกให้สลามขณะถ่ายทุกข์ไม่ควรตอบ แต่ให้รอจนเสร็จ ถ้าจะตอบ ก็ดีกว่าที่จะรอจนชำระตัวแล้ว", "และจากอิบนุอุมัร: ชายคนหนึ่งเดินผ่านขณะท่านรสูลุลลอฮ์ ﷺ ปัสสาวะ เขาให้สลาม ท่านไม่ตอบ (มุสลิม) และจากอบุลญุฮัยม์ บินอัลหาริษ บินอัศศิมมะฮ์ อัลอันศอรีย์: ท่านรสูลุลลอฮ์ ﷺ มาจากทางบ่อญะมัล ชายคนหนึ่งพบท่านและให้สลาม ท่านไม่ตอบ จนกว่าท่านจะเดินไปที่กำแพง แล้วเช็ดหน้าและมือ แล้วจึงตอบสลาม (อัลบุคอรีย์ มุสลิม)", "หะดีษเหล่านี้บ่งว่าการรำลึกถึงอัลลอฮ์ในสภาพสะอาดประเสริฐกว่า และความกว้างของหะดีษในบทนี้บ่งว่าทำได้โดยไม่มีความสะอาด"]}], "tags_th": ["ซิกิร", "ความสะอาด", "ญะนาบะฮ์", "ตอบสลาม", "ตะอ์ลีก"]}, {"id": "v1-h079", "volume": 1, "bab": "nawaqid", "topic_ar": "خروج الدم من غير السبيلين لا ينقض الوضوء", "topic_th": "เลือดที่ออกจากทางอื่นนอกจากสองทวาร ไม่ทำให้วุฎูอ์เสีย", "pages": [344, 345], "hadith": [{"no": 79, "matn_ar": "عَنْ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللهُ عَنْهُ: أَنَّ النَّبِيَّ ﷺ احْتَجَمَ وَصَلَّى، وَلَمْ يَتَوَضَّأْ. أَخْرَجَهُ الدَّارَقُطْنِيُّ، وَلَيَّنَهُ.", "translation_th": "จากอะนัส บินมาลิก (ร.ฎ.) ว่า ท่านนบี ﷺ กรอกเลือด (ฮิญามะฮ์) แล้วละหมาด โดยไม่ได้อาบน้ำละหมาด บันทึกโดยอัดดารุกุฏนีย์ และเขาระบุว่าอ่อน", "grade_th": "ฎออีฟมาก (ผู้แต่งว่าอ่อนมาก)"}], "key_rulings_th": ["การกรอกเลือดไม่ทำให้วุฎูอ์เสีย ละหมาดหลังจากนั้นได้", "แม้หะดีษจะอ่อน แต่ได้รับการเสริมด้วยหลักเดิม คือความสะอาดยังคงอยู่ และหลักเดิมจะไม่ถูกยกเลิก นอกจากด้วยหลักฐานทางศาสนาที่บ่งถึงสิ่งที่ทำให้วุฎูอ์เสียอย่างแน่ชัด", "เลือดทุกชนิดที่ออกจากร่างกายทางอื่นนอกจากสองทวาร เช่น เลือดกำเดา เลือดจากฟัน และบาดแผล ไม่ทำให้วุฎูอ์เสีย ไม่ว่าน้อยหรือมาก", "อิบนุตัยมียะฮ์เห็นว่าทัศนะที่ชัดเจนกว่าคือไม่ทำให้วุฎูอ์เสีย แต่ส่งเสริมให้อาบน้ำละหมาด"], "vocab": [{"ar": "احْتَجَمَ", "th": "กรอกเลือดออกด้วยเครื่องกรอก (มิห์ญัม) คือเครื่องมือที่ใช้ดูดเลือดและรองรับเลือดที่กรอก"}, {"ar": "لَيَّنَهُ", "th": "ระบุว่าสายรายงานอ่อน (ลัยยิน) เพราะมีการวิจารณ์ผู้รายงานบางคน"}, {"ar": "اللَّيِّن", "th": "ผู้รายงานที่ถูกวิจารณ์เรื่องความจำ แต่ไม่ถึงขั้นทำให้หะดีษของเขาหลุดจากขอบเขตการใช้ประกอบ (อิอ์ติบาร)"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อัดดารุกุฏนีย์บันทึก (1/151) และผ่านทางเขา อัลบัยฮะกีย์ใน \"อัสสุนัน\" (1/141) และ \"อัลคิลาฟิยาต\" (2/318) ผ่านศอลิห์ บินมุกอติล จากบิดาของเขา จากสุลัยมาน บินดาวูด อบูอัยยูบ จากหุมัยด์ จากอะนัส", "อิบนุหะญัรว่าอัดดารุกุฏนีย์ \"ลัยยะนะฮู\" คือระบุว่าสายรายงานอ่อน เพราะมีการวิจารณ์ผู้รายงานบางคน คำว่า \"ลัยยิน\" คือผู้รายงานที่ถูกวิจารณ์เรื่องความจำ แต่ไม่ถึงขั้นทำให้หลุดจากขอบเขตการใช้ประกอบ และไม่ถึงขั้นกระทบความน่าเชื่อถือ อัดดารุกุฏนีย์อธิบายว่า \"ลัยยิน\" ไม่ใช่ผู้ที่ตกไปจนหะดีษถูกทิ้ง แต่ถูกวิจารณ์ในเรื่องที่ไม่ทำให้ความน่าเชื่อถือ (อะดาละฮ์) หมดไป", "ผู้แต่งเห็นว่าอิบนุหะญัรหมายถึงคำของอัดดารุกุฏนีย์ว่า \"ศอลิห์ บินมุกอติลไม่แข็งแรง\" ซึ่งอิบนุอับดิลฮาดีย์และอัซซัยละอีย์ยกมา แต่คำนี้ไม่พบใน \"สุนันอัดดารุกุฏนีย์\" ฉบับตีพิมพ์ ที่นั่นไม่มีคำวิจารณ์ใดหลังหะดีษนี้เลย ผู้แต่งพบในหนังสือ \"ตัครีจอัลอะหาดีษอัฎฎิอาฟ มิน สุนันอัดดารุกุฏนีย์\" ของอัลฆ็อสสานีย์ (เสียชีวิต ฮ.ศ. 682) ว่า \"สุลัยมาน บินดาวูดไม่แข็งแรง\" และในหนังสือของอัลมักดิซีย์ก็เช่นกัน ผู้แต่งจึงเห็นว่าฉบับตีพิมพ์อาจมีส่วนที่ตกหล่น หรือเป็นความต่างของต้นฉบับ หรืออยู่ในหนังสือเล่มอื่น", "ผู้แต่งตัดสินว่าหะดีษนี้อ่อนมาก อิบนุอับดิลฮาดีย์กล่าวว่า \"หะดีษอะนัสไม่ถูกต้อง สุลัยมาน บินดาวูดไม่เป็นที่รู้จัก ศอลิห์ บินมุกอติลไม่แข็งแรง ตามที่อัดดารุกุฏนีย์กล่าว และบิดาของเขาไม่เป็นที่รู้จัก\" อัซซัยละอีย์ก็กล่าวทำนองเดียวกัน"]}, {"wajh": 2, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"อิห์ตะญะมะ\" คือเอาเลือดออกด้วยมิห์ญัม (อ่านกัสเราะฮ์ที่มีม) คือเครื่องมือที่ใช้กรอกเลือดด้วยการดูด และภาชนะที่รองรับเลือดที่กรอกออกมา"]}, {"wajh": 3, "type": "fiqh", "heading_ar": null, "heading_th": "การกรอกเลือดและเลือดที่ออกจากร่างกาย", "points_th": ["หะดีษเป็นหลักฐานว่าการกรอกเลือดไม่ทำให้วุฎูอ์เสีย ละหมาดหลังจากนั้นได้ แม้หะดีษจะอ่อน แต่ได้รับการเสริมด้วยหลักเดิม คือความสะอาดยังคงอยู่ และหลักเดิมจะไม่ถูกยกเลิก นอกจากด้วยหลักฐานทางศาสนาที่บ่งถึงสิ่งที่ทำให้วุฎูอ์เสียอย่างแน่ชัด", "เลือดทุกชนิดที่ออกจากร่างกายทางอื่นนอกจากสองทวารก็ถือเช่นเดียวกัน เช่น เลือดกำเดา เลือดจากฟัน และบาดแผล ไม่ว่าน้อยหรือมาก", "อิบนุตัยมียะฮ์กล่าวว่า นักวิชาการขัดแย้งเรื่องนะญิสที่ออกจากทางอื่นนอกจากสองทวาร เช่น บาดแผล การผ่าเส้นเลือด การกรอกเลือด เลือดกำเดา และการอาเจียน มัซฮับมาลิกและอัชชาฟิอีย์ว่าไม่ทำให้วุฎูอ์เสีย มัซฮับอบูหะนีฟะฮ์และอะห์มัดว่าทำให้เสีย แต่อะห์มัดว่าเมื่อออกมาก แล้วอิบนุตัยมียะฮ์กล่าวว่า \"ทัศนะที่ชัดเจนกว่าในทุกประเภทนี้คือไม่ทำให้วุฎูอ์เสีย แต่ส่งเสริมให้อาบน้ำละหมาดจากสิ่งเหล่านี้ ผู้ใดละหมาดโดยไม่อาบน้ำละหมาด ละหมาดของเขาใช้ได้ และผู้ใดอาบน้ำละหมาด ก็ประเสริฐกว่า\"", "ส่วนเรื่องเลือดเป็นนะญิสหรือไม่ ได้กล่าวไปแล้วในบทการขจัดนะญิส ที่หะดีษที่สามสิบ"]}], "tags_th": ["การกรอกเลือด", "เลือด", "สิ่งที่ทำให้วุฎูอ์เสีย", "หลักเดิม", "อิบนุตัยมียะฮ์"]}, {"id": "v1-h080", "volume": 1, "bab": "nawaqid", "topic_ar": "ما جاء في أن النوم مظنة نقض الوضوء", "topic_th": "การนอนหลับเป็นภาวะที่คาดว่าวุฎูอ์เสีย", "pages": [346, 349], "hadith": [{"no": 80, "matn_ar": "عَنْ مُعَاوِيَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «الْعَيْنُ وِكَاءُ السَّهِ، فَإِذَا نَامَتِ الْعَيْنَانِ اسْتَطْلَقَ الْوِكَاءُ». رَوَاهُ أَحْمَدُ، وَالطَّبَرَانِيُّ وَزَادَ: «وَمَنْ نَامَ فَلْيَتَوَضَّأْ»، وَهَذِهِ الزِّيَادَةُ فِي هَذَا الْحَدِيثِ عِنْدَ أَبِي دَاوُدَ مِنْ حَدِيثِ عَلِيٍّ دُونَ قَوْلِهِ: «اسْتَطْلَقَ الْوِكَاءُ»، وَفِي كِلَا الْإِسْنَادَيْنِ ضَعْفٌ.", "translation_th": "จากมุอาวิยะฮ์ (ร.ฎ.) กล่าวว่า ท่านรสูลุลลอฮ์ ﷺ กล่าวว่า \"ดวงตาคือเชือกผูกทวารหนัก เมื่อดวงตาทั้งสองหลับ เชือกผูกก็หลุด\" รายงานโดยอะห์มัด และอัฏเฏาะบะรอนีย์ ซึ่งเพิ่มว่า \"และผู้ใดนอนหลับ ก็จงอาบน้ำละหมาด\" ส่วนเพิ่มนี้มีในหะดีษของอะลีที่อบูดาวูดบันทึก โดยไม่มีคำว่า \"เชือกผูกก็หลุด\" และทั้งสองสายรายงานมีความอ่อน", "grade_th": "สายมุอาวิยะฮ์อ่อน ส่วนหะดีษอะลีเป็นหะซัน (อัลอัลบานีย์ว่าหะซัน) และทั้งสองหะดีษเสริมกัน"}], "key_rulings_th": ["การนอนหลับไม่ได้ทำให้วุฎูอ์เสียในตัวเอง แต่เป็นภาวะที่คาดว่ามีสิ่งที่ทำให้วุฎูอ์เสียออกมา (มะซินนะฮ์)", "เพราะเมื่อหลับ คนเราควบคุมตนเองไม่ได้ และไม่รู้สึกถึงสิ่งที่ออกมา จึงต้องอาบน้ำละหมาด", "ส่วนคนที่ตื่นอยู่ ระวังตัวได้และรู้ว่ามีอะไรออกมา", "ความตื่นเปรียบเหมือนเชือกผูกปากถุงหนังที่กันน้ำไม่ให้ไหลออก"], "vocab": [{"ar": "الْعَيْنُ", "th": "ดวงตา หมายถึงชนิด คือดวงตาทั้งสองของทุกคน และในที่นี้หมายถึงความตื่น"}, {"ar": "الْوِكَاءُ", "th": "เชือกที่ใช้ผูกปากห่อ ถุง หรือถุงหนังใส่น้ำ"}, {"ar": "السَّهُ", "th": "ทวารหนัก (วงรอบทวาร)"}, {"ar": "اسْتَطْلَقَ", "th": "หลุด คลายออก"}], "sections": [{"wajh": 1, "type": "rawi", "heading_ar": "في ترجمة الراوي", "heading_th": "ชีวประวัติผู้รายงาน", "points_th": ["คืออบูอับดิรเราะห์มาน มุอาวิยะฮ์ บินอบีสุฟยาน (ชื่ออบูสุฟยานคือ ศ็อครฺ บินหัรบ์ บินอุมัยยะฮ์) อัลกุร็อชีย์ อัลอุมะวีย์ เกิดก่อนการเป็นนบีราวห้าปีตามทัศนะที่มีน้ำหนักกว่า เขาและบิดาเป็นผู้รับอิสลามตอนพิชิตมักกะฮ์ แล้วเป็นหนึ่งในผู้ที่ได้รับการโน้มน้าวใจ (มุอัลละฟะฮ์ กุลูบุฮุม) มีทัศนะว่าเขารับอิสลามก่อนบิดาในช่วงอุมเราะฮ์อัลเกาะฎออ์ แต่ไม่กล้าไปหาท่านนบี ﷺ เพราะกลัวบิดา", "มีทัศนะว่าเขาเป็นหนึ่งในผู้บันทึกวะห์ยู อัษษะฮะบีย์กล่าวว่า เขาเขียนจดหมายให้ท่านนบี ﷺ ระหว่างท่านกับชาวอาหรับ มีรายงานว่ามีคนกล่าวกับอิบนุอับบาสเรื่องมุอาวิยะฮ์ละหมาดวิตรเพียงร็อกอะฮ์เดียว อิบนุอับบาสตอบว่า \"เขาเป็นผู้มีความรู้ทางศาสนา (ฟะกีฮ์)\" (อัลบุคอรีย์) คือเขาทำโดยมีหลักฐาน", "เขาปกครองชาม (ซีเรีย) ต่อจากพี่ชายคือยะซีดในสมัยอุมัร (ร.ฎ.) จนเสียชีวิต รวมราวสี่สิบปี อิบนุตัยมียะฮ์กล่าวว่า \"ไม่มีกษัตริย์มุสลิมคนใดดีกว่ามุอาวิยะฮ์ และในสมัยของกษัตริย์องค์ใด ผู้คนก็ไม่ดีกว่าผู้คนในสมัยของมุอาวิยะฮ์ เมื่อเทียบกับยุคหลังจากเขา แต่ถ้าเทียบกับยุคของอบูบักรและอุมัร ความต่างก็ปรากฏชัด\" เขาเสียชีวิตเดือนเราะญับ ฮ.ศ. 60 ที่ดิมัชก์"]}, {"wajh": 2, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อะห์มัดบันทึก (28/92) และอัฏเฏาะบะรอนีย์ใน \"อัลกะบีร\" (19/372 หมายเลข 875) พร้อมส่วนเพิ่ม ทั้งสองผ่านอบูบักร บินอบีมัรยัม จากอะฏิยยะฮ์ บินเกาะยส์ อัลกิลาบีย์ จากมุอาวิยะฮ์ สายนี้อ่อน เพราะอบูบักร บินอบีมัรยัมอ่อน อิบนุหะญัรกล่าวใน \"อัตตักรีบ\" ว่า \"อ่อน บ้านของเขาถูกขโมย แล้วความจำก็สับสน\"", "ส่วนเพิ่ม \"ผู้ใดนอนหลับ ก็จงอาบน้ำละหมาด\" มีในหะดีษอะลีที่อบูดาวูดบันทึก (203) หมวดความสะอาด บทการอาบน้ำละหมาดเพราะการนอน และอะห์มัด (2/227) ผ่านบะกียะฮ์ บินอัลวะลีด จากอัลวะฎีน บินอะฏออ์ จากมะห์ฟูซ บินอัลเกาะมะฮ์ จากอับดุรเราะห์มาน บินอาอิซ จากอะลี ด้วยสำนวน \"เชือกผูกทวารคือดวงตาทั้งสอง ผู้ใดนอนหลับ ก็จงอาบน้ำละหมาด\"", "อิบนุหะญัรว่าสายนี้อ่อน เพราะมีสามจุด (1) บะกียะฮ์เป็นมุดัลลิสแบบตัสวิยะฮ์ ซึ่งร้ายแรงที่สุด ต้องระบุชัดว่าได้ยินในทุกชั้นของสาย (2) อัลวะฎีน บินอะฏออ์มีความขัดแย้งเรื่องเขา อิบนุหะญัรว่า \"ศอดูก (ซื่อสัตย์) แต่ความจำไม่ดี\" (3) อับดุรเราะห์มาน บินอาอิซรายงานจากอะลีแบบมุรสัล อบูหาติมว่าทั้งสองหะดีษ \"ไม่แข็งแรง\" และอะห์มัดว่า \"หะดีษอะลีมั่นคงกว่าหะดีษมุอาวิยะฮ์ในบทนี้\"", "ผู้แต่งตอบทั้งสามจุด: (1) บะกียะฮ์ระบุชัดว่าได้ยินในรายงานของอะห์มัดและคนอื่น แต่เพราะเป็นตัสวิยะฮ์ ผู้ที่อยู่เหนือเขาก็ต้องระบุชัดเช่นกัน (2) อัลวะฎีน อะห์มัดว่า \"ไม่มีปัญหา\" อิบนุมะอีนว่าเชื่อถือได้ในรายงานหนึ่ง อบูดาวูดว่า \"หะดีษพอใช้\" อิบนุชาฮีนว่าเชื่อถือได้ และอบูหาติมว่า \"มีทั้งที่รู้จักและที่แปลก\" ผู้แต่งเห็นว่าคนสภาพนี้ หะดีษของเขาไม่ต่ำกว่าระดับหะซัน (3) เรื่องสายขาด อบูซุรอะฮ์และอบูหาติมว่าอิบนุอาอิซไม่ได้ยินจากอะลี แต่อิบนุหะญัรเองแย้งอบูซุรอะฮ์ว่า \"การปฏิเสธนี้ยังต้องพิจารณา เพราะเขารายงานจากอุมัร ตามที่อัลบุคอรีย์ยืนยัน\"", "อิบนุศศ็อลาห์ อันนะวะวีย์ และอัลมุนซิรีย์ว่าหะดีษอะลีหะซัน อัลอัลบานีย์ก็ว่าหะซัน และเชคอับดุลอะซีซ บินบาซกล่าวว่า \"สองหะดีษนี้เสริมกัน\""]}, {"wajh": 3, "type": "alfaz", "heading_ar": "في شرح ألفاظه", "heading_th": "อธิบายถ้อยคำ", "points_th": ["\"ดวงตา\" หมายถึงชนิด คือดวงตาทั้งสองของทุกคน และในที่นี้หมายถึงความตื่น", "\"วิกาอ์\" (อ่านกัสเราะฮ์ที่วาว) คือเชือกที่ใช้ผูกห่อ ถุง หรือถุงหนังใส่น้ำ", "\"อัสสะฮ์\" (อ่านฟัตหะฮ์ที่สีน) คือวงรอบทวารหนัก เป็นการเปรียบเทียบ ความหมายคือ ความตื่นรักษาทวารไว้ และกันไม่ให้สิ่งที่ออกจากทวาร คือลม ออกมา เหมือนเชือกผูกรักษาน้ำไว้ในถุงหนัง และกันไม่ให้ไหลออก"]}, {"wajh": 4, "type": "fiqh", "heading_ar": null, "heading_th": "การนอนหลับเป็นภาวะที่คาดว่าวุฎูอ์เสีย", "points_th": ["สองหะดีษนี้บ่งว่าการนอนหลับไม่ได้ทำให้วุฎูอ์เสียในตัวเอง แต่เป็นภาวะที่คาดว่ามีสิ่งที่ทำให้วุฎูอ์เสีย เพราะเมื่อหลับ คนเราควบคุมตนเองไม่ได้ และไม่รู้สึกถึงสิ่งที่ออกมา เมื่อเป็นเช่นนั้นก็ให้อาบน้ำละหมาดเพราะเขาหลับ ส่วนคนที่ตื่นอยู่ ระวังตัวได้และรู้ว่ามีอะไรออกมา"]}], "tags_th": ["การนอนหลับ", "สิ่งที่ทำให้วุฎูอ์เสีย", "มุอาวิยะฮ์", "ตัดลีส ตัสวิยะฮ์", "หะซัน"]}, {"id": "v1-h081", "volume": 1, "bab": "nawaqid", "topic_ar": "ما جاء في أن نوم المضطجع ينقض الوضوء", "topic_th": "การนอนหลับในท่านอนตะแคงทำให้วุฎูอ์เสีย", "pages": [350, 351], "hadith": [{"no": 81, "matn_ar": "وَلِأَبِي دَاوُدَ أَيْضًا، عَنِ ابْنِ عَبَّاسٍ مَرْفُوعًا: «إِنَّمَا الْوُضُوءُ عَلَى مَنْ نَامَ مُضْطَجِعًا». وَفِي إِسْنَادِهِ ضَعْفٌ أَيْضًا.", "translation_th": "และของอบูดาวูดอีกเช่นกัน จากอิบนุอับบาส แบบมัรฟูอ์ (ถึงท่านนบี ﷺ) ว่า \"การอาบน้ำละหมาดนั้นจำเป็นเฉพาะผู้ที่นอนหลับในท่านอนตะแคงเท่านั้น\" และในสายรายงานก็มีความอ่อนเช่นกัน", "grade_th": "ฎออีฟ (มุนกัร) นักวิชาการหะดีษเกือบเป็นเอกฉันท์ว่าอ่อน"}], "key_rulings_th": ["หะดีษนี้อ่อนทั้งสายรายงานและเนื้อความ จึงใช้เป็นหลักฐานไม่ได้", "เนื้อความใช้ไม่ได้ทั้งสองทาง: ไม่ใช่ทุกคนที่นอนตะแคงต้องเสียวุฎูอ์ และไม่ใช่ทุกคนที่หลับในท่าอื่นวุฎูอ์ไม่เสีย", "ทัศนะที่ถูกต้องตามที่ผู้แต่งอธิบายในหะดีษอะนัส (หะดีษแรกของบท) คือ การนอนหลับที่ทำให้วุฎูอ์เสียคือการหลับลึกเท่านั้น ไม่ว่าในท่าใด", "การหลับที่ไม่ลึกไม่ทำให้วุฎูอ์เสียในทุกท่า ส่วนการหลับลึกทำให้เสีย แม้ไม่ได้นอนตะแคง"], "vocab": [{"ar": "مُضْطَجِعًا", "th": "นอนตะแคง วางสีข้างลงบนพื้น"}, {"ar": "مَرْفُوعًا", "th": "มัรฟูอ์ คือรายงานถึงท่านนบี ﷺ"}, {"ar": "الْمُسْتَغْرِق", "th": "ผู้ที่หลับลึก ไม่รู้สึกตัวเมื่อมีฮะดัษ"}], "sections": [{"wajh": 1, "type": "takhrij", "heading_ar": "في تخريجه", "heading_th": "ที่มาของหะดีษ", "points_th": ["อบูดาวูดบันทึก (202) หมวดความสะอาด บทการอาบน้ำละหมาดเพราะการนอน ผ่านอบูคอลิด อัดดาลานีย์ จากเกาะตาดะฮ์ จากอบุลอาลิยะฮ์ จากอิบนุอับบาสว่า ท่านรสูลุลลอฮ์ ﷺ สุญูดแล้วหลับจนกรน แล้วลุกขึ้นละหมาดโดยไม
